layout: figure
id: quantization-flow
caption: GLM 双机决定每层精度的两道门：上段为第一道门（glm5_next.py 建层是否传入 quant_config），KDA 九投影、索引器 K/打分投影与嵌入表不传量化配置保持 BF16，MoE router GateLinear 写死按 FP32 建权重与算分，均不查描述文件；下段为第二道门，接了量化配置的层按前缀查 quant_model_description.json，分流为 FLOAT 未量化 BF16、W8A8_DYNAMIC Linear（稠密 MLP、共享专家及 3121f187 主 MLA 四投影）与 W8A8_DYNAMIC FusedMoE（路由专家）三路。
size: [888, 436]
