<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 390" width="760" height="390" role="img" aria-label="每个外框是一批计算。上面把长文章一次放入；下面把它分到几批，每批也继续已有的回答。箭头表示计算先后，框的宽度不表示耗时。处理后段时沿用前段保存的信息，全部输入处理完才开始回答长文章的提问。">
  <title>每个外框是一批计算。上面把长文章一次放入；下面把它分到几批，每批也继续已有的回答。箭头表示计算先后，框的宽度不表示耗时。处理后段时沿用前段保存的信息，全部输入处理完才开始回答长文章的提问。</title>
  <defs><marker id="chunked-prefill-intuition-v2-ah-control" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="var(--color-control, #66716d)"/></marker></defs>
  <rect x="24" y="60" width="712" height="90" rx="16" fill="none" stroke="var(--color-line-strong, #b8bcb5)" stroke-width="1.5"/>
  <text x="40" y="48" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="15" font-weight="700" fill="var(--color-ink, #17211f)">不分块：整篇文章放在同一批</text>
  <rect x="24" y="222" width="216" height="102" rx="16" fill="none" stroke="var(--color-line-strong, #b8bcb5)" stroke-width="1.5"/>
  <text x="40" y="210" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="15" font-weight="700" fill="var(--color-ink, #17211f)">先算一批</text>
  <rect x="272" y="222" width="216" height="102" rx="16" fill="none" stroke="var(--color-line-strong, #b8bcb5)" stroke-width="1.5"/>
  <text x="288" y="210" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="15" font-weight="700" fill="var(--color-ink, #17211f)">再算一批</text>
  <rect x="520" y="222" width="216" height="102" rx="16" fill="none" stroke="var(--color-line-strong, #b8bcb5)" stroke-width="1.5"/>
  <text x="536" y="210" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="15" font-weight="700" fill="var(--color-ink, #17211f)">最后一批</text>
  <path d="M240 296 L272 296" fill="none" stroke="var(--color-control, #66716d)" stroke-width="1.4" marker-end="url(#chunked-prefill-intuition-v2-ah-control)"/>
  <path d="M488 296 L520 296" fill="none" stroke="var(--color-control, #66716d)" stroke-width="1.4" marker-end="url(#chunked-prefill-intuition-v2-ah-control)"/>
  <rect x="40" y="82" width="232" height="46" rx="8" fill="var(--color-token, #087f73)" stroke="var(--color-ink, #17211f)" stroke-width="1.5"/>
  <text x="156" y="110" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="14" font-weight="700" fill="var(--color-ink-inverse, #ffffff)" text-anchor="middle">已有回答继续生成</text>
  <rect x="292" y="82" width="428" height="46" rx="8" fill="var(--color-control, #66716d)" stroke="var(--color-ink, #17211f)" stroke-width="1.5"/>
  <text x="506" y="110" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="14" font-weight="700" fill="var(--color-ink-inverse, #ffffff)" text-anchor="middle">处理整篇长文章</text>
  <rect x="40" y="234" width="184" height="32" rx="8" fill="var(--color-token, #087f73)" stroke="var(--color-ink, #17211f)" stroke-width="1.5"/>
  <text x="132" y="255" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="14" font-weight="700" fill="var(--color-ink-inverse, #ffffff)" text-anchor="middle">已有回答继续生成</text>
  <rect x="40" y="280" width="184" height="32" rx="8" fill="var(--color-control, #66716d)" stroke="var(--color-ink, #17211f)" stroke-width="1.5"/>
  <text x="132" y="301" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="14" font-weight="700" fill="var(--color-ink-inverse, #ffffff)" text-anchor="middle">处理文章开头</text>
  <rect x="288" y="234" width="184" height="32" rx="8" fill="var(--color-token, #087f73)" stroke="var(--color-ink, #17211f)" stroke-width="1.5"/>
  <text x="380" y="255" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="14" font-weight="700" fill="var(--color-ink-inverse, #ffffff)" text-anchor="middle">已有回答继续生成</text>
  <rect x="288" y="280" width="184" height="32" rx="8" fill="var(--color-control, #66716d)" stroke="var(--color-ink, #17211f)" stroke-width="1.5"/>
  <text x="380" y="301" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="14" font-weight="700" fill="var(--color-ink-inverse, #ffffff)" text-anchor="middle">接着处理文章中段</text>
  <rect x="536" y="234" width="184" height="32" rx="8" fill="var(--color-token, #087f73)" stroke="var(--color-ink, #17211f)" stroke-width="1.5"/>
  <text x="628" y="255" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="14" font-weight="700" fill="var(--color-ink-inverse, #ffffff)" text-anchor="middle">已有回答继续生成</text>
  <rect x="536" y="280" width="184" height="32" rx="8" fill="var(--color-control, #66716d)" stroke="var(--color-ink, #17211f)" stroke-width="1.5"/>
  <text x="628" y="301" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="14" font-weight="700" fill="var(--color-ink-inverse, #ffffff)" text-anchor="middle">处理剩下的文章</text>
  <text x="24" y="24" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="13.5" font-weight="700" fill="var(--color-ink, #17211f)">不同请求的工作，可以放在同一批计算</text>
  <text x="24" y="186" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="13.5" font-weight="700" fill="var(--color-ink, #17211f)">分块：分几批处理长文章，已有回答在每批里继续生成</text>
  <text x="24" y="360" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="13.5" font-weight="400" fill="var(--color-ink, #17211f)">各段沿用已保存的信息；最后一段结束，才开始回答长文章的提问</text>
</svg>
