layout: figure
id: chunked-prefill-v3-compare
caption: 示意对比：A、B 已在逐字生成（每步各 1 个位置），新请求 C 带着 14 个位置的提示词到达。上方不分块时，同一步要硬算 16 个位置，A、B 被迫陪等整步结束；下方把每步位置预算封在 8 个，C 按 6、6、2 分三步读完提示词、跨步沿用已存历史，前两步采样丢弃、第 3 步末才选出首个输出 y₀，而 A、B 四步里一步未停。
