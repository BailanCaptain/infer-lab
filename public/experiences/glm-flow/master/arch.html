<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>GLM-5.3-Flash 二维架构图</title>
<link rel="stylesheet" href="../../reader-palette.css">
<link rel="stylesheet" href="../../typography.css">
<link rel="stylesheet" href="../../reader-theme.css">
<script>
if (
  new URLSearchParams(location.search).get("site") === "1" ||
  window.frameElement?.classList.contains("experience-frame")
) {
  document.documentElement.dataset.site = "true";
}
</script>
<style>
/* Restrained scholarly stylesheet: all colors read from ../../reader-palette.css */
html[data-site] {
  --arch-surface: var(--reader-paper);
  --arch-sunken: var(--reader-sidebar);
  --arch-line: var(--reader-line);
  --arch-line-strong: var(--line2);
}
* { box-sizing: border-box; }
html, body {
  margin: 0;
  background: var(--arch-bg);
  color: var(--arch-ink);
  font-family: var(--journey-font-sans);
  -webkit-font-smoothing: antialiased;
}
#shell {
  max-width: 1580px;
  margin: 0 auto;
  padding: 16px 20px 84px;
}
/* Clean Academic Spec Header */
.arch-header {
  background: var(--arch-surface);
  border: 1px solid var(--arch-line);
  border-radius: 12px;
  padding: 16px 20px 14px;
  margin-bottom: 14px;
}
.arch-top-row {
  display: flex;
  justify-content: space-between;
  align-items: flex-start;
  gap: 16px;
  flex-wrap: wrap;
}
.arch-title-group h1 {
  margin: 0;
  font-size: 21px;
  font-weight: 750;
  letter-spacing: -0.02em;
  color: var(--arch-ink);
  line-height: 1.3;
}
.arch-title-group p {
  margin: 4px 0 0;
  font-size: 13px;
  line-height: 1.55;
  color: var(--arch-muted);
}
.arch-controls {
  display: flex;
  align-items: center;
  gap: 6px;
  flex-wrap: wrap;
}
#views {
  display: flex;
  align-items: center;
  gap: 6px;
  font-size: 13px;
  color: var(--arch-muted);
}
html[data-site] #views {
  display: none;
}
#views a, .zoom-btn, .jump-btn {
  display: inline-flex;
  align-items: center;
  gap: 4px;
  padding: 4px 10px;
  border: 1px solid var(--arch-line-strong);
  border-radius: 7px;
  background: var(--arch-surface);
  color: var(--arch-ink-2);
  font-family: var(--journey-font-sans);
  font-size: 12.2px;
  font-weight: 600;
  text-decoration: none;
  cursor: pointer;
}
#views a:hover, .zoom-btn:hover, .jump-btn:hover {
  border-color: var(--arch-ink);
  background: var(--arch-header-bg);
  color: var(--arch-ink);
}
.zoom-btn.active, .jump-btn.active {
  background: var(--arch-ink);
  border-color: var(--arch-ink);
  color: var(--arch-surface);
}
.arch-metrics {
  display: grid;
  grid-template-columns: repeat(6, minmax(0, 1fr));
  gap: 8px;
  margin-top: 12px;
}
@media (max-width: 1360px) {
  .arch-metrics {
    grid-template-columns: repeat(3, minmax(0, 1fr));
  }
}
@media (max-width: 720px) {
  .arch-metrics {
    grid-template-columns: repeat(2, minmax(0, 1fr));
  }
}
.metric-chip {
  background: var(--arch-header-bg);
  border: 1px solid var(--arch-line);
  border-radius: 8px;
  padding: 7px 11px;
  display: flex;
  flex-direction: column;
  gap: 2px;
}
.metric-chip .k {
  font-size: 11.2px;
  color: var(--arch-muted);
  font-weight: 600;
}
.metric-chip .v {
  font-family: var(--journey-font-mono);
  font-size: 12.4px;
  letter-spacing: -0.02em;
  font-weight: 700;
  color: var(--arch-ink);
  font-variant-numeric: tabular-nums;
}
.metric-chip .s {
  font-size: 11.1px;
  color: var(--arch-ink-2);
  text-wrap: pretty;
}
.arch-bar-row {
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: 12px;
  flex-wrap: wrap;
  margin-top: 12px;
  padding-top: 10px;
  border-top: 1px solid var(--arch-line);
}
.arch-legend {
  display: flex;
  align-items: center;
  gap: 8px 13px;
  flex-wrap: wrap;
  font-size: 12.1px;
  color: var(--arch-ink-2);
}
.lg-item {
  display: inline-flex;
  align-items: center;
  gap: 5px;
  white-space: nowrap;
}
.lg-card {
  width: 13px;
  height: 11px;
  border-radius: 2.5px;
  border: 1.1px solid var(--lg-mid);
  background: var(--lg-soft);
  flex: none;
}
.lg-pill {
  width: 14px;
  height: 10px;
  border-radius: 2.5px;
  background: var(--arch-surface);
  border: 1.1px solid var(--arch-line-strong);
  flex: none;
}
.lg-cache {
  width: 14px;
  height: 11px;
  border-radius: 2.5px;
  background: var(--arch-cache-soft);
  border: 1.1px dashed var(--arch-cache);
  flex: none;
}
.arch-jumps {
  display: flex;
  align-items: center;
  gap: 6px;
  flex-wrap: wrap;
}
/* Diagram stage */
#page {
  position: relative;
  overflow-x: auto;
  border-radius: 12px;
}
#page svg {
  display: block;
  width: 100%;
  max-width: 1540px;
  height: auto;
  margin: 0 auto;
}
#page.zoom-actual svg {
  width: 1520px;
  max-width: none;
}
#page.zoom-large svg {
  width: 1860px;
  max-width: none;
}
/* Protect SVG boxes from reader-theme.css HTML .box rules */
svg .box {
  min-height: 0 !important;
  height: auto !important;
  padding: 0 !important;
  font-size: initial !important;
  cursor: pointer;
}
svg .box:hover > rect.card-ring,
svg .box:hover > circle.card-ring {
  stroke: var(--arch-highlight);
  stroke-width: 1.9;
}
svg .box.selected > rect.card-ring,
svg .box.selected > circle.card-ring {
  stroke: var(--arch-highlight);
  stroke-width: 2.2;
}
svg .panel-frame {
  transition: stroke 0.2s, stroke-width 0.2s;
}
svg .panel-frame.flash {
  stroke: var(--arch-highlight);
  stroke-width: 2.2;
}
svg text {
  font-family: var(--journey-font-sans);
  user-select: text;
}
svg text.mono {
  font-family: var(--journey-font-mono);
  font-variant-numeric: tabular-nums;
}
/* Clean Bottom Inspector Bar */
#inspector {
  position: fixed;
  left: 20px;
  right: 20px;
  bottom: 12px;
  max-width: 1540px;
  margin: 0 auto;
  background: color-mix(in srgb, var(--arch-surface) 95%, transparent);
  backdrop-filter: blur(8px);
  border: 1px solid var(--arch-line-strong);
  border-radius: 10px;
  padding: 8.5px 15px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 14px;
  flex-wrap: wrap;
  box-shadow: 0 4px 16px color-mix(in srgb, var(--arch-ink) 7%, transparent);
  z-index: 5;
  font-size: 12.8px;
}
html[data-site] #inspector {
  right: 136px;
}
#inspector .ins-main {
  display: flex;
  align-items: baseline;
  gap: 10px;
  flex-wrap: wrap;
  min-width: 0;
}
#inspector .ins-badge {
  font-family: var(--journey-font-mono);
  font-size: 11.3px;
  font-weight: 700;
  padding: 1.5px 7px;
  border-radius: 5px;
  background: var(--arch-sunken);
  color: var(--arch-ink);
  border: 1px solid var(--arch-line);
}
#inspector .ins-title {
  font-weight: 750;
  color: var(--arch-ink);
}
#inspector .ins-shape {
  font-family: var(--journey-font-mono);
  font-size: 11.8px;
  color: var(--arch-ink-2);
  font-weight: 600;
}
#inspector .ins-detail {
  color: var(--arch-ink-2);
  font-size: 12.4px;
}
#inspector .ins-src {
  font-family: var(--journey-font-mono);
  font-size: 11.2px;
  color: var(--arch-muted);
  white-space: nowrap;
}
@media (max-width: 900px) {
  #shell { padding: 12px 10px 96px; }
  #page svg { width: 1360px; max-width: none; }
}
@media (max-width: 720px) {
  #shell { padding: 10px 10px 116px; }
  .arch-header { padding: 11px 12px 9px; margin-bottom: 10px; }
  .arch-top-row { gap: 8px; }
  .arch-title-group h1 { font-size: 17.5px; line-height: 1.25; }
  .arch-title-group p { font-size: 11.8px; line-height: 1.4; margin-top: 3px; }
  .arch-metrics { gap: 5px; margin-top: 8px; }
  .metric-chip { padding: 5px 8px; gap: 1px; }
  .metric-chip .k, .metric-chip .s { font-size: 10.5px; line-height: 1.25; }
  .metric-chip .v { font-size: 11.6px; }
  .arch-bar-row { margin-top: 8px; padding-top: 7px; gap: 6px; }
  #inspector:not(.has-selection) { display: none; }
  #inspector, html[data-site] #inspector { left: 10px; right: 10px; bottom: 64px; padding: 8px 12px; gap: 6px; font-size: 12px; }
}
</style>
</head>
<body>
<div id="shell">
  <header class="arch-header">
    <div class="arch-top-row">
      <div class="arch-title-group">
        <h1>GLM-5.3-Flash 语言主干与 MTP 二维架构图谱</h1>
        <p id="arch-sub">正在根据官方 config.json 与真源规格构建向量图谱…</p>
      </div>
      <div class="arch-controls">
        <div id="views" aria-label="三维视图切换">
          <span>3D 视图：</span>
          <a href="model.html">整个模型</a>
          <a href="flow.html?layer=0">L00</a>
          <a href="flow.html?layer=3">L03</a>
          <a href="flow.html?layer=4">L04</a>
        </div>
        <button type="button" class="zoom-btn active" data-zoom="fit">适应窗口</button>
        <button type="button" class="zoom-btn" data-zoom="actual">100%</button>
        <button type="button" class="zoom-btn" data-zoom="large">125%</button>
      </div>
    </div>
    <div class="arch-metrics" id="arch-metrics"></div>
    <div class="arch-bar-row">
      <div class="arch-legend" id="arch-legend"></div>
      <nav class="arch-jumps" aria-label="子图快速定位">
        <button type="button" class="jump-btn" data-jump="panel-a">(a) 主干</button>
        <button type="button" class="jump-btn" data-jump="panel-b">(b) 45层排布</button>
        <button type="button" class="jump-btn" data-jump="panel-c">(c) mHC残差</button>
        <button type="button" class="jump-btn" data-jump="panel-d">(d) MTP层</button>
        <button type="button" class="jump-btn" data-jump="panel-e">(e) KDA注意力</button>
        <button type="button" class="jump-btn" data-jump="panel-f">(f) 稀疏MLA+索引器</button>
        <button type="button" class="jump-btn" data-jump="panel-g">(g) 稠密与MoE</button>
      </nav>
    </div>
  </header>

  <div id="page"></div>
  <script>
  {
    const p = document.getElementById('page');
    const m = p.clientWidth > 0 && p.clientWidth < 1260 ? 'actual' : 'fit';
    if (m === 'actual') p.classList.add('zoom-actual');
    for (const b of document.querySelectorAll('.zoom-btn')) b.classList.toggle('active', b.dataset.zoom === m);
  }
  </script>
</div>

<aside id="inspector" aria-live="polite">
  <div class="ins-main">
    <span class="ins-badge" id="ins-badge">图谱导览</span>
    <span class="ins-title" id="ins-title">悬停或点击图中任意模块查看精确形状、算式与源码锚点</span>
    <span class="ins-shape" id="ins-shape"></span>
    <span class="ins-detail" id="ins-detail">点击 (a) 主干中的子模块可直接定位至右侧展开子图</span>
  </div>
  <span class="ins-src" id="ins-src">modeling_glm5_next.py · vllm-glm5next</span>
</aside>

<script type="module">
import { layerSpec } from './truth-spec.js';
import { mix } from './flow-colors.js';

const fullCfg = await (await fetch('../reference/official-config.json')).json();
const tc = fullCfg.text_config;
const vc = fullCfg.vision_config;

// ---- Read all colors dynamically from ../../reader-palette.css (single source of truth) ----
const rootStyle = getComputedStyle(document.documentElement);
const tok = name => rootStyle.getPropertyValue(name).trim();

const T = {
  surface: tok('--arch-surface'),
  headerBg: tok('--arch-header-bg'),
  sunken: tok('--arch-sunken'),
  line: tok('--arch-line'),
  lineStrong: tok('--arch-line-strong'),
  ink: tok('--arch-ink'),
  ink2: tok('--arch-ink-2'),
  muted: tok('--arch-muted'),
  arrow: tok('--arch-arrow'),
};

const FAMILIES = ['neutral', 'embed', 'resid', 'norm', 'kda', 'attn', 'dense', 'router', 'expert', 'mtp', 'cache'];
const ARCH = Object.fromEntries(
  FAMILIES.map(k => [
    k,
    {
      strong: tok(`--arch-${k}`),
      mid: tok(`--arch-${k}-mid`),
      soft: tok(`--arch-${k}-soft`),
      wash: tok(`--arch-${k}-wash`),
      ink: tok(`--arch-${k}-ink`),
      ...(k === 'resid' ? { rail: tok('--arch-resid-rail') } : {}),
    },
  ])
);

const plateTone = comp => {
  const c = ARCH[comp] || ARCH.neutral;
  return {
    fill: c.wash,
    stroke: mix(c.mid, T.line, 0.35),
    label: c.ink,
  };
};

// ---- Single-source-of-truth architectural accounting from official-config.json & truth-spec.js ----
const V = tc.vocab_size;                       // 154,880
const C = tc.hidden_size;                      // 4,096
const S = tc.hc_mult;                          // 4
const MIX = (2 + S) * S;                       // 24
const SK = tc.hc_sinkhorn_iters;               // 20
const N = tc.num_hidden_layers;                // 45
const la = tc.linear_attn_config;
const KH = la.num_heads;                       // 64
const KD = la.head_dim;                        // 128
const KHD = KH * KD;                           // 8,192
const KCONV = la.short_conv_kernel_size;       // 4
const KCONV_WIN = KCONV - 1;                   // 3
const KCONV_CH = 3 * KHD;                      // 24,576
const KLB = la.gate_lower_bound;               // -5
const NH = tc.num_attention_heads;             // 64
const QR = tc.q_lora_rank;                     // 1,536
const KR = tc.kv_lora_rank;                    // 512
const QK = tc.qk_nope_head_dim + tc.qk_rope_head_dim; // 256 + 0 = 256
const VD = tc.v_head_dim;                      // 256
const ROPE = tc.qk_rope_head_dim;              // 0
const KV_COMP = (NH * (QK + VD)) / (KR + ROPE); // 64
const IH = tc.index_n_heads;                   // 32
const ID = tc.index_head_dim;                  // 128
const KP = tc.index_kpool;                     // 4
const TOPK = tc.index_topk;                    // 2,048
const TAIL = tc.index_kpool_always_select_tail ? KP - 1 : 0; // 3
const TOPW = TOPK + TAIL;                      // 2,051
const DEPLOY_CTX = 133120;                     // Deployment sequence context benchmark in wiki (33,280 * 4, tail = 0)
const DEPLOY_RATIO = DEPLOY_CTX / TOPK;        // 65 (exact: 2,048 / 133,120 = 1/65)
const I_DENSE = tc.intermediate_size;          // 12,288
const E_ROUTED = tc.n_routed_experts;          // 288
const K_EXP = tc.num_experts_per_tok;          // 8
const E_SHARED = tc.n_shared_experts;          // 1
const MI = tc.moe_intermediate_size;           // 2,048
const SI = MI * E_SHARED;                      // 2,048
const RS = tc.routed_scaling_factor;           // 2.5
const LIM = tc.swiglu_limit;                   // 10

const kinds = tc.layer_types.map((t, i) => [
  t === 'linear_attention' ? 'kda' : 'mla',
  tc.mlp_layer_types[i] === 'sparse' ? 'moe' : 'dense',
]);
const cntKda = kinds.filter(k => k[0] === 'kda').length;       // 34
const cntMla = kinds.filter(k => k[0] === 'mla').length;       // 11
const cntDense = kinds.filter(k => k[1] === 'dense').length;   // 3
const cntMoe = kinds.filter(k => k[1] === 'moe').length;       // 42
const cntKdaDense = kinds.filter(k => k[0] === 'kda' && k[1] === 'dense').length; // 3
const cntKdaMoe = kinds.filter(k => k[0] === 'kda' && k[1] === 'moe').length;     // 31

// Exact parameter counts via truth-spec.js
const specL0 = layerSpec(tc, 8, 0);   // KDA + Dense
const specL3 = layerSpec(tc, 8, 3);   // MLA + MoE
const specL4 = layerSpec(tc, 8, 4);   // KDA + MoE
const specMtp = layerSpec(tc, 8, N);  // MTP (MLA + MoE, single stream)

const layerParamsSum =
  cntKdaDense * specL0.params +
  cntKdaMoe * specL4.params +
  cntMla * specL3.params;
const embedParams = V * C;
const endsParams = 2 * embedParams + C;
const backboneParams = layerParamsSum + endsParams; // 313,326,811,966
const routedTotalParams = cntMoe * E_ROUTED * 3 * C * MI; // 304,405,807,104
const routedSharePct = ((routedTotalParams / backboneParams) * 100).toFixed(1); // 97.2
const activeRoutedParams = cntMoe * K_EXP * 3 * C * MI;
const activeNonRoutedAll = backboneParams - routedTotalParams;
const activeWithEmbedB = ((activeNonRoutedAll + activeRoutedParams) / 1e9).toFixed(1); // 17.4
const activeNoEmbedB = ((activeNonRoutedAll - embedParams + activeRoutedParams) / 1e9).toFixed(1); // 16.7
const denseMlpYi = ((3 * C * I_DENSE) / 1e8).toFixed(2); // 1.51 (亿)
const mtpParams = specMtp.params + 2 * C + 2 * C * C + C; // 7,432,592,416
const mtpActiveParams = mtpParams - (E_ROUTED - K_EXP) * 3 * C * MI; // ~0.386B
const mtpRoutedB = ((E_ROUTED * 3 * C * MI) / 1e9).toFixed(2); // 7.25
const mtpAllExpertsB = (((E_ROUTED + E_SHARED) * 3 * C * MI) / 1e9).toFixed(2); // 7.27

const fmt = n => Number(n).toLocaleString('en-US');
const esc = s => String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');

// ---- Populate Header Subtitle, KPI Metrics & Restrained Legend ----
document.getElementById('arch-sub').textContent =
  `源自官方 config.json、modeling_glm5_next.py 与 vllm-glm5next · 数据自上而下流动（与 3D 视图一致）· 另有 ${vc.depth} 层视觉编码器未在此展开`;

const metricsData = [
  {
    k: '主干总参数 (L00–L44 + 词表头尾)',
    v: `${(backboneParams / 1e9).toFixed(1)}B (${Math.round(backboneParams / 1e8)} 亿)`,
    s: `路由专家占 ${routedSharePct}% · 模型卡标称 320B`,
  },
  {
    k: '每 token 激活参数',
    v: `${activeWithEmbedB}B (不含 embedding ${activeNoEmbedB}B)`,
    s: `每层 ${E_ROUTED} 选 ${K_EXP} + ${E_SHARED} 共享 · 模型卡标称 18B`,
  },
  {
    k: '主干层数与投机草拟层',
    v: `${N} 层主干 + ${tc.num_nextn_predict_layers} 层 MTP`,
    s: `MTP 总参 ${(mtpParams / 1e9).toFixed(2)}B · 单步激活 ${(mtpActiveParams / 1e9).toFixed(2)}B`,
  },
  {
    k: '隐藏宽度与多路残差',
    v: `d = ${fmt(C)} · ${S} 路 mHC`,
    s: `每半层 ${MIX} 系数 · ${SK} 轮 Sinkhorn 归一`,
  },
  {
    k: '混合注意力与位置编码',
    v: `${cntKda} KDA + ${cntMla} 稀疏 MLA`,
    s: `全文本主干 NoPE (rope_dim = ${ROPE})`,
  },
  {
    k: '词表规模与最大上下文',
    v: `V = ${fmt(V)} · 1M 上下文`,
    s: `embed_tokens 与 lm_head 不共享权重`,
  },
];
document.getElementById('arch-metrics').innerHTML = metricsData
  .map(m => `<div class="metric-chip"><span class="k">${esc(m.k)}</span><span class="v">${esc(m.v)}</span><span class="s">${esc(m.s)}</span></div>`)
  .join('');

const legendKeys = [
  ['kda', 'KDA 线性注意力'],
  ['attn', '稀疏 MLA 与索引器'],
  ['expert', 'MoE 专家'],
  ['dense', '稠密前馈'],
  ['router', 'MoE 路由器'],
  ['resid', '残差与 mHC'],
  ['norm', '归一化层'],
  ['embed', '词表头尾'],
  ['mtp', 'MTP 投机层'],
];
document.getElementById('arch-legend').innerHTML =
  legendKeys
    .map(([k, label]) => {
      const c = ARCH[k];
      return `<span class="lg-item"><span class="lg-card" style="--lg-mid:${c.mid};--lg-soft:${c.soft}"></span>${esc(label)}</span>`;
    })
    .join('') +
  `<span class="lg-item"><span class="lg-pill"></span>无参算子</span>` +
  `<span class="lg-item"><span class="lg-cache"></span>常驻缓存</span>`;

// ---- SVG Drawing Primitives (Journal-Grade Matte Minimalist Style) ----
const nodeRegistry = new Map();
let nodeSeq = 0;

function registerMeta(meta, comp = null) {
  if (!meta) return '';
  const id = `n${++nodeSeq}`;
  nodeRegistry.set(id, { ...meta, comp: meta.comp || comp || '' });
  return ` data-nid="${id}"`;
}

function topBandPath(x, y, w, rx, h) {
  const r = Math.min(rx, h);
  return `M${x.toFixed(1)} ${(y + h).toFixed(1)} L${x.toFixed(1)} ${(y + r).toFixed(1)} Q${x.toFixed(1)} ${y.toFixed(1)} ${(x + r).toFixed(1)} ${y.toFixed(1)} L${(x + w - r).toFixed(1)} ${y.toFixed(1)} Q${(x + w).toFixed(1)} ${y.toFixed(1)} ${(x + w).toFixed(1)} ${(y + r).toFixed(1)} L${(x + w).toFixed(1)} ${(y + h).toFixed(1)} Z`;
}

function smoothOrtho(pts, r = 6) {
  if (pts.length < 2) return '';
  if (pts.length === 2) return `M${pts[0][0]} ${pts[0][1]} L${pts[1][0]} ${pts[1][1]}`;
  let d = `M${pts[0][0]} ${pts[0][1]}`;
  for (let i = 1; i < pts.length - 1; i++) {
    const [x0, y0] = pts[i - 1];
    const [x1, y1] = pts[i];
    const [x2, y2] = pts[i + 1];
    const dx1 = x1 - x0, dy1 = y1 - y0, L1 = Math.hypot(dx1, dy1) || 1;
    const dx2 = x2 - x1, dy2 = y2 - y1, L2 = Math.hypot(dx2, dy2) || 1;
    const rc = Math.min(r, L1 * 0.45, L2 * 0.45);
    const ax = x1 - (dx1 / L1) * rc, ay = y1 - (dy1 / L1) * rc;
    const bx = x1 + (dx2 / L2) * rc, by = y1 + (dy2 / L2) * rc;
    d += ` L${ax.toFixed(1)} ${ay.toFixed(1)} Q${x1.toFixed(1)} ${y1.toFixed(1)} ${bx.toFixed(1)} ${by.toFixed(1)}`;
  }
  const last = pts[pts.length - 1];
  d += ` L${last[0]} ${last[1]}`;
  return d;
}

// Uniform graphite-ink arrows across the entire sheet (no rainbow lines!)
function drawArrow(pts, { w = 1.35, dash = '', head = true, label = '', lx = null, ly = null } = {}) {
  const stroke = T.arrow;
  const d = smoothOrtho(pts, 6);
  let out = `<path d="${d}" fill="none" stroke="${stroke}" stroke-width="${w}" stroke-linecap="round" stroke-linejoin="round"${dash ? ` stroke-dasharray="${dash}"` : ''}/>`;
  if (head && pts.length >= 2) {
    const [a, b] = pts.slice(-2);
    const dx = b[0] - a[0], dy = b[1] - a[1], L = Math.hypot(dx, dy) || 1;
    const ux = dx / L, uy = dy / L;
    const len = 6.2, half = 2.8, notch = 1.3;
    const p1x = b[0] - ux * len - uy * half, p1y = b[1] - uy * len + ux * half;
    const p2x = b[0] - ux * (len - notch), p2y = b[1] - uy * (len - notch);
    const p3x = b[0] - ux * len + uy * half, p3y = b[1] - uy * len - ux * half;
    out += `<path d="M${b[0].toFixed(1)} ${b[1].toFixed(1)} L${p1x.toFixed(1)} ${p1y.toFixed(1)} L${p2x.toFixed(1)} ${p2y.toFixed(1)} L${p3x.toFixed(1)} ${p3y.toFixed(1)} Z" fill="${stroke}"/>`;
  }
  if (label) {
    const mx = lx !== null ? lx : (pts[0][0] + pts[pts.length - 1][0]) / 2;
    const my = ly !== null ? ly : (pts[0][1] + pts[pts.length - 1][1]) / 2;
    const approxW = [...label].reduce((acc, ch) => acc + (ch.charCodeAt(0) > 127 ? 10.0 : 5.7), 0) + 8;
    out += `<rect x="${(mx - approxW / 2).toFixed(1)}" y="${(my - 9.8).toFixed(1)}" width="${approxW.toFixed(1)}" height="13.8" rx="3.5" fill="${T.surface}" fill-opacity="0.96" stroke="${T.line}" stroke-width="0.8"/>`;
    out += `<text x="${mx.toFixed(1)}" y="${my.toFixed(1)}" font-size="9.8" font-weight="600" fill="${T.ink2}" text-anchor="middle" class="mono">${esc(label)}</text>`;
  }
  return out;
}

// Single-layer clean matte module rectangle (no nested box-inside-box pills, no glossy gradients)
function drawBox({
  x, y, w, h,
  title, sub = '',
  comp = null,
  kind = 'op',
  stack = false,
  jump = '',
  badge = '',
  meta = null,
}) {
  const rx = kind === 'io' ? h / 2 : 6;
  const c = comp && ARCH[comp] ? ARCH[comp] : null;
  const nidAttr = registerMeta(meta || { title, shape: sub, detail: '', src: '', panel: '' }, comp);
  const jumpAttr = jump ? ` data-jump-target="${jump}"` : '';
  const g = [];

  if (kind === 'cache') {
    const cc = ARCH.cache;
    g.push(`<g class="box" data-comp="${comp || 'cache'}" data-kind="cache"${nidAttr}${jumpAttr}>`);
    g.push(`<title>${esc(title)}${sub ? ' · ' + esc(sub) : ''}</title>`);
    g.push(`<rect class="card-ring" x="${x}" y="${y}" width="${w}" height="${h}" rx="6" fill="${cc.soft}" stroke="${cc.strong}" stroke-width="1.2" stroke-dasharray="4 2.5"/>`);
    if (sub) {
      g.push(`<text x="${(x + w / 2).toFixed(1)}" y="${(y + h / 2 - 3.8).toFixed(1)}" font-size="11.2" font-weight="700" fill="${cc.ink}" text-anchor="middle">${esc(title)}</text>`);
      g.push(`<text x="${(x + w / 2).toFixed(1)}" y="${(y + h / 2 + 10.8).toFixed(1)}" font-size="9.9" font-weight="600" fill="${cc.ink}" text-anchor="middle" class="mono">${esc(sub)}</text>`);
    } else {
      g.push(`<text x="${(x + w / 2).toFixed(1)}" y="${(y + h / 2 + 4).toFixed(1)}" font-size="11.2" font-weight="700" fill="${cc.ink}" text-anchor="middle">${esc(title)}</text>`);
    }
    g.push(`</g>`);
    return g.join('');
  }

  g.push(`<g class="box" data-comp="${comp || ''}" data-kind="${kind === 'weight' ? 'weight' : 'data'}"${nidAttr}${jumpAttr}>`);
  g.push(`<title>${esc(title)}${sub ? ' · ' + esc(sub) : ''}${meta?.src ? ' · ' + esc(meta.src) : ''}</title>`);

  if (stack && c) {
    g.push(`<rect x="${x + 4.8}" y="${y - 4.8}" width="${w}" height="${h}" rx="${rx}" fill="${T.surface}" stroke="${c.mid}" stroke-width="0.95"/>`);
    g.push(`<rect x="${x + 2.4}" y="${y - 2.4}" width="${w}" height="${h}" rx="${rx}" fill="${c.wash}" stroke="${c.mid}" stroke-width="0.95"/>`);
  }

  if (kind === 'weight') {
    const ck = comp && ARCH[comp] ? comp : 'neutral';
    const pal = ARCH[ck];
    g.push(`<rect class="card-ring" x="${x}" y="${y}" width="${w}" height="${h}" rx="${rx}" fill="${pal.soft}" stroke="${pal.mid}" stroke-width="1.25" data-role="wt"/>`);
    if (sub) {
      const subFont = sub.length > 26 && w < 250 ? 9.4 : sub.length > 20 && w < 165 ? 9.5 : 10.0;
      g.push(`<text x="${(x + w / 2).toFixed(1)}" y="${(y + h / 2 - 3.6).toFixed(1)}" font-size="11.4" font-weight="700" fill="${T.ink}" text-anchor="middle">${esc(title)}</text>`);
      g.push(`<text x="${(x + w / 2).toFixed(1)}" y="${(y + h / 2 + 10.8).toFixed(1)}" font-size="${subFont}" font-weight="600" fill="${pal.ink}" text-anchor="middle" class="mono">${esc(sub)}</text>`);
    } else {
      g.push(`<text x="${(x + w / 2).toFixed(1)}" y="${(y + h / 2 + 4.2).toFixed(1)}" font-size="11.6" font-weight="700" fill="${T.ink}" text-anchor="middle">${esc(title)}</text>`);
    }
  } else if (kind === 'kernel') {
    const ck = comp && ARCH[comp] ? comp : 'neutral';
    const pal = ARCH[ck];
    g.push(`<rect class="card-ring" x="${x}" y="${y}" width="${w}" height="${h}" rx="${rx}" fill="${pal.soft}" stroke="${pal.strong}" stroke-width="1.55" data-role="op"/>`);
    if (sub) {
      const kFont = w < 200 ? 9.6 : 10.1;
      g.push(`<text x="${(x + w / 2).toFixed(1)}" y="${(y + h / 2 - 4.2).toFixed(1)}" font-size="11.6" font-weight="750" fill="${pal.ink}" text-anchor="middle">${esc(title)}</text>`);
      g.push(`<text x="${(x + w / 2).toFixed(1)}" y="${(y + h / 2 + 11.2).toFixed(1)}" font-size="${kFont}" font-weight="600" fill="${T.ink}" text-anchor="middle" class="mono">${esc(sub)}</text>`);
    } else {
      g.push(`<text x="${(x + w / 2).toFixed(1)}" y="${(y + h / 2 + 4.4).toFixed(1)}" font-size="11.8" font-weight="750" fill="${pal.ink}" text-anchor="middle">${esc(title)}</text>`);
    }
  } else if (kind === 'io') {
    const fill = T.headerBg;
    const stroke = T.lineStrong;
    g.push(`<rect class="card-ring" x="${x}" y="${y}" width="${w}" height="${h}" rx="${rx}" fill="${fill}" stroke="${stroke}" stroke-width="1.15" data-role="res"/>`);
    if (sub) {
      g.push(`<text x="${x + w / 2}" y="${y + h / 2 - 3.4}" font-size="11.3" font-weight="700" fill="${T.ink}" text-anchor="middle">${esc(title)}</text>`);
      g.push(`<text x="${x + w / 2}" y="${y + h / 2 + 10.8}" font-size="10.0" font-weight="500" fill="${T.ink2}" text-anchor="middle" class="mono">${esc(sub)}</text>`);
    } else {
      g.push(`<text x="${x + w / 2}" y="${y + h / 2 + 4.2}" font-size="11.5" font-weight="700" fill="${T.ink}" text-anchor="middle">${esc(title)}</text>`);
    }
  } else {
    g.push(`<rect class="card-ring" x="${x}" y="${y}" width="${w}" height="${h}" rx="${rx}" fill="${T.surface}" stroke="${T.lineStrong}" stroke-width="1.15" data-role="op"/>`);
    if (sub) {
      g.push(`<text x="${x + w / 2}" y="${y + h / 2 - 3.4}" font-size="11.3" font-weight="650" fill="${T.ink}" text-anchor="middle">${esc(title)}</text>`);
      g.push(`<text x="${x + w / 2}" y="${y + h / 2 + 10.8}" font-size="10.0" font-weight="500" fill="${T.ink2}" text-anchor="middle" class="mono">${esc(sub)}</text>`);
    } else {
      g.push(`<text x="${x + w / 2}" y="${y + h / 2 + 4.2}" font-size="11.5" font-weight="650" fill="${T.ink}" text-anchor="middle">${esc(title)}</text>`);
    }
  }

  if (badge) {
    const bw = [...badge].reduce((a, ch) => a + (ch.charCodeAt(0) > 127 ? 9.4 : 5.5), 0) + 10;
    const bx = x + w - bw - 5, by = y + 4;
    g.push(`<rect x="${bx.toFixed(1)}" y="${by}" width="${bw.toFixed(1)}" height="14" rx="4" fill="${T.surface}" stroke="${T.lineStrong}" stroke-width="0.95"/>`);
    g.push(`<text x="${(bx + bw / 2).toFixed(1)}" y="${by + 10.1}" font-size="9.1" font-weight="700" fill="${T.ink2}" text-anchor="middle">${esc(badge)}</text>`);
  }

  g.push(`</g>`);
  return g.join('');
}

function drawCircleOp(cx, cy, r, sym, meta = null) {
  const nid = registerMeta(meta, 'neutral');
  return `<g class="box" data-kind="op"${nid}><title>${esc(meta?.title || sym)}</title><circle class="card-ring" cx="${cx}" cy="${cy}" r="${r}" fill="${T.surface}" stroke="${T.ink2}" stroke-width="1.4"/><text x="${cx}" y="${cy + 4.5}" font-size="13.5" font-weight="750" fill="${T.ink}" text-anchor="middle">${esc(sym)}</text></g>`;
}

function drawSubPlate(x, y, w, h, label, tone = null, { rightLabel = '', labelX = null, anchor = 'start' } = {}) {
  const fill = tone ? tone.fill : T.headerBg;
  const stroke = tone ? tone.stroke : T.lineStrong;
  const labelColor = tone ? tone.label : T.muted;
  const tx = labelX !== null ? labelX : x + 12;
  let out = `<g class="sub-plate"><rect x="${x}" y="${y}" width="${w}" height="${h}" rx="8" fill="${fill}" stroke="${stroke}" stroke-width="1.05" stroke-dasharray="4 3"/>`;
  if (label) {
    out += `<text x="${tx.toFixed(1)}" y="${y + 16}" font-size="10.4" font-weight="700" fill="${labelColor}" text-anchor="${anchor}">${esc(label)}</text>`;
  }
  if (rightLabel) {
    out += `<text x="${(x + w - 12).toFixed(1)}" y="${y + 16}" font-size="10.1" font-weight="600" fill="${labelColor}" text-anchor="end">${esc(rightLabel)}</text>`;
  }
  out += `</g>`;
  return out;
}

// Uniform, calm scholarly panel frame across all 7 sub-figures (a)-(g)

  const headPath = topBandPath(ox + 0.6, oy + 0.6, w - 1.2, 11.5, 53.4);

    `<g id="${id}">`,
    `<rect class="panel-frame" x="${ox}" y="${oy}" width="${w}" height="${h}" rx="12" fill="${T.surface}" stroke="${T.line}" stroke-width="1.2"/>`,

    `<text x="${ox + 28}" y="${oy + 31.3}" font-size="13" font-weight="750" fill="${T.surface}" text-anchor="middle" class="mono">${esc(letter)}</text>`,

    `<text x="${ox + 48}" y="${oy + 44}" font-size="11.3" font-weight="500" fill="${T.muted}">${subtitle}</text>`,

  ].join('');
}

    meta: { panel: '(a) → (c)', title: '注意力段残差写回', shape: `[T, ${C}] + [T, ${S}, ${C}] → [T, ${S}, ${C}]`, detail: `复用 attn_hc 生成的 post [${S}] 与 Sinkhorn 双随机矩阵 comb [${S}×${S}] 将子层输出写回 ${S} 路`, src: 'modeling_glm5_next.py:1318–1320' },
  }));
  g.push(drawArrow([[ix + iw, yWrite1 + 19], [busX0 - 3, yWrite1 + 19]]));

  // Mid divider between Attention half and FFN half
  const yDiv = yWrite1 + 45;
  g.push(`<line x1="${ix}" y1="${yDiv}" x2="${ix + iw}" y2="${yDiv}" stroke="${T.lineStrong}" stroke-width="1" stroke-dasharray="3.5 3"/>`);

  // FFN Half inside x45
  const yMhc2 = yDiv + 7;
  g.push(drawBox({
    x: ix, y: yMhc2, w: iw, h: 42,
    title: 'mHC 入口混合 (ffn_hc)',
    sub: `fn[${MIX},${S * C}]+scale+base → 合成 1 路`,
    comp: 'resid', kind: 'weight', jump: 'panel-c',
    meta: { panel: '(a) → (c)', title: 'ffn_hc 入口流混合', shape: `[T, ${S}, ${C}] → [T, ${C}] · fn [${MIX}, ${S * C}]`, detail: `前馈段独立拥有一套 fn / scale / base 参数，同样先合流再做 RMSNorm`, src: 'modeling_glm5_next.py:1323' },
  }));
  g.push(drawArrow([[busX0 - 3, yMhc2 + 21], [ix + iw, yMhc2 + 21]]));
  g.push(drawArrow([[icx, yMhc2 + 42], [icx, yMhc2 + 52]]));

  const yNorm2 = yMhc2 + 52;
  g.push(drawBox({
    x: ix, y: yNorm2, w: iw, h: 42,
    title: 'RMSNorm 2 (post_attention_layernorm)',
    sub: `γ [${C}] · 输出 x_ffn [T, ${C}]`,
    comp: 'norm', kind: 'weight',
    meta: { panel: '(a)', title: 'post_attention_layernorm', shape: `[T, ${C}] → [T, ${C}] · γ [${C}]`, detail: `前馈子层前的 RMSNorm 归一化`, src: 'modeling_glm5_next.py:1325' },
  }));

  const yFfn = yNorm2 + 52;
  g.push(drawArrow([[icx, yNorm2 + 42], [icx, yNorm2 + 47], [lx1, yNorm2 + 47], [lx1, yFfn]]));
  g.push(drawArrow([[icx, yNorm2 + 42], [icx, yNorm2 + 47], [lx2, yNorm2 + 47], [lx2, yFfn]]));

  g.push(drawBox({
    x: ix, y: yFfn, w: hw, h: 44,
    title: '稠密 SwiGLU',
    sub: `前 ${cntDense} 层 · 见 (g)`,
    comp: 'dense', kind: 'weight', jump: 'panel-g',
    meta: { panel: '(a) → (g)', title: '稠密 SwiGLU MLP (L00–L02)', shape: `[T, ${C}] → [T, ${I_DENSE}] → [T, ${C}]`, detail: `前 ${cntDense} 层使用稠密前馈，中间维度 ${fmt(I_DENSE)}，限幅 gate ≤ ${LIM}、up ∈ [-${LIM}, ${LIM}]`, src: 'modeling_glm5_next.py:87–105' },
  }));
  g.push(`<text x="${icx}" y="${yFfn + 26}" font-size="10.8" font-weight="650" fill="${T.muted}" text-anchor="middle">或</text>`);
  g.push(drawBox({
    x: ix + hw + 22, y: yFfn, w: hw, h: 44,
    title: '细粒度 MoE',
    sub: `后 ${cntMoe} 层 · 见 (g)`,
    comp: 'expert', kind: 'weight', jump: 'panel-g',
    meta: { panel: '(a) → (g)', title: '细粒度混合专家 MoE (L03–L44)', shape: `[T, ${C}] → [T, ${C}]`, detail: `后 ${cntMoe} 层每层 ${E_ROUTED} 个路由专家选 ${K_EXP} 个 + ${E_SHARED} 个常驻共享专家，专家中间维 ${fmt(MI)}`, src: 'modeling_glm5_next.py:187–208' },
  }));

  const yWrite2 = yFfn + 54;
  g.push(drawArrow([[lx1, yFfn + 44], [lx1, yFfn + 49], [icx, yFfn + 49], [icx, yWrite2]], { head: false }));
  g.push(drawArrow([[lx2, yFfn + 44], [lx2, yFfn + 49], [icx, yFfn + 49], [icx, yWrite2]]));
  g.push(drawBox({
    x: ix, y: yWrite2, w: iw, h: 38,
    title: `mHC 写回 ${S} 路 (本层输出)`,
    sub: `post ⊗ ffn_out + combᵀ · 原 ${S} 路`,
    comp: 'resid', kind: 'op', jump: 'panel-c',
    meta: { panel: '(a) → (c)', title: '前馈段残差写回', shape: `[T, ${C}] + [T, ${S}, ${C}] → [T, ${S}, ${C}]`, detail: `写回后的 ${S} 路残差直接作为下一层的输入流`, src: 'modeling_glm5_next.py:1327–1329' },
  }));
  g.push(drawArrow([[ix + iw, yWrite2 + 19], [busX0 - 3, yWrite2 + 19]]));

  // 5. Post-backbone output stack
  const yHcHead = oy + 704;
  g.push(drawArrow([[busMid, busBot], [busMid, yHcHead + 20], [bx + bw, yHcHead + 20]]));
  g.push(drawBox({
    x: bx, y: yHcHead, w: bw, h: 40,
    title: `${S} 路等权求平均 hc_head`,
    sub: `mean(dim=2) → [T, ${C}] · 无可学习参数`,
    comp: 'resid', kind: 'io',
    meta: { panel: '(a)', title: 'Glm5NextTextHyperHead', shape: `[T, ${S}, ${C}] → [T, ${C}]`, detail: `第 ${N - 1} 层结束后对 ${S} 条残差流直接做无权重算术平均`, src: 'modeling_glm5_next.py:299–303 · 1492' },
  }));
  g.push(drawArrow([[cx, yHcHead + 40], [cx, yHcHead + 51]]));

  const yFinalNorm = yHcHead + 51;
  g.push(drawBox({
    x: bx, y: yFinalNorm, w: bw, h: 43,
    title: '最终归一化 model.norm',
    sub: `RMSNorm γ [${C}] → last_hidden [T, ${C}]`,
    comp: 'norm', kind: 'weight', jump: 'panel-d', badge: '送 MTP (d)',
    meta: { panel: '(a) → (d)', title: '主模型最终 RMSNorm', shape: `[T, ${C}] → [T, ${C}] · γ [${C}]`, detail: `输出既送入 lm_head 计算当前生成步词表分数，也作为第 ${N} 层 MTP 的上一步隐藏状态输入`, src: 'modeling_glm5_next.py:1420 · 1492' },
  }));
  g.push(drawArrow([[cx, yFinalNorm + 43], [cx, yFinalNorm + 54]]));

  const yLmHead = yFinalNorm + 54;
  g.push(drawBox({
    x: bx, y: yLmHead, w: bw, h: 44,
    title: '输出投影层 lm_head (独立权重)',
    sub: `${C} → ${V} · W [${V}, ${C}] (不共享)`,
    comp: 'embed', kind: 'weight',
    meta: { panel: '(a)', title: 'lm_head 词表线性投影', shape: `[1, ${C}] → [1, ${V}] · weight [${V}, ${C}]`, detail: `tie_word_embeddings = false，与 embed_tokens 独立存储；生成阶段仅取最后位置计算 ${fmt(V)} 个候选分数`, src: 'modeling_glm5_next.py:2115 · 2221' },
  }));
  g.push(drawArrow([[cx, yLmHead + 44], [cx, yLmHead + 55]]));

  const yPick = yLmHead + 55;
  g.push(drawBox({
    x: bx, y: yPick, w: bw, h: 40,
    title: '词表 Logits 与采样选词',
    sub: `[1, ${fmt(V)}] → Softmax · 默认 top_p = 0.95`,
    comp: 'embed', kind: 'op',
    meta: { panel: '(a)', title: '下一个 token 采样', shape: `[1, ${V}] → next_token_id`, detail: `官方 generation_config 默认采样 top_p = 0.95（贪心解码则直接取 argmax）`, src: 'generation_config.json' },
  }));

  return { svg: g.join(''), w, h };
}

// ============================================================================
// PANEL (b): 45-Layer 3:1 Hybrid Recipe + Cache Footprint (ox=20, w=484, h=380)
// ============================================================================
function buildPanelB(ox, oy) {
  const w = 484, h = 380;
  const g = [
    drawPanelFrame(
      'panel-b', 'b', ox, oy, w, h,
      `${N} 层混合排布周期与跨步缓存 (3:1 规律)`,
      `(KDA × 3 + 稀疏 MLA × 1) × ${hi(cntMla + ' 组')} + L${N - 1} KDA · 前 ${hi(cntDense + ' 层')}稠密 / 后 ${hi(cntMoe + ' 层')} MoE`
    ),
  ];

  // 12 columns x 4 rows periodic matrix for backbone L00..L44, plus separated L45 (MTP) on the MLA row
  const gx0 = ox + 58, gy0 = oy + 68;
  const cw = 30.5, ch = 31, gapX = 3.5, gapY = 5;
  const rowLabels = ['+0 KDA', '+1 KDA', '+2 KDA', '+3 MLA'];
  for (let r = 0; r < 4; r++) {
    const ry = gy0 + r * (ch + gapY) + ch / 2 + 3.5;
    g.push(`<text x="${ox + 52}" y="${ry}" font-size="9.5" font-weight="700" fill="${r === 3 ? ARCH.attn.ink : ARCH.kda.ink}" text-anchor="end" class="mono">${rowLabels[r]}</text>`);
  }

  const kdaTileTop = mix(ARCH.kda.soft, ARCH.kda.mid, 0.35);
  const mlaTileTop = mix(ARCH.attn.soft, ARCH.attn.mid, 0.38);
  const denseTileBot = mix(ARCH.dense.soft, ARCH.dense.mid, 0.38);
  const moeTileBot = mix(ARCH.expert.soft, ARCH.expert.mid, 0.32);

  for (let i = 0; i < N; i++) {
    const col = Math.floor(i / 4), row = i % 4;
    const cx = gx0 + col * (cw + gapX), cy = gy0 + row * (ch + gapY);
    const [aKind, fKind] = kinds[i];
    const topFill = aKind === 'kda' ? kdaTileTop : mlaTileTop;
    const botFill = fKind === 'dense' ? denseTileBot : moeTileBot;
    const ringCol = aKind === 'kda' ? ARCH.kda.mid : ARCH.attn.mid;
    const label = String(i).padStart(2, '0');
    const desc = `L${label}：${aKind === 'kda' ? 'KDA 线性注意力' : '稀疏 MLA + kpool 索引器'} + ${fKind === 'dense' ? `稠密 SwiGLU (${fmt(I_DENSE)})` : `细粒度 MoE (${E_ROUTED}选${K_EXP}+${E_SHARED})`}`;
    const nid = registerMeta({
      panel: '(b)',
      title: `第 L${label} 层`,
      shape: `${S} 路 mHC [T, ${S}, ${C}]`,
      detail: desc,
      src: 'official-config.json:layer_types',
    }, aKind === 'kda' ? 'kda' : 'attn');
    g.push(`<g class="box" data-comp="${aKind === 'kda' ? 'kda' : 'attn'}"${nid}>`);
    g.push(`<title>${esc(desc)}</title>`);
    g.push(`<rect x="${cx.toFixed(1)}" y="${cy}" width="${cw}" height="${(ch * 0.56).toFixed(1)}" rx="3.5" fill="${topFill}"/>`);
    g.push(`<rect x="${cx.toFixed(1)}" y="${(cy + ch * 0.52).toFixed(1)}" width="${cw}" height="${(ch * 0.48).toFixed(1)}" rx="3" fill="${botFill}"/>`);
    g.push(`<line x1="${(cx + 1).toFixed(1)}" y1="${(cy + ch * 0.54).toFixed(1)}" x2="${(cx + cw - 1).toFixed(1)}" y2="${(cy + ch * 0.54).toFixed(1)}" stroke="${T.surface}" stroke-width="0.9"/>`);
    g.push(`<rect class="card-ring" x="${cx.toFixed(1)}" y="${cy}" width="${cw}" height="${ch}" rx="4" fill="none" stroke="${ringCol}" stroke-width="1"/>`);
    g.push(`<text x="${(cx + cw / 2).toFixed(1)}" y="${cy + 13.2}" font-size="9.4" font-weight="750" fill="${T.ink}" text-anchor="middle" class="mono">${label}</text>`);
    g.push(`<text x="${(cx + cw / 2).toFixed(1)}" y="${cy + 26.5}" font-size="8.1" font-weight="650" fill="${fKind === 'dense' ? ARCH.dense.ink : ARCH.expert.ink}" text-anchor="middle">${fKind === 'dense' ? '稠' : '专'}</text>`);
    g.push(`</g>`);
  }

  // Separated standalone L45 (MTP) cell aligned with +3 MLA row
  const mtpColX = gx0 + 11 * (cw + gapX) + 4;
  const mtpRowY = gy0 + 3 * (ch + gapY);
  const mtpDesc = `L${N} (MTP 投机草拟层)：主干外独立层，单路标准残差（无 mHC）+ 稀疏 MLA + 索引器 + MoE`;
  const mtpNid = registerMeta({
    panel: '(b) → (d)',
    title: `L${N} · MTP 投机草拟层`,
    shape: `单路 [T, ${C}] (无 mHC)`,
    detail: mtpDesc,
    src: 'vLLM mtp.py:40–111',
  }, 'mtp');
  g.push(`<line x1="${(mtpColX - 4).toFixed(1)}" y1="${mtpRowY - 14}" x2="${(mtpColX + cw + 2).toFixed(1)}" y2="${mtpRowY - 14}" stroke="${ARCH.mtp.strong}" stroke-width="1" stroke-dasharray="2.5 2"/>`);
  g.push(`<text x="${(mtpColX + cw / 2).toFixed(1)}" y="${mtpRowY - 4}" font-size="8.3" font-weight="700" fill="${ARCH.mtp.ink}" text-anchor="middle">主干外</text>`);
  g.push(`<g class="box" data-comp="mtp" data-jump-target="panel-d"${mtpNid}>`);
  g.push(`<title>${esc(mtpDesc)}</title>`);
  g.push(`<rect x="${mtpColX.toFixed(1)}" y="${mtpRowY}" width="${cw}" height="${(ch * 0.56).toFixed(1)}" rx="3.5" fill="${ARCH.mtp.soft}"/>`);
  g.push(`<rect x="${mtpColX.toFixed(1)}" y="${(mtpRowY + ch * 0.52).toFixed(1)}" width="${cw}" height="${(ch * 0.48).toFixed(1)}" rx="3" fill="${moeTileBot}"/>`);
  g.push(`<rect class="card-ring" x="${mtpColX.toFixed(1)}" y="${mtpRowY}" width="${cw}" height="${ch}" rx="4" fill="none" stroke="${ARCH.mtp.strong}" stroke-width="1.25" stroke-dasharray="2.5 2"/>`);
  g.push(`<text x="${(mtpColX + cw / 2).toFixed(1)}" y="${mtpRowY + 13.2}" font-size="8.9" font-weight="750" fill="${ARCH.mtp.ink}" text-anchor="middle" class="mono">L${N}</text>`);
  g.push(`<text x="${(mtpColX + cw / 2).toFixed(1)}" y="${mtpRowY + 26.5}" font-size="7.7" font-weight="650" fill="${ARCH.expert.ink}" text-anchor="middle" class="mono">MTP</text>`);
  g.push(`</g>`);

  // Symmetric 2 x 2 archetype summary chips grid
  const sy = oy + 216;
  const chips = [
    [`L00–L02：KDA + 稠密 MLP × ${cntKdaDense}`, ARCH.dense],
    [`其余层 (L04…L${N - 1})：KDA + MoE × ${cntKdaMoe}`, ARCH.kda],
    [`L03, L07…L43：稀疏 MLA + MoE × ${cntMla}`, ARCH.attn],
    [`L${N}：MTP 投机草拟层 (单路) × ${tc.num_nextn_predict_layers}`, ARCH.mtp],
  ];
  const chipW = (w - 32 - 8) / 2;
  chips.forEach(([txt, pal], idx) => {
    const cx = ox + 16 + (idx % 2) * (chipW + 8);
    const cy0 = sy + Math.floor(idx / 2) * 25;
    g.push(`<rect x="${cx}" y="${cy0}" width="${chipW}" height="21" rx="4.5" fill="${T.headerBg}" stroke="${T.line}" stroke-width="1"/>`);
    g.push(`<rect x="${cx + 7}" y="${cy0 + 5}" width="10" height="11" rx="2" fill="${pal.soft}" stroke="${pal.mid}" stroke-width="1"/>`);
    g.push(`<text x="${cx + 22}" y="${cy0 + 14.3}" font-size="10.0" font-weight="650" fill="${T.ink}">${esc(txt)}</text>`);
  });

  // Inference cross-step cache comparison box
  const cy = oy + 272;
  const cc = ARCH.cache;
  g.push(`<rect x="${ox + 16}" y="${cy}" width="${w - 32}" height="94" rx="8" fill="${cc.wash}" stroke="${cc.mid}" stroke-width="1.1"/>`);
  g.push(`<text x="${ox + 28}" y="${cy + 19}" font-size="11.2" font-weight="750" fill="${cc.ink}">推理跨轮次状态缓存对比 (KV / State Cache)</text>`);
  g.push(`<text x="${ox + 28}" y="${cy + 40}" font-size="10.5" font-weight="650" fill="${T.ink}">· KDA (${cntKda} 层)：<tspan font-weight="500" fill="${T.ink2}">状态 S [${KH}, ${KD}, ${KD}] + 卷积窗 ${KCONV_WIN}×${KCONV_CH}，随序列 </tspan><tspan font-weight="700" fill="${ARCH.kda.ink}" class="mono">O(1) 恒定</tspan></text>`);
  g.push(`<text x="${ox + 28}" y="${cy + 60}" font-size="10.5" font-weight="650" fill="${T.ink}">· 稀疏 MLA (${cntMla} 层 + MTP)：<tspan font-weight="500" fill="${T.ink2}">潜向量 c_kv [T, ${KR}]（较全量 KV 压缩 </tspan><tspan font-weight="700" fill="${ARCH.attn.ink}" class="mono">${KV_COMP}×</tspan><tspan font-weight="500" fill="${T.ink2}">）</tspan></text>`);
  g.push(`<text x="${ox + 38}" y="${cy + 79}" font-size="10.1" font-weight="500" fill="${T.ink2}">索引器：vllm-ascend 存 <tspan class="mono" font-weight="600" fill="${cc.ink}">pool_k[⌊T/${KP}⌋,${ID}]</tspan> + 尾缓冲（HF 存逐词 [${2 * ID + 1}]）</text>`);

  return { svg: g.join(''), w, h };
}

// PANEL (c): mHC 4-Stream Hyper-Connections (ox=20, w=484, h=424)
// ============================================================================
function buildPanelC(ox, oy) {
  const w = 484, h = 424;
  const g = [
    drawPanelFrame(
      'panel-c', 'c', ox, oy, w, h,
      `mHC 四路流形约束超连接 (每层执行 2 次)`,
      `每词算 ${hi(MIX + ' 个系数')}：pre ${hi(S)} 合成 1 路 · post ${hi(S)} + Sinkhorn comb ${hi(S + '×' + S)} 写回`
    ),
  ];

  // Top input
  g.push(drawBox({
    x: ox + 20, y: oy + 66, w: w - 40, h: 38,
    title: `当前段输入 · ${S} 路并行残差流`,
    sub: `hidden_streams [T, ${S}, ${C}]`,
    comp: 'resid', kind: 'io',
    meta: { panel: '(c)', title: 'mHC 四路输入张量', shape: `[T, ${S}, ${C}]`, detail: `注意力段与前馈段入口各接收 ${S} 条宽 ${C} 的残差流`, src: 'modeling_glm5_next.py:268' },
  }));

  const lx = ox + 20, lw = 178, lcx = lx + lw / 2;
  const mx = ox + 244, mw = 180, mcx = mx + mw / 2;
  const bx0 = ox + 440;

  // Arrows from input
  g.push(drawArrow([[lcx, oy + 104], [lcx, oy + 124]]));
  g.push(drawArrow([[mcx, oy + 104], [mcx, oy + 172]]));
  for (let k = 0; k < S; k++) {
    g.push(`<line x1="${bx0 + k * 6}" y1="${oy + 104}" x2="${bx0 + k * 6}" y2="${oy + 325}" stroke="${ARCH.resid.rail}" stroke-width="2.2" stroke-linecap="round" data-comp="resid" data-role="res"/>`);
  }
  g.push(`<text x="${bx0 - 6}" y="${oy + 144}" font-size="9.5" font-weight="650" fill="${T.ink2}" text-anchor="end">原 ${S} 路</text>`);

  // Left: fn mapping + scale + base
  g.push(drawBox({
    x: lx, y: oy + 124, w: lw, h: 48,
    title: '展平 + 无权 RMSNorm → fn',
    sub: `fn[${MIX},${S * C}]+scale+base`,
    comp: 'resid', kind: 'weight',
    meta: { panel: '(c)', title: 'hc.fn 混合系数映射 (FP32)', shape: `[T, ${S * C}] → [T, ${MIX}] · fn [${MIX}, ${S * C}], scale [3], base [${MIX}]`, detail: `${S} 路展平为 ${S * C} 维（FP32），经无权重 RMSNorm 后乘 fn 得 ${MIX} 维，拆为三段后先各乘 scale [3]、再加 base [${MIX}]`, src: 'modeling_glm5_next.py:279–286' },
  }));
  g.push(drawArrow([[lcx, oy + 172], [lcx, oy + 190]]));

  // Left: Featured Kernel: Sinkhorn doubly-stochastic manifold projection
  g.push(drawBox({
    x: lx, y: oy + 190, w: lw, h: 54,
    title: `激活与 ${SK} 轮 Sinkhorn`,
    sub: `pre[${S}] · post[${S}] · comb[${S},${S}]`,
    comp: 'resid', kind: 'kernel',
    meta: { panel: '(c)', title: '流形约束系数生成', shape: `pre [T,${S}], post [T,${S}], comb [T,${S},${S}]`, detail: `pre = σ(·)+1e-6；post = 2σ(·) ∈ (0,2)；comb 经 Softmax 后先按列归一 1 次，再做 ${SK - 1} 轮行列交替归一投影至双随机流形`, src: 'modeling_glm5_next.py:284–292' },
  }));

  g.push(drawArrow([[lx + lw, oy + 202], [mx, oy + 202]], { label: `pre[${S}]`, lx: (lx + lw + mx) / 2, ly: oy + 189 }));

  // Center: collapse to 1 stream
  g.push(drawBox({
    x: mx, y: oy + 172, w: mw, h: 44,
    title: `按 pre 加权合成 1 路`,
    sub: `Σ preᵢ·streamᵢ → [T, ${C}]`,
    comp: 'resid', kind: 'op',
    meta: { panel: '(c)', title: '四路坍缩为单路输入', shape: `[T, ${S}, ${C}] → [T, ${C}]`, detail: `(pre.unsqueeze(-1) * hidden_streams).sum(dim=2)，合成单条宽 ${C} 序列送入归一化与子层`, src: 'modeling_glm5_next.py:295' },
  }));
  g.push(drawArrow([[mcx, oy + 216], [mcx, oy + 234]]));

  // Center: stand-in sublayer
  const subStandinNid = registerMeta({
    panel: '(c)',
    title: '单路子层执行 (RMSNorm + 注意力或前馈)',
    shape: `[T, ${C}] → sub_out [T, ${C}]`,
    detail: 'mHC 先将 4 路合成为 1 路后，才执行该半层的 RMSNorm 与注意力（图 e/f）或前馈（图 g）计算',

  }));

function showMeta(nid) {
  const m = nodeRegistry.get(nid);

}

function flashPanel(panelId) {
  const g = document.getElementById(panelId);
  if (!g) return;
  g.scrollIntoView({ behavior: 'smooth', block: 'start' });
  const frame = g.querySelector('.panel-frame');
  if (frame) {
    frame.classList.add('flash');
    setTimeout(() => frame.classList.remove('flash'), 1400);
  }
}

let lockedBox = null;
page.addEventListener('mouseover', e => {
  if (lockedBox) return;
  const box = e.target.closest('.box[data-nid]');
  if (box) showMeta(box.dataset.nid);
});

page.addEventListener('click', e => {
  const jumpEl = e.target.closest('[data-jump-target]');
  const box = e.target.closest('.box');
  if (box) {
    for (const b of page.querySelectorAll('.box.selected')) b.classList.remove('selected');
    if (lockedBox === box) {
      lockedBox = null;
      inspector.classList.remove('has-selection');
    } else {
      lockedBox = box;
      box.classList.add('selected');
      if (box.dataset.nid) showMeta(box.dataset.nid);
    }
  }
  if (jumpEl) {
    flashPanel(jumpEl.dataset.jumpTarget);
  }
});

for (const btn of document.querySelectorAll('.jump-btn')) {
  btn.addEventListener('click', () => {
    for (const b of document.querySelectorAll('.jump-btn')) b.classList.remove('active');
    btn.classList.add('active');
    flashPanel(btn.dataset.jump);
  });
}

let userPickedZoom = false;
function applyZoom(mode) {
  for (const b of document.querySelectorAll('.zoom-btn')) {
    b.classList.toggle('active', b.dataset.zoom === mode);
  }
  page.classList.remove('zoom-actual', 'zoom-large');
  if (mode === 'actual') page.classList.add('zoom-actual');
  if (mode === 'large') page.classList.add('zoom-large');
}

function autoZoomForViewport() {
  if (userPickedZoom) return;
  applyZoom(page.clientWidth > 0 && page.clientWidth < 1260 ? 'actual' : 'fit');
}

for (const btn of document.querySelectorAll('.zoom-btn')) {
  btn.addEventListener('click', () => {
    userPickedZoom = true;
    applyZoom(btn.dataset.zoom);
  });
}

autoZoomForViewport();
window.addEventListener('resize', autoZoomForViewport);

window.__arch = { ready: true, svg: page.querySelector('svg'), nodes: nodeRegistry.size };
</script>
</body>
</html>
