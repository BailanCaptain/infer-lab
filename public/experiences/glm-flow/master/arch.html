<!doctype html><html lang="zh"><head><meta charset="utf-8"><title>GLM-5.3-Flash 架构图</title>
<style>
html,body{margin:0;background:#f8f5ee;font-family:var(--journey-font-sans);color:#2b2823}
#page{position:relative}
svg{display:block}
svg text{font-family:var(--journey-font-sans)}

#views{position:fixed;right:16px;top:14px;font-size:13px;text-align:right;z-index:4}
#views div{margin-bottom:7px}
#views a{display:inline-block;margin-left:6px;padding:3px 10px;border:1px solid #b9b2a3;border-radius:12px;color:#4a463f;text-decoration:none;background:#f8f5ee}
#views a.on{background:#2b2823;color:#f8f5ee;border-color:#2b2823}

</style><link rel="stylesheet" href="../../typography.css"><link rel="stylesheet" href="../../reader-theme.css"><script>if(new URLSearchParams(location.search).get("site")==="1"||window.frameElement?.classList.contains("experience-frame"))document.documentElement.dataset.site="true";</script></head><body><div id="page"></div>
<script type="module">
// The 2D diagrams of GLM-5.3-Flash (the master, since 2026-09-24), in the manner of Sebastian Raschka's LLM Architecture Gallery:
// the whole model as one column on the left, each part of a layer drawn larger in a dotted panel on the right. The
// panels come from truth-spec.js through arch-layout.js (a box is a step of the official forward, an arrow a tensor
// from the step that writes it to a step that reads it); the colours are flow-colors.js's, shared with the 3D layers,
// using the approved palette.
import {makeArch} from './arch-draw.js';
import {loadPalette} from './flow-colors.js';

const INK='#2b2823',GREY='#6b665c';   // (the words on a filled box)

const cfg=(await (await fetch('../reference/official-config.json')).json()).text_config;
const P=loadPalette();
const {render}=makeArch(cfg,P);
const page=document.getElementById('page');
function paint(){for(const el of page.querySelectorAll('[data-comp]')){const k=el.dataset.comp;if(!k||!P[k])continue;
 for(const r of el.matches('rect,line,path')?[el]:el.querySelectorAll('rect')){const role=r.dataset.role;
  if(role==='res'){r.setAttribute(r.tagName==='line'?'stroke':'fill',P[k][0]);ink(r.parentNode,P[k][0])}else if(role==='wt'){r.setAttribute('fill',P[k][1]);r.setAttribute('stroke',P[k][0]);ink(r.parentNode,P[k][1])}else if(role==='op'){r.setAttribute('stroke',P[k][0])}else if(role==='res-stroke'){r.setAttribute('stroke',P[k][0]);r.setAttribute('fill',P[k][0])}}}}
// the words on a filled box: white on a dark fill, ink on a light one (Apple's saturated colours need white)
const lum=h=>{const c=[1,3,5].map(i=>parseInt(h.slice(i,i+2),16)/255).map(v=>v<=.04045?v/12.92:((v+.055)/1.055)**2.4);return .2126*c[0]+.7152*c[1]+.0722*c[2]};
function ink(g,fill){if(!g||!g.classList||!g.classList.contains('box'))return;   // a box's own words only (a stream's line sits in the whole drawing)
 const dark=lum(fill)<.36;for(const t of g.querySelectorAll('text.ttl'))t.setAttribute('fill',dark?'#ffffff':INK);for(const t of g.querySelectorAll('text.sub'))t.setAttribute('fill',dark?'#ffffffd9':GREY)}
page.innerHTML=render();paint();
const v=document.createElement('div');v.id='views';
v.innerHTML='<div>3D：<a href="model.html">整个模型</a><a href="flow.html?layer=0">L00</a><a href="flow.html?layer=4">L04</a><a href="flow.html?layer=3">L03</a></div>';
document.body.append(v);
window.__arch={ready:true,svg:page.querySelector('svg')};
</script></body></html>
