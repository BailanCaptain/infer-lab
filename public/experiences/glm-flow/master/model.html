<script type="module">
// The master (since 2026-09-25): the whole model on one page — model-spec.js lists it (the 45 layers, the MTP layer, the two

import {makeView} from './truth-view.js';

const Q=new URLSearchParams(location.search),VIEW=Q.get('view')||'whole',PAL=DEFAULT_PALETTE,W=+(Q.get('w')||innerWidth),H=+(Q.get('h')||innerHeight),EMBED=Q.get('embed')==='1',LEGEND=!EMBED;   // embed: the chapter page's right side (no title, legend, tabs or tuner; play.js takes commands)

const HEADS='z',M=modelSpec(cfg,T),SLABS='gap',L=layoutModel(M,{heads:HEADS,elide:Q.get('vocab')!=='full',gap:SLABS==='gap'?HEAD_GAP:0}),N=M.dims.N,LI=+(Q.get('layer')??3);

 whole:[all,'整个模型 · 一步生成',`一句话的 ${T} 个词从左上角的词表进来，复制成 4 路，往下走过 ${N} 层：每 ${P} 层一列（KDA、KDA、KDA、MLA 一个周期），共 ${COLS} 列，同一种层在同一行；一列走完，主干从列底绕到下一列的顶上。最后一列下面：4 路取平均、RMSNorm、输出头，选出下一个词；再下面是 MTP 层，用同一个输出头猜再下一个词。块都是真实大小`,V(.28,.22,1)],
 in:[IN,'开头：词 → 词表 → 4 路',`输入是上面 ${T} 个词的编号（卡片下那一细条）；词表从左边进（权重）：每个编号在词表里取自己那一行 ${M.dims.C} 个数，放进自己那一列 → 输出是词向量（${T} 列，一个词一列）。词向量复制成 4 份，就是第 0 层的输入（右边紫色那块，4 片往后叠）；第 0 层从它往左读：先算 24 个混合系数，把 4 路合成 1 路，再 RMSNorm`,V(.5,.42,1)],

label(WORDS.map(([w,id])=>`<span>${w}<i>${id}</i></span>`).join(''),V((B.ids.x0+B.ids.x1)/2,B.ids.y1+2,0),'t strip');

{const b=B.next_id;label('？<i>下一个词</i>',V((b.x0+b.x1)/2,b.y0-3,0),'b card q')}
{const b=B.draft_id;label('？<i>草稿</i>',V((b.x0+b.x1)/2,b.y0-3,0),'b card q')}
// an elided tensor: its left end, and the gap between its ends ('⋯')
const lft=b=>B[b.id+'/0']||b,gap=b=>{const a=B[b.id+'/0'];if(a)label('⋯',V((a.x1+b.x0)/2,(b.y0+b.y1)/2,0),'c big',true)};

{const b=B.W_embed,a=lft(b);label(`<b>词表</b> ${sh(b)}<br><i>${cut(b)} · 和输出头不共用</i>`,V(a.x0-3,(a.y0+a.y1)/2,0),'rr',true)}   // left of it: under it stands the first layer
rt(B.x0,'<b>词向量</b> <i>[6, 4096] → 复制成 4 路</i>',26);
{const b=B.W_head,a=lft(b);label(`<b>输出头</b> ${sh(b)}<br><i>${cut(b)} · 和词表不共用</i>`,V(a.x0-3,(a.y0+a.y1)/2,0),'rr',true)}

rt(B.h_n,'<i>主模型的隐藏状态 · RMSNorm</i>',20);rt(B.e_mtp,'<i>句子往后挪一个词，查同一张词表（这根箭头没画）</i>',20);rt(B.e_n,'<i>RMSNorm</i>',20);
tl(B.W_eh,'<b>eh_proj</b> <i>[4096, 8192]</i>');rt(B.h_mtp,'RMSNorm',20);
{const b=B[lid(N)+':residual_in'];label(`<b>MTP 层</b> <i>第 ${N} 层 · 一层 MLA + MoE · 只有 1 路，没有 mHC</i>`,V(b.x1+22,(b.y0+b.y1)/2,0),'r big',true)}
// the start, block by block (the user, 09-25: "春天来了是怎么变成词向量的……哪里是输入，哪里是输出"): the ids, layer 0's
// input and the first steps that read it

 rt(B.ids,'<i>编号（输入）</i>',4);
 rt(L0('residual_in'),'<b>第 0 层的输入</b> <i>4 路 [6, 4, 4096]：词向量复制 4 份</i>',3);

 lt(L0('x_attn'),'RMSNorm',6)}
// …far, only the ends' main names stay: the vocabulary, the output head, the MTP layer
for(const l of labels.slice(n0))if(!/^(词表|输出头|MTP 层)$/.test(l.el.querySelector('b')?.textContent||''))l.el.classList.add('minor');

for(let i=0;i<N;i++){const bs=layerBlocks(i),bx=box(bs);label(`<b>${lid(i)}</b>`,V(bx.x0,bx.y1+3,0),'tl',true)}
for(let r=0;r<P;r++){const bs=layerBlocks(r),bx=box(bs),x=Math.min(...WB.filter(b=>b.layer!==undefined&&b.layer<N).map(b=>b.x0));label(`<b>${{kda:'KDA',mla:'MLA'}[M.layers[r+P].attnKind]}</b><br><i>${r===P-1?'稀疏注意力':'线性注意力'}</i>`,V(x-30,(bx.y0+bx.y1)/2,0),'rr big')}

 v.innerHTML=`<div>${[['whole','整个'],['in','开头'],['out','结尾 · MTP'],['layer','一层']].map(([k,n])=>`<a class="${VIEW===k?'on':''}" href="${q({view:k})}">${n}</a>`).join('')}</div>`
  +`<div>词表、输出头：${[['elide','省略画法'],['full','真实长度']].map(([k,n])=>`<a class="${(Q.get('vocab')||'elide')===k?'on':''}" href="${q({vocab:k})}">${n}</a>`).join('')}</div>`
  +(VIEW==='layer'?`<div>${[0,3,4,44,45].map(k=>`<a class="${LI===k?'on':''}" href="${q({layer:k})}">${lid(k)}</a>`).join('')}</div>`:'')

const UI=()=>['title','legend','views','hint','dotcard','dotpill'].map(id=>document.getElementById(id)).filter(Boolean);

function lod(){const t=controls.target,a=t.clone().project(camera),c=t.clone().add(V(100,0,0)).project(camera);host.classList.toggle('far',(c.x-a.x)/2*W/100<.3)}
// only what the camera can see is drawn (the whole model is 5606 things to draw; close to one layer, a few hundred): each
// block and arrow is a sphere, grown by what the "at least 3 px" can add at its distance (09-26: playing a segment was
// 9 ms a frame on draw calls alone, and the user saw it stutter)
const CULL=[],FRU=new THREE.Frustum(),PM=new THREE.Matrix4(),SPH=new THREE.Sphere(),MINPX=3;
for(const m of look.meshes){const b=m.userData.block;CULL.push([m,V((b.x0+b.x1)/2,(b.y0+b.y1)/2,(b.z0+b.z1)/2),Math.hypot(b.x1-b.x0,b.y1-b.y0,b.z1-b.z0)/2])}
for(const a of ARROWS){a.m.geometry.computeBoundingSphere();const s=a.m.geometry.boundingSphere;CULL.push([a.m,s.center.clone(),s.radius])}
for(const [o] of CULL)o.frustumCulled=false;
function cull(){camera.updateMatrixWorld();FRU.setFromProjectionMatrix(PM.multiplyMatrices(camera.projectionMatrix,camera.matrixWorldInverse));
 const k=2*2*MINPX/(camera.projectionMatrix.elements[5]*H);   // world units a MINPX grows by, per unit of distance (twice, to be safe)
 for(const c of CULL){SPH.center.copy(c[1]);SPH.radius=c[2]+camera.position.distanceTo(c[1])*k;c[0].visible=FRU.intersectsSphere(SPH)}}
let frameRequest=0;
function frame(){if(!frameRequest)frameRequest=requestAnimationFrame(()=>{frameRequest=0;renderFrame()})}
function renderFrame(){cull();renderer.render(scene,camera);lod();place();hideUnderUI()}
controls.addEventListener('change',frame);frame();

for(const a of ARROWS)a.base=a.m.material.color.clone();
window.__truth={spec:M,layout:L,camera,controls,frame,renderer,scene,place,ready:true};
if(EMBED){const [{attachPlayer},{loadDemo}]=await Promise.all([import('./play.js'),import('./demo-data.js')]);window.__player=attachPlayer({look,B,WB,M,ARROWS,camera,controls,fit,place,frame,label,V,host,demo:await loadDemo(),words:WORDS.map(w=>w[0])})}
</script></body></html>
