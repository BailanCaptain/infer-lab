const lft=b=>B[b.id+'/0']||b,gap=b=>{const a=B[b.id+'/0'];if(a){const el=label('⋯',V((a.x1+b.x0)/2,(b.y0+b.y1)/2,0),'c big elided-gap');el.dataset.elidedFor=b.id;ELIDED_GAPS.set(b.id,el)}};

const rin0=B[lid(0)+':residual_in'],outN=B[lid(N-1)+':residual_out'],bMtp=B[lid(N)+':residual_in'];

 lt(lft(B.logits),'<b>分数</b> <i>只算最后一个词</i>',13);lt(lft(B.probs),'<b>概率</b> <i>softmax</i>',13);lt(lft(B.logits_mtp),'<b>MTP 的分数</b> <i>同一个输出头</i>',13);

 label('RMSNorm',V(ox,(B.h_final.y0+B.h_final.y1)/2,oz),'r',true);
 label('<i>主模型的隐藏状态 · RMSNorm</i>',V(ox,(B.h_n.y0+B.h_n.y1)/2,oz),'r',true);
 label('<i>前 5 列放第 2–6 词<br>末列接刚选出的词（共查词表）</i>',V(omx,(B.e_mtp.y0+B.e_mtp.y1)/2,oz),'r',true);
 label('<i>RMSNorm</i>',V(omx,(B.e_n.y0+B.e_n.y1)/2,oz),'r',true);
 label('<b>eh_proj</b> <i>[4096, 8192]</i>',V(lft(B.W_head).x0-13,(B.W_eh.y0+B.W_eh.y1)/2,B.W_eh.z0),'rr',true);
 label('RMSNorm',V(ox,(B.h_mtp.y0+B.h_mtp.y1)/2,oz),'r',true);
}
if(showOut||(VIEW==='layer'&&LI===N)){label(`<b>MTP 层</b><br><i>第 ${N} 层 · MLA + MoE（1 路，无 mHC）</i>`,V(outN.x1+48,(bMtp.y0+bMtp.y1)/2,outN.z0),'r big mtp-head',true);mtpHeadEntry=labels.at(-1)}
if(!EMBED&&(VIEW==='in'||(VIEW==='layer'&&LI===0))){const L0=id=>B[lid(0)+':'+id];
 if(VIEW==='in')label('<i>编号（输入）</i>',V(rin0.x1+3,(B.ids.y0+B.ids.y1)/2,rin0.z0),'r',true);
 rt(L0('residual_in'),'<b>第 0 层的输入</b> <i>4 路 [6, 4, 4096]：词向量复制 4 份</i>',3);
 label('<i>fn：4 路 → 24 个混合系数</i>',V(L0('base_attn').x0-3,(L0('base_attn').y0+L0('base_attn').y1)/2,0),'rr in-micro',true);
 label('合成 1 路',V(rin0.x1+3,(L0('collapsed_attn').y0+L0('collapsed_attn').y1)/2,rin0.z0),'r in-micro',true);
 label('RMSNorm',V(rin0.x1+3,(L0('x_attn').y0+L0('x_attn').y1)/2,rin0.z0),'r in-micro',true)}
for(const l of labels.slice(n0))if(!/^(词表|输出头|MTP 层)$/.test(l.el.querySelector('b')?.textContent||'')&&!l.el.classList.contains('elided-gap'))l.el.classList.add('minor');
if(showWhole){
 for(let i=0;i<N;i++){const bs=layerBlocks(i),bx=box(bs),cls=i%P!==0?'tl layer-mid':[0,20,44].includes(i)?'tl':'tl layer-col-mid';label(`<b>${lid(i)}</b>`,V(bx.x0,bx.y1+3.5,bx.z0),cls,true)}
 for(let r=0;r<P;r++){const bs=layerBlocks(r),bx=box(bs),x=Math.min(...WB.filter(b=>b.layer!==undefined&&b.layer<N).map(b=>b.x0));label(`<b>${{kda:'KDA',mla:'MLA'}[M.layers[r+P].attnKind]}</b><br><i>${r===P-1?'稀疏注意力':'线性注意力'}</i>`,V(x-30,(bx.y0+bx.y1)/2,0),'rr big')}
}else if(VIEW==='layer'&&LI<N){
 const bx=box(layerBlocks(LI));label(`<b>${lid(LI)}</b>`,V(bx.x0+4,bx.y1-8,0),'bl big',true);
}

fit(fbox,dir,.9,[0,0]);
const present=[...new Set(WB.map(b=>b.comp))];
if(LEGEND){const lg=document.createElement('div');lg.id='legend';lg.innerHTML=`一个词一列 · 张量按真实尺寸绘制 · 同组深浅双阶区分结果与权重<br>${present.map(k=>`<span class="k" style="background:linear-gradient(135deg,${look.palette[k][0]} 52%,${look.palette[k][1]} 52%);border-color:${mix(look.palette[k][0],ACCENTS[k]||'#4a5852',.42)}"></span>${NAMES[k]||k}`).join('')}`;host.append(lg)}
if(!EMBED){const v=document.createElement('div');v.id='views';const q=o=>'?'+new URLSearchParams({...Object.fromEntries(Q),...o});
 v.innerHTML=`<div>${[['whole','整个'],['in','开头'],['out','结尾 · MTP'],['layer','一层']].map(([k,n])=>`<a class="${VIEW===k?'on':''}" href="${q({view:k})}">${n}</a>`).join('')}</div>`
  +`<div>词表、输出头：${[['elide','省略画法'],['full','真实长度']].map(([k,n])=>`<a class="${(Q.get('vocab')||'elide')===k?'on':''}" href="${q({vocab:k})}">${n}</a>`).join('')}</div>`
  +(VIEW==='layer'?`<div>${[0,3,4,44,45].map(k=>`<a class="${LI===k?'on':''}" href="${q({layer:k})}">${lid(k)}</a>`).join('')}</div>`:'')
  +`<div><a href="flow.html">单层页</a><a href="arch.html">2D 架构图</a></div>`;host.append(v)}

let onAfterRender=null,onResize=null;
function syncOverview(){
 const far=host.classList.contains('far');
 if(outHeadEntry){const a=lft(B.W_head);outHeadEntry.p.set(a.x0-(far?45:13),far?a.y0-4:(a.y0+a.y1)/2,a.z0)}
 if(vocabEntry){const a=lft(B.W_embed);vocabEntry.p.set(a.x0-(far?36:4),(a.y0+a.y1)/2,a.z0);vocabEntry.nudge=!far}
 if(mtpHeadEntry)mtpHeadEntry.p.set(far?bMtp.x1+22:outN.x1+48,(bMtp.y0+bMtp.y1)/2,far?0:outN.z0);
}
const stripEntry=stripEl?labels.find(l=>l.el===stripEl):null;
function clampVocab(){
 if(!vocabEntry||!stripEntry||!host.classList.contains('far')||!stripEntry.vis||!vocabEntry.vis)return;
 const sr=stripEntry.rect,vr=vocabEntry.rect;
 if(sr&&vr&&vr.right>sr.left-6){
  const roomLeft=sr.left-6;
  const tx=roomLeft>=4+vocabEntry.w?roomLeft:Math.max(4+vocabEntry.w,sr.left+vocabEntry.w);
  const ty=roomLeft>=4+vocabEntry.w?(sr.top+sr.bottom)/2:(sr.bottom+vocabEntry.h/2+4);
  vocabEl.style.translate=tx+'px '+ty+'px';
  vocabEntry.rect={left:tx-vocabEntry.w,right:tx,top:ty-vocabEntry.h/2,bottom:ty+vocabEntry.h/2};
 }
}
const _lodA=new THREE.Vector3(),_lodC=new THREE.Vector3();
function lod(){
 const t=controls.target;
 _lodA.copy(t).project(camera);
 _lodC.copy(t);_lodC.x+=100;_lodC.project(camera);
 const ppu=(_lodC.x-_lodA.x)/2*W/100;
 host.classList.toggle('far',ppu<.3);
 host.classList.toggle('ultrafar',ppu<.11);
 host.classList.toggle('compact-in',VIEW==='in'&&ppu<.55);
 syncOverview();
}
lod();settle(l=>!l.el.classList.contains('card')&&((VIEW==='whole'||VIEW==='in')||!l.el.classList.contains('strip'))&&l.vis,lod);lod();clampVocab();
if(EMBED){const h=document.createElement('div');h.id='hint';h.textContent='拖动旋转 · 滚轮缩放 · 右键平移';document.body.append(h)}

// Two-level hierarchical frustum culling: test 46 layer spheres first, then individual blocks only inside visible layers.
const LAYER_GROUPS=new Map(),END_CULL=[],FRU=new THREE.Frustum(),PM=new THREE.Matrix4(),SPH=new THREE.Sphere(),MINPX=3;
for(const m of look.meshes){
 const b=m.userData.block,item=[m,V((b.x0+b.x1)/2,(b.y0+b.y1)/2,(b.z0+b.z1)/2),Math.hypot(b.x1-b.x0,b.y1-b.y0,b.z1-b.z0)/2];
 m.frustumCulled=false;
 if(b.layer!==undefined){
  if(!LAYER_GROUPS.has(b.layer))LAYER_GROUPS.set(b.layer,{items:[],wasVis:true});
  LAYER_GROUPS.get(b.layer).items.push(item);
 }else END_CULL.push(item);
}
for(const [li,g] of LAYER_GROUPS){
 const bx=box(layerBlocks(li));
 g.center=V((bx.x0+bx.x1)/2,(bx.y0+bx.y1)/2,(bx.z0+bx.z1)/2);
 g.radius=Math.hypot(bx.x1-bx.x0,bx.y1-bx.y0,bx.z1-bx.z0)/2;
}
function cull(){
 camera.updateMatrixWorld();
 FRU.setFromProjectionMatrix(PM.multiplyMatrices(camera.projectionMatrix,camera.matrixWorldInverse));
 const k=4*MINPX/(camera.projectionMatrix.elements[5]*H);
 for(const g of LAYER_GROUPS.values()){
  SPH.center.copy(g.center);
  SPH.radius=g.radius+camera.position.distanceTo(g.center)*k;
  if(!FRU.intersectsSphere(SPH)){
   if(g.wasVis){for(let i=0;i<g.items.length;i++)g.items[i][0].visible=false;g.wasVis=false}
   continue;
  }
  g.wasVis=true;
  for(let i=0;i<g.items.length;i++){
   const c=g.items[i];SPH.center.copy(c[1]);SPH.radius=c[2]+camera.position.distanceTo(c[1])*k;
   c[0].visible=FRU.intersectsSphere(SPH);
  }
 }
 for(let i=0;i<END_CULL.length;i++){
  const c=END_CULL[i];SPH.center.copy(c[1]);SPH.radius=c[2]+camera.position.distanceTo(c[1])*k;
  c[0].visible=FRU.intersectsSphere(SPH);
 }
}

let frameRequest=0;
function frame(){if(!frameRequest&&!document.hidden)frameRequest=requestAnimationFrame(()=>{frameRequest=0;renderFrame()})}
function renderFrame(){cull();renderer.render(scene,camera);lod();place();clampVocab();hideUnderUI();if(onAfterRender)onAfterRender()}
controls.addEventListener('change',frame);
document.addEventListener('visibilitychange',()=>{if(document.hidden&&frameRequest){cancelAnimationFrame(frameRequest);frameRequest=0}else if(!document.hidden)frame()});

function resizeStage(nw,nh){
 nw=Math.max(120,Math.round(nw));nh=Math.max(120,Math.round(nh));
 if(nw===W&&nh===H)return;
 W=nw;H=nh;
 host.style.width=W+'px';host.style.height=H+'px';
 const pr=pixelRatioFor(W,H);
 renderer.setPixelRatio(pr);renderer.setSize(W,H);
 camera.aspect=W/H;camera.updateProjectionMatrix();
 look.setResolution(pr,H);
 viewApi.resize(W,H);
 if(onResize)onResize(W,H);
 else if(!EMBED){settle(l=>!l.el.classList.contains('card')&&((VIEW==='whole'||VIEW==='in')||!l.el.classList.contains('strip'))&&l.vis,lod);lod();clampVocab()}
 frame();
}
if(!EMBED)addEventListener('resize',()=>resizeStage(innerWidth,innerHeight));
document.fonts?.ready.then(()=>{viewApi.invalidate();frame()});
frame();

window.__truth={spec:M,layout:L,look,camera,controls,frame,renderer,scene,place,resizeStage,ready:true};
if(EMBED){
 const [{attachPlayer},{loadDemo}]=await Promise.all([import('./play.js'),import('./demo-data.js')]);
 window.__player=attachPlayer({look,B,WB,M,ARROWS,arrowBatch,ELIDED_GAPS,camera,controls,fit,place,hideUnderUI,labels,frame,label,V,host,demo:await loadDemo(),words:WORDS.map(w=>w[0]),wordIds:WORDS.map(w=>w[1]),resizeStage,setAfterRender:fn=>{onAfterRender=fn},setOnResize:fn=>{onResize=fn}});
}
