  #app:not(.solo){grid-template-columns:1fr;grid-template-rows:minmax(260px,46%) minmax(0,1fr)}

  #stage>#title{position:relative;left:auto;top:auto;max-width:none;width:calc(100% - 16px);margin:8px 8px 0;padding:6px 10px;font-size:15px}

  #stage>#views div{justify-content:flex-start}
  #dotcard{top:auto;bottom:86px;max-width:calc(100% - 20px)}
  #dotpill{display:none}
}

<script type="module">
import { ACCENTS, PALETTES, mix } from '../../glm-flow/master/flow-colors.js';
import { renderQwenArch } from './qwen-arch.js';
import { QWEN_MODELS, QWEN_PARTS, QWEN_SEGMENTS, TOTAL_DURATION, getQwenVariant, segDuration } from './qwen-spec.js';
import { mountQwenStage } from './qwen-stage.js';

const params = new URLSearchParams(location.search);
const viewId = ['play', 'model', 'layer', 'arch'].includes(params.get('view')) ? params.get('view') : 'play';
let variant = getQwenVariant(params.get('variant'));
const root = document.getElementById('root');
root.style.width = '100%';
root.style.height = '100%';

const fmt = (sec) => {
  const s = Math.max(0, Math.floor(sec));
  return `${String(Math.floor(s / 60)).padStart(2, '0')}:${String(s % 60).padStart(2, '0')}`;
};

let activeStage = null;
function unmountStage() {
  if (activeStage) { activeStage.dispose(); activeStage = null; }
}

function setVariant(next) {
  const nv = getQwenVariant(next);
  if (nv === variant) return;
  variant = nv;
  const u = new URL(location.href);
  u.searchParams.set('variant', variant);
  history.replaceState(null, '', u.toString());
  boot();
}

function bootArch() {
  unmountStage();
  root.innerHTML = '<div id="arch-root" style="width:100%;height:100%"></div>';
  renderQwenArch(document.getElementById('arch-root'), { variant, onVariantChange: setVariant });
}

function bootSolo(mode) {
  unmountStage();
  root.innerHTML = '<div id="app" class="solo"><div id="solo-stage"><div id="stage"></div></div></div>';
  window.__truth = { ready: false, variant, mode };
  activeStage = mountQwenStage({
    host: document.getElementById('stage'),
    mode,
    variant,
    onVariantChange: setVariant,
    onFirstFrame() { window.__truth = { ready: true, variant, mode }; },
  });
}

function bootPlay() {
  unmountStage();
  const spec = QWEN_MODELS[variant];
  const P = PALETTES.user;
  root.innerHTML = `<div id="app"><div id="left"><div id="scroll"></div><div id="bar"></div></div><div id="right"><div id="stage"></div></div></div>`;
  const scroll = document.getElementById('scroll');
  const bar = document.getElementById('bar');

  const mapBoxes = QWEN_SEGMENTS.map((s) =>
    `<div class="mbox" data-n="${s.n}" style="background:${mix(P[s.comp][0], '#fcfcfa', 0.34)};border-color:${mix(P[s.comp][0], ACCENTS[s.comp] || '#4a5852', 0.44)}">${String(s.n).padStart(2, '0')} ${s.title.slice(0, 6)}</div>`
  ).join('');

  const partsHtml = QWEN_PARTS.map((p) => {
    const segs = QWEN_SEGMENTS.filter((s) => s.part === p.id).map((s) => {
      const flow = variant === '30b-a3b' ? s.flow30b : s.flow8b;
      const beatsHtml = s.beats.map((b, bi) => `<li data-seg="${s.n}" data-beat="${bi}">${b.text}</li>`).join('');
      return `<article class="seg" id="s${s.n}" data-n="${s.n}">
        <div class="hd" data-show="${s.n}"><span class="n">${String(s.n).padStart(2, '0')}</span><span class="t">${s.title}</span></div>
        <div class="flow">${flow.map((f) => `<span>${f}</span>`).join('<em>→</em>')}</div>
        <p>${s.summary}</p>
        <ol class="beats">${beatsHtml}</ol>
        <div class="go"><button type="button" class="btn primary" data-play="${s.n}">播放本段</button><button type="button" class="btn" data-show="${s.n}">定位张量</button></div>
      </article>`;
    }).join('');
    return `<h2 class="part"><span>${p.tag}</span>${p.title}</h2>${segs}`;
  }).join('');

  scroll.innerHTML = `
    <div class="kicker">${spec.badge} · ${spec.name}</div>
    <h1 class="head">${spec.name} 完整前向推理演示</h1>
    <p class="sub">${spec.tagline}；KV Cache ${spec.kvKiBPerTokenTotal} KiB/token。</p>
    <div class="var-bar">
      <button type="button" class="btn ${variant === '8b' ? 'on' : ''}" data-variant="8b">Qwen3-8B (Dense)</button>
      <button type="button" class="btn ${variant === '30b-a3b' ? 'on' : ''}" data-variant="30b-a3b">Qwen3-30B-A3B (MoE 对照)</button>
    </div>
    <section id="map"><div class="mh"><b>16 步计算导航</b><span>点击任意步骤聚焦三维张量</span></div><div class="mgrid">${mapBoxes}</div></section>
    ${partsHtml}
  `;

  bar.innerHTML = `
    <div class="r">
      <button type="button" class="btn primary" id="play">播放</button>
      <button type="button" class="btn" id="prev">上一段</button>
      <button type="button" class="btn" id="next">下一段</button>
      <button type="button" class="btn" id="whole">整模型</button>
      <div class="now" id="bar-now"><i>00</i>整模型总览</div>
      <span id="time">00:00 / ${fmt(TOTAL_DURATION)}</span>
    </div>
    <div class="say" id="bar-say">点击任意段落或「播放」，观察单路残差、GQA、QK-Norm、RoPE 与前馈计算。</div>
    <div id="prog"><i id="prog-fill" style="width:0%"></i></div>
  `;

  let curSeg = 0; // 0 = whole model overview
  let curBeat = 0;
  let elapsed = 0;
  let playing = false;
  let lastTs = 0;
  let clockRaf = 0;

  const segStarts = [];
  let acc = 0;
  for (const s of QWEN_SEGMENTS) { segStarts.push(acc); acc += segDuration(s); }

  const state = { ready: false, playing: false, seg: 0, variant };
  const pause = () => {
    playing = false;
    state.playing = false;
    cancelAnimationFrame(clockRaf);
    const playBtn = document.getElementById('play');
    if (playBtn) playBtn.textContent = '播放';
  };
  window.__chapter = { state, send(msg) { if (msg?.cmd === 'pause') pause(); } };

  function syncUI(beatFrac = 0.5) {
    document.querySelectorAll('.seg').forEach((el) => el.classList.toggle('cur', Number(el.dataset.n) === curSeg));
    document.querySelectorAll('.mbox').forEach((el) => el.classList.toggle('cur', Number(el.dataset.n) === curSeg));
    document.querySelectorAll('.beats li').forEach((el) => {
      el.classList.toggle('now', Number(el.dataset.seg) === curSeg && Number(el.dataset.beat) === curBeat);
    });
    const seg = QWEN_SEGMENTS[curSeg - 1] || null;
    document.getElementById('bar-now').innerHTML = seg ? `<i>${String(seg.n).padStart(2, '0')}</i>${seg.title}` : '<i>00</i>整模型总览';
    document.getElementById('bar-say').textContent = seg ? (seg.beats[curBeat]?.text || seg.summary) : '整模型总览：可拖拽旋转，或点击段落聚焦计算。';
    document.getElementById('time').textContent = `${fmt(elapsed)} / ${fmt(TOTAL_DURATION)}`;
    document.getElementById('prog-fill').style.width = `${Math.min(100, (elapsed / TOTAL_DURATION) * 100)}%`;
    state.seg = curSeg;
    if (activeStage) {
      if (seg) activeStage.focusSegment(seg, curBeat, beatFrac);
      else activeStage.showWhole();
    }
  }

  function locateTime(t) {
    elapsed = Math.max(0, Math.min(TOTAL_DURATION, t));
    for (let i = 0; i < QWEN_SEGMENTS.length; i++) {
      const s = QWEN_SEGMENTS[i];
      const d = segDuration(s);
      if (elapsed <= segStarts[i] + d || i === QWEN_SEGMENTS.length - 1) {
        curSeg = s.n;
        let rem = elapsed - segStarts[i];
        curBeat = 0;
        let bf = 0;
        for (let b = 0; b < s.beats.length; b++) {
          if (rem <= s.beats[b].dur || b === s.beats.length - 1) {
            curBeat = b;
            bf = Math.min(1, Math.max(0, rem / s.beats[b].dur));
            break;
          }
          rem -= s.beats[b].dur;
        }
        syncUI(bf);
        return;
      }
    }
  }

  function tick(ts) {
    if (!playing) return;
    const dt = lastTs ? Math.min(0.12, (ts - lastTs) / 1000) : 0.016;
    lastTs = ts;
    if (elapsed + dt >= TOTAL_DURATION) { locateTime(TOTAL_DURATION); pause(); return; }
    locateTime(elapsed + dt);
    clockRaf = requestAnimationFrame(tick);
  }

  function startPlay(fromSeg = null) {
    if (fromSeg !== null) {
      elapsed = segStarts[fromSeg - 1] ?? 0;
      locateTime(elapsed);
    } else if (curSeg === 0 || elapsed >= TOTAL_DURATION - 0.05) {
      elapsed = 0;
      locateTime(0);
    }
    playing = true;
    state.playing = true;
    lastTs = 0;
    document.getElementById('play').textContent = '暂停';
    clockRaf = requestAnimationFrame(tick);
  }

  scroll.addEventListener('click', (ev) => {
    const vbtn = ev.target.closest('button[data-variant]');
    if (vbtn) { pause(); setVariant(vbtn.dataset.variant); return; }
    const playEl = ev.target.closest('[data-play]');
    if (playEl) { startPlay(Number(playEl.dataset.play)); return; }
    const showEl = ev.target.closest('[data-show], .mbox');
    if (showEl) {
      pause();
      const n = Number(showEl.dataset.show || showEl.dataset.n);
      locateTime(segStarts[n - 1] ?? 0);
      document.getElementById(`s${n}`)?.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
      return;
    }
    const beatEl = ev.target.closest('.beats li');
    if (beatEl) {
      pause();
      const n = Number(beatEl.dataset.seg);
      const bi = Number(beatEl.dataset.beat);
      const seg = QWEN_SEGMENTS[n - 1];
      let t = segStarts[n - 1] ?? 0;
      for (let i = 0; i < bi; i++) t += seg.beats[i].dur;
      locateTime(t + 0.05);
    }
  });

  document.getElementById('play').addEventListener('click', () => (playing ? pause() : startPlay()));
  document.getElementById('whole').addEventListener('click', () => { pause(); curSeg = 0; curBeat = 0; elapsed = 0; syncUI(0); });
  document.getElementById('prev').addEventListener('click', () => { const n = Math.max(1, (curSeg || 1) - 1); pause(); locateTime(segStarts[n - 1]); });
  document.getElementById('next').addEventListener('click', () => { const n = Math.min(QWEN_SEGMENTS.length, curSeg + 1); startPlay(n); });
  document.getElementById('prog').addEventListener('click', (ev) => {
    const r = ev.currentTarget.getBoundingClientRect();
    const frac = Math.min(1, Math.max(0, (ev.clientX - r.left) / r.width));
    locateTime(frac * TOTAL_DURATION);
  });

  activeStage = mountQwenStage({
    host: document.getElementById('stage'),
    mode: 'play',
    variant,
    onVariantChange: (v) => { pause(); setVariant(v); },
    onFirstFrame() { state.ready = true; },
  });
}

function boot() {
  if (viewId === 'arch') bootArch();
  else if (viewId === 'model') bootSolo('model');
  else if (viewId === 'layer') bootSolo('layer');
  else bootPlay();
}
boot();
</script></body></html>
