<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 520" width="900" height="520" role="img" aria-label="ACL Graph 两轮共用同一固定基址 4×3 块表的 6 格与 3 格活跃覆写及固定输出地址" font-family="var(--font-sans)">
<title>ACL Graph 固定基址缓冲：两轮共用 4×3 块表（6 格 vs 3 格活跃写入）与固定输出地址</title>
<desc>展示两轮回放共用同一固定基址的 4×3 块表缓冲：第 k 轮活跃 2 行写入 6 格、虚线保留后 2 行；第 k+1 轮活跃 1 行仅写入 3 格、虚线保留后 3 行；图回放读写固定基址并将结果落回固定输出地址。</desc>
<defs>
  <marker id="ab-teal" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
    <path d="M1 1.5L8.5 5L1 8.5Z" fill="#087f73"/>
  </marker>
  <marker id="ab-amber" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
    <path d="M1 1.5L8.5 5L1 8.5Z" fill="#c78300"/>
  </marker>
  <marker id="ab-indigo" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
    <path d="M1 1.5L8.5 5L1 8.5Z" fill="#4c65b6"/>
  </marker>
</defs>

<text x="18" y="31" font-size="16" font-weight="700" fill="#17211f">ACL Graph 固定地址约定：两轮共用同一基址 4×3 块表，仅覆写活跃行并回放固定输出地址</text>

<!-- Step k Band (Left-Center: Active 2 Rows = 6 Cells) -->
<rect x="14" y="46" width="582" height="202" rx="10" fill="#fbfaf6" stroke="#087f73" stroke-width="1.3"/>
<circle cx="36" cy="69" r="11" fill="#087f73"/>
<text x="36" y="73.5" text-anchor="middle" font-size="12.5" font-weight="700" fill="#ffffff">1</text>
<text x="54" y="74" font-size="14.5" font-weight="700" fill="#17211f">第 k 轮：活跃 2 行（覆写 6 格）· 同一块表基址 0x1000_8000</text>

<rect x="26" y="90" width="176" height="144" rx="7" fill="#ddf4ef" stroke="#087f73" stroke-width="1.2"/>
<text x="114" y="113" text-anchor="middle" font-size="12.5" font-weight="700" fill="#065f56">第 k 轮准备输入</text>
<text x="114" y="136" text-anchor="middle" font-family="var(--font-mono)" font-size="12" fill="#17211f">num_reqs = 2</text>
<text x="114" y="158" text-anchor="middle" font-family="var(--font-mono)" font-size="12" fill="#065f56">R0: [7, 3, 9]</text>
<text x="114" y="180" text-anchor="middle" font-family="var(--font-mono)" font-size="12" fill="#065f56">R1: [2, 5, 8]</text>
<text x="114" y="204" text-anchor="middle" font-family="var(--font-mono)" font-size="12" font-weight="700" fill="#065f56">commit_block_table</text>
<text x="114" y="223" text-anchor="middle" font-size="12" fill="#4d5652">同轮更新 token / pos</text>

<line x1="202" y1="162" x2="220" y2="162" stroke="#087f73" stroke-width="1.7" marker-end="url(#ab-teal)"/>

<rect x="222" y="90" width="360" height="144" rx="7" fill="#ffffff" stroke="#087f73" stroke-width="1.2"/>
<text x="402" y="110" text-anchor="middle" font-family="var(--font-mono)" font-size="12" font-weight="700" fill="#065f56">block_table @ 0x1000_8000 [4×3]</text>
<!-- 4x3 Grid for Step k: Rows 0,1 colored (6 cells); Rows 2,3 dashed reserved -->
<g stroke-width="1.2" font-family="var(--font-mono)" font-size="12" font-weight="700" text-anchor="middle">
  <rect x="236" y="118" width="38" height="24" rx="3" fill="#b8efe4" stroke="#087f73"/><text x="255" y="134.5" fill="#065f56">7</text>
  <rect x="278" y="118" width="38" height="24" rx="3" fill="#b8efe4" stroke="#087f73"/><text x="297" y="134.5" fill="#065f56">3</text>
  <rect x="320" y="118" width="38" height="24" rx="3" fill="#b8efe4" stroke="#087f73"/><text x="339" y="134.5" fill="#065f56">9</text>

  <rect x="236" y="146" width="38" height="24" rx="3" fill="#b8efe4" stroke="#087f73"/><text x="255" y="162.5" fill="#065f56">2</text>
  <rect x="278" y="146" width="38" height="24" rx="3" fill="#b8efe4" stroke="#087f73"/><text x="297" y="162.5" fill="#065f56">5</text>
  <rect x="320" y="146" width="38" height="24" rx="3" fill="#b8efe4" stroke="#087f73"/><text x="339" y="162.5" fill="#065f56">8</text>

  <rect x="236" y="174" width="38" height="24" rx="3" fill="#ece9df" stroke="#b8bcb5" stroke-dasharray="4 3"/><text x="255" y="190.5" fill="#66716d">·</text>
  <rect x="278" y="174" width="38" height="24" rx="3" fill="#ece9df" stroke="#b8bcb5" stroke-dasharray="4 3"/><text x="297" y="190.5" fill="#66716d">·</text>
  <rect x="320" y="174" width="38" height="24" rx="3" fill="#ece9df" stroke="#b8bcb5" stroke-dasharray="4 3"/><text x="339" y="190.5" fill="#66716d">·</text>

  <rect x="236" y="202" width="38" height="24" rx="3" fill="#ece9df" stroke="#b8bcb5" stroke-dasharray="4 3"/><text x="255" y="218.5" fill="#66716d">·</text>
  <rect x="278" y="202" width="38" height="24" rx="3" fill="#ece9df" stroke="#b8bcb5" stroke-dasharray="4 3"/><text x="297" y="218.5" fill="#66716d">·</text>
  <rect x="320" y="202" width="38" height="24" rx="3" fill="#ece9df" stroke="#b8bcb5" stroke-dasharray="4 3"/><text x="339" y="218.5" fill="#66716d">·</text>
</g>
<g font-size="12" text-anchor="start">
  <text x="370" y="134.5" font-weight="700" fill="#065f56">行 0 · 本轮写入</text>
  <text x="370" y="162.5" font-weight="700" fill="#065f56">行 1 · 本轮写入（共 6 格）</text>
  <text x="370" y="190.5" fill="#66716d">行 2 · 虚线保留未覆写</text>
  <text x="370" y="218.5" fill="#66716d">行 3 · 虚线保留未覆写</text>
</g>
<!-- Step k+1 Band (Left-Center: Active 1 Row = 3 Cells) -->
<rect x="14" y="260" width="582" height="202" rx="10" fill="#fbfaf6" stroke="#c78300" stroke-width="1.3"/>
<circle cx="36" cy="283" r="11" fill="#c78300"/>
<text x="36" y="287.5" text-anchor="middle" font-size="12.5" font-weight="700" fill="#ffffff">2</text>
<text x="54" y="288" font-size="14.5" font-weight="700" fill="#17211f">第 k+1 轮：活跃 1 行（仅覆写 3 格）· 仍写同一基址 0x1000_8000</text>

<rect x="26" y="304" width="176" height="144" rx="7" fill="#fff4cf" stroke="#c78300" stroke-width="1.2"/>
<text x="114" y="327" text-anchor="middle" font-size="12.5" font-weight="700" fill="#936300">第 k+1 轮准备输入</text>
<text x="114" y="350" text-anchor="middle" font-family="var(--font-mono)" font-size="12" fill="#17211f">num_reqs = 1</text>
<text x="114" y="374" text-anchor="middle" font-family="var(--font-mono)" font-size="12" font-weight="700" fill="#936300">R0: [4, 6, 1]</text>
<text x="114" y="400" text-anchor="middle" font-size="12" fill="#936300">仅复制活跃前 1 行</text>
<text x="114" y="423" text-anchor="middle" font-size="12" fill="#4d5652">无需重写整块缓冲</text>

<line x1="202" y1="376" x2="220" y2="376" stroke="#c78300" stroke-width="1.7" marker-end="url(#ab-amber)"/>

<rect x="222" y="304" width="360" height="144" rx="7" fill="#ffffff" stroke="#c78300" stroke-width="1.2"/>
<text x="402" y="324" text-anchor="middle" font-family="var(--font-mono)" font-size="12" font-weight="700" fill="#936300">block_table @ 0x1000_8000 [4×3]</text>
<!-- 4x3 Grid for Step k+1: Row 0 colored (3 cells); Rows 1..3 dashed -->
<g stroke-width="1.2" font-family="var(--font-mono)" font-size="12" font-weight="700" text-anchor="middle">
  <rect x="236" y="332" width="38" height="24" rx="3" fill="#fde598" stroke="#c78300"/><text x="255" y="348.5" fill="#936300">4</text>
  <rect x="278" y="332" width="38" height="24" rx="3" fill="#fde598" stroke="#c78300"/><text x="297" y="348.5" fill="#936300">6</text>
  <rect x="320" y="332" width="38" height="24" rx="3" fill="#fde598" stroke="#c78300"/><text x="339" y="348.5" fill="#936300">1</text>

  <rect x="236" y="360" width="38" height="24" rx="3" fill="#ece9df" stroke="#b8bcb5" stroke-dasharray="4 3"/><text x="255" y="376.5" fill="#66716d">2</text>
  <rect x="278" y="360" width="38" height="24" rx="3" fill="#ece9df" stroke="#b8bcb5" stroke-dasharray="4 3"/><text x="297" y="376.5" fill="#66716d">5</text>
  <rect x="320" y="360" width="38" height="24" rx="3" fill="#ece9df" stroke="#b8bcb5" stroke-dasharray="4 3"/><text x="339" y="376.5" fill="#66716d">8</text>

  <rect x="236" y="388" width="38" height="24" rx="3" fill="#ece9df" stroke="#b8bcb5" stroke-dasharray="4 3"/><text x="255" y="404.5" fill="#66716d">·</text>
  <rect x="278" y="388" width="38" height="24" rx="3" fill="#ece9df" stroke="#b8bcb5" stroke-dasharray="4 3"/><text x="297" y="404.5" fill="#66716d">·</text>
  <rect x="320" y="388" width="38" height="24" rx="3" fill="#ece9df" stroke="#b8bcb5" stroke-dasharray="4 3"/><text x="339" y="404.5" fill="#66716d">·</text>

  <rect x="236" y="416" width="38" height="24" rx="3" fill="#ece9df" stroke="#b8bcb5" stroke-dasharray="4 3"/><text x="255" y="432.5" fill="#66716d">·</text>
  <rect x="278" y="416" width="38" height="24" rx="3" fill="#ece9df" stroke="#b8bcb5" stroke-dasharray="4 3"/><text x="297" y="432.5" fill="#66716d">·</text>
  <rect x="320" y="416" width="38" height="24" rx="3" fill="#ece9df" stroke="#b8bcb5" stroke-dasharray="4 3"/><text x="339" y="432.5" fill="#66716d">·</text>
</g>
<g font-size="12" text-anchor="start">
  <text x="370" y="348.5" font-weight="700" fill="#936300">行 0 · 本轮写入（共 3 格）</text>
  <text x="370" y="376.5" fill="#66716d">行 1 · 未覆写（留旧值）</text>
  <text x="370" y="404.5" fill="#66716d">行 2 · 虚线保留未覆写</text>
  <text x="370" y="432.5" fill="#66716d">行 3 · 虚线保留未覆写</text>
</g>

<!-- Right Column: Captured Graph & Fixed Output Address -->
<rect x="614" y="46" width="272" height="416" rx="10" fill="#fbfaf6" stroke="#4c65b6" stroke-width="1.3"/>
<text x="750" y="72" text-anchor="middle" font-size="14" font-weight="700" fill="#3a4f93">录好的图与固定输出基址</text>
<line x1="626" y1="84" x2="874" y2="84" stroke="#d8d8cf" stroke-width="1.2"/>

<rect x="626" y="96" width="248" height="126" rx="8" fill="#e8edff" stroke="#4c65b6" stroke-width="1.3"/>
<text x="750" y="119" text-anchor="middle" font-family="var(--font-mono)" font-size="12.5" font-weight="700" fill="#3a4f93">ACLGraphEntry · replay()</text>
<text x="750" y="143" text-anchor="middle" font-size="12" fill="#17211f">任务次序与读写基址在捕获时固化</text>
<text x="750" y="166" text-anchor="middle" font-family="var(--font-mono)" font-size="12" fill="#3a4f93">读 @ 0x1000_8000 等输入池</text>
<text x="750" y="189" text-anchor="middle" font-family="var(--font-mono)" font-size="12" fill="#065f56">写 @ 0x2000_0000 固定输出</text>
<text x="750" y="210" text-anchor="middle" font-size="12" fill="#4d5652">ACLGraphWrapper 按描述符查找</text>

<line x1="750" y1="222" x2="750" y2="246" stroke="#087f73" stroke-width="1.8" marker-end="url(#ab-teal)"/>

<rect x="626" y="248" width="248" height="200" rx="8" fill="#ffffff" stroke="#087f73" stroke-width="1.3"/>
<text x="750" y="271" text-anchor="middle" font-family="var(--font-mono)" font-size="12.5" font-weight="700" fill="#065f56">输出缓冲 @ 0x2000_0000</text>
<rect x="640" y="284" width="220" height="62" rx="6" fill="#ddf4ef" stroke="#087f73" stroke-width="1.2"/>
<text x="750" y="308" text-anchor="middle" font-size="12.5" font-weight="700" fill="#065f56">本轮活跃有效输出区</text>
<text x="750" y="331" text-anchor="middle" font-size="12" fill="#17211f">Runner 按真实宽度切片取走</text>
<rect x="640" y="358" width="220" height="76" rx="6" fill="#ece9df" stroke="#b8bcb5" stroke-width="1.2" stroke-dasharray="4 3"/>
<text x="750" y="384" text-anchor="middle" font-size="12" font-weight="700" fill="#66716d">虚线保留区（补齐行 / 未覆写）</text>
<text x="750" y="407" text-anchor="middle" font-size="12" fill="#66716d">驻留同一缓冲尾部，采样阶段忽略</text>

<g fill="none" stroke="#4c65b6" stroke-width="1.7" marker-end="url(#ab-indigo)">
  <path d="M596 154h16"/>
  <path d="M596 368h10V178h6"/>
</g>

<!-- Bottom Invariant Strip -->
<rect x="14" y="472" width="872" height="36" rx="7" fill="#ece9df" stroke="#d8d8cf" stroke-width="1.2"/>
<text x="450" y="495" text-anchor="middle" font-size="12.5" font-weight="700" fill="#17211f">核心约定：基址与图档宽度固定；每轮只把当前活跃内容写进有效区（DEBUG 仅查 data_ptr 地址一致，不查内容新旧）</text>
</svg>
