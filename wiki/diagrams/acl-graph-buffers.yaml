layout: figure
id: acl-graph-buffers
caption: 一张录好的图里存的是任务次序，加上每个任务读写哪块地址。每一轮都把本轮的 token、位置和 block table 三样全部写进捕获时定下的同一组缓冲（后一轮覆盖前一轮），再回放同一张图；结果也落回同一块输出缓冲。内容每轮都换，地址和宽度不换。
size: [900, 380]
