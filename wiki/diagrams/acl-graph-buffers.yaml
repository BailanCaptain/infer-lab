mode: native-svg
id: acl-graph-buffers
caption: >-
  ACL Graph 固定基址缓冲复用与活跃行提交（以 4×3 块表基址 0x1000_8000 与输出基址 0x2000_0000 为例）：两轮回放共用同一组捕获期锁定的设备地址；第 k 轮活跃 2 条请求时 commit_block_table 仅覆写前 2 行共 6 格（后 2 行为虚线未覆写保留区），第 k+1 轮活跃 1 条请求时仅覆写第 0 行共 3 格（第 1..3 行保留旧值）；ACLGraphEntry 回放后结果写入固定输出基址，运行器仅切片读取本轮有效行。
size: [900, 520]
pins:
  - source: 'vllm-ascend@db701c1f:vllm_ascend/worker/block_table.py#L284-L288'
    symbols: [commit_block_table]
  - source: 'vllm-ascend@db701c1f:vllm_ascend/compilation/acl_graph.py#L155-L240'
    symbols: [ACLGraphEntry, ACLGraphWrapper]
