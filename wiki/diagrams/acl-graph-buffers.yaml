layout: figure
id: acl-graph-buffers
caption: 一张录好的图里存的是任务次序，加上每个任务读写哪块地址。每轮先确保固定缓冲的有效区域含本轮 token、位置和 block table，再回放同一张图；结果也落回固定输出缓冲。固定 GLM 的块表提交复制当前活跃请求行，不要求把整块已分配缓冲全部重写。
size: [900, 380]
