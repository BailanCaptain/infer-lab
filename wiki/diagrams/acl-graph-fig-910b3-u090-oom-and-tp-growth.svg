<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 580" width="860" height="580" role="img" aria-label="Ascend 910B3 真机图显存剖析：u=0.90 捕获期 OOM 与扩 TP 图显存逆向增长" font-family="var(--font-sans)">
  <title>Ascend 910B3 真机图显存剖析：u=0.90 捕获期 OOM 与扩 TP 图显存逆向增长</title>
  <desc>Left half compares 64.00 GiB nominal vs 60.96 GiB OS-visible HBM on Ascend 910B3 and shows Qwen3-0.6B failing in FULL 1/35 FIA at u=0.90 (requesting 1.98 GiB with 1.71 GiB free) vs succeeding at u=0.82 (3.90 GiB in 21s). Right half shows Qwen3-8B TP=1/2/4/8 per-rank weights shrinking from 15.29 to 1.94 GiB while graph capture free-memory delta grows from 2.59 to 3.21 GiB as per-layer KV views expand from 1.008 to 1.368 GiB.</desc>

  <defs>
    <marker id="arr-red" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="#b54237"/>
    </marker>
    <marker id="arr-teal" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="#087f73"/>
    </marker>
  </defs>

  <!-- Center Vertical Divider -->
  <line x1="430" y1="18" x2="430" y2="562" stroke="#b8bcb5" stroke-width="1.4" stroke-dasharray="6 4"/>

  <!-- ==================== LEFT HALF: 60.96 GiB Base & u=0.90 OOM vs u=0.82 ==================== -->
  <text x="16" y="28" font-size="16" font-weight="700" fill="#17211f">① 910B3 可见基数与 u=0.90 捕获期 OOM</text>
  <text x="16" y="48" font-size="13.5" fill="#66716d">Qwen3-0.6B · FULL_AND_PIECEWISE（35 档）</text>

  <!-- Nominal 64 GiB vs OS-visible 60.96 GiB -->
  <text x="16" y="74" font-size="13.5" font-weight="700" fill="#17211f">物理标称 64.00 GiB vs OS 可见 60.96 GiB</text>
  <rect x="16" y="84" width="378" height="36" rx="4" fill="#ece9df" stroke="#b8bcb5" stroke-width="1.3"/>
  <text x="205" y="107" text-anchor="middle" font-size="13.5" font-weight="700" fill="#17211f">acl.rt.get_mem_info = 60.96 GiB（预算基数）</text>
  <rect x="396" y="84" width="20" height="36" rx="3" fill="#f7e7f2" stroke="#9a4b86" stroke-width="1.3" stroke-dasharray="4 2"/>
  <line x1="406" y1="120" x2="406" y2="132" stroke="#9a4b86" stroke-width="1.4"/>
  <text x="416" y="146" text-anchor="end" font-size="13.5" font-weight="700" fill="#7a3a6a">底层预留 3.04 GiB（不可二次扣减）</text>

  <!-- Case A: u = 0.90 OOM -->
  <text x="16" y="176" font-size="14.5" font-weight="700" fill="#8f3229">✗ u = 0.90（预算 54.86 GiB · 1−u 仅留 6.10 GiB）</text>
  <rect x="16" y="186" width="12" height="38" rx="3" fill="#fff4cf" stroke="#c78300" stroke-width="1.2"/>
  <rect x="30" y="186" width="346" height="38" rx="4" fill="#e8edff" stroke="#4c65b6" stroke-width="1.3"/>
  <text x="203" y="210" text-anchor="middle" font-size="13.5" font-weight="700" fill="#3a4f93">KV 53.47 GiB（500,480 tokens · 122.19×）</text>
  <line x1="377" y1="180" x2="377" y2="230" stroke="#17211f" stroke-width="1.8"/>
  <rect x="379" y="186" width="37" height="38" rx="4" fill="#fff0e9" stroke="#b54237" stroke-width="1.4" stroke-dasharray="4 2"/>
  <text x="397" y="210" text-anchor="middle" font-size="13" font-weight="700" fill="#8f3229">1−u</text>

  <rect x="16" y="236" width="400" height="34" rx="5" fill="#ddf4ef" stroke="#087f73" stroke-width="1.2"/>
  <text x="28" y="258" font-size="13.5" font-weight="700" fill="#065f56">1. profile_run() + 35 档 PIECEWISE 捕获通过</text>

  <line x1="216" y1="270" x2="216" y2="286" stroke="#b54237" stroke-width="1.6" marker-end="url(#arr-red)"/>

  <rect x="16" y="290" width="400" height="74" rx="6" fill="#fff0e9" stroke="#b54237" stroke-width="1.5"/>
  <text x="28" y="313" font-size="14" font-weight="700" fill="#8f3229">2. FULL Decode 1/35 → FIA 捕获期 OOM</text>
  <text x="28" y="335" font-size="13.5" fill="#4d5652">device_op.py:216 申请 1.98 GiB &gt; 剩余 1.71 GiB</text>
  <text x="28" y="355" font-size="13.5" fill="#66716d">此时 allocated 54.62 GiB · reserved 58.75 GiB</text>

  <!-- Case B: u = 0.82 Success -->
  <text x="16" y="394" font-size="14.5" font-weight="700" fill="#065f56">✓ u = 0.82（预算 49.99 GiB · 1−u 留足 10.97 GiB）</text>
  <rect x="16" y="404" width="12" height="38" rx="3" fill="#fff4cf" stroke="#c78300" stroke-width="1.2"/>
  <rect x="30" y="404" width="312" height="38" rx="4" fill="#e8edff" stroke="#4c65b6" stroke-width="1.3"/>
  <text x="186" y="428" text-anchor="middle" font-size="13.5" font-weight="700" fill="#3a4f93">KV 48.59 GiB（454,912 tokens · 111.06×）</text>
  <line x1="344" y1="398" x2="344" y2="448" stroke="#17211f" stroke-width="1.8"/>
  <rect x="346" y="404" width="36" height="38" rx="4" fill="#ddf4ef" stroke="#087f73" stroke-width="1.3"/>
  <rect x="384" y="404" width="32" height="38" rx="4" fill="#ece9df" stroke="#b8bcb5" stroke-width="1.2"/>

  <line x1="216" y1="442" x2="216" y2="458" stroke="#087f73" stroke-width="1.6" marker-end="url(#arr-teal)"/>

  <rect x="16" y="462" width="400" height="62" rx="6" fill="#ddf4ef" stroke="#087f73" stroke-width="1.4"/>
  <text x="28" y="486" font-size="14" font-weight="700" fill="#065f56">capture_model() 全档通过：录图 3.90 GiB（21s）</text>
  <text x="28" y="509" font-size="13.5" fill="#4d5652">1−u 余量覆盖 PIECEWISE + FULL 全部图工作区</text>

  <text x="16" y="550" font-size="13.5" fill="#66716d">注：0.6B 录图占 3.90 GiB，勿套用 8B 的 2.59 GiB</text>

  <!-- ==================== RIGHT HALF: Qwen3-8B TP=1..8 Inverse Graph Growth ==================== -->
  <text x="444" y="28" font-size="16" font-weight="700" fill="#17211f">② Qwen3-8B 扩 TP 图显存为何逆向递增</text>
  <text x="444" y="48" font-size="13.5" fill="#66716d">固定 u = 0.85 · INFO 干净态 rank 0 实测</text>

  <!-- Column Headers -->
  <text x="472" y="76" text-anchor="middle" font-size="13.5" font-weight="700" fill="#66716d">拓扑</text>
  <text x="510" y="76" font-size="13.5" font-weight="700" fill="#936300">单卡权重递减 ↓</text>
  <text x="686" y="76" font-size="13.5" font-weight="700" fill="#7a3a6a">图显存差值反增 ↑</text>

  <!-- Row TP=1 -->
  <rect x="444" y="88" width="56" height="40" rx="5" fill="#ece9df" stroke="#b8bcb5" stroke-width="1.2"/>
  <text x="472" y="113" text-anchor="middle" font-size="14" font-weight="700" font-family="var(--font-mono)" fill="#17211f">TP=1</text>
  <rect x="508" y="88" width="156" height="40" rx="4" fill="#fff4cf" stroke="#c78300" stroke-width="1.3"/>
  <text x="586" y="113" text-anchor="middle" font-size="13.5" font-weight="700" fill="#936300">15.29 GiB</text>
  <rect x="684" y="88" width="128" height="40" rx="4" fill="#f7e7f2" stroke="#9a4b86" stroke-width="1.3"/>
  <text x="748" y="113" text-anchor="middle" font-size="13.5" font-weight="700" fill="#7a3a6a">2.59 GiB (22s)</text>

  <!-- Row TP=2 -->
  <rect x="444" y="140" width="56" height="40" rx="5" fill="#ece9df" stroke="#b8bcb5" stroke-width="1.2"/>
  <text x="472" y="165" text-anchor="middle" font-size="14" font-weight="700" font-family="var(--font-mono)" fill="#17211f">TP=2</text>
  <rect x="508" y="140" width="78" height="40" rx="4" fill="#fff4cf" stroke="#c78300" stroke-width="1.3"/>
  <text x="594" y="165" font-size="13.5" font-weight="700" fill="#936300">7.66 GiB</text>
  <rect x="684" y="140" width="144" height="40" rx="4" fill="#f7e7f2" stroke="#9a4b86" stroke-width="1.3"/>
  <text x="756" y="165" text-anchor="middle" font-size="13.5" font-weight="700" fill="#7a3a6a">2.92 GiB (32s)</text>

  <!-- Row TP=4 -->
  <rect x="444" y="192" width="56" height="40" rx="5" fill="#ece9df" stroke="#b8bcb5" stroke-width="1.2"/>
  <text x="472" y="217" text-anchor="middle" font-size="14" font-weight="700" font-family="var(--font-mono)" fill="#17211f">TP=4</text>
  <rect x="508" y="192" width="39" height="40" rx="4" fill="#fff4cf" stroke="#c78300" stroke-width="1.3"/>
  <text x="555" y="217" font-size="13.5" font-weight="700" fill="#936300">3.84 GiB</text>
  <rect x="684" y="192" width="152" height="40" rx="4" fill="#f7e7f2" stroke="#9a4b86" stroke-width="1.3"/>
  <text x="760" y="217" text-anchor="middle" font-size="13.5" font-weight="700" fill="#7a3a6a">3.10 GiB (35s)</text>

  <!-- Row TP=8 -->
  <rect x="444" y="244" width="56" height="40" rx="5" fill="#ece9df" stroke="#b8bcb5" stroke-width="1.2"/>
  <text x="472" y="269" text-anchor="middle" font-size="14" font-weight="700" font-family="var(--font-mono)" fill="#17211f">TP=8</text>
  <rect x="508" y="244" width="20" height="40" rx="4" fill="#fff4cf" stroke="#c78300" stroke-width="1.3"/>
  <text x="536" y="269" font-size="13.5" font-weight="700" fill="#936300">1.94 GiB</text>
  <rect x="684" y="244" width="158" height="40" rx="4" fill="#f7e7f2" stroke="#9a4b86" stroke-width="1.5"/>
  <text x="763" y="269" text-anchor="middle" font-size="13.5" font-weight="700" fill="#7a3a6a">3.21 GiB (36s)</text>

  <!-- Causal Mechanism & Measurement Boundary -->
  <text x="444" y="316" font-size="14.5" font-weight="700" fill="#17211f">为什么权重减半三次，图差值反增 +0.62 GiB？</text>

  <rect x="444" y="328" width="400" height="62" rx="6" fill="#e8edff" stroke="#4c65b6" stroke-width="1.3"/>
  <text x="456" y="352" font-size="13.5" font-weight="700" fill="#3a4f93">1. 释放的权重预算被自动划回每卡本地 KV 池</text>
  <text x="456" y="375" font-size="13.5" fill="#4d5652">每层本地 K+V 视图反从 1.008 GiB 扩至 1.368 GiB</text>

  <rect x="444" y="400" width="400" height="62" rx="6" fill="#f7e7f2" stroke="#9a4b86" stroke-width="1.3"/>
  <text x="456" y="424" font-size="13.5" font-weight="700" fill="#7a3a6a">2. 多档 FIA 工作区与集合通信图资源同步放大</text>
  <text x="456" y="447" font-size="13.5" fill="#4d5652">FIA 接收更大 KV 视图求 workspace + 多 rank 集合图对象</text>

  <rect x="444" y="472" width="400" height="84" rx="6" fill="#ece9df" stroke="#b8bcb5" stroke-width="1.3"/>
  <text x="456" y="496" font-size="13.5" font-weight="700" fill="#17211f">计量边界（start_free − end_free 差值口径）</text>
  <text x="456" y="519" font-size="13.5" fill="#4d5652">差值含共享图池、FIA 工作区、集合任务与分配器保留；</text>
  <text x="456" y="542" font-size="13.5" fill="#66716d">尚无逐算子分配快照闭合分摊，勿归因单一 HCCL 或 Slice</text>
</svg>
