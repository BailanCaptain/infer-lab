<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 540" width="900" height="540" role="img" aria-label="ACL Graph 侧流 Event 变参更新三轨时序：非 ENPU 与 ENPU 顺序及固定缓冲覆写红线" font-family="var(--font-sans)">
  <title>可更新图侧流 Event 三轨时序：Python 先 replay 后 update 为何不会读旧参，对照 ENPU 与固定缓冲覆写</title>
  <desc>Three aligned tracks (Host Python, Compute Stream, Update Stream) showing replay, in-graph attention wait event, side-stream update_graph_params and record event release, contrasted with ENPU order and fixed-address overwrite hazard</desc>
  <defs>
    <marker id="ev-arr-ink" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="#4d5652"/>
    </marker>
    <marker id="ev-arr-plum" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="#9a4b86"/>
    </marker>
    <marker id="ev-arr-teal" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="#087f73"/>
    </marker>
    <marker id="ev-arr-red" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="#b54237"/>
    </marker>
  </defs>

  <!-- Title -->
  <text x="16" y="28" font-size="16" font-weight="700" fill="#17211f">① 默认非 ENPU 路径：三轨时序看懂「先 replay 再 update」为何不会用旧参</text>
  <text x="884" y="28" text-anchor="end" font-size="13.5" fill="#66716d">时间从左向右 →</text>

  <!-- Swimlane Backgrounds -->
  <rect x="16" y="44" width="868" height="72" rx="6" fill="#fff4cf" fill-opacity="0.45" stroke="#d8d8cf" stroke-width="1.1"/>
  <rect x="16" y="124" width="868" height="82" rx="6" fill="#ddf4ef" fill-opacity="0.45" stroke="#d8d8cf" stroke-width="1.1"/>
  <rect x="16" y="214" width="868" height="72" rx="6" fill="#f7e7f2" fill-opacity="0.5" stroke="#d8d8cf" stroke-width="1.1"/>

  <!-- Track Labels (Left Column x=16..156) -->
  <rect x="24" y="54" width="128" height="52" rx="5" fill="#fff4cf" stroke="#c78300" stroke-width="1.3"/>
  <text x="88" y="77" text-anchor="middle" font-size="14" font-weight="700" fill="#936300">Host Python</text>
  <text x="88" y="97" text-anchor="middle" font-size="13.5" fill="#4d5652">下发顺序</text>

  <rect x="24" y="138" width="128" height="54" rx="5" fill="#ddf4ef" stroke="#087f73" stroke-width="1.3"/>
  <text x="88" y="162" text-anchor="middle" font-size="14" font-weight="700" fill="#065f56">Compute Stream</text>
  <text x="88" y="182" text-anchor="middle" font-size="13.5" fill="#4d5652">已录图回放</text>

  <rect x="24" y="224" width="128" height="52" rx="5" fill="#f7e7f2" stroke="#9a4b86" stroke-width="1.3"/>
  <text x="88" y="247" text-anchor="middle" font-size="14" font-weight="700" fill="#7a3a6a">Update Stream</text>
  <text x="88" y="267" text-anchor="middle" font-size="13.5" fill="#4d5652">侧流改参</text>

  <!-- Track 1: Host Python Blocks -->
  <rect x="168" y="56" width="144" height="48" rx="5" fill="#fff0e9" stroke="#b54237" stroke-width="1.3"/>
  <text x="240" y="77" text-anchor="middle" font-size="13.5" font-weight="700" fill="#8f3229">1. sync 当前流</text>
  <text x="240" y="96" text-anchor="middle" font-size="13.5" fill="#4d5652">等上轮回放完</text>

  <line x1="314" y1="80" x2="342" y2="80" stroke="#4d5652" stroke-width="1.6" marker-end="url(#ev-arr-ink)"/>

  <rect x="346" y="56" width="154" height="48" rx="5" fill="#fff4cf" stroke="#c78300" stroke-width="1.4"/>
  <text x="423" y="77" text-anchor="middle" font-size="14" font-weight="700" font-family="var(--font-mono)" fill="#936300">2. graph.replay()</text>
  <text x="423" y="96" text-anchor="middle" font-size="13.5" fill="#4d5652">一次提交整串</text>

  <line x1="502" y1="80" x2="530" y2="80" stroke="#4d5652" stroke-width="1.6" marker-end="url(#ev-arr-ink)"/>

  <rect x="534" y="56" width="236" height="48" rx="5" fill="#f7e7f2" stroke="#9a4b86" stroke-width="1.4"/>
  <text x="652" y="77" text-anchor="middle" font-size="14" font-weight="700" font-family="var(--font-mono)" fill="#7a3a6a">3. update_graph_params()</text>
  <text x="652" y="96" text-anchor="middle" font-size="13.5" fill="#4d5652">把本轮 seq_lens 写进侧流</text>

  <!-- Vertical dispatch arrows from Host to Streams -->
  <path d="M 423 106 L 423 136" fill="none" stroke="#087f73" stroke-width="1.6" stroke-dasharray="4 3" marker-end="url(#ev-arr-teal)"/>
  <path d="M 624 106 L 624 222" fill="none" stroke="#9a4b86" stroke-width="1.6" stroke-dasharray="4 3" marker-end="url(#ev-arr-plum)"/>

  <!-- Track 2: Compute Stream Blocks -->
  <rect x="358" y="140" width="126" height="50" rx="5" fill="#ddf4ef" stroke="#087f73" stroke-width="1.3"/>
  <text x="421" y="162" text-anchor="middle" font-size="13.5" font-weight="700" fill="#065f56">Norm / QKV</text>
  <text x="421" y="182" text-anchor="middle" font-size="13.5" fill="#4d5652">图内先行计算</text>

  <line x1="486" y1="165" x2="508" y2="165" stroke="#087f73" stroke-width="1.6" marker-end="url(#ev-arr-teal)"/>

  <!-- Wait Event Gate -->
  <rect x="512" y="140" width="118" height="50" rx="5" fill="#fff0e9" stroke="#b54237" stroke-width="1.6" stroke-dasharray="5 3"/>
  <text x="571" y="162" text-anchor="middle" font-size="14" font-weight="700" fill="#8f3229">⏸ Wait Event</text>
  <text x="571" y="182" text-anchor="middle" font-size="13.5" fill="#8f3229">停在注意力前</text>

  <!-- Waiting dashed line until release -->
  <line x1="632" y1="165" x2="706" y2="165" stroke="#9a4b86" stroke-width="1.8" stroke-dasharray="4 3" marker-end="url(#ev-arr-plum)"/>

  <rect x="710" y="140" width="162" height="50" rx="5" fill="#087f73" stroke="#065f56" stroke-width="1.4"/>
  <text x="791" y="162" text-anchor="middle" font-size="14" font-weight="700" fill="#ffffff">FIA / PA 注意力</text>
  <text x="791" y="182" text-anchor="middle" font-size="13.5" fill="#ddf4ef">读新参数 → MLP</text>

  <!-- Track 3: Update Stream Blocks -->
  <rect x="534" y="226" width="144" height="48" rx="5" fill="#f7e7f2" stroke="#9a4b86" stroke-width="1.4"/>
  <text x="606" y="247" text-anchor="middle" font-size="13.5" font-weight="700" fill="#7a3a6a">改写已录任务入参</text>
  <text x="606" y="266" text-anchor="middle" font-size="13.5" fill="#4d5652">seq_lens / block</text>

  <line x1="680" y1="250" x2="696" y2="250" stroke="#9a4b86" stroke-width="1.6" marker-end="url(#ev-arr-plum)"/>

  <rect x="700" y="226" width="128" height="48" rx="5" fill="#9a4b86" stroke="#7a3a6a" stroke-width="1.4"/>
  <text x="764" y="247" text-anchor="middle" font-size="14" font-weight="700" fill="#ffffff">● Record Event</text>
  <text x="764" y="266" text-anchor="middle" font-size="13.5" fill="#f7e7f2">放行计算流</text>

  <!-- Release arrow from Record Event UP to Wait Event release point -->
  <path d="M 700 236 L 686 236 L 686 172" fill="none" stroke="#9a4b86" stroke-width="2" marker-end="url(#ev-arr-plum)"/>

  <!-- Divider -->
  <line x1="16" y1="306" x2="884" y2="306" stroke="#b8bcb5" stroke-width="1.4" stroke-dasharray="6 4"/>

  <!-- Section 2: Contrast ENPU Order & Overwrite Hazards -->
  <text x="16" y="334" font-size="16" font-weight="700" fill="#17211f">② 对照：ENPU 改参顺序与固定地址缓冲的两类覆写红线</text>

  <!-- Left: ENPU Order -->
  <rect x="16" y="352" width="424" height="172" rx="7" fill="#e8edff" stroke="#4c65b6" stroke-width="1.4"/>
  <text x="30" y="378" font-size="14.5" font-weight="700" fill="#3a4f93">ENPU 路径（enable_enpu = True）：先 update 后 replay</text>

  <rect x="30" y="394" width="154" height="44" rx="5" fill="#f7e7f2" stroke="#9a4b86" stroke-width="1.3"/>
  <text x="107" y="421" text-anchor="middle" font-size="13.5" font-weight="700" fill="#7a3a6a">1. update 参数先行</text>

  <line x1="186" y1="416" x2="216" y2="416" stroke="#3a4f93" stroke-width="1.7" marker-end="url(#ev-arr-ink)"/>

  <rect x="220" y="394" width="154" height="44" rx="5" fill="#ddf4ef" stroke="#087f73" stroke-width="1.3"/>
  <text x="297" y="421" text-anchor="middle" font-size="13.5" font-weight="700" fill="#065f56">2. graph.replay()</text>

  <text x="30" y="464" font-size="13.5" fill="#4d5652">跳过包装器回放前通用流同步（EAGLE 合图同样跳过），</text>
  <text x="30" y="486" font-size="13.5" fill="#4d5652">改由 Runner 显式编排更新与回放依赖；</text>
  <text x="30" y="508" font-size="13.5" font-weight="700" fill="#3a4f93">稀疏 MLA / KDA 走各自持久缓冲原地刷新，不进此通用入口。</text>

  <!-- Right: Fixed-Address Overwrite Hazard -->
  <rect x="460" y="352" width="424" height="172" rx="7" fill="#fff0e9" stroke="#b54237" stroke-width="1.4"/>
  <text x="474" y="378" font-size="14.5" font-weight="700" fill="#8f3229">固定地址缓冲覆写红线（跨步异步 + 视觉多子批）</text>

  <!-- Visual race diagram -->
  <rect x="474" y="394" width="124" height="40" rx="5" fill="#fff4cf" stroke="#c78300" stroke-width="1.2"/>
  <text x="536" y="419" text-anchor="middle" font-size="13.5" fill="#936300">第 i-1 步正在读</text>

  <rect x="614" y="394" width="114" height="40" rx="5" fill="#ece9df" stroke="#17211f" stroke-width="1.4"/>
  <text x="671" y="419" text-anchor="middle" font-size="13.5" font-weight="700" fill="#17211f">同一固定缓冲</text>

  <rect x="744" y="394" width="126" height="40" rx="5" fill="#b54237" stroke="#8f3229" stroke-width="1.2"/>
  <text x="807" y="419" text-anchor="middle" font-size="13.5" font-weight="700" fill="#ffffff">第 i 步原地改写</text>

  <line x1="598" y1="414" x2="612" y2="414" stroke="#b54237" stroke-width="1.6" marker-end="url(#ev-arr-red)"/>
  <line x1="744" y1="414" x2="730" y2="414" stroke="#b54237" stroke-width="1.6" marker-end="url(#ev-arr-red)"/>

  <text x="474" y="462" font-size="13.5" fill="#4d5652"><tspan font-weight="700" fill="#8f3229">① 语言异步调度：</tspan>回放前须 sync 当前流，防第 i 步踩旧缓冲。</text>
  <text x="474" y="486" font-size="13.5" fill="#4d5652"><tspan font-weight="700" fill="#8f3229">② 视觉多子批：</tspan>每次回放须将有效特征<tspan font-weight="700">复制出</tspan>共用输出缓冲，</text>
  <text x="474" y="508" font-size="13.5" fill="#4d5652">否则下一子批回放会原地覆盖上一子批结果。</text>
</svg>
