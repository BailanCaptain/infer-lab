<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 540" width="900" height="540" role="img" aria-label="ACL Graph 模式矩阵、三大实现生态与 HBM 1-u 录图显存余量" font-family="var(--font-sans)">
  <title>ACL Graph 四档模式矩阵、三大图路径与 HBM u / (1-u) 录图显存预算</title>
  <desc>ACL Graph mode matrix across uniform decode and mixed batches, three graph implementations, and proportional HBM budget bar showing 1-u capture headroom and stream resource guard</desc>

  <!-- Section 1: Mode Matrix -->
  <text x="16" y="28" font-size="16" font-weight="700" fill="#17211f">① ACL Graph 四档捕获范围与默认上限</text>
  <text x="884" y="28" text-anchor="end" font-size="13.5" fill="#66716d">默认上限 min(max_num_seqs × query_len, 512)</text>

  <!-- Matrix Header -->
  <rect x="16" y="44" width="196" height="34" rx="5" fill="#ece9df" stroke="#b8bcb5" stroke-width="1.2"/>
  <text x="114" y="66" text-anchor="middle" font-size="14" font-weight="700" fill="#17211f">档位</text>
  <rect x="218" y="44" width="166" height="34" rx="5" fill="#ece9df" stroke="#b8bcb5" stroke-width="1.2"/>
  <text x="301" y="66" text-anchor="middle" font-size="14" font-weight="700" fill="#17211f">整齐 decode 步</text>
  <rect x="390" y="44" width="178" height="34" rx="5" fill="#ece9df" stroke="#b8bcb5" stroke-width="1.2"/>
  <text x="479" y="66" text-anchor="middle" font-size="14" font-weight="700" fill="#17211f">混合 / prefill 步</text>
  <rect x="574" y="44" width="310" height="34" rx="5" fill="#ece9df" stroke="#b8bcb5" stroke-width="1.2"/>
  <text x="729" y="66" text-anchor="middle" font-size="14" font-weight="700" fill="#17211f">后端等级约束与编译联动</text>

  <!-- Row FULL -->
  <rect x="16" y="84" width="196" height="38" rx="4" fill="#ddf4ef" stroke="#087f73" stroke-width="1.3"/>
  <text x="28" y="108" font-size="14" font-weight="700" font-family="var(--font-mono)" fill="#065f56">FULL</text>
  <rect x="218" y="84" width="166" height="38" rx="4" fill="#ddf4ef" stroke="#087f73" stroke-width="1.2"/>
  <text x="301" y="108" text-anchor="middle" font-size="13.5" font-weight="700" fill="#065f56">整图回放</text>
  <rect x="390" y="84" width="178" height="38" rx="4" fill="#ddf4ef" stroke="#087f73" stroke-width="1.2"/>
  <text x="479" y="108" text-anchor="middle" font-size="13.5" font-weight="700" fill="#065f56">整图回放</text>
  <rect x="574" y="84" width="310" height="38" rx="4" fill="#f7f5ef" stroke="#d8d8cf" stroke-width="1.1"/>
  <text x="584" y="108" font-size="13.5" fill="#4d5652">NEVER 启动抛 ValueError；UNIFORM 降级</text>

  <!-- Row FULL_DECODE_ONLY -->
  <rect x="16" y="128" width="196" height="38" rx="4" fill="#fff4cf" stroke="#c78300" stroke-width="1.3"/>
  <text x="28" y="152" font-size="14" font-weight="700" font-family="var(--font-mono)" fill="#936300">FULL_DECODE_ONLY</text>
  <rect x="218" y="128" width="166" height="38" rx="4" fill="#ddf4ef" stroke="#087f73" stroke-width="1.2"/>
  <text x="301" y="152" text-anchor="middle" font-size="13.5" font-weight="700" fill="#065f56">整图回放</text>
  <rect x="390" y="128" width="178" height="38" rx="4" fill="#fff0e9" stroke="#b54237" stroke-width="1.2"/>
  <text x="479" y="152" text-anchor="middle" font-size="13.5" font-weight="700" fill="#8f3229">退回 eager</text>
  <rect x="574" y="128" width="310" height="38" rx="4" fill="#f7f5ef" stroke="#d8d8cf" stroke-width="1.1"/>
  <text x="586" y="152" font-size="13.5" fill="#4d5652">清空 splitting_ops，可叠 npugraph_ex</text>

  <!-- Row FULL_AND_PIECEWISE -->
  <rect x="16" y="172" width="196" height="38" rx="4" fill="#e8edff" stroke="#4c65b6" stroke-width="1.3"/>
  <text x="28" y="196" font-size="13.5" font-weight="700" font-family="var(--font-mono)" fill="#3a4f93">FULL_AND_PIECEWISE</text>
  <rect x="218" y="172" width="166" height="38" rx="4" fill="#ddf4ef" stroke="#087f73" stroke-width="1.2"/>
  <text x="301" y="196" text-anchor="middle" font-size="13.5" font-weight="700" fill="#065f56">整图回放</text>
  <rect x="390" y="172" width="178" height="38" rx="4" fill="#e8edff" stroke="#4c65b6" stroke-width="1.2"/>
  <text x="479" y="196" text-anchor="middle" font-size="13.5" fill="#3a4f93">分段回放（切口 eager）</text>
  <rect x="574" y="172" width="310" height="38" rx="4" fill="#f7f5ef" stroke="#d8d8cf" stroke-width="1.1"/>
  <text x="586" y="196" font-size="13.5" fill="#4d5652">默认 O2 预设；保留切分表，关闭 npugraph_ex</text>

  <!-- Row PIECEWISE -->
  <rect x="16" y="216" width="196" height="38" rx="4" fill="#f7e7f2" stroke="#9a4b86" stroke-width="1.3"/>
  <text x="28" y="240" font-size="14" font-weight="700" font-family="var(--font-mono)" fill="#7a3a6a">PIECEWISE</text>
  <rect x="218" y="216" width="166" height="38" rx="4" fill="#e8edff" stroke="#4c65b6" stroke-width="1.2"/>
  <text x="301" y="240" text-anchor="middle" font-size="13.5" fill="#3a4f93">分段回放</text>
  <rect x="390" y="216" width="178" height="38" rx="4" fill="#e8edff" stroke="#4c65b6" stroke-width="1.2"/>
  <text x="479" y="240" text-anchor="middle" font-size="13.5" fill="#3a4f93">分段回放（切口 eager）</text>
  <rect x="574" y="216" width="310" height="38" rx="4" fill="#f7f5ef" stroke="#d8d8cf" stroke-width="1.1"/>
  <text x="586" y="240" font-size="13.5" fill="#4d5652">兼容 FA3 主机 tiling；可配 Breakable 动态打断</text>

  <!-- Three Graph Implementations Pill Strip -->
  <rect x="16" y="266" width="276" height="44" rx="6" fill="#ddf4ef" stroke="#087f73" stroke-width="1.2"/>
  <text x="154" y="286" text-anchor="middle" font-size="14" font-weight="700" fill="#065f56">ACLGraphWrapper</text>
  <text x="154" y="303" text-anchor="middle" font-size="13.5" fill="#4d5652">默认整图/分段 + updatable_graph</text>

  <rect x="312" y="266" width="276" height="44" rx="6" fill="#e8edff" stroke="#4c65b6" stroke-width="1.2"/>
  <text x="450" y="286" text-anchor="middle" font-size="14" font-weight="700" fill="#3a4f93">BreakableACLGraphWrapper</text>
  <text x="450" y="303" text-anchor="middle" font-size="13.5" fill="#4d5652">允许分段捕获在动态切分点打断</text>

  <rect x="608" y="266" width="276" height="44" rx="6" fill="#f7e7f2" stroke="#9a4b86" stroke-width="1.2"/>
  <text x="746" y="286" text-anchor="middle" font-size="14" font-weight="700" fill="#7a3a6a">XliteGraph（XliteWorker）</text>
  <text x="746" y="303" text-anchor="middle" font-size="13.5" fill="#4d5652">独立图执行路径（非 310P 按需开启）</text>

  <line x1="16" y1="326" x2="884" y2="326" stroke="#b8bcb5" stroke-width="1.4" stroke-dasharray="6 4"/>

  <!-- Section 2: Proportional HBM Budget Bar & Stream Limit -->
  <text x="16" y="354" font-size="16" font-weight="700" fill="#17211f">② 录图显存账（先切 KV 池，再录图）与流资源上限</text>
  <text x="884" y="354" text-anchor="end" font-size="13.5" fill="#66716d">v0.30.0 默认 u=0.92 按 92%:8% 实比例（传 0.90 时 10%）</text>

  <!-- True-to-scale HBM bar: total width = 868px (x=16 to 884); u=0.92 => 798px (16..814), 1-u=0.08 => 68px (816..884) -->
  <rect x="16" y="374" width="186" height="48" rx="4" fill="#fff4cf" stroke="#c78300" stroke-width="1.3"/>
  <text x="109" y="403" text-anchor="middle" font-size="14" font-weight="700" fill="#936300">权重</text>

  <rect x="204" y="374" width="94" height="48" rx="4" fill="#fff0e9" stroke="#b54237" stroke-width="1.3"/>
  <text x="251" y="403" text-anchor="middle" font-size="13.5" font-weight="700" fill="#8f3229">激活峰值</text>

  <rect x="300" y="374" width="96" height="48" rx="4" fill="#f7e7f2" stroke="#9a4b86" stroke-width="1.3"/>
  <text x="348" y="403" text-anchor="middle" font-size="13.5" font-weight="700" fill="#7a3a6a">非 Torch</text>

  <rect x="398" y="374" width="414" height="48" rx="4" fill="#e8edff" stroke="#4c65b6" stroke-width="1.4"/>
  <text x="605" y="403" text-anchor="middle" font-size="14.5" font-weight="700" fill="#3a4f93">物理 KV Cache 块池（先全部分光）</text>

  <!-- Split line at exact u = 0.92 (x = 814 => 798 / 868 = 91.94%) -->
  <line x1="814" y1="366" x2="814" y2="442" stroke="#17211f" stroke-width="2"/>

  <!-- Exact 8% tail bar: width = 68px (816..884 => ~8.0% of 868px) -->
  <rect x="816" y="374" width="68" height="48" rx="4" fill="#ddf4ef" stroke="#087f73" stroke-width="1.5" stroke-dasharray="5 3"/>
  <text x="850" y="395" text-anchor="middle" font-size="13.5" font-weight="700" fill="#065f56">1−u</text>
  <text x="850" y="414" text-anchor="middle" font-size="13.5" font-weight="700" fill="#065f56">8%</text>

  <!-- Bracket annotations + external callout leader for narrow 8% tail -->
  <path d="M 16 430 L 16 438 L 810 438 L 810 430" fill="none" stroke="#4c65b6" stroke-width="1.4"/>
  <text x="275" y="458" text-anchor="middle" font-size="13.5" font-weight="700" fill="#3a4f93">实例预算 u × total_memory（92%，不含图池）</text>

  <path d="M 816 430 L 816 438 L 884 438 L 884 430" fill="none" stroke="#087f73" stroke-width="1.5"/>
  <line x1="850" y1="438" x2="850" y2="444" stroke="#087f73" stroke-width="1.5"/>
  <text x="884" y="458" text-anchor="end" font-size="13.5" font-weight="700" fill="#065f56">(1−u) 余量专供 capture_model 录图，吃干即 OOM</text>

  <!-- Bottom Two Guard Cards -->
  <rect x="16" y="472" width="424" height="56" rx="6" fill="#ece9df" stroke="#b8bcb5" stroke-width="1.2"/>
  <text x="30" y="496" font-size="14" font-weight="700" fill="#17211f">v0.30.0+ 录图后建议公式（non_kv_memory）</text>
  <text x="30" y="518" font-size="13.5" fill="#4d5652">合并权重+激活+非Torch+npugraph_memory，再扣 150 MiB</text>

  <rect x="460" y="472" width="424" height="56" rx="6" fill="#fff0e9" stroke="#b54237" stroke-width="1.3"/>
  <text x="474" y="496" font-size="14" font-weight="700" fill="#8f3229">流资源红线（207008 + stream resource）</text>
  <text x="474" y="518" font-size="13.5" fill="#4d5652">触发重包装报错 → 缩 capture_sizes 或改 FULL_DECODE_ONLY</text>
</svg>
