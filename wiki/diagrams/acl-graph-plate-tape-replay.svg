<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 575" width="900" height="575" role="img" aria-label="ACLGraph 捕获与回放趣味微缩场景图：左侧传令员在长木桥上逐张奔跑送单导致三座大熔炉断续冒烟空等，右侧黄铜打孔卷带机直连熔炉连续送入指令带让炉膛满火连烧" font-family="var(--font-sans)">
  <title>逐张跑腿下发导致熔炉空等（Eager）vs 打孔母带一键整串回放（ACLGraph）：直观理解为什么小批 Decode 需要图捕获消除 Host 下发气泡。</title>
  <desc>关联源码符号：capture_model, npugraph_memory_bytes, ACLGraphWrapper, _updatable_graph_replay</desc>
  <image href="./wiki-illustrations/acl-graph-tape-replay-scene.webp" x="40" y="128" width="820" height="349" preserveAspectRatio="xMidYMid meet"/>
  <line x1="278" y1="112" x2="278" y2="316" stroke="#c95b3c" stroke-width="1.6"/>
  <circle cx="278" cy="316" r="5.5" fill="#ffffff" stroke="#c95b3c" stroke-width="2"/>
  <circle cx="278" cy="316" r="2.5" fill="#c95b3c"/>
  <line x1="524" y1="112" x2="524" y2="302" stroke="#c78300" stroke-width="1.6"/>
  <circle cx="524" cy="302" r="5.5" fill="#ffffff" stroke="#c78300" stroke-width="2"/>
  <circle cx="524" cy="302" r="2.5" fill="#c78300"/>
  <line x1="696" y1="112" x2="696" y2="254" stroke="#087f73" stroke-width="1.6"/>
  <circle cx="696" cy="254" r="5.5" fill="#ffffff" stroke="#087f73" stroke-width="2"/>
  <circle cx="696" cy="254" r="2.5" fill="#087f73"/>
  <line x1="188" y1="489" x2="188" y2="254" stroke="#c95b3c" stroke-width="1.6"/>
  <circle cx="188" cy="254" r="5.5" fill="#ffffff" stroke="#c95b3c" stroke-width="2"/>
  <circle cx="188" cy="254" r="2.5" fill="#c95b3c"/>
  <line x1="647" y1="489" x2="647" y2="351" stroke="#4c65b6" stroke-width="1.6"/>
  <circle cx="647" cy="351" r="5.5" fill="#ffffff" stroke="#4c65b6" stroke-width="2"/>
  <circle cx="647" cy="351" r="2.5" fill="#4c65b6"/>
  <g id="callout-1">
    <circle cx="24" cy="28" r="12" fill="#c95b3c"/>
    <text x="24" y="32.5" text-anchor="middle" font-size="12.5" font-weight="700" fill="#ffffff">1</text>
    <text x="44" y="33" font-size="14.5" font-weight="700" fill="#17211f">Eager 逐算子跑腿（CPU 下发墙）</text>
    <text x="44" y="57" font-size="13" fill="#4d5652">一步前向拆成数百次 Python 与框架调度</text>
    <text x="44" y="79" font-size="13" fill="#4d5652">小批 Decode 单算子设备耗时仅几微秒</text>
    <text x="44" y="101" font-size="13" fill="#66716d">传令员跑桥比烧炉还慢，算力被气泡切碎</text>
  </g>
  <g id="callout-2">
    <circle cx="318" cy="28" r="12" fill="#c78300"/>
    <text x="318" y="32.5" text-anchor="middle" font-size="12.5" font-weight="700" fill="#ffffff">2</text>
    <text x="338" y="33" font-size="14.5" font-weight="700" fill="#17211f">预热录成固定地址母带（Capture）</text>
    <text x="338" y="57" font-size="13" fill="#4d5652">冷启动按常用批大小分档试跑并录制任务流</text>
    <text x="338" y="79" font-size="13" fill="#4d5652">输入输出绑定固定显存缓冲与块表地址</text>
    <text x="338" y="101" font-size="13" fill="#66716d">不能进图的动态逻辑可在分段边界切开</text>
  </g>
  <g id="callout-3">
    <circle cx="612" cy="28" r="12" fill="#087f73"/>
    <text x="612" y="32.5" text-anchor="middle" font-size="12.5" font-weight="700" fill="#ffffff">3</text>
    <text x="632" y="33" font-size="14.5" font-weight="700" fill="#17211f">一键整串连烧回放（Replay）</text>
    <text x="632" y="57" font-size="13" fill="#4d5652">实跑批大小向上对齐到最近已录档位</text>
    <text x="632" y="79" font-size="13" fill="#4d5652">原地更新可变参数后整张图一次提交设备</text>
    <text x="632" y="101" font-size="13" fill="#66716d">四座计算炉膛紧密衔接，吐字延迟显著下降</text>
  </g>
  <g id="callout-4">
    <circle cx="24" cy="507" r="12" fill="#c95b3c"/>
    <text x="24" y="511.5" text-anchor="middle" font-size="12.5" font-weight="700" fill="#ffffff">4</text>
    <text x="44" y="512" font-size="14.5" font-weight="700" fill="#17211f">炉膛断续空烧（NPU 利用率虚低）</text>
    <text x="44" y="536" font-size="13" fill="#4d5652">监控看芯片没跑满，根因却在主机侧忙不过来</text>
    <text x="44" y="559" font-size="13" fill="#4d5652">盲目换更快芯片也救不了单步下发串行延迟</text>
  </g>
  <g id="callout-5">
    <circle cx="468" cy="507" r="12" fill="#4c65b6"/>
    <text x="468" y="511.5" text-anchor="middle" font-size="12.5" font-weight="700" fill="#ffffff">5</text>
    <text x="488" y="512" font-size="14.5" font-weight="700" fill="#17211f">代价边界：分档预热耗时、图显存与补齐计算</text>
    <text x="488" y="536" font-size="13" fill="#4d5652">档位越多，冷启动录图越久且占更多流/工作区显存</text>
    <text x="488" y="559" font-size="13" fill="#4d5652">未踩准档位时需填零补齐到上一档（如 5 补到 8）</text>
  </g>
</svg>
