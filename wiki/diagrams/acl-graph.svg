<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 578" width="900" height="578" role="img" aria-label="捕获尺寸是一把尺：一步 forward 的 token 数先垫到尺上的某一档，再按「这批是不是整齐的 decode」查两套 key">
  <title>捕获尺寸是一把尺：一步 forward 的 token 数先垫到尺上的某一档，再按「这批是不是整齐的 decode」查两套 key</title>
  <rect width="900" height="578" fill="var(--color-surface, #fbfaf6)"/>
  <rect x="20" y="174" width="412" height="300" rx="12" fill="var(--color-kv-soft, #e8edff)"/>
  <rect x="36" y="188" width="250.1" height="26.5" rx="13.3" fill="var(--color-kv, #4c65b6)"/><text x="47" y="206.1" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="13.5" font-weight="700" fill="var(--color-ink-inverse, #ffffff)">第 1 步 · 37 个 token 的 prefill</text>
  <text x="38" y="231" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="12.5" font-weight="400" fill="var(--color-ink-muted, #5b6763)">批里混着没算完的 prompt，不是整齐的 decode</text>
  <rect x="468" y="174" width="412" height="300" rx="12" fill="var(--color-weight-soft, #fff4cf)"/>
  <rect x="484" y="188" width="254.2" height="26.5" rx="13.3" fill="var(--color-weight, #b87a00)"/><text x="495" y="206.1" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="13.5" font-weight="700" fill="var(--color-ink-inverse, #ffffff)">第 2 到第 200 步 · 每步 1 个 token</text>
  <text x="486" y="231" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="12.5" font-weight="400" fill="var(--color-ink-muted, #5b6763)">199 步的 batch_descriptor 一模一样</text>
  <line x1="450" y1="176" x2="450" y2="474" stroke="var(--color-accent, #e85b32)" stroke-width="2.5" stroke-dasharray="7 5"/>
  <text x="450" y="165" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="13" font-weight="700" fill="var(--color-accent, #e85b32)" text-anchor="middle">这一批是不是整齐的 decode</text>
