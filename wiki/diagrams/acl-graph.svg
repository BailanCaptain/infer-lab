  <rect x="334" y="80" width="38" height="30" rx="3" fill="var(--color-kv, #4c65b6)" stroke="var(--color-kv, #4c65b6)" stroke-width="1.1"/>
  <rect x="376" y="80" width="38" height="30" rx="3" fill="var(--color-kv-soft, #e8edff)" stroke="var(--color-kv, #4c65b6)" stroke-width="1.1"/>
  <rect x="418" y="80" width="38" height="30" rx="3" fill="var(--color-kv-soft, #e8edff)" stroke="var(--color-kv, #4c65b6)" stroke-width="1.1"/>
  <rect x="460" y="80" width="38" height="30" rx="3" fill="var(--color-kv-soft, #e8edff)" stroke="var(--color-kv, #4c65b6)" stroke-width="1.1"/>
  <rect x="502" y="80" width="38" height="30" rx="3" fill="var(--color-kv-soft, #e8edff)" stroke="var(--color-kv, #4c65b6)" stroke-width="1.1"/>
  <rect x="544" y="80" width="38" height="30" rx="3" fill="var(--color-kv-soft, #e8edff)" stroke="var(--color-kv, #4c65b6)" stroke-width="1.1"/>
  <rect x="586" y="80" width="38" height="30" rx="3" fill="var(--color-kv-soft, #e8edff)" stroke="var(--color-kv, #4c65b6)" stroke-width="1.1"/>
  <rect x="628" y="80" width="38" height="30" rx="3" fill="var(--color-kv-soft, #e8edff)" stroke="var(--color-kv, #4c65b6)" stroke-width="1.1"/>
  <rect x="670" y="80" width="38" height="30" rx="3" fill="var(--color-kv-soft, #e8edff)" stroke="var(--color-kv, #4c65b6)" stroke-width="1.1"/>
  <rect x="712" y="80" width="38" height="30" rx="3" fill="var(--color-kv-soft, #e8edff)" stroke="var(--color-kv, #4c65b6)" stroke-width="1.1"/>
  <rect x="754" y="80" width="38" height="30" rx="3" fill="var(--color-kv-soft, #e8edff)" stroke="var(--color-kv, #4c65b6)" stroke-width="1.1"/>
  <rect x="796" y="80" width="38" height="30" rx="3" fill="var(--color-kv-soft, #e8edff)" stroke="var(--color-kv, #4c65b6)" stroke-width="1.1"/>
  <text x="40" y="128" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="12.5" font-weight="400" fill="var(--color-ink-muted, #5b6763)">1 2 4 8 16 24 32 40 48 56 … 112 120 128；填实的两档是那条请求真正用到的 1 和 40</text>
  <rect x="36" y="248" width="380" height="54" rx="11" fill="var(--color-surface, #fbfaf6)" stroke="var(--color-kv, #4c65b6)" stroke-width="1.5"/>
  <text x="52" y="271.5" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="14.5" font-weight="700" fill="var(--color-ink, #17211f)">批里 37 个 token</text>
  <text x="52" y="289.5" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="12.5" font-weight="400" fill="var(--color-ink-muted, #5b6763)">uniform_decode 为假</text>
  <rect x="36" y="316" width="380" height="54" rx="11" fill="var(--color-surface, #fbfaf6)" stroke="var(--color-kv, #4c65b6)" stroke-width="1.5"/>
  <text x="52" y="339.5" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="14.5" font-weight="700" fill="var(--color-ink, #17211f)">垫到 40：尺上 ≥ 37 的第一档</text>
  <text x="52" y="357.5" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="12.5" font-weight="400" fill="var(--color-ink-muted, #5b6763)">多算 3 个位置的白工</text>
  <rect x="36" y="384" width="380" height="66" rx="11" fill="var(--color-surface, #fbfaf6)" stroke="var(--color-accent, #e85b32)" stroke-width="1.5"/>
  <text x="52" y="405" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="14.5" font-weight="700" fill="var(--color-ink, #17211f)">FULL 的 key 查不到，落到 PIECEWISE</text>
  <text x="52" y="423" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="12.5" font-weight="400" fill="var(--color-ink-muted, #5b6763)">这套 key 放宽了 num_reqs 与 uniform</text>
  <text x="52" y="440" font-family="'JetBrains Mono',ui-monospace,monospace" font-size="12.5" font-weight="400" fill="var(--color-accent, #e85b32)">dispatch</text>
  <rect x="484" y="248" width="380" height="54" rx="11" fill="var(--color-surface, #fbfaf6)" stroke="var(--color-weight, #b87a00)" stroke-width="1.5"/>
  <text x="500" y="271.5" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="14.5" font-weight="700" fill="var(--color-ink, #17211f)">批里 1 个 token</text>
  <text x="500" y="289.5" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="12.5" font-weight="400" fill="var(--color-ink-muted, #5b6763)">uniform_decode 为真</text>
  <rect x="484" y="316" width="380" height="54" rx="11" fill="var(--color-surface, #fbfaf6)" stroke="var(--color-weight, #b87a00)" stroke-width="1.5"/>
  <text x="500" y="339.5" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="14.5" font-weight="700" fill="var(--color-ink, #17211f)">尺寸 1 本来就在尺上，不用垫</text>
  <text x="500" y="357.5" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="12.5" font-weight="400" fill="var(--color-ink-muted, #5b6763)">199 步查到同一个 key</text>
  <rect x="484" y="384" width="380" height="66" rx="11" fill="var(--color-surface, #fbfaf6)" stroke="var(--color-weight, #b87a00)" stroke-width="1.5"/>
  <text x="500" y="405" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="14.5" font-weight="700" fill="var(--color-ink, #17211f)">命中 FULL 的 key，回放同一张图</text>
  <text x="500" y="423" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="12.5" font-weight="400" fill="var(--color-ink-muted, #5b6763)">回放前先 synchronize 一次</text>
  <text x="500" y="440" font-family="'JetBrains Mono',ui-monospace,monospace" font-size="12.5" font-weight="400" fill="var(--color-weight, #b87a00)">ACLGraphWrapper</text>
  <path d="M40 72 l0 -9 L834 63 l0 9" fill="none" stroke="var(--color-ink-faint, #8a928f)" stroke-width="1.4" opacity="0.75"/>
  <text x="437" y="55" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="12.5" font-weight="600" fill="var(--color-ink-faint, #8a928f)" text-anchor="middle">cudagraph_capture_sizes：默认 19 档，上限 = min(max_num_seqs × 1, 512) = 128</text>
  <text x="20" y="502" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="12.5" font-weight="400" fill="var(--color-ink-muted, #5b6763)">垫完仍然大于最大捕获尺寸（这里是 128）就直接返回 NONE，这一步整步按 eager 跑——不报错，也不打 warning。</text>
  <text x="20" y="530" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="12.5" font-weight="400" fill="var(--color-ink-muted, #5b6763)">FULL 图里录着一个等待点：回放停在注意力算子前，等 host 在 update stream 上把这一步的 seq_lens 换进去并 record 之后才继续。</text>
  <text x="20" y="558" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="12.5" font-weight="400" fill="var(--color-ink-muted, #5b6763)">启动期要录的是 19 档 × 两套 key = 38 个 batch_descriptor，piecewise 那套每个还要按 splitting_ops 切成多段——开图模式启动慢，钱花在这里。</text>
</svg>
