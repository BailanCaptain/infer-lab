<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 528" width="900" height="528" role="img" aria-label="AI QoS 四时隙 FIFO 与严格优先级对比及端点标签到交换机 VL 映射连线图" font-family="var(--font-sans)">
  <title>AI QoS：四时隙严格优先级排队效果 与 端点标签 → 交换机 VL 重映射连线</title>
  <desc>关联源码符号：AiqosConfig, aiqos_table, masterid_table, MASTER_ID_SDMA, MASTER_ID_PCIEDMA, _create_parser, run_unset, set_qos</desc>
  <defs>
    <marker id="qos-arr-t" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 1.5 L 8.5 5 L 0 8.5 z" fill="#087f73"/>
    </marker>
    <marker id="qos-arr-a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 1.5 L 8.5 5 L 0 8.5 z" fill="#c78300"/>
    </marker>
    <marker id="qos-arr-i" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 1.5 L 8.5 5 L 0 8.5 z" fill="#4c65b6"/>
    </marker>
  </defs>

  <!-- Zone 1: 4-Slot Link Timeline (FIFO vs SP) -->
  <text x="16" y="28" font-size="16" font-weight="700" fill="#17211f">① 四份等长数据争用同一出口（示意）：QoS 只挪等待，不增加物理总带宽</text>
  <line x1="14" y1="38" x2="886" y2="38" stroke="#b8bcb5" stroke-width="1.4"/>

  <!-- Slot width = 112 px, x=152..600 -->
  <g font-family="var(--font-mono)" font-size="13.5" fill="#66716d" text-anchor="middle">
    <text x="208" y="60">时隙 1</text>
    <text x="322" y="60">时隙 2</text>
    <text x="436" y="60">时隙 3</text>
    <text x="550" y="60">时隙 4</text>
  </g>

  <!-- Track A: Shared FIFO -->
  <text x="16" y="92" font-size="14" font-weight="700" fill="#4d5652">共享 FIFO 队列</text>
  <g font-size="13.5" font-weight="700" text-anchor="middle">
    <rect x="152" y="68" width="110" height="36" rx="5" fill="#e8edff" stroke="#4c65b6" stroke-width="1.4"/><text x="207" y="91" fill="#3a4f93">KV 预取 1</text>
    <rect x="266" y="68" width="110" height="36" rx="5" fill="#e8edff" stroke="#4c65b6" stroke-width="1.4"/><text x="321" y="91" fill="#3a4f93">KV 预取 2</text>
    <rect x="380" y="68" width="110" height="36" rx="5" fill="#e8edff" stroke="#4c65b6" stroke-width="1.4"/><text x="435" y="91" fill="#3a4f93">KV 预取 3</text>
    <rect x="494" y="68" width="110" height="36" rx="5" fill="#fff0e9" stroke="#b54237" stroke-width="1.8"/><text x="549" y="91" fill="#8f3229">关键通信</text>
  </g>
  <text x="618" y="91" font-size="13.5" font-weight="700" fill="#8f3229">关键通信拖到第 4 隙才完</text>

  <!-- Track B: Strict Priority VL -->
  <text x="16" y="142" font-size="14" font-weight="700" fill="#065f56">严格优先级 SP</text>
  <g font-size="13.5" font-weight="700" text-anchor="middle">
    <rect x="152" y="118" width="110" height="36" rx="5" fill="#ddf4ef" stroke="#087f73" stroke-width="2"/><text x="207" y="141" fill="#065f56">关键通信</text>
    <rect x="266" y="118" width="110" height="36" rx="5" fill="#e8edff" stroke="#4c65b6" stroke-width="1.4"/><text x="321" y="141" fill="#3a4f93">KV 预取 1</text>
    <rect x="380" y="118" width="110" height="36" rx="5" fill="#e8edff" stroke="#4c65b6" stroke-width="1.4"/><text x="435" y="141" fill="#3a4f93">KV 预取 2</text>
    <rect x="494" y="118" width="110" height="36" rx="5" fill="#fff4cf" stroke="#c78300" stroke-width="1.6"/><text x="549" y="141" fill="#936300">KV 预取 3</text>
  </g>
  <text x="618" y="135" font-size="13.5" font-weight="700" fill="#065f56">关键通信第 1 隙完成（省 3 隙）</text>
  <text x="618" y="155" font-size="13.5" fill="#936300">末份 KV 顺延 1 隙；总长仍 4 隙</text>

  <!-- Horizontal divider -->
  <line x1="14" y1="172" x2="886" y2="172" stroke="#b8bcb5" stroke-width="1.4" stroke-dasharray="6 4"/>

  <!-- Zone 2: Channel -> Tag -> Switch VL Wiring (v0.30.0 3-key left + legacy 5-key inset right) -->
  <text x="16" y="200" font-size="16" font-weight="700" fill="#17211f">② 端点打标 → UB 交换机重映射连线：v0.30.0 / main 三键（左） vs 旧版五键（右）</text>

  <!-- Column headers left -->
  <text x="16" y="226" font-size="13.5" font-weight="700" fill="#4d5652">步骤 1：端点写固定源标签</text>
  <text x="278" y="226" font-size="13.5" font-weight="700" fill="#4d5652">步骤 2~3：交换机合路到目标 VL + 设优先级</text>

  <!-- Channel 1: AIV -> Tag 4 -> VL 2 (prio 3) -->
  <rect x="16" y="238" width="212" height="58" rx="7" fill="#fff0e9" stroke="#b54237" stroke-width="1.4" stroke-dasharray="5 3"/>
  <text x="28" y="262" font-family="var(--font-mono)" font-size="14" font-weight="700" fill="#8f3229">AIV · 源标签 4</text>
  <text x="28" y="284" font-size="13.5" fill="#8f3229">默认 high（驱动不生效）</text>

  <line x1="230" y1="267" x2="274" y2="267" stroke="#c78300" stroke-width="1.8" marker-end="url(#qos-arr-a)"/>

  <rect x="278" y="238" width="306" height="58" rx="7" fill="#fff4cf" stroke="#c78300" stroke-width="1.4"/>
  <text x="292" y="262" font-size="14" font-weight="700" fill="#936300">初始 VL 0/1 汇入 → 目标 VL 2</text>
  <text x="292" y="284" font-size="13.5" fill="#4d5652">默认优先级 3 (high) · cacheable/non 均汇同队</text>

  <!-- Channel 2: PCIEDMA -> Tag 5 -> VL 3 (prio 3) -->
  <rect x="16" y="308" width="212" height="58" rx="7" fill="#ddf4ef" stroke="#087f73" stroke-width="1.4"/>
  <text x="28" y="332" font-family="var(--font-mono)" font-size="14" font-weight="700" fill="#065f56">PCIEDMA · 源标签 5</text>
  <text x="28" y="354" font-size="13.5" fill="#065f56">默认 high（3 档可选）</text>

  <line x1="230" y1="337" x2="274" y2="337" stroke="#087f73" stroke-width="1.8" marker-end="url(#qos-arr-t)"/>

  <rect x="278" y="308" width="306" height="58" rx="7" fill="#ddf4ef" stroke="#087f73" stroke-width="1.4"/>
  <text x="292" y="332" font-size="14" font-weight="700" fill="#065f56">初始 VL 0/1 汇入 → 目标 VL 3</text>
  <text x="292" y="354" font-size="13.5" fill="#4d5652">默认优先级 3 (high) · SP 先发高优先级队列</text>

  <!-- Channel 3: SDMA -> Tag 6 -> VL 4 (prio 1) -->
  <rect x="16" y="378" width="212" height="58" rx="7" fill="#e8edff" stroke="#4c65b6" stroke-width="1.4"/>
  <text x="28" y="402" font-family="var(--font-mono)" font-size="14" font-weight="700" fill="#3a4f93">SDMA · 源标签 6</text>
  <text x="28" y="424" font-size="13.5" fill="#3a4f93">整类默认 low（3 档可选）</text>

  <line x1="230" y1="407" x2="274" y2="407" stroke="#4c65b6" stroke-width="1.8" marker-end="url(#qos-arr-i)"/>

  <rect x="278" y="378" width="306" height="58" rx="7" fill="#e8edff" stroke="#4c65b6" stroke-width="1.4"/>
  <text x="292" y="402" font-size="14" font-weight="700" fill="#3a4f93">初始 VL 0/1 汇入 → 目标 VL 4</text>
  <text x="292" y="424" font-size="13.5" fill="#4d5652">默认优先级 1 (low) · 拥塞时主动让路</text>

  <!-- Right Legacy 5-Key Inset (x=602..884) -->
  <line x1="594" y1="216" x2="594" y2="438" stroke="#b8bcb5" stroke-width="1.3" stroke-dasharray="5 4"/>
  <rect x="606" y="216" width="278" height="220" rx="8" fill="#ece9df" fill-opacity="0.7" stroke="#8a928f" stroke-width="1.4"/>
  <text x="620" y="242" font-size="14.5" font-weight="700" fill="#17211f">旧版五键（v0.23 / v0.26）</text>
  <text x="620" y="264" font-family="var(--font-mono)" font-size="13.5" fill="#66716d">python tools/ai_qos.py</text>

  <rect x="620" y="276" width="250" height="44" rx="6" fill="#ffffff" stroke="#8a928f" stroke-width="1.2"/>
  <text x="745" y="295" text-anchor="middle" font-size="13.5" font-weight="700" fill="#17211f">SDMA 共用源标签 = min(6,2) = 2</text>
  <text x="745" y="313" text-anchor="middle" font-size="13.5" fill="#66716d">交换机靠初始 VL 0 / 1 拆向</text>

  <rect x="620" y="330" width="250" height="42" rx="6" fill="#ddf4ef" stroke="#087f73" stroke-width="1.3"/>
  <text x="632" y="356" font-size="13.5" font-weight="700" fill="#065f56">D2D (初 VL0) → VL 2 (prio 3)</text>

  <rect x="620" y="380" width="250" height="42" rx="6" fill="#e8edff" stroke="#4c65b6" stroke-width="1.3"/>
  <text x="632" y="406" font-size="13.5" font-weight="700" fill="#3a4f93">H2D (初 VL1) → VL 3 (prio 1)</text>

  <!-- Zone 3: 3 Operational Guardrails -->
  <line x1="14" y1="454" x2="886" y2="454" stroke="#b8bcb5" stroke-width="1.4" stroke-dasharray="6 4"/>
  <rect x="16" y="468" width="278" height="46" rx="6" fill="#fff0e9" stroke="#b54237" stroke-width="1.3"/>
  <text x="155" y="496" text-anchor="middle" font-size="13.5" font-weight="700" fill="#8f3229">AIV 参数受驱动限制当前不生效</text>

  <rect x="311" y="468" width="278" height="46" rx="6" fill="#fff4cf" stroke="#c78300" stroke-width="1.3"/>
  <text x="450" y="496" text-anchor="middle" font-size="13.5" font-weight="700" fill="#936300">仅限 A3 拓扑，A2 GLM 未启用</text>

  <rect x="606" y="468" width="278" height="46" rx="6" fill="#e8edff" stroke="#4c65b6" stroke-width="1.3"/>
  <text x="745" y="496" text-anchor="middle" font-size="13.5" font-weight="700" fill="#3a4f93">unset 在执行交换机回滚前删快照</text>
</svg>
