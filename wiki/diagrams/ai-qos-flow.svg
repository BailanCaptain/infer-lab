<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 1064" width="860" height="1064" role="img" aria-label="独立配置脚本在 A0 推理启动前运行；apply 写端点并打印交换机命令，unset 尝试恢复端点并打印 undo。两条分支都需要操作者在交换机完成配置，A4 执行时才由网络按规则服务流量。">
  <title>独立配置脚本在 A0 推理启动前运行；apply 写端点并打印交换机命令，unset 尝试恢复端点并打印 undo。两条分支都需要操作者在交换机完成配置，A4 执行时才由网络按规则服务流量。</title>
