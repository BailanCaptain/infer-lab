<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 1040" width="860" height="1040" role="img" aria-label="独立配置脚本在 A0 推理启动前运行；apply 写端点并打印交换机命令，unset 尝试恢复端点并打印 undo。两条分支都需要操作者在交换机完成配置，A4 执行时才由网络按规则服务流量。">
  <title>独立配置脚本在 A0 推理启动前运行；apply 写端点并打印交换机命令，unset 尝试恢复端点并打印 undo。两条分支都需要操作者在交换机完成配置，A4 执行时才由网络按规则服务流量。</title>
  <defs><marker id="ai-qos-flow-ah-control" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="var(--color-control, #66716d)"/></marker><marker id="ai-qos-flow-ah-comm" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="var(--color-comm, #9a4b86)"/></marker><marker id="ai-qos-flow-ah-danger" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="var(--color-danger, #b54237)"/></marker><marker id="ai-qos-flow-ah-token" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="var(--color-token, #087f73)"/></marker></defs>
  <rect x="20" y="115" width="395" height="665" rx="16" fill="none" stroke="var(--color-line-strong, #b8bcb5)" stroke-width="1.5"/>
  <text x="36" y="103" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="15" font-weight="700" fill="var(--color-ink, #17211f)">apply · 应用配置</text>
  <rect x="445" y="115" width="395" height="665" rx="16" fill="none" stroke="var(--color-line-strong, #b8bcb5)" stroke-width="1.5"/>
  <text x="461" y="103" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="15" font-weight="700" fill="var(--color-ink, #17211f)">unset · 恢复配置</text>
  <rect x="20" y="840" width="820" height="175" rx="16" fill="none" stroke="var(--color-line-strong, #b8bcb5)" stroke-width="1.5"/>
  <text x="36" y="828" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="15" font-weight="700" fill="var(--color-ink, #17211f)">配置后的请求主线</text>
