  <text x="635" y="339" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="13" font-weight="400" fill="#3a4f93" text-anchor="middle">低优先级 VL · 甲先到，丙最后</text>
  <rect x="175" y="480" width="126" height="42" fill="var(--color-comm-soft, #f5e6f0)"/>
  <text x="238" y="505.7" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="13" font-weight="700" fill="var(--color-ink, #17211f)" text-anchor="middle">1 · 通信</text>
  <rect x="301" y="480" width="126" height="42" fill="var(--color-kv-soft, #e8edff)"/>
  <text x="364" y="505.7" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="13" font-weight="700" fill="var(--color-ink, #17211f)" text-anchor="middle">2 · 状态甲</text>
  <rect x="427" y="480" width="126" height="42" fill="var(--color-kv-soft, #e8edff)"/>
  <text x="490" y="505.7" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="13" font-weight="700" fill="var(--color-ink, #17211f)" text-anchor="middle">3 · 状态乙</text>
  <rect x="553" y="480" width="126" height="42" fill="var(--color-kv-soft, #e8edff)"/>
  <text x="616" y="505.7" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="13" font-weight="700" fill="var(--color-ink, #17211f)" text-anchor="middle">4 · 状态丙</text>
  <path d="M301 480v42M427 480v42M553 480v42" stroke="var(--color-kv, #4c65b6)" stroke-opacity="0.3" stroke-width="1" fill="none"/>
  <rect x="175" y="480" width="504" height="42" fill="none" stroke="var(--color-kv, #4c65b6)" stroke-width="1.4"/>
  <rect x="65" y="75" width="320" height="60" rx="8" fill="var(--color-comm-soft, #f5e6f0)" stroke="var(--color-comm, #9a4b86)" stroke-width="1.4"/>
  <text x="225" y="101" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="14" font-weight="700" fill="var(--color-ink, #17211f)" text-anchor="middle">卡 0 → 卡 1 · 关键通信</text>
  <text x="225" y="120" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="13" font-weight="400" fill="#7a3a6a" text-anchor="middle">计算等这份结果</text>
  <rect x="475" y="75" width="320" height="60" rx="8" fill="var(--color-kv-soft, #e8edff)" stroke="var(--color-kv, #4c65b6)" stroke-width="1.4"/>
  <text x="635" y="101" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="14" font-weight="700" fill="var(--color-ink, #17211f)" text-anchor="middle">主机 → 卡 1 · KV cache 预取</text>
  <text x="635" y="120" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="13" font-weight="400" fill="#3a4f93" text-anchor="middle">提前搬入后面要用的历史状态</text>
</svg>
