<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 590" width="860" height="590" role="img" aria-label="与正文时隙算例共用四份等长数据：三份状态先到、关键通信后到，出口刚空闲，四份都尚未发送。高优先级队列的通信先出，状态甲、乙、丙随后依次出；编号表示发送次序，每块占一个示意时隙，不表示真实耗时或中途抢占。">
  <title>与正文时隙算例共用四份等长数据：三份状态先到、关键通信后到，出口刚空闲，四份都尚未发送。高优先级队列的通信先出，状态甲、乙、丙随后依次出；编号表示发送次序，每块占一个示意时隙，不表示真实耗时或中途抢占。</title>
  <defs><marker id="ai-qos-intuition-ah-comm" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="var(--color-comm, #9a4b86)"/></marker><marker id="ai-qos-intuition-ah-kv" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="var(--color-kv, #4c65b6)"/></marker></defs>
  <rect x="20" y="40" width="820" height="125" rx="16" fill="none" stroke="var(--color-line-strong, #b8bcb5)" stroke-width="1.5"/>
  <text x="36" y="28" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="15" font-weight="700" fill="var(--color-ink, #17211f)">流量从哪里来</text>
  <rect x="20" y="215" width="820" height="170" rx="16" fill="none" stroke="var(--color-line-strong, #b8bcb5)" stroke-width="1.5"/>
  <text x="36" y="203" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="15" font-weight="700" fill="var(--color-ink, #17211f)">交换机</text>
  <rect x="20" y="435" width="820" height="130" rx="16" fill="none" stroke="var(--color-line-strong, #b8bcb5)" stroke-width="1.5"/>
  <text x="36" y="423" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="15" font-weight="700" fill="var(--color-ink, #17211f)">出口发送次序</text>
  <path d="M225 135 L225 275" fill="none" stroke="var(--color-comm, #9a4b86)" stroke-width="2.2" marker-end="url(#ai-qos-intuition-ah-comm)"/>
  <path d="M635 135 L635 275" fill="none" stroke="var(--color-kv, #4c65b6)" stroke-width="1.4" marker-end="url(#ai-qos-intuition-ah-kv)"/>
  <path d="M275 296 L355 296 L355 409 L238 409 L238 480" fill="none" stroke="var(--color-comm, #9a4b86)" stroke-width="2.2" marker-end="url(#ai-qos-intuition-ah-comm)"/>
  <path d="M779 296 L810 296 L810 419 L490 419 L490 480" fill="none" stroke="var(--color-kv, #4c65b6)" stroke-width="1.4" stroke-dasharray="7 5" marker-end="url(#ai-qos-intuition-ah-kv)"/>
  <rect x="175" y="275" width="100" height="42" fill="var(--color-comm-soft, #f5e6f0)"/>
  <text x="225" y="300.7" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="13" font-weight="700" fill="var(--color-ink, #17211f)" text-anchor="middle">关键通信</text>
  <rect x="175" y="275" width="100" height="42" fill="none" stroke="var(--color-comm, #9a4b86)" stroke-width="1.4"/>
  <text x="225" y="339" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="13" font-weight="400" fill="#7a3a6a" text-anchor="middle">高优先级 VL</text>
  <rect x="491" y="275" width="96" height="42" fill="var(--color-kv-soft, #e8edff)"/>
  <text x="539" y="300.7" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="13" font-weight="700" fill="var(--color-ink, #17211f)" text-anchor="middle">状态甲</text>
  <rect x="587" y="275" width="96" height="42" fill="var(--color-kv-soft, #e8edff)"/>
  <text x="635" y="300.7" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="13" font-weight="700" fill="var(--color-ink, #17211f)" text-anchor="middle">状态乙</text>
  <rect x="683" y="275" width="96" height="42" fill="var(--color-kv-soft, #e8edff)"/>
  <text x="731" y="300.7" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="13" font-weight="700" fill="var(--color-ink, #17211f)" text-anchor="middle">状态丙</text>
  <path d="M587 275v42M683 275v42" stroke="var(--color-kv, #4c65b6)" stroke-opacity="0.3" stroke-width="1" fill="none"/>
