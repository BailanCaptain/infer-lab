<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 280" width="900" height="280" role="img" aria-label="同一个 SDMA 标签，交换机靠入口车道把集合通信和 KV 搬运分进两条优先级不同的车道">
  <title>同一个 SDMA 标签，交换机靠入口车道把集合通信和 KV 搬运分进两条优先级不同的车道</title>
  <defs><marker id="ai-qos-ah-comm" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="var(--color-comm, #9a4b86)"/></marker><marker id="ai-qos-ah-kv" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="var(--color-kv, #4c65b6)"/></marker><marker id="ai-qos-ah-ink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="var(--color-ink, #17211f)"/></marker></defs>
  <path d="M345 30 L345 260" fill="none" stroke="var(--color-ink-muted, #66716d)" stroke-width="1.4" stroke-dasharray="6 5"/>
  <text x="333" y="44" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="13" font-weight="700" fill="var(--color-ink-muted, #66716d)" text-anchor="end">NPU 端：脚本写进驱动</text>
  <text x="357" y="44" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="13" font-weight="700" fill="var(--color-ink-muted, #66716d)">UB 交换机：人去敲命令</text>
  <path d="M220 94 L250 138" fill="none" stroke="var(--color-comm, #9a4b86)" stroke-width="2.2" marker-end="url(#ai-qos-ah-comm)"/>
  <path d="M220 204 L250 152" fill="none" stroke="var(--color-kv, #4c65b6)" stroke-width="1.4" marker-end="url(#ai-qos-ah-kv)"/>
  <path d="M320 145 L380 145" fill="none" stroke="var(--color-ink, #17211f)" stroke-width="1.4" marker-end="url(#ai-qos-ah-ink)"/>
  <path d="M550 135 L620 86" fill="none" stroke="var(--color-comm, #9a4b86)" stroke-width="2.2" marker-end="url(#ai-qos-ah-comm)"/>
  <path d="M550 155 L620 206" fill="none" stroke="var(--color-kv, #4c65b6)" stroke-width="1.4" marker-end="url(#ai-qos-ah-kv)"/>
  <rect x="30" y="70" width="190" height="48" rx="8" fill="var(--color-comm, #9a4b86)" stroke="var(--color-ink, #17211f)" stroke-width="1.5"/>
  <text x="125" y="99" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="14" font-weight="700" fill="var(--color-ink-inverse, #ffffff)" text-anchor="middle">集合通信（入口 0）</text>
  <rect x="30" y="180" width="190" height="48" rx="8" fill="var(--color-kv, #4c65b6)" stroke="var(--color-ink, #17211f)" stroke-width="1.5"/>
  <text x="125" y="209" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="14" font-weight="700" fill="var(--color-ink-inverse, #ffffff)" text-anchor="middle">KV 搬到主机（入口 1）</text>
  <rect x="250" y="122" width="70" height="46" rx="8" fill="var(--color-surface-sunken, #ece9df)" stroke="var(--color-ink, #17211f)" stroke-width="1.5"/>
  <text x="285" y="150" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="14" font-weight="700" fill="var(--color-ink, #17211f)" text-anchor="middle">标签 2</text>
  <rect x="380" y="118" width="170" height="54" rx="8" fill="var(--color-surface-sunken, #ece9df)" stroke="var(--color-control, #66716d)" stroke-opacity="0.4" stroke-width="1.5" stroke-dasharray="5 4"/>
  <text x="465" y="150" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="13" font-weight="400" fill="#4d5652" text-anchor="middle">按标签和入口查表</text>
  <rect x="620" y="60" width="250" height="52" rx="8" fill="var(--color-comm, #9a4b86)" stroke="var(--color-ink, #17211f)" stroke-width="1.5"/>
  <text x="745" y="91" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="14" font-weight="700" fill="var(--color-ink-inverse, #ffffff)" text-anchor="middle">车道 2 · 优先级 3</text>
  <rect x="620" y="180" width="250" height="52" rx="8" fill="var(--color-kv-soft, #e8edff)" stroke="var(--color-kv, #4c65b6)" stroke-opacity="0.4" stroke-width="1.5" stroke-dasharray="5 4"/>
  <text x="745" y="211" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="13" font-weight="400" fill="#3a4f93" text-anchor="middle">车道 3 · 优先级 1</text>
</svg>
