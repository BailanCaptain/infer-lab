<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 426" width="900" height="426" role="img" aria-label="910B 分离架构四步走读：y = ReLU(xW) 在核外 GM 与 AIC、AIV 间的落点与交接" font-family="var(--font-sans)">
<title>910B 分离架构四步走读：y = ReLU(xW) 数据落点与跨核 GM 交接</title>
<desc>依据 CANN 8.0.RC2 基本架构：输入 [1, 2] 与权重 [[1, -1], [2, -2]] 在 AIC 算出 [5, -5] 写回 GM 中间缓冲，再入 AIV UB 经 ReLU 得 [5, 0]</desc>
