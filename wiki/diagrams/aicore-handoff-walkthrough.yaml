mode: native-svg
id: aicore-handoff-walkthrough
caption: >-
  依据 CANN 8.0.RC2「基本架构」绘制的单颗 910B 分离架构 y = ReLU(xW) 四步数据落点走读：输入 x = [1, 2] 与权重 W 经 MTE2/MTE1 备入 AIC 的 L0A/L0B，Cube 乘加在 L0C 算出 [5, -5] 后经 FixPipe 写回核外 GM 中间缓冲（是否命中核外 L2 或触发外部 HBM 事务由下层缓存决定）；AIV 再经 MTE2 将 [5, -5] 搬入 UB，由 Vector 逐项执行 ReLU 得到 [5, 0] 并经 MTE3 写回 GM 输出。
size: [900, 426]
