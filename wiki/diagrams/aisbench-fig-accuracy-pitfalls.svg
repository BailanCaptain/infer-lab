<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 448" width="900" height="448" role="img" aria-label="AISBench 与 EvalScope 精度基线四类高频掉点陷阱图解：长思维链截断、未剥离 think 标签、小样本采样方差与镜像环境变量分流" font-family="var(--font-sans)">
  <title>精度评测四类非算子掉点陷阱可视化自检板</title>
  <desc>Four geometric accuracy-drop pitfalls: CoT truncation bar vs max_model_len > 35000, think-tag regex false extraction vs extract_non_reasoning_content, AIME 2024 small-sample variance temp=0.6 vs temp=0, and VLLM_USE_MODELSCOPE vs HF_ENDPOINT routing</desc>
  <defs>
    <marker id="ap-arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="#4d5652"/>
    </marker>
  </defs>

  <text x="16" y="26" font-size="16" font-weight="700" fill="#17211f">掉点 10~30 分先别怀疑算子：四类高频评测配置陷阱自检图</text>

  <!-- Quadrant 1 (Top-Left): CoT Length Truncation Bar -->
  <rect x="16" y="42" width="424" height="188" rx="8" fill="#ffffff" stroke="#b54237" stroke-width="1.4"/>
  <text x="30" y="68" font-size="14.5" font-weight="700" fill="#8f3229">① 思维链截断：答案框还没写到就被强停</text>
  <!-- Bad bar -->
  <text x="30" y="96" font-size="13.5" fill="#8f3229">✗ max_out_len=2048</text>
  <rect x="30" y="104" width="60" height="24" rx="3" fill="#e8edff" stroke="#4c65b6"/>
  <text x="60" y="121" text-anchor="middle" font-size="13.5" fill="#3a4f93">输入</text>
  <rect x="92" y="104" width="150" height="24" rx="3" fill="#fff0e9" stroke="#b54237"/>
  <text x="167" y="121" text-anchor="middle" font-size="13.5" fill="#8f3229">&lt;think&gt; 推导到一半…</text>
  <line x1="244" y1="96" x2="244" y2="136" stroke="#b54237" stroke-width="2.4"/>
  <text x="252" y="121" font-size="13.5" font-weight="700" fill="#8f3229">被截断 → 无答案</text>
  <!-- Good bar -->
  <text x="30" y="158" font-size="13.5" fill="#065f56">✓ max_model_len &gt; 35000 · max_out_len=32768</text>
  <rect x="30" y="166" width="60" height="24" rx="3" fill="#e8edff" stroke="#4c65b6"/>
  <rect x="92" y="166" width="224" height="24" rx="3" fill="#fff4cf" stroke="#c78300"/>
  <text x="204" y="183" text-anchor="middle" font-size="13.5" fill="#936300">&lt;think&gt; 完整推导 &lt;/think&gt;</text>
  <rect x="318" y="166" width="106" height="24" rx="3" fill="#ddf4ef" stroke="#087f73" stroke-width="1.5"/>
  <text x="371" y="183" text-anchor="middle" font-size="13.5" font-weight="700" fill="#065f56">最终答案 ✓</text>
  <text x="30" y="216" font-size="13.5" fill="#4d5652">约束：输入长度 + max_out_len &lt; --max-model-len</text>

  <!-- Quadrant 2 (Top-Right): Think Tag Regex False Capture -->
  <rect x="460" y="42" width="424" height="188" rx="8" fill="#ffffff" stroke="#c78300" stroke-width="1.4"/>
  <text x="474" y="68" font-size="14.5" font-weight="700" fill="#936300">② 未剥离 &lt;think&gt; 标签：正则误抓中间试错数</text>
  <!-- Token string strip -->
  <rect x="474" y="84" width="248" height="36" rx="5" fill="#fff0e9" stroke="#b54237" stroke-width="1.3"/>
  <text x="598" y="107" text-anchor="middle" font-family="var(--font-mono)" font-size="13.5" fill="#8f3229">&lt;think&gt; 先试 42，错了… &lt;/think&gt;</text>
  <rect x="726" y="84" width="144" height="36" rx="5" fill="#ddf4ef" stroke="#087f73" stroke-width="1.5"/>
  <text x="798" y="107" text-anchor="middle" font-family="var(--font-mono)" font-size="13.5" font-weight="700" fill="#065f56">最终答案 = 17</text>

  <!-- Two extraction paths -->
  <rect x="474" y="134" width="192" height="50" rx="6" fill="#fff0e9" stroke="#b54237" stroke-width="1.2"/>
  <text x="570" y="156" text-anchor="middle" font-size="13.5" font-weight="700" fill="#8f3229">✗ 无后处理直接正则</text>
  <text x="570" y="176" text-anchor="middle" font-size="13.5" fill="#8f3229">误抓试错数 42 → 判错</text>

  <rect x="678" y="134" width="192" height="50" rx="6" fill="#ddf4ef" stroke="#087f73" stroke-width="1.3"/>
  <text x="774" y="156" text-anchor="middle" font-size="13.5" font-weight="700" fill="#065f56">✓ 剥离思维链后提取</text>
  <text x="774" y="176" text-anchor="middle" font-size="13.5" fill="#065f56">准确抓取 17 → 判对</text>
  <text x="466" y="216" font-family="var(--font-mono)" font-size="12" fill="#4d5652">pred_postprocessor = extract_non_reasoning_content</text>

  <!-- Quadrant 3 (Bottom-Left): Small Sample Variance -->
  <rect x="16" y="246" width="424" height="186" rx="8" fill="#ffffff" stroke="#4c65b6" stroke-width="1.4"/>
  <text x="30" y="272" font-size="14.5" font-weight="700" fill="#3a4f93">③ 小样本采样波动（如 AIME 2024 仅 30 题）</text>
  <!-- Horizontal score axis 50% .. 90% -->
  <line x1="154" y1="382" x2="418" y2="382" stroke="#66716d" stroke-width="1.3"/>
  <g font-family="var(--font-mono)" font-size="13.5" fill="#66716d" text-anchor="middle">
    <text x="164" y="401">60%</text><text x="286" y="401">70%</text><text x="406" y="401">80%</text>
  </g>
  <!-- temp=0.6 wide swing bar -->
  <text x="30" y="314" font-size="13.5" font-weight="700" fill="#8f3229">temp=0.6 随机</text>
  <line x1="186" y1="308" x2="386" y2="308" stroke="#b54237" stroke-width="4"/>
  <circle cx="204" cy="308" r="5" fill="#b54237"/><circle cx="272" cy="308" r="5" fill="#b54237"/><circle cx="364" cy="308" r="5" fill="#b54237"/>
  <text x="286" y="297" text-anchor="middle" font-size="13.5" fill="#8f3229">单次波动 ±5~10%</text>

  <!-- temp=0 deterministic point -->
  <text x="30" y="358" font-size="13.5" font-weight="700" fill="#065f56">temp=0 回归基线</text>
  <circle cx="286" cy="352" r="6.5" fill="#087f73"/>
  <text x="304" y="357" font-size="13.5" font-weight="700" fill="#065f56">锚点稳定可比</text>
  <text x="30" y="422" font-size="13.5" fill="#4d5652">工程回归锁 temp=0 或多种子均值；对榜单再切推荐采样</text>

  <!-- Quadrant 4 (Bottom-Right): Mirror Env Var Routing -->
  <rect x="460" y="246" width="424" height="186" rx="8" fill="#ffffff" stroke="#9a4b86" stroke-width="1.4"/>
  <text x="474" y="272" font-size="14.5" font-weight="700" fill="#7a3a6a">④ 镜像变量各管各的路：混用仍会拉取超时</text>

  <rect x="474" y="290" width="218" height="44" rx="6" fill="#e8edff" stroke="#4c65b6" stroke-width="1.3"/>
  <text x="583" y="317" text-anchor="middle" font-family="var(--font-mono)" font-size="13.5" font-weight="700" fill="#3a4f93">VLLM_USE_MODELSCOPE=True</text>
  <line x1="692" y1="312" x2="722" y2="312" stroke="#4d5652" stroke-width="1.6" marker-end="url(#ap-arr)"/>
  <rect x="724" y="290" width="146" height="44" rx="6" fill="#ddf4ef" stroke="#087f73" stroke-width="1.3"/>
  <text x="797" y="317" text-anchor="middle" font-size="13.5" font-weight="700" fill="#065f56">仅管模型/分词器</text>

  <rect x="474" y="348" width="218" height="44" rx="6" fill="#f7e7f2" stroke="#9a4b86" stroke-width="1.3"/>
  <text x="583" y="375" text-anchor="middle" font-family="var(--font-mono)" font-size="13.5" font-weight="700" fill="#7a3a6a">HF_ENDPOINT=镜像源</text>
  <line x1="692" y1="370" x2="722" y2="370" stroke="#4d5652" stroke-width="1.6" marker-end="url(#ap-arr)"/>
  <rect x="724" y="348" width="146" height="44" rx="6" fill="#fff4cf" stroke="#c78300" stroke-width="1.3"/>
  <text x="797" y="375" text-anchor="middle" font-size="13.5" font-weight="700" fill="#936300">管 HF 评测数据集</text>

  <text x="474" y="422" font-size="13.5" fill="#8f3229">注意：wget / git clone 静态链接不受 HF_ENDPOINT 改写</text>
</svg>
