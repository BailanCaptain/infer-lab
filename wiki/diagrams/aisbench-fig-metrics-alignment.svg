<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 468" width="900" height="468" role="img" aria-label="客户端压测指标与服务端 Prometheus /metrics 时延精确覆盖区间对齐及开环突发性 burstiness 刻度图" font-family="var(--font-sans)">
  <title>客户端压测与服务端 /metrics 的 TTFT / TPOT / ITL 精确边界对齐</title>
  <desc>Exact aligned timeline comparing Client TTFT/TPOT/ITL (spanning network, proxy, and first/last SSE transit) against Server /metrics (TTFT from API frontend arrival to first output batch stats; decode_time ending at last engine output event without SSE return), plus burstiness arrival ticks</desc>
  <defs>
    <marker id="ab-arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="#4d5652"/>
    </marker>
  </defs>

  <text x="16" y="26" font-size="16" font-weight="700" fill="#17211f">① 一条流式请求全生命周期：客户端报告 vs 服务端 /metrics 各自量哪一段</text>
  <text x="884" y="26" text-anchor="end" font-size="13.5" fill="#66716d">同一水平阶段尺（虚线对齐交接点）</text>

  <!-- Vertical alignment guides at key boundaries: x=122, 404, 478, 788 -->
  <g stroke="#d8d8cf" stroke-width="1" stroke-dasharray="4 3">
    <line x1="122" y1="54" x2="122" y2="274"/>
    <line x1="404" y1="54" x2="404" y2="274"/>
    <line x1="478" y1="54" x2="478" y2="274"/>
    <line x1="788" y1="54" x2="788" y2="274"/>
  </g>

  <!-- Row 1: Physical stages (y = 56 .. 116) -->
  <rect x="16" y="58" width="102" height="54" rx="6" fill="#ece9df" stroke="#b8bcb5" stroke-width="1.3"/>
  <text x="67" y="81" text-anchor="middle" font-size="13.5" font-weight="700" fill="#17211f">网络 / 反代</text>
  <text x="67" y="102" text-anchor="middle" font-size="13.5" fill="#4d5652">客户端→API</text>

  <rect x="122" y="58" width="102" height="54" rx="6" fill="#fff0e9" stroke="#b54237" stroke-width="1.4"/>
  <text x="173" y="81" text-anchor="middle" font-size="13.5" font-weight="700" fill="#8f3229">API 到达/排队</text>
  <text x="173" y="102" text-anchor="middle" font-size="13.5" fill="#4d5652">分词与入队</text>

  <rect x="228" y="58" width="108" height="54" rx="6" fill="#fff4cf" stroke="#c78300" stroke-width="1.4"/>
  <text x="282" y="81" text-anchor="middle" font-family="var(--font-mono)" font-size="13.5" font-weight="700" fill="#936300">prefill</text>
  <text x="282" y="102" text-anchor="middle" font-size="13.5" fill="#4d5652">首调 → 首词</text>

  <rect x="340" y="58" width="64" height="54" rx="6" fill="#fff4cf" stroke="#c78300" stroke-width="1.3"/>
  <text x="372" y="81" text-anchor="middle" font-size="13.5" font-weight="700" fill="#936300">首批</text>
  <text x="372" y="102" text-anchor="middle" font-size="13.5" fill="#4d5652">统计点</text>

  <rect x="408" y="58" width="70" height="54" rx="6" fill="#f7e7f2" stroke="#9a4b86" stroke-width="1.4"/>
  <text x="443" y="81" text-anchor="middle" font-size="13.5" font-weight="700" fill="#7a3a6a">首 SSE</text>
  <text x="443" y="102" text-anchor="middle" font-size="13.5" fill="#7a3a6a">回传</text>

  <rect x="482" y="58" width="306" height="54" rx="6" fill="#ddf4ef" stroke="#087f73" stroke-width="1.4"/>
  <text x="635" y="81" text-anchor="middle" font-size="14" font-weight="700" fill="#065f56">decode_time（引擎首词 → 末词）</text>
  <!-- Token ticks inside decode bar showing proxy coalescing -->
  <g stroke="#087f73" stroke-width="1.8">
    <line x1="518" y1="92" x2="518" y2="106"/>
    <line x1="556" y1="92" x2="556" y2="106"/>
    <line x1="594" y1="92" x2="594" y2="106"/>
    <line x1="654" y1="92" x2="654" y2="106"/>
    <line x1="664" y1="92" x2="664" y2="106"/>
    <line x1="674" y1="92" x2="674" y2="106"/>
    <line x1="742" y1="92" x2="742" y2="106"/>
  </g>
  <text x="678" y="104" font-size="12" fill="#8f3229">← 代理合包毛刺</text>

  <rect x="792" y="58" width="92" height="54" rx="6" fill="#ece9df" stroke="#b8bcb5" stroke-width="1.3"/>
  <text x="838" y="81" text-anchor="middle" font-size="13.5" font-weight="700" fill="#17211f">末块 SSE</text>
  <text x="838" y="102" text-anchor="middle" font-size="13.5" fill="#4d5652">到达客户端</text>

  <!-- Row 2: Client Span (TTFT 16..478, TPOT 482..884) -->
  <rect x="16" y="132" width="462" height="44" rx="6" fill="#e8edff" stroke="#4c65b6" stroke-width="1.6"/>
  <text x="247" y="159" text-anchor="middle" font-size="14" font-weight="700" fill="#3a4f93">客户端 TTFT（含网络、反代、API 到达、Prefill 与首 SSE 回传）</text>

  <rect x="482" y="132" width="402" height="44" rx="6" fill="#f7e7f2" stroke="#9a4b86" stroke-width="1.6"/>
  <text x="683" y="159" text-anchor="middle" font-size="14" font-weight="700" fill="#7a3a6a">客户端 TPOT = (E2E − TTFT) ÷ (N_out − 1)</text>

  <!-- Row 3: Server /metrics Span (TTFT 122..404, Decode/ITL 408..788) -->
  <rect x="122" y="192" width="282" height="44" rx="6" fill="#fff4cf" stroke="#c78300" stroke-width="1.6"/>
  <text x="263" y="219" text-anchor="middle" font-size="14" font-weight="700" fill="#936300">服务端 TTFT（API 到达→首输出批统计）</text>

  <rect x="408" y="192" width="380" height="44" rx="6" fill="#ddf4ef" stroke="#087f73" stroke-width="1.6"/>
  <text x="598" y="219" text-anchor="middle" font-size="12" font-weight="700" fill="#065f56">服务端 decode_time / ITL（止于末次引擎出词，不含 SSE）</text>

  <!-- Delta callout explaining Client - Server TTFT -->
  <text x="16" y="264" font-size="13.5" font-weight="700" fill="#3a4f93">▸ 客户端 TTFT − 服务端 TTFT = 客户端到 API 网络/反代 + 首块 SSE 回传；若漏加 --stream 则 TTFT 退化为 E2E</text>

  <line x1="16" y1="286" x2="884" y2="286" stroke="#b8bcb5" stroke-width="1.3" stroke-dasharray="6 4"/>

  <!-- Bottom: Burstiness Arrival Pattern Ticks + Warmup/Prefix Guard -->
  <text x="16" y="314" font-size="15.5" font-weight="700" fill="#17211f">② 开环到达率 burstiness 脉冲形态 vs 预热/前缀缓存去污染</text>

  <!-- Left: 3 burstiness arrival tick tracks (x=16..450) -->
  <text x="16" y="346" font-family="var(--font-mono)" font-size="13.5" font-weight="700" fill="#8f3229">burstiness &lt; 1（尖刺）</text>
  <line x1="196" y1="342" x2="444" y2="342" stroke="#b8bcb5" stroke-width="1.4"/>
  <g stroke="#b54237" stroke-width="2.4">
    <line x1="212" y1="330" x2="212" y2="352"/><line x1="222" y1="330" x2="222" y2="352"/><line x1="230" y1="330" x2="230" y2="352"/><line x1="239" y1="330" x2="239" y2="352"/>
    <line x1="358" y1="330" x2="358" y2="352"/><line x1="367" y1="330" x2="367" y2="352"/><line x1="376" y1="330" x2="376" y2="352"/>
  </g>

  <text x="16" y="388" font-family="var(--font-mono)" font-size="13.5" font-weight="700" fill="#065f56">burstiness = 1（泊松）</text>
  <line x1="196" y1="384" x2="444" y2="384" stroke="#b8bcb5" stroke-width="1.4"/>
  <g stroke="#087f73" stroke-width="2.4">
    <line x1="208" y1="372" x2="208" y2="394"/><line x1="242" y1="372" x2="242" y2="394"/><line x1="262" y1="372" x2="262" y2="394"/><line x1="312" y1="372" x2="312" y2="394"/>
    <line x1="348" y1="372" x2="348" y2="394"/><line x1="398" y1="372" x2="398" y2="394"/><line x1="422" y1="372" x2="422" y2="394"/>
  </g>

  <text x="16" y="430" font-family="var(--font-mono)" font-size="13.5" font-weight="700" fill="#3a4f93">burstiness &gt; 1（均匀）</text>
  <line x1="196" y1="426" x2="444" y2="426" stroke="#b8bcb5" stroke-width="1.4"/>
  <g stroke="#4c65b6" stroke-width="2.4">
    <line x1="210" y1="414" x2="210" y2="436"/><line x1="246" y1="414" x2="246" y2="436"/><line x1="282" y1="414" x2="282" y2="436"/><line x1="318" y1="414" x2="318" y2="436"/>
    <line x1="354" y1="414" x2="354" y2="436"/><line x1="390" y1="414" x2="390" y2="436"/><line x1="426" y1="414" x2="426" y2="436"/>
  </g>

  <!-- Right: Pollution Check Cards (x=472..884) -->
  <rect x="472" y="328" width="412" height="58" rx="7" fill="#fff4cf" stroke="#c78300" stroke-width="1.4"/>
  <text x="486" y="352" font-size="14" font-weight="700" fill="#936300">预热剔除：先跑小批请求并丢弃首轮数据</text>
  <text x="486" y="374" font-size="13.5" fill="#4d5652">消化首次 ATB 缓存写入、动态形状分支与 TCP 长连接建连</text>

  <rect x="472" y="396" width="412" height="58" rx="7" fill="#fff0e9" stroke="#b54237" stroke-width="1.4"/>
  <text x="486" y="420" font-size="14" font-weight="700" fill="#8f3229">前缀防污染：禁拿相同 Prompt 重复打压测</text>
  <text x="486" y="442" font-size="13.5" fill="#4d5652">Prefix Caching 99% 命中会虚高吞吐；须多样化或加随机前缀</text>
</svg>
