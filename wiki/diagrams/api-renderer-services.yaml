  - { at: [480, 35], size: [360, 140], label: CPU 预处理服务 }
  - { at: [480, 235], size: [360, 140], label: 设备生成服务 }
  - { at: [480, 435], size: [360, 140], label: CPU 后处理服务 }
items:
  - { at: [40, 65], size: [320, 85], text: ① 提交消息，接回生成请求, sub: '保存编号 [7, 31, 1052, 9] 和参数', tone: token }
  - { at: [40, 265], size: [320, 85], text: ② 转交生成请求，接回输出, sub: 保存生成的 token 编号, tone: token }
  - { at: [40, 465], size: [320, 85], text: ③ 交回输出、原请求与计数, sub: 取得整理好的文本和用量, tone: token }
  - { at: [500, 65], size: [320, 85], text: render：套模板、分词等, sub: 只准备输入，不计算模型前向, tone: control }
  - { at: [500, 265], size: [320, 85], text: token-in / token-out, sub: 引擎排队、计算并返回编号, tone: weight }
  - { at: [500, 465], size: [320, 85], text: derender：编号还原文字, sub: 按原请求解析；输入计数示意为 4, tone: control }
