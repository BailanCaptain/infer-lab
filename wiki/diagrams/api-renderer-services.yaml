id: api-renderer-services
caption: 调用方按 1→2→3 提交与接回结果，服务之间没有自动转发的箭头。第 2 步才执行模型；第 3 步是 v0.26 起具备的完整结果后处理，旧 GLM 基线没有该路由。编号和输入计数为示意。
