<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 500" width="900" height="500" role="img" aria-label="API server 兼容协议路由矩阵、prompt_embeds 护栏与工具调用双端闭环">
  <title>API server 兼容协议路由、prompt_embeds 稠密化前 2 GiB 护栏与工具调用四站闭环</title>
  <desc>对比四条兼容路由在模板与分词跳过、默认 max_tokens=16 及内存会话保存上的差异，标明固定 v0.30.0 与固定 main 已核的 --enable-prompt-embeds 护栏（拒绝 encoder-decoder 与稠密化前默认 2 GiB 字节上限），并展示工具调用四站闭环。</desc>
  <defs>
    <marker id="arr-ink" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse">
      <path d="M1,1.5 L8.5,5 L1,8.5 z" fill="#4d5652"/>
    </marker>
    <marker id="arr-teal" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse">
      <path d="M1,1.5 L8.5,5 L1,8.5 z" fill="#087f73"/>
    </marker>
    <marker id="arr-indigo" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse">
      <path d="M1,1.5 L8.5,5 L1,8.5 z" fill="#4c65b6"/>
    </marker>
  </defs>

  <!-- ZONE 1: Protocol Routing Matrix + prompt_embeds Guard (y=8..264) -->
  <rect x="8" y="8" width="884" height="256" rx="10" fill="#f8f6f0" stroke="#d8d8cf" stroke-width="1.2"/>
  <rect x="20" y="18" width="292" height="24" rx="12" fill="#e8edff" stroke="#4c65b6" stroke-width="1"/>
  <text x="166" y="34" text-anchor="middle" font-family="var(--font-sans)" font-size="13.5" font-weight="700" fill="#3a4f93">1. 兼容协议入口差异与 prompt_embeds</text>
  <text x="326" y="34" font-family="var(--font-sans)" font-size="13.5" fill="#4d5652">协议决定输入/输出封装，不改变引擎内部并行与模型任务</text>

  <!-- Lane 1: /v1/chat/completions -->
  <rect x="20" y="52" width="184" height="44" rx="6" fill="#ddf4ef" stroke="#087f73" stroke-width="1.3"/>
  <text x="112" y="79" text-anchor="middle" font-family="var(--font-mono)" font-size="13.5" font-weight="700" fill="#065f56">/v1/chat/completions</text>
  <line x1="204" y1="74" x2="216" y2="74" stroke="#087f73" stroke-width="1.5" marker-end="url(#arr-teal)"/>
  <rect x="220" y="52" width="218" height="44" rx="6" fill="#ffffff" stroke="#b8bcb5" stroke-width="1.1"/>
  <text x="329" y="79" text-anchor="middle" font-family="var(--font-sans)" font-size="13.5" fill="#17211f">② 套模板 → ③ 分词 → ⑤ 引擎</text>
  <rect x="444" y="52" width="202" height="44" rx="6" fill="#ddf4ef" fill-opacity="0.55" stroke="#087f73" stroke-width="1"/>
  <text x="545" y="79" text-anchor="middle" font-family="var(--font-sans)" font-size="13.5" fill="#065f56">无默认 16；块内照常套模板</text>

  <!-- Lane 2: /v1/completions -->
  <rect x="20" y="104" width="184" height="44" rx="6" fill="#fff4cf" stroke="#c78300" stroke-width="1.3"/>
  <text x="112" y="131" text-anchor="middle" font-family="var(--font-mono)" font-size="13.5" font-weight="700" fill="#936300">/v1/completions</text>
  <line x1="204" y1="126" x2="216" y2="126" stroke="#4d5652" stroke-width="1.5" marker-end="url(#arr-ink)"/>
  <rect x="220" y="104" width="218" height="44" rx="6" fill="#ffffff" stroke="#b8bcb5" stroke-width="1.1"/>
  <text x="329" y="131" text-anchor="middle" font-family="var(--font-sans)" font-size="13.5" fill="#17211f">跳 ②（给编号再跳 ③）→ ⑤</text>
  <rect x="444" y="104" width="202" height="44" rx="6" fill="#fff4cf" fill-opacity="0.6" stroke="#c78300" stroke-width="1"/>
  <text x="545" y="131" text-anchor="middle" font-family="var(--font-sans)" font-size="13.5" font-weight="700" fill="#936300">省 max_tokens 默认 16</text>

  <!-- Lane 3: /v1/responses -->
  <rect x="20" y="156" width="184" height="44" rx="6" fill="#e8edff" stroke="#4c65b6" stroke-width="1.3"/>
  <text x="112" y="183" text-anchor="middle" font-family="var(--font-mono)" font-size="13.5" font-weight="700" fill="#3a4f93">/v1/responses</text>
  <line x1="204" y1="178" x2="216" y2="178" stroke="#4c65b6" stroke-width="1.5" marker-end="url(#arr-indigo)"/>
  <rect x="220" y="156" width="218" height="44" rx="6" fill="#ffffff" stroke="#b8bcb5" stroke-width="1.1"/>
  <text x="329" y="183" text-anchor="middle" font-family="var(--font-sans)" font-size="13.5" fill="#17211f">input/output + 内存会话字典</text>
  <rect x="444" y="156" width="202" height="44" rx="6" fill="#fff0e9" stroke="#b54237" stroke-width="1"/>
  <text x="545" y="183" text-anchor="middle" font-family="var(--font-sans)" font-size="13.5" fill="#8f3229">STORE=0 不存；≠ prefix KV</text>

  <!-- Lane 4: /v1/messages -->
  <rect x="20" y="208" width="184" height="44" rx="6" fill="#f7e7f2" stroke="#9a4b86" stroke-width="1.3"/>
  <text x="112" y="235" text-anchor="middle" font-family="var(--font-mono)" font-size="13.5" font-weight="700" fill="#7a3a6a">/v1/messages</text>
  <line x1="204" y1="230" x2="216" y2="230" stroke="#4d5652" stroke-width="1.5" marker-end="url(#arr-ink)"/>
  <rect x="220" y="208" width="218" height="44" rx="6" fill="#ffffff" stroke="#b8bcb5" stroke-width="1.1"/>
  <text x="329" y="235" text-anchor="middle" font-family="var(--font-sans)" font-size="13.5" fill="#17211f">适配转为 Chat 执行再转回</text>
  <rect x="444" y="208" width="202" height="44" rx="6" fill="#f7e7f2" fill-opacity="0.6" stroke="#9a4b86" stroke-width="1"/>
  <text x="545" y="235" text-anchor="middle" font-family="var(--font-sans)" font-size="13.5" fill="#7a3a6a">不凭空增加模型工具能力</text>

  <!-- Right Guard Card: enable-prompt-embeds -->
  <rect x="652" y="52" width="232" height="202" rx="8" fill="#ffffff" stroke="#4c65b6" stroke-width="1.4"/>
  <rect x="652" y="52" width="232" height="28" rx="8" fill="#e8edff"/>
  <text x="768" y="71" text-anchor="middle" font-family="var(--font-mono)" font-size="13" font-weight="700" fill="#3a4f93">--enable-prompt-embeds</text>
  <text x="664" y="97" font-family="var(--font-sans)" font-size="12.5" fill="#17211f">• 省查嵌入表，仍占长度与前向</text>
  <text x="664" y="118" font-family="var(--font-sans)" font-size="12.5" fill="#17211f">• Chat 块套模板；Comp 不套</text>
  <text x="664" y="139" font-family="var(--font-sans)" font-size="12.5" fill="#17211f">• Comp 禁配 echo / logprobs</text>
  <line x1="664" y1="152" x2="872" y2="152" stroke="#d8d8cf" stroke-width="1"/>
  <text x="664" y="172" font-family="var(--font-sans)" font-size="12.5" font-weight="700" fill="#8f3229">固定 v0.30.0 与固定 main 已核：</text>
  <text x="664" y="193" font-family="var(--font-sans)" font-size="12.5" fill="#8f3229">✗ 拒绝 encoder-decoder 模型</text>
  <text x="664" y="214" font-family="var(--font-sans)" font-size="12.5" fill="#8f3229">✗ 稠密化前默认字节上限 2 GiB</text>
  <text x="768" y="236" text-anchor="middle" font-family="var(--font-mono)" font-size="12" fill="#4d5652">VLLM_MAX_EMBED_DECODE_BYTES</text>

  <!-- ZONE 2: Tool Calling 4-Station Roundtrip Loop (y=276..492) -->
  <rect x="8" y="276" width="884" height="216" rx="10" fill="#f8f6f0" stroke="#d8d8cf" stroke-width="1.2"/>
  <rect x="20" y="286" width="278" height="24" rx="12" fill="#ddf4ef" stroke="#087f73" stroke-width="1"/>
  <text x="159" y="302" text-anchor="middle" font-family="var(--font-sans)" font-size="13.5" font-weight="700" fill="#065f56">2. 工具调用四站闭环与插件作用域</text>
  <text x="312" y="302" font-family="var(--font-sans)" font-size="13.5" fill="#4d5652">单换 --tool-parser-plugin 改不了模型输入，解析出调用也不等于已执行</text>

  <!-- Station 1 (Top-Left): Chat Template -->
  <rect x="20" y="320" width="346" height="68" rx="8" fill="#ddf4ef" stroke="#087f73" stroke-width="1.4"/>
  <text x="34" y="344" font-family="var(--font-sans)" font-size="14" font-weight="700" fill="#065f56">① 输入侧 · 聊天模板（--chat-template）</text>
  <text x="34" y="369" font-family="var(--font-sans)" font-size="13.5" fill="#17211f">把 tools、历史调用与结果放进模型熟悉的位置</text>

  <!-- Station 2 (Top-Right): Model Generation -->
  <rect x="534" y="320" width="346" height="68" rx="8" fill="#e8edff" stroke="#4c65b6" stroke-width="1.4"/>
  <text x="548" y="344" font-family="var(--font-sans)" font-size="14" font-weight="700" fill="#3a4f93">② 计算侧 · 模型生成（NPU Worker）</text>
  <text x="548" y="369" font-family="var(--font-sans)" font-size="13.5" fill="#17211f">按训练格式输出文本（硬约束需配结构化文法）</text>

  <!-- Station 3 (Bottom-Right): ToolParser / Plugin -->
  <rect x="534" y="414" width="346" height="68" rx="8" fill="#fff4cf" stroke="#c78300" stroke-width="1.5"/>
  <text x="548" y="438" font-family="var(--font-sans)" font-size="14" font-weight="700" fill="#936300">③ 输出侧 · 解析器（--tool-parser-plugin）</text>
  <text x="548" y="463" font-family="var(--font-sans)" font-size="13.5" fill="#17211f">载入 ToolParser 子类，把文本拆成 tool_calls</text>

  <!-- Station 4 (Bottom-Left): External App -->
  <rect x="20" y="414" width="346" height="68" rx="8" fill="#f7e7f2" stroke="#9a4b86" stroke-width="1.4"/>
  <text x="34" y="438" font-family="var(--font-sans)" font-size="14" font-weight="700" fill="#7a3a6a">④ 应用侧 · 外部调用方（vLLM 之外）</text>
  <text x="34" y="463" font-family="var(--font-sans)" font-size="13.5" fill="#17211f">校验参数、执行工具，带 tool_call_id 进下一轮</text>

  <!-- Clockwise Cycle Arrows -->
  <line x1="366" y1="346" x2="530" y2="346" stroke="#087f73" stroke-width="1.8" marker-end="url(#arr-teal)"/>
  <text x="450" y="338" text-anchor="middle" font-family="var(--font-sans)" font-size="13.5" font-weight="700" fill="#065f56">提示词编号</text>

  <line x1="707" y1="388" x2="707" y2="410" stroke="#4c65b6" stroke-width="1.8" marker-end="url(#arr-indigo)"/>
  <text x="720" y="405" font-family="var(--font-sans)" font-size="13.5" fill="#3a4f93">原始输出文本</text>

  <line x1="534" y1="454" x2="370" y2="454" stroke="#4d5652" stroke-width="1.8" marker-end="url(#arr-ink)"/>
  <text x="450" y="476" text-anchor="middle" font-family="var(--font-mono)" font-size="13.5" font-weight="700" fill="#4d5652">tool_calls JSON</text>

  <line x1="193" y1="414" x2="193" y2="392" stroke="#9a4b86" stroke-width="1.8" marker-end="url(#arr-ink)"/>
  <text x="206" y="406" font-family="var(--font-sans)" font-size="13.5" fill="#7a3a6a">回填 tool 结果</text>

  <!-- Central Invariant Badge (x=380..520, y=362..438) -->
  <rect x="380" y="362" width="140" height="76" rx="8" fill="#fff0e9" stroke="#b54237" stroke-width="1.4" stroke-dasharray="4 3"/>
  <text x="450" y="384" text-anchor="middle" font-family="var(--font-sans)" font-size="13.5" font-weight="700" fill="#8f3229">① ⇄ ③ 必须配对</text>
  <text x="450" y="406" text-anchor="middle" font-family="var(--font-sans)" font-size="13.5" fill="#17211f">插件只管 ③ 解析</text>
  <text x="450" y="427" text-anchor="middle" font-family="var(--font-sans)" font-size="13.5" fill="#8f3229">绝不改 ① 模板</text>
</svg>
