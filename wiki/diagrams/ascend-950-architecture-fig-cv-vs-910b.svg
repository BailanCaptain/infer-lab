<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 524" width="900" height="524" role="img" aria-label="910B 分离核经 GM 绕行与昇腾 950 CV 融合片上直通架构及 PR/DT 带宽对比图" font-family="var(--font-sans)">
  <title>910B 分离核绕行 GM vs 昇腾 950 CV 融合 L0C→UB 直通与 PR/DT 带宽对照</title>
  <desc>关联源码符号：HardwareProfile, FP8_OPTIMIZED, FP8_ATTENTION, DYNAMIC_MX_QUANT_FUSION, AUTO_ENABLE_CUSTOM_OPS, AscendW8A8MXFP8DynamicLinearMethod, register_scheme</desc>
  <defs>
    <marker id="a950-arr-r" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto">
      <path d="M 0 1.5 L 8.5 5 L 0 8.5 z" fill="#b54237"/>
    </marker>
    <marker id="a950-arr-t" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto">
      <path d="M 0 1.5 L 8.5 5 L 0 8.5 z" fill="#087f73"/>
    </marker>
    <marker id="a950-arr-i" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8.5 5 L 0 8.5 z" fill="#4c65b6"/>
    </marker>
  </defs>

  <!-- Titles & vertical divider -->
  <text x="16" y="28" font-size="16" font-weight="700" fill="#8f3229">① 910B（A2/A3）分离核：交接绕行核外 GM</text>
  <text x="466" y="28" font-size="16" font-weight="700" fill="#065f56">② 昇腾 950（A5）CV 融合子系统：片上直通</text>
  <line x1="14" y1="38" x2="886" y2="38" stroke="#b8bcb5" stroke-width="1.4"/>
  <line x1="448" y1="46" x2="448" y2="332" stroke="#b8bcb5" stroke-width="1.4" stroke-dasharray="6 4"/>

  <!-- LEFT: 910B Split AIC + AIV with U-turn detour through GM -->
  <!-- AIC Core -->
  <rect x="16" y="52" width="186" height="148" rx="9" fill="#fff4cf" fill-opacity="0.6" stroke="#c78300" stroke-width="1.5"/>
  <text x="109" y="75" text-anchor="middle" font-size="14.5" font-weight="700" fill="#936300">AIC 矩阵核</text>
  <rect x="30" y="86" width="158" height="28" rx="5" fill="#ffffff" stroke="#c78300" stroke-width="1.2"/>
  <text x="109" y="105" text-anchor="middle" font-family="var(--font-mono)" font-size="13.5" fill="#17211f">L1 → L0A / L0B</text>
  <rect x="30" y="122" width="158" height="28" rx="5" fill="#fff4cf" stroke="#c78300" stroke-width="1.4"/>
  <text x="109" y="141" text-anchor="middle" font-size="13.5" font-weight="700" fill="#936300">Cube 乘加</text>
  <rect x="30" y="158" width="158" height="30" rx="5" fill="#ffffff" stroke="#b54237" stroke-width="1.4"/>
  <text x="109" y="178" text-anchor="middle" font-family="var(--font-mono)" font-size="13.5" font-weight="700" fill="#8f3229">L0C 结果</text>

  <!-- Core separation wall -->
  <line x1="224" y1="54" x2="224" y2="200" stroke="#b54237" stroke-width="1.5" stroke-dasharray="4 3"/>
  <text x="224" y="128" text-anchor="middle" font-size="13.5" font-weight="700" fill="#8f3229">核间</text>
  <text x="224" y="148" text-anchor="middle" font-size="13.5" font-weight="700" fill="#8f3229">隔断</text>

  <!-- AIV Core -->
  <rect x="246" y="52" width="186" height="148" rx="9" fill="#e8edff" fill-opacity="0.6" stroke="#4c65b6" stroke-width="1.5"/>
  <text x="339" y="75" text-anchor="middle" font-size="14.5" font-weight="700" fill="#3a4f93">AIV 向量核</text>
  <rect x="260" y="86" width="158" height="30" rx="5" fill="#ffffff" stroke="#4c65b6" stroke-width="1.4"/>
  <text x="339" y="106" text-anchor="middle" font-size="13.5" font-weight="700" fill="#3a4f93">Vector 运算</text>
  <rect x="260" y="126" width="158" height="30" rx="5" fill="#e8edff" stroke="#4c65b6" stroke-width="1.4"/>
  <text x="339" y="146" text-anchor="middle" font-family="var(--font-mono)" font-size="13.5" font-weight="700" fill="#3a4f93">UB 缓冲</text>
  <text x="339" y="182" text-anchor="middle" font-size="13.5" fill="#4d5652">软件流水标志同步</text>

  <!-- GM/L2 slab at bottom of 910B -->
  <rect x="16" y="256" width="416" height="66" rx="8" fill="#fff0e9" stroke="#b54237" stroke-width="1.6"/>
  <text x="224" y="282" text-anchor="middle" font-size="14.5" font-weight="700" fill="#8f3229">✗ 核外 GM / L2 绕行中转（落盘 + 重读）</text>
  <text x="224" y="308" text-anchor="middle" font-family="var(--font-mono)" font-size="13.5" font-weight="700" fill="#8f3229">1024×FP32 逻辑流量 = 4,096 写 + 4,096 读 = 8,192 B</text>

  <!-- Red U-turn detour arrows -->
  <path d="M 109 188 L 109 250" fill="none" stroke="#b54237" stroke-width="2.4" marker-end="url(#a950-arr-r)"/>
  <text x="118" y="230" font-size="13.5" font-weight="700" fill="#8f3229">FixPipe 写出 4KB</text>
  <path d="M 339 256 L 339 162" fill="none" stroke="#b54237" stroke-width="2.4" marker-end="url(#a950-arr-r)"/>
  <text x="348" y="230" font-size="13.5" font-weight="700" fill="#8f3229">再读 4KB</text>

  <!-- RIGHT: Ascend 950 CV-Converged Subsystem -->
  <rect x="466" y="52" width="418" height="196" rx="10" fill="#ddf4ef" fill-opacity="0.4" stroke="#087f73" stroke-width="1.8" stroke-dasharray="7 4"/>
  <text x="675" y="74" text-anchor="middle" font-size="14" font-weight="700" fill="#065f56">单个 AI 子系统：1 Cube + 2 Vector 同域合封</text>

  <!-- Cube side -->
  <rect x="478" y="84" width="166" height="152" rx="8" fill="#fff4cf" stroke="#c78300" stroke-width="1.5"/>
  <text x="561" y="106" text-anchor="middle" font-size="14" font-weight="700" fill="#936300">1× Cube</text>
  <rect x="488" y="114" width="146" height="26" rx="4" fill="#ffffff" stroke="#c78300" stroke-width="1.2"/>
  <text x="561" y="132" text-anchor="middle" font-family="var(--font-mono)" font-size="13.5" fill="#17211f">L1 512KB</text>
  <rect x="488" y="146" width="146" height="24" rx="4" fill="#ffffff" stroke="#c78300" stroke-width="1.2"/>
  <text x="561" y="163" text-anchor="middle" font-family="var(--font-mono)" font-size="13.5" fill="#4d5652">L0A/B 各 64KB</text>
  <rect x="488" y="176" width="146" height="28" rx="4" fill="#ddf4ef" stroke="#087f73" stroke-width="1.6"/>
  <text x="561" y="195" text-anchor="middle" font-family="var(--font-mono)" font-size="13.5" font-weight="700" fill="#065f56">L0C 256KB</text>
  <text x="561" y="226" text-anchor="middle" font-size="13.5" fill="#936300">HiF8/MXFP8/4</text>

  <!-- Direct on-chip bridges! -->
  <line x1="646" y1="127" x2="704" y2="127" stroke="#4c65b6" stroke-width="2" marker-start="url(#a950-arr-i)" marker-end="url(#a950-arr-i)"/>
  <text x="675" y="118" text-anchor="middle" font-family="var(--font-mono)" font-size="13.5" font-weight="700" fill="#3a4f93">L1↔UB</text>

  <line x1="646" y1="190" x2="704" y2="190" stroke="#087f73" stroke-width="3" marker-end="url(#a950-arr-t)"/>
  <text x="675" y="178" text-anchor="middle" font-size="13.5" font-weight="700" fill="#065f56">随路直通</text>
  <text x="675" y="210" text-anchor="middle" font-family="var(--font-mono)" font-size="13.5" font-weight="700" fill="#065f56">4,096 B</text>

  <!-- Vector side -->
  <rect x="708" y="84" width="164" height="152" rx="8" fill="#ddf4ef" stroke="#087f73" stroke-width="1.5"/>
  <text x="790" y="106" text-anchor="middle" font-size="14" font-weight="700" fill="#065f56">2× Vector</text>
  <rect x="718" y="114" width="144" height="36" rx="4" fill="#ffffff" stroke="#087f73" stroke-width="1.4"/>
  <text x="790" y="137" text-anchor="middle" font-family="var(--font-mono)" font-size="13.5" font-weight="700" fill="#065f56">UB 2×256KB</text>
  <rect x="718" y="158" width="144" height="34" rx="4" fill="#ffffff" stroke="#087f73" stroke-width="1.2"/>
  <text x="790" y="180" text-anchor="middle" font-size="13.5" fill="#17211f">SIMD 主 + SIMT 辅</text>
  <text x="790" y="210" text-anchor="middle" font-size="13.5" fill="#4d5652">NDDMA (5D 重排)</text>
  <text x="790" y="229" text-anchor="middle" font-size="13.5" fill="#4d5652">Buffer ID 同步</text>

  <!-- Untouched GM bottom strip for 950 -->
  <rect x="466" y="262" width="418" height="60" rx="8" fill="#ece9df" stroke="#8a928f" stroke-width="1.3"/>
  <text x="675" y="287" text-anchor="middle" font-size="14" font-weight="700" fill="#065f56">✓ 中间结果 0 B 落盘 GM（仅最终输出按需写回）</text>
  <text x="675" y="310" text-anchor="middle" font-size="13.5" fill="#4d5652">L0C→UB 可顺路做类型/格式转换，省去核外绕行与独立转换段</text>

  <!-- Horizontal divider -->
  <line x1="14" y1="344" x2="886" y2="344" stroke="#b8bcb5" stroke-width="1.4" stroke-dasharray="6 4"/>

  <!-- Zone 2: PR vs DT True-Scale Memory Bandwidth + A5 HardwareProfile -->
  <text x="16" y="372" font-size="16" font-weight="700" fill="#17211f">③ 950PR vs 950DT 同比例内存带宽对比 与 v0.30.0 → main 软件档案演进</text>

  <!-- Left: True-scale bandwidth bars (1 TB/s = 68 px starting at x=122) -->
  <text x="16" y="410" font-size="14" font-weight="700" fill="#4d5652">950PR</text>
  <rect x="108" y="390" width="109" height="28" rx="4" fill="#ece9df" stroke="#8a928f" stroke-width="1.5"/>
  <text x="162" y="409" text-anchor="middle" font-family="var(--font-mono)" font-size="13.5" font-weight="700" fill="#17211f">1.6 TB/s</text>
  <text x="226" y="409" font-size="13.5" fill="#4d5652">8 模块 · 128/112 GB · Cube 32/28</text>

  <text x="16" y="452" font-size="14" font-weight="700" fill="#3a4f93">950DT</text>
  <rect x="108" y="432" width="272" height="28" rx="4" fill="#e8edff" stroke="#4c65b6" stroke-width="1.6"/>
  <text x="244" y="451" text-anchor="middle" font-family="var(--font-mono)" font-size="13.5" font-weight="700" fill="#3a4f93">4.0 TB/s（2.5× 带宽！）</text>
  <text x="390" y="451" font-size="13.5" fill="#3a4f93">4 模块 · 144/96 GB</text>

  <text x="16" y="492" font-size="13.5" fill="#66716d">注：白皮书斜线档位不可跨行自由配对，采购须核对完整产品型号。</text>

  <!-- Right: v0.30.0 vs main A5 HardwareProfile card -->
  <rect x="556" y="388" width="328" height="122" rx="8" fill="#f7e7f2" stroke="#9a4b86" stroke-width="1.4"/>
  <text x="570" y="413" font-size="14.5" font-weight="700" fill="#7a3a6a">vLLM Ascend A5 HardwareProfile</text>
  <text x="570" y="438" font-size="13.5" fill="#17211f">• FP8_OPTIMIZED + W8A8_MXFP8 主力</text>
  <text x="570" y="462" font-size="13.5" fill="#4d5652">• 开 FP8_ATTENTION 与 MX 量化融合</text>
  <text x="562" y="490" font-size="12" font-weight="700" fill="#8f3229">• v0.30 关 RUNTIME_CUSTOM_OPS，main 补回</text>
</svg>
