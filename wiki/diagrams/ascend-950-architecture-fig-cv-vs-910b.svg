<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 470" width="900" height="470" role="img" aria-label="昇腾950 CV融合核心片上直通与910B分离架构及A5硬件档案对比图" font-family="var(--font-sans)">
  <title>昇腾 950 CV 融合子系统 L0C→UB 直通、NDDMA/Buffer ID 与 910B 分离架构对比</title>
  <desc>关联源码符号：HardwareProfile, FP8_OPTIMIZED, FP8_ATTENTION, DYNAMIC_MX_QUANT_FUSION, AUTO_ENABLE_CUSTOM_OPS, AscendW8A8MXFP8DynamicLinearMethod, register_scheme</desc>
  <defs>
    <marker id="a950-arr-g" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="#087f73"/>
    </marker>
    <marker id="a950-arr-r" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="#b54237"/>
    </marker>
  </defs>

  <!-- Left column: 910B Split -->
  <text x="16" y="28" font-size="16" font-weight="700" fill="#8f3229">① 910B（A2/A3）分离核：跨核经 GM 中转</text>

  <rect x="16" y="44" width="406" height="58" rx="7" fill="#fff4cf" stroke="#c78300" stroke-width="1.3"/>
  <text x="30" y="69" font-size="14.5" font-weight="700" fill="#936300">AIC 矩阵核：L1 → L0A/B → Cube → L0C</text>
  <text x="30" y="92" font-size="13.5" fill="#4d5652">FixPipe 写出至核外 GM（无法直进 AIV UB）</text>

  <line x1="219" y1="104" x2="219" y2="124" stroke="#b54237" stroke-width="1.8" marker-end="url(#a950-arr-r)"/>

  <rect x="16" y="128" width="406" height="62" rx="7" fill="#fff0e9" stroke="#b54237" stroke-width="1.4"/>
  <text x="30" y="154" font-size="14.5" font-weight="700" fill="#8f3229">✗ 核外 GM / L2 绕行（中间落盘 + 重读）</text>
  <text x="30" y="179" font-size="13.5" fill="#8f3229">1024×FP32 逻辑读写 = 4096 + 4096 = 8,192 B</text>

  <line x1="219" y1="192" x2="219" y2="212" stroke="#b54237" stroke-width="1.8" marker-end="url(#a950-arr-r)"/>

  <rect x="16" y="216" width="406" height="64" rx="7" fill="#e8edff" stroke="#4c65b6" stroke-width="1.3"/>
  <text x="30" y="242" font-size="14.5" font-weight="700" fill="#3a4f93">AIV 向量核：GM 搬入 UB → Vector 运算</text>
  <text x="30" y="266" font-size="13.5" fill="#4d5652">依赖软件显式核间流水标志协同，再写回 GM</text>

  <!-- Vertical divider -->
  <line x1="444" y1="16" x2="444" y2="288" stroke="#b8bcb5" stroke-width="1.4" stroke-dasharray="6 4"/>

  <!-- Right column: 950 CV-converged -->
  <text x="464" y="28" font-size="16" font-weight="700" fill="#065f56">② 昇腾 950（A5）CV 融合子系统：片上直通</text>

  <rect x="464" y="44" width="420" height="58" rx="7" fill="#fff4cf" stroke="#c78300" stroke-width="1.4"/>
  <text x="478" y="69" font-size="14.5" font-weight="700" fill="#936300">1 Cube：L1 (512KB) → L0A/B (各64KB) → L0C (256KB)</text>
  <text x="478" y="92" font-size="13.5" fill="#4d5652">原生低精度：HiF8 / MXFP8 / MXFP4</text>

  <line x1="674" y1="104" x2="674" y2="124" stroke="#087f73" stroke-width="1.8" marker-end="url(#a950-arr-g)"/>

  <rect x="464" y="128" width="420" height="62" rx="7" fill="#ddf4ef" stroke="#087f73" stroke-width="1.5"/>
  <text x="478" y="154" font-size="14.5" font-weight="700" fill="#065f56">✓ 片上直通：L0C → UB 随路转换（兼通 L1 ↔ UB）</text>
  <text x="478" y="179" font-size="13.5" fill="#065f56">省去中间 GM 落盘，仅送 4,096 B 至 UB；不绕核外</text>

  <line x1="674" y1="192" x2="674" y2="212" stroke="#087f73" stroke-width="1.8" marker-end="url(#a950-arr-g)"/>

  <rect x="464" y="216" width="420" height="64" rx="7" fill="#ddf4ef" stroke="#087f73" stroke-width="1.4"/>
  <text x="478" y="242" font-size="14.5" font-weight="700" fill="#065f56">2 Vector（UB 2×256KB）：SIMD 为主 + SIMT 为辅</text>
  <text x="478" y="266" font-size="13.5" fill="#4d5652">NDDMA（5D 重排 / 128B 读）+ Buffer ID（get/rel_buf）</text>

  <line x1="16" y1="302" x2="884" y2="302" stroke="#b8bcb5" stroke-width="1.4" stroke-dasharray="6 5"/>

  <!-- Zone 3: PR/DT & v0.30.0 A5 HardwareProfile -->
  <text x="16" y="330" font-size="16" font-weight="700" fill="#17211f">③ 产品档位与软件档案对照（白皮书 2×AI Die + 2×IO Die UMA 与 v0.30.0 A5 档案）</text>

  <rect x="16" y="346" width="276" height="110" rx="7" fill="#ece9df" stroke="#8a928f" stroke-width="1.3"/>
  <text x="30" y="372" font-size="14.5" font-weight="700" fill="#17211f">950PR（容量/多模块档）</text>
  <text x="30" y="397" font-size="13.5" fill="#4d5652">Cube 32/28，Vector 64/56</text>
  <text x="30" y="420" font-size="13.5" fill="#4d5652">8 模块 128/112 GB；1.6/1.4 TB/s</text>
  <text x="30" y="443" font-size="13.5" fill="#66716d">L2 128/112 MB（512B 行/4 扇区）</text>

  <rect x="310" y="346" width="278" height="110" rx="7" fill="#e8edff" stroke="#4c65b6" stroke-width="1.3"/>
  <text x="324" y="372" font-size="14.5" font-weight="700" fill="#3a4f93">950DT（高带宽大算力档）</text>
  <text x="324" y="397" font-size="13.5" fill="#4d5652">Cube 36/32/28，Vector 72/64/56</text>
  <text x="324" y="420" font-size="13.5" fill="#4d5652">4 模块 144/96 GB；4 TB/s 带宽</text>
  <text x="324" y="443" font-size="13.5" fill="#3a4f93">斜线档位不可跨行自由拼接</text>

  <rect x="606" y="346" width="278" height="110" rx="7" fill="#f7e7f2" stroke="#9a4b86" stroke-width="1.4"/>
  <text x="620" y="372" font-size="14.5" font-weight="700" fill="#7a3a6a">v0.30.0 A5 HardwareProfile</text>
  <text x="620" y="397" font-size="13.5" fill="#4d5652">FP8_OPTIMIZED + W8A8_MXFP8</text>
  <text x="620" y="420" font-size="13.5" fill="#4d5652">DYNAMIC_MX_QUANT_FUSION 开启</text>
  <text x="620" y="443" font-size="13.5" font-weight="700" fill="#8f3229">RUNTIME_CUSTOM_OPS 至 main 补回</text>
</svg>
