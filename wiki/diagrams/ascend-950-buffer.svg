  <rect x="370" y="140" width="100" height="72" fill="none" stroke="var(--color-ink, #17211f)" stroke-width="1.3"/>
  <text x="420" y="234" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="13" font-weight="400" fill="#065f56" text-anchor="middle">读取当前块进行计算</text>
  <rect x="660" y="140" width="50" height="36" fill="var(--color-token-soft, #ddf4ef)"/>
