  <text x="685" y="198.7" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="13" font-weight="700" fill="#065f56" text-anchor="middle">40</text>
  <rect x="710" y="176" width="50" height="36" fill="var(--color-token-soft, #ddf4ef)"/>
