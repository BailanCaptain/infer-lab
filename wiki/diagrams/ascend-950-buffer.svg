  <rect x="80" y="176" width="50" height="36" fill="var(--color-token, #087f73)"/>
  <text x="105" y="198.7" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="13" font-weight="700" fill="var(--color-ink-inverse, #ffffff)" text-anchor="middle">20</text>
  <rect x="130" y="176" width="50" height="36" fill="var(--color-token, #087f73)"/>
  <text x="155" y="198.7" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="13" font-weight="700" fill="var(--color-ink-inverse, #ffffff)" text-anchor="middle">21</text>
