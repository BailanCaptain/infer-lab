<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 360" width="860" height="360" role="img" aria-label="同一块 UB 的使用周期示意。三个画面表示不同时刻，不是三块不同缓冲。搬运段与 Vector 分别取得、使用、释放同一缓冲标识；后一轮覆盖必须遵守这个次序，数值正确还要求地址和计算本身正确。">
  <title>同一块 UB 的使用周期示意。三个画面表示不同时刻，不是三块不同缓冲。搬运段与 Vector 分别取得、使用、释放同一缓冲标识；后一轮覆盖必须遵守这个次序，数值正确还要求地址和计算本身正确。</title>
  <defs><marker id="ascend-950-buffer-ah-control" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="var(--color-control, #66716d)"/></marker></defs>
  <rect x="20" y="80" width="240" height="205" rx="16" fill="none" stroke="var(--color-line-strong, #b8bcb5)" stroke-width="1.5"/>
  <text x="36" y="68" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="15" font-weight="700" fill="var(--color-ink, #17211f)">1 · 搬运段取得使用权</text>
  <rect x="310" y="80" width="240" height="205" rx="16" fill="none" stroke="var(--color-line-strong, #b8bcb5)" stroke-width="1.5"/>
  <text x="326" y="68" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="15" font-weight="700" fill="var(--color-ink, #17211f)">2 · Vector 取得使用权</text>
  <rect x="600" y="80" width="240" height="205" rx="16" fill="none" stroke="var(--color-line-strong, #b8bcb5)" stroke-width="1.5"/>
  <text x="616" y="68" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="15" font-weight="700" fill="var(--color-ink, #17211f)">3 · 下一轮按约定复用</text>
  <path d="M264 176 L306 176" fill="none" stroke="var(--color-control, #66716d)" stroke-width="1.4" marker-end="url(#ascend-950-buffer-ah-control)"/>
  <path d="M554 176 L596 176" fill="none" stroke="var(--color-control, #66716d)" stroke-width="1.4" marker-end="url(#ascend-950-buffer-ah-control)"/>
  <rect x="80" y="140" width="50" height="36" fill="var(--color-token, #087f73)"/>
  <text x="105" y="162.7" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="13" font-weight="700" fill="var(--color-ink-inverse, #ffffff)" text-anchor="middle">10</text>
