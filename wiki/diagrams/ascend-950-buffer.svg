  <text x="710" y="234" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="13" font-weight="400" fill="#065f56" text-anchor="middle">搬入下一块</text>
  <text x="20" y="28" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="13.5" font-weight="700" fill="var(--color-ink, #17211f)">Buffer ID：把同一缓冲的占用与释放串成正确次序</text>
  <text x="45" y="261" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="14" font-weight="400" fill="var(--color-ink, #17211f)">搬运完成后释放</text>
  <text x="335" y="261" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="14" font-weight="400" fill="var(--color-ink, #17211f)">使用完成后释放</text>
  <text x="625" y="261" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="14" font-weight="400" fill="var(--color-ink, #17211f)">不能提前覆盖旧块</text>
  <text x="20" y="330" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="15" font-weight="400" fill="var(--color-ink, #17211f)">省的是同步组织的复杂度；依赖等待仍在，能否重叠另看缓冲与实现。</text>
</svg>
