layout: figure
id: ascend-950-cv
caption: 数据路径示意，复用 AI Core 页的小矩阵。绿色表示输入或计算结果，黄色表示权重。矩阵结果从 L0C 交给 UB，不经过一次中间 GM 写回再读入；输入搬入、数据就绪等待和最终输出仍存在。图省略另一侧 Vector 与其他可选路径，不表示真实最小指令尺寸。
