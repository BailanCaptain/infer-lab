  - { at: [255, 70], size: [605, 170], label: 矩阵侧：准备 → 乘加 → 结果 }
  - { at: [430, 305], size: [430, 225], label: 向量侧：取得结果后计算 }
  - { at: [20, 405], size: [205, 125], label: GM：最终输出 }
