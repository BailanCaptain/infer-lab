<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 504" width="900" height="504" role="img" aria-label="昇腾 950 STARS 2.0、CCU、IO Die 片内直转与 18 端口物理复用拓扑图" font-family="var(--font-sans)">
  <title>昇腾 950：STARS 2.0 + CCU → IO Die 转发 → UB 2.0 双路径与 18 端口复用</title>
  <desc>关联源码符号：LOCAL_KV_COMM_RESOURCE, MOE_DISPATCH_EXTRA_ARGS, MM_REDUCE_SCATTER_AI_CPU_INFERENCE, need_extra_args, get_current_hardware_profile</desc>
  <defs>
    <marker id="ei-arr-g" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 1.5 L 8.5 5 L 0 8.5 z" fill="#4d5652"/>
    </marker>
    <marker id="ei-arr-p" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 1.5 L 8.5 5 L 0 8.5 z" fill="#9a4b86"/>
    </marker>
    <marker id="ei-arr-t" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 1.5 L 8.5 5 L 0 8.5 z" fill="#087f73"/>
    </marker>
  </defs>

  <!-- Zone 1 Title -->
  <text x="16" y="28" font-size="16" font-weight="700" fill="#17211f">① 芯片内编排到出片互联：STARS 2.0 / CCU → IO Die 转发 → Unified Bus 2.0 双路径</text>
  <line x1="14" y1="38" x2="886" y2="38" stroke="#b8bcb5" stroke-width="1.4"/>

  <!-- STARS 2.0 -->
  <rect x="16" y="54" width="168" height="170" rx="8" fill="#fff4cf" stroke="#c78300" stroke-width="1.5"/>
  <text x="100" y="80" text-anchor="middle" font-size="14.5" font-weight="700" fill="#936300">STARS 2.0</text>
  <text x="100" y="102" text-anchor="middle" font-size="13.5" fill="#4d5652">硬件任务调度器</text>
  <rect x="28" y="114" width="144" height="30" rx="5" fill="#ffffff" stroke="#c78300" stroke-width="1.2"/>
  <text x="100" y="134" text-anchor="middle" font-family="var(--font-mono)" font-size="13.5" font-weight="700" fill="#936300">2048 任务流</text>
  <text x="100" y="168" text-anchor="middle" font-size="13.5" fill="#4d5652">经 HSCB 派发依赖</text>
  <text x="100" y="190" text-anchor="middle" font-size="13.5" font-weight="700" fill="#8f3229">不管用户请求排队</text>
  <text x="100" y="212" text-anchor="middle" font-size="13.5" fill="#66716d">(≠ vLLM 调度器)</text>

  <!-- HSCB arrows -->
  <line x1="186" y1="96" x2="216" y2="96" stroke="#4d5652" stroke-width="1.8" marker-end="url(#ei-arr-g)"/>
  <line x1="186" y1="176" x2="216" y2="176" stroke="#9a4b86" stroke-width="1.8" marker-end="url(#ei-arr-p)"/>

  <!-- Middle: AI Core + CCU -->
  <rect x="220" y="54" width="194" height="72" rx="8" fill="#ddf4ef" stroke="#087f73" stroke-width="1.4"/>
  <text x="317" y="80" text-anchor="middle" font-size="14" font-weight="700" fill="#065f56">AI Core 计算核</text>
  <text x="317" y="106" text-anchor="middle" font-size="13.5" fill="#4d5652">Cube / Vector 本地算子</text>

  <rect x="220" y="138" width="194" height="86" rx="8" fill="#f7e7f2" stroke="#9a4b86" stroke-width="1.5"/>
  <text x="317" y="164" text-anchor="middle" font-size="14" font-weight="700" fill="#7a3a6a">CCU 通信卸载（≤32 并发）</text>
  <text x="317" y="188" text-anchor="middle" font-size="13.5" fill="#4d5652">CCUM 解释 Mission</text>
  <text x="317" y="210" text-anchor="middle" font-size="13.5" fill="#7a3a6a">CCUA + Reduce Unit</text>

  <!-- Arrows into IO Die -->
  <line x1="416" y1="90" x2="444" y2="90" stroke="#087f73" stroke-width="1.8" marker-end="url(#ei-arr-t)"/>
  <line x1="416" y1="180" x2="444" y2="180" stroke="#9a4b86" stroke-width="1.8" marker-end="url(#ei-arr-p)"/>

  <!-- IO Die with On-Chip Switch bypass -->
  <rect x="448" y="54" width="144" height="232" rx="8" fill="#ece9df" stroke="#8a928f" stroke-width="1.5"/>
  <text x="520" y="79" text-anchor="middle" font-size="14.5" font-weight="700" fill="#17211f">IO Die</text>
  <text x="520" y="102" text-anchor="middle" font-size="13.5" fill="#4d5652">UB On-Chip</text>
  <text x="520" y="122" text-anchor="middle" font-size="13.5" fill="#4d5652">Switch</text>
  <rect x="460" y="136" width="120" height="40" rx="5" fill="#ffffff" stroke="#8a928f" stroke-width="1.2"/>
  <text x="520" y="161" text-anchor="middle" font-family="var(--font-mono)" font-size="13.5" font-weight="700" fill="#17211f">9×x4 端口</text>

  <!-- Bypass arc inside IO Die -->
  <path d="M 468 250 C 484 196, 556 196, 572 250" fill="none" stroke="#b54237" stroke-width="2" stroke-dasharray="4 3" marker-end="url(#ei-arr-g)"/>
  <text x="520" y="206" text-anchor="middle" font-size="13.5" font-weight="700" fill="#8f3229">片内直转</text>
  <text x="520" y="272" text-anchor="middle" font-size="13.5" fill="#4d5652">不经 AI Die/主存</text>

  <!-- Arrows out to URMA & UB Memory -->
  <line x1="594" y1="106" x2="622" y2="106" stroke="#087f73" stroke-width="2" marker-end="url(#ei-arr-t)"/>
  <line x1="594" y1="226" x2="622" y2="226" stroke="#4d5652" stroke-width="2" marker-end="url(#ei-arr-g)"/>

  <!-- Right: URMA + UB Memory -->
  <rect x="626" y="54" width="258" height="108" rx="8" fill="#ddf4ef" stroke="#087f73" stroke-width="1.5"/>
  <text x="640" y="79" font-size="14.5" font-weight="700" fill="#065f56">路径 A：URMA 异步搬运</text>
  <text x="640" y="103" font-size="13.5" fill="#4d5652">Jetty 队列 → Doorbell → UMMU</text>
  <text x="640" y="126" font-size="13.5" fill="#4d5652">RTP 可靠重传 vs CTP 无同级重传</text>
  <text x="640" y="149" font-size="13.5" font-weight="700" fill="#065f56">读结果前仍须等待完成通知</text>

  <rect x="626" y="176" width="258" height="110" rx="8" fill="#e8edff" stroke="#4c65b6" stroke-width="1.5"/>
  <text x="640" y="201" font-size="14.5" font-weight="700" fill="#3a4f93">路径 B：UB Memory 直接访存</text>
  <text x="640" y="225" font-size="13.5" fill="#4d5652">地址解码路由 → 远端 UMMU 验权</text>
  <text x="640" y="248" font-size="13.5" fill="#4d5652">可连远端内存池（仍须软件管）</text>
  <text x="640" y="271" font-size="13.5" font-weight="700" fill="#8f3229">不等同本地延迟或增加本卡 KV</text>

  <!-- Note below AI Core/CCU -->
  <text x="16" y="256" font-size="13.5" fill="#66716d">注：此处 UB 指互联协议 Unified Bus 2.0，</text>
  <text x="16" y="278" font-size="13.5" fill="#66716d">区别于核内向量缓冲 Unified Buffer。</text>

  <!-- Horizontal divider -->
  <line x1="14" y1="302" x2="886" y2="302" stroke="#b8bcb5" stroke-width="1.4" stroke-dasharray="6 4"/>

  <!-- Zone 2: 18 Physical UB Ports Multiplexing Strip -->
  <text x="16" y="330" font-size="16" font-weight="700" fill="#17211f">② 18 个物理端口静态复用（72×112G HiLink = 2016 GB/s 双向）：各行峰值严禁相加！</text>

  <!-- 18 port boxes (x=16..880, width=44 + 4 gap = 48 * 18 = 864) -->
  <!-- Ports 1..12: Pure UB (teal) -->
  <g fill="#ddf4ef" stroke="#087f73" stroke-width="1.4">
    <rect x="16" y="346" width="44" height="38" rx="4"/><rect x="64" y="346" width="44" height="38" rx="4"/><rect x="112" y="346" width="44" height="38" rx="4"/>
    <rect x="160" y="346" width="44" height="38" rx="4"/><rect x="208" y="346" width="44" height="38" rx="4"/><rect x="256" y="346" width="44" height="38" rx="4"/>
    <rect x="304" y="346" width="44" height="38" rx="4"/><rect x="352" y="346" width="44" height="38" rx="4"/><rect x="400" y="346" width="44" height="38" rx="4"/>
    <rect x="448" y="346" width="44" height="38" rx="4"/><rect x="496" y="346" width="44" height="38" rx="4"/><rect x="544" y="346" width="44" height="38" rx="4"/>
  </g>
  <!-- Ports 13..14: Shared with UBoE (plum) -->
  <g fill="#f7e7f2" stroke="#9a4b86" stroke-width="1.6">
    <rect x="592" y="346" width="44" height="38" rx="4"/><rect x="640" y="346" width="44" height="38" rx="4"/>
  </g>
  <!-- Ports 15..18: Shared with PCIe 5.0 (amber) -->
  <g fill="#fff4cf" stroke="#c78300" stroke-width="1.6">
    <rect x="688" y="346" width="44" height="38" rx="4"/><rect x="736" y="346" width="44" height="38" rx="4"/>
    <rect x="784" y="346" width="44" height="38" rx="4"/><rect x="832" y="346" width="44" height="38" rx="4"/>
  </g>

  <g font-family="var(--font-mono)" font-size="13.5" font-weight="700" text-anchor="middle">
    <text x="302" y="370" fill="#065f56">12 个纯 Unified Bus 端口</text>
    <text x="638" y="370" fill="#7a3a6a">UBoE</text>
    <text x="782" y="370" fill="#936300">PCIe 5.0 复用</text>
  </g>

  <!-- Brackets under port groups -->
  <text x="302" y="408" text-anchor="middle" font-size="13.5" fill="#065f56">出框速率另受光模块约束</text>
  <text x="638" y="408" text-anchor="middle" font-size="13.5" font-weight="700" fill="#7a3a6a">2 端口 (2×400G)</text>
  <text x="782" y="408" text-anchor="middle" font-size="13.5" font-weight="700" fill="#936300">4 端口 (×16 128 GB/s)</text>

  <!-- Bottom v0.30.0 A5 Framework Hooks strip -->
  <rect x="16" y="426" width="868" height="64" rx="8" fill="#f7e7f2" fill-opacity="0.6" stroke="#9a4b86" stroke-width="1.3"/>
  <text x="30" y="451" font-size="14" font-weight="700" fill="#7a3a6a">v0.30.0 A5 框架通信能力钩子（HardwareProfile）：</text>
  <text x="30" y="476" font-family="var(--font-mono)" font-size="13.5" fill="#17211f">LOCAL_KV_COMM_RESOURCE · MOE_DISPATCH_EXTRA_ARGS · MM_REDUCE_SCATTER_AI_CPU_INFERENCE</text>
</svg>
