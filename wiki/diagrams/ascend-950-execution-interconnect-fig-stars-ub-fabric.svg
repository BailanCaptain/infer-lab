<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 470" width="900" height="470" role="img" aria-label="昇腾950 STARS 2.0硬件调度、CCU卸载与Unified Bus 2.0互联拓扑图" font-family="var(--font-sans)">
  <title>昇腾 950：STARS 2.0 + CCU 任务执行与 Unified Bus 2.0（URMA / UB Memory / UBoE）拓扑</title>
  <desc>关联源码符号：LOCAL_KV_COMM_RESOURCE, MOE_DISPATCH_EXTRA_ARGS, MM_REDUCE_SCATTER_AI_CPU_INFERENCE, need_extra_args, get_current_hardware_profile</desc>
  <defs>
    <marker id="ei-arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="#4d5652"/>
    </marker>
    <marker id="ei-arr-p" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="#9a4b86"/>
    </marker>
  </defs>

  <!-- Zone 1: STARS 2.0 + CCU -->
  <text x="16" y="28" font-size="16" font-weight="700" fill="#17211f">① 芯片内执行编排：STARS 2.0 下发依赖 + CCU 卸载集合通信（区别于请求调度）</text>

  <rect x="16" y="44" width="236" height="112" rx="7" fill="#fff4cf" stroke="#c78300" stroke-width="1.4"/>
  <text x="30" y="70" font-size="14.5" font-weight="700" fill="#936300">STARS 2.0 硬件调度器</text>
  <text x="30" y="95" font-size="13.5" fill="#4d5652">下沉最多 2048 条任务流</text>
  <text x="30" y="118" font-size="13.5" fill="#4d5652">经 HSCB 专用控制总线派发</text>
  <text x="30" y="142" font-size="13.5" fill="#936300">管理任务依赖，不选用户请求</text>

  <line x1="254" y1="80" x2="288" y2="80" stroke="#4d5652" stroke-width="1.7" marker-end="url(#ei-arr)"/>
  <line x1="254" y1="124" x2="288" y2="124" stroke="#9a4b86" stroke-width="1.7" marker-end="url(#ei-arr-p)"/>

  <rect x="292" y="44" width="268" height="48" rx="7" fill="#ddf4ef" stroke="#087f73" stroke-width="1.3"/>
  <text x="306" y="73" font-size="14" font-weight="700" fill="#065f56">AI Core（Cube/Vector SIMD·SIMT）</text>

  <rect x="292" y="100" width="268" height="56" rx="7" fill="#f7e7f2" stroke="#9a4b86" stroke-width="1.4"/>
  <text x="306" y="124" font-size="14" font-weight="700" fill="#7a3a6a">CCU 通信卸载（最多 32 并发）</text>
  <text x="306" y="146" font-size="13.5" fill="#4d5652">CCUM 解释 Mission → CCUA 归约</text>

  <line x1="562" y1="128" x2="594" y2="128" stroke="#9a4b86" stroke-width="1.7" marker-end="url(#ei-arr-p)"/>

  <rect x="598" y="44" width="286" height="112" rx="7" fill="#e8edff" stroke="#4c65b6" stroke-width="1.3"/>
  <text x="612" y="70" font-size="14.5" font-weight="700" fill="#3a4f93">关键路径提醒（卸载不消迟到）</text>
  <text x="612" y="95" font-size="13.5" fill="#4d5652">t_next = max(t0, t1) + t_coord + t_comm</text>
  <text x="612" y="118" font-size="13.5" fill="#4d5652">卸载缩短协调（0.8→0.2 ms）</text>
  <text x="612" y="142" font-size="13.5" font-weight="700" fill="#8f3229">若卡 1 晚到 3 ms，后段仍要等</text>

  <line x1="16" y1="174" x2="884" y2="174" stroke="#b8bcb5" stroke-width="1.4" stroke-dasharray="6 5"/>

  <!-- Zone 2: UB 2.0 Fabric -->
  <text x="16" y="202" font-size="16" font-weight="700" fill="#17211f">② Unified Bus 2.0 互联语义与端口拓扑（注：此 UB 指互联，非核内 Unified Buffer）</text>

  <rect x="16" y="218" width="424" height="114" rx="7" fill="#ddf4ef" stroke="#087f73" stroke-width="1.4"/>
  <text x="30" y="244" font-size="14.5" font-weight="700" fill="#065f56">路径 A：URMA 异步搬运（CCU / 大块通信主力）</text>
  <text x="30" y="270" font-size="13.5" fill="#4d5652">写 Jetty 队列 → 敲 Doorbell → 远端 UMMU 翻译验权</text>
  <text x="30" y="294" font-size="13.5" fill="#4d5652">区分 RTP（可靠重传）与 CTP（不提供同级重传）</text>
  <text x="30" y="318" font-size="13.5" fill="#065f56">提交后可做无关活，读结果前须等完成通知</text>

  <rect x="460" y="218" width="424" height="114" rx="7" fill="#e8edff" stroke="#4c65b6" stroke-width="1.4"/>
  <text x="474" y="244" font-size="14.5" font-weight="700" fill="#3a4f93">路径 B：UB Memory 直接读写远端内存语义</text>
  <text x="474" y="270" font-size="13.5" fill="#4d5652">核心发访存 → 地址解码路由 → 远端 UMMU 翻译验权</text>
  <text x="474" y="294" font-size="13.5" fill="#4d5652">可连远端 CPU 内存池与存储资源池（仍需软件管理）</text>
  <text x="474" y="318" font-size="13.5" fill="#8f3229">不等同本地延迟，也未自动把远端 KV 变成驻留容量</text>

  <line x1="16" y1="350" x2="884" y2="350" stroke="#b8bcb5" stroke-width="1.4" stroke-dasharray="6 5"/>

  <!-- Zone 3: Switch, UBoE & Framework hooks -->
  <text x="16" y="376" font-size="16" font-weight="700" fill="#17211f">③ 端口转发、物理复用与 v0.30.0 A5 框架通信能力钩子</text>

  <rect x="16" y="390" width="276" height="68" rx="7" fill="#ece9df" stroke="#8a928f" stroke-width="1.3"/>
  <text x="30" y="416" font-size="14" font-weight="700" fill="#17211f">UB On-Chip Switch 转发</text>
  <text x="30" y="441" font-size="13.5" fill="#4d5652">单 IO Die 9×x4 端口直转不经主存</text>

  <rect x="310" y="390" width="278" height="68" rx="7" fill="#fff0e9" stroke="#b54237" stroke-width="1.3"/>
  <text x="324" y="416" font-size="14" font-weight="700" fill="#8f3229">UBoE 与 PCIe 物理端口复用</text>
  <text x="324" y="441" font-size="13.5" fill="#4d5652">共占 UB Link，峰值严禁直接相加</text>

  <rect x="606" y="390" width="278" height="68" rx="7" fill="#f7e7f2" stroke="#9a4b86" stroke-width="1.3"/>
  <text x="620" y="416" font-size="14" font-weight="700" fill="#7a3a6a">v0.30.0 A5 档案暴露钩子</text>
  <text x="620" y="441" font-size="13.5" fill="#4d5652">本地 KV 资源 + MoE 派发 + 融合通信</text>
</svg>
