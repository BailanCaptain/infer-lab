<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 384" width="900" height="384" role="img" aria-label="双卡通信卸载同比例关键路径甘特图：协调省 0.6 ms 但 3.0 ms 参与者迟到空等仍在" font-family="var(--font-sans)">
  <title>通信卸载关键路径甘特图：为什么卸载后下一段仍然晚（6.4 ms → 5.8 ms）</title>
  <desc>关联 LOCAL_KV_COMM_RESOURCE 与 MM_REDUCE_SCATTER_AI_CPU_INFERENCE，按统一时间标尺（0..7 ms）画出原路径与协调卸载后的双卡时间线：卡 0 在 2 ms 就绪、卡 1 在 5 ms 就绪，卸载将剩余协调从 0.8 ms 缩至 0.2 ms，下一段提前 0.6 ms，但卡 0 的 3.0 ms 等待迟到者空等不变。</desc>

  <text x="16" y="28" font-size="16" font-weight="700" fill="#17211f">关键路径同比例甘特图（教学示意）：卸载只缩协调段，消不掉参与者迟到等待</text>
  <line x1="14" y1="38" x2="886" y2="38" stroke="#b8bcb5" stroke-width="1.4"/>

  <!-- Time scale: x=120..820 -> 0.0 to 7.0 ms (100 px / ms) -->
  <!-- Gridlines at 0, 2, 5, 5.8, 6.4 ms -->
  <g stroke="#d8d8cf" stroke-width="1" stroke-dasharray="4 3">
    <line x1="120" y1="52" x2="120" y2="296"/>
    <line x1="320" y1="52" x2="320" y2="296"/>
    <line x1="620" y1="52" x2="620" y2="296"/>
    <line x1="700" y1="52" x2="700" y2="296"/>
    <line x1="760" y1="52" x2="760" y2="296"/>
  </g>

  <!-- Case A: Original Path (y=60..158) -->
  <text x="16" y="72" font-size="14.5" font-weight="700" fill="#8f3229">A. 原路径（下段起点 6.4 ms）</text>

  <text x="110" y="102" text-anchor="end" font-size="13.5" font-weight="700" fill="#17211f">卡 0</text>
  <rect x="120" y="82" width="200" height="28" rx="4" fill="#ddf4ef" stroke="#087f73" stroke-width="1.4"/>
  <text x="220" y="101" text-anchor="middle" font-size="13.5" font-weight="700" fill="#065f56">本地算 [1,2] (2 ms)</text>
  <!-- 3.0 ms Wait bar -->
  <rect x="320" y="82" width="300" height="28" rx="4" fill="#fff0e9" stroke="#b54237" stroke-width="1.4" stroke-dasharray="5 3"/>
  <text x="470" y="101" text-anchor="middle" font-size="13.5" font-weight="700" fill="#8f3229">空等卡 1 迟到：3.0 ms</text>

  <text x="110" y="138" text-anchor="end" font-size="13.5" font-weight="700" fill="#17211f">卡 1</text>
  <rect x="120" y="118" width="500" height="28" rx="4" fill="#e8edff" stroke="#4c65b6" stroke-width="1.4"/>
  <text x="370" y="137" text-anchor="middle" font-size="13.5" font-weight="700" fill="#3a4f93">本地计算 [10, 20]（较慢，5.0 ms 才就绪）</text>

  <!-- Shared tail after barrier (5.0 -> 5.8 -> 6.4) -->
  <rect x="620" y="82" width="80" height="64" rx="4" fill="#fff4cf" stroke="#c78300" stroke-width="1.5"/>
  <text x="660" y="110" text-anchor="middle" font-size="13.5" font-weight="700" fill="#936300">协调</text>
  <text x="660" y="130" text-anchor="middle" font-family="var(--font-mono)" font-size="13.5" fill="#936300">0.8ms</text>

  <rect x="700" y="82" width="60" height="64" rx="4" fill="#f7e7f2" stroke="#9a4b86" stroke-width="1.5"/>
  <text x="730" y="110" text-anchor="middle" font-size="13.5" font-weight="700" fill="#7a3a6a">求和</text>
  <text x="730" y="130" text-anchor="middle" font-family="var(--font-mono)" font-size="13.5" fill="#7a3a6a">0.6ms</text>

  <line x1="760" y1="76" x2="760" y2="152" stroke="#8f3229" stroke-width="2.2"/>
  <text x="772" y="118" font-family="var(--font-mono)" font-size="14" font-weight="700" fill="#8f3229">6.4 ms</text>

  <!-- Case B: Offloaded Path (y=176..278) -->
  <text x="16" y="186" font-size="14.5" font-weight="700" fill="#065f56">B. 协调卸载后（下段起点 5.8 ms，提前 0.6 ms）</text>

  <text x="110" y="216" text-anchor="end" font-size="13.5" font-weight="700" fill="#17211f">卡 0</text>
  <rect x="120" y="196" width="200" height="28" rx="4" fill="#ddf4ef" stroke="#087f73" stroke-width="1.4"/>
  <text x="220" y="215" text-anchor="middle" font-size="13.5" font-weight="700" fill="#065f56">本地算 [1,2] (2 ms)</text>
  <rect x="320" y="196" width="300" height="28" rx="4" fill="#fff0e9" stroke="#b54237" stroke-width="1.4" stroke-dasharray="5 3"/>
  <text x="470" y="215" text-anchor="middle" font-size="13.5" font-weight="700" fill="#8f3229">空等卡 1 迟到：仍为 3.0 ms！</text>

  <text x="110" y="252" text-anchor="end" font-size="13.5" font-weight="700" fill="#17211f">卡 1</text>
  <rect x="120" y="232" width="500" height="28" rx="4" fill="#e8edff" stroke="#4c65b6" stroke-width="1.4"/>
  <text x="370" y="251" text-anchor="middle" font-size="13.5" font-weight="700" fill="#3a4f93">本地计算 [10, 20]（5.0 ms 就绪不变）</text>

  <!-- Offloaded coord 0.2ms (20px) + sum 0.6ms (60px) = 5.8ms -->
  <rect x="620" y="196" width="20" height="64" rx="3" fill="#fff4cf" stroke="#c78300" stroke-width="1.6"/>
  <rect x="640" y="196" width="60" height="64" rx="4" fill="#f7e7f2" stroke="#9a4b86" stroke-width="1.5"/>
  <text x="670" y="224" text-anchor="middle" font-size="13.5" font-weight="700" fill="#7a3a6a">求和</text>
  <text x="670" y="244" text-anchor="middle" font-family="var(--font-mono)" font-size="13.5" fill="#7a3a6a">0.6ms</text>

  <!-- Saved 0.6ms highlight -->
  <rect x="700" y="196" width="60" height="64" rx="4" fill="#ddf4ef" stroke="#087f73" stroke-width="1.5" stroke-dasharray="4 3"/>
  <text x="730" y="224" text-anchor="middle" font-size="13.5" font-weight="700" fill="#065f56">省 0.6</text>
  <text x="730" y="244" text-anchor="middle" font-family="var(--font-mono)" font-size="13.5" fill="#065f56">ms</text>

  <line x1="700" y1="190" x2="700" y2="266" stroke="#087f73" stroke-width="2.2"/>
  <text x="772" y="232" font-family="var(--font-mono)" font-size="14" font-weight="700" fill="#065f56">5.8 ms</text>
  <text x="628" y="186" text-anchor="middle" font-family="var(--font-mono)" font-size="13.5" font-weight="700" fill="#936300">0.2ms</text>

  <!-- Axis ticks -->
  <line x1="120" y1="280" x2="820" y2="280" stroke="#8a928f" stroke-width="1.3"/>
  <g font-family="var(--font-mono)" font-size="13.5" fill="#4d5652" text-anchor="middle">
    <text x="120" y="299">0 ms</text>
    <text x="320" y="299">2.0 ms</text>
    <text x="620" y="299" font-weight="700" fill="#3a4f93">5.0 ms (就齐)</text>
    <text x="700" y="299" font-weight="700" fill="#065f56">5.8</text>
    <text x="760" y="299" font-weight="700" fill="#8f3229">6.4</text>
  </g>

  <!-- Diagnostic takeaway strip -->
  <rect x="16" y="316" width="868" height="54" rx="8" fill="#ece9df" stroke="#b8bcb5" stroke-width="1.2"/>
  <text x="30" y="340" font-size="14" font-weight="700" fill="#17211f">排障铁律：t_next = max(t₀, t₁) + t_coord + t_comm</text>
  <text x="30" y="361" font-size="13.5" fill="#4d5652">① 先统一时基对齐两卡就绪时刻 → ② 若某卡就绪晚优先平负载（降 max）→ ③ 两卡准时仍慢再查协调、拥塞与转发争用</text>
</svg>
