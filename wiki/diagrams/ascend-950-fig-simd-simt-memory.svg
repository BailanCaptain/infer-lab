<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 444" width="900" height="444" role="img" aria-label="昇腾 950 Vector SIMD 与 SIMT 通道对照及 UMA 内存与 L2 512B 扇区层次图" font-family="var(--font-sans)">
  <title>昇腾 950：SIMD vs SIMT 向量模式 与 UMA → L2 512 B 扇区 → 核内 SRAM 层次</title>
  <desc>基于 HardwareProfile（FP8_OPTIMIZED、DYNAMIC_MX_QUANT_FUSION），左侧用几何通道对比 SIMD 锁步向量运算与 SIMT 离散索引分支线程；右侧绘制 2×AI Die + 2×IO Die 的 UMA 封装、L2 512 B 缓存行（4×128 B sector）与核内 L1/L0/UB SRAM 的层级界限。</desc>
  <defs>
    <marker id="a95m-arr-t" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 1.5 L 8.5 5 L 0 8.5 z" fill="#087f73"/>
    </marker>
    <marker id="a95m-arr-p" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 1.5 L 8.5 5 L 0 8.5 z" fill="#9a4b86"/>
    </marker>
  </defs>

  <text x="16" y="28" font-size="16" font-weight="700" fill="#065f56">A. Vector 双模式：SIMD 为主 + SIMT 为辅</text>
  <text x="466" y="28" font-size="16" font-weight="700" fill="#3a4f93">B. UMA 封装、L2 扇区与核内 SRAM 分层</text>
  <line x1="14" y1="38" x2="886" y2="38" stroke="#b8bcb5" stroke-width="1.4"/>
  <line x1="450" y1="46" x2="450" y2="432" stroke="#b8bcb5" stroke-width="1.4" stroke-dasharray="5 4"/>

  <!-- LEFT TOP: SIMD lockstep -->
  <rect x="16" y="52" width="418" height="150" rx="9" fill="#ddf4ef" fill-opacity="0.45" stroke="#087f73" stroke-width="1.5"/>
  <text x="30" y="76" font-size="14.5" font-weight="700" fill="#065f56">SIMD VF：1 条指令同步打整组规则数据</text>

  <!-- 1 instruction bar broadcasting to 4 contiguous cells -->
  <rect x="30" y="88" width="128" height="32" rx="5" fill="#087f73"/>
  <text x="94" y="109" text-anchor="middle" font-family="var(--font-mono)" font-size="13.5" font-weight="700" fill="#ffffff">ReLU(x)</text>
  <line x1="160" y1="104" x2="188" y2="104" stroke="#087f73" stroke-width="2" marker-end="url(#a95m-arr-t)"/>

  <g font-family="var(--font-mono)" font-size="13.5" font-weight="700" text-anchor="middle">
    <rect x="194" y="88" width="54" height="32" rx="4" fill="#ffffff" stroke="#087f73" stroke-width="1.3"/><text x="221" y="109" fill="#17211f">5</text>
    <rect x="252" y="88" width="54" height="32" rx="4" fill="#ffffff" stroke="#087f73" stroke-width="1.3"/><text x="279" y="109" fill="#8f3229">-5</text>
    <rect x="310" y="88" width="54" height="32" rx="4" fill="#ffffff" stroke="#087f73" stroke-width="1.3"/><text x="337" y="109" fill="#17211f">3</text>
    <rect x="368" y="88" width="54" height="32" rx="4" fill="#ffffff" stroke="#087f73" stroke-width="1.3"/><text x="395" y="109" fill="#8f3229">-1</text>

    <rect x="194" y="136" width="54" height="28" rx="4" fill="#ddf4ef" stroke="#087f73" stroke-width="1.3"/><text x="221" y="155" fill="#065f56">5</text>
    <rect x="252" y="136" width="54" height="28" rx="4" fill="#ddf4ef" stroke="#087f73" stroke-width="1.3"/><text x="279" y="155" fill="#065f56">0</text>
    <rect x="310" y="136" width="54" height="28" rx="4" fill="#ddf4ef" stroke="#087f73" stroke-width="1.3"/><text x="337" y="155" fill="#065f56">3</text>
    <rect x="368" y="136" width="54" height="28" rx="4" fill="#ddf4ef" stroke="#087f73" stroke-width="1.3"/><text x="395" y="155" fill="#065f56">0</text>
  </g>
  <text x="30" y="155" font-size="13.5" fill="#065f56">全通道统一节拍 →</text>
  <text x="30" y="188" font-size="13.5" fill="#4d5652">适合连续向量加减、激活、缩放等密集逐项运算</text>

  <!-- LEFT BOTTOM: SIMT independent lanes -->
  <rect x="16" y="216" width="418" height="210" rx="9" fill="#f7e7f2" fill-opacity="0.5" stroke="#9a4b86" stroke-width="1.5"/>
  <text x="30" y="240" font-size="14.5" font-weight="700" fill="#7a3a6a">SIMT VF：多线程各取不连续索引、各自走分支</text>

  <!-- Source array cells 0..3 -->
  <g font-family="var(--font-mono)" font-size="13.5" text-anchor="middle">
    <rect x="30" y="254" width="60" height="28" rx="4" fill="#ffffff" stroke="#8a928f" stroke-width="1.2"/><text x="60" y="273" fill="#17211f">A[0]</text>
    <rect x="96" y="254" width="60" height="28" rx="4" fill="#ece9df" stroke="#b8bcb5" stroke-width="1.2"/><text x="126" y="273" fill="#66716d">A[1]</text>
    <rect x="162" y="254" width="60" height="28" rx="4" fill="#ffffff" stroke="#8a928f" stroke-width="1.2"/><text x="192" y="273" fill="#17211f">A[2]</text>
    <rect x="228" y="254" width="60" height="28" rx="4" fill="#ffffff" stroke="#8a928f" stroke-width="1.2"/><text x="258" y="273" fill="#17211f">A[3]</text>
  </g>
  <text x="302" y="273" font-size="13.5" fill="#7a3a6a">索引 [3, 0, 2]</text>

  <!-- Crossing non-contiguous arrows to 3 threads -->
  <path d="M 258 282 L 82 320" fill="none" stroke="#9a4b86" stroke-width="1.7" marker-end="url(#a95m-arr-p)"/>
  <path d="M 60 282 L 198 320" fill="none" stroke="#9a4b86" stroke-width="1.7" marker-end="url(#a95m-arr-p)"/>
  <path d="M 192 282 L 318 320" fill="none" stroke="#9a4b86" stroke-width="1.7" marker-end="url(#a95m-arr-p)"/>

  <g font-size="13.5" font-weight="700" text-anchor="middle">
    <rect x="30" y="324" width="108" height="44" rx="5" fill="#ffffff" stroke="#9a4b86" stroke-width="1.4"/>
    <text x="84" y="344" fill="#7a3a6a">T0 取 A[3]</text>
    <text x="84" y="362" font-weight="400" fill="#4d5652">走分支 if</text>

    <rect x="148" y="324" width="108" height="44" rx="5" fill="#fff4cf" stroke="#c78300" stroke-width="1.4"/>
    <text x="202" y="344" fill="#936300">T1 取 A[0]</text>
    <text x="202" y="362" font-weight="400" fill="#4d5652">走分支 else</text>

    <rect x="266" y="324" width="108" height="44" rx="5" fill="#ffffff" stroke="#9a4b86" stroke-width="1.4"/>
    <text x="320" y="344" fill="#7a3a6a">T2 取 A[2]</text>
    <text x="320" y="362" font-weight="400" fill="#4d5652">走分支 if</text>
  </g>
  <text x="30" y="394" font-size="13.5" fill="#4d5652">SIMD VF 与 SIMT VF 可在算子内按需切换，但仍须</text>
  <text x="30" y="414" font-size="13.5" fill="#7a3a6a">权衡访存分散与切换同步开销，非“支持即必快”</text>

  <!-- RIGHT: UMA Package + L2 512B Sectors + On-core SRAM Hierarchy -->
  <!-- Layer 1: UMA Package & GM -->
  <rect x="466" y="52" width="418" height="100" rx="9" fill="#ece9df" stroke="#8a928f" stroke-width="1.4"/>
  <text x="480" y="76" font-size="14.5" font-weight="700" fill="#17211f">① UMA 合封与设备全局内存（GB 级）</text>
  <rect x="480" y="88" width="116" height="30" rx="5" fill="#e8edff" stroke="#4c65b6" stroke-width="1.3"/>
  <text x="538" y="108" text-anchor="middle" font-family="var(--font-mono)" font-size="13.5" font-weight="700" fill="#3a4f93">2× AI Die</text>
  <rect x="606" y="88" width="116" height="30" rx="5" fill="#f7e7f2" stroke="#9a4b86" stroke-width="1.3"/>
  <text x="664" y="108" text-anchor="middle" font-family="var(--font-mono)" font-size="13.5" font-weight="700" fill="#7a3a6a">2× IO Die</text>
  <rect x="732" y="88" width="138" height="30" rx="5" fill="#ffffff" stroke="#8a928f" stroke-width="1.3"/>
  <text x="801" y="108" text-anchor="middle" font-size="13.5" font-weight="700" fill="#17211f">96~144 GB GM</text>
  <text x="480" y="140" font-size="13.5" fill="#4d5652">长期存权重/KV；统一编址 ≠ 所有位置访问延迟相同</text>

  <!-- Layer 2: L2 Cache 512B = 4x128B sectors -->
  <rect x="466" y="166" width="418" height="132" rx="9" fill="#e8edff" fill-opacity="0.55" stroke="#4c65b6" stroke-width="1.5"/>
  <text x="480" y="191" font-size="14.5" font-weight="700" fill="#3a4f93">② L2 Cache（128 / 112 MB）：512 B 行拆 4 扇区</text>
  <!-- 4 x 128B sector cells -->
  <g font-family="var(--font-mono)" font-size="13.5" font-weight="700" text-anchor="middle">
    <rect x="480" y="204" width="94" height="34" rx="4" fill="#ffffff" stroke="#4c65b6" stroke-width="1.4"/><text x="527" y="226" fill="#3a4f93">128 B s0</text>
    <rect x="578" y="204" width="94" height="34" rx="4" fill="#ffffff" stroke="#4c65b6" stroke-width="1.4"/><text x="625" y="226" fill="#3a4f93">128 B s1</text>
    <rect x="676" y="204" width="94" height="34" rx="4" fill="#ffffff" stroke="#4c65b6" stroke-width="1.4"/><text x="723" y="226" fill="#3a4f93">128 B s2</text>
    <rect x="774" y="204" width="94" height="34" rx="4" fill="#ffffff" stroke="#4c65b6" stroke-width="1.4"/><text x="821" y="226" fill="#3a4f93">128 B s3</text>
  </g>
  <text x="480" y="262" font-size="13.5" fill="#17211f">支持软件缓存提示 + CMO（预取 / 写回 / 失效）</text>
  <text x="480" y="284" font-size="13.5" fill="#66716d">单扫大块避挤占；已发提示 ≠ 全部命中</text>

  <!-- Layer 3: On-Core KB SRAM -->
  <rect x="466" y="312" width="418" height="114" rx="9" fill="#fff4cf" fill-opacity="0.55" stroke="#c78300" stroke-width="1.5"/>
  <text x="480" y="337" font-size="14.5" font-weight="700" fill="#936300">③ 核内高速 SRAM 缓冲（KB 级，勿与 GB 片上内存混称）</text>
  <g font-family="var(--font-mono)" font-size="13.5" font-weight="700" text-anchor="middle">
    <rect x="480" y="350" width="122" height="32" rx="4" fill="#ffffff" stroke="#c78300" stroke-width="1.3"/><text x="541" y="371" fill="#936300">L1 512 KB</text>
    <rect x="610" y="350" width="132" height="32" rx="4" fill="#ffffff" stroke="#c78300" stroke-width="1.3"/><text x="676" y="371" fill="#936300">L0A/B/C</text>
    <rect x="750" y="350" width="120" height="32" rx="4" fill="#ddf4ef" stroke="#087f73" stroke-width="1.3"/><text x="810" y="371" fill="#065f56">UB 2×256K</text>
  </g>
  <text x="480" y="408" font-size="13.5" fill="#4d5652">此处 UB 指核内 Unified Buffer，区别于互联 Unified Bus</text>
</svg>
