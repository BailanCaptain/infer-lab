<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 540" width="820" height="540" role="img" aria-label="第 4 站的取证路线。硬件规格只能提出候选，实际算子与 kernel 说明有没有采用它，执行记录才能说明该路径是否少花时间。图中的两条结果分支分别通向正确性定位或端到端性能验收。">
  <title>第 4 站的取证路线。硬件规格只能提出候选，实际算子与 kernel 说明有没有采用它，执行记录才能说明该路径是否少花时间。图中的两条结果分支分别通向正确性定位或端到端性能验收。</title>
  <defs><marker id="ascend-950-observe-ah-ink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="var(--color-ink, #17211f)"/></marker><marker id="ascend-950-observe-ah-danger" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="var(--color-danger, #b54237)"/></marker><marker id="ascend-950-observe-ah-token" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="var(--color-token, #087f73)"/></marker></defs>
  <path d="M410 84 L410 122" fill="none" stroke="var(--color-ink, #17211f)" stroke-width="1.4" marker-end="url(#ascend-950-observe-ah-ink)"/>
  <path d="M410 190 L410 228" fill="none" stroke="var(--color-ink, #17211f)" stroke-width="1.4" marker-end="url(#ascend-950-observe-ah-ink)"/>
  <path d="M245 296 L245 329 L200 329 L200 361" fill="none" stroke="var(--color-danger, #b54237)" stroke-width="1.4" marker-end="url(#ascend-950-observe-ah-danger)"/>
  <path d="M575 296 L575 329 L620 329 L620 361" fill="none" stroke="var(--color-token, #087f73)" stroke-width="1.4" marker-end="url(#ascend-950-observe-ah-token)"/>
  <rect x="65" y="20" width="690" height="64" rx="8" fill="var(--color-surface-sunken, #ece9df)" stroke="var(--color-control, #66716d)" stroke-opacity="0.4" stroke-width="1.5" stroke-dasharray="5 4"/>
  <text x="410" y="48" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="13" font-weight="400" fill="#4d5652" text-anchor="middle">确认产品与软件：具体型号、驱动、CANN、框架、模型</text>
  <text x="410" y="67" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="13" font-weight="400" fill="#4d5652" text-anchor="middle">记录输入形状与精度，保持对照条件一致</text>
  <rect x="65" y="126" width="690" height="64" rx="8" fill="var(--color-weight-soft, #fff4cf)" stroke="var(--color-weight, #c78300)" stroke-opacity="0.4" stroke-width="1.5" stroke-dasharray="5 4"/>
  <text x="410" y="154" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="13" font-weight="400" fill="#936300" text-anchor="middle">第 4 站：实际算子 → kernel → 分块与数据通路</text>
  <text x="410" y="173" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="13" font-weight="400" fill="#936300" text-anchor="middle">只有规格支持，还不能说明走了 CV 或 NDDMA</text>
  <rect x="65" y="232" width="690" height="64" rx="8" fill="var(--color-surface-sunken, #ece9df)" stroke="var(--color-control, #66716d)" stroke-opacity="0.4" stroke-width="1.5" stroke-dasharray="5 4"/>
  <text x="410" y="260" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="13" font-weight="400" fill="#4d5652" text-anchor="middle">对照同一块：数值、搬运、计算与同步等待</text>
  <text x="410" y="279" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="13" font-weight="400" fill="#4d5652" text-anchor="middle">同时看有效数据与真实事务，保存首次分歧</text>
  <rect x="20" y="365" width="360" height="78" rx="8" fill="var(--color-accent-soft, #fff0e9)" stroke="var(--color-danger, #b54237)" stroke-opacity="0.4" stroke-width="1.5" stroke-dasharray="5 4"/>
  <text x="200" y="400" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="13" font-weight="400" fill="#8f3229" text-anchor="middle">结果不同</text>
  <text x="200" y="419" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="13" font-weight="400" fill="#8f3229" text-anchor="middle">先查坐标、格式与缓冲使用次序</text>
  <rect x="440" y="365" width="360" height="78" rx="8" fill="var(--color-token, #087f73)" stroke="var(--color-ink, #17211f)" stroke-width="1.5"/>
  <text x="620" y="400" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="14" font-weight="700" fill="var(--color-ink-inverse, #ffffff)" text-anchor="middle">结果一致，设备时间下降</text>
  <text x="620" y="419" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="13" font-weight="400" fill="var(--color-ink-inverse, #ffffff)" text-anchor="middle">再看它是否减少请求关键路径等待</text>
  <text x="20" y="493" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="15" font-weight="400" fill="var(--color-ink, #17211f)">单算子变快而请求不变：继续找其他等待，不把核内收益直接当成服务收益。</text>
</svg>
