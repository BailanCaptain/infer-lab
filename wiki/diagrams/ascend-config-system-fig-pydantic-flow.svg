<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 420" width="900" height="420" role="img" aria-label="AscendConfig 四版环境变量收口、强类型子配置扩张与编译缓存隔离图" font-family="var(--font-sans)">
  <title>AscendConfig 四版收口演进：环境变量减法、强类型子配置加法与进程隔离边界</title>
  <desc>Proportional bar charts contrasting envs.py shrinkage (21 to 12 total, 9 to 1 prefixed) against Pydantic sub-config expansion (8 to 12 to 14+runtime), plus compile cache hash and per-process singleton boundaries.</desc>

  <text x="16" y="26" font-size="16" font-weight="700" fill="#17211f">配置演进全景：环境变量持续收口，强类型子配置统一接管</text>
  <text x="16" y="48" font-size="13.5" fill="#66716d">把零散环境变量迁回 --additional-config 强类型 schema，拼错键名在构造期即可拦截</text>

  <!-- Left Chart: envs.py shrinkage (x=16..434) -->
  <text x="16" y="82" font-size="15" font-weight="700" fill="#3a4f93">左：envs.py 环境变量条数收口（总条数 / 带前缀条数）</text>

  <!-- Scale bar rows: max 21 -> width 273 (13px per var) -->
  <text x="16" y="120" font-size="13.5" font-weight="700" fill="#4d5652">v0.23.0</text>
  <rect x="100" y="102" width="273" height="24" rx="4" fill="#e8edff" stroke="#4c65b6" stroke-width="1.2"/>
  <rect x="100" y="102" width="117" height="24" rx="4" fill="#4c65b6"/>
  <text x="158" y="119" text-anchor="middle" font-size="13.5" font-weight="700" fill="#ffffff">9 前缀</text>
  <text x="382" y="119" font-size="13.5" font-weight="700" fill="#3a4f93">21 条</text>

  <text x="16" y="162" font-size="13.5" font-weight="700" fill="#4d5652">v0.26rc</text>
  <rect x="100" y="144" width="260" height="24" rx="4" fill="#e8edff" stroke="#4c65b6" stroke-width="1.2"/>
  <rect x="100" y="144" width="104" height="24" rx="4" fill="#4c65b6"/>
  <text x="152" y="161" text-anchor="middle" font-size="13.5" font-weight="700" fill="#ffffff">8 前缀</text>
  <text x="369" y="161" font-size="13.5" font-weight="700" fill="#3a4f93">20 条</text>

  <text x="16" y="204" font-size="13.5" font-weight="700" fill="#065f56">v0.30.0</text>
  <rect x="100" y="186" width="182" height="24" rx="4" fill="#ddf4ef" stroke="#087f73" stroke-width="1.3"/>
  <rect x="100" y="186" width="54" height="24" rx="4" fill="#087f73"/>
  <text x="127" y="203" text-anchor="middle" font-size="13.5" font-weight="700" fill="#ffffff">3</text>
  <text x="291" y="203" font-size="13.5" font-weight="700" fill="#065f56">14 条（主基线）</text>

  <text x="16" y="246" font-size="13.5" font-weight="700" fill="#7a3a6a">main</text>
  <rect x="100" y="228" width="156" height="24" rx="4" fill="#f7e7f2" stroke="#9a4b86" stroke-width="1.3"/>
  <rect x="100" y="228" width="28" height="24" rx="4" fill="#9a4b86"/>
  <text x="114" y="245" text-anchor="middle" font-size="13.5" font-weight="700" fill="#ffffff">1</text>
  <text x="265" y="245" font-size="13.5" font-weight="700" fill="#7a3a6a">12 条（仅 1 前缀）</text>

  <text x="16" y="278" font-size="13.5" fill="#66716d">注：表外仍保留 DYNAMIC_EPLB 等极早期直读变量</text>

  <!-- Vertical Divider -->
  <line x1="452" y1="68" x2="452" y2="288" stroke="#b8bcb5" stroke-width="1.4" stroke-dasharray="6 4"/>

  <!-- Right Chart: Sub-config expansion (x=470..884) -->
  <text x="470" y="82" font-size="15" font-weight="700" fill="#936300">右：强类型子配置组数扩张与未知键策略</text>

  <!-- Scale: max 15 -> width 270 (18px per group) -->
  <text x="470" y="120" font-size="13.5" font-weight="700" fill="#4d5652">v0.23.0</text>
  <rect x="554" y="102" width="144" height="24" rx="4" fill="#ece9df" stroke="#66716d" stroke-width="1.2"/>
  <text x="626" y="119" text-anchor="middle" font-size="13.5" font-weight="700" fill="#17211f">8 组手写 .get()</text>
  <text x="708" y="119" font-size="13.5" fill="#8f3229">多静默忽略</text>

  <text x="470" y="162" font-size="13.5" font-weight="700" fill="#065f56">v0.30.0</text>
  <rect x="554" y="144" width="216" height="24" rx="4" fill="#fff4cf" stroke="#c78300" stroke-width="1.3"/>
  <text x="662" y="161" text-anchor="middle" font-size="13.5" font-weight="700" fill="#936300">12 组 Pydantic</text>
  <text x="778" y="161" font-size="13.5" font-weight="700" fill="#065f56">extra="forbid"</text>

  <text x="470" y="204" font-size="13.5" font-weight="700" fill="#7a3a6a">main</text>
  <rect x="554" y="186" width="252" height="24" rx="4" fill="#f7e7f2" stroke="#9a4b86" stroke-width="1.3"/>
  <text x="680" y="203" text-anchor="middle" font-size="13.5" font-weight="700" fill="#7a3a6a">14 组 + runtime_config</text>
  <text x="814" y="203" font-size="13.5" font-weight="700" fill="#7a3a6a">15 项</text>

  <rect x="470" y="226" width="414" height="54" rx="7" fill="#fff0e9" stroke="#b54237" stroke-width="1.2"/>
  <text x="484" y="249" font-size="13.5" font-weight="700" fill="#8f3229">唯一宽容例外：检测到 vllm_omni 时</text>
  <text x="484" y="271" font-size="13.5" fill="#4d5652">未知顶层键先打告警再过滤（子配置内错键照样报错）</text>

  <!-- Bottom Strip: 3 Engineering Guardrails -->
  <line x1="16" y1="302" x2="884" y2="302" stroke="#b8bcb5" stroke-width="1.4" stroke-dasharray="6 4"/>

  <rect x="16" y="318" width="276" height="88" rx="8" fill="#fff4cf" stroke="#c78300" stroke-width="1.3"/>
  <text x="30" y="344" font-size="14" font-weight="700" fill="#936300">① 编译缓存 Hash 联动</text>
  <text x="30" y="369" font-size="13.5" fill="#4d5652">非空 JSON 整段纳入配置 hash</text>
  <text x="30" y="393" font-size="13.5" fill="#4d5652">改任一键都可能未命中旧编译缓存</text>

  <rect x="312" y="318" width="276" height="88" rx="8" fill="#e8edff" stroke="#4c65b6" stroke-width="1.3"/>
  <text x="326" y="344" font-size="14" font-weight="700" fill="#3a4f93">② 进程内单例与重启生效</text>
  <text x="326" y="369" font-size="13.5" fill="#4d5652">_ASCEND_CONFIG 构造完即定型</text>
  <text x="326" y="393" font-size="13.5" fill="#4d5652">终端重新 export 不热更运行服务</text>

  <rect x="608" y="318" width="276" height="88" rx="8" fill="#ddf4ef" stroke="#087f73" stroke-width="1.3"/>
  <text x="622" y="344" font-size="14" font-weight="700" fill="#065f56">③ 取配置未初始化报错</text>
  <text x="622" y="369" font-size="13.5" fill="#4d5652">缓存为空或缺守卫属性即抛错</text>
  <text x="622" y="393" font-size="13.5" fill="#4d5652">说明调用时机不对，非 JSON 错</text>
</svg>
