<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 560" width="900" height="560" role="img" aria-label="四层补丁筛选漏斗、空转绕行出口与三层进程去重护栏图" font-family="var(--font-sans)">
  <title>vllm-ascend 四层补丁漏斗与三层进程去重护栏</title>
  <desc>4-layer patch funnel from directory files to conditional import, source/consumer double-patch, and actual execution with no-op exits, plus 3-layer in-process deduplication guards.</desc>
  <defs>
    <marker id="pf-arr-g" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto"><path d="M0 1.5L8.5 5L0 8.5z" fill="#66716d"/></marker>
    <marker id="pf-arr-r" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto"><path d="M0 1.5L8.5 5L0 8.5z" fill="#b54237"/></marker>
    <marker id="pf-arr-t" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto"><path d="M0 1.5L8.5 5L0 8.5z" fill="#087f73"/></marker>
    <marker id="pf-arr-p" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto"><path d="M0 1.5L8.5 5L0 8.5z" fill="#9a4b86"/></marker>
  </defs>

  <text x="16" y="26" font-size="16" font-weight="700" fill="#17211f">① 四层补丁漏斗：文件存在 ≠ 条件导入 ≠ 符号替换 ≠ 请求实际调用</text>
  <text x="16" y="48" font-size="13.5" fill="#66716d">排查某条补丁是否生效，须顺漏斗逐层核对入口条件、双处改写与调用侧开关</text>

  <!-- Layer 1 Trapezoid -->
  <polygon points="16,64 560,64 532,126 44,126" fill="#ece9df" stroke="#66716d" stroke-width="1.4"/>
  <text x="288" y="89" text-anchor="middle" font-size="14.5" font-weight="700" fill="#17211f">L1 目录文件（v0.30.0: 32 + 19 + 14 = 65 ｜ main: 29 + 30 = 59）</text>
  <text x="288" y="113" text-anchor="middle" font-size="13.5" fill="#4d5652">patch/platform · patch/worker · patch_v2（main 退役 patch_v2 并扁平合入）</text>

  <line x1="288" y1="126" x2="288" y2="142" stroke="#66716d" stroke-width="1.8" marker-end="url(#pf-arr-g)"/>

  <!-- Layer 2 Trapezoid -->
  <polygon points="44,146 532,146 504,208 72,208" fill="#fff4cf" stroke="#c78300" stroke-width="1.4"/>
  <text x="288" y="171" text-anchor="middle" font-size="14.5" font-weight="700" fill="#936300">L2 条件导入（adapt_patch 分流 + 入口门控）</text>
  <text x="288" y="195" text-anchor="middle" font-size="13.5" fill="#4d5652">HardwareProfile 能力表 · HAS_TRITON · DYNAMIC_EPLB · 延迟导入</text>

  <!-- Layer 2 Side Exit -->
  <line x1="518" y1="177" x2="588" y2="177" stroke="#b54237" stroke-width="1.6" stroke-dasharray="5 3" marker-end="url(#pf-arr-r)"/>
  <rect x="594" y="146" width="290" height="62" rx="7" fill="#fff0e9" stroke="#b54237" stroke-width="1.3"/>
  <text x="608" y="171" font-size="14" font-weight="700" fill="#8f3229">跳过未导入（GLM 算例）</text>
  <text x="608" y="195" font-size="13.5" fill="#4d5652">platform 28→23 · worker 24→19</text>

  <line x1="288" y1="208" x2="288" y2="224" stroke="#66716d" stroke-width="1.8" marker-end="url(#pf-arr-g)"/>

  <!-- Layer 3 Trapezoid -->
  <polygon points="72,228 504,228 476,290 100,290" fill="#e8edff" stroke="#4c65b6" stroke-width="1.4"/>
  <text x="288" y="253" text-anchor="middle" font-size="14.5" font-weight="700" fill="#3a4f93">L3 源模块与消费方副本改写（塞表 / 换绑定）</text>
  <text x="288" y="277" text-anchor="middle" font-size="13.5" fill="#4d5652">同时覆写 from-import 消费方副本（EngineCore / 后处理）</text>

  <!-- Layer 3 Side Note -->
  <line x1="490" y1="259" x2="588" y2="259" stroke="#9a4b86" stroke-width="1.5" stroke-dasharray="4 3" marker-end="url(#pf-arr-p)"/>
  <rect x="594" y="228" width="290" height="62" rx="7" fill="#f7e7f2" stroke="#9a4b86" stroke-width="1.3"/>
  <text x="608" y="253" font-size="14" font-weight="700" fill="#7a3a6a">内部条件早退（导入但不替换）</text>
  <text x="608" y="277" font-size="13.5" fill="#4d5652">如 platform/distributed 仅 310P 换</text>

  <line x1="288" y1="290" x2="288" y2="306" stroke="#087f73" stroke-width="1.8" marker-end="url(#pf-arr-t)"/>

  <!-- Layer 4 Trapezoid -->
  <polygon points="100,310 476,310 448,376 128,376" fill="#ddf4ef" stroke="#087f73" stroke-width="1.5"/>
  <text x="288" y="337" text-anchor="middle" font-size="14.5" font-weight="700" fill="#065f56">L4 请求热路径实际调用</text>
  <text x="288" y="362" text-anchor="middle" font-size="13.5" fill="#065f56">配置解析 · KV 分组 · 通信组 · 权重后处理</text>

  <!-- Layer 4 Side Exits: 2 No-Op + 1 Subclass Bypass -->
  <line x1="462" y1="343" x2="588" y2="343" stroke="#b54237" stroke-width="1.7" stroke-dasharray="5 3" marker-end="url(#pf-arr-r)"/>
  <rect x="594" y="304" width="290" height="86" rx="7" fill="#fff0e9" stroke="#b54237" stroke-width="1.4"/>
  <text x="608" y="328" font-size="14" font-weight="700" fill="#8f3229">已替换但空转 / 被绕行</text>
  <text x="608" y="352" font-size="13.5" fill="#4d5652">1. mamba_scheduler：none 不触发</text>
  <text x="608" y="376" font-size="13.5" fill="#4d5652">2. balance 转调父类；3. 子类绕采样</text>

  <!-- Divider -->
  <line x1="16" y1="406" x2="884" y2="406" stroke="#b8bcb5" stroke-width="1.4" stroke-dasharray="6 4"/>

  <!-- Bottom Section: 3-Layer Dedup Guard -->
  <text x="16" y="432" font-size="16" font-weight="700" fill="#17211f">② 同进程三层去重护栏（入口去重 ≠ 补丁本身幂等）</text>

  <!-- Entry paths on left -->
  <rect x="16" y="448" width="166" height="44" rx="6" fill="#ddf4ef" stroke="#087f73" stroke-width="1.3"/>
  <text x="99" y="468" text-anchor="middle" font-size="13.5" font-weight="700" fill="#065f56">3 个通用插件入口</text>
  <text x="99" y="486" text-anchor="middle" font-size="13.5" fill="#4d5652">connector/loader/prof</text>

  <rect x="16" y="504" width="166" height="44" rx="6" fill="#fff4cf" stroke="#c78300" stroke-width="1.3"/>
  <text x="99" y="524" text-anchor="middle" font-size="13.5" font-weight="700" fill="#936300">平台准备钩子</text>
  <text x="99" y="542" text-anchor="middle" font-size="13.5" fill="#4d5652">pre_register_and_update</text>

  <!-- Guard 1 -->
  <line x1="182" y1="470" x2="210" y2="470" stroke="#087f73" stroke-width="1.7" marker-end="url(#pf-arr-t)"/>
  <rect x="216" y="446" width="194" height="58" rx="7" fill="#e8edff" stroke="#4c65b6" stroke-width="1.3"/>
  <text x="228" y="469" font-size="13.5" font-weight="700" fill="#3a4f93">1. plugins_loaded</text>
  <text x="228" y="492" font-size="13.5" fill="#4d5652">调用前置真，报错不重试</text>

  <!-- Guard 2 -->
  <line x1="410" y1="470" x2="438" y2="470" stroke="#087f73" stroke-width="1.7" marker-end="url(#pf-arr-t)"/>
  <rect x="444" y="446" width="206" height="58" rx="7" fill="#f7e7f2" stroke="#9a4b86" stroke-width="1.3"/>
  <text x="456" y="469" font-size="13.5" font-weight="700" fill="#7a3a6a">2. _GLOBAL_PATCH_APPLIED</text>
  <text x="456" y="492" font-size="13.5" fill="#4d5652">成功返回后置真，拦其余入口</text>

  <!-- Guard 3 -->
  <line x1="650" y1="470" x2="678" y2="470" stroke="#087f73" stroke-width="1.7" marker-end="url(#pf-arr-t)"/>
  <!-- Platform hook bypasses Guard 1 & 2 -> straight to Guard 3! -->
  <path d="M182 526 H666 V492 H678" fill="none" stroke="#c78300" stroke-width="1.7" stroke-dasharray="5 3" marker-end="url(#pf-arr-g)"/>
  <text x="424" y="520" text-anchor="middle" font-size="13.5" font-weight="600" fill="#936300">绕过第 1、2 层，直接由第 3 层 sys.modules 拦截</text>

  <rect x="684" y="446" width="200" height="102" rx="7" fill="#ddf4ef" stroke="#087f73" stroke-width="1.4"/>
  <text x="698" y="471" font-size="14" font-weight="700" fill="#065f56">3. sys.modules 缓存</text>
  <text x="698" y="495" font-size="13.5" fill="#4d5652">护住平台钩子与 worker 补丁</text>
  <text x="698" y="519" font-size="13.5" fill="#8f3229" font-weight="600">强行重跑包装型补丁会</text>
  <text x="698" y="540" font-size="13.5" fill="#8f3229" font-weight="600">把原函数存成自己（自递归）</text>
</svg>
