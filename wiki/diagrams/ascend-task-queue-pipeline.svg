<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 560" width="900" height="560" role="img" aria-label="昇腾算子下发三档流水线泳道、跨流显存提前复用与 HCCL AIV 直驱链路机制图">
  <title>昇腾算子下发流水与跨流显存/通信调优</title>
  <desc>上半部用多泳道时间轴对比 TASK_QUEUE_ENABLE=0（关 Host 异步队列由主线程直发，定位时另配 ASCEND_LAUNCH_BLOCKING=1）、=1（镜像默认一级异步队列）与 =2（二级均衡与唤醒优化，掩盖下发但抬高在途显存峰值，且在固定 main 下开启图捕获直接报错）；下半部展示 expandable_segments:True 跨流显存复用与 HCCL 展开模式选路。</desc>
  <defs>
    <marker id="arr-t" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse">
      <path d="M 1 1.5 L 8.5 5 L 1 8.5 z" fill="#087f73" />
    </marker>
    <marker id="arr-i" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse">
      <path d="M 1 1.5 L 8.5 5 L 1 8.5 z" fill="#4c65b6" />
    </marker>
    <marker id="arr-p" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse">
      <path d="M 1 1.5 L 8.5 5 L 1 8.5 z" fill="#9a4b86" />
    </marker>
  </defs>

  <!-- ================= BAND 1: Swimlane Timelines for TASK_QUEUE_ENABLE ================= -->
  <text x="20" y="28" font-family="system-ui, -apple-system, sans-serif" font-size="16" font-weight="700" fill="#17211f">1. 为什么推理卡在 Host CPU？TASK_QUEUE_ENABLE = 0 / 1 / 2 多泳道时序对照</text>

  <!-- Mode 0 Swimlane (y=46..122) -->
  <rect x="16" y="46" width="224" height="76" rx="8" fill="#fff0e9" stroke="#b54237" stroke-width="1.5" />
  <text x="128" y="69" text-anchor="middle" font-family="var(--font-mono)" font-size="13" font-weight="700" fill="#8f3229">TASK_QUEUE_ENABLE=0</text>
  <text x="128" y="90" text-anchor="middle" font-family="var(--font-sans)" font-size="12" font-weight="700" fill="#17211f">关 Host 队列 · 主线程直发</text>
  <text x="128" y="110" text-anchor="middle" font-family="var(--font-sans)" font-size="12" fill="#8f3229">定位另配 LAUNCH_BLOCKING=1</text>

  <!-- Mode 0 Timeline Track -->
  <text x="248" y="68" font-family="var(--font-sans)" font-size="12" font-weight="700" fill="#66716d">Host 主线程</text>
  <rect x="314" y="52" width="166" height="24" rx="4" fill="#ece9df" stroke="#66716d" stroke-width="1.2" />
  <text x="397" y="69" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="12" fill="#17211f">Python + ACL 直发 Op1</text>
  <rect x="490" y="52" width="166" height="24" rx="4" fill="#ece9df" stroke="#66716d" stroke-width="1.2" />
  <text x="573" y="69" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="12" fill="#17211f">Python + ACL 直发 Op2</text>

  <text x="244" y="106" font-family="system-ui, -apple-system, sans-serif" font-size="12.5" font-weight="700" fill="#936300">AI Core</text>
  <rect x="480" y="90" width="64" height="24" rx="4" fill="#fff4cf" stroke="#c78300" stroke-width="1.3" />
  <text x="512" y="107" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="700" fill="#936300">算 Op1</text>
  <rect x="548" y="90" width="108" height="24" rx="4" fill="#fff0e9" stroke="#b54237" stroke-width="1.3" stroke-dasharray="4 3" />
  <text x="602" y="107" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="700" fill="#8f3229">下发空泡 Bubble</text>
  <rect x="660" y="90" width="64" height="24" rx="4" fill="#fff4cf" stroke="#c78300" stroke-width="1.3" />
  <text x="692" y="107" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="700" fill="#936300">算 Op2</text>
  <text x="736" y="107" font-family="system-ui, -apple-system, sans-serif" font-size="12.5" font-weight="700" fill="#8f3229">← Host-bound 断流</text>

  <!-- Mode 1 Swimlane (y=134..214) -->
  <rect x="20" y="134" width="210" height="80" rx="8" fill="#e8edff" stroke="#4c65b6" stroke-width="1.5" />
  <text x="125" y="160" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, monospace" font-size="13" font-weight="700" fill="#3a4f93">TASK_QUEUE_ENABLE=1</text>
  <text x="125" y="182" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="12.5" fill="#17211f">官方镜像默认 Level 1</text>
  <text x="125" y="201" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="12" fill="#3a4f93">兼容 ACL Graph 图捕获</text>

  <text x="244" y="154" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="700" fill="#66716d">主线程</text>
  <rect x="314" y="139" width="90" height="22" rx="4" fill="#ece9df" stroke="#66716d" stroke-width="1.1" />
  <text x="359" y="155" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="12" fill="#17211f">入队 Op1</text>
  <rect x="410" y="139" width="90" height="22" rx="4" fill="#ece9df" stroke="#66716d" stroke-width="1.1" />
  <text x="455" y="155" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="12" fill="#17211f">入队 Op2</text>
  <rect x="506" y="139" width="90" height="22" rx="4" fill="#ece9df" stroke="#66716d" stroke-width="1.1" />
  <text x="551" y="155" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="12" fill="#17211f">入队 Op3</text>

  <text x="244" y="180" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="700" fill="#3a4f93">二级队列</text>
  <rect x="364" y="165" width="108" height="22" rx="4" fill="#e8edff" stroke="#4c65b6" stroke-width="1.1" />
  <text x="418" y="181" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="12" fill="#3a4f93">ACLNN 下发 1</text>
  <rect x="478" y="165" width="108" height="22" rx="4" fill="#e8edff" stroke="#4c65b6" stroke-width="1.1" />
  <text x="532" y="181" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="12" fill="#3a4f93">ACLNN 下发 2</text>

  <text x="244" y="206" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="700" fill="#936300">AI Core</text>
  <rect x="472" y="191" width="68" height="22" rx="4" fill="#fff4cf" stroke="#c78300" stroke-width="1.3" />
  <text x="506" y="207" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="700" fill="#936300">算 Op1</text>
  <rect x="586" y="191" width="68" height="22" rx="4" fill="#fff4cf" stroke="#c78300" stroke-width="1.3" />
  <text x="620" y="207" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="700" fill="#936300">算 Op2</text>
  <text x="668" y="207" font-family="system-ui, -apple-system, sans-serif" font-size="12.5" fill="#3a4f93">← 主线程与 ACL 解耦重叠</text>

  <!-- Mode 2 Swimlane (y=226..316) -->
  <rect x="16" y="226" width="224" height="90" rx="8" fill="#ddf4ef" stroke="#087f73" stroke-width="1.8" />
  <text x="128" y="251" text-anchor="middle" font-family="var(--font-mono)" font-size="13" font-weight="700" fill="#065f56">TASK_QUEUE_ENABLE=2</text>
  <text x="128" y="273" text-anchor="middle" font-family="var(--font-sans)" font-size="12.5" font-weight="700" fill="#17211f">二级均衡 + 唤醒优化流水</text>
  <text x="128" y="293" text-anchor="middle" font-family="var(--font-sans)" font-size="12" font-weight="700" fill="#8f3229">抬高显存峰值 · 固定 main 禁捕获</text>
  <text x="128" y="309" text-anchor="middle" font-family="var(--font-sans)" font-size="12" fill="#4d5652">（捕获时须回 1 或 0）</text>

  <text x="248" y="246" font-family="var(--font-sans)" font-size="12" font-weight="700" fill="#065f56">两级流水</text>
  <rect x="314" y="231" width="248" height="22" rx="4" fill="#ddf4ef" stroke="#087f73" stroke-width="1.2" />
  <text x="438" y="247" text-anchor="middle" font-family="var(--font-sans)" font-size="12" font-weight="700" fill="#065f56">两级负载均衡与唤醒优化连续预填队列</text>

  <text x="248" y="274" font-family="var(--font-sans)" font-size="12" font-weight="700" fill="#936300">AI Core</text>
  <rect x="380" y="259" width="68" height="22" rx="4" fill="#fff4cf" stroke="#c78300" stroke-width="1.3" />
  <text x="414" y="275" text-anchor="middle" font-family="var(--font-sans)" font-size="12" font-weight="700" fill="#936300">算 Op1</text>
  <rect x="450" y="259" width="68" height="22" rx="4" fill="#fff4cf" stroke="#c78300" stroke-width="1.3" />
  <text x="484" y="275" text-anchor="middle" font-family="var(--font-sans)" font-size="12" font-weight="700" fill="#936300">算 Op2</text>
  <rect x="520" y="259" width="68" height="22" rx="4" fill="#fff4cf" stroke="#c78300" stroke-width="1.3" />
  <text x="554" y="275" text-anchor="middle" font-family="var(--font-sans)" font-size="12" font-weight="700" fill="#936300">算 Op3</text>
  <text x="602" y="275" font-family="var(--font-sans)" font-size="12.5" font-weight="700" fill="#065f56">← 紧贴背靠背执行（掩盖 Host 耗时）</text>

  <rect x="314" y="288" width="566" height="24" rx="4" fill="#fff0e9" stroke="#b54237" stroke-width="1.1" />
  <text x="597" y="305" text-anchor="middle" font-family="var(--font-sans)" font-size="12" fill="#8f3229">代价：超前入队抬高在途激活峰值；固定 main 开启 NPU 图捕获遇 =2 直接抛 RuntimeError</text>

  <!-- Section Divider -->
  <line x1="20" y1="334" x2="880" y2="334" stroke="#d8d8cf" stroke-width="1.5" />

  <!-- ================= BAND 2: Cross-Stream Memory Reuse & HCCL Dispatch ================= -->
  <text x="20" y="360" font-family="system-ui, -apple-system, sans-serif" font-size="16" font-weight="700" fill="#17211f">2. 跨流显存提前复用（PYTORCH_NPU_ALLOC_CONF）与 HCCL 算子展开选路</text>

  <!-- Left Panel: expandable_segments vs max_split_size_mb (x=20..442, w=422) -->
  <rect x="20" y="378" width="422" height="166" rx="9" fill="#e8edff" stroke="#4c65b6" stroke-width="1.5" />
  <text x="231" y="402" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, monospace" font-size="13.5" font-weight="700" fill="#3a4f93">expandable_segments:True（非睡眠默认）</text>
  <rect x="34" y="414" width="394" height="58" rx="6" fill="#ffffff" stroke="#4c65b6" stroke-width="1.1" />
  <text x="231" y="435" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="12.5" font-weight="700" fill="#17211f">可扩展虚拟地址段 + 通信流显存提前释放</text>
  <text x="231" y="456" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="12" fill="#66716d">不必等通信流整链依赖全结清，计算流即可提前复用空闲段</text>

  <rect x="28" y="482" width="406" height="50" rx="6" fill="#fff0e9" stroke="#b54237" stroke-width="1.1" />
  <text x="231" y="502" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, monospace" font-size="12" font-weight="700" fill="#8f3229">互斥：max_split_size_mb / garbage_collection_threshold</text>
  <text x="231" y="520" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="12" fill="#66716d">开启 RL sleep_mode 时 _disable_expandable_segments 自动剥离</text>

  <!-- Right Panel: HCCL_OP_EXPANSION_MODE & Device Stack (x=458..880, w=422) -->
  <rect x="458" y="378" width="422" height="166" rx="9" fill="#f7e7f2" stroke="#9a4b86" stroke-width="1.5" />
  <text x="669" y="402" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, monospace" font-size="13.5" font-weight="700" fill="#7a3a6a">HCCL_OP_EXPANSION_MODE 通信展开三态</text>

  <rect x="472" y="414" width="124" height="64" rx="6" fill="#ffffff" stroke="#66716d" stroke-width="1.1" />
  <text x="534" y="436" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, monospace" font-size="12.5" font-weight="700" fill="#17211f">默认 AICPU</text>
  <text x="534" y="455" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="12" fill="#66716d">A3 混部 / P 侧</text>
  <text x="534" y="471" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="12" fill="#66716d">大包稳态调度</text>

  <rect x="607" y="414" width="124" height="64" rx="6" fill="#ddf4ef" stroke="#087f73" stroke-width="1.3" />
  <text x="669" y="436" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, monospace" font-size="12.5" font-weight="700" fill="#065f56">AIV 模式</text>
  <text x="669" y="455" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="12" fill="#065f56">Vector 直驱 RoCE</text>
  <text x="669" y="471" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="12" fill="#66716d">契合 Decode 图</text>

  <rect x="742" y="414" width="124" height="64" rx="6" fill="#fff4cf" stroke="#c78300" stroke-width="1.2" />
  <text x="804" y="436" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, monospace" font-size="12.5" font-weight="700" fill="#936300">CCU_SCHED</text>
  <text x="804" y="455" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="12" fill="#936300">950DT 分离 P/D</text>
  <text x="804" y="471" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, monospace" font-size="12" fill="#66716d">comm_mode=ccu</text>

  <rect x="466" y="486" width="406" height="46" rx="6" fill="#ffffff" stroke="#9a4b86" stroke-width="1.1" />
  <text x="669" y="505" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, monospace" font-size="12" font-weight="700" fill="#7a3a6a">/dev/davinci* · davinci_manager · devmm_svm · hisi_hdc</text>
  <text x="669" y="523" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="12" fill="#66716d">计算核 · 设备管理 · 共享虚拟内存 · Host-Device 通道四件套</text>
</svg>
