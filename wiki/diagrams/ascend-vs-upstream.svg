<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 510" width="900" height="510" role="img" aria-label="vLLM 引擎组织每步调度和执行；Ascend 也可调整调度配置或实现。计划由 Ascend Worker、Runner 和 GLM 模型在 NPU 上执行；左侧表示启动时登记、选择和替换的主要入口">
