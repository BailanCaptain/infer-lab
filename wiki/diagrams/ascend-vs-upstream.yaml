layout: figure
id: ascend-vs-upstream
caption: 上游 vLLM 决定每一步算什么；计划越过平台边界后，由 vllm-ascend 的 Worker、Runner 和 GLM 模型在 NPU 上执行。左侧的插件入口、平台、配置、patch 和模型注册在启动时就把这条路径定好
