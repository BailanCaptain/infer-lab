<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 648" width="880" height="648" role="img" aria-label="PP=1 的普通生成路径示意。左侧采用固定旧版 EngineCore 的批次循环与异步占位协议：① 排计划，② 给会产出 token 的请求记占位，③ 提交。队列未满且还有计算或待排请求时继续排，否则先收最老结果；结构化输出若需要前批 token，另有延后采样分支。右侧 NPUModelRunner 在主机 token 表写 −1，设备上补真值与候选。投机解码先用乐观长度准备，再用设备有效数修正；需要 CPU 长度的后端另等拷贝事件后修正。采样值一路留卡，一路异步拷回主机。FULL 回放的当前流同步还有 ENPU、EAGLE 草稿例外，不由异步开关单独决定。站号对应请求的七站。">
  <title>PP=1 的普通生成路径示意。左侧采用固定旧版 EngineCore 的批次循环与异步占位协议：① 排计划，② 给会产出 token 的请求记占位，③ 提交。队列未满且还有计算或待排请求时继续排，否则先收最老结果；结构化输出若需要前批 token，另有延后采样分支。右侧 NPUModelRunner 在主机 token 表写 −1，设备上补真值与候选。投机解码先用乐观长度准备，再用设备有效数修正；需要 CPU 长度的后端另等拷贝事件后修正。采样值一路留卡，一路异步拷回主机。FULL 回放的当前流同步还有 ENPU、EAGLE 草稿例外，不由异步开关单独决定。站号对应请求的七站。</title>
  <defs><marker id="async-scheduling-flow-ah-ink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="var(--color-ink, #17211f)"/></marker></defs>
  <path d="M224 102 L224 126" fill="none" stroke="var(--color-ink, #17211f)" stroke-width="1.4" marker-end="url(#async-scheduling-flow-ah-ink)"/>
