layout: figure
id: async-scheduling-flow
caption: 开着 async scheduling 时，一圈里两个进程各做什么。左边 EngineCore 进程跑的是上游代码：排第 k+1 步时，还没回来的 token 用占位顶上（①），排完当场记账（②），提交后只要批次队列没满就不等结果、回到 ① 再排；满了才等最老的第 k 步，按结果销账（⑤），把新 token 发回前端（⑥）。右边 Worker 进程由昇腾的 NPUModelRunner 实现：主机侧 token 表只写 −1，真值和候选留在卡上，准备输入时在卡上抄进去（⑦）；带投机解码时先按候选全被接受排位置，再按上一步拷回的有效数改正；算完的采样值一份留在卡上给下一步，一份由单独的拷贝流拷回主机，一圈之后由 ④ 收下。图中站号对应一条请求走过的七站。
size: [880, 648]
texts:
  - { at: [24, 24], text: EngineCore 进程（上游代码）, strong: true }
  - { at: [472, 24], text: Worker 进程（昇腾 NPUModelRunner）, strong: true }
  - { at: [30, 281], text: 没满：不等结果，回到 ①, size: 12.5, note: true }
  - { at: [232, 367], text: 满了, size: 12.5 }
  - { at: [434, 230], text: 提交, size: 12.5 }
  - { at: [452, 632], text: 这一步的结果，下一圈由 ④ 收下, size: 12.5, note: true }
items:
  - { at: [24, 40], size: [400, 62], text: ① 第 2 站 · 排第 k+1 步, sub: 还差 = 已知 + 候选占位 + 输出占位 − 已算, tone: control }
  - { at: [24, 126], size: [400, 62], text: ② 当场记账, sub: 已算加上本步位置，输出占位加 1 + 候选数, tone: control }
  - { at: [24, 212], size: [400, 52], text: ③ 提交给 Worker，回执入队, tone: control }
  - { at: [24, 288], size: [400, 62], text: 批次队列满了吗？, sub: 最多 2 批在途, style: plain }
  - { at: [24, 374], size: [400, 52], text: ④ 等最老一批（第 k 步）的结果, tone: token }
  - { at: [24, 450], size: [400, 72], text: ⑤ 第 6 站 · 按结果销账, sub: 被拒的：已算和占位各减；收到的：占位再减, tone: token }
  - { at: [24, 546], size: [400, 52], text: ⑥ 第 7 站 · 新 token 发回前端, tone: token }
  - { at: [472, 212], size: [392, 72], text: ⑦ 接 ③ · 第 3 站 · 准备第 k+1 步输入, sub: 主机侧写 −1，卡上抄入采样值与候选, tone: weight }
  - { at: [472, 308], size: [392, 62], text: 带投机解码：先按全接受排位置, sub: 再用上一步拷回的有效数改正, style: plain }
  - { at: [472, 394], size: [392, 62], text: ⑧ 第 4–5 站 · 前向、采样、草拟, sub: FULL 图回放前先等上一步做完, tone: weight }
  - { at: [472, 480], size: [188, 72], text: 采样值留在卡上, sub: 下一步 ⑦ 直接用, tone: kv }
  - { at: [676, 480], size: [188, 72], text: 拷贝流拷回主机, sub: 带完成事件交回, tone: comm }
