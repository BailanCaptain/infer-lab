<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 622" width="900" height="622" role="img" aria-label="第 N 步还在 NPU 上算，第 N+1 步已经在 CPU 上排好了；能这样排，靠的是调度器先给「会产出但还没产出」的 token 记一个占位">
  <title>第 N 步还在 NPU 上算，第 N+1 步已经在 CPU 上排好了；能这样排，靠的是调度器先给「会产出但还没产出」的 token 记一个占位</title>
