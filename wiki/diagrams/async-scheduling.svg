  <text x="38" y="375" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="12.5" font-weight="400" fill="var(--color-ink-muted, #5b6763)">采样出的 token id 不回 CPU：占位符让调度器接着排，真值留在设备上等下一步自己取。</text>
