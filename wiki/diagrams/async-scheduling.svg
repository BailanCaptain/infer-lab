  <rect x="20" y="26" width="860" height="252" rx="12" fill="var(--color-surface-sunken, #ece9df)"/>
  <rect x="36" y="40" width="231" height="26.5" rx="13.3" fill="var(--color-control, #5b6763)"/><text x="47" y="58.1" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="13.5" font-weight="700" fill="var(--color-ink-inverse, #ffffff)">EngineCore 进程（上游 vLLM）</text>
  <text x="38" y="83" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="12.5" font-weight="400" fill="var(--color-ink-muted, #5b6763)">step_with_batch_queue 排完一批就直接返回，不去取结果；队列没满、还有请求可排，就接着排下一批。</text>
  <rect x="20" y="318" width="860" height="250" rx="12" fill="var(--color-weight-soft, #fff4cf)"/>
