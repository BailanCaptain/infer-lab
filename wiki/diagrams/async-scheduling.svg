  <text x="24" y="588" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="12.5" font-weight="600" fill="var(--color-ink, #17211f)">同步调度下 NPU 每算完一步都要停下来等：等 CPU 把结果收回去、更新状态、算出下一步的名额、再把 SchedulerOutput 送过进程边界。异步把这一</text>
  <text x="24" y="606.5" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="12.5" font-weight="600" fill="var(--color-ink, #17211f)">段压到上一步的 forward 底下——那条请求的 200 圈，每圈省下的都是它。</text>
