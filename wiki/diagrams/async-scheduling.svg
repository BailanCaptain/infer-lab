<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 430" width="900" height="430" role="img" aria-label="同一条请求连走 3 步的示意时间轴，CPU 上的一段活记 1 格，NPU 算一步记 3 格。上：同步时，NPU 每算完一步都要等 CPU 收完结果、排好下一步（斜线格），3 步共 13 格。下：开了 async scheduling，NPU 在算第 1 步时 CPU 已经把第 2 步排好，此后收结果和排下一步都落在 NPU 计算的时间里，3 步共 11 格。两条时间轴右上角写着 NPU 在其中忙了几格。计算本身仍是一步接一步，提前的只是 CPU 上的调度；格数是示意，不是实测。">
  <title>同一条请求连走 3 步的示意时间轴，CPU 上的一段活记 1 格，NPU 算一步记 3 格。上：同步时，NPU 每算完一步都要等 CPU 收完结果、排好下一步（斜线格），3 步共 13 格。下：开了 async scheduling，NPU 在算第 1 步时 CPU 已经把第 2 步排好，此后收结果和排下一步都落在 NPU 计算的时间里，3 步共 11 格。两条时间轴右上角写着 NPU 在其中忙了几格。计算本身仍是一步接一步，提前的只是 CPU 上的调度；格数是示意，不是实测。</title>
