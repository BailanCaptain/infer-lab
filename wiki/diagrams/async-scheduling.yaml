  - at: [694, 424]
    cells: 1
    cell: 26
    h: 26
    highlight: 0
    tone: accent
    label: 第 38 格写的是 -1

brackets:
  - { at: [350, 100], span: 445, dir: down, label: 这一段里第 N 步一直在 NPU 上跑, tone: accent }
  - { at: [694, 416], span: 26, dir: up, label: num_output_placeholders 从 0 变成 1, tone: accent }

boxes:
  - at: [36, 502]
    size: [268, 58]
    title: 真 id 留在 NPU 上
    fn: prev_sampled_token_ids
    tone: ascend
    icon: chip
  - at: [318, 502]
    size: [268, 58]
    title: 下一步在设备上换回来
    sub: -1 那格被覆盖成真 id
    fn: _prepare_input_ids
    tone: ascend
    icon: grid
  - at: [600, 502]
    size: [264, 58]
    title: 结果晚一圈才回 CPU
    sub: 在异步拷贝流上做 D2H
    fn: AsyncGPUModelRunnerOutput
    tone: ascend
    icon: bolt

notes:
  - at: [24, 588]
    text: 同步调度下 NPU 每算完一步都要停下来等：等 CPU 把结果收回去、更新状态、算出下一步的名额、再把 SchedulerOutput 送过进程边界。异步把这一段压到上一步的 forward 底下——那条请求的 200 圈，每圈省下的都是它。
    size: 12.5
    width: 852
    strong: true

