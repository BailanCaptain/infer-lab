<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 460" width="900" height="460" role="img" aria-label="同构标准模型（Qwen3-8B 全 36 层 GQA）与异构混合模型的注意力后端分派对比：Qwen3-8B 全模型统一走 AscendAttentionBackend、每步只建 1 份 AscendMetadata，再按批次形态调用 FIA 或 PA 算子；异构混合模型才需按层拆分多类后端与额外状态缓存。">
  <title>同构标准模型（Qwen3-8B 全 36 层 GQA）与异构混合模型的注意力后端分派对比：Qwen3-8B 全模型统一走 AscendAttentionBackend、每步只建 1 份 AscendMetadata，再按批次形态调用 FIA 或 PA 算子；异构混合模型才需按层拆分多类后端与额外状态缓存。</title>
  <defs><marker id="attention-backend-choice-qwen3-ah-weight" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="var(--color-weight, #c78300)"/></marker><marker id="attention-backend-choice-qwen3-ah-control" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="var(--color-control, #66716d)"/></marker><marker id="attention-backend-choice-qwen3-ah-kv" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="var(--color-kv, #4c65b6)"/></marker><marker id="attention-backend-choice-qwen3-ah-ink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="var(--color-ink, #17211f)"/></marker></defs>
  <rect x="18" y="52" width="864" height="198" rx="16" fill="none" stroke="var(--color-line-strong, #b8bcb5)" stroke-width="1.5"/>
  <text x="34" y="40" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="15" font-weight="700" fill="var(--color-ink, #17211f)">1. 同构标准路径（Qwen3-8B：全 36 层 32Q:8KV GQA，d_h = 128）</text>
  <rect x="18" y="284" width="864" height="146" rx="16" fill="none" stroke="var(--color-line-strong, #b8bcb5)" stroke-width="1.5"/>
  <text x="34" y="272" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="15" font-weight="700" fill="var(--color-ink, #17211f)">2. 对比：异构混合模型（如线性注意力 + 稀疏 MLA 交替层）</text>
  <path d="M212 134 L242 134" fill="none" stroke="var(--color-weight, #c78300)" stroke-width="1.4" marker-end="url(#attention-backend-choice-qwen3-ah-weight)"/>
  <path d="M446 134 L476 134" fill="none" stroke="var(--color-control, #66716d)" stroke-width="1.4" marker-end="url(#attention-backend-choice-qwen3-ah-control)"/>
  <path d="M652 120 L667 120 L667 101 L682 101" fill="none" stroke="var(--color-kv, #4c65b6)" stroke-width="1.4" marker-end="url(#attention-backend-choice-qwen3-ah-kv)"/>
  <path d="M652 148 L667 148 L667 171 L682 171" fill="none" stroke="var(--color-kv, #4c65b6)" stroke-width="1.4" marker-end="url(#attention-backend-choice-qwen3-ah-kv)"/>
  <path d="M256 360 L306 360" fill="none" stroke="var(--color-ink, #17211f)" stroke-width="1.4" stroke-dasharray="7 5" marker-end="url(#attention-backend-choice-qwen3-ah-ink)"/>
  <path d="M556 360 L606 360" fill="none" stroke="var(--color-ink, #17211f)" stroke-width="1.4" stroke-dasharray="7 5" marker-end="url(#attention-backend-choice-qwen3-ah-ink)"/>
  <rect x="57" y="77" width="176" height="72" rx="8" fill="var(--color-weight-soft, #fff4cf)" stroke="var(--color-weight, #c78300)" stroke-width="1.4"/>
  <rect x="50" y="84" width="176" height="72" rx="8" fill="var(--color-weight-soft, #fff4cf)" stroke="var(--color-weight, #c78300)" stroke-width="1.4"/>
  <rect x="43" y="91" width="176" height="72" rx="8" fill="var(--color-weight-soft, #fff4cf)" stroke="var(--color-weight, #c78300)" stroke-width="1.4"/>
  <rect x="36" y="98" width="176" height="72" rx="8" fill="var(--color-weight-soft, #fff4cf)" stroke="var(--color-weight, #c78300)" stroke-width="1.4"/>
  <text x="124" y="130" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="14" font-weight="700" fill="var(--color-ink, #17211f)" text-anchor="middle">全部 36 层 GQA</text>
  <text x="124" y="149" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="13" font-weight="400" fill="#936300" text-anchor="middle">层间头数与块长全同</text>
  <rect x="242" y="98" width="204" height="72" rx="8" fill="var(--color-control-soft, #f1efe8)" stroke="var(--color-control, #66716d)" stroke-width="1.4"/>
  <text x="344" y="130" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="14" font-weight="700" fill="var(--color-ink, #17211f)" text-anchor="middle">统一选定同一后端</text>
  <text x="344" y="149" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="13" font-weight="400" fill="var(--color-ink-muted, #66716d)" text-anchor="middle">AscendAttentionBackend</text>
  <rect x="476" y="98" width="176" height="72" rx="8" fill="var(--color-kv-soft, #e8edff)" stroke="var(--color-kv, #4c65b6)" stroke-width="1.4"/>
  <text x="564" y="130" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="14" font-weight="700" fill="var(--color-ink, #17211f)" text-anchor="middle">共用 1 份元数据</text>
  <text x="564" y="149" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="13" font-weight="400" fill="#3a4f93" text-anchor="middle">AscendMetadata 单块表</text>
  <rect x="682" y="74" width="182" height="54" rx="8" fill="var(--color-token-soft, #ddf4ef)" stroke="var(--color-token, #087f73)" stroke-width="1.4"/>
  <text x="773" y="97" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="14" font-weight="700" fill="var(--color-ink, #17211f)" text-anchor="middle">Prefill / 混合批：FIA</text>
  <text x="773" y="116" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="13" font-weight="400" fill="#065f56" text-anchor="middle">变长因果注意力核函数</text>
  <rect x="682" y="144" width="182" height="54" rx="8" fill="var(--color-token-soft, #ddf4ef)" stroke="var(--color-token, #087f73)" stroke-width="1.4"/>
  <text x="773" y="167" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="14" font-weight="700" fill="var(--color-ink, #17211f)" text-anchor="middle">纯 Decode 批：PA / FIA</text>
  <text x="773" y="186" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="13" font-weight="400" fill="#065f56" text-anchor="middle">按块表直读历史键值</text>
  <rect x="36" y="326" width="220" height="68" rx="8" fill="var(--color-surface, #fbfaf6)" stroke="var(--color-control, #66716d)" stroke-opacity="0.45" stroke-width="1.3" stroke-dasharray="5 4"/>
  <text x="146" y="356" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="13" font-weight="400" fill="#4d5652" text-anchor="middle">不同层挂不同注意力类</text>
  <text x="146" y="375" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="13" font-weight="400" fill="#4d5652" text-anchor="middle">线性递推层 vs 稀疏 MLA 层</text>
  <rect x="306" y="326" width="250" height="68" rx="8" fill="var(--color-surface, #fbfaf6)" stroke="var(--color-kv, #4c65b6)" stroke-opacity="0.45" stroke-width="1.3" stroke-dasharray="5 4"/>
  <text x="431" y="356" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="13" font-weight="400" fill="#3a4f93" text-anchor="middle">每步分别构建多份元数据</text>
  <text x="431" y="375" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="13" font-weight="400" fill="#3a4f93" text-anchor="middle">递推状态索引 + 分页块表 + 选块索引</text>
  <rect x="606" y="326" width="258" height="68" rx="8" fill="var(--color-surface, #fbfaf6)" stroke="var(--color-comm, #9a4b86)" stroke-opacity="0.45" stroke-width="1.3" stroke-dasharray="5 4"/>
  <text x="735" y="356" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="13" font-weight="400" fill="#7a3a6a" text-anchor="middle">逐层切到各自专用设备算子</text>
  <text x="735" y="375" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="13" font-weight="400" fill="#7a3a6a" text-anchor="middle">额外维护索引器缓存或卷积状态池</text>
  <text x="450" y="22" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="13.5" font-weight="700" fill="var(--color-ink, #17211f)" text-anchor="middle">注意力后端选择：Qwen3-8B 全层统一后端 vs 异构模型逐层分流</text>
  <text x="36" y="226" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="13.5" font-weight="400" fill="var(--color-ink-muted, #66716d)" font-style="italic">同构模型 36 层共享同一套 slot_mapping 与 block_table，0 份额外状态池</text>
</svg>
