<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 474" width="900" height="474" role="img" aria-label="选后端是三道闸，最后一道查的是三元组——不是二元组">
  <title>选后端是三道闸，最后一道查的是三元组——不是二元组</title>
  <rect width="900" height="474" fill="var(--color-surface, #fbfaf6)"/>
  <rect x="20" y="48" width="860" height="62" rx="10" fill="var(--color-canvas, #f5f2ea)"/>
  <rect x="20" y="48" width="5" height="62" rx="2.5" fill="var(--color-ink-faint, #8a928f)"/>
  <g transform="translate(43.8 68.8) scale(0.85)" fill="none" stroke="var(--color-ink-faint, #8a928f)" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M11 4a7 7 0 1 0 0 14 7 7 0 0 0 0-14z M16 16l5 5"/></g>
  <text x="78" y="76" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="15" font-weight="700" fill="var(--color-ink, #17211f)">闸一 · 显式选了 FLASH_ATTN</text>
  <text x="78" y="96" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="12.5" font-weight="400" fill="var(--color-ink-muted, #5b6763)">还要过 _validate_fa3_backend 校验；过了直接返回 AscendFABackend</text>
  <rect x="20" y="120" width="860" height="62" rx="10" fill="var(--color-canvas, #f5f2ea)"/>
  <rect x="20" y="120" width="5" height="62" rx="2.5" fill="var(--color-ink-faint, #8a928f)"/>
  <g transform="translate(43.8 140.8) scale(0.85)" fill="none" stroke="var(--color-ink-faint, #8a928f)" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M11 4a7 7 0 1 0 0 14 7 7 0 0 0 0-14z M16 16l5 5"/></g>
  <text x="78" y="148" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="15" font-weight="700" fill="var(--color-ink, #17211f)">闸二 · is_310p()</text>
  <text x="78" y="168" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="12.5" font-weight="400" fill="var(--color-ink-muted, #5b6763)">走另一张表 backend_map_310；查不到会回落到 (False, False) 那一项</text>
  <rect x="20" y="192" width="860" height="62" rx="10" fill="var(--color-accent-soft, #fff0e9)"/>
  <rect x="20" y="192" width="5" height="62" rx="2.5" fill="var(--color-accent, #e85b32)"/>
  <g transform="translate(43.8 212.8) scale(0.85)" fill="none" stroke="var(--color-accent, #e85b32)" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3l8 5v8l-8 5-8-5V8z M12 3v18"/></g>
  <text x="78" y="220" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="15" font-weight="700" fill="var(--color-ink, #17211f)">闸三 · 查主表 backend_map[(use_mla, use_sparse, use_compress)]</text>
  <text x="78" y="240" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="12.5" font-weight="400" fill="var(--color-ink-muted, #5b6763)">直接下标访问，不合法的组合直接 KeyError，不会回落</text>
  <rect x="20" y="394" width="206" height="20" rx="3" fill="var(--color-kv, #4c65b6)" stroke="var(--color-kv, #4c65b6)" stroke-width="1.1"/>
  <rect x="238" y="394" width="206" height="20" rx="3" fill="var(--color-canvas, #f5f2ea)" stroke="var(--color-ink-faint, #8a928f)" stroke-width="1.1"/>
  <rect x="456" y="394" width="206" height="20" rx="3" fill="var(--color-canvas, #f5f2ea)" stroke="var(--color-ink-faint, #8a928f)" stroke-width="1.1"/>
  <rect x="674" y="394" width="206" height="20" rx="3" fill="var(--color-canvas, #f5f2ea)" stroke="var(--color-ink-faint, #8a928f)" stroke-width="1.1"/>
  <rect x="20" y="292" width="206" height="76" rx="11" fill="var(--color-surface, #fbfaf6)" stroke="var(--color-weight, #b87a00)" stroke-width="1.5"/>
  <text x="36" y="318" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="14.5" font-weight="700" fill="var(--color-ink, #17211f)">AscendAttentionBackend</text>
  <text x="36" y="336" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="12.5" font-weight="400" fill="var(--color-ink-muted, #5b6763)">(False, False, False)</text>
  <text x="36" y="353" font-family="'JetBrains Mono',ui-monospace,monospace" font-size="12.5" font-weight="400" fill="var(--color-weight, #b87a00)">普通 MHA / GQA</text>
  <rect x="238" y="292" width="206" height="76" rx="11" fill="var(--color-surface, #fbfaf6)" stroke="var(--color-weight, #b87a00)" stroke-width="1.5"/>
  <text x="254" y="318" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="14.5" font-weight="700" fill="var(--color-ink, #17211f)">AscendMLABackend</text>
  <text x="254" y="336" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="12.5" font-weight="400" fill="var(--color-ink-muted, #5b6763)">(True, False, False)</text>
  <text x="254" y="353" font-family="'JetBrains Mono',ui-monospace,monospace" font-size="12.5" font-weight="400" fill="var(--color-weight, #b87a00)">MLA 模型</text>
  <rect x="456" y="292" width="206" height="76" rx="11" fill="var(--color-surface, #fbfaf6)" stroke="var(--color-weight, #b87a00)" stroke-width="1.5"/>
  <text x="472" y="318" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="14.5" font-weight="700" fill="var(--color-ink, #17211f)">AscendSFABackend</text>
  <text x="472" y="336" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="12.5" font-weight="400" fill="var(--color-ink-muted, #5b6763)">(True, True, False)</text>
  <text x="472" y="353" font-family="'JetBrains Mono',ui-monospace,monospace" font-size="12.5" font-weight="400" fill="var(--color-weight, #b87a00)">稀疏 MLA</text>
  <rect x="674" y="292" width="206" height="76" rx="11" fill="var(--color-surface, #fbfaf6)" stroke="var(--color-weight, #b87a00)" stroke-width="1.5"/>
  <text x="690" y="318" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="14.5" font-weight="700" fill="var(--color-ink, #17211f)">AscendDSABackend</text>
  <text x="690" y="336" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="12.5" font-weight="400" fill="var(--color-ink-muted, #5b6763)">(True, False, True)</text>
  <text x="690" y="353" font-family="'JetBrains Mono',ui-monospace,monospace" font-size="12.5" font-weight="400" fill="var(--color-weight, #b87a00)">DSA</text>
  <text x="20" y="282" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="13" font-weight="600" fill="var(--color-ink, #17211f)">主表只有这四项</text>
  <text x="20" y="388" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="12.5" font-weight="400" fill="var(--color-ink-muted, #5b6763)" text-anchor="start">KV 形状</text>
  <text x="24" y="432" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="12" font-weight="400" fill="var(--color-ink-muted, #5b6763)">五维，最前面那个 2 是 K 和 V</text>
  <text x="242" y="432" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="12" font-weight="400" fill="var(--color-ink-muted, #5b6763)">四维，没有独立的 K/V</text>
  <text x="460" y="432" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="12" font-weight="400" fill="var(--color-ink-muted, #5b6763)">四维</text>
  <text x="678" y="432" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="12" font-weight="400" fill="var(--color-ink-muted, #5b6763)">四维 + 单独一块 scale</text>
  <text x="20" y="462" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="12.5" font-weight="400" fill="var(--color-ink-muted, #5b6763)">那条请求走的是最左边一条：Qwen3-0.6B 是 GQA，三个布尔量都是 False。算显存时它那个 2 必须乘上，MLA 那三条不能乘——一个公式套不了所有后端。</text>
</svg>
