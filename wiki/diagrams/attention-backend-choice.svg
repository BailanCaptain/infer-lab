<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 490" width="900" height="490" role="img" aria-label="注意力后端按层分流：标准同构单路与混合模型多状态分流" font-family="var(--font-sans)">
  <title>层的类型决定它交给哪个后端与哪份状态：同构单路 vs 混合模型双主路加附属缓存</title>
  <desc>State and operator dispatch diagram comparing homogeneous Qwen3-8B (36 GQA layers sharing AscendAttentionBackend) against heterogeneous GLM (34 KDA recurrent layers vs 11+1 sparse MLA layers plus 2 cache-only entries per MLA layer)</desc>
  <defs>
    <marker id="abc-arr-ink" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="#4d5652"/>
    </marker>
    <marker id="abc-arr-teal" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="#087f73"/>
    </marker>
    <marker id="abc-arr-plum" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="#9a4b86"/>
    </marker>
  </defs>

  <text x="20" y="28" font-size="15.5" font-weight="700" fill="#17211f">一个 token 每过一层先看注意力类型：同构单路 vs 混合模型双主路分流</text>

  <!-- TOP BASELINE BAR: Qwen3-8B Homogeneous GQA -->
  <rect x="16" y="44" width="868" height="74" rx="8" fill="#e5f4f1" fill-opacity="0.35" stroke="#087f73" stroke-width="1.4"/>
  <rect x="28" y="56" width="204" height="50" rx="6" fill="#087f73"/>
  <text x="130" y="77" text-anchor="middle" font-size="12.5" font-weight="700" fill="#ffffff">标准同构基线（Qwen3-8B）</text>
  <text x="130" y="97" text-anchor="middle" font-size="12" fill="#e5f4f1">全 36 层均为标准 GQA</text>

  <line x1="232" y1="81" x2="256" y2="81" stroke="#087f73" stroke-width="1.7" marker-end="url(#abc-arr-teal)"/>

  <rect x="260" y="56" width="280" height="50" rx="6" fill="#ffffff" stroke="#087f73" stroke-width="1.3"/>
  <text x="400" y="77" text-anchor="middle" font-size="12.5" font-weight="700" fill="#065f56">统一绑 AscendAttentionBackend</text>
  <text x="400" y="97" text-anchor="middle" font-size="12" fill="#4d5652">全模型共用 1 份 AscendMetadata</text>

  <line x1="540" y1="81" x2="564" y2="81" stroke="#087f73" stroke-width="1.7" marker-end="url(#abc-arr-teal)"/>

  <rect x="568" y="56" width="304" height="50" rx="6" fill="#ffffff" stroke="#3a4f93" stroke-width="1.3"/>
  <text x="720" y="77" text-anchor="middle" font-size="12.5" font-weight="700" fill="#2d3e75">单一分页 K/V 缓存组 · 块表寻址</text>
  <text x="720" y="97" text-anchor="middle" font-size="12" fill="#4d5652">昇腾融合注意力算子（FIA / Paged）</text>

  <!-- MAIN HETEROGENEOUS SECTION: GLM -->
  <rect x="16" y="132" width="868" height="342" rx="8" fill="#faf8f4" fill-opacity="0.7" stroke="#b8bcb5" stroke-width="1.3" stroke-dasharray="6 3"/>
  <text x="30" y="156" font-size="13.5" font-weight="700" fill="#17211f">异构混合实战（GLM 45 主干层 + MTP 第 45 层，每 4 层为 3 层 KDA + 1 层稀疏 MLA）</text>

  <!-- Layer Entry Card -->
  <rect x="28" y="218" width="152" height="132" rx="7" fill="#fff0e9" stroke="#b54237" stroke-width="1.5"/>
  <text x="104" y="246" text-anchor="middle" font-size="13.5" font-weight="700" fill="#8f3229">第 n 层前向入口</text>
  <!-- 4-layer cadence visual strip -->
  <rect x="44" y="260" width="26" height="16" rx="3" fill="#9a4b86"/>
  <rect x="74" y="260" width="26" height="16" rx="3" fill="#9a4b86"/>
  <rect x="104" y="260" width="26" height="16" rx="3" fill="#9a4b86"/>
  <rect x="134" y="260" width="30" height="16" rx="3" fill="#087f73"/>
  <text x="104" y="300" text-anchor="middle" font-size="12" fill="#4d5652">查本层声明类型</text>
  <text x="104" y="322" text-anchor="middle" font-size="12" fill="#4d5652">分派状态与算子</text>

  <!-- Fan branches -->
  <path d="M 180 262 L 198 262 L 198 210 L 214 210" fill="none" stroke="#9a4b86" stroke-width="1.7" marker-end="url(#abc-arr-plum)"/>
  <path d="M 180 306 L 198 306 L 198 314 L 214 314" fill="none" stroke="#087f73" stroke-width="1.7" marker-end="url(#abc-arr-teal)"/>

  <!-- LANE A: KDA Linear Attention -->
  <rect x="218" y="172" width="184" height="76" rx="6" fill="#f7e7f2" stroke="#9a4b86" stroke-width="1.4"/>
  <text x="310" y="197" text-anchor="middle" font-size="13" font-weight="700" fill="#7a3a6a">KDA 线性注意力层</text>
  <text x="310" y="218" text-anchor="middle" font-size="12" fill="#4d5652">主干共 34 层</text>
  <text x="310" y="238" text-anchor="middle" font-size="12" fill="#7a3a6a">层构造时直接绑定</text>

  <line x1="402" y1="210" x2="426" y2="210" stroke="#4d5652" stroke-width="1.7" marker-end="url(#abc-arr-ink)"/>

  <rect x="430" y="172" width="218" height="76" rx="6" fill="#ebeef9" stroke="#3a4f93" stroke-width="1.3"/>
  <text x="539" y="197" text-anchor="middle" font-size="12.5" font-weight="700" fill="#2d3e75">GDN 线性注意力后端</text>
  <text x="539" y="218" text-anchor="middle" font-size="12" fill="#4d5652">定长递推状态 + 短卷积窗</text>
  <text x="539" y="238" text-anchor="middle" font-size="12" fill="#4d5652">单层状态不随序列变长</text>

  <line x1="648" y1="210" x2="672" y2="210" stroke="#4d5652" stroke-width="1.7" marker-end="url(#abc-arr-ink)"/>

  <rect x="676" y="172" width="196" height="76" rx="6" fill="#fff4cf" stroke="#c78300" stroke-width="1.3"/>
  <text x="774" y="197" text-anchor="middle" font-size="13" font-weight="700" fill="#936300">KDA 设备算子</text>
  <text x="774" y="218" text-anchor="middle" font-size="12" fill="#4d5652">融合门控与状态递推</text>
  <text x="774" y="238" text-anchor="middle" font-size="12" fill="#4d5652">顺着定长状态逐步更新</text>

  <!-- LANE B: Sparse MLA -->
  <rect x="218" y="276" width="184" height="76" rx="6" fill="#e5f4f1" stroke="#087f73" stroke-width="1.4"/>
  <text x="310" y="301" text-anchor="middle" font-size="13" font-weight="700" fill="#065f56">稀疏 MLA 层</text>
  <text x="310" y="322" text-anchor="middle" font-size="12" fill="#4d5652">11 主干层 + MTP 第 45 层</text>
  <text x="310" y="342" text-anchor="middle" font-size="12" fill="#065f56">每层挂 1 主 + 2 缓存条目</text>

  <line x1="402" y1="314" x2="426" y2="314" stroke="#4d5652" stroke-width="1.7" marker-end="url(#abc-arr-ink)"/>

  <rect x="430" y="276" width="218" height="76" rx="6" fill="#ebeef9" stroke="#3a4f93" stroke-width="1.3"/>
  <text x="539" y="301" text-anchor="middle" font-size="12.5" font-weight="700" fill="#2d3e75">稀疏 MLA 主后端</text>
  <text x="539" y="322" text-anchor="middle" font-size="12" fill="#4d5652">512 维潜向量分页块表</text>
  <text x="539" y="342" text-anchor="middle" font-size="12" fill="#4d5652">+ Indexer 选出 top-2048</text>

  <line x1="648" y1="314" x2="672" y2="314" stroke="#4d5652" stroke-width="1.7" marker-end="url(#abc-arr-ink)"/>

  <rect x="676" y="276" width="196" height="76" rx="6" fill="#fff4cf" stroke="#c78300" stroke-width="1.3"/>
  <text x="774" y="301" text-anchor="middle" font-size="13" font-weight="700" fill="#936300">稀疏 MLA 设备算子</text>
  <text x="774" y="322" text-anchor="middle" font-size="12" fill="#4d5652">按索引读取选中块</text>
  <text x="774" y="342" text-anchor="middle" font-size="12" fill="#4d5652">只在选中位置上计算</text>

  <!-- LANE C: Auxiliary Cache-Only Entries -->
  <path d="M 310 352 L 310 418 L 426 418" fill="none" stroke="#9a4b86" stroke-width="1.6" stroke-dasharray="5 3" marker-end="url(#abc-arr-plum)"/>
  <text x="366" y="408" text-anchor="middle" font-size="12" font-weight="700" fill="#7a3a6a">同层附挂</text>

  <rect x="430" y="380" width="218" height="76" rx="6" fill="#f7e7f2" stroke="#9a4b86" stroke-width="1.3" stroke-dasharray="5 3"/>
  <text x="539" y="405" text-anchor="middle" font-size="12.5" font-weight="700" fill="#7a3a6a">同层两个附属缓存后端</text>
  <text x="539" y="426" text-anchor="middle" font-size="12" fill="#4d5652">① Indexer K 池（64 B/位置）</text>
  <text x="539" y="446" text-anchor="middle" font-size="12" fill="#4d5652">② kpool 尾状态（4 位置窗）</text>

  <line x1="648" y1="418" x2="672" y2="418" stroke="#9a4b86" stroke-width="1.6" marker-end="url(#abc-arr-plum)"/>

  <rect x="676" y="380" width="196" height="76" rx="6" fill="#f7e7f2" stroke="#9a4b86" stroke-width="1.3"/>
  <text x="774" y="405" text-anchor="middle" font-size="13" font-weight="700" fill="#7a3a6a">只管缓存 · 不算注意力</text>
  <text x="774" y="426" text-anchor="middle" font-size="12" fill="#4d5652">由主层前向顺带写入</text>
  <text x="774" y="446" text-anchor="middle" font-size="12" fill="#4d5652">独立参与分页块分配</text>
</svg>
