<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 470" width="900" height="470" role="img" aria-label="一层注意力怎么找到它的后端——全注意力层过三道闸去查表，线性注意力层自己带着后端进场">
  <title>一层注意力怎么找到它的后端——全注意力层过三道闸去查表，线性注意力层自己带着后端进场</title>
