<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 330" width="900" height="330" role="img" aria-label="causal mask 的可见范围（数为示意）：行是查询，列是键。左边整段送入 3 个位置，每行只看自己和更早的位置，虚框是被遮掉的位置、权重为 0，其余格是这一行的权重；右边之后生成的 token 放在位置 3，只为它算 q，前 3 列的 K、V 从 KV cache 读出">
