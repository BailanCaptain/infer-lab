<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 456" width="900" height="456" role="img" aria-label="五类注意力 Decode 逻辑读取增长曲线与 GLM 单卡 6827 token 容量交点曲线图" font-family="var(--font-sans)">
  <title>注意力增长曲线（MHA/GQA/MLA/稀疏/KDA）与 GLM 6,827 token 容量交点</title>
  <desc>关联 append_causal_tail、topk_tokens、pool_size、create_kv_cache_group_specs、KVCacheConfig：左侧笛卡尔曲线对比五类注意力 Decode 单步读取随历史长度 n 的增长阶（含稀疏主读在 2048 处封顶与索引器线性反超）；右侧精确画出 GLM 单卡 KDA 固定 85 MiB 页与 12 层 MLA 每 token 13,056 B 在约 6,827 token 处的交点。</desc>

  <!-- Titles & Vertical Divider -->
  <text x="16" y="28" font-size="16" font-weight="700" fill="#17211f">① Decode 单步逻辑读取量 vs 历史长度 n（趋势示意）</text>
  <text x="468" y="28" font-size="16" font-weight="700" fill="#3a4f93">② GLM 单卡容量交点（KDA 85 MiB vs MLA）</text>
  <line x1="14" y1="38" x2="886" y2="38" stroke="#b8bcb5" stroke-width="1.4"/>
  <line x1="450" y1="46" x2="450" y2="384" stroke="#b8bcb5" stroke-width="1.4" stroke-dasharray="5 4"/>

  <!-- LEFT PLOT: x=54..426, y=64..332 -->
  <line x1="54" y1="64" x2="54" y2="332" stroke="#8a928f" stroke-width="1.5"/>
  <line x1="54" y1="332" x2="428" y2="332" stroke="#8a928f" stroke-width="1.5"/>
  <text x="18" y="60" font-size="13.5" font-weight="700" fill="#4d5652">单步读量</text>
  <text x="242" y="362" text-anchor="middle" font-size="13.5" font-weight="700" fill="#4d5652">历史长度 n →</text>

  <!-- Curves -->
  <!-- MHA: steep red -->
  <line x1="54" y1="332" x2="210" y2="74" stroke="#b54237" stroke-width="2.4"/>
  <text x="216" y="84" font-size="13.5" font-weight="700" fill="#8f3229">MHA O(n·n_q)</text>

  <!-- GQA: amber -->
  <line x1="54" y1="332" x2="310" y2="108" stroke="#c78300" stroke-width="2.4"/>
  <text x="316" y="116" font-size="13.5" font-weight="700" fill="#936300">GQA O(n·n_kv)</text>

  <!-- MLA: indigo -->
  <line x1="54" y1="332" x2="412" y2="162" stroke="#4c65b6" stroke-width="2.4"/>
  <text x="326" y="176" font-size="13.5" font-weight="700" fill="#3a4f93">MLA O(n·d_c)</text>

  <!-- Sparse Indexer: dashed plum rising linearly past Sparse Main -->
  <line x1="54" y1="332" x2="414" y2="214" stroke="#9a4b86" stroke-width="2.2" stroke-dasharray="6 4"/>
  <text x="280" y="218" font-size="13.5" font-weight="700" fill="#7a3a6a">稀疏 Indexer O(n) 反超！</text>

  <!-- Sparse Main: solid plum up to knee x=142 (n=2048), then flat! -->
  <path d="M 54 332 L 138 272 L 414 272" fill="none" stroke="#9a4b86" stroke-width="2.6"/>
  <circle cx="138" cy="272" r="4.5" fill="#9a4b86"/>
  <line x1="138" y1="272" x2="138" y2="332" stroke="#9a4b86" stroke-width="1.2" stroke-dasharray="3 3"/>
  <text x="138" y="348" text-anchor="middle" font-family="var(--font-mono)" font-size="13.5" fill="#7a3a6a">K_top</text>
  <text x="292" y="264" font-size="13.5" font-weight="700" fill="#7a3a6a">稀疏主读 O(K) 封顶</text>

  <!-- KDA: flat teal at bottom -->
  <line x1="54" y1="308" x2="414" y2="308" stroke="#087f73" stroke-width="2.6"/>
  <text x="310" y="301" font-size="13.5" font-weight="700" fill="#065f56">KDA 固定状态 O(1)</text>

  <!-- RIGHT PLOT: GLM Capacity Crossover (x=524..874 -> n=0..16000; y=332..72 -> 0..200 MiB) -->
  <!-- x scale: 350 px / 16000 = 0.021875 px/tok; n=6827 -> x = 524 + 149.3 = 673 -->
  <!-- y scale: 260 px / 200 = 1.3 px/MiB; 85 MiB -> y = 332 - 110.5 = 221.5; 199.2 MiB -> y = 73 -->
  <!-- Shaded regions -->
  <rect x="524" y="222" width="149" height="110" fill="#ddf4ef" fill-opacity="0.45"/>
  <rect x="673" y="74" width="201" height="148" fill="#e8edff" fill-opacity="0.45"/>

  <line x1="524" y1="64" x2="524" y2="332" stroke="#8a928f" stroke-width="1.5"/>
  <line x1="524" y1="332" x2="876" y2="332" stroke="#8a928f" stroke-width="1.5"/>
  <text x="466" y="60" font-size="13.5" font-weight="700" fill="#4d5652">每卡 MiB</text>

  <!-- Y ticks -->
  <g font-family="var(--font-mono)" font-size="13.5" fill="#4d5652" text-anchor="end">
    <line x1="518" y1="222" x2="524" y2="222" stroke="#087f73" stroke-width="1.5"/>
    <text x="514" y="227" font-weight="700" fill="#065f56">85</text>
    <line x1="518" y1="137" x2="524" y2="137" stroke="#8a928f" stroke-width="1.2"/>
    <text x="514" y="142">150</text>
    <line x1="518" y1="72" x2="524" y2="72" stroke="#8a928f" stroke-width="1.2"/>
    <text x="514" y="77">200</text>
  </g>

  <!-- X ticks -->
  <g font-family="var(--font-mono)" font-size="13.5" fill="#4d5652" text-anchor="middle">
    <text x="524" y="350">0</text>
    <text x="673" y="350" font-weight="700" fill="#b54237">6,827</text>
    <text x="786" y="350">12K</text>
    <text x="870" y="350">16K</text>
  </g>
  <text x="700" y="372" text-anchor="middle" font-size="13.5" font-weight="700" fill="#4d5652">请求上下文长度 n（token）</text>

  <!-- KDA horizontal line at y=222 (85 MiB) -->
  <line x1="524" y1="222" x2="874" y2="222" stroke="#087f73" stroke-width="2.8"/>
  <text x="870" y="244" text-anchor="end" font-size="13.5" font-weight="700" fill="#065f56">KDA 分配页：固定 85 MiB</text>

  <!-- MLA diagonal line from (524,332) to (874,73) -->
  <line x1="524" y1="332" x2="874" y2="73" stroke="#4c65b6" stroke-width="2.8"/>
  <text x="870" y="96" text-anchor="end" font-size="13.5" font-weight="700" fill="#3a4f93">12 层 MLA (13,056 B/tok)</text>

  <!-- Crossover marker at (673, 222) -->
  <line x1="673" y1="222" x2="673" y2="332" stroke="#b54237" stroke-width="1.6" stroke-dasharray="4 3"/>
  <circle cx="673" cy="222" r="6" fill="#b54237"/>
  <rect x="534" y="138" width="132" height="46" rx="6" fill="#fff0e9" stroke="#b54237" stroke-width="1.4"/>
  <text x="600" y="158" text-anchor="middle" font-size="13.5" font-weight="700" fill="#8f3229">交点 ≈ 6,827</text>
  <text x="600" y="177" text-anchor="middle" font-size="13.5" fill="#8f3229">短文 KDA 更大</text>

  <text x="774" y="168" text-anchor="middle" font-size="13.5" font-weight="700" fill="#3a4f93">长文 MLA 主导</text>
  <text x="598" y="294" text-anchor="middle" font-size="13.5" font-weight="700" fill="#065f56">KDA 主导区</text>

  <!-- Bottom takeaway strip -->
  <rect x="16" y="394" width="868" height="50" rx="7" fill="#ece9df" stroke="#b8bcb5" stroke-width="1.2"/>
  <text x="30" y="416" font-size="13.5" fill="#17211f"><tspan font-weight="700" fill="#8f3229">两处边界提醒：</tspan>① 密集 Prefill 的 O(n²) 仅限打分与汇合段，投影/MLP/MoE 仍随 n 线性增长；</text>
  <text x="30" y="436" font-size="13.5" fill="#4d5652">② 6,827 token 仅是缓存容量交点而非性能临界点；长文稀疏层虽封顶主读，但持久历史与索引器扫描仍随 n 增长。</text>
</svg>
