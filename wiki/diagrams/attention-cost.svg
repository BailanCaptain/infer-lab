<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 420" width="900" height="420" role="img" aria-label="单层、单请求、未分片的逻辑容量推导：MLA 主潜向量为 BF16；KDA 矩阵状态假设 FP32。条长只表示字节数，未包含索引、卷积、分页与其他开销，也不是速度比较">
  <title>单层、单请求、未分片的逻辑容量推导：MLA 主潜向量为 BF16；KDA 矩阵状态假设 FP32。条长只表示字节数，未包含索引、卷积、分页与其他开销，也不是速度比较</title>
  <defs></defs>
  <rect x="220" y="90" width="125" height="32" rx="4" fill="var(--color-kv, #4c65b6)" stroke="var(--color-ink, #17211f)" stroke-width="1.3"/>
