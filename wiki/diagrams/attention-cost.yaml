layout: figure
id: attention-cost
caption: 一个新位置做注意力时逻辑上访问多少历史。历史从 4 份增长到 12 份，图中的稀疏注意力按内容选择，主 attention 预算示意为 4 份；固定滑窗等其他稀疏模式见正文。实色格是这一步要访问的，虚线格仍留在缓存里但这一步不读；细条是 indexer 打分用的 key，每份比主 attention 的 K/V 小得多，但每一份都要扫到。固定状态不按位置保存历史，每一步只读写同一块状态。图中份数不等于实测 HBM 读取次数。
