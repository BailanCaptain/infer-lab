layout: figure
id: attention-cost
caption: 同一个模型里两种层：全注意力的 KV 随 token 数一路涨，线性注意力的状态从头到尾一样大
size: [900, 380]

charts:
  - at: [120, 70]
    size: [560, 210]
    x: { label: 已经记住的 token 数, min: 0, max: 3000, ticks: [0, 1000, 2000, 3000] }
    y: { label: 每颗 NPU 上一层存了多少（KiB）, min: 0, max: 3000, ticks: [0, 1000, 2000, 3000] }
    series:
      - { kind: line, tone: kv, points: [[0, 0], [1048, 1048], [3000, 3000]], label: 全注意力层：KV Cache }
      - { kind: line, tone: kv, dashed: true, points: [[0, 1048], [3000, 1048]], label: 线性注意力层：状态 }
    source: Qwen3.6-35B-A3B 官方配置，两颗 NPU 部署；算式见本页下半

texts:
  - { at: [700, 165], text: 约 1048 个 token 时追平, size: 13 }
