<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 850" width="860" height="850" role="img" aria-label="主线第 4 站里一层 attention 的两条路径：按层号二选一。KDA 保留 q、k、v 投影，但用每头一个固定大小的状态代替逐位置 softmax；稀疏 MLA 仍做 softmax，只是历史存成潜向量、只读索引器挑中的位置。两条路最后都在本卡算出部分和，经一次 TP8 All-Reduce 合齐">
  <title>主线第 4 站里一层 attention 的两条路径：按层号二选一。KDA 保留 q、k、v 投影，但用每头一个固定大小的状态代替逐位置 softmax；稀疏 MLA 仍做 softmax，只是历史存成潜向量、只读索引器挑中的位置。两条路最后都在本卡算出部分和，经一次 TP8 All-Reduce 合齐</title>
  <defs><marker id="attention-glm-paths-ah-ink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="var(--color-ink, #17211f)"/></marker><marker id="attention-glm-paths-ah-token" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="var(--color-token, #087f73)"/></marker></defs>
  <path d="M430 76 L430 108 L220 108 L220 140" fill="none" stroke="var(--color-ink, #17211f)" stroke-width="1.4" marker-end="url(#attention-glm-paths-ah-ink)"/>
  <path d="M430 76 L430 108 L640 108 L640 140" fill="none" stroke="var(--color-ink, #17211f)" stroke-width="1.4" marker-end="url(#attention-glm-paths-ah-ink)"/>
  <path d="M220 198 L220 240" fill="none" stroke="var(--color-token, #087f73)" stroke-width="1.4" marker-end="url(#attention-glm-paths-ah-token)"/>
  <path d="M220 298 L220 340" fill="none" stroke="var(--color-token, #087f73)" stroke-width="1.4" marker-end="url(#attention-glm-paths-ah-token)"/>
  <path d="M220 398 L220 440" fill="none" stroke="var(--color-token, #087f73)" stroke-width="1.4" marker-end="url(#attention-glm-paths-ah-token)"/>
  <path d="M640 198 L640 232" fill="none" stroke="var(--color-token, #087f73)" stroke-width="1.4" marker-end="url(#attention-glm-paths-ah-token)"/>
  <path d="M640 290 L640 324" fill="none" stroke="var(--color-token, #087f73)" stroke-width="1.4" marker-end="url(#attention-glm-paths-ah-token)"/>
  <path d="M640 382 L640 416" fill="none" stroke="var(--color-token, #087f73)" stroke-width="1.4" marker-end="url(#attention-glm-paths-ah-token)"/>
  <path d="M640 474 L640 508" fill="none" stroke="var(--color-token, #087f73)" stroke-width="1.4" marker-end="url(#attention-glm-paths-ah-token)"/>
  <path d="M220 498 L220 590 L380 590 L380 612" fill="none" stroke="var(--color-token, #087f73)" stroke-width="1.4" marker-end="url(#attention-glm-paths-ah-token)"/>
  <path d="M640 566 L640 590 L480 590 L480 612" fill="none" stroke="var(--color-token, #087f73)" stroke-width="1.4" marker-end="url(#attention-glm-paths-ah-token)"/>
  <path d="M430 670 L430 700" fill="none" stroke="var(--color-token, #087f73)" stroke-width="1.4" marker-end="url(#attention-glm-paths-ah-token)"/>
  <path d="M430 754 L430 784" fill="none" stroke="var(--color-token, #087f73)" stroke-width="1.4" marker-end="url(#attention-glm-paths-ah-token)"/>
  <rect x="230" y="18" width="400" height="58" rx="8" fill="var(--color-token-soft, #ddf4ef)" stroke="var(--color-token, #087f73)" stroke-width="1.4"/>
  <text x="430" y="43" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="14" font-weight="700" fill="var(--color-ink, #17211f)" text-anchor="middle">进入一层的 attention</text>
  <text x="430" y="62" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="13" font-weight="400" fill="#065f56" text-anchor="middle">入口混合与归一化之后，每卡输入 T 行 × 4096</text>
  <rect x="40" y="140" width="360" height="58" rx="8" fill="var(--color-weight-soft, #fff4cf)" stroke="var(--color-weight, #c78300)" stroke-width="1.4"/>
  <text x="220" y="165" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="14" font-weight="700" fill="var(--color-ink, #17211f)" text-anchor="middle">q、k、v 投影</text>
  <text x="220" y="184" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="13" font-weight="400" fill="#936300" text-anchor="middle">本卡 8 个头，每头 128 维</text>
  <rect x="40" y="240" width="360" height="58" rx="8" fill="var(--color-token-soft, #ddf4ef)" stroke="var(--color-token, #087f73)" stroke-width="1.4"/>
  <text x="220" y="265" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="14" font-weight="700" fill="var(--color-ink, #17211f)" text-anchor="middle">短卷积，q、k 归一化</text>
  <text x="220" y="284" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="13" font-weight="400" fill="#065f56" text-anchor="middle">混合当前与前 3 个位置</text>
  <rect x="40" y="340" width="360" height="58" rx="8" fill="var(--color-kv-soft, #e8edff)" stroke="var(--color-kv, #4c65b6)" stroke-width="1.4"/>
  <text x="220" y="365" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="14" font-weight="700" fill="var(--color-ink, #17211f)" text-anchor="middle">更新并读取状态</text>
  <text x="220" y="384" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="13" font-weight="400" fill="#3a4f93" text-anchor="middle">每头 128 × 128，没有逐位置 softmax</text>
  <rect x="40" y="440" width="360" height="58" rx="8" fill="var(--color-token-soft, #ddf4ef)" stroke="var(--color-token, #087f73)" stroke-width="1.4"/>
  <text x="220" y="465" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="14" font-weight="700" fill="var(--color-ink, #17211f)" text-anchor="middle">输出门与归一化</text>
  <text x="220" y="484" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="13" font-weight="400" fill="#065f56" text-anchor="middle">按通道决定放出多少</text>
  <rect x="460" y="140" width="360" height="58" rx="8" fill="var(--color-kv-soft, #e8edff)" stroke="var(--color-kv, #4c65b6)" stroke-width="1.4"/>
  <text x="640" y="165" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="14" font-weight="700" fill="var(--color-ink, #17211f)" text-anchor="middle">低秩投影，潜向量写入缓存</text>
  <text x="640" y="184" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="13" font-weight="400" fill="#3a4f93" text-anchor="middle">每位置 512 维，每卡完整一份</text>
  <rect x="460" y="232" width="360" height="58" rx="8" fill="var(--color-control-soft, #f1efe8)" stroke="var(--color-control, #66716d)" stroke-width="1.4"/>
  <text x="640" y="257" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="14" font-weight="700" fill="var(--color-ink, #17211f)" text-anchor="middle">索引器挑位置</text>
  <text x="640" y="276" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="13" font-weight="400" fill="var(--color-ink-muted, #66716d)" text-anchor="middle">因果范围内最多 2,051 个</text>
  <rect x="460" y="324" width="360" height="58" rx="8" fill="var(--color-weight-soft, #fff4cf)" stroke="var(--color-weight, #c78300)" stroke-width="1.4"/>
  <text x="640" y="349" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="14" font-weight="700" fill="var(--color-ink, #17211f)" text-anchor="middle">q 展开并吸收 K 的解压</text>
  <text x="640" y="368" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="13" font-weight="400" fill="#936300" text-anchor="middle">本卡 8 个头，每头 256 维 → 512 维</text>
  <rect x="460" y="416" width="360" height="58" rx="8" fill="var(--color-token-soft, #ddf4ef)" stroke="var(--color-token, #087f73)" stroke-width="1.4"/>
  <text x="640" y="441" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="14" font-weight="700" fill="var(--color-ink, #17211f)" text-anchor="middle">softmax 汇合选中位置</text>
  <text x="640" y="460" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="13" font-weight="400" fill="#065f56" text-anchor="middle">分数乘 1/16，只在挑中的位置上归一化</text>
  <rect x="460" y="508" width="360" height="58" rx="8" fill="var(--color-weight-soft, #fff4cf)" stroke="var(--color-weight, #c78300)" stroke-width="1.4"/>
  <text x="640" y="533" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="14" font-weight="700" fill="var(--color-ink, #17211f)" text-anchor="middle">V 解压</text>
  <text x="640" y="552" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="13" font-weight="400" fill="#936300" text-anchor="middle">每头 512 维 → 256 维，8 头拼成 2048</text>
  <rect x="230" y="612" width="400" height="58" rx="8" fill="var(--color-weight-soft, #fff4cf)" stroke="var(--color-weight, #c78300)" stroke-width="1.4"/>
  <text x="430" y="637" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="14" font-weight="700" fill="var(--color-ink, #17211f)" text-anchor="middle">输出投影：本卡部分和</text>
  <text x="430" y="656" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="13" font-weight="400" fill="#936300" text-anchor="middle">本卡 8 个头的结果降回 4096 维</text>
  <rect x="230" y="700" width="400" height="54" rx="8" fill="var(--color-comm-soft, #f5e6f0)" stroke="var(--color-comm, #9a4b86)" stroke-width="1.4"/>
  <text x="430" y="723" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="14" font-weight="700" fill="var(--color-ink, #17211f)" text-anchor="middle">TP8 All-Reduce</text>
  <text x="430" y="742" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="13" font-weight="400" fill="#7a3a6a" text-anchor="middle">8 卡按位置相加，每卡拿回完整结果</text>
  <rect x="230" y="784" width="400" height="50" rx="8" fill="var(--color-token-soft, #ddf4ef)" stroke="var(--color-token, #087f73)" stroke-width="1.4"/>
  <text x="430" y="814" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="14" font-weight="700" fill="var(--color-ink, #17211f)" text-anchor="middle">写回四路残差，进入 MLP 或 MoE</text>
  <text x="40" y="128" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="13.5" font-weight="400" fill="var(--color-ink-muted, #66716d)" font-style="italic">34 层 KDA</text>
  <text x="660" y="128" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="13.5" font-weight="400" fill="var(--color-ink-muted, #66716d)" font-style="italic">11 层稀疏 MLA</text>
  <text x="444" y="98" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="13" font-weight="400" fill="var(--color-ink, #17211f)">按层号二选一</text>
</svg>
