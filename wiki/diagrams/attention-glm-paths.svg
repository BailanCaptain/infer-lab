<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 496" width="900" height="496" role="img" aria-label="GLM-5.3-Flash 两类异构注意力机制对照：左侧 34 层 KDA 定长 128x128 递推状态矩阵，右侧 11 层稀疏 MLA 潜历史条与索引器精选最多 2051 位置" font-family="var(--font-sans)">
  <title>GLM-5.3-Flash 单层两类异构注意力对照（TP8 每卡 8 头）：左侧 34 层 KDA 经宽 4 短卷积后更新每头固定 128×128 递推状态矩阵，无逐位置 Softmax；右侧 11 层稀疏 MLA 每位置只存 512 维潜向量，由索引器挑出最多 2,051 个位置，在吸收后的 512 维空间以 1/16 缩放做稀疏 Softmax；两路最终经 o_proj 与一次 TP8 All-Reduce 合齐写回四路残差。</title>
  <desc>关联源码符号：_is_kda_layer, KimiGatedDeltaNetAttention, AscendGlm5NextMLAAttention, q_proj, k_proj, v_proj, kda_attention, o_norm, o_proj, AscendIndexerKPoolMLAAttention, IndexerKPoolMLACacheLayer, execute_sparse_attention_indexer_kpool_mla, npu_sparse_flash_attention, _execute_sparse_flash_attention_process, _v_up_proj</desc>
  <defs>
    <marker id="agp-arr-t" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 1.5 L 8.5 5 L 0 8.5 z" fill="#087f73"/>
    </marker>
    <marker id="agp-arr-i" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 1.5 L 8.5 5 L 0 8.5 z" fill="#4c65b6"/>
    </marker>
    <marker id="agp-arr-p" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 1.5 L 8.5 5 L 0 8.5 z" fill="#9a4b86"/>
    </marker>
  </defs>

  <!-- 顶部入口 -->
  <rect x="210" y="10" width="480" height="44" rx="8" fill="#ddf4ef" stroke="#087f73" stroke-width="1.5"/>
  <text x="450" y="37" text-anchor="middle" font-size="15" font-weight="700" fill="#065f56">mHC 入口混合 + RMSNorm → 本卡输入 [T, 4096]（按层号二选一）</text>

  <path d="M 320 54 L 222 80" fill="none" stroke="#087f73" stroke-width="1.8" marker-end="url(#agp-arr-t)"/>
  <path d="M 580 54 L 678 80" fill="none" stroke="#4c65b6" stroke-width="1.8" marker-end="url(#agp-arr-i)"/>

  <line x1="450" y1="74" x2="450" y2="394" stroke="#d8d8cf" stroke-width="1.4" stroke-dasharray="6 4"/>

  <!-- 左栏：34 层 KDA（固定 128x128 状态矩阵） -->
  <text x="14" y="98" font-size="16" font-weight="700" fill="#065f56">34 层 KDA（线性递推 · 无逐位置 Softmax）</text>
  <text x="14" y="120" font-size="13.5" fill="#4d5652">TP8 每卡 8 头 × 128 维 · 仅存本卡固定状态</text>

  <!-- Step 1: 投影 + 宽 4 短卷积滑窗 -->
  <rect x="14" y="132" width="416" height="62" rx="8" fill="#fff4cf" stroke="#c78300" stroke-width="1.4"/>
  <text x="28" y="156" font-size="14.5" font-weight="700" fill="#936300">1. q/k/v 投影 + 核宽 4 因果短卷积 + q/k 归一</text>
  <rect x="28" y="166" width="48" height="20" rx="3" fill="#ffffff" stroke="#c78300" stroke-width="1.1"/>
  <text x="52" y="180" text-anchor="middle" font-size="13" font-family="var(--font-mono)" fill="#936300">t-3</text>
  <rect x="80" y="166" width="48" height="20" rx="3" fill="#ffffff" stroke="#c78300" stroke-width="1.1"/>
  <text x="104" y="180" text-anchor="middle" font-size="13" font-family="var(--font-mono)" fill="#936300">t-2</text>
  <rect x="132" y="166" width="48" height="20" rx="3" fill="#ffffff" stroke="#c78300" stroke-width="1.1"/>
  <text x="156" y="180" text-anchor="middle" font-size="13" font-family="var(--font-mono)" fill="#936300">t-1</text>
  <rect x="184" y="166" width="48" height="20" rx="3" fill="#ddf4ef" stroke="#087f73" stroke-width="1.4"/>
  <text x="208" y="180" text-anchor="middle" font-size="13" font-family="var(--font-mono)" font-weight="700" fill="#065f56">t</text>
  <text x="244" y="181" font-size="13.5" fill="#4d5652">混合近 4 位携顺序（无 RoPE）</text>

  <!-- Step 2: 2D 状态矩阵递推 S_{t-1} -> S_t -->
  <rect x="14" y="206" width="416" height="122" rx="8" fill="#ddf4ef" stroke="#087f73" stroke-width="1.5"/>
  <text x="28" y="230" font-size="14.5" font-weight="700" fill="#065f56">2. 带遗忘门 Delta 规则更新 128×128 矩阵状态</text>

  <!-- 旧状态网格 S_{t-1} -->
  <rect x="28" y="244" width="66" height="66" rx="5" fill="#ffffff" stroke="#087f73" stroke-width="1.4"/>
  <line x1="50" y1="244" x2="50" y2="310" stroke="#79aaa1" stroke-width="1"/>
  <line x1="72" y1="244" x2="72" y2="310" stroke="#79aaa1" stroke-width="1"/>
  <line x1="28" y1="266" x2="94" y2="266" stroke="#79aaa1" stroke-width="1"/>
  <line x1="28" y1="288" x2="94" y2="288" stroke="#79aaa1" stroke-width="1"/>
  <text x="61" y="282" text-anchor="middle" font-size="13.5" font-family="var(--font-mono)" font-weight="700" fill="#065f56">S_{t-1}</text>

  <path d="M 98 277 L 138 277" fill="none" stroke="#087f73" stroke-width="2" marker-end="url(#agp-arr-t)"/>
  <text x="118" y="268" text-anchor="middle" font-size="13" font-weight="700" fill="#065f56">更新</text>

  <!-- 新状态网格 S_t -->
  <rect x="142" y="244" width="66" height="66" rx="5" fill="#cbe9e2" stroke="#087f73" stroke-width="1.6"/>
  <line x1="164" y1="244" x2="164" y2="310" stroke="#087f73" stroke-width="1"/>
  <line x1="186" y1="244" x2="186" y2="310" stroke="#087f73" stroke-width="1"/>
  <line x1="142" y1="266" x2="208" y2="266" stroke="#087f73" stroke-width="1"/>
  <line x1="142" y1="288" x2="208" y2="288" stroke="#087f73" stroke-width="1"/>
  <text x="175" y="282" text-anchor="middle" font-size="13.5" font-family="var(--font-mono)" font-weight="700" fill="#065f56">S_t</text>

  <text x="222" y="262" font-size="13.5" font-weight="700" fill="#17211f">大小恒定，不随长度涨</text>
  <text x="222" y="286" font-size="13.5" fill="#4d5652">用 q 读出（× 1/√128）</text>
  <text x="222" y="309" font-size="13.5" fill="#065f56">Prefill 分块 / Decode 递推</text>

  <!-- Step 3: 输出门 -->
  <rect x="14" y="340" width="416" height="44" rx="7" fill="#ece9df" stroke="#66716d" stroke-width="1.3"/>
  <text x="222" y="367" text-anchor="middle" font-size="14" font-weight="700" fill="#17211f">3. 输出门控与 o_norm → 本卡 8 头 [T, 1024]</text>

  <!-- 右栏：11 层稀疏 MLA（潜历史条 + 索引器精选） -->
  <text x="470" y="98" font-size="16" font-weight="700" fill="#3a4f93">11 层稀疏 MLA（潜向量压缩 + 挑中再 Softmax）</text>
  <text x="470" y="120" font-size="13.5" fill="#4d5652">TP8 每卡 8 头 × 256 维 · 512 维潜缓存每卡完整复制</text>

  <!-- Step 1: 512 维潜向量历史条 + 索引器精选 -->
  <rect x="470" y="132" width="416" height="106" rx="8" fill="#e8edff" stroke="#4c65b6" stroke-width="1.5"/>
  <text x="484" y="156" font-size="14.5" font-weight="700" fill="#3a4f93">1. 写 512 维潜向量 + 索引器挑 Top-k（≤ 2,051）</text>
  <!-- 10 格历史条，仅高亮 4 格代表被索引器选中的稀疏位置 -->
  <rect x="484" y="168" width="32" height="32" rx="4" fill="#4c65b6" stroke="#3a4f93" stroke-width="1.3"/>
  <text x="500" y="189" text-anchor="middle" font-size="13" font-weight="700" fill="#ffffff">✓</text>
  <rect x="520" y="168" width="32" height="32" rx="4" fill="#ece9df" stroke="#b8bcb5" stroke-width="1.1"/>
  <rect x="556" y="168" width="32" height="32" rx="4" fill="#ece9df" stroke="#b8bcb5" stroke-width="1.1"/>
  <rect x="592" y="168" width="32" height="32" rx="4" fill="#4c65b6" stroke="#3a4f93" stroke-width="1.3"/>
  <text x="608" y="189" text-anchor="middle" font-size="13" font-weight="700" fill="#ffffff">✓</text>
  <rect x="628" y="168" width="32" height="32" rx="4" fill="#ece9df" stroke="#b8bcb5" stroke-width="1.1"/>
  <rect x="664" y="168" width="32" height="32" rx="4" fill="#4c65b6" stroke="#3a4f93" stroke-width="1.3"/>
  <text x="680" y="189" text-anchor="middle" font-size="13" font-weight="700" fill="#ffffff">✓</text>
  <rect x="700" y="168" width="32" height="32" rx="4" fill="#ece9df" stroke="#b8bcb5" stroke-width="1.1"/>
  <rect x="736" y="168" width="32" height="32" rx="4" fill="#ece9df" stroke="#b8bcb5" stroke-width="1.1"/>
  <rect x="772" y="168" width="32" height="32" rx="4" fill="#4c65b6" stroke="#3a4f93" stroke-width="1.3"/>
  <text x="788" y="189" text-anchor="middle" font-size="13" font-weight="700" fill="#ffffff">✓</text>
  <text x="814" y="189" font-size="13.5" font-weight="700" fill="#3a4f93">512 维/位</text>
  <text x="484" y="224" font-size="13.5" fill="#4d5652">RoPE 维数 = 0（NoPE）；R1 历史极短，全部入选</text>

  <!-- Step 2: 矩阵吸收 + 稀疏 Softmax (1/16) -->
  <rect x="470" y="250" width="416" height="78" rx="8" fill="#fff4cf" stroke="#c78300" stroke-width="1.4"/>
  <text x="484" y="275" font-size="14.5" font-weight="700" fill="#936300">2. 矩阵吸收 + 稀疏 Softmax（缩放 1/√256 = 1/16）</text>
  <text x="484" y="300" font-size="13.5" fill="#17211f">q 吸收 K 解压矩阵（256→512），直接与选中潜向量点积</text>
  <text x="484" y="320" font-size="13.5" fill="#66716d">只在挑中的 ≤ 2,051 位置做归一化（sparse_mode = 3）</text>

  <!-- Step 3: V 解压 -->
  <rect x="470" y="340" width="416" height="44" rx="7" fill="#ece9df" stroke="#66716d" stroke-width="1.3"/>
  <text x="678" y="367" text-anchor="middle" font-size="14" font-weight="700" fill="#17211f">3. V 解压 512→256 → 本卡 8 头拼成 [T, 2048]</text>

  <!-- 共同出口汇合 -->
  <path d="M 222 384 L 222 406 L 370 406 L 370 416" fill="none" stroke="#9a4b86" stroke-width="1.8" stroke-linejoin="round" marker-end="url(#agp-arr-p)"/>
  <path d="M 678 384 L 678 406 L 530 406 L 530 416" fill="none" stroke="#9a4b86" stroke-width="1.8" stroke-linejoin="round" marker-end="url(#agp-arr-p)"/>

  <rect x="14" y="420" width="872" height="64" rx="9" fill="#f7e7f2" stroke="#9a4b86" stroke-width="1.6"/>
  <text x="450" y="446" text-anchor="middle" font-size="15" font-weight="700" fill="#7a3a6a">共同出口：本卡 o_proj 产出 [T, 4096] 部分和 → TP8 All-Reduce 合齐（R1 载荷 32,768 B）</text>
  <text x="450" y="471" text-anchor="middle" font-size="13.5" fill="#4d5652">8 卡拿回完整 [T, 4096] 后写回四路 mHC 残差流，再进入稠密 MLP 或 MoE 子层</text>
</svg>
