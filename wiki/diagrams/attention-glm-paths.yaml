id: attention-glm-paths
caption: >-
  主线第 4 站里 GLM-5.3-Flash 一层 attention 的两条异构路径（TP8 每卡 8 头，按层号二选一）：左侧 34 层 KDA 经核宽 4 短卷积后更新每头固定 128×128 递推状态矩阵、无逐位置 Softmax；右侧 11 层稀疏 MLA 每位置只存 512 维潜向量，由索引器挑出最多 2,051 个位置，在矩阵吸收后的 512 维空间按 1/16 缩放做稀疏 Softmax；两路最终均经本卡 o_proj 与一次 TP8 All-Reduce 合齐写回四路残差。
