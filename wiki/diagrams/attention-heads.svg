<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 560" width="900" height="560" role="img" aria-label="通用多头结构，以四个头示意：Q、K、V 投影的输出按头切成几段，每个头用自己那一段各算一遍 attention，权重分布可以各不相同；各头输出沿特征维拼接，再经输出投影回到隐藏宽度">
