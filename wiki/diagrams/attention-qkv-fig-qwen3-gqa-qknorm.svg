<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 448" width="900" height="448" role="img" aria-label="Qwen3-8B 单层 GQA、逐头 QK-Norm 与 RoPE 注意力流转图" font-family="var(--font-sans)">
  <title>Qwen3-8B 单层标准注意力流转（TP=1，d_h=128）：32 个 Q 头按 4:1 分成 8 组共享 8 个 K/V 头；Q 与 K 先过逐头 128 维 RMSNorm 再做 RoPE，V 绕过归一化与旋转直通 KV Cache 与加权汇合，经 1/√128 缩放与因果掩码后由 o_proj 拼回 4096 维。</title>
  <desc>关联源码符号：Qwen3Attention, head_dim, scaling, q_norm, k_norm, rotary_emb, o_proj, sparse_mode</desc>
  <defs>
    <marker id="aq-arr-t" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 1.5 L 8.5 5 L 0 8.5 z" fill="#087f73"/>
    </marker>
    <marker id="aq-arr-a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 1.5 L 8.5 5 L 0 8.5 z" fill="#c78300"/>
    </marker>
    <marker id="aq-arr-i" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 1.5 L 8.5 5 L 0 8.5 z" fill="#4c65b6"/>
    </marker>
    <marker id="aq-arr-p" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 1.5 L 8.5 5 L 0 8.5 z" fill="#9a4b86"/>
    </marker>
  </defs>

  <text x="14" y="26" font-size="16" font-weight="700" fill="#17211f">Qwen3-8B 单层标准注意力流转（TP=1 · 32Q : 8KV · 单头 d_h = 128 · 4:1 GQA × 8 组）</text>
  <line x1="12" y1="38" x2="888" y2="38" stroke="#b8bcb5" stroke-width="1.3"/>

  <!-- 最左：输入 X -->
  <rect x="12" y="152" width="108" height="110" rx="8" fill="#ece9df" stroke="#66716d" stroke-width="1.5"/>
  <text x="66" y="182" text-anchor="middle" font-size="15" font-weight="700" fill="#17211f">层输入 X</text>
  <text x="66" y="208" text-anchor="middle" font-size="13.5" font-family="var(--font-mono)" font-weight="700" fill="#17211f">[T, 4096]</text>
  <text x="66" y="232" text-anchor="middle" font-size="13.5" fill="#4d5652">已过入口</text>
  <text x="66" y="252" text-anchor="middle" font-size="13.5" fill="#4d5652">RMSNorm</text>

  <!-- 三路无偏置投影箭头 -->
  <path d="M 120 176 L 146 106 L 160 106" fill="none" stroke="#087f73" stroke-width="2" stroke-linejoin="round" marker-end="url(#aq-arr-t)"/>
  <path d="M 120 207 L 160 207" fill="none" stroke="#c78300" stroke-width="2" marker-end="url(#aq-arr-a)"/>
  <path d="M 120 238 L 146 322 L 160 322" fill="none" stroke="#4c65b6" stroke-width="2" stroke-linejoin="round" marker-end="url(#aq-arr-i)"/>

  <!-- 轨道 1：Q（4 头一组 × 8 组） -->
  <rect x="164" y="54" width="154" height="104" rx="8" fill="#ddf4ef" stroke="#087f73" stroke-width="1.5"/>
  <text x="241" y="77" text-anchor="middle" font-size="14.5" font-weight="700" fill="#065f56">q_proj → 32 Q 头</text>
  <text x="241" y="97" text-anchor="middle" font-size="13.5" font-family="var(--font-mono)" fill="#17211f">[T, 32, 128]</text>
  <!-- 4 个 Q 小格代表第 0 组 -->
  <rect x="174" y="108" width="30" height="24" rx="4" fill="#ffffff" stroke="#087f73" stroke-width="1.3"/>
  <text x="189" y="125" text-anchor="middle" font-size="13" font-family="var(--font-mono)" font-weight="700" fill="#065f56">Q₀</text>
  <rect x="208" y="108" width="30" height="24" rx="4" fill="#ffffff" stroke="#087f73" stroke-width="1.3"/>
  <text x="223" y="125" text-anchor="middle" font-size="13" font-family="var(--font-mono)" font-weight="700" fill="#065f56">Q₁</text>
  <rect x="242" y="108" width="30" height="24" rx="4" fill="#ffffff" stroke="#087f73" stroke-width="1.3"/>
  <text x="257" y="125" text-anchor="middle" font-size="13" font-family="var(--font-mono)" font-weight="700" fill="#065f56">Q₂</text>
  <rect x="276" y="108" width="30" height="24" rx="4" fill="#ffffff" stroke="#087f73" stroke-width="1.3"/>
  <text x="291" y="125" text-anchor="middle" font-size="13" font-family="var(--font-mono)" font-weight="700" fill="#065f56">Q₃</text>
  <text x="241" y="150" text-anchor="middle" font-size="13" fill="#087f73">4 Q 头为 1 组（共 8 组）</text>

  <path d="M 318 106 L 344 106" fill="none" stroke="#087f73" stroke-width="1.9" marker-end="url(#aq-arr-t)"/>

  <!-- Q 逐头 q_norm + RoPE -->
  <rect x="348" y="64" width="188" height="84" rx="8" fill="#ddf4ef" stroke="#087f73" stroke-width="1.5"/>
  <text x="442" y="89" text-anchor="middle" font-size="14.5" font-weight="700" fill="#065f56">① q_norm → ② RoPE</text>
  <text x="442" y="113" text-anchor="middle" font-size="13.5" fill="#17211f">逐头 128 维 RMSNorm</text>
  <text x="442" y="136" text-anchor="middle" font-size="13.5" fill="#087f73">全 128 维 NeoX 旋转</text>

  <!-- 轨道 2：K（8 头） -->
  <rect x="164" y="172" width="154" height="72" rx="8" fill="#fff4cf" stroke="#c78300" stroke-width="1.5"/>
  <text x="241" y="197" text-anchor="middle" font-size="14.5" font-weight="700" fill="#936300">k_proj → 8 K 头</text>
  <text x="241" y="219" text-anchor="middle" font-size="13.5" font-family="var(--font-mono)" fill="#17211f">[T, 8, 128] · K₀..K₇</text>
  <text x="241" y="238" text-anchor="middle" font-size="13" fill="#936300">每 1 个 K 供 4 个 Q 共读</text>

  <path d="M 318 208 L 344 208" fill="none" stroke="#c78300" stroke-width="1.9" marker-end="url(#aq-arr-a)"/>

  <!-- K 逐头 k_norm + RoPE -->
  <rect x="348" y="172" width="188" height="72" rx="8" fill="#fff4cf" stroke="#c78300" stroke-width="1.5"/>
  <text x="442" y="197" text-anchor="middle" font-size="14.5" font-weight="700" fill="#936300">① k_norm → ② RoPE</text>
  <text x="442" y="219" text-anchor="middle" font-size="13.5" fill="#17211f">先归一再转，写入缓存</text>
  <text x="442" y="238" text-anchor="middle" font-size="13" fill="#936300">历史 K 复用已旋转值</text>

  <!-- 轨道 3：V（8 头，直通绕过 QK-Norm 与 RoPE！） -->
  <rect x="164" y="286" width="154" height="72" rx="8" fill="#e8edff" stroke="#4c65b6" stroke-width="1.5"/>
  <text x="241" y="311" text-anchor="middle" font-size="14.5" font-weight="700" fill="#3a4f93">v_proj → 8 V 头</text>
  <text x="241" y="333" text-anchor="middle" font-size="13.5" font-family="var(--font-mono)" fill="#17211f">[T, 8, 128] · V₀..V₇</text>
  <text x="241" y="352" text-anchor="middle" font-size="13" fill="#3a4f93">每 1 个 V 供 4 个 Q 汇合</text>

  <!-- V 虚线直通旁路 -->
  <path d="M 318 322 L 568 322" fill="none" stroke="#4c65b6" stroke-width="2" stroke-dasharray="6 4" marker-end="url(#aq-arr-i)"/>
  <rect x="348" y="302" width="188" height="40" rx="6" fill="#ece9df" stroke="#4c65b6" stroke-width="1.3" stroke-dasharray="4 3"/>
  <text x="442" y="327" text-anchor="middle" font-size="13.5" font-weight="700" fill="#3a4f93">不做 Norm · 不做 RoPE 直通</text>

  <!-- KV Cache 盒 + GQA 因果打分汇合 -->
  <path d="M 536 106 L 568 106" fill="none" stroke="#087f73" stroke-width="2" marker-end="url(#aq-arr-t)"/>
  <path d="M 536 208 L 568 208" fill="none" stroke="#c78300" stroke-width="2" marker-end="url(#aq-arr-a)"/>

  <rect x="572" y="54" width="174" height="304" rx="9" fill="#f7e7f2" stroke="#9a4b86" stroke-width="1.6"/>
  <text x="659" y="82" text-anchor="middle" font-size="15" font-weight="700" fill="#7a3a6a">GQA 打分与汇合</text>
  <text x="659" y="105" text-anchor="middle" font-size="13.5" font-family="var(--font-mono)" font-weight="700" fill="#17211f">FIA / PA 算子</text>

  <rect x="586" y="118" width="146" height="58" rx="6" fill="#ffffff" stroke="#087f73" stroke-width="1.3"/>
  <text x="659" y="142" text-anchor="middle" font-size="13.5" font-weight="700" fill="#065f56">缩放 1/√128 ≈ 0.0884</text>
  <text x="659" y="164" text-anchor="middle" font-size="13" fill="#4d5652">因果 sparse_mode = 3</text>

  <rect x="586" y="190" width="146" height="72" rx="6" fill="#e8edff" stroke="#4c65b6" stroke-width="1.4"/>
  <text x="659" y="214" text-anchor="middle" font-size="13.5" font-weight="700" fill="#3a4f93">128-tok KV Cache</text>
  <text x="659" y="236" text-anchor="middle" font-size="13" fill="#17211f">存 8 组 K(已转) 与 V</text>
  <text x="659" y="255" text-anchor="middle" font-size="13" fill="#3a4f93">4 Q 头共读同一组</text>

  <rect x="586" y="276" width="146" height="68" rx="6" fill="#ffffff" stroke="#9a4b86" stroke-width="1.3"/>
  <text x="659" y="300" text-anchor="middle" font-size="13.5" font-weight="700" fill="#7a3a6a">各头加权汇合 V</text>
  <text x="659" y="322" text-anchor="middle" font-size="13.5" font-family="var(--font-mono)" fill="#17211f">[T, 32, 128]</text>
  <text x="659" y="339" text-anchor="middle" font-size="13" fill="#4d5652">拼回 [T, 4096]</text>

  <!-- 右端：o_proj 输出 -->
  <path d="M 746 207 L 774 207" fill="none" stroke="#9a4b86" stroke-width="2" marker-end="url(#aq-arr-p)"/>
  <rect x="778" y="148" width="110" height="118" rx="8" fill="#ddf4ef" stroke="#087f73" stroke-width="1.6"/>
  <text x="833" y="179" text-anchor="middle" font-size="15" font-weight="700" fill="#065f56">o_proj</text>
  <text x="833" y="204" text-anchor="middle" font-size="13.5" font-family="var(--font-mono)" font-weight="700" fill="#17211f">[T, 4096]</text>
  <text x="833" y="229" text-anchor="middle" font-size="13.5" fill="#4d5652">无偏置投影</text>
  <text x="833" y="250" text-anchor="middle" font-size="13.5" fill="#065f56">交回单残差</text>

  <!-- 底部口径注 -->
  <rect x="12" y="378" width="876" height="56" rx="8" fill="#ece9df" stroke="#b8bcb5" stroke-width="1.3"/>
  <text x="450" y="402" text-anchor="middle" font-size="14" font-weight="700" fill="#17211f">关键顺序：投影（均 bias=false）→ <tspan fill="#065f56">逐头 QK-Norm</tspan> → <tspan fill="#936300">全维 RoPE</tspan> → <tspan fill="#3a4f93">写 KV 缓存</tspan> → <tspan fill="#7a3a6a">GQA 打分汇合</tspan></text>
  <text x="450" y="424" text-anchor="middle" font-size="13.5" fill="#4d5652">全 36 层同构；Q 头共享 q_norm [128] 增益、K 头共享另一套独立 k_norm [128] 增益；V 既不归一也不旋转</text>
</svg>
