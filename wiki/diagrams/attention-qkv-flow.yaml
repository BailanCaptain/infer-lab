layout: figure
id: attention-qkv-flow
caption: attention 的一次计算（3 个位置、每条向量 4 个数，数为示意）：① 每个位置的隐藏向量乘三套权重，得到 q、k、v；② 位置 2 的 q₂ 与每个 k 做点积；③ 除以 √4 后做 softmax，得到加起来等于 1 的权重；④ 各行 v 乘上自己的权重，按列相加得到输出 o₂
