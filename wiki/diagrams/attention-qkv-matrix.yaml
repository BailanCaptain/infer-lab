    rows: 3
    cols: 3
    cell: [52, 28]
    tone: token
    style: faded
    label: 分数（遮住未来）
    cells:
      - { at: [0, 0], text: '1' }
      - { at: [0, 1], text: '−∞', tone: danger, style: ghost }
      - { at: [0, 2], text: '−∞', tone: danger, style: ghost }
      - { at: [1, 0], text: '0.5' }
      - { at: [1, 1], text: '0.5' }
      - { at: [1, 2], text: '−∞', tone: danger, style: ghost }
      - { at: [2, 0], text: '2', style: solid }
      - { at: [2, 1], text: '1', style: solid }
      - { at: [2, 2], text: '0', style: solid }
