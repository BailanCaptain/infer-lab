      - { at: [2, 0], text: '1' }
      - { at: [2, 1], text: '1' }
      - { at: [2, 2], text: '0' }
      - { at: [2, 3], text: '2' }
  - at: [510, 262]
    rows: 3
    cols: 4
    cell: [44, 28]
    tone: token
    style: faded
    rowLabels: ['o₀', 'o₁', 'o₂']
    label: 输出
    cells:
      - { at: [0, 0], text: '1' }
      - { at: [0, 1], text: '0' }
      - { at: [0, 2], text: '2' }
      - { at: [0, 3], text: '0' }
      - { at: [1, 0], text: '0.5' }
      - { at: [1, 1], text: '0.5' }
      - { at: [1, 2], text: '1.5' }
      - { at: [1, 3], text: '0.5' }
      - { at: [2, 0], text: '0.76', style: solid }
      - { at: [2, 1], text: '0.33', style: solid }
      - { at: [2, 2], text: '1.58', style: solid }
      - { at: [2, 3], text: '0.42', style: solid }
