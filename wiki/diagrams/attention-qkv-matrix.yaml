layout: figure
id: attention-qkv-matrix
caption: 三个位置一起算（数为示意）：Q 乘 K 的转置一次得到全部点积，除以 √4，把未来位置遮成 −∞，每行做 softmax 得到权重，再乘 V 得到每个位置的输出；深色的第 3 行就是位置 2 一步步算出的那一行
size: [900, 390]
grids:
  - at: [60, 60]
    rows: 3
    cols: 4
    cell: [38, 28]
    tone: token
    style: faded
    rowLabels: ['q₀', 'q₁', 'q₂']
    label: Q
    cells:
      - { at: [0, 0], text: '1' }
      - { at: [0, 1], text: '0' }
      - { at: [0, 2], text: '1' }
      - { at: [0, 3], text: '0' }
      - { at: [1, 0], text: '0' }
      - { at: [1, 1], text: '1' }
      - { at: [1, 2], text: '0' }
      - { at: [1, 3], text: '1' }
      - { at: [2, 0], text: '1', style: solid }
      - { at: [2, 1], text: '2', style: solid }
      - { at: [2, 2], text: '0', style: solid }
      - { at: [2, 3], text: '1', style: solid }
  - at: [262, 46]
    rows: 4
    cols: 3
    cell: [38, 28]
    tone: kv
    style: faded
    colLabels: ['k₀', 'k₁', 'k₂']
    label: K 的转置
    cells:
      - { at: [0, 0], text: '2' }
      - { at: [0, 1], text: '0' }
      - { at: [0, 2], text: '1' }
      - { at: [1, 0], text: '1' }
      - { at: [1, 1], text: '1' }
      - { at: [1, 2], text: '0' }
      - { at: [2, 0], text: '0' }
      - { at: [2, 1], text: '1' }
      - { at: [2, 2], text: '1' }
      - { at: [3, 0], text: '0' }
      - { at: [3, 1], text: '0' }
      - { at: [3, 2], text: '−1' }
  - at: [424, 60]
    rows: 3
    cols: 3
    cell: [44, 28]
    tone: token
    style: faded
    label: 点积
    cells:
      - { at: [0, 0], text: '2' }
      - { at: [0, 1], text: '1' }
      - { at: [0, 2], text: '2' }
      - { at: [1, 0], text: '1' }
      - { at: [1, 1], text: '1' }
      - { at: [1, 2], text: '−1' }
      - { at: [2, 0], text: '4', style: solid }
      - { at: [2, 1], text: '2', style: solid }
      - { at: [2, 2], text: '0', style: solid }
