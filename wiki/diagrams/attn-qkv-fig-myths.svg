<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 498" width="900" height="498" role="img" aria-label="Attention 与 Q/K/V 五组常见误解与源码真相排障对照板" font-family="var(--font-sans)">
  <title>Attention 与 Q/K/V 五组常见认知误区 vs 论文与 v0.30.0 源码真相排障对照板。</title>
  <desc>五排开放式对照：1. Q/K/V 由同一隐藏向量乘三套矩阵现算，K 与 V 分工不同；2. 1/√d 由模型传入，按单头 q·k 宽度算而非缓存潜向量宽度；3. Prefill 同样加因果掩码，DCP 传 sparse_mode=0 是因索引已筛选重映射；4. Decode 只算新位置 q/k/v，历史读缓存；5. KDA 同样投影 q/k/v 但走定长状态递推而非逐位置 Softmax。</desc>
  <defs>
    <marker id="aqm-arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto">
      <path d="M 0 1.5 L 8.5 5 L 0 8.5 z" fill="#087f73"/>
    </marker>
  </defs>

  <text x="14" y="30" font-size="16" font-weight="700" fill="#8f3229">✗ 常见错误直觉（高频踩坑点）</text>
  <text x="392" y="30" font-size="16" font-weight="700" fill="#065f56">✓ 论文与 v0.30.0 源码真相（算账与排障判据）</text>
  <line x1="12" y1="42" x2="888" y2="42" stroke="#b8bcb5" stroke-width="1.4"/>
  <line x1="378" y1="12" x2="378" y2="486" stroke="#b8bcb5" stroke-width="1.3" stroke-dasharray="5 4"/>

  <g fill="#fff0e9" stroke="#b54237" stroke-width="1.4">
    <rect x="12" y="54" width="354" height="76" rx="9"/>
    <rect x="12" y="142" width="354" height="76" rx="9"/>
    <rect x="12" y="230" width="354" height="76" rx="9"/>
    <rect x="12" y="318" width="354" height="76" rx="9"/>
    <rect x="12" y="406" width="354" height="76" rx="9"/>
  </g>
  <g fill="#ffffff" stroke="#087f73" stroke-width="1.5">
    <rect x="392" y="54" width="496" height="76" rx="9"/>
    <rect x="392" y="142" width="496" height="76" rx="9"/>
    <rect x="392" y="230" width="496" height="76" rx="9"/>
    <rect x="392" y="318" width="496" height="76" rx="9"/>
    <rect x="392" y="406" width="496" height="76" rx="9"/>
  </g>
  <g fill="none" stroke="#087f73" stroke-width="2" marker-end="url(#aqm-arr)">
    <path d="M 366 92 L 386 92"/>
    <path d="M 366 180 L 386 180"/>
    <path d="M 366 268 L 386 268"/>
    <path d="M 366 356 L 386 356"/>
    <path d="M 366 444 L 386 444"/>
  </g>

  <text x="26" y="81" font-size="15" font-weight="700" fill="#8f3229">1. Q、K、V 是输入里现成的三份数据</text>
  <text x="26" y="110" font-size="13.5" fill="#8f3229">以为位置最像自己、K 与 V 装同样内容</text>

  <text x="26" y="169" font-size="15" font-weight="700" fill="#8f3229">2. 除以 √d 可省，或按缓存总宽缩放</text>
  <text x="26" y="198" font-size="13.5" fill="#8f3229">见潜向量 512 维就按 1/√512 算缩放</text>

  <text x="26" y="257" font-size="15" font-weight="700" fill="#8f3229">3. Prefill 可看全文，仅生成加掩码</text>
  <text x="26" y="286" font-size="13.5" fill="#8f3229">或见传 sparse_mode=0 就当取消因果限制</text>

  <text x="26" y="345" font-size="15" font-weight="700" fill="#8f3229">4. Decode 每步重算全部历史 Q/K/V</text>
  <text x="26" y="374" font-size="13.5" fill="#8f3229">或见 64 个查询头就按 64 份 K/V 算缓存</text>

  <text x="26" y="433" font-size="15" font-weight="700" fill="#8f3229">5. 有 q/k/v 投影就是 Softmax 注意力</text>
  <text x="26" y="462" font-size="13.5" fill="#8f3229">且把位置 Softmax 等同于词表采样概率</text>

  <text x="408" y="81" font-size="15" font-weight="700" fill="#065f56">同一隐藏向量乘 W_Q、W_K、W_V 三套权重现算</text>
  <text x="408" y="110" font-size="13.5" fill="#4d5652">K 管匹配打分、V 管被读内容；qᵢ·kᵢ 未必最大（如例中为 0）</text>

  <text x="408" y="169" font-size="15" font-weight="700" fill="#065f56"><tspan font-family="var(--font-mono)" font-size="14" fill="#7a3a6a">scale</tspan> 由模型传入 <tspan font-family="var(--font-mono)" font-size="14" fill="#7a3a6a">Attention</tspan>，按单头 q·k 宽度算</text>
  <text x="408" y="198" font-size="13.5" fill="#4d5652">GLM 稀疏 MLA 按 <tspan font-family="var(--font-mono)" font-size="13.5" font-weight="600">qk_head_dim=256</tspan> 取 1/√256 = 0.0625</text>

  <text x="408" y="257" font-size="15" font-weight="700" fill="#065f56">Prefill 同样遮蔽未来位置，对齐训练与逐步生成</text>
  <text x="408" y="286" font-size="13.5" fill="#4d5652">DCP 下索引器已筛选，<tspan font-family="var(--font-mono)" font-size="13.5" font-weight="600">_remap_sparse_indices</tspan> 后才传 0</text>

  <text x="408" y="345" font-size="15" font-weight="700" fill="#065f56">仅新位置算 q/k/v；旧 K/V 读缓存，旧 q 作废</text>
  <text x="408" y="374" font-size="13.5" fill="#4d5652">GQA 多头共享 KV；稀疏 MLA 每位置存 <tspan font-family="var(--font-mono)" font-size="13.5" font-weight="600">kv_lora_rank=512</tspan></text>

  <text x="408" y="433" font-size="15" font-weight="700" fill="#065f56">KDA 也投影 q/k/v，但走 128×128 定长状态递推</text>
  <text x="408" y="462" font-size="13.5" fill="#4d5652">无逐位置 Softmax；注意力沿位置归一，采样沿词表归一</text>
</svg>
