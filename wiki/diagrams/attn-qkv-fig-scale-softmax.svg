<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 436" width="900" height="436" role="img" aria-label="1/√d_h 缩放与因果掩码可见域图" font-family="var(--font-sans)">
<title>1/√d_h 缩放与因果掩码联合机制图</title>
<desc>左栏以 Qwen3 标准 d_h=128 对比未缩放与乘 1/√128；右栏展示下三角因果掩码与 sparse_mode=3。</desc>
<g font-weight="700" fill="#17211f">
<text x="16" y="30" font-size="16">1/√d_h 缩放：抑制点积方差 d_h 引发的饱和</text>
<text x="462" y="30" font-size="16">因果掩码：下三角可见域与右下对齐裁剪</text>
</g>
<line x1="14" y1="44" x2="886" y2="44" stroke="#b8bcb5" stroke-width="1.4"/>
<line x1="444" y1="14" x2="444" y2="422" stroke="#b8bcb5" stroke-width="1.4" stroke-dasharray="6 4"/>
<rect x="16" y="56" width="410" height="58" rx="7" fill="#fff4cf" stroke="#c78300" stroke-width="1.4"/>
<text x="28" y="80" font-size="14.5" font-weight="700" fill="#936300">q、k 各维均值 0、方差 1 → 点积方差 Var = d_h</text>
<text x="28" y="103" font-size="13.5" fill="#4d5652">Qwen3 标准 d_h = 128，标准差 √128 ≈ 11.31</text>
<rect x="16" y="128" width="410" height="94" rx="8" fill="#fff0e9" stroke="#b54237" stroke-width="1.4"/>
<g fill="#8f3229">
<text x="28" y="153" font-size="15" font-weight="700">✗ 不除以 √128：分数 [11.31, 0] 直送 Softmax</text>
<text x="260" y="180" font-size="13.5" font-weight="700">e¹¹·³¹:e⁰ ≈ 8.2×10⁴</text>
<text x="28" y="208" font-size="13.5">近似 one-hot 赢家通吃，梯度趋近 0、低精度饱和</text>
</g>
<rect x="28" y="167" width="218" height="16" rx="3" fill="#b54237"/>
<rect x="250" y="167" width="4" height="16" rx="1" fill="#d8d8cf"/>
<rect x="16" y="236" width="410" height="94" rx="8" fill="#ddf4ef" stroke="#087f73" stroke-width="1.5"/>
<g fill="#065f56">
<text x="28" y="261" font-size="15" font-weight="700">✓ 乘 1/√128 ≈ 0.0884：分数拉回 [1, 0]</text>
<text x="268" y="288" font-size="13.5" font-weight="700">e¹:e⁰ ≈ 2.72 : 1</text>
<text x="28" y="316" font-size="13.5">方差回到 1，可见位置按真实相关度平滑分摊</text>
</g>
<rect x="28" y="275" width="166" height="16" rx="3" fill="#087f73"/>
<rect x="198" y="275" width="62" height="16" rx="3" fill="#4c65b6"/>
<rect x="16" y="344" width="410" height="74" rx="8" fill="#fbfaf6" stroke="#b8bcb5" stroke-width="1.3"/>
<text x="28" y="370" font-size="14.5" font-weight="700" fill="#17211f">模型定义铁律：scale = head_dim^(-0.5)</text>
<text x="28" y="398" font-size="13.5" fill="#4d5652">Qwen3 统一取 d_h = 128（异构 MLA 按 q·k 宽另算）</text>
<text x="462" y="70" font-size="13.5" fill="#4d5652">Softmax 前把未来键位置设为 -∞，exp(-∞) = 0</text>
<g text-anchor="middle" font-family="var(--font-mono)" font-weight="700" fill="#3a4f93">
<text x="536" y="102" font-size="14">k₀</text>
<text x="612" y="102" font-size="14">k₁</text>
<text x="688" y="102" font-size="14">k₂</text>
</g>
<g text-anchor="end" font-family="var(--font-mono)" font-weight="700" fill="#065f56">
<text x="490" y="140" font-size="14">q₀</text>
<text x="490" y="192" font-size="14">q₁</text>
<text x="490" y="244" font-size="14">q₂</text>
</g>
<g fill="#ddf4ef" stroke="#087f73" stroke-width="1.4">
<rect x="502" y="112" width="68" height="44" rx="6"/>
<rect x="502" y="164" width="68" height="44" rx="6"/>
<rect x="578" y="164" width="68" height="44" rx="6"/>
<rect x="502" y="216" width="68" height="44" rx="6"/>
<rect x="578" y="216" width="68" height="44" rx="6"/>
<rect x="654" y="216" width="68" height="44" rx="6"/>
</g>
<g fill="#fff0e9" stroke="#b54237" stroke-width="1.3" stroke-dasharray="4 3">
<rect x="578" y="112" width="68" height="44" rx="6"/>
<rect x="654" y="112" width="68" height="44" rx="6"/>
<rect x="654" y="164" width="68" height="44" rx="6"/>
</g>
<g text-anchor="middle" font-weight="700" fill="#065f56">
<text x="536" y="139" font-size="14">1.00</text>
<text x="536" y="191" font-size="14">0.50</text>
<text x="612" y="191" font-size="14">0.50</text>
<text x="536" y="243" font-size="14">0.67</text>
<text x="612" y="243" font-size="14">0.24</text>
<text x="688" y="243" font-size="14">0.09</text>
</g>
<g text-anchor="middle" font-weight="700" fill="#8f3229">
<text x="612" y="139" font-size="13.5">-∞→0</text>
<text x="688" y="139" font-size="13.5">-∞→0</text>
<text x="688" y="191" font-size="13.5">-∞→0</text>
</g>
<g font-weight="700">
<text x="738" y="132" font-size="14.5" fill="#065f56">下三角可见</text>
<text x="738" y="189" font-size="14.5" fill="#8f3229">右上角置 -∞</text>
<text x="738" y="244" font-size="14.5" fill="#3a4f93">每行和仍为 1</text>
<text x="476" y="322" font-size="14.5" fill="#3a4f93">昇腾算子契约：sparse_mode = 3（右下对齐因果）</text>
</g>
<g fill="#4d5652">
<text x="738" y="153" font-size="13.5">位置 i 读 0..i</text>
<text x="738" y="210" font-size="13.5">防偷看未来答案</text>
<text x="738" y="265" font-size="13.5">可见项重归一化</text>
<text x="476" y="381" font-size="13.5">滑窗传 4、无掩码传 0；DCP 索引已裁剪后改传 0</text>
</g>
<line x1="464" y1="300" x2="464" y2="414" stroke="#4c65b6" stroke-width="3"/>
<text x="476" y="352" font-size="13.5" fill="#17211f">T 个查询对齐 S 个键末尾：第 r 行看 0..S-T+r</text>
<text x="476" y="410" font-size="13.5" fill="#66716d">Prefill 整段送入与 Decode 逐步生成共用同一约束</text>
</svg>
