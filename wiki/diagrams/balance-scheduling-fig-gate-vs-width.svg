<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 532" width="900" height="532" role="img" aria-label="Balance Scheduling 双通道主循环防死锁、四组顶满落闸柱状图与 GLM 场景 M 步宽盲区对比">
  <title>Balance Scheduling：主循环互报防死锁、四组落闸机制与 GLM 场景 M 步宽盲区</title>
  <desc>上部用双通道流程图说明为何每步 CPU gloo All-Gather 必须挂在引擎主循环 _has_global_unfinished_reqs 之后（确保不进调度器的空闲陪跑组也到场，避免死锁）；下部左侧用 4 组柱状图展示 [8,3,5,2] 顶到上限 8 时全组落闸冻结 14 个名额，右侧用条数视角与步宽视角双图对照 GLM 场景 M（12 小于 32 不落闸，但 DP1 仍被拉宽至 6048 退回 eager）；底栏汇总 v0.30.0/main 互斥与配置边界。</desc>
  <defs>
    <marker id="bs-arr-teal" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto">
      <path d="M 1 1.5 L 8.5 5 L 1 8.5 z" fill="#087f73" />
    </marker>
    <marker id="bs-arr-plum" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto">
      <path d="M 1 1.5 L 8.5 5 L 1 8.5 z" fill="#9a4b86" />
    </marker>
    <marker id="bs-arr-amber" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto">
      <path d="M 1 1.5 L 8.5 5 L 1 8.5 z" fill="#c78300" />
    </marker>
  </defs>

  <!-- Header -->
  <text x="16" y="26" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="16" font-weight="700" fill="#17211f">Balance Scheduling：主循环互报防死锁与“只数条数”的管辖边界</text>
  <text x="16" y="46" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="13.5" fill="#4d5652">互报挂在引擎主循环末尾确保陪跑组必到场；下步准入只拦顶满（max == cap），看不见长短与步宽浪费</text>
  <line x1="16" y1="58" x2="884" y2="58" stroke="#d8d8cf" stroke-width="1" />

  <!-- ========== SECTION 1: 2-Lane EngineCore Loop Swimlane ========== -->
  <text x="16" y="78" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="14.5" font-weight="700" fill="#17211f">一、为什么互报必须挂在主循环而非调度器？（双泳道防死锁）</text>

  <!-- Lane 1: Busy DP0 -->
  <rect x="16" y="92" width="84" height="44" rx="6" fill="#ddf4ef" stroke="#087f73" stroke-width="1.3" />
  <text x="58" y="119" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="13.5" font-weight="700" text-anchor="middle" fill="#065f56">有活 DP0</text>

  <path d="M 100 114 L 122 114" fill="none" stroke="#087f73" stroke-width="1.6" marker-end="url(#bs-arr-teal)" />

  <rect x="128" y="88" width="246" height="52" rx="7" fill="#ddf4ef" stroke="#087f73" stroke-width="1.4" />
  <text x="251" y="109" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="13.5" font-weight="700" text-anchor="middle" fill="#065f56">进入调度器（含共同闸门）</text>
  <text x="251" y="130" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="13.5" text-anchor="middle" fill="#4d5652">① 本地满? → ② max==cap 拦 waiting</text>

  <path d="M 374 114 L 398 114" fill="none" stroke="#087f73" stroke-width="1.6" marker-end="url(#bs-arr-teal)" />

  <rect x="404" y="92" width="160" height="44" rx="6" fill="#fff4cf" stroke="#c78300" stroke-width="1.3" />
  <text x="484" y="119" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="13.5" font-weight="700" text-anchor="middle" fill="#936300">真实批前向 + MoE</text>

  <!-- Lane 2: Idle Escort DP1 -->
  <rect x="16" y="160" width="84" height="44" rx="6" fill="#ece9df" stroke="#b8bcb5" stroke-width="1.3" />
  <text x="58" y="187" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="13.5" font-weight="700" text-anchor="middle" fill="#4d5652">空闲 DP1</text>

  <!-- Bypass path skipping scheduler! -->
  <path d="M 100 182 L 398 182" fill="none" stroke="#c78300" stroke-width="1.8" stroke-dasharray="6 4" marker-end="url(#bs-arr-amber)" />
  <rect x="138" y="164" width="226" height="28" rx="5" fill="#fff0e9" stroke="#b54237" stroke-width="1.2" />
  <text x="251" y="183" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="13.5" font-weight="700" text-anchor="middle" fill="#8f3229">跳过调度器！（放里面会死锁）</text>

  <rect x="404" y="160" width="160" height="44" rx="6" fill="#fff4cf" stroke="#c78300" stroke-width="1.3" stroke-dasharray="4 3" />
  <text x="484" y="187" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="13.5" font-weight="700" text-anchor="middle" fill="#936300">dummy batch 陪跑</text>

  <!-- Convergence lines to post-step barrier -->
  <path d="M 564 114 L 588 114 L 588 148 L 610 148" fill="none" stroke="#9a4b86" stroke-width="1.8" marker-end="url(#bs-arr-plum)" />
  <path d="M 564 182 L 588 182 L 588 148" fill="none" stroke="#9a4b86" stroke-width="1.8" />

  <!-- Post-step All-Gather Checkpoint -->
  <rect x="616" y="88" width="268" height="116" rx="8" fill="#f7e7f2" stroke="#9a4b86" stroke-width="1.5" />
  <text x="750" y="112" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="14" font-weight="700" text-anchor="middle" fill="#7a3a6a">步末必经点：每圈都到场</text>
  <text x="750" y="136" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13.5" font-weight="600" text-anchor="middle" fill="#17211f">_has_global_unfinished_reqs</text>
  <text x="750" y="160" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="13.5" text-anchor="middle" fill="#4d5652">紧跟 CPU gloo All-Gather(len(running))</text>
  <text x="750" y="186" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="13.5" font-weight="700" text-anchor="middle" fill="#7a3a6a">人人拿到同一张 balance_queue 供下步判闸</text>

  <line x1="16" y1="218" x2="884" y2="218" stroke="#d8d8cf" stroke-width="1" />
  <line x1="444" y1="226" x2="444" y2="472" stroke="#d8d8cf" stroke-width="1" />

  <!-- ========== SECTION 2 LEFT: Vertical Bar Chart (4 groups cap=8) ========== -->
  <text x="16" y="242" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="14.5" font-weight="700" fill="#065f56">二（左）、✓ 管得到：顶满上限即全组落闸</text>
  <text x="16" y="264" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="13.5" fill="#4d5652">4 组每组上限 8，当前 [8, 3, 5, 2] → max=8 触发停收</text>

  <!-- Ceiling line y=288 (height 120px down to baseline y=408, 15px/req) -->
  <line x1="24" y1="288" x2="320" y2="288" stroke="#b54237" stroke-width="1.6" stroke-dasharray="6 4" />
  <text x="328" y="293" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13.5" font-weight="700" fill="#8f3229">cap = 8</text>
  <line x1="24" y1="408" x2="320" y2="408" stroke="#4d5652" stroke-width="1.4" />

  <!-- DP0: 8/8 FULL -->
  <rect x="38" y="288" width="52" height="120" rx="4" fill="#fff0e9" stroke="#b54237" stroke-width="1.5" />
  <text x="64" y="348" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="14" font-weight="700" text-anchor="middle" fill="#8f3229">8/8</text>
  <text x="64" y="370" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="13.5" font-weight="700" text-anchor="middle" fill="#8f3229">顶满</text>
  <text x="64" y="428" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13.5" text-anchor="middle" fill="#17211f">DP0</text>

  <!-- DP1: 3/8 + 5 frozen -->
  <rect x="108" y="288" width="52" height="75" rx="4" fill="#ece9df" fill-opacity="0.55" stroke="#b54237" stroke-width="1.1" stroke-dasharray="3 3" />
  <text x="134" y="330" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="13.5" text-anchor="middle" fill="#8f3229">空 5</text>
  <rect x="108" y="363" width="52" height="45" rx="4" fill="#ddf4ef" stroke="#087f73" stroke-width="1.3" />
  <text x="134" y="391" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13.5" font-weight="700" text-anchor="middle" fill="#065f56">3</text>
  <text x="134" y="428" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13.5" text-anchor="middle" fill="#17211f">DP1</text>

  <!-- DP2: 5/8 + 3 frozen -->
  <rect x="178" y="288" width="52" height="45" rx="4" fill="#ece9df" fill-opacity="0.55" stroke="#b54237" stroke-width="1.1" stroke-dasharray="3 3" />
  <text x="204" y="316" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="13.5" text-anchor="middle" fill="#8f3229">空 3</text>
  <rect x="178" y="333" width="52" height="75" rx="4" fill="#ddf4ef" stroke="#087f73" stroke-width="1.3" />
  <text x="204" y="376" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13.5" font-weight="700" text-anchor="middle" fill="#065f56">5</text>
  <text x="204" y="428" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13.5" text-anchor="middle" fill="#17211f">DP2</text>

  <!-- DP3: 2/8 + 6 frozen -->
  <rect x="248" y="288" width="52" height="90" rx="4" fill="#ece9df" fill-opacity="0.55" stroke="#b54237" stroke-width="1.1" stroke-dasharray="3 3" />
  <text x="274" y="338" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="13.5" text-anchor="middle" fill="#8f3229">空 6</text>
  <rect x="248" y="378" width="52" height="30" rx="4" fill="#ddf4ef" stroke="#087f73" stroke-width="1.3" />
  <text x="274" y="398" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13.5" font-weight="700" text-anchor="middle" fill="#065f56">2</text>
  <text x="274" y="428" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13.5" text-anchor="middle" fill="#17211f">DP3</text>

  <!-- Summary note beside bars -->
  <text x="328" y="332" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="13.5" font-weight="700" fill="#8f3229">14 名额空置</text>
  <text x="328" y="356" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="13.5" fill="#4d5652">防新 prefill</text>
  <text x="328" y="378" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="13.5" fill="#4d5652">拉宽步长，</text>
  <text x="328" y="400" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="13.5" fill="#065f56">等 DP0→7 抬闸</text>

  <text x="16" y="458" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="13.5" fill="#4d5652">已有 running 照常算；不搬请求，也不把低组“追平”</text>

  <!-- ========== SECTION 2 RIGHT: GLM Scene M Blind Spot (Count vs Width) ========== -->
  <text x="460" y="242" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="14.5" font-weight="700" fill="#8f3229">二（右）、✗ 管不到：GLM 场景 M 条数未满但宽度爆偏</text>
  <text x="460" y="264" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="13.5" fill="#4d5652">闸门只看条数视角（左），看不见 MoE 真实步宽视角（下）</text>

  <!-- Sub-chart A: Request Count View (cap=32 -> 256px from x=528 to x=784) -->
  <text x="460" y="289" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="13.5" font-weight="700" fill="#17211f">视角 A：条数（cap = 32）</text>
  <line x1="784" y1="296" x2="784" y2="358" stroke="#b54237" stroke-width="1.5" stroke-dasharray="5 3" />
  <text x="794" y="330" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13.5" font-weight="700" fill="#8f3229">cap=32</text>

  <text x="460" y="317" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13.5" fill="#17211f">DP0</text>
  <rect x="506" y="300" width="104" height="22" rx="4" fill="#ddf4ef" stroke="#087f73" stroke-width="1.2" />
  <text x="618" y="316" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13.5" font-weight="700" fill="#065f56">12 / 32</text>

  <text x="460" y="347" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13.5" fill="#17211f">DP1</text>
  <rect x="506" y="330" width="60" height="22" rx="4" fill="#ddf4ef" stroke="#087f73" stroke-width="1.2" />
  <text x="574" y="346" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13.5" font-weight="700" fill="#065f56">7 / 32</text>
  <text x="642" y="346" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="13.5" font-weight="700" fill="#8f3229">max=12&lt;32 不落闸</text>

  <!-- Sub-chart B: Real Step-Width Token View (6048 -> 332px from x=506 to x=838) -->
  <text x="460" y="382" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="13.5" font-weight="700" fill="#8f3229">视角 B：实际步宽（token）</text>

  <text x="460" y="408" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13.5" fill="#17211f">DP0</text>
  <rect x="506" y="391" width="332" height="24" rx="4" fill="#fff4cf" stroke="#c78300" stroke-width="1.3" />
  <text x="672" y="408" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="13.5" font-weight="700" text-anchor="middle" fill="#936300">48 decode + 6,000 prefill = 6,048 tok</text>

  <text x="460" y="440" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13.5" fill="#17211f">DP1</text>
  <rect x="506" y="423" width="12" height="24" rx="2" fill="#087f73" />
  <rect x="520" y="423" width="318" height="24" rx="4" fill="#fff0e9" stroke="#b54237" stroke-width="1.3" stroke-dasharray="5 3" />
  <text x="679" y="440" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="13.5" font-weight="700" text-anchor="middle" fill="#8f3229">真实仅 28 tok → 被强行补齐至 6,048 退回 eager!</text>

  <text x="460" y="466" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="13.5" fill="#4d5652">看不见长度与 KV 块压力 → 解码侧按 KV 均衡须改用 DyntraLB</text>

  <!-- ========== FOOTER STRIP: v0.30.0 / main Mutual Exclusion ========== -->
  <rect x="16" y="484" width="868" height="38" rx="6" fill="#e8edff" stroke="#4c65b6" stroke-width="1.2" />
  <text x="450" y="508" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="13.5" font-weight="600" text-anchor="middle" fill="#3a4f93">v0.30.0 / main 边界：仅 PD 混部 + MoE + DP&gt;1 · 与 DyntraLB（优先）/ profiling_chunk 互斥 · 原环境变量已删，写 scheduler_config</text>
</svg>
