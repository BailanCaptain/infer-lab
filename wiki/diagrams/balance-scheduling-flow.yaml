layout: figure
id: balance-scheduling-flow
caption: 左边是每组引擎每步转的一圈，右边是其中调度接纳 waiting 的循环；红框是闸门，左下角是互报，虚线是下一步读计数表。
size: [900, 650]
frames:
  - { at: [20, 60], size: [400, 530], label: EngineCore 主循环 · 每组一个，每步一圈, inside: true }
  - { at: [470, 60], size: [410, 530], label: 调度器接纳 waiting（主线第 2 站）, inside: true }
items:
  - { at: [50, 100], size: [340, 50], text: 处理输入队列, sub: 新请求先进本组 waiting, style: plain }
  - { at: [50, 180], size: [340, 56], text: 调度并执行一步, sub: 右边这一段就在这里面, tone: weight }
  - { at: [50, 266], size: [340, 56], text: 这一步本地没算到东西？, sub: 是：全局还有活就陪跑一步（dummy batch）, tone: control }
  - { at: [50, 352], size: [340, 56], text: 全局还有没有活, sub: 每 32 步才真跨组同步一次, style: plain }
  - { at: [50, 438], size: [340, 64], text: 互报 running 条数，写进计数表, sub: All-Gather · 每步一次 · 陪跑的组也到场, tone: comm }
  - { at: [500, 100], size: [350, 50], text: 开关打开了吗？, sub: 没开：整段交回上游原版调度, style: plain }
  - { at: [500, 180], size: [350, 56], text: 先续 running, sub: 每条排上这一步要算的 token, tone: token }
  - { at: [500, 266], size: [350, 56], text: 本组 running 满了？, sub: 满了就停止接纳（上游原有）, style: plain }
  - { at: [500, 352], size: [350, 64], text: 计数表里最大值 = 上限？, sub: 是就停止接纳（Balance 闸门）, tone: danger }
  - { at: [500, 446], size: [350, 56], text: 取一条 waiting, sub: token 预算和 KV 块都够才进 running, tone: token }
