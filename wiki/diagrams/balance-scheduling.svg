<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 620" width="900" height="620" role="img" aria-label="每步一次 all_gather 收齐各 rank 在跑的条数；只要有一个 rank 顶到上限，所有 rank 这一步都不再从 waiting 放人进来">
  <title>每步一次 all_gather 收齐各 rank 在跑的条数；只要有一个 rank 顶到上限，所有 rank 这一步都不再从 waiting 放人进来</title>
  <rect width="900" height="620" fill="var(--color-surface, #fbfaf6)"/>
  <rect x="20" y="20" width="860" height="300" rx="12" fill="var(--color-surface-sunken, #ece9df)"/>
  <rect x="36" y="34" width="314.7" height="26.5" rx="13.3" fill="var(--color-control, #5b6763)"/><text x="47" y="52.1" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="13.5" font-weight="700" fill="var(--color-ink-inverse, #ffffff)">4 个 DP rank，各有一份自己的 running 集合</text>
  <text x="38" y="77" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="12.5" font-weight="400" fill="var(--color-ink-muted, #5b6763)">这张图按 max_num_seqs = 8 画：一排 8 个格子就是这个 rank 的名额，涂实的格子是此刻真在跑的请求。</text>
  <rect x="20" y="372" width="860" height="196" rx="12" fill="var(--color-weight-soft, #fff4cf)"/>
  <rect x="36" y="386" width="324.7" height="26.5" rx="13.3" fill="var(--color-weight, #b87a00)"/><text x="47" y="404.1" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="13.5" font-weight="700" fill="var(--color-ink-inverse, #ffffff)">每个 rank 各自在 waiting 循环里算同一个判断</text>
  <text x="38" y="429" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="12.5" font-weight="400" fill="var(--color-ink-muted, #5b6763)">两行插在上游那段 while 里，位置在「本 rank 满没满」那道检查之后、取队列之前。</text>
