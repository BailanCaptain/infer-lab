  - { at: [16, 290], size: [300, 175], label: DP1, inside: true }
  - { at: [594, 78], size: [290, 175], label: DP0 · 下一步, inside: true }
  - { at: [594, 290], size: [290, 175], label: DP1 · 下一步, inside: true }
grids:
  # ---- ① 本步末尾各组手上的请求
  - at: [40, 112]
    rows: 1
    cols: 4
    cell: [46, 34]
    gap: 6
    tone: token
    style: solid
    label: running 4 / 4 · 顶满
    cells:
      - { at: [0, 0], text: A }
      - { at: [0, 1], text: B }
      - { at: [0, 2], text: C }
      - { at: [0, 3], text: D }
  - at: [40, 186]
    rows: 1
    cols: 2
    cell: [46, 30]
    gap: 6
    tone: control
    style: faded
