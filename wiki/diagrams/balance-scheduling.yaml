      - { at: [0, 0], text: E }
      - { at: [0, 1], text: F }
  - at: [618, 324]
    rows: 1
    cols: 4
    cell: [46, 34]
    gap: 6
    tone: token
    style: empty
    label: 照常算 G、H · 两个空位空着
