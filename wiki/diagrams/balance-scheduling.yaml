    rows: 1
    cols: 4
    cell: [46, 34]
    gap: 6
    tone: token
    style: empty
    label: running 2 / 4 · 两个空位
    cells:
      - { at: [0, 0], text: G, style: solid }
      - { at: [0, 1], text: H, style: solid }
  - at: [40, 398]
    rows: 1
    cols: 2
    cell: [46, 30]
    gap: 6
    tone: control
    style: faded
    label: waiting · 2 条在等
    cells:
      - { at: [0, 0], text: I }
      - { at: [0, 1], text: J }
