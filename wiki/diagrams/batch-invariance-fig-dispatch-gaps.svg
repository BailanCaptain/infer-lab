<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 470" width="900" height="470" role="img" aria-label="昇腾 VLLM_BATCH_INVARIANT=1 双供应链算子派发优先级与 GLM-5.3-Flash 45 层中 34 层 KDA 与 mHC 覆盖缺口图" font-family="var(--font-sans)">
  <title>昇腾批不变双供应链派发与 GLM-5.3-Flash 覆盖缺口全景</title>
  <desc>Top: VLLM_BATCH_INVARIANT=1 global gate (disabling vllm_ascend_C, deterministic envs), main unconditional npu_add_rms_norm split before AscendC check, and AscendC vs Triton dispatch priority. Bottom: proportional 45-layer GLM-5.3-Flash strip showing 34 uncovered KDA layers (75.6%) and 11 sparse MLA layers on dedicated DSA backend (not covered by regular FIA hooks) plus mHC gate bypass</desc>
  <defs>
    <marker id="dg-arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="#4d5652"/>
    </marker>
  </defs>

  <!-- ================= TOP: GLOBAL GATE & DUAL-SUPPLY DISPATCH ================= -->
  <text x="16" y="26" font-size="16" font-weight="700" fill="#17211f">① 昇腾 VLLM_BATCH_INVARIANT=1 启动锁定链：全局门禁 + AscendC / Triton 双供应链</text>

  <!-- Left: Global Gate -->
  <rect x="16" y="42" width="276" height="176" rx="8" fill="#e8edff" stroke="#4c65b6" stroke-width="1.5"/>
  <text x="30" y="68" font-size="14.5" font-weight="700" fill="#3a4f93">全局门禁与通信确定性</text>
  <text x="30" y="94" font-family="var(--font-mono)" font-size="13.5" font-weight="700" fill="#8f3229">enable_custom_op() → False</text>
  <text x="30" y="116" font-size="13.5" fill="#17211f">跳过 vllm_ascend_C 扩展加载</text>
  <text x="30" y="140" font-family="var(--font-mono)" font-size="13.5" fill="#17211f">weight_nz_mode = 0</text>
  <text x="30" y="162" font-family="var(--font-mono)" font-size="13.5" fill="#17211f">HCCL=strict / LCCL=1</text>
  <text x="30" y="186" font-size="13.5" font-weight="700" fill="#3a4f93">v0.30.0: warn_only 确定性</text>
  <text x="30" y="206" font-size="13.5" font-weight="700" fill="#3a4f93">main: deterministic_level(3)</text>

  <line x1="292" y1="130" x2="320" y2="130" stroke="#4d5652" stroke-width="1.7" marker-end="url(#dg-arr)"/>

  <!-- Right: Unconditional main npu_add_rms_norm split + Dual Supply Dispatch Matrix (x=324..884) -->
  <rect x="324" y="40" width="560" height="46" rx="6" fill="#f7e7f2" stroke="#9a4b86" stroke-width="1.4"/>
  <text x="338" y="59" font-size="13" font-weight="700" fill="#7a3a6a">前置（main 先于 AscendC 检查）：<tspan font-family="var(--font-mono)">npu_add_rms_norm</tspan></text>
  <text x="338" y="78" font-size="13" font-weight="700" fill="#7a3a6a">拆先加后归一（v0.30.0 限 AscendC 分支）</text>

  <rect x="324" y="92" width="560" height="60" rx="8" fill="#ddf4ef" stroke="#087f73" stroke-width="1.5"/>
  <text x="338" y="114" font-size="13.5" font-weight="700" fill="#065f56">优先级 1 · AscendC 批不变库（在场时接管主算子，不挂 linear）</text>
  <text x="338" y="138" font-size="13" fill="#17211f">派发 <tspan font-family="var(--font-mono)" font-weight="700">mm / matmul / sum</tspan>（仅末维）+ 直接覆写 <tspan font-family="var(--font-mono)">FIA</tspan>（v0.30.0 拆混批 P/D）</text>

  <rect x="324" y="158" width="560" height="62" rx="8" fill="#fff4cf" stroke="#c78300" stroke-width="1.5"/>
  <text x="338" y="180" font-size="13.5" font-weight="700" fill="#936300">优先级 2 · Triton 回退核（与 AscendC 叠加补位；两套皆缺仅打警告跳过）</text>
  <text x="338" y="204" font-size="12.5" fill="#17211f">常驻 <tspan font-family="var(--font-mono)" font-weight="700">addmm/bmm/softmax</tspan>；缺 AscendC 时补 <tspan font-family="var(--font-mono)">mm/matmul/linear</tspan>（wheel 不含 csrc）</text>

  <line x1="16" y1="236" x2="884" y2="236" stroke="#b8bcb5" stroke-width="1.3" stroke-dasharray="6 4"/>

  <!-- ================= BOTTOM: GLM 45-LAYER COVERAGE STRIP & 3 GAPS ================= -->
  <text x="16" y="264" font-size="16" font-weight="700" fill="#17211f">② 放到 GLM-5.3-Flash（45 层混合架构）：为何「开了开关 ≠ 全程逐位一致」</text>

  <!-- Proportional 45-layer bar (width=868px: 34/45 = 656px KDA, 11/45 = 212px MLA) -->
  <rect x="16" y="280" width="654" height="48" rx="6" fill="#fff0e9" stroke="#b54237" stroke-width="1.6" stroke-dasharray="6 3"/>
  <text x="343" y="301" text-anchor="middle" font-size="14.5" font-weight="700" fill="#8f3229">34 层 KDA 线性注意力（75.6%）— 不在批不变替换名单内！</text>
  <text x="343" y="320" text-anchor="middle" font-size="13.5" fill="#8f3229">仍走独立 Triton KDA 核（chunk_kda / fused_recurrent_kda_fwd）</text>

  <rect x="672" y="280" width="212" height="48" rx="6" fill="#fff4cf" stroke="#c78300" stroke-width="1.5" stroke-dasharray="5 3"/>
  <text x="778" y="300" text-anchor="middle" font-size="13.5" font-weight="700" fill="#936300">11 层稀疏 MLA（DSA 专用）</text>
  <text x="778" y="319" text-anchor="middle" font-size="13.5" fill="#936300">常规 FIA 钩子未覆盖</text>

  <!-- 3 Conflict/Gap Cards below strip (y=344..456) -->
  <rect x="16" y="344" width="276" height="112" rx="8" fill="#fff4cf" stroke="#c78300" stroke-width="1.4"/>
  <text x="30" y="370" font-size="14" font-weight="700" fill="#936300">配置冲突：三项不自动关闭</text>
  <text x="30" y="395" font-size="13.5" fill="#17211f">• <tspan font-family="var(--font-mono)">chunked_prefill</tspan> 须显式关</text>
  <text x="30" y="418" font-size="13.5" fill="#17211f">• <tspan font-family="var(--font-mono)">FULL_DECODE_ONLY</tspan> 改分段</text>
  <text x="30" y="441" font-size="13.5" fill="#4d5652">• <tspan font-family="var(--font-mono)">prefix_caching</tspan> 关且防抢占</text>

  <rect x="312" y="344" width="276" height="112" rx="8" fill="#fff0e9" stroke="#b54237" stroke-width="1.4"/>
  <text x="326" y="370" font-size="14" font-weight="700" fill="#8f3229">模型缺口：mHC 绕过门禁</text>
  <text x="326" y="395" font-size="13.5" fill="#17211f"><tspan font-family="var(--font-mono)">hc_pre / npu_hc_pre_v2</tspan> 直接</text>
  <text x="326" y="418" font-size="13.5" fill="#17211f">调用扩展，不检 <tspan font-family="var(--font-mono)">enable_custom_op</tspan></text>
  <text x="326" y="441" font-size="13.5" fill="#8f3229">且关门禁跳过导入有未注册风险</text>

  <rect x="608" y="344" width="276" height="112" rx="8" fill="#f7e7f2" stroke="#9a4b86" stroke-width="1.4"/>
  <text x="622" y="370" font-size="14" font-weight="700" fill="#7a3a6a">三层验收：不可互相替代</text>
  <text x="622" y="395" font-size="13.5" fill="#17211f">1. 生成文本相同（最粗）</text>
  <text x="622" y="418" font-size="13.5" fill="#17211f">2. token ID + logprob 一致</text>
  <text x="622" y="441" font-size="13.5" font-weight="700" fill="#7a3a6a">3. 完整 logits / 张量逐位比对</text>
</svg>
