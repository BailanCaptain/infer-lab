<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 486" width="900" height="486" role="img" aria-label="浮点加法非结合律双归约树、动态 split-K 与顺序累加的分叉原因，以及锁定 K 方向 8 段固定归约链图示" font-family="var(--font-sans)">
  <title>批不变性数学根源：FP32 加法归约树分叉 vs 写死 K 方向 8 段累加链</title>
  <desc>Top-left: two literal binary addition trees for FP32 (a+b)+c=0 vs a+(b+c)=1. Top-right: dynamic split-K parallel tree (M=1) vs sequential K loop (M=6048) changing grouping. Bottom: locked K=512 (8x64) chain keeping identical reduction order for M=1 (1 M-tile) and M=300 (3 M-tiles)</desc>
  <defs>
    <marker id="bi-arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="#4d5652"/>
    </marker>
    <marker id="bi-teal" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="#087f73"/>
    </marker>
  </defs>

  <!-- ================= TOP-LEFT: LITERAL BINARY REDUCTION TREES ================= -->
  <text x="16" y="26" font-size="15.5" font-weight="700" fill="#17211f">① FP32 舍入破坏结合律：相同三数换归约树结果变</text>
  <text x="16" y="47" font-family="var(--font-mono)" font-size="13.5" fill="#66716d">a = 16,777,216 (2²⁴) · b = 1 · c = −16,777,216</text>

  <!-- Tree 1: (a + b) + c = 0 (x=16..218) -->
  <rect x="16" y="60" width="202" height="198" rx="8" fill="#fff0e9" stroke="#b54237" stroke-width="1.4"/>
  <text x="117" y="83" text-anchor="middle" font-size="13.5" font-weight="700" fill="#8f3229">树 1：先算 (a + b)</text>
  <!-- Leaves -->
  <rect x="26" y="96" width="54" height="26" rx="4" fill="#ffffff" stroke="#b54237"/><text x="53" y="114" text-anchor="middle" font-family="var(--font-mono)" font-size="13.5" fill="#17211f">2²⁴</text>
  <rect x="86" y="96" width="44" height="26" rx="4" fill="#ffffff" stroke="#b54237"/><text x="108" y="114" text-anchor="middle" font-family="var(--font-mono)" font-size="13.5" fill="#17211f">+1</text>
  <rect x="148" y="96" width="60" height="26" rx="4" fill="#ffffff" stroke="#b54237"/><text x="178" y="114" text-anchor="middle" font-family="var(--font-mono)" font-size="13.5" fill="#17211f">−2²⁴</text>
  <!-- Merge lines -->
  <line x1="53" y1="122" x2="80" y2="146" stroke="#b54237" stroke-width="1.4"/>
  <line x1="108" y1="122" x2="80" y2="146" stroke="#b54237" stroke-width="1.4"/>
  <rect x="26" y="148" width="114" height="32" rx="5" fill="#faeab8" stroke="#b54237" stroke-width="1.4"/>
  <text x="83" y="169" text-anchor="middle" font-size="13.5" font-weight="700" fill="#8f3229">舍回 2²⁴ (丢1)</text>
  <line x1="83" y1="180" x2="128" y2="206" stroke="#b54237" stroke-width="1.5"/>
  <line x1="178" y1="122" x2="128" y2="206" stroke="#b54237" stroke-width="1.5"/>
  <rect x="74" y="208" width="108" height="34" rx="6" fill="#b54237"/>
  <text x="128" y="230" text-anchor="middle" font-family="var(--font-mono)" font-size="14.5" font-weight="700" fill="#ffffff">结果 = 0</text>

  <!-- Tree 2: a + (b + c) = 1 (x=230..432) -->
  <rect x="230" y="60" width="202" height="198" rx="8" fill="#ddf4ef" stroke="#087f73" stroke-width="1.4"/>
  <text x="331" y="83" text-anchor="middle" font-size="13.5" font-weight="700" fill="#065f56">树 2：先算 (b + c)</text>
  <!-- Leaves -->
  <rect x="240" y="96" width="54" height="26" rx="4" fill="#ffffff" stroke="#087f73"/><text x="267" y="114" text-anchor="middle" font-family="var(--font-mono)" font-size="13.5" fill="#17211f">2²⁴</text>
  <rect x="306" y="96" width="44" height="26" rx="4" fill="#ffffff" stroke="#087f73"/><text x="328" y="114" text-anchor="middle" font-family="var(--font-mono)" font-size="13.5" fill="#17211f">+1</text>
  <rect x="358" y="96" width="62" height="26" rx="4" fill="#ffffff" stroke="#087f73"/><text x="389" y="114" text-anchor="middle" font-family="var(--font-mono)" font-size="13.5" fill="#17211f">−2²⁴</text>
  <!-- Merge lines -->
  <line x1="328" y1="122" x2="360" y2="146" stroke="#087f73" stroke-width="1.4"/>
  <line x1="389" y1="122" x2="360" y2="146" stroke="#087f73" stroke-width="1.4"/>
  <rect x="302" y="148" width="118" height="32" rx="5" fill="#ffffff" stroke="#087f73" stroke-width="1.4"/>
  <text x="361" y="169" text-anchor="middle" font-size="13.5" font-weight="700" fill="#065f56">−2²⁴+1 (精确)</text>
  <line x1="267" y1="122" x2="314" y2="206" stroke="#087f73" stroke-width="1.5"/>
  <line x1="361" y1="180" x2="314" y2="206" stroke="#087f73" stroke-width="1.5"/>
  <rect x="260" y="208" width="108" height="34" rx="6" fill="#087f73"/>
  <text x="314" y="230" text-anchor="middle" font-family="var(--font-mono)" font-size="14.5" font-weight="700" fill="#ffffff">结果 = 1</text>

  <!-- ================= TOP-RIGHT: DYNAMIC SPLIT-K SWITCHING ================= -->
  <text x="456" y="26" font-size="15.5" font-weight="700" fill="#17211f">② 批行数 M 变 → 库自动切换归约树形（默认实现）</text>
  <text x="456" y="47" font-size="13.5" fill="#66716d">同一条请求换批后分组变化 → 末位差值翻转 logits 前两名</text>

  <!-- Small batch M=1: Parallel Split-K Tree -->
  <rect x="456" y="60" width="428" height="92" rx="8" fill="#fff4cf" stroke="#c78300" stroke-width="1.4"/>
  <text x="470" y="84" font-size="14" font-weight="700" fill="#936300">单跑小批（如 M=1）：拆 Split-K 并行小计再合并</text>
  <g font-family="var(--font-mono)" font-size="13.5" text-anchor="middle">
    <rect x="470" y="96" width="58" height="24" rx="4" fill="#ffffff" stroke="#c78300"/><text x="499" y="113" fill="#936300">S₁</text>
    <rect x="536" y="96" width="58" height="24" rx="4" fill="#ffffff" stroke="#c78300"/><text x="565" y="113" fill="#936300">S₂</text>
    <rect x="614" y="96" width="58" height="24" rx="4" fill="#ffffff" stroke="#c78300"/><text x="643" y="113" fill="#936300">S₃</text>
    <rect x="680" y="96" width="58" height="24" rx="4" fill="#ffffff" stroke="#c78300"/><text x="709" y="113" fill="#936300">S₄</text>
  </g>
  <path d="M 499 120 L 532 134 L 565 120 M 643 120 L 676 134 L 709 120 M 532 134 L 604 144 L 676 134" fill="none" stroke="#c78300" stroke-width="1.5"/>
  <text x="752" y="114" font-size="13.5" font-weight="700" fill="#936300">树形归约</text>
  <text x="752" y="136" font-size="13.5" fill="#4d5652">(S₁+S₂)+(S₃+S₄)</text>

  <!-- Large batch M=6048: Sequential K Loop -->
  <rect x="456" y="164" width="428" height="94" rx="8" fill="#f7e7f2" stroke="#9a4b86" stroke-width="1.4"/>
  <text x="470" y="188" font-size="14" font-weight="700" fill="#7a3a6a">混批大形（如 M=6048）：改为单块沿 K 顺序累加</text>
  <g font-family="var(--font-mono)" font-size="13.5" text-anchor="middle">
    <rect x="470" y="202" width="58" height="26" rx="4" fill="#ffffff" stroke="#9a4b86"/><text x="499" y="220" fill="#7a3a6a">S₁</text>
    <line x1="528" y1="215" x2="546" y2="215" stroke="#9a4b86" stroke-width="1.4" marker-end="url(#bi-arr)"/>
    <rect x="548" y="202" width="58" height="26" rx="4" fill="#ffffff" stroke="#9a4b86"/><text x="577" y="220" fill="#7a3a6a">+S₂</text>
    <line x1="606" y1="215" x2="624" y2="215" stroke="#9a4b86" stroke-width="1.4" marker-end="url(#bi-arr)"/>
    <rect x="626" y="202" width="58" height="26" rx="4" fill="#ffffff" stroke="#9a4b86"/><text x="655" y="220" fill="#7a3a6a">+S₃</text>
    <line x1="684" y1="215" x2="702" y2="215" stroke="#9a4b86" stroke-width="1.4" marker-end="url(#bi-arr)"/>
    <rect x="704" y="202" width="58" height="26" rx="4" fill="#ffffff" stroke="#9a4b86"/><text x="733" y="220" fill="#7a3a6a">+S₄</text>
  </g>
  <text x="774" y="220" font-size="13.5" font-weight="700" fill="#8f3229">顺序不同！</text>
  <text x="470" y="248" font-size="13.5" fill="#8f3229">▸ 固定随机种子管不住 logits 本身的变化，贪心也会分叉</text>

  <line x1="16" y1="276" x2="884" y2="276" stroke="#b8bcb5" stroke-width="1.3" stroke-dasharray="6 4"/>

  <!-- ================= BOTTOM: LOCKED K-CHAIN (K=512 = 8x64) ================= -->
  <text x="16" y="304" font-size="16" font-weight="700" fill="#17211f">③ 批不变解法：写死 K 方向固定 8 段顺序累加（示意：K=512，固定 K 块=64，M 块高=128）</text>

  <!-- Case M=1 (1 M-tile) -->
  <rect x="16" y="322" width="160" height="54" rx="7" fill="#ddf4ef" stroke="#087f73" stroke-width="1.4"/>
  <text x="96" y="346" text-anchor="middle" font-size="14" font-weight="700" fill="#065f56">M = 1 行</text>
  <text x="96" y="366" text-anchor="middle" font-size="13.5" fill="#4d5652">铺开 1 个 M 块</text>

  <!-- 8 fixed K segments for M=1 (x=196..880) -->
  <g font-family="var(--font-mono)" font-size="13.5" text-anchor="middle">
    <rect x="196" y="332" width="66" height="34" rx="5" fill="#ddf4ef" stroke="#087f73" stroke-width="1.4"/><text x="229" y="354" font-weight="700" fill="#065f56">K₁</text>
    <line x1="262" y1="349" x2="280" y2="349" stroke="#087f73" stroke-width="1.5" marker-end="url(#bi-teal)"/>
    <rect x="282" y="332" width="66" height="34" rx="5" fill="#ddf4ef" stroke="#087f73" stroke-width="1.4"/><text x="315" y="354" font-weight="700" fill="#065f56">K₂</text>
    <line x1="348" y1="349" x2="366" y2="349" stroke="#087f73" stroke-width="1.5" marker-end="url(#bi-teal)"/>
    <rect x="368" y="332" width="66" height="34" rx="5" fill="#ddf4ef" stroke="#087f73" stroke-width="1.4"/><text x="401" y="354" font-weight="700" fill="#065f56">K₃</text>
    <line x1="434" y1="349" x2="452" y2="349" stroke="#087f73" stroke-width="1.5" marker-end="url(#bi-teal)"/>
    <rect x="454" y="332" width="66" height="34" rx="5" fill="#ddf4ef" stroke="#087f73" stroke-width="1.4"/><text x="487" y="354" font-weight="700" fill="#065f56">K₄</text>
    <line x1="520" y1="349" x2="538" y2="349" stroke="#087f73" stroke-width="1.5" marker-end="url(#bi-teal)"/>
    <rect x="540" y="332" width="66" height="34" rx="5" fill="#ddf4ef" stroke="#087f73" stroke-width="1.4"/><text x="573" y="354" font-weight="700" fill="#065f56">K₅</text>
    <line x1="606" y1="349" x2="624" y2="349" stroke="#087f73" stroke-width="1.5" marker-end="url(#bi-teal)"/>
    <rect x="626" y="332" width="66" height="34" rx="5" fill="#ddf4ef" stroke="#087f73" stroke-width="1.4"/><text x="659" y="354" font-weight="700" fill="#065f56">K₆</text>
    <line x1="692" y1="349" x2="710" y2="349" stroke="#087f73" stroke-width="1.5" marker-end="url(#bi-teal)"/>
    <rect x="712" y="332" width="66" height="34" rx="5" fill="#ddf4ef" stroke="#087f73" stroke-width="1.4"/><text x="745" y="354" font-weight="700" fill="#065f56">K₇</text>
    <line x1="778" y1="349" x2="796" y2="349" stroke="#087f73" stroke-width="1.5" marker-end="url(#bi-teal)"/>
    <rect x="798" y="332" width="84" height="34" rx="5" fill="#087f73"/><text x="840" y="354" font-weight="700" fill="#ffffff">K₈ 完</text>
  </g>

  <!-- Case M=300 (3 M-tiles, IDENTICAL K chain!) -->
  <rect x="16" y="392" width="160" height="54" rx="7" fill="#e8edff" stroke="#4c65b6" stroke-width="1.4"/>
  <text x="96" y="416" text-anchor="middle" font-size="14" font-weight="700" fill="#3a4f93">M = 300 行</text>
  <text x="96" y="436" text-anchor="middle" font-size="13.5" fill="#4d5652">铺开 3 个 M 块</text>

  <!-- Stacked 3 M-tile shadow cue behind identical 8-step K chain -->
  <rect x="196" y="402" width="686" height="34" rx="6" fill="#e8edff" stroke="#4c65b6" stroke-width="1.5"/>
  <text x="539" y="424" text-anchor="middle" font-size="14" font-weight="700" fill="#3a4f93">M₀ / M₁ / M₂ 每个输出块内同样锁死 K₁ → K₂ → K₃ → K₄ → K₅ → K₆ → K₇ → K₈（严格 8 步）</text>

  <text x="16" y="472" font-size="13.5" font-weight="700" fill="#065f56">▸ 核心原则：批次行数 M 只改变并行铺开的输出块数（1 块 → 3 块），绝不改变任意输出数的 K 方向浮点累加顺序</text>
</svg>
