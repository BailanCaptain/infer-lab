  <text x="102" y="537" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="12.5" font-weight="400" fill="var(--color-ink-muted, #5b6763)">npu_fused_infer_attention_score · npu_add_rms_norm · torch.sum</text>
