  <text x="102" y="447" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="15" font-weight="700" fill="var(--color-ink, #17211f)">aten 派发表</text>
  <text x="102" y="467" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="12.5" font-weight="400" fill="var(--color-ink-muted, #5b6763)">mm / matmul / addmm / bmm / softmax / sum 挂到 NPU 派发键</text>
  <rect x="616.5" y="437.5" width="220.5" height="21.5" rx="10.8" fill="var(--color-surface, #fbfaf6)" stroke="var(--color-weight, #b87a00)" stroke-width="1"/><text x="726.8" y="455" font-family="'JetBrains Mono',ui-monospace,monospace" font-size="12.5" font-weight="400" fill="var(--color-weight, #b87a00)" text-anchor="middle">enable_batch_invariant_mode</text>
  <rect x="44" y="490" width="812" height="60" rx="10" fill="var(--color-accent-soft, #fff0e9)"/>
  <rect x="44" y="490" width="5" height="60" rx="2.5" fill="var(--color-accent, #e85b32)"/>
