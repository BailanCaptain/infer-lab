<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 782" width="900" height="782" role="img" aria-label="批不变换掉的是「一个和分几份来加」：K 方向不再切给别人，外加一张 aten 派发表和三处直接赋值（vllm-ascend v0.23 维护分支）">
  <title>批不变换掉的是「一个和分几份来加」：K 方向不再切给别人，外加一张 aten 派发表和三处直接赋值（vllm-ascend v0.23 维护分支）</title>
  <rect width="900" height="782" fill="var(--color-surface, #fbfaf6)"/>
  <rect x="20" y="26" width="860" height="292" rx="12" fill="var(--color-kv-soft, #e8edff)"/>
  <rect x="36" y="40" width="344.7" height="26.5" rx="13.3" fill="var(--color-kv, #4c65b6)"/><text x="47" y="58.1" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="13.5" font-weight="700" fill="var(--color-ink-inverse, #ffffff)">默认：一个和分几份加，由这一批多少 token 说了算</text>
  <text x="38" y="83" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="12.5" font-weight="400" fill="var(--color-ink-muted, #5b6763)">K = 1024 是 Qwen3-0.6B 的 hidden size。分组一变，浮点加法的顺序就变，末位跟着变。</text>
  <rect x="20" y="338" width="860" height="292" rx="12" fill="var(--color-weight-soft, #fff4cf)"/>
  <rect x="36" y="352" width="295.8" height="26.5" rx="13.3" fill="var(--color-weight, #b87a00)"/><text x="47" y="370.1" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="13.5" font-weight="700" fill="var(--color-ink-inverse, #ffffff)">开了之后：两条供应链抢同一张 aten 派发表</text>
  <text x="38" y="395" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="12.5" font-weight="400" fill="var(--color-ink-muted, #5b6763)">AscendC 的 batch_invariant_ops 包在场就用它，只有 Triton 时用 Triton 的核，两条都缺只打一条 warning。</text>
  <rect x="44" y="420" width="812" height="60" rx="10" fill="var(--color-weight-soft, #fff4cf)"/>
  <rect x="44" y="420" width="5" height="60" rx="2.5" fill="var(--color-weight, #b87a00)"/>
