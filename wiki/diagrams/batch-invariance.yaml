layout: figure
id: batch-invariance
caption: 同一个和：分几份加，默认由这一批有多少 token 说了算，末位跟着批变；批不变把分块写死成 32 段一条链，顺序与批无关（末位数字为示意）
size: [900, 470]

texts:
  - { at: [28, 30], text: "一个输出数 = 2048 个乘积相加", strong: true }
  - { at: [28, 64], text: "单独跑，批里只有 1 条：拆成 4 段并行" }
  - { at: [28, 162], text: "四个部分和再合并，末位 …41" }
  - { at: [28, 196], text: "混在大批里：不拆，一条链加到底" }
  - { at: [28, 284], text: "同样的 2048 个数，末位 …43", tone: danger }
  - { at: [28, 352], text: "固定切 32 段，一条链从头加到尾" }
  - { at: [28, 430], text: "批大小只决定同时铺多少条链", note: true }

