<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 380" width="900" height="380" role="img" aria-label="GLM 五缓存组混合模型中单一块大小 B 导致的 1523 块与 10 块数量级偏差及 LCM 133120 失真图" font-family="var(--font-sans)">
  <title>多缓存组混合模型下单一块大小 B 的两个数量级偏差</title>
  <desc>上区用比例条对比场景 M 中 6,000 token 新请求 N 实际首步需 1,523 块（尾状态 1,501 + KDA 12 + full 10）与按单块 640 折算的 10 块；下区展示 B=LCM 133,120 时 R 恒为 0、P=2、预算恒远超 4,096 导致永远长作业优先。</desc>

  <!-- Zone 1: 1,523 real blocks vs 10 estimated blocks -->
  <circle cx="26" cy="24" r="12" fill="#b54237"/>
  <text x="26" y="28.5" text-anchor="middle" font-size="13" font-weight="700" fill="#ffffff">1</text>
  <text x="46" y="30" font-size="16" font-weight="700" fill="#17211f">场景 M 新请求 N（6,000 token）的块账落差：真实需 1,523 块 vs 单块 640 折算仅 10 块</text>

  <!-- Scale: 1,523 blocks = 620px (x = 160..780) -->
  <text x="16" y="76" font-size="14" font-weight="700" fill="#8f3229">真实各组需块</text>
  <text x="16" y="96" font-size="13" fill="#4d5652">合计 1,523 块</text>
  <!-- Tail 1,501 (611px) + KDA 12 (5px) + Full 10 (4px) -->
  <rect x="160" y="56" width="606" height="44" rx="4" fill="#fff0e9" stroke="#b54237" stroke-width="1.5"/>
  <text x="463" y="83" text-anchor="middle" font-size="14.5" font-weight="700" fill="#8f3229">尾状态组：每 4 位置 1 块 → 1,501 块（占 98.6%）</text>
  <rect x="768" y="56" width="12" height="44" rx="2" fill="#4c65b6"/>
  <text x="790" y="74" font-size="13" fill="#3a4f93">full 10 块</text>
  <text x="790" y="94" font-size="13" fill="#7a3a6a">KDA 12 块</text>

  <text x="16" y="144" font-size="14" font-weight="700" fill="#3a4f93">按 full 块折算</text>
  <text x="16" y="164" font-size="13" fill="#4d5652">6,000 ÷ 640</text>
  <rect x="160" y="124" width="4.1" height="40" rx="1" fill="#e8edff" stroke="#4c65b6" stroke-width="1.4"/>
  <text x="176" y="149" font-size="14" font-weight="700" fill="#3a4f93">仅 ≈ 10 块（同比例仅 4 px，比真实 1,523 块低估两个数量级！）</text>
  <text x="182" y="170" font-size="13" fill="#4d5652">注：20,000 token 分段时，首段 8,144 位置光尾状态组就要 2,037 块（超 DP0 3,855 块池一半）</text>

  <!-- Divider -->
  <line x1="16" y1="194" x2="884" y2="194" stroke="#b8bcb5" stroke-width="1.4" stroke-dasharray="6 5"/>

  <!-- Zone 2: B = LCM 133,120 distortion chain -->
  <circle cx="26" cy="220" r="12" fill="#c78300"/>
  <text x="26" y="224.5" text-anchor="middle" font-size="13" font-weight="700" fill="#ffffff">2</text>
  <text x="46" y="226" font-size="16" font-weight="700" fill="#17211f">当调度器块大小 B 取旧镜像最小公倍数 133,120 时：预留与 4,096 门槛双重失真</text>

  <rect x="16" y="246" width="266" height="82" rx="6" fill="#fff4cf" stroke="#c78300" stroke-width="1.4"/>
  <text x="30" y="272" font-size="14" font-weight="700" fill="#936300">① B = 133,120（等于最大长）</text>
  <text x="30" y="296" font-size="13.5" fill="#4d5652">running 走到 133,120 才算跨块</text>
  <text x="30" y="318" font-size="13.5" font-weight="700" fill="#8f3229">→ 需求 R 恒为 0，仅留余量 P=2</text>

  <path d="M284 287h22m-5-4l5 4-5 4" fill="none" stroke="#c78300" stroke-width="1.8" stroke-linecap="round"/>

  <rect x="310" y="246" width="272" height="82" rx="6" fill="#fff0e9" stroke="#b54237" stroke-width="1.4"/>
  <text x="324" y="272" font-size="14" font-weight="700" fill="#8f3229">② Budget = (F−2) × 133,120</text>
  <text x="324" y="296" font-size="13.5" fill="#4d5652">只要空闲块 F &gt; 2，乘积立破十万</text>
  <text x="324" y="318" font-size="13.5" font-weight="700" fill="#8f3229">→ 永远 ≫ 4,096（锁死长作业优先）</text>

  <path d="M584 287h22m-5-4l5 4-5 4" fill="none" stroke="#4c65b6" stroke-width="1.8" stroke-linecap="round"/>

  <rect x="610" y="246" width="274" height="82" rx="6" fill="#ddf4ef" stroke="#087f73" stroke-width="1.4"/>
  <text x="624" y="272" font-size="14" font-weight="700" fill="#065f56">③ 真实借块与标准单组模型边界</text>
  <text x="624" y="296" font-size="13.5" fill="#4d5652">上游借块仍按各组真实块数硬检查</text>
  <text x="624" y="318" font-size="13.5" fill="#065f56">单组 Qwen3-8B (B=128) 无此偏差</text>

  <text x="16" y="362" font-size="13.5" fill="#66716d">注：v0.30.0 / main 已按 is_prefix_cacheable 过滤私有尾状态组重算 GLM 的 B；组合实际效果仍待实跑核验</text>
</svg>
