<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 470" width="900" height="470" role="img" aria-label="Batch-Job-Aware两级准入预算闸门与v0.30.0多调度器静默覆盖链图" font-family="var(--font-sans)">
  <title>Batch-Job-Aware Scheduler：块预留 + 作业优先级桶，以及 v0.30.0 platform.py 静默覆盖顺序</title>
  <desc>关联源码符号：_finalize_reserve, _compute_one, reserve_margin_blocks, reserve_max_blocks, num_lookahead_tokens, dyntra_lb_config, recompute_scheduler_enable, profiling_chunk_config, batch_job_sched_config, BatchJobAwareAsyncScheduler</desc>
  <defs>
    <marker id="bj-arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="#4d5652"/>
    </marker>
    <marker id="bj-arr-red" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="#b54237"/>
    </marker>
  </defs>

  <!-- Zone 1: Admission gate + job priority -->
  <text x="16" y="28" font-size="16" font-weight="700" fill="#17211f">① 离线批作业准入两步闸门（仅替换 waiting，不动 running）</text>

  <rect x="16" y="44" width="278" height="128" rx="7" fill="#e8edff" stroke="#4c65b6" stroke-width="1.4"/>
  <text x="30" y="70" font-size="14.5" font-weight="700" fill="#3a4f93">A. RunningBlockReserver 留块</text>
  <text x="30" y="96" font-size="13.5" fill="#4d5652">模拟本步 + 下步跨块需求 R</text>
  <text x="30" y="119" font-size="13.5" font-weight="700" fill="#3a4f93">P = min(R + m, M)（默认 2 / 8）</text>
  <text x="30" y="142" font-size="13.5" fill="#4d5652">Budget = max(0, (F - P) × B)</text>
  <text x="30" y="163" font-size="13.5" fill="#66716d">归 0 即停接，留块不真借走</text>

  <line x1="296" y1="108" x2="320" y2="108" stroke="#4d5652" stroke-width="1.8" marker-end="url(#bj-arr)"/>

  <rect x="324" y="44" width="272" height="128" rx="7" fill="#fff4cf" stroke="#c78300" stroke-width="1.4"/>
  <text x="338" y="70" font-size="14.5" font-weight="700" fill="#936300">B. 作业排序（EWMA 估计）</text>
  <text x="338" y="96" font-size="13.5" fill="#4d5652">1) 新桶前 3 条冷启动优先</text>
  <text x="338" y="119" font-size="13.5" fill="#4d5652">2) Budget &gt; 4096：长作业优先</text>
  <text x="338" y="142" font-size="13.5" fill="#4d5652">3) Budget ≤ 4096：短作业优先</text>
  <text x="338" y="163" font-size="13.5" fill="#936300">无防饿死；默认初值 128</text>

  <line x1="598" y1="108" x2="622" y2="108" stroke="#4d5652" stroke-width="1.8" marker-end="url(#bj-arr)"/>

  <rect x="626" y="44" width="258" height="128" rx="7" fill="#ddf4ef" stroke="#087f73" stroke-width="1.4"/>
  <text x="640" y="70" font-size="14.5" font-weight="700" fill="#065f56">C. 桶内 Best-Fit 挑一条</text>
  <text x="640" y="96" font-size="13.5" fill="#4d5652">选 ≤ Budget 的最长提示词</text>
  <text x="640" y="119" font-size="13.5" fill="#4d5652">全超额则退而挑最短一条</text>
  <text x="640" y="142" font-size="13.5" fill="#4d5652">接通后将新条需求累加进 R</text>
  <text x="640" y="163" font-size="13.5" fill="#065f56">同步/异步按开关择类安装</text>

  <line x1="16" y1="190" x2="884" y2="190" stroke="#b8bcb5" stroke-width="1.4" stroke-dasharray="6 5"/>

  <!-- Zone 2: Silent scheduler override cascade -->
  <text x="16" y="218" font-size="16" font-weight="700" fill="#17211f">② v0.30.0 platform.py 多调度器静默覆盖优先级（后写入覆盖前者 scheduler_cls）</text>

  <rect x="16" y="236" width="186" height="82" rx="7" fill="#ece9df" stroke="#8a928f" stroke-width="1.3"/>
  <text x="109" y="262" text-anchor="middle" font-size="14" font-weight="700" fill="#17211f">1. recompute</text>
  <text x="109" y="286" text-anchor="middle" font-size="13.5" fill="#4d5652">PD-D 节点重算调度</text>
  <text x="109" y="308" text-anchor="middle" font-size="13.5" fill="#66716d">最先写入（易被覆写）</text>

  <line x1="204" y1="277" x2="232" y2="277" stroke="#b54237" stroke-width="1.7" marker-end="url(#bj-arr-red)"/>

  <rect x="236" y="236" width="188" height="82" rx="7" fill="#f7e7f2" stroke="#9a4b86" stroke-width="1.3"/>
  <text x="330" y="262" text-anchor="middle" font-size="14" font-weight="700" fill="#7a3a6a">2. dyntra_lb</text>
  <text x="330" y="286" text-anchor="middle" font-size="13.5" fill="#4d5652">recompute 开时跳过</text>
  <text x="330" y="308" text-anchor="middle" font-size="13.5" fill="#7a3a6a">与 profiling 显式互斥</text>

  <line x1="426" y1="277" x2="454" y2="277" stroke="#b54237" stroke-width="1.7" marker-end="url(#bj-arr-red)"/>

  <rect x="458" y="236" width="194" height="82" rx="7" fill="#fff4cf" stroke="#c78300" stroke-width="1.4"/>
  <text x="555" y="262" text-anchor="middle" font-size="14" font-weight="700" fill="#936300">3. profiling_chunk</text>
  <text x="555" y="286" text-anchor="middle" font-size="13.5" fill="#4d5652">无条件覆写 scheduler_cls</text>
  <text x="555" y="308" text-anchor="middle" font-size="13.5" fill="#936300">main 分支已移除此项</text>

  <line x1="654" y1="277" x2="682" y2="277" stroke="#b54237" stroke-width="1.7" marker-end="url(#bj-arr-red)"/>

  <rect x="686" y="236" width="198" height="82" rx="7" fill="#fff0e9" stroke="#b54237" stroke-width="1.5"/>
  <text x="785" y="262" text-anchor="middle" font-size="14" font-weight="700" fill="#8f3229">4. batch_job_sched</text>
  <text x="785" y="286" text-anchor="middle" font-size="13.5" font-weight="700" fill="#8f3229">排末位，静默覆盖前项</text>
  <text x="785" y="308" text-anchor="middle" font-size="13.5" fill="#4d5652">与 SRF 同开抛 ValueError</text>

  <text x="16" y="344" font-size="13.5" fill="#8f3229">⚠ 注意：同时开启 batch_job_sched 与 recompute / profiling_chunk 不会报错，但前者会静默覆写后者的 scheduler_cls</text>

  <line x1="16" y1="362" x2="884" y2="362" stroke="#b8bcb5" stroke-width="1.4" stroke-dasharray="6 5"/>

  <!-- Zone 3: Online vs Offline & Edge Cases -->
  <text x="16" y="388" font-size="16" font-weight="700" fill="#17211f">③ 在线与离线边界（两类最易踩空的场景）</text>

  <rect x="16" y="402" width="424" height="56" rx="7" fill="#fff0e9" stroke="#b54237" stroke-width="1.3"/>
  <text x="30" y="426" font-size="14" font-weight="700" fill="#8f3229">结构化输出绕过本调度器</text>
  <text x="30" y="448" font-size="13.5" fill="#4d5652">带 JSON schema 的请求直进 skipped_waiting，不经留块与分桶</text>

  <rect x="460" y="402" width="424" height="56" rx="7" fill="#e8edff" stroke="#4c65b6" stroke-width="1.3"/>
  <text x="474" y="426" font-size="14" font-weight="700" fill="#3a4f93">混合缓存组模型中单一块大小 B 失真</text>
  <text x="474" y="448" font-size="13.5" fill="#4d5652">多缓存组每块容量不同时，(F - P) × B 无法精确反映真实块需求</text>
</svg>
