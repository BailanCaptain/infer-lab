<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 664" width="880" height="664" role="img" aria-label="第 2 站调度里，上游先排完 running，再扫 waiting；每接一条之前都问批作业感知队列「有能接的吗」。队列先算准入预算，为 0 就答「没有」；否则冷启动请求优先，其次按作业的长短和预算大小排先后，在排第一的作业桶里挑一条交回上游。上游照常截断、借块，这条进 running 后，预留器把它的下一步需求加进预留，再问下一条。请求自然结束时，它的输出长度更新所属作业的估计。">
  <title>第 2 站调度里，上游先排完 running，再扫 waiting；每接一条之前都问批作业感知队列「有能接的吗」。队列先算准入预算，为 0 就答「没有」；否则冷启动请求优先，其次按作业的长短和预算大小排先后，在排第一的作业桶里挑一条交回上游。上游照常截断、借块，这条进 running 后，预留器把它的下一步需求加进预留，再问下一条。请求自然结束时，它的输出长度更新所属作业的估计。</title>
  <defs><marker id="batch-job-aware-scheduler-flow-ah-ink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="var(--color-ink, #17211f)"/></marker></defs>
  <path d="M440 72 L440 108" fill="none" stroke="var(--color-ink, #17211f)" stroke-width="1.4" marker-end="url(#batch-job-aware-scheduler-flow-ah-ink)"/>
  <path d="M440 164 L440 200" fill="none" stroke="var(--color-ink, #17211f)" stroke-width="1.4" marker-end="url(#batch-job-aware-scheduler-flow-ah-ink)"/>
  <path d="M650 230 L676 230" fill="none" stroke="var(--color-ink, #17211f)" stroke-width="1.4" marker-end="url(#batch-job-aware-scheduler-flow-ah-ink)"/>
  <path d="M440 260 L440 296" fill="none" stroke="var(--color-ink, #17211f)" stroke-width="1.4" marker-end="url(#batch-job-aware-scheduler-flow-ah-ink)"/>
  <path d="M440 356 L440 392" fill="none" stroke="var(--color-ink, #17211f)" stroke-width="1.4" marker-end="url(#batch-job-aware-scheduler-flow-ah-ink)"/>
  <path d="M440 452 L440 488" fill="none" stroke="var(--color-ink, #17211f)" stroke-width="1.4" marker-end="url(#batch-job-aware-scheduler-flow-ah-ink)"/>
  <path d="M440 548 L440 584" fill="none" stroke="var(--color-ink, #17211f)" stroke-width="1.4" marker-end="url(#batch-job-aware-scheduler-flow-ah-ink)"/>
  <path d="M230 326 L196 326 L196 604 L230 604" fill="none" stroke="var(--color-ink, #17211f)" stroke-width="1.4" marker-end="url(#batch-job-aware-scheduler-flow-ah-ink)"/>
  <path d="M650 614 L866 614 L866 136 L650 136" fill="none" stroke="var(--color-ink, #17211f)" stroke-width="1.4" marker-end="url(#batch-job-aware-scheduler-flow-ah-ink)"/>
  <path d="M676 422 L650 422" fill="none" stroke="var(--color-ink, #17211f)" stroke-width="1.4" stroke-dasharray="7 5" marker-end="url(#batch-job-aware-scheduler-flow-ah-ink)"/>
  <rect x="230" y="16" width="420" height="56" rx="8" fill="var(--color-surface-sunken, #ece9df)" stroke="var(--color-ink, #17211f)" stroke-width="1.5"/>
  <text x="440" y="40" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="14" font-weight="700" fill="var(--color-ink, #17211f)" text-anchor="middle">第 2 站 调度：上游先把 running 排完</text>
  <text x="440" y="59" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="13" font-weight="400" fill="var(--color-ink, #17211f)" text-anchor="middle">余下的 token 预算留给 waiting</text>
  <rect x="230" y="108" width="420" height="56" rx="8" fill="var(--color-surface-sunken, #ece9df)" stroke="var(--color-ink, #17211f)" stroke-width="1.5"/>
  <text x="440" y="132" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="14" font-weight="700" fill="var(--color-ink, #17211f)" text-anchor="middle">waiting 循环：队列里有能接的吗？</text>
  <text x="440" y="151" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="13" font-weight="400" fill="var(--color-ink, #17211f)" text-anchor="middle">每接一条都问一次</text>
  <rect x="230" y="200" width="420" height="60" rx="8" fill="var(--color-kv, #4c65b6)" stroke="var(--color-ink, #17211f)" stroke-width="1.5"/>
  <text x="440" y="226" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="14" font-weight="700" fill="var(--color-ink-inverse, #ffffff)" text-anchor="middle">① (空闲块 − 预留块) × 块大小，最低为 0</text>
  <text x="440" y="245" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="13" font-weight="400" fill="var(--color-ink-inverse, #ffffff)" text-anchor="middle">预留 = min(running 下一步新块 + 余量, 上限)</text>
  <rect x="676" y="200" width="172" height="60" rx="8" fill="var(--color-surface-sunken, #ece9df)" stroke="var(--color-ink, #17211f)" stroke-width="1.5"/>
  <text x="762" y="226" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="14" font-weight="700" fill="var(--color-ink, #17211f)" text-anchor="middle">预算为 0</text>
  <text x="762" y="245" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="13" font-weight="400" fill="var(--color-ink, #17211f)" text-anchor="middle">答「没有」，本步不再接</text>
  <rect x="230" y="296" width="420" height="60" rx="8" fill="var(--color-control, #66716d)" stroke="var(--color-ink, #17211f)" stroke-width="1.5"/>
  <text x="440" y="322" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="14" font-weight="700" fill="var(--color-ink-inverse, #ffffff)" text-anchor="middle">② 有冷启动请求就先交它</text>
  <text x="440" y="341" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="13" font-weight="400" fill="var(--color-ink-inverse, #ffffff)" text-anchor="middle">作业的桶从空到有以后，最先进来的 3 条</text>
  <rect x="230" y="392" width="420" height="60" rx="8" fill="var(--color-control, #66716d)" stroke="var(--color-ink, #17211f)" stroke-width="1.5"/>
  <text x="440" y="418" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="14" font-weight="700" fill="var(--color-ink-inverse, #ffffff)" text-anchor="middle">③ 作业分长短、排先后</text>
  <text x="440" y="437" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="13" font-weight="400" fill="var(--color-ink-inverse, #ffffff)" text-anchor="middle">估计输出 &gt; 32 为长；预算 &gt; 4096 长的在前，否则短的在前</text>
  <rect x="676" y="392" width="172" height="60" rx="8" fill="var(--color-surface-sunken, #ece9df)" stroke="var(--color-ink, #17211f)" stroke-width="1.5"/>
  <text x="762" y="418" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="14" font-weight="700" fill="var(--color-ink, #17211f)" text-anchor="middle">引擎内正常结束</text>
  <text x="762" y="437" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="13" font-weight="400" fill="var(--color-ink, #17211f)" text-anchor="middle">输出长度更新作业估计</text>
  <rect x="230" y="488" width="420" height="60" rx="8" fill="var(--color-control, #66716d)" stroke="var(--color-ink, #17211f)" stroke-width="1.5"/>
  <text x="440" y="514" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="14" font-weight="700" fill="var(--color-ink-inverse, #ffffff)" text-anchor="middle">④ 排第一的作业里挑一条</text>
  <text x="440" y="533" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="13" font-weight="400" fill="var(--color-ink-inverse, #ffffff)" text-anchor="middle">提示词 ≤ 预算的最长一条；都超出就挑最短的</text>
  <rect x="230" y="584" width="420" height="60" rx="8" fill="var(--color-token, #087f73)" stroke="var(--color-ink, #17211f)" stroke-width="1.5"/>
  <text x="440" y="610" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="14" font-weight="700" fill="var(--color-ink-inverse, #ffffff)" text-anchor="middle">⑤ 交回上游：截断、借块，进入 running</text>
  <text x="440" y="629" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="13" font-weight="400" fill="var(--color-ink-inverse, #ffffff)" text-anchor="middle">预留器把这一条的下一步需求加进预留</text>
  <text x="656" y="220" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="13" font-weight="400" fill="var(--color-ink, #17211f)">是</text>
  <text x="452" y="284" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="13" font-weight="400" fill="var(--color-ink, #17211f)">否</text>
  <text x="188" y="470" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="13" font-weight="400" fill="var(--color-ink, #17211f)" text-anchor="end">找到</text>
  <text x="452" y="380" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="13" font-weight="400" fill="var(--color-ink, #17211f)">没有</text>
  <text x="856" y="530" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="13" font-weight="400" fill="var(--color-ink, #17211f)" text-anchor="end">回来问下一条</text>
</svg>
