layout: figure
id: batch-job-aware-scheduler-flow
caption: 第 2 站调度里，上游先排完 running，再扫 waiting；每接一条之前都问批作业感知队列「有能接的吗」。队列先算准入预算，为 0 就答「没有」；否则冷启动请求优先，其次按作业的长短和预算大小排先后，在排第一的作业桶里挑一条交回上游。上游照常截断、借块，这条进 running 后，预留器把它的下一步需求加进预留，再问下一条。请求自然结束时，它的输出长度更新所属作业的估计。
size: [880, 664]
items:
  - { at: [230, 16], size: [420, 56], text: 第 2 站 调度：上游先把 running 排完, sub: 余下的 token 预算留给 waiting, style: plain }
  - { at: [230, 108], size: [420, 56], text: waiting 循环：队列里有能接的吗？, sub: 每接一条都问一次, style: plain }
  - { at: [230, 200], size: [420, 60], text: ① 准入预算 = (空闲块 − 预留块) × 块大小, sub: "预留 = min(running 下一步新块 + 余量, 上限)", tone: kv }
  - { at: [676, 200], size: [172, 60], text: 预算为 0, sub: 答「没有」，本步不再接, tone: control, style: plain }
  - { at: [230, 296], size: [420, 60], text: ② 有冷启动请求就先交它, sub: 作业的桶从空到有以后，最先进来的 3 条, tone: control }
  - { at: [230, 392], size: [420, 60], text: ③ 作业分长短、排先后, sub: 估计输出 > 32 为长；预算 > 4096 长的在前，否则短的在前, tone: control }
  - { at: [676, 392], size: [172, 60], text: 请求自然结束, sub: 输出长度更新作业估计, style: plain }
  - { at: [230, 488], size: [420, 60], text: ④ 排第一的作业里挑一条, sub: 提示词 ≤ 预算的最长一条；都超出就挑最短的, tone: control }
  - { at: [230, 584], size: [420, 60], text: ⑤ 交回上游：截断、借块，进入 running, sub: 预留器把这一条的下一步需求加进预留, tone: token }
