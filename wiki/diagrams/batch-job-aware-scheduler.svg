<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 395" width="900" height="395" role="img" aria-label="预算教学例：6个空闲块，预测下一轮新增1块，余量2块、上限8块；从准入预算扣3块，剩3块×4位置=12。预留不是立即分配专属物理块。">
  <title>预算教学例：6个空闲块，预测下一轮新增1块，余量2块、上限8块；从准入预算扣3块，剩3块×4位置=12。预留不是立即分配专属物理块。</title>
  <defs></defs>
  <rect x="55" y="85" width="125" height="50" fill="var(--color-token, #087f73)"/>
  <text x="117.5" y="114.7" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="13" font-weight="700" fill="var(--color-ink-inverse, #ffffff)" text-anchor="middle">可准入</text>
  <rect x="180" y="85" width="125" height="50" fill="var(--color-token, #087f73)"/>
  <text x="242.5" y="114.7" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="13" font-weight="700" fill="var(--color-ink-inverse, #ffffff)" text-anchor="middle">可准入</text>
  <rect x="305" y="85" width="125" height="50" fill="var(--color-token, #087f73)"/>
  <text x="367.5" y="114.7" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="13" font-weight="700" fill="var(--color-ink-inverse, #ffffff)" text-anchor="middle">可准入</text>
  <rect x="430" y="85" width="125" height="50" fill="var(--color-kv-soft, #e8edff)"/>
  <text x="492.5" y="114.7" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="13" font-weight="700" fill="#3a4f93" text-anchor="middle">预留预算</text>
  <rect x="555" y="85" width="125" height="50" fill="var(--color-kv-soft, #e8edff)"/>
  <text x="617.5" y="114.7" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="13" font-weight="700" fill="#3a4f93" text-anchor="middle">预留预算</text>
  <rect x="680" y="85" width="125" height="50" fill="var(--color-kv-soft, #e8edff)"/>
  <text x="742.5" y="114.7" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="13" font-weight="700" fill="#3a4f93" text-anchor="middle">预留预算</text>
  <path d="M180 85v50M305 85v50M430 85v50M555 85v50M680 85v50" stroke="var(--color-ink, #17211f)" stroke-opacity="0.35" stroke-width="1" fill="none"/>
  <rect x="55" y="85" width="750" height="50" fill="none" stroke="var(--color-ink, #17211f)" stroke-width="1.3"/>
  <text x="35" y="35" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="13.5" font-weight="700" fill="var(--color-ink, #17211f)">本轮准入前：空闲 6 块</text>
  <text x="35" y="190" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="13.5" font-weight="400" fill="var(--color-ink, #17211f)">预留 = min(1 + 2, 8) = 3 块</text>
  <text x="35" y="235" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="13.5" font-weight="400" fill="var(--color-ink, #17211f)">准入预算 = (6 − 3) × 4 = 12 个位置</text>
  <text x="450" y="345" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="13.5" font-weight="400" fill="var(--color-ink-muted, #66716d)" text-anchor="middle" font-style="italic">B=4 为教学假设；真实混合缓存不能由此直接换算显存</text>
</svg>
