<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 250" width="900" height="250" role="img" aria-label="先替在跑的请求留出下一步要的块，剩下的才拿去放新请求">
  <title>先替在跑的请求留出下一步要的块，剩下的才拿去放新请求</title>
  <defs></defs>
  <rect x="60" y="64" width="88" height="56" rx="4" fill="var(--color-token-soft, #ddf4ef)" stroke="var(--color-token, #087f73)" stroke-opacity="0.4" stroke-width="1.3"/>
  <rect x="156" y="64" width="88" height="56" rx="4" fill="var(--color-token-soft, #ddf4ef)" stroke="var(--color-token, #087f73)" stroke-opacity="0.4" stroke-width="1.3"/>
  <rect x="252" y="64" width="88" height="56" rx="4" fill="var(--color-token-soft, #ddf4ef)" stroke="var(--color-token, #087f73)" stroke-opacity="0.4" stroke-width="1.3"/>
  <rect x="348" y="64" width="88" height="56" rx="4" fill="var(--color-token-soft, #ddf4ef)" stroke="var(--color-token, #087f73)" stroke-opacity="0.4" stroke-width="1.3"/>
  <rect x="444" y="64" width="88" height="56" rx="4" fill="var(--color-token-soft, #ddf4ef)" stroke="var(--color-token, #087f73)" stroke-opacity="0.4" stroke-width="1.3"/>
  <rect x="540" y="64" width="88" height="56" rx="4" fill="var(--color-token-soft, #ddf4ef)" stroke="var(--color-token, #087f73)" stroke-opacity="0.4" stroke-width="1.3"/>
  <rect x="636" y="64" width="88" height="56" rx="4" fill="var(--color-kv, #4c65b6)" stroke="var(--color-ink, #17211f)" stroke-width="1.3"/>
  <text x="680" y="96.7" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="13" font-weight="700" fill="var(--color-ink-inverse, #ffffff)" text-anchor="middle">预留</text>
  <rect x="732" y="64" width="88" height="56" rx="4" fill="var(--color-kv, #4c65b6)" stroke="var(--color-ink, #17211f)" stroke-width="1.3"/>
  <text x="776" y="96.7" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="13" font-weight="700" fill="var(--color-ink-inverse, #ffffff)" text-anchor="middle">预留</text>
  <path d="M60 140 v8 h568 v-8" fill="none" stroke="var(--color-ink, #17211f)" stroke-width="1.5"/>
  <text x="344" y="170" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="14" font-weight="700" fill="var(--color-ink, #17211f)" text-anchor="middle">6 块 × 2048 = 12288 个 token，拿去放新请求</text>
  <path d="M636 140 v8 h184 v-8" fill="none" stroke="var(--color-ink, #17211f)" stroke-width="1.5"/>
  <text x="728" y="170" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="14" font-weight="700" fill="var(--color-ink, #17211f)" text-anchor="middle">留给在跑的请求</text>
  <text x="30" y="40" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="14" font-weight="700" fill="var(--color-ink, #17211f)">这一步还空着的块（假设 8 块，每块 2048 个位置）</text>
  <text x="60" y="226" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="13" font-weight="400" fill="#8f3229" font-style="italic">扣完是 0，这一步一条新请求都不放</text>
</svg>
