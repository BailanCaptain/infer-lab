caption: 同一个池子、同样 6 块空闲的两种接法（数为示意）。上行先替 running 留 3 块，余额只够接 X，Y 等下一轮；下行不留，X、Y 都进来，下一步 A 借走最后 1 块，Y 被抢占。留着的块没有记到谁名下。
