<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 356" width="900" height="356" role="img" aria-label="标准 Qwen3-8B 单一 FullAttentionSpec（block_size=128，18 MiB/块）的 BlockPool 借还与前缀复用生命周期。第 2 站调度时：waiting 新请求先查前缀哈希，命中满块直接 touch 增加引用计数实现零重算共享；随后仅对单一缓存组计算新增块缺口（无需 5 组跨档求和），够则从空闲队头借出（ref_cnt 0→1），不够则 running 请求触发队尾抢占、waiting 请求留待下步。第 7 站结束或被抢占时：单组块表倒序归还，ref_cnt 归零才回空闲队尾，HBM 内键值与前缀哈希留在原地供后续请求命中复用。">
  <title>标准 Qwen3-8B 单一 FullAttentionSpec（block_size=128，18 MiB/块）的 BlockPool 借还与前缀复用生命周期。第 2 站调度时：waiting 新请求先查前缀哈希，命中满块直接 touch 增加引用计数实现零重算共享；随后仅对单一缓存组计算新增块缺口（无需 5 组跨档求和），够则从空闲队头借出（ref_cnt 0→1），不够则 running 请求触发队尾抢占、waiting 请求留待下步。第 7 站结束或被抢占时：单组块表倒序归还，ref_cnt 归零才回空闲队尾，HBM 内键值与前缀哈希留在原地供后续请求命中复用。</title>
  <defs><marker id="block-allocation-flow-qwen3-ah-ink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="var(--color-ink, #17211f)"/></marker><marker id="block-allocation-flow-qwen3-ah-kv" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="var(--color-kv, #4c65b6)"/></marker><marker id="block-allocation-flow-qwen3-ah-danger" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="var(--color-danger, #b54237)"/></marker></defs>
  <path d="M228 71 L252 71" fill="none" stroke="var(--color-ink, #17211f)" stroke-width="1.4" marker-end="url(#block-allocation-flow-qwen3-ah-ink)"/>
  <path d="M456 71 L480 71" fill="none" stroke="var(--color-ink, #17211f)" stroke-width="1.4" marker-end="url(#block-allocation-flow-qwen3-ah-ink)"/>
  <path d="M664 71 L688 71" fill="none" stroke="var(--color-kv, #4c65b6)" stroke-width="1.4" marker-end="url(#block-allocation-flow-qwen3-ah-kv)"/>
  <path d="M572 100 L572 148" fill="none" stroke="var(--color-danger, #b54237)" stroke-width="1.4" marker-end="url(#block-allocation-flow-qwen3-ah-danger)"/>
  <path d="M480 176 L448 176" fill="none" stroke="var(--color-ink, #17211f)" stroke-width="1.4" marker-end="url(#block-allocation-flow-qwen3-ah-ink)"/>
  <path d="M664 176 L688 176" fill="none" stroke="var(--color-ink, #17211f)" stroke-width="1.4" marker-end="url(#block-allocation-flow-qwen3-ah-ink)"/>
  <path d="M326 148 L326 122 L520 122 L520 100" fill="none" stroke="var(--color-ink, #17211f)" stroke-width="1.4" marker-end="url(#block-allocation-flow-qwen3-ah-ink)"/>
  <path d="M260 204 L260 274" fill="none" stroke="var(--color-ink, #17211f)" stroke-width="1.4" stroke-dasharray="7 5" marker-end="url(#block-allocation-flow-qwen3-ah-ink)"/>
  <path d="M280 303 L312 303" fill="none" stroke="var(--color-ink, #17211f)" stroke-width="1.4" marker-end="url(#block-allocation-flow-qwen3-ah-ink)"/>
  <path d="M584 303 L616 303" fill="none" stroke="var(--color-ink, #17211f)" stroke-width="1.4" marker-end="url(#block-allocation-flow-qwen3-ah-ink)"/>
  <rect x="24" y="42" width="204" height="58" rx="8" fill="var(--color-control-soft, #f1efe8)" stroke="var(--color-line-strong, #b8bcb5)" stroke-width="1.4"/>
  <text x="126" y="67" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="14" font-weight="700" fill="var(--color-ink, #17211f)" text-anchor="middle">waiting 首次查前缀哈希</text>
  <text x="126" y="86" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="13" font-weight="400" fill="#3a4f93" text-anchor="middle">命中满块直接 touch 复用</text>
  <rect x="252" y="42" width="204" height="58" rx="8" fill="var(--color-control-soft, #f1efe8)" stroke="var(--color-line-strong, #b8bcb5)" stroke-width="1.4"/>
  <text x="354" y="67" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="14" font-weight="700" fill="var(--color-ink, #17211f)" text-anchor="middle">单一缓存组算新增块数</text>
  <text x="354" y="86" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="13" font-weight="400" fill="var(--color-ink-muted, #66716d)" text-anchor="middle">128 tok/块（18 MiB/块）</text>
  <rect x="480" y="42" width="184" height="58" rx="8" fill="var(--color-control-soft, #f1efe8)" stroke="var(--color-line-strong, #b8bcb5)" stroke-width="1.4"/>
  <text x="572" y="67" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="14" font-weight="700" fill="var(--color-ink, #17211f)" text-anchor="middle">对比空闲池剩余块数</text>
  <text x="572" y="86" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="13" font-weight="400" fill="var(--color-ink-muted, #66716d)" text-anchor="middle">单组一笔账，无 5 组折算</text>
  <rect x="688" y="42" width="188" height="58" rx="8" fill="var(--color-kv-soft, #e8edff)" stroke="var(--color-kv, #4c65b6)" stroke-width="1.4"/>
  <text x="782" y="67" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="14" font-weight="700" fill="var(--color-ink, #17211f)" text-anchor="middle">够：从队头借出新块</text>
  <text x="782" y="86" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="13" font-weight="400" fill="#3a4f93" text-anchor="middle">get_new_blocks 计数 0→1</text>
  <rect x="480" y="148" width="184" height="56" rx="8" fill="var(--color-control-soft, #f1efe8)" stroke="var(--color-line-strong, #b8bcb5)" stroke-width="1.4"/>
  <text x="572" y="172" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="14" font-weight="700" fill="var(--color-ink, #17211f)" text-anchor="middle">不够：一块都不借</text>
  <text x="572" y="191" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="13" font-weight="400" fill="#8f3229" text-anchor="middle">allocate_slots 返回空</text>
  <rect x="204" y="148" width="244" height="56" rx="8" fill="var(--color-control-soft, #f1efe8)" stroke="var(--color-line-strong, #b8bcb5)" stroke-width="1.4"/>
  <text x="326" y="172" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="14" font-weight="700" fill="var(--color-ink, #17211f)" text-anchor="middle">running 请求：抢占队尾</text>
  <text x="326" y="191" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="13" font-weight="400" fill="var(--color-ink-muted, #66716d)" text-anchor="middle">释放队尾请求块并重排本步</text>
  <rect x="688" y="148" width="188" height="56" rx="8" fill="var(--color-control-soft, #f1efe8)" stroke="var(--color-line-strong, #b8bcb5)" stroke-width="1.4"/>
  <text x="782" y="172" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="14" font-weight="700" fill="var(--color-ink, #17211f)" text-anchor="middle">waiting 请求：下步再试</text>
  <text x="782" y="191" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="13" font-weight="400" fill="var(--color-ink-muted, #66716d)" text-anchor="middle">不抢占在途请求</text>
  <rect x="24" y="274" width="256" height="58" rx="8" fill="var(--color-control-soft, #f1efe8)" stroke="var(--color-line-strong, #b8bcb5)" stroke-width="1.4"/>
  <text x="152" y="299" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="14" font-weight="700" fill="var(--color-ink, #17211f)" text-anchor="middle">单组块表倒序归还（free）</text>
  <text x="152" y="318" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="13" font-weight="400" fill="#065f56" text-anchor="middle">请求正常结束或被抢占时触发</text>
  <rect x="312" y="274" width="272" height="58" rx="8" fill="var(--color-control-soft, #f1efe8)" stroke="var(--color-line-strong, #b8bcb5)" stroke-width="1.4"/>
  <text x="448" y="299" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="14" font-weight="700" fill="var(--color-ink, #17211f)" text-anchor="middle">每块 ref_cnt 减 1</text>
  <text x="448" y="318" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="13" font-weight="400" fill="#3a4f93" text-anchor="middle">归 0 且非 null_block 才回空闲队尾</text>
  <rect x="616" y="274" width="260" height="58" rx="8" fill="var(--color-control-soft, #f1efe8)" stroke="var(--color-line-strong, #b8bcb5)" stroke-width="1.4"/>
  <text x="746" y="299" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="14" font-weight="700" fill="var(--color-ink, #17211f)" text-anchor="middle">物理 KV 与块哈希留在原地</text>
  <text x="746" y="318" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="13" font-weight="400" fill="#3a4f93" text-anchor="middle">被新请求覆写前仍可前缀命中</text>
  <text x="24" y="24" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="13.5" font-weight="700" fill="var(--color-ink, #17211f)">第 2 站 调度借块（allocate_slots）：前缀共享 + 单一 FullAttention 组分配</text>
  <text x="24" y="256" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="13.5" font-weight="700" fill="var(--color-ink, #17211f)">第 7 站 请求收尾或抢占退块（free → free_blocks）</text>
  <text x="584" y="128" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="13.5" font-weight="400" fill="#8f3229">不够</text>
  <text x="340" y="138" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="13.5" font-weight="400" fill="var(--color-ink, #17211f)">释放后重试</text>
</svg>
