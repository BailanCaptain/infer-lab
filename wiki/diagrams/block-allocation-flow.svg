<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 336" width="900" height="336" role="img" aria-label="调度器向池子要块的判断顺序，以及还块走的路。第 2 站，上排简化画出进入分配前后的主要步骤。只有 waiting 中已算数为 0 的请求先查前缀（本部署关闭前缀缓存，返回空）；running 不重复查。启用 full_sequence_must_fit 的准入还会先检查整段是否能容纳，通过后才归还窗口外的块。随后， 5 个缓存组各算还差几块、加起来和空闲块数比一次。够就一起借出；不够就一块都不借，由调度器处理：还在跑的请求去抢占 running 队尾那条，再算一次；等待中的新请求不抢占，留到下一步。第 7 站请求结束时，或者一条请求被抢占时，都走下排：每个组把自己的块倒序交回，计数减到 0 的块回队列，数据不擦。">
  <title>调度器向池子要块的判断顺序，以及还块走的路。第 2 站，上排简化画出进入分配前后的主要步骤。只有 waiting 中已算数为 0 的请求先查前缀（本部署关闭前缀缓存，返回空）；running 不重复查。启用 full_sequence_must_fit 的准入还会先检查整段是否能容纳，通过后才归还窗口外的块。随后， 5 个缓存组各算还差几块、加起来和空闲块数比一次。够就一起借出；不够就一块都不借，由调度器处理：还在跑的请求去抢占 running 队尾那条，再算一次；等待中的新请求不抢占，留到下一步。第 7 站请求结束时，或者一条请求被抢占时，都走下排：每个组把自己的块倒序交回，计数减到 0 的块回队列，数据不擦。</title>
  <defs><marker id="block-allocation-flow-ah-ink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="var(--color-ink, #17211f)"/></marker><marker id="block-allocation-flow-ah-kv" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="var(--color-kv, #4c65b6)"/></marker><marker id="block-allocation-flow-ah-danger" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="var(--color-danger, #b54237)"/></marker></defs>
  <path d="M214 64 L240 64" fill="none" stroke="var(--color-ink, #17211f)" stroke-width="1.4" marker-end="url(#block-allocation-flow-ah-ink)"/>
  <path d="M430 64 L456 64" fill="none" stroke="var(--color-ink, #17211f)" stroke-width="1.4" marker-end="url(#block-allocation-flow-ah-ink)"/>
  <path d="M650 64 L676 64" fill="none" stroke="var(--color-kv, #4c65b6)" stroke-width="1.4" marker-end="url(#block-allocation-flow-ah-kv)"/>
  <path d="M553 92 L553 140" fill="none" stroke="var(--color-danger, #b54237)" stroke-width="1.4" marker-end="url(#block-allocation-flow-ah-danger)"/>
  <path d="M456 168 L426 168" fill="none" stroke="var(--color-ink, #17211f)" stroke-width="1.4" marker-end="url(#block-allocation-flow-ah-ink)"/>
  <path d="M650 168 L676 168" fill="none" stroke="var(--color-ink, #17211f)" stroke-width="1.4" marker-end="url(#block-allocation-flow-ah-ink)"/>
  <path d="M311 140 L311 116 L500 116 L500 92" fill="none" stroke="var(--color-ink, #17211f)" stroke-width="1.4" marker-end="url(#block-allocation-flow-ah-ink)"/>
  <path d="M250 196 L250 262" fill="none" stroke="var(--color-ink, #17211f)" stroke-width="1.4" stroke-dasharray="7 5" marker-end="url(#block-allocation-flow-ah-ink)"/>
  <path d="M274 290 L306 290" fill="none" stroke="var(--color-ink, #17211f)" stroke-width="1.4" marker-end="url(#block-allocation-flow-ah-ink)"/>
  <path d="M576 290 L608 290" fill="none" stroke="var(--color-ink, #17211f)" stroke-width="1.4" marker-end="url(#block-allocation-flow-ah-ink)"/>
  <rect x="24" y="36" width="190" height="56" rx="8" fill="var(--color-surface-sunken, #ece9df)" stroke="var(--color-ink, #17211f)" stroke-width="1.5"/>
  <text x="119" y="60" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="14" font-weight="700" fill="var(--color-ink, #17211f)" text-anchor="middle">waiting 首次查前缀</text>
  <text x="119" y="79" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="13" font-weight="400" fill="var(--color-ink, #17211f)" text-anchor="middle">已算为 0；running 跳过</text>
  <rect x="240" y="36" width="190" height="56" rx="8" fill="var(--color-surface-sunken, #ece9df)" stroke="var(--color-ink, #17211f)" stroke-width="1.5"/>
  <text x="335" y="60" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="14" font-weight="700" fill="var(--color-ink, #17211f)" text-anchor="middle">先还窗口外的块</text>
  <text x="335" y="79" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="13" font-weight="400" fill="var(--color-ink, #17211f)" text-anchor="middle">只有尾状态组会有</text>
  <rect x="456" y="36" width="194" height="56" rx="8" fill="var(--color-surface-sunken, #ece9df)" stroke="var(--color-ink, #17211f)" stroke-width="1.5"/>
  <text x="553" y="60" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="14" font-weight="700" fill="var(--color-ink, #17211f)" text-anchor="middle">5 组各算还差几块</text>
  <text x="553" y="79" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="13" font-weight="400" fill="var(--color-ink, #17211f)" text-anchor="middle">加起来，和空闲块数比</text>
  <rect x="676" y="36" width="200" height="56" rx="8" fill="var(--color-kv, #4c65b6)" stroke="var(--color-ink, #17211f)" stroke-width="1.5"/>
  <text x="776" y="60" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="14" font-weight="700" fill="var(--color-ink-inverse, #ffffff)" text-anchor="middle">够：一起借出</text>
  <text x="776" y="79" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="13" font-weight="400" fill="var(--color-ink-inverse, #ffffff)" text-anchor="middle">从队头取，计数 0 → 1</text>
  <rect x="456" y="140" width="194" height="56" rx="8" fill="var(--color-surface-sunken, #ece9df)" stroke="var(--color-ink, #17211f)" stroke-width="1.5"/>
  <text x="553" y="164" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="14" font-weight="700" fill="var(--color-ink, #17211f)" text-anchor="middle">不够：一块都不借</text>
  <text x="553" y="183" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="13" font-weight="400" fill="var(--color-ink, #17211f)" text-anchor="middle">告诉调度器借不到</text>
  <rect x="196" y="140" width="230" height="56" rx="8" fill="var(--color-surface-sunken, #ece9df)" stroke="var(--color-ink, #17211f)" stroke-width="1.5"/>
  <text x="311" y="164" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="14" font-weight="700" fill="var(--color-ink, #17211f)" text-anchor="middle">running 请求：抢占队尾</text>
  <text x="311" y="183" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="13" font-weight="400" fill="var(--color-ink, #17211f)" text-anchor="middle">那条的块全还回，已算清零</text>
  <rect x="676" y="140" width="200" height="56" rx="8" fill="var(--color-surface-sunken, #ece9df)" stroke="var(--color-ink, #17211f)" stroke-width="1.5"/>
  <text x="776" y="164" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="14" font-weight="700" fill="var(--color-ink, #17211f)" text-anchor="middle">新请求：下一步再试</text>
  <text x="776" y="183" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="13" font-weight="400" fill="var(--color-ink, #17211f)" text-anchor="middle">不抢占，本步不再接纳</text>
  <rect x="24" y="262" width="250" height="56" rx="8" fill="var(--color-surface-sunken, #ece9df)" stroke="var(--color-ink, #17211f)" stroke-width="1.5"/>
  <text x="149" y="286" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="14" font-weight="700" fill="var(--color-ink, #17211f)" text-anchor="middle">每个组把块倒序交回</text>
  <text x="149" y="305" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="13" font-weight="400" fill="var(--color-ink, #17211f)" text-anchor="middle">请求结束，或被抢占</text>
  <rect x="306" y="262" width="270" height="56" rx="8" fill="var(--color-surface-sunken, #ece9df)" stroke="var(--color-ink, #17211f)" stroke-width="1.5"/>
  <text x="441" y="286" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="14" font-weight="700" fill="var(--color-ink, #17211f)" text-anchor="middle">每块计数减 1</text>
  <text x="441" y="305" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="13" font-weight="400" fill="var(--color-ink, #17211f)" text-anchor="middle">到 0 且不是占位块，才回队列</text>
  <rect x="608" y="262" width="268" height="56" rx="8" fill="var(--color-surface-sunken, #ece9df)" stroke="var(--color-ink, #17211f)" stroke-width="1.5"/>
  <text x="742" y="286" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="14" font-weight="700" fill="var(--color-ink, #17211f)" text-anchor="middle">数据留在原处</text>
  <text x="742" y="305" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="13" font-weight="400" fill="var(--color-ink, #17211f)" text-anchor="middle">后续写入时才被覆盖</text>
  <text x="24" y="22" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="13" font-weight="700" fill="var(--color-ink, #17211f)">第 2 站 调度：简化路径，整段准入检查见图注</text>
  <text x="24" y="246" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="13" font-weight="700" fill="var(--color-ink, #17211f)">第 7 站 收尾，或被抢占时</text>
  <text x="562" y="122" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="12" font-weight="400" fill="var(--color-ink, #17211f)">不够</text>
  <text x="320" y="132" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="12" font-weight="400" fill="var(--color-ink, #17211f)">再算一次</text>
</svg>
