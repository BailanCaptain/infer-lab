layout: figure
id: block-allocation-flow
caption: 调度器向池子要块的判断顺序，以及还块走的路。第 2 站，上排简化画出进入分配前后的主要步骤。只有 waiting 中已算数为 0 的请求先查前缀（本部署关闭前缀缓存，返回空）；running 不重复查。启用 full_sequence_must_fit 的准入还会先检查整段是否能容纳，通过后才归还窗口外的块。随后， 5 个缓存组各算还差几块、加起来和空闲块数比一次。够就一起借出；不够就一块都不借，由调度器处理：还在跑的请求去抢占 running 队尾那条，再算一次；等待中的新请求不抢占，留到下一步。第 7 站请求结束时，或者一条请求被抢占时，都走下排：每个组把自己的块倒序交回，计数减到 0 的块回队列，数据不擦。
size: [900, 336]
items:
  - { at: [24, 36], size: [190, 56], text: waiting 首次查前缀, sub: 已算为 0；running 跳过, tone: control, style: plain }
  - { at: [240, 36], size: [190, 56], text: 先还窗口外的块, sub: 只有尾状态组会有, tone: kv, style: plain }
  - { at: [456, 36], size: [194, 56], text: 5 组各算还差几块, sub: 加起来，和空闲块数比, tone: control, style: plain }
  - { at: [676, 36], size: [200, 56], text: 够：一起借出, sub: 从队头取，计数 0 → 1, tone: kv }
  - { at: [456, 140], size: [194, 56], text: 不够：一块都不借, sub: 告诉调度器借不到, tone: danger, style: plain }
  - { at: [196, 140], size: [230, 56], text: running 请求：抢占队尾, sub: 那条的块全还回，已算清零, tone: control, style: plain }
  - { at: [676, 140], size: [200, 56], text: 新请求：下一步再试, sub: 不抢占，本步不再接纳, tone: control, style: plain }
  - { at: [24, 262], size: [250, 56], text: 每个组把块倒序交回, sub: 请求结束，或被抢占, tone: token, style: plain }
  - { at: [306, 262], size: [270, 56], text: 每块计数减 1, sub: 到 0 且不是占位块，才回队列, tone: kv, style: plain }
  - { at: [608, 262], size: [268, 56], text: 数据留在原处, sub: 后续写入时才被覆盖, tone: kv, style: plain }
