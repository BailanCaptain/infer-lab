<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 492" width="900" height="492" role="img" aria-label="一个只有 7 块可借的小池子（0 号块开机就被摘出来当占位，不在队里），走四步。① A 从队头借走块 1、2，两块的引用计数从 0 变 1。② B 的开头和 A 一样，直接共用 A 已经写满的块 1，计数变 2；B 的后半段不同，另从队头借块 3。虚线表示两条请求指着同一块。③ A 结束，倒着还：块 2 计数降到 0，排回队尾；块 1 只降到 1，B 还在用，不回队。④ B 结束，块 3、块 1 计数都降到 0，按倒序排回队尾。归还只改计数和排队位置，块里的数据不擦；排回队尾的位置按 v0.23 的规则画。">
  <title>一个只有 7 块可借的小池子（0 号块开机就被摘出来当占位，不在队里），走四步。① A 从队头借走块 1、2，两块的引用计数从 0 变 1。② B 的开头和 A 一样，直接共用 A 已经写满的块 1，计数变 2；B 的后半段不同，另从队头借块 3。虚线表示两条请求指着同一块。③ A 结束，倒着还：块 2 计数降到 0，排回队尾；块 1 只降到 1，B 还在用，不回队。④ B 结束，块 3、块 1 计数都降到 0，按倒序排回队尾。归还只改计数和排队位置，块里的数据不擦；排回队尾的位置按 v0.23 的规则画。</title>
