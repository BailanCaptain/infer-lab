layout: figure
id: block-allocation
caption: 一个只有 7 块可借的小池子（0 号块开机就被摘出来当占位，不在队里），走四步。① A 从队头借走块 1、2，两块的引用计数从 0 变 1。② B 的开头和 A 一样，直接共用 A 已经写满的块 1，计数变 2；B 的后半段不同，另从队头借块 3。虚线表示两条请求指着同一块。③ A 结束，倒着还：块 2 计数降到 0，排回队尾；块 1 只降到 1，B 还在用，不回队。④ B 结束，块 3、块 1 计数都降到 0，按倒序排回队尾。归还只改计数和排队位置，块里的数据不擦；排回队尾的位置按 v0.23 的规则画。
size: [900, 492]
items:
  # ① A 借 2 块
  - { at: [200, 46], size: [40, 42], text: A, tone: token }
  - { at: [250, 46], size: [78, 42], text: 块 1, sub: 计数 1, tone: kv }
  - { at: [336, 46], size: [78, 42], text: 块 2, sub: 计数 1, tone: kv }
  - { at: [200, 102], size: [40, 42], text: B, tone: token, style: faded }
  # ② B 共用块 1，另借块 3
  - { at: [200, 158], size: [40, 42], text: A, tone: token }
  - { at: [250, 158], size: [78, 42], text: 块 1, sub: 计数 2, tone: kv }
  - { at: [336, 158], size: [78, 42], text: 块 2, sub: 计数 1, tone: kv }
  - { at: [200, 214], size: [40, 42], text: B, tone: token }
  - { at: [250, 214], size: [78, 42], text: 块 1, sub: 计数 2, tone: kv }
  - { at: [336, 214], size: [78, 42], text: 块 3, sub: 计数 1, tone: kv }
  # ③ A 结束
  - { at: [200, 270], size: [40, 42], text: A, tone: token, style: faded }
  - { at: [250, 270], size: [164, 42], text: A 结束, sub: 倒着还：先块 2，再块 1, tone: token, style: faded }
  - { at: [200, 326], size: [40, 42], text: B, tone: token }
  - { at: [250, 326], size: [78, 42], text: 块 1, sub: 计数 1, tone: kv }
  - { at: [336, 326], size: [78, 42], text: 块 3, sub: 计数 1, tone: kv }
  # ④ B 结束
  - { at: [200, 382], size: [40, 42], text: B, tone: token, style: faded }
  - { at: [250, 382], size: [164, 42], text: B 结束, sub: 倒着还：先块 3，再块 1, tone: token, style: faded }
