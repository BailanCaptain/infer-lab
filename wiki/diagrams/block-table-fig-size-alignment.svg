<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 520" width="900" height="520" role="img" aria-label="昇腾 v0.30.0 四路 block_size 对齐漏斗与 640 拆 5x128 映射边界图" font-family="var(--font-sans)">
  <title>昇腾 v0.30.0 平台 refresh_block_size 四路对齐漏斗、GLM 640 分配块到 5×128 内核块的零搬运展开，以及块表占位 0 与槽位填充 -1 的区分对照。</title>
  <desc>上半部分按源码先后展示 v0.30.0 refresh_block_size 的四路对齐逻辑（C8_MXFP 512、deepseek_v4 32/64/128、is_hybrid 交给平台钩子、通用与 xlite 回落 128）；下半部分展示 640 物理块展开为 5 个 128 内核块的零搬运映射及 0 与 -1 两种空标记的区别。</desc>
  <defs>
    <marker id="bt-arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto">
      <path d="M 0 1.5 L 8.5 5 L 0 8.5 z" fill="#4c65b6"/>
    </marker>
  </defs>

  <text x="14" y="28" font-size="16" font-weight="700" fill="#17211f">一、昇腾 v0.30.0 平台四路 block_size 对齐漏斗（refresh_block_size 按序判定）</text>

  <rect x="14" y="44" width="872" height="40" rx="8" fill="#ece9df" stroke="#b8bcb5" stroke-width="1.3"/>
  <text x="450" y="69" text-anchor="middle" font-size="14" fill="#17211f"><tspan font-weight="700" fill="#3a4f93">入口前置：</tspan>独立 draft 模型直接跳过；未指定 <tspan font-family="var(--font-mono)" font-weight="700">--block-size</tspan> 时默认先置 <tspan font-family="var(--font-mono)" font-weight="700">128</tspan>，再依次进入下列四路检查</text>

  <path d="M 117 84 L 117 104" fill="none" stroke="#4c65b6" stroke-width="1.8" marker-end="url(#bt-arr)"/>
  <path d="M 339 84 L 339 104" fill="none" stroke="#4c65b6" stroke-width="1.8" marker-end="url(#bt-arr)"/>
  <path d="M 561 84 L 561 104" fill="none" stroke="#4c65b6" stroke-width="1.8" marker-end="url(#bt-arr)"/>
  <path d="M 783 84 L 783 104" fill="none" stroke="#4c65b6" stroke-width="1.8" marker-end="url(#bt-arr)"/>

  <rect x="14" y="110" width="206" height="190" rx="9" fill="#fff0e9" stroke="#b54237" stroke-width="1.5"/>
  <text x="117" y="136" text-anchor="middle" font-size="15" font-weight="700" fill="#8f3229">1. A5 C8_MXFP 量化</text>
  <text x="117" y="162" text-anchor="middle" font-size="13.5" fill="#17211f">须为 <tspan font-family="var(--font-mono)" font-weight="700">512</tspan> 的整数倍</text>
  <rect x="26" y="176" width="182" height="50" rx="6" fill="#ffffff" stroke="#b54237" stroke-width="1.1"/>
  <text x="117" y="197" text-anchor="middle" font-size="13.5" font-weight="700" fill="#8f3229">手设非倍数 → ValueError</text>
  <text x="117" y="217" text-anchor="middle" font-size="13.5" fill="#4d5652">未手设 → 自动改 512</text>
  <text x="117" y="254" text-anchor="middle" font-size="13.5" fill="#4d5652">约束调度块装满整颗</text>
  <text x="117" y="276" text-anchor="middle" font-size="13.5" fill="#4d5652">512-token 量化内核块</text>

  <rect x="236" y="110" width="206" height="190" rx="9" fill="#fff4cf" stroke="#c78300" stroke-width="1.5"/>
  <text x="339" y="136" text-anchor="middle" font-size="15" font-weight="700" fill="#936300">2. deepseek_v4 模型</text>
  <text x="339" y="162" text-anchor="middle" font-size="13.5" fill="#17211f">仅认 <tspan font-family="var(--font-mono)" font-weight="700">[32, 64, 128]</tspan></text>
  <rect x="248" y="176" width="182" height="50" rx="6" fill="#ffffff" stroke="#c78300" stroke-width="1.1"/>
  <text x="339" y="197" text-anchor="middle" font-size="13.5" font-weight="700" fill="#936300">超范围 → 告警并设 32</text>
  <text x="339" y="217" text-anchor="middle" font-size="13.5" fill="#4d5652">随后直接返回</text>
  <text x="339" y="254" text-anchor="middle" font-size="13.5" fill="#4d5652">不会再落入下方通用</text>
  <text x="339" y="276" text-anchor="middle" font-size="13.5" fill="#4d5652">128 钳位分支</text>

  <rect x="458" y="110" width="206" height="190" rx="9" fill="#f7e7f2" stroke="#9a4b86" stroke-width="1.5"/>
  <text x="561" y="136" text-anchor="middle" font-size="15" font-weight="700" fill="#7a3a6a">3. 混合架构 is_hybrid</text>
  <text x="561" y="162" text-anchor="middle" font-size="13.5" fill="#17211f">直接放行给平台钩子</text>
  <rect x="470" y="176" width="182" height="50" rx="6" fill="#ffffff" stroke="#9a4b86" stroke-width="1.1"/>
  <text x="561" y="197" text-anchor="middle" font-size="13.5" font-family="var(--font-mono)" font-weight="700" fill="#7a3a6a">_align_hybrid_block</text>
  <text x="561" y="217" text-anchor="middle" font-size="13.5" fill="#4d5652">按模型专属几何对齐</text>
  <text x="561" y="254" text-anchor="middle" font-size="13.5" fill="#4d5652">KV 传输 align 模式须</text>
  <text x="561" y="276" text-anchor="middle" font-size="13.5" font-family="var(--font-mono)" fill="#4d5652">mamba % block == 0</text>

  <rect x="680" y="110" width="206" height="190" rx="9" fill="#ddf4ef" stroke="#087f73" stroke-width="1.5"/>
  <text x="783" y="136" text-anchor="middle" font-size="15" font-weight="700" fill="#065f56">4. 通用与 xlite 钳位</text>
  <text x="783" y="162" text-anchor="middle" font-size="13.5" fill="#17211f">非混合模型统一回 128</text>
  <rect x="692" y="176" width="182" height="50" rx="6" fill="#ffffff" stroke="#087f73" stroke-width="1.1"/>
  <text x="783" y="197" text-anchor="middle" font-size="13.5" font-weight="700" fill="#065f56">开前缀/分块 → 设 128</text>
  <text x="783" y="217" text-anchor="middle" font-size="13.5" fill="#4d5652">xlite 且 &gt;128 → 设 128</text>
  <text x="783" y="254" text-anchor="middle" font-size="13.5" fill="#4d5652">解释为何常看到日志</text>
  <text x="783" y="276" text-anchor="middle" font-size="13.5" fill="#4d5652">自动把块长改为 128</text>

  <line x1="14" y1="318" x2="886" y2="318" stroke="#b8bcb5" stroke-width="1.4" stroke-dasharray="6 4"/>

  <text x="14" y="346" font-size="16" font-weight="700" fill="#17211f">二、分配块 640 ↔ 内核块 128 零搬运展开，以及两类空占位值区分</text>

  <rect x="14" y="362" width="424" height="144" rx="9" fill="#e8edff" stroke="#4c65b6" stroke-width="1.4"/>
  <text x="28" y="388" font-size="15" font-weight="700" fill="#3a4f93">GLM full 组：调度 640 拆成 5 格 128（不搬显存）</text>
  <text x="28" y="416" font-size="13.5" fill="#17211f">分配器给 1 个物理块号 <tspan font-family="var(--font-mono)" font-weight="700">b</tspan> → 块表自动展开 5 格：</text>
  <rect x="28" y="428" width="396" height="32" rx="6" fill="#ffffff" stroke="#4c65b6" stroke-width="1.1"/>
  <text x="226" y="449" text-anchor="middle" font-size="13.5" font-family="var(--font-mono)" font-weight="700" fill="#3a4f93">5b  |  5b+1  |  5b+2  |  5b+3  |  5b+4</text>
  <text x="28" y="488" font-size="13.5" fill="#4d5652">槽位恒等 <tspan font-family="var(--font-mono)" font-weight="700">640b + (p mod 640)</tspan>；indexer K 隔 5 格 ÷5 折回</text>

  <rect x="462" y="362" width="424" height="144" rx="9" fill="#ffffff" stroke="#b54237" stroke-width="1.4"/>
  <text x="476" y="388" font-size="15" font-weight="700" fill="#8f3229">排雷：块表里的 0 与槽位里的 −1 不是同一种空</text>
  <rect x="476" y="402" width="396" height="42" rx="6" fill="#fff4cf" stroke="#c78300" stroke-width="1.1"/>
  <text x="490" y="428" font-size="13.5" fill="#17211f"><tspan font-weight="700" fill="#936300">block_table 填 0：</tspan>预留占位块 <tspan font-family="var(--font-mono)" font-weight="700">null_block</tspan>，从不分给请求</text>
  <rect x="476" y="454" width="396" height="42" rx="6" fill="#ddf4ef" stroke="#087f73" stroke-width="1.1"/>
  <text x="490" y="480" font-size="13.5" fill="#17211f"><tspan font-weight="700" fill="#065f56">slot_mapping 填 −1：</tspan><tspan font-family="var(--font-mono)" font-weight="700">PAD_SLOT_ID</tspan>，算子跳过不写缓存</text>
</svg>
