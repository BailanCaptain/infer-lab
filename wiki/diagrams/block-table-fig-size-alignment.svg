<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 546" width="900" height="546" role="img" aria-label="昇腾 v0.30.0 四路 block_size 对齐漏斗与 640 拆 5x128 映射边界图" font-family="var(--font-sans)">
  <title>昇腾 v0.30.0 平台 refresh_block_size 四路对齐漏斗、GLM 640 分配块到 5×128 内核块的零搬运展开，以及块表占位 0 与槽位填充 -1 的区分对照。</title>
  <desc>上半部分按源码先后展示 v0.30.0 refresh_block_size 的四路对齐逻辑（C8_MXFP 512、deepseek_v4 32/64/128、is_hybrid 交给平台钩子、非混合模型开启前缀缓存/分块预填充或 xlite 时回落 128）；下半部分左侧用 5 格连续块带画出 640 物理块零搬运拆成 5 个 128 内核块以及 indexer K 每隔 5 格除以 5 折回 b 的路径，右侧区分块表占位 0 与槽位填充 -1。</desc>
  <defs>
    <marker id="bt-arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto">
      <path d="M 0 1.5 L 8.5 5 L 0 8.5 z" fill="#4c65b6"/>
    </marker>
    <marker id="bt-arr-p" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto">
      <path d="M 0 1.5 L 8.5 5 L 0 8.5 z" fill="#9a4b86"/>
    </marker>
  </defs>

  <text x="14" y="26" font-size="16" font-weight="700" fill="#17211f">一、昇腾 v0.30.0 平台四路 block_size 对齐漏斗（refresh_block_size 按序判定）</text>

  <rect x="14" y="40" width="872" height="38" rx="8" fill="#ece9df" stroke="#b8bcb5" stroke-width="1.3"/>
  <text x="450" y="64" text-anchor="middle" font-size="14" fill="#17211f"><tspan font-weight="700" fill="#3a4f93">入口前置：</tspan>独立 draft 模型直接跳过；未指定 <tspan font-family="var(--font-mono)" font-weight="700">--block-size</tspan> 时默认先置 <tspan font-family="var(--font-mono)" font-weight="700">128</tspan>，再依次进入下列四路检查</text>

  <path d="M 117 78 L 117 98" fill="none" stroke="#4c65b6" stroke-width="1.8" marker-end="url(#bt-arr)"/>
  <path d="M 339 78 L 339 98" fill="none" stroke="#4c65b6" stroke-width="1.8" marker-end="url(#bt-arr)"/>
  <path d="M 561 78 L 561 98" fill="none" stroke="#4c65b6" stroke-width="1.8" marker-end="url(#bt-arr)"/>
  <path d="M 783 78 L 783 98" fill="none" stroke="#4c65b6" stroke-width="1.8" marker-end="url(#bt-arr)"/>

  <rect x="14" y="102" width="206" height="176" rx="9" fill="#fff0e9" stroke="#b54237" stroke-width="1.5"/>
  <text x="117" y="128" text-anchor="middle" font-size="15" font-weight="700" fill="#8f3229">1. A5 C8_MXFP 量化</text>
  <text x="117" y="152" text-anchor="middle" font-size="13.5" fill="#17211f">须为 <tspan font-family="var(--font-mono)" font-weight="700">512</tspan> 的整数倍</text>
  <rect x="26" y="164" width="182" height="50" rx="6" fill="#ffffff" stroke="#b54237" stroke-width="1.1"/>
  <text x="117" y="185" text-anchor="middle" font-size="13.5" font-weight="700" fill="#8f3229">手设非倍数 → ValueError</text>
  <text x="117" y="205" text-anchor="middle" font-size="13.5" fill="#4d5652">未手设 → 自动改 512</text>
  <text x="117" y="238" text-anchor="middle" font-size="13.5" fill="#4d5652">装满整颗 512-token</text>
  <text x="117" y="260" text-anchor="middle" font-size="13.5" fill="#4d5652">QFA 量化内核块</text>

  <rect x="236" y="102" width="206" height="176" rx="9" fill="#fff4cf" stroke="#c78300" stroke-width="1.5"/>
  <text x="339" y="128" text-anchor="middle" font-size="15" font-weight="700" fill="#936300">2. deepseek_v4 模型</text>
  <text x="339" y="152" text-anchor="middle" font-size="13.5" fill="#17211f">仅认 <tspan font-family="var(--font-mono)" font-weight="700">[32, 64, 128]</tspan></text>
  <rect x="248" y="164" width="182" height="50" rx="6" fill="#ffffff" stroke="#c78300" stroke-width="1.1"/>
  <text x="339" y="185" text-anchor="middle" font-size="13.5" font-weight="700" fill="#936300">超范围 → 告警并设 32</text>
  <text x="339" y="205" text-anchor="middle" font-size="13.5" fill="#4d5652">随后直接返回</text>
  <text x="339" y="238" text-anchor="middle" font-size="13.5" fill="#4d5652">不落入右侧通用</text>
  <text x="339" y="260" text-anchor="middle" font-size="13.5" fill="#4d5652">128 钳位分支</text>

  <rect x="458" y="102" width="206" height="176" rx="9" fill="#f7e7f2" stroke="#9a4b86" stroke-width="1.5"/>
  <text x="561" y="128" text-anchor="middle" font-size="15" font-weight="700" fill="#7a3a6a">3. 混合架构 is_hybrid</text>
  <text x="561" y="152" text-anchor="middle" font-size="13.5" fill="#17211f">直接放行给平台钩子</text>
  <rect x="470" y="164" width="182" height="50" rx="6" fill="#ffffff" stroke="#9a4b86" stroke-width="1.1"/>
  <text x="561" y="185" text-anchor="middle" font-size="13.5" font-family="var(--font-mono)" font-weight="700" fill="#7a3a6a">_align_hybrid_block</text>
  <text x="561" y="205" text-anchor="middle" font-size="13.5" fill="#4d5652">按模型专属几何对齐</text>
  <text x="561" y="238" text-anchor="middle" font-size="13.5" fill="#4d5652">KV 传输 align 模式须</text>
  <text x="561" y="260" text-anchor="middle" font-size="13.5" font-family="var(--font-mono)" fill="#4d5652">mamba % block == 0</text>

  <rect x="680" y="102" width="206" height="176" rx="9" fill="#ddf4ef" stroke="#087f73" stroke-width="1.5"/>
  <text x="783" y="128" text-anchor="middle" font-size="15" font-weight="700" fill="#065f56">4. 通用与 xlite 钳位</text>
  <text x="783" y="152" text-anchor="middle" font-size="13.5" fill="#17211f">满足下述条件才改 128</text>
  <rect x="692" y="164" width="182" height="50" rx="6" fill="#ffffff" stroke="#087f73" stroke-width="1.1"/>
  <text x="783" y="185" text-anchor="middle" font-size="13.5" font-weight="700" fill="#065f56">开前缀/分块 → 设 128</text>
  <text x="783" y="205" text-anchor="middle" font-size="13.5" fill="#4d5652">xlite 且 &gt;128 → 设 128</text>
  <text x="783" y="238" text-anchor="middle" font-size="13.5" fill="#4d5652">双关且非 xlite 则保留</text>
  <text x="783" y="260" text-anchor="middle" font-size="13.5" fill="#4d5652">用户指定的自定义块长</text>

  <line x1="14" y1="296" x2="886" y2="296" stroke="#b8bcb5" stroke-width="1.4" stroke-dasharray="6 4"/>

  <text x="14" y="324" font-size="16" font-weight="700" fill="#17211f">二、分配块 640 ↔ 5 格 128 内核块零搬运展开，及两类空占位值区分</text>

  <!-- Bottom left: visual 5-cell block strip + indexer /5 fold-back -->
  <rect x="14" y="340" width="466" height="194" rx="10" fill="#e8edff" stroke="#4c65b6" stroke-width="1.5"/>
  <text x="28" y="365" font-size="14.5" font-weight="700" fill="#3a4f93">GLM full 组：1 个 640 物理块号 b = 5 格连续 128 内核块</text>

  <!-- Top physical block b bar -->
  <rect x="28" y="378" width="438" height="28" rx="5" fill="#ffffff" stroke="#4c65b6" stroke-width="1.3"/>
  <text x="247" y="397" text-anchor="middle" font-size="13.5" font-family="var(--font-mono)" font-weight="700" fill="#17211f">物理块 b（640 tok · HBM 原地不动）</text>

  <!-- 5 expanded 128 cells -->
  <rect x="28" y="416" width="84" height="44" rx="5" fill="#ddf4ef" stroke="#087f73" stroke-width="1.3"/>
  <text x="70" y="435" text-anchor="middle" font-size="13.5" font-family="var(--font-mono)" font-weight="700" fill="#065f56">5b</text>
  <text x="70" y="453" text-anchor="middle" font-size="13" fill="#4d5652">0..127</text>

  <rect x="116" y="416" width="84" height="44" rx="5" fill="#ddf4ef" stroke="#087f73" stroke-width="1.3"/>
  <text x="158" y="435" text-anchor="middle" font-size="13.5" font-family="var(--font-mono)" font-weight="700" fill="#065f56">5b+1</text>
  <text x="158" y="453" text-anchor="middle" font-size="13" fill="#4d5652">128..255</text>

  <rect x="204" y="416" width="84" height="44" rx="5" fill="#ddf4ef" stroke="#087f73" stroke-width="1.3"/>
  <text x="246" y="435" text-anchor="middle" font-size="13.5" font-family="var(--font-mono)" font-weight="700" fill="#065f56">5b+2</text>
  <text x="246" y="453" text-anchor="middle" font-size="13" fill="#4d5652">256..383</text>

  <rect x="292" y="416" width="84" height="44" rx="5" fill="#ddf4ef" stroke="#087f73" stroke-width="1.3"/>
  <text x="334" y="435" text-anchor="middle" font-size="13.5" font-family="var(--font-mono)" font-weight="700" fill="#065f56">5b+3</text>
  <text x="334" y="453" text-anchor="middle" font-size="13" fill="#4d5652">384..511</text>

  <rect x="380" y="416" width="86" height="44" rx="5" fill="#ddf4ef" stroke="#087f73" stroke-width="1.3"/>
  <text x="423" y="435" text-anchor="middle" font-size="13.5" font-family="var(--font-mono)" font-weight="700" fill="#065f56">5b+4</text>
  <text x="423" y="453" text-anchor="middle" font-size="13" fill="#4d5652">512..639</text>

  <!-- Fold-back arrow for indexer K -->
  <path d="M 70 460 L 70 478 L 106 478" fill="none" stroke="#9a4b86" stroke-width="1.6" marker-end="url(#bt-arr-p)"/>
  <rect x="112" y="466" width="354" height="28" rx="5" fill="#f7e7f2" stroke="#9a4b86" stroke-width="1.1"/>
  <text x="289" y="485" text-anchor="middle" font-size="13" fill="#7a3a6a">indexer K 取 <tspan font-family="var(--font-mono)" font-weight="700">table[:, ::5] // 5 → b</tspan>（160 池/块）</text>

  <text x="247" y="518" text-anchor="middle" font-size="13.5" font-family="var(--font-mono)" font-weight="700" fill="#17211f">槽位恒等：slot(p) = 640b + (p mod 640)</text>

  <!-- Bottom right: 0 vs -1 -->
  <rect x="496" y="340" width="390" height="194" rx="10" fill="#ffffff" stroke="#b54237" stroke-width="1.5"/>
  <text x="510" y="366" font-size="14.5" font-weight="700" fill="#8f3229">排雷：块表里的 0 与槽位里的 −1 不是同一种空</text>
  <rect x="510" y="382" width="362" height="62" rx="7" fill="#fff4cf" stroke="#c78300" stroke-width="1.2"/>
  <text x="524" y="406" font-size="14" font-weight="700" fill="#936300">block_table 填 0（null_block）</text>
  <text x="524" y="430" font-size="13.5" fill="#17211f">启动预留占位块号，绝不分给请求；indexer 折回亦保留</text>

  <rect x="510" y="456" width="362" height="62" rx="7" fill="#ddf4ef" stroke="#087f73" stroke-width="1.2"/>
  <text x="524" y="480" font-size="14" font-weight="700" fill="#065f56">slot_mapping 填 −1（PAD_SLOT_ID）</text>
  <text x="524" y="504" font-size="13.5" fill="#17211f">图模式补齐尾槽 / 非本卡 CP / 未凑满 4 词跳过写入</text>
</svg>
