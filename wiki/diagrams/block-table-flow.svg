<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 420" width="900" height="420" role="img" aria-label="R1 第一步沿主线走一遍。第 2 站，调度器按 5 个缓存组从同一个池里要块号，结果按组分开发给 worker。第 3 站，每个 worker 把各组的块号写进各组自己的 block table：full 组把一个 640 个位置的块号展开成 5 个 128 个位置的 kernel 块号，尾状态组和 3 个 KDA 组原样写入；随后把这一批用到的几行异步拷到 NPU，再给 KDA 以外的组逐 token 算槽位。第 4 站，各层按自己所在的组取用：MLA 主缓存按槽位写、按 kernel 块表读；indexer K 把表和槽位折回 640 的块；尾状态直接用本组槽位；KDA 不用槽位，把块号直接当状态页编号。">
  <title>R1 第一步沿主线走一遍。第 2 站，调度器按 5 个缓存组从同一个池里要块号，结果按组分开发给 worker。第 3 站，每个 worker 把各组的块号写进各组自己的 block table：full 组把一个 640 个位置的块号展开成 5 个 128 个位置的 kernel 块号，尾状态组和 3 个 KDA 组原样写入；随后把这一批用到的几行异步拷到 NPU，再给 KDA 以外的组逐 token 算槽位。第 4 站，各层按自己所在的组取用：MLA 主缓存按槽位写、按 kernel 块表读；indexer K 把表和槽位折回 640 的块；尾状态直接用本组槽位；KDA 不用槽位，把块号直接当状态页编号。</title>
  <defs><marker id="block-table-flow-ah-ink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="var(--color-ink, #17211f)"/></marker><marker id="block-table-flow-ah-kv" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="var(--color-kv, #4c65b6)"/></marker><marker id="block-table-flow-ah-control" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="var(--color-control, #66716d)"/></marker><marker id="block-table-flow-ah-token" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="var(--color-token, #087f73)"/></marker></defs>
  <path d="M224 62 L264 62" fill="none" stroke="var(--color-ink, #17211f)" stroke-width="1.4" marker-end="url(#block-table-flow-ah-ink)"/>
  <path d="M464 62 L504 62" fill="none" stroke="var(--color-ink, #17211f)" stroke-width="1.4" marker-end="url(#block-table-flow-ah-ink)"/>
  <path d="M424 254 L476 254" fill="none" stroke="var(--color-ink, #17211f)" stroke-width="1.4" marker-end="url(#block-table-flow-ah-ink)"/>
  <path d="M690 90 L159 130" fill="none" stroke="var(--color-kv, #4c65b6)" stroke-width="1.4" marker-end="url(#block-table-flow-ah-kv)"/>
  <path d="M690 90 L449 130" fill="none" stroke="var(--color-kv, #4c65b6)" stroke-width="1.4" marker-end="url(#block-table-flow-ah-kv)"/>
  <path d="M690 90 L740 130" fill="none" stroke="var(--color-kv, #4c65b6)" stroke-width="1.4" marker-end="url(#block-table-flow-ah-kv)"/>
  <path d="M159 190 L224 226" fill="none" stroke="var(--color-control, #66716d)" stroke-width="1.4" marker-end="url(#block-table-flow-ah-control)"/>
  <path d="M449 190 L224 226" fill="none" stroke="var(--color-control, #66716d)" stroke-width="1.4" marker-end="url(#block-table-flow-ah-control)"/>
  <path d="M740 190 L224 226" fill="none" stroke="var(--color-control, #66716d)" stroke-width="1.4" marker-end="url(#block-table-flow-ah-control)"/>
  <path d="M676 282 L124 336" fill="none" stroke="var(--color-token, #087f73)" stroke-width="1.4" marker-end="url(#block-table-flow-ah-token)"/>
  <path d="M676 282 L340 336" fill="none" stroke="var(--color-token, #087f73)" stroke-width="1.4" marker-end="url(#block-table-flow-ah-token)"/>
  <path d="M676 282 L556 336" fill="none" stroke="var(--color-token, #087f73)" stroke-width="1.4" marker-end="url(#block-table-flow-ah-token)"/>
  <path d="M676 282 L774 336" fill="none" stroke="var(--color-token, #087f73)" stroke-width="1.4" marker-end="url(#block-table-flow-ah-token)"/>
  <rect x="24" y="34" width="200" height="56" rx="8" fill="var(--color-surface-sunken, #ece9df)" stroke="var(--color-ink, #17211f)" stroke-width="1.5"/>
  <text x="124" y="58" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="14" font-weight="700" fill="var(--color-ink, #17211f)" text-anchor="middle">按缓存组要块号</text>
  <text x="124" y="77" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="13" font-weight="400" fill="var(--color-ink, #17211f)" text-anchor="middle">5 个组共用一个池</text>
  <rect x="264" y="34" width="200" height="56" rx="8" fill="var(--color-surface-sunken, #ece9df)" stroke="var(--color-ink, #17211f)" stroke-width="1.5"/>
  <text x="364" y="58" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="14" font-weight="700" fill="var(--color-ink, #17211f)" text-anchor="middle">调度结果</text>
  <text x="364" y="77" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="13" font-weight="400" fill="var(--color-ink, #17211f)" text-anchor="middle">R1：15 个块号，按组分开</text>
  <rect x="504" y="34" width="372" height="56" rx="8" fill="var(--color-surface-sunken, #ece9df)" stroke="var(--color-ink, #17211f)" stroke-width="1.5"/>
  <text x="690" y="58" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="14" font-weight="700" fill="var(--color-ink, #17211f)" text-anchor="middle">登记进持久批次</text>
  <text x="690" y="77" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="13" font-weight="400" fill="var(--color-ink, #17211f)" text-anchor="middle">新请求占一行，老请求往后追加</text>
  <rect x="24" y="130" width="270" height="60" rx="8" fill="var(--color-surface-sunken, #ece9df)" stroke="var(--color-ink, #17211f)" stroke-width="1.5"/>
  <text x="159" y="156" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="14" font-weight="700" fill="var(--color-ink, #17211f)" text-anchor="middle">full 组：1 个变 5 个</text>
  <text x="159" y="175" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="13" font-weight="400" fill="var(--color-ink, #17211f)" text-anchor="middle">640 的块号展开成 5 个 128 的</text>
  <rect x="314" y="130" width="270" height="60" rx="8" fill="var(--color-surface-sunken, #ece9df)" stroke="var(--color-ink, #17211f)" stroke-width="1.5"/>
  <text x="449" y="156" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="14" font-weight="700" fill="var(--color-ink, #17211f)" text-anchor="middle">尾状态组：原样写入</text>
  <text x="449" y="175" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="13" font-weight="400" fill="var(--color-ink, #17211f)" text-anchor="middle">一块 4 个位置，R1 拿 2 个</text>
  <rect x="604" y="130" width="272" height="60" rx="8" fill="var(--color-surface-sunken, #ece9df)" stroke="var(--color-ink, #17211f)" stroke-width="1.5"/>
  <text x="740" y="156" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="14" font-weight="700" fill="var(--color-ink, #17211f)" text-anchor="middle">3 个 KDA 组：原样写入</text>
  <text x="740" y="175" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="13" font-weight="400" fill="var(--color-ink, #17211f)" text-anchor="middle">每行 4 格：状态 + 3 个候选</text>
  <rect x="24" y="226" width="400" height="56" rx="8" fill="var(--color-surface-sunken, #ece9df)" stroke="var(--color-ink, #17211f)" stroke-width="1.5"/>
  <text x="224" y="250" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="14" font-weight="700" fill="var(--color-ink, #17211f)" text-anchor="middle">这一批的几行异步拷到 NPU</text>
  <text x="224" y="269" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="13" font-weight="400" fill="var(--color-ink, #17211f)" text-anchor="middle">可与其余 CPU 准备重叠</text>
  <rect x="476" y="226" width="400" height="56" rx="8" fill="var(--color-surface-sunken, #ece9df)" stroke="var(--color-ink, #17211f)" stroke-width="1.5"/>
  <text x="676" y="250" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="14" font-weight="700" fill="var(--color-ink, #17211f)" text-anchor="middle">逐 token 算槽位</text>
  <text x="676" y="269" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="13" font-weight="400" fill="var(--color-ink, #17211f)" text-anchor="middle">KDA 组跳过，其余组各算一份</text>
  <rect x="24" y="336" width="200" height="64" rx="8" fill="var(--color-surface-sunken, #ece9df)" stroke="var(--color-ink, #17211f)" stroke-width="1.5"/>
  <text x="124" y="364" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="14" font-weight="700" fill="var(--color-ink, #17211f)" text-anchor="middle">MLA 主缓存</text>
  <text x="124" y="383" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="13" font-weight="400" fill="var(--color-ink, #17211f)" text-anchor="middle">按槽位写，按 kernel 块读</text>
  <rect x="240" y="336" width="200" height="64" rx="8" fill="var(--color-surface-sunken, #ece9df)" stroke="var(--color-ink, #17211f)" stroke-width="1.5"/>
  <text x="340" y="364" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="14" font-weight="700" fill="var(--color-ink, #17211f)" text-anchor="middle">indexer K</text>
  <text x="340" y="383" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="13" font-weight="400" fill="var(--color-ink, #17211f)" text-anchor="middle">表与槽位折回 640 的块</text>
  <rect x="456" y="336" width="200" height="64" rx="8" fill="var(--color-surface-sunken, #ece9df)" stroke="var(--color-ink, #17211f)" stroke-width="1.5"/>
  <text x="556" y="364" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="14" font-weight="700" fill="var(--color-ink, #17211f)" text-anchor="middle">indexer 尾状态</text>
  <text x="556" y="383" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="13" font-weight="400" fill="var(--color-ink, #17211f)" text-anchor="middle">直接用本组槽位</text>
  <rect x="672" y="336" width="204" height="64" rx="8" fill="var(--color-surface-sunken, #ece9df)" stroke="var(--color-ink, #17211f)" stroke-width="1.5"/>
  <text x="774" y="364" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="14" font-weight="700" fill="var(--color-ink, #17211f)" text-anchor="middle">KDA 状态</text>
  <text x="774" y="383" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="13" font-weight="400" fill="var(--color-ink, #17211f)" text-anchor="middle">块号直接当状态页编号</text>
  <text x="24" y="22" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="13.5" font-weight="700" fill="var(--color-ink, #17211f)">第 2 站 调度（引擎进程）</text>
  <text x="504" y="22" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="13.5" font-weight="700" fill="var(--color-ink, #17211f)">第 3 站 准备输入（每个 worker）</text>
  <text x="24" y="322" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="13.5" font-weight="700" fill="var(--color-ink, #17211f)">第 4 站 逐层前向</text>
</svg>
