layout: scene
id: block-table
caption: 第 92 步 decode：position 128 经块表翻译成槽位 5376
size: [900, 512]

regions:
  - label: ① 逻辑地址
    note: 请求自己数：第几个块、块里第几格
    at: [20, 40]
    size: [255, 176]
    tone: neutral
  - label: ② 块表
    note: 唯一的翻译层。行是座位号，列是逻辑块号
    at: [322, 40]
    size: [255, 176]
    tone: ascend
  - label: ③ 物理槽位
    note: 整个 KV 池里的第几格，算子按它读写
    at: [625, 40]
    size: [255, 176]
    tone: accent

boxes:
  - at: [36, 128]
    size: [223, 72]
    title: position = 128
    sub: 128 // 128 → 逻辑块 1
    fn: 128 % 128 → 块内第 0 格
    tone: neutral
  - at: [338, 128]
    size: [223, 72]
    title: 块表 第 0 行 第 1 列
    sub: block_table.np[0, 1]
    fn: → 物理块 42
    tone: ascend
  - at: [641, 128]
    size: [223, 72]
    title: 槽位 5376
    sub: 42 × 128 + 0
    fn: reshape_and_cache 写这一格
    tone: accent

arrows:
  - { from: [266, 164], to: [318, 164], tone: ascend }
  - { from: [568, 164], to: [621, 164], tone: accent }
  - { from: [31.5, 292], via: [[31.5, 360], [95.5, 360]], to: [95.5, 392], tone: muted, style: dashed }
  - from: [58.5, 292]
    via: [[58.5, 332], [613.5, 332]]
    to: [613.5, 392]
    tone: accent
    label: 逻辑块 1 → 物理块 42

strips:
  - at: [20, 268]
    cells: 32
    cell: 23
    gap: 4
    highlights: [0, 1]
    tone: ascend
  - at: [20, 396]
    cells: 60
    cell: 11
    gap: 3
    highlights: [5, 42]
    tone: neutral
    label: 显存里的全部物理块（画出前 60 个）；块表里那个数就是这排里的下标

notes:
  - at: [20, 244]
    text: "块表真正的样子：256 行 × 32 列的 int32；这条请求只用到第 0 行的前两列"
    size: 13.5
    strong: true
  - at: [120, 306]
    text: "列号就是逻辑块号；append_row 从行尾追加，commit_block_table 每步把前 num_reqs 行拷到 NPU"
    size: 12.5
    width: 760
  - at: [20, 458]
    text: "slot = 物理块号 × block_size + 块内偏移 = 42 × 128 + 0 = 5376"
    size: 14
    strong: true
  - at: [20, 488]
    text: "表里填 0 表示这一列还没分配：块 0 被当成哨兵，不是指向显存第一块。"
    size: 12.5
    width: 860

pins:
