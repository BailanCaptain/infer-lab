layout: figure
id: block-table
caption: 示意（一块 4 个位置，不是 GLM 的数）：请求的位置 0–11 按 4 个一块分成逻辑块 0、1、2；block table 里这条请求的一行记着它们分别落在缓存池的块 7、2、9。位置 6 在逻辑块 1、块内偏移 2，查表得块号 2，槽位 = 2 × 4 + 2 = 10。池里的块不必相邻，中间夹着别的请求在用的块；块号 0 空着不发，留作占位。
