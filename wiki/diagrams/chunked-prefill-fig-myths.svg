<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 412" width="900" height="412" role="img" aria-label="Chunked Prefill 四组常见错误直觉与 v0.30.0 源码真相对照板" font-family="var(--font-sans)">
  <title>Chunked Prefill 四组常见误解与 vLLM V1 / vllm-ascend v0.30.0 源码真相对照板。</title>
  <desc>关联源码符号：discard_requests_mask, discard_request_indices, optimistic_seq_lens_cpu, verify_max_model_len, max_num_batched_tokens, enable_chunked_prefill, long_prefill_token_threshold, token_budget</desc>

  <text x="16" y="28" font-size="16" font-weight="700" fill="#b54237">✗ 常见错误直觉</text>
  <text x="402" y="28" font-size="16" font-weight="700" fill="#087f73">✓ 源码真相（vLLM V1 &amp; vllm-ascend v0.30.0）</text>
  <line x1="16" y1="42" x2="884" y2="42" stroke="#b8bcb5" stroke-width="1.4"/>
  <line x1="388" y1="12" x2="388" y2="400" stroke="#b8bcb5" stroke-width="1.4" stroke-dasharray="5 4"/>

  <!-- Row 1 -->
  <rect x="16" y="54" width="362" height="76" rx="7" fill="#fff0e9" stroke="#d88c82" stroke-width="1.2"/>
  <text x="28" y="82" font-size="14.5" font-weight="700" fill="#8f3229">① 中间每个分块算完都会吐出一个 token</text>
  <text x="28" y="110" font-size="13.5" fill="#4d5652">误以为提示词拆成三段就会依次吐出三个回答词</text>

  <rect x="402" y="54" width="482" height="76" rx="7" fill="#ddf4ef" stroke="#79aaa1" stroke-width="1.3"/>
  <text x="416" y="82" font-size="14.5" font-weight="700" fill="#065f56">仅最后一段产出首个输出 token y₀</text>
  <text x="416" y="110" font-size="13.5" fill="#4d5652">未完段命中 discard_requests_mask 丢弃结果并回拨带种子 RNG</text>

  <!-- Row 2 -->
  <rect x="16" y="142" width="362" height="76" rx="7" fill="#fff0e9" stroke="#d88c82" stroke-width="1.2"/>
  <text x="28" y="170" font-size="14.5" font-weight="700" fill="#8f3229">② max_num_batched_tokens 限制了最长输入</text>
  <text x="28" y="198" font-size="13.5" fill="#4d5652">误以为默认预算 2048 就接不了超过 2048 的长提示词</text>

  <rect x="402" y="142" width="482" height="76" rx="7" fill="#ddf4ef" stroke="#79aaa1" stroke-width="1.3"/>
  <text x="416" y="170" font-size="14.5" font-weight="700" fill="#065f56">开启分块时单步预算与 max_model_len 解耦</text>
  <text x="416" y="198" font-size="13.5" fill="#4d5652">长提示词自动跨多步算完；仅关闭分块时校验预算 &gt;= max_model_len</text>

  <!-- Row 3 -->
  <rect x="16" y="230" width="362" height="76" rx="7" fill="#fff0e9" stroke="#d88c82" stroke-width="1.2"/>
  <text x="28" y="258" font-size="14.5" font-weight="700" fill="#8f3229">③ 块切得越碎越好，反正总计算量不变</text>
  <text x="28" y="286" font-size="13.5" fill="#4d5652">只看因果打分对数不变，忽视跨步历史重读与调度开销</text>

  <rect x="402" y="230" width="482" height="76" rx="7" fill="#ddf4ef" stroke="#79aaa1" stroke-width="1.3"/>
  <text x="416" y="258" font-size="14.5" font-weight="700" fill="#065f56">切太碎会成倍放大前缀 KV 重读带宽与 TTFT</text>
  <text x="416" y="286" font-size="13.5" fill="#4d5652">后续分块每步都要重扫已存历史，并叠加步间调度与空采样杂活</text>

  <!-- Row 4 -->
  <rect x="16" y="318" width="362" height="76" rx="7" fill="#fff0e9" stroke="#d88c82" stroke-width="1.2"/>
  <text x="28" y="346" font-size="14.5" font-weight="700" fill="#8f3229">④ 多条长提示词并发时默认会公平轮流分额</text>
  <text x="28" y="374" font-size="13.5" fill="#4d5652">误以为默认分块会自动把剩余预算均分给多条长单</text>

  <rect x="402" y="318" width="482" height="76" rx="7" fill="#ddf4ef" stroke="#79aaa1" stroke-width="1.3"/>
  <text x="416" y="346" font-size="14.5" font-weight="700" fill="#065f56">先入 running 者吃满余量；限额须设单条阈值</text>
  <text x="416" y="374" font-size="13.5" fill="#4d5652">默认 long_prefill_token_threshold=0 不截断，显式设正值才留余量</text>
</svg>
