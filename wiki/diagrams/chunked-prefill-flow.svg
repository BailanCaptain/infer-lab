<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 668" width="880" height="668" role="img" aria-label="一条长提示词的一段怎样走完一步：调度器按「还差几个」和剩余预算定下这一段有多长，排完立刻把已算数往前推；准备输入从已算数起排位置号、按块表找到写历史的格号，并给整批贴执行标签；前向读已存的历史、写下本段的历史；每条请求都在自己最后一个位置采样一次，提示词没算完的这一次结果丢掉，下一步从新的已算数接着排。">
  <title>一条长提示词的一段怎样走完一步：调度器按「还差几个」和剩余预算定下这一段有多长，排完立刻把已算数往前推；准备输入从已算数起排位置号、按块表找到写历史的格号，并给整批贴执行标签；前向读已存的历史、写下本段的历史；每条请求都在自己最后一个位置采样一次，提示词没算完的这一次结果丢掉，下一步从新的已算数接着排。</title>
  <defs><marker id="chunked-prefill-flow-ah-ink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="var(--color-ink, #17211f)"/></marker></defs>
  <path d="M440 76 L440 112" fill="none" stroke="var(--color-ink, #17211f)" stroke-width="1.4" marker-end="url(#chunked-prefill-flow-ah-ink)"/>
  <path d="M650 46 L674 46" fill="none" stroke="var(--color-ink, #17211f)" stroke-width="1.4" marker-end="url(#chunked-prefill-flow-ah-ink)"/>
  <path d="M440 168 L440 204" fill="none" stroke="var(--color-ink, #17211f)" stroke-width="1.4" marker-end="url(#chunked-prefill-flow-ah-ink)"/>
  <path d="M230 234 L212 234" fill="none" stroke="var(--color-ink, #17211f)" stroke-width="1.4" marker-end="url(#chunked-prefill-flow-ah-ink)"/>
  <path d="M440 264 L440 300" fill="none" stroke="var(--color-ink, #17211f)" stroke-width="1.4" marker-end="url(#chunked-prefill-flow-ah-ink)"/>
  <path d="M440 360 L440 396" fill="none" stroke="var(--color-ink, #17211f)" stroke-width="1.4" marker-end="url(#chunked-prefill-flow-ah-ink)"/>
  <path d="M440 452 L440 488" fill="none" stroke="var(--color-ink, #17211f)" stroke-width="1.4" marker-end="url(#chunked-prefill-flow-ah-ink)"/>
  <path d="M230 514 L176 514 L176 584" fill="none" stroke="var(--color-ink, #17211f)" stroke-width="1.4" marker-end="url(#chunked-prefill-flow-ah-ink)"/>
  <path d="M650 514 L704 514 L704 584" fill="none" stroke="var(--color-ink, #17211f)" stroke-width="1.4" marker-end="url(#chunked-prefill-flow-ah-ink)"/>
  <path d="M16 614 L8 614 L8 46 L230 46" fill="none" stroke="var(--color-ink, #17211f)" stroke-width="1.4" stroke-dasharray="7 5" marker-end="url(#chunked-prefill-flow-ah-ink)"/>
  <rect x="230" y="16" width="420" height="60" rx="8" fill="var(--color-token, #087f73)" stroke="var(--color-ink, #17211f)" stroke-width="1.5"/>
  <text x="440" y="42" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="14" font-weight="700" fill="var(--color-ink-inverse, #ffffff)" text-anchor="middle">第 2 站 调度：这一段排几个位置</text>
  <text x="440" y="61" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="13" font-weight="400" fill="var(--color-ink-inverse, #ffffff)" text-anchor="middle">本步 = min(还差几个, 剩余预算)</text>
  <rect x="674" y="16" width="190" height="60" rx="8" fill="var(--color-control, #66716d)" stroke="var(--color-ink, #17211f)" stroke-width="1.5"/>
  <text x="769" y="42" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="14" font-weight="700" fill="var(--color-ink-inverse, #ffffff)" text-anchor="middle">这一步不再接新请求</text>
  <text x="769" y="61" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="13" font-weight="400" fill="var(--color-ink-inverse, #ffffff)" text-anchor="middle">分块关着且整段超出余量</text>
  <rect x="230" y="112" width="420" height="56" rx="8" fill="var(--color-surface-sunken, #ece9df)" stroke="var(--color-ink, #17211f)" stroke-width="1.5"/>
  <text x="440" y="136" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="14" font-weight="700" fill="var(--color-ink, #17211f)" text-anchor="middle">排完立刻把已算数往前推</text>
  <text x="440" y="155" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="13" font-weight="400" fill="var(--color-ink, #17211f)" text-anchor="middle">下一步从这里接着排；标记提示词没算完</text>
  <rect x="230" y="204" width="420" height="60" rx="8" fill="var(--color-kv, #4c65b6)" stroke="var(--color-ink, #17211f)" stroke-width="1.5"/>
  <text x="440" y="230" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="14" font-weight="700" fill="var(--color-ink-inverse, #ffffff)" text-anchor="middle">第 3 站 准备输入：位置号和格号</text>
  <text x="440" y="249" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="13" font-weight="400" fill="var(--color-ink-inverse, #ffffff)" text-anchor="middle">位置号 = 已算数 + 0, 1, 2 …；格号查块表得到</text>
  <rect x="16" y="204" width="196" height="60" rx="8" fill="var(--color-surface-sunken, #ece9df)" stroke="var(--color-ink, #17211f)" stroke-width="1.5"/>
  <text x="114" y="230" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="14" font-weight="700" fill="var(--color-ink, #17211f)" text-anchor="middle">给整批贴执行标签</text>
  <text x="114" y="249" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="13" font-weight="400" fill="var(--color-ink, #17211f)" text-anchor="middle">本例是 ChunkedPrefill</text>
  <rect x="230" y="300" width="420" height="60" rx="8" fill="var(--color-kv, #4c65b6)" stroke="var(--color-ink, #17211f)" stroke-width="1.5"/>
  <text x="440" y="326" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="14" font-weight="700" fill="var(--color-ink-inverse, #ffffff)" text-anchor="middle">第 4 站 前向：读已存的历史，写下本段的</text>
  <text x="440" y="345" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="13" font-weight="400" fill="var(--color-ink-inverse, #ffffff)" text-anchor="middle">注意力读前面各段的 KV；线性注意力接着上一段的状态</text>
  <rect x="230" y="396" width="420" height="56" rx="8" fill="var(--color-token, #087f73)" stroke="var(--color-ink, #17211f)" stroke-width="1.5"/>
  <text x="440" y="429" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="14" font-weight="700" fill="var(--color-ink-inverse, #ffffff)" text-anchor="middle">第 5 站 采样：每条请求在最后一个位置选一次</text>
  <rect x="230" y="488" width="420" height="52" rx="8" fill="var(--color-surface-sunken, #ece9df)" stroke="var(--color-ink, #17211f)" stroke-width="1.5"/>
  <text x="440" y="519" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="14" font-weight="700" fill="var(--color-ink, #17211f)" text-anchor="middle">这条请求的提示词算完了吗？</text>
  <rect x="16" y="584" width="320" height="60" rx="8" fill="var(--color-danger, #b54237)" stroke="var(--color-ink, #17211f)" stroke-width="1.5"/>
  <text x="176" y="610" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="14" font-weight="700" fill="var(--color-ink-inverse, #ffffff)" text-anchor="middle">没算完：这次选出的丢掉</text>
  <text x="176" y="629" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="13" font-weight="400" fill="var(--color-ink-inverse, #ffffff)" text-anchor="middle">不追加、不返回，下一步回到调度</text>
  <rect x="544" y="584" width="320" height="60" rx="8" fill="var(--color-token, #087f73)" stroke="var(--color-ink, #17211f)" stroke-width="1.5"/>
  <text x="704" y="610" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="14" font-weight="700" fill="var(--color-ink-inverse, #ffffff)" text-anchor="middle">算完：选出的就是第一个输出 token</text>
  <text x="704" y="629" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="13" font-weight="400" fill="var(--color-ink-inverse, #ffffff)" text-anchor="middle">之后按 decode 每步排</text>
  <text x="186" y="506" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="14" font-weight="400" fill="var(--color-ink, #17211f)">否</text>
  <text x="690" y="506" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="14" font-weight="400" fill="var(--color-ink, #17211f)">是</text>
  <text x="16" y="102" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="13" font-weight="400" fill="var(--color-ink, #17211f)">下一步</text>
</svg>
