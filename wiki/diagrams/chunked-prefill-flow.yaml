id: chunked-prefill-flow
mode: native-svg
size: [900, 436]
caption: 一条长提示词的一段怎样走完一步：调度器按「还差几个」和剩余预算定下这一段有多长，排完立刻把已算数往前推；准备输入仍从本步开始前的已算数起排位置号、按块表找到写历史的格号，并给整批贴执行标签；前向读已存的历史、写下本段的历史；每条请求都在自己最后一个位置采样一次，提示词没算完的这一次结果丢掉并回拨 RNG，下一步从新的已算数接着排。
