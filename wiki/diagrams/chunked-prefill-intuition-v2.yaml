layout: figure
id: chunked-prefill-intuition-v2
caption: 每个外框是一批计算。上面把长文章一次放入；下面把它分到几批，每批也继续已有的回答。箭头表示计算先后，框的宽度不表示耗时。处理后段时沿用前段保存的信息，全部输入处理完才开始回答长文章的提问。
