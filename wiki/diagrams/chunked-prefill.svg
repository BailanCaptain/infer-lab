  <text x="660" y="663" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="12.5" font-weight="400" fill="var(--color-ink-muted, #5b6763)">--block-size 写了也不算</text>
  <text x="660" y="680" font-family="'JetBrains Mono',ui-monospace,monospace" font-size="12.5" font-weight="400" fill="var(--color-weight, #b87a00)">refresh_block_size</text>
  <path d="M42 460 l0 -9 L839 451 l0 9" fill="none" stroke="var(--color-kv, #4c65b6)" stroke-width="1.4" opacity="0.75"/>
  <text x="440.5" y="443" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="12.5" font-weight="600" fill="var(--color-kv, #4c65b6)" text-anchor="middle">注意力拿到的 KV 长度 = 4096，块表给出 32 个块号</text>
  <path d="M442 518 l0 9 L839 527 l0 -9" fill="none" stroke="var(--color-accent, #e85b32)" stroke-width="1.4" opacity="0.75"/>
  <text x="640.5" y="545" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="12.5" font-weight="600" fill="var(--color-accent, #e85b32)" text-anchor="middle">这一步的 Q 长度 = 2048</text>
  <text x="42" y="578" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="12.5" font-weight="400" fill="var(--color-ink-muted, #5b6763)">两步之间 KV 不回头重写：positions_np 从 num_computed_tokens 起接着排，槽位由它查块表算出；2048 是 128 的整数倍，所以第 2 块 </text>
  <text x="42" y="596.5" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="12.5" font-weight="400" fill="var(--color-ink-muted, #5b6763)">chunk 正好从第 17 个块的第 0 格开始。</text>
  <text x="20" y="712" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="12.5" font-weight="600" fill="var(--color-ink, #17211f)">切开的代价全落在被切的那条请求自己身上：它要多等两次 forward 才出第一个字。换来的是每一步的 token 数被 2048 钉住，正在 decode 的请求不必</text>
  <text x="20" y="730.5" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="12.5" font-weight="600" fill="var(--color-ink, #17211f)">为一次 5000 token 的 prefill 停一整步。</text>
</svg>
