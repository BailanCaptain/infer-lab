<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 250" width="900" height="250" role="img" aria-label="6037 个 token 的问题按每步 2048 切成三段；每一步新算的只有本段，注意力却要把前面存好的 KV 全读一遍">
  <title>6037 个 token 的问题按每步 2048 切成三段；每一步新算的只有本段，注意力却要把前面存好的 KV 全读一遍</title>
  <defs><pattern id="chunked-prefill-hatch" width="7" height="7" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="7" height="7" fill="var(--color-surface-sunken, #ece9df)"/><line x1="0" y1="0" x2="0" y2="7" stroke="var(--color-ink-muted, #66716d)" stroke-width="2"/></pattern></defs>
  <rect x="100" y="70" width="262.1" height="32" rx="4" fill="var(--color-token, #087f73)" stroke="var(--color-ink, #17211f)" stroke-width="1.3"/>
  <text x="116" y="91" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="13" font-weight="700" fill="var(--color-ink-inverse, #ffffff)">新算 2048</text>
  <rect x="100" y="130" width="262.1" height="32" rx="4" fill="url(#chunked-prefill-hatch)" stroke="var(--color-ink-muted, #66716d)" stroke-width="1.3"/>
  <rect x="362.1" y="130" width="262.1" height="32" rx="4" fill="var(--color-token, #087f73)" stroke="var(--color-ink, #17211f)" stroke-width="1.3"/>
  <text x="378.1" y="151" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="13" font-weight="700" fill="var(--color-ink-inverse, #ffffff)">新算 2048</text>
  <rect x="100" y="190" width="524.3" height="32" rx="4" fill="url(#chunked-prefill-hatch)" stroke="var(--color-ink-muted, #66716d)" stroke-width="1.3"/>
  <rect x="624.3" y="190" width="248.4" height="32" rx="4" fill="var(--color-token, #087f73)" stroke="var(--color-ink, #17211f)" stroke-width="1.3"/>
  <text x="640.3" y="211" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="13" font-weight="700" fill="var(--color-ink-inverse, #ffffff)">新算 1941</text>
  <text x="30" y="38" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="14" font-weight="700" fill="var(--color-ink, #17211f)">每一步最多算 2048 个 token</text>
  <text x="30" y="91" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="13.5" font-weight="400" fill="var(--color-ink, #17211f)">第 1 步</text>
  <text x="30" y="151" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="13.5" font-weight="400" fill="var(--color-ink, #17211f)">第 2 步</text>
  <text x="30" y="211" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="13.5" font-weight="400" fill="var(--color-ink, #17211f)">第 3 步</text>
</svg>
