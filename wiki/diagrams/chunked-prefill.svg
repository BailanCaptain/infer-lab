<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 752" width="900" height="752" role="img" aria-label="5000 个 token 的 prompt 被 2048 的预算条切成三步；每一步 Q 只有本步的新 token，KV 却是块表指着的全长前文">
  <title>5000 个 token 的 prompt 被 2048 的预算条切成三步；每一步 Q 只有本步的新 token，KV 却是块表指着的全长前文</title>
  <rect width="900" height="752" fill="var(--color-surface, #fbfaf6)"/>
  <rect x="20" y="26" width="860" height="300" rx="12" fill="var(--color-surface-sunken, #ece9df)"/>
  <rect x="36" y="40" width="446.7" height="26.5" rx="13.3" fill="var(--color-control, #5b6763)"/><text x="47" y="58.1" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="13.5" font-weight="700" fill="var(--color-ink-inverse, #ffffff)">上游 vLLM：5000 个 token 的 prompt 被 2048 的预算条切成三步</text>
  <text x="38" y="83" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="12.5" font-weight="400" fill="var(--color-ink-muted, #5b6763)">调度器不知道「chunk」是什么。它只对每条请求做一道减法，减不完就下一步接着减——切块是这道减法的余数。</text>
  <rect x="20" y="360" width="860" height="250" rx="12" fill="var(--color-weight-soft, #fff4cf)"/>
  <rect x="36" y="374" width="415.7" height="26.5" rx="13.3" fill="var(--color-weight, #b87a00)"/><text x="47" y="392.1" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="13.5" font-weight="700" fill="var(--color-ink-inverse, #ffffff)">算子这一步看到的：Q 只有新 token，KV 是块表指着的全长前文</text>
  <text x="38" y="417" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="12.5" font-weight="400" fill="var(--color-ink-muted, #5b6763)">以第 2 步为例：进 forward 的是 2048 个新 token，注意力要读的却是 4096 个 token 的 KV。</text>
  <rect x="40" y="104" width="820" height="62" rx="10" fill="var(--color-surface-sunken, #ece9df)"/>
  <rect x="40" y="104" width="5" height="62" rx="2.5" fill="var(--color-control, #5b6763)"/>
  <text x="62" y="132" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="15" font-weight="700" fill="var(--color-ink, #17211f)">第 1 步 · num_new_tokens = 2048</text>
  <text x="62" y="152" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="12.5" font-weight="400" fill="var(--color-ink-muted, #5b6763)">num_computed_tokens 0 → 2048，预算条一滴不剩</text>
  <rect x="40" y="174" width="820" height="62" rx="10" fill="var(--color-surface-sunken, #ece9df)"/>
  <rect x="40" y="174" width="5" height="62" rx="2.5" fill="var(--color-control, #5b6763)"/>
  <text x="62" y="202" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="15" font-weight="700" fill="var(--color-ink, #17211f)">第 2 步 · num_new_tokens = 2048</text>
  <text x="62" y="222" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="12.5" font-weight="400" fill="var(--color-ink-muted, #5b6763)">2048 → 4096，这一步还是只剩它，别人插不进来</text>
  <rect x="40" y="244" width="820" height="62" rx="10" fill="var(--color-surface-sunken, #ece9df)"/>
  <rect x="40" y="244" width="5" height="62" rx="2.5" fill="var(--color-control, #5b6763)"/>
  <text x="62" y="272" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="15" font-weight="700" fill="var(--color-ink, #17211f)">第 3 步 · num_new_tokens = 904</text>
  <text x="62" y="292" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="12.5" font-weight="400" fill="var(--color-ink-muted, #5b6763)">4096 → 5000，剩下 1144 个名额才轮得到别的请求</text>
  <line x1="20" y1="344" x2="880" y2="344" stroke="var(--color-accent, #e85b32)" stroke-width="2.5" stroke-dasharray="7 5"/>
  <text x="876" y="335" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="13" font-weight="700" fill="var(--color-accent, #e85b32)" text-anchor="end">跨进程：这一步算哪 2048 个 token，过了这条线已成定局</text>
