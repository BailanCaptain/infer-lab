layout: figure
id: chunked-prefill
caption: 示意数：每步最多算 8 个位置。A、B 已在生成，每步各 1 个；C 刚到，提示词 14 个位置，每步只分到余下的 6 个，于是按 6、6、2 分三步算完。每一段都接着前一段的位置往后算，并读前面已经存下的历史；前两步 C 的采样结果丢掉，第 3 步算到最后一个位置才选出第一个输出 token y₀，第 4 步起 C 也和 A、B 一样每步 1 个。
