<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 440" width="900" height="440" role="img" aria-label="昇腾多实例集群模式 A 外部 DP 协同与模式 B 独立多实例代理及路由信号对比图" font-family="var(--font-sans)">
  <title>模式 A（外部 DP 协同）vs 模式 B（独立多实例代理）架构与 KV 感知路由对比</title>
  <desc>Architectural comparison of Mode A External DP Launcher sharing HCCL EP domain vs Mode B Independent Multi-Instance Proxy with /load, ZMQ KVEventsConfig, and dynamic bucket routing</desc>
  <defs>
    <marker id="cl-arr-p" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="#9a4b86"/>
    </marker>
    <marker id="cl-arr-t" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="#087f73"/>
    </marker>
    <marker id="cl-arr-b" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="#4c65b6"/>
    </marker>
  </defs>

  <!-- Vertical divider between Mode A and Mode B -->
  <line x1="450" y1="12" x2="450" y2="306" stroke="#b8bcb5" stroke-width="1.4" stroke-dasharray="6 4"/>

  <!-- LEFT: MODE A (External DP Launcher) -->
  <text x="14" y="26" font-size="16" font-weight="700" fill="#17211f">模式 A · 外部 DP 协同（共享 EP / DP 域）</text>
  <text x="14" y="46" font-size="13.5" fill="#4d5652">适用大规模 MoE（EP 跨 DP 切分专家），各 DP 秩紧耦合</text>

  <rect x="14" y="60" width="414" height="54" rx="7" fill="#f7e7f2" stroke="#9a4b86" stroke-width="1.4"/>
  <text x="221" y="83" text-anchor="middle" font-size="14" font-weight="700" fill="#7a3a6a">外部 LB / DPSupervisor（聚合 /health 与 /ready）</text>
  <text x="221" y="103" text-anchor="middle" font-size="13.5" fill="#4d5652">--data-parallel-address + rpc-port 统一协调</text>

  <path d="M 114 114 L 114 138" fill="none" stroke="#9a4b86" stroke-width="1.8" marker-end="url(#cl-arr-p)"/>
  <path d="M 326 114 L 326 138" fill="none" stroke="#9a4b86" stroke-width="1.8" marker-end="url(#cl-arr-p)"/>

  <rect x="14" y="142" width="194" height="68" rx="7" fill="#e8edff" stroke="#4c65b6" stroke-width="1.4"/>
  <text x="111" y="168" text-anchor="middle" font-size="14" font-weight="700" fill="#3a4f93">DP Rank 0..k−1</text>
  <text x="111" y="192" text-anchor="middle" font-size="13.5" fill="#4d5652">独立端口或主节点 API</text>

  <rect x="234" y="142" width="194" height="68" rx="7" fill="#e8edff" stroke="#4c65b6" stroke-width="1.4"/>
  <text x="331" y="168" text-anchor="middle" font-size="14" font-weight="700" fill="#3a4f93">DP Rank k..N−1</text>
  <text x="331" y="192" text-anchor="middle" font-size="13.5" fill="#4d5652">可设 --headless 无前端</text>

  <!-- Coupling bridge between DP ranks -->
  <path d="M 208 176 L 234 176" fill="none" stroke="#b54237" stroke-width="2.2"/>
  <path d="M 111 210 L 111 232" fill="none" stroke="#9a4b86" stroke-width="1.6" marker-end="url(#cl-arr-p)"/>
  <path d="M 331 210 L 331 232" fill="none" stroke="#9a4b86" stroke-width="1.6" marker-end="url(#cl-arr-p)"/>

  <rect x="14" y="236" width="414" height="58" rx="7" fill="#fff0e9" stroke="#b54237" stroke-width="1.4"/>
  <text x="221" y="260" text-anchor="middle" font-size="14" font-weight="700" fill="#8f3229">共享 HCCL 专家通信域 + 跨 DP 同步步调</text>
  <text x="221" y="282" text-anchor="middle" font-size="13.5" fill="#4d5652">单秩异常牵连整组，扩缩与恢复按整组粒度</text>

  <!-- RIGHT: MODE B (Multi-Instance Proxy) -->
  <text x="472" y="26" font-size="16" font-weight="700" fill="#17211f">模式 B · 独立多实例代理（无共享通信域）</text>
  <text x="472" y="46" font-size="13.5" fill="#4d5652">适用 Dense 或单机装满的 MoE，单副本彻底故障隔离</text>

  <rect x="472" y="60" width="414" height="54" rx="7" fill="#ddf4ef" stroke="#087f73" stroke-width="1.5"/>
  <text x="679" y="83" text-anchor="middle" font-size="14" font-weight="700" fill="#065f56">智能网关：前缀亲和 + /load 选低载 + 长度分桶</text>
  <text x="679" y="103" text-anchor="middle" font-size="13.5" fill="#4d5652">支持 dynamic_bucket_load_balancer 动态重定向</text>

  <path d="M 572 114 L 572 138" fill="none" stroke="#087f73" stroke-width="1.8" marker-end="url(#cl-arr-t)"/>
  <path d="M 784 114 L 784 138" fill="none" stroke="#087f73" stroke-width="1.8" marker-end="url(#cl-arr-t)"/>

  <rect x="472" y="142" width="194" height="68" rx="7" fill="#ddf4ef" stroke="#087f73" stroke-width="1.4"/>
  <text x="569" y="168" text-anchor="middle" font-size="14" font-weight="700" fill="#065f56">短序列实例组</text>
  <text x="569" y="192" text-anchor="middle" font-size="13.5" fill="#4d5652">独立 vllm serve（低时延）</text>

  <rect x="692" y="142" width="194" height="68" rx="7" fill="#fff4cf" stroke="#c78300" stroke-width="1.4"/>
  <text x="789" y="168" text-anchor="middle" font-size="14" font-weight="700" fill="#936300">长序列实例组</text>
  <text x="789" y="192" text-anchor="middle" font-size="13.5" fill="#4d5652">独立 vllm serve（大 KV 池）</text>

  <!-- Telemetry return arrows up/down to signal bus -->
  <path d="M 569 210 L 569 232" fill="none" stroke="#4c65b6" stroke-width="1.6" marker-end="url(#cl-arr-b)"/>
  <path d="M 789 210 L 789 232" fill="none" stroke="#4c65b6" stroke-width="1.6" marker-end="url(#cl-arr-b)"/>

  <rect x="472" y="236" width="414" height="58" rx="7" fill="#e8edff" stroke="#4c65b6" stroke-width="1.4"/>
  <text x="679" y="260" text-anchor="middle" font-size="14" font-weight="700" fill="#3a4f93">遥测回传：GET /load（需开 load-tracking）+ ZMQ KV</text>
  <text x="679" y="282" text-anchor="middle" font-size="13.5" fill="#4d5652">tcp://*:5557 实时广播块写入/驱逐，支持 10,000 步重放</text>

  <!-- LOWER BAND: Visual Prefix-Cache Hit Impact Bar (Wrong Round-Robin vs Right KV-Aware) -->
  <line x1="14" y1="318" x2="886" y2="318" stroke="#b8bcb5" stroke-width="1.4" stroke-dasharray="6 5"/>
  <text x="14" y="344" font-size="15.5" font-weight="700" fill="#17211f">为何禁用盲目轮询？会话多轮 / 差异化前缀在 N 副本下的缓存命中示意</text>

  <!-- Bar 1: Round-Robin -->
  <text x="14" y="378" font-size="13.5" font-weight="700" fill="#8f3229">✗ 普通轮询 / 随机</text>
  <rect x="176" y="358" width="126" height="28" rx="4" fill="#fff0e9" stroke="#b54237" stroke-width="1.4"/>
  <text x="239" y="377" text-anchor="middle" font-size="13.5" font-weight="700" fill="#8f3229">命中 ≈ ÷ N</text>
  <rect x="302" y="358" width="582" height="28" rx="4" fill="#ece9df" stroke="#b8bcb5" stroke-width="1.2" stroke-dasharray="4 3"/>
  <text x="593" y="377" text-anchor="middle" font-size="13.5" fill="#4d5652">冷/多轮/易驱逐前缀散射重算 Prefill（全副本常驻热提示词除外）</text>

  <!-- Bar 2: KVEventsConfig Prefix-Aware -->
  <text x="14" y="418" font-size="13.5" font-weight="700" fill="#065f56">✓ 前缀 + KV 感知</text>
  <rect x="176" y="398" width="560" height="28" rx="4" fill="#ddf4ef" stroke="#087f73" stroke-width="1.5"/>
  <text x="456" y="417" text-anchor="middle" font-size="13.5" font-weight="700" fill="#065f56">复用驻留 KV 块（感知 LRU 驱逐 + /load 择低载副本）</text>
  <rect x="736" y="398" width="148" height="28" rx="4" fill="#e8edff" stroke="#4c65b6" stroke-width="1.2"/>
  <text x="810" y="417" text-anchor="middle" font-size="13.5" fill="#3a4f93">仅算新增后缀</text>
</svg>
