<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 558" width="900" height="558" role="img" aria-label="集合通信双卡 All-Reduce 与 All-Gather 分格交换算例及 v0.30.0 源码判据" font-family="var(--font-sans)">
  <title>All-Reduce [11,22] vs All-Gather [1,2,10,20] 双卡分格交换算例与源码判据</title>
  <desc>上半区用 Rank 0 [1,2] 与 Rank 1 [10,20] 静态分格展示发前、交换、发后：All-Reduce 形状不变求和得 [11,22]，All-Gather 只拼接不求和得 [1,2,10,20]；下半区汇总链路流量换算、MoECommType.ALLGATHER、HCCL 缓冲复用与异步同步判据。</desc>

  <!-- Section 1: 2-Rank Static Tensor Exchange Grids -->
  <text x="16" y="28" font-size="16" font-weight="700" fill="#17211f">1. 发前 → 跨卡交换 → 发后：All-Reduce 求和保形 vs All-Gather 拼接扩容（双卡示意）</text>

  <!-- Left Exchange Panel: All-Reduce -->
  <rect x="14" y="42" width="428" height="202" rx="10" fill="#fbfaf6" stroke="#087f73" stroke-width="1.3"/>
  <text x="28" y="66" font-size="14" font-weight="700" fill="#065f56">① All-Reduce：形状恒为 M（2 格），逐位相加</text>
  <text x="125" y="92" text-anchor="middle" font-size="12" fill="#66716d">发前 (M)</text>
  <text x="358" y="92" text-anchor="middle" font-size="12" font-weight="700" fill="#065f56">发后 (仍为 M)</text>

  <text x="52" y="124" text-anchor="middle" font-size="12.5" font-weight="700" fill="#936300">Rank 0</text>
  <text x="52" y="172" text-anchor="middle" font-size="12.5" font-weight="700" fill="#3a4f93">Rank 1</text>

  <g font-family="var(--font-mono)" font-size="13.5" font-weight="700" text-anchor="middle">
    <rect x="86" y="104" width="38" height="30" rx="4" fill="#fff4cf" stroke="#c78300" stroke-width="1.2"/>
    <text x="105" y="124" fill="#936300">1</text>
    <rect x="128" y="104" width="38" height="30" rx="4" fill="#fff4cf" stroke="#c78300" stroke-width="1.2"/>
    <text x="147" y="124" fill="#936300">2</text>

    <rect x="86" y="152" width="38" height="30" rx="4" fill="#e8edff" stroke="#4c65b6" stroke-width="1.2"/>
    <text x="105" y="172" fill="#3a4f93">10</text>
    <rect x="128" y="152" width="38" height="30" rx="4" fill="#e8edff" stroke="#4c65b6" stroke-width="1.2"/>
    <text x="147" y="172" fill="#3a4f93">20</text>
  </g>

  <rect x="180" y="106" width="112" height="74" rx="7" fill="#f7e7f2" stroke="#9a4b86" stroke-width="1.2"/>
  <text x="236" y="131" text-anchor="middle" font-size="12" font-weight="700" fill="#7a3a6a">交换并归约</text>
  <text x="236" y="153" text-anchor="middle" font-family="var(--font-mono)" font-size="12" fill="#7a3a6a">1+10 , 2+20</text>
  <text x="236" y="172" text-anchor="middle" font-size="12" fill="#66716d">R0 ⇄ R1</text>

  <g font-family="var(--font-mono)" font-size="13.5" font-weight="700" text-anchor="middle">
    <rect x="308" y="104" width="46" height="30" rx="4" fill="#ddf4ef" stroke="#087f73" stroke-width="1.3"/>
    <text x="331" y="124" fill="#065f56">11</text>
    <rect x="360" y="104" width="46" height="30" rx="4" fill="#ddf4ef" stroke="#087f73" stroke-width="1.3"/>
    <text x="383" y="124" fill="#065f56">22</text>

    <rect x="308" y="152" width="46" height="30" rx="4" fill="#ddf4ef" stroke="#087f73" stroke-width="1.3"/>
    <text x="331" y="172" fill="#065f56">11</text>
    <rect x="360" y="152" width="46" height="30" rx="4" fill="#ddf4ef" stroke="#087f73" stroke-width="1.3"/>
    <text x="383" y="172" fill="#065f56">22</text>
  </g>
  <text x="28" y="210" font-size="12" fill="#065f56">• DeviceCommunicatorBase.all_reduce 可原位写回输入缓冲</text>
  <text x="28" y="230" font-size="12" fill="#4d5652">• 既不会把张量形状压小，也不必每次另开输出显存</text>

  <!-- Right Exchange Panel: All-Gather -->
  <rect x="458" y="42" width="428" height="202" rx="10" fill="#fbfaf6" stroke="#4c65b6" stroke-width="1.3"/>
  <text x="472" y="66" font-size="14" font-weight="700" fill="#3a4f93">② All-Gather：只拼接不求和，涨为 2M（4 格）</text>
  <text x="566" y="92" text-anchor="middle" font-size="12" fill="#66716d">发前 (M)</text>
  <text x="790" y="92" text-anchor="middle" font-size="12" font-weight="700" fill="#3a4f93">发后 (拼为 N·M)</text>

  <text x="496" y="124" text-anchor="middle" font-size="12.5" font-weight="700" fill="#936300">Rank 0</text>
  <text x="496" y="172" text-anchor="middle" font-size="12.5" font-weight="700" fill="#3a4f93">Rank 1</text>

  <g font-family="var(--font-mono)" font-size="13" font-weight="700" text-anchor="middle">
    <rect x="528" y="104" width="36" height="30" rx="4" fill="#fff4cf" stroke="#c78300" stroke-width="1.2"/>
    <text x="546" y="124" fill="#936300">1</text>
    <rect x="568" y="104" width="36" height="30" rx="4" fill="#fff4cf" stroke="#c78300" stroke-width="1.2"/>
    <text x="586" y="124" fill="#936300">2</text>

    <rect x="528" y="152" width="36" height="30" rx="4" fill="#e8edff" stroke="#4c65b6" stroke-width="1.2"/>
    <text x="546" y="172" fill="#3a4f93">10</text>
    <rect x="568" y="152" width="36" height="30" rx="4" fill="#e8edff" stroke="#4c65b6" stroke-width="1.2"/>
    <text x="586" y="172" fill="#3a4f93">20</text>
  </g>

  <rect x="614" y="106" width="88" height="74" rx="7" fill="#f7e7f2" stroke="#9a4b86" stroke-width="1.2"/>
  <text x="658" y="131" text-anchor="middle" font-size="12" font-weight="700" fill="#7a3a6a">互传本片</text>
  <text x="658" y="153" text-anchor="middle" font-family="var(--font-mono)" font-size="12" fill="#7a3a6a">R0 ⇄ R1</text>
  <text x="658" y="172" text-anchor="middle" font-size="12" fill="#66716d">原值拼接</text>

  <g font-family="var(--font-mono)" font-size="13" font-weight="700" text-anchor="middle">
    <rect x="712" y="104" width="36" height="30" rx="4" fill="#fff4cf" stroke="#c78300" stroke-width="1.2"/>
    <text x="730" y="124" fill="#936300">1</text>
    <rect x="751" y="104" width="36" height="30" rx="4" fill="#fff4cf" stroke="#c78300" stroke-width="1.2"/>
    <text x="769" y="124" fill="#936300">2</text>
    <rect x="790" y="104" width="36" height="30" rx="4" fill="#e8edff" stroke="#4c65b6" stroke-width="1.2"/>
    <text x="808" y="124" fill="#3a4f93">10</text>
    <rect x="829" y="104" width="36" height="30" rx="4" fill="#e8edff" stroke="#4c65b6" stroke-width="1.2"/>
    <text x="847" y="124" fill="#3a4f93">20</text>

    <rect x="712" y="152" width="36" height="30" rx="4" fill="#fff4cf" stroke="#c78300" stroke-width="1.2"/>
    <text x="730" y="172" fill="#936300">1</text>
    <rect x="751" y="152" width="36" height="30" rx="4" fill="#fff4cf" stroke="#c78300" stroke-width="1.2"/>
    <text x="769" y="172" fill="#936300">2</text>
    <rect x="790" y="152" width="36" height="30" rx="4" fill="#e8edff" stroke="#4c65b6" stroke-width="1.2"/>
    <text x="808" y="172" fill="#3a4f93">10</text>
    <rect x="829" y="152" width="36" height="30" rx="4" fill="#e8edff" stroke="#4c65b6" stroke-width="1.2"/>
    <text x="847" y="172" fill="#3a4f93">20</text>
  </g>
  <text x="472" y="210" font-size="12" fill="#3a4f93">• all_gather 保留各卡原值拼为 NM；绝不把对应位置相加</text>
  <text x="472" y="230" font-size="12" fill="#4d5652">• reduce_scatter 则是先跨卡求和，再让每卡仅留自己那一片</text>

  <!-- Section 2: 4 Diagnostic Domain Panels -->
  <text x="16" y="272" font-size="16" font-weight="700" fill="#17211f">2. 链路字节换算、MoE 组合策略名、HCCL 缓冲复用与异步同步（v0.30.0）</text>

  <!-- Panel A -->
  <rect x="14" y="286" width="428" height="124" rx="9" fill="#fbfaf6" stroke="#c78300" stroke-width="1.3"/>
  <text x="28" y="310" font-size="14" font-weight="700" fill="#936300">A. 逻辑输入 M ≠ 单卡网卡线速流量</text>
  <text x="28" y="334" font-size="12.5" fill="#8f3229">✗ 误区：拿传入张量大小 M 直接当网卡收发字节除带宽</text>
  <text x="28" y="357" font-size="12.5" font-weight="700" fill="#065f56">✓ 真相：分开统计逻辑输入 M、单卡发送量与全组链路流量</text>
  <text x="28" y="379" font-size="12" fill="#4d5652">N 卡 ring All-Reduce 单卡发 2(N-1)M/N；All-Gather 发 (N-1)M</text>
  <text x="28" y="399" font-size="12" fill="#66716d">主干汇总账混合多口径且不含 MTP 草拟，不可直除带宽算时延</text>

  <!-- Panel B -->
  <rect x="458" y="286" width="428" height="124" rx="9" fill="#fbfaf6" stroke="#9a4b86" stroke-width="1.3"/>
  <text x="472" y="310" font-size="14" font-weight="700" fill="#7a3a6a">B. MoECommType.ALLGATHER ≠ 只调一次原语</text>
  <text x="472" y="334" font-size="12.5" fill="#8f3229">✗ 误区：以为 ALLGATHER 只调单次 AG，或开 MC2 就无归约</text>
  <text x="472" y="357" font-size="12.5" font-weight="700" fill="#065f56">✓ 真相：MoECommType.ALLGATHER 是四步大批通信路线名</text>
  <text x="472" y="379" font-size="12" fill="#4d5652">完整含 2 次 AG + Reduce-Scatter + TP All-Reduce（另有 ALLTOALL）</text>
  <text x="472" y="399" font-size="12" fill="#66716d">MC2 改变专家派发/合并通算组织，仍保留机内 TP 收集与归约</text>

  <!-- Panel C -->
  <rect x="14" y="422" width="428" height="124" rx="9" fill="#fbfaf6" stroke="#4c65b6" stroke-width="1.3"/>
  <text x="28" y="446" font-size="14" font-weight="700" fill="#3a4f93">C. HCCL 域缓冲预留与 v0.30.0 按域去重复用</text>
  <text x="28" y="470" font-size="12.5" fill="#8f3229">✗ 误区：建通信组零显存开销，或同成员组每次重开一套缓冲</text>
  <text x="28" y="493" font-size="12.5" font-weight="700" fill="#065f56">✓ 真相：create_hccl_pg_options 按 hccl_buffer_size 留缓冲</text>
  <text x="28" y="515" font-size="12" fill="#4d5652">通信缓冲计入启动显存并挤压 KV 池；v0.30.0 经 make_hccl_pg_key</text>
  <text x="28" y="535" font-size="12" fill="#66716d">与 _acquire_hccl_group 按复用域合并底层组，避免重复分配</text>

  <!-- Panel D -->
  <rect x="458" y="422" width="428" height="124" rx="9" fill="#fbfaf6" stroke="#087f73" stroke-width="1.3"/>
  <text x="472" y="446" font-size="14" font-weight="700" fill="#065f56">D. 异步 handle 流同步与跨机 DP / EP 协同</text>
  <text x="472" y="470" font-size="12.5" fill="#8f3229">✗ 误区：异步返回即可读输出；推理无梯度故 DP 组零通信</text>
  <text x="472" y="493" font-size="12.5" font-weight="700" fill="#065f56">✓ 真相：async_all_to_all (all_to_all_single) 必等 handle</text>
  <text x="472" y="515" font-size="12" fill="#4d5652">消费结果前必须满足完成事件与设备流依赖；DP 控制面经</text>
  <text x="472" y="535" font-size="12" fill="#66716d">has_unfinished_dp 同步未完状态协同陪跑，EP 跨组收发专家</text>
</svg>
