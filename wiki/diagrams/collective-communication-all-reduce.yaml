layout: figure
id: collective-communication-all-reduce
caption: All-Reduce（SUM）拆成两步看：先像 Reduce-Scatter 一样，第 k 块都送到卡 k 加起来；再像 All-Gather 一样，卡 k 把这一块的和发给其余每张卡。
size: [880, 1136]
exchanges:
  - at: [105, 8]
    cards: [卡 0, 卡 1, 卡 2, 卡 3]
    slots: 4
    gap: [190, 156]
    waves: true
    tag: 数为示意
    start:
      - [1, 2, 3, 4]
      - [10, 20, 30, 40]
      - [100, 200, 300, 400]
      - [1000, 2000, 3000, 4000]
    steps:
      - title: 第 1 步：第 k 块都送到卡 k，加起来
        moves:
          - { from: [0, 1], to: [1, 1], op: add }
          - { from: [0, 2], to: [2, 2], op: add }
          - { from: [0, 3], to: [3, 3], op: add }
          - { from: [1, 0], to: [0, 0], op: add }
          - { from: [1, 2], to: [2, 2], op: add }
          - { from: [1, 3], to: [3, 3], op: add }
          - { from: [2, 0], to: [0, 0], op: add }
          - { from: [2, 1], to: [1, 1], op: add }
          - { from: [2, 3], to: [3, 3], op: add }
          - { from: [3, 0], to: [0, 0], op: add }
          - { from: [3, 1], to: [1, 1], op: add }
          - { from: [3, 2], to: [2, 2], op: add }
        keep: [[0, 0], [1, 1], [2, 2], [3, 3]]
      - title: 第 2 步：卡 k 把第 k 块的和发给其余每张卡
        moves:
          - { from: [0, 0], to: [1, 0] }
          - { from: [0, 0], to: [2, 0] }
          - { from: [0, 0], to: [3, 0] }
          - { from: [1, 1], to: [0, 1] }
          - { from: [1, 1], to: [2, 1] }
          - { from: [1, 1], to: [3, 1] }
          - { from: [2, 2], to: [0, 2] }
          - { from: [2, 2], to: [1, 2] }
          - { from: [2, 2], to: [3, 2] }
          - { from: [3, 3], to: [0, 3] }
          - { from: [3, 3], to: [1, 3] }
          - { from: [3, 3], to: [2, 3] }
    end: 通信后：每张卡都是 [1111, 2222, 3333, 4444]
