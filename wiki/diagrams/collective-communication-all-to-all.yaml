layout: figure
id: collective-communication-all-to-all
caption: All-to-All：卡 i 的第 j 块发给卡 j，放进对方的第 i 块，不求和。中间一格每列是一张收数据的卡，紫色箭头是经过通信送来的块，灰色虚线是本卡留给自己的那块，不用发。
size: [880, 482]
frames:
  - { label: 发之前：每张卡各有 4 块，第 j 块是要给卡 j 的, at: [8, 30], size: [864, 90] }
  - { label: 卡 i 的第 j 块发给卡 j，放进它的第 i 块, at: [8, 158], size: [864, 188] }
  - { label: 发之后：卡 j 收齐每张卡发给它的那块, at: [8, 384], size: [864, 90] }
