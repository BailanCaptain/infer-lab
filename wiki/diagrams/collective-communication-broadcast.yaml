layout: figure
id: collective-communication-broadcast
caption: Broadcast：根卡 0 的整份数据复制给组里每张卡。中间一格每列是一张收数据的卡，紫色箭头是经过通信送来的块，灰色虚线是根卡自己的那份，不用发。
size: [880, 482]
frames:
  - { label: 发之前：只有根卡 0 有数据，其余卡只有空的接收位置, at: [8, 30], size: [864, 90] }
  - { label: 根卡 0 把整份 4 块发给其余每张卡, at: [8, 158], size: [864, 188] }
  - { label: '发之后：每张卡都是 [1, 2, 3, 4]', at: [8, 384], size: [864, 90] }
grids:
  # 发之前：只有根卡 0 有数
  - { at: [38, 52], rows: 1, cols: 4, cell: [42, 30], tone: token, style: faded, label: 卡 0,
      cells: [{ at: [0, 0], text: '1' }, { at: [0, 1], text: '2' }, { at: [0, 2], text: '3' }, { at: [0, 3], text: '4' }] }
  - { at: [250, 52], rows: 1, cols: 4, cell: [42, 30], tone: token, label: 卡 1 }
  - { at: [462, 52], rows: 1, cols: 4, cell: [42, 30], tone: token, label: 卡 2 }
  - { at: [674, 52], rows: 1, cols: 4, cell: [42, 30], tone: token, label: 卡 3 }
  # 发：根卡 0 自己的那份不用发
  - { at: [41, 190], rows: 1, cols: 4, cell: [36, 28], gap: 6, tone: token, style: faded,
      colLabels: [卡 0, 卡 0, 卡 0, 卡 0],
      cells: [{ at: [0, 0], text: '1' }, { at: [0, 1], text: '2' }, { at: [0, 2], text: '3' }, { at: [0, 3], text: '4' }] }
  - { at: [38, 278], rows: 1, cols: 4, cell: [42, 30], tone: token, style: solid, label: 卡 0,
      cells: [{ at: [0, 0], text: '1' }, { at: [0, 1], text: '2' }, { at: [0, 2], text: '3' }, { at: [0, 3], text: '4' }] }
  # 发：卡 0 的 4 块送到卡 1
  - { at: [253, 190], rows: 1, cols: 4, cell: [36, 28], gap: 6, tone: token, style: faded,
      colLabels: [卡 0, 卡 0, 卡 0, 卡 0],
      cells: [{ at: [0, 0], text: '1' }, { at: [0, 1], text: '2' }, { at: [0, 2], text: '3' }, { at: [0, 3], text: '4' }] }
  - { at: [250, 278], rows: 1, cols: 4, cell: [42, 30], tone: token, style: solid, label: 卡 1,
      cells: [{ at: [0, 0], text: '1' }, { at: [0, 1], text: '2' }, { at: [0, 2], text: '3' }, { at: [0, 3], text: '4' }] }
  # 发：卡 0 的 4 块送到卡 2
  - { at: [465, 190], rows: 1, cols: 4, cell: [36, 28], gap: 6, tone: token, style: faded,
      colLabels: [卡 0, 卡 0, 卡 0, 卡 0],
      cells: [{ at: [0, 0], text: '1' }, { at: [0, 1], text: '2' }, { at: [0, 2], text: '3' }, { at: [0, 3], text: '4' }] }
  - { at: [462, 278], rows: 1, cols: 4, cell: [42, 30], tone: token, style: solid, label: 卡 2,
      cells: [{ at: [0, 0], text: '1' }, { at: [0, 1], text: '2' }, { at: [0, 2], text: '3' }, { at: [0, 3], text: '4' }] }
  # 发：卡 0 的 4 块送到卡 3
  - { at: [677, 190], rows: 1, cols: 4, cell: [36, 28], gap: 6, tone: token, style: faded,
      colLabels: [卡 0, 卡 0, 卡 0, 卡 0],
      cells: [{ at: [0, 0], text: '1' }, { at: [0, 1], text: '2' }, { at: [0, 2], text: '3' }, { at: [0, 3], text: '4' }] }
  - { at: [674, 278], rows: 1, cols: 4, cell: [42, 30], tone: token, style: solid, label: 卡 3,
      cells: [{ at: [0, 0], text: '1' }, { at: [0, 1], text: '2' }, { at: [0, 2], text: '3' }, { at: [0, 3], text: '4' }] }
  # 发之后
  - { at: [38, 406], rows: 1, cols: 4, cell: [42, 30], tone: token, style: solid, label: 卡 0,
      cells: [{ at: [0, 0], text: '1' }, { at: [0, 1], text: '2' }, { at: [0, 2], text: '3' }, { at: [0, 3], text: '4' }] }
