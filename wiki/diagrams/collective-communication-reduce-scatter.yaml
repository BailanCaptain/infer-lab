layout: figure
id: collective-communication-reduce-scatter
caption: Reduce-Scatter（SUM）：第 k 块从各卡送到卡 k 按位置相加，卡 k 只留这一块的和；其余块只是用过的输入（灰字）。
size: [880, 696]
exchanges:
  - at: [105, 8]
    cards: [卡 0, 卡 1, 卡 2, 卡 3]
    slots: 4
    gap: [190, 96]
    dots: true
    tag: 数为示意
    start:
      - [1, 2, 3, 4]
      - [10, 20, 30, 40]
      - [100, 200, 300, 400]
      - [1000, 2000, 3000, 4000]
    steps:
      - title: 第 k 块从各卡发到卡 k，卡 k 按位置相加
        moves:
          - { from: [0, 1], to: [1, 1], op: add }
          - { from: [0, 2], to: [2, 2], op: add }
          - { from: [0, 3], to: [3, 3], op: add }
          - { from: [1, 0], to: [0, 0], op: add }
          - { from: [1, 2], to: [2, 2], op: add }
          - { from: [1, 3], to: [3, 3], op: add }
          - { from: [2, 0], to: [0, 0], op: add }
          - { from: [2, 1], to: [1, 1], op: add }
          - { from: [2, 3], to: [3, 3], op: add }
          - { from: [3, 0], to: [0, 0], op: add }
          - { from: [3, 1], to: [1, 1], op: add }
          - { from: [3, 2], to: [2, 2], op: add }
        keep: [[0, 0], [1, 1], [2, 2], [3, 3]]
    end: 通信后：卡 k 只留第 k 块的和
