layout: figure
id: collective-communication-reduce-scatter
caption: Reduce-Scatter（SUM）：每张卡的第 k 块都送到卡 k 加起来，卡 k 只留这一块的和。中间一格每列是一张收数据的卡，紫色箭头是经过通信送来的块，灰色虚线是本卡自己的那块，不用发。
size: [880, 504]
frames:
  - { label: 发之前：每张卡各有自己的 4 块数, at: [8, 30], size: [864, 90] }
  - { label: 第 k 块都送到卡 k，在卡 k 上加起来, at: [8, 158], size: [864, 210] }
  - { label: 发之后：卡 k 只留第 k 块的和, at: [8, 406], size: [864, 90] }
