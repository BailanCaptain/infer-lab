layout: figure
id: collective-communication-reduce
caption: Reduce（SUM）：其余卡把整份数据发给根卡 0，根卡按位置相加。中间一格按块分组，每组是四张卡的同一块，紫色箭头是经过通信送来的块，灰色虚线是根卡自己的那块，不用发；四组各落进根卡 0 结果的一块。
size: [880, 504]
frames:
  - { label: 发之前：每张卡各有自己的 4 块数, at: [8, 30], size: [864, 90] }
  - { label: 其余卡把整份 4 块都发给根卡 0，在卡 0 上按位置加起来, at: [8, 158], size: [864, 210] }
  - { label: '发之后：只有根卡 0 得到 [1111, 2222, 3333, 4444]', at: [8, 406], size: [864, 90] }
grids:
  # 发之前
  - { at: [38, 52], rows: 1, cols: 4, cell: [42, 30], tone: token, style: faded, label: 卡 0,
      cells: [{ at: [0, 0], text: '1' }, { at: [0, 1], text: '2' }, { at: [0, 2], text: '3' }, { at: [0, 3], text: '4' }] }
  - { at: [250, 52], rows: 1, cols: 4, cell: [42, 30], tone: token, style: faded, label: 卡 1,
      cells: [{ at: [0, 0], text: '10' }, { at: [0, 1], text: '20' }, { at: [0, 2], text: '30' }, { at: [0, 3], text: '40' }] }
  - { at: [462, 52], rows: 1, cols: 4, cell: [42, 30], tone: token, style: faded, label: 卡 2,
      cells: [{ at: [0, 0], text: '100' }, { at: [0, 1], text: '200' }, { at: [0, 2], text: '300' }, { at: [0, 3], text: '400' }] }
  - { at: [674, 52], rows: 1, cols: 4, cell: [42, 30], tone: token, style: faded, label: 卡 3,
      cells: [{ at: [0, 0], text: '1000' }, { at: [0, 1], text: '2000' }, { at: [0, 2], text: '3000' }, { at: [0, 3], text: '4000' }] }
  # 发：四张卡的第 0 块（格子加宽到 44，四位数两边各留 6.5 的余白）
  - { at: [34, 190], rows: 1, cols: 4, cell: [44, 28], gap: 6, tone: token, style: faded,
      colLabels: [卡 0, 卡 1, 卡 2, 卡 3],
      cells: [{ at: [0, 0], text: '1' }, { at: [0, 1], text: '10' }, { at: [0, 2], text: '100' }, { at: [0, 3], text: '1000' }] }
  # 发：四张卡的第 1 块
  - { at: [240, 190], rows: 1, cols: 4, cell: [44, 28], gap: 6, tone: token, style: faded,
      colLabels: [卡 0, 卡 1, 卡 2, 卡 3],
      cells: [{ at: [0, 0], text: '2' }, { at: [0, 1], text: '20' }, { at: [0, 2], text: '200' }, { at: [0, 3], text: '2000' }] }
  # 发：四张卡的第 2 块
  - { at: [446, 190], rows: 1, cols: 4, cell: [44, 28], gap: 6, tone: token, style: faded,
      colLabels: [卡 0, 卡 1, 卡 2, 卡 3],
      cells: [{ at: [0, 0], text: '3' }, { at: [0, 1], text: '30' }, { at: [0, 2], text: '300' }, { at: [0, 3], text: '3000' }] }
  # 发：四张卡的第 3 块
  - { at: [652, 190], rows: 1, cols: 4, cell: [44, 28], gap: 6, tone: token, style: faded,
      colLabels: [卡 0, 卡 1, 卡 2, 卡 3],
      cells: [{ at: [0, 0], text: '4' }, { at: [0, 1], text: '40' }, { at: [0, 2], text: '400' }, { at: [0, 3], text: '4000' }] }
  # 根卡 0 的结果：第 c 组加进第 c 块
  - { at: [28, 300], rows: 1, cols: 4, cell: [206, 30], tone: token, style: solid, label: 卡 0,
      cells: [{ at: [0, 0], text: '1111' }, { at: [0, 1], text: '2222' }, { at: [0, 2], text: '3333' }, { at: [0, 3], text: '4444' }] }
  # 发之后
  - { at: [38, 428], rows: 1, cols: 4, cell: [42, 30], tone: token, style: solid, label: 卡 0,
      cells: [{ at: [0, 0], text: '1111' }, { at: [0, 1], text: '2222' }, { at: [0, 2], text: '3333' }, { at: [0, 3], text: '4444' }] }
  - { at: [250, 428], rows: 1, cols: 4, cell: [42, 30], tone: token, style: faded, label: 卡 1,
      cells: [{ at: [0, 0], text: '10' }, { at: [0, 1], text: '20' }, { at: [0, 2], text: '30' }, { at: [0, 3], text: '40' }] }
  - { at: [462, 428], rows: 1, cols: 4, cell: [42, 30], tone: token, style: faded, label: 卡 2,
      cells: [{ at: [0, 0], text: '100' }, { at: [0, 1], text: '200' }, { at: [0, 2], text: '300' }, { at: [0, 3], text: '400' }] }
  - { at: [674, 428], rows: 1, cols: 4, cell: [42, 30], tone: token, style: faded, label: 卡 3,
      cells: [{ at: [0, 0], text: '1000' }, { at: [0, 1], text: '2000' }, { at: [0, 2], text: '3000' }, { at: [0, 3], text: '4000' }] }
