layout: figure
id: collective-communication-reduce
caption: Reduce（SUM）：每张卡都有同样长的 4 块，全部送到根卡 0 按位置相加；只有根卡拿到结果，其余卡的块只是用过的输入（灰字）。圆点全实心表示这块已经加进了 4 张卡的数。
size: [880, 696]
exchanges:
  - at: [105, 8]
    cards: [卡 0, 卡 1, 卡 2, 卡 3]
    slots: 4
    gap: [190, 96]
    dots: true
    tag: 数为示意
    start:
      - [1, 2, 3, 4]
      - [10, 20, 30, 40]
      - [100, 200, 300, 400]
      - [1000, 2000, 3000, 4000]
    steps:
      - title: 每张卡把 4 块都发给根卡 0，根卡按位置相加
        moves:
          - { from: [1, 0], to: [0, 0], op: add }
          - { from: [1, 1], to: [0, 1], op: add }
          - { from: [1, 2], to: [0, 2], op: add }
          - { from: [1, 3], to: [0, 3], op: add }
          - { from: [2, 0], to: [0, 0], op: add }
          - { from: [2, 1], to: [0, 1], op: add }
          - { from: [2, 2], to: [0, 2], op: add }
          - { from: [2, 3], to: [0, 3], op: add }
          - { from: [3, 0], to: [0, 0], op: add }
          - { from: [3, 1], to: [0, 1], op: add }
          - { from: [3, 2], to: [0, 2], op: add }
          - { from: [3, 3], to: [0, 3], op: add }
        keep: [[0, 0], [0, 1], [0, 2], [0, 3]]
    end: 通信后：只有根卡 0 拿到各位置之和
