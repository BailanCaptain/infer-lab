layout: figure
id: collective-communication-ring
caption: ring All-Reduce（SUM）：4 张卡首尾相连成环（卡 0→1→2→3→0），每一步每张卡只把 1 块发给下一张卡。前 3 步是 Reduce-Scatter，收到就加进同位置；后 3 步是 All-Gather，把加齐的块沿环传一圈，收到就覆盖。每格每列是一张收数据的卡，块上方写着它从哪张卡来；浅色是还没加齐的数，深色是四张卡都加进来的块；最后一格圆圈里是第几步收到。
size: [880, 1032]
frames:
  - { label: 发之前：每张卡各有自己的 4 块数, at: [8, 30], size: [864, 90] }
  - { label: 第 1 步（Reduce-Scatter）：每张卡把 1 块发给环上下一张卡（卡 3 的下一张是卡 0），对方加进同位置, at: [8, 158], size: [864, 188] }
  - { label: 第 2 步：把刚加过的那块接着往下传，再加一次, at: [8, 384], size: [864, 188] }
  - { label: 第 3 步：再传一次，每张卡各有 1 块加进了全部 4 张卡的数, at: [8, 610], size: [864, 188] }
  - { label: 第 4–6 步（All-Gather）：加齐的块沿环往下传，每步收 1 块、直接覆盖, at: [8, 836], size: [864, 188] }
