layout: figure
id: collective-communication-scatter
caption: Scatter：根卡 0 把数据切成 4 块，第 k 块发给卡 k。中间一格每列是一张收数据的卡，紫色箭头是经过通信送来的块，灰色虚线是根卡自己留下的第 0 块，不用发。
size: [880, 482]
frames:
  - { label: 发之前：只有根卡 0 有数据，其余卡只有空的接收位置, at: [8, 30], size: [864, 90] }
  - { label: 根卡 0 把第 k 块发给卡 k, at: [8, 158], size: [864, 188] }
  - { label: 发之后：卡 k 只拿到第 k 块, at: [8, 384], size: [864, 90] }
grids:
  # 发之前：只有根卡 0 有数
  - { at: [38, 52], rows: 1, cols: 4, cell: [42, 30], tone: token, style: faded, label: 卡 0,
      cells: [{ at: [0, 0], text: '1' }, { at: [0, 1], text: '2' }, { at: [0, 2], text: '3' }, { at: [0, 3], text: '4' }] }
  - { at: [250, 52], rows: 1, cols: 4, cell: [42, 30], tone: token, label: 卡 1 }
  - { at: [462, 52], rows: 1, cols: 4, cell: [42, 30], tone: token, label: 卡 2 }
  - { at: [674, 52], rows: 1, cols: 4, cell: [42, 30], tone: token, label: 卡 3 }
  # 发：第 0 块留在根卡 0，不用发
  - { at: [41, 190], rows: 1, cols: 1, cell: [36, 28], gap: 6, tone: token, style: faded, colLabels: [卡 0],
      cells: [{ at: [0, 0], text: '1' }] }
  - { at: [38, 278], rows: 1, cols: 4, cell: [42, 30], tone: token, label: 卡 0,
      cells: [{ at: [0, 0], text: '1', style: solid }] }
  # 发：第 1 块送到卡 1
  - { at: [295, 190], rows: 1, cols: 1, cell: [36, 28], gap: 6, tone: token, style: faded, colLabels: [卡 0],
      cells: [{ at: [0, 0], text: '2' }] }
  - { at: [250, 278], rows: 1, cols: 4, cell: [42, 30], tone: token, label: 卡 1,
      cells: [{ at: [0, 1], text: '2', style: solid }] }
  # 发：第 2 块送到卡 2
  - { at: [549, 190], rows: 1, cols: 1, cell: [36, 28], gap: 6, tone: token, style: faded, colLabels: [卡 0],
      cells: [{ at: [0, 0], text: '3' }] }
  - { at: [462, 278], rows: 1, cols: 4, cell: [42, 30], tone: token, label: 卡 2,
      cells: [{ at: [0, 2], text: '3', style: solid }] }
  # 发：第 3 块送到卡 3
  - { at: [803, 190], rows: 1, cols: 1, cell: [36, 28], gap: 6, tone: token, style: faded, colLabels: [卡 0],
      cells: [{ at: [0, 0], text: '4' }] }
  - { at: [674, 278], rows: 1, cols: 4, cell: [42, 30], tone: token, label: 卡 3,
      cells: [{ at: [0, 3], text: '4', style: solid }] }
  # 发之后
  - { at: [38, 406], rows: 1, cols: 4, cell: [42, 30], tone: token, label: 卡 0,
      cells: [{ at: [0, 0], text: '1', style: solid }] }
  - { at: [250, 406], rows: 1, cols: 4, cell: [42, 30], tone: token, label: 卡 1,
      cells: [{ at: [0, 1], text: '2', style: solid }] }
  - { at: [462, 406], rows: 1, cols: 4, cell: [42, 30], tone: token, label: 卡 2,
      cells: [{ at: [0, 2], text: '3', style: solid }] }
  - { at: [674, 406], rows: 1, cols: 4, cell: [42, 30], tone: token, label: 卡 3,
      cells: [{ at: [0, 3], text: '4', style: solid }] }
links:
  - { from: [59, 218], to: [59, 276], tone: control, dashed: true }
  - { from: [313, 218], to: [313, 276], tone: comm }
  - { from: [567, 218], to: [567, 276], tone: comm }
  - { from: [821, 218], to: [821, 276], tone: comm }
texts:
  - { at: [872, 18], text: 数为示意, size: 12.5, note: true, anchor: end }
