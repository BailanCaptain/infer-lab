layout: figure
id: collective-communication
caption: 两张卡各算出一份部分和，交换后都拿到对应位置之和。紫色块是正在发的数据，沿箭头送到对方；青色实心块是刚加好的；每块下面的圆点表示这块里有哪几张卡的数。
size: [600, 328]
exchanges:
  - at: [40, 8]
    cards: [卡 0, 卡 1]
    slots: 2
    cell: [64, 40]
    gap: [230, 96]
    dots: true
    tag: 数为示意
    start:
      - [1, 2]
      - [10, 20]
    steps:
      - title: 交换：各把两块发给对方，对方加进同位置
        moves:
          - { from: [0, 0], to: [1, 0], op: add }
          - { from: [0, 1], to: [1, 1], op: add }
          - { from: [1, 0], to: [0, 0], op: add }
          - { from: [1, 1], to: [0, 1], op: add }
    end: 交换后：两张卡都是 [11, 22]
