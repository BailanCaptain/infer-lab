<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 560" width="900" height="560" role="img" aria-label="Continuous Batching 步间动态重组与 _free_request 立即回池对比延迟释放双分支" font-family="var(--font-sans)">
<title>Continuous Batching 步间边界机制：拼合输入前向 → _free_request 双路释放判据 → 第 k+1 步准入或排队</title>
<desc>展示第 k 步原空闲 1 块、等待请求 D 需 2 块；步末 A 经 _free_request 分成「无延迟且最后引用归零（空闲到 3 块，D 在预算允许时进场）」与「delay_free_blocks 或仍有引用（空闲仍 1 块，D 继续排队）」两条路径。</desc>
<defs>
  <marker id="cb-ctrl" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
    <path d="M1 1.5L8.5 5L1 8.5Z" fill="#66716d"/>
  </marker>
  <marker id="cb-teal" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
    <path d="M1 1.5L8.5 5L1 8.5Z" fill="#087f73"/>
  </marker>
  <marker id="cb-red" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
    <path d="M1 1.5L8.5 5L1 8.5Z" fill="#b54237"/>
  </marker>
</defs>

<text x="18" y="31" font-size="16" font-weight="700" fill="#17211f">Continuous Batching 步间重组与块回收双分支（示意：原空闲 1 块，新请求 D 需 2 块）</text>

<!-- Column 1: Step k -->
<rect x="14" y="46" width="258" height="440" rx="10" fill="#fbfaf6" stroke="#d8d8cf" stroke-width="1.3"/>
<circle cx="36" cy="70" r="11" fill="#087f73"/>
<text x="36" y="74.5" text-anchor="middle" font-size="12.5" font-weight="700" fill="#ffffff">1</text>
<text x="54" y="75" font-size="14.5" font-weight="700" fill="#17211f">第 k 步：拼合输入与块池</text>
<line x1="26" y1="90" x2="260" y2="90" stroke="#d8d8cf" stroke-width="1.2"/>

<text x="143" y="112" text-anchor="middle" font-size="12.5" font-weight="700" fill="#4d5652">首尾拼接输入张量（附起止边界）</text>
<rect x="26" y="122" width="234" height="38" rx="6" fill="#fff0e9" stroke="#b54237" stroke-width="1.2"/>
<text x="143" y="145.5" text-anchor="middle" font-size="12.5" font-weight="700" fill="#8f3229">Req A（Decode · 本步结束）</text>
<rect x="26" y="166" width="234" height="38" rx="6" fill="#ddf4ef" stroke="#087f73" stroke-width="1.2"/>
<text x="143" y="189.5" text-anchor="middle" font-size="12.5" font-weight="700" fill="#065f56">Req B（Decode · 持续生成）</text>
<rect x="26" y="210" width="234" height="44" rx="6" fill="#fff4cf" stroke="#c78300" stroke-width="1.2"/>
<text x="143" y="229" text-anchor="middle" font-size="12.5" font-weight="700" fill="#936300">Req C（Prefill · 算提示词）</text>
<text x="143" y="247" text-anchor="middle" font-size="12" fill="#4d5652">同一步共用权重批量前向</text>

<rect x="26" y="268" width="234" height="112" rx="7" fill="#ffffff" stroke="#4c65b6" stroke-width="1.2"/>
<text x="143" y="290" text-anchor="middle" font-size="12.5" font-weight="700" fill="#3a4f93">第 k 步块池（6 块 · 原空闲 1 块）</text>
<g stroke-width="1.1" font-size="12" font-weight="700" text-anchor="middle">
  <rect x="34" y="302" width="32" height="30" rx="4" fill="#fae1d8" stroke="#b54237"/><text x="50" y="321.5" fill="#8f3229">A₀</text>
  <rect x="71" y="302" width="32" height="30" rx="4" fill="#fae1d8" stroke="#b54237"/><text x="87" y="321.5" fill="#8f3229">A₁</text>
  <rect x="108" y="302" width="32" height="30" rx="4" fill="#dce4fc" stroke="#4c65b6"/><text x="124" y="321.5" fill="#3a4f93">B₀</text>
  <rect x="145" y="302" width="32" height="30" rx="4" fill="#fff4cf" stroke="#c78300"/><text x="161" y="321.5" fill="#936300">C₀</text>
  <rect x="182" y="302" width="32" height="30" rx="4" fill="#fff4cf" stroke="#c78300"/><text x="198" y="321.5" fill="#936300">C₁</text>
  <rect x="219" y="302" width="32" height="30" rx="4" fill="#ece9df" stroke="#b8bcb5" stroke-dasharray="3 2"/><text x="235" y="321.5" fill="#66716d">空</text>
</g>
<text x="143" y="354" text-anchor="middle" font-size="12" fill="#4d5652">A 占 2 块 · B 占 1 块 · C 占 2 块</text>
<text x="143" y="372" text-anchor="middle" font-size="12" font-weight="700" fill="#3a4f93">空闲 = 1 块（不足 2 块）</text>

<rect x="26" y="392" width="234" height="80" rx="7" fill="#fff4cf" stroke="#c78300" stroke-width="1.2"/>
<text x="143" y="415" text-anchor="middle" font-size="12.5" font-weight="700" fill="#936300">Waiting 队列：新请求 Req D</text>
<text x="143" y="438" text-anchor="middle" font-size="12" fill="#17211f">首步需要 2 个物理 KV 块</text>
<text x="143" y="459" text-anchor="middle" font-size="12" fill="#4d5652">等第 k+1 步 schedule 重新检查</text>
<!-- Column 2: Step-End _free_request Two Branches & Reschedule -->
<rect x="292" y="46" width="280" height="440" rx="10" fill="#fbfaf6" stroke="#d8d8cf" stroke-width="1.3"/>
<circle cx="314" cy="70" r="11" fill="#4c65b6"/>
<text x="314" y="74.5" text-anchor="middle" font-size="12.5" font-weight="700" fill="#ffffff">2</text>
<text x="332" y="75" font-size="14.5" font-weight="700" fill="#17211f">步末 _free_request 双路判据</text>
<line x1="304" y1="90" x2="560" y2="90" stroke="#d8d8cf" stroke-width="1.2"/>

<rect x="304" y="100" width="256" height="52" rx="7" fill="#ffffff" stroke="#4c65b6" stroke-width="1.2"/>
<text x="432" y="122" text-anchor="middle" font-size="12.5" font-weight="700" fill="#3a4f93">Req A 停止退出 → 调 _free_request</text>
<text x="432" y="142" text-anchor="middle" font-size="12" fill="#4d5652">物理块 A₀、A₁ 是否立即回池分两路：</text>

<rect x="304" y="164" width="256" height="108" rx="7" fill="#ddf4ef" stroke="#087f73" stroke-width="1.3"/>
<text x="432" y="186" text-anchor="middle" font-size="12.5" font-weight="700" fill="#065f56">① 无延迟释放且最后引用归零</text>
<text x="432" y="208" text-anchor="middle" font-family="var(--font-mono)" font-size="12" fill="#17211f">not delay_free_blocks &amp; ref==0</text>
<text x="432" y="230" text-anchor="middle" font-size="12" font-weight="700" fill="#065f56">A₀、A₁ 回池 → 空闲 1 + 2 = 3 块</text>
<text x="432" y="253" text-anchor="middle" font-size="12" fill="#4d5652">schedule：预算允许时准入 D（领 2 块）</text>

<rect x="304" y="284" width="256" height="108" rx="7" fill="#fff0e9" stroke="#b54237" stroke-width="1.3"/>
<text x="432" y="306" text-anchor="middle" font-size="12.5" font-weight="700" fill="#8f3229">② 延迟释放或仍有共享引用</text>
<text x="432" y="328" text-anchor="middle" font-family="var(--font-mono)" font-size="12" fill="#8f3229">delay_free_blocks / ref &gt; 0</text>
<text x="432" y="350" text-anchor="middle" font-size="12" font-weight="700" fill="#b54237">连接器待传完或引用未零 → 空闲仍 1 块</text>
<text x="432" y="373" text-anchor="middle" font-size="12" fill="#4d5652">schedule：不足 2 块，Req D 继续排队</text>

<rect x="304" y="404" width="256" height="68" rx="7" fill="#ffffff" stroke="#d8d8cf" stroke-width="1.2"/>
<text x="432" y="428" text-anchor="middle" font-size="12.5" font-weight="700" fill="#17211f">在跑 Req B、C 各自推进生成边界</text>
<text x="432" y="452" text-anchor="middle" font-size="12" fill="#4d5652">保留各自块表，优先领下一步预算</text>

<!-- Column 3: Step k+1 Two Branch Outcomes -->
<rect x="592" y="46" width="294" height="440" rx="10" fill="#fbfaf6" stroke="#d8d8cf" stroke-width="1.3"/>
<circle cx="614" cy="70" r="11" fill="#c78300"/>
<text x="614" y="74.5" text-anchor="middle" font-size="12.5" font-weight="700" fill="#ffffff">3</text>
<text x="632" y="75" font-size="14.5" font-weight="700" fill="#17211f">第 k+1 步：两路批次与块池结果</text>
<line x1="604" y1="90" x2="874" y2="90" stroke="#d8d8cf" stroke-width="1.2"/>

<!-- Outcome 1 -->
<rect x="604" y="102" width="270" height="178" rx="8" fill="#ddf4ef" stroke="#087f73" stroke-width="1.3"/>
<text x="739" y="124" text-anchor="middle" font-size="12.5" font-weight="700" fill="#065f56">路径 ① 结果：空闲达 3 块，D 预算内进场</text>
<rect x="616" y="134" width="246" height="28" rx="5" fill="#ffffff" stroke="#087f73" stroke-width="1.1"/>
<text x="739" y="152.5" text-anchor="middle" font-size="12" font-weight="700" fill="#065f56">新批次：Req B + Req C + Req D (Prefill)</text>
<g stroke-width="1.1" font-size="12" font-weight="700" text-anchor="middle">
  <rect x="616" y="172" width="36" height="30" rx="4" fill="#fff4cf" stroke="#c78300"/><text x="634" y="191.5" fill="#936300">D₀</text>
  <rect x="658" y="172" width="36" height="30" rx="4" fill="#fff4cf" stroke="#c78300"/><text x="676" y="191.5" fill="#936300">D₁</text>
  <rect x="700" y="172" width="36" height="30" rx="4" fill="#dce4fc" stroke="#4c65b6"/><text x="718" y="191.5" fill="#3a4f93">B₀</text>
  <rect x="742" y="172" width="36" height="30" rx="4" fill="#dce4fc" stroke="#4c65b6"/><text x="760" y="191.5" fill="#3a4f93">C₀</text>
  <rect x="784" y="172" width="36" height="30" rx="4" fill="#dce4fc" stroke="#4c65b6"/><text x="802" y="191.5" fill="#3a4f93">C₁</text>
  <rect x="826" y="172" width="36" height="30" rx="4" fill="#ece9df" stroke="#b8bcb5" stroke-dasharray="3 2"/><text x="844" y="191.5" fill="#66716d">空</text>
</g>
<text x="739" y="226" text-anchor="middle" font-size="12" fill="#065f56">3 个空闲块中分 2 块给 D，池内余 1 空块</text>
<text x="739" y="248" text-anchor="middle" font-size="12" fill="#4d5652">（需本步剩余 token 预算同时满足准入）</text>

<!-- Outcome 2 -->
<rect x="604" y="294" width="270" height="178" rx="8" fill="#fff0e9" stroke="#b54237" stroke-width="1.3"/>
<text x="739" y="316" text-anchor="middle" font-size="12.5" font-weight="700" fill="#8f3229">路径 ② 结果：A 块仍占用，D 继续排队</text>
<rect x="616" y="326" width="246" height="28" rx="5" fill="#ffffff" stroke="#b54237" stroke-width="1.1"/>
<text x="739" y="344.5" text-anchor="middle" font-size="12" font-weight="700" fill="#8f3229">新批次：仅 Req B + Req C（D 留 Waiting）</text>
<g stroke-width="1.1" font-size="12" font-weight="700" text-anchor="middle">
  <rect x="616" y="364" width="36" height="30" rx="4" fill="#fae1d8" stroke="#b54237" stroke-dasharray="3 2"/><text x="634" y="383.5" fill="#8f3229">A₀*</text>
  <rect x="658" y="364" width="36" height="30" rx="4" fill="#fae1d8" stroke="#b54237" stroke-dasharray="3 2"/><text x="676" y="383.5" fill="#8f3229">A₁*</text>
  <rect x="700" y="364" width="36" height="30" rx="4" fill="#dce4fc" stroke="#4c65b6"/><text x="718" y="383.5" fill="#3a4f93">B₀</text>
  <rect x="742" y="364" width="36" height="30" rx="4" fill="#dce4fc" stroke="#4c65b6"/><text x="760" y="383.5" fill="#3a4f93">C₀</text>
  <rect x="784" y="364" width="36" height="30" rx="4" fill="#dce4fc" stroke="#4c65b6"/><text x="802" y="383.5" fill="#3a4f93">C₁</text>
  <rect x="826" y="364" width="36" height="30" rx="4" fill="#ece9df" stroke="#b8bcb5" stroke-dasharray="3 2"/><text x="844" y="383.5" fill="#66716d">空</text>
</g>
<text x="739" y="418" text-anchor="middle" font-size="12" fill="#8f3229">A₀*, A₁* 暂未归还，空闲仍仅 1 块 (&lt; 2)</text>
<text x="739" y="440" text-anchor="middle" font-size="12" fill="#4d5652">待异步传输回调或引用清零后再回池</text>

<line x1="272" y1="226" x2="290" y2="226" stroke="#66716d" stroke-width="1.8" marker-end="url(#cb-ctrl)"/>
<line x1="572" y1="218" x2="590" y2="218" stroke="#087f73" stroke-width="1.8" marker-end="url(#cb-teal)"/>
<line x1="572" y1="342" x2="590" y2="342" stroke="#b54237" stroke-width="1.8" marker-end="url(#cb-red)"/>

<!-- Bottom Invariant Strip -->
<rect x="14" y="498" width="872" height="50" rx="8" fill="#ece9df" stroke="#d8d8cf" stroke-width="1.2"/>
<text x="450" y="519" text-anchor="middle" font-size="13" font-weight="700" fill="#17211f">核心不变量：同一步共享同一份权重前向，各请求块表与停止边界独立；物理块仅在无延迟挂起且引用归零后才可复用</text>
<text x="450" y="539" text-anchor="middle" font-size="12" fill="#66716d">告别静态批处理整批陪等，同时兼容 KV 连接器异步跨机传块的生命周期保护</text>
</svg>
