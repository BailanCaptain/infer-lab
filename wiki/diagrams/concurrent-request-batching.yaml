mode: native-svg
id: concurrent-request-batching
caption: >-
  continuous batching（连续批处理）在步间边界的重组与块复用：第 k 步将处于 Prefill 与 Decode 的多条请求首尾拼成单一输入张量共享权重前向；步末经 _free_request 立即释放已完成请求的物理 KV 块，并由 schedule 准入等待队列新请求直接复用空出槽位与剩余 token 预算，各请求块表与停止边界全程独立。
size: [900, 470]
