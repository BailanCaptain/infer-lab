layout: figure
id: concurrent-request-graph-decision
caption: 官方 FULL_DECODE_ONLY 配置下，先选本地图模式与宽度，再跨 DP 同步。同一次同步同时确定模式与宽度，最后按商定结果重新选图。
size: [900, 890]
frames:
  - { at: [24, 518], size: [852, 120], label: 同时确定两项 · 每组都执行 }
items:
  - { at: [200, 18], size: [500, 60], text: 决定本地图模式与宽度, sub: 输入本轮真实 token 数与每条请求的进度, style: plain }
  - { at: [200, 124], size: [500, 72], text: 提示词都算完，且是整齐的 decode 批次？, sub: 每条 4 个；总数 = 4 × 请求数；尺寸在捕获范围内, style: plain }
  - { at: [24, 258], size: [384, 70], text: 是：向上选最近的捕获尺寸, sub: 本地模式 FULL；允许 DP 补齐, tone: token }
  - { at: [492, 258], size: [384, 70], text: 否：按真实宽度执行, sub: 本地模式 NONE，也就是 eager, style: plain }
  - { at: [200, 402], size: [500, 70], text: 跨 DP 同步, sub: All-Reduce 交换各组的本地宽度与模式, tone: comm }
  - { at: [40, 552], size: [368, 66], text: 模式：取两组较低值, sub: 两组都能用图 → FULL；其余 → NONE, style: plain }
  - { at: [492, 552], size: [368, 66], text: 宽度：按本地补齐条件决定, sub: 允许 → 两组最大值；其余 → 本地宽度, style: plain }
  - { at: [200, 694], size: [500, 64], text: 按商定的模式和宽度重新选一次图, sub: 确认实际批次宽度与商定值一致, style: plain }
  - { at: [24, 814], size: [384, 50], text: FULL → 回放相应尺寸的图, tone: weight }
  - { at: [492, 814], size: [384, 50], text: NONE → eager 执行, tone: weight }
