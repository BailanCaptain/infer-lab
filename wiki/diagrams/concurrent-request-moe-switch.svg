<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 470" width="900" height="470" role="img" aria-label="场景 M 第 2 步，两组 token 数的最大值 6048 超过 128，MoE 从 MC2 翻到 all-gather。上半是 DP1 一张卡上的一层：28 行真实数据补到 6048 行，和另一台机器上的对应卡交换后变成 12096 行；下半按同一比例画各操作的逻辑张量量级。MC2 是路由载荷上界，all-gather 一行合计不同操作的载荷，均不是链路实测流量，不能据两者比值推算通信或延迟倍数。">
  <title>场景 M 第 2 步，两组 token 数的最大值 6048 超过 128，MoE 从 MC2 翻到 all-gather。上半是 DP1 一张卡上的一层：28 行真实数据补到 6048 行，和另一台机器上的对应卡交换后变成 12096 行；下半按同一比例画各操作的逻辑张量量级。MC2 是路由载荷上界，all-gather 一行合计不同操作的载荷，均不是链路实测流量，不能据两者比值推算通信或延迟倍数。</title>
