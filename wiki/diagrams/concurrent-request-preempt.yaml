layout: figure
id: concurrent-request-preempt
caption: 默认先来先服务策略下，running 请求续块失败才进入这条循环。先回收队尾请求的块，再重试当前请求；若回收的就是当前请求，本轮停止遍历 running。
size: [840, 760]
items:
  - { at: [210, 22], size: [420, 62], text: 为 running 当前请求申请块号, sub: 预留本步计算和后续候选的位置, tone: kv }
  - { at: [210, 136], size: [420, 56], text: 是否拿到所需的块？, style: plain }
  - { at: [26, 264], size: [338, 66], text: 成功：记录本步数量并扣预算, sub: → 回到调度图，处理下一条 running, tone: token }
  - { at: [452, 264], size: [362, 66], text: 失败：从 running 队尾取一条, sub: 让这条请求让出缓存位置, tone: danger }
  - { at: [452, 388], size: [362, 76], text: 收回 KV 块、清零已计算位置, sub: 清空候选，放回 waiting 队首, tone: kv }
  - { at: [452, 526], size: [362, 56], text: 被抢占的是当前请求？, style: plain }
  - { at: [452, 664], size: [362, 58], text: 是：结束 running 遍历, sub: 本轮已有抢占，跳过 waiting 接纳, style: plain }
