<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 300" width="900" height="300" role="img" aria-label="一个昇腾开关的旅程：写在启动命令附带的一段 JSON 里，上游原样带着不解释，启动时按键拆成八组配置对象，各组件都从进程里唯一的一份里取">
  <title>一个昇腾开关的旅程：写在启动命令附带的一段 JSON 里，上游原样带着不解释，启动时按键拆成八组配置对象，各组件都从进程里唯一的一份里取</title>
  <defs><marker id="config-flow-ah-ink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="var(--color-ink, #17211f)"/></marker></defs>
  <path d="M220 132 L280 132" fill="none" stroke="var(--color-ink, #17211f)" stroke-width="1.4" marker-end="url(#config-flow-ah-ink)"/>
  <path d="M490 132 L552 132" fill="none" stroke="var(--color-ink, #17211f)" stroke-width="1.4" marker-end="url(#config-flow-ah-ink)"/>
  <path d="M718 158 L718 204" fill="none" stroke="var(--color-ink, #17211f)" stroke-width="1.4" marker-end="url(#config-flow-ah-ink)"/>
  <rect x="560" y="110" width="36" height="44" rx="4" fill="var(--color-control, #66716d)" stroke="var(--color-ink, #17211f)" stroke-width="1.2"/>
  <rect x="600" y="110" width="36" height="44" rx="4" fill="var(--color-control, #66716d)" stroke="var(--color-ink, #17211f)" stroke-width="1.2"/>
  <rect x="640" y="110" width="36" height="44" rx="4" fill="var(--color-control, #66716d)" stroke="var(--color-ink, #17211f)" stroke-width="1.2"/>
  <rect x="680" y="110" width="36" height="44" rx="4" fill="var(--color-control, #66716d)" stroke="var(--color-ink, #17211f)" stroke-width="1.2"/>
  <rect x="720" y="110" width="36" height="44" rx="4" fill="var(--color-control, #66716d)" stroke="var(--color-ink, #17211f)" stroke-width="1.2"/>
  <rect x="760" y="110" width="36" height="44" rx="4" fill="var(--color-control, #66716d)" stroke="var(--color-ink, #17211f)" stroke-width="1.2"/>
  <rect x="800" y="110" width="36" height="44" rx="4" fill="var(--color-control, #66716d)" stroke="var(--color-ink, #17211f)" stroke-width="1.2"/>
  <rect x="840" y="110" width="36" height="44" rx="4" fill="var(--color-control, #66716d)" stroke="var(--color-ink, #17211f)" stroke-width="1.2"/>
  <rect x="30" y="100" width="190" height="64" rx="8" fill="var(--color-control, #66716d)" stroke="var(--color-ink, #17211f)" stroke-width="1.5"/>
  <text x="125" y="128" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="14" font-weight="700" fill="var(--color-ink-inverse, #ffffff)" text-anchor="middle">启动命令</text>
  <text x="125" y="147" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="13" font-weight="400" fill="var(--color-ink-inverse, #ffffff)" text-anchor="middle">附带的一段 JSON</text>
  <rect x="280" y="100" width="210" height="64" rx="8" fill="var(--color-surface-sunken, #ece9df)" stroke="var(--color-control, #66716d)" stroke-opacity="0.4" stroke-width="1.5" stroke-dasharray="5 4"/>
  <text x="385" y="128" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="13" font-weight="400" fill="#4d5652" text-anchor="middle">上游原样带着</text>
  <text x="385" y="147" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="13" font-weight="400" fill="#4d5652" text-anchor="middle">不解释也不检查</text>
  <rect x="570" y="204" width="296" height="56" rx="8" fill="var(--color-token, #087f73)" stroke="var(--color-ink, #17211f)" stroke-width="1.5"/>
  <text x="718" y="228" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="14" font-weight="700" fill="var(--color-ink-inverse, #ffffff)" text-anchor="middle">各组件随取随用</text>
  <text x="718" y="247" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="13" font-weight="400" fill="var(--color-ink-inverse, #ffffff)" text-anchor="middle">整个进程只有一份</text>
  <text x="560" y="92" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="13" font-weight="400" fill="var(--color-ink-muted, #66716d)" font-style="italic">启动时按键拆成八组，缺的键用默认值补上</text>
  <rect x="30" y="216" width="258" height="24" rx="12" fill="var(--color-danger, #b54237)"/>
  <text x="159" y="233" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="13" font-weight="700" fill="var(--color-ink-inverse, #ffffff)" text-anchor="middle">拼错的键在拆的时候被直接略过，不报错</text>
</svg>
