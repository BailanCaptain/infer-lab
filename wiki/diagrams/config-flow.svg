<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 415" width="900" height="415" role="img" aria-label="对支持兼容映射的字段，显式 JSON 键优先，否则使用环境读取值；解析后还需通过配置检查">
  <title>对支持兼容映射的字段，显式 JSON 键优先，否则使用环境读取值；解析后还需通过配置检查</title>
  <defs><marker id="config-flow-ah-control" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="var(--color-control, #66716d)"/></marker><marker id="config-flow-ah-kv" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="var(--color-kv, #4c65b6)"/></marker></defs>
  <path d="M230 102 L270 102 L270 170 L315 170" fill="none" stroke="var(--color-control, #66716d)" stroke-width="1.4" marker-end="url(#config-flow-ah-control)"/>
  <path d="M230 277 L270 277 L270 205 L315 205" fill="none" stroke="var(--color-kv, #4c65b6)" stroke-width="1.4" marker-end="url(#config-flow-ah-kv)"/>
  <path d="M540 175 L585 175 L585 92 L630 92" fill="none" stroke="var(--color-control, #66716d)" stroke-width="1.4" marker-end="url(#config-flow-ah-control)"/>
  <path d="M540 205 L585 205 L585 267 L630 267" fill="none" stroke="var(--color-kv, #4c65b6)" stroke-width="1.4" marker-end="url(#config-flow-ah-kv)"/>
  <rect x="25" y="70" width="205" height="65" rx="8" fill="var(--color-control, #66716d)" stroke="var(--color-ink, #17211f)" stroke-width="1.5"/>
  <text x="127.5" y="98.5" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="14" font-weight="700" fill="var(--color-ink-inverse, #ffffff)" text-anchor="middle">JSON 扩展配置</text>
  <text x="127.5" y="117.5" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="13" font-weight="400" fill="var(--color-ink-inverse, #ffffff)" text-anchor="middle">显式键，包含 false</text>
  <rect x="25" y="245" width="205" height="65" rx="8" fill="var(--color-kv, #4c65b6)" stroke="var(--color-ink, #17211f)" stroke-width="1.5"/>
  <text x="127.5" y="273.5" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="14" font-weight="700" fill="var(--color-ink-inverse, #ffffff)" text-anchor="middle">环境读取结果</text>
  <text x="127.5" y="292.5" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="13" font-weight="400" fill="var(--color-ink-inverse, #ffffff)" text-anchor="middle">含读取器默认值</text>
  <rect x="315" y="150" width="225" height="75" rx="8" fill="var(--color-control, #66716d)" stroke="var(--color-ink, #17211f)" stroke-width="1.5"/>
  <text x="427.5" y="183.5" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="14" font-weight="700" fill="var(--color-ink-inverse, #ffffff)" text-anchor="middle">字典里存在该键？</text>
  <text x="427.5" y="202.5" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="13" font-weight="400" fill="var(--color-ink-inverse, #ffffff)" text-anchor="middle">按字段兼容规则解析</text>
  <rect x="630" y="60" width="240" height="65" rx="8" fill="var(--color-control, #66716d)" stroke="var(--color-ink, #17211f)" stroke-width="1.5"/>
  <text x="750" y="97.5" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="14" font-weight="700" fill="var(--color-ink-inverse, #ffffff)" text-anchor="middle">使用 JSON 值</text>
  <rect x="630" y="235" width="240" height="65" rx="8" fill="var(--color-kv, #4c65b6)" stroke="var(--color-ink, #17211f)" stroke-width="1.5"/>
  <text x="750" y="272.5" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="14" font-weight="700" fill="var(--color-ink-inverse, #ffffff)" text-anchor="middle">使用环境读取值</text>
  <text x="550" y="142" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="13.5" font-weight="400" fill="#4d5652">是</text>
  <text x="550" y="252" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="13.5" font-weight="400" fill="#3a4f93">否</text>
  <text x="25" y="365" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="15" font-weight="400" fill="var(--color-ink, #17211f)">兼容字段示例：JSON false 优先于环境 true</text>
  <text x="25" y="397" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="13.5" font-weight="400" fill="var(--color-ink-muted, #66716d)" font-style="italic">其他字段查各自解析规则；得到字段值后继续检查组合和实际消费者</text>
</svg>
