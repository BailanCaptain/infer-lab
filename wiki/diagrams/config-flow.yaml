layout: figure
id: config-flow
caption: 固定旧 GLM 的配置顺序：平台先跑四个前置校验，再初始化 AscendConfig 并继续检查和改写；Worker 构造函数也调用初始化。已有缓存、绑定同一总配置、refresh 为假且两个必要属性存在时复用，否则重建。旧版顶层和多数子配置忽略未知键，EplbConfig 则拒收；rc2 的严格配置另看正文。
size: [900, 520]
items:
  - { at: [24, 64], size: [250, 58], text: 解析命令行参数, sub: 平台钩子补 --quantization, tone: control }
  - { at: [24, 146], size: [250, 58], text: 建 VllmConfig, sub: 解析后的 JSON 容器, tone: control }
  - { at: [24, 228], size: [250, 74], text: 平台校验与改写, sub: 四个校验在建配置之前, tone: danger }
  - { at: [24, 326], size: [250, 58], text: 每个 Worker 进程, sub: 构造时调用初始化, tone: token }
  - { at: [24, 408], size: [250, 58], text: 各处来取这一份, sub: 没建过就直接报错, tone: kv }
  - { at: [350, 200], size: [230, 74], text: 缓存能复用吗, sub: 同一对象等四项条件, tone: control }
  - { at: [640, 150], size: [230, 62], text: 复用旧的那一份, tone: control }
  - { at: [640, 250], size: [230, 86], text: 新建 AscendConfig, sub: 逐键取，多数组静默, tone: token }
  - { at: [640, 366], size: [230, 62], text: 组合不合法就报错, sub: EplbConfig 还拒未识别键, tone: danger }
