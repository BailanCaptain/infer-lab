layout: figure
id: config-flow
caption: 配置在代码里的先后：解析参数后建 VllmConfig，平台先跑校验再建配置并按角色改写，每个 Worker 进程在构造函数里各建一份，之后各处取。建的那一步先问缓存能不能复用，不能才重新逐键解析，组合不合法就在这一步报错；未识别的键在多数组里静默走默认值，只有 EplbConfig 那一组会报错。
size: [900, 520]
items:
  - { at: [24, 64], size: [250, 58], text: 解析命令行参数, sub: 平台钩子补 --quantization, tone: control }
  - { at: [24, 146], size: [250, 58], text: 建 VllmConfig, sub: 附带的 JSON 原样存下, tone: control }
  - { at: [24, 228], size: [250, 74], text: 平台校验与改写, sub: 四个校验在建配置之前, tone: danger }
  - { at: [24, 326], size: [250, 58], text: 每个 Worker 进程, sub: 构造函数里各建一份, tone: token }
  - { at: [24, 408], size: [250, 58], text: 各处来取这一份, sub: 没建过就直接报错, tone: kv }
  - { at: [350, 200], size: [230, 74], text: 缓存能复用吗, sub: 绑定同一个 VllmConfig, tone: control }
  - { at: [640, 150], size: [230, 62], text: 复用旧的那一份, tone: control }
  - { at: [640, 250], size: [230, 86], text: 新建 AscendConfig, sub: 逐键取，多数组静默, tone: token }
  - { at: [640, 366], size: [230, 62], text: 组合不合法就报错, sub: EplbConfig 还拒未识别键, tone: danger }
