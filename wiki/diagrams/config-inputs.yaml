layout: figure
id: config-inputs
caption: 固定旧 GLM 的三路输入：通用参数进 VllmConfig，additional_config 交给 AscendConfig 拆成子配置，部分环境值作为兼容输入、其余由消费者直接读。配置构造、平台准备与消费者都有各自的条件检查；表外也有直接读取环境的代码。
