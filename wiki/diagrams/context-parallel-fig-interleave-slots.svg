<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 462" width="900" height="462" role="img" aria-label="CP 历史位置交错落槽、虚拟块防重算公式与显存切分边界">
  <title>CP 历史位置交错落槽、虚拟块大小公式与复用 TP 显存边界</title>
  <desc>上半部分左侧对比 Prefill 头尾配对计算与 DCP=2 交错落槽（非本卡填 -1 跳过），右侧按同比例对比旧公式 16×PCP×DCP=128 与 v0.30.0+ 正确公式 16×dcp_world_size=64；下半部分展示轮换粒度（1 与 block_size）以及复用 TP 设备时仅主 KV 按位置切分、索引/KDA 状态逐卡复制、仍须新建 DCP 通信组。</desc>
  <defs>
    <marker id="cp-arr-teal" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse">
      <path d="M 1 1.5 L 8.5 5 L 1 8.5 z" fill="#087f73" />
    </marker>
    <marker id="cp-arr-plum" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse">
      <path d="M 1 1.5 L 8.5 5 L 1 8.5 z" fill="#9a4b86" />
    </marker>
  </defs>

  <!-- Header -->
  <text x="16" y="26" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="16" font-weight="700" fill="#17211f">CP 历史位置怎么分着存：交错落槽、虚拟块防重算与显存边界</text>
  <text x="16" y="48" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="13.5" fill="#4d5652">算谁的查询（头尾配对）与 KV 存哪张卡（交错落槽）是两套布局；DCP 复用 PCP/TP 卡时绝不重复乘 PCP</text>

  <!-- Panel dividers (open editorial style, no outer frame) -->
  <line x1="16" y1="62" x2="884" y2="62" stroke="#d8d8cf" stroke-width="1" />
  <line x1="438" y1="70" x2="438" y2="274" stroke="#d8d8cf" stroke-width="1" />
  <line x1="16" y1="282" x2="884" y2="282" stroke="#d8d8cf" stroke-width="1" />
  <line x1="438" y1="292" x2="438" y2="450" stroke="#d8d8cf" stroke-width="1" />

  <!-- ========== QUADRANT 1: Top-Left Interleave Slots ========== -->
  <text x="16" y="84" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="14.5" font-weight="700" fill="#17211f">1. 逻辑位置 0..7 交错落槽（DCP=2，粒度=1）</text>

  <!-- 8 logical position tiles -->
  <g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13.5" font-weight="600" text-anchor="middle" dominant-baseline="central">
    <rect x="20" y="96" width="46" height="32" rx="4" fill="#ddf4ef" stroke="#087f73" stroke-width="1.3" />
    <text x="43" y="112" fill="#065f56">p0</text>
    <rect x="70" y="96" width="46" height="32" rx="4" fill="#f7e7f2" stroke="#9a4b86" stroke-width="1.3" />
    <text x="93" y="112" fill="#7a3a6a">p1</text>
    <rect x="120" y="96" width="46" height="32" rx="4" fill="#ddf4ef" stroke="#087f73" stroke-width="1.3" />
    <text x="143" y="112" fill="#065f56">p2</text>
    <rect x="170" y="96" width="46" height="32" rx="4" fill="#f7e7f2" stroke="#9a4b86" stroke-width="1.3" />
    <text x="193" y="112" fill="#7a3a6a">p3</text>
    <rect x="220" y="96" width="46" height="32" rx="4" fill="#ddf4ef" stroke="#087f73" stroke-width="1.3" />
    <text x="243" y="112" fill="#065f56">p4</text>
    <rect x="270" y="96" width="46" height="32" rx="4" fill="#f7e7f2" stroke="#9a4b86" stroke-width="1.3" />
    <text x="293" y="112" fill="#7a3a6a">p5</text>
    <rect x="320" y="96" width="46" height="32" rx="4" fill="#ddf4ef" stroke="#087f73" stroke-width="1.3" />
    <text x="343" y="112" fill="#065f56">p6</text>
    <rect x="370" y="96" width="46" height="32" rx="4" fill="#f7e7f2" stroke="#9a4b86" stroke-width="1.3" />
    <text x="393" y="112" fill="#7a3a6a">p7</text>
  </g>

  <!-- Decoupling reminder band -->
  <rect x="20" y="136" width="396" height="24" rx="4" fill="#fff4cf" stroke="#c78300" stroke-width="1" />
  <text x="218" y="152" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="13.5" text-anchor="middle" fill="#936300">注：Prefill 计算另按头尾配对 {0,1,6,7} / {2,3,4,5}，与存槽无关</text>

  <!-- Flow pointers -->
  <line x1="143" y1="160" x2="143" y2="180" stroke="#087f73" stroke-width="1.5" marker-end="url(#cp-arr-teal)" />
  <line x1="293" y1="160" x2="293" y2="222" stroke="#9a4b86" stroke-width="1.5" stroke-dasharray="4 3" marker-end="url(#cp-arr-plum)" />

  <!-- Card 0 local slots -->
  <text x="20" y="206" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="13.5" font-weight="700" fill="#065f56">卡 0 槽</text>
  <g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13.5" font-weight="600" text-anchor="middle" dominant-baseline="central">
    <rect x="78" y="185" width="46" height="32" rx="4" fill="#ddf4ef" stroke="#087f73" stroke-width="1.3" />
    <text x="101" y="201" fill="#065f56">p0</text>
    <rect x="128" y="185" width="46" height="32" rx="4" fill="#ddf4ef" stroke="#087f73" stroke-width="1.3" />
    <text x="151" y="201" fill="#065f56">p2</text>
    <rect x="178" y="185" width="46" height="32" rx="4" fill="#ddf4ef" stroke="#087f73" stroke-width="1.3" />
    <text x="201" y="201" fill="#065f56">p4</text>
    <rect x="228" y="185" width="46" height="32" rx="4" fill="#ddf4ef" stroke="#087f73" stroke-width="1.3" />
    <text x="251" y="201" fill="#065f56">p6</text>
  </g>
  <rect x="284" y="185" width="132" height="32" rx="4" fill="#ece9df" stroke="#b8bcb5" stroke-width="1" stroke-dasharray="3 2" />
  <text x="350" y="206" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="13.5" text-anchor="middle" fill="#4d5652">奇数填 -1 跳过</text>

  <!-- Card 1 local slots -->
  <text x="20" y="248" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="13.5" font-weight="700" fill="#7a3a6a">卡 1 槽</text>
  <g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13.5" font-weight="600" text-anchor="middle" dominant-baseline="central">
    <rect x="78" y="227" width="46" height="32" rx="4" fill="#f7e7f2" stroke="#9a4b86" stroke-width="1.3" />
    <text x="101" y="243" fill="#7a3a6a">p1</text>
    <rect x="128" y="227" width="46" height="32" rx="4" fill="#f7e7f2" stroke="#9a4b86" stroke-width="1.3" />
    <text x="151" y="243" fill="#7a3a6a">p3</text>
    <rect x="178" y="227" width="46" height="32" rx="4" fill="#f7e7f2" stroke="#9a4b86" stroke-width="1.3" />
    <text x="201" y="243" fill="#7a3a6a">p5</text>
    <rect x="228" y="227" width="46" height="32" rx="4" fill="#f7e7f2" stroke="#9a4b86" stroke-width="1.3" />
    <text x="251" y="243" fill="#7a3a6a">p7</text>
  </g>
  <rect x="284" y="227" width="132" height="32" rx="4" fill="#ece9df" stroke="#b8bcb5" stroke-width="1" stroke-dasharray="3 2" />
  <text x="350" y="248" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="13.5" text-anchor="middle" fill="#4d5652">偶数填 -1 跳过</text>

  <!-- ========== QUADRANT 2: Top-Right Virtual Block Size Formula ========== -->
  <text x="454" y="84" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="14.5" font-weight="700" fill="#17211f">2. 虚拟块大小：旧公式重算 vs v0.30.0+ 新公式</text>

  <rect x="454" y="96" width="430" height="28" rx="4" fill="#ece9df" />
  <text x="669" y="115" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="13.5" font-weight="600" text-anchor="middle" fill="#17211f">例：TP=2, PCP=2（共 4 卡）, DCP=4（复用全 4 卡）, 本地块=16</text>

  <!-- Old wrong formula bar (scale: 16 slots = 50px, so 64 = 200px, 128 = 400px) -->
  <rect x="454" y="134" width="430" height="62" rx="6" fill="#fff0e9" stroke="#b54237" stroke-width="1.2" stroke-dasharray="5 3" />
  <text x="466" y="155" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="13.5" font-weight="700" fill="#8f3229">✗ 旧式连乘：16 × PCP(2) × DCP(4) = 128 槽（重复计数）</text>
  <g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13.5" text-anchor="middle" dominant-baseline="central">
    <rect x="466" y="164" width="48" height="24" rx="3" fill="#ffffff" stroke="#b54237" stroke-width="1" />
    <text x="490" y="176" fill="#17211f">16</text>
    <rect x="516" y="164" width="48" height="24" rx="3" fill="#ffffff" stroke="#b54237" stroke-width="1" />
    <text x="540" y="176" fill="#17211f">16</text>
    <rect x="566" y="164" width="48" height="24" rx="3" fill="#ffffff" stroke="#b54237" stroke-width="1" />
    <text x="590" y="176" fill="#17211f">16</text>
    <rect x="616" y="164" width="48" height="24" rx="3" fill="#ffffff" stroke="#b54237" stroke-width="1" />
    <text x="640" y="176" fill="#17211f">16</text>
    <rect x="670" y="164" width="202" height="24" rx="3" fill="#fff0e9" stroke="#b54237" stroke-width="1.2" stroke-dasharray="4 3" />
    <text x="771" y="176" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-weight="700" fill="#8f3229">+64 幽灵槽（重乘 PCP）</text>
  </g>

  <!-- New v0.30.0+ correct formula bar (exact same scale: 4 x 48px) -->
  <rect x="454" y="206" width="430" height="62" rx="6" fill="#ddf4ef" stroke="#087f73" stroke-width="1.4" />
  <text x="466" y="227" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="13.5" font-weight="700" fill="#065f56">✓ v0.30.0+ 新公式：16 × dcp_world_size(4) = 64 槽</text>
  <g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13.5" font-weight="600" text-anchor="middle" dominant-baseline="central">
    <rect x="466" y="236" width="48" height="24" rx="3" fill="#ffffff" stroke="#087f73" stroke-width="1.2" />
    <text x="490" y="248" fill="#065f56">R0:16</text>
    <rect x="516" y="236" width="48" height="24" rx="3" fill="#ffffff" stroke="#087f73" stroke-width="1.2" />
    <text x="540" y="248" fill="#065f56">R1:16</text>
    <rect x="566" y="236" width="48" height="24" rx="3" fill="#ffffff" stroke="#087f73" stroke-width="1.2" />
    <text x="590" y="248" fill="#065f56">R2:16</text>
    <rect x="616" y="236" width="48" height="24" rx="3" fill="#ffffff" stroke="#087f73" stroke-width="1.2" />
    <text x="640" y="248" fill="#065f56">R3:16</text>
  </g>
  <text x="676" y="253" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="13.5" font-weight="600" fill="#065f56">DCP 已含 PCP，不重乘</text>

  <!-- ========== QUADRANT 3: Bottom-Left Granularity ========== -->
  <text x="16" y="308" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="14.5" font-weight="700" fill="#17211f">3. 轮换粒度：单位置交错 vs 整块对齐</text>

  <text x="20" y="346" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="13.5" font-weight="600" fill="#4d5652">粒度 = 1</text>
  <g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13.5" font-weight="600" text-anchor="middle" dominant-baseline="central">
    <rect x="92" y="325" width="37" height="30" rx="3" fill="#ddf4ef" stroke="#087f73" stroke-width="1.2" />
    <text x="110.5" y="340" fill="#065f56">0</text>
    <rect x="133" y="325" width="37" height="30" rx="3" fill="#f7e7f2" stroke="#9a4b86" stroke-width="1.2" />
    <text x="151.5" y="340" fill="#7a3a6a">1</text>
    <rect x="174" y="325" width="37" height="30" rx="3" fill="#ddf4ef" stroke="#087f73" stroke-width="1.2" />
    <text x="192.5" y="340" fill="#065f56">2</text>
    <rect x="215" y="325" width="37" height="30" rx="3" fill="#f7e7f2" stroke="#9a4b86" stroke-width="1.2" />
    <text x="233.5" y="340" fill="#7a3a6a">3</text>
    <rect x="256" y="325" width="37" height="30" rx="3" fill="#ddf4ef" stroke="#087f73" stroke-width="1.2" />
    <text x="274.5" y="340" fill="#065f56">4</text>
    <rect x="297" y="325" width="37" height="30" rx="3" fill="#f7e7f2" stroke="#9a4b86" stroke-width="1.2" />
    <text x="315.5" y="340" fill="#7a3a6a">5</text>
    <rect x="338" y="325" width="37" height="30" rx="3" fill="#ddf4ef" stroke="#087f73" stroke-width="1.2" />
    <text x="356.5" y="340" fill="#065f56">6</text>
    <rect x="379" y="325" width="37" height="30" rx="3" fill="#f7e7f2" stroke="#9a4b86" stroke-width="1.2" />
    <text x="397.5" y="340" fill="#7a3a6a">7</text>
  </g>

  <text x="20" y="392" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="13.5" font-weight="600" fill="#4d5652">粒度 = 块</text>
  <rect x="92" y="371" width="158" height="30" rx="4" fill="#ddf4ef" stroke="#087f73" stroke-width="1.3" />
  <text x="171" y="391" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="13.5" font-weight="600" text-anchor="middle" fill="#065f56">卡 0 整块 [0..15]</text>
  <rect x="258" y="371" width="158" height="30" rx="4" fill="#f7e7f2" stroke="#9a4b86" stroke-width="1.3" />
  <text x="337" y="391" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="13.5" font-weight="600" text-anchor="middle" fill="#7a3a6a">卡 1 整块 [16..31]</text>

  <text x="20" y="432" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="13.5" fill="#4d5652">PD 分离 / KV 池 / 稀疏 CP 须设粒度 = block_size 以便整块搬运</text>

  <!-- ========== QUADRANT 4: Bottom-Right Shared TP Devices & Memory Rule ========== -->
  <text x="454" y="308" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="14.5" font-weight="700" fill="#17211f">4. 复用 TP 设备 ≠ 显存全除、≠ 省掉通信组</text>

  <!-- Row 1: Main KV shrinks -->
  <text x="454" y="346" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="13.5" font-weight="600" fill="#17211f">主 KV 历史</text>
  <rect x="546" y="327" width="60" height="28" rx="4" fill="#ddf4ef" stroke="#087f73" stroke-width="1.3" />
  <text x="576" y="346" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13.5" font-weight="700" text-anchor="middle" fill="#065f56">÷ DCP</text>
  <text x="618" y="346" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="13.5" fill="#4d5652">随长度增长部分分片（例 1024→128 B）</text>

  <!-- Row 2: Indexer / KDA stays replicated -->
  <text x="454" y="388" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="13.5" font-weight="600" fill="#17211f">索引 / KDA</text>
  <rect x="546" y="369" width="136" height="28" rx="4" fill="#fff4cf" stroke="#c78300" stroke-width="1.3" />
  <text x="614" y="388" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="13.5" font-weight="700" text-anchor="middle" fill="#936300">×1 逐卡整份复制</text>
  <text x="694" y="388" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="13.5" fill="#4d5652">不除 DCP（例 64 B）</text>

  <!-- Row 3: Comm group & indices -->
  <text x="454" y="430" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="13.5" font-weight="600" fill="#17211f">通信与下标</text>
  <rect x="546" y="411" width="338" height="28" rx="4" fill="#e8edff" stroke="#4c65b6" stroke-width="1.3" />
  <text x="715" y="430" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="13.5" font-weight="600" text-anchor="middle" fill="#3a4f93">仍新建 DCP 组 · TP / DCP / 物理卡号三套独立下标</text>
</svg>
