<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 785" width="860" height="785" role="img" aria-label="同一个查询、同一个通道：两块内容按 2∶6 混合。除以总权重 8，把两块的占比变成 ¼ 和 ¾，得到一份输出 25。">
  <title>同一个查询、同一个通道：两块内容按 2∶6 混合。除以总权重 8，把两块的占比变成 ¼ 和 ¾，得到一份输出 25。</title>
  <defs><marker id="context-parallel-merge-ah-ink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="var(--color-ink, #17211f)"/></marker></defs>
  <rect x="25" y="65" width="810" height="155" rx="16" fill="none" stroke="var(--color-line-strong, #b8bcb5)" stroke-width="1.5"/>
  <text x="41" y="53" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="15" font-weight="700" fill="var(--color-ink, #17211f)">① 两块历史，各带来内容与权重</text>
  <rect x="25" y="270" width="810" height="195" rx="16" fill="none" stroke="var(--color-line-strong, #b8bcb5)" stroke-width="1.5"/>
  <text x="41" y="258" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="15" font-weight="700" fill="var(--color-ink, #17211f)">② 先乘权重再相加：得到的 200 还是中间量</text>
  <rect x="25" y="520" width="810" height="205" rx="16" fill="none" stroke="var(--color-line-strong, #b8bcb5)" stroke-width="1.5"/>
  <text x="41" y="508" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="15" font-weight="700" fill="var(--color-ink, #17211f)">③ 除以全部权重：把 8 个权重单位归成一份</text>
  <path d="M430 225 L430 256" fill="none" stroke="var(--color-ink, #17211f)" stroke-width="1.4" marker-end="url(#context-parallel-merge-ah-ink)"/>
  <path d="M430 470 L430 505" fill="none" stroke="var(--color-ink, #17211f)" stroke-width="1.4" marker-end="url(#context-parallel-merge-ah-ink)"/>
  <rect x="70" y="315" width="90" height="56" fill="var(--color-kv, #4c65b6)"/>
  <text x="115" y="347.7" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="13" font-weight="700" fill="var(--color-ink-inverse, #ffffff)" text-anchor="middle">10</text>
  <rect x="160" y="315" width="90" height="56" fill="var(--color-kv, #4c65b6)"/>
  <text x="205" y="347.7" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="13" font-weight="700" fill="var(--color-ink-inverse, #ffffff)" text-anchor="middle">10</text>
  <rect x="250" y="315" width="90" height="56" fill="var(--color-weight, #c78300)"/>
  <text x="295" y="347.7" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="13" font-weight="700" fill="var(--color-ink-inverse, #ffffff)" text-anchor="middle">30</text>
  <rect x="340" y="315" width="90" height="56" fill="var(--color-weight, #c78300)"/>
  <text x="385" y="347.7" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="13" font-weight="700" fill="var(--color-ink-inverse, #ffffff)" text-anchor="middle">30</text>
  <rect x="430" y="315" width="90" height="56" fill="var(--color-weight, #c78300)"/>
  <text x="475" y="347.7" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="13" font-weight="700" fill="var(--color-ink-inverse, #ffffff)" text-anchor="middle">30</text>
  <rect x="520" y="315" width="90" height="56" fill="var(--color-weight, #c78300)"/>
  <text x="565" y="347.7" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="13" font-weight="700" fill="var(--color-ink-inverse, #ffffff)" text-anchor="middle">30</text>
  <rect x="610" y="315" width="90" height="56" fill="var(--color-weight, #c78300)"/>
  <text x="655" y="347.7" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="13" font-weight="700" fill="var(--color-ink-inverse, #ffffff)" text-anchor="middle">30</text>
  <rect x="700" y="315" width="90" height="56" fill="var(--color-weight, #c78300)"/>
  <text x="745" y="347.7" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="13" font-weight="700" fill="var(--color-ink-inverse, #ffffff)" text-anchor="middle">30</text>
  <path d="M160 315v56M250 315v56M340 315v56M430 315v56M520 315v56M610 315v56M700 315v56" stroke="var(--color-ink, #17211f)" stroke-opacity="0.35" stroke-width="1" fill="none"/>
  <rect x="70" y="315" width="720" height="56" fill="none" stroke="var(--color-ink, #17211f)" stroke-width="1.3"/>
  <rect x="55" y="100" width="345" height="70" rx="8" fill="var(--color-kv, #4c65b6)" stroke="var(--color-ink, #17211f)" stroke-width="1.5"/>
  <text x="227.5" y="131" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="14" font-weight="700" fill="var(--color-ink-inverse, #ffffff)" text-anchor="middle">A：局部结果 10</text>
  <text x="227.5" y="150" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="13" font-weight="400" fill="var(--color-ink-inverse, #ffffff)" text-anchor="middle">原始权重合计 2 · 含 4 个历史位置</text>
  <rect x="460" y="100" width="345" height="70" rx="8" fill="var(--color-weight, #c78300)" stroke="var(--color-ink, #17211f)" stroke-width="1.5"/>
  <text x="632.5" y="131" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="14" font-weight="700" fill="var(--color-ink-inverse, #ffffff)" text-anchor="middle">B：局部结果 30</text>
  <text x="632.5" y="150" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="13" font-weight="400" fill="var(--color-ink-inverse, #ffffff)" text-anchor="middle">原始权重合计 6 · 含 4 个历史位置</text>
  <rect x="70" y="570" width="180" height="62" rx="8" fill="var(--color-kv, #4c65b6)" stroke="var(--color-ink, #17211f)" stroke-width="1.5"/>
  <text x="160" y="606" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="14" font-weight="700" fill="var(--color-ink-inverse, #ffffff)" text-anchor="middle">A 占 2/8 = ¼</text>
  <rect x="250" y="570" width="540" height="62" rx="8" fill="var(--color-weight, #c78300)" stroke="var(--color-ink, #17211f)" stroke-width="1.5"/>
  <text x="520" y="606" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="14" font-weight="700" fill="var(--color-ink-inverse, #ffffff)" text-anchor="middle">B 占 6/8 = ¾</text>
  <text x="430" y="29" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="13.5" font-weight="700" fill="var(--color-ink, #17211f)" text-anchor="middle">为什么要除？把按权重累积的内容，变成按占比混合的一份输出</text>
  <text x="430" y="198" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="13.5" font-weight="400" fill="var(--color-ink-muted, #66716d)" text-anchor="middle" font-style="italic">10、30 是只读各自那一块得到的结果；还不能直接相加</text>
  <text x="430" y="300" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="13.5" font-weight="400" fill="var(--color-ink-muted, #66716d)" text-anchor="middle" font-style="italic">每格 = 1 个权重单位（不是一个 token）</text>
  <text x="160" y="397" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="13.5" font-weight="700" fill="#3a4f93" text-anchor="middle">2 × 10 = 20</text>
  <text x="520" y="397" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="13.5" font-weight="700" fill="#936300" text-anchor="middle">6 × 30 = 180</text>
  <text x="430" y="438" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="13.5" font-weight="700" fill="var(--color-ink, #17211f)" text-anchor="middle">加权内容：20 + 180 = 200    总权重：2 + 6 = 8</text>
  <text x="430" y="551" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="13.5" font-weight="400" fill="var(--color-ink-muted, #66716d)" text-anchor="middle" font-style="italic">整条占比带 = 1 = 100%</text>
  <text x="160" y="663" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="13.5" font-weight="400" fill="#3a4f93" text-anchor="middle">¼ × 10 = 2.5</text>
  <text x="520" y="663" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="13.5" font-weight="400" fill="#936300" text-anchor="middle">¾ × 30 = 22.5</text>
  <text x="430" y="703" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="13.5" font-weight="700" fill="var(--color-ink, #17211f)" text-anchor="middle">完整输出：200 ÷ 8 = 2.5 + 22.5 = 25</text>
  <text x="430" y="761" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="13.5" font-weight="400" fill="var(--color-ink-muted, #66716d)" text-anchor="middle" font-style="italic">B 的权重是 A 的 3 倍，所以输出 25 更靠近 B 的 30</text>
</svg>
