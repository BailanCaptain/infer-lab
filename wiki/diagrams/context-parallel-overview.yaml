layout: figure
id: context-parallel-overview
size: [880, 560]
caption: 通用 CP 的连续分片示意：两张卡负责同一序列的不同位置。每卡先计算本地 Q/K/V，在 attention 中取得所需远端信息，输出继续留在负责相应查询的卡上。后文再讨论负载均衡与具体通信算法。
