      - { at: [0, 1], text: '1' }
      - { at: [0, 2], text: '2' }
      - { at: [0, 3], text: '3' }
      - { at: [0, 4], text: '4' }
      - { at: [0, 5], text: '5' }
      - { at: [0, 6], text: '6' }
      - { at: [0, 7], text: '7' }
  - { at: [65, 235], rows: 4, cols: 3, cell: [26, 22], tone: token, rowLabels: ['0', '1', '2', '3'], label: '本卡 Q' }
  - { at: [250, 235], rows: 4, cols: 3, cell: [26, 22], tone: kv, label: '本卡 K/V' }
  - { at: [525, 235], rows: 4, cols: 3, cell: [26, 22], tone: token, rowLabels: ['4', '5', '6', '7'], label: '本卡 Q' }
  - { at: [710, 235], rows: 4, cols: 3, cell: [26, 22], tone: kv, label: '本卡 K/V' }
