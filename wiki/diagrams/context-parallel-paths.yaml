id: context-parallel-paths
caption: >-
  Ascend 上下文并行（PCP / DCP）的三条 attention 计算与张量交换路径：前向准备好局部 Q/K/V 与交错缓存元数据后，PCP 普通非分块 prefill 先跨组收齐本层 K/V 临时缓冲再计算并释放；MLA / 稀疏 SFA 分块 prefill 收齐上下文潜向量块（稀疏时只收 top-k 选中块）后本卡计算；GQA 分块 prefill 与 decode 局部历史路径先按头交换 Q，各卡只读本地历史算出局部 (O, LSE)，再跨卡按对数和指数合并还原全局输出。
