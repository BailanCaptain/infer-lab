texts:
  - { at: [220, 28], text: '卡 0', anchor: middle, strong: true }
  - { at: [650, 28], text: '卡 1', anchor: middle, strong: true }
  - { at: [440, 223], text: '卡 0 把位置 0～3 的头 2、3 发给卡 1', anchor: middle, tone: comm }
  - { at: [440, 248], text: '卡 1 把位置 4～7 的头 0、1 发给卡 0', anchor: middle, tone: comm }
  - { at: [440, 443], text: '各卡完成自己两个头的 attention，再把输出按位置发回', anchor: middle, tone: comm }
  - { at: [440, 468], text: '位置编号与因果掩码保持一致，头数没有增加', anchor: middle, note: true }
  - { at: [440, 662], text: '[4, 4, d] → [8, 2, d] → [4, 4, d]；d 为每个头的通道数', anchor: middle, note: true }
