layout: figure
id: context-parallel-ulysses
size: [880, 680]
caption: Ulysses 的位置/头布局交换。每个格表示“4 个位置 × 1 个头”的数据块，行标签是位置范围，列标签是头编号。实色是本卡持有，虚线是本卡没有；从位置分工换成头分工，attention 后再恢复位置分工。
frames:
  - { at: [20, 70], size: [840, 120], label: '① Q/K/V 投影后：每卡 4 个位置 × 全部 4 头' }
  - { at: [20, 290], size: [840, 120], label: '② All-to-All 后：每卡全部 8 个位置 × 2 头' }
  - { at: [20, 510], size: [840, 120], label: '③ attention 后反向交换：输出恢复位置分片' }
grids:
  - at: [125, 108]
    rows: 2
    cols: 4
    cell: [48, 28]
    tone: token
    rowLabels: ['位置0～3', '位置4～7']
    colLabels: ['头0', '头1', '头2', '头3']
    cells: [{ at: [1, 0], style: ghost }, { at: [1, 1], style: ghost }, { at: [1, 2], style: ghost }, { at: [1, 3], style: ghost }]
  - at: [555, 108]
