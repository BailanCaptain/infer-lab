<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 612" width="900" height="612" role="img" aria-label="两刀都切在序列维上，但切的东西不同：PCP 切这一步要算的 token 并为此加卡，DCP 切写进 KV Cache 的那一份、卡数不变">
  <title>两刀都切在序列维上，但切的东西不同：PCP 切这一步要算的 token 并为此加卡，DCP 切写进 KV Cache 的那一份、卡数不变</title>
  <rect width="900" height="612" fill="var(--color-surface, #fbfaf6)"/>
  <rect x="20" y="26" width="860" height="226" rx="12" fill="var(--color-accent-soft, #fff0e9)"/>
  <rect x="36" y="40" width="312.3" height="26.5" rx="13.3" fill="var(--color-accent, #e85b32)"/><text x="47" y="58.1" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="13.5" font-weight="700" fill="var(--color-ink-inverse, #ffffff)">PCP：加卡，切 prefill 这一步要算的 token</text>
  <text x="38" y="83" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="12.5" font-weight="400" fill="var(--color-ink-muted, #5b6763)">每条请求的 token 数先补齐到 2 × pcp 的整数倍，切成 2 × pcp 段，第 i 段与倒数第 i 段配一对发给同一张卡——头段短尾段长，配成对算量才相等</text>
  <rect x="20" y="272" width="860" height="212" rx="12" fill="var(--color-kv-soft, #e8edff)"/>
  <rect x="36" y="286" width="283.9" height="26.5" rx="13.3" fill="var(--color-kv, #4c65b6)"/><text x="47" y="304.1" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="13.5" font-weight="700" fill="var(--color-ink-inverse, #ffffff)">DCP：不加卡，切写进 KV Cache 的那一份</text>
  <text x="38" y="329" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="12.5" font-weight="400" fill="var(--color-ink-muted, #5b6763)">同一条序列的 token 按 cp_kv_cache_interleave_size 交错落到各个 rank 上，默认值 1 就是 token 级交错，于是谁也没有完整的 KV</text>
  <rect x="20" y="500" width="424" height="82" rx="10" fill="var(--color-accent-soft, #fff0e9)"/>
  <rect x="20" y="500" width="5" height="82" rx="2.5" fill="var(--color-accent, #e85b32)"/>
  <g transform="translate(43.8 530.8) scale(0.85)" fill="none" stroke="var(--color-accent, #e85b32)" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3l9 5-9 5-9-5z M3 13l9 5 9-5"/></g>
  <text x="78" y="538" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="15" font-weight="700" fill="var(--color-ink, #17211f)">凑 KV：PCP 的 prefill</text>
  <text x="78" y="558" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="12.5" font-weight="400" fill="var(--color-ink-muted, #5b6763)">逐层 all-gather KV，用完立刻扔</text>
  <rect x="309.5" y="528.5" width="115.5" height="21.5" rx="10.8" fill="var(--color-surface, #fbfaf6)" stroke="var(--color-accent, #e85b32)" stroke-width="1"/><text x="367.3" y="546" font-family="'JetBrains Mono',ui-monospace,monospace" font-size="12.5" font-weight="400" fill="var(--color-accent, #e85b32)" text-anchor="middle">get_pcp_group</text>
