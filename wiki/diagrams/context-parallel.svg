  <text x="536" y="415" font-family="'JetBrains Mono',ui-monospace,monospace" font-size="12.5" font-weight="400" fill="var(--color-kv, #4c65b6)">_compute_pcp_dcp_slot_mapping</text>
  <text x="60" y="466" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="12.5" font-weight="400" fill="var(--color-ink-muted, #5b6763)">把它设成 block_size 就变成块级交错——前一张卡的这一块写满了，才轮到下一张；PD 分离与 KV 池要求必须这么设</text>
  <text x="20" y="600" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="12.5" font-weight="400" fill="var(--color-ink-muted, #5b6763)">两条路的分水岭在于「有没有把 KV 凑齐过」：凑齐那条省的是时间，不凑那条省的才是显存</text>
