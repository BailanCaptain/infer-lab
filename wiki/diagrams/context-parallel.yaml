    symbols: [_compute_pcp_dcp_slot_mapping, cp_kv_cache_interleave_size]
  - source: vllm-ascend@2c59ff10:vllm_ascend/worker/pcp_utils.py#L663-L688
    symbols: [update_tokens_for_pcp]
  - source: vllm-ascend@2c59ff10:vllm_ascend/attention/context_parallel/common_cp.py#L186-L197
    symbols: [_update_out_and_lse]
  - source: vllm-ascend@2c59ff10:vllm_ascend/attention/context_parallel/attention_cp.py#L830-L839
