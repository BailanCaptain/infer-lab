<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 364" width="900" height="364" role="img" aria-label="昇腾 ACLGraph 单步档位补齐与 vllm serve 默认 2048 批预算回退路径图" font-family="var(--font-sans)">
  <title>昇腾连续批处理两项关键工程边界：左侧展示 ACLGraph 回放层把一维紧致批次（19 tok）向上补齐到已捕获图档位（24 tok）并用 slot_mapping=-1 屏蔽尾部写入，不破坏按步动态退场；右侧展示参数解析期 torch_npu 未初始化导致 get_device_total_memory 抛 NotImplementedError，使在线 vllm serve 默认批预算落回 2048。</title>
  <desc>关联源码符号：_pad_query_start_loc_for_fia, query_start_loc, num_tokens_padded, num_reqs_padded, get_device_total_memory, NotImplementedError</desc>
  <defs>
    <marker id="cb-ap-t" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto">
      <path d="M 0 1.5 L 8.5 5 L 0 8.5 z" fill="#087f73"/>
    </marker>
    <marker id="cb-ap-a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto">
      <path d="M 0 1.5 L 8.5 5 L 0 8.5 z" fill="#c78300"/>
    </marker>
  </defs>

  <line x1="464" y1="14" x2="464" y2="352" stroke="#b8bcb5" stroke-width="1.4" stroke-dasharray="6 4"/>

  <!-- LEFT: ACLGraph Padding -->
  <text x="14" y="28" font-size="16" font-weight="700" fill="#065f56">① ACLGraph 档位补齐 ≠ 打回静态批处理</text>
  <text x="14" y="52" font-size="13.5" fill="#66716d">补齐仅发生在单步算子回放层，请求仍按步动态进出</text>

  <!-- Row 1: Ragged 19 tokens -->
  <text x="14" y="82" font-size="13.5" font-weight="700" fill="#17211f">调度器输出一维紧致批（total = 19 tok）：</text>
  <rect x="14" y="92" width="54" height="36" rx="5" fill="#ddf4ef" stroke="#087f73" stroke-width="1.3"/>
  <text x="41" y="115" text-anchor="middle" font-size="13.5" font-weight="700" fill="#065f56">R1:1</text>
  <rect x="72" y="92" width="54" height="36" rx="5" fill="#ddf4ef" stroke="#087f73" stroke-width="1.3"/>
  <text x="99" y="115" text-anchor="middle" font-size="13.5" font-weight="700" fill="#065f56">R2:1</text>
  <rect x="130" y="92" width="214" height="36" rx="5" fill="#e8edff" stroke="#4c65b6" stroke-width="1.3"/>
  <text x="237" y="115" text-anchor="middle" font-size="13.5" font-weight="700" fill="#3a4f93">R3 提示词块 [17 tok]</text>

  <path d="M 180 128 L 180 162" fill="none" stroke="#087f73" stroke-width="2" marker-end="url(#cb-ap-t)"/>
  <text x="192" y="150" font-family="var(--font-mono)" font-size="13" font-weight="700" fill="#065f56">num_tokens_padded → 24 档</text>

  <!-- Row 2: Padded 24 tokens -->
  <text x="14" y="184" font-size="13.5" font-weight="700" fill="#17211f">ACLGraph 回放缓冲（补 5 格哑槽，防污染 KV）：</text>
  <rect x="14" y="194" width="54" height="36" rx="5" fill="#ddf4ef" stroke="#087f73" stroke-width="1.3"/>
  <text x="41" y="217" text-anchor="middle" font-size="13.5" font-weight="700" fill="#065f56">R1:1</text>
  <rect x="72" y="194" width="54" height="36" rx="5" fill="#ddf4ef" stroke="#087f73" stroke-width="1.3"/>
  <text x="99" y="217" text-anchor="middle" font-size="13.5" font-weight="700" fill="#065f56">R2:1</text>
  <rect x="130" y="194" width="214" height="36" rx="5" fill="#e8edff" stroke="#4c65b6" stroke-width="1.3"/>
  <text x="237" y="217" text-anchor="middle" font-size="13.5" font-weight="700" fill="#3a4f93">R3 [17 tok]</text>
  <rect x="348" y="194" width="98" height="36" rx="5" fill="#ece9df" stroke="#b54237" stroke-width="1.4" stroke-dasharray="4 3"/>
  <text x="397" y="217" text-anchor="middle" font-family="var(--font-mono)" font-size="13" font-weight="700" fill="#8f3229">PAD ×5</text>

  <rect x="14" y="248" width="4" height="96" rx="2" fill="#087f73"/>
  <text x="28" y="270" font-size="14" font-weight="700" fill="#17211f">尾部哑槽 <tspan font-family="var(--font-mono)" fill="#8f3229">slot_mapping = -1</tspan>（跳过写 KV）</text>
  <text x="28" y="298" font-size="13.5" fill="#4d5652">• 纯 Decode 图同步补齐 <tspan font-family="var(--font-mono)">num_reqs_padded</tspan></text>
  <text x="28" y="324" font-size="13.5" fill="#4d5652">• 步末 R1 撞 EOS 仍当场释块，下步 waiting 照常补位</text>

  <!-- RIGHT: 2048 default fallback cascade -->
  <text x="484" y="28" font-size="16" font-weight="700" fill="#936300">② 为何 64 GiB 昇腾在线默认落回 2048？</text>
  <text x="484" y="52" font-size="13.5" fill="#66716d">命令行解析早于 Worker 进程初始化 torch_npu</text>

  <rect x="484" y="72" width="402" height="58" rx="7" fill="#fff4cf" stroke="#c78300" stroke-width="1.4"/>
  <text x="498" y="96" font-family="var(--font-mono)" font-size="13.5" font-weight="700" fill="#936300">1. EngineArgs.get_batch_defaults()</text>
  <text x="498" y="118" font-size="13.5" fill="#4d5652">查询设备总显存分档（≥ 70 GiB 在线本应给 8192）</text>

  <path d="M 685 130 L 685 154" fill="none" stroke="#c78300" stroke-width="2" marker-end="url(#cb-ap-a)"/>

  <rect x="484" y="160" width="402" height="62" rx="7" fill="#fff0e9" stroke="#b54237" stroke-width="1.4"/>
  <text x="498" y="184" font-family="var(--font-mono)" font-size="13.5" font-weight="700" fill="#8f3229">2. NPUPlatform.get_device_total_memory()</text>
  <text x="498" y="208" font-size="13.5" fill="#17211f">避免提前触发 NPU 运行时 → 抛 <tspan font-family="var(--font-mono)" font-weight="700" fill="#8f3229">NotImplementedError</tspan></text>

  <path d="M 685 222 L 685 246" fill="none" stroke="#c78300" stroke-width="2" marker-end="url(#cb-ap-a)"/>

  <rect x="484" y="252" width="402" height="92" rx="7" fill="#e8edff" stroke="#4c65b6" stroke-width="1.4"/>
  <text x="498" y="276" font-size="14.5" font-weight="700" fill="#3a4f93">3. 回落 device_memory = 0 默认档</text>
  <text x="498" y="302" font-size="13.5" fill="#17211f">• 在线 <tspan font-family="var(--font-mono)" font-weight="700">vllm serve</tspan>：<tspan font-weight="700" fill="#3a4f93">2048</tspan> tok / <tspan font-weight="700">256</tspan> reqs</text>
  <text x="498" y="328" font-size="13.5" fill="#4d5652">• 离线 LLM：8192 / 256；throughput 模式翻倍</text>
</svg>
