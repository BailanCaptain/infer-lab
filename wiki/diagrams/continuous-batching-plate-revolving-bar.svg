<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 617" width="900" height="617" role="img" aria-label="连续批处理趣味微缩场景图：左侧静态圆桌围栏锁死已吃完短客陪等慢客，右侧回转吧台客人吃完即离座并立刻补入新客" font-family="var(--font-sans)">
  <title>同桌等齐翻台 vs 回转吧台随走随补：直观对比请求级静态批处理与单步迭代级连续批处理的座位周转效率。</title>
  <desc>关联源码符号：schedule, preempted_reqs, num_computed_tokens, RequestStatus, WAITING, RUNNING, PREEMPTED, SchedulerConfig, max_num_batched_tokens, max_num_seqs</desc>
  <image href="./wiki-illustrations/continuous-batching-revolving-bar-scene.webp" x="40" y="128" width="820" height="391" preserveAspectRatio="xMidYMid meet"/>
  <line x1="179" y1="112" x2="179" y2="265" stroke="#c95b3c" stroke-width="1.6"/>
  <circle cx="179" cy="265" r="5.5" fill="#ffffff" stroke="#c95b3c" stroke-width="2"/>
  <circle cx="179" cy="265" r="2.5" fill="#c95b3c"/>
  <line x1="294" y1="112" x2="294" y2="277" stroke="#c78300" stroke-width="1.6"/>
  <circle cx="294" cy="277" r="5.5" fill="#ffffff" stroke="#c78300" stroke-width="2"/>
  <circle cx="294" cy="277" r="2.5" fill="#c78300"/>
  <line x1="680" y1="112" x2="680" y2="253" stroke="#087f73" stroke-width="1.6"/>
  <circle cx="680" cy="253" r="5.5" fill="#ffffff" stroke="#087f73" stroke-width="2"/>
  <circle cx="680" cy="253" r="2.5" fill="#087f73"/>
  <line x1="335" y1="531" x2="335" y2="433" stroke="#c95b3c" stroke-width="1.6"/>
  <circle cx="335" cy="433" r="5.5" fill="#ffffff" stroke="#c95b3c" stroke-width="2"/>
  <circle cx="335" cy="433" r="2.5" fill="#c95b3c"/>
  <line x1="598" y1="531" x2="598" y2="378" stroke="#087f73" stroke-width="1.6"/>
  <circle cx="598" cy="378" r="5.5" fill="#ffffff" stroke="#087f73" stroke-width="2"/>
  <circle cx="598" cy="378" r="2.5" fill="#087f73"/>
  <g id="callout-1">
    <circle cx="24" cy="28" r="12" fill="#c95b3c"/>
    <text x="24" y="32.5" text-anchor="middle" font-size="12.5" font-weight="700" fill="#ffffff">1</text>
    <text x="44" y="33" font-size="14.5" font-weight="700" fill="#17211f">静态整批陪坐（空转填充）</text>
    <text x="44" y="57" font-size="13" fill="#4d5652">短请求遇到结束符仍被绑在同一批</text>
    <text x="44" y="79" font-size="13" fill="#4d5652">空盘食客每步陪跑无效填零计算</text>
    <text x="44" y="101" font-size="13" fill="#66716d">KV 显存与并发席位被白白锁死</text>
  </g>
  <g id="callout-2">
    <circle cx="318" cy="28" r="12" fill="#c78300"/>
    <text x="318" y="32.5" text-anchor="middle" font-size="12.5" font-weight="700" fill="#ffffff">2</text>
    <text x="338" y="33" font-size="14.5" font-weight="700" fill="#17211f">最慢长请求拖死整桌翻台</text>
    <text x="338" y="57" font-size="13" fill="#4d5652">整桌耗时由输出最长的那位决定</text>
    <text x="338" y="79" font-size="13" fill="#4d5652">同批全员退场前无法开启下一批</text>
    <text x="338" y="101" font-size="13" fill="#66716d">尾时延与显存占用双双恶化</text>
  </g>
  <g id="callout-3">
    <circle cx="612" cy="28" r="12" fill="#087f73"/>
    <text x="612" y="32.5" text-anchor="middle" font-size="12.5" font-weight="700" fill="#ffffff">3</text>
    <text x="632" y="33" font-size="14.5" font-weight="700" fill="#17211f">单步迭代合批（在途不中断）</text>
    <text x="632" y="57" font-size="13" fill="#4d5652">每次前向只推进各在途请求本步位置</text>
    <text x="632" y="79" font-size="13" fill="#4d5652">新老请求共享同一轮权重矩阵读取</text>
    <text x="632" y="101" font-size="13" fill="#66716d">预算与块池允许时保持高席位利用率</text>
  </g>
  <g id="callout-4">
    <circle cx="24" cy="549" r="12" fill="#c95b3c"/>
    <text x="24" y="553.5" text-anchor="middle" font-size="12.5" font-weight="700" fill="#ffffff">4</text>
    <text x="44" y="554" font-size="14.5" font-weight="700" fill="#17211f">门外新请求干等（TTFT 飙升）</text>
    <text x="44" y="578" font-size="13" fill="#4d5652">哪怕桌内已有空盘也不放新客进门</text>
    <text x="44" y="601" font-size="13" fill="#4d5652">排在后面的短请求被迫承受整桌等待</text>
  </g>
  <g id="callout-5">
    <circle cx="468" cy="549" r="12" fill="#087f73"/>
    <text x="468" y="553.5" text-anchor="middle" font-size="12.5" font-weight="700" fill="#ffffff">5</text>
    <text x="488" y="554" font-size="14.5" font-weight="700" fill="#17211f">吃完即退、空位秒补（迭代级调度）</text>
    <text x="488" y="578" font-size="13" fill="#4d5652">每步末尾即时回收已完成请求的物理块</text>
    <text x="488" y="601" font-size="13" fill="#4d5652">下一步当场从 WAITING 队列补入新客</text>
  </g>
</svg>
