<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 412" width="900" height="412" role="img" aria-label="示意：waiting 队列与 running 列表在 t=1、t=2、t=3 三步迭代中的流转、混合拼接与完结退场。" font-family="var(--font-sans)">
  <title>示意：vLLM V1 Scheduler 两队列（waiting 与 running）在三步迭代中的真实流转——统一按 num_tokens_with_spec - num_computed_tokens 计算差额，每步先排 running 再用余量接纳 waiting，完结当步即从 running 移除。</title>
  <desc>关联源码符号：schedule, num_computed_tokens, num_tokens_with_spec, token_budget, waiting, running, max_num_running_reqs, remove_all, stopped_running_reqs</desc>
  <defs>
    <marker id="tq-teal" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#087f73"/>
    </marker>
    <marker id="tq-indigo" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#4c65b6"/>
    </marker>
  </defs>

  <text x="14" y="28" font-size="16" font-weight="700" fill="#17211f">两队列迭代追踪（教学预算 token_budget = 8；R1 提示3/生2，R2 提示2/生3，R3 提示4/生2）</text>
  <line x1="14" y1="42" x2="886" y2="42" stroke="#b8bcb5" stroke-width="1.4"/>

  <text x="82" y="68" text-anchor="middle" font-size="14.5" font-weight="700" fill="#936300">waiting 队列（待准入）</text>
  <text x="318" y="68" text-anchor="middle" font-size="14.5" font-weight="700" fill="#065f56">running 列表（优先续跑）</text>
  <text x="688" y="68" text-anchor="middle" font-size="14.5" font-weight="700" fill="#3a4f93">本步一维拼接批次与步末状态更新</text>

  <!-- Step t=1 -->
  <text x="14" y="114" font-family="var(--font-mono)" font-size="14.5" font-weight="700" fill="#17211f">t=1</text>
  <rect x="54" y="86" width="128" height="68" rx="6" fill="#fff4cf" stroke="#c78300" stroke-width="1.3"/>
  <text x="118" y="112" text-anchor="middle" font-size="13.5" font-weight="700" fill="#936300">R1(0→3), R2(0→2)</text>
  <text x="118" y="138" text-anchor="middle" font-size="13.5" fill="#66716d">步中 R3(提示4) 到达</text>

  <line x1="184" y1="120" x2="212" y2="120" stroke="#087f73" stroke-width="1.6" marker-end="url(#tq-teal)"/>

  <rect x="218" y="86" width="200" height="68" rx="6" fill="#ddf4ef" stroke="#087f73" stroke-width="1.4"/>
  <text x="318" y="112" text-anchor="middle" font-size="14" font-weight="700" fill="#065f56">准入 R1(+3) + R2(+2)</text>
  <text x="318" y="138" text-anchor="middle" font-family="var(--font-mono)" font-size="13.5" fill="#4d5652">budget: 8 - 5 = 3</text>

  <line x1="420" y1="120" x2="452" y2="120" stroke="#4c65b6" stroke-width="1.6" marker-end="url(#tq-indigo)"/>

  <rect x="458" y="86" width="428" height="68" rx="6" fill="#fbfaf6" stroke="#b8bcb5" stroke-width="1.3"/>
  <rect x="470" y="96" width="108" height="26" rx="4" fill="#fff4cf" stroke="#c78300" stroke-width="1.2"/>
  <text x="524" y="114" text-anchor="middle" font-size="13.5" font-weight="700" fill="#936300">R1 提示 [3]</text>
  <rect x="584" y="96" width="92" height="26" rx="4" fill="#fff4cf" stroke="#c78300" stroke-width="1.2"/>
  <text x="630" y="114" text-anchor="middle" font-size="13.5" font-weight="700" fill="#936300">R2 提示 [2]</text>
  <text x="688" y="114" font-family="var(--font-mono)" font-size="13.5" font-weight="700" fill="#3a4f93">合拼 [5]</text>
  <text x="470" y="144" font-size="13.5" fill="#4d5652">步末：R1、R2 各得第 1 个输出词（进度变为 3/4 与 2/3）</text>

  <!-- Step t=2 -->
  <text x="14" y="204" font-family="var(--font-mono)" font-size="14.5" font-weight="700" fill="#17211f">t=2</text>
  <rect x="54" y="172" width="128" height="72" rx="6" fill="#fff4cf" stroke="#c78300" stroke-width="1.3"/>
  <text x="118" y="200" text-anchor="middle" font-size="14" font-weight="700" fill="#936300">R3(0→4) 出队</text>
  <text x="118" y="228" text-anchor="middle" font-size="13.5" fill="#66716d">用余量 6 接纳</text>

  <line x1="184" y1="208" x2="212" y2="208" stroke="#087f73" stroke-width="1.6" marker-end="url(#tq-teal)"/>

  <rect x="218" y="172" width="200" height="72" rx="6" fill="#ddf4ef" stroke="#087f73" stroke-width="1.5"/>
  <text x="318" y="198" text-anchor="middle" font-size="14" font-weight="700" fill="#065f56">① 先续 R1(+1)、R2(+1)</text>
  <text x="318" y="226" text-anchor="middle" font-size="13.5" font-weight="700" fill="#3a4f93">② 再补 R3(+4) → 剩 2</text>

  <line x1="420" y1="208" x2="452" y2="208" stroke="#4c65b6" stroke-width="1.6" marker-end="url(#tq-indigo)"/>

  <rect x="458" y="172" width="428" height="72" rx="6" fill="#fbfaf6" stroke="#b8bcb5" stroke-width="1.3"/>
  <rect x="470" y="182" width="66" height="26" rx="4" fill="#ddf4ef" stroke="#087f73" stroke-width="1.2"/>
  <text x="503" y="200" text-anchor="middle" font-size="13.5" font-weight="700" fill="#065f56">R1 [1]</text>
  <rect x="542" y="182" width="66" height="26" rx="4" fill="#ddf4ef" stroke="#087f73" stroke-width="1.2"/>
  <text x="575" y="200" text-anchor="middle" font-size="13.5" font-weight="700" fill="#065f56">R2 [1]</text>
  <rect x="614" y="182" width="122" height="26" rx="4" fill="#e8edff" stroke="#4c65b6" stroke-width="1.3"/>
  <text x="675" y="200" text-anchor="middle" font-size="13.5" font-weight="700" fill="#3a4f93">R3 提示 [4]</text>
  <text x="746" y="200" font-family="var(--font-mono)" font-size="13.5" font-weight="700" fill="#3a4f93">混跑 [6]</text>
  <text x="470" y="232" font-size="13.5" font-weight="700" fill="#8f3229">步末：R1 满 2 词当场 remove_all 退场释块；R3 得首词</text>

  <!-- Step t=3 -->
  <text x="14" y="294" font-family="var(--font-mono)" font-size="14.5" font-weight="700" fill="#17211f">t=3</text>
  <rect x="54" y="262" width="128" height="66" rx="6" fill="#f5f2ea" stroke="#d8d8cf" stroke-width="1.2"/>
  <text x="118" y="300" text-anchor="middle" font-size="13.5" fill="#66716d">队列为空 []</text>

  <rect x="218" y="262" width="200" height="66" rx="6" fill="#ddf4ef" stroke="#087f73" stroke-width="1.4"/>
  <text x="318" y="290" text-anchor="middle" font-size="14" font-weight="700" fill="#065f56">续跑 R2(+1) + R3(+1)</text>
  <text x="318" y="316" text-anchor="middle" font-size="13.5" fill="#4d5652">R1 空出的槽位已归还</text>

  <line x1="420" y1="295" x2="452" y2="295" stroke="#4c65b6" stroke-width="1.6" marker-end="url(#tq-indigo)"/>

  <rect x="458" y="262" width="428" height="66" rx="6" fill="#fbfaf6" stroke="#b8bcb5" stroke-width="1.3"/>
  <rect x="470" y="272" width="84" height="26" rx="4" fill="#ddf4ef" stroke="#087f73" stroke-width="1.2"/>
  <text x="512" y="290" text-anchor="middle" font-size="13.5" font-weight="700" fill="#065f56">R2 末词 [1]</text>
  <rect x="560" y="272" width="84" height="26" rx="4" fill="#ddf4ef" stroke="#087f73" stroke-width="1.2"/>
  <text x="602" y="290" text-anchor="middle" font-size="13.5" font-weight="700" fill="#065f56">R3 末词 [1]</text>
  <text x="656" y="290" font-family="var(--font-mono)" font-size="13.5" font-weight="700" fill="#065f56">纯 Decode [2]</text>
  <text x="470" y="318" font-size="13.5" fill="#4d5652">步末：R2(满3词)、R3(满2词) 同批命中停止条件退场</text>

  <!-- Unified formula callout -->
  <rect x="14" y="346" width="4" height="52" rx="2" fill="#4c65b6"/>
  <text x="28" y="366" font-size="14.5" font-weight="700" fill="#17211f">V1 统一进度公式：本步待补位置数 = num_tokens_with_spec - num_computed_tokens</text>
  <text x="28" y="392" font-size="13.5" fill="#4d5652">调度器内部无「Prefill 轮 / Decode 轮」切换开关；running 先拿名额保生成流畅，waiting 吃剩余预算随到随拼。</text>
</svg>
