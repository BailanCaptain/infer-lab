<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 500" width="900" height="500" role="img" aria-label="vllm serve 四大核心旋钮与单卡 64 GiB HBM 显存比例条咬合对照图" font-family="var(--font-sans)">
  <title>vllm serve 四大核心旋钮与单卡 HBM 水位、单步 Token 预算的咬合关系</title>
  <desc>Proportional 64 GiB Qwen3-8B HBM comparison between max_num_batched_tokens=2048 (39.0 GiB KV) and 16384 (34.5 GiB KV), plus directional linkage of all four CLI knobs</desc>
  <defs>
    <marker id="ck-amber" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto">
      <path d="M 0 1.5 L 8.5 5 L 0 8.5 z" fill="#c78300"/>
    </marker>
    <marker id="ck-red" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto">
      <path d="M 0 1.5 L 8.5 5 L 0 8.5 z" fill="#b54237"/>
    </marker>
    <marker id="ck-teal" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto">
      <path d="M 0 1.5 L 8.5 5 L 0 8.5 z" fill="#087f73"/>
    </marker>
  </defs>

  <text x="16" y="26" font-size="16" font-weight="700" fill="#17211f">单卡 64 GiB HBM 真实比例条（Qwen3-8B 示意）：批预算怎样反噬 KV 池、水位怎样压薄录图余量</text>

  <!-- Scale header (x=136..872, 736px = 64 GiB -> 11.5 px/GiB) -->
  <!-- Budget line u=0.92 -> 58.88 GiB = 677.1 px -> x = 136 + 677 = 813 -->
  <line x1="136" y1="54" x2="872" y2="54" stroke="#b8bcb5" stroke-width="1.2"/>
  <g font-family="var(--font-mono)" font-size="13.5" fill="#66716d" text-anchor="middle">
    <text x="136" y="47">0</text>
    <text x="326" y="47">16.5 GiB</text>
    <text x="580" y="47">KV Cache 弹性池</text>
    <text x="808" y="47" font-weight="700" fill="#3a4f93">58.88 (u=0.92)</text>
  </g>
  <line x1="813" y1="56" x2="813" y2="232" stroke="#4c65b6" stroke-width="1.6" stroke-dasharray="5 3"/>

  <!-- Bar A: B_tokens = 2048 (default) -->
  <text x="16" y="88" font-size="14" font-weight="700" fill="#065f56">默认 B=2048</text>
  <text x="16" y="109" font-size="13.5" fill="#4d5652">KV = 39.0 GiB</text>

  <!-- Weights 16.5 GiB = 190px (136..326) -->
  <rect x="136" y="68" width="190" height="48" rx="5" fill="#fff4cf" stroke="#c78300" stroke-width="1.4"/>
  <text x="231" y="97" text-anchor="middle" font-size="13.5" font-weight="700" fill="#936300">权重 16.5 GiB</text>

  <!-- Act 1.88 GiB = 22px (326..348) -->
  <rect x="326" y="68" width="22" height="48" rx="3" fill="#faeab8" stroke="#c78300" stroke-width="1.4"/>
  <!-- Non-torch 1.5 GiB = 17px (348..365) -->
  <rect x="348" y="68" width="17" height="48" rx="3" fill="#f7e7f2" stroke="#9a4b86" stroke-width="1.4"/>
  <!-- KV 39.0 GiB = 448px (365..813) -->
  <rect x="365" y="68" width="448" height="48" rx="5" fill="#ddf4ef" stroke="#087f73" stroke-width="1.6"/>
  <text x="589" y="97" text-anchor="middle" font-size="14.5" font-weight="700" fill="#065f56">可用 KV 池 = 39.0 GiB（切块供并发与长文）</text>

  <!-- Outside budget 5.12 GiB = 59px (813..872) -->
  <rect x="815" y="68" width="57" height="48" rx="5" fill="#fff0e9" stroke="#b54237" stroke-width="1.4" stroke-dasharray="4 3"/>
  <text x="843" y="90" text-anchor="middle" font-size="13.5" font-weight="700" fill="#8f3229">5.12</text>
  <text x="843" y="109" text-anchor="middle" font-size="13.5" fill="#b54237">录图</text>

  <!-- Bar B: B_tokens = 16384 (large batch) -->
  <text x="16" y="162" font-size="14" font-weight="700" fill="#936300">拉大 B=16384</text>
  <text x="16" y="183" font-size="13.5" fill="#8f3229">KV 缩至 34.5</text>

  <!-- Weights 16.5 GiB = 190px (136..326) -->
  <rect x="136" y="142" width="190" height="48" rx="5" fill="#fff4cf" stroke="#c78300" stroke-width="1.4"/>
  <text x="231" y="171" text-anchor="middle" font-size="13.5" font-weight="700" fill="#936300">权重 16.5 GiB</text>

  <!-- Act 6.38 GiB = 73px (326..399) -->
  <rect x="326" y="142" width="73" height="48" rx="4" fill="#faeab8" stroke="#b54237" stroke-width="1.6"/>
  <text x="362" y="171" text-anchor="middle" font-size="13.5" font-weight="700" fill="#8f3229">6.38</text>
  <!-- Non-torch 1.5 GiB = 17px (399..416) -->
  <rect x="399" y="142" width="17" height="48" rx="3" fill="#f7e7f2" stroke="#9a4b86" stroke-width="1.4"/>
  <!-- KV 34.5 GiB = 397px (416..813) -->
  <rect x="416" y="142" width="397" height="48" rx="5" fill="#ddf4ef" stroke="#087f73" stroke-width="1.6"/>
  <text x="614" y="171" text-anchor="middle" font-size="14.5" font-weight="700" fill="#065f56">可用 KV 池 = 34.5 GiB（−4.5 GiB）</text>

  <!-- Outside budget 5.12 GiB (815..872) -->
  <rect x="815" y="142" width="57" height="48" rx="5" fill="#fff0e9" stroke="#b54237" stroke-width="1.4" stroke-dasharray="4 3"/>
  <text x="843" y="164" text-anchor="middle" font-size="13.5" font-weight="700" fill="#8f3229">5.12</text>
  <text x="843" y="183" text-anchor="middle" font-size="13.5" fill="#b54237">1−u</text>

  <!-- Legend / Delta annotation between & below bars -->
  <line x1="365" y1="122" x2="414" y2="138" stroke="#b54237" stroke-width="1.8" marker-end="url(#ck-red)"/>
  <text x="418" y="133" font-size="13.5" font-weight="700" fill="#8f3229">试跑激活 1.88 → 6.38 GiB，等量挤走 4.5 GiB KV</text>

  <text x="16" y="214" font-size="12.5" fill="#4d5652">图例：琥珀深色 = <tspan font-family="var(--font-mono)">profile_run</tspan> 激活峰值 · 梅紫 = 非 Torch 增量（1.5 GiB HCCL/CANN） · 红虚框 = 预算外 <tspan font-family="var(--font-mono)">capture_model</tspan> 余量</text>

  <line x1="16" y1="236" x2="884" y2="236" stroke="#b8bcb5" stroke-width="1.3" stroke-dasharray="6 4"/>

  <!-- Bottom: 4 Knobs Coupling Map -->
  <text x="16" y="264" font-size="15.5" font-weight="700" fill="#17211f">四大旋钮分别拧动哪条边界（单点猛拉都会反噬相邻资源）</text>

  <!-- Knob 1 -->
  <rect x="16" y="280" width="424" height="96" rx="8" fill="#e8edff" stroke="#4c65b6" stroke-width="1.5"/>
  <text x="30" y="306" font-family="var(--font-mono)" font-size="14.5" font-weight="700" fill="#3a4f93">--gpu-memory-utilization（默认 0.92）</text>
  <text x="30" y="332" font-size="13.5" fill="#17211f">右移虚线闸门：增厚 KV 池，但压薄右侧 <tspan font-family="var(--font-mono)">1−u</tspan> 录图区</text>
  <text x="30" y="357" font-size="13.5" font-weight="700" fill="#8f3229">拉到 0.96+ 易在切完 KV 后的 ACL Graph 录图阶段 OOM</text>

  <!-- Knob 2 -->
  <rect x="460" y="280" width="424" height="96" rx="8" fill="#ddf4ef" stroke="#087f73" stroke-width="1.5"/>
  <text x="474" y="306" font-family="var(--font-mono)" font-size="14.5" font-weight="700" fill="#065f56">--max-model-len（默认取 config.json）</text>
  <text x="474" y="332" font-size="13.5" fill="#17211f">规定单条满长序列最少要吃的 KV 块数（外加 1 个永久空块）</text>
  <text x="474" y="357" font-size="13.5" font-weight="700" fill="#065f56">启动校验装不下 1 条即退；按业务截短是救启动报错首选</text>

  <!-- Knob 3 -->
  <rect x="16" y="390" width="424" height="96" rx="8" fill="#f7e7f2" stroke="#9a4b86" stroke-width="1.5"/>
  <text x="30" y="416" font-family="var(--font-mono)" font-size="14.5" font-weight="700" fill="#7a3a6a">--max-num-seqs（昇腾在线默认 256）</text>
  <text x="30" y="442" font-size="13.5" fill="#17211f">按每 DP 副本限制同批并发条数、采样张量与默认录图档位</text>
  <text x="30" y="467" font-size="13.5" font-weight="700" fill="#7a3a6a">每条在跑 Decode 先扣 1（投机 1+K）token，挤占 Prefill</text>

  <!-- Knob 4 -->
  <rect x="460" y="390" width="424" height="96" rx="8" fill="#fff4cf" stroke="#c78300" stroke-width="1.5"/>
  <text x="474" y="416" font-family="var(--font-mono)" font-size="14.5" font-weight="700" fill="#936300">--max-num-batched-tokens（在线默认 2048）</text>
  <text x="474" y="442" font-size="13.5" fill="#17211f">决定单步总 token 上限与 <tspan font-family="var(--font-mono)">profile_run</tspan> 假输入宽度</text>
  <text x="474" y="467" font-size="13.5" font-weight="700" fill="#936300">调大降 TTFT 但推高激活峰值、反噬 KV（见上方对比条）</text>

  <line x1="440" y1="438" x2="458" y2="438" stroke="#c78300" stroke-width="1.8" marker-end="url(#ck-amber)"/>
</svg>
