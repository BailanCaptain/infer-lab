<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 558" width="900" height="558" role="img" aria-label="vllm serve 参数求值三阶段与 64 GiB 显存预算出口及四大调参源码真相" font-family="var(--font-sans)">
  <title>vllm serve 参数三阶段求值与 64 GiB 预算出口（0.92 vs 0.90）及 v0.30.0 源码真相</title>
  <desc>上半区展示参数默认值、用户显式值与昇腾平台覆写三阶段，并用 64 GiB 比例尺对比默认 0.92（58.88 GiB）与显式 0.90（57.60 GiB）的预算出口与录图余量；下半区汇总默认批预算分档（常规在线 &lt;70 GiB / 含 A100 / 未初始化 2048、已初始化 128 GiB 非 A100 8192、&gt;=160 GiB 16384、批式 DP MoE 256）、PIECEWISE 清空图融合与 HCCL 变量 unknown 判据。</desc>
  <defs>
    <marker id="cc-arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 1 1.5 L 8.5 5 L 1 8.5 z" fill="#4c65b6"/>
    </marker>
  </defs>

  <!-- Section 1: 3-Stage Parameter Resolution & 64 GiB Budget Scale -->
  <text x="16" y="28" font-size="16" font-weight="700" fill="#17211f">1. 参数求值三阶段（默认值 → 用户显式 → 平台覆写）与 64 GiB 预算出口对比</text>

  <rect x="14" y="42" width="872" height="226" rx="10" fill="#fbfaf6" stroke="#d8d8cf" stroke-width="1.3"/>

  <!-- 3-Stage Chain -->
  <rect x="26" y="54" width="264" height="82" rx="8" fill="#e8edff" stroke="#4c65b6" stroke-width="1.2"/>
  <text x="158" y="75" text-anchor="middle" font-size="13" font-weight="700" fill="#3a4f93">① 参数默认值（代码定义）</text>
  <text x="158" y="97" text-anchor="middle" font-family="var(--font-mono)" font-size="12" fill="#17211f">gpu_memory_utilization = 0.92</text>
  <text x="158" y="118" text-anchor="middle" font-size="12" fill="#4d5652">常规在线 2048 ｜ 批式 DP MoE 256</text>

  <line x1="292" y1="95" x2="314" y2="95" stroke="#4c65b6" stroke-width="1.8" marker-end="url(#cc-arr)"/>

  <rect x="318" y="54" width="264" height="82" rx="8" fill="#fff4cf" stroke="#c78300" stroke-width="1.2"/>
  <text x="450" y="75" text-anchor="middle" font-size="13" font-weight="700" fill="#936300">② 用户显式值（CLI &gt; YAML）</text>
  <text x="450" y="97" text-anchor="middle" font-family="var(--font-mono)" font-size="12" fill="#17211f">--gpu-memory-utilization 0.90</text>
  <text x="450" y="118" text-anchor="middle" font-family="var(--font-mono)" font-size="12" fill="#4d5652">--max-num-batched-tokens 8192</text>

  <line x1="584" y1="95" x2="606" y2="95" stroke="#4c65b6" stroke-width="1.8" marker-end="url(#cc-arr)"/>

  <rect x="610" y="54" width="264" height="82" rx="8" fill="#f7e7f2" stroke="#9a4b86" stroke-width="1.2"/>
  <text x="742" y="75" text-anchor="middle" font-size="13" font-weight="700" fill="#7a3a6a">③ 平台覆写（_setup_compile）</text>
  <text x="742" y="97" text-anchor="middle" font-size="12" fill="#17211f">命中分段编译时静默改写编译配置</text>
  <text x="742" y="118" text-anchor="middle" font-size="12" font-weight="700" fill="#8f3229">super_kernel 等三项被刷回 False</text>

  <line x1="26" y1="148" x2="874" y2="148" stroke="#d8d8cf" stroke-width="1.1"/>

  <!-- Proportional 64 GiB Memory Rulers (height=18) -->
  <text x="26" y="177" font-size="12.5" font-weight="700" fill="#3a4f93">默认 0.92</text>
  <rect x="108" y="163" width="405" height="18" rx="4" fill="#dce4fc" stroke="#4c65b6" stroke-width="1.2"/>
  <rect x="513" y="163" width="35" height="18" rx="3" fill="#fff0e9" stroke="#b54237" stroke-width="1.1" stroke-dasharray="3 2"/>
  <text x="562" y="177" font-size="12.5" font-weight="700" fill="#3a4f93">0.92 → 58.88 GiB 预算内  |  余 5.12 GiB 预算外</text>

  <text x="26" y="213" font-size="12.5" font-weight="700" fill="#065f56">显式 0.90</text>
  <rect x="108" y="199" width="396" height="18" rx="4" fill="#b8efe4" stroke="#087f73" stroke-width="1.2"/>
  <rect x="504" y="199" width="44" height="18" rx="3" fill="#ddf4ef" stroke="#087f73" stroke-width="1.1" stroke-dasharray="3 2"/>
  <text x="562" y="213" font-size="12.5" font-weight="700" fill="#065f56">0.90 → 57.60 GiB 预算内  |  余 6.40 GiB 防录图 OOM</text>

  <text x="26" y="248" font-size="12" fill="#4d5652">64 GiB 出口原理：ACL Graph 录图发生在切完 KV 块之后，只能消耗右侧 (1 - u) 预算外余量；拉到 0.96+ 极易在录图期爆显存。</text>

  <!-- Section 2: 3 Diagnostic Domain Columns -->
  <text x="16" y="294" font-size="16" font-weight="700" fill="#17211f">2. 三组隐蔽调参陷阱 vs v0.30.0 源码核查判据</text>

  <!-- Col A -->
  <rect x="14" y="308" width="282" height="236" rx="9" fill="#fbfaf6" stroke="#c78300" stroke-width="1.3"/>
  <text x="28" y="332" font-size="14" font-weight="700" fill="#936300">A. 默认批预算起点分档（非全系 2048）</text>
  <text x="28" y="355" font-size="12.5" fill="#8f3229">✗ 误区：以为 64 GiB 也能中 8192，</text>
  <text x="28" y="375" font-size="12" fill="#8f3229">或以为 serve 全场景一律固定 2048</text>
  <text x="28" y="399" font-size="12" font-weight="700" fill="#065f56">✓ 真相：&lt;70G / A100 / 置 0 起算 2048</text>
  <text x="28" y="420" font-size="12" font-weight="700" fill="#065f56">批式 DP MoE 起算 256（离线小档 8192）</text>
  <text x="28" y="442" font-size="12" fill="#4d5652">CLI 解析早于初始化，128 GiB 卡因</text>
  <text x="28" y="462" font-family="var(--font-mono)" font-size="12" fill="#4d5652">get_device_total_memory 抛</text>
  <text x="28" y="482" font-family="var(--font-mono)" font-size="12" fill="#4d5652">NotImplementedError 置 0；</text>
  <text x="28" y="504" font-size="12" fill="#4d5652">已初始化：64G/A100 仍 2048，128G 8192</text>
  <text x="28" y="525" font-size="12" fill="#936300">（&gt;=160G 为 16384，吞吐模式等再改写）</text>

  <!-- Col B -->
  <rect x="309" y="308" width="282" height="236" rx="9" fill="#fbfaf6" stroke="#9a4b86" stroke-width="1.3"/>
  <text x="323" y="333" font-size="14" font-weight="700" fill="#7a3a6a">B. 图档位与三级融合静默清空</text>
  <text x="323" y="358" font-size="12.5" fill="#8f3229">✗ 误区：PIECEWISE 配 super_kernel</text>
  <text x="323" y="378" font-size="12" fill="#8f3229">见进程不报错就以为叠加生效</text>
  <text x="323" y="404" font-size="12.5" font-weight="700" fill="#065f56">✓ 真相：分段编译静默刷回 False</text>
  <text x="323" y="427" font-family="var(--font-mono)" font-size="12" fill="#4d5652">requires_piecewise_compilation</text>
  <text x="323" y="449" font-size="12" fill="#4d5652">在 NONE / PIECEWISE 下清空</text>
  <text x="323" y="471" font-family="var(--font-mono)" font-size="12" fill="#4d5652">enable_super_kernel 等三项；</text>
  <text x="323" y="493" font-size="12" fill="#4d5652">仅 FULL_DECODE_ONLY / FULL 保留</text>
  <text x="323" y="515" font-size="12" fill="#7a3a6a">（漏开 static_kernel 直接断言报错）</text>

  <!-- Col C -->
  <rect x="604" y="308" width="282" height="236" rx="9" fill="#fbfaf6" stroke="#087f73" stroke-width="1.3"/>
  <text x="618" y="333" font-size="14" font-weight="700" fill="#065f56">C. 仓外 HCCL_* 变量判读准则</text>
  <text x="618" y="358" font-size="12.5" fill="#8f3229">✗ 误区：见 HCCL_BUFFSIZE_EP 不在</text>
  <text x="618" y="378" font-size="12" fill="#8f3229">envs.py 就直接当拼写错误删掉</text>
  <text x="618" y="404" font-size="12.5" font-weight="700" fill="#065f56">✓ 真相：底层 C 运行时可能消费</text>
  <text x="618" y="425" font-size="12.5" font-weight="700" fill="#065f56">未查实前诚实标为 unknown</text>
  <text x="618" y="450" font-size="12" fill="#4d5652">仓内显式读点仅 ASCEND_HOME_PATH、</text>
  <text x="618" y="471" font-size="12" fill="#4d5652">HCCL_SO_PATH 等十余项；其余由</text>
  <text x="618" y="492" font-size="12" fill="#4d5652">libhccl.so / CANN 直接读取的变量</text>
  <text x="618" y="515" font-size="12" fill="#065f56">须核对应版 CANN 手册，忌盲删</text>
</svg>
