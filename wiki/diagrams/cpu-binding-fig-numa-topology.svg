<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 480" width="900" height="480" role="img" aria-label="NPU-PCIe-NUMA 亲和拓扑、A2 跨节点补池平分角色切片及 A3 和 Ascend 950 差异图" font-family="var(--font-sans)">
  <title>CPU 绑核：NPU-PCIe-NUMA 亲和补池平分、角色切片与 A2 / A3 / A5（950）分派差异</title>
  <desc>关联源码符号：average_distribute, extend_numa, build_ascend_950_cpu_pools, _allocate_default_roles, bind_cpus, migrate_memory, cpu_binding_mode</desc>
  <defs>
    <marker id="cb-arr-a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="#c78300"/>
    </marker>
    <marker id="cb-arr-t" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="#087f73"/>
    </marker>
  </defs>

  <!-- Zone 1: A2 TOPO_AFFINITY example -->
  <text x="16" y="28" font-size="16" font-weight="700" fill="#17211f">① A2 / 310P 拓扑亲和路径（上游 2 卡共享池算法示意：亲和 144-167 ∩ cpuset 144-191）</text>

  <rect x="16" y="44" width="256" height="122" rx="7" fill="#fff4cf" stroke="#c78300" stroke-width="1.4"/>
  <text x="30" y="70" font-size="14.5" font-weight="700" fill="#936300">1. 取交集并跨节点补池</text>
  <text x="30" y="94" font-size="13.5" fill="#4d5652">亲和 144-167 全在同 NUMA</text>
  <text x="30" y="116" font-size="13.5" fill="#4d5652">extend_numa() 补下一节点</text>
  <text x="30" y="138" font-size="13.5" fill="#936300" font-weight="600">168-191 → 共 48 核共享池</text>
  <text x="30" y="158" font-size="13.5" fill="#66716d">本来跨 ≥2 节点则不扩展</text>

  <line x1="274" y1="105" x2="302" y2="105" stroke="#c78300" stroke-width="1.8" marker-end="url(#cb-arr-a)"/>

  <rect x="306" y="44" width="276" height="122" rx="7" fill="#e8edff" stroke="#4c65b6" stroke-width="1.4"/>
  <text x="320" y="70" font-size="14.5" font-weight="700" fill="#3a4f93">2. 多卡共用池按卡序平分</text>
  <text x="320" y="94" font-size="13.5" fill="#4d5652">NPU0 拿前段：144-167（24 核）</text>
  <text x="320" y="116" font-size="13.5" fill="#4d5652">NPU2 拿后段：168-191（24 核）</text>
  <text x="320" y="138" font-size="13.5" fill="#3a4f93" font-weight="600">迁页目标 = 池内最小核所在节点</text>
  <text x="320" y="158" font-size="13.5" fill="#8f3229">NPU2 整段与页落入下一 NUMA</text>

  <line x1="584" y1="105" x2="612" y2="105" stroke="#087f73" stroke-width="1.8" marker-end="url(#cb-arr-t)"/>

  <rect x="616" y="44" width="268" height="122" rx="7" fill="#ddf4ef" stroke="#087f73" stroke-width="1.4"/>
  <text x="630" y="70" font-size="14.5" font-weight="700" fill="#065f56">3. 按池位置切角色（≥5 核）</text>
  <text x="630" y="94" font-size="13.5" fill="#8f3229">前 2 核：中断（停 irqbalance）</text>
  <text x="630" y="116" font-size="13.5" fill="#065f56" font-weight="600">中间 20 核：主线程 + 子线程</text>
  <text x="630" y="138" font-size="13.5" fill="#7a3a6a">最后 2 核：ACL 1 + release 1</text>
  <text x="630" y="158" font-size="13.5" fill="#4d5652">角色只看位置，不看核属哪节点</text>

  <line x1="16" y1="184" x2="884" y2="184" stroke="#b8bcb5" stroke-width="1.4" stroke-dasharray="6 5"/>

  <!-- Zone 2: Model differences across HardwareProfile -->
  <text x="16" y="212" font-size="16" font-weight="700" fill="#17211f">② HardwareProfile.cpu_binding_mode 跨卡型分派（ARM 默认开启，x86 跳过）</text>

  <rect x="16" y="228" width="276" height="124" rx="7" fill="#e8edff" stroke="#4c65b6" stroke-width="1.4"/>
  <text x="30" y="254" font-size="14.5" font-weight="700" fill="#3a4f93">Atlas A2 / 310P</text>
  <text x="30" y="278" font-size="13.5" fill="#4d5652">• 模式：TOPO_AFFINITY</text>
  <text x="30" y="300" font-size="13.5" fill="#4d5652">• 每卡至少 5 核（含 2 IRQ）</text>
  <text x="30" y="322" font-size="13.5" fill="#4d5652">• 拿不到拓扑时退回 global_slice</text>
  <text x="30" y="344" font-size="13.5" fill="#3a4f93">• 绑核异常仅告警，不拦启动</text>

  <rect x="312" y="228" width="276" height="124" rx="7" fill="#fff4cf" stroke="#c78300" stroke-width="1.4"/>
  <text x="326" y="254" font-size="14.5" font-weight="700" fill="#936300">Atlas A3</text>
  <text x="326" y="278" font-size="13.5" fill="#4d5652">• 默认模式：GLOBAL_SLICE</text>
  <text x="326" y="300" font-size="13.5" fill="#4d5652">• 按全局逻辑设备编号均分核</text>
  <text x="326" y="322" font-size="13.5" fill="#4d5652">• 需同 cpuset 与同设备总数</text>
  <text x="326" y="344" font-size="13.5" fill="#936300">• 避免多进程各从 0 号核重切</text>

  <rect x="608" y="228" width="276" height="124" rx="7" fill="#f7e7f2" stroke="#9a4b86" stroke-width="1.4"/>
  <text x="622" y="254" font-size="14.5" font-weight="700" fill="#7a3a6a">Ascend 950（A5 独立分支）</text>
  <text x="622" y="278" font-size="13.5" fill="#4d5652">• 选完整 CPU cluster（8/16 核）</text>
  <text x="622" y="300" font-size="13.5" fill="#4d5652">• 不切 ACL/release，不绑 IRQ</text>
  <text x="622" y="322" font-size="13.5" fill="#4d5652">• 另绑主机 UVB 线程到 NUMA0</text>
  <text x="622" y="344" font-size="13.5" fill="#7a3a6a">• 容器须加 --pid=host；无退路</text>

  <line x1="16" y1="370" x2="884" y2="370" stroke="#b8bcb5" stroke-width="1.4" stroke-dasharray="6 5"/>

  <!-- Zone 3: v0.30.0 migrate_memory & operational boundary -->
  <text x="16" y="396" font-size="16" font-weight="700" fill="#17211f">③ v0.30.0 / main 页迁移开关与运行期边界</text>

  <rect x="16" y="410" width="424" height="58" rx="7" fill="#ddf4ef" stroke="#087f73" stroke-width="1.3"/>
  <text x="30" y="434" font-size="14" font-weight="700" fill="#065f56">v0.30.0 新增 migrate_memory 参数（默认 True）</text>
  <text x="30" y="456" font-size="13.5" fill="#4d5652">Engram CPU offload 传 False，保 HOST_UVA</text>

  <rect x="460" y="410" width="424" height="58" rx="7" fill="#fff0e9" stroke="#b54237" stroke-width="1.3"/>
  <text x="474" y="434" font-size="14" font-weight="700" fill="#8f3229">亲和性 ≠ 独占核；迁页仅搬启动热分配的已有页</text>
  <text x="474" y="456" font-size="13.5" fill="#4d5652">执行时机在预热/图捕获之后；不保证后续新分配页全落本节点</text>
</svg>
