  - { at: [24, 128], size: [200, 52], text: 不是 ARM：记一条日志跳过, style: faded, tone: control }
  - { at: [24, 196], size: [200, 52], text: 拿不到拓扑：改走另一条路, sub: 按全局逻辑设备编号切, style: faded, tone: control }
  - { at: [24, 264], size: [200, 52], text: 核不够 5 个：抛错, style: faded, tone: danger }
  - { at: [470, 60], size: [190, 52], text: ⑤ 绑线程, sub: 主线程连子线程一起, tone: token }
  - { at: [470, 128], size: [190, 52], text: ⑥ 迁页, sub: 迁到池里最小核的节点, tone: kv }
