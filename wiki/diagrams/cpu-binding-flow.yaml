layout: figure
id: cpu-binding-flow
caption: A2 的每个 Worker 在启动收尾处走一遍这条路：先看开关和 CPU 架构，再建这颗 NPU 的 CPU 池、给池里的核分角色，最后才动线程、页和中断。第 ③ 步的池是「亲和核 ∩ cpuset」，这些核全在一个节点里时还会补上编号下一个节点里允许的核，所以池通常横跨两个节点；几颗卡拿到同一个池时按卡序平分。左边一列是四个分支：开关关着、不是 ARM、拿不到拓扑、核数不够，各自的去向不同。右边两个分支只影响其中一步；中途失败不会回滚已经生效的设置。A5 使用独立 cluster 路径，不套用图中的五核与拓扑回退分支。
size: [900, 396]
items:
