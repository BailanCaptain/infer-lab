<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 672" width="900" height="672" role="img" aria-label="同一个 cpuset 被按全局逻辑 NPU id 切成互不重叠的 16 段，每段再按角色分给 IRQ、进程本身、acl 线程、release 线程">
  <title>同一个 cpuset 被按全局逻辑 NPU id 切成互不重叠的 16 段，每段再按角色分给 IRQ、进程本身、acl 线程、release 线程</title>
  <rect width="900" height="672" fill="var(--color-surface, #fbfaf6)"/>
  <rect x="20" y="26" width="860" height="192" rx="12" fill="var(--color-kv-soft, #e8edff)"/>
  <rect x="36" y="40" width="485.9" height="26.5" rx="13.3" fill="var(--color-kv, #4c65b6)"/><text x="47" y="58.1" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="13.5" font-weight="700" fill="var(--color-ink-inverse, #ffffff)">一台 A3 推理服务器：640 个逻辑核、16 张逻辑 NPU、16 个 Worker 进程</text>
  <text x="38" y="83" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="12.5" font-weight="400" fill="var(--color-ink-muted, #5b6763)">一共几张卡、哪张卡挨着哪个 NUMA、这个进程在用哪张卡，全靠解析 npu-smi info -m、npu-smi info、npu-smi info -t topo 三条命令的文本</text>
  <text x="38" y="101" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="12.5" font-weight="400" fill="var(--color-ink-muted, #5b6763)">；ASCEND_RT_VISIBLE_DEVICES 再筛一道。</text>
