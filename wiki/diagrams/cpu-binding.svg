<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 610" width="900" height="610" role="img" aria-label="亲和性限制线程可运行的逻辑 CPU 集合；NUMA 页位置是另一状态。图为拓扑示意，不代表服务器规格，也不保证绑核后全是本地访问。">
