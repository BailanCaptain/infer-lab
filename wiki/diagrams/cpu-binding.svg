  <text x="114" y="523" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="12.5" font-weight="400" fill="var(--color-ink-muted, #5b6763)">taskset -acp，一次覆盖进程里所有线程</text>
