  <rect x="36" y="268" width="199.9" height="26.5" rx="13.3" fill="var(--color-weight, #b87a00)"/><text x="47" y="286.1" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="13.5" font-weight="700" fill="var(--color-ink-inverse, #ffffff)">Worker 0 拿到的那 40 个核</text>
  <rect x="20" y="432" width="860" height="190" rx="12" fill="var(--color-accent-soft, #fff0e9)"/>
