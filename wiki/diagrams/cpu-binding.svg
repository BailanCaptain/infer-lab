  <rect x="379" y="148" width="28" height="28" rx="4" fill="var(--color-comm, #9a4b86)" stroke="var(--color-ink, #17211f)" stroke-width="1.2"/>
  <rect x="566" y="148" width="28" height="28" rx="4" fill="var(--color-token, #087f73)" stroke="var(--color-ink, #17211f)" stroke-width="1.2"/>
  <rect x="597" y="148" width="28" height="28" rx="4" fill="var(--color-token, #087f73)" stroke="var(--color-ink, #17211f)" stroke-width="1.2"/>
  <rect x="566" y="220" width="28" height="28" rx="4" fill="var(--color-surface-sunken, #ece9df)" stroke="var(--color-control, #66716d)" stroke-opacity="0.35" stroke-width="1.2"/>
  <rect x="597" y="220" width="28" height="28" rx="4" fill="var(--color-surface-sunken, #ece9df)" stroke="var(--color-control, #66716d)" stroke-opacity="0.35" stroke-width="1.2"/>
  <rect x="628" y="220" width="28" height="28" rx="4" fill="var(--color-surface-sunken, #ece9df)" stroke="var(--color-control, #66716d)" stroke-opacity="0.35" stroke-width="1.2"/>
  <rect x="659" y="220" width="28" height="28" rx="4" fill="var(--color-surface-sunken, #ece9df)" stroke="var(--color-control, #66716d)" stroke-opacity="0.35" stroke-width="1.2"/>
  <rect x="690" y="220" width="28" height="28" rx="4" fill="var(--color-surface-sunken, #ece9df)" stroke="var(--color-control, #66716d)" stroke-opacity="0.35" stroke-width="1.2"/>
