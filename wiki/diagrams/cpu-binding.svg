<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 420" width="880" height="420" role="img" aria-label="绑核先给这颗卡凑一个 CPU 池：拓扑亲和核与 cpuset 求交，若这些核都落在同一个 NUMA 节点里，就再把编号下一个节点里允许的核补进池，所以池通常横跨两个节点。再把池里的核按位置分角色：最前两个留给这颗 NPU 的中断，最后两个给 ACL 线程和 release 线程，中间归主线程。最后把进程已分配的页迁到池里编号最小的那个核所在的节点。图按亲和节点是节点 0、下一个节点是节点 1 画，核数是示意，不是服务器规格。">
  <title>绑核先给这颗卡凑一个 CPU 池：拓扑亲和核与 cpuset 求交，若这些核都落在同一个 NUMA 节点里，就再把编号下一个节点里允许的核补进池，所以池通常横跨两个节点。再把池里的核按位置分角色：最前两个留给这颗 NPU 的中断，最后两个给 ACL 线程和 release 线程，中间归主线程。最后把进程已分配的页迁到池里编号最小的那个核所在的节点。图按亲和节点是节点 0、下一个节点是节点 1 画，核数是示意，不是服务器规格。</title>
  <defs><marker id="cpu-binding-ah-comm" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="var(--color-comm, #9a4b86)"/></marker><marker id="cpu-binding-ah-token" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="var(--color-token, #087f73)"/></marker><marker id="cpu-binding-ah-control" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="var(--color-control, #66716d)"/></marker><marker id="cpu-binding-ah-kv" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="var(--color-kv, #4c65b6)"/></marker></defs>
  <rect x="190" y="56" width="330" height="300" rx="16" fill="none" stroke="var(--color-line-strong, #b8bcb5)" stroke-width="1.5"/>
  <text x="206" y="44" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="15" font-weight="700" fill="var(--color-ink, #17211f)">NUMA 节点 0 · 这颗卡的亲和节点</text>
  <rect x="548" y="56" width="308" height="300" rx="16" fill="none" stroke="var(--color-line-strong, #b8bcb5)" stroke-width="1.5"/>
  <text x="564" y="44" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="15" font-weight="700" fill="var(--color-ink, #17211f)">NUMA 节点 1 · 编号下一个节点</text>
  <g data-hardware="chip">
  <rect x="32" y="158" width="114" height="74" rx="5" fill="var(--color-surface, #fbfaf6)" stroke="var(--color-ink, #17211f)" stroke-width="1.5"/>
  <path d="M56.5 150v8M56.5 232v8M24 172.5h8M146 172.5h8" fill="none" stroke="var(--color-ink, #17211f)" stroke-width="1.5"/>
  <path d="M89 150v8M89 232v8M24 195h8M146 195h8" fill="none" stroke="var(--color-ink, #17211f)" stroke-width="1.5"/>
  <path d="M121.5 150v8M121.5 232v8M24 217.5h8M146 217.5h8" fill="none" stroke="var(--color-ink, #17211f)" stroke-width="1.5"/>
  <text x="89" y="199" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="13" font-weight="700" fill="var(--color-ink, #17211f)" text-anchor="middle">NPU 0（本卡）</text>
  </g>
  <g data-hardware="memory">
  <rect x="206" y="270" width="298" height="74" rx="3" fill="var(--color-kv-soft, #e8edff)" stroke="var(--color-kv, #4c65b6)" stroke-width="1.5"/>
  <path d="M211 336h288M211 340h288" fill="none" stroke="var(--color-kv, #4c65b6)" stroke-width="1.5"/>
  <text x="355" y="311" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="13" font-weight="700" fill="var(--color-ink, #17211f)" text-anchor="middle">本地内存 · 页迁到这里</text>
  </g>
  <g data-hardware="memory">
  <rect x="566" y="270" width="274" height="74" rx="3" fill="var(--color-kv-soft, #e8edff)" stroke="var(--color-kv, #4c65b6)" stroke-width="1.5"/>
  <path d="M571 336h264M571 340h264" fill="none" stroke="var(--color-kv, #4c65b6)" stroke-width="1.5"/>
  <text x="703" y="311" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="13" font-weight="700" fill="var(--color-ink, #17211f)" text-anchor="middle">下一个节点的内存</text>
  </g>
  <path d="M154 178 L204 178" fill="none" stroke="var(--color-comm, #9a4b86)" stroke-width="2.2" marker-end="url(#cpu-binding-ah-comm)"/>
  <path d="M328 110 L348 110" fill="none" stroke="var(--color-token, #087f73)" stroke-width="1.4" marker-end="url(#cpu-binding-ah-token)"/>
  <path d="M488 110 L564 110" fill="none" stroke="var(--color-control, #66716d)" stroke-width="1.4" marker-end="url(#cpu-binding-ah-control)"/>
  <path d="M638 157 L728 157" fill="none" stroke="var(--color-token, #087f73)" stroke-width="1.4" marker-end="url(#cpu-binding-ah-token)"/>
  <path d="M610 176 L610 203 L728 203" fill="none" stroke="var(--color-token, #087f73)" stroke-width="1.4" marker-end="url(#cpu-binding-ah-token)"/>
  <path d="M267 136 L267 270" fill="none" stroke="var(--color-kv, #4c65b6)" stroke-width="1.4" marker-start="url(#cpu-binding-ah-kv)" marker-end="url(#cpu-binding-ah-kv)"/>
  <path d="M508 307 L564 307" fill="none" stroke="var(--color-comm, #9a4b86)" stroke-width="2.2" stroke-dasharray="7 5" marker-start="url(#cpu-binding-ah-comm)" marker-end="url(#cpu-binding-ah-comm)"/>
  <rect x="348" y="96" width="28" height="28" rx="4" fill="var(--color-control, #66716d)" stroke="var(--color-ink, #17211f)" stroke-width="1.2"/>
  <rect x="379" y="96" width="28" height="28" rx="4" fill="var(--color-control, #66716d)" stroke="var(--color-ink, #17211f)" stroke-width="1.2"/>
