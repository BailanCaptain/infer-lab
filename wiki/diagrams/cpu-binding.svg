  <text x="20" y="646" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="12.5" font-weight="400" fill="var(--color-ink-muted, #5b6763)">整条流程跑在每个 Worker 进程自己身上，发生在启动的最后一步、warmup 之后；任何一步抛异常都被 NPUWorker 接住写成一条 warning，服务照常起</text>
  <text x="20" y="664.5" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="12.5" font-weight="400" fill="var(--color-ink-muted, #5b6763)">来，只是少了这层优化。</text>
