layout: figure
id: cpu-binding
caption: A2 拓扑亲和路径先给这颗卡凑一个 CPU 池：拓扑亲和核与 cpuset 求交，若这些核都落在同一个 NUMA 节点里，就再把编号下一个节点里允许的核补进池，所以池通常横跨两个节点。再把池里的核按位置分角色：最前两个留给这颗 NPU 的中断，最后两个给 ACL 线程和 release 线程，中间归主线程。最后尝试把进程已分配的页迁到池里编号最小的那个核所在的节点。图按亲和节点是节点 0、下一个节点是节点 1、相关设置成功时画，核数是示意，不是服务器规格；A5 使用独立 cluster 路径。
