<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 436" width="900" height="436" role="img" aria-label="HardwareProfile 跨代硬件能力矩阵与 enable_custom_op 双分支回退门控">
  <defs>
    <marker id="arr-dark" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,1 L9,5 L0,9 z" fill="#4d5652"/>
    </marker>
  </defs>

  <text x="20" y="28" font-family="sans-serif" font-size="16" font-weight="700" fill="#17211f">HardwareProfile 硬件能力门控矩阵：查能力位，绝不硬编码芯片型号</text>

  <rect x="20" y="42" width="272" height="32" rx="6" fill="#fff0e9" stroke="#b54237" stroke-width="1.2"/>
  <text x="32" y="63" font-family="sans-serif" font-size="13.5" font-weight="700" fill="#8f3229">✗ 禁止: if soc == "Ascend950"</text>
  <line x1="296" y1="58" x2="326" y2="58" stroke="#4d5652" stroke-width="1.6" marker-end="url(#arr-dark)"/>
  <rect x="332" y="42" width="548" height="32" rx="6" fill="#ddf4ef" stroke="#087f73" stroke-width="1.2"/>
  <text x="344" y="62" font-family="monospace" font-size="12" font-weight="700" fill="#065f56">✓ 统一: get_current_hardware_profile().supports(HardwareCapability.XXX)</text>

  <rect x="20" y="88" width="268" height="38" rx="6" fill="#ece9df" stroke="#d8d8cf" stroke-width="1"/>
  <text x="34" y="112" font-family="sans-serif" font-size="14" font-weight="700" fill="#17211f">能力项 / 运行时约束</text>

  <rect x="294" y="88" width="188" height="38" rx="6" fill="#087f73"/>
  <text x="388" y="112" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="700" fill="#ffffff">A2 / A3（主力卡）</text>

  <rect x="488" y="88" width="196" height="38" rx="6" fill="#4c65b6"/>
  <text x="586" y="112" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="700" fill="#ffffff">950 / A5（新一代）</text>

  <rect x="690" y="88" width="190" height="38" rx="6" fill="#c78300"/>
  <text x="785" y="112" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="700" fill="#ffffff">310P（推理兼容）</text>

  <rect x="20" y="132" width="268" height="44" rx="5" fill="#f7f5ef" stroke="#d8d8cf" stroke-width="1"/>
  <text x="32" y="152" font-family="monospace" font-size="13.5" font-weight="700" fill="#17211f">RUNTIME_CUSTOM_OPS</text>
  <text x="32" y="169" font-family="sans-serif" font-size="13.5" fill="#66716d">控制 vllm_ascend_C 惰性加载</text>

  <rect x="294" y="132" width="188" height="44" rx="5" fill="#ddf4ef" stroke="#087f73" stroke-width="1"/>
  <text x="388" y="159" text-anchor="middle" font-family="sans-serif" font-size="13.5" font-weight="700" fill="#065f56">✓ 默认支持</text>

  <rect x="488" y="132" width="196" height="44" rx="5" fill="#fff0e9" stroke="#b54237" stroke-width="1.3"/>
  <text x="586" y="152" text-anchor="middle" font-family="sans-serif" font-size="13.5" font-weight="700" fill="#8f3229">v0.30.0 ✗ 未包含</text>
  <text x="586" y="170" text-anchor="middle" font-family="sans-serif" font-size="13.5" font-weight="600" fill="#3a4f93">main ✓ 已补回</text>

  <rect x="690" y="132" width="190" height="44" rx="5" fill="#f7f5ef" stroke="#d8d8cf" stroke-width="1"/>
  <text x="785" y="159" text-anchor="middle" font-family="sans-serif" font-size="13.5" fill="#4d5652">按 310P 档案门控</text>

  <rect x="20" y="182" width="268" height="44" rx="5" fill="#f7f5ef" stroke="#d8d8cf" stroke-width="1"/>
  <text x="32" y="202" font-family="monospace" font-size="13.5" font-weight="700" fill="#17211f">COMPATIBILITY_OP_IMPL</text>
  <text x="32" y="219" font-family="sans-serif" font-size="13.5" fill="#66716d">register_ascend_customop 覆写</text>

  <rect x="294" y="182" width="188" height="44" rx="5" fill="#ffffff" stroke="#d8d8cf" stroke-width="1"/>
  <text x="388" y="209" text-anchor="middle" font-family="sans-serif" font-size="13.5" fill="#66716d">— 标准 OOT 算子表</text>

  <rect x="488" y="182" width="196" height="44" rx="5" fill="#ffffff" stroke="#d8d8cf" stroke-width="1"/>
  <text x="586" y="209" text-anchor="middle" font-family="sans-serif" font-size="13.5" fill="#66716d">— 标准 OOT 算子表</text>

  <rect x="690" y="182" width="190" height="44" rx="5" fill="#fff4cf" stroke="#c78300" stroke-width="1.3"/>
  <text x="785" y="202" text-anchor="middle" font-family="sans-serif" font-size="13.5" font-weight="700" fill="#936300">✓ 批量覆写 _310p/</text>
  <text x="785" y="219" text-anchor="middle" font-family="monospace" font-size="13.5" fill="#4d5652">Ascend*310 子类</text>

  <rect x="20" y="232" width="268" height="44" rx="5" fill="#f7f5ef" stroke="#d8d8cf" stroke-width="1"/>
  <text x="32" y="252" font-family="monospace" font-size="13.5" font-weight="700" fill="#17211f">WeightLayoutPolicy</text>
  <text x="32" y="269" font-family="sans-serif" font-size="13.5" fill="#66716d">权重排布策略</text>

  <rect x="294" y="232" width="188" height="44" rx="5" fill="#ffffff" stroke="#d8d8cf" stroke-width="1"/>
  <text x="388" y="259" text-anchor="middle" font-family="sans-serif" font-size="13.5" fill="#4d5652">ND / 按算子转 NZ</text>

  <rect x="488" y="232" width="196" height="44" rx="5" fill="#e8edff" stroke="#4c65b6" stroke-width="1"/>
  <text x="586" y="259" text-anchor="middle" font-family="sans-serif" font-size="13.5" fill="#3a4f93">ND / 原生块量化演进</text>

  <rect x="690" y="232" width="190" height="44" rx="5" fill="#fff4cf" stroke="#c78300" stroke-width="1.3"/>
  <text x="785" y="252" text-anchor="middle" font-family="monospace" font-size="13.5" font-weight="700" fill="#936300">FORCE_NZ</text>
  <text x="785" y="269" text-anchor="middle" font-family="sans-serif" font-size="13.5" fill="#4d5652">强制 FRACTAL_NZ</text>

  <rect x="20" y="282" width="268" height="44" rx="5" fill="#f7f5ef" stroke="#d8d8cf" stroke-width="1"/>
  <text x="32" y="302" font-family="monospace" font-size="13.5" font-weight="700" fill="#17211f">HAS_TRITON &amp; 片上 UB</text>
  <text x="32" y="319" font-family="sans-serif" font-size="13.5" fill="#66716d">triton_utils 安全探测下界</text>

  <rect x="294" y="282" width="188" height="44" rx="5" fill="#ddf4ef" stroke="#087f73" stroke-width="1"/>
  <text x="388" y="309" text-anchor="middle" font-family="sans-serif" font-size="13.5" font-weight="600" fill="#065f56">UB 默认 192 KB</text>

  <rect x="488" y="282" width="196" height="44" rx="5" fill="#ffffff" stroke="#d8d8cf" stroke-width="1"/>
  <text x="586" y="309" text-anchor="middle" font-family="sans-serif" font-size="13.5" fill="#4d5652">须经 HAS_TRITON 守卫</text>

  <rect x="690" y="282" width="190" height="44" rx="5" fill="#fff0e9" stroke="#b54237" stroke-width="1"/>
  <text x="785" y="302" text-anchor="middle" font-family="sans-serif" font-size="13.5" font-weight="700" fill="#8f3229">UB 仅 128 KB</text>
  <text x="785" y="319" text-anchor="middle" font-family="sans-serif" font-size="13.5" fill="#4d5652">常未装 triton-ascend</text>

  <rect x="20" y="340" width="420" height="82" rx="8" fill="#fff0e9" stroke="#b54237" stroke-width="1.4"/>
  <text x="34" y="364" font-family="sans-serif" font-size="14" font-weight="700" fill="#8f3229">第二道运行时闸门：VLLM_BATCH_INVARIANT=1</text>
  <text x="34" y="386" font-family="sans-serif" font-size="13.5" fill="#17211f">即便硬件档案含 RUNTIME_CUSTOM_OPS，开启批不变模式后</text>
  <text x="34" y="408" font-family="sans-serif" font-size="13.5" fill="#4d5652">enable_custom_op() 也强制返回 False（且惰性加载防早启 RTS）</text>

  <rect x="454" y="340" width="426" height="82" rx="8" fill="#ddf4ef" stroke="#087f73" stroke-width="1.4"/>
  <text x="468" y="364" font-family="sans-serif" font-size="14" font-weight="700" fill="#065f56">OOT 算子强制双分支范式（如 AscendGemmaRMSNorm）</text>
  <text x="468" y="386" font-family="monospace" font-size="12.5" fill="#17211f">if enable_custom_op(): torch.ops._C_ascend.*</text>
  <text x="468" y="408" font-family="monospace" font-size="12" fill="#065f56">else: torch_npu.npu_add_rms_norm(...)  # 严禁无保护直调</text>
</svg>
