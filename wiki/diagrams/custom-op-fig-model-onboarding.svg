<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 410" width="900" height="410" role="img" aria-label="新模型接入昇腾四道注册关口与复用上游 vs 覆写分岔决策" font-family="var(--font-sans)">
  <title>新 HuggingFace 模型接入四道关口：标准架构零侵入复用上游 vs 特殊架构在 vllm_ascend/models/ 覆写</title>
  <desc>Four registration checkpoints (ModelRegistry, WeightsMapper, register_scheme, register_ascend_customop) leading into a clear decision fork between upstream reuse (Qwen3) and plugin model override (DSV4.1/KimiK3)</desc>
  <defs>
    <marker id="mo-arr-ink" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="#4d5652"/>
    </marker>
    <marker id="mo-arr-teal" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="#087f73"/>
    </marker>
    <marker id="mo-arr-red" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="#b54237"/>
    </marker>
  </defs>

  <text x="16" y="28" font-size="16" font-weight="700" fill="#17211f">新 HuggingFace 模型从 safetensors 到 NPU 前向的四道注册关口</text>
  <text x="884" y="28" text-anchor="end" font-size="13.5" fill="#66716d">切忌一上来就整文件复制进 vllm_ascend/models/</text>

  <!-- 4 Registration Gates Row -->
  <rect x="16" y="48" width="198" height="122" rx="7" fill="#ddf4ef" stroke="#087f73" stroke-width="1.4"/>
  <circle cx="36" cy="70" r="11" fill="#087f73"/>
  <text x="36" y="75" text-anchor="middle" font-size="13.5" font-weight="700" fill="#ffffff">1</text>
  <text x="54" y="75" font-size="14.5" font-weight="700" fill="#065f56">架构名登记</text>
  <text x="28" y="102" font-size="13.5" font-family="var(--font-mono)" fill="#17211f">ModelRegistry</text>
  <text x="28" y="124" font-size="13.5" font-family="var(--font-mono)" fill="#065f56">register_model()</text>
  <text x="28" y="150" font-size="13.5" fill="#4d5652">匹配 config architectures</text>

  <line x1="216" y1="109" x2="236" y2="109" stroke="#4d5652" stroke-width="1.7" marker-end="url(#mo-arr-ink)"/>

  <rect x="240" y="48" width="198" height="122" rx="7" fill="#fff4cf" stroke="#c78300" stroke-width="1.4"/>
  <circle cx="260" cy="70" r="11" fill="#c78300"/>
  <text x="260" y="75" text-anchor="middle" font-size="13.5" font-weight="700" fill="#ffffff">2</text>
  <text x="278" y="75" font-size="14.5" font-weight="700" fill="#936300">权重键名映射</text>
  <text x="252" y="102" font-size="13.5" font-family="var(--font-mono)" fill="#17211f">WeightsMapper</text>
  <text x="252" y="124" font-size="13.5" font-family="var(--font-mono)" fill="#936300">AutoWeightsLoader</text>
  <text x="252" y="150" font-size="13.5" fill="#4d5652">前缀改名 / None 丢弃</text>

  <line x1="440" y1="109" x2="460" y2="109" stroke="#4d5652" stroke-width="1.7" marker-end="url(#mo-arr-ink)"/>

  <rect x="464" y="48" width="198" height="122" rx="7" fill="#e8edff" stroke="#4c65b6" stroke-width="1.4"/>
  <circle cx="484" cy="70" r="11" fill="#4c65b6"/>
  <text x="484" y="75" text-anchor="middle" font-size="13.5" font-weight="700" fill="#ffffff">3</text>
  <text x="502" y="75" font-size="14.5" font-weight="700" fill="#3a4f93">量化方案注册</text>
  <text x="476" y="102" font-size="13.5" font-family="var(--font-mono)" fill="#17211f">@register_scheme</text>
  <text x="476" y="124" font-size="13.5" font-family="var(--font-mono)" fill="#3a4f93">(quant, layer)</text>
  <text x="476" y="150" font-size="13.5" fill="#4d5652">按表查 linear / moe</text>

  <line x1="664" y1="109" x2="684" y2="109" stroke="#4d5652" stroke-width="1.7" marker-end="url(#mo-arr-ink)"/>

  <rect x="688" y="48" width="196" height="122" rx="7" fill="#f7e7f2" stroke="#9a4b86" stroke-width="1.4"/>
  <circle cx="708" cy="70" r="11" fill="#9a4b86"/>
  <text x="708" y="75" text-anchor="middle" font-size="13.5" font-weight="700" fill="#ffffff">4</text>
  <text x="726" y="75" font-size="14.5" font-weight="700" fill="#7a3a6a">OOT 算子拦截</text>
  <text x="700" y="102" font-size="13.5" font-family="var(--font-mono)" fill="#17211f">CustomOp</text>
  <text x="700" y="124" font-size="13.5" font-family="var(--font-mono)" fill="#7a3a6a">register_oot()</text>
  <text x="700" y="150" font-size="13.5" fill="#4d5652">自动换 NPU / 310P</text>

  <!-- Decision Fork from Gate 1 -->
  <path d="M 115 172 L 115 198 L 450 198" fill="none" stroke="#4d5652" stroke-width="1.6"/>
  <rect x="312" y="182" width="276" height="32" rx="16" fill="#ece9df" stroke="#17211f" stroke-width="1.3"/>
  <text x="450" y="203" text-anchor="middle" font-size="14" font-weight="700" fill="#17211f">上游 vLLM 已有该模型架构？</text>

  <path d="M 312 198 L 228 198 L 228 232" fill="none" stroke="#087f73" stroke-width="1.8" marker-end="url(#mo-arr-teal)"/>
  <path d="M 588 198 L 672 198 L 672 232" fill="none" stroke="#b54237" stroke-width="1.8" marker-end="url(#mo-arr-red)"/>
  <text x="270" y="192" text-anchor="middle" font-size="13.5" font-weight="700" fill="#065f56">是（首选）</text>
  <text x="630" y="192" text-anchor="middle" font-size="13.5" font-weight="700" fill="#8f3229">否 / 须定制</text>

  <!-- Left Fork: Upstream Reuse -->
  <rect x="16" y="236" width="422" height="158" rx="8" fill="#ddf4ef" stroke="#087f73" stroke-width="1.4"/>
  <text x="30" y="264" font-size="15" font-weight="700" fill="#065f56">✓ 零侵入复用上游类（如 Qwen3-8B / 30B-A3B）</text>
  <rect x="30" y="278" width="394" height="32" rx="5" fill="#ffffff" stroke="#087f73" stroke-width="1.1"/>
  <text x="42" y="299" font-size="13.5" fill="#17211f">Norm / RoPE / Linear / MoE 自动走第 4 关 OOT 拦截</text>
  <rect x="30" y="316" width="394" height="32" rx="5" fill="#ffffff" stroke="#087f73" stroke-width="1.1"/>
  <text x="42" y="337" font-size="13.5" fill="#17211f">ModelSlim 量化直接匹配第 3 关已有 scheme</text>
  <text x="30" y="376" font-size="13.5" font-weight="700" fill="#065f56">310P 自动由 COMPATIBILITY 能力覆写为 _310p 子类</text>

  <!-- Right Fork: Override in vllm_ascend/models/ -->
  <rect x="462" y="236" width="422" height="158" rx="8" fill="#fff0e9" stroke="#b54237" stroke-width="1.4"/>
  <text x="476" y="264" font-size="15" font-weight="700" fill="#8f3229">仅三类情况在 vllm_ascend/models/ 覆写登记</text>
  <rect x="476" y="278" width="394" height="32" rx="5" fill="#ffffff" stroke="#d88c82" stroke-width="1.1"/>
  <text x="488" y="299" font-size="13.5" fill="#17211f">① 上游未合入的新架构或旧别名（DSV4.1 / KimiK3）</text>
  <rect x="476" y="316" width="394" height="32" rx="5" fill="#ffffff" stroke="#d88c82" stroke-width="1.1"/>
  <text x="488" y="337" font-size="13.5" fill="#17211f">② 昇腾专属多模态预处理或草拟头（Qwen3.5 / DSpark）</text>
  <text x="476" y="376" font-size="13.5" font-weight="700" fill="#8f3229">③ 需接 WeightsMapper 重写前缀或专用融合核（补 Meta）</text>
</svg>
