<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 440" width="900" height="440" role="img" aria-label="昇腾三条自定义算子实现路径阶梯选型图：torch_npu ACLNN/ATB、triton-ascend 与 AscendC csrc 对比">
  <defs>
    <marker id="arr-amber" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,1 L9,5 L0,9 z" fill="#c78300"/>
    </marker>
    <marker id="arr-indigo" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,1 L9,5 L0,9 z" fill="#4c65b6"/>
    </marker>
    <marker id="arr-slate" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,1 L9,5 L0,9 z" fill="#4d5652"/>
    </marker>
  </defs>

  <text x="20" y="28" font-family="sans-serif" font-size="16" font-weight="700" fill="#17211f">自定义算子三条实现路径：从零编译复用逐级升级到片上全控制</text>

  <rect x="20" y="42" width="860" height="28" rx="6" fill="#ece9df" stroke="#d8d8cf" stroke-width="1"/>
  <text x="36" y="61" font-family="sans-serif" font-size="13.5" font-weight="700" fill="#065f56">低维护代价 · 零 C++ 编译</text>
  <line x1="226" y1="56" x2="640" y2="56" stroke="#4d5652" stroke-width="1.6" stroke-dasharray="5,4" marker-end="url(#arr-slate)"/>
  <text x="432" y="52" text-anchor="middle" font-family="sans-serif" font-size="13.5" fill="#4d5652">仅在 Profiling 证实瓶颈后向右升级</text>
  <text x="864" y="61" text-anchor="end" font-family="sans-serif" font-size="13.5" font-weight="700" fill="#3a4f93">极致控制 Cube/Vector/通信</text>

  <path d="M274,176 C292,150 302,138 318,138" fill="none" stroke="#c78300" stroke-width="2" marker-end="url(#arr-amber)"/>
  <rect x="244" y="106" width="102" height="24" rx="12" fill="#fff4cf" stroke="#c78300" stroke-width="1"/>
  <text x="295" y="122" text-anchor="middle" font-family="sans-serif" font-size="13.5" font-weight="600" fill="#936300">非标访存融合</text>

  <path d="M580,144 C598,118 608,104 624,104" fill="none" stroke="#4c65b6" stroke-width="2" marker-end="url(#arr-indigo)"/>
  <rect x="546" y="76" width="110" height="24" rx="12" fill="#e8edff" stroke="#4c65b6" stroke-width="1"/>
  <text x="601" y="92" text-anchor="middle" font-family="sans-serif" font-size="13.5" font-weight="600" fill="#3a4f93">热点 Cube/MC2</text>

  <rect x="20" y="156" width="256" height="210" rx="10" fill="#ddf4ef" stroke="#087f73" stroke-width="1.8"/>
  <rect x="20" y="156" width="256" height="36" rx="10" fill="#087f73"/>
  <rect x="20" y="180" width="256" height="12" fill="#087f73"/>
  <text x="34" y="180" font-family="sans-serif" font-size="14.5" font-weight="700" fill="#ffffff">① torch_npu (ACLNN)</text>
  <rect x="196" y="162" width="70" height="22" rx="11" fill="#ffffff"/>
  <text x="231" y="178" text-anchor="middle" font-family="sans-serif" font-size="13.5" font-weight="700" fill="#065f56">第一优先</text>

  <text x="34" y="214" font-family="sans-serif" font-size="13.5" font-weight="700" fill="#065f56">接口与交付</text>
  <text x="34" y="234" font-family="monospace" font-size="13.5" fill="#17211f">torch_npu.npu_* / ATB</text>
  <text x="34" y="254" font-family="sans-serif" font-size="13.5" fill="#4d5652">零 C++ 编译，随 CANN 发版</text>

  <line x1="34" y1="268" x2="262" y2="268" stroke="#087f73" stroke-opacity="0.3" stroke-width="1"/>
  <text x="34" y="288" font-family="sans-serif" font-size="13.5" font-weight="700" fill="#065f56">图捕获与场景</text>
  <text x="34" y="308" font-family="sans-serif" font-size="13.5" fill="#17211f">ACL Graph / compile 原生支持</text>
  <text x="34" y="328" font-family="sans-serif" font-size="13.5" fill="#4d5652">RMSNorm · FIA · 标准量化矩阵乘</text>
  <text x="34" y="352" font-family="sans-serif" font-size="13.5" font-weight="600" fill="#065f56">✓ 也是 950 / 批不变的兜底路径</text>

  <rect x="322" y="122" width="260" height="244" rx="10" fill="#fff4cf" stroke="#c78300" stroke-width="1.8"/>
  <rect x="322" y="122" width="260" height="36" rx="10" fill="#c78300"/>
  <rect x="322" y="146" width="260" height="12" fill="#c78300"/>
  <text x="336" y="146" font-family="sans-serif" font-size="14.5" font-weight="700" fill="#ffffff">② triton-ascend (Python JIT)</text>

  <text x="336" y="180" font-family="sans-serif" font-size="13.5" font-weight="700" fill="#936300">源码与构建</text>
  <text x="336" y="200" font-family="monospace" font-size="13.5" fill="#17211f">vllm_ascend/ops/triton/</text>
  <text x="336" y="220" font-family="sans-serif" font-size="13.5" fill="#4d5652">@triton.jit 零 C++，运行期 JIT</text>

  <line x1="336" y1="234" x2="568" y2="234" stroke="#c78300" stroke-opacity="0.35" stroke-width="1"/>
  <text x="336" y="254" font-family="sans-serif" font-size="13.5" font-weight="700" fill="#936300">图捕获与硬件约束</text>
  <text x="336" y="274" font-family="sans-serif" font-size="13.5" fill="#17211f">须配 direct_register + fake_impl</text>
  <text x="336" y="294" font-family="sans-serif" font-size="13.5" fill="#17211f">受片上 UB 限制：192KB / 128KB</text>
  <text x="336" y="314" font-family="sans-serif" font-size="13.5" fill="#936300">须守卫 HAS_TRITON（310P 常缺）</text>

  <line x1="336" y1="328" x2="568" y2="328" stroke="#c78300" stroke-opacity="0.35" stroke-width="1"/>
  <text x="336" y="350" font-family="sans-serif" font-size="13.5" fill="#4d5652">块表 slot_mapping · QKV/RoPE 融合</text>

  <rect x="628" y="88" width="252" height="278" rx="10" fill="#e8edff" stroke="#4c65b6" stroke-width="1.8"/>
  <rect x="628" y="88" width="252" height="36" rx="10" fill="#4c65b6"/>
  <rect x="628" y="112" width="252" height="12" fill="#4c65b6"/>
  <text x="642" y="112" font-family="sans-serif" font-size="14.5" font-weight="700" fill="#ffffff">③ AscendC (vllm_ascend_C)</text>

  <text x="642" y="146" font-family="sans-serif" font-size="13.5" font-weight="700" fill="#3a4f93">源码与绑定</text>
  <text x="642" y="166" font-family="monospace" font-size="13.5" fill="#17211f">csrc/ op_host + op_kernel</text>
  <text x="642" y="186" font-family="monospace" font-size="13.5" fill="#17211f">→ torch.ops._C_ascend.*</text>
  <text x="642" y="206" font-family="sans-serif" font-size="13.5" fill="#4d5652">build_aclnn.sh 按 SoC 编译</text>

  <line x1="642" y1="220" x2="866" y2="220" stroke="#4c65b6" stroke-opacity="0.35" stroke-width="1"/>
  <text x="642" y="240" font-family="sans-serif" font-size="13.5" font-weight="700" fill="#3a4f93">两项硬性门槛</text>
  <rect x="640" y="250" width="228" height="26" rx="5" fill="#ffffff" stroke="#4c65b6" stroke-width="1"/>
  <text x="650" y="268" font-family="sans-serif" font-size="13.5" font-weight="600" fill="#3a4f93">1. 必补 torch_binding_meta.cpp</text>
  <rect x="640" y="282" width="228" height="26" rx="5" fill="#fff0e9" stroke="#b54237" stroke-width="1"/>
  <text x="650" y="300" font-family="sans-serif" font-size="13.5" font-weight="600" fill="#8f3229">2. 必经 enable_custom_op() 门控</text>

  <line x1="642" y1="322" x2="866" y2="322" stroke="#4c65b6" stroke-opacity="0.35" stroke-width="1"/>
  <text x="642" y="344" font-family="sans-serif" font-size="13.5" fill="#4d5652">直控 Cube/Vector/L1/UB/通信</text>
  <text x="642" y="360" font-family="sans-serif" font-size="13.5" fill="#4d5652">add_rms_norm_bias · SFA · MC2</text>

  <rect x="20" y="382" width="860" height="44" rx="8" fill="#f7f5ef" stroke="#b8bcb5" stroke-width="1.2"/>
  <text x="36" y="409" font-family="sans-serif" font-size="14" font-weight="700" fill="#17211f">选型铁律：</text>
  <text x="116" y="409" font-family="sans-serif" font-size="13.5" fill="#4d5652">优先用 ① 复用 CANN 算子；遇非标访存/索引融合上 ② 快速验证；仅当热点须细控 Cube/Vector 或融合通信再下沉 ③</text>
</svg>
