<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 440" width="900" height="440" role="img" aria-label="采用稠密模型和固定每步耗时的示意。左：一组卡放一份模型，每步最多排 4 条请求；8 条同时到来，只能算 4 条，另外 4 条排队。右：DP2 把整份模型复制到第二组卡上，请求分给两组，各排各的，8 条都在算。每条请求每步仍只长出 1 个 token；多出来的是同时在算的条数，代价是多一组卡、多一份权重。实际时延和吞吐另受批次及资源争用影响，MoE 跨组专家分工另见后图。">
  <title>采用稠密模型和固定每步耗时的示意。左：一组卡放一份模型，每步最多排 4 条请求；8 条同时到来，只能算 4 条，另外 4 条排队。右：DP2 把整份模型复制到第二组卡上，请求分给两组，各排各的，8 条都在算。每条请求每步仍只长出 1 个 token；多出来的是同时在算的条数，代价是多一组卡、多一份权重。实际时延和吞吐另受批次及资源争用影响，MoE 跨组专家分工另见后图。</title>
