layout: figure
id: data-parallel-basics
caption: 采用稠密模型和固定每步耗时的示意。左：一组卡放一份模型，每步最多排 4 条请求；8 条同时到来，只能算 4 条，另外 4 条排队。右：DP2 把整份模型复制到第二组卡上，请求分给两组，各排各的，8 条都在算。每条请求每步仍只长出 1 个 token；多出来的是同时在算的条数，代价是多一组卡、多一份权重。实际时延和吞吐另受批次及资源争用影响，MoE 跨组专家分工另见后图。
size: [900, 440]
frames:
  - { at: [20, 60], size: [280, 300], label: 不开 DP · 一份模型 }
  - { at: [340, 60], size: [260, 300], label: DP2 · 组 0 · 第 1 份模型 }
  - { at: [620, 60], size: [260, 300], label: DP2 · 组 1 · 第 2 份模型 }
matrices:
  - { at: [85, 88], w: 150, h: 48, rows: 3, cols: 8, tone: weight, label: 整份权重 }
  - { at: [395, 88], w: 150, h: 48, rows: 3, cols: 8, tone: weight, label: 整份权重（副本） }
  - { at: [675, 88], w: 150, h: 48, rows: 3, cols: 8, tone: weight, label: 整份权重（副本） }
grids:
  # ---- 不开 DP：运行 4 条，等待 4 条
  - at: [80, 190]
    rows: 1
    cols: 4
    cell: [40, 34]
    tone: token
    style: solid
    label: 运行中 · 本步在算 4 条
    cells:
      - { at: [0, 0], text: A }
      - { at: [0, 1], text: B }
      - { at: [0, 2], text: C }
      - { at: [0, 3], text: D }
  - at: [80, 270]
    rows: 1
    cols: 4
    cell: [40, 34]
    tone: danger
    style: faded
    label: 等待中 · 4 条在排队
    cells:
      - { at: [0, 0], text: E }
      - { at: [0, 1], text: F }
      - { at: [0, 2], text: G }
      - { at: [0, 3], text: H }
  # ---- DP2 组 0
  - at: [390, 190]
    rows: 1
    cols: 4
    cell: [40, 34]
    tone: token
    style: solid
    label: 运行中 · 本步在算 4 条
    cells:
      - { at: [0, 0], text: A }
      - { at: [0, 1], text: C }
      - { at: [0, 2], text: E }
      - { at: [0, 3], text: G }
  - { at: [390, 270], rows: 1, cols: 4, cell: [40, 34], tone: token, style: empty, label: 等待中 · 0 条 }
  # ---- DP2 组 1
  - at: [670, 190]
    rows: 1
    cols: 4
    cell: [40, 34]
    tone: token
    style: solid
    label: 运行中 · 本步在算 4 条
    cells:
      - { at: [0, 0], text: B }
      - { at: [0, 1], text: D }
      - { at: [0, 2], text: F }
      - { at: [0, 3], text: H }
  - { at: [670, 270], rows: 1, cols: 4, cell: [40, 34], tone: token, style: empty, label: 等待中 · 0 条 }
texts:
  - { at: [450, 24], text: 8 条请求同时到来 · 每组每步最多排 4 条（示意）, anchor: middle, strong: true }
  - { at: [160, 392], text: 本步产出 4 个 token, anchor: middle, strong: true }
  - { at: [610, 392], text: 两组合计：本步产出 4 + 4 = 8 个 token, anchor: middle, strong: true }
  - { at: [450, 426], text: 单条请求每步仍只长 1 个 token, anchor: middle, note: true }
