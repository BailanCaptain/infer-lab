<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 520" width="900" height="520" role="img" aria-label="标准 Qwen3-8B 稠密模型 DP=2 部署的主循环：两个 DP 副本各自拥有完整的权重、独立输入队列、独立 Scheduler 与独立 18 MiB/块 KV 池。前向与采样全程无跨 DP 组集合通信；当副本 0 在跑请求而副本 1 队列为空时，副本 1 直接阻塞休眠等待新请求，0 次 dummy batch 陪跑、0 次跨组宽度对齐。">
  <title>标准 Qwen3-8B 稠密模型 DP=2 部署的主循环：两个 DP 副本各自拥有完整的权重、独立输入队列、独立 Scheduler 与独立 18 MiB/块 KV 池。前向与采样全程无跨 DP 组集合通信；当副本 0 在跑请求而副本 1 队列为空时，副本 1 直接阻塞休眠等待新请求，0 次 dummy batch 陪跑、0 次跨组宽度对齐。</title>
  <defs><marker id="data-parallel-loop-qwen3-ah-token" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="var(--color-token, #087f73)"/></marker><marker id="data-parallel-loop-qwen3-ah-ink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="var(--color-ink, #17211f)"/></marker></defs>
  <rect x="24" y="132" width="404" height="326" rx="16" fill="none" stroke="var(--color-line-strong, #b8bcb5)" stroke-width="1.5"/>
  <text x="40" y="120" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="15" font-weight="700" fill="var(--color-ink, #17211f)">DP 副本 0（独立 EngineCore 0 + Worker 0）</text>
  <rect x="472" y="132" width="404" height="326" rx="16" fill="none" stroke="var(--color-line-strong, #b8bcb5)" stroke-width="1.5"/>
  <text x="488" y="120" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="15" font-weight="700" fill="var(--color-ink, #17211f)">DP 副本 1（独立 EngineCore 1 + Worker 1）</text>
  <path d="M450 132 L450 458" fill="none" stroke="var(--color-ink-muted, #66716d)" stroke-width="1.4" stroke-dasharray="6 5"/>
  <path d="M360 98 L360 116 L226 116 L226 168" fill="none" stroke="var(--color-token, #087f73)" stroke-width="1.4" marker-end="url(#data-parallel-loop-qwen3-ah-token)"/>
  <path d="M540 98 L540 116 L674 116 L674 168" fill="none" stroke="var(--color-token, #087f73)" stroke-width="1.4" marker-end="url(#data-parallel-loop-qwen3-ah-token)"/>
  <path d="M226 222 L226 246" fill="none" stroke="var(--color-ink, #17211f)" stroke-width="1.4" marker-end="url(#data-parallel-loop-qwen3-ah-ink)"/>
  <path d="M226 300 L226 324" fill="none" stroke="var(--color-ink, #17211f)" stroke-width="1.4" marker-end="url(#data-parallel-loop-qwen3-ah-ink)"/>
  <path d="M226 378 L226 392" fill="none" stroke="var(--color-token, #087f73)" stroke-width="1.4" marker-end="url(#data-parallel-loop-qwen3-ah-token)"/>
  <path d="M674 222 L674 246" fill="none" stroke="var(--color-ink, #17211f)" stroke-width="1.4" marker-end="url(#data-parallel-loop-qwen3-ah-ink)"/>
  <path d="M674 300 L674 324" fill="none" stroke="var(--color-ink, #17211f)" stroke-width="1.4" marker-end="url(#data-parallel-loop-qwen3-ah-ink)"/>
  <path d="M674 378 L674 392" fill="none" stroke="var(--color-ink, #17211f)" stroke-width="1.4" stroke-dasharray="7 5" marker-end="url(#data-parallel-loop-qwen3-ah-ink)"/>
  <rect x="260" y="44" width="380" height="54" rx="8" fill="var(--color-token-soft, #ddf4ef)" stroke="var(--color-token, #087f73)" stroke-width="1.4"/>
  <text x="450" y="67" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="14" font-weight="700" fill="var(--color-ink, #17211f)" text-anchor="middle">前端 API Server / DP 路由</text>
  <text x="450" y="86" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="13" font-weight="400" fill="#065f56" text-anchor="middle">按各副本负载把新请求塞进对应队列</text>
  <rect x="48" y="168" width="356" height="54" rx="8" fill="var(--color-control-soft, #f1efe8)" stroke="var(--color-control, #66716d)" stroke-width="1.4"/>
  <text x="226" y="191" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="14" font-weight="700" fill="var(--color-ink, #17211f)" text-anchor="middle">独立队列 0 + Scheduler 0</text>
  <text x="226" y="210" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="13" font-weight="400" fill="var(--color-ink-muted, #66716d)" text-anchor="middle">只排本副本的在途请求</text>
  <rect x="48" y="246" width="356" height="54" rx="8" fill="var(--color-kv-soft, #e8edff)" stroke="var(--color-kv, #4c65b6)" stroke-width="1.4"/>
  <text x="226" y="269" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="14" font-weight="700" fill="var(--color-ink, #17211f)" text-anchor="middle">独立 BlockPool 0（18 MiB/块）</text>
  <text x="226" y="288" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="13" font-weight="400" fill="#3a4f93" text-anchor="middle">本副本独自借还与前缀复用</text>
  <rect x="48" y="324" width="356" height="54" rx="8" fill="var(--color-weight-soft, #fff4cf)" stroke="var(--color-weight, #c78300)" stroke-width="1.4"/>
  <text x="226" y="347" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="14" font-weight="700" fill="var(--color-ink, #17211f)" text-anchor="middle">本副本独立前向与采样</text>
  <text x="226" y="366" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="13" font-weight="400" fill="#936300" text-anchor="middle">36 层 Qwen3-8B 完整权重，无需对齐他组</text>
  <rect x="48" y="392" width="356" height="48" rx="8" fill="var(--color-control-soft, #f1efe8)" stroke="var(--color-line-strong, #b8bcb5)" stroke-width="1.4"/>
  <text x="226" y="421" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="14" font-weight="700" fill="var(--color-ink, #17211f)" text-anchor="middle">新 token 直接回传前端</text>
  <rect x="496" y="168" width="356" height="54" rx="8" fill="var(--color-control-soft, #f1efe8)" stroke="var(--color-control, #66716d)" stroke-width="1.4"/>
  <text x="674" y="191" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="14" font-weight="700" fill="var(--color-ink, #17211f)" text-anchor="middle">独立队列 1 + Scheduler 1</text>
  <text x="674" y="210" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="13" font-weight="400" fill="var(--color-ink-muted, #66716d)" text-anchor="middle">各自节奏运行，不与副本 0 锁步</text>
  <rect x="496" y="246" width="356" height="54" rx="8" fill="var(--color-kv-soft, #e8edff)" stroke="var(--color-kv, #4c65b6)" stroke-width="1.4"/>
  <text x="674" y="269" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="14" font-weight="700" fill="var(--color-ink, #17211f)" text-anchor="middle">独立 BlockPool 1（18 MiB/块）</text>
  <text x="674" y="288" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="13" font-weight="400" fill="#3a4f93" text-anchor="middle">显存池与块表互不共享</text>
  <rect x="496" y="324" width="356" height="54" rx="8" fill="var(--color-control-soft, #f1efe8)" stroke="var(--color-line-strong, #b8bcb5)" stroke-width="1.4"/>
  <text x="674" y="347" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="14" font-weight="700" fill="var(--color-ink, #17211f)" text-anchor="middle">有请求独立算 / 无请求阻塞等</text>
  <text x="674" y="366" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="13" font-weight="400" fill="var(--color-ink-muted, #66716d)" text-anchor="middle">空闲时停在输入队列上，0 次 dummy batch</text>
  <rect x="496" y="392" width="356" height="48" rx="8" fill="var(--color-surface, #fbfaf6)" stroke="var(--color-comm, #9a4b86)" stroke-opacity="0.45" stroke-width="1.3" stroke-dasharray="5 4"/>
  <text x="674" y="421" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="13" font-weight="400" fill="#7a3a6a" text-anchor="middle">0 次跨 DP 组 All-Reduce 或波次同步</text>
  <text x="450" y="18" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="13.5" font-weight="700" fill="var(--color-ink, #17211f)" text-anchor="middle">Qwen3-8B 稠密数据并行（DP=2）：双独立副本吞吐翻倍，零陪跑开销</text>
  <text x="450" y="494" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="13.5" font-weight="400" fill="var(--color-ink-muted, #66716d)" text-anchor="middle" font-style="italic">对比：仅当 MoE 模型开启跨 DP 组的 EP 共享专家池时，空闲 DP 组才需跑 execute_dummy_batch 陪跑通信</text>
</svg>
