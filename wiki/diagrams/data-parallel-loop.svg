<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 790" width="900" height="790" role="img" aria-label="固定旧 GLM 部署中，一个 MoE DP 组的 EngineCore 每转一圈做什么。本地没执行请求、但本地仍有未完成请求或全局还在运行时，执行 dummy batch；本地起点为 4 个 token，是否补到其他组宽度按图模式及补齐条件决定。每 32 圈检查请求与暂停共识，都无活且没有待达成共识时结束这一波。rc2 默认间隔为 16 且第 1 步也检查，不能套用图中旧值；dummy 的 attention 等分支可能简化，非同宽真实请求的耗时承诺。">
  <title>固定旧 GLM 部署中，一个 MoE DP 组的 EngineCore 每转一圈做什么。本地没执行请求、但本地仍有未完成请求或全局还在运行时，执行 dummy batch；本地起点为 4 个 token，是否补到其他组宽度按图模式及补齐条件决定。每 32 圈检查请求与暂停共识，都无活且没有待达成共识时结束这一波。rc2 默认间隔为 16 且第 1 步也检查，不能套用图中旧值；dummy 的 attention 等分支可能简化，非同宽真实请求的耗时承诺。</title>
  <defs><marker id="data-parallel-loop-ah-ink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="var(--color-ink, #17211f)"/></marker></defs>
  <path d="M450 90 L450 120" fill="none" stroke="var(--color-ink, #17211f)" stroke-width="1.4" marker-end="url(#data-parallel-loop-ah-ink)"/>
  <path d="M450 170 L450 200" fill="none" stroke="var(--color-ink, #17211f)" stroke-width="1.4" marker-end="url(#data-parallel-loop-ah-ink)"/>
  <path d="M450 244 L450 284" fill="none" stroke="var(--color-ink, #17211f)" stroke-width="1.4" marker-end="url(#data-parallel-loop-ah-ink)"/>
  <path d="M650 222 L690 222 L690 504 L650 504" fill="none" stroke="var(--color-ink, #17211f)" stroke-width="1.4" marker-end="url(#data-parallel-loop-ah-ink)"/>
  <path d="M250 312 L200 312" fill="none" stroke="var(--color-ink, #17211f)" stroke-width="1.4" marker-end="url(#data-parallel-loop-ah-ink)"/>
  <path d="M115 288 L115 74 L250 74" fill="none" stroke="var(--color-ink, #17211f)" stroke-width="1.4" marker-end="url(#data-parallel-loop-ah-ink)"/>
  <path d="M450 340 L450 380" fill="none" stroke="var(--color-ink, #17211f)" stroke-width="1.4" marker-end="url(#data-parallel-loop-ah-ink)"/>
  <path d="M450 436 L450 476" fill="none" stroke="var(--color-ink, #17211f)" stroke-width="1.4" marker-end="url(#data-parallel-loop-ah-ink)"/>
  <path d="M450 532 L450 572" fill="none" stroke="var(--color-ink, #17211f)" stroke-width="1.4" marker-end="url(#data-parallel-loop-ah-ink)"/>
  <path d="M250 594 L16 594 L16 56 L250 56" fill="none" stroke="var(--color-ink, #17211f)" stroke-width="1.4" marker-end="url(#data-parallel-loop-ah-ink)"/>
  <path d="M450 616 L450 656" fill="none" stroke="var(--color-ink, #17211f)" stroke-width="1.4" marker-end="url(#data-parallel-loop-ah-ink)"/>
  <path d="M650 684 L880 684 L880 65 L650 65" fill="none" stroke="var(--color-ink, #17211f)" stroke-width="1.4" marker-end="url(#data-parallel-loop-ah-ink)"/>
  <rect x="250" y="40" width="400" height="50" rx="8" fill="var(--color-surface-sunken, #ece9df)" stroke="var(--color-ink, #17211f)" stroke-width="1.5"/>
  <text x="450" y="61" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="14" font-weight="700" fill="var(--color-ink, #17211f)" text-anchor="middle">处理输入队列</text>
  <text x="450" y="80" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="13" font-weight="400" fill="var(--color-ink, #17211f)" text-anchor="middle">第 1 站送来的请求、唤醒消息都从这里进</text>
  <rect x="250" y="120" width="400" height="50" rx="8" fill="var(--color-weight, #c78300)" stroke="var(--color-ink, #17211f)" stroke-width="1.5"/>
  <text x="450" y="141" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="14" font-weight="700" fill="var(--color-ink-inverse, #ffffff)" text-anchor="middle">调度并执行一步（主线第 2–7 站）</text>
  <text x="450" y="160" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="13" font-weight="400" fill="var(--color-ink-inverse, #ffffff)" text-anchor="middle">有可算的请求时，第 3 站里先和对面对齐宽度</text>
  <rect x="250" y="200" width="400" height="44" rx="8" fill="var(--color-surface-sunken, #ece9df)" stroke="var(--color-ink, #17211f)" stroke-width="1.5"/>
  <text x="450" y="227" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="14" font-weight="700" fill="var(--color-ink, #17211f)" text-anchor="middle">这一步本地执行了吗？</text>
  <rect x="250" y="284" width="400" height="56" rx="8" fill="var(--color-surface-sunken, #ece9df)" stroke="var(--color-ink, #17211f)" stroke-width="1.5"/>
  <text x="450" y="308" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="14" font-weight="700" fill="var(--color-ink, #17211f)" text-anchor="middle">本地还有请求，或全局仍在运行？</text>
  <text x="450" y="327" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="13" font-weight="400" fill="var(--color-ink, #17211f)" text-anchor="middle">看全局运行标志</text>
  <rect x="30" y="288" width="170" height="48" rx="8" fill="var(--color-surface-sunken, #ece9df)" stroke="var(--color-ink, #17211f)" stroke-width="1.5"/>
  <text x="115" y="317" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="14" font-weight="700" fill="var(--color-ink, #17211f)" text-anchor="middle">空转，不进前向</text>
  <rect x="250" y="380" width="400" height="56" rx="8" fill="var(--color-control, #66716d)" stroke="var(--color-ink, #17211f)" stroke-width="1.5"/>
  <text x="450" y="404" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="14" font-weight="700" fill="var(--color-ink-inverse, #ffffff)" text-anchor="middle">跑一次 dummy batch</text>
  <text x="450" y="423" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="13" font-weight="400" fill="var(--color-ink-inverse, #ffffff)" text-anchor="middle">本地准备 4 个 token，按执行条件补齐</text>
  <rect x="250" y="476" width="400" height="56" rx="8" fill="var(--color-comm, #9a4b86)" stroke="var(--color-ink, #17211f)" stroke-width="1.5"/>
  <text x="450" y="500" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="14" font-weight="700" fill="var(--color-ink-inverse, #ffffff)" text-anchor="middle">第 32、64、96……圈：一次 All-Reduce</text>
  <text x="450" y="519" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="13" font-weight="400" fill="var(--color-ink-inverse, #ffffff)" text-anchor="middle">两组交换「本地还有没有没做完的请求」</text>
  <rect x="250" y="572" width="400" height="44" rx="8" fill="var(--color-surface-sunken, #ece9df)" stroke="var(--color-ink, #17211f)" stroke-width="1.5"/>
  <text x="450" y="599" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="14" font-weight="700" fill="var(--color-ink, #17211f)" text-anchor="middle">无活且无待达成的暂停共识？</text>
  <rect x="250" y="656" width="400" height="56" rx="8" fill="var(--color-control, #66716d)" stroke="var(--color-ink, #17211f)" stroke-width="1.5"/>
  <text x="450" y="680" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="14" font-weight="700" fill="var(--color-ink-inverse, #ffffff)" text-anchor="middle">两组结束本波，wave 加 1</text>
  <text x="450" y="699" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="13" font-weight="400" fill="var(--color-ink-inverse, #ffffff)" text-anchor="middle">自然空闲可唤醒；运维暂停需显式恢复</text>
  <text x="450" y="18" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="13.5" font-weight="700" fill="var(--color-ink, #17211f)" text-anchor="middle">一个 DP 组的引擎 · 每转一圈</text>
  <text x="462" y="268" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="13.5" font-weight="400" fill="var(--color-ink, #17211f)">否</text>
  <text x="706" y="214" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="13.5" font-weight="400" fill="var(--color-ink, #17211f)">是</text>
  <text x="212" y="304" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="13.5" font-weight="400" fill="var(--color-ink, #17211f)">否</text>
  <text x="462" y="364" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="13.5" font-weight="400" fill="var(--color-ink, #17211f)">是</text>
  <text x="220" y="586" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="13.5" font-weight="400" fill="var(--color-ink, #17211f)">否</text>
  <text x="462" y="642" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="13.5" font-weight="400" fill="var(--color-ink, #17211f)">是</text>
  <text x="450" y="764" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="13.5" font-weight="400" fill="var(--color-ink-muted, #66716d)" text-anchor="middle" font-style="italic">非 MoE 模型的 DP 组按 DP=1 各跑各的，不陪跑。</text>
</svg>
