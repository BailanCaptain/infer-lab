layout: figure
id: data-parallel-loop
caption: 一个 DP 组的 EngineCore 每转一圈做什么。本地没算到东西、而全局还在运行时，它自己决定跑一次 dummy batch；每张卡按一条 decode 请求的形状准备 4 个 token，前向前照常和对面对齐宽度。每 32 圈两组交换一次「还有没有活」，都说没有才一起暂停，等 DP coordinator 广播唤醒消息再一起醒来。只有 MoE 模型的 DP 组走这条循环。
size: [900, 790]
items:
  - { at: [250, 40], size: [400, 50], text: 处理输入队列, sub: 第 1 站送来的请求、唤醒消息都从这里进, style: plain }
  - { at: [250, 120], size: [400, 50], text: 调度并执行一步（主线第 2–7 站）, sub: 有可算的请求时，第 3 站里先和对面对齐宽度, tone: weight }
  - { at: [250, 200], size: [400, 44], text: 这一步本地执行了吗？, style: plain }
  - { at: [250, 284], size: [400, 56], text: 本地还有请求，或全局仍在运行？, sub: 看全局运行标志, style: plain }
  - { at: [30, 288], size: [170, 48], text: 空转，不进前向, style: plain }
  - { at: [250, 380], size: [400, 56], text: 跑一次 dummy batch, sub: 每张卡本地准备 4 个 token，对齐后按对面宽度跑, tone: control }
  - { at: [250, 476], size: [400, 56], text: 第 32、64、96……圈：一次 All-Reduce, sub: 两组交换「本地还有没有没做完的请求」, tone: comm }
  - { at: [250, 572], size: [400, 44], text: 两组都没有活了？, style: plain }
  - { at: [250, 656], size: [400, 56], text: 两组一起暂停，wave 加 1, sub: 新请求到来时由 DP coordinator 叫醒, tone: control }
