layout: figure
id: data-parallel-loop
caption: 固定旧 GLM 部署中，一个 MoE DP 组的 EngineCore 每转一圈做什么。本地没执行请求、但本地仍有未完成请求或全局还在运行时，执行 dummy batch；本地起点为 4 个 token，是否补到其他组宽度按图模式及补齐条件决定。每 32 圈检查请求与暂停共识，都无活且没有待达成共识时结束这一波。rc2 默认间隔为 16 且第 1 步也检查，不能套用图中旧值；dummy 的 attention 等分支可能简化，非同宽真实请求的耗时承诺。
size: [900, 790]
items:
  - { at: [250, 40], size: [400, 50], text: 处理输入队列, sub: 第 1 站送来的请求、唤醒消息都从这里进, style: plain }
  - { at: [250, 120], size: [400, 50], text: 调度并执行一步（主线第 2–7 站）, sub: 有可算的请求时，第 3 站里先和对面对齐宽度, tone: weight }
  - { at: [250, 200], size: [400, 44], text: 这一步本地执行了吗？, style: plain }
  - { at: [250, 284], size: [400, 56], text: 本地还有请求，或全局仍在运行？, sub: 看全局运行标志, style: plain }
  - { at: [30, 288], size: [170, 48], text: 空转，不进前向, style: plain }
  - { at: [250, 380], size: [400, 56], text: 跑一次 dummy batch, sub: 本地准备 4 个 token，按执行条件补齐, tone: control }
  - { at: [250, 476], size: [400, 56], text: 第 32、64、96……圈：一次 All-Reduce, sub: 两组交换「本地还有没有没做完的请求」, tone: comm }
  - { at: [250, 572], size: [400, 44], text: 无活且无待达成的暂停共识？, style: plain }
  - { at: [250, 656], size: [400, 56], text: 两组结束本波，wave 加 1, sub: 自然空闲可唤醒；运维暂停需显式恢复, tone: control }
