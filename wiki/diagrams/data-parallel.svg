<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 350" width="900" height="350" role="img" aria-label="DP=2：注意力每个副本各存一整套，256 个专家却摊到全部 4 颗 NPU 上，所以两个副本每一步都得一起走">
  <title>DP=2：注意力每个副本各存一整套，256 个专家却摊到全部 4 颗 NPU 上，所以两个副本每一步都得一起走</title>
  <defs><marker id="data-parallel-ah-comm" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="var(--color-comm, #9a4b86)"/></marker></defs>
  <rect x="40" y="70" width="390" height="180" rx="16" fill="none" stroke="var(--color-line-strong, #b8bcb5)" stroke-width="1.5"/>
  <text x="56" y="58" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="15" font-weight="700" fill="var(--color-ink, #17211f)">DP rank 0 · 2 颗 NPU</text>
  <rect x="470" y="70" width="390" height="180" rx="16" fill="none" stroke="var(--color-line-strong, #b8bcb5)" stroke-width="1.5"/>
  <text x="486" y="58" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="15" font-weight="700" fill="var(--color-ink, #17211f)">DP rank 1 · 2 颗 NPU</text>
  <path d="M410 200 L490 200" fill="none" stroke="var(--color-comm, #9a4b86)" stroke-width="2.2" marker-end="url(#data-parallel-ah-comm)"/>
  <path d="M490 214 L410 214" fill="none" stroke="var(--color-comm, #9a4b86)" stroke-width="2.2" marker-end="url(#data-parallel-ah-comm)"/>
  <rect x="60" y="92" width="350" height="56" rx="8" fill="var(--color-weight, #c78300)" stroke="var(--color-ink, #17211f)" stroke-width="1.5"/>
  <text x="235" y="125" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="14" font-weight="700" fill="var(--color-ink-inverse, #ffffff)" text-anchor="middle">注意力：一整套</text>
  <rect x="490" y="92" width="350" height="56" rx="8" fill="var(--color-weight, #c78300)" stroke="var(--color-ink, #17211f)" stroke-width="1.5"/>
  <text x="665" y="125" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="14" font-weight="700" fill="var(--color-ink-inverse, #ffffff)" text-anchor="middle">注意力：一整套</text>
  <rect x="60" y="172" width="165" height="56" rx="8" fill="var(--color-weight-soft, #fff4cf)" stroke="var(--color-weight, #c78300)" stroke-opacity="0.4" stroke-width="1.5" stroke-dasharray="5 4"/>
  <rect x="245" y="172" width="165" height="56" rx="8" fill="var(--color-weight-soft, #fff4cf)" stroke="var(--color-weight, #c78300)" stroke-opacity="0.4" stroke-width="1.5" stroke-dasharray="5 4"/>
  <rect x="490" y="172" width="165" height="56" rx="8" fill="var(--color-weight-soft, #fff4cf)" stroke="var(--color-weight, #c78300)" stroke-opacity="0.4" stroke-width="1.5" stroke-dasharray="5 4"/>
  <rect x="675" y="172" width="165" height="56" rx="8" fill="var(--color-weight-soft, #fff4cf)" stroke="var(--color-weight, #c78300)" stroke-opacity="0.4" stroke-width="1.5" stroke-dasharray="5 4"/>
  <path d="M60 270 v8 h780 v-8" fill="none" stroke="var(--color-ink, #17211f)" stroke-width="1.5"/>
  <text x="450" y="300" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="14" font-weight="700" fill="var(--color-ink, #17211f)" text-anchor="middle">256 个专家按编号摊给 4 颗，每颗 64 个</text>
  <text x="40" y="30" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="14" font-weight="700" fill="#065f56">这条请求只进 DP rank 0</text>
  <text x="470" y="30" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="14" font-weight="400" fill="#4d5652">DP rank 1 没活干，每步也陪跑 1 个 token</text>
  <text x="450" y="330" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="13.5" font-weight="400" fill="#7a3a6a" text-anchor="middle">专家层每一步都要跨副本收发</text>
</svg>
