  <text x="78" y="641" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="12.5" font-weight="400" fill="var(--color-ink-muted, #5b6763)">谁缺席谁把全场挂住，所以没活干的 rank 也得空跑一步</text>
