<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 712" width="900" height="712" role="img" aria-label="DP=2：整份模型复制两遍，请求由前端挑一个 rank 送进去；两个 rank 之间有没有绳子拴着，取决于模型是不是 MoE">
  <title>DP=2：整份模型复制两遍，请求由前端挑一个 rank 送进去；两个 rank 之间有没有绳子拴着，取决于模型是不是 MoE</title>
  <rect width="900" height="712" fill="var(--color-surface, #fbfaf6)"/>
  <rect x="20" y="28" width="860" height="116" rx="12" fill="var(--color-surface-sunken, #ece9df)"/>
  <rect x="36" y="42" width="146.2" height="26.5" rx="13.3" fill="var(--color-control, #5b6763)"/><text x="47" y="60.1" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="13.5" font-weight="700" fill="var(--color-ink-inverse, #ffffff)">前端进程 · 只有一份</text>
  <text x="38" y="85" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="12.5" font-weight="400" fill="var(--color-ink-muted, #5b6763)">这条请求归哪个 rank，在这里就定了</text>
  <rect x="20" y="172" width="420" height="230" rx="12" fill="var(--color-kv-soft, #e8edff)"/>
  <rect x="36" y="186" width="91.4" height="26.5" rx="13.3" fill="var(--color-kv, #4c65b6)"/><text x="47" y="204.1" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="13.5" font-weight="700" fill="var(--color-ink-inverse, #ffffff)">DP rank 0</text>
  <text x="38" y="229" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="12.5" font-weight="400" fill="var(--color-ink-muted, #5b6763)">整份权重 + 自己的调度器、自己的 KV 块池</text>
  <rect x="460" y="172" width="420" height="230" rx="12" fill="var(--color-kv-soft, #e8edff)"/>
  <rect x="476" y="186" width="91.4" height="26.5" rx="13.3" fill="var(--color-kv, #4c65b6)"/><text x="487" y="204.1" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="13.5" font-weight="700" fill="var(--color-ink-inverse, #ffffff)">DP rank 1</text>
  <text x="478" y="229" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="12.5" font-weight="400" fill="var(--color-ink-muted, #5b6763)">一模一样的另一整套，不共享任何东西</text>
  <rect x="20" y="440" width="860" height="64" rx="10" fill="var(--color-weight-soft, #fff4cf)"/>
