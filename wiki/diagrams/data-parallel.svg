<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 520" width="900" height="520" role="img" aria-label="两个 DP 组各有自己的队列和调度。新请求只派进组 0；组 1 此刻没有请求，但持有另一半专家（示意 e4–e7），组 0 的 token 在 MoE 层要发过去算。因此组 1 用假输入陪跑同一步，按兼容次序参加 EP 通信；这不要求各卡同一时刻进入或返回。假输入自己的输出丢弃，为组 0 算的专家结果照常送回。">
  <title>两个 DP 组各有自己的队列和调度。新请求只派进组 0；组 1 此刻没有请求，但持有另一半专家（示意 e4–e7），组 0 的 token 在 MoE 层要发过去算。因此组 1 用假输入陪跑同一步，按兼容次序参加 EP 通信；这不要求各卡同一时刻进入或返回。假输入自己的输出丢弃，为组 0 算的专家结果照常送回。</title>
  <defs><marker id="data-parallel-ah-ink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="var(--color-ink, #17211f)"/></marker><marker id="data-parallel-ah-comm" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="var(--color-comm, #9a4b86)"/></marker></defs>
  <rect x="30" y="136" width="390" height="226" rx="16" fill="none" stroke="var(--color-line-strong, #b8bcb5)" stroke-width="1.5"/>
  <text x="46" y="124" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="15" font-weight="700" fill="var(--color-ink, #17211f)">DP 组 0 · 自己的队列、调度、KV cache</text>
  <rect x="480" y="136" width="390" height="226" rx="16" fill="none" stroke="var(--color-line-strong, #b8bcb5)" stroke-width="1.5"/>
  <text x="496" y="124" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="15" font-weight="700" fill="var(--color-ink, #17211f)">DP 组 1 · 此刻没有请求</text>
  <path d="M450 90 L450 112 L225 112 L225 136" fill="none" stroke="var(--color-ink, #17211f)" stroke-width="1.4" marker-end="url(#data-parallel-ah-ink)"/>
  <path d="M400 312 L500 312" fill="none" stroke="var(--color-comm, #9a4b86)" stroke-width="2.2" marker-end="url(#data-parallel-ah-comm)"/>
  <path d="M500 330 L400 330" fill="none" stroke="var(--color-comm, #9a4b86)" stroke-width="2.2" marker-end="url(#data-parallel-ah-comm)"/>
  <path d="M225 362 L225 424" fill="none" stroke="var(--color-ink, #17211f)" stroke-width="1.4" marker-end="url(#data-parallel-ah-ink)"/>
  <path d="M675 362 L675 424" fill="none" stroke="var(--color-ink, #17211f)" stroke-width="1.4" marker-end="url(#data-parallel-ah-ink)"/>
  <rect x="300" y="36" width="300" height="54" rx="8" fill="var(--color-control, #66716d)" stroke="var(--color-ink, #17211f)" stroke-width="1.5"/>
  <text x="450" y="59" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="14" font-weight="700" fill="var(--color-ink-inverse, #ffffff)" text-anchor="middle">新请求</text>
  <text x="450" y="78" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="13" font-weight="400" fill="var(--color-ink-inverse, #ffffff)" text-anchor="middle">前端比较两组的负载，挑一组</text>
  <rect x="50" y="166" width="110" height="44" rx="8" fill="var(--color-token, #087f73)" stroke="var(--color-ink, #17211f)" stroke-width="1.5"/>
  <text x="105" y="193" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="14" font-weight="700" fill="var(--color-ink-inverse, #ffffff)" text-anchor="middle">请求 A</text>
  <rect x="170" y="166" width="110" height="44" rx="8" fill="var(--color-token, #087f73)" stroke="var(--color-ink, #17211f)" stroke-width="1.5"/>
  <text x="225" y="193" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="14" font-weight="700" fill="var(--color-ink-inverse, #ffffff)" text-anchor="middle">请求 C</text>
  <rect x="290" y="166" width="110" height="44" rx="8" fill="var(--color-token, #087f73)" stroke="var(--color-ink, #17211f)" stroke-width="1.5"/>
  <text x="345" y="193" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="14" font-weight="700" fill="var(--color-ink-inverse, #ffffff)" text-anchor="middle">请求 E</text>
  <rect x="50" y="228" width="350" height="52" rx="8" fill="var(--color-weight, #c78300)" stroke="var(--color-ink, #17211f)" stroke-width="1.5"/>
  <text x="225" y="250" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="14" font-weight="700" fill="var(--color-ink-inverse, #ffffff)" text-anchor="middle">本步前向：算 A、C、E</text>
  <text x="225" y="269" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="13" font-weight="400" fill="var(--color-ink-inverse, #ffffff)" text-anchor="middle">结果交回各自的请求</text>
  <rect x="50" y="298" width="350" height="44" rx="8" fill="var(--color-surface-sunken, #ece9df)" stroke="var(--color-ink, #17211f)" stroke-width="1.5"/>
  <text x="225" y="325" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="14" font-weight="700" fill="var(--color-ink, #17211f)" text-anchor="middle">本组的卡持有专家 e0–e3（示意）</text>
  <rect x="500" y="166" width="350" height="44" rx="8" fill="var(--color-surface-sunken, #ece9df)" stroke="var(--color-ink, #17211f)" stroke-width="1.5"/>
  <text x="675" y="193" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="14" font-weight="700" fill="var(--color-ink, #17211f)" text-anchor="middle">等待队列、运行队列都为空</text>
  <rect x="500" y="228" width="350" height="52" rx="8" fill="var(--color-control, #66716d)" stroke="var(--color-ink, #17211f)" stroke-width="1.5"/>
  <text x="675" y="250" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="14" font-weight="700" fill="var(--color-ink-inverse, #ffffff)" text-anchor="middle">dummy run：用假输入跑同一步</text>
  <text x="675" y="269" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="13" font-weight="400" fill="var(--color-ink-inverse, #ffffff)" text-anchor="middle">假输入自己的输出丢弃</text>
  <rect x="500" y="298" width="350" height="44" rx="8" fill="var(--color-surface-sunken, #ece9df)" stroke="var(--color-ink, #17211f)" stroke-width="1.5"/>
  <text x="675" y="325" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="14" font-weight="700" fill="var(--color-ink, #17211f)" text-anchor="middle">本组的卡持有专家 e4–e7（示意）</text>
  <rect x="30" y="424" width="840" height="60" rx="8" fill="var(--color-comm, #9a4b86)" stroke="var(--color-ink, #17211f)" stroke-width="1.5"/>
  <text x="450" y="450" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="14" font-weight="700" fill="var(--color-ink-inverse, #ffffff)" text-anchor="middle">同一步的 MoE 层 · EP 通信</text>
  <text x="450" y="469" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="13" font-weight="400" fill="var(--color-ink-inverse, #ffffff)" text-anchor="middle">两组按兼容次序参与，后续计算等待所需结果就绪</text>
  <text x="450" y="16" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="13.5" font-weight="700" fill="var(--color-ink, #17211f)" text-anchor="middle">2 个 DP 组 · 只示意分工与同步</text>
  <text x="450" y="305" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="12" font-weight="400" fill="#7a3a6a" text-anchor="middle">token→e6</text>
  <text x="450" y="348" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="12" font-weight="400" fill="#7a3a6a" text-anchor="middle">e6 结果</text>
  <text x="450" y="398" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="13.5" font-weight="400" fill="#7a3a6a" text-anchor="middle">同一步，两组都须参与</text>
  <text x="450" y="506" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="13.5" font-weight="400" fill="var(--color-ink-muted, #66716d)" text-anchor="middle" font-style="italic">示意：选中 e1、e6，e6 在组 1 算完送回</text>
</svg>
