  <text x="78" y="469" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="15" font-weight="700" fill="var(--color-ink, #17211f)">每一步先对齐：全场谁的 token 最多</text>
  <text x="78" y="489" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="12.5" font-weight="400" fill="var(--color-ink-muted, #5b6763)">各 rank 报一个数，all_reduce 取最大值，短的补 padding 补齐</text>
