layout: figure
id: data-parallel
caption: 两个 DP 组各有自己的队列和调度。新请求只派进组 0；组 1 这一刻一条请求都没有，但它的卡持有另一半专家（示意 e4–e7），组 0 的 token 在 MoE 层要发过去算。所以组 1 用一份假输入跑同一步（dummy run），和组 0 一起进出 EP 通信；假输入自己的输出丢弃，为组 0 算的专家结果照常送回。
