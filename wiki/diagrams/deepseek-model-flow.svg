<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 610 460" width="610" height="460" role="img" aria-label="从模型加载走到第 3–5 站执行。分别检查配置、状态所有者和实际输入布局，不把“有模型名字”当成优化已经生效。">
  <title>从模型加载走到第 3–5 站执行。分别检查配置、状态所有者和实际输入布局，不把“有模型名字”当成优化已经生效。</title>
  <defs><marker id="deepseek-model-flow-ah-ink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="var(--color-ink, #17211f)"/></marker></defs>
  <path d="M305 84 L305 128" fill="none" stroke="var(--color-ink, #17211f)" stroke-width="1.4" marker-end="url(#deepseek-model-flow-ah-ink)"/>
  <path d="M305 192 L305 236" fill="none" stroke="var(--color-ink, #17211f)" stroke-width="1.4" marker-end="url(#deepseek-model-flow-ah-ink)"/>
  <path d="M155 300 L155 350" fill="none" stroke="var(--color-ink, #17211f)" stroke-width="1.4" marker-end="url(#deepseek-model-flow-ah-ink)"/>
  <path d="M450 300 L450 350" fill="none" stroke="var(--color-ink, #17211f)" stroke-width="1.4" marker-end="url(#deepseek-model-flow-ah-ink)"/>
  <rect x="30" y="20" width="550" height="64" rx="8" fill="var(--color-surface-sunken, #ece9df)" stroke="var(--color-control, #66716d)" stroke-opacity="0.4" stroke-width="1.5" stroke-dasharray="5 4"/>
  <text x="305" y="48" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="13" font-weight="400" fill="#4d5652" text-anchor="middle">加载配置：确认层数与共享来源</text>
  <text x="305" y="67" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="13" font-weight="400" fill="#4d5652" text-anchor="middle">load_hf_model_config：配置和权重必须匹配</text>
  <rect x="30" y="128" width="550" height="64" rx="8" fill="var(--color-kv-soft, #e8edff)" stroke="var(--color-kv, #4c65b6)" stroke-opacity="0.4" stroke-width="1.5" stroke-dasharray="5 4"/>
  <text x="305" y="156" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="13" font-weight="400" fill="#3a4f93" text-anchor="middle">分配历史：来源层拥有 KV，使用层引用它</text>
  <text x="305" y="175" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="13" font-weight="400" fill="#3a4f93" text-anchor="middle">KVCache：逐层窗口与压缩中间态另记</text>
  <rect x="30" y="236" width="550" height="64" rx="8" fill="var(--color-weight-soft, #fff4cf)" stroke="var(--color-weight, #c78300)" stroke-opacity="0.4" stroke-width="1.5" stroke-dasharray="5 4"/>
  <text x="305" y="264" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="13" font-weight="400" fill="#936300" text-anchor="middle">第 3–5 站：在后半边界核对实际位置</text>
  <text x="305" y="283" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="13" font-weight="400" fill="#936300" text-anchor="middle">compact_yoco_boundary：教学例 0–99 → 96–99</text>
  <rect x="20" y="350" width="275" height="80" rx="8" fill="var(--color-token, #087f73)" stroke="var(--color-ink, #17211f)" stroke-width="1.5"/>
  <text x="157.5" y="386" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="14" font-weight="700" fill="var(--color-ink-inverse, #ffffff)" text-anchor="middle">Prefill：100 行 → 4 行</text>
  <text x="157.5" y="405" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="13" font-weight="400" fill="var(--color-ink-inverse, #ffffff)" text-anchor="middle">行数缩短，再看设备耗时是否下降</text>
  <rect x="315" y="350" width="275" height="80" rx="8" fill="var(--color-token-soft, #ddf4ef)" stroke="var(--color-token, #087f73)" stroke-opacity="0.4" stroke-width="1.5" stroke-dasharray="5 4"/>
  <text x="452.5" y="386" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="13" font-weight="400" fill="#065f56" text-anchor="middle">Decode：新位置走完全部层</text>
  <text x="452.5" y="405" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="13" font-weight="400" fill="#065f56" text-anchor="middle">继续读取共享历史和各层窗口</text>
</svg>
