<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 524" width="900" height="524" role="img" aria-label="DeepSeek-V4.1-Flash 三道优化生效核验关卡：配置来源映射、双轨缓存分账与后半边界截断" font-family="var(--font-sans)">
<title>DeepSeek-V4.1-Flash 优化生效三道核验关卡：配置映射 → 缓存分账 → 后半边界截断与回放路径</title>
<desc>依次核对 load_hf_model_config 共享来源层映射、Block KV 与 State Cache 所有权分账，以及同一 0..99 教学标尺下 Prefill 后半由 100 行收紧为 96..99（4 行），标明 DeepInfer 对照点 compact_yoco_boundary 与昇腾固定 main MRV2 回放层路径。</desc>
<defs>
  <marker id="dm-ctrl" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
    <path d="M1 1.5L8.5 5L1 8.5Z" fill="#66716d"/>
  </marker>
  <marker id="dm-teal" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
    <path d="M1 1.5L8.5 5L1 8.5Z" fill="#087f73"/>
  </marker>
</defs>

<text x="18" y="30" font-size="16" font-weight="700" fill="#17211f">DeepSeek-V4.1-Flash 三道生效核验关卡（不把“模型名一致”当成优化已开启）</text>

<!-- Checkpoint 1: Config & Shared KV Source Map -->
<rect x="14" y="44" width="872" height="114" rx="10" fill="#fbfaf6" stroke="#d8d8cf" stroke-width="1.3"/>
<circle cx="36" cy="67" r="11" fill="#c78300"/>
<text x="36" y="71.5" text-anchor="middle" font-size="12.5" font-weight="700" fill="#ffffff">1</text>
<text x="54" y="72" font-size="14.5" font-weight="700" fill="#17211f">关卡 ① 加载配置与跨层来源映射（load_hf_model_config）</text>
<rect x="28" y="86" width="444" height="58" rx="7" fill="#ffffff" stroke="#c78300" stroke-width="1.2"/>
<g font-size="12" font-weight="700" text-anchor="middle">
  <rect x="40" y="96" width="86" height="36" rx="4" fill="#ece9df" stroke="#d8d8cf"/>
  <text x="83" y="118.5" fill="#4d5652">L0..1 仅SWA</text>
  <rect x="134" y="96" width="154" height="36" rx="4" fill="#fff4cf" stroke="#c78300"/>
  <text x="211" y="118.5" fill="#936300">前半源 L2 · L8 · L14 (2×压)</text>
  <rect x="296" y="96" width="164" height="36" rx="4" fill="#dce4fc" stroke="#4c65b6"/>
  <text x="378" y="118.5" fill="#3a4f93">后半源 L20 → L21..39 共享</text>
</g>
<rect x="490" y="86" width="382" height="58" rx="7" fill="#fff4cf" stroke="#c78300" stroke-width="1.2"/>
<text x="504" y="109" font-size="12.5" font-weight="700" fill="#936300">核验点：确认 40 层前后分界与 _source_map 映射</text>
<text x="504" y="131" font-size="12" fill="#4d5652">检查 dtype、KV 头数=1、量化与缩放格式严格匹配权重</text>

<!-- Checkpoint 2: Dual-Track Memory Ownership -->
<rect x="14" y="174" width="872" height="120" rx="10" fill="#fbfaf6" stroke="#d8d8cf" stroke-width="1.3"/>
<circle cx="36" cy="197" r="11" fill="#4c65b6"/>
<text x="36" y="201.5" text-anchor="middle" font-size="12.5" font-weight="700" fill="#ffffff">2</text>
<text x="54" y="202" font-size="14.5" font-weight="700" fill="#17211f">关卡 ② 显存双轨所有权分账：来源层持有全局 KV，每请求独占运行态</text>
<rect x="28" y="216" width="414" height="66" rx="7" fill="#e8edff" stroke="#4c65b6" stroke-width="1.2"/>
<text x="42" y="239" font-size="12.5" font-weight="700" fill="#3a4f93">分页全局 Block KV（仅 4 个来源层分配）</text>
<text x="42" y="262" font-size="12" fill="#4d5652">主 KV 288B + 索引 K 68B；消费层按指针引用不重复分配</text>
<rect x="460" y="216" width="412" height="66" rx="7" fill="#f7e7f2" stroke="#9a4b86" stroke-width="1.2"/>
<text x="474" y="239" font-size="12.5" font-weight="700" fill="#7a3a6a">每请求独占 State Cache（不跨请求共享）</text>
<text x="474" y="262" font-size="12" fill="#4d5652">各层 SWA 滑窗环 + 压缩中间态 + 投机回退槽（另核页对齐）</text>

<!-- Checkpoint 3: YOCO Boundary Compaction & Replay Path -->
<rect x="14" y="310" width="872" height="200" rx="10" fill="#fbfaf6" stroke="#087f73" stroke-width="1.3"/>
<circle cx="36" cy="333" r="11" fill="#087f73"/>
<text x="36" y="337.5" text-anchor="middle" font-size="12.5" font-weight="700" fill="#ffffff">3</text>
<text x="54" y="338" font-size="14.5" font-weight="700" fill="#17211f">关卡 ③ 第 3–5 站后半输入收紧（同一 0..99 教学标尺）与跨实现对照点</text>

<rect x="28" y="352" width="490" height="144" rx="7" fill="#ddf4ef" stroke="#087f73" stroke-width="1.2"/>
<text x="42" y="374" font-size="13" font-weight="700" fill="#065f56">Prefill 同一 100 位置标尺：100 行 → 仅保留末尾 4 行</text>
<rect x="42" y="386" width="154" height="30" rx="5" fill="#fff4cf" stroke="#c78300" stroke-width="1.1"/>
<text x="119" y="405.5" text-anchor="middle" font-size="12" font-weight="700" fill="#936300">前半 0..99 (100 行)</text>
<line x1="198" y1="401" x2="220" y2="401" stroke="#087f73" stroke-width="1.6" marker-end="url(#dm-teal)"/>
<rect x="224" y="386" width="134" height="30" rx="5" fill="#ece9df" stroke="#8c8577" stroke-width="1.1" stroke-dasharray="4 2"/>
<text x="291" y="405.5" text-anchor="middle" font-size="12" fill="#66716d">省去 0..95 (96 行)</text>
<rect x="364" y="386" width="142" height="30" rx="5" fill="#ffffff" stroke="#087f73" stroke-width="1.4"/>
<text x="435" y="405.5" text-anchor="middle" font-size="12" font-weight="700" fill="#065f56">留 96..99 (4 行)</text>

<text x="42" y="438" font-size="12" fill="#065f56">• 后半这 4 行同时读取覆盖 0..99 长历史的共享全局 KV</text>
<text x="42" y="460" font-size="12" fill="#4d5652">• 配置条件：实际保留行数由 SWA 窗口（如 128）与投机回退余量决定</text>
<text x="42" y="482" font-size="12" font-weight="700" fill="#8f3229">• 排错：后半仍 100 行 = 截断未开；记成 0..3 = 位置映射异常</text>

<rect x="532" y="352" width="340" height="144" rx="7" fill="#ffffff" stroke="#087f73" stroke-width="1.2"/>
<text x="546" y="374" font-size="13" font-weight="700" fill="#065f56">代码对照点与 Decode 逐词路径</text>
<text x="546" y="399" font-size="12" font-weight="700" fill="#3a4f93">• DeepInfer 对照点：compact_yoco_boundary</text>
<text x="546" y="422" font-size="12" font-weight="700" fill="#7a3a6a">• 昇腾固定 main MRV2：AscendDecoderReplayLayers</text>
<text x="546" y="445" font-size="12" fill="#17211f">• Decode 新位置：仍走完全部 40 层</text>
<text x="546" y="467" font-size="12" fill="#4d5652">• 同时读共享全局 KV 与各层 SWA 滑窗</text>
<text x="546" y="488" font-size="12" fill="#66716d">• 后半快但首字不降 → 查交接与排队</text>

<g fill="none" stroke="#66716d" stroke-width="1.7" marker-end="url(#dm-ctrl)">
  <line x1="450" y1="158" x2="450" y2="172"/>
  <line x1="450" y1="294" x2="450" y2="308"/>
</g>
</svg>
