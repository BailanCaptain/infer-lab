  <text x="540" y="240" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="14" font-weight="400" fill="#3a4f93">各层保存自己的 KV</text>
  <text x="120" y="514" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="14" font-weight="400" fill="var(--color-ink, #17211f)">空白处不做完整后半前向</text>
  <text x="540" y="526" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="14" font-weight="400" fill="var(--color-ink, #17211f)">后半每层用自己的查询读取共享历史</text>
  <text x="540" y="566" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="14" font-weight="400" fill="var(--color-ink, #17211f)">末尾仍逐层计算，另备近期窗口</text>
  <text x="540" y="592" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="14" font-weight="400" fill="var(--color-ink, #17211f)">两类历史齐备后，继续生成新 token</text>
