<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 650" width="880" height="650" role="img" aria-label="四层、六个输入位置的教学缩小模型。绿色格表示该位置经过该层完整计算，蓝色格表示保存的历史。CED 的后半共享前半输出投影出的全局 KV，另让末尾两个位置经过后半准备近似 SWA；空格表示省去完整前向，不表示删除全局历史。新 token 仍经过全部层。">
  <title>四层、六个输入位置的教学缩小模型。绿色格表示该位置经过该层完整计算，蓝色格表示保存的历史。CED 的后半共享前半输出投影出的全局 KV，另让末尾两个位置经过后半准备近似 SWA；空格表示省去完整前向，不表示删除全局历史。新 token 仍经过全部层。</title>
