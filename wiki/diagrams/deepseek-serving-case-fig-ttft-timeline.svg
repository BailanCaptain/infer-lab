<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 450" width="900" height="450" role="img" aria-label="相同缓存命中长度下本机缓存 80 ms 与远端取回 200 ms 的双轨 TTFT 时间线对照图" font-family="var(--font-sans)">
  <title>命中一样多、首字差 120 ms：本机缓存（80 ms）vs 远端取回（200 ms）双轨时间线</title>
  <desc>Two aligned horizontal timelines (0 to 200 ms) with identical 20 ms prefix match and 30 ms P-engine schedule slot: Track A transfer finishes at 25 ms (before the 30 ms schedule slot), so max(30, 25) + 50 = 80 ms TTFT; Track B transfer finishes at 150 ms, so max(30, 150) + 50 = 200 ms TTFT, highlighting the exact 120 ms transfer stall and sub-breakdown of remote read vs H2D queue</desc>
  <defs>
    <marker id="dst-arr-r" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="#b54237"/>
    </marker>
    <marker id="dst-arr-g" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="#66716d"/>
    </marker>
  </defs>

  <text x="14" y="26" font-size="16" font-weight="700" fill="#17211f">相同前缀命中、相同计算耗时（50 ms），为何第二次 TTFT 慢了 120 ms？</text>
  <text x="884" y="26" text-anchor="end" font-size="13.5" fill="#66716d">时间比例尺：1 ms = 3.4 px</text>

  <!-- Scale axis: x = 140 + ms * 3.4 -->
  <!-- 0=140, 20=208, 30=242, 80=412, 150=650, 200=820 -->
  <line x1="140" y1="62" x2="866" y2="62" stroke="#66716d" stroke-width="1.4" marker-end="url(#dst-arr-g)"/>
  <g font-size="13.5" font-family="var(--font-mono)" fill="#4d5652" text-anchor="middle">
    <line x1="140" y1="56" x2="140" y2="68" stroke="#66716d" stroke-width="1.3"/><text x="140" y="50">0 ms</text>
    <line x1="208" y1="56" x2="208" y2="68" stroke="#66716d" stroke-width="1.3"/><text x="208" y="50">20</text>
    <line x1="242" y1="56" x2="242" y2="68" stroke="#087f73" stroke-width="1.6"/><text x="242" y="50" font-weight="700" fill="#065f56">30</text>
    <line x1="412" y1="56" x2="412" y2="68" stroke="#087f73" stroke-width="1.6"/><text x="412" y="50" font-weight="700" fill="#065f56">80 ms</text>
    <line x1="650" y1="56" x2="650" y2="68" stroke="#b54237" stroke-width="1.6"/><text x="650" y="50" font-weight="700" fill="#8f3229">150 ms</text>
    <line x1="820" y1="56" x2="820" y2="68" stroke="#b54237" stroke-width="1.6"/><text x="820" y="50" font-weight="700" fill="#8f3229">200 ms</text>
  </g>

  <!-- Vertical milestone guides -->
  <line x1="208" y1="68" x2="208" y2="254" stroke="#b8bcb5" stroke-width="1.2" stroke-dasharray="4 4"/>
  <line x1="242" y1="68" x2="242" y2="254" stroke="#087f73" stroke-width="1.3" stroke-dasharray="4 4"/>
  <line x1="650" y1="68" x2="650" y2="254" stroke="#b54237" stroke-width="1.3" stroke-dasharray="4 4"/>

  <!-- TRACK A: Local Host Cache (80 ms TTFT) -->
  <text x="14" y="102" font-size="14.5" font-weight="700" fill="#065f56">轨 A · 本机已有缓存</text>
  <text x="14" y="122" font-size="13.5" fill="#66716d">25 ms 进卡（不卡算）</text>

  <!-- 0-20ms match -->
  <rect x="140" y="84" width="68" height="40" rx="4" fill="#ece9df" stroke="#b8bcb5" stroke-width="1.3"/>
  <text x="174" y="109" text-anchor="middle" font-size="13.5" fill="#17211f">匹配</text>
  <!-- 20-25ms H2D (17px) -->
  <rect x="208" y="84" width="17" height="40" rx="3" fill="#e8edff" stroke="#4c65b6" stroke-width="1.3"/>
  <!-- 25-30ms wait for P schedule slot (17px) -->
  <rect x="225" y="84" width="17" height="40" rx="2" fill="#ffffff" stroke="#b8bcb5" stroke-width="1" stroke-dasharray="3 2"/>
  <!-- 30-80ms compute & return (170px) -->
  <rect x="242" y="84" width="170" height="40" rx="5" fill="#ddf4ef" stroke="#087f73" stroke-width="1.5"/>
  <text x="327" y="109" text-anchor="middle" font-size="14" font-weight="700" fill="#065f56">计算 + 返回（50 ms）</text>
  <!-- TTFT A Badge -->
  <rect x="424" y="88" width="174" height="32" rx="6" fill="#ddf4ef" stroke="#087f73" stroke-width="1.4"/>
  <text x="511" y="109" text-anchor="middle" font-size="14" font-weight="700" fill="#065f56">TTFT = 80 ms</text>
  <text x="608" y="109" font-size="13.5" fill="#4d5652">开算 = max(30, 25) = 30 ms</text>

  <!-- TRACK B: Remote 3FS Fetch (200 ms TTFT) -->
  <text x="14" y="178" font-size="14.5" font-weight="700" fill="#8f3229">轨 B · 远端 3FS 取回</text>
  <text x="14" y="198" font-size="13.5" fill="#66716d">150 ms 才到卡</text>

  <!-- 0-20ms match -->
  <rect x="140" y="160" width="68" height="40" rx="4" fill="#ece9df" stroke="#b8bcb5" stroke-width="1.3"/>
  <text x="174" y="185" text-anchor="middle" font-size="13.5" fill="#17211f">匹配</text>
  <!-- 20-150ms remote fetch + H2D (442px) -->
  <rect x="208" y="160" width="442" height="40" rx="5" fill="#fff4cf" stroke="#c78300" stroke-width="1.5"/>
  <text x="429" y="185" text-anchor="middle" font-size="14" font-weight="700" fill="#936300">远端读 3FS + 换入 NPU（20 → 150 ms，共 130 ms）</text>
  <!-- 150-200ms compute & return (170px) -->
  <rect x="650" y="160" width="170" height="40" rx="5" fill="#ddf4ef" stroke="#087f73" stroke-width="1.5"/>
  <text x="735" y="185" text-anchor="middle" font-size="14" font-weight="700" fill="#065f56">计算 + 返回（50 ms）</text>
  <!-- TTFT B label -->
  <text x="828" y="177" font-size="14" font-weight="700" fill="#8f3229">200</text>
  <text x="828" y="196" font-size="13.5" font-weight="700" fill="#8f3229">ms</text>

  <!-- Exact 120 ms Stall Callout Bracket (30ms=242 to 150ms=650) -->
  <path d="M 244 218 L 648 218" fill="none" stroke="#b54237" stroke-width="2" marker-start="url(#dst-arr-r)" marker-end="url(#dst-arr-r)"/>
  <rect x="316" y="206" width="260" height="26" rx="5" fill="#fff0e9" stroke="#b54237" stroke-width="1.3"/>
  <text x="446" y="224" text-anchor="middle" font-size="13.5" font-weight="700" fill="#8f3229">精确停顿 +120 ms（数据未就绪）</text>

  <text x="140" y="250" font-size="13.5" fill="#4d5652">▲ 两条请求均在 20 ms 匹配、30 ms 排到引擎；仅因数据到卡从 25 ms 推迟到 150 ms，开算时刻推迟 120 ms</text>

  <line x1="14" y1="268" x2="886" y2="268" stroke="#b8bcb5" stroke-width="1.4" stroke-dasharray="6 5"/>

  <!-- SUB-BREAKDOWN: Same 150 ms Arrival, Two Distinct Bottlenecks -->
  <text x="14" y="294" font-size="15.5" font-weight="700" fill="#17211f">同为 150 ms 进卡，仍须再拆两段：别把“换入排队”误判成“远端存储慢”</text>

  <!-- Sub-case 1: 20->140 remote read (408px), 140->150 H2D (34px) -->
  <text x="14" y="328" font-size="13.5" font-weight="700" fill="#936300">记录 1 · 查存储网络</text>
  <rect x="208" y="308" width="408" height="30" rx="4" fill="#fff4cf" stroke="#c78300" stroke-width="1.4"/>
  <text x="412" y="328" text-anchor="middle" font-size="13.5" font-weight="700" fill="#936300">远端读到主机（20→140 ms）</text>
  <rect x="616" y="308" width="34" height="30" rx="3" fill="#e8edff" stroke="#4c65b6" stroke-width="1.4"/>
  <text x="662" y="328" font-size="13.5" fill="#4d5652">10 ms 换入 → 150 ms 到卡</text>

  <!-- Sub-case 2: 20->40 remote read (68px), 40->150 H2D queue (374px) -->
  <text x="14" y="368" font-size="13.5" font-weight="700" fill="#3a4f93">记录 2 · 查换入队列</text>
  <rect x="208" y="348" width="68" height="30" rx="4" fill="#fff4cf" stroke="#c78300" stroke-width="1.4"/>
  <text x="242" y="368" text-anchor="middle" font-size="13.5" fill="#936300">40 ms</text>
  <rect x="276" y="348" width="374" height="30" rx="4" fill="#e8edff" stroke="#4c65b6" stroke-width="1.5"/>
  <text x="463" y="368" text-anchor="middle" font-size="13.5" font-weight="700" fill="#3a4f93">主机→NPU 换入与排队（40→150 ms）</text>
  <text x="662" y="368" font-size="13.5" fill="#4d5652">110 ms 换入 → 150 ms 到卡</text>

  <!-- Caveat Strip -->
  <rect x="14" y="394" width="870" height="44" rx="6" fill="#ece9df" stroke="#b8bcb5" stroke-width="1.3"/>
  <text x="28" y="421" font-size="13.5" fill="#17211f">口径边界：本图按“全部数据到齐才开算”演示基础账；真实生产允许逐层搬运与计算重叠，须按各层需要数据的时刻分析</text>
</svg>
