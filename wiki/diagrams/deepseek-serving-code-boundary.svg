<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 530" width="860" height="530" role="img" aria-label="左侧彩色块是固定 DeepInfer 快照中可沿文件阅读的引擎部分；右侧虚线块是还要单独装配、核实的在线系统。箭头仅表示阅读顺序，不表示这些函数严格串行运行。">
