<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 490" width="900" height="490" role="img" aria-label="DeepSeek-V4.1-Flash 异构层栈、4 个全局 KV 来源层、MoE 与主机侧 Engram 分账图" font-family="var(--font-sans)">
  <title>DeepSeek-V4.1-Flash 异构层栈与三笔独立内存账（CED + CSA2 + MoE + Engram）</title>
  <desc>Heterogeneous layer stack of DeepSeek-V4.1-Flash showing CED encoder/decoder split, 4 shared global KV source layers, SWA, MoE, DSpark, and Host DRAM Engram sharing</desc>
  <defs>
    <marker id="ds41-arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="#4d5652"/>
    </marker>
  </defs>

  <text x="16" y="28" font-size="16" font-weight="700" fill="#17211f">① 40 层 CED 语言主干与外围模块：哪些层生产长历史，哪些层跨层复用</text>
  <text x="884" y="28" text-anchor="end" font-size="13.5" fill="#66716d">隐藏宽 5120 · MoE 每层 1 共享 + 384 选 6</text>

  <!-- Vision Encoder box -->
  <rect x="16" y="48" width="140" height="168" rx="8" fill="#ece9df" stroke="#8a928f" stroke-width="1.3"/>
  <text x="86" y="78" text-anchor="middle" font-size="14.5" font-weight="700" fill="#17211f">Vision Encoder</text>
  <text x="86" y="106" text-anchor="middle" font-size="13.5" fill="#4d5652">32 层 · 宽 1024</text>
  <text x="86" y="130" text-anchor="middle" font-size="13.5" fill="#4d5652">patch = 14</text>
  <text x="86" y="156" text-anchor="middle" font-size="13.5" fill="#66716d">独立于 CED</text>
  <text x="86" y="180" text-anchor="middle" font-size="13.5" fill="#66716d">降采样投影入主干</text>

  <line x1="156" y1="132" x2="176" y2="132" stroke="#4d5652" stroke-width="1.5" marker-end="url(#ds41-arr)"/>

  <!-- CED Encoder (L0-19) -->
  <rect x="178" y="48" width="268" height="168" rx="8" fill="#ddf4ef" stroke="#087f73" stroke-width="1.4"/>
  <text x="312" y="74" text-anchor="middle" font-size="14.5" font-weight="700" fill="#065f56">CED 前半（L0–L19 · 20 层）</text>
  <text x="192" y="100" font-size="13.5" fill="#4d5652">• L0–L1：仅 SWA（128 窗）</text>
  <text x="192" y="124" font-size="13.5" fill="#065f56" font-weight="700">• 3 个主 KV 来源：L2 / L8 / L14</text>
  <text x="192" y="148" font-size="13.5" fill="#4d5652">　压缩率 2 → 每 128 位产 64 条</text>
  <text x="192" y="172" font-size="13.5" fill="#4d5652">• Prefill 须处理全部提示词位置</text>
  <text x="192" y="196" font-size="13.5" fill="#065f56">• 前半输出经投影生成全局共享 KV</text>

  <line x1="446" y1="132" x2="466" y2="132" stroke="#4d5652" stroke-width="1.5" marker-end="url(#ds41-arr)"/>

  <!-- CED Decoder (L20-39) -->
  <rect x="468" y="48" width="272" height="168" rx="8" fill="#e8edff" stroke="#4c65b6" stroke-width="1.4"/>
  <text x="604" y="74" text-anchor="middle" font-size="14.5" font-weight="700" fill="#3a4f93">CED 后半（L20–L39 · 20 层）</text>
  <text x="482" y="100" font-size="13.5" fill="#3a4f93" font-weight="700">• 第 4 个主 KV 来源：L20（压缩 1）</text>
  <text x="482" y="124" font-size="13.5" fill="#4d5652">　每 128 位产 128 条，供后半共享</text>
  <text x="482" y="148" font-size="13.5" fill="#4d5652">• 两级稀疏索引：2048 候选 → 512</text>
  <text x="482" y="172" font-size="13.5" fill="#4d5652">• Prefill 仅回放末尾保 SWA 窗口</text>
  <text x="482" y="196" font-size="13.5" fill="#3a4f93">• Decode 全量逐层前向不可跳过</text>

  <line x1="740" y1="132" x2="760" y2="132" stroke="#4d5652" stroke-width="1.5" marker-end="url(#ds41-arr)"/>

  <!-- DSpark -->
  <rect x="762" y="48" width="122" height="168" rx="8" fill="#f7e7f2" stroke="#9a4b86" stroke-width="1.4"/>
  <text x="823" y="78" text-anchor="middle" font-size="14.5" font-weight="700" fill="#7a3a6a">DSpark</text>
  <text x="823" y="106" text-anchor="middle" font-size="13.5" fill="#4d5652">3 个草稿层</text>
  <text x="823" y="130" text-anchor="middle" font-size="13.5" fill="#4d5652">单轮出 5 候选</text>
  <text x="823" y="156" text-anchor="middle" font-size="13.5" fill="#7a3a6a">不计入 40 层</text>
  <text x="823" y="180" text-anchor="middle" font-size="13.5" fill="#66716d">另留回退状态</text>

  <line x1="16" y1="236" x2="884" y2="236" stroke="#b8bcb5" stroke-width="1.4" stroke-dasharray="6 5"/>

  <text x="16" y="266" font-size="16" font-weight="700" fill="#17211f">② 三笔必须分开核对的内存账：绝不把“40 层乘一遍”或把 Engram 混进 KV cache</text>

  <!-- Memory Account 1: Global Block KV -->
  <rect x="16" y="284" width="278" height="188" rx="8" fill="#e8edff" stroke="#4c65b6" stroke-width="1.4"/>
  <text x="30" y="310" font-size="14.5" font-weight="700" fill="#3a4f93">账目 A · 分页 Block KV（仅 4 源）</text>
  <text x="30" y="336" font-size="13.5" fill="#4d5652">• 单条：主 KV 288 B + 索引 K 68 B</text>
  <text x="30" y="360" font-size="13.5" fill="#4d5652">　合计 356 B / 条</text>
  <text x="30" y="384" font-size="13.5" fill="#4d5652">• 128 位条目：3×64 + 1×128 = 320</text>
  <text x="30" y="408" font-size="13.5" font-weight="700" fill="#3a4f93">• 载荷：113,920 B ≈ 890 B/原始位</text>
  <text x="30" y="434" font-size="13.5" fill="#66716d">• 注意：索引计算有 8 源层，但</text>
  <text x="30" y="456" font-size="13.5" fill="#66716d">　索引 K 跟随 4 个主 KV 源层</text>

  <!-- Memory Account 2: Per-request State Cache -->
  <rect x="311" y="284" width="278" height="188" rx="8" fill="#fff4cf" stroke="#c78300" stroke-width="1.4"/>
  <text x="325" y="310" font-size="14.5" font-weight="700" fill="#936300">账目 B · 每请求独立 State Cache</text>
  <text x="325" y="336" font-size="13.5" fill="#4d5652">• 逐层 SWA 窗口：128 位 · 528 B/位</text>
  <text x="325" y="360" font-size="13.5" fill="#4d5652">• 压缩中间态（未满分组累积）</text>
  <text x="325" y="384" font-size="13.5" fill="#4d5652">• DSpark 草稿回退槽与环形缓冲</text>
  <text x="325" y="408" font-size="13.5" font-weight="700" fill="#936300">• 随活跃请求数线性增长，不跨请求</text>
  <text x="325" y="434" font-size="13.5" fill="#66716d">• 生产仅前半 SWA 落主机内存，</text>
  <text x="325" y="456" font-size="13.5" fill="#66716d">　后半在 Decode 侧有界回放重建</text>

  <!-- Memory Account 3: Host Engram -->
  <rect x="606" y="284" width="278" height="188" rx="8" fill="#fff0e9" stroke="#b54237" stroke-width="1.4"/>
  <text x="620" y="310" font-size="14.5" font-weight="700" fill="#8f3229">账目 C · 主机侧 INT8 Engram 表</text>
  <text x="620" y="336" font-size="13.5" fill="#4d5652">• 属模型条件记忆参数，非请求 KV</text>
  <text x="620" y="360" font-size="13.5" fill="#8f3229">• A3 24 头 ÷ 16 逻辑卡 = 1.5 不整除</text>
  <text x="620" y="384" font-size="13.5" fill="#4d5652">• 须同开 cpu_offload +</text>
  <text x="620" y="408" font-size="13.5" fill="#4d5652">　dp_shared_memory + --ipc=host</text>
  <text x="620" y="434" font-size="13.5" font-weight="700" fill="#8f3229">• 本地 4 DP 共享：主机占用 4E → E</text>
  <text x="620" y="456" font-size="13.5" fill="#66716d">• 注意：传输带宽与计算并未合并</text>
</svg>
