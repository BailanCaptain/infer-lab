<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 520" width="900" height="520" role="img" aria-label="主机内存与 NPU HBM 双账隔离及单卡 64 GiB Qwen3-8B 同比例启动预算条与四步冷启动时序" font-family="var(--font-sans)">
  <title>Host DRAM 与 NPU HBM 双账隔离及单卡 64 GiB 同比例预算拆分</title>
  <desc>关联源码：gpu_memory_utilization, kv_cache_memory_bytes, determine_available_memory, _apply_kvpp_memory_budget, _set_pytorch_npu_alloc_env, check_triton_ascend_version_valid, is_uva_available</desc>
  <defs>
    <marker id="dm-a1" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto">
      <path d="M 0 1.5 L 8.5 5 L 0 8.5 z" fill="#c78300"/>
    </marker>
    <marker id="dm-a2" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto">
      <path d="M 0 1.5 L 8.5 5 L 0 8.5 z" fill="#9a4b86"/>
    </marker>
    <marker id="dm-a3" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 1.5 L 8.5 5 L 0 8.5 z" fill="#4d5652"/>
    </marker>
  </defs>

  <!-- Zone 1: Host DRAM vs NPU HBM -->
  <text x="16" y="28" font-size="16" font-weight="700" fill="#17211f">① Host DRAM 与 NPU HBM 双账隔离：权重一次 H2D 常驻，远端映射不增 HBM</text>
  <line x1="14" y1="38" x2="886" y2="38" stroke="#b8bcb5" stroke-width="1.4"/>

  <rect x="14" y="48" width="360" height="176" rx="9" fill="#ece9df" fill-opacity="0.65" stroke="#8a928f" stroke-width="1.5"/>
  <rect x="526" y="48" width="360" height="176" rx="9" fill="#e8edff" fill-opacity="0.55" stroke="#4c65b6" stroke-width="1.5"/>
  <text x="28" y="73" font-size="15" font-weight="700" fill="#17211f">主机侧 Host DRAM（CPU/容器共享）</text>
  <text x="540" y="73" font-size="15" font-weight="700" fill="#3a4f93">设备侧 NPU HBM（逐卡独立记账）</text>

  <g stroke-width="1.3">
    <rect x="28" y="84" width="332" height="38" rx="6" fill="#ffffff" stroke="#b8bcb5"/>
    <rect x="28" y="128" width="332" height="38" rx="6" fill="#ffffff" stroke="#4c65b6"/>
    <rect x="28" y="172" width="332" height="40" rx="6" fill="#fff4cf" stroke="#c78300"/>
    <rect x="540" y="84" width="332" height="38" rx="6" fill="#fff4cf" stroke="#c78300"/>
    <rect x="540" y="128" width="332" height="38" rx="6" fill="#f7e7f2" stroke="#9a4b86"/>
    <rect x="540" y="172" width="332" height="40" rx="6" fill="#ddf4ef" stroke="#087f73"/>
  </g>
  <g font-size="13.5" font-weight="600">
    <text x="40" y="108" fill="#17211f">.safetensors 页缓存 &amp; 加载中 CPU 张量</text>
    <text x="40" y="152" fill="#3a4f93">token 编号 / 请求队列 / 调度块号表</text>
    <text x="40" y="197" fill="#936300">锁页卸载 / UVA（物理仍留主机侧）</text>
    <text x="552" y="108" fill="#936300">本卡权重分片 + 量化后处理布局</text>
    <text x="552" y="152" fill="#7a3a6a">试跑激活峰值 + 工作区 + HCCL 缓冲</text>
    <text x="552" y="197" fill="#065f56">物理 KV 缓存池 + ACLGraph 录图资源</text>
  </g>

  <path d="M 376 103 L 520 103" fill="none" stroke="#c78300" stroke-width="2.2" marker-end="url(#dm-a1)"/>
  <path d="M 376 192 L 520 192" fill="none" stroke="#9a4b86" stroke-width="1.8" stroke-dasharray="5 3" marker-end="url(#dm-a2)"/>
  <g text-anchor="middle">
    <text x="450" y="92" font-size="14" font-weight="700" fill="#936300">H2D 复制</text>
    <text x="450" y="124" font-size="13.5" fill="#66716d">启动一次搬入</text>
    <text x="450" y="144" font-size="13.5" fill="#66716d">推理期权重 0 次</text>
    <text x="450" y="182" font-size="14" font-weight="700" fill="#7a3a6a">UVA / 卸载</text>
    <text x="450" y="213" font-size="13.5" fill="#66716d">跨 PCIe 有代价</text>
  </g>

  <!-- Divider -->
  <line x1="14" y1="238" x2="886" y2="238" stroke="#b8bcb5" stroke-width="1.4" stroke-dasharray="6 4"/>

  <!-- Zone 2: True-Scale 64 GiB Budget Bar (1 GiB = 13.5 px, x=18..882) -->
  <text x="16" y="266" font-size="16" font-weight="700" fill="#17211f">② 同比例 64 GiB 启动显存条（Qwen3-8B BF16 · u = 0.92 → 实例预算 58.88 GiB）</text>

  <!-- Leader callouts above thin segments -->
  <text x="242" y="293" text-anchor="middle" font-size="13.5" font-weight="700" fill="#7a3a6a">试跑峰值 ~2.74 GiB</text>
  <line x1="242" y1="298" x2="242" y2="313" stroke="#9a4b86" stroke-width="1.4"/>

  <text x="846" y="293" text-anchor="end" font-size="13.5" font-weight="700" fill="#8f3229">1 − u 余量 5.12 GiB (8%)</text>
  <line x1="846" y1="298" x2="846" y2="313" stroke="#b54237" stroke-width="1.4"/>

  <!-- Exact scale segments: 15.25*13.5=206, 2.74*13.5=37, 40.88*13.5=552, 5.12*13.5=69 (sum=864) -->
  <rect x="18" y="314" width="206" height="46" rx="4" fill="#fff4cf" stroke="#c78300" stroke-width="1.6"/>
  <rect x="224" y="314" width="37" height="46" fill="#f7e7f2" stroke="#9a4b86" stroke-width="1.6"/>
  <rect x="261" y="314" width="552" height="46" fill="#ddf4ef" stroke="#087f73" stroke-width="1.6"/>
  <rect x="813" y="314" width="69" height="46" rx="4" fill="#fff0e9" stroke="#b54237" stroke-width="1.6"/>

  <!-- Dashed u=0.92 boundary -->
  <line x1="813" y1="306" x2="813" y2="378" stroke="#b54237" stroke-width="1.8" stroke-dasharray="4 3"/>

  <g text-anchor="middle" font-weight="700">
    <text x="121" y="335" font-size="14" fill="#936300">权重 ~15.25 GiB</text>
    <text x="121" y="354" font-size="13.5" font-weight="400" fill="#936300">8.19B BF16</text>
    <text x="537" y="335" font-size="14.5" fill="#065f56">自动预算余量 → KV 池 ~40.88 GiB（占 63.9%）</text>
    <text x="537" y="354" font-size="13.5" font-weight="400" fill="#065f56">18 MiB/块（128 tok）→ 2,324 可用块（扣 1 null_block，零索引器）</text>
    <text x="847" y="342" font-size="13.5" fill="#8f3229">录图</text>
  </g>

  <!-- Ruler under bar -->
  <line x1="18" y1="370" x2="882" y2="370" stroke="#8a928f" stroke-width="1.1"/>
  <g font-family="var(--font-mono)" font-size="13.5" fill="#66716d">
    <text x="18" y="388">0 GiB</text>
    <text x="224" y="388" text-anchor="middle">15.3</text>
    <text x="807" y="388" text-anchor="end" fill="#8f3229" font-weight="700">58.88 (u=0.92)</text>
    <text x="882" y="388" text-anchor="end">64 GiB</text>
  </g>

  <!-- Zone 3: 4-Step Cold-Start Sequence -->
  <text x="16" y="418" font-size="15" font-weight="700" fill="#17211f">③ 冷启动四步顺序（先切 KV 再录图；请求归还块入池复用，已保留显存不即降）</text>

  <rect x="16" y="430" width="198" height="78" rx="7" fill="#fff4cf" stroke="#c78300" stroke-width="1.3"/>
  <text x="28" y="454" font-size="14" font-weight="700" fill="#936300">1. H2D 载入权重</text>
  <text x="28" y="476" font-size="13.5" fill="#4d5652">默认注入 expandable</text>
  <text x="28" y="496" font-size="13.5" fill="#66716d">减碎片但不增总容量</text>

  <line x1="216" y1="469" x2="236" y2="469" stroke="#4d5652" stroke-width="1.7" marker-end="url(#dm-a3)"/>

  <rect x="240" y="430" width="198" height="78" rx="7" fill="#f7e7f2" stroke="#9a4b86" stroke-width="1.3"/>
  <text x="252" y="454" font-size="14" font-weight="700" fill="#7a3a6a">2. profile_run 试跑</text>
  <text x="252" y="476" font-size="13.5" fill="#4d5652">量激活与 HCCL 增量</text>
  <text x="252" y="496" font-size="13.5" fill="#66716d">显式字节下仍须试跑</text>

  <line x1="440" y1="469" x2="460" y2="469" stroke="#4d5652" stroke-width="1.7" marker-end="url(#dm-a3)"/>

  <rect x="464" y="430" width="198" height="78" rx="7" fill="#ddf4ef" stroke="#087f73" stroke-width="1.3"/>
  <text x="476" y="454" font-size="14" font-weight="700" fill="#065f56">3. 切分物理 KV 池</text>
  <text x="476" y="476" font-size="13.5" fill="#4d5652">按剩余预算一次性切</text>
  <text x="476" y="496" font-size="13.5" fill="#66716d">v0.30 叠 offload/KVPP</text>

  <line x1="664" y1="469" x2="684" y2="469" stroke="#4d5652" stroke-width="1.7" marker-end="url(#dm-a3)"/>

  <rect x="688" y="430" width="196" height="78" rx="7" fill="#fff0e9" stroke="#b54237" stroke-width="1.3"/>
  <text x="700" y="454" font-size="14" font-weight="700" fill="#8f3229">4. 录 ACLGraph</text>
  <text x="700" y="476" font-size="13.5" fill="#4d5652">由 1−u 余量支付开销</text>
  <text x="700" y="496" font-size="13.5" fill="#66716d">RL 模式下移除可扩展段</text>
</svg>
