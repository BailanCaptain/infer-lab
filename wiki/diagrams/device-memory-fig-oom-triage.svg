<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 472" width="900" height="472" role="img" aria-label="主机 cgroup 终止与 NPU 显存报错分层排障图" font-family="var(--font-sans)">
<title>主机容器退出（cgroup v2）与设备 HBM 报错分层排障</title>
<desc>init_snapshot, gpu_memory_utilization, get_device_total_memory, _disable_expandable_segments</desc>
<text x="16" y="28" font-size="16" font-weight="700" fill="#8f3229">A. 主机侧：进程被杀或服务变慢（cgroup v2）</text>
<text x="466" y="28" font-size="16" font-weight="700" fill="#3a4f93">B. 设备侧：NPU 显存与分配器报错（HBM）</text>
<path d="M14 38H886M14 328H886" stroke="#b8bcb5" stroke-width="1.4"/>
<rect x="14" y="48" width="424" height="266" rx="10" fill="#fff0e9" stroke="#b54237" stroke-width="1.5"/>
<rect x="462" y="48" width="424" height="266" rx="10" fill="#e8edff" stroke="#4c65b6" stroke-width="1.5"/>
<g stroke-width="1.4">
<rect x="28" y="62" width="396" height="68" rx="7" fill="#ffffff" stroke="#b8bcb5"/>
<rect x="28" y="140" width="396" height="74" rx="7" fill="#fff4cf" stroke="#c78300"/>
<rect x="28" y="224" width="396" height="76" rx="7" fill="#ffffff" stroke="#b54237"/>
<rect x="476" y="62" width="396" height="72" rx="7" fill="#ffffff" stroke="#4c65b6"/>
<rect x="476" y="144" width="396" height="70" rx="7" fill="#ffffff" stroke="#9a4b86"/>
<rect x="476" y="224" width="396" height="76" rx="7" fill="#ffffff" stroke="#c78300"/>
</g>
<g font-size="14" font-weight="700">
<text x="40" y="86" fill="#17211f">① 退出码 137 ≠ 必然 OOM</text>
<text x="40" y="164" fill="#936300">② memory.high（变慢） vs memory.max（强杀）</text>
<text x="40" y="248" fill="#8f3229">③ 嵌套层级核验（勿误读 local）</text>
<text x="488" y="86" fill="#3a4f93">① Free memory ... less than desired</text>
<text x="488" y="168" fill="#7a3a6a">② Error in memory profiling</text>
<text x="488" y="248" fill="#936300">③ 分配器冲突与提前查询拦截</text>
</g>
<g font-size="13.5" fill="#66716d">
<text x="40" y="109">docker kill 发 SIGKILL 亦报 137；先对 PID 与审计</text>
<text x="40" y="187">越 high 仅加强回收节流；触 max 且难回收才杀</text>
<text x="40" y="206">K8s request 管调度，limit 不自动等同 memory.high</text>
<text x="40" y="271">memory.events.local 的 oom_kill 只计归属，</text>
<text x="40" y="291">仍须对照本容器 / 上层控制组 / 整机内核日志</text>
<text x="488" y="109">启动快照空闲量低于目标份额；核卡号与残留进程</text>
<text x="488" y="127">例：期望 0.92 但同卡已被他进程占用部分 HBM</text>
<text x="488" y="191">试跑前后空闲量断言失败；常因并发释放扰乱快照</text>
<text x="488" y="271">True/False 大小写敏感；冲突键需用户自查；</text>
<text x="488" y="291">未初始化 NPU 查总显存抛 NotImplementedError</text>
</g>
<text x="16" y="354" font-size="16" font-weight="700" fill="#17211f">C. 常见误解直辨：可访问地址 ≠ 物理本地显存</text>
<rect x="14" y="366" width="424" height="94" rx="8" fill="#fff0e9" stroke="#b54237" stroke-width="1.4"/>
<rect x="462" y="366" width="424" height="94" rx="8" fill="#ddf4ef" stroke="#087f73" stroke-width="1.4"/>
<text x="28" y="392" font-size="14.5" font-weight="700" fill="#8f3229">✗ 误解：UVA / MemFabric 或多卡相加 = 本卡池</text>
<text x="476" y="392" font-size="14.5" font-weight="700" fill="#065f56">✓ 真相：寻址方式改变，物理介质与链路价仍在</text>
<g font-size="13.5" fill="#17211f">
<text x="28" y="418">• 以为主机注册映射后，数据自动变成 HBM 副本</text>
<text x="28" y="442">• 以为 8 卡总 HBM 可被任意单卡无限制分配</text>
<text x="476" y="418">• V2 UVA 需 pinned_mem_register:True 且避 3.2.1/3.2.2</text>
<text x="476" y="442">• 本地分配、远端访问与实际复制必须分别记账</text>
</g>
</svg>
