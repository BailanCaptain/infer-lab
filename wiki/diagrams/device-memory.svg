<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 290" width="860" height="290" role="img" aria-label="同一段权重 W 从主机复制到一张卡；两份数据各占本侧容量，复制不等于释放源数据">
  <title>同一段权重 W 从主机复制到一张卡；两份数据各占本侧容量，复制不等于释放源数据</title>
  <defs><marker id="device-memory-ah-comm" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="var(--color-comm, #9a4b86)"/></marker><marker id="device-memory-ah-weight" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="var(--color-weight, #c78300)"/></marker></defs>
  <rect x="35" y="65" width="270" height="160" rx="16" fill="none" stroke="var(--color-line-strong, #b8bcb5)" stroke-width="1.5"/>
  <text x="51" y="53" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="15" font-weight="700" fill="var(--color-ink, #17211f)">主机内存 · CPU 一侧</text>
  <rect x="475" y="65" width="270" height="160" rx="16" fill="none" stroke="var(--color-line-strong, #b8bcb5)" stroke-width="1.5"/>
  <text x="491" y="53" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="15" font-weight="700" fill="var(--color-ink, #17211f)">设备内存 · 一张卡</text>
  <path d="M305 150 L475 150" fill="none" stroke="var(--color-comm, #9a4b86)" stroke-width="2.2" marker-end="url(#device-memory-ah-comm)"/>
  <path d="M745 150 L817 150" fill="none" stroke="var(--color-weight, #c78300)" stroke-width="1.4" marker-end="url(#device-memory-ah-weight)"/>
  <rect x="100" y="115" width="140" height="65" fill="var(--color-weight-soft, #fff4cf)" stroke="var(--color-weight, #c78300)" stroke-width="1.4"/>
  <path d="M128 115v65M156 115v65M184 115v65M212 115v65M100 136.7h140M100 158.3h140" stroke="var(--color-weight, #c78300)" stroke-opacity="0.35" stroke-width="1" fill="none"/>
  <text x="170" y="200" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="13" font-weight="400" fill="#936300" text-anchor="middle">权重 W</text>
  <rect x="540" y="115" width="140" height="65" fill="var(--color-weight-soft, #fff4cf)" stroke="var(--color-weight, #c78300)" stroke-width="1.4"/>
  <path d="M568 115v65M596 115v65M624 115v65M652 115v65M540 136.7h140M540 158.3h140" stroke="var(--color-weight, #c78300)" stroke-opacity="0.35" stroke-width="1" fill="none"/>
  <text x="610" y="200" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="13" font-weight="400" fill="#936300" text-anchor="middle">权重 W</text>
  <text x="390" y="123" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="15" font-weight="400" fill="#7a3a6a" text-anchor="middle">复制</text>
  <text x="825" y="132" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="15" font-weight="400" fill="var(--color-ink, #17211f)" text-anchor="middle">NPU</text>
  <text x="825" y="177" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="15" font-weight="400" fill="var(--color-ink, #17211f)" text-anchor="middle">计算</text>
  <text x="170" y="257" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="13.5" font-weight="400" fill="var(--color-ink-muted, #66716d)" text-anchor="middle" font-style="italic">主机账：源数据</text>
  <text x="610" y="257" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="13.5" font-weight="400" fill="var(--color-ink-muted, #66716d)" text-anchor="middle" font-style="italic">设备账：本地副本</text>
