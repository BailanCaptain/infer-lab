<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 386" width="880" height="386" role="img" aria-label="主机内存与设备显存双账边界：本卡权重分片一次 H2D 复制与 UVA 边界" font-family="var(--font-sans)">
<title>主机内存与本卡显存双账边界：权重分片一次复制与独立容量预算</title>
<desc>两侧 5x3 网格均表示已选出的本卡权重分片 W，加载期经一次 H2D 复制进 HBM，复制不自动释放主机源数据；右侧展示 HBM 水位与 UVA 边界</desc>
