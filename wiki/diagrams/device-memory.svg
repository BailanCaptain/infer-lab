<g font-weight="700">
<text x="16" y="26" font-size="16" fill="#17211f">主机内存与本卡显存双账边界：权重分片一次复制，两边各自记账</text>
<text x="32" y="88" font-size="14" fill="#17211f">主机内存 · CPU 侧（容器 cgroup 限额）</text>
<text x="158" y="185" font-size="13.5" fill="#936300">本卡权重分片 W</text>
<text x="46" y="295" font-size="13" fill="#3a4f93">可选锁页区：Host UVA / KV CPU 卸载</text>
<text x="504" y="88" font-size="14" fill="#17211f">设备内存 · 单张卡 HBM（独立容量账）</text>
<text x="624" y="156" font-size="13.5" fill="#936300">权重 W 副本</text>
<text x="632" y="296" text-anchor="middle" font-size="13" fill="#065f56">物理 KV 缓存块池（吃满剩余预算）</text>
<text x="813" y="204" text-anchor="middle" font-size="13.5" fill="#065f56">NPU</text>
<text x="813" y="226" text-anchor="middle" font-size="13" fill="#065f56">计算核</text>
</g>
<g font-size="13" fill="#17211f">
<text x="184" y="124" text-anchor="middle">.safetensors 页缓存 + 请求队列与块号表</text>
<text x="158" y="208">CPU 源张量（复制源）</text>
<text x="46" y="317" font-size="12.5">设备可经链路按虚拟地址远端读取</text>
<text x="624" y="178" font-size="12.5">常驻本卡 HBM</text>
<text x="632" y="251" text-anchor="middle" font-size="12.5" fill="#7a3a6a">试跑激活峰值 + non_torch 缓冲</text>
<text x="632" y="341" text-anchor="middle" font-size="12.5" fill="#4d5652">预算外 1-u 余量（承接 ACLGraph）</text>
<text x="813" y="252" text-anchor="middle" font-size="12">高带宽</text>
<text x="813" y="270" text-anchor="middle" font-size="12">本地读</text>
</g>
<g font-size="12.5" fill="#4d5652">
<text x="16" y="47">两侧相同 5×3 网格均表示本卡分片 W；复制不自动释放源数据，地址可访问也不等于搬入 HBM</text>
<text x="95" y="244" text-anchor="middle" fill="#936300">5×3 分片源</text>
<text x="158" y="231">未释放仍计主机账</text>
<text x="46" y="339" fill="#8f3229" font-weight="600">✗ 物理仍在主机，不计入右侧 HBM</text>
<text x="504" y="108">910B3 OS 可见 60.96 GiB（标称 64 GiB）</text>
<text x="624" y="199">8B 约 15.3 GiB</text>
<text x="420" y="168" text-anchor="middle" fill="#7a3a6a" font-weight="700">加载期复制</text>
<text x="420" y="187" text-anchor="middle" fill="#7a3a6a">一次 H2D</text>
<text x="420" y="220" text-anchor="middle" fill="#065f56" font-weight="600">稳态推理</text>
<text x="420" y="239" text-anchor="middle" fill="#065f56">权重 H2D = 0</text>
<text x="420" y="303" text-anchor="middle" fill="#3a4f93">按需换入 / 直读</text>
</g>
</svg>
