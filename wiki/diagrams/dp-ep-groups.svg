<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 470" width="900" height="470" role="img" aria-label="用 4 张卡示意 DP2 × TP2 并开启 EP。同一框里的两张卡是一个 DP 执行组，也是一个 TP 组，负责本组请求的 attention 和稠密层；两组里 TP 位置相同的卡配成一个 DP 通信组，每步在这里对齐宽度；EP 组覆盖全部 4 张卡，专家分在这 4 张卡上。分组表示逻辑成员，不表示物理布线；不是 4 份完整模型。">
  <title>用 4 张卡示意 DP2 × TP2 并开启 EP。同一框里的两张卡是一个 DP 执行组，也是一个 TP 组，负责本组请求的 attention 和稠密层；两组里 TP 位置相同的卡配成一个 DP 通信组，每步在这里对齐宽度；EP 组覆盖全部 4 张卡，专家分在这 4 张卡上。分组表示逻辑成员，不表示物理布线；不是 4 份完整模型。</title>
