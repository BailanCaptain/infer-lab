<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 590" width="900" height="590" role="img" aria-label="稠密模型 DP 与 MoE 开启 EP 时的逻辑分组对比。上方标准稠密 DP（如 Qwen3-8B DP2）：各 DP 组自持独立模型副本与 KV 池，前向无跨组通信、互不等待。下方 4 卡示意 MoE DP2 × TP2 并开启 EP（如 Qwen3-30B-A3B 多组扩展）：组内两张卡按 TP 跑注意力和门控；全部 4 张卡合成 EP 专家组平分专家，两组同位卡配成 DP 通信组每步对齐宽度。">
  <title>稠密模型 DP 与 MoE 开启 EP 时的逻辑分组对比。上方标准稠密 DP（如 Qwen3-8B DP2）：各 DP 组自持独立模型副本与 KV 池，前向无跨组通信、互不等待。下方 4 卡示意 MoE DP2 × TP2 并开启 EP（如 Qwen3-30B-A3B 多组扩展）：组内两张卡按 TP 跑注意力和门控；全部 4 张卡合成 EP 专家组平分专家，两组同位卡配成 DP 通信组每步对齐宽度。</title>
  <defs></defs>
  <rect x="40" y="52" width="820" height="96" rx="16" fill="none" stroke="var(--color-line-strong, #b8bcb5)" stroke-width="1.5"/>
  <text x="56" y="40" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="15" font-weight="700" fill="var(--color-ink, #17211f)">1. 标准稠密 DP（如 Qwen3-8B）：各 DP 组自持独立副本、互不等待</text>
  <rect x="40" y="206" width="380" height="198" rx="16" fill="none" stroke="var(--color-line-strong, #b8bcb5)" stroke-width="1.5"/>
  <text x="56" y="194" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="15" font-weight="700" fill="var(--color-ink, #17211f)">DP 执行组 0 · TP 组 {0,1}</text>
  <rect x="480" y="206" width="380" height="198" rx="16" fill="none" stroke="var(--color-line-strong, #b8bcb5)" stroke-width="1.5"/>
  <text x="496" y="194" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="15" font-weight="700" fill="var(--color-ink, #17211f)">DP 执行组 1 · TP 组 {2,3}</text>
  <rect x="60" y="74" width="360" height="56" rx="8" fill="var(--color-token-soft, #ddf4ef)" stroke="var(--color-token, #087f73)" stroke-width="1.4"/>
  <text x="240" y="98" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="14" font-weight="700" fill="var(--color-ink, #17211f)" text-anchor="middle">DP 组 0 · 完整模型副本</text>
  <text x="240" y="117" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="13" font-weight="400" fill="#065f56" text-anchor="middle">独立队列与 KV 池，0 次跨组同步</text>
  <rect x="480" y="74" width="360" height="56" rx="8" fill="var(--color-token-soft, #ddf4ef)" stroke="var(--color-token, #087f73)" stroke-width="1.4"/>
  <text x="660" y="98" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="14" font-weight="700" fill="var(--color-ink, #17211f)" text-anchor="middle">DP 组 1 · 完整模型副本</text>
  <text x="660" y="117" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="13" font-weight="400" fill="#065f56" text-anchor="middle">独立队列与 KV 池，空闲时无需陪跑</text>
  <rect x="60" y="236" width="340" height="50" rx="8" fill="var(--color-control-soft, #f1efe8)" stroke="var(--color-line-strong, #b8bcb5)" stroke-width="1.4"/>
  <text x="230" y="257" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="14" font-weight="700" fill="var(--color-ink, #17211f)" text-anchor="middle">组 0 请求的 attention 与门控</text>
  <text x="230" y="276" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="13" font-weight="400" fill="var(--color-ink-muted, #66716d)" text-anchor="middle">两张卡用 TP 合作</text>
  <rect x="60" y="312" width="160" height="64" rx="8" fill="var(--color-weight-soft, #fff4cf)" stroke="var(--color-weight, #c78300)" stroke-width="1.4"/>
  <text x="140" y="340" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="14" font-weight="700" fill="var(--color-ink, #17211f)" text-anchor="middle">rank 0</text>
  <text x="140" y="359" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="13" font-weight="400" fill="#936300" text-anchor="middle">持有 1/4 路由专家</text>
  <rect x="240" y="312" width="160" height="64" rx="8" fill="var(--color-weight-soft, #fff4cf)" stroke="var(--color-weight, #c78300)" stroke-width="1.4"/>
  <text x="320" y="340" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="14" font-weight="700" fill="var(--color-ink, #17211f)" text-anchor="middle">rank 1</text>
  <text x="320" y="359" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="13" font-weight="400" fill="#936300" text-anchor="middle">持有 1/4 路由专家</text>
  <rect x="500" y="236" width="340" height="50" rx="8" fill="var(--color-control-soft, #f1efe8)" stroke="var(--color-line-strong, #b8bcb5)" stroke-width="1.4"/>
  <text x="670" y="257" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="14" font-weight="700" fill="var(--color-ink, #17211f)" text-anchor="middle">组 1 请求的 attention 与门控</text>
  <text x="670" y="276" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="13" font-weight="400" fill="var(--color-ink-muted, #66716d)" text-anchor="middle">两张卡用 TP 合作</text>
  <rect x="500" y="312" width="160" height="64" rx="8" fill="var(--color-weight-soft, #fff4cf)" stroke="var(--color-weight, #c78300)" stroke-width="1.4"/>
  <text x="580" y="340" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="14" font-weight="700" fill="var(--color-ink, #17211f)" text-anchor="middle">rank 2</text>
  <text x="580" y="359" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="13" font-weight="400" fill="#936300" text-anchor="middle">持有 1/4 路由专家</text>
  <rect x="680" y="312" width="160" height="64" rx="8" fill="var(--color-weight-soft, #fff4cf)" stroke="var(--color-weight, #c78300)" stroke-width="1.4"/>
  <text x="760" y="340" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="14" font-weight="700" fill="var(--color-ink, #17211f)" text-anchor="middle">rank 3</text>
  <text x="760" y="359" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="13" font-weight="400" fill="#936300" text-anchor="middle">持有 1/4 路由专家</text>
  <rect x="40" y="428" width="390" height="52" rx="8" fill="var(--color-comm-soft, #f5e6f0)" stroke="var(--color-comm, #9a4b86)" stroke-width="1.4"/>
  <text x="235" y="450" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="14" font-weight="700" fill="var(--color-ink, #17211f)" text-anchor="middle">DP 通信组 {0,2}</text>
  <text x="235" y="469" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="13" font-weight="400" fill="#7a3a6a" text-anchor="middle">跨组 EP 时每步对齐 token 数与图模式</text>
  <rect x="470" y="428" width="390" height="52" rx="8" fill="var(--color-comm-soft, #f5e6f0)" stroke="var(--color-comm, #9a4b86)" stroke-width="1.4"/>
  <text x="665" y="450" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="14" font-weight="700" fill="var(--color-ink, #17211f)" text-anchor="middle">DP 通信组 {1,3}</text>
  <text x="665" y="469" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="13" font-weight="400" fill="#7a3a6a" text-anchor="middle">跨组 EP 时每步对齐 token 数与图模式</text>
  <rect x="40" y="498" width="820" height="56" rx="8" fill="var(--color-comm-soft, #f5e6f0)" stroke="var(--color-comm, #9a4b86)" stroke-width="1.4"/>
  <text x="450" y="522" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="14" font-weight="700" fill="var(--color-ink, #17211f)" text-anchor="middle">EP 组 {0,1,2,3}</text>
  <text x="450" y="541" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="13" font-weight="400" fill="#7a3a6a" text-anchor="middle">两个执行组的 token 一起 dispatch 到专家所在的卡，再 combine 回来</text>
  <text x="450" y="22" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="13.5" font-weight="700" fill="var(--color-ink, #17211f)" text-anchor="middle">数据并行（DP）的两种运行形态：独立副本 vs 跨组共享 EP 专家池</text>
  <text x="450" y="176" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="13.5" font-weight="700" fill="var(--color-ink, #17211f)" text-anchor="middle">2. MoE 开启跨组 EP（4 卡示意 DP2 × TP2 + EP4）：专家切在全组卡上，步间需对齐</text>
  <text x="450" y="574" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="13.5" font-weight="400" fill="var(--color-ink-muted, #66716d)" text-anchor="middle" font-style="italic">分组表示逻辑通信成员，不表示物理布线；开启跨组 EP 时单组不是完整模型副本</text>
</svg>
