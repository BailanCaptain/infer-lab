<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 480" width="900" height="480" role="img" aria-label="三类 DP 运行形态与跨机禁配对照" font-family="var(--font-sans)">
<title>稠密 DP 独立副本、MoE DP 波次陪跑与跨机 RoCE PP×DP 禁配对照</title>
<desc>三栏对照：稠密 DP 休眠、MoE DP 陪跑防死锁、跨机 RoCE 禁配 PP×DP。</desc>
<defs>
<marker id="t" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 1.5L8.5 5L0 8.5z" fill="#087f73"/></marker>
<marker id="p" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 1.5L8.5 5L0 8.5z" fill="#9a4b86"/></marker>
<marker id="r" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 1.5L8.5 5L0 8.5z" fill="#b54237"/></marker>
</defs>
<line x1="12" y1="44" x2="888" y2="44" stroke="#b8bcb5" stroke-width="1.4"/>
<path d="M300 12v456M600 12v456" stroke="#b8bcb5" stroke-width="1.3" stroke-dasharray="5 4"/>
<circle cx="26" cy="25" r="11.5" fill="#087f73"/><circle cx="326" cy="25" r="11.5" fill="#9a4b86"/><circle cx="626" cy="25" r="11.5" fill="#b54237"/>
<g text-anchor="middle" font-size="12.5" font-weight="700" fill="#ffffff"><text x="26" y="29.5">1</text><text x="326" y="29.5">2</text><text x="626" y="29.5">3</text></g>
<g font-size="16" font-weight="700">
<text x="44" y="30" fill="#065f56">稠密 DP&gt;1 · 独立副本</text>
<text x="344" y="30" fill="#7a3a6a">MoE DP&gt;1 · 波次陪跑</text>
<text x="644" y="30" fill="#8f3229">跨机 RoCE · PP×DP 禁配</text>
</g>
<g stroke-width="1.5">
<rect x="14" y="60" width="272" height="92" rx="9" fill="#ddf4ef" stroke="#087f73"/>
<rect x="14" y="176" width="272" height="92" rx="9" fill="#ffffff" stroke="#087f73"/>
<rect x="14" y="292" width="272" height="92" rx="9" fill="#ece9df" stroke="#66716d"/>
<rect x="14" y="404" width="272" height="58" rx="9" fill="#ffffff" stroke="#087f73"/>
<rect x="314" y="60" width="272" height="92" rx="9" fill="#f7e7f2" stroke="#9a4b86"/>
<rect x="314" y="176" width="272" height="92" rx="9" fill="#fff4cf" stroke="#c78300"/>
<rect x="314" y="292" width="272" height="92" rx="9" fill="#e8edff" stroke="#4c65b6"/>
<rect x="314" y="404" width="272" height="58" rx="9" fill="#ffffff" stroke="#9a4b86"/>
<g fill="#fff0e9" stroke="#b54237">
<rect x="614" y="60" width="272" height="92" rx="9"/><rect x="614" y="176" width="272" height="92" rx="9"/><rect x="614" y="292" width="272" height="92" rx="9"/>
</g>
<rect x="614" y="404" width="272" height="58" rx="9" fill="#ddf4ef" stroke="#087f73"/>
</g>
<g fill="none" stroke-width="1.8">
<path d="M150 152v20M150 268v20M150 384v16" stroke="#087f73" marker-end="url(#t)"/>
<path d="M450 152v20M450 268v20M450 384v16" stroke="#9a4b86" marker-end="url(#p)"/>
<path d="M750 152v20M750 268v20M750 384v16" stroke="#b54237" marker-end="url(#r)"/>
</g>
<g font-size="15" font-weight="700">
<text x="26" y="88" fill="#065f56" font-family="var(--font-mono)">EngineCoreProc</text>
<text x="26" y="204" fill="#065f56">组间零步级同步</text><text x="26" y="320" fill="#17211f">空闲组真正休眠</text>
<text x="326" y="88" fill="#7a3a6a" font-family="var(--font-mono)">DPCoordinator</text>
<text x="326" y="204" fill="#936300" font-family="var(--font-mono)">DPEngineCoreProc</text>
<text x="326" y="320" fill="#3a4f93">防跨组集合通信死锁</text>
<text x="626" y="88" fill="#8f3229">✗ 跨机叠开 PP&gt;1 与 DP&gt;1</text>
<text x="626" y="204" fill="#8f3229">底层算子路径不支持</text><text x="626" y="320" fill="#8f3229">⚠ 无 Python 启动期拦截</text>
</g>
<g font-size="14.5" font-weight="700">
<text x="26" y="429" fill="#065f56">✓ 仅前端挑组与本地记账</text>
<text x="326" y="429" fill="#7a3a6a">✓ 由 MoE 触发（与 EP 无关）</text>
<text x="626" y="429" fill="#065f56">✓ 跨机 RoCE 须二选一</text>
</g>
<g font-size="13.5" fill="#17211f">
<text x="26" y="113">内部重设 <tspan font-family="var(--font-mono)">dp_size = 1</tspan></text>
<text x="26" y="229">独立调度器与独立 KV 池</text><text x="26" y="345">无活时不进模型前向</text>
<text x="326" y="113">广播 <tspan font-family="var(--font-mono)">START_DP_WAVE</tspan> 唤醒</text>
<text x="326" y="229">空闲组调 <tspan font-family="var(--font-mono)">execute_dummy_batch</tspan></text>
<text x="326" y="345">每步对齐宽度 + MoE 派发收回</text>
<text x="626" y="451">固定 <tspan font-family="var(--font-mono)">PP=1</tspan> 或固定 <tspan font-family="var(--font-mono)">DP=1</tspan></text>
</g>
<g font-size="13.5" fill="#4d5652">
<text x="26" y="136">每组各持一整份模型权重</text><text x="26" y="252">前向不跨 DP 组做集合通信</text>
<text x="26" y="368">不跑 <tspan font-family="var(--font-mono)">dummy_batch</tspan>、互不等待</text><text x="26" y="451">执行侧等价多个独立实例</text>
<text x="326" y="136">汇总队列计数（间隔 ≥100ms）</text><text x="326" y="252">假词输出丢弃，替对侧算专家</text>
<text x="326" y="368">按 <tspan font-family="var(--font-mono)">dp_sync_interval</tspan> 核停机</text><text x="326" y="451">v0.30.0 默认第 1 步及每 16 步核</text>
</g>
<g font-size="13.5" fill="#8f3229">
<text x="626" y="113">跨节点 RoCE 部署 MoE 模型</text><text x="626" y="136">同时开启流水线与数据并行</text>
<text x="626" y="229" font-family="var(--font-mono)">MoeDistributeDispatch</text><text x="626" y="252">不支持跨机 RoCE 下的 PP+DP</text>
<text x="626" y="345"><tspan font-family="var(--font-mono)">platform.py</tspan> 未置前置断言</text><text x="626" y="368">启动不报错，首步前向挂死/失败</text>
</g>
</svg>
