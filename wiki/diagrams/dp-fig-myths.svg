<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 498" width="900" height="498" role="img" aria-label="DP 五组常见认知误区与 v0.30.0 源码真相对照板" font-family="var(--font-sans)">
  <title>DP 五组常见认知误区与 v0.30.0 源码真相对照板</title>
  <desc>五排开放式对照：1. MoE 路由专家跨组共享，单组并非完整副本；2. 陪跑由 MoE 触发而非 EP 独有；3. 跨机 RoCE 下 MoE 禁配 PP 大于 1 与 DP 大于 1 同开；4. 多机须显式传 -dpl 1 与 --headless 且请求派定不迁移；5. v0.30.0 默认第 1 步及每 16 步检查停机，陪跑宽度按条件补齐。</desc>
  <defs>
    <marker id="dm-arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto">
      <path d="M 0 1.5 L 8.5 5 L 0 8.5 z" fill="#087f73"/>
    </marker>
  </defs>

  <text x="14" y="30" font-size="16" font-weight="700" fill="#8f3229">✗ 常见错误直觉（高频踩坑点）</text>
  <text x="392" y="30" font-size="16" font-weight="700" fill="#065f56">✓ v0.30.0 源码与文档真相（排障与选型判据）</text>
  <line x1="12" y1="42" x2="888" y2="42" stroke="#b8bcb5" stroke-width="1.4"/>
  <line x1="378" y1="12" x2="378" y2="486" stroke="#b8bcb5" stroke-width="1.3" stroke-dasharray="5 4"/>

  <g fill="#fff0e9" stroke="#b54237" stroke-width="1.4">
    <rect x="12" y="54" width="352" height="76" rx="9"/>
    <rect x="12" y="142" width="352" height="76" rx="9"/>
    <rect x="12" y="230" width="352" height="76" rx="9"/>
    <rect x="12" y="318" width="352" height="76" rx="9"/>
    <rect x="12" y="406" width="352" height="76" rx="9"/>
  </g>
  <g fill="#ffffff" stroke="#087f73" stroke-width="1.5">
    <rect x="392" y="54" width="496" height="76" rx="9"/>
    <rect x="392" y="142" width="496" height="76" rx="9"/>
    <rect x="392" y="230" width="496" height="76" rx="9"/>
    <rect x="392" y="318" width="496" height="76" rx="9"/>
    <rect x="392" y="406" width="496" height="76" rx="9"/>
  </g>
  <g fill="none" stroke="#087f73" stroke-width="2" marker-end="url(#dm-arr)">
    <path d="M 364 92 L 386 92"/>
    <path d="M 364 180 L 386 180"/>
    <path d="M 364 268 L 386 268"/>
    <path d="M 364 356 L 386 356"/>
    <path d="M 364 444 L 386 444"/>
  </g>

  <text x="26" y="81" font-size="15" font-weight="700" fill="#8f3229">1. 每个 MoE DP 组都是完整模型副本</text>
  <text x="26" y="169" font-size="15" font-weight="700" fill="#8f3229">2. 开了 <tspan font-family="var(--font-mono)" font-size="14">--enable-expert-parallel</tspan> 才陪跑</text>
  <text x="26" y="257" font-size="15" font-weight="700" fill="#8f3229">3. 跨机 RoCE 可叠开 PP&gt;1 与 DP&gt;1</text>
  <text x="26" y="345" font-size="15" font-weight="700" fill="#8f3229">4. 双机只传 <tspan font-family="var(--font-mono)" font-size="14">-dp 2</tspan> 就会跨机分两组</text>
  <text x="26" y="433" font-size="15" font-weight="700" fill="#8f3229">5. 空闲组恒跑 1 词且固定 32 步才停</text>

  <text x="26" y="110" font-size="13.5" fill="#8f3229">把稠密模型的整份复制直接套到 MoE 上</text>
  <text x="26" y="198" font-size="13.5" fill="#8f3229">以为关掉 EP 就能让各 MoE 组独立运行</text>
  <text x="26" y="286" font-size="13.5" fill="#8f3229">看到启动未抛异常就以为拓扑受支持</text>
  <text x="26" y="374" font-size="13.5" fill="#8f3229">漏传本地组数与副节点 headless，或盼请求迁移</text>
  <text x="26" y="462" font-size="13.5" fill="#8f3229">把单张历史图参数当成 v0.30.0 硬编码</text>

  <text x="408" y="81" font-size="15" font-weight="700" fill="#065f56">路由专家跨全部卡只放一份，各组并不独立完整</text>
  <text x="408" y="169" font-size="15" font-weight="700" fill="#065f56">陪跑由 MoE 触发，自动启用 <tspan font-family="var(--font-mono)" font-size="14" fill="#7a3a6a">DPEngineCoreProc</tspan></text>
  <text x="408" y="257" font-size="15" font-weight="700" fill="#065f56">跨机 RoCE 下 MoE 严禁 PP&gt;1 与 DP&gt;1 同开</text>
  <text x="408" y="345" font-size="15" font-weight="700" fill="#065f56">双机须配 <tspan font-family="var(--font-mono)" font-size="14" fill="#7a3a6a">-dpl 1</tspan> 与副节点 <tspan font-family="var(--font-mono)" font-size="14" fill="#7a3a6a">--headless</tspan>；派定不迁移</text>
  <text x="408" y="433" font-size="15" font-weight="700" fill="#065f56">v0.30.0 默认第 1 步及每 16 步核对全局停机</text>

  <text x="408" y="110" font-size="13.5" fill="#4d5652">Attention 按组复制，专家跨 DP×TP 共享，合起来才是完整模型</text>
  <text x="408" y="198" font-size="13.5" fill="#4d5652">不开 EP 时 <tspan font-family="var(--font-mono)" font-weight="600">FusedMoE</tspan> 按 DP×TP 切专家矩阵，各组仍须同走</text>
  <text x="408" y="286" font-size="13.5" fill="#4d5652"><tspan font-family="var(--font-mono)" font-weight="600">MoeDistributeDispatch</tspan> 不支持且无启动期断言，运行期会挂死</text>
  <text x="408" y="374" font-size="13.5" fill="#4d5652">普通 mp 缺省 <tspan font-family="var(--font-mono)" font-weight="600">local=dp</tspan> 会在单机起两组；KV 留原组不搬家</text>
  <text x="408" y="462" font-size="13.5" fill="#4d5652">起点为 1+投机词数，命中 MC2/AllGather/录图时补齐对侧宽度</text>
</svg>
