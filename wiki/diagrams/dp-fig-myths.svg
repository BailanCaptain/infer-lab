<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 560" width="900" height="560" role="img" aria-label="双 DP 组稠密休眠与 MoE 陪跑时间线及 16 步停机刻度与 v0.30.0 源码判据" font-family="var(--font-sans)">
  <title>DP 双组时间线（稠密休眠 vs MoE 陪跑与 16 步停机刻度）及 v0.30.0 源码判据</title>
  <desc>上半区展示两个 DP 组的时间线：DP0 跑请求、DP1 空闲，对比稠密组休眠与 MoE 组 dummy batch 陪跑，并以首步与每 16 步（dp_sync_interval=16）停机检查作刻度；下半区汇总专家跨组共享、EP 独立性、RoCE PP×DP 互斥与多机启动参数判据。</desc>

  <!-- Section 1: Dual DP Group Swimlane Timeline & 16-Step Sync Ticks -->
  <text x="16" y="28" font-size="16" font-weight="700" fill="#17211f">1. 双 DP 组时间线（DP0 有请求，DP1 空闲）：稠密休眠 vs MoE 陪跑与 16 步停机刻度</text>

  <rect x="14" y="42" width="872" height="222" rx="10" fill="#fbfaf6" stroke="#d8d8cf" stroke-width="1.3"/>

  <!-- Time Axis & Stop Check Ticks (Step 1, Step 16, Step 32) -->
  <text x="92" y="69" text-anchor="middle" font-size="12" font-weight="700" fill="#66716d">全局停机刻度</text>
  <line x1="166" y1="74" x2="872" y2="74" stroke="#b8bcb5" stroke-width="1.3"/>
  <g stroke="#9a4b86" stroke-width="1.2" stroke-dasharray="3 3">
    <line x1="210" y1="74" x2="210" y2="218"/>
    <line x1="510" y1="74" x2="510" y2="218"/>
    <line x1="794" y1="74" x2="794" y2="218"/>
  </g>
  <text x="210" y="66" text-anchor="middle" font-size="12" font-weight="700" fill="#7a3a6a">Step 1 核停机</text>
  <text x="360" y="66" text-anchor="middle" font-size="12" fill="#66716d">Step 2..15 波次内免检</text>
  <text x="510" y="66" text-anchor="middle" font-size="12" font-weight="700" fill="#7a3a6a">Step 16 核停机</text>
  <text x="652" y="66" text-anchor="middle" font-size="12" fill="#66716d">Step 20 本地完</text>
  <text x="794" y="66" text-anchor="middle" font-size="12" font-weight="700" fill="#065f56">Step 32 核完停波</text>

  <!-- Lane 1: Active DP0 -->
  <rect x="26" y="86" width="132" height="34" rx="6" fill="#ddf4ef" stroke="#087f73" stroke-width="1.2"/>
  <text x="92" y="108" text-anchor="middle" font-size="12" font-weight="700" fill="#065f56">DP0（有请求）</text>
  <rect x="166" y="86" width="496" height="34" rx="6" fill="#b8efe4" stroke="#087f73" stroke-width="1.3"/>
  <text x="414" y="108" text-anchor="middle" font-size="12" font-weight="700" fill="#065f56">Step 1..20 正常执行请求 R1（Step 20 完成吐字）</text>
  <rect x="666" y="86" width="128" height="34" rx="6" fill="#f7e7f2" stroke="#9a4b86" stroke-width="1.1" stroke-dasharray="4 2"/>
  <text x="730" y="108" text-anchor="middle" font-size="12" fill="#7a3a6a">尾跑等第 32 步</text>
  <rect x="798" y="86" width="74" height="34" rx="6" fill="#ece9df" stroke="#b8bcb5"/>
  <text x="835" y="108" text-anchor="middle" font-size="12" fill="#66716d">休眠</text>

  <!-- Lane 2: Idle DP1 (Dense) -->
  <rect x="26" y="132" width="132" height="34" rx="6" fill="#ece9df" stroke="#8c8577" stroke-width="1.2"/>
  <text x="92" y="154" text-anchor="middle" font-size="12" font-weight="700" fill="#4d5652">DP1 · 稠密模型</text>
  <rect x="166" y="132" width="706" height="34" rx="6" fill="#ffffff" stroke="#b8bcb5" stroke-width="1.2" stroke-dasharray="5 3"/>
  <text x="519" y="154" text-anchor="middle" font-size="12" fill="#66716d">各组独立持有完整权重且无跨组通信 → 空闲 DP1 全程休眠（零陪跑开销）</text>

  <!-- Lane 3: Idle DP1 (MoE) -->
  <rect x="26" y="178" width="132" height="36" rx="6" fill="#fff4cf" stroke="#c78300" stroke-width="1.3"/>
  <text x="92" y="201" text-anchor="middle" font-size="12" font-weight="700" fill="#936300">DP1 · MoE 模型</text>
  <rect x="166" y="178" width="628" height="36" rx="6" fill="#fff4cf" stroke="#c78300" stroke-width="1.3"/>
  <text x="480" y="201" text-anchor="middle" font-size="12" font-weight="700" fill="#936300">唤醒入场跑 dummy batch 陪跑（替 DP0 算本组专家 + 参与每层跨组通信）</text>
  <rect x="798" y="178" width="74" height="36" rx="6" fill="#ddf4ef" stroke="#087f73" stroke-width="1.2"/>
  <text x="835" y="201" text-anchor="middle" font-size="12" font-weight="700" fill="#065f56">停波</text>

  <text x="26" y="244" font-size="12" fill="#17211f">刻度与补齐：v0.30.0 由 _has_global_unfinished_reqs 在首步及每 dp_sync_interval=16 步调 sync_dp_state；按 max_tokens_across_dp 条件补齐。</text>

  <!-- Section 2: 4 Diagnostic Domain Panels -->
  <text x="16" y="290" font-size="16" font-weight="700" fill="#17211f">2. MoE 跨组共享、EP 解耦、RoCE 拓扑禁区与多机启动判据（v0.30.0）</text>

  <!-- Panel A -->
  <rect x="14" y="304" width="428" height="116" rx="9" fill="#fbfaf6" stroke="#c78300" stroke-width="1.3"/>
  <text x="28" y="328" font-size="14" font-weight="700" fill="#936300">A. MoE 的单个 DP 组并非完整模型副本</text>
  <text x="28" y="352" font-size="12.5" fill="#8f3229">✗ 误区：照搬稠密模型，以为每个 MoE DP 组都是完整副本</text>
  <text x="28" y="375" font-size="12.5" font-weight="700" fill="#065f56">✓ 真相：Attention 按组复制，路由专家跨全部卡只放一份</text>
  <text x="28" y="397" font-size="12" fill="#4d5652">全部 DP 组合起来才拼齐完整专家集合，显存不可按 DP 简单整除</text>

  <!-- Panel B -->
  <rect x="458" y="304" width="428" height="116" rx="9" fill="#fbfaf6" stroke="#9a4b86" stroke-width="1.3"/>
  <text x="472" y="328" font-size="14" font-weight="700" fill="#7a3a6a">B. 陪跑由 MoE 触发，关掉 EP 也照样陪跑</text>
  <text x="472" y="352" font-size="12.5" fill="#8f3229">✗ 误区：以为只有传 enable_expert_parallel 才会触发陪跑</text>
  <text x="472" y="375" font-size="12.5" font-weight="700" fill="#065f56">✓ 真相：use_ep=False 时 FusedMoE 仍跨 DP×TP 切专家</text>
  <text x="472" y="397" font-size="12" fill="#4d5652">经 flatten_tp_across_dp_and_pcp 跨组归约，空闲组仍须同走</text>

  <!-- Panel C -->
  <rect x="14" y="432" width="428" height="116" rx="9" fill="#fbfaf6" stroke="#b54237" stroke-width="1.3"/>
  <text x="28" y="456" font-size="14" font-weight="700" fill="#8f3229">C. 跨机 RoCE 下 MoE 严禁同开 PP&gt;1 与 DP&gt;1</text>
  <text x="28" y="480" font-size="12.5" fill="#8f3229">✗ 误区：看到启动期未抛异常，就同时打开跨机 PP 与 DP</text>
  <text x="28" y="503" font-size="12.5" font-weight="700" fill="#065f56">✓ 真相：MoeDistributeDispatch 在 RoCE 下不支持 PP+DP</text>
  <text x="28" y="525" font-size="12" fill="#4d5652">无 Python 启动断言拦截，进入运行期会直接通信挂死或报错</text>

  <!-- Panel D -->
  <rect x="458" y="432" width="428" height="116" rx="9" fill="#fbfaf6" stroke="#087f73" stroke-width="1.3"/>
  <text x="472" y="456" font-size="14" font-weight="700" fill="#065f56">D. 双机 -dpl 1 / --headless 与补齐宽度条件</text>
  <text x="472" y="480" font-size="12.5" fill="#8f3229">✗ 误区：双机只传 data_parallel_size=2；空闲组恒跑 1 词</text>
  <text x="472" y="503" font-size="12.5" font-weight="700" fill="#065f56">✓ 真相：双机须配 data_parallel_size_local=1 与 --headless</text>
  <text x="472" y="525" font-size="12" fill="#4d5652">派定后 KV 不搬家；命中 select_moe_comm_method / 录图时补齐宽度</text>
</svg>
