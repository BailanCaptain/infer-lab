<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 612" width="900" height="612" role="img" aria-label="MoE 数据并行两轨宽度对齐、图模式取保守值、空闲组 dummy 陪跑与停波节拍机制图" font-family="var(--font-sans)">
  <title>MoE 数据并行四重同步机制：前向前两行整数表 CPU gloo All-Reduce 统一取最大宽度与最保守图模式；MoE 层空闲组执行 execute_dummy_batch 陪跑（假输入自身输出丢弃，替忙组算的真实专家结果送回）；步数周期用 sync_dp_state 核对停波共识。</title>
  <desc>关联源码符号：_sync_metadata_across_dp, should_skip_allreduce_across_dp_group, execute_dummy_batch, _dummy_run, sync_dp_state, dp_sync_interval, START_DP_WAVE</desc>
  <defs>
    <marker id="dpwe-plum" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto">
      <path d="M 0 1.5 L 8.5 5 L 0 8.5 z" fill="#9a4b86"/>
    </marker>
    <marker id="dpwe-teal" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto">
      <path d="M 0 1.5 L 8.5 5 L 0 8.5 z" fill="#087f73"/>
    </marker>
    <marker id="dpwe-ink" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto">
      <path d="M 0 1.5 L 8.5 5 L 0 8.5 z" fill="#4d5652"/>
    </marker>
    <marker id="dpwe-red" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto">
      <path d="M 0 1.5 L 8.5 5 L 0 8.5 z" fill="#b54237"/>
    </marker>
  </defs>

  <!-- Section 1 Header -->
  <text x="14" y="26" font-size="16" font-weight="700" fill="#17211f">一、前向前宽度与图模式对齐：CPU gloo 两行 int32 表 All-Reduce（以 2 组为例）</text>
  <line x1="12" y1="36" x2="888" y2="36" stroke="#b8bcb5" stroke-width="1.4"/>

  <!-- Column 1: Local tables (Lane 0 & Lane 1) -->
  <text x="14" y="58" font-size="14.5" font-weight="700" fill="#065f56">① 各组填本列（其余列填 0）</text>

  <!-- Lane 0 table -->
  <rect x="14" y="68" width="234" height="84" rx="8" fill="#ddf4ef" stroke="#087f73" stroke-width="1.4"/>
  <text x="26" y="90" font-size="14" font-weight="700" fill="#065f56">DP 组 0（本地 3 词 · 可录图）</text>
  <rect x="26" y="100" width="96" height="22" rx="3" fill="#ffffff" stroke="#087f73" stroke-width="1.1"/>
  <rect x="122" y="100" width="96" height="22" rx="3" fill="#ece9df" stroke="#b8bcb5" stroke-width="1.1"/>
  <rect x="26" y="122" width="96" height="22" rx="3" fill="#ffffff" stroke="#087f73" stroke-width="1.1"/>
  <rect x="122" y="122" width="96" height="22" rx="3" fill="#ece9df" stroke="#b8bcb5" stroke-width="1.1"/>
  <g font-family="var(--font-mono)" font-size="13.5" text-anchor="middle">
    <text x="74" y="116" font-weight="700" fill="#065f56">tokens: 3</text>
    <text x="170" y="116" fill="#66716d">0</text>
    <text x="74" y="138" font-weight="700" fill="#065f56">mode: 1</text>
    <text x="170" y="138" fill="#66716d">0</text>
  </g>

  <!-- Lane 1 table -->
  <rect x="14" y="164" width="234" height="84" rx="8" fill="#fff4cf" stroke="#c78300" stroke-width="1.4"/>
  <text x="26" y="186" font-size="14" font-weight="700" fill="#936300">DP 组 1（本地 1 词 · Eager）</text>
  <rect x="26" y="196" width="96" height="22" rx="3" fill="#ece9df" stroke="#b8bcb5" stroke-width="1.1"/>
  <rect x="122" y="196" width="96" height="22" rx="3" fill="#ffffff" stroke="#c78300" stroke-width="1.1"/>
  <rect x="26" y="218" width="96" height="22" rx="3" fill="#ece9df" stroke="#b8bcb5" stroke-width="1.1"/>
  <rect x="122" y="218" width="96" height="22" rx="3" fill="#fff0e9" stroke="#b54237" stroke-width="1.1"/>
  <g font-family="var(--font-mono)" font-size="13.5" text-anchor="middle">
    <text x="74" y="212" fill="#66716d">0</text>
    <text x="170" y="212" font-weight="700" fill="#936300">tokens: 1</text>
    <text x="74" y="234" fill="#66716d">0</text>
    <text x="170" y="234" font-weight="700" fill="#8f3229">mode: 0</text>
  </g>

  <!-- Converging arrows to All-Reduce -->
  <path d="M 248 110 L 274 110 L 274 146 L 296 146" fill="none" stroke="#9a4b86" stroke-width="2" marker-end="url(#dpwe-plum)"/>
  <path d="M 248 206 L 274 206 L 274 166 L 296 166" fill="none" stroke="#9a4b86" stroke-width="2" marker-end="url(#dpwe-plum)"/>

  <!-- Column 2: Reduced table + max/min verdicts -->
  <text x="302" y="58" font-size="14.5" font-weight="700" fill="#7a3a6a">② gloo All-Reduce(SUM) → 取极值</text>
  <rect x="302" y="68" width="266" height="180" rx="8" fill="#f7e7f2" stroke="#9a4b86" stroke-width="1.5"/>

  <text x="316" y="92" font-size="13.5" font-weight="700" fill="#7a3a6a">全组拿到同一张 2 × 2 整数表：</text>
  <!-- Row 1: tokens -->
  <rect x="316" y="102" width="114" height="32" rx="4" fill="#ffffff" stroke="#087f73" stroke-width="1.3"/>
  <text x="373" y="123" text-anchor="middle" font-family="var(--font-mono)" font-size="14" font-weight="700" fill="#065f56">[ 3 , 1 ]</text>
  <path d="M 432 118 L 448 118" fill="none" stroke="#087f73" stroke-width="1.8" marker-end="url(#dpwe-teal)"/>
  <rect x="454" y="102" width="102" height="32" rx="5" fill="#ddf4ef" stroke="#087f73" stroke-width="1.3"/>
  <text x="505" y="123" text-anchor="middle" font-size="14" font-weight="700" fill="#065f56">width = 3</text>

  <!-- Row 2: graph mode -->
  <rect x="316" y="146" width="114" height="32" rx="4" fill="#ffffff" stroke="#b54237" stroke-width="1.3"/>
  <text x="373" y="167" text-anchor="middle" font-family="var(--font-mono)" font-size="14" font-weight="700" fill="#8f3229">[ 1 , 0 ]</text>
  <path d="M 432 162 L 448 162" fill="none" stroke="#b54237" stroke-width="1.8" marker-end="url(#dpwe-red)"/>
  <rect x="454" y="146" width="102" height="32" rx="5" fill="#fff0e9" stroke="#b54237" stroke-width="1.3"/>
  <text x="505" y="167" text-anchor="middle" font-size="14" font-weight="700" fill="#8f3229">min = Eager</text>

  <text x="316" y="204" font-size="13.5" fill="#17211f">• <tspan font-weight="700" fill="#065f56">宽度取 max</tspan>：供补齐与 MoE 选路</text>
  <text x="308" y="226" font-size="12" fill="#17211f">• <tspan font-weight="700" fill="#8f3229">图模式取 min</tspan>：任一组退 Eager 全组退</text>

  <!-- Arrow to Column 3 -->
  <path d="M 568 158 L 594 158" fill="none" stroke="#4d5652" stroke-width="1.8" marker-end="url(#dpwe-ink)"/>

  <!-- Column 3: Padding & Skip criteria -->
  <text x="602" y="58" font-size="14.5" font-weight="700" fill="#3a4f93">③ 补齐触发与跳过门控（v0.30.0）</text>
  <rect x="602" y="68" width="286" height="90" rx="8" fill="#ffffff" stroke="#c78300" stroke-width="1.4"/>
  <text x="614" y="90" font-size="14" font-weight="700" fill="#936300">MRV1 命中任一 → 补齐到 max=3</text>
  <text x="614" y="114" font-size="13.5" fill="#4d5652">图回放 / MTP 草拟 / ALLGATHER·MC2</text>
  <text x="614" y="136" font-size="13.5" fill="#4d5652">FUSED_MC2 / 跨 DP 细粒度 TP &gt; 1</text>

  <rect x="602" y="166" width="286" height="82" rx="8" fill="#e8edff" stroke="#4c65b6" stroke-width="1.4"/>
  <text x="614" y="188" font-size="14" font-weight="700" fill="#3a4f93">何时可跳过本次 All-Reduce？</text>
  <text x="614" y="211" font-size="13.5" fill="#17211f">• 稠密模型：直跳（独立副本 0 同步）</text>
  <text x="614" y="233" font-size="13.5" fill="#17211f">• MoE：仅 PD 接收端满足 MC2 跳过</text>

  <!-- Section 2 Header -->
  <text x="14" y="284" font-size="16" font-weight="700" fill="#17211f">二、MoE 层空闲组陪跑数据流：为什么假输入输出丢弃，却绝不能停步？</text>
  <line x1="12" y1="294" x2="888" y2="294" stroke="#b8bcb5" stroke-width="1.4"/>

  <!-- Swimlane 0: Busy DP 0 -->
  <rect x="14" y="308" width="874" height="86" rx="8" fill="#ddf4ef" fill-opacity="0.35" stroke="#087f73" stroke-width="1.3"/>
  <text x="26" y="330" font-size="14.5" font-weight="700" fill="#065f56">DP 组 0（忙组 · 持有前半路由专家）</text>

  <rect x="26" y="340" width="166" height="44" rx="6" fill="#ddf4ef" stroke="#087f73" stroke-width="1.4"/>
  <text x="109" y="367" text-anchor="middle" font-size="14" font-weight="700" fill="#065f56">真实请求 token 批</text>

  <rect x="266" y="340" width="234" height="44" rx="6" fill="#fff4cf" stroke="#c78300" stroke-width="1.4"/>
  <text x="383" y="367" text-anchor="middle" font-size="14" font-weight="700" fill="#936300">组 0 专家计算（本地命中部分）</text>

  <rect x="646" y="340" width="228" height="44" rx="6" fill="#ddf4ef" stroke="#087f73" stroke-width="1.5"/>
  <text x="760" y="367" text-anchor="middle" font-size="14" font-weight="700" fill="#065f56">合齐两组专家结果 → 返回用户</text>

  <path d="M 192 362 L 260 362" fill="none" stroke="#087f73" stroke-width="2" marker-end="url(#dpwe-teal)"/>
  <path d="M 500 362 L 640 362" fill="none" stroke="#087f73" stroke-width="2" marker-end="url(#dpwe-teal)"/>

  <!-- Swimlane 1: Idle Escort DP 1 -->
  <rect x="14" y="424" width="874" height="90" rx="8" fill="#ece9df" fill-opacity="0.55" stroke="#b8bcb5" stroke-width="1.3"/>
  <text x="26" y="446" font-size="14.5" font-weight="700" fill="#4d5652">DP 组 1（空闲组 · 持有后半路由专家 · engines_running = True）</text>

  <rect x="26" y="456" width="218" height="48" rx="6" fill="#ffffff" stroke="#66716d" stroke-width="1.4" stroke-dasharray="5 3"/>
  <text x="135" y="476" text-anchor="middle" font-size="14" font-weight="700" fill="#4d5652">execute_dummy_batch</text>
  <text x="135" y="496" text-anchor="middle" font-size="13.5" fill="#66716d">起点 1+草拟词 · 不改线性状态</text>

  <rect x="336" y="456" width="244" height="48" rx="6" fill="#fff4cf" stroke="#c78300" stroke-width="1.5"/>
  <text x="458" y="476" text-anchor="middle" font-size="14" font-weight="700" fill="#936300">组 1 专家计算（算 DP 0 发来的词）</text>
  <text x="458" y="496" text-anchor="middle" font-size="13.5" fill="#936300">缺席即导致跨组通信永久死锁</text>

  <rect x="646" y="456" width="228" height="48" rx="6" fill="#fff0e9" stroke="#b54237" stroke-width="1.4" stroke-dasharray="5 3"/>
  <text x="760" y="476" text-anchor="middle" font-size="14" font-weight="700" fill="#8f3229">✗ 假输入自身输出直接丢弃</text>
  <text x="760" y="496" text-anchor="middle" font-size="13.5" fill="#8f3229">不采样、不返回给任何用户</text>

  <!-- Cross-lane EP Dispatch (DP0 -> DP1 experts) -->
  <path d="M 192 374 L 246 408 L 330 472" fill="none" stroke="#9a4b86" stroke-width="2.2" marker-end="url(#dpwe-plum)"/>
  <text x="208" y="414" font-size="13.5" font-weight="700" fill="#7a3a6a">EP dispatch（发给组 1 专家）</text>

  <!-- Cross-lane EP Combine (DP1 experts -> DP0 real output!) -->
  <path d="M 556 456 L 610 408 L 642 374" fill="none" stroke="#087f73" stroke-width="2.4" marker-end="url(#dpwe-teal)"/>
  <text x="514" y="414" font-size="13.5" font-weight="700" fill="#065f56">✓ combine 真结果回组 0</text>

  <!-- Discard dummy arrow -->
  <path d="M 580 480 L 640 480" fill="none" stroke="#b54237" stroke-width="1.8" stroke-dasharray="5 3" marker-end="url(#dpwe-red)"/>

  <!-- Section 3: Cadence & Wave footer strip -->
  <rect x="14" y="526" width="874" height="78" rx="8" fill="#f7e7f2" fill-opacity="0.45" stroke="#9a4b86" stroke-width="1.3"/>
  <text x="28" y="550" font-size="14" font-weight="700" fill="#7a3a6a">三、周期停机共识（sync_dp_state 两元素求和：各组是否有活 0/1 标志 + 运维暂停计数）与波次唤醒</text>
  <text x="28" y="574" font-size="13" fill="#17211f">• <tspan font-weight="700" fill="#065f56">v0.30.0 / main</tspan>：第 1 步必查 + 每 <tspan font-family="var(--font-mono)" font-weight="700">16</tspan> 步查（尾跑 ≤15 步）   • <tspan font-weight="700" fill="#936300">GLM 历史快照</tspan>：每 <tspan font-family="var(--font-mono)" font-weight="700">32</tspan> 步（尾跑 ≤31 步）</text>
  <text x="28" y="595" font-size="13" fill="#17211f">• 运维暂停须显式 <tspan font-family="var(--font-mono)" font-weight="700">resume_scheduler</tspan></text>
</svg>
