<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 520" width="900" height="520" role="img" aria-label="DP 请求路由四级优先级、KV 占用斜坡罚分曲线、在途兜底与偏斜代价图">
  <title>DP 请求路由：四级选组优先级、KV 压力斜坡罚分曲线与偏斜代价</title>
  <desc>上部展示前端 get_core_engine_for_request 的四级优先级；中部左侧用坐标折线图对比 v0.23/v0.26 恒定 4 倍 waiting 权重与 v0.30.0/main 随 KV 利用率超过 50% 线性爬升的斜坡罚分，右侧展示 engine_inflight 在途兜底避免协调器旧推送清零本地账；下部概括偏斜路由的排队、独立 KV 池、MoE 最宽对齐陪跑与前缀隔离四项代价。</desc>
  <defs>
    <marker id="dpr-arr-gray" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto">
      <path d="M 1 1.5 L 8.5 5 L 1 8.5 z" fill="#66716d" />
    </marker>
    <marker id="dpr-arr-teal" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto">
      <path d="M 1 1.5 L 8.5 5 L 1 8.5 z" fill="#087f73" />
    </marker>
  </defs>

  <!-- Header -->
  <text x="16" y="26" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="16" font-weight="700" fill="#17211f">DP 请求路由：四级优先级、KV 斜坡罚分曲线与在途兜底</text>
  <text x="16" y="46" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="13.5" fill="#4d5652">前端选组只决定一次、派定后不迁移；v0.30.0 / main 用在途兜底与 KV 斜坡取代旧式固定 4W+R</text>
  <line x1="16" y1="58" x2="884" y2="58" stroke="#d8d8cf" stroke-width="1" />

  <!-- ========== SECTION 1: 4-Gate Priority Cascade ========== -->
  <text x="16" y="78" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="14.5" font-weight="700" fill="#17211f">一、前端选组四级优先级（get_core_engine_for_request，命中即止）</text>

  <g stroke-width="1.4">
    <rect x="16" y="88" width="194" height="58" rx="7" fill="#e8edff" stroke="#4c65b6" />
    <rect x="234" y="88" width="196" height="58" rx="7" fill="#fff4cf" stroke="#c78300" />
    <rect x="454" y="88" width="196" height="58" rx="7" fill="#f7e7f2" stroke="#9a4b86" />
    <rect x="674" y="88" width="210" height="58" rx="7" fill="#ddf4ef" stroke="#087f73" />
  </g>
  <path d="M 210 117 L 228 117" fill="none" stroke="#66716d" stroke-width="1.6" marker-end="url(#dpr-arr-gray)" />
  <path d="M 430 117 L 448 117" fill="none" stroke="#66716d" stroke-width="1.6" marker-end="url(#dpr-arr-gray)" />
  <path d="M 650 117 L 668 117" fill="none" stroke="#087f73" stroke-width="1.8" marker-end="url(#dpr-arr-teal)" />

  <g font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="13.5" font-weight="700">
    <text x="28" y="110" fill="#3a4f93">1. 流式会话亲和 [main]</text>
    <text x="246" y="110" fill="#936300">2. 显式请求头指定</text>
    <text x="466" y="110" fill="#7a3a6a">3. Late Interaction</text>
    <text x="686" y="110" fill="#065f56">4. 负载打分挑最小</text>
  </g>
  <g font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="13.5" fill="#4d5652">
    <text x="28" y="134">命中 <tspan font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" fill="#3a4f93">reqs_in_flight</tspan> 复用</text>
    <text x="246" y="134" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" fill="#936300">X-data-parallel-rank</text>
    <text x="466" y="134">池化键 <tspan font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" fill="#7a3a6a">CRC32 % N</tspan></text>
    <text x="686" y="134">派定不迁移 · KV 留在该组</text>
  </g>

  <line x1="16" y1="160" x2="884" y2="160" stroke="#d8d8cf" stroke-width="1" />

  <!-- ========== SECTION 2: Left XY Slope Chart + Right Inflight Floor ========== -->
  <text x="16" y="182" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="14.5" font-weight="700" fill="#17211f">二、打分演进：KV 占用斜坡罚分曲线（左）与 engine_inflight 防清零兜底（右）</text>

  <!-- Left XY Chart: x in [78..414] (0%..100%), y in [346..218] (0x..4x, 32px per 1x) -->
  <!-- Gridlines -->
  <line x1="78" y1="314" x2="414" y2="314" stroke="#ece9df" stroke-width="1" />
  <line x1="78" y1="282" x2="414" y2="282" stroke="#ece9df" stroke-width="1" />
  <line x1="78" y1="250" x2="414" y2="250" stroke="#ece9df" stroke-width="1" />
  <line x1="78" y1="218" x2="414" y2="218" stroke="#ece9df" stroke-width="1" />
  <line x1="246" y1="202" x2="246" y2="346" stroke="#d8d8cf" stroke-width="1.2" stroke-dasharray="4 3" />

  <!-- Shaded ramp area (u_KV 50%..100%) -->
  <polygon points="246,314 414,218 414,314" fill="#ddf4ef" fill-opacity="0.7" />

  <!-- Axes -->
  <line x1="78" y1="200" x2="78" y2="346" stroke="#4d5652" stroke-width="1.5" />
  <line x1="78" y1="346" x2="424" y2="346" stroke="#4d5652" stroke-width="1.5" />

  <!-- Y ticks -->
  <g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13.5" fill="#4d5652" text-anchor="end">
    <text x="68" y="319">1×</text>
    <text x="68" y="287">2×</text>
    <text x="68" y="255">3×</text>
    <text x="68" y="223">4×</text>
  </g>
  <text x="22" y="206" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="13.5" font-weight="600" fill="#4d5652">W 权重</text>

  <!-- X ticks -->
  <g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13.5" fill="#4d5652" text-anchor="middle">
    <text x="78" y="366">0%</text>
    <text x="246" y="366">50%</text>
    <text x="330" y="366">75%</text>
    <text x="414" y="366">100%</text>
  </g>
  <text x="246" y="384" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="13.5" text-anchor="middle" fill="#66716d">组级 KV 占比 u_KV（当 W+R ≥ N_api·inflight 时的等效 W 权重）</text>

  <!-- Old v0.23/v0.26 flat 4x dashed line -->
  <line x1="78" y1="218" x2="414" y2="218" stroke="#c78300" stroke-width="2.2" stroke-dasharray="7 4" />
  <text x="90" y="210" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="13.5" font-weight="700" fill="#936300">v0.23 / v0.26：恒定 4×（4W + R）</text>

  <!-- New v0.30.0/main piecewise ramp polyline -->
  <polyline points="78,314 246,314 414,218" fill="none" stroke="#087f73" stroke-width="2.8" stroke-linejoin="round" />
  <circle cx="78" cy="314" r="4" fill="#087f73" />
  <circle cx="246" cy="314" r="4.5" fill="#087f73" />
  <circle cx="414" cy="218" r="4.5" fill="#087f73" />

  <text x="162" y="302" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="13.5" font-weight="700" text-anchor="middle" fill="#065f56">≤50% 罚 0（基 1×）</text>
  <text x="344" y="300" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="13.5" font-weight="700" text-anchor="middle" fill="#065f56">+6·(u_KV−0.5)·W</text>
  <text x="366" y="242" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="13.5" font-weight="600" text-anchor="middle" fill="#065f56">+3W（合 4×）</text>

  <!-- Right Panel: Formula + Inflight Floor Comparison -->
  <rect x="454" y="196" width="430" height="34" rx="6" fill="#ddf4ef" stroke="#087f73" stroke-width="1.3" />
  <text x="669" y="218" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13.5" font-weight="700" text-anchor="middle" fill="#065f56">max(N_api×inflight, W+R) + W×6×max(0, u_KV-0.5)</text>

  <!-- Old flaw box -->
  <rect x="454" y="242" width="430" height="62" rx="7" fill="#fff0e9" stroke="#b54237" stroke-width="1.2" stroke-dasharray="5 3" />
  <text x="468" y="264" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="13.5" font-weight="700" fill="#8f3229">旧版漏洞（v0.23 / v0.26）：旧推送抹零本地账 + 漏计请求头</text>
  <text x="468" y="290" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="13.5" fill="#4d5652">推送整表覆盖清零本地 waiting 补记；X-data-parallel-rank 不记账</text>

  <!-- New inflight floor box -->
  <rect x="454" y="314" width="430" height="70" rx="7" fill="#e8edff" stroke="#4c65b6" stroke-width="1.3" />
  <text x="468" y="336" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="13.5" font-weight="700" fill="#3a4f93">新版兜底（v0.30.0 / main）：engine_inflight 独立于推送</text>
  <text x="468" y="358" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="13.5" fill="#4d5652">仅在本前端发出 +1 / 完成 −1（连显式指定组号的请求也计入）</text>
  <text x="468" y="378" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="13.5" fill="#4d5652">自 v0.26 起每次选组后旋转扫描起点，消除平分总落 DP0 偏置</text>

  <line x1="16" y1="398" x2="884" y2="398" stroke="#d8d8cf" stroke-width="1" />

  <!-- ========== SECTION 3: 4 Costs of Skewed Routing ========== -->
  <text x="16" y="420" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="14.5" font-weight="700" fill="#17211f">三、计数滞后（单步时长 + 100 ms 量级）与挑偏的四项代价</text>

  <g stroke-width="1.3">
    <rect x="16" y="432" width="208" height="78" rx="7" fill="#fff4cf" stroke="#c78300" />
    <rect x="236" y="432" width="208" height="78" rx="7" fill="#f7e7f2" stroke="#9a4b86" />
    <rect x="456" y="432" width="208" height="78" rx="7" fill="#fff0e9" stroke="#b54237" />
    <rect x="676" y="432" width="208" height="78" rx="7" fill="#e8edff" stroke="#4c65b6" />
  </g>

  <g font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="13.5" font-weight="700">
    <text x="28" y="454" fill="#936300">1. 排队放大</text>
    <text x="248" y="454" fill="#7a3a6a">2. 独立 KV 池抢占</text>
    <text x="468" y="454" fill="#8f3229">3. MoE 最宽对齐陪跑</text>
    <text x="688" y="454" fill="#3a4f93">4. 前缀缓存隔离</text>
  </g>
  <g font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="13.5" fill="#4d5652">
    <text x="28" y="478">单组顶满进 waiting</text>
    <text x="28" y="498">他组有空位也接不走</text>

    <text x="248" y="478">长请求扎堆先耗尽本池</text>
    <text x="248" y="498">触发抢占重算，他组无助</text>

    <text x="468" y="478">步宽取 max(W0, W1)</text>
    <text x="468" y="498">空闲组造假批陪走全层</text>

    <text x="688" y="478">默认打分不看共同前缀</text>
    <text x="688" y="498">落不同组需各算各存</text>
  </g>
</svg>
