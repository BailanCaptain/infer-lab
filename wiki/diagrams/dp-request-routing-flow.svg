<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 470" width="900" height="470" role="img" aria-label="图示 v0.23 的普通文本生成路径。虚线是计数走的路，实线是请求走的路。① 两组引擎在每一步前后把 waiting、running 两个条数报给协调器，数没变就不报；② 协调器按默认最小间隔 100 ms 轮询推送，还受统计聚合等待影响；③ 前端收到推送，整张换掉计数表；④ 前端按表打分，把请求送进那组引擎的输入队列，引擎在下一次处理输入队列时才把它收进 waiting。">
  <title>图示 v0.23 的普通文本生成路径。虚线是计数走的路，实线是请求走的路。① 两组引擎在每一步前后把 waiting、running 两个条数报给协调器，数没变就不报；② 协调器按默认最小间隔 100 ms 轮询推送，还受统计聚合等待影响；③ 前端收到推送，整张换掉计数表；④ 前端按表打分，把请求送进那组引擎的输入队列，引擎在下一次处理输入队列时才把它收进 waiting。</title>
  <defs><marker id="dp-request-routing-flow-ah-token" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="var(--color-token, #087f73)"/></marker><marker id="dp-request-routing-flow-ah-ink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="var(--color-ink, #17211f)"/></marker><marker id="dp-request-routing-flow-ah-comm" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="var(--color-comm, #9a4b86)"/></marker></defs>
  <rect x="20" y="60" width="250" height="330" rx="16" fill="none" stroke="var(--color-line-strong, #b8bcb5)" stroke-width="1.5"/>
  <text x="36" y="84" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="13" font-weight="700" fill="var(--color-ink, #17211f)">前端 · node0 的 API server</text>
  <rect x="600" y="60" width="282" height="150" rx="16" fill="none" stroke="var(--color-line-strong, #b8bcb5)" stroke-width="1.5"/>
  <text x="616" y="84" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="13" font-weight="700" fill="var(--color-ink, #17211f)">DP0 · EngineCore</text>
  <rect x="600" y="240" width="282" height="150" rx="16" fill="none" stroke="var(--color-line-strong, #b8bcb5)" stroke-width="1.5"/>
  <text x="616" y="264" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="13" font-weight="700" fill="var(--color-ink, #17211f)">DP1 · EngineCore</text>
  <path d="M244 126 L610 126" fill="none" stroke="var(--color-token, #087f73)" stroke-width="1.4" marker-end="url(#dp-request-routing-flow-ah-token)"/>
  <path d="M244 148 L610 306" fill="none" stroke="var(--color-token, #087f73)" stroke-width="1.4" marker-end="url(#dp-request-routing-flow-ah-token)"/>
  <path d="M712 134 L730 134" fill="none" stroke="var(--color-ink, #17211f)" stroke-width="1.4" marker-end="url(#dp-request-routing-flow-ah-ink)"/>
  <path d="M712 314 L730 314" fill="none" stroke="var(--color-ink, #17211f)" stroke-width="1.4" marker-end="url(#dp-request-routing-flow-ah-ink)"/>
  <path d="M872 134 L892 134 L892 424 L552 424" fill="none" stroke="var(--color-comm, #9a4b86)" stroke-width="2.2" stroke-dasharray="7 5" marker-end="url(#dp-request-routing-flow-ah-comm)"/>
  <path d="M802 344 L802 400 L552 400" fill="none" stroke="var(--color-comm, #9a4b86)" stroke-width="2.2" stroke-dasharray="7 5" marker-end="url(#dp-request-routing-flow-ah-comm)"/>
  <path d="M318 408 L290 408 L290 330 L246 330" fill="none" stroke="var(--color-comm, #9a4b86)" stroke-width="2.2" stroke-dasharray="7 5" marker-end="url(#dp-request-routing-flow-ah-comm)"/>
  <path d="M144 298 L144 166" fill="none" stroke="var(--color-ink, #17211f)" stroke-width="1.4" marker-end="url(#dp-request-routing-flow-ah-ink)"/>
  <rect x="44" y="104" width="200" height="60" rx="8" fill="var(--color-token-soft, #ddf4ef)" stroke="var(--color-token, #087f73)" stroke-width="1.4"/>
  <text x="144" y="130" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="14" font-weight="700" fill="var(--color-ink, #17211f)" text-anchor="middle">选组</text>
  <text x="144" y="149" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="13" font-weight="400" fill="#065f56" text-anchor="middle">看请求头，没有就打分</text>
  <rect x="44" y="300" width="200" height="60" rx="8" fill="var(--color-control-soft, #f1efe8)" stroke="var(--color-line-strong, #b8bcb5)" stroke-width="1.4"/>
  <text x="144" y="326" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="14" font-weight="700" fill="var(--color-ink, #17211f)" text-anchor="middle">计数表</text>
  <text x="144" y="345" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="13" font-weight="400" fill="var(--color-ink-muted, #66716d)" text-anchor="middle">每组 (waiting, running)</text>
  <rect x="612" y="104" width="100" height="60" rx="8" fill="var(--color-control-soft, #f1efe8)" stroke="var(--color-line-strong, #b8bcb5)" stroke-width="1.4"/>
  <text x="662" y="130" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="14" font-weight="700" fill="var(--color-ink, #17211f)" text-anchor="middle">输入队列</text>
  <text x="662" y="149" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="13" font-weight="400" fill="var(--color-ink-muted, #66716d)" text-anchor="middle">这一步里到的</text>
  <rect x="732" y="104" width="140" height="60" rx="8" fill="var(--color-control-soft, #f1efe8)" stroke="var(--color-control, #66716d)" stroke-width="1.4"/>
  <text x="802" y="130" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="14" font-weight="700" fill="var(--color-ink, #17211f)" text-anchor="middle">scheduler</text>
  <text x="802" y="149" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="13" font-weight="400" fill="var(--color-ink-muted, #66716d)" text-anchor="middle">waiting · running</text>
  <rect x="612" y="284" width="100" height="60" rx="8" fill="var(--color-control-soft, #f1efe8)" stroke="var(--color-line-strong, #b8bcb5)" stroke-width="1.4"/>
  <text x="662" y="310" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="14" font-weight="700" fill="var(--color-ink, #17211f)" text-anchor="middle">输入队列</text>
  <text x="662" y="329" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="13" font-weight="400" fill="var(--color-ink-muted, #66716d)" text-anchor="middle">这一步里到的</text>
  <rect x="732" y="284" width="140" height="60" rx="8" fill="var(--color-control-soft, #f1efe8)" stroke="var(--color-control, #66716d)" stroke-width="1.4"/>
  <text x="802" y="310" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="14" font-weight="700" fill="var(--color-ink, #17211f)" text-anchor="middle">scheduler</text>
  <text x="802" y="329" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="13" font-weight="400" fill="var(--color-ink-muted, #66716d)" text-anchor="middle">waiting · running</text>
  <rect x="320" y="380" width="230" height="56" rx="8" fill="var(--color-comm-soft, #f5e6f0)" stroke="var(--color-comm, #9a4b86)" stroke-width="1.4"/>
  <text x="435" y="404" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="14" font-weight="700" fill="var(--color-ink, #17211f)" text-anchor="middle">DP 协调器</text>
  <text x="435" y="423" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="13" font-weight="400" fill="#7a3a6a" text-anchor="middle">汇总两组的条数</text>
  <text x="450" y="26" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="13.5" font-weight="700" fill="var(--color-ink, #17211f)" text-anchor="middle">计数怎样从引擎回到前端</text>
  <text x="742" y="192" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="13.5" font-weight="400" fill="var(--color-ink-muted, #66716d)" text-anchor="middle" font-style="italic">算完这一步才收进 waiting</text>
  <circle cx="802" cy="372" r="11" fill="var(--color-comm, #9a4b86)"/><text x="802" y="377" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="13" font-weight="700" fill="var(--color-ink-inverse, #ffffff)" text-anchor="middle">1</text>
  <circle cx="700" cy="424" r="11" fill="var(--color-comm, #9a4b86)"/><text x="700" y="429" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="13" font-weight="700" fill="var(--color-ink-inverse, #ffffff)" text-anchor="middle">1</text>
  <circle cx="435" cy="368" r="11" fill="var(--color-comm, #9a4b86)"/><text x="435" y="373" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="13" font-weight="700" fill="var(--color-ink-inverse, #ffffff)" text-anchor="middle">2</text>
  <circle cx="290" cy="370" r="11" fill="var(--color-comm, #9a4b86)"/><text x="290" y="375" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="13" font-weight="700" fill="var(--color-ink-inverse, #ffffff)" text-anchor="middle">3</text>
  <circle cx="430" cy="126" r="11" fill="var(--color-token, #087f73)"/><text x="430" y="131" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="13" font-weight="700" fill="var(--color-ink-inverse, #ffffff)" text-anchor="middle">4</text>
