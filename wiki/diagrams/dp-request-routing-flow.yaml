layout: figure
id: dp-request-routing-flow
caption: 图示 v0.23 的普通文本生成路径。虚线是计数走的路，实线是请求走的路。① 两组引擎在每一步前后把 waiting、running 两个条数报给协调器，数没变就不报；② 协调器按默认最小间隔 100 ms 轮询推送，还受统计聚合等待影响；③ 前端收到推送，整张换掉计数表；④ 前端按表打分，把请求送进那组引擎的输入队列，引擎在下一次处理输入队列时才把它收进 waiting。
size: [900, 470]
frames:
  - { at: [20, 60], size: [250, 330], label: 前端 · node0 的 API server, inside: true }
  - { at: [600, 60], size: [282, 150], label: DP0 · EngineCore, inside: true }
  - { at: [600, 240], size: [282, 150], label: DP1 · EngineCore, inside: true }
items:
  - { at: [44, 104], size: [200, 60], text: 选组, sub: 看请求头，没有就打分, tone: token }
  - { at: [44, 300], size: [200, 60], text: 计数表, sub: '每组 (waiting, running)', tone: control, style: plain }
  - { at: [612, 104], size: [100, 60], text: 输入队列, sub: 这一步里到的, style: plain }
  - { at: [732, 104], size: [140, 60], text: scheduler, sub: waiting · running, tone: control }
  - { at: [612, 284], size: [100, 60], text: 输入队列, sub: 这一步里到的, style: plain }
  - { at: [732, 284], size: [140, 60], text: scheduler, sub: waiting · running, tone: control }
  - { at: [320, 380], size: [230, 56], text: DP 协调器, sub: 汇总两组的条数, tone: comm }
