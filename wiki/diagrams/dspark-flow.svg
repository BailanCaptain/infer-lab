<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 610 470" width="610" height="470" role="img" aria-label="异步路径的依赖示意，箭头不是等比例时间线。CPU 的预算准备可与设备执行重叠；总预算和更新的置信信息都就绪后，设备才能分配下一轮各请求长度。">
  <title>异步路径的依赖示意，箭头不是等比例时间线。CPU 的预算准备可与设备执行重叠；总预算和更新的置信信息都就绪后，设备才能分配下一轮各请求长度。</title>
  <defs><marker id="dspark-flow-ah-control" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="var(--color-control, #66716d)"/></marker><marker id="dspark-flow-ah-weight" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="var(--color-weight, #c78300)"/></marker><marker id="dspark-flow-ah-token" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="var(--color-token, #087f73)"/></marker></defs>
  <path d="M155 120 L155 185" fill="none" stroke="var(--color-control, #66716d)" stroke-width="1.4" marker-end="url(#dspark-flow-ah-control)"/>
  <path d="M450 120 L450 185" fill="none" stroke="var(--color-weight, #c78300)" stroke-width="1.4" marker-end="url(#dspark-flow-ah-weight)"/>
  <path d="M305 267 L305 320" fill="none" stroke="var(--color-token, #087f73)" stroke-width="1.4" marker-end="url(#dspark-flow-ah-token)"/>
  <rect x="20" y="40" width="275" height="80" rx="8" fill="var(--color-surface-sunken, #ece9df)" stroke="var(--color-control, #66716d)" stroke-opacity="0.4" stroke-width="1.5" stroke-dasharray="5 4"/>
  <text x="157.5" y="76" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="13" font-weight="400" fill="#4d5652" text-anchor="middle">CPU：旧置信信息 + 耗时曲线</text>
  <text x="157.5" y="95" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="13" font-weight="400" fill="#4d5652" text-anchor="middle">先决定总预算：如 3 个额外位置</text>
  <rect x="315" y="40" width="275" height="80" rx="8" fill="var(--color-weight-soft, #fff4cf)" stroke="var(--color-weight, #c78300)" stroke-opacity="0.4" stroke-width="1.5" stroke-dasharray="5 4"/>
  <text x="452.5" y="76" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="13" font-weight="400" fill="#936300" text-anchor="middle">设备：当前批执行与草稿预测</text>
  <text x="452.5" y="95" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="13" font-weight="400" fill="#936300" text-anchor="middle">产生 A、B 各自更新的置信信息</text>
  <rect x="30" y="185" width="550" height="82" rx="8" fill="var(--color-control, #66716d)" stroke="var(--color-ink, #17211f)" stroke-width="1.5"/>
  <text x="305" y="222" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="14" font-weight="700" fill="var(--color-ink-inverse, #ffffff)" text-anchor="middle">设备：按请求映射取数，再累乘、排序</text>
  <text x="305" y="241" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="13" font-weight="400" fill="var(--color-ink-inverse, #ffffff)" text-anchor="middle">在 3 个额外位置内分配：例如 A 取 2，B 取 1</text>
  <rect x="30" y="320" width="550" height="64" rx="8" fill="var(--color-token-soft, #ddf4ef)" stroke="var(--color-token, #087f73)" stroke-opacity="0.4" stroke-width="1.5" stroke-dasharray="5 4"/>
  <text x="305" y="348" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="13" font-weight="400" fill="#065f56" text-anchor="middle">第 3–5 站：两条请求共 5 行进入下一次验证</text>
  <text x="305" y="367" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="13" font-weight="400" fill="#065f56" text-anchor="middle">结果才能告诉我们，实际留下几个候选</text>
  <text x="174" y="159" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="14" font-weight="400" fill="var(--color-ink, #17211f)">总预算 + 请求映射</text>
  <text x="470" y="159" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="14" font-weight="400" fill="var(--color-ink, #17211f)">新置信信息</text>
  <text x="305" y="432" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="14" font-weight="400" fill="var(--color-ink, #17211f)" text-anchor="middle">记录三个量：提出多少、验证多少、最终接受多少</text>
</svg>
