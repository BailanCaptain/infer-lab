<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 452" width="860" height="452" role="img" aria-label="DSpark 异步路径：CPU 预算准备、设备草稿预测与存活概率 Top-3 分配" font-family="var(--font-sans)">
<title>DSpark 异步路径：CPU 预算与设备草稿并行及存活概率分配</title>
<desc>CPU 基于历史轮次定出 3 个额外候选预算，与设备草稿预测并行；汇合后按累乘存活概率为 A 选 2 个、B 选 1 个，共 5 行进入下轮主模型验证</desc>
<g stroke-width="1.4">
<rect x="16" y="64" width="396" height="92" rx="9" fill="#e8edff" stroke="#4c65b6"/>
<rect x="448" y="64" width="396" height="92" rx="9" fill="#fff4cf" stroke="#c78300"/>
<rect x="16" y="184" width="828" height="146" rx="9" fill="#fcfbf7" stroke="#087f73"/>
<rect x="34" y="224" width="380" height="92" rx="7" fill="#f3f2ea" stroke="#c5c6bc"/>
<rect x="446" y="224" width="380" height="92" rx="7" fill="#f3f2ea" stroke="#c5c6bc"/>
<rect x="16" y="356" width="828" height="82" rx="9" fill="#ddf4ef" stroke="#087f73"/>
</g>
<g>
<rect x="78" y="253" width="180" height="13" rx="3" fill="#087f73"/>
<rect x="78" y="273" width="144" height="13" rx="3" fill="#087f73"/>
<rect x="78" y="293" width="72" height="13" rx="3" fill="#b8bcb5"/>
<rect x="490" y="253" width="120" height="13" rx="3" fill="#087f73"/>
<rect x="490" y="273" width="48" height="13" rx="3" fill="#b8bcb5"/>
<rect x="490" y="293" width="14" height="13" rx="3" fill="#b8bcb5"/>
</g>
<path d="M214 156v26m-4-5l4 5 4-5" fill="none" stroke="#4c65b6" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
<path d="M646 156v26m-4-5l4 5 4-5" fill="none" stroke="#c78300" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
<path d="M430 330v24m-4-5l4 5 4-5" fill="none" stroke="#087f73" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
<g font-weight="700">
<text x="16" y="26" font-size="16" fill="#17211f">DSpark 异步路径：CPU 预算与设备草稿并行，汇合后分名额</text>
<text x="34" y="90" font-size="14" fill="#3a4f93">① 主机 CPU（异步重叠）：决定本轮总验证预算</text>
<text x="466" y="90" font-size="14" fill="#936300">② 设备 NPU（并行执行）：跑当前批与草稿预测</text>
<text x="34" y="210" font-size="14" fill="#065f56">③ 设备端汇合修正：按请求映射取数 → 累乘连续前缀存活率 → 选出 Top-3</text>
<text x="48" y="244" font-size="12.5" fill="#17211f">请求 A 连续存活率（选前 2 个）</text>
<text x="460" y="244" font-size="12.5" fill="#17211f">请求 B 连续存活率（选前 1 个）</text>
<text x="34" y="381" font-size="14" fill="#065f56">④ 第 3–5 站：两条请求共 5 行进入下轮主模型验证，结果异步回写</text>
</g>
<g font-size="13" fill="#17211f">
<text x="34" y="114">依据历史轮次置信统计 + 实际步耗时曲线</text>
<text x="466" y="114">产出 A、B 最新逐位条件接受概率</text>
<text x="34" y="405">A 占 3 行（基础位 + A1 + A2）· B 占 2 行（基础位 + B1）；主模型最终裁定留下几个词</text>
</g>
<g font-size="12.5" fill="#4d5652">
<text x="16" y="47">箭头表示数据依赖而非等比例时间线；总预算与更新的置信信息都就绪后，设备才裁定下一轮各请求长度</text>
<text x="34" y="137" fill="#3a4f93" font-weight="600">下发：总预算 = 3 个额外位 + 请求行映射</text>
<text x="466" y="137" fill="#936300" font-weight="600">就绪：A (0.9, 0.8, 0.5) · B (0.6, 0.4, 0.2)</text>
<text x="48" y="264" font-size="12" fill="#17211f">A1</text>
<text x="266" y="264" font-size="12" fill="#065f56" font-weight="700">0.90 ✓ 入选</text>
<text x="48" y="284" font-size="12" fill="#17211f">A2</text>
<text x="230" y="284" font-size="12" fill="#065f56" font-weight="700">0.72 ✓ 入选</text>
<text x="48" y="304" font-size="12" fill="#17211f">A3</text>
<text x="158" y="304" font-size="12" fill="#66716d">0.36 截断</text>
<text x="460" y="264" font-size="12" fill="#17211f">B1</text>
<text x="618" y="264" font-size="12" fill="#065f56" font-weight="700">0.60 ✓ 入选</text>
<text x="460" y="284" font-size="12" fill="#17211f">B2</text>
<text x="546" y="284" font-size="12" fill="#66716d">0.24 截断</text>
<text x="460" y="304" font-size="12" fill="#17211f">B3</text>
<text x="512" y="304" font-size="12" fill="#66716d">0.048 截断</text>
<text x="34" y="426">排障必记三个量：草稿提出多少（6） · 实际验证多少（3） · 主模型最终接受多少</text>
</g>
</svg>
