caption: 一轮验证的教学编号。深蓝是已确定但还需送主模型的末尾，浅绿是所选草稿，虚线格是不验证的草稿。A 输入三行、B 输入两行；实际接受和替代后，新交付三个编号。没有提前停止或长度截断。
