id: dspark-intuition
caption: >-
  从 DFlash 到 DSpark 的投机解码演进对照：左侧 DFlash 将目标模型辅助隐藏态与 [Anchor, Mask₁..K] 一次并行前向并独立采样，后段缺乏自回归衔接易失真，固定预算基线送满 K 词白耗主模型验证算力；右侧 DSpark 串联轻量马尔可夫偏置头恢复局部连贯性，按逐位条件概率（示意 .92/.78/.21/.07）累乘前缀存活率（约 .920/.718/.151/.011），由本轮预算结果截断为送验 2 个草稿位置（分别对应 MRV1 初始预算入口 initial_verify_budget_per_req 与 MRV2 自适应入口 AdaptiveVerificationManager）。
