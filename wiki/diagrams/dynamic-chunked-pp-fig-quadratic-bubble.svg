  <g font-size="14" font-weight="700">
    <text x="24" y="362" fill="#3a4f93">1. 二次方程求正根</text>
    <text x="258" y="362" fill="#936300">2. 平滑与下限保护</text>
    <text x="478" y="362" fill="#7a3a6a">3. 向上凑整对齐</text>
    <text x="696" y="362" fill="#065f56">4. 预算取小与扣账</text>
  </g>
  <g font-size="12.5" fill="#4d5652">
    <text x="24" y="385" font-family="var(--font-mono)" fill="#3a4f93">ax²+(2aL+b)x = τ_rem</text>
    <text x="24" y="405">开机 1 热身 + 64 次试跑</text>
    <text x="24" y="423">&lt;8 有效点退回固定切块</text>
    <text x="258" y="385">按 <tspan font-family="var(--font-mono)" fill="#936300">smooth_factor</tspan> 平滑</text>
    <text x="258" y="405">下限 <tspan font-family="var(--font-mono)" fill="#936300">min_chunk=4096</tspan></text>
    <text x="258" y="423">避免块太碎压垮算子效率</text>
    <text x="478" y="385">向上取整至整数倍：</text>
    <text x="478" y="405" font-family="var(--font-mono)" fill="#7a3a6a">max(block_size, 64)</text>
    <text x="478" y="423">粗粒度凑整会带回少量空等</text>
    <text x="696" y="385" font-family="var(--font-mono)" fill="#065f56">min(x, token_budget)</text>
    <text x="696" y="405">只切小、不突破步预算上限</text>
    <text x="696" y="423">decode 占 token 不扣时间账</text>
  </g>
  <g stroke-width="1.4">
    <rect x="12" y="450" width="430" height="102" rx="9" fill="#ece9df" stroke="#b8bcb5"/>
    <rect x="458" y="450" width="430" height="102" rx="9" fill="#fff0e9" stroke="#b54237"/>
  </g>
  <text x="26" y="474" font-size="14.5" font-weight="700" fill="#17211f">v0.30.0（c09d3e20，主基线）：保留并升级</text>
  <g font-size="12.5" fill="#4d5652">
    <text x="26" y="497">• 历史拟合改用非负最小二乘 <tspan font-family="var(--font-mono)" font-weight="700" fill="#065f56">nnls</tspan>：<tspan font-family="var(--font-mono)">a∑C(C+H)+b∑C+c</tspan></text>
    <text x="26" y="518">• 新增 <tspan font-family="var(--font-mono)" fill="#3a4f93">ProfilingChunkAsyncScheduler</tspan>（仅限 MRV2）</text>
    <text x="26" y="539">• 须 <tspan font-family="var(--font-mono)">PP &gt; 1</tspan>；与 <tspan font-family="var(--font-mono)">balance_scheduling</tspan> / <tspan font-family="var(--font-mono)">DyntraLB</tspan> 互斥</text>
  </g>
  <text x="472" y="474" font-size="14.5" font-weight="700" fill="#8f3229">main（8d6180e2）：PR #21310 整体移除 CPP</text>
  <g font-size="12.5" fill="#4d5652">
    <text x="472" y="497">• 继 PR #21317 弃用告警后，完整删除 CPP 全部源码</text>
    <text x="472" y="518">• 移除 <tspan font-family="var(--font-mono)">ProfilingChunkConfig</tspan>、预测器、调度器与引擎补丁</text>
    <text x="472" y="539">• 升级至 <tspan font-weight="700" fill="#8f3229">main</tspan> 不可再依赖 <tspan font-family="var(--font-mono)">profiling_chunk_config</tspan></text>
  </g>
