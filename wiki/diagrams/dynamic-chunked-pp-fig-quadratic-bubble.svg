<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 564" width="900" height="564" role="img" aria-label="动态分块流水线等尺甘特图、块长反解流水线与版本生命周期图" font-family="var(--font-sans)">
  <title>动态分块流水线（CPP）：同尺 23 格 vs 17 格流水甘特图、反解四步与 v0.30.0/main 生命周期</title>
  <desc>上半在同一时间标尺 t=0..23 上并排展示等长分块 1:3:5:7（阶段 1 空等 7 格、总耗时 23 格）与按耗时反解为 16 块每块 1 格（仅首块等 1 格、总耗时 17 格，省去 6 格气泡即 -26%）的真实两段流水线甘特排程；中段展示二次方程求正根到预算截断的四步流水；底栏对照 v0.30.0 保留增强与 main PR #21310 整体移除。</desc>
