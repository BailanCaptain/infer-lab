  <text x="44" y="128" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="12.5" font-weight="400" fill="var(--color-ink-muted, #5b6763)">4 步走完，一格 = 一份时间</text>
  <text x="44" y="216" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="12.5" font-weight="400" fill="var(--color-ink-muted, #5b6763)">一块 32768 个 token，耗时却是 T : 3T : 5T : 7T——比例由 f(l) = a·l² 直接给出。</text>
