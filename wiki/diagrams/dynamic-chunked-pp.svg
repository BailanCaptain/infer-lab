<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 560" width="900" height="560" role="img" aria-label="同一条 131072 token 的 prefill：固定块 4 步、耗时 1:3:5:7；动态块 16 步、每步一样长。横向长度都是耗时，两排一样长——省掉的是下一级的等待，不是计算">
  <title>同一条 131072 token 的 prefill：固定块 4 步、耗时 1:3:5:7；动态块 16 步、每步一样长。横向长度都是耗时，两排一样长——省掉的是下一级的等待，不是计算</title>
  <rect width="900" height="560" fill="var(--color-surface, #fbfaf6)"/>
  <rect x="20" y="26" width="860" height="214" rx="12" fill="var(--color-canvas, #f5f2ea)"/>
  <rect x="36" y="40" width="246.1" height="26.5" rx="13.3" fill="var(--color-ink-faint, #8a928f)"/><text x="47" y="58.1" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="13.5" font-weight="700" fill="var(--color-ink-inverse, #ffffff)">固定块 · 每块都是 32768 个 token</text>
  <text x="38" y="83" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="12.5" font-weight="400" fill="var(--color-ink-muted, #5b6763)">块一样大，注意力却是 O(n²)：第 4 块要对着 98304 个前缀 token 做注意力，耗时是第 1 块的 7 倍。下一级流水线只能干等着它。</text>
  <rect x="20" y="258" width="860" height="214" rx="12" fill="var(--color-accent-soft, #fff0e9)"/>
  <rect x="36" y="272" width="214" height="26.5" rx="13.3" fill="var(--color-accent, #e85b32)"/><text x="47" y="290.1" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="13.5" font-weight="700" fill="var(--color-ink-inverse, #ffffff)">动态块 · 每块都是同样的耗时 T</text>
  <text x="38" y="315" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="12.5" font-weight="400" fill="var(--color-ink-muted, #5b6763)">目标耗时 T 定死，反解出这一步能塞多少 token。前缀越长切得越薄，同一条 128k 输入被切成 16 块，每块花掉一样多的时间。</text>
  <rect x="20" y="490" width="860" height="54" rx="10" fill="var(--color-weight-soft, #fff4cf)"/>
  <rect x="20" y="490" width="5" height="54" rx="2.5" fill="var(--color-weight, #b87a00)"/>
  <g transform="translate(43.8 506.8) scale(0.85)" fill="none" stroke="var(--color-weight, #b87a00)" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M5 3h14v18H5z M8 7h8M8 11h2M12 11h2M8 15h2M12 15h2"/></g>
  <text x="78" y="514" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="15" font-weight="700" fill="var(--color-ink, #17211f)">每步反解出这一步切多少 token</text>
  <text x="78" y="534" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="12.5" font-weight="400" fill="var(--color-ink-muted, #5b6763)">取正根、平滑、对齐，再 min(predicted_chunk, num_new_tokens)</text>
  <rect x="708" y="504.5" width="153" height="21.5" rx="10.8" fill="var(--color-surface, #fbfaf6)" stroke="var(--color-weight, #b87a00)" stroke-width="1"/><text x="784.5" y="522" font-family="'JetBrains Mono',ui-monospace,monospace" font-size="12.5" font-weight="400" fill="var(--color-weight, #b87a00)" text-anchor="middle">predict_chunk_size</text>
