layout: scene
id: dynamic-chunked-pp
caption: 同一条 131072 token 的 prefill：固定块 4 步、耗时 1:3:5:7；动态块 16 步、每步一样长。横向长度都是耗时，两排一样长——省掉的是下一级的等待，不是计算
size: [900, 560]

regions:
  - label: 固定块 · 每块都是 32768 个 token
    note: 块一样大，注意力却是 O(n²)：第 4 块要对着 98304 个前缀 token 做注意力，耗时是第 1 块的 7 倍。下一级流水线只能干等着它。
    at: [20, 26]
    size: [860, 214]
    tone: muted
  - label: 动态块 · 每块都是同样的耗时 T
    note: 目标耗时 T 定死，反解出这一步能塞多少 token。前缀越长切得越薄，同一条 128k 输入被切成 16 块，每块花掉一样多的时间。
    at: [20, 258]
    size: [860, 214]
    tone: accent

