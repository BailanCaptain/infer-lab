    text: 4 步走完，一格 = 一份时间
    size: 12.5
    width: 300
  - at: [44, 216]
    text: "一块 32768 个 token，耗时却是 T : 3T : 5T : 7T——比例由 f(l) = a·l² 直接给出。"
    size: 12.5
    width: 816
  - at: [44, 360]
