<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 236" width="880" height="236" role="img" aria-label="数为示意，一格是一段时间，用分阶段执行的一个 MoE 层说明两处可能的等待。图中假设两组历史处理负载不同，导致 dispatch 前的等待；专家冷热不同导致 combine 前的等待。实际耗时不由 KV 块数直接换算，各层和各步也不一定相同，通信与计算可能重叠。">
  <title>数为示意，一格是一段时间，用分阶段执行的一个 MoE 层说明两处可能的等待。图中假设两组历史处理负载不同，导致 dispatch 前的等待；专家冷热不同导致 combine 前的等待。实际耗时不由 KV 块数直接换算，各层和各步也不一定相同，通信与计算可能重叠。</title>
