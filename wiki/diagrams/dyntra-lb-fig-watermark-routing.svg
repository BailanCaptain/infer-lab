<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 440" width="900" height="440" role="img" aria-label="DyntraLB D 端 KV 水位均衡闭环与边界" font-family="var(--font-sans)">
<title>DyntraLB D 端 KV 水位均衡闭环与边界</title>
<desc>Step-end KV-block All-Gather, deterministic 4-step planner, local pause retaining KV vs preemption, and D-node MoE DP constraints in v0.30.0 and main</desc>
<line x1="16" y1="246" x2="884" y2="246" stroke="#d8d8cf" stroke-width="1.5" stroke-dasharray="6 4"/>
<g stroke-width="1.4">
