<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 630" width="900" height="630" role="img" aria-label="左边是每组引擎每步转的一圈，右边是全局还有活时 DyntraLB 在这一步末尾多做的事；虚线表示计划要到下一步开头才执行。这里的 main 与 rc2 上游在第 1 步及之后每 16 步（默认可配）同步，旧部署的 32 步不能直接套入；候选被选中仍须通过后续调度检查。">
  <title>左边是每组引擎每步转的一圈，右边是全局还有活时 DyntraLB 在这一步末尾多做的事；虚线表示计划要到下一步开头才执行。这里的 main 与 rc2 上游在第 1 步及之后每 16 步（默认可配）同步，旧部署的 32 步不能直接套入；候选被选中仍须通过后续调度检查。</title>
  <defs><marker id="dyntra-lb-flow-ah-ink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="var(--color-ink, #17211f)"/></marker><marker id="dyntra-lb-flow-ah-control" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="var(--color-control, #66716d)"/></marker></defs>
  <rect x="20" y="60" width="400" height="500" rx="16" fill="none" stroke="var(--color-line-strong, #b8bcb5)" stroke-width="1.5"/>
  <text x="36" y="84" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="13" font-weight="700" fill="var(--color-ink, #17211f)">每组的 EngineCore · 每步一圈</text>
  <rect x="470" y="60" width="410" height="500" rx="16" fill="none" stroke="var(--color-line-strong, #b8bcb5)" stroke-width="1.5"/>
  <text x="486" y="84" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="13" font-weight="700" fill="var(--color-ink, #17211f)">全局还有活时多做的事</text>
  <path d="M220 156 L220 196" fill="none" stroke="var(--color-ink, #17211f)" stroke-width="1.4" marker-end="url(#dyntra-lb-flow-ah-ink)"/>
  <path d="M220 252 L220 292" fill="none" stroke="var(--color-ink, #17211f)" stroke-width="1.4" marker-end="url(#dyntra-lb-flow-ah-ink)"/>
  <path d="M220 348 L220 388" fill="none" stroke="var(--color-ink, #17211f)" stroke-width="1.4" marker-end="url(#dyntra-lb-flow-ah-ink)"/>
  <path d="M390 320 L445 320 L445 128 L500 128" fill="none" stroke="var(--color-ink, #17211f)" stroke-width="1.4" marker-end="url(#dyntra-lb-flow-ah-ink)"/>
  <path d="M675 156 L675 196" fill="none" stroke="var(--color-ink, #17211f)" stroke-width="1.4" marker-end="url(#dyntra-lb-flow-ah-ink)"/>
  <path d="M675 252 L675 292" fill="none" stroke="var(--color-ink, #17211f)" stroke-width="1.4" marker-end="url(#dyntra-lb-flow-ah-ink)"/>
  <path d="M675 348 L675 388" fill="none" stroke="var(--color-ink, #17211f)" stroke-width="1.4" marker-end="url(#dyntra-lb-flow-ah-ink)"/>
  <path d="M675 444 L675 484" fill="none" stroke="var(--color-ink, #17211f)" stroke-width="1.4" marker-end="url(#dyntra-lb-flow-ah-ink)"/>
  <path d="M850 128 L866 128 L866 512 L850 512" fill="none" stroke="var(--color-ink, #17211f)" stroke-width="1.4" marker-end="url(#dyntra-lb-flow-ah-ink)"/>
  <path d="M675 540 L675 584 L34 584 L34 128 L50 128" fill="none" stroke="var(--color-control, #66716d)" stroke-width="1.4" stroke-dasharray="7 5" marker-end="url(#dyntra-lb-flow-ah-control)"/>
  <rect x="50" y="100" width="340" height="56" rx="8" fill="var(--color-weight-soft, #fff4cf)" stroke="var(--color-weight, #c78300)" stroke-width="1.4"/>
  <text x="220" y="124" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="14" font-weight="700" fill="var(--color-ink, #17211f)" text-anchor="middle">调度并执行一步</text>
  <text x="220" y="143" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="13" font-weight="400" fill="#936300" text-anchor="middle">开头先执行上一步留下的计划</text>
  <rect x="50" y="196" width="340" height="56" rx="8" fill="var(--color-control-soft, #f1efe8)" stroke="var(--color-control, #66716d)" stroke-width="1.4"/>
  <text x="220" y="220" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="14" font-weight="700" fill="var(--color-ink, #17211f)" text-anchor="middle">本地没有请求可算？</text>
  <text x="220" y="239" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="13" font-weight="400" fill="var(--color-ink-muted, #66716d)" text-anchor="middle">是：全局还有活就陪跑一步</text>
  <rect x="50" y="292" width="340" height="56" rx="8" fill="var(--color-control-soft, #f1efe8)" stroke="var(--color-line-strong, #b8bcb5)" stroke-width="1.4"/>
  <text x="220" y="316" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="14" font-weight="700" fill="var(--color-ink, #17211f)" text-anchor="middle">全局还有没有活</text>
  <text x="220" y="335" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="13" font-weight="400" fill="var(--color-ink-muted, #66716d)" text-anchor="middle">隔若干步才真跨组同步一次</text>
  <rect x="50" y="388" width="340" height="64" rx="8" fill="var(--color-control-soft, #f1efe8)" stroke="var(--color-line-strong, #b8bcb5)" stroke-width="1.4"/>
  <text x="220" y="416" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="14" font-weight="700" fill="var(--color-ink, #17211f)" text-anchor="middle">自然空闲：这一波结束</text>
  <text x="220" y="435" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="13" font-weight="400" fill="var(--color-ink-muted, #66716d)" text-anchor="middle">计划作废，步数归零，等新请求</text>
  <rect x="500" y="100" width="350" height="56" rx="8" fill="var(--color-control-soft, #f1efe8)" stroke="var(--color-line-strong, #b8bcb5)" stroke-width="1.4"/>
  <text x="675" y="124" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="14" font-weight="700" fill="var(--color-ink, #17211f)" text-anchor="middle">这一步生效吗？</text>
  <text x="675" y="143" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="13" font-weight="400" fill="var(--color-ink-muted, #66716d)" text-anchor="middle">dynamic 未激活时先互报长请求标志</text>
  <rect x="500" y="196" width="350" height="56" rx="8" fill="var(--color-kv-soft, #e8edff)" stroke="var(--color-kv, #4c65b6)" stroke-width="1.4"/>
  <text x="675" y="220" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="14" font-weight="700" fill="var(--color-ink, #17211f)" text-anchor="middle">准备候选</text>
  <text x="675" y="239" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="13" font-weight="400" fill="#3a4f93" text-anchor="middle">尝试预取 KV，排除暂未就绪者</text>
  <rect x="500" y="292" width="350" height="56" rx="8" fill="var(--color-comm-soft, #f5e6f0)" stroke="var(--color-comm, #9a4b86)" stroke-width="1.4"/>
  <text x="675" y="316" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="14" font-weight="700" fill="var(--color-ink, #17211f)" text-anchor="middle">All-Gather 互报块数</text>
  <text x="675" y="335" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="13" font-weight="400" fill="#7a3a6a" text-anchor="middle">running、候选、条数、长请求标志</text>
  <rect x="500" y="388" width="350" height="56" rx="8" fill="var(--color-control-soft, #f1efe8)" stroke="var(--color-control, #66716d)" stroke-width="1.4"/>
  <text x="675" y="412" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="14" font-weight="700" fill="var(--color-ink, #17211f)" text-anchor="middle">同一套算法出计划</text>
  <text x="675" y="431" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="13" font-weight="400" fill="var(--color-ink-muted, #66716d)" text-anchor="middle">补空位 → 换人 → 必要时停一条</text>
  <rect x="500" y="484" width="350" height="56" rx="8" fill="var(--color-control-soft, #f1efe8)" stroke="var(--color-line-strong, #b8bcb5)" stroke-width="1.4"/>
  <text x="675" y="508" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="14" font-weight="700" fill="var(--color-ink, #17211f)" text-anchor="middle">计划留给下一步</text>
  <text x="675" y="527" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="13" font-weight="400" fill="var(--color-ink-muted, #66716d)" text-anchor="middle">不生效时计划为空，照常调度</text>
  <text x="450" y="30" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="13.5" font-weight="700" fill="var(--color-ink, #17211f)" text-anchor="middle">每步末尾多一次互报，下一步开头执行计划</text>
  <text x="232" y="376" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="13.5" font-weight="400" fill="var(--color-ink, #17211f)">没有</text>
  <text x="452" y="312" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="13.5" font-weight="400" fill="var(--color-ink, #17211f)">有</text>
  <text x="687" y="186" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="13.5" font-weight="400" fill="var(--color-ink, #17211f)">是</text>
  <text x="856" y="118" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="13.5" font-weight="400" fill="var(--color-ink, #17211f)">否</text>
  <text x="450" y="612" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="13.5" font-weight="400" fill="var(--color-ink-muted, #66716d)" text-anchor="middle" font-style="italic">虚线：计划到下一步开头才执行</text>
</svg>
