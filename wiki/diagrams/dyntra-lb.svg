<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 700" width="900" height="700" role="img" aria-label="每个 DP rank 把自己这一刻的每条请求占几个 KV 块打成一个定长向量 all_gather 出去，planner 算出的计划里也只有块数；这份计划留到下一步开头才被执行">
  <title>每个 DP rank 把自己这一刻的每条请求占几个 KV 块打成一个定长向量 all_gather 出去，planner 算出的计划里也只有块数；这份计划留到下一步开头才被执行</title>
  <rect width="900" height="700" fill="var(--color-surface, #fbfaf6)"/>
  <rect x="20" y="20" width="860" height="256" rx="12" fill="var(--color-surface-sunken, #ece9df)"/>
  <rect x="36" y="34" width="409.4" height="26.5" rx="13.3" fill="var(--color-control, #5b6763)"/><text x="47" y="52.1" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="13.5" font-weight="700" fill="var(--color-ink-inverse, #ffffff)">步 N 末尾：每个 rank 把自己这一刻的负载打包成一个定长向量</text>
  <text x="38" y="77" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="12.5" font-weight="400" fill="var(--color-ink-muted, #5b6763)">这张图按 max_num_seqs = 4 画，向量长 2×4+2 = 10 个 int32，每一格是一条请求占了几个 KV 块。</text>
  <rect x="20" y="306" width="860" height="160" rx="12" fill="var(--color-weight-soft, #fff4cf)"/>
  <rect x="36" y="320" width="448.9" height="26.5" rx="13.3" fill="var(--color-weight, #b87a00)"/><text x="47" y="338.1" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="13.5" font-weight="700" fill="var(--color-ink-inverse, #ffffff)">planner：每个 rank 拿同一张全局表跑同一个函数，只取自己那一份</text>
  <text x="38" y="363" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="12.5" font-weight="400" fill="var(--color-ink-muted, #5b6763)">先把各 rank 的 running 补到 max_num_seqs，再反复交换或丢弃，直到 max − avg 小于 bubble_threshold。</text>
  <rect x="20" y="502" width="860" height="178" rx="12" fill="var(--color-accent-soft, #fff0e9)"/>
  <rect x="36" y="516" width="381.1" height="26.5" rx="13.3" fill="var(--color-accent, #e85b32)"/><text x="47" y="534.1" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="13.5" font-weight="700" fill="var(--color-ink-inverse, #ffffff)">步 N+1 开头：schedule() 里两处落点，这份计划只用一次</text>
  <text x="38" y="559" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="12.5" font-weight="400" fill="var(--color-ink-muted, #5b6763)">这一帧真算出来的：DP0 暂停 [700]、接纳 [2]；DP1 暂停 []、接纳 [2]，两边都没有 freeze。</text>
  <line x1="20" y1="486" x2="880" y2="486" stroke="var(--color-accent, #e85b32)" stroke-width="2.5" stroke-dasharray="7 5"/>
  <text x="876" y="477" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="13" font-weight="700" fill="var(--color-accent, #e85b32)" text-anchor="end">计划跨过这条线才被使用：步 N 末尾算出，步 N+1 开头执行</text>
  <rect x="56" y="120" width="30" height="26" rx="3" fill="var(--color-accent, #e85b32)" stroke="var(--color-accent, #e85b32)" stroke-width="1.1"/>
  <rect x="92" y="120" width="30" height="26" rx="3" fill="var(--color-accent, #e85b32)" stroke="var(--color-accent, #e85b32)" stroke-width="1.1"/>
  <rect x="128" y="120" width="30" height="26" rx="3" fill="var(--color-accent, #e85b32)" stroke="var(--color-accent, #e85b32)" stroke-width="1.1"/>
  <text x="56" y="164" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="12.5" font-weight="400" fill="var(--color-ink-muted, #5b6763)">DP0 · [700, 2, 2] + 待接纳 [2]，合计 706 块</text>
  <rect x="164" y="120" width="30" height="26" rx="3" fill="var(--color-control, #5b6763)" stroke="var(--color-control, #5b6763)" stroke-width="1.1"/>
  <rect x="200" y="120" width="30" height="26" rx="3" fill="var(--color-surface-sunken, #ece9df)" stroke="var(--color-control, #5b6763)" stroke-width="1.1"/>
  <rect x="236" y="120" width="30" height="26" rx="3" fill="var(--color-surface-sunken, #ece9df)" stroke="var(--color-control, #5b6763)" stroke-width="1.1"/>
  <rect x="272" y="120" width="30" height="26" rx="3" fill="var(--color-surface-sunken, #ece9df)" stroke="var(--color-control, #5b6763)" stroke-width="1.1"/>
  <rect x="308" y="120" width="30" height="26" rx="3" fill="var(--color-surface-sunken, #ece9df)" stroke="var(--color-control, #5b6763)" stroke-width="1.1"/>
  <rect x="344" y="120" width="30" height="26" rx="3" fill="var(--color-weight, #b87a00)" stroke="var(--color-weight, #b87a00)" stroke-width="1.1"/>
  <rect x="380" y="120" width="30" height="26" rx="3" fill="var(--color-weight-soft, #fff4cf)" stroke="var(--color-weight, #b87a00)" stroke-width="1.1"/>
  <rect x="56" y="190" width="30" height="26" rx="3" fill="var(--color-accent, #e85b32)" stroke="var(--color-accent, #e85b32)" stroke-width="1.1"/>
  <rect x="92" y="190" width="30" height="26" rx="3" fill="var(--color-accent, #e85b32)" stroke="var(--color-accent, #e85b32)" stroke-width="1.1"/>
  <rect x="128" y="190" width="30" height="26" rx="3" fill="var(--color-accent, #e85b32)" stroke="var(--color-accent, #e85b32)" stroke-width="1.1"/>
  <text x="56" y="234" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="12.5" font-weight="400" fill="var(--color-ink-muted, #5b6763)">DP1 · [2, 2, 2] + 待接纳 [2]，合计 6 块</text>
  <rect x="164" y="190" width="30" height="26" rx="3" fill="var(--color-control, #5b6763)" stroke="var(--color-control, #5b6763)" stroke-width="1.1"/>
  <rect x="200" y="190" width="30" height="26" rx="3" fill="var(--color-surface-sunken, #ece9df)" stroke="var(--color-control, #5b6763)" stroke-width="1.1"/>
  <rect x="236" y="190" width="30" height="26" rx="3" fill="var(--color-surface-sunken, #ece9df)" stroke="var(--color-control, #5b6763)" stroke-width="1.1"/>
  <rect x="272" y="190" width="30" height="26" rx="3" fill="var(--color-surface-sunken, #ece9df)" stroke="var(--color-control, #5b6763)" stroke-width="1.1"/>
  <rect x="308" y="190" width="30" height="26" rx="3" fill="var(--color-surface-sunken, #ece9df)" stroke="var(--color-control, #5b6763)" stroke-width="1.1"/>
  <rect x="344" y="190" width="30" height="26" rx="3" fill="var(--color-weight, #b87a00)" stroke="var(--color-weight, #b87a00)" stroke-width="1.1"/>
  <rect x="380" y="190" width="30" height="26" rx="3" fill="var(--color-weight-soft, #fff4cf)" stroke="var(--color-weight, #b87a00)" stroke-width="1.1"/>
  <rect x="446" y="116" width="414" height="100" rx="11" fill="var(--color-surface, #fbfaf6)" stroke="var(--color-weight, #b87a00)" stroke-width="1.5"/>
  <rect x="458" y="150" width="32" height="32" rx="9" fill="var(--color-weight-soft, #fff4cf)"/><g transform="translate(464.4 156.4) scale(0.8)" fill="none" stroke="var(--color-weight, #b87a00)" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3l9 5-9 5-9-5z M3 13l9 5 9-5"/></g>
  <text x="498" y="154" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="14.5" font-weight="700" fill="var(--color-ink, #17211f)">一次 all_gather，谁手里都是同一张表</text>
  <text x="498" y="172" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="12.5" font-weight="400" fill="var(--color-ink-muted, #5b6763)">活跃的每一步一次，只传这 10 个 int32</text>
  <text x="498" y="189" font-family="'JetBrains Mono',ui-monospace,monospace" font-size="12.5" font-weight="400" fill="var(--color-weight, #b87a00)">_do_lb_allgather</text>
  <rect x="40" y="396" width="400" height="66" rx="11" fill="var(--color-surface, #fbfaf6)" stroke="var(--color-weight, #b87a00)" stroke-width="1.5"/>
  <rect x="52" y="413" width="32" height="32" rx="9" fill="var(--color-weight-soft, #fff4cf)"/><g transform="translate(58.4 419.4) scale(0.8)" fill="none" stroke="var(--color-weight, #b87a00)" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M5 3h14v18H5z M8 7h8M8 11h2M12 11h2M8 15h2M12 15h2"/></g>
  <text x="92" y="417" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="14.5" font-weight="700" fill="var(--color-ink, #17211f)">失衡够大才动手</text>
  <text x="92" y="435" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="12.5" font-weight="400" fill="var(--color-ink-muted, #5b6763)">max − avg ≥ 5 个 KV 块（默认）</text>
  <text x="92" y="452" font-family="'JetBrains Mono',ui-monospace,monospace" font-size="12.5" font-weight="400" fill="var(--color-weight, #b87a00)">calc_bubble</text>
  <rect x="460" y="396" width="400" height="66" rx="11" fill="var(--color-surface, #fbfaf6)" stroke="var(--color-accent, #e85b32)" stroke-width="1.5"/>
  <rect x="472" y="413" width="32" height="32" rx="9" fill="var(--color-accent-soft, #fff0e9)"/><g transform="translate(478.4 419.4) scale(0.8)" fill="none" stroke="var(--color-accent, #e85b32)" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M13 2L4 14h7l-1 8 9-12h-7z"/></g>
  <text x="512" y="417" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="14.5" font-weight="700" fill="var(--color-ink, #17211f)">换不动就直接丢一条</text>
  <text x="512" y="435" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="12.5" font-weight="400" fill="var(--color-ink-muted, #5b6763)">一步耗时按 20000 + 19.2 × 最大块数 估</text>
  <text x="512" y="452" font-family="'JetBrains Mono',ui-monospace,monospace" font-size="12.5" font-weight="400" fill="var(--color-accent, #e85b32)">try_drop_for_throughput</text>
  <rect x="40" y="592" width="400" height="72" rx="11" fill="var(--color-surface, #fbfaf6)" stroke="var(--color-accent, #e85b32)" stroke-width="1.5"/>
  <rect x="52" y="612" width="32" height="32" rx="9" fill="var(--color-accent-soft, #fff0e9)"/><g transform="translate(58.4 618.4) scale(0.8)" fill="none" stroke="var(--color-accent, #e85b32)" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M3 8h18v8H3z M9 8v8M15 8v8"/></g>
  <text x="92" y="616" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="14.5" font-weight="700" fill="var(--color-ink, #17211f)">out_blk：暂停，但 KV 不还</text>
  <text x="92" y="634" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="12.5" font-weight="400" fill="var(--color-ink-muted, #5b6763)">状态改成 PREEMPTED，块留着，塞回队头</text>
  <text x="92" y="651" font-family="'JetBrains Mono',ui-monospace,monospace" font-size="12.5" font-weight="400" fill="var(--color-accent, #e85b32)">_lb_pause_request</text>
  <rect x="460" y="592" width="400" height="72" rx="11" fill="var(--color-surface, #fbfaf6)" stroke="var(--color-accent, #e85b32)" stroke-width="1.5"/>
  <rect x="472" y="612" width="32" height="32" rx="9" fill="var(--color-accent-soft, #fff0e9)"/><g transform="translate(478.4 618.4) scale(0.8)" fill="none" stroke="var(--color-accent, #e85b32)" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3l8 5v8l-8 5-8-5V8z M12 3v18"/></g>
  <text x="512" y="616" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="14.5" font-weight="700" fill="var(--color-ink, #17211f)">in_blk：只有名单上的能进 running</text>
  <text x="512" y="634" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="12.5" font-weight="400" fill="var(--color-ink-muted, #5b6763)">块数对不上的这一步一律跳过</text>
  <text x="512" y="651" font-family="'JetBrains Mono',ui-monospace,monospace" font-size="12.5" font-weight="400" fill="var(--color-accent, #e85b32)">_can_admit_waiting_request</text>
  <path d="M653 220 L653 302" fill="none" stroke="var(--color-weight, #b87a00)" stroke-width="1.8"/>
  <path d="M653 302 l-5.5 -11 l11 0 z" fill="var(--color-weight, #b87a00)"/>
