  <text x="107" y="97" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="12.5" font-weight="600" fill="var(--color-accent, #e85b32)" text-anchor="middle">running</text>
  <path d="M164 114 l0 -9 L338 105 l0 9" fill="none" stroke="var(--color-control, #5b6763)" stroke-width="1.4" opacity="0.75"/>
  <text x="251" y="97" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="12.5" font-weight="600" fill="var(--color-control, #5b6763)" text-anchor="middle">可接纳的 waiting</text>
  <path d="M344 114 l0 -9 L410 105 l0 9" fill="none" stroke="var(--color-weight, #b87a00)" stroke-width="1.4" opacity="0.75"/>
  <text x="377" y="97" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="12.5" font-weight="600" fill="var(--color-weight, #b87a00)" text-anchor="middle">条数 ＋ 标志</text>
  <text x="20" y="692" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="12.5" font-weight="600" fill="var(--color-ink, #17211f)">全组拿到的是同一张表，各自只取 modifications[dp_rank]——计划各算各的，结果必然一致。</text>
</svg>
