layout: figure
id: dyntra-lb
caption: 数为示意，格子里是每条请求占的 KV 块数，长条是这一组合计要读的块。从左往右读：本步末尾各组数自己的请求 → 互报成同一张表 → 下一步 DP1 停一条短的、换进 64 块那条，DP0 冻结不接新请求。
