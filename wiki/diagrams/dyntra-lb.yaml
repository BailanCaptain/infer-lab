layout: scene
id: dyntra-lb
caption: 每个 DP rank 把自己这一刻的每条请求占几个 KV 块打成一个定长向量 all_gather 出去，planner 算出的计划里也只有块数；这份计划留到下一步开头才被执行
size: [900, 700]

regions:
  - label: 步 N 末尾：每个 rank 把自己这一刻的负载打包成一个定长向量
    note: 这张图按 max_num_seqs = 4 画，向量长 2×4+2 = 10 个 int32，每一格是一条请求占了几个 KV 块。
    at: [20, 20]
    size: [860, 256]
    tone: upstream
  - label: planner：每个 rank 拿同一张全局表跑同一个函数，只取自己那一份
    note: 先把各 rank 的 running 补到 max_num_seqs，再反复交换或丢弃，直到 max − avg 小于 bubble_threshold。
    at: [20, 306]
    size: [860, 160]
    tone: ascend
  - label: 步 N+1 开头：schedule() 里两处落点，这份计划只用一次
    note: 这一帧真算出来的：DP0 暂停 [700]、接纳 [2]；DP1 暂停 []、接纳 [2]，两边都没有 freeze。
    at: [20, 502]
    size: [860, 178]
    tone: accent

