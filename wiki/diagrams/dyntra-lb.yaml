layout: figure
id: dyntra-lb
caption: 每个 rank 最多同时跑 4 条请求。DP0 被一条 128 块的长对话压着，DP1 只有 4 块；计划让 DP1 暂停一条 1 块的短问答、换进候补里那条 64 块的请求，DP0 这一步不放新请求进来。条长按块数等比例画
size: [900, 270]

texts:
  - { at: [30, 34], text: 算计划前, size: 14, strong: true }
  - { at: [30, 72], text: DP0, size: 13.5, strong: true }
  - { at: [30, 110], text: DP1, size: 13.5, strong: true }
  - { at: [30, 166], text: 按计划执行后, size: 14, strong: true }
  - { at: [30, 204], text: DP0, size: 13.5, strong: true }
  - { at: [30, 242], text: DP1, size: 13.5, strong: true }
  - { at: [716, 204], text: 冻结：不放新请求, size: 13, note: true }
  - { at: [430, 242], text: 暂停 1 条短的，KV 留着, size: 13, note: true }

