<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 544" width="900" height="544" role="img" aria-label="同步采样与历史 v0.23.0 异步指数采样（enable_async_exponential）时序对照及 v0.30.0/main 移除状态" font-family="var(--font-sans)">
  <title>v0.23.0 将指数随机数 q 的生成从 softmax 之后提前到 forward 之前提交至 global_stream 争取重叠，采样前仍须 host 侧同步；v0.25.1rc1（PR #12306）起整体删除，v0.30.0 仅保留同步 random_sample（补 record_stream），main 退役 MRV1 采样器。</title>
  <desc>Timeline comparison of synchronous vs v0.23.0 async exponential random sampling on global_stream, highlighting host-blocking Event.synchronize vs device wait_stream and v0.30.0/main removal.</desc>
  <defs>
    <marker id="eae-arr-g" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="#66716d"/>
    </marker>
    <marker id="eae-arr-t" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="#087f73"/>
    </marker>
    <marker id="eae-arr-a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="#c78300"/>
    </marker>
    <marker id="eae-arr-p" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="#9a4b86"/>
    </marker>
  </defs>

  <text x="16" y="26" font-size="16" font-weight="700" fill="#17211f">采样随机数 q ~ Exp(1) 的生成时机：同步默认 vs 历史异步预填</text>
  <text x="16" y="46" font-size="13.5" fill="#66716d">均在 global_stream() 填 q：前移填充至 forward 前，且同步侧用流间 wait_stream()、异步侧用 Event.synchronize()</text>

  <!-- Section A: Default Sync -->
  <text x="16" y="78" font-size="14.5" font-weight="700" fill="#17211f">① 关（默认 · 同步路径）：q 在 softmax 之后才填（v0.30.0 保留并补 record_stream）</text>

  <rect x="16" y="92" width="198" height="82" rx="8" fill="#e8edff" stroke="#4c65b6" stroke-width="1.3"/>
  <text x="28" y="116" font-size="14.5" font-weight="700" fill="#3a4f93">1. model forward</text>
  <text x="28" y="139" font-size="13.5" fill="#4d5652" font-family="var(--font-mono)">execute_model</text>
  <text x="28" y="161" font-size="13.5" fill="#66716d">默认流依次跑模型各层</text>

  <path d="M 214 133 L 234 133" fill="none" stroke="#66716d" stroke-width="1.7" marker-end="url(#eae-arr-g)"/>

  <rect x="238" y="92" width="198" height="82" rx="8" fill="#e8edff" stroke="#4c65b6" stroke-width="1.3"/>
  <text x="250" y="116" font-size="14.5" font-weight="700" fill="#3a4f93">2. softmax 出 probs</text>
  <text x="250" y="139" font-size="13.5" fill="#4d5652" font-family="var(--font-mono)">logits.softmax</text>
  <text x="250" y="161" font-size="13.5" fill="#66716d">fp32，宽 = 词表大小</text>

  <path d="M 436 133 L 456 133" fill="none" stroke="#66716d" stroke-width="1.7" marker-end="url(#eae-arr-g)"/>

  <rect x="460" y="92" width="198" height="82" rx="8" fill="#fff4cf" stroke="#c78300" stroke-width="1.4"/>
  <text x="472" y="116" font-size="14.5" font-weight="700" fill="#936300">3. 现填随机数 q</text>
  <text x="472" y="139" font-size="13.5" fill="#4d5652" font-family="var(--font-mono)">q.exponential_()</text>
  <text x="472" y="161" font-size="13.5" fill="#4d5652">设备侧 wait_stream 等</text>

  <path d="M 658 133 L 678 133" fill="none" stroke="#66716d" stroke-width="1.7" marker-end="url(#eae-arr-g)"/>

  <rect x="682" y="92" width="202" height="82" rx="8" fill="#ddf4ef" stroke="#087f73" stroke-width="1.4"/>
  <text x="694" y="116" font-size="14.5" font-weight="700" fill="#065f56">4. 除 q 取 argmax</text>
  <text x="694" y="139" font-size="13.5" fill="#4d5652" font-family="var(--font-mono)">random_sample</text>
  <text x="694" y="161" font-size="13.5" fill="#4d5652">输出本步采样 token</text>

  <!-- Divider -->
  <line x1="16" y1="192" x2="884" y2="192" stroke="#d8d8cf" stroke-width="1.3" stroke-dasharray="6 4"/>

  <!-- Section B: Historical v0.23.0 Async -->
  <text x="16" y="218" font-size="14.5" font-weight="700" fill="#065f56">② 开（历史 v0.23.0）：forward 前在 global_stream 预填 q，争取与前向重叠</text>

  <!-- Left lane labels -->
  <text x="16" y="268" font-size="14" font-weight="700" fill="#17211f">默认流</text>
  <text x="16" y="288" font-size="13.5" fill="#66716d">主执行线</text>

  <text x="16" y="366" font-size="13.5" font-weight="700" fill="#936300" font-family="var(--font-mono)">global_stream</text>
  <text x="16" y="386" font-size="13.5" fill="#66716d">进程级共享副流</text>

  <!-- Default stream row -->
  <rect x="148" y="232" width="328" height="82" rx="8" fill="#ddf4ef" stroke="#087f73" stroke-width="1.4"/>
  <text x="162" y="256" font-size="14.5" font-weight="700" fill="#065f56">各层 model forward（主流不看 q）</text>
  <text x="162" y="279" font-size="13.5" fill="#4d5652" font-family="var(--font-mono)">execute_model</text>
  <text x="162" y="301" font-size="13.5" fill="#66716d">重叠收益须实测（MoE 曾变慢）</text>

  <path d="M 476 273 L 496 273" fill="none" stroke="#087f73" stroke-width="1.8" marker-end="url(#eae-arr-t)"/>

  <rect x="500" y="232" width="144" height="82" rx="8" fill="#ddf4ef" stroke="#087f73" stroke-width="1.4"/>
  <text x="514" y="256" font-size="14.5" font-weight="700" fill="#065f56">softmax</text>
  <text x="514" y="279" font-size="13.5" fill="#4d5652" font-family="var(--font-mono)">logits.softmax</text>
  <text x="514" y="301" font-size="13.5" fill="#66716d">宽 = 词表</text>

  <path d="M 644 273 L 664 273" fill="none" stroke="#087f73" stroke-width="1.8" marker-end="url(#eae-arr-t)"/>

  <rect x="668" y="232" width="216" height="82" rx="8" fill="#fff0e9" stroke="#b54237" stroke-width="1.5"/>
  <text x="682" y="256" font-size="14.5" font-weight="700" fill="#8f3229">阻塞同步后除 q</text>
  <text x="682" y="279" font-size="13.5" fill="#17211f" font-family="var(--font-mono)">async_event.synchronize</text>
  <text x="682" y="301" font-size="13.5" fill="#8f3229">挡住 host CPU 线程！</text>

  <!-- global_stream row -->
  <rect x="148" y="330" width="328" height="82" rx="8" fill="#fff4cf" stroke="#c78300" stroke-width="1.4"/>
  <text x="162" y="354" font-size="14.5" font-weight="700" fill="#936300">副流提前分配并填满随机数 q</text>
  <text x="162" y="377" font-size="13.5" fill="#4d5652" font-family="var(--font-mono)">do_async_exponential</text>
  <text x="162" y="399" font-size="13.5" fill="#4d5652">占 b_s × vocab fp32，覆盖整次前向</text>

  <path d="M 476 371 L 496 371" fill="none" stroke="#c78300" stroke-width="1.8" marker-end="url(#eae-arr-a)"/>

  <rect x="500" y="330" width="184" height="82" rx="8" fill="#f7e7f2" stroke="#9a4b86" stroke-width="1.4"/>
  <text x="514" y="354" font-size="14.5" font-weight="700" fill="#7a3a6a">记事件交付 sampler</text>
  <text x="514" y="377" font-size="13.5" fill="#4d5652" font-family="var(--font-mono)">set_q_event</text>
  <text x="514" y="399" font-size="13.5" fill="#4d5652">传递 q 与 event 对象</text>

  <!-- Elbow arrow joining event to synchronize -->
  <path d="M 684 371 H 776 V 318" fill="none" stroke="#9a4b86" stroke-width="1.9" marker-end="url(#eae-arr-p)"/>
  <text x="786" y="356" font-size="13.5" font-weight="700" fill="#7a3a6a">等 q 完成</text>

  <line x1="16" y1="430" x2="884" y2="430" stroke="#d8d8cf" stroke-width="1.3" stroke-dasharray="6 4"/>

  <!-- Bottom 3-stage Version Evolution Strip (no bullets) -->
  <rect x="16" y="446" width="276" height="84" rx="8" fill="#ece9df" stroke="#b8bcb5" stroke-width="1.3"/>
  <text x="154" y="470" text-anchor="middle" font-size="14" font-weight="700" fill="#17211f">v0.23.0（已标待废弃）</text>
  <text x="154" y="494" text-anchor="middle" font-size="13.5" fill="#4d5652">默认关；缺 record_stream</text>
  <text x="154" y="516" text-anchor="middle" font-size="13.5" fill="#8f3229">与 BATCH_INVARIANT 静默互斥</text>

  <rect x="312" y="446" width="276" height="84" rx="8" fill="#fff4cf" stroke="#c78300" stroke-width="1.3"/>
  <text x="450" y="470" text-anchor="middle" font-size="14" font-weight="700" fill="#936300">v0.25.1rc1 / v0.26.0rc</text>
  <text x="450" y="494" text-anchor="middle" font-size="13.5" fill="#17211f">PR #12306 删开关（静默忽略）</text>
  <text x="450" y="516" text-anchor="middle" font-size="13.5" fill="#065f56">同步路径补 q.record_stream</text>

  <rect x="608" y="446" width="276" height="84" rx="8" fill="#fff0e9" stroke="#b54237" stroke-width="1.5"/>
  <text x="746" y="470" text-anchor="middle" font-size="14" font-weight="700" fill="#8f3229">v0.30.0 / main</text>
  <text x="746" y="494" text-anchor="middle" font-size="13.5" font-weight="700" fill="#8f3229">残留键 extra=forbid 拒收</text>
  <text x="746" y="516" text-anchor="middle" font-size="13.5" fill="#4d5652">main 退役 MRV1 采样器</text>
</svg>
