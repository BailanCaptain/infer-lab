<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 544" width="900" height="544" role="img" aria-label="同步采样与历史 v0.23.0 异步指数采样（enable_async_exponential）时序对照及 v0.30.0/main 移除状态" font-family="var(--font-sans)">
  <title>v0.23.0 将指数随机数 q 的生成从 softmax 之后提前到 forward 之前提交至 global_stream 争取重叠，采样前仍须 host 侧同步；v0.25.1rc1（PR #12306）起整体删除，v0.30.0 仅保留同步 random_sample（补 record_stream），main 退役 MRV1 采样器。</title>
  <desc>Timeline comparison of synchronous vs v0.23.0 async exponential random sampling on global_stream, plus v0.30.0 and main removal notice.</desc>

  <text x="16" y="28" font-size="16" font-weight="700" fill="#17211f">采样随机数 q ~ Exp(1) 的生成时机：同步默认 vs 历史异步预填</text>
  <text x="16" y="48" font-size="13.5" fill="#66716d">两条路径都在进程级副流 global_stream() 上填 q，唯一区别是把填充起点从 softmax 后前移到 forward 前</text>

  <!-- Section A: Default Sync -->
  <text x="16" y="80" font-size="14.5" font-weight="700" fill="#17211f">关（默认 · 同步路径）：q 在 softmax 之后才填（v0.30.0 保留此结构并补 record_stream）</text>

  <rect x="16" y="92" width="198" height="82" rx="8" fill="#e8edff" stroke="#4c65b6" stroke-width="1.3"/>
  <text x="30" y="116" font-size="14.5" font-weight="700" fill="#3a4f93">1. model forward</text>
  <text x="30" y="139" font-size="13" fill="#4d5652" font-family="var(--font-mono)">execute_model</text>
  <text x="30" y="161" font-size="13.5" fill="#66716d">默认流依次跑模型各层</text>

  <path d="M214 133 H234 m-5-5 l5 5 -5 5" fill="none" stroke="#66716d" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/>

  <rect x="238" y="92" width="198" height="82" rx="8" fill="#e8edff" stroke="#4c65b6" stroke-width="1.3"/>
  <text x="252" y="116" font-size="14.5" font-weight="700" fill="#3a4f93">2. softmax 出 probs</text>
  <text x="252" y="139" font-size="13" fill="#4d5652" font-family="var(--font-mono)">logits.softmax</text>
  <text x="252" y="161" font-size="13.5" fill="#66716d">fp32，宽 = 词表大小</text>

  <path d="M436 133 H456 m-5-5 l5 5 -5 5" fill="none" stroke="#66716d" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/>

  <rect x="460" y="92" width="198" height="82" rx="8" fill="#fff4cf" stroke="#c78300" stroke-width="1.4"/>
  <text x="474" y="116" font-size="14.5" font-weight="700" fill="#936300">3. 现在才填随机数 q</text>
  <text x="474" y="139" font-size="13" fill="#4d5652" font-family="var(--font-mono)">q.exponential_()</text>
  <text x="474" y="161" font-size="13.5" fill="#4d5652">主流在 wait_stream 等待</text>

  <path d="M658 133 H678 m-5-5 l5 5 -5 5" fill="none" stroke="#66716d" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/>

  <rect x="682" y="92" width="202" height="82" rx="8" fill="#ddf4ef" stroke="#087f73" stroke-width="1.4"/>
  <text x="696" y="116" font-size="14.5" font-weight="700" fill="#065f56">4. 除 q 后取 argmax</text>
  <text x="696" y="139" font-size="13" fill="#4d5652" font-family="var(--font-mono)">random_sample</text>
  <text x="696" y="161" font-size="13.5" fill="#4d5652">输出本步采样 token id</text>

  <!-- Divider -->
  <line x1="16" y1="192" x2="884" y2="192" stroke="#d8d8cf" stroke-width="1.2" stroke-dasharray="5 4"/>

  <!-- Section B: Historical v0.23.0 Async -->
  <text x="16" y="218" font-size="14.5" font-weight="700" fill="#065f56">开（历史 v0.23.0）：forward 开始前在 global_stream 预填 q，争取与前向重叠</text>

  <!-- Left lane labels -->
  <text x="16" y="268" font-size="14" font-weight="700" fill="#17211f">默认流</text>
  <text x="16" y="288" font-size="13.5" fill="#66716d">主执行线</text>

  <text x="16" y="366" font-size="13.5" font-weight="700" fill="#936300" font-family="var(--font-mono)">global_stream</text>
  <text x="16" y="386" font-size="13.5" fill="#66716d">进程级共享副流</text>

  <!-- Default stream row -->
  <rect x="148" y="232" width="330" height="80" rx="8" fill="#ddf4ef" stroke="#087f73" stroke-width="1.4"/>
  <text x="162" y="256" font-size="14.5" font-weight="700" fill="#065f56">各层 model forward（主流不看 q）</text>
  <text x="162" y="279" font-size="13" fill="#4d5652" font-family="var(--font-mono)">execute_model</text>
  <text x="162" y="300" font-size="13.5" fill="#66716d">重叠收益须实测，不保早于前向完成</text>

  <path d="M478 272 H496 m-5-5 l5 5 -5 5" fill="none" stroke="#087f73" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/>

  <rect x="500" y="232" width="146" height="80" rx="8" fill="#ddf4ef" stroke="#087f73" stroke-width="1.4"/>
  <text x="514" y="256" font-size="14.5" font-weight="700" fill="#065f56">softmax</text>
  <text x="514" y="279" font-size="13" fill="#4d5652" font-family="var(--font-mono)">logits.softmax</text>
  <text x="514" y="300" font-size="13.5" fill="#66716d">宽 = 词表</text>

  <path d="M646 272 H664 m-5-5 l5 5 -5 5" fill="none" stroke="#087f73" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/>

  <rect x="668" y="232" width="216" height="80" rx="8" fill="#fff4cf" stroke="#c78300" stroke-width="1.4"/>
  <text x="682" y="256" font-size="14.5" font-weight="700" fill="#936300">同步后除 q 取 argmax</text>
  <text x="682" y="279" font-size="13" fill="#4d5652" font-family="var(--font-mono)">async_event.synchronize</text>
  <text x="682" y="300" font-size="13.5" fill="#4d5652">host 侧阻塞等待事件完成</text>

  <!-- global_stream row -->
  <rect x="148" y="330" width="330" height="82" rx="8" fill="#fff4cf" stroke="#c78300" stroke-width="1.4"/>
  <text x="162" y="354" font-size="14.5" font-weight="700" fill="#936300">副流提前分配并填满随机数 q</text>
  <text x="162" y="377" font-size="13" fill="#4d5652" font-family="var(--font-mono)">do_async_exponential</text>
  <text x="162" y="398" font-size="13.5" fill="#4d5652">占 b_s × vocab fp32，覆盖整次前向</text>

  <path d="M478 371 H496 m-5-5 l5 5 -5 5" fill="none" stroke="#c78300" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/>

  <rect x="500" y="330" width="188" height="82" rx="8" fill="#f7e7f2" stroke="#9a4b86" stroke-width="1.4"/>
  <text x="514" y="354" font-size="14.5" font-weight="700" fill="#7a3a6a">记事件交付 sampler</text>
  <text x="514" y="377" font-size="13" fill="#4d5652" font-family="var(--font-mono)">set_q_event</text>
  <text x="514" y="398" font-size="13.5" fill="#4d5652">传递 q 与 event 对象</text>

  <!-- Clean elbow arrow joining event to synchronize -->
  <path d="M688 371 H776 V315 m-5 5 l5-5 5 5" fill="none" stroke="#9a4b86" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="788" y="352" font-size="13.5" font-weight="600" fill="#7a3a6a">等 q 完成</text>

  <!-- Bottom removal banner -->
  <rect x="16" y="432" width="868" height="96" rx="8" fill="#fff0e9" stroke="#b54237" stroke-width="1.3"/>
  <text x="30" y="456" font-size="14.5" font-weight="700" fill="#8f3229">v0.25.1rc1（PR #12306）整体删除：v0.30.0 (c09d3e20) / main (8d6180e2) 均无此开关</text>
  <text x="30" y="480" font-size="13.5" fill="#4d5652">• v0.30.0 仅保留同步 random_sample（已补 q.record_stream 防跨流复用）；main 退役 MRV1 采样器（310P v2 仍同步）</text>
  <text x="30" y="504" font-size="13.5" fill="#4d5652">• 残留此键按 extra="forbid" 拒收（装 vllm_omni 告警过滤）；历史开启还与 VLLM_BATCH_INVARIANT 静默互斥</text>
</svg>
