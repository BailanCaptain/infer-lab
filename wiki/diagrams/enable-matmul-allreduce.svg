<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 624" width="900" height="624" role="img" aria-label="v0.23.0 行并行实现派发优先级（_get_row_parallel_op）与 enable_matmul_allreduce 截断关系" font-family="var(--font-sans)">
  <title>v0.23.0 行并行派发函数 _get_row_parallel_op 的八分支优先级：enable_matmul_allreduce 排在第五且不过滤 prefix，会截断后面的 FlashComm2、SP 与默认路径；v0.25.1rc1（PR #12119）已移除，v0.30.0 与 main 仅保留三条细粒度 TP 分支。</title>
  <desc>Eight-branch priority order in v0.23.0 _get_row_parallel_op showing branches 1-4 preceding MatmulAllreduceRowParallelOp, branch 5 shadowing branches 6-8, and removal in v0.30.0/main.</desc>

  <text x="16" y="28" font-size="16" font-weight="700" fill="#17211f">v0.23.0 _get_row_parallel_op 从上往下的 8 条派发优先级</text>
  <text x="16" y="48" font-size="13.5" fill="#66716d">首个命中的分支直接返回：排在前面的先认领特定层，第 5 条本开关不做 prefix 过滤、认领全部剩余行并行层</text>

  <!-- Left tier indicators -->
  <rect x="142" y="72" width="4" height="196" rx="2" fill="#4c65b6"/>
  <text x="16" y="162" font-size="14" font-weight="700" fill="#3a4f93">第 1–4 条</text>
  <text x="16" y="182" font-size="13.5" fill="#66716d">优先认领</text>
  <text x="16" y="200" font-size="13.5" fill="#66716d">轮不到本开关</text>

  <rect x="142" y="278" width="4" height="62" rx="2" fill="#c78300"/>
  <text x="16" y="305" font-size="14" font-weight="700" fill="#936300">第 5 条</text>
  <text x="16" y="325" font-size="13.5" font-weight="600" fill="#936300">本页开关</text>

  <rect x="142" y="350" width="4" height="146" rx="2" fill="#b8bcb5"/>
  <text x="16" y="414" font-size="14" font-weight="700" fill="#66716d">第 6–8 条</text>
  <text x="16" y="434" font-size="13.5" fill="#66716d">已认领层</text>
  <text x="16" y="452" font-size="13.5" fill="#66716d">到不了这里</text>

  <!-- Tier 1: Rows 1-4 -->
  <rect x="158" y="72" width="726" height="44" rx="6" fill="#e8edff" stroke="#4c65b6" stroke-width="1.2"/>
  <text x="174" y="99" font-size="13.5" font-weight="700" fill="#17211f">1. 细粒度 o_proj TP（DSV4）："wo_b" in prefix 且 oproj_tp_enable()</text>
  <text x="868" y="99" font-size="13" fill="#3a4f93" font-family="var(--font-mono)" text-anchor="end">DSV4OProjRowParallelOp</text>

  <rect x="158" y="122" width="726" height="44" rx="6" fill="#e8edff" stroke="#4c65b6" stroke-width="1.2"/>
  <text x="174" y="149" font-size="13.5" font-weight="700" fill="#17211f">2. DSA-CP P 侧 o_proj：enable_dsa_cp_with_layer_shard()</text>
  <text x="868" y="149" font-size="13" fill="#3a4f93" font-family="var(--font-mono)" text-anchor="end">ShardedCPRowParallelOp</text>

  <rect x="158" y="172" width="726" height="44" rx="6" fill="#e8edff" stroke="#4c65b6" stroke-width="1.2"/>
  <text x="174" y="199" font-size="13.5" font-weight="700" fill="#17211f">3. 细粒度 MLP TP：down_proj 且开启 MLP TP，且非 MoE 层</text>
  <text x="868" y="199" font-size="13" fill="#3a4f93" font-family="var(--font-mono)" text-anchor="end">MLPRowParallelOp</text>

  <rect x="158" y="222" width="726" height="44" rx="6" fill="#e8edff" stroke="#4c65b6" stroke-width="1.2"/>
  <text x="174" y="249" font-size="13.5" font-weight="700" fill="#17211f">4. 细粒度 o_proj TP："o_proj" in prefix 且 oproj_tp_enable()</text>
  <text x="868" y="249" font-size="13" fill="#3a4f93" font-family="var(--font-mono)" text-anchor="end">OProjRowParallelOp</text>

  <!-- Tier 2: Row 5 (Highlighted) -->
  <rect x="158" y="278" width="726" height="62" rx="7" fill="#fff4cf" stroke="#c78300" stroke-width="2"/>
  <text x="174" y="303" font-size="14.5" font-weight="700" fill="#936300">5. matmul_allreduce_enable() — 认领剩余行并行层</text>
  <text x="868" y="303" font-size="13" font-weight="700" fill="#936300" font-family="var(--font-mono)" text-anchor="end">MatmulAllreduceRowParallelOp</text>
  <text x="174" y="326" font-size="13.5" fill="#4d5652">进入类内仍检查 reduce_results 且 tp_size &gt; 1 才调 npu_mm_all_reduce_base，否则退回普通路径</text>

  <!-- Tier 3: Rows 6-8 (Shadowed) -->
  <rect x="158" y="350" width="726" height="44" rx="6" fill="#ece9df" stroke="#b8bcb5" stroke-width="1.2"/>
  <text x="174" y="377" font-size="13.5" fill="#4d5652">6. FlashComm2 的 o_proj 路径：flashcomm2_enable()</text>
  <text x="868" y="377" font-size="13" fill="#66716d" font-family="var(--font-mono)" text-anchor="end">Flashcomm2OProjRowParallelOp</text>

  <rect x="158" y="400" width="726" height="44" rx="6" fill="#ece9df" stroke="#b8bcb5" stroke-width="1.2"/>
  <text x="174" y="427" font-size="13.5" fill="#4d5652">7. 序列并行的行并行路径：enable_sp()（5 个 prefix 各自认领）</text>
  <text x="868" y="427" font-size="13" fill="#66716d" font-family="var(--font-mono)" text-anchor="end">SequenceRowParallelOp</text>

  <rect x="158" y="450" width="726" height="44" rx="6" fill="#ece9df" stroke="#b8bcb5" stroke-width="1.2"/>
  <text x="174" y="477" font-size="13.5" fill="#4d5652">8. 均不命中：走 vLLM 默认串行 Matmul + All-Reduce</text>
  <text x="868" y="477" font-size="13" fill="#66716d" font-family="var(--font-mono)" text-anchor="end">return None</text>

  <!-- Bottom removal notice -->
  <rect x="16" y="512" width="868" height="96" rx="8" fill="#fff0e9" stroke="#b54237" stroke-width="1.3"/>
  <text x="30" y="536" font-size="14.5" font-weight="700" fill="#8f3229">v0.25.1rc1（PR #12119）删除；v0.30.0 (c09d3e20) / main (8d6180e2) 仅留 3 条细粒度 TP 分支</text>
  <text x="30" y="560" font-size="13.5" fill="#4d5652">• 被第 5 条认领只影响这些行并行层，不等于关掉全模型 SP / FlashComm2；实际等待是否缩短须实测</text>
  <text x="30" y="584" font-size="13.5" fill="#4d5652">• 升级 v0.30.0 / main 须删此键与环境变量；残留顶层键按 extra="forbid" 拒收（装 vllm_omni 告警过滤）</text>
</svg>
