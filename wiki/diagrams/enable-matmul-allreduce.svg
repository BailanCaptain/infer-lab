<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 610" width="900" height="610" role="img" aria-label="行并行线性的实现是按顺序挑的，第一个为真的分支直接 return——这个开关站在第五位，踩它的人大多输在位置上（v0.23 维护分支）">
  <title>行并行线性的实现是按顺序挑的，第一个为真的分支直接 return——这个开关站在第五位，踩它的人大多输在位置上（v0.23 维护分支）</title>
  <rect width="900" height="610" fill="var(--color-surface, #fbfaf6)"/>
  <rect x="20" y="26" width="860" height="418" rx="12" fill="var(--color-surface-sunken, #ece9df)"/>
  <rect x="36" y="40" width="286.6" height="26.5" rx="13.3" fill="var(--color-control, #5b6763)"/><text x="47" y="58.1" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="13.5" font-weight="700" fill="var(--color-ink-inverse, #ffffff)">_get_row_parallel_op 从上往下依次判断</text>
  <text x="38" y="83" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="12.5" font-weight="400" fill="var(--color-ink-muted, #5b6763)">位置就是优先级。排在上面的先认领，排在下面的只能捡剩下的层。</text>
  <rect x="136" y="88" width="728" height="42" rx="10" fill="var(--color-surface-sunken, #ece9df)"/>
  <rect x="136" y="88" width="5" height="42" rx="2.5" fill="var(--color-control, #5b6763)"/>
  <text x="158" y="106" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="15" font-weight="700" fill="var(--color-ink, #17211f)">细粒度 o_proj TP（DSV4）</text>
  <text x="158" y="126" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="12.5" font-weight="400" fill="var(--color-ink-muted, #5b6763)">&quot;wo_b&quot; in prefix and oproj_tp_enable()</text>
  <rect x="662" y="96.5" width="183" height="21.5" rx="10.8" fill="var(--color-surface, #fbfaf6)" stroke="var(--color-control, #5b6763)" stroke-width="1"/><text x="753.5" y="114" font-family="'JetBrains Mono',ui-monospace,monospace" font-size="12.5" font-weight="400" fill="var(--color-control, #5b6763)" text-anchor="middle">DSV4OProjRowParallelOp</text>
  <rect x="136" y="134" width="728" height="42" rx="10" fill="var(--color-surface-sunken, #ece9df)"/>
  <rect x="136" y="134" width="5" height="42" rx="2.5" fill="var(--color-control, #5b6763)"/>
  <text x="158" y="152" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="15" font-weight="700" fill="var(--color-ink, #17211f)">DSA-CP 下被 layer_sharding 切过的 o_proj</text>
  <text x="158" y="172" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="12.5" font-weight="400" fill="var(--color-ink-muted, #5b6763)">enable_dsa_cp_with_layer_shard() and &quot;o_proj&quot; in prefix</text>
  <rect x="662" y="142.5" width="183" height="21.5" rx="10.8" fill="var(--color-surface, #fbfaf6)" stroke="var(--color-control, #5b6763)" stroke-width="1"/><text x="753.5" y="160" font-family="'JetBrains Mono',ui-monospace,monospace" font-size="12.5" font-weight="400" fill="var(--color-control, #5b6763)" text-anchor="middle">ShardedCPRowParallelOp</text>
  <rect x="136" y="180" width="728" height="42" rx="10" fill="var(--color-surface-sunken, #ece9df)"/>
  <rect x="136" y="180" width="5" height="42" rx="2.5" fill="var(--color-control, #5b6763)"/>
  <text x="158" y="198" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="15" font-weight="700" fill="var(--color-ink, #17211f)">细粒度 MLP TP</text>
  <text x="158" y="218" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="12.5" font-weight="400" fill="var(--color-ink-muted, #5b6763)">&quot;down_proj&quot; in prefix and mlp_tp_enable()</text>
  <rect x="707" y="188.5" width="138" height="21.5" rx="10.8" fill="var(--color-surface, #fbfaf6)" stroke="var(--color-control, #5b6763)" stroke-width="1"/><text x="776" y="206" font-family="'JetBrains Mono',ui-monospace,monospace" font-size="12.5" font-weight="400" fill="var(--color-control, #5b6763)" text-anchor="middle">MLPRowParallelOp</text>
  <rect x="136" y="226" width="728" height="42" rx="10" fill="var(--color-surface-sunken, #ece9df)"/>
  <rect x="136" y="226" width="5" height="42" rx="2.5" fill="var(--color-control, #5b6763)"/>
  <text x="158" y="244" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="15" font-weight="700" fill="var(--color-ink, #17211f)">细粒度 o_proj TP</text>
  <text x="158" y="264" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="12.5" font-weight="400" fill="var(--color-ink-muted, #5b6763)">&quot;o_proj&quot; in prefix and oproj_tp_enable()</text>
  <rect x="692" y="234.5" width="153" height="21.5" rx="10.8" fill="var(--color-surface, #fbfaf6)" stroke="var(--color-control, #5b6763)" stroke-width="1"/><text x="768.5" y="252" font-family="'JetBrains Mono',ui-monospace,monospace" font-size="12.5" font-weight="400" fill="var(--color-control, #5b6763)" text-anchor="middle">OProjRowParallelOp</text>
  <rect x="136" y="272" width="728" height="42" rx="10" fill="var(--color-accent-soft, #fff0e9)"/>
  <rect x="136" y="272" width="5" height="42" rx="2.5" fill="var(--color-accent, #e85b32)"/>
  <g transform="translate(159.8 282.8) scale(0.85)" fill="none" stroke="var(--color-accent, #e85b32)" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M13 2L4 14h7l-1 8 9-12h-7z"/></g>
  <text x="194" y="290" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="15" font-weight="700" fill="var(--color-ink, #17211f)">本页的开关就在这一条</text>
  <text x="194" y="310" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="12.5" font-weight="400" fill="var(--color-ink-muted, #5b6763)">matmul_allreduce_enable()，没有 prefix 过滤，行并行线性通吃</text>
  <rect x="617" y="280.5" width="228" height="21.5" rx="10.8" fill="var(--color-surface, #fbfaf6)" stroke="var(--color-accent, #e85b32)" stroke-width="1"/><text x="731" y="298" font-family="'JetBrains Mono',ui-monospace,monospace" font-size="12.5" font-weight="400" fill="var(--color-accent, #e85b32)" text-anchor="middle">MatmulAllreduceRowParallelOp</text>
  <rect x="136" y="318" width="728" height="42" rx="10" fill="var(--color-canvas, #f5f2ea)"/>
  <rect x="136" y="318" width="5" height="42" rx="2.5" fill="var(--color-ink-faint, #8a928f)"/>
  <text x="158" y="336" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="15" font-weight="700" fill="var(--color-ink, #17211f)">FlashComm2 的 o_proj 路径</text>
  <text x="158" y="356" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="12.5" font-weight="400" fill="var(--color-ink-muted, #5b6763)">flashcomm2_enable()</text>
  <rect x="617" y="326.5" width="228" height="21.5" rx="10.8" fill="var(--color-surface, #fbfaf6)" stroke="var(--color-ink-faint, #8a928f)" stroke-width="1"/><text x="731" y="344" font-family="'JetBrains Mono',ui-monospace,monospace" font-size="12.5" font-weight="400" fill="var(--color-ink-faint, #8a928f)" text-anchor="middle">Flashcomm2OProjRowParallelOp</text>
  <rect x="136" y="364" width="728" height="42" rx="10" fill="var(--color-canvas, #f5f2ea)"/>
  <rect x="136" y="364" width="5" height="42" rx="2.5" fill="var(--color-ink-faint, #8a928f)"/>
  <text x="158" y="382" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="15" font-weight="700" fill="var(--color-ink, #17211f)">序列并行的行并行路径</text>
  <text x="158" y="402" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="12.5" font-weight="400" fill="var(--color-ink-muted, #5b6763)">enable_sp()，五个 prefix 各自认领</text>
  <rect x="669.5" y="372.5" width="175.5" height="21.5" rx="10.8" fill="var(--color-surface, #fbfaf6)" stroke="var(--color-ink-faint, #8a928f)" stroke-width="1"/><text x="757.3" y="390" font-family="'JetBrains Mono',ui-monospace,monospace" font-size="12.5" font-weight="400" fill="var(--color-ink-faint, #8a928f)" text-anchor="middle">SequenceRowParallelOp</text>
  <rect x="136" y="410" width="728" height="42" rx="10" fill="var(--color-canvas, #f5f2ea)"/>
  <rect x="136" y="410" width="5" height="42" rx="2.5" fill="var(--color-ink-faint, #8a928f)"/>
  <text x="158" y="428" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="15" font-weight="700" fill="var(--color-ink, #17211f)">一条都不命中，走 vLLM 默认实现</text>
  <text x="158" y="448" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="12.5" font-weight="400" fill="var(--color-ink-muted, #5b6763)">先 matmul 算完，再发 AllReduce，两步串行</text>
  <text x="848" y="436" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="12.5" font-weight="400" fill="var(--color-ink-muted, #5b6763)" text-anchor="end">return None</text>
  <path d="M34 318 l-8 0 L26 452 l8 0" fill="none" stroke="var(--color-ink-faint, #8a928f)" stroke-width="1.4" opacity="0.75"/>
  <text x="40" y="390" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="12.5" font-weight="600" fill="var(--color-ink-faint, #8a928f)">到不了</text>
  <text x="40" y="476" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="12.5" font-weight="400" fill="var(--color-ink-muted, #5b6763)">开了它，下面三条就永远到不了：FlashComm2 的 o_proj 路径、SP 的全部行并行路径，以及默认实现。代码里没有任何互斥检查或告警——配了 </text>
  <text x="40" y="494.5" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="12.5" font-weight="400" fill="var(--color-ink-muted, #5b6763)">flashcomm2_parallel_size 却发现毫无效果，多半就是踩到这里。</text>
  <text x="40" y="530" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="12.5" font-weight="400" fill="var(--color-ink-muted, #5b6763)">反过来，排在它上面的四条轮不到它：细粒度 TP 和 layer_sharding 认领掉的那些层，走的是各自的实现。</text>
  <text x="40" y="576" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="12.5" font-weight="600" fill="var(--color-ink, #17211f)">被换掉的是「matmul 算完再 AllReduce」这一对，换成 npu_mm_all_reduce_base 一个算子，在算子内部按块把通信藏进计算。搬运的字节数没</text>
  <text x="40" y="594.5" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="12.5" font-weight="600" fill="var(--color-ink, #17211f)">变，省的是干等的时间。</text>
</svg>
