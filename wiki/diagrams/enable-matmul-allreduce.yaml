layout: scene
id: enable-matmul-allreduce
caption: 行并行线性的实现是按顺序挑的，第一个为真的分支直接 return——这个开关站在第五位，踩它的人大多输在位置上（v0.23 维护分支）
size: [900, 610]

regions:
  - label: _get_row_parallel_op 从上往下依次判断
    note: 位置就是优先级。排在上面的先认领，排在下面的只能捡剩下的层。
    at: [20, 26]
    size: [860, 418]
    tone: upstream

bands:
  - label: 细粒度 o_proj TP（DSV4）
    sub: "\"wo_b\" in prefix and oproj_tp_enable()"
    fn: DSV4OProjRowParallelOp
    at: [136, 88]
    size: [728, 42]
    tone: upstream
  - label: DSA-CP 下被 layer_sharding 切过的 o_proj
    sub: "enable_dsa_cp_with_layer_shard() and \"o_proj\" in prefix"
    fn: ShardedCPRowParallelOp
    at: [136, 134]
    size: [728, 42]
    tone: upstream
  - label: 细粒度 MLP TP
    sub: "\"down_proj\" in prefix and mlp_tp_enable()"
    fn: MLPRowParallelOp
    at: [136, 180]
    size: [728, 42]
    tone: upstream
  - label: 细粒度 o_proj TP
    sub: "\"o_proj\" in prefix and oproj_tp_enable()"
    fn: OProjRowParallelOp
    at: [136, 226]
    size: [728, 42]
    tone: upstream
  - label: 本页的开关就在这一条
    sub: matmul_allreduce_enable()，没有 prefix 过滤，行并行线性通吃
    fn: MatmulAllreduceRowParallelOp
    at: [136, 272]
    size: [728, 42]
    tone: accent
    icon: bolt
  - label: FlashComm2 的 o_proj 路径
    sub: flashcomm2_enable()
    fn: Flashcomm2OProjRowParallelOp
    at: [136, 318]
    size: [728, 42]
    tone: muted
  - label: 序列并行的行并行路径
    sub: enable_sp()，五个 prefix 各自认领
    fn: SequenceRowParallelOp
    at: [136, 364]
    size: [728, 42]
    tone: muted
  - label: 一条都不命中，走 vLLM 默认实现
    sub: 先 matmul 算完，再发 AllReduce，两步串行
    right: return None
    at: [136, 410]
    size: [728, 42]
    tone: muted

brackets:
  - { at: [26, 318], span: 134, dir: left, label: 到不了, tone: muted }

notes:
  - at: [40, 476]
    text: "开了它，下面三条就永远到不了：FlashComm2 的 o_proj 路径、SP 的全部行并行路径，以及默认实现。代码里没有任何互斥检查或告警——配了 flashcomm2_parallel_size 却发现毫无效果，多半就是踩到这里。"
    size: 12.5
    width: 820
  - at: [40, 530]
    text: "反过来，排在它上面的四条轮不到它：细粒度 TP 和 layer_sharding 认领掉的那些层，走的是各自的实现。"
    size: 12.5
    width: 820
  - at: [40, 576]
    text: "被换掉的是「matmul 算完再 AllReduce」这一对，换成 npu_mm_all_reduce_base 一个算子，在算子内部按块把通信藏进计算。搬运的字节数没变，省的是干等的时间。"
    size: 12.5
    width: 820
    strong: true

pins:
  - source: vllm-ascend@2c59ff10:vllm_ascend/ops/linear_op.py#L700-L739
    symbols:
      - _get_row_parallel_op
      - DSV4OProjRowParallelOp
      - ShardedCPRowParallelOp
      - MLPRowParallelOp
      - OProjRowParallelOp
      - MatmulAllreduceRowParallelOp
      - Flashcomm2OProjRowParallelOp
      - SequenceRowParallelOp
      - matmul_allreduce_enable
      - flashcomm2_enable
      - enable_sp
  - source: vllm-ascend@2c59ff10:vllm_ascend/ops/linear_op.py#L420-L441
    symbols: [npu_mm_all_reduce_base, reduce_results, tp_size]
