<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 624" width="900" height="624" role="img" aria-label="开关只在 sleep() 前面和 wake_up() 后面各插一段；分配器那一步本来就会做（vllm-ascend main 开发主线）">
  <title>开关只在 sleep() 前面和 wake_up() 后面各插一段；分配器那一步本来就会做（vllm-ascend main 开发主线）</title>
  <rect width="900" height="624" fill="var(--color-surface, #fbfaf6)"/>
  <rect x="20" y="44" width="860" height="200" rx="12" fill="var(--color-weight-soft, #fff4cf)"/>
  <rect x="36" y="58" width="74.7" height="26.5" rx="13.3" fill="var(--color-weight, #b87a00)"/><text x="47" y="76.1" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="13.5" font-weight="700" fill="var(--color-ink-inverse, #ffffff)">sleep()</text>
  <text x="38" y="101" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="12.5" font-weight="400" fill="var(--color-ink-muted, #5b6763)">清理必须排在分配器换出之前——图和通信域都还在，才清得动</text>
  <rect x="20" y="306" width="860" height="200" rx="12" fill="var(--color-kv-soft, #e8edff)"/>
  <rect x="36" y="320" width="91.4" height="26.5" rx="13.3" fill="var(--color-kv, #4c65b6)"/><text x="47" y="338.1" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="13.5" font-weight="700" fill="var(--color-ink-inverse, #ffffff)">wake_up()</text>
  <text x="38" y="363" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="12.5" font-weight="400" fill="var(--color-ink-muted, #5b6763)">顺序整个反过来，睡时省下的显存要在这里连本带利还回去</text>
  <rect x="40" y="138" width="256" height="92" rx="11" fill="var(--color-surface, #fbfaf6)" stroke="var(--color-accent, #e85b32)" stroke-width="1.5"/>
  <rect x="52" y="168" width="32" height="32" rx="9" fill="var(--color-accent-soft, #fff0e9)"/><g transform="translate(58.4 174.4) scale(0.8)" fill="none" stroke="var(--color-accent, #e85b32)" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M5 19V9M12 19V5M19 19v-7M3 21h18"/></g>
  <text x="92" y="172" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="14.5" font-weight="700" fill="var(--color-ink, #17211f)">① 作废 ACL 图</text>
  <text x="92" y="190" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="12.5" font-weight="400" fill="var(--color-ink-muted, #5b6763)">workspace 置空、图参数清零</text>
  <text x="92" y="207" font-family="'JetBrains Mono',ui-monospace,monospace" font-size="12.5" font-weight="400" fill="var(--color-accent, #e85b32)">reset_all_graph_params</text>
  <rect x="318" y="138" width="256" height="92" rx="11" fill="var(--color-surface, #fbfaf6)" stroke="var(--color-accent, #e85b32)" stroke-width="1.5"/>
