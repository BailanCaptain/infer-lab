  <text x="307" y="283" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="12.5" font-weight="600" fill="var(--color-accent, #e85b32)" text-anchor="middle">开关加出来的只有这两步</text>
  <path d="M318 518 l0 9 L852 527 l0 -9" fill="none" stroke="var(--color-accent, #e85b32)" stroke-width="1.4" opacity="0.75"/>
  <text x="585" y="545" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="12.5" font-weight="600" fill="var(--color-accent, #e85b32)" text-anchor="middle">唤醒变慢就慢在这两步上</text>
  <text x="20" y="582" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="12.5" font-weight="400" fill="var(--color-ink-muted, #5b6763)">① 还受 model_runner.use_aclgraph 门控：eager 模式下这一格整个跳过，只省下 HCCL 那一半，唤醒也只需重建通信域。</text>
  <text x="20" y="606" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="12.5" font-weight="600" fill="var(--color-ink, #17211f)">两个键少写一个，四个彩色格子一个都不执行：cleanup_enabled = rl_config.enabled and rl_config.sleep_mode_extra_cleanup。</text>
