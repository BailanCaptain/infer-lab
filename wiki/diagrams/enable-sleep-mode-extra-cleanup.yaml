layout: scene
id: enable-sleep-mode-extra-cleanup
caption: 开关只在 sleep() 前面和 wake_up() 后面各插一段；分配器那一步本来就会做（vllm-ascend main 开发主线）
size: [900, 624]

regions:
  - label: sleep()
    note: 清理必须排在分配器换出之前——图和通信域都还在，才清得动
    at: [20, 44]
    size: [860, 200]
    tone: ascend
  - label: wake_up()
    note: 顺序整个反过来，睡时省下的显存要在这里连本带利还回去
    at: [20, 306]
    size: [860, 200]
    tone: neutral

boxes:
  - at: [40, 138]
    size: [256, 92]
    title: ① 作废 ACL 图
    sub: workspace 置空、图参数清零
    fn: reset_all_graph_params
    tone: accent
    icon: graph
  - at: [318, 138]
    size: [256, 92]
    title: ② 销毁 HCCL 通信域
    sub: 同步之后逐组销毁
    fn: destroy_hccl
    tone: accent
    icon: plug
  - at: [596, 138]
    size: [256, 92]
    title: ③ 分配器换出
    sub: level 1 只换权重
    fn: offload_tags
    tone: muted
    icon: box

  - at: [40, 400]
    size: [256, 92]
    title: ① 分配器还原
    sub: 权重与 KV 先回到卡上
    fn: CaMemAllocator
    tone: muted
    icon: box
  - at: [318, 400]
    size: [256, 92]
    title: ② 重建通信域
    sub: 逐组恢复 + 刷 MoE 句柄
    fn: restore_hccl
    tone: accent
    icon: plug
  - at: [596, 400]
    size: [256, 92]
    title: ③ 重捕获整张图
    sub: 含 kv_cache 才做
    fn: capture_model
    tone: accent
    icon: graph

arrows:
  - { from: [300, 184], to: [314, 184], tone: ascend }
  - { from: [578, 184], to: [592, 184], tone: ascend }
  - { from: [300, 446], to: [314, 446], tone: neutral }
  - { from: [578, 446], to: [592, 446], tone: neutral }

brackets:
  - { at: [40, 256], span: 534, dir: down, label: 开关加出来的只有这两步, tone: accent }
  - { at: [318, 518], span: 534, dir: down, label: 唤醒变慢就慢在这两步上, tone: accent }

notes:
  - at: [20, 582]
    text: "① 还受 model_runner.use_aclgraph 门控：eager 模式下这一格整个跳过，只省下 HCCL 那一半，唤醒也只需重建通信域。"
    size: 12.5
    width: 860
  - at: [20, 606]
    text: "两个键少写一个，四个彩色格子一个都不执行：cleanup_enabled = rl_config.enabled and rl_config.sleep_mode_extra_cleanup。"
    size: 12.5
    width: 860
    strong: true

pins:
  - source: vllm-ascend@baa023ad:vllm_ascend/worker/worker.py#L252-L255
    symbols: [rl_config, sleep_mode_extra_cleanup, CaMemAllocator, offload_tags]
  - source: vllm-ascend@baa023ad:vllm_ascend/device_allocator/sleep_mem_optimized.py#L47-L64
    symbols: [use_aclgraph, reset_all_graph_params, destroy_hccl, restore_hccl, capture_model]
