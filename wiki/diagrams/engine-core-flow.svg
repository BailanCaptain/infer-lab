<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 800" width="880" height="800" role="img" aria-label="EngineCore 进程主线程上的忙循环，框里的 ①–④ 就是直觉图里一圈的四格。没活时阻塞在输入队列上；有活就先把已到的消息收完，再按有没有建批次队列走两条分支之一。同步分支每圈都等本批结果；带批次队列的分支在队列未满且还能推进时不等结果，直接回到开头排下一批。两条分支都先处理取消、再按结果更新，结果放进输出队列。DP 部署里，本组这圈没执行模型而别组还在跑时，陪跑一次空批次。">
  <title>EngineCore 进程主线程上的忙循环，框里的 ①–④ 就是直觉图里一圈的四格。没活时阻塞在输入队列上；有活就先把已到的消息收完，再按有没有建批次队列走两条分支之一。同步分支每圈都等本批结果；带批次队列的分支在队列未满且还能推进时不等结果，直接回到开头排下一批。两条分支都先处理取消、再按结果更新，结果放进输出队列。DP 部署里，本组这圈没执行模型而别组还在跑时，陪跑一次空批次。</title>
  <defs><marker id="engine-core-flow-ah-ink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="var(--color-ink, #17211f)"/></marker></defs>
  <path d="M440 68 L440 104" fill="none" stroke="var(--color-ink, #17211f)" stroke-width="1.4" marker-end="url(#engine-core-flow-ah-ink)"/>
  <path d="M240 135 L212 135" fill="none" stroke="var(--color-ink, #17211f)" stroke-width="1.4" marker-end="url(#engine-core-flow-ah-ink)"/>
  <path d="M114 166 L114 184 L300 184 L300 166" fill="none" stroke="var(--color-ink, #17211f)" stroke-width="1.4" stroke-dasharray="7 5" marker-end="url(#engine-core-flow-ah-ink)"/>
  <path d="M440 166 L440 200" fill="none" stroke="var(--color-ink, #17211f)" stroke-width="1.4" marker-end="url(#engine-core-flow-ah-ink)"/>
  <path d="M440 262 L440 296" fill="none" stroke="var(--color-ink, #17211f)" stroke-width="1.4" marker-end="url(#engine-core-flow-ah-ink)"/>
  <path d="M340 358 L340 380 L216 380 L216 404" fill="none" stroke="var(--color-ink, #17211f)" stroke-width="1.4" marker-end="url(#engine-core-flow-ah-ink)"/>
  <path d="M540 358 L540 380 L664 380 L664 404" fill="none" stroke="var(--color-ink, #17211f)" stroke-width="1.4" marker-end="url(#engine-core-flow-ah-ink)"/>
  <path d="M216 454 L216 478" fill="none" stroke="var(--color-ink, #17211f)" stroke-width="1.4" marker-end="url(#engine-core-flow-ah-ink)"/>
  <path d="M216 538 L216 562" fill="none" stroke="var(--color-ink, #17211f)" stroke-width="1.4" marker-end="url(#engine-core-flow-ah-ink)"/>
  <path d="M664 454 L664 478" fill="none" stroke="var(--color-ink, #17211f)" stroke-width="1.4" marker-end="url(#engine-core-flow-ah-ink)"/>
  <path d="M664 538 L664 562" fill="none" stroke="var(--color-ink, #17211f)" stroke-width="1.4" marker-end="url(#engine-core-flow-ah-ink)"/>
  <path d="M844 508 L870 508 L870 42 L640 42" fill="none" stroke="var(--color-ink, #17211f)" stroke-width="1.4" marker-end="url(#engine-core-flow-ah-ink)"/>
  <path d="M216 612 L216 628 L340 628 L340 644" fill="none" stroke="var(--color-ink, #17211f)" stroke-width="1.4" marker-end="url(#engine-core-flow-ah-ink)"/>
  <path d="M664 612 L664 628 L540 628 L540 644" fill="none" stroke="var(--color-ink, #17211f)" stroke-width="1.4" marker-end="url(#engine-core-flow-ah-ink)"/>
  <path d="M440 704 L440 736" fill="none" stroke="var(--color-ink, #17211f)" stroke-width="1.4" marker-end="url(#engine-core-flow-ah-ink)"/>
  <path d="M640 762 L664 762" fill="none" stroke="var(--color-ink, #17211f)" stroke-width="1.4" stroke-dasharray="7 5" marker-end="url(#engine-core-flow-ah-ink)"/>
  <path d="M240 762 L8 762 L8 42 L240 42" fill="none" stroke="var(--color-ink, #17211f)" stroke-width="1.4" marker-end="url(#engine-core-flow-ah-ink)"/>
  <rect x="240" y="16" width="400" height="52" rx="8" fill="var(--color-surface-sunken, #ece9df)" stroke="var(--color-ink, #17211f)" stroke-width="1.5"/>
  <text x="440" y="47" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="14" font-weight="700" fill="var(--color-ink, #17211f)" text-anchor="middle">外层循环：没收到关机信号就一直转</text>
  <rect x="240" y="104" width="400" height="62" rx="8" fill="var(--color-surface-sunken, #ece9df)" stroke="var(--color-ink, #17211f)" stroke-width="1.5"/>
  <text x="440" y="131" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="14" font-weight="700" fill="var(--color-ink, #17211f)" text-anchor="middle">有活吗？</text>
  <text x="440" y="150" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="13" font-weight="400" fill="var(--color-ink, #17211f)" text-anchor="middle">有请求没算完、有在途的批，或别的 DP 组还在跑</text>
  <rect x="16" y="104" width="196" height="62" rx="8" fill="var(--color-control, #66716d)" stroke="var(--color-ink, #17211f)" stroke-width="1.5"/>
  <text x="114" y="131" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="14" font-weight="700" fill="var(--color-ink-inverse, #ffffff)" text-anchor="middle">阻塞等下一条消息</text>
  <text x="114" y="150" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="13" font-weight="400" fill="var(--color-ink-inverse, #ffffff)" text-anchor="middle">不空转，来消息才醒</text>
  <rect x="240" y="200" width="400" height="62" rx="8" fill="var(--color-control, #66716d)" stroke="var(--color-ink, #17211f)" stroke-width="1.5"/>
  <text x="440" y="227" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="14" font-weight="700" fill="var(--color-ink-inverse, #ffffff)" text-anchor="middle">① 把输入队列里已到的消息收完</text>
  <text x="440" y="246" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="13" font-weight="400" fill="var(--color-ink-inverse, #ffffff)" text-anchor="middle">新请求进等待队列，取消从调度器删掉</text>
  <rect x="240" y="296" width="400" height="62" rx="8" fill="var(--color-surface-sunken, #ece9df)" stroke="var(--color-ink, #17211f)" stroke-width="1.5"/>
  <text x="440" y="323" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="14" font-weight="700" fill="var(--color-ink, #17211f)" text-anchor="middle">建了批次队列吗？</text>
  <text x="440" y="342" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="13" font-weight="400" fill="var(--color-ink, #17211f)" text-anchor="middle">最多并发批数大于 1 时才建（异步调度或 PP）</text>
  <rect x="36" y="404" width="360" height="50" rx="8" fill="var(--color-control, #66716d)" stroke="var(--color-ink, #17211f)" stroke-width="1.5"/>
  <text x="216" y="434" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="14" font-weight="700" fill="var(--color-ink-inverse, #ffffff)" text-anchor="middle">② 调度出本步计划</text>
  <rect x="36" y="478" width="360" height="60" rx="8" fill="var(--color-weight, #c78300)" stroke="var(--color-ink, #17211f)" stroke-width="1.5"/>
  <text x="216" y="504" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="14" font-weight="700" fill="var(--color-ink-inverse, #ffffff)" text-anchor="middle">③ 交给 Worker，拿回执</text>
  <text x="216" y="523" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="13" font-weight="400" fill="var(--color-ink-inverse, #ffffff)" text-anchor="middle">趁 Worker 在算，准备结构化输出的表</text>
  <rect x="36" y="562" width="360" height="50" rx="8" fill="var(--color-token, #087f73)" stroke="var(--color-ink, #17211f)" stroke-width="1.5"/>
  <text x="216" y="592" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="14" font-weight="700" fill="var(--color-ink-inverse, #ffffff)" text-anchor="middle">③ 等这一批的结果</text>
  <rect x="484" y="404" width="360" height="50" rx="8" fill="var(--color-control, #66716d)" stroke="var(--color-ink, #17211f)" stroke-width="1.5"/>
  <text x="664" y="434" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="14" font-weight="700" fill="var(--color-ink-inverse, #ffffff)" text-anchor="middle">② 调度，③ 提交新一批、回执入队</text>
  <rect x="484" y="478" width="360" height="60" rx="8" fill="var(--color-surface-sunken, #ece9df)" stroke="var(--color-ink, #17211f)" stroke-width="1.5"/>
  <text x="664" y="504" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="14" font-weight="700" fill="var(--color-ink, #17211f)" text-anchor="middle">队列未满且还能推进？</text>
  <text x="664" y="523" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="13" font-weight="400" fill="var(--color-ink, #17211f)" text-anchor="middle">能：本圈不等结果</text>
  <rect x="484" y="562" width="360" height="50" rx="8" fill="var(--color-token, #087f73)" stroke="var(--color-ink, #17211f)" stroke-width="1.5"/>
  <text x="664" y="592" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="14" font-weight="700" fill="var(--color-ink-inverse, #ffffff)" text-anchor="middle">③ 等队列里最老一批的结果</text>
  <rect x="240" y="644" width="400" height="60" rx="8" fill="var(--color-token, #087f73)" stroke="var(--color-ink, #17211f)" stroke-width="1.5"/>
  <text x="440" y="670" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="14" font-weight="700" fill="var(--color-ink-inverse, #ffffff)" text-anchor="middle">④ 先处理取消，再按结果更新</text>
  <text x="440" y="689" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="13" font-weight="400" fill="var(--color-ink-inverse, #ffffff)" text-anchor="middle">接上 token、判停止、结束的请求还块</text>
  <rect x="240" y="736" width="400" height="52" rx="8" fill="var(--color-token, #087f73)" stroke="var(--color-ink, #17211f)" stroke-width="1.5"/>
  <text x="440" y="767" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="14" font-weight="700" fill="var(--color-ink-inverse, #ffffff)" text-anchor="middle">本圈结果放进输出队列，发回前端</text>
  <rect x="664" y="736" width="200" height="52" rx="8" fill="var(--color-comm, #9a4b86)" stroke="var(--color-ink, #17211f)" stroke-width="1.5"/>
  <text x="764" y="758" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="14" font-weight="700" fill="var(--color-ink-inverse, #ffffff)" text-anchor="middle">DP：本组本圈没执行</text>
  <text x="764" y="777" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="13" font-weight="400" fill="var(--color-ink-inverse, #ffffff)" text-anchor="middle">别组在跑就陪跑空批次</text>
  <text x="220" y="126" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="14" font-weight="400" fill="var(--color-ink, #17211f)">否</text>
  <text x="452" y="190" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="14" font-weight="400" fill="var(--color-ink, #17211f)">是</text>
  <text x="222" y="374" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="13" font-weight="400" fill="var(--color-ink, #17211f)">否：同步分支</text>
  <text x="552" y="374" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="13" font-weight="400" fill="var(--color-ink, #17211f)">是：带批次队列</text>
  <text x="676" y="554" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="14" font-weight="400" fill="var(--color-ink, #17211f)">否</text>
  <text x="848" y="530" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="14" font-weight="400" fill="var(--color-ink, #17211f)">能</text>
  <text x="24" y="200" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="12.5" font-weight="400" fill="var(--color-ink-muted, #66716d)" font-style="italic">处理这条消息，再问一次</text>
</svg>
