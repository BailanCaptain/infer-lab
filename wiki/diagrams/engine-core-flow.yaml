layout: figure
id: engine-core-flow
caption: EngineCore 进程主线程上的忙循环，框里的 ①–④ 就是直觉图里一圈的四格。没活时阻塞在输入队列上；有活就先把已到的消息收完，再按有没有建批次队列走两条分支之一。同步分支每圈都等本批结果；带批次队列的分支在队列未满且还能推进时不等结果，直接回到开头排下一批。两条分支都先处理取消、再按结果更新，结果放进输出队列。DP 部署里，本组这圈没执行模型而别组还在跑时，陪跑一次空批次。
size: [880, 800]
items:
  - { at: [240, 16], size: [400, 52], text: 外层循环：没收到关机信号就一直转, style: plain }
  - { at: [240, 104], size: [400, 62], text: 有活吗？, sub: 有请求没算完、有在途的批，或别的 DP 组还在跑, style: plain }
  - { at: [16, 104], size: [196, 62], text: 阻塞等下一条消息, sub: 不空转，来消息才醒, tone: control }
  - { at: [240, 200], size: [400, 62], text: ① 把输入队列里已到的消息收完, sub: 新请求进等待队列，取消从调度器删掉, tone: control }
  - { at: [240, 296], size: [400, 62], text: 建了批次队列吗？, sub: 最多并发批数大于 1 时才建（异步调度或 PP）, style: plain }
  - { at: [36, 404], size: [360, 50], text: ② 调度出本步计划, tone: control }
  - { at: [36, 478], size: [360, 60], text: ③ 交给 Worker，拿回执, sub: 趁 Worker 在算，准备结构化输出的表, tone: weight }
  - { at: [36, 562], size: [360, 50], text: ③ 等这一批的结果, tone: token }
  - { at: [484, 404], size: [360, 50], text: ② 调度，③ 提交新一批、回执入队, tone: control }
  - { at: [484, 478], size: [360, 60], text: 队列未满且还能推进？, sub: 能：本圈不等结果, style: plain }
  - { at: [484, 562], size: [360, 50], text: ③ 等队列里最老一批的结果, tone: token }
  - { at: [240, 644], size: [400, 60], text: ④ 先处理取消，再按结果更新, sub: 接上 token、判停止、结束的请求还块, tone: token }
  - { at: [240, 736], size: [400, 52], text: 本圈结果放进输出队列，发回前端, tone: token }
  - { at: [664, 736], size: [200, 52], text: DP：本组本圈没执行, sub: 别组在跑就陪跑空批次, tone: comm }
