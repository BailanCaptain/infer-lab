<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 430" width="900" height="430" role="img" aria-label="EngineCore 的逻辑迭代：计划、执行、更新通过请求状态连接；一轮可以没有生成输出，也可以提交多个 token">
  <title>EngineCore 的逻辑迭代：计划、执行、更新通过请求状态连接；一轮可以没有生成输出，也可以提交多个 token</title>
  <defs><marker id="engine-core-loop-ah-control" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="var(--color-control, #66716d)"/></marker><marker id="engine-core-loop-ah-token" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="var(--color-token, #087f73)"/></marker></defs>
  <path d="M225 96 L310 96" fill="none" stroke="var(--color-control, #66716d)" stroke-width="1.4" marker-end="url(#engine-core-loop-ah-control)"/>
  <path d="M520 96 L645 96" fill="none" stroke="var(--color-control, #66716d)" stroke-width="1.4" marker-end="url(#engine-core-loop-ah-control)"/>
  <path d="M757 127 L757 280" fill="none" stroke="var(--color-token, #087f73)" stroke-width="1.4" marker-end="url(#engine-core-loop-ah-token)"/>
  <path d="M645 311 L520 311" fill="none" stroke="var(--color-token, #087f73)" stroke-width="1.4" marker-end="url(#engine-core-loop-ah-token)"/>
  <path d="M310 311 L225 311" fill="none" stroke="var(--color-token, #087f73)" stroke-width="1.4" marker-end="url(#engine-core-loop-ah-token)"/>
  <path d="M415 280 L415 127" fill="none" stroke="var(--color-control, #66716d)" stroke-width="1.4" marker-end="url(#engine-core-loop-ah-control)"/>
  <rect x="30" y="65" width="195" height="62" rx="8" fill="var(--color-control, #66716d)" stroke="var(--color-ink, #17211f)" stroke-width="1.5"/>
  <text x="127.5" y="101" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="14" font-weight="700" fill="var(--color-ink-inverse, #ffffff)" text-anchor="middle">接收输入 / 控制</text>
  <rect x="310" y="65" width="210" height="62" rx="8" fill="var(--color-control, #66716d)" stroke="var(--color-ink, #17211f)" stroke-width="1.5"/>
  <text x="415" y="101" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="14" font-weight="700" fill="var(--color-ink-inverse, #ffffff)" text-anchor="middle">安排本轮工作</text>
  <rect x="645" y="65" width="225" height="62" rx="8" fill="var(--color-weight, #c78300)" stroke="var(--color-ink, #17211f)" stroke-width="1.5"/>
  <text x="757.5" y="101" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="14" font-weight="700" fill="var(--color-ink-inverse, #ffffff)" text-anchor="middle">提交模型执行</text>
  <rect x="645" y="280" width="225" height="62" rx="8" fill="var(--color-token, #087f73)" stroke="var(--color-ink, #17211f)" stroke-width="1.5"/>
  <text x="757.5" y="316" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="14" font-weight="700" fill="var(--color-ink-inverse, #ffffff)" text-anchor="middle">获取完成结果</text>
  <rect x="310" y="280" width="210" height="62" rx="8" fill="var(--color-control, #66716d)" stroke="var(--color-ink, #17211f)" stroke-width="1.5"/>
  <text x="415" y="316" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="14" font-weight="700" fill="var(--color-ink-inverse, #ffffff)" text-anchor="middle">取消处理与更新</text>
  <rect x="30" y="280" width="195" height="62" rx="8" fill="var(--color-token, #087f73)" stroke="var(--color-ink, #17211f)" stroke-width="1.5"/>
  <text x="127.5" y="316" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="14" font-weight="700" fill="var(--color-ink-inverse, #ffffff)" text-anchor="middle">输出返回</text>
  <text x="445" y="203" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="13.5" font-weight="400" fill="var(--color-ink, #17211f)">下一轮</text>
  <text x="60" y="200" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="13.5" font-weight="400" fill="var(--color-ink, #17211f)">请求状态跨轮保存</text>
  <text x="55" y="390" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="13.5" font-weight="400" fill="var(--color-ink-muted, #66716d)" font-style="italic">批次队列允许多批次在途；图中只展开一次逻辑提交与更新</text>
</svg>
