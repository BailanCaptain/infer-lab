<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 330" width="900" height="330" role="img" aria-label="引擎只有这一个圈：挑一批、算一次、每条请求各吐一个 token；转一圈就是一步，那条请求的回答是它转了 200 圈">
  <title>引擎只有这一个圈：挑一批、算一次、每条请求各吐一个 token；转一圈就是一步，那条请求的回答是它转了 200 圈</title>
  <defs><marker id="engine-core-loop-ah-control" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="var(--color-control, #66716d)"/></marker><marker id="engine-core-loop-ah-token" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="var(--color-token, #087f73)"/></marker></defs>
  <path d="M170 172 L240 172" fill="none" stroke="var(--color-control, #66716d)" stroke-width="1.4" marker-end="url(#engine-core-loop-ah-control)"/>
  <path d="M400 172 L470 172" fill="none" stroke="var(--color-control, #66716d)" stroke-width="1.4" marker-end="url(#engine-core-loop-ah-control)"/>
  <path d="M630 172 L700 172" fill="none" stroke="var(--color-token, #087f73)" stroke-width="1.4" marker-end="url(#engine-core-loop-ah-token)"/>
  <path d="M785 204 L785 270 L100 270 L100 204" fill="none" stroke="var(--color-control, #66716d)" stroke-width="1.4" marker-end="url(#engine-core-loop-ah-control)"/>
  <path d="M70 140 L70 92 L130 92 L130 140" fill="none" stroke="var(--color-control, #66716d)" stroke-width="1.4" stroke-dasharray="7 5" marker-end="url(#engine-core-loop-ah-control)"/>
  <rect x="30" y="140" width="140" height="64" rx="8" fill="var(--color-surface-sunken, #ece9df)" stroke="var(--color-ink, #17211f)" stroke-width="1.5"/>
  <text x="100" y="177" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="14" font-weight="700" fill="var(--color-ink, #17211f)" text-anchor="middle">有活吗</text>
  <rect x="240" y="140" width="160" height="64" rx="8" fill="var(--color-control, #66716d)" stroke="var(--color-ink, #17211f)" stroke-width="1.5"/>
  <text x="320" y="168" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="14" font-weight="700" fill="var(--color-ink-inverse, #ffffff)" text-anchor="middle">挑一批</text>
  <text x="320" y="187" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="13" font-weight="400" fill="var(--color-ink-inverse, #ffffff)" text-anchor="middle">调度器</text>
  <rect x="470" y="140" width="160" height="64" rx="8" fill="var(--color-weight, #c78300)" stroke="var(--color-ink, #17211f)" stroke-width="1.5"/>
  <text x="550" y="168" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="14" font-weight="700" fill="var(--color-ink-inverse, #ffffff)" text-anchor="middle">算一次</text>
  <text x="550" y="187" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="13" font-weight="400" fill="var(--color-ink-inverse, #ffffff)" text-anchor="middle">两颗 NPU</text>
  <rect x="700" y="140" width="170" height="64" rx="8" fill="var(--color-token, #087f73)" stroke="var(--color-ink, #17211f)" stroke-width="1.5"/>
  <text x="785" y="177" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="14" font-weight="700" fill="var(--color-ink-inverse, #ffffff)" text-anchor="middle">各吐一个 token</text>
  <text x="100" y="78" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="13" font-weight="400" fill="var(--color-ink-muted, #66716d)" text-anchor="middle" font-style="italic">没活：睡着等</text>
  <text x="442" y="296" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="14" font-weight="700" fill="var(--color-ink, #17211f)" text-anchor="middle">转一圈 = 一步</text>
  <circle cx="240" cy="140" r="11" fill="var(--color-control, #66716d)"/><text x="240" y="145" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="13" font-weight="700" fill="var(--color-ink-inverse, #ffffff)" text-anchor="middle">1</text>
  <circle cx="470" cy="140" r="11" fill="var(--color-weight, #c78300)"/><text x="470" y="145" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="13" font-weight="700" fill="var(--color-ink-inverse, #ffffff)" text-anchor="middle">2</text>
  <circle cx="700" cy="140" r="11" fill="var(--color-token, #087f73)"/><text x="700" y="145" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="13" font-weight="700" fill="var(--color-ink-inverse, #ffffff)" text-anchor="middle">3</text>
</svg>
