<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 470" width="900" height="470" role="img" aria-label="EngineCore 的 while 循环：那条请求的 200 步都是同一圈跑出来的">
  <title>EngineCore 的 while 循环：那条请求的 200 步都是同一圈跑出来的</title>
  <rect width="900" height="470" fill="var(--color-surface, #fbfaf6)"/>
  <rect x="20" y="40" width="860" height="382" rx="12" fill="var(--color-surface-sunken, #ece9df)"/>
  <rect x="36" y="54" width="138.1" height="26.5" rx="13.3" fill="var(--color-control, #5b6763)"/><text x="47" y="72.1" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="13.5" font-weight="700" fill="var(--color-ink-inverse, #ffffff)">EngineCore 进程</text>
  <text x="38" y="97" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="12.5" font-weight="400" fill="var(--color-ink-muted, #5b6763)">整个进程就是一个 while 循环。它转一圈，全部在跑的请求各往前走一步。</text>
  <line x1="66" y1="250" x2="790" y2="250" stroke="var(--color-control, #5b6763)" stroke-width="3.5" stroke-linecap="round" opacity="0.7"/>
  <path d="M790 250 l-14 -7 l0 14 z" fill="var(--color-control, #5b6763)"/>
  <line x1="150" y1="250" x2="150" y2="222" stroke="var(--color-control, #5b6763)" stroke-width="1.5" opacity="0.5"/>
  <circle cx="150" cy="250" r="9" fill="var(--color-surface, #fbfaf6)"/>
  <circle cx="150" cy="250" r="5.5" fill="var(--color-control, #5b6763)"/>
  <rect x="130" y="181" width="40" height="40" rx="12" fill="var(--color-surface, #fbfaf6)" stroke="var(--color-control, #5b6763)" stroke-width="1.4"/>
  <g transform="translate(138 189) scale(1)" fill="none" stroke="var(--color-control, #5b6763)" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3a9 9 0 1 0 0 18 9 9 0 0 0 0-18z M12 7v5l3 2"/></g>
  <text x="150" y="170" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="15" font-weight="700" fill="var(--color-ink, #17211f)" text-anchor="middle">有活干吗</text>
  <text x="150" y="151" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="12.5" font-weight="400" fill="var(--color-ink-muted, #5b6763)" text-anchor="middle">没有就阻塞在这里等</text>
  <rect x="66" y="111.5" width="168" height="21.5" rx="10.8" fill="var(--color-surface, #fbfaf6)" stroke="var(--color-control, #5b6763)" stroke-width="1"/><text x="150" y="129" font-family="'JetBrains Mono',ui-monospace,monospace" font-size="12.5" font-weight="400" fill="var(--color-control, #5b6763)" text-anchor="middle">_process_input_queue</text>
  <line x1="340" y1="250" x2="340" y2="278" stroke="var(--color-control, #5b6763)" stroke-width="1.5" opacity="0.5"/>
  <circle cx="340" cy="250" r="9" fill="var(--color-surface, #fbfaf6)"/>
  <circle cx="340" cy="250" r="5.5" fill="var(--color-control, #5b6763)"/>
  <rect x="320" y="279" width="40" height="40" rx="12" fill="var(--color-surface, #fbfaf6)" stroke="var(--color-control, #5b6763)" stroke-width="1.4"/>
  <g transform="translate(328 287) scale(1)" fill="none" stroke="var(--color-control, #5b6763)" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M4 12h6m0 0l-4-4m4 4l-4 4M14 5h6v6h-6zM14 13h6v6h-6z"/></g>
  <text x="340" y="336" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="15" font-weight="700" fill="var(--color-ink, #17211f)" text-anchor="middle">这一步算谁、各算几个</text>
  <rect x="263.5" y="340.5" width="153" height="21.5" rx="10.8" fill="var(--color-surface, #fbfaf6)" stroke="var(--color-control, #5b6763)" stroke-width="1"/><text x="340" y="358" font-family="'JetBrains Mono',ui-monospace,monospace" font-size="12.5" font-weight="400" fill="var(--color-control, #5b6763)" text-anchor="middle">Scheduler.schedule</text>
  <line x1="530" y1="250" x2="530" y2="222" stroke="var(--color-weight, #b87a00)" stroke-width="1.5" opacity="0.5"/>
  <circle cx="530" cy="250" r="9" fill="var(--color-surface, #fbfaf6)"/>
  <circle cx="530" cy="250" r="5.5" fill="var(--color-weight, #b87a00)"/>
  <rect x="510" y="181" width="40" height="40" rx="12" fill="var(--color-surface, #fbfaf6)" stroke="var(--color-weight, #b87a00)" stroke-width="1.4"/>
  <g transform="translate(518 189) scale(1)" fill="none" stroke="var(--color-weight, #b87a00)" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M7 7h10v10H7z M10 3v4M14 3v4M10 17v4M14 17v4M3 10h4M3 14h4M17 10h4M17 14h4"/></g>
  <text x="530" y="170" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="15" font-weight="700" fill="var(--color-ink, #17211f)" text-anchor="middle">送下去执行</text>
  <text x="530" y="151" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="12.5" font-weight="400" fill="var(--color-ink-muted, #5b6763)" text-anchor="middle">跨进程，等 Worker 回话</text>
  <rect x="472.3" y="111.5" width="115.5" height="21.5" rx="10.8" fill="var(--color-surface, #fbfaf6)" stroke="var(--color-weight, #b87a00)" stroke-width="1"/><text x="530" y="129" font-family="'JetBrains Mono',ui-monospace,monospace" font-size="12.5" font-weight="400" fill="var(--color-weight, #b87a00)" text-anchor="middle">execute_model</text>
  <line x1="710" y1="250" x2="710" y2="278" stroke="var(--color-control, #5b6763)" stroke-width="1.5" opacity="0.5"/>
  <circle cx="710" cy="250" r="9" fill="var(--color-surface, #fbfaf6)"/>
  <circle cx="710" cy="250" r="5.5" fill="var(--color-control, #5b6763)"/>
  <rect x="690" y="279" width="40" height="40" rx="12" fill="var(--color-surface, #fbfaf6)" stroke="var(--color-control, #5b6763)" stroke-width="1.4"/>
  <g transform="translate(698 287) scale(1)" fill="none" stroke="var(--color-control, #5b6763)" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M5 3h14v18H5z M8 7h8M8 11h2M12 11h2M8 15h2M12 15h2"/></g>
  <text x="710" y="336" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="15" font-weight="700" fill="var(--color-ink, #17211f)" text-anchor="middle">按结果更新状态</text>
  <rect x="633.5" y="340.5" width="153" height="21.5" rx="10.8" fill="var(--color-surface, #fbfaf6)" stroke="var(--color-control, #5b6763)" stroke-width="1"/><text x="710" y="358" font-family="'JetBrains Mono',ui-monospace,monospace" font-size="12.5" font-weight="400" fill="var(--color-control, #5b6763)" text-anchor="middle">update_from_output</text>
  <path d="M810 250 L846 250 L846 392 L40 392 L40 250 L62 250" fill="none" stroke="var(--color-control, #5b6763)" stroke-width="1.8"/>
  <path d="M62 250 l-11 -5.5 l0 11 z" fill="var(--color-control, #5b6763)"/>
  <rect x="412" y="382" width="62" height="19" rx="6" fill="var(--color-surface, #fbfaf6)"/>
  <text x="443" y="396" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="12.5" font-weight="400" fill="var(--color-ink-muted, #5b6763)" text-anchor="middle">转下一圈</text>
  <text x="56" y="452" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="12.5" font-weight="400" fill="var(--color-ink-muted, #5b6763)">那条请求的 200 步，就是这个循环转了 200 圈。第 1 圈给它 37 个 token 的名额，第 2 到第 200 圈各给 1 个——循环体一个字都没改。</text>
</svg>
