layout: figure
id: engine-core-loop
caption: EngineCore 每转一圈就是一步：① 收下前端送来的新请求和取消，② 调度出这一步的计划，③ 交给 Worker 在卡上算、等回每条请求的新 token，④ 按结果更新请求，新 token 编号送回前端，然后转下一圈。所有请求共用这一个循环；没有请求要算时，它停在 ① 等消息。
size: [900, 400]
frames:
  - { at: [12, 60], size: [168, 300], label: 前端进程（API server） }
  - { at: [248, 60], size: [420, 300], label: EngineCore 进程 }
  - { at: [722, 60], size: [166, 300], label: Worker 进程 }
