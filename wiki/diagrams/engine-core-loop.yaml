  - { at: [24, 256], size: [144, 64], text: 反分词、推给用户, sub: token 编号 → 文字, style: plain }
  - { at: [264, 100], size: [184, 64], text: ① 收消息, sub: 新请求进等待队列, tone: control }
  - { at: [468, 100], size: [184, 64], text: ② 调度, sub: 算谁、各几个位置、借块, tone: control }
  - { at: [468, 256], size: [184, 64], text: ③ 交出执行、等结果, sub: 拿回每条请求的新 token, tone: token }
  - { at: [264, 256], size: [184, 64], text: ④ 按结果更新, sub: 接 token、判停止、还块, tone: token }
  - { at: [734, 240], size: [142, 100], text: 前向与采样, sub: 每张卡算自己那份, tone: weight }
