layout: figure
id: engine-core-rounds
caption: 示意请求 R：提示词 3 个 token（编号 7、2、9），回答 2 个 token（5、8）。每格三行依次是前端（API server）、EngineCore、Worker 手里 R 的 token 编号，格子上面是位置；圆圈里的 1–4 是一圈里的收消息、调度、执行、更新（正文的 ①–④）。紫色箭头是在进程之间送过去的编号或消息，灰色虚线是 Worker 手里已经有、不用再发的编号。第 1 圈计划带着完整提示词；第 2 圈计划只写「R 算 1 个位置」；新 token 每圈都经 EngineCore 记账后再送回前端。
size: [880, 608]
frames:
  - { label: 第 1 圈：R 第一次上场，计划带上 3 个提示词编号, at: [8, 30], size: [428, 266] }
  - { label: 第 2 圈：计划只写「R 算 1 个位置」，5 不用再发, at: [444, 30], size: [428, 266] }
  - { label: 两圈之后：R 已完成、还了块；下一份计划带上「R 已结束」，Worker 删掉缓存, at: [8, 334], size: [864, 266] }
