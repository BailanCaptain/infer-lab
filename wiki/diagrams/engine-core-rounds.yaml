    symbols: [scheduled_new_reqs, scheduled_cached_reqs, num_scheduled_tokens, finished_req_ids]
  - source: vllm@0fc695fc:vllm/v1/core/sched/output.py#L112-L120
    symbols: [new_token_ids]
