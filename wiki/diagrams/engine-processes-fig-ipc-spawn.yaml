mode: native-svg
id: engine-processes-fig-ipc-spawn
caption: >-
  vLLM V1 跨进程通道拓扑与 fork / spawn 状态继承时间轴：上半绘制多 API 前端通过 64B 槽位对齐的 SharedAdmissionStats 汇总在途准入，经 ZMQ IPC/TCP 接入 EngineCore 双收发线程，再按 Executor 分流至 Multiproc（rpc_broadcast_mq 共享内存广播 + HCCL 卡间通信）或 UniProc（进程内函数直调）；下半对比 fork 出生瞬间快照继承与 spawn 全新空解释器须靠各进程入口补齐补丁及 AscendConfig 的机制，并标注动态 EPLB 须设 daemon=False 的约束。
size: [900, 520]
