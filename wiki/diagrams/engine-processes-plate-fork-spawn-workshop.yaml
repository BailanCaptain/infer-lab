mode: native-svg
id: engine-processes-plate-fork-spawn-workshop
caption: >-
  用“蓝图复印工坊 vs 空屋开箱车间”秒懂 fork 与 spawn：左侧 fork 把父工坊墙上已挂好的齿轮补丁与全局状态原样复印进子工坊，分叉快但若父进程已提前初始化 NPU 驱动句柄就会一并带入隐患，且分叉后各自改动互不同步；右侧 spawn（vllm serve 默认）让子进程走进一间空无一物的洁净车间，所有平台插件、全局补丁与 AscendConfig 必须在 EngineCore 与 NPUWorker 入口重新开箱装配。
size: [900, 640]
