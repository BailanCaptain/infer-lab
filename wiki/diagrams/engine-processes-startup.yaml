layout: figure
id: engine-processes-startup
caption: 进程由上往下一个拉起一个。两个分叉各决定一件事：启动方法决定子进程一出生是否带着父进程已经换好的名字；卡数决定 Worker 是独立进程还是 EngineCore 里的对象。不管走哪条分支，每个进程都会经过自己那一站的补丁入口，所以最后每个进程都打齐了补丁
size: [900, 610]
items:
  - { at: [150, 30], size: [600, 64], text: 启动进程（node0 上它就是 API server）, sub: 解析参数：加载通用插件、调平台钩子 → 全局补丁；建配置 → Ascend 配置缓存, tone: control }
  - { at: [60, 160], size: [360, 60], text: fork, sub: 复制父进程内存，已换好的名字一起带过来, style: plain }
  - { at: [480, 160], size: [360, 60], text: spawn, sub: 全新的解释器，父进程里的替换都不在, style: plain }
  - { at: [150, 276], size: [600, 64], text: EngineCore 进程初始化, sub: 再加载一次通用插件 → 全局补丁（本进程已打过就跳过）, tone: control }
  - { at: [60, 406], size: [360, 60], text: 整个服务只有 1 张卡：uni, sub: Worker 是本进程里的一个对象, style: plain }
  - { at: [480, 406], size: [360, 60], text: 多于 1 张卡：mp, sub: 每张卡起一个 Worker 进程，启动方法同上, style: plain }
  - { at: [150, 522], size: [600, 64], text: Worker 初始化（NPUWorker）, sub: Worker 补丁 → 登记昇腾算子 → Ascend 配置缓存, tone: weight }
