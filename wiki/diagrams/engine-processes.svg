<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 510" width="900" height="510" role="img" aria-label="一种多进程执行布局：进程有各自地址空间，并通过显式通道交接；Worker 中既有长期权重/状态，也有本轮张量">
  <title>一种多进程执行布局：进程有各自地址空间，并通过显式通道交接；Worker 中既有长期权重/状态，也有本轮张量</title>
  <defs><marker id="engine-processes-ah-control" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="var(--color-control, #66716d)"/></marker><marker id="engine-processes-ah-weight" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="var(--color-weight, #c78300)"/></marker><marker id="engine-processes-ah-kv" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="var(--color-kv, #4c65b6)"/></marker><marker id="engine-processes-ah-token" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="var(--color-token, #087f73)"/></marker></defs>
  <rect x="25" y="65" width="190" height="170" rx="16" fill="none" stroke="var(--color-line-strong, #b8bcb5)" stroke-width="1.5"/>
  <text x="41" y="53" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="15" font-weight="700" fill="var(--color-ink, #17211f)">前端进程</text>
  <rect x="260" y="65" width="240" height="170" rx="16" fill="none" stroke="var(--color-line-strong, #b8bcb5)" stroke-width="1.5"/>
  <text x="276" y="53" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="15" font-weight="700" fill="var(--color-ink, #17211f)">EngineCore 进程</text>
  <rect x="555" y="65" width="320" height="370" rx="16" fill="none" stroke="var(--color-line-strong, #b8bcb5)" stroke-width="1.5"/>
  <text x="571" y="53" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="15" font-weight="700" fill="var(--color-ink, #17211f)">Worker 进程 · rank r</text>
  <g data-hardware="memory">
  <rect x="585" y="240" width="120" height="60" rx="3" fill="var(--color-kv-soft, #e8edff)" stroke="var(--color-kv, #4c65b6)" stroke-width="1.5"/>
  <path d="M590 292h110M590 296h110" fill="none" stroke="var(--color-kv, #4c65b6)" stroke-width="1.5"/>
  <text x="645" y="274" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="13" font-weight="700" fill="var(--color-ink, #17211f)" text-anchor="middle">权重</text>
  </g>
  <g data-hardware="memory">
  <rect x="725" y="240" width="120" height="60" rx="3" fill="var(--color-kv-soft, #e8edff)" stroke="var(--color-kv, #4c65b6)" stroke-width="1.5"/>
  <path d="M730 292h110M730 296h110" fill="none" stroke="var(--color-kv, #4c65b6)" stroke-width="1.5"/>
  <text x="785" y="274" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="13" font-weight="700" fill="var(--color-ink, #17211f)" text-anchor="middle">历史状态</text>
  </g>
  <path d="M215 150 L260 150" fill="none" stroke="var(--color-control, #66716d)" stroke-width="1.4" marker-end="url(#engine-processes-ah-control)"/>
  <path d="M500 150 L555 150" fill="none" stroke="var(--color-control, #66716d)" stroke-width="1.4" marker-end="url(#engine-processes-ah-control)"/>
  <path d="M645 240 L645 185" fill="none" stroke="var(--color-weight, #c78300)" stroke-width="1.4" marker-end="url(#engine-processes-ah-weight)"/>
  <path d="M785 185 L785 240" fill="none" stroke="var(--color-kv, #4c65b6)" stroke-width="1.4" marker-start="url(#engine-processes-ah-kv)" marker-end="url(#engine-processes-ah-kv)"/>
  <path d="M555 405 L380 405 L380 235" fill="none" stroke="var(--color-token, #087f73)" stroke-width="1.4" marker-end="url(#engine-processes-ah-token)"/>
