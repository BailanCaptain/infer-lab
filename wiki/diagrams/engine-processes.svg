  <text x="20" y="46" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="14" font-weight="600" fill="var(--color-ink, #17211f)">起一条昇腾服务</text>
  <text x="20" y="432" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="12.5" font-weight="400" fill="var(--color-ink-muted, #5b6763)">中间那一格最不直观：EngineCore 是新起的解释器，Main 里那次 import 的副作用不会被继承，_GLOBAL_PATCH_APPLIED 只在进程内去重——正因如此它</text>
  <text x="20" y="450.5" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="12.5" font-weight="400" fill="var(--color-ink-muted, #5b6763)">才能在每个子进程里各生效一次。</text>
  <text x="20" y="470" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="12.5" font-weight="400" fill="var(--color-ink-muted, #5b6763)">排查时倒着用：栈里有调度器 → 中间这格；栈里有 torch_npu → 右边这格；报错在参数校验阶段 → 左边这格。</text>
