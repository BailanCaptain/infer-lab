layout: figure
id: engine-processes
caption: API server、EngineCore、Worker 三类进程各占一个框（Worker 画了两个），各有各的内存，框之间只能发消息。请求消息每条请求只发一次；清单每一步发一次，所有 Worker 收到同一份；没配 KV connector、也没开 PP 时，本步结果只由本组 TP 编号为 0 的 Worker 回传。两个 Worker 之间的虚线是卡与卡交换张量。多个 DP 组之间的对齐和 DP coordinator 的消息没有画，见正文。左下是整个服务只用一张卡的情形：Worker 不另起进程，成了 EngineCore 进程里的一个对象
