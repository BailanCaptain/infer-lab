<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 440" width="900" height="440" role="img" aria-label="Engram 条件记忆 N-gram 短语哈希查表几何流与三笔独立内存账对照图" font-family="var(--font-sans)">
  <title>Engram 条件记忆：N-gram 哈希稀疏查表反量化、EDP 旁路与三笔独立内存账</title>
  <desc>Geometric N-gram sliding window with image dead-mask cut, dp_shared_memory EDP bypass, sparse 32-row hit from 10^8-row read-only table via Triton CHUNK_ROWS pointer table, EDP AllToAll / TP All-Gather, wkv gate, and 3-account comparison</desc>
  <defs>
    <marker id="egf-arr-t" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="#087f73"/>
    </marker>
    <marker id="egf-arr-b" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="#4c65b6"/>
    </marker>
    <marker id="egf-arr-p" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="#9a4b86"/>
    </marker>
    <marker id="egf-arr-a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="#c78300"/>
    </marker>
  </defs>

  <!-- ZONE 1: Geometric Lookup Flow -->
  <text x="14" y="24" font-size="16" font-weight="700" fill="#17211f">① 单步稀疏查表流：从 N-gram 哈希到门控融合（仅反量化命中行，绝不搬整表）</text>

  <!-- Step 1: N-gram Sliding Window + Dead Mask -->
  <rect x="14" y="44" width="204" height="176" rx="7" fill="#ddf4ef" stroke="#087f73" stroke-width="1.4"/>
  <text x="116" y="68" text-anchor="middle" font-size="14.5" font-weight="700" fill="#065f56">1. 滑窗拼 N-gram 哈希</text>
  <!-- Mini token cells showing <img/> dead-mask cut -->
  <rect x="24" y="80" width="48" height="28" rx="4" fill="#fff0e9" stroke="#b54237" stroke-width="1.2"/>
  <text x="48" y="99" text-anchor="middle" font-size="13.5" font-weight="700" fill="#8f3229">img</text>
  <line x1="77" y1="76" x2="77" y2="112" stroke="#b54237" stroke-width="2" stroke-dasharray="3 2"/>
  <rect x="83" y="80" width="40" height="28" rx="4" fill="#ffffff" stroke="#087f73" stroke-width="1.2"/>
  <text x="103" y="99" text-anchor="middle" font-size="13.5" fill="#065f56">t−2</text>
  <rect x="127" y="80" width="40" height="28" rx="4" fill="#ffffff" stroke="#087f73" stroke-width="1.2"/>
  <text x="147" y="99" text-anchor="middle" font-size="13.5" fill="#065f56">t−1</text>
  <rect x="171" y="80" width="38" height="28" rx="4" fill="#ddf4ef" stroke="#087f73" stroke-width="1.6"/>
  <text x="190" y="99" text-anchor="middle" font-size="13.5" font-weight="700" fill="#065f56">t</text>
  <text x="24" y="134" font-size="13.5" fill="#8f3229" font-weight="700">dead_mask 遇图截断前文</text>
  <text x="24" y="156" font-size="13.5" fill="#4d5652">来源：当前块+lookback+SWA</text>
  <text x="24" y="178" font-size="13.5" font-family="var(--font-mono)" fill="#065f56">[T, L, (N-1)·H] int32</text>
  <text x="24" y="202" font-size="13.5" fill="#66716d">填充位填 −1 防串请求</text>

  <!-- Step 2: Fork (Shared Bypass vs EDP All-Gather) -->
  <path d="M 218 106 L 238 86" fill="none" stroke="#087f73" stroke-width="1.8" marker-end="url(#egf-arr-t)"/>
  <path d="M 218 158 L 238 178" fill="none" stroke="#9a4b86" stroke-width="1.8" marker-end="url(#egf-arr-p)"/>

  <rect x="242" y="46" width="162" height="72" rx="6" fill="#ddf4ef" stroke="#087f73" stroke-width="1.5"/>
  <text x="323" y="70" text-anchor="middle" font-size="13.5" font-weight="700" fill="#065f56">dp_shared_memory</text>
  <text x="323" y="92" text-anchor="middle" font-size="13.5" font-weight="700" fill="#065f56">直通！跳过集合通信</text>
  <text x="323" y="110" text-anchor="middle" font-size="13.5" fill="#4d5652">每副本直查共享表</text>

  <rect x="242" y="142" width="162" height="76" rx="6" fill="#f7e7f2" stroke="#9a4b86" stroke-width="1.4"/>
  <text x="323" y="166" text-anchor="middle" font-size="13.5" font-weight="700" fill="#7a3a6a">非共享 EDP 分片</text>
  <text x="323" y="188" text-anchor="middle" font-size="13.5" font-family="var(--font-mono)" fill="#7a3a6a">EDP All-Gather</text>
  <text x="323" y="208" text-anchor="middle" font-size="13.5" fill="#4d5652">跨副本汇集哈希号</text>

  <path d="M 404 86 L 424 106" fill="none" stroke="#087f73" stroke-width="1.8" marker-end="url(#egf-arr-t)"/>
  <path d="M 404 178 L 424 158" fill="none" stroke="#9a4b86" stroke-width="1.8" marker-end="url(#egf-arr-p)"/>

  <!-- Step 3: Huge Read-Only Table with Sparse 32-row Hit -->
  <rect x="428" y="44" width="244" height="176" rx="7" fill="#e8edff" stroke="#4c65b6" stroke-width="1.5"/>
  <text x="550" y="68" text-anchor="middle" font-size="14.5" font-weight="700" fill="#3a4f93">2. 分片巨表稀疏查行</text>
  <!-- Visual table grid showing 3 tiny hit lines out of huge table -->
  <rect x="444" y="80" width="212" height="72" rx="4" fill="#ffffff" stroke="#4c65b6" stroke-width="1.2"/>
  <rect x="448" y="92" width="204" height="10" rx="2" fill="#087f73"/>
  <rect x="448" y="114" width="204" height="10" rx="2" fill="#087f73"/>
  <rect x="448" y="134" width="204" height="10" rx="2" fill="#087f73"/>
  <text x="550" y="174" text-anchor="middle" font-size="12.5" font-weight="700" fill="#3a4f93">示意：10⁸ 行(26.8 GiB) 仅取 32 行</text>
  <text x="550" y="194" text-anchor="middle" font-size="12.5" fill="#4d5652">Triton 分块指针表(2²²行/块)</text>
  <text x="550" y="212" text-anchor="middle" font-size="12" fill="#065f56">INT8/MXFP8 → 仅 16 KiB BF16 进 HBM</text>

  <path d="M 672 132 L 692 132" fill="none" stroke="#4c65b6" stroke-width="2" marker-end="url(#egf-arr-b)"/>

  <!-- Step 4: Exchange + wkv Gate into Residual -->
  <rect x="696" y="44" width="190" height="176" rx="7" fill="#fff4cf" stroke="#c78300" stroke-width="1.5"/>
  <text x="791" y="68" text-anchor="middle" font-size="14.5" font-weight="700" fill="#936300">3. 归集与门控融合</text>
  <rect x="708" y="80" width="166" height="32" rx="4" fill="#f7e7f2" stroke="#9a4b86" stroke-width="1.2"/>
  <text x="791" y="101" text-anchor="middle" font-size="13.5" font-weight="700" fill="#7a3a6a">EDP AllToAll（若分片）</text>
  <rect x="708" y="118" width="166" height="32" rx="4" fill="#e8edff" stroke="#4c65b6" stroke-width="1.2"/>
  <text x="791" y="139" text-anchor="middle" font-size="13.5" font-weight="700" fill="#3a4f93">TP All-Gather 拼齐头</text>
  <rect x="708" y="156" width="166" height="52" rx="4" fill="#ddf4ef" stroke="#087f73" stroke-width="1.3"/>
  <text x="791" y="177" text-anchor="middle" font-size="13.5" font-weight="700" fill="#065f56">wkv → key, value</text>
  <text x="791" y="198" text-anchor="middle" font-size="13.5" fill="#4d5652">门控融合加回残差流</text>

  <line x1="14" y1="238" x2="886" y2="238" stroke="#b8bcb5" stroke-width="1.4" stroke-dasharray="6 5"/>

  <!-- ZONE 2: 3-Account Comparison Strip (Zero Bullets!) -->
  <text x="14" y="264" font-size="16" font-weight="700" fill="#17211f">② 三笔独立内存账对照：卸载 Engram 表不会顺带搬走 KV Cache，也不会归零 HBM 缓冲</text>

  <!-- Account 1 -->
  <rect x="14" y="280" width="280" height="146" rx="7" fill="#e8edff" stroke="#4c65b6" stroke-width="1.4"/>
  <text x="154" y="306" text-anchor="middle" font-size="14.5" font-weight="700" fill="#3a4f93">Engram 条件记忆表</text>
  <rect x="28" y="318" width="252" height="28" rx="4" fill="#ffffff" stroke="#4c65b6" stroke-width="1"/>
  <text x="154" y="337" text-anchor="middle" font-size="13.5" font-weight="700" fill="#3a4f93">只读模型参数 · 体积恒定</text>
  <text x="28" y="368" font-size="13.5" fill="#17211f">全请求共享，每步仅随机触达极少行</text>
  <text x="28" y="392" font-size="13.5" fill="#4d5652">放 Host DRAM 或跨实例 Owner 池</text>
  <text x="28" y="414" font-size="13.5" font-weight="700" fill="#3a4f93">省容量，但各副本查表带宽仍叠加</text>

  <!-- Account 2 -->
  <rect x="310" y="280" width="280" height="146" rx="7" fill="#ddf4ef" stroke="#087f73" stroke-width="1.4"/>
  <text x="450" y="306" text-anchor="middle" font-size="14.5" font-weight="700" fill="#065f56">请求动态 KV Cache</text>
  <rect x="324" y="318" width="252" height="28" rx="4" fill="#ffffff" stroke="#087f73" stroke-width="1"/>
  <text x="450" y="337" text-anchor="middle" font-size="13.5" font-weight="700" fill="#065f56">每请求私有 · 随长度增长</text>
  <text x="324" y="368" font-size="13.5" fill="#17211f">运行期持续追加与按块表连续读取</text>
  <text x="324" y="392" font-size="13.5" fill="#4d5652">与 Engram 卸载开关、生命周期独立</text>
  <text x="324" y="414" font-size="13.5" font-weight="700" fill="#065f56">cpu_offload 腾出 HBM 留给 KV</text>

  <!-- Account 3 -->
  <rect x="606" y="280" width="280" height="146" rx="7" fill="#fff0e9" stroke="#b54237" stroke-width="1.4"/>
  <text x="746" y="306" text-anchor="middle" font-size="14.5" font-weight="700" fill="#8f3229">查表瞬时产物（HBM）</text>
  <rect x="620" y="318" width="252" height="28" rx="4" fill="#ffffff" stroke="#b54237" stroke-width="1"/>
  <text x="746" y="337" text-anchor="middle" font-size="13.5" font-weight="700" fill="#8f3229">仅命中行物化为 BF16</text>
  <text x="620" y="368" font-size="13.5" fill="#17211f">单步算完门控后即可释放复用</text>
  <text x="620" y="392" font-size="13.5" fill="#4d5652">HIXL 路径另开有界缓冲 ≤262,144 行</text>
  <text x="620" y="414" font-size="13.5" font-weight="700" fill="#8f3229">仍保留 TP 归集与层内投影显存</text>
</svg>
