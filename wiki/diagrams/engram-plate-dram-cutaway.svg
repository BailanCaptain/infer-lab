<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 718" width="860" height="718" role="img" aria-label="Engram 条件记忆开启 cpu_offload=True（未开时驻留 HBM）与 main 分支 shared_engram 跨实例共享池的两级异构存储立体拆解剖面图：上层大容量 HOST DRAM 存放只读量化 ENGRAM 大表，按 N-gram 哈希仅对少量命中行经 Host UVA / A3 GVA 核内直读反量化或 HIXL RDMA 先拉紧凑行再反量化，在 GATE ADD 门控融合进残差流" font-family="var(--font-sans)">
  <title>Engram 条件记忆开启卸载（cpu_offload=True；未开时驻留 NPU HBM）与共享池（main 分支 shared_engram）的两级物理存储拆解：上层大容量 HOST DRAM 承载数百 GiB 只读量化 ENGRAM 参数表；每步仅按短语 N-gram 哈希稀疏读取命中行（本地 Host UVA 与 A3 MemFabric GVA 由查找核直读映射地址并即时反量化，A2/A5 HIXL RDMA 先拉取紧凑量化行入接收缓冲再反量化），经 GATE ADD 门控加回残差流。</title>
  <desc>关联源码符号：AscendParallelEngramEmbedding, AscendEngram, forward, HostUvaBuffer</desc>

  <image href="./wiki-illustrations/engram-dram-cutaway.webp" x="140" y="128" width="580" height="463" preserveAspectRatio="xMidYMid meet"/>

  <line x1="238" y1="114" x2="238" y2="322" stroke="#4c65b6" stroke-width="1.6"/>
  <circle cx="238" cy="322" r="5.5" fill="#ffffff" stroke="#4c65b6" stroke-width="2"/>
  <circle cx="238" cy="322" r="2.5" fill="#4c65b6"/>

  <line x1="432" y1="114" x2="432" y2="266" stroke="#087f73" stroke-width="1.6"/>
  <circle cx="432" cy="266" r="5.5" fill="#ffffff" stroke="#087f73" stroke-width="2"/>
  <circle cx="432" cy="266" r="2.5" fill="#087f73"/>

  <line x1="496" y1="114" x2="496" y2="382" stroke="#087f73" stroke-width="1.6"/>
  <circle cx="496" cy="382" r="5.5" fill="#ffffff" stroke="#087f73" stroke-width="2"/>
  <circle cx="496" cy="382" r="2.5" fill="#087f73"/>

  <line x1="442" y1="610" x2="442" y2="496" stroke="#c78300" stroke-width="1.6"/>
  <circle cx="442" cy="496" r="5.5" fill="#ffffff" stroke="#c78300" stroke-width="2"/>
  <circle cx="442" cy="496" r="2.5" fill="#c78300"/>

  <line x1="554" y1="610" x2="554" y2="492" stroke="#087f73" stroke-width="1.6"/>
  <circle cx="554" cy="492" r="5.5" fill="#ffffff" stroke="#087f73" stroke-width="2"/>
  <circle cx="554" cy="492" r="2.5" fill="#087f73"/>

  <g id="callout-host-vault">
    <circle cx="20" cy="26" r="11" fill="#4c65b6"/>
    <text x="20" y="30.5" text-anchor="middle" font-size="12" font-weight="700" fill="#ffffff">1</text>
    <text x="38" y="31" font-size="14" font-weight="700" fill="#17211f">主机内存与共享池</text>
    <text x="38" y="55" font-size="12.5" fill="#4d5652">开 <tspan font-family="var(--font-mono)" font-weight="700">cpu_offload</tspan> 存大表（关则留 HBM）</text>
    <text x="38" y="77" font-size="12.5" fill="#4d5652">机内 <tspan font-family="var(--font-mono)" font-weight="700">dp_shared_memory</tspan> 共享 POSIX</text>
    <text x="38" y="99" font-size="12.5" fill="#3a4f93"><tspan font-family="var(--font-mono)" font-weight="700">main</tspan> 增 <tspan font-family="var(--font-mono)" font-weight="700">shared_engram</tspan> 跨实例池</text>
  </g>

  <g id="callout-sparse-hit">
    <circle cx="300" cy="26" r="11" fill="#087f73"/>
    <text x="300" y="30.5" text-anchor="middle" font-size="12" font-weight="700" fill="#ffffff">2</text>
    <text x="318" y="31" font-size="14" font-weight="700" fill="#17211f">短语哈希点亮 (N-gram)</text>
    <text x="318" y="55" font-size="12.5" fill="#4d5652">按紧邻短词窗口哈希定位命中行</text>
    <text x="318" y="77" font-size="12.5" fill="#4d5652">图像位由 <tspan font-family="var(--font-mono)" font-weight="700">engram_dead_mask</tspan> 截断</text>
    <text x="318" y="99" font-size="12.5" fill="#065f56">扩知识容量而不增大每步矩阵乘</text>
  </g>

  <g id="callout-pinned-dma">
    <circle cx="580" cy="26" r="11" fill="#087f73"/>
    <text x="580" y="30.5" text-anchor="middle" font-size="12" font-weight="700" fill="#ffffff">3</text>
    <text x="598" y="31" font-size="14" font-weight="700" fill="#17211f">窄带查表 (UVA / GVA / RDMA)</text>
    <text x="598" y="55" font-size="12.5" fill="#4d5652">本地 <tspan font-family="var(--font-mono)" font-weight="700">HostUvaBuffer</tspan> 与 A3 <tspan font-family="var(--font-mono)" font-weight="700">GVA</tspan> 直读</text>
    <text x="598" y="77" font-size="12.5" fill="#4d5652">A2/A5 <tspan font-family="var(--font-mono)" font-weight="700">HIXL</tspan> 先拉行；共享省 <tspan font-family="var(--font-mono)" font-weight="700">EDP</tspan> 通信</text>
    <text x="598" y="99" font-size="12.5" fill="#065f56">百 GiB 静置主机，单步仅拉命中行</text>
  </g>

  <g id="callout-hbm-save">
    <circle cx="20" cy="634" r="11" fill="#c78300"/>
    <text x="20" y="638.5" text-anchor="middle" font-size="12" font-weight="700" fill="#ffffff">4</text>
    <text x="38" y="639" font-size="14" font-weight="700" fill="#17211f">腾出宝贵设备显存 (NPU HBM · 权重与 KV)</text>
    <text x="38" y="663" font-size="12.5" fill="#4d5652">把低频随机读大表移出 HBM，与动态 KV 卸载各司其职</text>
    <text x="38" y="686" font-size="12.5" fill="#936300">高带宽 HBM 专供每步必刷的激活权重与长文 KV 池</text>
  </g>

  <g id="callout-gate-add">
    <circle cx="442" cy="634" r="11" fill="#087f73"/>
    <text x="442" y="638.5" text-anchor="middle" font-size="12" font-weight="700" fill="#ffffff">5</text>
    <text x="460" y="639" font-size="14" font-weight="700" fill="#17211f">分组反量化与门控融合 (GATE ADD)</text>
    <text x="460" y="663" font-size="12.5" fill="#4d5652">命中行在卡上反量化（支持 <tspan font-family="var(--font-mono)" font-weight="700">INT8 / MXFP8</tspan>）并汇集全头</text>
    <text x="460" y="686" font-size="12.5" fill="#065f56">经 <tspan font-family="var(--font-mono)" font-weight="700">AscendEngram</tspan> 投影算门控权重后加回残差流</text>
  </g>
</svg>
