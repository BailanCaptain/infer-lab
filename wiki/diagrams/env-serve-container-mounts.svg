<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 500" width="900" height="500" font-family="var(--font-sans)" role="img" aria-label="昇腾容器挂载与双层卡号隔离解剖">
  <title>昇腾容器挂载与双层卡号隔离解剖：宿主机设备/驱动直通、A3 双裸片成对映射与容器内可见卡切分</title>
  <desc>左侧展示宿主机通过 --device 挂载 /dev/davinci*、davinci_manager、devmm_svm、hisi_hdc（标注 A3 双 Die 需成对挂载两个 davinci 节点），通过 -v 挂载 driver、dcmi、npu-smi 与权重缓存，并调大 --shm-size；右侧展示官方 v0.30.0 镜像用户态栈、ASCEND_RT_VISIBLE_DEVICES 逻辑卡重映射以及进容器两步验活。</desc>
  <defs>
    <marker id="cm-arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto">
      <path d="M 0 1.5 L 8.5 5 L 0 8.5 z" fill="#4c65b6"/>
    </marker>
  </defs>

  <line x1="450" y1="14" x2="450" y2="488" stroke="#b8bcb5" stroke-width="1.4" stroke-dasharray="6 4"/>

  <g role="group" aria-label="宿主机内核与挂载源">
    <circle cx="24" cy="24" r="12" fill="#4c65b6"/>
    <text x="24" y="28.5" text-anchor="middle" font-size="12.5" font-weight="700" fill="#ffffff">1</text>
    <text x="44" y="30" font-size="16" font-weight="700" fill="#17211f">Host 宿主机 · 驱动、设备节点与缓存</text>

    <rect x="12" y="46" width="404" height="162" rx="10" fill="#ffffff" stroke="#4c65b6" stroke-width="1.5"/>
    <text x="26" y="72" font-size="15" font-weight="700" fill="#3a4f93">① 计算与管理设备（<tspan font-family="var(--font-mono)" font-size="14">--device</tspan> 隔离第一层）</text>
    <text x="26" y="98" font-family="var(--font-mono)" font-size="13.5" fill="#17211f">/dev/davinci0..N  ·  /dev/davinci_manager</text>
    <text x="26" y="122" font-family="var(--font-mono)" font-size="13.5" fill="#4d5652">/dev/devmm_svm    ·  /dev/hisi_hdc</text>
    <rect x="24" y="136" width="380" height="60" rx="7" fill="#fff4cf" stroke="#d8b882" stroke-width="1.2"/>
    <text x="30" y="159" font-size="12" font-weight="700" fill="#936300">⚠ A3 双裸片：单张物理卡 = 成对挂载 davinci0 + davinci1</text>
    <text x="34" y="183" font-size="13.5" fill="#936300">• 950DT 官方命令省去 devmm_svm，补挂 hccn_tool</text>

    <rect x="12" y="220" width="404" height="122" rx="10" fill="#ffffff" stroke="#8a928f" stroke-width="1.4"/>
    <text x="26" y="246" font-size="15" font-weight="700" fill="#17211f">② 宿主机内核驱动与诊断工具（<tspan font-family="var(--font-mono)" font-size="14">-v</tspan> 直通）</text>
    <text x="26" y="274" font-family="var(--font-mono)" font-size="13.5" fill="#4d5652">/usr/local/Ascend/driver/lib64/ + version.info</text>
    <text x="26" y="300" font-family="var(--font-mono)" font-size="13.5" fill="#4d5652">/usr/local/dcmi + /usr/local/bin/npu-smi</text>
    <text x="26" y="326" font-size="13.5" fill="#66716d">附 <tspan font-family="var(--font-mono)">/etc/ascend_install.info</tspan> 供用户态校验驱动</text>

    <rect x="12" y="354" width="404" height="134" rx="10" fill="#ffffff" stroke="#8a928f" stroke-width="1.4"/>
    <text x="26" y="380" font-size="15" font-weight="700" fill="#17211f">③ 共享内存、权重缓存与网络映射</text>
    <text x="26" y="408" font-size="13.5" font-weight="700" fill="#065f56">• <tspan font-family="var(--font-mono)">--shm-size=16g</tspan>（单卡最小 1g，禁留默认 64MB）</text>
    <text x="26" y="435" font-size="13.5" fill="#4d5652">• <tspan font-family="var(--font-mono)">-v $MODEL_CACHE:/root/.cache</tspan> 免删容器重下权重</text>
    <text x="26" y="462" font-size="13.5" fill="#4d5652">• 单机推荐 <tspan font-family="var(--font-mono)">-p 8000:8000</tspan> 端口映射（或 <tspan font-family="var(--font-mono)">--net=host</tspan>）</text>
  </g>

  <path d="M 416 126 L 478 112" fill="none" stroke="#4c65b6" stroke-width="2" marker-end="url(#cm-arr)"/>
  <path d="M 416 280 L 478 134" fill="none" stroke="#4c65b6" stroke-width="1.8" marker-end="url(#cm-arr)"/>
  <path d="M 416 126 L 478 260" fill="none" stroke="#4c65b6" stroke-width="1.8" stroke-dasharray="4 3" marker-end="url(#cm-arr)"/>

  <g role="group" aria-label="容器内运行栈与二次切卡">
    <circle cx="496" cy="24" r="12" fill="#087f73"/>
    <text x="496" y="28.5" text-anchor="middle" font-size="12.5" font-weight="700" fill="#ffffff">2</text>
    <text x="516" y="30" font-size="16" font-weight="700" fill="#17211f">Container 容器 · 镜像栈与二次切卡</text>

    <rect x="484" y="46" width="404" height="128" rx="10" fill="#e8edff" stroke="#4c65b6" stroke-width="1.5"/>
    <text x="498" y="72" font-size="15" font-weight="700" fill="#3a4f93">官方镜像 <tspan font-family="var(--font-mono)" font-size="13.5">quay.io/ascend/vllm-ascend</tspan></text>
    <text x="498" y="99" font-family="var(--font-mono)" font-size="13.5" font-weight="700" fill="#4c65b6">v0.30.0 (A2) · -a3 · -310p · -a5</text>
    <text x="498" y="125" font-size="13.5" fill="#17211f">预装用户态：CANN 9.2.1 + NNAL 9.2.0 + torch_npu</text>
    <text x="498" y="151" font-size="13.5" fill="#4d5652">默认工作目录 <tspan font-family="var(--font-mono)">/workspace</tspan>，调用左侧挂载的驱动库</text>

    <rect x="484" y="188" width="404" height="164" rx="10" fill="#ffffff" stroke="#087f73" stroke-width="1.5"/>
    <text x="498" y="214" font-size="15" font-weight="700" fill="#065f56">容器内空闲卡切分（隔离第二层）</text>
    <text x="498" y="242" font-family="var(--font-mono)" font-size="13.5" font-weight="700" fill="#087f73">export ASCEND_RT_VISIBLE_DEVICES=2,3</text>
    <text x="498" y="268" font-size="13.5" fill="#17211f">把宿主机设备 <tspan font-family="var(--font-mono)" font-weight="600">2, 3</tspan> 重映射为进程内逻辑 <tspan font-family="var(--font-mono)" font-weight="600">NPU 0, 1</tspan></text>
    <rect x="496" y="282" width="380" height="58" rx="7" fill="#fff0e9" stroke="#b54237" stroke-width="1.2"/>
    <text x="508" y="305" font-size="13.5" font-weight="700" fill="#b54237">✗ 严禁误写 CUDA_VISIBLE_DEVICES</text>
    <text x="508" y="328" font-size="13.5" fill="#8f3229">✗ 严禁漏写 RT（ASCEND_VISIBLE_DEVICES 无效）</text>

    <rect x="484" y="366" width="404" height="122" rx="10" fill="#ddf4ef" stroke="#087f73" stroke-width="1.5"/>
    <text x="498" y="392" font-size="15" font-weight="700" fill="#065f56">进容器必跑两步验活门禁</text>
    <text x="498" y="420" font-family="var(--font-mono)" font-size="13.5" fill="#17211f">1. npu-smi info  <tspan font-family="var(--font-sans)" fill="#4d5652">(确认芯片型号与 HBM 空闲)</tspan></text>
    <text x="498" y="447" font-family="var(--font-mono)" font-size="13.5" fill="#17211f">2. assert torch.npu.is_available()</text>
    <text x="498" y="473" font-size="13.5" font-weight="700" fill="#087f73">✓ 打印 &quot;vLLM Ascend environment: OK&quot; 再起服务</text>
  </g>
</svg>
