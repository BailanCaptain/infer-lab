<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 520" width="900" height="520" font-family="var(--font-sans)" role="img" aria-label="容器启动、环境变量与最小起服务五大高频误区对照">
  <title>容器启动、环境变量与最小起服务五大高频误区对照（✗ 错误直觉 vs ✓ v0.30.0 源码真相）</title>
  <desc>五组左右对照：1) 默认 64MB shm 与误用 CUDA_VISIBLE_DEVICES vs 放大 --shm-size 与使用 ASCEND_RT_VISIBLE_DEVICES 及 A3 成对挂载；2) 旧环境变量 VLLM_ASCEND_ENABLE_NZ 静默失效 vs --additional-config weight_nz_mode；3) 盲判或盲抄无仓内读取的 HCCL 变量 vs 诚实标 unknown 按需精简；4) 漏传 --served-model-name 导致 404 vs get_served_model_name 默认回退完整路径；5) 仅看进程存活 vs 三步探针实测非空吐字。</desc>

  <text x="14" y="28" font-size="16" font-weight="700" fill="#8f3229">✗ 常见错误直觉（照抄祖传脚本最易踩坑）</text>
  <text x="462" y="28" font-size="16" font-weight="700" fill="#065f56">✓ v0.30.0 源码与运行真相</text>

  <g role="group" aria-label="误区一 容器共享内存与切卡变量">
    <rect x="12" y="44" width="428" height="82" rx="9" fill="#fff0e9" stroke="#b54237" stroke-width="1.4"/>
    <text x="24" y="72" font-size="14.5" font-weight="700" fill="#8f3229">1. 多卡留默认 64MB shm，用 CUDA_VISIBLE_DEVICES 切卡</text>
    <text x="24" y="102" font-size="13.5" fill="#b54237">以为共享内存够用，或写成 <tspan font-family="var(--font-mono)">ASCEND_VISIBLE_DEVICES</tspan></text>

    <rect x="460" y="44" width="428" height="82" rx="9" fill="#ddf4ef" stroke="#087f73" stroke-width="1.4"/>
    <text x="472" y="72" font-size="14.5" font-weight="700" fill="#065f56">放大 <tspan font-family="var(--font-mono)" font-size="13.5">--shm-size=16g</tspan>，切卡只认 <tspan font-family="var(--font-mono)" font-size="13.5">ASCEND_RT_VISIBLE_DEVICES</tspan></text>
    <text x="472" y="102" font-size="13.5" fill="#17211f">且 A3 双 Die 单张物理卡须成对挂载两个 <tspan font-family="var(--font-mono)">/dev/davinci</tspan> 节点</text>
  </g>

  <g role="group" aria-label="误区二 已下线的 NZ 环境变量">
    <rect x="12" y="138" width="428" height="82" rx="9" fill="#fff0e9" stroke="#b54237" stroke-width="1.4"/>
    <text x="24" y="166" font-size="14.5" font-weight="700" fill="#8f3229">2. 导出 <tspan font-family="var(--font-mono)" font-size="13.5">VLLM_ASCEND_ENABLE_NZ=0</tspan> 关闭权重转 NZ</text>
    <text x="24" y="196" font-size="13.5" fill="#b54237">照抄 v0.23/v0.26 旧帖，看到不报错就以为已经生效</text>

    <rect x="460" y="138" width="428" height="82" rx="9" fill="#ddf4ef" stroke="#087f73" stroke-width="1.4"/>
    <text x="472" y="166" font-size="14.5" font-weight="700" fill="#065f56">v0.30.0 已从 <tspan font-family="var(--font-mono)" font-size="13.5">envs.py</tspan> 移除该变量（仓内零读取）</text>
    <text x="472" y="196" font-size="13.5" fill="#17211f">必须改用 <tspan font-family="var(--font-mono)" font-weight="600">--additional-config &apos;{&quot;weight_nz_mode&quot;: 0}&apos;</tspan></text>
  </g>

  <g role="group" aria-label="误区三 底层 HCCL 环境变量判读">
    <rect x="12" y="232" width="428" height="82" rx="9" fill="#fff0e9" stroke="#b54237" stroke-width="1.4"/>
    <text x="24" y="260" font-size="14.5" font-weight="700" fill="#8f3229">3. 仓内搜不到的 <tspan font-family="var(--font-mono)" font-size="13.5">HCCL_*</tspan> 必无效，或越多越稳全抄上</text>
    <text x="24" y="290" font-size="13.5" fill="#b54237">把无 Python 读点的变量判死刑，或单机硬塞跨机通信参数</text>

    <rect x="460" y="232" width="428" height="82" rx="9" fill="#ddf4ef" stroke="#087f73" stroke-width="1.4"/>
    <text x="472" y="260" font-size="14.5" font-weight="700" fill="#065f56">底层 <tspan font-family="var(--font-mono)" font-size="13.5">libhccl.so</tspan> 可能直接消费，无仓内读点标 <tspan font-family="var(--font-mono)" font-size="13.5">unknown</tspan></text>
    <text x="472" y="290" font-size="13.5" fill="#17211f">单机最小起服务保持精简，仅在食谱明确要求时按需开启</text>
  </g>

  <g role="group" aria-label="误区四 漏传 served-model-name">
    <rect x="12" y="326" width="428" height="82" rx="9" fill="#fff0e9" stroke="#b54237" stroke-width="1.4"/>
    <text x="24" y="354" font-size="14.5" font-weight="700" fill="#8f3229">4. 省掉 <tspan font-family="var(--font-mono)" font-size="13.5">--served-model-name</tspan>，请求里写 <tspan font-family="var(--font-mono)" font-size="13.5">&quot;qwen3&quot;</tspan></text>
    <text x="24" y="384" font-size="13.5" fill="#b54237">以为服务端会自动从本地文件夹名字里猜出短别名</text>

    <rect x="460" y="326" width="428" height="82" rx="9" fill="#ddf4ef" stroke="#087f73" stroke-width="1.4"/>
    <text x="472" y="354" font-size="14.5" font-weight="700" fill="#065f56"><tspan font-family="var(--font-mono)" font-size="13.5">get_served_model_name()</tspan> 默认回退完整权重路径</text>
    <text x="472" y="384" font-size="13.5" fill="#17211f">名称不一致直接返回 <tspan font-family="var(--font-mono)" font-weight="600">404</tspan>；上线务必显式指定短服务名</text>
  </g>

  <g role="group" aria-label="误区五 仅看进程存活不做吐字探针">
    <rect x="12" y="420" width="428" height="86" rx="9" fill="#fff0e9" stroke="#b54237" stroke-width="1.4"/>
    <text x="24" y="448" font-size="14.5" font-weight="700" fill="#8f3229">5. 看 <tspan font-family="var(--font-mono)" font-size="13.5">ps</tspan> 进程还在跑就算起服成功，不测真实对话生成</text>
    <text x="24" y="479" font-size="13.5" fill="#b54237">加载或图捕获期就切入业务流量，或漏检缺失 <tspan font-family="var(--font-mono)">chat_template</tspan></text>

    <rect x="460" y="420" width="428" height="86" rx="9" fill="#ddf4ef" stroke="#087f73" stroke-width="1.4"/>
    <text x="472" y="448" font-size="14.5" font-weight="700" fill="#065f56">必跑 <tspan font-family="var(--font-mono)" font-size="13.5">/health(200)</tspan> → <tspan font-family="var(--font-mono)" font-size="13.5">/v1/models</tspan> → <tspan font-family="var(--font-mono)" font-size="13.5">/v1/chat/completions</tspan></text>
    <text x="472" y="479" font-size="13.5" fill="#17211f">拿到非空吐字才算全通；停服发 <tspan font-family="var(--font-mono)" font-weight="600">SIGINT</tspan> 禁一上来 <tspan font-family="var(--font-mono)">kill -9</tspan></text>
  </g>
</svg>
