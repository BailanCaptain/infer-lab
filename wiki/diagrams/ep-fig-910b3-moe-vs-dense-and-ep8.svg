<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 604" width="860" height="604" role="img" aria-label="Ascend 910B3 真机实测剖析图：左半对比 30.5B Qwen3-30B-A3B TP4+EP4 反超稠密 Qwen3-8B TP4，右半剖析八卡 DP2+TP4+EP8 显存减半但吞吐回落至 149.45 tok/s 的四大根因" font-family="var(--font-sans)">
  <title>Ascend 910B3（v0.30.0，统一 262-token 输入与 128-token 输出）MoE 对比与八卡扩展剖析：左半展示 30.5B 总参的 Qwen3-30B-A3B（128 选 8 激活 3.3B，TP4+EP4）在 c=16 跑出 179.70 tok/s、c=1 TPOT 77.90 ms，反超同四卡稠密 Qwen3-8B TP4（167.30 tok/s / 90.57 ms）；右半剖析扩至八卡 DP2+TP4+EP8 后虽把路由专家权重精确减半（54.000÷8=6.750 GiB，叠加恒定非专家 0.7652 GiB 后单卡总权重由 14.2652 降至 7.5152 GiB，实降 47.32%）并解锁 3.95M KV 容量，但因 A2 无 LoRA 且 ep_world_size=8 &lt; 16 走 ALLGATHER（且 dp_size&gt;1 触发跨 DP gather + reduce-scatter，非 AllToAll）、c=1 空闲 DP 跑 dummy batch、c=16 每 DP 仅 8 请求且双池隔离使前缀命中从 25.49% 降至 16.99%，c≤16 总吞吐反跌至 149.45 tok/s（单卡效率 44.93→18.68 tok/s）、c=1 TPOT 升至 96.36 ms（+18.46 ms 各项子份额待逐步轨迹拆分）。</title>
  <desc>HardwareProfile, CAPACITY_AND_EXPERT_DENSITY, _select_capacity_and_expert_density_moe_comm_method, ALLGATHER, MC2, all_gather, _finalize_with_dp_group, reduce_scatter, execute_dummy_batch</desc>

  <!-- Title Header -->
  <text x="16" y="26" font-size="16" font-weight="700" fill="#17211f">Ascend 910B3 真机实测（v0.30.0）：MoE 反超稠密 vs 八卡 EP8 负扩展剖析</text>
  <line x1="16" y1="38" x2="844" y2="38" stroke="#b8bcb5" stroke-width="1.4"/>

  <!-- Center Divider -->
  <line x1="404" y1="52" x2="404" y2="534" stroke="#d8d8cf" stroke-width="1.3" stroke-dasharray="5 4"/>

  <!-- ================= LEFT HALF: MoE vs Dense (x=16..390) ================= -->
  <circle cx="28" cy="64" r="12" fill="#087f73"/>
  <text x="28" y="69" text-anchor="middle" font-size="13" font-weight="700" fill="#ffffff">1</text>
  <text x="48" y="69" font-size="15" font-weight="700" fill="#17211f">30.5B 稀疏 MoE 为何反超 8B 稠密</text>
  <text x="16" y="92" font-size="13" fill="#66716d">同为 4 卡 · 262-tok 输入 / 128-tok 输出 · INFO 干净态</text>

  <!-- Metric Card A: c=16 Throughput -->
  <rect x="16" y="104" width="374" height="124" rx="8" fill="#ffffff" stroke="#d8d8cf" stroke-width="1.3"/>
  <text x="30" y="126" font-size="14" font-weight="700" fill="#17211f">c=16 总吞吐（越高越快）</text>
  <rect x="268" y="110" width="110" height="22" rx="4" fill="#ddf4ef" stroke="#087f73" stroke-width="1"/>
  <text x="323" y="126" text-anchor="middle" font-size="13" font-weight="700" fill="#065f56">+7.4% 反超</text>

  <text x="30" y="152" font-size="13" font-weight="700" fill="#065f56">Qwen3-30B-A3B · TP4+EP4（激活 3.3B）</text>
  <rect x="30" y="159" width="234" height="16" rx="4" fill="#087f73"/>
  <text x="272" y="172" font-family="var(--font-mono)" font-size="13.5" font-weight="700" fill="#065f56">179.70 tok/s</text>

  <text x="30" y="196" font-size="13" font-weight="700" fill="#936300">Qwen3-8B 稠密 · TP4（全激活 8.2B）</text>
  <rect x="30" y="203" width="217" height="16" rx="4" fill="#c78300"/>
  <text x="255" y="216" font-family="var(--font-mono)" font-size="13.5" font-weight="700" fill="#936300">167.30 tok/s</text>

  <!-- Metric Card B: c=1 TPOT -->
  <rect x="16" y="240" width="374" height="124" rx="8" fill="#ffffff" stroke="#d8d8cf" stroke-width="1.3"/>
  <text x="30" y="262" font-size="14" font-weight="700" fill="#17211f">c=1 稳态 TPOT（越低越快）</text>
  <rect x="258" y="246" width="120" height="22" rx="4" fill="#ddf4ef" stroke="#087f73" stroke-width="1"/>
  <text x="318" y="262" text-anchor="middle" font-size="13" font-weight="700" fill="#065f56">快 12.67 ms</text>

  <text x="30" y="288" font-size="13" font-weight="700" fill="#065f56">Qwen3-30B-A3B · TP4+EP4（u=0.88）</text>
  <rect x="30" y="295" width="179" height="16" rx="4" fill="#087f73"/>
  <text x="217" y="308" font-family="var(--font-mono)" font-size="13.5" font-weight="700" fill="#065f56">77.90 ms</text>

  <text x="30" y="332" font-size="13" font-weight="700" fill="#936300">Qwen3-8B 稠密 · TP4（u=0.85）</text>
  <rect x="30" y="339" width="208" height="16" rx="4" fill="#c78300"/>
  <text x="246" y="352" font-family="var(--font-mono)" font-size="13.5" font-weight="700" fill="#936300">90.57 ms</text>

  <!-- Left Why Box -->
  <rect x="16" y="376" width="374" height="158" rx="8" fill="#ddf4ef" stroke="#087f73" stroke-width="1.5"/>
  <text x="30" y="400" font-size="14.5" font-weight="700" fill="#065f56">为何 30.5B 参数反超 8B 稠密？</text>
  <text x="30" y="426" font-size="13" fill="#17211f">• 稀疏激活：128 选 8 仅算 3.3B（稠密全算 8.2B）</text>
  <text x="30" y="450" font-size="13" fill="#17211f">• 本地 KV 池更小：38.73 vs 47.36 GiB/卡</text>
  <text x="30" y="473" font-size="13" fill="#4d5652">（若图内重放整池非连续拷贝，池小压力更轻）</text>
  <text x="30" y="497" font-size="13" fill="#17211f">• 单卡效率：44.93 vs 41.83 tok/s/卡</text>
  <text x="30" y="521" font-size="13" fill="#4d5652">• 四卡容量：14.27 GiB 权重 + 1.69M KV tokens</text>

  <!-- ================= RIGHT HALF: 8-card DP2+TP4+EP8 Degradation (x=418..844) ================= -->
  <circle cx="430" cy="64" r="12" fill="#b54237"/>
  <text x="430" y="69" text-anchor="middle" font-size="13" font-weight="700" fill="#ffffff">2</text>
  <text x="450" y="69" font-size="15" font-weight="700" fill="#17211f">扩至 8 卡 DP2+TP4+EP8 为何负扩展？</text>
  <text x="418" y="92" font-size="13" fill="#66716d">路由专家精确减半并解锁 3.95M KV，c≤16 吞吐与延迟双回落</text>

  <!-- Right Sub-block A: Memory & Weight Split -->
  <rect x="418" y="104" width="426" height="124" rx="8" fill="#e8edff" stroke="#4c65b6" stroke-width="1.5"/>
  <text x="432" y="126" font-size="14" font-weight="700" fill="#3a4f93">✓ 路由专家权重精确减半（总重 -47.32%）</text>

  <text x="432" y="148" font-size="13" fill="#17211f">4 卡 EP4：54.000÷4 = 13.500 + 非专家 0.7652</text>
  <rect x="432" y="155" width="216" height="14" rx="3" fill="#c78300"/>
  <rect x="650" y="155" width="13" height="14" rx="2" fill="#66716d"/>
  <text x="671" y="167" font-family="var(--font-mono)" font-size="13" font-weight="700" fill="#3a4f93">14.27 GiB · 1.69M</text>

  <text x="432" y="191" font-size="13" fill="#17211f">8 卡 EP8：54.000÷8 = 6.750 + 非专家 0.7652</text>
  <rect x="432" y="198" width="108" height="14" rx="3" fill="#c78300"/>
  <rect x="542" y="198" width="13" height="14" rx="2" fill="#66716d"/>
  <text x="563" y="210" font-family="var(--font-mono)" font-size="13" font-weight="700" fill="#065f56">7.5152 GiB · 3.95M KV</text>

  <!-- Right Sub-block B: Regression KPIs -->
  <rect x="418" y="240" width="426" height="124" rx="8" fill="#fff0e9" stroke="#b54237" stroke-width="1.5"/>
  <text x="432" y="262" font-size="14" font-weight="700" fill="#8f3229">✗ 算力翻倍但实测吞吐与延迟反退（4 卡 → 8 卡）</text>

  <g fill="#ffffff" stroke="#b54237" stroke-width="1.1">
    <rect x="430" y="274" width="130" height="78" rx="6"/>
    <rect x="567" y="274" width="130" height="78" rx="6"/>
    <rect x="704" y="274" width="128" height="78" rx="6"/>
  </g>
  <g text-anchor="middle">
    <text x="495" y="295" font-size="13" fill="#66716d">c=16 总吞吐</text>
    <text x="495" y="319" font-family="var(--font-mono)" font-size="13" font-weight="700" fill="#8f3229">179.70→149.45</text>
    <text x="495" y="341" font-size="13" font-weight="700" fill="#8f3229">tok/s (-16.8%)</text>

    <text x="632" y="295" font-size="13" fill="#66716d">单卡效率</text>
    <text x="632" y="319" font-family="var(--font-mono)" font-size="13" font-weight="700" fill="#8f3229">44.93→18.68</text>
    <text x="632" y="341" font-size="13" font-weight="700" fill="#8f3229">tok/s/卡 (-58%)</text>

    <text x="768" y="295" font-size="13" fill="#66716d">c=1 TPOT</text>
    <text x="768" y="319" font-family="var(--font-mono)" font-size="13" font-weight="700" fill="#8f3229">77.90→96.36</text>
    <text x="768" y="341" font-size="13" font-weight="700" fill="#8f3229">ms (+18.46)</text>
  </g>

  <!-- Right Sub-block C: Four Root Causes -->
  <rect x="418" y="376" width="426" height="158" rx="8" fill="#f7e7f2" stroke="#9a4b86" stroke-width="1.5"/>
  <text x="432" y="399" font-size="14" font-weight="700" fill="#7a3a6a">四大源码与实测劣化根因</text>
  <text x="432" y="423" font-size="13" fill="#17211f"><tspan font-weight="700" fill="#7a3a6a">① A2 选路：</tspan>EP8 &lt; 16 走 ALLGATHER（非 AllToAll）</text>
  <text x="432" y="444" font-size="13" fill="#4d5652">dp_size&gt;1 触发每层跨 DP gather + reduce-scatter</text>
  <text x="432" y="469" font-size="13" fill="#17211f"><tspan font-weight="700" fill="#7a3a6a">② c=1 陪跑：</tspan>DP0=1/DP1=0，空闲组跑 dummy batch</text>
  <text x="432" y="494" font-size="13" fill="#17211f"><tspan font-weight="700" fill="#7a3a6a">③ 批度稀释：</tspan>c=16 按 8/8 均分，每 DP 仅 8 请求</text>
  <text x="432" y="519" font-size="13" fill="#17211f"><tspan font-weight="700" fill="#7a3a6a">④ 双池隔离：</tspan>前缀命中 25.49%→16.99%；退 global-slice</text>

  <!-- Footer Boundary Strip -->
  <rect x="16" y="548" width="828" height="44" rx="7" fill="#f5f2ea" stroke="#b8bcb5" stroke-width="1.2"/>
  <text x="430" y="575" text-anchor="middle" font-size="13" fill="#17211f">计量边界：8 卡统一 262-tok 输入 / 128-tok 输出、u=0.88；c=32 仅恢复每 DP 16 请求，高并发吞吐交叉点待测。</text>
</svg>
