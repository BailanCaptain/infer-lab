<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 508" width="900" height="508" role="img" aria-label="EP 五组常见直觉误区与 v0.30.0 源码真相对照图" font-family="var(--font-sans)">
  <title>EP 五组常见直觉误区 vs v0.30.0 源码与运行真相</title>
  <desc>determine_expert_map, global_num_experts, FusedMoEParallelConfig, SharedExpertParallelMode, set_mc2_mask, select_moe_comm_method, mc2_tokens_capacity, EplbConfig, dynamic_eplb</desc>
  <defs>
    <marker id="ep-myth-arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto">
      <path d="M 0 1.5 L 8.5 5 L 0 8.5 z" fill="#087f73"/>
    </marker>
  </defs>

  <text x="14" y="30" font-size="16" font-weight="700" fill="#8f3229">✗ 常见 EP 直觉误区（高频踩坑点）</text>
  <text x="392" y="30" font-size="16" font-weight="700" fill="#065f56">✓ v0.30.0 源码与运行真相（核对判据）</text>
  <line x1="12" y1="42" x2="888" y2="42" stroke="#b8bcb5" stroke-width="1.4"/>
  <line x1="378" y1="12" x2="378" y2="496" stroke="#b8bcb5" stroke-width="1.3" stroke-dasharray="5 4"/>

  <g fill="#fff0e9" stroke="#d88c82" stroke-width="1.4">
    <rect x="12" y="54" width="352" height="78" rx="10"/>
    <rect x="12" y="144" width="352" height="78" rx="10"/>
    <rect x="12" y="234" width="352" height="78" rx="10"/>
    <rect x="12" y="324" width="352" height="78" rx="10"/>
    <rect x="12" y="414" width="352" height="78" rx="10"/>
  </g>

  <g fill="#ffffff" stroke="#087f73" stroke-width="1.5">
    <rect x="392" y="54" width="496" height="78" rx="10"/>
    <rect x="392" y="144" width="496" height="78" rx="10"/>
    <rect x="392" y="234" width="496" height="78" rx="10"/>
    <rect x="392" y="324" width="496" height="78" rx="10"/>
    <rect x="392" y="414" width="496" height="78" rx="10"/>
  </g>

  <g fill="none" stroke="#087f73" stroke-width="2" marker-end="url(#ep-myth-arr)">
    <path d="M 364 93 L 386 93"/>
    <path d="M 364 183 L 386 183"/>
    <path d="M 364 273 L 386 273"/>
    <path d="M 364 363 L 386 363"/>
    <path d="M 364 453 L 386 453"/>
  </g>

  <g font-size="15" font-weight="700" fill="#8f3229">
    <text x="26" y="83">1. routed experts 就是选中的 k 个</text>
    <text x="26" y="173">2. 每卡专家一样多，计算负载就均分</text>
    <text x="26" y="263">3. 只要开 EP 就会无条件走 MC2</text>
    <text x="26" y="353">4. 共享专家也按 EP 分到各张卡上</text>
    <text x="26" y="443">5. 源槽位补零或空 DP 组等于没活干</text>
  </g>

  <g font-size="14" fill="#8f3229">
    <text x="26" y="114">把“路由专家”当成某 token 本轮挑出的子集</text>
    <text x="26" y="204">以为开 EP 或 MC2 就会自动消除慢卡等待</text>
    <text x="26" y="294">忽略硬件家族、EP 规模与动态 token 容量</text>
    <text x="26" y="384">且误以为开 EP 需要额外准备一批独立卡</text>
    <text x="26" y="474">看到 mc2_mask=0 或 dummy run 就当卡空闲</text>
  </g>

  <g font-size="15" font-weight="700" fill="#065f56">
    <text x="408" y="83">指整池候选专家集合，top-k 只是单次选中的子集</text>
    <text x="408" y="173">均分只管静态权重，运行时行数 N_r 由路由热度决定</text>
    <text x="408" y="263"><tspan font-family="var(--font-mono)" font-size="14">select_moe_comm_method</tspan> 按硬件与动态门槛选路</text>
    <text x="408" y="353">EP 复用 TP×DP×PCP 同批卡，共享专家走 TP/DP</text>
    <text x="408" y="443">源卡角色与目的卡角色解耦，空闲组仍算本地专家</text>
  </g>

  <g font-size="14" fill="#4d5652">
    <text x="408" y="114"><tspan font-family="var(--font-mono)" font-size="13.5">determine_expert_map</tspan> 把整池专家分给 EP 各卡常驻</text>
    <text x="408" y="204">慢卡阻塞 combine；均衡须开 <tspan font-family="var(--font-mono)" font-size="13.5">enable_eplb</tspan> 或 <tspan font-family="var(--font-mono)" font-size="13.5">dynamic_eplb</tspan></text>
    <text x="408" y="294">A2 须 ≤24/卡、EP≥16 且未超 <tspan font-family="var(--font-mono)" font-size="13.5">mc2_tokens_capacity</tspan></text>
    <text x="408" y="384">路由侧 <tspan font-family="var(--font-mono)" font-size="13.5">tp_size=1</tspan>；共享侧按 <tspan font-family="var(--font-mono)" font-size="13.5">SharedExpertParallelMode</tspan> 切</text>
    <text x="408" y="474"><tspan font-family="var(--font-mono)" font-size="13.5">mc2_mask</tspan> 只屏蔽本卡无效源行，远端命中的专家照常计算</text>
  </g>
</svg>
