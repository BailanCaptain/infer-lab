id: ep-fig-myths
caption: >-
  EP 五组常见直觉误区 vs v0.30.0 源码与运行真相：厘清 routed experts 是整池候选专家集合而非单 token 的 top-k 子集、权重均分（linear 放置）不等于运行时 token 计算量均衡（需 EPLB 调放置与冗余）、开 EP 不会无条件走 MC2（受硬件策略与动态容量门槛门控）、共享专家独立走 TP/DP/SP 模式而非随 EP 分专家、以及源槽位补零/空闲 DP 组仍须作为目的卡计算本地专家。
