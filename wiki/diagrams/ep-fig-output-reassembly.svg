<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 548" width="900" height="548" role="img" aria-label="GLM 双机 MC2 收尾三阶段输出重组图：第一阶段 EP16 combine 合齐单个 token 的 8 个专家贡献；第二阶段 TP8 All-Gather 拼回 8 行并去 4 行补位恢复 [4,4096]；第三阶段共享专家 TP8 All-Reduce 后与路由输出卡内相加" font-family="var(--font-sans)">
  <title>GLM 双机 MC2（R1 四个 token）收尾三阶段重组：① EP16 combine 将各专家输出送回源卡并按 top-8 权重合齐为每卡 1 行 [1,4096]（rank 4–7 为补位）；② TP8 All-Gather（finalize）收集 8 张卡切片拼成 [8,4096] 并去掉尾部 4 行补位恢复 [4,4096]；③ 共享分支在完整 [4,4096] 上经 TP8 All-Reduce 合齐，再与路由输出卡内逐元素相加。</title>
  <desc>关联源码符号：PrepareAndFinalizeWithMC2, finalize, _forward_shared_experts, shared_forward_impl</desc>
  <defs>
    <marker id="epr-plum" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto">
      <path d="M 0 1.5 L 8.5 5 L 0 8.5 z" fill="#9a4b86"/>
    </marker>
    <marker id="epr-teal" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto">
      <path d="M 0 1.5 L 8.5 5 L 0 8.5 z" fill="#087f73"/>
    </marker>
    <marker id="epr-amber" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto">
      <path d="M 0 1.5 L 8.5 5 L 0 8.5 z" fill="#c78300"/>
    </marker>
  </defs>

  <!-- Title -->
  <text x="16" y="26" font-size="16" font-weight="700" fill="#17211f">GLM 双机 MC2（R1 · 4 token）收尾三阶段：合专家 → 拼 token 行 → 加共享输出</text>
  <line x1="14" y1="36" x2="886" y2="36" stroke="#b8bcb5" stroke-width="1.4"/>

  <!-- ROW 1: EP16 combine (y=48..184) -->
  <circle cx="28" cy="60" r="12" fill="#9a4b86"/>
  <text x="28" y="64.5" text-anchor="middle" font-size="12.5" font-weight="700" fill="#ffffff">1</text>
  <text x="48" y="65" font-size="15" font-weight="700" fill="#17211f">EP16 combine：合齐「单个 token 的 8 个专家贡献」（各卡仍只持 1 行）</text>

  <!-- Left: 8 expert results from EP16 -->
  <rect x="16" y="80" width="234" height="92" rx="8" fill="#fff4cf" stroke="#c78300" stroke-width="1.4"/>
  <text x="133" y="102" text-anchor="middle" font-size="14" font-weight="700" fill="#936300">EP16 各目的卡专家输出</text>
  <g fill="#ffffff" stroke="#c78300" stroke-width="1">
    <rect x="28" y="112" width="48" height="22" rx="3"/><rect x="82" y="112" width="48" height="22" rx="3"/><rect x="136" y="112" width="48" height="22" rx="3"/><rect x="190" y="112" width="48" height="22" rx="3"/>
  </g>
  <g font-family="var(--font-mono)" font-size="13.5" text-anchor="middle" fill="#936300">
    <text x="52" y="128">w₁E₁</text><text x="106" y="128">w₂E₂</text><text x="160" y="128">…</text><text x="214" y="128">w₈E₈</text>
  </g>
  <text x="133" y="158" text-anchor="middle" font-size="13.5" fill="#4d5652">每个 token 8 份 BF16 [4096]</text>

  <!-- Arrow: EP16 combine -->
  <path d="M 250 126 L 348 126" fill="none" stroke="#9a4b86" stroke-width="2.4" marker-end="url(#epr-plum)"/>
  <text x="299" y="116" text-anchor="middle" font-size="13.5" font-weight="700" fill="#7a3a6a">EP16 combine</text>
  <text x="299" y="146" text-anchor="middle" font-size="13.5" fill="#66716d">回源卡加权求和</text>

  <!-- Right: 8 TP ranks each holding [1, 4096] -->
  <g stroke-width="1.3">
    <rect x="358" y="80" width="60" height="62" rx="6" fill="#ddf4ef" stroke="#087f73"/>
    <rect x="424" y="80" width="60" height="62" rx="6" fill="#ddf4ef" stroke="#087f73"/>
    <rect x="490" y="80" width="60" height="62" rx="6" fill="#ddf4ef" stroke="#087f73"/>
    <rect x="556" y="80" width="60" height="62" rx="6" fill="#ddf4ef" stroke="#087f73"/>
    <rect x="622" y="80" width="60" height="62" rx="6" fill="#ece9df" stroke="#b8bcb5" stroke-dasharray="4 3"/>
    <rect x="688" y="80" width="60" height="62" rx="6" fill="#ece9df" stroke="#b8bcb5" stroke-dasharray="4 3"/>
    <rect x="754" y="80" width="60" height="62" rx="6" fill="#ece9df" stroke="#b8bcb5" stroke-dasharray="4 3"/>
    <rect x="820" y="80" width="60" height="62" rx="6" fill="#ece9df" stroke="#b8bcb5" stroke-dasharray="4 3"/>
  </g>
  <g text-anchor="middle" font-size="13.5" font-weight="700">
    <text x="388" y="104" fill="#065f56">R0</text><text x="454" y="104" fill="#065f56">R1</text><text x="520" y="104" fill="#065f56">R2</text><text x="586" y="104" fill="#065f56">R3</text>
    <text x="652" y="104" fill="#66716d">R4</text><text x="718" y="104" fill="#66716d">R5</text><text x="784" y="104" fill="#66716d">R6</text><text x="850" y="104" fill="#66716d">R7</text>
  </g>
  <g text-anchor="middle" font-family="var(--font-mono)" font-size="13.5">
    <text x="388" y="128" fill="#17211f">t0</text><text x="454" y="128" fill="#17211f">t1</text><text x="520" y="128" fill="#17211f">t2</text><text x="586" y="128" fill="#17211f">t3</text>
    <text x="652" y="128" fill="#66716d">pad</text><text x="718" y="128" fill="#66716d">pad</text><text x="784" y="128" fill="#66716d">pad</text><text x="850" y="128" fill="#66716d">pad</text>
  </g>
  <text x="619" y="166" text-anchor="middle" font-size="13.5" fill="#4d5652">每张 TP 卡仅持 <tspan font-family="var(--font-mono)" font-weight="700">[1, 4096]</tspan>（R0–R3 为真实 token，R4–R7 为补位行）</text>

  <line x1="14" y1="184" x2="886" y2="184" stroke="#d8d8cf" stroke-width="1.3" stroke-dasharray="5 4"/>

  <!-- ROW 2: TP8 All-Gather (finalize) (y=196..342) -->
  <circle cx="28" cy="212" r="12" fill="#087f73"/>
  <text x="28" y="216.5" text-anchor="middle" font-size="12.5" font-weight="700" fill="#ffffff">2</text>
  <text x="48" y="217" font-size="15" font-weight="700" fill="#17211f">TP8 All-Gather（finalize）：拼回不同 token 行，再裁掉尾部 4 行补位</text>

  <!-- Step 2a: 8 slices [1, 4096] -->
  <rect x="16" y="232" width="166" height="96" rx="8" fill="#f7e7f2" stroke="#9a4b86" stroke-width="1.4"/>
  <text x="99" y="256" text-anchor="middle" font-size="14" font-weight="700" fill="#7a3a6a">8 卡各交 [1, 4096]</text>
  <text x="99" y="282" text-anchor="middle" font-size="13.5" fill="#17211f">每卡本地贡献 8,192 B</text>
  <text x="99" y="308" text-anchor="middle" font-size="13.5" fill="#66716d">prepare 切开的 8 行</text>

  <path d="M 182 280 L 266 280" fill="none" stroke="#9a4b86" stroke-width="2.4" marker-end="url(#epr-plum)"/>
  <text x="224" y="270" text-anchor="middle" font-size="13.5" font-weight="700" fill="#7a3a6a">TP8</text>
  <text x="224" y="300" text-anchor="middle" font-size="13.5" font-weight="700" fill="#7a3a6a">All-Gather</text>

  <!-- Step 2b: [8, 4096] matrix with ALL 8 distinct rows (4 real + 4 pad) and red cut line -->
  <g stroke-width="1.1">
    <rect x="274" y="226" width="214" height="12" fill="#ddf4ef" stroke="#087f73"/>
    <rect x="274" y="238" width="214" height="12" fill="#ddf4ef" stroke="#087f73"/>
    <rect x="274" y="250" width="214" height="12" fill="#ddf4ef" stroke="#087f73"/>
    <rect x="274" y="262" width="214" height="12" fill="#ddf4ef" stroke="#087f73"/>
    <rect x="274" y="278" width="214" height="12" fill="#ece9df" stroke="#b8bcb5" stroke-dasharray="3 2"/>
    <rect x="274" y="290" width="214" height="12" fill="#ece9df" stroke="#b8bcb5" stroke-dasharray="3 2"/>
    <rect x="274" y="302" width="214" height="12" fill="#ece9df" stroke="#b8bcb5" stroke-dasharray="3 2"/>
    <rect x="274" y="314" width="214" height="12" fill="#ece9df" stroke="#b8bcb5" stroke-dasharray="3 2"/>
  </g>
  <rect x="302" y="239" width="158" height="22" rx="4" fill="#ffffff" fill-opacity="0.9"/>
  <text x="381" y="255" text-anchor="middle" font-size="13.5" font-weight="700" fill="#065f56">t0–t3（4 行有效）</text>
  <rect x="310" y="291" width="142" height="22" rx="4" fill="#ffffff" fill-opacity="0.9"/>
  <text x="381" y="307" text-anchor="middle" font-size="13.5" fill="#66716d">pad × 4（4 行补位）</text>
  <line x1="266" y1="276" x2="496" y2="276" stroke="#b54237" stroke-width="2" stroke-dasharray="6 3"/>
  <text x="381" y="344" text-anchor="middle" font-size="13.5" font-weight="700" fill="#8f3229">拼成 [8, 4096] → 裁去尾部 4 行</text>

  <path d="M 492 268 L 574 268" fill="none" stroke="#087f73" stroke-width="2.2" marker-end="url(#epr-teal)"/>
  <text x="533" y="258" text-anchor="middle" font-size="13.5" font-weight="700" fill="#8f3229">去补位</text>

  <!-- Step 2c: Restored [4, 4096] routed output -->
  <rect x="582" y="234" width="302" height="72" rx="8" fill="#ddf4ef" stroke="#087f73" stroke-width="1.6"/>
  <text x="733" y="263" text-anchor="middle" font-size="15" font-weight="700" fill="#065f56">恢复完整路由输出 [4, 4096]</text>
  <text x="733" y="289" text-anchor="middle" font-size="13.5" fill="#17211f">DP0 全部 8 卡重新对齐同一份 4 行</text>

  <line x1="14" y1="356" x2="886" y2="356" stroke="#d8d8cf" stroke-width="1.3" stroke-dasharray="5 4"/>

  <!-- ROW 3: Shared Expert TP8 All-Reduce + Elementwise Add (y=368..494) -->
  <circle cx="28" cy="382" r="12" fill="#c78300"/>
  <text x="28" y="386.5" text-anchor="middle" font-size="12.5" font-weight="700" fill="#ffffff">3</text>
  <text x="48" y="387" font-size="15" font-weight="700" fill="#17211f">共享专家分支 TP8 All-Reduce + 与路由输出卡内逐元素相加</text>

  <rect x="16" y="402" width="218" height="76" rx="8" fill="#fff4cf" stroke="#c78300" stroke-width="1.4"/>
  <text x="125" y="428" text-anchor="middle" font-size="14" font-weight="700" fill="#936300">共享专家（始终算完整 4 行）</text>
  <text x="125" y="452" text-anchor="middle" font-size="13.5" fill="#17211f">每卡 TP8 256 维 → 部分和</text>
  <text x="125" y="470" text-anchor="middle" font-family="var(--font-mono)" font-size="13.5" fill="#936300">[4, 4096]</text>

  <path d="M 234 440 L 324 440" fill="none" stroke="#9a4b86" stroke-width="2.4" marker-end="url(#epr-plum)"/>
  <text x="279" y="430" text-anchor="middle" font-size="13.5" font-weight="700" fill="#7a3a6a">TP8</text>
  <text x="279" y="458" text-anchor="middle" font-size="13.5" font-weight="700" fill="#7a3a6a">All-Reduce</text>

  <rect x="332" y="406" width="184" height="68" rx="8" fill="#fff4cf" stroke="#c78300" stroke-width="1.5"/>
  <text x="424" y="434" text-anchor="middle" font-size="14" font-weight="700" fill="#936300">完整共享输出</text>
  <text x="424" y="458" text-anchor="middle" font-family="var(--font-mono)" font-size="13.5" font-weight="700" fill="#17211f">[4, 4096] BF16</text>

  <!-- Plus circle joining Row 2 routed [4, 4096] and Row 3 shared [4, 4096] -->
  <path d="M 516 440 L 552 440" fill="none" stroke="#c78300" stroke-width="2" marker-end="url(#epr-amber)"/>
  <path d="M 733 306 L 733 346 L 574 346 L 574 416" fill="none" stroke="#087f73" stroke-width="2" marker-end="url(#epr-teal)"/>
  <circle cx="574" cy="440" r="18" fill="#ffffff" stroke="#17211f" stroke-width="1.8"/>
  <text x="574" y="447" text-anchor="middle" font-size="20" font-weight="700" fill="#17211f">+</text>

  <path d="M 592 440 L 636 440" fill="none" stroke="#087f73" stroke-width="2.2" marker-end="url(#epr-teal)"/>

  <rect x="644" y="402" width="240" height="76" rx="9" fill="#ddf4ef" stroke="#087f73" stroke-width="1.8"/>
  <text x="764" y="430" text-anchor="middle" font-size="15" font-weight="700" fill="#065f56">本层最终 MoE 输出</text>
  <text x="764" y="456" text-anchor="middle" font-size="13.5" fill="#17211f">路由 + 共享 = <tspan font-family="var(--font-mono)" font-weight="700">[4, 4096]</tspan> BF16</text>

  <!-- Footer comparison strip -->
  <rect x="16" y="490" width="868" height="50" rx="7" fill="#e8edff" fill-opacity="0.7" stroke="#4c65b6" stroke-width="1.2"/>
  <text x="450" y="511" text-anchor="middle" font-size="13" fill="#17211f"><tspan font-weight="700" fill="#3a4f93">对比 AllGather 路径：</tspan>共享专家部分和暂不单独归约，先与 DP Reduce-Scatter 结果相加</text>
  <text x="450" y="531" text-anchor="middle" font-size="13" fill="#17211f">再统一 1 次 TP8 All-Reduce — 两条路径同为每层 <tspan font-weight="700" fill="#7a3a6a">4 次</tspan> 集合通信</text>
</svg>
