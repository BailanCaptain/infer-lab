<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 460" width="900" height="460" role="img" aria-label="多模态 EPD 三池分离架构与代理多路径分流图" font-family="var(--font-sans)">
<title>多模态 E / P / D 三池解耦架构与代理分流</title>
<desc>EPD three-pool disaggregation: Proxy routes multimodal requests via E -> ECConnector -> P -> Mooncake KV -> D, while text-only requests bypass E</desc>
<g stroke-width="1.4">
<rect x="16" y="64" width="164" height="148" rx="8" fill="#ece9df" stroke="#b8bcb5"/>
<rect x="216" y="54" width="204" height="114" rx="8" fill="#fff4cf" stroke="#c78300"/>
<rect x="454" y="54" width="198" height="114" rx="8" fill="#e8edff" stroke="#4c65b6"/>
<rect x="686" y="54" width="198" height="114" rx="8" fill="#ddf4ef" stroke="#087f73"/>
<rect x="216" y="190" width="668" height="58" rx="7" fill="#f7e7f2" stroke="#9a4b86"/>
<rect x="16" y="278" width="276" height="166" rx="8" fill="#fff4cf" stroke="#c78300"/>
<rect x="312" y="278" width="276" height="166" rx="8" fill="#e8edff" stroke="#4c65b6"/>
<rect x="608" y="278" width="276" height="166" rx="8" fill="#ddf4ef" stroke="#087f73"/>
</g>
<path d="M180 112h34m-5-4l5 4-5 4M420 112h32m-5-4l5 4-5 4M652 112h32m-5-4l5 4-5 4M180 182h20v36h14m-5-4l5 4-5 4" fill="none" stroke="#17211f" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/>
<path d="M553 190v-20m-4 5l4-5 4 5" fill="none" stroke="#9a4b86" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/>
<circle cx="28" cy="24" r="12.5" fill="#087f73"/>
<g font-weight="700">
<text x="28" y="28.5" text-anchor="middle" font-size="13" fill="#ffffff">1</text>
<text x="48" y="30" font-size="16" fill="#17211f">E / P / D 三池分离数据流：多模态经 E 预编码，纯文本直通 P → D</text>
<text x="98" y="92" text-anchor="middle" font-size="14.5" fill="#17211f">EPD 均衡代理</text>
<text x="318" y="80" text-anchor="middle" font-size="14.5" fill="#936300">E 池（Encoder 实例）</text>
<text x="553" y="80" text-anchor="middle" font-size="14.5" fill="#3a4f93">P 池（Prefill 实例）</text>
<text x="785" y="80" text-anchor="middle" font-size="14.5" fill="#065f56">D 池（Decode 实例）</text>
<text x="230" y="216" font-size="14.5" fill="#7a3a6a">纯文本旁路（has_mm_input == False）：彻底跳过 E 池，零等待直达 P → D</text>
<text x="30" y="304" font-size="15" fill="#936300">E 池资源画像（轻权重·高并发）</text>
<text x="326" y="304" font-size="15" fill="#3a4f93">P 池资源画像（算力受限·长文）</text>
<text x="622" y="304" font-size="15" fill="#065f56">D 池资源画像（带宽受限·稳态）</text>
</g>
<g fill="#4d5652" font-size="13.5">
<text x="98" y="118" text-anchor="middle">disagg_epd_proxy</text>
<text x="98" y="144" text-anchor="middle">识别多模态输入</text>
<text x="98" y="168" text-anchor="middle">按最小活跃负载</text>
<text x="98" y="192" text-anchor="middle">优先队列调度</text>
<text x="318" y="106" text-anchor="middle">ec_role = ec_producer</text>
<text x="318" y="128" text-anchor="middle">只跑 _execute_mm_encoder</text>
<text x="318" y="150" text-anchor="middle" font-weight="600" fill="#936300">提前返回空输出，免跑 LLM</text>
<text x="553" y="106" text-anchor="middle">ec_role = ec_consumer</text>
<text x="553" y="128" text-anchor="middle">拉取 EC 嵌入 + LLM Prefill</text>
<text x="553" y="150" text-anchor="middle" font-weight="600" fill="#3a4f93">MooncakeLayerwise 推 KV</text>
<text x="785" y="106" text-anchor="middle">kv_role = kv_consumer</text>
<text x="785" y="128" text-anchor="middle">承接历史 KV 持续解码</text>
<text x="785" y="150" text-anchor="middle" font-weight="600" fill="#065f56">逐字流式返回客户端</text>
<text x="230" y="238">也可降级为 2 池形态（E + PD 混部）：P 与 D 合一，仅将视觉编码独立扩缩容</text>
<text x="30" y="332">• ViT 权重仅数百 MB~1 GiB</text>
<text x="30" y="357">• 不分配 LLM KV Cache：</text>
<text x="30" y="380" font-weight="600" fill="#936300">  --gpu-memory-utilization 0.01</text>
<text x="30" y="405">• 可配超大批 token（如 114688）</text>
<text x="30" y="428">• 独立扩缩，不拖累 LLM TP/EP</text>
<text x="326" y="332">• 高算力配比（TP / PP / PCP）</text>
<text x="326" y="357">• 跨进程复用共享 EC 嵌入池</text>
<text x="326" y="382">• 需设 --mm-processor-cache-gb 0</text>
<text x="326" y="405">  以启用跨实例缓存键对齐</text>
<text x="326" y="428">• 逐层发送 KV 重叠 Prefill 计算</text>
<text x="622" y="332">• 高显存带宽配比（大 DP / EP）</text>
<text x="622" y="357">• 隔离视觉爆发与长文预填充</text>
<text x="622" y="382">• 稳定 ITL（词间时延）与 SLO</text>
<text x="622" y="405">• 反向借 Metaserver 触发 P 任务</text>
<text x="622" y="428">• 支持 D 端专属抢占与稀疏卸载</text>
</g>
</svg>
