<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 500" width="900" height="500" role="img" aria-label="多模态 EPD 三池分离数据流、显存水位对比与跨节点传输载荷比例条" font-family="var(--font-sans)">
  <title>多模态 E / P / D 三池分离数据流、显存水位与跨节点载荷量级对比</title>
  <desc>has_ec_transfer, get_ec_transfer, _execute_mm_encoder, make_empty_encoder_model_runner_output, forward_non_stream, fanout_encoder_primer, has_mm_input, maybe_prefill</desc>
  <defs>
    <marker id="epd1-arr-ink" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0 1.5L9 5L0 8.5z" fill="#17211f"/>
    </marker>
    <marker id="epd1-arr-plum" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0 1.5L9 5L0 8.5z" fill="#9a4b86"/>
    </marker>
  </defs>

  <!-- Section 1: Three-Pool Routing Flow -->
  <circle cx="24" cy="24" r="12" fill="#087f73"/>
  <text x="24" y="28.5" text-anchor="middle" font-size="12.5" font-weight="700" fill="#ffffff">1</text>
  <text x="44" y="30" font-size="16" font-weight="700" fill="#17211f">E / P / D 三池分离数据流：多模态经 E 预编码早退，纯文本旁路直达 P → D</text>

  <g stroke-width="1.5">
    <rect x="16" y="54" width="164" height="148" rx="8" fill="#ece9df" stroke="#b8bcb5"/>
    <rect x="216" y="50" width="204" height="112" rx="8" fill="#fff4cf" stroke="#c78300"/>
    <rect x="454" y="50" width="198" height="112" rx="8" fill="#e8edff" stroke="#4c65b6"/>
    <rect x="686" y="50" width="198" height="112" rx="8" fill="#ddf4ef" stroke="#087f73"/>
    <rect x="216" y="182" width="668" height="54" rx="7" fill="#f7e7f2" stroke="#9a4b86"/>
  </g>

  <path d="M180 106 H210 M420 106 H448 M652 106 H680" fill="none" stroke="#17211f" stroke-width="1.8" marker-end="url(#epd1-arr-ink)"/>
  <path d="M180 176 H198 V209 H210" fill="none" stroke="#9a4b86" stroke-width="1.8" marker-end="url(#epd1-arr-plum)"/>
  <line x1="553" y1="182" x2="553" y2="168" stroke="#9a4b86" stroke-width="1.8" marker-end="url(#epd1-arr-plum)"/>

  <g text-anchor="middle">
    <text x="98" y="84" font-size="14.5" font-weight="700" fill="#17211f">EPD 均衡代理</text>
    <text x="98" y="110" font-size="13.5" font-family="var(--font-mono)" fill="#4d5652">disagg_epd_proxy</text>
    <text x="98" y="136" font-size="13.5" fill="#4d5652">has_mm_input 判流</text>
    <text x="98" y="160" font-size="13.5" fill="#4d5652">最小活跃 token 队列</text>
    <text x="98" y="186" font-size="13.5" fill="#66716d">x-request-id 串联</text>

    <text x="318" y="76" font-size="14.5" font-weight="700" fill="#936300">E 池（ec_producer）</text>
    <text x="318" y="102" font-size="13.5" fill="#17211f">只跑 _execute_mm_encoder</text>
    <text x="318" y="125" font-size="13.5" fill="#4d5652">写远端 EC 后直接返回空输出</text>
    <text x="318" y="148" font-size="13.5" font-weight="700" fill="#936300">免跑 LLM · 免分海量 KV</text>

    <text x="553" y="76" font-size="14.5" font-weight="700" fill="#3a4f93">P 池（ec_consumer）</text>
    <text x="553" y="102" font-size="13.5" fill="#17211f">按 mm_hash 拉回 EC 嵌入</text>
    <text x="553" y="125" font-size="13.5" fill="#4d5652">跳过本地 ViT 跑语言 Prefill</text>
    <text x="553" y="148" font-size="13.5" font-weight="700" fill="#3a4f93">MooncakeLayerwise 推 KV</text>

    <text x="785" y="76" font-size="14.5" font-weight="700" fill="#065f56">D 池（kv_consumer）</text>
    <text x="785" y="102" font-size="13.5" fill="#17211f">借 Metaserver 反向触发 P</text>
    <text x="785" y="125" font-size="13.5" fill="#4d5652">接 KV 稳态解码，压低 ITL</text>
    <text x="785" y="148" font-size="13.5" font-weight="700" fill="#065f56">隔离多图突发与长文阻塞</text>
  </g>
  <text x="232" y="206" font-size="14" font-weight="700" fill="#7a3a6a">纯文本旁路（has_mm_input == False）：彻底跳过 E 池，零等待直达 P → D</text>
  <text x="232" y="227" font-size="13.5" fill="#4d5652">支持两池渐进形态（E + PD 混部，--prefill-servers-urls disable），再演进为 E + P + D 三池</text>

  <!-- Divider -->
  <line x1="16" y1="254" x2="884" y2="254" stroke="#d8d8cf" stroke-width="1.4" stroke-dasharray="6 4"/>

  <!-- Section 2: Visual Quantitative Bars (Memory Watermark & Cross-Node Payload) -->
  <circle cx="24" cy="278" r="12" fill="#c78300"/>
  <text x="24" y="282.5" text-anchor="middle" font-size="12.5" font-weight="700" fill="#ffffff">2</text>
  <text x="44" y="284" font-size="16" font-weight="700" fill="#17211f">为什么拆 E 划算：显存水位差 90 倍，E→P 嵌入载荷比 P→D KV 小 1–2 个量级</text>

  <!-- Left Panel: GPU Memory Utilization Comparison -->
  <rect x="16" y="302" width="414" height="184" rx="8" fill="#ece9df" stroke="#b8bcb5" stroke-width="1.3"/>
  <text x="30" y="328" font-size="14.5" font-weight="700" fill="#17211f">显存水位配比（--gpu-memory-utilization）</text>

  <text x="30" y="358" font-size="13.5" font-weight="700" fill="#936300">E 节点（只跑 ViT 早退）</text>
  <!-- 1% amber bar vs 99% free -->
  <rect x="30" y="366" width="8" height="24" rx="2" fill="#c78300"/>
  <rect x="40" y="366" width="374" height="24" rx="4" fill="#ffffff" stroke="#d8d8cf" stroke-width="1.2"/>
  <text x="50" y="383" font-size="13.5" font-weight="700" fill="#936300">0.01（省下显存给 114,688 视觉批激活）</text>

  <text x="30" y="422" font-size="13.5" font-weight="700" fill="#3a4f93">P / D 节点（语言主干 + KV 池）</text>
  <rect x="30" y="430" width="346" height="24" rx="4" fill="#e8edff" stroke="#4c65b6" stroke-width="1.4"/>
  <text x="203" y="447" text-anchor="middle" font-size="13.5" font-weight="700" fill="#3a4f93">~0.90（权重 + 海量 KV Cache）</text>
  <rect x="378" y="430" width="36" height="24" rx="3" fill="#ffffff" stroke="#d8d8cf" stroke-width="1"/>

  <!-- Right Panel: Transfer Payload Comparison -->
  <rect x="446" y="302" width="438" height="184" rx="8" fill="#ffffff" stroke="#b8bcb5" stroke-width="1.3"/>
  <text x="460" y="328" font-size="14.5" font-weight="700" fill="#17211f">跨节点传输体积（256 视觉 token，BF16，Qwen3-8B）</text>

  <!-- E->P: 2 MiB -->
  <text x="460" y="356" font-size="13.5" font-weight="700" fill="#936300">E → P 视觉嵌入（无层数 L 乘数）</text>
  <rect x="460" y="364" width="14" height="20" rx="3" fill="#fff4cf" stroke="#c78300" stroke-width="1.4"/>
  <text x="484" y="379" font-size="13.5" font-weight="700" fill="#936300">2 MiB（16 帧视频亦仅 32 MiB）</text>

  <!-- P->D 256 tok KV: 36 MiB (18x) -->
  <text x="460" y="405" font-size="13.5" font-weight="700" fill="#3a4f93">P → D 同 256 token KV（乘 36 层）</text>
  <rect x="460" y="413" width="150" height="20" rx="3" fill="#e8edff" stroke="#4c65b6" stroke-width="1.4"/>
  <text x="618" y="428" font-size="13.5" font-weight="700" fill="#3a4f93">36 MiB（18×）</text>

  <!-- P->D 32K KV: 4.5 GiB -->
  <rect x="460" y="440" width="408" height="22" rx="3" fill="#f7e7f2" stroke="#9a4b86" stroke-width="1.4"/>
  <text x="664" y="456" text-anchor="middle" font-size="13.5" font-weight="700" fill="#7a3a6a">32K 整请求 P→D KV：4.5 GiB</text>
  <text x="664" y="478" text-anchor="middle" font-size="12.5" fill="#7a3a6a">注：跨进程缓存须设 <tspan font-family="var(--font-mono)" font-weight="700">--mm-processor-cache-gb 0</tspan></text>
</svg>
