<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 588" width="860" height="588" role="img" aria-label="EPD（编码器-预填充-解码）三池解耦立体拆解剖面图：入口 PROXY 将识别出的图文/音频请求导向轻量 E POOL 产出 EC CACHE 再交 P POOL，纯文本等未匹配编码分流的请求走下方青色快道跳过 E POOL 直入 P POOL，P POOL 运行语言 Prefill 期间经 KV STREAM 边算边逐层推流至高显存 D POOL 持续解码" font-family="var(--font-sans)">
  <title>EPD 三池物理集群与双分流拆解：示例 PROXY 按 image_url / audio_url / input_audio 识别需预编码请求送入轻量 E POOL 跑完编码器并经 EC CACHE 桥交给 P POOL，纯文本（及示例代理未匹配的仅 video_url 请求）走下方直通旁路跳过 E POOL；P POOL 运行语言 Prefill 期间配合 MooncakeLayerwise 经 KV STREAM 边算边逐层把 KV 推给 D POOL 持续吐字。</title>
  <desc>关联源码符号：ECMemcacheConnector, _get_recv_buffer_tokens, has_mm_input, forward_non_stream</desc>

  <image href="./wiki-illustrations/epd-three-pool-cutaway.webp" x="40" y="130" width="780" height="314" preserveAspectRatio="xMidYMid meet"/>

  <line x1="262" y1="114" x2="262" y2="224" stroke="#c78300" stroke-width="1.6"/>
  <circle cx="262" cy="224" r="5.5" fill="#ffffff" stroke="#c78300" stroke-width="2"/>
  <circle cx="262" cy="224" r="2.5" fill="#c78300"/>

  <line x1="378" y1="114" x2="378" y2="246" stroke="#9a4b86" stroke-width="1.6"/>
  <circle cx="378" cy="246" r="5.5" fill="#ffffff" stroke="#9a4b86" stroke-width="2"/>
  <circle cx="378" cy="246" r="2.5" fill="#9a4b86"/>

  <line x1="680" y1="114" x2="680" y2="276" stroke="#4c65b6" stroke-width="1.6"/>
  <circle cx="680" cy="276" r="5.5" fill="#ffffff" stroke="#4c65b6" stroke-width="2"/>
  <circle cx="680" cy="276" r="2.5" fill="#4c65b6"/>

  <line x1="218" y1="476" x2="218" y2="400" stroke="#087f73" stroke-width="1.6"/>
  <circle cx="218" cy="400" r="5.5" fill="#ffffff" stroke="#087f73" stroke-width="2"/>
  <circle cx="218" cy="400" r="2.5" fill="#087f73"/>

  <line x1="548" y1="476" x2="548" y2="354" stroke="#4c65b6" stroke-width="1.6"/>
  <circle cx="548" cy="354" r="5.5" fill="#ffffff" stroke="#4c65b6" stroke-width="2"/>
  <circle cx="548" cy="354" r="2.5" fill="#4c65b6"/>

  <g id="callout-epool">
    <circle cx="20" cy="26" r="11" fill="#c78300"/>
    <text x="20" y="30.5" text-anchor="middle" font-size="12" font-weight="700" fill="#ffffff">1</text>
    <text x="38" y="31" font-size="14" font-weight="700" fill="#17211f">独立编码池 (E POOL)</text>
    <text x="38" y="55" font-size="12.5" fill="#4d5652">跑完 <tspan font-family="var(--font-mono)" font-weight="700">_execute_mm_encoder</tspan> 早退</text>
    <text x="38" y="77" font-size="12.5" fill="#4d5652">不跑语言主干，水位可设 <tspan font-family="var(--font-mono)" font-weight="700">0.01</tspan></text>
    <text x="38" y="99" font-size="12.5" fill="#936300">免随大语言模型高倍 TP/EP 绑卡</text>
  </g>

  <g id="callout-ecconn">
    <circle cx="300" cy="26" r="11" fill="#9a4b86"/>
    <text x="300" y="30.5" text-anchor="middle" font-size="12" font-weight="700" fill="#ffffff">2</text>
    <text x="318" y="31" font-size="14" font-weight="700" fill="#17211f">编码缓存桥 (ECConnector)</text>
    <text x="318" y="55" font-size="12.5" fill="#4d5652">只传单层视觉嵌入（常仅数 MiB）</text>
    <text x="318" y="77" font-size="12.5" fill="#4d5652">支持 <tspan font-family="var(--font-mono)" font-weight="700">ECMemcache / Mooncake</tspan></text>
    <text x="318" y="99" font-size="12.5" fill="#7a3a6a">热门底图跨实例命中免重复编码</text>
  </g>

  <g id="callout-dpool">
    <circle cx="580" cy="26" r="11" fill="#4c65b6"/>
    <text x="580" y="30.5" text-anchor="middle" font-size="12" font-weight="700" fill="#ffffff">3</text>
    <text x="598" y="31" font-size="14" font-weight="700" fill="#17211f">稳态解码池 (D POOL)</text>
    <text x="598" y="55" font-size="12.5" fill="#4d5652">大池 HBM 接住全层 KV 低时延吐字</text>
    <text x="598" y="77" font-size="12.5" fill="#4d5652">E / P / D 三池各自按瓶颈扩缩容</text>
    <text x="598" y="99" font-size="12.5" fill="#3a4f93">兼顾两池（E+PD）与三池（E+P+D）</text>
  </g>

  <g id="callout-bypass">
    <circle cx="20" cy="500" r="11" fill="#087f73"/>
    <text x="20" y="504.5" text-anchor="middle" font-size="12" font-weight="700" fill="#ffffff">4</text>
    <text x="38" y="505" font-size="14" font-weight="700" fill="#17211f">模态分流与纯文本快道 (PROXY → P POOL)</text>
    <text x="38" y="529" font-size="12.5" fill="#4d5652">示例代理识别 <tspan font-family="var(--font-mono)" font-weight="700">image/audio</tspan> 走 E 池，纯文本等跳过 E 直入 P 池</text>
    <text x="38" y="552" font-size="12.5" fill="#065f56">免被视觉编码排队阻塞（P 池内仍共享语言算力）</text>
  </g>

  <g id="callout-kvstream">
    <circle cx="448" cy="500" r="11" fill="#4c65b6"/>
    <text x="448" y="504.5" text-anchor="middle" font-size="12" font-weight="700" fill="#ffffff">5</text>
    <text x="466" y="505" font-size="14" font-weight="700" fill="#17211f">语言预填充与逐层推流 (P POOL → KV STREAM)</text>
    <text x="466" y="529" font-size="12.5" fill="#4d5652">P 端拉回嵌入跳过本地编码，直接跑语言 Prefill</text>
    <text x="466" y="552" font-size="12.5" fill="#3a4f93">配合 <tspan font-family="var(--font-mono)" font-weight="700">MooncakeLayerwise</tspan> 边算边逐层推 KV 至 D 端</text>
  </g>
</svg>
