layout: figure
id: eplb-cycle
caption: EPLB 的一轮循环（数为示意）：两张卡、四个专家，「对」是 token–expert 配对的个数。① 窗口 1 里卡 0 的 E0、E1 各接 8 对，合计 16，卡 1 只有 4；② 后台算出把 E1 和 E2 对调，计划两边各 10；③ 一层一层传权重，收到的先放进接收区，这一步结束时等传完，换掉两张表、把权重写进位置；④ 下一个窗口流量变了，E0 涨到 12 对，卡 0 又到 14，于是进入下一轮。虚线框是还没落地的计划或正在传的权重；每个专家接了几对写在专家块里，每张卡的合计写在卡名旁，负载条只表示长短。
