<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 410" width="900" height="410" role="img" aria-label="窗口 2 的流量（E0 12 对、E1 4 对、E2 和 E3 各 2 对，数为示意）放在三种摆法下。左：每卡 2 个位置，只能换位置，E0 放在哪张卡，哪张卡至少 12 + 2 = 14。中：启动时留了 2 个副本位，每卡 3 个位置，规划器给 E0、E1 各多放一份，并假定每份分到一半的活，估计两边各 10；两张卡上的两份 E0（E1 同理）完全一样，没有原件、副本之分。右：实际运行时每张卡按固定规则挑一份副本，这里正好各用本卡那份；E0 的 12 对里 8 对来自卡 0 上的 token、4 对来自卡 1，于是实际是 12 和 8。负载条只表示长短，数字写在专家块和卡名旁。">
  <title>窗口 2 的流量（E0 12 对、E1 4 对、E2 和 E3 各 2 对，数为示意）放在三种摆法下。左：每卡 2 个位置，只能换位置，E0 放在哪张卡，哪张卡至少 12 + 2 = 14。中：启动时留了 2 个副本位，每卡 3 个位置，规划器给 E0、E1 各多放一份，并假定每份分到一半的活，估计两边各 10；两张卡上的两份 E0（E1 同理）完全一样，没有原件、副本之分。右：实际运行时每张卡按固定规则挑一份副本，这里正好各用本卡那份；E0 的 12 对里 8 对来自卡 0 上的 token、4 对来自卡 1，于是实际是 12 和 8。负载条只表示长短，数字写在专家块和卡名旁。</title>
