<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 240" width="900" height="240" role="img" aria-label="示意：同一层 MoE、同一步里，两颗 NPU 各要算多少次「token 找专家」。数是编的，只为看清形状；这一层要等慢的那颗算完才能往下走">
  <title>示意：同一层 MoE、同一步里，两颗 NPU 各要算多少次「token 找专家」。数是编的，只为看清形状；这一层要等慢的那颗算完才能往下走</title>
  <defs><pattern id="eplb-hatch" width="7" height="7" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="7" height="7" fill="var(--color-surface-sunken, #ece9df)"/><line x1="0" y1="0" x2="0" y2="7" stroke="var(--color-ink-muted, #66716d)" stroke-width="2"/></pattern></defs>
  <rect x="20" y="50" width="585" height="26" rx="4" fill="var(--color-token, #087f73)" stroke="var(--color-ink, #17211f)" stroke-width="1.3"/>
  <text x="36" y="68" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="13" font-weight="700" fill="var(--color-ink-inverse, #ffffff)">NPU 0：650 次</text>
  <rect x="20" y="84" width="315" height="26" rx="4" fill="var(--color-token, #087f73)" stroke="var(--color-ink, #17211f)" stroke-width="1.3"/>
  <text x="36" y="102" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="13" font-weight="700" fill="var(--color-ink-inverse, #ffffff)">NPU 1：350 次</text>
  <rect x="335" y="84" width="270" height="26" rx="4" fill="url(#eplb-hatch)" stroke="var(--color-ink-muted, #66716d)" stroke-width="1.3"/>
  <rect x="20" y="162" width="459" height="26" rx="4" fill="var(--color-token, #087f73)" stroke="var(--color-ink, #17211f)" stroke-width="1.3"/>
  <text x="36" y="180" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="13" font-weight="700" fill="var(--color-ink-inverse, #ffffff)">NPU 0：510 次</text>
  <rect x="20" y="196" width="441" height="26" rx="4" fill="var(--color-token, #087f73)" stroke="var(--color-ink, #17211f)" stroke-width="1.3"/>
  <text x="36" y="214" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="13" font-weight="700" fill="var(--color-ink-inverse, #ffffff)">NPU 1：490 次</text>
  <text x="20" y="34" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="14" font-weight="700" fill="var(--color-ink, #17211f)">没开 EPLB：热门专家挤在 NPU 0 上</text>
  <text x="20" y="146" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="14" font-weight="700" fill="var(--color-ink, #17211f)">开了 EPLB：热门专家挪走一些、多放一份</text>
</svg>
