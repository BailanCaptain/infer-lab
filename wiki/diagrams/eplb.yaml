layout: figure
id: eplb
caption: 示意：同一层 MoE、同一步里，两颗 NPU 各要算多少次「token 找专家」。数是编的，只为看清形状；这一层要等慢的那颗算完才能往下走
size: [900, 240]

texts:
  - { at: [20, 34], text: 没开 EPLB：热门专家挤在 NPU 0 上, size: 14, strong: true }
  - { at: [20, 146], text: 开了 EPLB：热门专家挪走一些、多放一份, size: 14, strong: true }

bars:
  # 1 次 = 0.9 像素
  - at: [20, 50]
    scale: 0.9
    segments:
      - { value: 650, tone: token, text: NPU 0：650 次 }
  - at: [20, 84]
    scale: 0.9
    segments:
      - { value: 350, tone: token, text: NPU 1：350 次 }
      - { value: 300, tone: danger, style: hatch, text: 算完干等 }
  - at: [20, 162]
    scale: 0.9
    segments:
      - { value: 510, tone: token, text: NPU 0：510 次 }
  - at: [20, 196]
    scale: 0.9
    segments:
      - { value: 490, tone: token, text: NPU 1：490 次 }
