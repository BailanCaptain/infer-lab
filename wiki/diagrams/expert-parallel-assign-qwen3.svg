<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 526" width="900" height="526" role="img" aria-label="Qwen3-30B-A3B 在 EP=4 四卡上的专家分工与单 token top-8 稀疏命中图：四张等宽卡各持 32 个完整专家，示例 token 仅命中 rank 0 本地 2 个与 rank 1、rank 3 远端各 3 个，rank 2 命中 0 个但仍作为 EP 成员参加同一轮集合通信" font-family="var(--font-sans)">
  <title>Qwen3-30B-A3B 的 128 个路由专家均分在 EP=4 四张卡上（每卡 32 个完整专家、0 个共享专家）：以 rank 0 上一个 token 选出 {E5, E19, E37, E48, E60, E99, E112, E124} 为示意，本地直接算 rank 0 的 2 个，逻辑目的卡仅含 rank 1 与 rank 3 各 3 份；rank 2 对本 token 承担 0 份本地专家计算（点对点/MC2 派发下收到 0 载荷；A2 EP=4 走 AllGather 路径则先汇聚再本地过滤），但全 4 卡均须参加同轮 EP 集合通信。</title>
