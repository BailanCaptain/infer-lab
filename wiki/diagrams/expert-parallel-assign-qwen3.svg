<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 440" width="900" height="440" role="img" aria-label="Qwen3-30B-A3B 的 128 个路由专家切分在 EP=4 四张卡上（每卡常驻 32 个完整专家，无共享专家）：每个 token 经 Softmax 选出 top-8 专家并重归一化权重（和为 1.0），经 dispatch 发往命中的持有卡执行 SwiGLU（2048 → 768 → 2048），再经 combine 送回源卡按权重加权求和。">
  <title>Qwen3-30B-A3B 的 128 个路由专家切分在 EP=4 四张卡上（每卡常驻 32 个完整专家，无共享专家）：每个 token 经 Softmax 选出 top-8 专家并重归一化权重（和为 1.0），经 dispatch 发往命中的持有卡执行 SwiGLU（2048 → 768 → 2048），再经 combine 送回源卡按权重加权求和。</title>
