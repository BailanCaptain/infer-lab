<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 656" width="900" height="656" role="img" aria-label="本部署开启 EP 后的 A2 通信选择。两组使用同一个最大 token 数；每卡 18 个专家和 EP16 已满足规模条件，实际分界是当前配置的容量 128。固定源码提交见页末。">
  <title>本部署开启 EP 后的 A2 通信选择。两组使用同一个最大 token 数；每卡 18 个专家和 EP16 已满足规模条件，实际分界是当前配置的容量 128。固定源码提交见页末。</title>
