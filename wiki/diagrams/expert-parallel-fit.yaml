layout: figure
id: expert-parallel-fit
caption: 光是专家就占满了一颗 NPU；分给两颗后，每颗只占一半
size: [900, 200]

texts:
  - { at: [20, 64], text: 只用一颗, size: 15, strong: true }
  - { at: [748, 64], text: "+ 其他权重约 5 GiB", size: 13, note: true }
  - { at: [20, 152], text: 用两颗，每颗, size: 15, strong: true }
  - { at: [436, 153], text: 空出来的放其他权重和 KV Cache, tone: kv }
  - { at: [150, 190], text: 长度按比例画，1 GiB 约 9 像素, size: 13, note: true }

bars:
  # 9 像素 = 1 GiB；64 GB 约 59.6 GiB。「其他权重」按总参数约 35B、BF16 估算，约 5 GiB
  - at: [150, 46]
    scale: 9
    frame: { value: 59.6, label: 一颗 NPU 的显存：64 GB }
    segments:
      - { value: 60, text: 全部专家 60 GiB }
      - { value: 5.2, style: hatch }
  - at: [150, 134]
    scale: 9
    frame: { value: 59.6 }
    segments:
      - { value: 30, text: 128 个专家 30 GiB }

tags:
  - { at: [780, 84], text: 装不下 }
