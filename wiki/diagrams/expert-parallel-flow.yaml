layout: figure
id: expert-parallel-flow
caption: 每张卡上方的琥珀色框是它放的专家（专家 Ek 就是乘 k），下方一排格子一格一个 token。① dispatch 把 token 复制到选中专家所在的卡；原卡上没有它选中的专家时，那一格空出来，不进本卡专家的计算（hidden 本身仍留在原卡）。② 每块沿连线交给本卡的一个专家，块下的小字是乘了什么：专家的 k，再乘这个 token 给该专家的组合权重。③ combine 把结果送回原卡加起来，块下淡色小字提醒这个数是怎么算来的。卡 1 放着 3 个 token 都选中的 E3，要算 4 份，其他卡只有 1–2 份。
size: [880, 1896]
exchanges:
  - at: [41, 8]
    # 第二排从右往左排：按 卡0 卡1 卡3 卡2 写，画出来正好是「卡0 卡1 / 卡2 卡3」
    cards: [卡 0, 卡 1, 卡 3, 卡 2]
    experts: [[E0, E1], [E2, E3], [E6, E7], [E4, E5]]
    slots: 4
    cell: [68, 34]
    labels: [我, 吃, 了, 苹果]
    gap: [190, 84]
    tag: 数为示意 · 专家 Ek 就是乘 k
    start:
      - [2, null, null, null]
      - [null, 5, null, null]
      - [null, null, null, 4]
      - [null, null, 3, null]
    steps:
      - title: ① dispatch：每个 token 发到它选中专家所在的卡
        moves:
          - { from: [0, 0], to: [1, 0] }
          - { from: [0, 0], to: [3, 0] }
          - { from: [1, 1], to: [0, 1] }
          - { from: [3, 2], to: [1, 2] }
          - { from: [3, 2], to: [2, 2] }
          - { from: [2, 3], to: [1, 3] }
          - { from: [2, 3], to: [3, 3] }
        # 原卡上没有这个 token 选中的专家：发走以后这一格空出来，不进本卡专家的计算
        drop: [[0, 0], [3, 2], [2, 3]]
      - title: ② 各卡把 token 交给本卡专家算，再乘组合权重
        sets:
          - { at: [1, 0], value: 3, expert: E3, note: ×3 ×0.5 }
          - { at: [1, 1], value: 6, expert: E2, note: ×2 ×0.6 }
          - { at: [1, 2], value: 4.5, expert: E3, note: ×3 ×0.5 }
          - { at: [1, 3], value: 9, expert: E3, note: ×3 ×0.75 }
          - { at: [3, 0], value: 4, expert: E4, note: ×4 ×0.5 }
          - { at: [3, 3], value: 5, expert: E5, note: ×5 ×0.25 }
          - { at: [0, 1], value: 2, expert: E1, note: ×1 ×0.4 }
          - { at: [2, 2], value: 10.5, expert: E7, note: ×7 ×0.5 }
      - title: ③ combine：结果送回 token 的原卡，加起来
        moves:
          - { from: [1, 0], to: [0, 0], op: sum }
          - { from: [3, 0], to: [0, 0], op: sum }
          - { from: [0, 1], to: [1, 1], op: sum }
          - { from: [1, 2], to: [3, 2], op: sum }
          - { from: [2, 2], to: [3, 2], op: sum }
          - { from: [1, 3], to: [2, 3], op: sum }
          - { from: [3, 3], to: [2, 3], op: sum }
        keep: [[0, 0], [1, 1], [3, 2], [2, 3]]
        notes:
          - { at: [1, 0], text: 2×3×0.5 }
          - { at: [1, 1], text: 5×2×0.6 }
          - { at: [1, 2], text: 3×3×0.5 }
          - { at: [1, 3], text: 4×3×0.75 }
          - { at: [0, 1], text: 5×1×0.4 }
          - { at: [3, 0], text: 2×4×0.5 }
          - { at: [3, 3], text: 4×5×0.25 }
          - { at: [2, 2], text: 3×7×0.5 }
    end: 每张卡拿回了自己 token 的路由输出
pins:
  - source: vllm-ascend@db701c1f:vllm_ascend/ops/fused_moe/token_dispatcher.py#L150-L339
    symbols: [token_dispatch, token_combine]
