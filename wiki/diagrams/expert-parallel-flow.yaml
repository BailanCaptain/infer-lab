layout: figure
id: expert-parallel-flow
caption: EP 一层 MoE 分三步。发之前每张卡放 2 个专家（琥珀色框），下面一排格子一格一个 token，只有本卡 token 那格有数。① dispatch 和 ③ combine 两格每列是一张收数据的卡，上面的小块是送来的数，小块上方写着从哪张卡来；紫色箭头是经过通信送来的块，灰色虚线是本卡自己的那块，不用发。① 把 token 复制到它选中专家所在的卡，原卡上没有它选中的专家时那一格空出来，不进本卡专家的计算（hidden 本身仍留在原卡）。② 每张卡把收到的 token 交给本卡专家（琥珀色小块）算，再乘这个 token 给该专家的组合权重（灰色小块）。③ 把结果送回 token 的原卡加起来。卡 1 放着 3 个 token 都选中的 E3，要算 4 份，其他卡只有 1–2 份。
size: [880, 1036]
frames:
  - { label: 发之前：每张卡放 2 个专家，各有 1 个 token, at: [8, 30], size: [864, 148] }
  - { label: ① dispatch：token 复制到它选中专家所在的卡, at: [8, 216], size: [864, 168] }
  - { label: ② 各卡用本卡专家算，再乘组合权重, at: [8, 422], size: [864, 220] }
  - { label: ③ combine：结果送回 token 的原卡，加起来, at: [8, 680], size: [864, 210] }
  - { label: 发之后：每张卡拿回自己 token 的路由输出, at: [8, 928], size: [864, 100] }
