<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 424" width="900" height="424" role="img" aria-label="用 4 张卡示意 EP：E0–E7 是路由专家，每卡放 2 个完整专家。卡 0 上的 token「我」由 router 选中卡 1 的 E3、卡 2 的 E4，派发过去各自计算，再把结果送回卡 0 按权重相加；灰色专家这次未选中，仍留在各卡上。">
  <title>用 4 张卡示意 EP：E0–E7 是路由专家，每卡放 2 个完整专家。卡 0 上的 token「我」由 router 选中卡 1 的 E3、卡 2 的 E4，派发过去各自计算，再把结果送回卡 0 按权重相加；灰色专家这次未选中，仍留在各卡上。</title>
