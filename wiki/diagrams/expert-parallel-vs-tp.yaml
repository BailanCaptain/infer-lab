layout: figure
id: expert-parallel-vs-tp
caption: 同样 4 张卡、8 个专家，每张卡都只存全部专家权重的 1/4。TP 把每个专家竖着切成 4 条，每张卡拿每个专家的一条；EP 不切专家，每张卡拿 2 个完整专家。实色是某个 token 选中的 E3、E4：TP 下 4 张卡都要动手、结果还要相加，EP 下只有持有它们的两张卡动手。
