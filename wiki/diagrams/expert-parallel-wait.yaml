layout: figure
id: expert-parallel-wait
caption: 在这个示意里，派发、计算、收回三个阶段不重叠，每份计算等时，两次交换各占 1 格。上面卡 1 要算 4 份，其余卡算完后等待；下面同样 8 份工作平均分到每卡 2 份。实际时序取决于算子、通信与重叠，不能只按份数推算延迟。
