  <!-- Section 2 Header -->
  <text x="12" y="330" font-size="16" font-weight="700" fill="#17211f">二、v0.30.0 / main 中 oproj 与 mlp 的生效前提与图捕获尺寸死锁守卫</text>
  <line x1="12" y1="340" x2="888" y2="340" stroke="#b8bcb5" stroke-width="1.3"/>

  <!-- Box 1: 6 Hard Preconditions -->
  <rect x="12" y="354" width="324" height="196" rx="9" fill="#ece9df" stroke="#b8bcb5" stroke-width="1.4"/>
  <text x="26" y="378" font-size="14" font-weight="700" fill="#17211f">1. 六道硬前提（缺一即启动报错）</text>
  <g font-size="12.5" fill="#4d5652">
    <text x="26" y="402">① 仅 <tspan font-weight="700" fill="#17211f">MoE</tspan> 模型，分组大小整除 <tspan font-family="var(--font-mono)">DP</tspan></text>
    <text x="26" y="424">② 全局 <tspan font-family="var(--font-mono)" font-weight="700" fill="#065f56">TP == 1</tspan> 且 <tspan font-family="var(--font-mono)" font-weight="700" fill="#065f56">PCP == 1</tspan></text>
    <text x="26" y="446">③ 非 <tspan font-family="var(--font-mono)">NONE</tspan> 图模式（须可录图）</text>
    <text x="26" y="468">④ PD 分离 D 节点（<tspan font-family="var(--font-mono)">kv_consumer</tspan>）</text>
    <text x="26" y="490">⑤ 开 <tspan font-family="var(--font-mono)">recompute_scheduler_enable</tspan></text>
    <text x="26" y="512">⑥ 配套 <tspan font-family="var(--font-mono)">PreemptOffloadConnector</tspan></text>
    <text x="26" y="536" font-size="12" fill="#66716d">注：新组替换原 TP 组，非叠加；embedding 不绑重算</text>
  </g>

  <!-- Arrow 1 -> Decision Gate -->
  <path d="M 336 452 L 352 452" fill="none" stroke="#66716d" stroke-width="2" marker-end="url(#fgtp-arr)"/>

  <!-- Decision Gate Diamond/Hexagon Box -->
  <polygon points="356,452 478,364 600,452 478,540" fill="#fff4cf" stroke="#c78300" stroke-width="1.6"/>
  <text x="478" y="416" font-size="13.5" font-weight="700" text-anchor="middle" fill="#936300">2. 图尺寸守卫</text>
  <text x="478" y="436" font-size="12" font-family="var(--font-mono)" text-anchor="middle" fill="#17211f">max_step = min(</text>
  <text x="478" y="454" font-size="12" font-family="var(--font-mono)" text-anchor="middle" fill="#17211f">batched, seqs×qlen)</text>
  <text x="478" y="476" font-size="12" font-weight="700" font-family="var(--font-mono)" text-anchor="middle" fill="#8f3229">capture ≥ max_step?</text>

  <!-- Pass Branch (Top Right) -->
  <path d="M 561 424 L 634 424 L 634 398 L 656 398" fill="none" stroke="#087f73" stroke-width="2" marker-end="url(#fgtp-arr-teal)"/>
  <text x="614" y="416" font-size="12" font-weight="700" text-anchor="middle" fill="#065f56">满足 ✓</text>
  <rect x="662" y="354" width="226" height="82" rx="9" fill="#ddf4ef" stroke="#087f73" stroke-width="1.4"/>
  <text x="676" y="378" font-size="13.5" font-weight="700" fill="#065f56">启用跨 DP 分片组</text>
  <text x="676" y="400" font-size="12" fill="#4d5652">全步宽均命中图捕获档位，</text>
  <text x="676" y="418" font-size="12" fill="#4d5652">跨 DP 集合通信形状一致无死锁</text>

  <!-- Fail Branch (Bottom Right) -->
  <path d="M 561 480 L 634 480 L 634 504 L 656 504" fill="none" stroke="#b54237" stroke-width="2" marker-end="url(#fgtp-arr-red)"/>
  <text x="614" y="472" font-size="12" font-weight="700" text-anchor="middle" fill="#8f3229">不足 ✗</text>
  <rect x="662" y="448" width="226" height="102" rx="9" fill="#fff0e9" stroke="#b54237" stroke-width="1.5"/>
  <text x="676" y="471" font-size="13.5" font-weight="700" fill="#8f3229">告警并静默关闭（防死锁）</text>
  <text x="676" y="492" font-size="12" fill="#4d5652">避免超宽步退 eager 导致 DP 失配：</text>
  <text x="676" y="513" font-size="12" fill="#4d5652">• <tspan font-weight="700" fill="#8f3229">v0.30.0</tspan>：字段清零为 <tspan font-family="var(--font-mono)" font-weight="700" fill="#8f3229">0</tspan></text>
  <text x="676" y="534" font-size="12" fill="#4d5652">• <tspan font-weight="700" fill="#8f3229">main</tspan>：重置 <tspan font-family="var(--font-mono)" font-weight="700" fill="#8f3229">1</tspan>（含 KDA 默认 1）</text>
</svg>
