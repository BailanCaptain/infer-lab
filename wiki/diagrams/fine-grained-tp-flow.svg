  <path d="M650 240 L675 240 L675 202 L700 202" fill="none" stroke="var(--color-danger, #b54237)" stroke-width="1.4" marker-end="url(#fine-grained-tp-flow-ah-danger)"/>
  <path d="M450 444 L117 490" fill="none" stroke="var(--color-ink, #17211f)" stroke-width="1.4" marker-end="url(#fine-grained-tp-flow-ah-ink)"/>
  <path d="M450 444 L337 490" fill="none" stroke="var(--color-ink, #17211f)" stroke-width="1.4" marker-end="url(#fine-grained-tp-flow-ah-ink)"/>
  <path d="M450 444 L557 490" fill="none" stroke="var(--color-ink, #17211f)" stroke-width="1.4" marker-end="url(#fine-grained-tp-flow-ah-ink)"/>
  <path d="M450 444 L777 490" fill="none" stroke="var(--color-ink, #17211f)" stroke-width="1.4" marker-end="url(#fine-grained-tp-flow-ah-ink)"/>
  <rect x="250" y="40" width="400" height="52" rx="8" fill="var(--color-surface-sunken, #ece9df)" stroke="var(--color-ink, #17211f)" stroke-width="1.5"/>
  <text x="450" y="62" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="14" font-weight="700" fill="var(--color-ink, #17211f)" text-anchor="middle">读配置：每个模块一个分组大小</text>
  <text x="450" y="81" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="13" font-weight="400" fill="var(--color-ink, #17211f)" text-anchor="middle">默认都是 0，表示不分组</text>
  <rect x="250" y="124" width="400" height="56" rx="8" fill="var(--color-control, #66716d)" stroke="var(--color-ink, #17211f)" stroke-width="1.5"/>
  <text x="450" y="148" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="14" font-weight="700" fill="var(--color-ink-inverse, #ffffff)" text-anchor="middle">加载配置时检查前提</text>
  <text x="450" y="167" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="13" font-weight="400" fill="var(--color-ink-inverse, #ffffff)" text-anchor="middle">MoE 模型、能整除 DP 数；输出投影另要 TP 为 1</text>
  <rect x="250" y="212" width="400" height="56" rx="8" fill="var(--color-control, #66716d)" stroke="var(--color-ink, #17211f)" stroke-width="1.5"/>
  <text x="450" y="236" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="14" font-weight="700" fill="var(--color-ink-inverse, #ffffff)" text-anchor="middle">词表嵌入、输出投影还要 recompute 调度器</text>
  <text x="450" y="255" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="13" font-weight="400" fill="var(--color-ink-inverse, #ffffff)" text-anchor="middle">这个调度器只能开在 PD 分离的 D 节点</text>
  <rect x="700" y="168" width="180" height="56" rx="8" fill="var(--color-accent-soft, #fff0e9)" stroke="var(--color-danger, #b54237)" stroke-opacity="0.4" stroke-width="1.5" stroke-dasharray="5 4"/>
  <text x="790" y="192" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="13" font-weight="400" fill="#8f3229" text-anchor="middle">校验失败退出</text>
  <text x="790" y="211" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="13" font-weight="400" fill="#8f3229" text-anchor="middle">图示相关断言分支</text>
  <rect x="250" y="300" width="400" height="56" rx="8" fill="var(--color-comm, #9a4b86)" stroke="var(--color-ink, #17211f)" stroke-width="1.5"/>
  <text x="450" y="324" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="14" font-weight="700" fill="var(--color-ink-inverse, #ffffff)" text-anchor="middle">建通信组：沿 DP 方向每 k 张卡一组</text>
  <text x="450" y="343" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="13" font-weight="400" fill="var(--color-ink-inverse, #ffffff)" text-anchor="middle">只有 PP、TP 坐标相同的卡才组队</text>
  <rect x="250" y="388" width="400" height="56" rx="8" fill="var(--color-weight, #c78300)" stroke="var(--color-ink, #17211f)" stroke-width="1.5"/>
  <text x="450" y="412" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="14" font-weight="700" fill="var(--color-ink-inverse, #ffffff)" text-anchor="middle">构造模块时换组、按新组切权重</text>
  <text x="450" y="431" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="13" font-weight="400" fill="var(--color-ink-inverse, #ffffff)" text-anchor="middle">词表嵌入和 lm_head 换组；线性层按层名挑算子</text>
  <rect x="15" y="490" width="205" height="56" rx="8" fill="var(--color-token, #087f73)" stroke="var(--color-ink, #17211f)" stroke-width="1.5"/>
  <text x="117.5" y="514" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="14" font-weight="700" fill="var(--color-ink-inverse, #ffffff)" text-anchor="middle">词表嵌入</text>
  <text x="117.5" y="533" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="13" font-weight="400" fill="var(--color-ink-inverse, #ffffff)" text-anchor="middle">收集编号 → 查表 → 归约送回</text>
  <rect x="235" y="490" width="205" height="56" rx="8" fill="var(--color-token, #087f73)" stroke="var(--color-ink, #17211f)" stroke-width="1.5"/>
  <text x="337.5" y="514" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="14" font-weight="700" fill="var(--color-ink-inverse, #ffffff)" text-anchor="middle">lm_head</text>
  <text x="337.5" y="533" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="13" font-weight="400" fill="var(--color-ink-inverse, #ffffff)" text-anchor="middle">收集 → 打分 → 交换送回</text>
  <rect x="455" y="490" width="205" height="56" rx="8" fill="var(--color-token, #087f73)" stroke="var(--color-ink, #17211f)" stroke-width="1.5"/>
  <text x="557.5" y="514" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="14" font-weight="700" fill="var(--color-ink-inverse, #ffffff)" text-anchor="middle">稠密 MLP</text>
  <text x="557.5" y="533" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="13" font-weight="400" fill="var(--color-ink-inverse, #ffffff)" text-anchor="middle">收集 → 列切行切 → 归约送回</text>
  <rect x="675" y="490" width="205" height="56" rx="8" fill="var(--color-token, #087f73)" stroke="var(--color-ink, #17211f)" stroke-width="1.5"/>
  <text x="777.5" y="514" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="14" font-weight="700" fill="var(--color-ink-inverse, #ffffff)" text-anchor="middle">attention 输出投影</text>
  <text x="777.5" y="533" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="13" font-weight="400" fill="var(--color-ink-inverse, #ffffff)" text-anchor="middle">交换特征 → 行切 → 归约送回</text>
  <text x="450" y="22" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="13.5" font-weight="700" fill="var(--color-ink, #17211f)" text-anchor="middle">从配置到前向：细粒度 TP 在代码里走过的几步</text>
  <text x="790" y="150" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="13" font-weight="400" fill="var(--color-ink, #17211f)" text-anchor="middle">不满足</text>
  <text x="450" y="580" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="13.5" font-weight="400" fill="var(--color-ink-muted, #66716d)" text-anchor="middle" font-style="italic">进入集合操作前须满足组内形状约定；补齐位置依模块与执行模式</text>
</svg>
