<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 600" width="900" height="600" role="img" aria-label="固定 db701c1f 基线中细粒度 TP 的代码走向。配置先过前提检查，相关断言失败会退出；P 侧的 recompute 开关另有告警关闭分支。通过后，按 DP 方向为正的分组大小建通信组；构造模型时，词表嵌入和 lm_head 换用自己的组，线性层按层名选分组算子；前向时各模块收集输入、送回结果。rc2 的模块前提及自动关闭分支不同，见正文版本差异。">
  <title>固定 db701c1f 基线中细粒度 TP 的代码走向。配置先过前提检查，相关断言失败会退出；P 侧的 recompute 开关另有告警关闭分支。通过后，按 DP 方向为正的分组大小建通信组；构造模型时，词表嵌入和 lm_head 换用自己的组，线性层按层名选分组算子；前向时各模块收集输入、送回结果。rc2 的模块前提及自动关闭分支不同，见正文版本差异。</title>
  <defs><marker id="fine-grained-tp-flow-ah-ink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="var(--color-ink, #17211f)"/></marker><marker id="fine-grained-tp-flow-ah-danger" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="var(--color-danger, #b54237)"/></marker></defs>
  <path d="M450 92 L450 124" fill="none" stroke="var(--color-ink, #17211f)" stroke-width="1.4" marker-end="url(#fine-grained-tp-flow-ah-ink)"/>
