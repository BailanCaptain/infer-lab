layout: figure
id: fine-grained-tp-flow
caption: 细粒度 TP 在代码里走过的几步。配置先过一轮前提检查，不满足就在启动时报错；过了检查，按 DP 方向为每个非零的分组大小建一个通信组；构造模型时，词表嵌入和 lm_head 换用自己的组，线性层按层名挑出对应的分组算子；前向时各模块按自己的方式收集输入、送回结果。
size: [900, 600]
items:
  - { at: [250, 40], size: [400, 52], text: 读配置：每个模块一个分组大小, sub: 默认都是 0，表示不分组, style: plain }
  - { at: [250, 124], size: [400, 56], text: 加载配置时检查前提, sub: MoE 模型、能整除 DP 数；输出投影另要 TP 为 1, tone: control }
  - { at: [250, 212], size: [400, 56], text: 词表嵌入、输出投影还要 recompute 调度器, sub: 这个调度器只能开在 PD 分离的 D 节点, tone: control }
  - { at: [700, 168], size: [180, 56], text: 启动时报错, sub: 不会悄悄关掉, tone: danger, style: faded }
  - { at: [250, 300], size: [400, 56], text: 建通信组：沿 DP 方向每 k 张卡一组, sub: 只有 PP、TP 坐标相同的卡才组队, tone: comm }
  - { at: [250, 388], size: [400, 56], text: 构造模块时换组、按新组切权重, sub: 词表嵌入和 lm_head 换组；线性层按层名挑算子, tone: weight }
  - { at: [15, 490], size: [205, 56], text: 词表嵌入, sub: 收集编号 → 查表 → 归约送回, tone: token }
  - { at: [235, 490], size: [205, 56], text: lm_head, sub: 收集 → 打分 → 交换送回, tone: token }
  - { at: [455, 490], size: [205, 56], text: 稠密 MLP, sub: 收集 → 列切行切 → 归约送回, tone: token }
  - { at: [675, 490], size: [205, 56], text: attention 输出投影, sub: 交换特征 → 行切 → 归约送回, tone: token }
links:
