<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 500" width="900" height="500" role="img" aria-label="数为示意。4 张卡各跑自己的请求（DP4，普通 TP 为 1，每张卡原本都存一整份非专家权重）。按模块分组以后：词表嵌入和稠密 MLP 每 2 张卡合存一份、各存一半；attention 不分组，每张卡仍是一整份；路由专家照常按 EP 分到 4 张卡；lm_head 4 张卡合存一份、各存四分之一。分了组的模块，组里的卡服务的是不同请求，所以进这一层先收集组内各卡的输入，算完再把结果送回各自的卡。">
