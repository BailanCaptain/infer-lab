<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 742" width="900" height="742" role="img" aria-label="细粒度 TP 沿 DP 轴借 rank：省下的是权重副本，花掉的是每层多出来的两次集合通信，而「每层」到底是几层决定了这笔账划不划算">
  <title>细粒度 TP 沿 DP 轴借 rank：省下的是权重副本，花掉的是每层多出来的两次集合通信，而「每层」到底是几层决定了这笔账划不划算</title>
  <rect width="900" height="742" fill="var(--color-surface, #fbfaf6)"/>
  <rect x="20" y="26" width="860" height="218" rx="12" fill="var(--color-kv-soft, #e8edff)"/>
  <rect x="36" y="40" width="225.6" height="26.5" rx="13.3" fill="var(--color-kv, #4c65b6)"/><text x="47" y="58.1" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="13.5" font-weight="700" fill="var(--color-ink-inverse, #ffffff)">组是沿 DP 轴建的，不是沿 TP 轴</text>
  <text x="38" y="83" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="12.5" font-weight="400" fill="var(--color-ink-muted, #5b6763)">rank_grid reshape 成 (pp, dp, tp) 之后，每个细粒度组取的是固定 tp_idx 上连续 group_size 个 dp 下标——所以硬约束写成「整除 </text>
  <text x="38" y="101" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="12.5" font-weight="400" fill="var(--color-ink-muted, #5b6763)">data_parallel_size」，而不是整除 tensor_parallel_size。</text>
  <rect x="20" y="264" width="860" height="196" rx="12" fill="var(--color-weight-soft, #fff4cf)"/>
  <rect x="36" y="278" width="203.4" height="26.5" rx="13.3" fill="var(--color-weight, #b87a00)"/><text x="47" y="296.1" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="13.5" font-weight="700" fill="var(--color-ink-inverse, #ffffff)">换来的是每卡少存 7/8 份权重</text>
  <text x="38" y="321" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="12.5" font-weight="400" fill="var(--color-ink-muted, #5b6763)">DeepSeek-R1 词表 129280、hidden 7168，lm_head 与 embedding 各 129280 × 7168 × 2 B = 1.73 GiB；不开的时候组里 8 张卡各存一份一模</text>
  <text x="38" y="339" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="12.5" font-weight="400" fill="var(--color-ink-muted, #5b6763)">一样的。</text>
  <rect x="20" y="480" width="860" height="214" rx="12" fill="var(--color-accent-soft, #fff0e9)"/>
  <rect x="36" y="494" width="211" height="26.5" rx="13.3" fill="var(--color-accent, #e85b32)"/><text x="47" y="512.1" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="13.5" font-weight="700" fill="var(--color-ink-inverse, #ffffff)">代价多大，看这一项落在几层上</text>
  <text x="38" y="537" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="12.5" font-weight="400" fill="var(--color-ink-muted, #5b6763)">mlp TP 只作用在 is_moe_layer 之外的层，DeepSeek-R1 的 first_k_dense_replace = 3，所以只有 3 层；o_proj 每一层都有，61 层各来一</text>
  <text x="38" y="555" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="12.5" font-weight="400" fill="var(--color-ink-muted, #5b6763)">次同样的通信。</text>
