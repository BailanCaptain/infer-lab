layout: scene
id: fine-grained-tp
caption: 细粒度 TP 沿 DP 轴借 rank：省下的是权重副本，花掉的是每层多出来的两次集合通信，而「每层」到底是几层决定了这笔账划不划算
size: [900, 742]

regions:
  - label: 组是沿 DP 轴建的，不是沿 TP 轴
    note: rank_grid reshape 成 (pp, dp, tp) 之后，每个细粒度组取的是固定 tp_idx 上连续 group_size 个 dp 下标——所以硬约束写成「整除 data_parallel_size」，而不是整除 tensor_parallel_size。
    at: [20, 26]
    size: [860, 218]
    tone: neutral
  - label: 换来的是每卡少存 7/8 份权重
    note: DeepSeek-R1 词表 129280、hidden 7168，lm_head 与 embedding 各 129280 × 7168 × 2 B = 1.73 GiB；不开的时候组里 8 张卡各存一份一模一样的。
    at: [20, 264]
    size: [860, 196]
    tone: ascend
  - label: 代价多大，看这一项落在几层上
    note: mlp TP 只作用在 is_moe_layer 之外的层，DeepSeek-R1 的 first_k_dense_replace = 3，所以只有 3 层；o_proj 每一层都有，61 层各来一次同样的通信。
    at: [20, 480]
    size: [860, 214]
    tone: accent

