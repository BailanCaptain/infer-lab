<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 360" width="900" height="360" role="img" aria-label="FA3 的前向不看批的状态，只按条数把一批切成 decode 段和 prefill 段，同一个算子各调一次再拼回；默认后端不切，按批的状态挑分支一次算完">
  <title>FA3 的前向不看批的状态，只按条数把一批切成 decode 段和 prefill 段，同一个算子各调一次再拼回；默认后端不切，按批的状态挑分支一次算完</title>
  <defs><marker id="flash-attention-3-ah-token" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="var(--color-token, #087f73)"/></marker></defs>
  <path d="M250 44 L250 140" fill="none" stroke="var(--color-ink-muted, #66716d)" stroke-width="1.4" stroke-dasharray="6 5"/>
  <text x="238" y="58" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="13" font-weight="700" fill="var(--color-ink-muted, #66716d)" text-anchor="end">decode 段</text>
  <text x="262" y="58" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="13" font-weight="700" fill="var(--color-ink-muted, #66716d)">prefill 段</text>
  <path d="M88 102 L150 166" fill="none" stroke="var(--color-token, #087f73)" stroke-width="1.4" marker-end="url(#flash-attention-3-ah-token)"/>
  <path d="M148 102 L150 166" fill="none" stroke="var(--color-token, #087f73)" stroke-width="1.4" marker-end="url(#flash-attention-3-ah-token)"/>
  <path d="M474 102 L450 166" fill="none" stroke="var(--color-token, #087f73)" stroke-width="1.4" marker-end="url(#flash-attention-3-ah-token)"/>
  <path d="M150 218 L320 264" fill="none" stroke="var(--color-token, #087f73)" stroke-width="1.4" marker-end="url(#flash-attention-3-ah-token)"/>
  <path d="M450 218 L320 264" fill="none" stroke="var(--color-token, #087f73)" stroke-width="1.4" marker-end="url(#flash-attention-3-ah-token)"/>
  <rect x="320" y="64" width="36" height="36" rx="4" fill="var(--color-surface, #fbfaf6)" stroke="var(--color-ink, #17211f)" stroke-opacity="0.45" stroke-width="1.2"/>
  <rect x="359" y="64" width="36" height="36" rx="4" fill="var(--color-surface, #fbfaf6)" stroke="var(--color-ink, #17211f)" stroke-opacity="0.45" stroke-width="1.2"/>
  <rect x="398" y="64" width="36" height="36" rx="4" fill="var(--color-surface, #fbfaf6)" stroke="var(--color-ink, #17211f)" stroke-opacity="0.45" stroke-width="1.2"/>
  <rect x="437" y="64" width="36" height="36" rx="4" fill="var(--color-surface, #fbfaf6)" stroke="var(--color-ink, #17211f)" stroke-opacity="0.45" stroke-width="1.2"/>
  <rect x="476" y="64" width="36" height="36" rx="4" fill="var(--color-surface, #fbfaf6)" stroke="var(--color-ink, #17211f)" stroke-opacity="0.45" stroke-width="1.2"/>
  <rect x="515" y="64" width="36" height="36" rx="4" fill="var(--color-surface, #fbfaf6)" stroke="var(--color-ink, #17211f)" stroke-opacity="0.45" stroke-width="1.2"/>
  <rect x="554" y="64" width="36" height="36" rx="4" fill="var(--color-surface, #fbfaf6)" stroke="var(--color-ink, #17211f)" stroke-opacity="0.45" stroke-width="1.2"/>
  <rect x="593" y="64" width="36" height="36" rx="4" fill="var(--color-surface, #fbfaf6)" stroke="var(--color-ink, #17211f)" stroke-opacity="0.45" stroke-width="1.2"/>
  <rect x="70" y="64" width="36" height="36" rx="8" fill="var(--color-token, #087f73)" stroke="var(--color-ink, #17211f)" stroke-width="1.5"/>
  <rect x="130" y="64" width="36" height="36" rx="8" fill="var(--color-token, #087f73)" stroke="var(--color-ink, #17211f)" stroke-width="1.5"/>
  <rect x="40" y="170" width="220" height="48" rx="8" fill="var(--color-control, #66716d)" stroke="var(--color-ink, #17211f)" stroke-width="1.5"/>
  <text x="150" y="199" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="14" font-weight="700" fill="var(--color-ink-inverse, #ffffff)" text-anchor="middle">调一次：不挡后文</text>
  <rect x="320" y="170" width="260" height="48" rx="8" fill="var(--color-control, #66716d)" stroke="var(--color-ink, #17211f)" stroke-width="1.5"/>
  <text x="450" y="199" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="14" font-weight="700" fill="var(--color-ink-inverse, #ffffff)" text-anchor="middle">再调一次：挡住后文</text>
  <rect x="190" y="268" width="260" height="44" rx="8" fill="var(--color-token, #087f73)" stroke="var(--color-ink, #17211f)" stroke-width="1.5"/>
  <text x="320" y="295" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="14" font-weight="700" fill="var(--color-ink-inverse, #ffffff)" text-anchor="middle">拼回一批，交给下一层</text>
  <text x="30" y="40" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="14" font-weight="700" fill="var(--color-ink, #17211f)">一批里 3 条请求，只按条数切一刀</text>
  <text x="70" y="128" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="13" font-weight="400" fill="var(--color-ink, #17211f)">2 条 decode：这一步各 1 个 token</text>
  <text x="320" y="128" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="13" font-weight="400" fill="var(--color-ink, #17211f)">1 条 prefill：整段问题一起</text>
  <text x="600" y="198" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="13" font-weight="400" fill="var(--color-ink, #17211f)">同一个算子，训练侧也用它</text>
  <text x="30" y="330" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="12.5" font-weight="400" fill="var(--color-ink, #17211f)">默认后端不切：按批的状态挑分支，一次算完</text>
</svg>
