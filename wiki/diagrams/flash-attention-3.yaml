layout: figure
id: flash-attention-3
caption: FA3 的前向不看批的状态，只按条数把一批切成 decode 段和 prefill 段，同一个算子各调一次再拼回；默认后端不切，按批的状态挑分支一次算完
size: [900, 360]

texts:
  - { at: [30, 40], text: 一批里 3 条请求，只按条数切一刀, size: 14, strong: true }
  - { at: [70, 128], text: "2 条 decode：这一步各 1 个 token", size: 13 }
  - { at: [320, 128], text: "1 条 prefill：整段问题一起", size: 13 }
  - { at: [600, 198], text: 同一个算子，训练侧也用它, size: 13 }
  - { at: [30, 330], text: "默认后端不切：按批的状态挑分支，一次算完", size: 12.5 }

items:
  - { at: [70, 64], size: [36, 36], tone: token }
  - { at: [130, 64], size: [36, 36], tone: token }
  - { at: [40, 170], size: [220, 48], text: 调一次：不挡后文, tone: control }
  - { at: [320, 170], size: [260, 48], text: 再调一次：挡住后文, tone: control }
  - { at: [190, 268], size: [260, 44], text: 拼回一批，交给下一层, tone: token }

grids:
  - at: [320, 64]
    rows: 1
    cols: 8
    cell: [36, 36]
    gap: 3
    tone: token

dividers:
  - { from: [250, 44], to: [250, 140], sides: [decode 段, prefill 段] }

fans:
  - { from: [[88, 102], [148, 102]], to: [150, 166], tone: token }
  - { from: [[474, 102]], to: [450, 166], tone: token }
  - { from: [[150, 218], [450, 218]], to: [320, 264], tone: token }
