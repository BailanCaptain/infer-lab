  <text x="88" y="372" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="14.5" font-weight="700" fill="var(--color-ink, #17211f)">融合 pass 先到，四步换一个算子</text>
  <text x="88" y="390" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="12.5" font-weight="400" fill="var(--color-ink-muted, #5b6763)">内部 RS → norm → AG，按 512 一块流水</text>
  <text x="88" y="407" font-family="'JetBrains Mono',ui-monospace,monospace" font-size="12.5" font-weight="400" fill="var(--color-weight, #b87a00)">matmul_allreduce_add_rmsnorm</text>
  <rect x="456" y="336" width="408" height="96" rx="11" fill="var(--color-surface, #fbfaf6)" stroke="var(--color-ink-faint, #8a928f)" stroke-width="1.5"/>
  <rect x="468" y="368" width="32" height="32" rx="9" fill="var(--color-canvas, #f5f2ea)"/><g transform="translate(474.4 374.4) scale(0.8)" fill="none" stroke="var(--color-ink-faint, #8a928f)" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M5 19V9M12 19V5M19 19v-7M3 21h18"/></g>
  <text x="508" y="372" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="14.5" font-weight="700" fill="var(--color-ink, #17211f)">SP pass 再来，已匹配不到</text>
  <text x="508" y="390" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="12.5" font-weight="400" fill="var(--color-ink-muted, #5b6763)">all_reduce 节点没了，改图数为 0</text>
  <text x="508" y="407" font-family="'JetBrains Mono',ui-monospace,monospace" font-size="12.5" font-weight="400" fill="var(--color-ink-faint, #8a928f)">MiddleAllReduceRMSNormPattern</text>
  <path d="M240 332 L240 306" fill="none" stroke="var(--color-weight, #b87a00)" stroke-width="1.8"/>
  <path d="M240 306 l-5.5 11 l11 0 z" fill="var(--color-weight, #b87a00)"/>
  <path d="M660 306 L660 332" fill="none" stroke="var(--color-ink-faint, #8a928f)" stroke-width="1.8" stroke-dasharray="6 4"/>
  <path d="M660 332 l-5.5 -11 l11 0 z" fill="var(--color-ink-faint, #8a928f)"/>
  <path d="M38 96 l-8 0 L30 276 l8 0" fill="none" stroke="var(--color-weight, #b87a00)" stroke-width="1.4" opacity="0.75"/>
  <text x="44" y="191" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="12.5" font-weight="600" fill="var(--color-weight, #b87a00)">融合 pass</text>
  <path d="M108 188 l-8 0 L100 276 l8 0" fill="none" stroke="var(--color-kv, #4c65b6)" stroke-width="1.4" opacity="0.75"/>
  <text x="114" y="237" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="12.5" font-weight="600" fill="var(--color-kv, #4c65b6)">SP</text>
  <rect x="297.6" y="452.5" width="304.8" height="27" rx="13.5" fill="var(--color-accent, #e85b32)"/><text x="308.6" y="471" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="14" font-weight="700" fill="var(--color-ink-inverse, #ffffff)">两个都开 = 序列并行静默失效，无报错无告警</text>
  <text x="40" y="516" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="12.5" font-weight="400" fill="var(--color-ink-muted, #5b6763)">SP 的 pattern 只认「all_reduce → npu_add_rms_norm_bias」这后半截，正是融合 pattern 的一部分。同一次 AllReduce 只能按一种方式拆</text>
  <text x="40" y="534.5" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="12.5" font-weight="400" fill="var(--color-ink-muted, #5b6763)">：融合算子要在内部 AllGather 回全长，SP 要的恰恰是让 norm 及其下游停在 1/tp 长度上。二者不可叠加，上游让默认值站在 SP 这边。</text>
  <text x="40" y="586" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="12.5" font-weight="600" fill="var(--color-ink, #17211f)">还有一道门槛：融合 pass 的 is_applicable_for_range 要求 compile_range.start &gt; 512，decode 的小 batch 一处都改不到。</text>
</svg>
