  <rect x="313" y="452.5" width="274" height="27" rx="13.5" fill="var(--color-accent, #e85b32)"/><text x="324" y="471" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="14" font-weight="700" fill="var(--color-ink-inverse, #ffffff)">注册顺序决定重叠节点先由哪条规则改写</text>
  <text x="40" y="516" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="12.5" font-weight="400" fill="var(--color-ink-muted, #5b6763)">两条规则都包含 All-Reduce 与残差归一化，不能重复改写同一批节点。所引 SP pattern 在分片上做 norm 后也立即 All-Gather；冲突来自重叠</text>
  <text x="40" y="534.5" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="12.5" font-weight="400" fill="var(--color-ink-muted, #5b6763)">的改图目标，不能概括为通信目标相反。官方参数表因此建议默认关闭这条融合。</text>
  <text x="40" y="586" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="12.5" font-weight="600" fill="var(--color-ink, #17211f)">融合 pass 仅适用于 compile_range.start &gt; 512；这是编译区间条件，不是按 prefill/decode 划分收益。</text>
</svg>
