<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 560" width="900" height="560" role="img" aria-label="v0.23.0 中 fuse_allreduce_rms 融合 pass 与序列并行 SP pass 的子图重叠冲突及 v0.30.0/main 移除演化" font-family="var(--font-sans)">
  <title>v0.23.0 中 GraphFusionPassManager 的子图冲突：融合 pass 排在 SP pass 之前，命中 compile_range.start &gt; 512 的四步子图后替换为单算子，后续 SP 不再匹配已替换处；v0.25.1rc1（PR #12119）整体删除，v0.30.0 与 main 严检报错。</title>
  <desc>Subgraph overlap between MatmulAllReduceAddRMSNormPass and MiddleAllReduceRMSNormPattern in v0.23.0, execution priority in GraphFusionPassManager, and removal in v0.30.0/main.</desc>

  <text x="16" y="28" font-size="16" font-weight="700" fill="#17211f">v0.23.0 融合 pass 与序列并行（SP）的子图重叠冲突</text>
  <text x="16" y="48" font-size="13.5" fill="#66716d">torch.compile 拿到的普通残差四步原始子图：两条规则覆盖同一批通信与归一化节点，不能重复改写</text>

  <!-- Left brackets showing exact overlap -->
  <path d="M90 74 h-8 V256 h8" fill="none" stroke="#087f73" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="16" y="160" font-size="13.5" font-weight="700" fill="#065f56">融合 pass</text>
  <text x="16" y="179" font-size="13" fill="#065f56">吃掉 4 步</text>

  <path d="M162 122 h-8 V256 h8" fill="none" stroke="#4c65b6" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="98" y="185" font-size="13.5" font-weight="700" fill="#3a4f93">SP 目标</text>
  <text x="98" y="204" font-size="13" fill="#3a4f93">后 3 步</text>

  <!-- 4 contiguous original subgraph bands -->
  <rect x="172" y="72" width="712" height="42" rx="6" fill="#e8edff" stroke="#4c65b6" stroke-width="1.3"/>
  <text x="188" y="98" font-size="14" font-weight="700" fill="#17211f">1. 本 rank 矩阵乘（部分和）</text>
  <text x="868" y="98" font-size="13.5" fill="#3a4f93" font-family="var(--font-mono)" text-anchor="end">unquantized_gemm</text>

  <rect x="172" y="120" width="712" height="42" rx="6" fill="#f7e7f2" stroke="#9a4b86" stroke-width="1.3"/>
  <text x="188" y="146" font-size="14" font-weight="700" fill="#17211f">2. TP 归约合齐完整 hidden</text>
  <text x="868" y="146" font-size="13.5" fill="#7a3a6a" font-family="var(--font-mono)" text-anchor="end">tensor_model_parallel_all_reduce</text>

  <rect x="172" y="168" width="712" height="42" rx="6" fill="#ece9df" stroke="#b8bcb5" stroke-width="1.3"/>
  <text x="188" y="194" font-size="14" font-weight="700" fill="#17211f">3. 对齐残差张量</text>
  <text x="868" y="194" font-size="13.5" fill="#4d5652" font-family="var(--font-mono)" text-anchor="end">maybe_chunk_residual</text>

  <rect x="172" y="216" width="712" height="42" rx="6" fill="#fff4cf" stroke="#c78300" stroke-width="1.3"/>
  <text x="188" y="242" font-size="14" font-weight="700" fill="#17211f">4. 加残差 + RMSNorm</text>
  <text x="868" y="242" font-size="13.5" fill="#936300" font-family="var(--font-mono)" text-anchor="end">npu_add_rms_norm_bias</text>

  <!-- PassManager order divider -->
  <line x1="16" y1="286" x2="884" y2="286" stroke="#b8bcb5" stroke-width="1.2" stroke-dasharray="6 4"/>
  <rect x="150" y="272" width="600" height="28" rx="14" fill="#fbfaf6" stroke="#b8bcb5" stroke-width="1.2"/>
  <text x="450" y="291" font-size="13.5" font-weight="700" fill="#17211f" text-anchor="middle">GraphFusionPassManager 按 self.passes 顺序执行：融合 pass 排在 SP 之前</text>

  <!-- Arrows down to outcome cards -->
  <path d="M228 300 V318 m-5-5 l5 5 5-5" fill="none" stroke="#087f73" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M672 300 V318 m-5-5 l5 5 5-5" fill="none" stroke="#c78300" stroke-width="1.7" stroke-dasharray="4 3" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Outcome cards -->
  <rect x="16" y="322" width="424" height="114" rx="8" fill="#ddf4ef" stroke="#087f73" stroke-width="1.4"/>
  <text x="30" y="348" font-size="14.5" font-weight="700" fill="#065f56">① 融合 pass 抢先命中（start &gt; 512）</text>
  <text x="30" y="372" font-size="13.5" fill="#4d5652">• 四步换单算子：ReduceScatter → norm → AG</text>
  <text x="30" y="395" font-size="13" fill="#065f56" font-family="var(--font-mono)">matmul_allreduce_add_rmsnorm</text>
  <text x="30" y="418" font-size="13.5" fill="#66716d">区间条件仅看 start &gt; 512，并非按 prefill / decode 区分</text>

  <rect x="460" y="322" width="424" height="114" rx="8" fill="#fff4cf" stroke="#c78300" stroke-width="1.4"/>
  <text x="474" y="348" font-size="14.5" font-weight="700" fill="#936300">② 后续 SP pass 不再匹配已被替换的子图</text>
  <text x="474" y="372" font-size="13.5" fill="#4d5652">• 原 All-Reduce 节点已被移除，此处不再触发 SP 改写</text>
  <text x="474" y="395" font-size="13" fill="#936300" font-family="var(--font-mono)">MiddleAllReduceRMSNormPattern</text>
  <text x="474" y="418" font-size="13.5" fill="#66716d">其余子图与 ≤ 512 区间仍须分别检查；官方因此默认关闭</text>

  <!-- Bottom removal / evolution banner -->
  <rect x="16" y="452" width="868" height="92" rx="8" fill="#fff0e9" stroke="#b54237" stroke-width="1.3"/>
  <text x="30" y="476" font-size="14.5" font-weight="700" fill="#8f3229">版本演化：v0.25.1rc1（PR #12119）整体删除；v0.30.0 (c09d3e20) / main (8d6180e2) 严检报错</text>
  <text x="30" y="500" font-size="13.5" fill="#4d5652">• v0.26.0rc 因 **kwargs 静默吞掉旧键；v0.30.0 / main 启用 extra="forbid"，vllm_omni 顶层豁免不放过嵌套子键</text>
  <text x="30" y="524" font-size="13.5" fill="#4d5652">• Ascend 侧旧 SP pass 也已撤走改由上游 vLLM 承接；main 在 enable_sp 且硬件支持时新增 MatmulReduceScatterFusionPass</text>
</svg>
