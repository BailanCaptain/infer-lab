notes:
  - at: [40, 516]
    text: "SP 的 pattern 只认「all_reduce → npu_add_rms_norm_bias」这后半截，正是融合 pattern 的一部分。同一次 AllReduce 只能按一种方式拆：融合算子要在内部 AllGather 回全长，SP 要的恰恰是让 norm 及其下游停在 1/tp 长度上。二者不可叠加，上游让默认值站在 SP 这边。"
    size: 12.5
    width: 820
  - at: [40, 586]
    text: "还有一道门槛：融合 pass 的 is_applicable_for_range 要求 compile_range.start > 512，decode 的小 batch 一处都改不到。"
    size: 12.5
    width: 820
    strong: true

