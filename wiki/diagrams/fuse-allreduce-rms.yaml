notes:
  - at: [40, 516]
    text: "两条规则都包含 All-Reduce 与残差归一化，不能重复改写同一批节点。所引 SP pattern 在分片上做 norm 后也立即 All-Gather；冲突来自重叠的改图目标，不能概括为通信目标相反。官方参数表因此建议默认关闭这条融合。"
    size: 12.5
    width: 820
  - at: [40, 586]
    text: "融合 pass 仅适用于 compile_range.start > 512；这是编译区间条件，不是按 prefill/decode 划分收益。"
    size: 12.5
    width: 820
    strong: true

