<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 650" width="900" height="650" role="img" aria-label="GLM 门控前馈的逻辑分支：gate 截断后经 SiLU，与截断后的 up 分支逐元素相乘，再经 down 投影。H 为隐藏宽度、F 为中间宽度；两投影可以合并执行">
  <title>GLM 门控前馈的逻辑分支：gate 截断后经 SiLU，与截断后的 up 分支逐元素相乘，再经 down 投影。H 为隐藏宽度、F 为中间宽度；两投影可以合并执行</title>
