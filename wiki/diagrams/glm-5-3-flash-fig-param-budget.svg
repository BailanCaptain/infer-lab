<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 440" width="900" height="440" role="img" aria-label="GLM-5.3-Flash 3133 亿主干参数占比、174 亿激活参数构成与文件到显存精度升降流图" font-family="var(--font-sans)">
  <title>GLM-5.3-Flash 主干总参数（3,133 亿）vs 单 token 激活参数（174 亿）与加载精度流向</title>
  <desc>Proportional breakdown of GLM-5.3-Flash 313.3B backbone parameters vs 17.4B per-token active parameters, followed by a storage-dtype to loaded-HBM-dtype promotion diagram</desc>
  <defs>
    <marker id="gf-arr-t" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="#087f73"/>
    </marker>
    <marker id="gf-arr-b" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="#4c65b6"/>
    </marker>
    <marker id="gf-arr-r" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="#b54237"/>
    </marker>
  </defs>

  <text x="14" y="26" font-size="16" font-weight="700" fill="#17211f">① 主干总参数（3,133 亿）vs 单 token 激活参数（174 亿）：为何不能按 8/288 估算计算量</text>

  <!-- Bar 1: Total 3133B -->
  <text x="14" y="54" font-size="14" font-weight="700" fill="#17211f">主干总参数：约 3,133 亿（含 MTP 74.3 亿 + 视觉 5.6 亿合计约 3,213 亿）</text>
  <rect x="14" y="64" width="846" height="40" rx="5" fill="#fff4cf" stroke="#c78300" stroke-width="1.4"/>
  <text x="437" y="89" text-anchor="middle" font-size="14.5" font-weight="700" fill="#936300">路由专家（42 层 × 288 专家）：3,044.1 亿（占 97.2%）→ EP16 存在的根本理由</text>
  <rect x="860" y="64" width="24" height="40" rx="4" fill="#4c65b6" stroke="#3a4f93" stroke-width="1.2"/>
  <text x="884" y="122" text-anchor="end" font-size="13.5" fill="#3a4f93">▲ 其余全部部件（KDA 46.8 + MLA 12.9 + 词表 12.7 + 共享 10.6 + 稠密 4.5 + 其他 1.7）合计仅 89.2 亿（2.8%）</text>

  <!-- Bar 2: Active 174B -->
  <text x="14" y="150" font-size="14" font-weight="700" fill="#17211f">单 token 激活参数：主干约 174 亿（扣仅查表的 embedding 约 167 亿）</text>
  <rect x="14" y="160" width="446" height="40" rx="5" fill="#e8edff" stroke="#4c65b6" stroke-width="1.4"/>
  <text x="237" y="185" text-anchor="middle" font-size="14" font-weight="700" fill="#3a4f93">非路由专家全算部分：89.2 亿（占 51.3%）</text>
  <rect x="460" y="160" width="424" height="40" rx="5" fill="#ddf4ef" stroke="#087f73" stroke-width="1.4"/>
  <text x="672" y="185" text-anchor="middle" font-size="14" font-weight="700" fill="#065f56">每层选中 8 个路由专家：84.6 亿（占 48.7%）</text>
  <text x="14" y="218" font-size="13.5" font-weight="700" fill="#8f3229">显存账看路由专家（97.2%），计算账一半以上在非专家全算层——两本账必须分开算</text>

  <line x1="14" y1="234" x2="886" y2="234" stroke="#b8bcb5" stroke-width="1.4" stroke-dasharray="6 5"/>

  <!-- ZONE 2: Storage Dtype -> Loaded HBM Dtype Promotion Flow -->
  <text x="14" y="260" font-size="16" font-weight="700" fill="#17211f">② 磁盘存储精度 ≠ 显存驻留精度：加载后哪些关键小模块会强制升为 FP32</text>

  <!-- Column headers -->
  <text x="14" y="284" font-size="13.5" font-weight="700" fill="#4d5652">权重文件存储（HF FP8 / W8A8 两版快照）</text>
  <text x="488" y="284" font-size="13.5" font-weight="700" fill="#17211f">加载到 NPU 后的实际驻留精度</text>

  <!-- Row 1: MLP + MLA 4 projections -> INT8 (or BF16 on 9e55) -->
  <rect x="14" y="294" width="400" height="40" rx="5" fill="#ddf4ef" stroke="#087f73" stroke-width="1.3"/>
  <text x="20" y="319" font-size="12" fill="#065f56">MLP 通路 + MLA 4 大投影（3121f187 量化，9e55 留 FLOAT）</text>
  <path d="M 414 314 L 480 314" fill="none" stroke="#087f73" stroke-width="1.8" marker-end="url(#gf-arr-t)"/>
  <rect x="486" y="294" width="398" height="40" rx="5" fill="#ddf4ef" stroke="#087f73" stroke-width="1.5"/>
  <text x="492" y="319" font-size="12" font-weight="700" fill="#065f56">INT8 通道缩放主体（9e55 的 MLA 4 投影多占 +19 MiB/层）</text>

  <!-- Row 2: Main BF16 parts -> BF16 -->
  <rect x="14" y="342" width="400" height="40" rx="5" fill="#e8edff" stroke="#4c65b6" stroke-width="1.3"/>
  <text x="26" y="367" font-size="13.5" fill="#3a4f93">embedding / lm_head / KDA 投影与门 / kv_b_proj（BF16）</text>
  <path d="M 414 362 L 480 362" fill="none" stroke="#4c65b6" stroke-width="1.8" marker-end="url(#gf-arr-b)"/>
  <rect x="486" y="342" width="398" height="40" rx="5" fill="#e8edff" stroke="#4c65b6" stroke-width="1.5"/>
  <text x="500" y="367" font-size="13.5" font-weight="700" fill="#3a4f93">BF16 原精度常驻（含各处 Norm 与索引器 Q 投影）</text>

  <!-- Row 3: BF16 in file -> PROMOTED to FP32! -->
  <rect x="14" y="390" width="400" height="40" rx="5" fill="#fff4cf" stroke="#c78300" stroke-width="1.3"/>
  <text x="20" y="415" font-size="12" fill="#936300">router / mHC 混合矩阵 / KDA 短卷积 / 索引器 K（文件 BF16）</text>
  <path d="M 414 410 L 480 410" fill="none" stroke="#b54237" stroke-width="2" marker-end="url(#gf-arr-r)"/>
  <text x="447" y="402" text-anchor="middle" font-size="13.5" font-weight="700" fill="#8f3229">升精度</text>
  <rect x="486" y="390" width="398" height="40" rx="5" fill="#fff0e9" stroke="#b54237" stroke-width="1.5"/>
  <text x="500" y="415" font-size="13.5" font-weight="700" fill="#8f3229">强制 FP32（索引器 K 与压池首跑另建 54 MiB/卡副本）</text>
</svg>
