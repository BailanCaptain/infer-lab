<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 440" width="900" height="440" role="img" aria-label="GLM-5.3-Flash 从例外 B 绑定基线到 v0.30.0 与 main 四条横轨演进矩阵图" font-family="var(--font-sans)">
  <title>GLM-5.3-Flash 三代部署食谱四轨演进矩阵（db701c1f → v0.30.0 → main）</title>
  <desc>4-lane horizontal progression matrix comparing frozen Exception-B baseline db701c1f, v0.30.0 c09d3e20, and main 8d6180e2 across model/cache, projections, runner/execution, and hardware/PD topologies</desc>
  <defs>
    <marker id="g2n-arr-t" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="#087f73"/>
    </marker>
    <marker id="g2n-arr-b" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="#4c65b6"/>
    </marker>
  </defs>

  <text x="14" y="26" font-size="16" font-weight="700" fill="#17211f">GLM-5.3-Flash 三代食谱横轨演进：教学算例严格守旧钉点，现网按新食谱重算</text>

  <!-- Column Headers -->
  <rect x="106" y="42" width="246" height="34" rx="5" fill="#fff4cf" stroke="#c78300" stroke-width="1.4"/>
  <text x="229" y="64" text-anchor="middle" font-size="14" font-weight="700" fill="#936300">例外 B 绑定基线（db701c1f）</text>

  <rect x="372" y="42" width="246" height="34" rx="5" fill="#ddf4ef" stroke="#087f73" stroke-width="1.4"/>
  <text x="495" y="64" text-anchor="middle" font-size="14" font-weight="700" fill="#065f56">v0.30.0 活跃食谱（c09d3e20）</text>

  <rect x="638" y="42" width="248" height="34" rx="5" fill="#e8edff" stroke="#4c65b6" stroke-width="1.4"/>
  <text x="762" y="64" text-anchor="middle" font-size="14" font-weight="700" fill="#3a4f93">main 活跃食谱（8d6180e2）</text>

  <!-- Lane 1: Model & Cache -->
  <rect x="14" y="88" width="84" height="62" rx="5" fill="#ece9df" stroke="#b8bcb5" stroke-width="1.2"/>
  <text x="56" y="114" text-anchor="middle" font-size="13.5" font-weight="700" fill="#17211f">模型目录</text>
  <text x="56" y="135" text-anchor="middle" font-size="13" fill="#4d5652">与缓存组</text>

  <rect x="106" y="88" width="246" height="62" rx="5" fill="#ffffff" stroke="#c78300" stroke-width="1.3"/>
  <text x="116" y="113" font-size="13.5" font-weight="700" fill="#936300">单文件 glm5_next.py + 补丁</text>
  <text x="116" y="136" font-size="12.5" fill="#4d5652">每块 640 token · 5 组 KV · 3,855 块</text>
  <path d="M 352 119 L 368 119" fill="none" stroke="#087f73" stroke-width="1.7" marker-end="url(#g2n-arr-t)"/>

  <rect x="372" y="88" width="246" height="62" rx="5" fill="#ddf4ef" stroke="#087f73" stroke-width="1.3"/>
  <text x="382" y="113" font-size="13.5" font-weight="700" fill="#065f56">模块化 models/glm5next/</text>
  <text x="382" y="136" font-size="12.5" fill="#4d5652">尾状态改每请求 1 格环形缓冲</text>
  <path d="M 618 119 L 634 119" fill="none" stroke="#4c65b6" stroke-width="1.7" marker-end="url(#g2n-arr-b)"/>

  <rect x="638" y="88" width="248" height="62" rx="5" fill="#e8edff" stroke="#4c65b6" stroke-width="1.3"/>
  <text x="648" y="113" font-size="13.5" font-weight="700" fill="#3a4f93">新增 recoverssm_* 恢复</text>
  <text x="648" y="136" font-size="12.5" fill="#4d5652">支持 BF16 SSM 状态缓存选项</text>

  <!-- Lane 2: KDA / MLA Projections -->
  <rect x="14" y="160" width="84" height="62" rx="5" fill="#ece9df" stroke="#b8bcb5" stroke-width="1.2"/>
  <text x="56" y="186" text-anchor="middle" font-size="13.5" font-weight="700" fill="#17211f">KDA / MLA</text>
  <text x="56" y="207" text-anchor="middle" font-size="13" fill="#4d5652">投影融合</text>

  <rect x="106" y="160" width="246" height="62" rx="5" fill="#ffffff" stroke="#c78300" stroke-width="1.3"/>
  <text x="116" y="185" font-size="13.5" font-weight="700" fill="#936300">KDA 六路输入独立投影</text>
  <text x="116" y="208" font-size="12.5" fill="#4d5652">旧镜像按量化描述分派 MLA</text>
  <path d="M 352 191 L 368 191" fill="none" stroke="#087f73" stroke-width="1.7" marker-end="url(#g2n-arr-t)"/>

  <rect x="372" y="160" width="246" height="62" rx="5" fill="#ddf4ef" stroke="#087f73" stroke-width="1.3"/>
  <text x="382" y="185" font-size="13.5" font-weight="700" fill="#065f56">融合 in_proj_qkvbfg_a</text>
  <text x="382" y="208" font-size="12.5" fill="#4d5652">MLA kv_b_proj 显式保 BF16</text>
  <path d="M 618 191 L 634 191" fill="none" stroke="#4c65b6" stroke-width="1.7" marker-end="url(#g2n-arr-b)"/>

  <rect x="638" y="160" width="248" height="62" rx="5" fill="#e8edff" stroke="#4c65b6" stroke-width="1.3"/>
  <text x="648" y="185" font-size="13.5" font-weight="700" fill="#3a4f93">KDAInputProjectionTP</text>
  <text x="648" y="208" font-size="12.5" fill="#4d5652">支持细粒度 qkv_iproj TP 切分</text>

  <!-- Lane 3: Model Runner & Graph -->
  <rect x="14" y="232" width="84" height="62" rx="5" fill="#ece9df" stroke="#b8bcb5" stroke-width="1.2"/>
  <text x="56" y="258" text-anchor="middle" font-size="13.5" font-weight="700" fill="#17211f">执行引擎</text>
  <text x="56" y="279" text-anchor="middle" font-size="13" fill="#4d5652">与图模式</text>

  <rect x="106" y="232" width="246" height="62" rx="5" fill="#ffffff" stroke="#c78300" stroke-width="1.3"/>
  <text x="116" y="257" font-size="13.5" font-weight="700" fill="#936300">Model Runner V1</text>
  <text x="116" y="280" font-size="12.5" fill="#4d5652">FULL_DECODE_ONLY · 草拟 eager</text>
  <path d="M 352 263 L 368 263" fill="none" stroke="#087f73" stroke-width="1.7" marker-end="url(#g2n-arr-t)"/>

  <rect x="372" y="232" width="246" height="62" rx="5" fill="#ddf4ef" stroke="#087f73" stroke-width="1.3"/>
  <text x="382" y="257" font-size="12" font-weight="700" fill="#065f56">VLLM_USE_V2_MODEL_RUNNER=0</text>
  <text x="382" y="280" font-size="12.5" fill="#4d5652">默认 V1 · 新增 prefetch + 超时变量</text>
  <path d="M 618 263 L 634 263" fill="none" stroke="#4c65b6" stroke-width="1.7" marker-end="url(#g2n-arr-b)"/>

  <rect x="638" y="232" width="248" height="62" rx="5" fill="#e8edff" stroke="#4c65b6" stroke-width="1.5"/>
  <text x="648" y="257" font-size="12" font-weight="700" fill="#3a4f93">VLLM_USE_V2_MODEL_RUNNER=1</text>
  <text x="648" y="280" font-size="12.5" fill="#4d5652">全量切 MRV2 · A2/A3/950DT 统一</text>

  <!-- Lane 4: Hardware & PD/Pool -->
  <rect x="14" y="304" width="84" height="66" rx="5" fill="#ece9df" stroke="#b8bcb5" stroke-width="1.2"/>
  <text x="56" y="332" text-anchor="middle" font-size="13.5" font-weight="700" fill="#17211f">硬件形态</text>
  <text x="56" y="353" text-anchor="middle" font-size="13" fill="#4d5652">与 PD / 池</text>

  <rect x="106" y="304" width="246" height="66" rx="5" fill="#ffffff" stroke="#c78300" stroke-width="1.3"/>
  <text x="116" y="329" font-size="13.5" font-weight="700" fill="#936300">仅 2×A2×8 混部 W8A8</text>
  <text x="116" y="352" font-size="12.5" fill="#4d5652">TP8 / DP2 / EP16 · MC2 门槛 128</text>
  <path d="M 352 337 L 368 337" fill="none" stroke="#087f73" stroke-width="1.7" marker-end="url(#g2n-arr-t)"/>

  <rect x="372" y="304" width="246" height="66" rx="5" fill="#ddf4ef" stroke="#087f73" stroke-width="1.3"/>
  <text x="382" y="329" font-size="13.5" font-weight="700" fill="#065f56">扩至 A3 / 950DT + W8A8C8</text>
  <text x="382" y="352" font-size="12.5" fill="#4d5652">1P1D PD + KV Pool（关 layerwise）</text>
  <path d="M 618 337 L 634 337" fill="none" stroke="#4c65b6" stroke-width="1.7" marker-end="url(#g2n-arr-b)"/>

  <rect x="638" y="304" width="248" height="66" rx="5" fill="#e8edff" stroke="#4c65b6" stroke-width="1.3"/>
  <text x="648" y="329" font-size="13.5" font-weight="700" fill="#3a4f93">A3 PD 升 PCP8/TP1</text>
  <text x="648" y="352" font-size="12.5" fill="#4d5652">启用 fused_mc2:2 与 EPLB</text>

  <!-- Bottom rule bar -->
  <rect x="14" y="384" width="872" height="44" rx="6" fill="#fff0e9" stroke="#b54237" stroke-width="1.3"/>
  <text x="450" y="411" text-anchor="middle" font-size="14" font-weight="700" fill="#8f3229">严禁跨版本混算：v0.30.0 / main 缓存规格与 W8A8C8 已变，现网容量须按对应版本的启动 profile 实测重算</text>
</svg>
