<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 440" width="900" height="440" role="img" aria-label="GLM-5.3-Flash 从例外 B 历史绑定镜像到 v0.30.0 与 main 活跃食谱的三代增量演进图" font-family="var(--font-sans)">
  <title>GLM-5.3-Flash 活跃食谱三代增量演进（db701c1f 绑定算例 vs v0.30.0 vs main）</title>
  <desc>Evolution of GLM-5.3-Flash Ascend recipes from frozen Exception B baseline db701c1f to v0.30.0 c09d3e20 and main 8d6180e2</desc>
  <defs>
    <marker id="g2n-arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="#4d5652"/>
    </marker>
  </defs>

  <text x="16" y="28" font-size="16" font-weight="700" fill="#17211f">GLM-5.3-Flash 三代食谱对照：教学算例严格守旧钉点，现网部署按新食谱重算</text>

  <!-- Col 1: Frozen Exception B -->
  <rect x="16" y="48" width="276" height="314" rx="8" fill="#fff4cf" stroke="#c78300" stroke-width="1.5"/>
  <text x="154" y="76" text-anchor="middle" font-size="15" font-weight="700" fill="#936300">例外 B 绑定基线（db701c1f）</text>
  <text x="154" y="98" text-anchor="middle" font-size="13.5" fill="#936300">全站冻结 3D 与 R1 算例唯一标尺</text>
  <line x1="30" y1="112" x2="278" y2="112" stroke="#c78300" stroke-width="1" opacity="0.5"/>
  <text x="30" y="138" font-size="13.5" font-weight="700" fill="#17211f">模型与缓存</text>
  <text x="30" y="160" font-size="13.5" fill="#4d5652">• 单文件 glm5_next.py + 补丁</text>
  <text x="30" y="182" font-size="13.5" fill="#4d5652">• 640 块 · 5 组 KV · 3,855 块算例</text>
  <text x="30" y="212" font-size="13.5" font-weight="700" fill="#17211f">投影与执行</text>
  <text x="30" y="234" font-size="13.5" fill="#4d5652">• KDA 六路独立投影</text>
  <text x="30" y="256" font-size="13.5" fill="#4d5652">• Model Runner V1 + FULL_DECODE</text>
  <text x="30" y="286" font-size="13.5" font-weight="700" fill="#17211f">覆盖形态</text>
  <text x="30" y="308" font-size="13.5" fill="#4d5652">• 仅 2×A2×8 TP8/DP2/EP16 混部</text>
  <text x="30" y="330" font-size="13.5" fill="#4d5652">• W8A8 · MC2 门槛 128</text>

  <line x1="292" y1="205" x2="310" y2="205" stroke="#4d5652" stroke-width="1.6" marker-end="url(#g2n-arr)"/>

  <!-- Col 2: v0.30.0 Active -->
  <rect x="312" y="48" width="276" height="314" rx="8" fill="#ddf4ef" stroke="#087f73" stroke-width="1.5"/>
  <text x="450" y="76" text-anchor="middle" font-size="15" font-weight="700" fill="#065f56">v0.30.0 活跃食谱（c09d3e20）</text>
  <text x="450" y="98" text-anchor="middle" font-size="13.5" fill="#065f56">模块化重构 + 多代硬件 + PD/Pool</text>
  <line x1="326" y1="112" x2="574" y2="112" stroke="#087f73" stroke-width="1" opacity="0.5"/>
  <text x="326" y="138" font-size="13.5" font-weight="700" fill="#17211f">模型与缓存</text>
  <text x="326" y="160" font-size="13.5" fill="#4d5652">• 拆入 models/glm5next/ 目录</text>
  <text x="326" y="182" font-size="13.5" fill="#4d5652">• 尾状态改 1 格环形缓冲规格</text>
  <text x="326" y="212" font-size="13.5" font-weight="700" fill="#17211f">投影与执行</text>
  <text x="326" y="234" font-size="13.5" fill="#4d5652">• KDA 融合 in_proj_qkvbfg_a</text>
  <text x="326" y="256" font-size="13.5" fill="#4d5652">• 显式设 V2_MODEL_RUNNER=0</text>
  <text x="326" y="286" font-size="13.5" font-weight="700" fill="#17211f">覆盖形态</text>
  <text x="326" y="308" font-size="13.5" fill="#065f56">• 扩至 A3 / 950DT + W8A8C8 KV</text>
  <text x="326" y="330" font-size="13.5" fill="#065f56">• 新增 1P1D PD 与 DDR KV Pool</text>
  <text x="326" y="350" font-size="13.5" fill="#66716d">　（强制 use_layerwise=false）</text>

  <line x1="588" y1="205" x2="606" y2="205" stroke="#4d5652" stroke-width="1.6" marker-end="url(#g2n-arr)"/>

  <!-- Col 3: main Active -->
  <rect x="608" y="48" width="276" height="314" rx="8" fill="#e8edff" stroke="#4c65b6" stroke-width="1.5"/>
  <text x="746" y="76" text-anchor="middle" font-size="15" font-weight="700" fill="#3a4f93">main 活跃食谱（8d6180e2）</text>
  <text x="746" y="98" text-anchor="middle" font-size="13.5" fill="#3a4f93">全量收敛 MRV2 + 细粒度并行</text>
  <line x1="622" y1="112" x2="870" y2="112" stroke="#4c65b6" stroke-width="1" opacity="0.5"/>
  <text x="622" y="138" font-size="13.5" font-weight="700" fill="#17211f">模型与缓存</text>
  <text x="622" y="160" font-size="13.5" fill="#4d5652">• 新增 recoverssm_* 恢复支持</text>
  <text x="622" y="182" font-size="13.5" fill="#4d5652">• 支持 BF16 SSM 状态缓存选项</text>
  <text x="622" y="212" font-size="13.5" font-weight="700" fill="#17211f">投影与执行</text>
  <text x="622" y="234" font-size="13.5" fill="#3a4f93">• KDAInputProjectionTP 细粒度切分</text>
  <text x="622" y="256" font-size="13.5" font-weight="700" fill="#3a4f93">• 全量切至 V2_MODEL_RUNNER=1</text>
  <text x="622" y="286" font-size="13.5" font-weight="700" fill="#17211f">覆盖形态</text>
  <text x="622" y="308" font-size="13.5" fill="#4d5652">• A3 PD Prefill 升 PCP8/TP1</text>
  <text x="622" y="330" font-size="13.5" fill="#4d5652">• 开启 fused_mc2:2 与 EPLB</text>
  <text x="622" y="350" font-size="13.5" fill="#66716d">• A2 / A3 / 950DT 统一 MRV2</text>

  <!-- Bottom rule bar -->
  <rect x="16" y="378" width="868" height="46" rx="7" fill="#fff0e9" stroke="#b54237" stroke-width="1.3"/>
  <text x="450" y="406" text-anchor="middle" font-size="14" font-weight="700" fill="#8f3229">严禁跨版本混算：v0.30.0 / main 缓存规格与 W8A8C8 已变，现网容量须按对应版本的启动 profile 实测重算</text>
</svg>
