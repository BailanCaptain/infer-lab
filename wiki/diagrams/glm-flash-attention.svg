<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 720" width="900" height="720" role="img" aria-label="两类 attention 利用历史的方式。上半图是 KDA 的一步：旧状态按遗忘门衰减，再写入当前 token；下半图是稀疏 MLA 的一步：索引器给自己缓存里的池 K 打分（每 4 个位置一个池），选中的池落到下面对应的潜向量上，未满一池的尾巴总会读。示意只画 1 个池的预算，头数与维度在正文">
