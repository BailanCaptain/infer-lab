<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 330" width="900" height="330" role="img" aria-label="一张卡的显存怎么分给权重、临时数据和 KV cache。权重按算例的 21 GiB 取整；HBM 总量 64 GiB、激活峰值与非 torch 占用 3.4 GiB 都是教学假设，实机要看启动日志。decode 图是切完 KV 之后才录的，它的显存从预算之外的 9.6 GiB 里出。">
  <title>一张卡的显存怎么分给权重、临时数据和 KV cache。权重按算例的 21 GiB 取整；HBM 总量 64 GiB、激活峰值与非 torch 占用 3.4 GiB 都是教学假设，实机要看启动日志。decode 图是切完 KV 之后才录的，它的显存从预算之外的 9.6 GiB 里出。</title>
  <defs><pattern id="glm-two-node-card-budget-hatch" width="7" height="7" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="7" height="7" fill="var(--color-surface-sunken, #ece9df)"/><line x1="0" y1="0" x2="0" y2="7" stroke="var(--color-ink-muted, #66716d)" stroke-width="2"/></pattern></defs>
  <rect x="60" y="120" width="252" height="44" rx="4" fill="var(--color-weight, #c78300)" stroke="var(--color-ink, #17211f)" stroke-width="1.3"/>
  <text x="76" y="147" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="13" font-weight="700" fill="var(--color-ink-inverse, #ffffff)">权重 ≈21 GiB（取整）</text>
  <rect x="312" y="120" width="40.8" height="44" rx="4" fill="var(--color-control, #66716d)" stroke="var(--color-ink, #17211f)" stroke-width="1.3"/>
  <rect x="352.8" y="120" width="360" height="44" rx="4" fill="var(--color-kv, #4c65b6)" stroke="var(--color-ink, #17211f)" stroke-width="1.3"/>
  <text x="368.8" y="147" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="13" font-weight="700" fill="var(--color-ink-inverse, #ffffff)">KV cache 30.0 GiB</text>
  <rect x="712.8" y="120" width="115.2" height="44" rx="4" fill="url(#glm-two-node-card-budget-hatch)" stroke="var(--color-ink-muted, #66716d)" stroke-width="1.3"/>
  <rect x="60" y="114" width="768" height="56" rx="7" fill="none" stroke="var(--color-kv, #4c65b6)" stroke-width="2.2"/>
  <text x="828" y="104" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="13" font-weight="700" fill="var(--color-kv, #4c65b6)" text-anchor="end">卡上 HBM 64 GiB（假设）</text>
  <path d="M312 172 v8 h41 v-8" fill="none" stroke="var(--color-ink, #17211f)" stroke-width="1.5"/>
  <text x="332.5" y="202" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="14" font-weight="700" fill="var(--color-ink, #17211f)" text-anchor="middle">激活峰值 + 非 torch 3.4</text>
  <path d="M713 172 v8 h115 v-8" fill="none" stroke="var(--color-ink, #17211f)" stroke-width="1.5"/>
  <text x="770.5" y="202" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="14" font-weight="700" fill="var(--color-ink, #17211f)" text-anchor="middle">预算外 9.6</text>
  <path d="M353 210 v8 h360 v-8" fill="none" stroke="var(--color-ink, #17211f)" stroke-width="1.5"/>
  <text x="533" y="240" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="14" font-weight="700" fill="var(--color-ink, #17211f)" text-anchor="middle">3,855 个 block id · 每块 640 token · 7.969 MiB</text>
  <text x="450" y="26" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="13.5" font-weight="700" fill="var(--color-ink, #17211f)" text-anchor="middle">一张卡的 64 GiB 怎么分</text>
  <text x="60" y="286" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="13.5" font-weight="400" fill="var(--color-ink-muted, #66716d)" font-style="italic">预算 = 64 × 0.85 = 54.4 GiB</text>
  <text x="60" y="308" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="13.5" font-weight="400" fill="var(--color-ink-muted, #66716d)" font-style="italic">斜纹段在预算之外，decode 图从这里出</text>
</svg>
