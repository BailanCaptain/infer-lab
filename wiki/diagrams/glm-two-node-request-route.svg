<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 760" width="880" height="760" role="img" aria-label="请求先由前端选定一个 DP 执行组。每层 attention 和稠密 MLP 的部分结果在本机 TP 组内合并；MoE 的路由专家计算由两台机器共同参与。图中 TP 与 EP 段随模型层反复发生。">
  <title>请求先由前端选定一个 DP 执行组。每层 attention 和稠密 MLP 的部分结果在本机 TP 组内合并；MoE 的路由专家计算由两台机器共同参与。图中 TP 与 EP 段随模型层反复发生。</title>
