  <path d="M665 374 L665 428" fill="none" stroke="var(--color-ink, #17211f)" stroke-width="1.4" marker-end="url(#glm-two-node-request-route-ah-ink)"/>
  <path d="M215 490 L215 516 L330 516 L330 544" fill="none" stroke="var(--color-ink, #17211f)" stroke-width="1.4" marker-end="url(#glm-two-node-request-route-ah-ink)"/>
