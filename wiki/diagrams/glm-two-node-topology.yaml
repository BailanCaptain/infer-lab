caption: 官方双机配置下 16 张卡的分工：每台机器 8 张卡组成一个 TP 组，两台机器各是一个 DP 执行组，16 张卡合起来是一个 EP 组。图中数字是全局 rank，不规定板卡布局或网络布线。20.58 GiB 与 MTP 的 540.75 MiB 是正文所列语言模块的子账，未含视觉塔、旋转矩阵和量化辅助张量；逐层精度须匹配量化版本。
