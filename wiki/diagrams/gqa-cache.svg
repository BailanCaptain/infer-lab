<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 540" width="900" height="540" role="img" aria-label="MHA、GQA 与 MQA 三种注意力头分组的 KV cache 结构与容量比例对比" font-family="var(--font-sans)">
<title>MHA vs GQA vs MQA：4 个查询头共读不同数量 KV 组的缓存压缩比</title>
<desc>3 个位置、4 个查询头 Q0..Q3、每头 2 维示意：对比 MHA(4 组 48 格)、GQA(2 组 24 格) 与 MQA(1 组 12 格) 的 KV 表结构、共读连线与容量条。</desc>
<defs>
  <marker id="gq-teal" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
    <path d="M1 1.5L8.5 5L1 8.5Z" fill="#087f73"/>
  </marker>
</defs>

<text x="18" y="32" font-size="16" font-weight="700" fill="#17211f">同一层 KV Cache 容量对照：查询头恒为 4 个（Q₀..Q₃），缓存体积仅随 KV 组数 n_kv 缩放</text>

<!-- Tier 1: MHA (4 KV Groups) -->
<rect x="14" y="46" width="872" height="152" rx="10" fill="#fbfaf6" stroke="#d8d8cf" stroke-width="1.3"/>
<circle cx="36" cy="69" r="11" fill="#b54237"/>
<text x="36" y="73.5" text-anchor="middle" font-size="12.5" font-weight="700" fill="#ffffff">1</text>
<text x="54" y="74" font-size="14.5" font-weight="700" fill="#17211f">MHA（4Q : 4KV，一对一专属）：每头独立存一份 [3 位置 × (2K + 2V)]</text>
<g font-size="12" fill="#66716d" text-anchor="end">
  <text x="72" y="109">词 0</text><text x="72" y="129">词 1</text><text x="72" y="149">词 2</text>
</g>
<g stroke="#4c65b6" stroke-width="1.1">
  <rect x="82" y="92" width="52" height="62" rx="4" fill="#dce4fc"/><rect x="136" y="92" width="52" height="62" rx="4" fill="#e8edff"/>
  <rect x="206" y="92" width="52" height="62" rx="4" fill="#dce4fc"/><rect x="260" y="92" width="52" height="62" rx="4" fill="#e8edff"/>
  <rect x="330" y="92" width="52" height="62" rx="4" fill="#dce4fc"/><rect x="384" y="92" width="52" height="62" rx="4" fill="#e8edff"/>
  <rect x="454" y="92" width="52" height="62" rx="4" fill="#dce4fc"/><rect x="508" y="92" width="52" height="62" rx="4" fill="#e8edff"/>
</g>
<path d="M82 113h106M82 134h106M206 113h106M206 134h106M330 113h106M330 134h106M454 113h106M454 134h106" stroke="#ffffff" stroke-width="1.2"/>
<g font-size="12" font-weight="700" text-anchor="middle" fill="#3a4f93">
  <text x="108" y="110">K₀</text><text x="162" y="110">V₀</text>
  <text x="232" y="110">K₁</text><text x="286" y="110">V₁</text>
  <text x="356" y="110">K₂</text><text x="410" y="110">V₂</text>
  <text x="480" y="110">K₃</text><text x="534" y="110">V₃</text>
</g>
<g font-size="12.5" font-weight="700" text-anchor="middle" fill="#065f56">
  <text x="135" y="178">↑ Q₀ 独读</text>
  <text x="259" y="178">↑ Q₁ 独读</text>
  <text x="383" y="178">↑ Q₂ 独读</text>
  <text x="507" y="178">↑ Q₃ 独读</text>
</g>
<rect x="584" y="88" width="286" height="94" rx="8" fill="#fff0e9" stroke="#b54237" stroke-width="1.2"/>
<text x="598" y="112" font-size="13" font-weight="700" fill="#8f3229">单位置 16 个数 · 3 位置共 48 格</text>
<rect x="598" y="124" width="240" height="18" rx="4" fill="#d88c82" stroke="#b54237" stroke-width="1"/>
<text x="598" y="164" font-size="12" fill="#4d5652">容量 100%（长上下文显存与带宽开销最大）</text>
<!-- Tier 2: GQA (2 KV Groups) -->
<rect x="14" y="210" width="872" height="152" rx="10" fill="#fbfaf6" stroke="#087f73" stroke-width="1.3"/>
<circle cx="36" cy="233" r="11" fill="#087f73"/>
<text x="36" y="237.5" text-anchor="middle" font-size="12.5" font-weight="700" fill="#ffffff">2</text>
<text x="54" y="238" font-size="14.5" font-weight="700" fill="#17211f">GQA（4Q : 2KV，分组共享）：每 2 个查询头共读同一组 K/V，各自算出不同注意力权重</text>
<g font-size="12" fill="#66716d" text-anchor="end">
  <text x="72" y="273">词 0</text><text x="72" y="293">词 1</text><text x="72" y="313">词 2</text>
</g>
<g stroke="#087f73" stroke-width="1.2">
  <rect x="82" y="256" width="52" height="62" rx="4" fill="#b8efe4"/><rect x="136" y="256" width="52" height="62" rx="4" fill="#ddf4ef"/>
  <rect x="206" y="256" width="52" height="62" rx="4" fill="#b8efe4"/><rect x="260" y="256" width="52" height="62" rx="4" fill="#ddf4ef"/>
</g>
<path d="M82 277h106M82 298h106M206 277h106M206 298h106" stroke="#ffffff" stroke-width="1.2"/>
<g font-size="12" font-weight="700" text-anchor="middle" fill="#065f56">
  <text x="108" y="274">K₀</text><text x="162" y="274">V₀</text>
  <text x="232" y="274">K₁</text><text x="286" y="274">V₁</text>
</g>
<text x="135" y="342" text-anchor="middle" font-size="12.5" font-weight="700" fill="#065f56">↑ Q₀、Q₁ 共读</text>
<text x="259" y="342" text-anchor="middle" font-size="12.5" font-weight="700" fill="#065f56">↑ Q₂、Q₃ 共读</text>
<rect x="330" y="256" width="230" height="62" rx="6" fill="#ece9df" stroke="#b8bcb5" stroke-width="1.2" stroke-dasharray="5 3"/>
<text x="445" y="284" text-anchor="middle" font-size="12.5" font-weight="700" fill="#065f56">已省去 2 组 KV 存储</text>
<text x="445" y="305" text-anchor="middle" font-size="12" fill="#66716d">Q 打分与加权次数仍保持不变</text>
<rect x="584" y="252" width="286" height="94" rx="8" fill="#ddf4ef" stroke="#087f73" stroke-width="1.2"/>
<text x="598" y="276" font-size="13" font-weight="700" fill="#065f56">单位置 8 个数 · 3 位置共 24 格</text>
<rect x="598" y="288" width="240" height="18" rx="4" fill="#ffffff" stroke="#b8bcb5" stroke-width="1" stroke-dasharray="4 3"/>
<rect x="598" y="288" width="120" height="18" rx="4" fill="#087f73"/>
<text x="598" y="328" font-size="12" fill="#065f56">容量 50%（Qwen3-8B 4:1 / 30B 8:1）</text>

<!-- Tier 3: MQA (1 KV Group) -->
<rect x="14" y="374" width="872" height="152" rx="10" fill="#fbfaf6" stroke="#d8d8cf" stroke-width="1.3"/>
<circle cx="36" cy="397" r="11" fill="#4c65b6"/>
<text x="36" y="401.5" text-anchor="middle" font-size="12.5" font-weight="700" fill="#ffffff">3</text>
<text x="54" y="402" font-size="14.5" font-weight="700" fill="#17211f">MQA（4Q : 1KV，全员共享）：全部 4 个查询头共读唯 1 组 K/V</text>
<g font-size="12" fill="#66716d" text-anchor="end">
  <text x="72" y="437">词 0</text><text x="72" y="457">词 1</text><text x="72" y="477">词 2</text>
</g>
<g stroke="#4c65b6" stroke-width="1.2">
  <rect x="82" y="420" width="52" height="62" rx="4" fill="#dce4fc"/><rect x="136" y="420" width="52" height="62" rx="4" fill="#e8edff"/>
</g>
<path d="M82 441h106M82 462h106" stroke="#ffffff" stroke-width="1.2"/>
<text x="108" y="438" text-anchor="middle" font-size="12" font-weight="700" fill="#3a4f93">K₀</text>
<text x="162" y="438" text-anchor="middle" font-size="12" font-weight="700" fill="#3a4f93">V₀</text>
<text x="135" y="506" text-anchor="middle" font-size="12.5" font-weight="700" fill="#3a4f93">↑ Q₀..Q₃ 四头共读</text>
<rect x="206" y="420" width="354" height="62" rx="6" fill="#ece9df" stroke="#b8bcb5" stroke-width="1.2" stroke-dasharray="5 3"/>
<text x="383" y="448" text-anchor="middle" font-size="12.5" font-weight="700" fill="#3a4f93">已省去 3 组 KV · 单位置公式与 n_q 无关</text>
<text x="383" y="469" text-anchor="middle" font-family="var(--font-mono)" font-size="12" fill="#4d5652">KV_bytes = n_kv × (d_k + d_v) × bytes</text>
<rect x="584" y="416" width="286" height="94" rx="8" fill="#e8edff" stroke="#4c65b6" stroke-width="1.2"/>
<text x="598" y="440" font-size="13" font-weight="700" fill="#3a4f93">单位置 4 个数 · 3 位置共 12 格</text>
<rect x="598" y="452" width="240" height="18" rx="4" fill="#ffffff" stroke="#b8bcb5" stroke-width="1" stroke-dasharray="4 3"/>
<rect x="598" y="452" width="60" height="18" rx="4" fill="#4c65b6"/>
<text x="598" y="492" font-size="12" fill="#3a4f93">容量 25%（极致省显存，独立 V 子空间最少）</text>
</svg>
