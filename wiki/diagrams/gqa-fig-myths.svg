<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 580" width="900" height="580" role="img" aria-label="GQA 跨卡复制机制与五组常见误解排障对照图" font-family="var(--font-sans)">
  <title>GQA 五组常见认知误区与 v0.30.0 源码真相排障对照板。</title>
  <desc>上半部固定 8Q/2KV 展示 TP=1/2/4 下每卡 KV 头数 2/1/1 及 TP=4 同色跨卡副本；下半部四格汇总打分计算量、预训练结构绑定、FIA 与 MooncakeLayerwiseConnector、以及 MLA/KDA 与 PCP==DCP 判据。</desc>
  <defs>
    <marker id="gqm-teal" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 1 1.5 L 8.5 5 L 1 8.5 z" fill="#087f73"/>
    </marker>
    <marker id="gqm-ind" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 1 1.5 L 8.5 5 L 1 8.5 z" fill="#4c65b6"/>
    </marker>
  </defs>

  <text x="16" y="28" font-size="16" font-weight="700" fill="#17211f">GQA 跨卡切分与复制保底（固定 8Q / 2KV 示意）及 v0.30.0 排障判据</text>

  <!-- Hero Mechanism Panel: 8Q / 2KV across TP = 1 / 2 / 4 -->
  <rect x="14" y="40" width="872" height="264" rx="10" fill="#fbfaf6" stroke="#d8d8cf" stroke-width="1.3"/>
  <text x="28" y="63" font-size="13.5" font-weight="700" fill="#17211f">核心算例：Q₀..Q₃ 共读青色 KV₀，Q₄..Q₇ 共读靛蓝 KV₁ — 对比 TP = 1 / 2 / 4 时每卡 KV 头数（2 → 1 → 1）</text>

  <!-- Col 1: TP=1 -->
  <rect x="26" y="76" width="220" height="188" rx="8" fill="#ffffff" stroke="#087f73" stroke-width="1.3"/>
  <text x="136" y="98" text-anchor="middle" font-size="13.5" font-weight="700" fill="#065f56">TP = 1（单卡全持）</text>
  <text x="136" y="117" text-anchor="middle" font-size="12" fill="#66716d">Rank 0 持 8Q : 2KV</text>
  <rect x="38" y="128" width="94" height="24" rx="4" fill="#ddf4ef" stroke="#087f73" stroke-width="1.1"/>
  <text x="85" y="144.5" text-anchor="middle" font-size="12" font-weight="700" fill="#065f56">Q₀..Q₃</text>
  <rect x="140" y="128" width="94" height="24" rx="4" fill="#e8edff" stroke="#4c65b6" stroke-width="1.1"/>
  <text x="187" y="144.5" text-anchor="middle" font-size="12" font-weight="700" fill="#3a4f93">Q₄..Q₇</text>
  <line x1="85" y1="152" x2="85" y2="168" stroke="#087f73" stroke-width="1.4" marker-end="url(#gqm-teal)"/>
  <line x1="187" y1="152" x2="187" y2="168" stroke="#4c65b6" stroke-width="1.4" marker-end="url(#gqm-ind)"/>
  <rect x="38" y="170" width="94" height="34" rx="5" fill="#b8efe4" stroke="#087f73" stroke-width="1.4"/>
  <text x="85" y="191.5" text-anchor="middle" font-size="12.5" font-weight="700" fill="#065f56">独立 KV₀</text>
  <rect x="140" y="170" width="94" height="34" rx="5" fill="#dce4fc" stroke="#4c65b6" stroke-width="1.4"/>
  <text x="187" y="191.5" text-anchor="middle" font-size="12.5" font-weight="700" fill="#3a4f93">独立 KV₁</text>
  <text x="136" y="229" text-anchor="middle" font-size="12.5" font-weight="700" fill="#17211f">每卡 2 头（容量 100%）</text>
  <text x="136" y="250" text-anchor="middle" font-size="12" fill="#66716d">每 4 个 Q 共读 1 组 K/V</text>

  <!-- Col 2: TP=2 -->
  <rect x="258" y="76" width="254" height="188" rx="8" fill="#ffffff" stroke="#087f73" stroke-width="1.3"/>
  <text x="385" y="98" text-anchor="middle" font-size="13.5" font-weight="700" fill="#065f56">TP = 2（按头均分）</text>
  <text x="385" y="117" text-anchor="middle" font-size="12" fill="#66716d">每卡 4Q : 1KV · 触及 1 头地板</text>
  <rect x="270" y="128" width="108" height="24" rx="4" fill="#ddf4ef" stroke="#087f73" stroke-width="1.1"/>
  <text x="324" y="144.5" text-anchor="middle" font-size="12" font-weight="700" fill="#065f56">R0: Q₀..Q₃</text>
  <rect x="392" y="128" width="108" height="24" rx="4" fill="#e8edff" stroke="#4c65b6" stroke-width="1.1"/>
  <text x="446" y="144.5" text-anchor="middle" font-size="12" font-weight="700" fill="#3a4f93">R1: Q₄..Q₇</text>
  <line x1="324" y1="152" x2="324" y2="168" stroke="#087f73" stroke-width="1.4" marker-end="url(#gqm-teal)"/>
  <line x1="446" y1="152" x2="446" y2="168" stroke="#4c65b6" stroke-width="1.4" marker-end="url(#gqm-ind)"/>
  <rect x="270" y="170" width="108" height="34" rx="5" fill="#b8efe4" stroke="#087f73" stroke-width="1.4"/>
  <text x="324" y="191.5" text-anchor="middle" font-size="12.5" font-weight="700" fill="#065f56">独立 KV₀</text>
  <rect x="392" y="170" width="108" height="34" rx="5" fill="#dce4fc" stroke="#4c65b6" stroke-width="1.4"/>
  <text x="446" y="191.5" text-anchor="middle" font-size="12.5" font-weight="700" fill="#3a4f93">独立 KV₁</text>
  <text x="385" y="229" text-anchor="middle" font-size="12.5" font-weight="700" fill="#065f56">每卡 1 头（单卡缩至 50%）</text>
  <text x="385" y="250" text-anchor="middle" font-size="12" fill="#66716d">两卡分持异色独立 KV 头</text>

  <!-- Col 3: TP=4 (Replication!) -->
  <rect x="524" y="76" width="350" height="188" rx="8" fill="#ffffff" stroke="#9a4b86" stroke-width="1.5"/>
  <text x="699" y="98" text-anchor="middle" font-size="13.5" font-weight="700" fill="#7a3a6a">TP = 4（TP &gt; n_kv 触发跨卡复制！）</text>
  <text x="699" y="117" text-anchor="middle" font-size="12" fill="#8f3229">✗ 误把 2Q:1KV 当退回 MHA / 以为继续减半</text>
  <g font-size="12" font-weight="700" text-anchor="middle">
    <rect x="536" y="128" width="74" height="24" rx="4" fill="#ddf4ef" stroke="#087f73" stroke-width="1.1"/>
    <text x="573" y="144.5" fill="#065f56">R0:Q₀Q₁</text>
    <rect x="620" y="128" width="74" height="24" rx="4" fill="#ddf4ef" stroke="#087f73" stroke-width="1.1"/>
    <text x="657" y="144.5" fill="#065f56">R1:Q₂Q₃</text>
    <rect x="704" y="128" width="74" height="24" rx="4" fill="#e8edff" stroke="#4c65b6" stroke-width="1.1"/>
    <text x="741" y="144.5" fill="#3a4f93">R2:Q₄Q₅</text>
    <rect x="788" y="128" width="74" height="24" rx="4" fill="#e8edff" stroke="#4c65b6" stroke-width="1.1"/>
    <text x="825" y="144.5" fill="#3a4f93">R3:Q₆Q₇</text>
  </g>
  <g stroke-width="1.3">
    <line x1="573" y1="152" x2="573" y2="168" stroke="#087f73" marker-end="url(#gqm-teal)"/>
    <line x1="657" y1="152" x2="657" y2="168" stroke="#087f73" marker-end="url(#gqm-teal)"/>
    <line x1="741" y1="152" x2="741" y2="168" stroke="#4c65b6" marker-end="url(#gqm-ind)"/>
    <line x1="825" y1="152" x2="825" y2="168" stroke="#4c65b6" marker-end="url(#gqm-ind)"/>
  </g>
  <rect x="536" y="170" width="74" height="34" rx="5" fill="#b8efe4" stroke="#087f73" stroke-width="1.5"/>
  <rect x="620" y="170" width="74" height="34" rx="5" fill="#b8efe4" stroke="#087f73" stroke-width="1.5" stroke-dasharray="4 2"/>
  <rect x="704" y="170" width="74" height="34" rx="5" fill="#dce4fc" stroke="#4c65b6" stroke-width="1.5"/>
  <rect x="788" y="170" width="74" height="34" rx="5" fill="#dce4fc" stroke="#4c65b6" stroke-width="1.5" stroke-dasharray="4 2"/>
  <g font-size="12" font-weight="700" text-anchor="middle">
    <text x="573" y="191.5" fill="#065f56">KV₀ 副本</text>
    <text x="657" y="191.5" fill="#065f56">KV₀ 副本</text>
    <text x="741" y="191.5" fill="#3a4f93">KV₁ 副本</text>
    <text x="825" y="191.5" fill="#3a4f93">KV₁ 副本</text>
  </g>
  <path d="M 573 206 L 573 213 L 657 213 L 657 206 M 741 206 L 741 213 L 825 213 L 825 206" fill="none" stroke="#9a4b86" stroke-width="1.5"/>
  <text x="699" y="231" text-anchor="middle" font-size="12.5" font-weight="700" fill="#7a3a6a">每卡仍 1 头（4 份本地副本 = 2 个独立头）</text>
  <text x="699" y="251" text-anchor="middle" font-family="var(--font-mono)" font-size="12" fill="#4d5652">num_kv_head_replicas = 2 · 缓存不再缩</text>

  <text x="450" y="289" text-anchor="middle" font-size="12.5" fill="#4d5652">保底法则：单卡 KV 头数 = <tspan font-family="var(--font-mono)" font-weight="700" fill="#065f56">max(1, total_num_kv_heads // tp)</tspan>；如 Qwen3-30B-A3B（4KV）跑 TP=8 时每头跨 2 卡复制</text>

  <!-- Lower 2x2 Verified Criteria Cards -->
  <rect x="14" y="316" width="430" height="120" rx="9" fill="#ffffff" stroke="#087f73" stroke-width="1.3"/>
  <text x="28" y="341" font-size="13.5" font-weight="700" fill="#8f3229">✗ 误区 1：GQA 合并了 Q 头，或完全不省计算</text>
  <text x="28" y="366" font-size="13.5" font-weight="700" fill="#065f56">✓ 真相：W_K / W_V 与缓存按 KV 头缩，打分不缩</text>
  <text x="28" y="392" font-size="12.5" fill="#4d5652">Q 头一个不少；<tspan font-family="var(--font-mono)" font-weight="600">QKᵀ</tspan>、<tspan font-family="var(--font-mono)" font-weight="600">PV</tspan> 与 <tspan font-family="var(--font-mono)" font-weight="600">W_O</tspan> 仍按 <tspan font-family="var(--font-mono)" font-weight="600">num_heads</tspan> 逐头算</text>
  <text x="28" y="417" font-size="12" fill="#66716d">省下的是 K/V 投影参数乘加及长上下文 HBM 读取带宽</text>

  <rect x="456" y="316" width="430" height="120" rx="9" fill="#ffffff" stroke="#c78300" stroke-width="1.3"/>
  <text x="470" y="341" font-size="13.5" font-weight="700" fill="#8f3229">✗ 误区 2：手改 num_key_value_heads 即可无损开启</text>
  <text x="470" y="366" font-size="13.5" font-weight="700" fill="#936300">✓ 真相：分组比须在预训练或 uptraining 阶段定死</text>
  <text x="470" y="392" font-size="12.5" fill="#4d5652">权重形状绑定头数，硬改配置必致加载失败或输出错乱</text>
  <text x="470" y="417" font-size="12" fill="#66716d">MHA 转 GQA 需同组 K/V 取均值并补约 5% 预训练算力</text>

  <rect x="14" y="448" width="430" height="120" rx="9" fill="#ffffff" stroke="#9a4b86" stroke-width="1.3"/>
  <text x="28" y="473" font-size="13.5" font-weight="700" fill="#8f3229">✗ 误区 3：进 FIA 前先在 HBM 展开；C8 照常整块传</text>
  <text x="28" y="498" font-size="13.5" font-weight="700" fill="#7a3a6a">✓ 真相：FIA 原生直读双头数；GQA+C8 须逐层连接器</text>
  <text x="28" y="524" font-size="12.5" fill="#4d5652"><tspan font-family="var(--font-mono)" font-size="12">npu_fused_infer_attention_score</tspan> 免 <tspan font-family="var(--font-mono)" font-size="12">repeat_kv</tspan> 展开</text>
  <text x="28" y="549" font-size="12" fill="#66716d">C8 下 P 端 BF16 / D 端 INT8，须换 <tspan font-family="var(--font-mono)" font-weight="600" fill="#7a3a6a">MooncakeLayerwiseConnector</tspan></text>

  <rect x="456" y="448" width="430" height="120" rx="9" fill="#ffffff" stroke="#4c65b6" stroke-width="1.3"/>
  <text x="470" y="473" font-size="13.5" font-weight="700" fill="#8f3229">✗ 误区 4：MLA 写 1 头即 MQA / GLM 64 头按 MHA 算</text>
  <text x="470" y="498" font-size="13.5" font-weight="700" fill="#3a4f93">✓ 真相：MLA 存共享潜向量按头还原；KDA 存定长状态</text>
  <text x="470" y="524" font-size="12.5" fill="#4d5652"><tspan font-family="var(--font-mono)" font-size="12">num_kv_heads=1</tspan> 仅为缓存槽位记账，各头还原出不同 K/V</text>
  <text x="470" y="549" font-size="12" fill="#66716d">非 MLA 叠用上下文并行须满足 <tspan font-family="var(--font-mono)" font-weight="600" fill="#3a4f93">PCP == DCP</tspan></text>
</svg>
