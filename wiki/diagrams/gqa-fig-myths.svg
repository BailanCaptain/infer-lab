<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 498" width="900" height="498" role="img" aria-label="GQA 五组常见误解与 v0.30.0 源码真相排障对照板" font-family="var(--font-sans)">
  <title>GQA 五组常见认知误区与 v0.30.0 源码真相排障对照板。</title>
  <desc>五排开放式对照：1. W_K/W_V 与缓存按 KV 头缩，QKᵀ/PV/W_O 逐头不缩；2. 分组比须预训练或 uptraining 定死；3. TP 大于 KV 头数时按 num_kv_head_replicas 复制；4. FIA 直读双头数，GQA+C8 须换 MooncakeLayerwiseConnector；5. MLA 记 1 头为潜向量记账而非 MQA。</desc>
  <defs>
    <marker id="gm-arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto">
      <path d="M 0 1.5 L 8.5 5 L 0 8.5 z" fill="#087f73"/>
    </marker>
  </defs>

  <text x="14" y="30" font-size="16" font-weight="700" fill="#8f3229">✗ 常见错误直觉（高频踩坑点）</text>
  <text x="392" y="30" font-size="16" font-weight="700" fill="#065f56">✓ v0.30.0 源码与论文真相（算账与排障判据）</text>
  <line x1="12" y1="42" x2="888" y2="42" stroke="#b8bcb5" stroke-width="1.4"/>
  <line x1="378" y1="12" x2="378" y2="486" stroke="#b8bcb5" stroke-width="1.3" stroke-dasharray="5 4"/>

  <g fill="#fff0e9" stroke="#b54237" stroke-width="1.4">
    <rect x="12" y="54" width="352" height="76" rx="9"/>
    <rect x="12" y="142" width="352" height="76" rx="9"/>
    <rect x="12" y="230" width="352" height="76" rx="9"/>
    <rect x="12" y="318" width="352" height="76" rx="9"/>
    <rect x="12" y="406" width="352" height="76" rx="9"/>
  </g>
  <g fill="#ffffff" stroke="#087f73" stroke-width="1.5">
    <rect x="392" y="54" width="496" height="76" rx="9"/>
    <rect x="392" y="142" width="496" height="76" rx="9"/>
    <rect x="392" y="230" width="496" height="76" rx="9"/>
    <rect x="392" y="318" width="496" height="76" rx="9"/>
    <rect x="392" y="406" width="496" height="76" rx="9"/>
  </g>
  <g fill="none" stroke="#087f73" stroke-width="2" marker-end="url(#gm-arr)">
    <path d="M 364 92 L 386 92"/>
    <path d="M 364 180 L 386 180"/>
    <path d="M 364 268 L 386 268"/>
    <path d="M 364 356 L 386 356"/>
    <path d="M 364 444 L 386 444"/>
  </g>

  <g font-size="15" font-weight="700" fill="#8f3229">
    <text x="26" y="81">1. GQA 合并了 Q 头 / 完全不省计算</text>
    <text x="26" y="169">2. 手改 num_key_value_heads 即可开启</text>
    <text x="26" y="257">3. TP &gt; KV 头数时继续缩单卡缓存</text>
    <text x="26" y="345">4. 进算子前先在 HBM 展开 K/V；C8 照常传</text>
    <text x="26" y="433">5. MLA 写 1 个 KV 头就是 MQA</text>
  </g>
  <g font-size="13.5" fill="#8f3229">
    <text x="26" y="110">混淆了 K/V 投影与逐头打分汇合</text>
    <text x="26" y="198">把模型结构参数当成推理期无损开关</text>
    <text x="26" y="286">看到单卡 1Q:1KV 就以为退回 MHA</text>
    <text x="26" y="374">以为 FIA 需 repeat_kv、Mooncake 可整块搬</text>
    <text x="26" y="462">或看 GLM 配置写 64 头就按 MHA 算缓存</text>
  </g>

  <g font-size="15" font-weight="700" fill="#065f56">
    <text x="408" y="81">W_K、W_V 与缓存按 KV 头缩；打分和 W_O 不缩</text>
    <text x="408" y="169">分组比须在预训练或 uptraining 阶段定死</text>
    <text x="408" y="257">每卡保底 1 个 KV 头，按 <tspan font-family="var(--font-mono)" font-size="14" fill="#7a3a6a">num_kv_head_replicas</tspan> 复制</text>
    <text x="408" y="345">FIA 原生直读双头数；GQA+C8 须走逐层连接器</text>
    <text x="408" y="433">MLA 存共享潜向量并按头还原；KDA 存定长状态</text>
  </g>
  <g font-size="13.5" fill="#4d5652">
    <text x="408" y="110">Q 头一个不少，QKᵀ、PV 与输出投影仍按 <tspan font-family="var(--font-mono)" font-weight="600">num_heads</tspan> 逐头算</text>
    <text x="408" y="198">MHA 转 GQA 需同组 K/V 投影取均值并补约 5% 预训练算力</text>
    <text x="408" y="286">30B-A3B（4KV）跑 TP=8 时每头跨 2 卡复制，单卡缓存不再减</text>
    <text x="408" y="374">C8 下 P 端 BF16 / D 端 INT8，须换 <tspan font-family="var(--font-mono)" font-weight="600">MooncakeLayerwiseConnector</tspan></text>
    <text x="408" y="462">「1 个 KV 头」仅为缓存槽位记账；PCP+DCP 叠用须 <tspan font-family="var(--font-mono)" font-weight="600">PCP == DCP</tspan></text>
  </g>
</svg>
