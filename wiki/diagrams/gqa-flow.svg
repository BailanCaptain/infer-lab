<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 480" width="900" height="480" role="img" aria-label="同一套 vLLM 流程里，每层按自己的注意力类型走三支之一。左支是普通注意力：加载模型时按 TP 定本卡几个 KV 头（够分就切，不够就每卡 1 个并复制），启动时先算每块元素数，再乘每个元素的字节数得到块容量，第 4 站把查询头数和 KV 头数一起交给算子。中、右两支是 GLM 的两类层：稀疏 MLA 的潜向量不按头切，缓存规格写成 1 个 KV 头；KDA 的 q、k、v 头数相同，按头切到各卡，不存逐位置的 K、V。">
  <title>同一套 vLLM 流程里，每层按自己的注意力类型走三支之一。左支是普通注意力：加载模型时按 TP 定本卡几个 KV 头（够分就切，不够就每卡 1 个并复制），启动时先算每块元素数，再乘每个元素的字节数得到块容量，第 4 站把查询头数和 KV 头数一起交给算子。中、右两支是 GLM 的两类层：稀疏 MLA 的潜向量不按头切，缓存规格写成 1 个 KV 头；KDA 的 q、k、v 头数相同，按头切到各卡，不存逐位置的 K、V。</title>
  <defs><marker id="gqa-flow-ah-ink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="var(--color-ink, #17211f)"/></marker><marker id="gqa-flow-ah-control" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="var(--color-control, #66716d)"/></marker></defs>
  <path d="M154 166 L154 196" fill="none" stroke="var(--color-ink, #17211f)" stroke-width="1.4" marker-end="url(#gqa-flow-ah-ink)"/>
  <path d="M154 256 L154 286" fill="none" stroke="var(--color-ink, #17211f)" stroke-width="1.4" marker-end="url(#gqa-flow-ah-ink)"/>
  <path d="M154 346 L154 376" fill="none" stroke="var(--color-ink, #17211f)" stroke-width="1.4" marker-end="url(#gqa-flow-ah-ink)"/>
  <path d="M450 166 L450 196" fill="none" stroke="var(--color-ink, #17211f)" stroke-width="1.4" marker-end="url(#gqa-flow-ah-ink)"/>
  <path d="M450 256 L450 286" fill="none" stroke="var(--color-ink, #17211f)" stroke-width="1.4" marker-end="url(#gqa-flow-ah-ink)"/>
  <path d="M450 346 L450 376" fill="none" stroke="var(--color-ink, #17211f)" stroke-width="1.4" marker-end="url(#gqa-flow-ah-ink)"/>
  <path d="M746 166 L746 196" fill="none" stroke="var(--color-ink, #17211f)" stroke-width="1.4" marker-end="url(#gqa-flow-ah-ink)"/>
  <path d="M746 256 L746 286" fill="none" stroke="var(--color-ink, #17211f)" stroke-width="1.4" marker-end="url(#gqa-flow-ah-ink)"/>
  <path d="M746 346 L746 376" fill="none" stroke="var(--color-ink, #17211f)" stroke-width="1.4" marker-end="url(#gqa-flow-ah-ink)"/>
  <path d="M450 64 L154 110" fill="none" stroke="var(--color-control, #66716d)" stroke-width="1.4" marker-end="url(#gqa-flow-ah-control)"/>
  <path d="M450 64 L450 110" fill="none" stroke="var(--color-control, #66716d)" stroke-width="1.4" marker-end="url(#gqa-flow-ah-control)"/>
  <path d="M450 64 L746 110" fill="none" stroke="var(--color-control, #66716d)" stroke-width="1.4" marker-end="url(#gqa-flow-ah-control)"/>
  <rect x="300" y="16" width="300" height="48" rx="8" fill="var(--color-control-soft, #f1efe8)" stroke="var(--color-line-strong, #b8bcb5)" stroke-width="1.4"/>
  <text x="450" y="45" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="14" font-weight="700" fill="var(--color-ink, #17211f)" text-anchor="middle">这一层用哪种注意力？</text>
  <rect x="24" y="110" width="260" height="56" rx="8" fill="var(--color-control-soft, #f1efe8)" stroke="var(--color-line-strong, #b8bcb5)" stroke-width="1.4"/>
  <text x="154" y="134" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="14" font-weight="700" fill="var(--color-ink, #17211f)" text-anchor="middle">普通注意力</text>
  <text x="154" y="153" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="13" font-weight="400" fill="#065f56" text-anchor="middle">GQA 模型：KV 头少于查询头</text>
  <rect x="320" y="110" width="260" height="56" rx="8" fill="var(--color-control-soft, #f1efe8)" stroke="var(--color-line-strong, #b8bcb5)" stroke-width="1.4"/>
  <text x="450" y="134" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="14" font-weight="700" fill="var(--color-ink, #17211f)" text-anchor="middle">GLM 稀疏 MLA</text>
  <text x="450" y="153" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="13" font-weight="400" fill="#3a4f93" text-anchor="middle">主干 11 层，另加 MTP 层</text>
  <rect x="616" y="110" width="260" height="56" rx="8" fill="var(--color-control-soft, #f1efe8)" stroke="var(--color-line-strong, #b8bcb5)" stroke-width="1.4"/>
  <text x="746" y="134" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="14" font-weight="700" fill="var(--color-ink, #17211f)" text-anchor="middle">GLM KDA</text>
  <text x="746" y="153" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="13" font-weight="400" fill="#3a4f93" text-anchor="middle">34 层</text>
  <rect x="24" y="196" width="260" height="60" rx="8" fill="var(--color-control-soft, #f1efe8)" stroke="var(--color-line-strong, #b8bcb5)" stroke-width="1.4"/>
  <text x="154" y="222" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="14" font-weight="700" fill="var(--color-ink, #17211f)" text-anchor="middle">按 TP 定本卡头数</text>
  <text x="154" y="241" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="13" font-weight="400" fill="#936300" text-anchor="middle">KV 头够分就切，不够每卡 1 个并复制</text>
  <rect x="320" y="196" width="260" height="60" rx="8" fill="var(--color-control-soft, #f1efe8)" stroke="var(--color-line-strong, #b8bcb5)" stroke-width="1.4"/>
  <text x="450" y="222" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="14" font-weight="700" fill="var(--color-ink, #17211f)" text-anchor="middle">潜向量不按头切</text>
  <text x="450" y="241" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="13" font-weight="400" fill="#936300" text-anchor="middle">TP8 下每卡各算、各存一份完整的</text>
  <rect x="616" y="196" width="260" height="60" rx="8" fill="var(--color-control-soft, #f1efe8)" stroke="var(--color-line-strong, #b8bcb5)" stroke-width="1.4"/>
  <text x="746" y="222" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="14" font-weight="700" fill="var(--color-ink, #17211f)" text-anchor="middle">q、k、v 头数相同</text>
  <text x="746" y="241" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="13" font-weight="400" fill="#936300" text-anchor="middle">按 TP8 切，每卡 8 个头</text>
  <rect x="24" y="286" width="260" height="60" rx="8" fill="var(--color-control-soft, #f1efe8)" stroke="var(--color-line-strong, #b8bcb5)" stroke-width="1.4"/>
  <text x="154" y="312" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="14" font-weight="700" fill="var(--color-ink, #17211f)" text-anchor="middle">每块元素数随本卡 KV 头数</text>
  <text x="154" y="331" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="13" font-weight="400" fill="#3a4f93" text-anchor="middle">K、V 两份 × token 数 × 头数 × 头宽</text>
  <rect x="320" y="286" width="260" height="60" rx="8" fill="var(--color-control-soft, #f1efe8)" stroke="var(--color-line-strong, #b8bcb5)" stroke-width="1.4"/>
  <text x="450" y="312" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="14" font-weight="700" fill="var(--color-ink, #17211f)" text-anchor="middle">规格写 1 个 KV 头</text>
  <text x="450" y="331" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="13" font-weight="400" fill="#3a4f93" text-anchor="middle">头宽是潜向量宽，不是 64 组 K、V</text>
  <rect x="616" y="286" width="260" height="60" rx="8" fill="var(--color-control-soft, #f1efe8)" stroke="var(--color-line-strong, #b8bcb5)" stroke-width="1.4"/>
  <text x="746" y="312" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="14" font-weight="700" fill="var(--color-ink, #17211f)" text-anchor="middle">不存逐位置的 K、V</text>
  <text x="746" y="331" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="13" font-weight="400" fill="#3a4f93" text-anchor="middle">每个头一个固定大小的状态</text>
  <rect x="24" y="376" width="260" height="60" rx="8" fill="var(--color-control-soft, #f1efe8)" stroke="var(--color-line-strong, #b8bcb5)" stroke-width="1.4"/>
  <text x="154" y="402" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="14" font-weight="700" fill="var(--color-ink, #17211f)" text-anchor="middle">两种头数一起交给算子</text>
  <text x="154" y="421" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="13" font-weight="400" fill="#065f56" text-anchor="middle">算子内部让同组查询头读同一组 K、V</text>
  <rect x="320" y="376" width="260" height="60" rx="8" fill="var(--color-control-soft, #f1efe8)" stroke="var(--color-line-strong, #b8bcb5)" stroke-width="1.4"/>
  <text x="450" y="402" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="14" font-weight="700" fill="var(--color-ink, #17211f)" text-anchor="middle">吸收后在潜空间打分</text>
  <text x="450" y="421" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="13" font-weight="400" fill="#065f56" text-anchor="middle">每个头的 K、V 由各自投影得到</text>
  <rect x="616" y="376" width="260" height="60" rx="8" fill="var(--color-control-soft, #f1efe8)" stroke="var(--color-line-strong, #b8bcb5)" stroke-width="1.4"/>
  <text x="746" y="402" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="14" font-weight="700" fill="var(--color-ink, #17211f)" text-anchor="middle">先改写状态，再用 q 读出</text>
  <text x="746" y="421" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="13" font-weight="400" fill="#065f56" text-anchor="middle">历史多长，状态大小都不变</text>
  <text x="24" y="188" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="13" font-weight="700" fill="var(--color-ink, #17211f)">加载模型</text>
  <text x="24" y="278" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="13" font-weight="700" fill="var(--color-ink, #17211f)">启动：定缓存规格</text>
  <text x="24" y="368" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="13" font-weight="700" fill="var(--color-ink, #17211f)">第 4 站 逐层前向</text>
  <text x="154" y="462" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="13.5" font-weight="400" fill="var(--color-ink, #17211f)" text-anchor="middle">GLM 的注意力层都不走这一支</text>
  <text x="598" y="462" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="13.5" font-weight="400" fill="var(--color-ink, #17211f)" text-anchor="middle">本部署：稀疏 MLA 走中间，KDA 走右边</text>
</svg>
