  <text x="40" y="266" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="12.5" font-weight="400" fill="var(--color-ink-muted, #5b6763)">8 个 K 头 + 8 个 V 头 × 128 维，kv_size = 1024</text>
  <path d="M40 138 l0 -9 L134 129 l0 9" fill="none" stroke="var(--color-accent, #e85b32)" stroke-width="1.4" opacity="0.75"/>
  <text x="87" y="121" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="12.5" font-weight="600" fill="var(--color-accent, #e85b32)" text-anchor="middle">2 个 Q 头共用一组</text>
  <text x="840" y="194" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="12.5" font-weight="400" fill="var(--color-ink-muted, #5b6763)" text-anchor="end">16 个 Q 头照样各算一遍，乘加次数没少</text>
  <text x="840" y="266" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="12.5" font-weight="400" fill="var(--color-ink-muted, #5b6763)" text-anchor="end">只有这一排进 KV Cache：4096 B／token／层</text>
  <text x="60" y="606" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="12.5" font-weight="600" fill="var(--color-ink, #17211f)">16 和 8 这两个数一路传到算子入参为止，中间没有一步把 K/V 摊成 16 份：省的是字节数和读取量，不是乘加次数。</text>
</svg>
