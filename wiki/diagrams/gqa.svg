<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 660" width="900" height="660" role="img" aria-label="上排 16 个 Q 头、下排 8 个 K/V 头（Qwen3-0.6B 的真实头数），一格正好压住上面两格；下半张是算的时候这两个数怎么交给算子">
  <title>上排 16 个 Q 头、下排 8 个 K/V 头（Qwen3-0.6B 的真实头数），一格正好压住上面两格；下半张是算的时候这两个数怎么交给算子</title>
  <rect width="900" height="660" fill="var(--color-surface, #fbfaf6)"/>
  <rect x="20" y="36" width="860" height="252" rx="12" fill="var(--color-kv-soft, #e8edff)"/>
  <rect x="36" y="50" width="234.2" height="26.5" rx="13.3" fill="var(--color-kv, #4c65b6)"/><text x="47" y="68.1" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="13.5" font-weight="700" fill="var(--color-ink-inverse, #ffffff)">一层里的头数：16 个 Q，8 个 K/V</text>
  <text x="38" y="93" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="12.5" font-weight="400" fill="var(--color-ink-muted, #5b6763)">两排一样长，因为每个头都是 128 维——GQA 砍的不是维度，是 K/V 的组数：16 组变 8 组。</text>
  <rect x="20" y="308" width="860" height="328" rx="12" fill="var(--color-weight-soft, #fff4cf)"/>
  <rect x="36" y="322" width="402.7" height="26.5" rx="13.3" fill="var(--color-weight, #b87a00)"/><text x="47" y="340.1" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="13.5" font-weight="700" fill="var(--color-ink-inverse, #ffffff)">算的时候：两个数交给算子，Python 侧从没出现过 16 份 K/V</text>
  <text x="38" y="365" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="12.5" font-weight="400" fill="var(--color-ink-muted, #5b6763)">复制不是没发生，是发生在算子里面——昇腾自己写的多模态 encoder 那条路才真的 repeat_interleave。</text>
  <rect x="60" y="386" width="800" height="50" rx="10" fill="var(--color-kv-soft, #e8edff)"/>
  <rect x="60" y="386" width="5" height="50" rx="2.5" fill="var(--color-kv, #4c65b6)"/>
  <g transform="translate(83.8 400.8) scale(0.85)" fill="none" stroke="var(--color-kv, #4c65b6)" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M3 3h7v7H3zM14 3h7v7h-7zM3 14h7v7H3zM14 14h7v7h-7z"/></g>
  <text x="118" y="408" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="15" font-weight="700" fill="var(--color-ink, #17211f)">缓存里就只有 8 个 KV 头</text>
  <text x="118" y="428" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="12.5" font-weight="400" fill="var(--color-ink-muted, #5b6763)">(2, num_blocks, 128, 8, 128) —— 第四维那个 8 是 KV 头数，不是 16</text>
  <rect x="688" y="398.5" width="153" height="21.5" rx="10.8" fill="var(--color-surface, #fbfaf6)" stroke="var(--color-kv, #4c65b6)" stroke-width="1"/><text x="764.5" y="416" font-family="'JetBrains Mono',ui-monospace,monospace" font-size="12.5" font-weight="400" fill="var(--color-kv, #4c65b6)" text-anchor="middle">get_kv_cache_shape</text>
  <rect x="60" y="444" width="800" height="50" rx="10" fill="var(--color-kv-soft, #e8edff)"/>
  <rect x="60" y="444" width="5" height="50" rx="2.5" fill="var(--color-kv, #4c65b6)"/>
  <g transform="translate(83.8 458.8) scale(0.85)" fill="none" stroke="var(--color-kv, #4c65b6)" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3l9 5-9 5-9-5z M3 13l9 5 9-5"/></g>
  <text x="118" y="466" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="15" font-weight="700" fill="var(--color-ink, #17211f)">取的时候 8 个头被压进最后一维</text>
  <text x="118" y="486" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="12.5" font-weight="400" fill="var(--color-ink-muted, #5b6763)">key_cache.view(num_block, block_size, -1)：8 × 128 压成 1024</text>
  <rect x="710.5" y="456.5" width="130.5" height="21.5" rx="10.8" fill="var(--color-surface, #fbfaf6)" stroke="var(--color-kv, #4c65b6)" stroke-width="1"/><text x="775.8" y="474" font-family="'JetBrains Mono',ui-monospace,monospace" font-size="12.5" font-weight="400" fill="var(--color-kv, #4c65b6)" text-anchor="middle">_get_fia_params</text>
  <rect x="60" y="528" width="800" height="50" rx="10" fill="var(--color-weight-soft, #fff4cf)"/>
  <rect x="60" y="528" width="5" height="50" rx="2.5" fill="var(--color-weight, #b87a00)"/>
  <g transform="translate(83.8 542.8) scale(0.85)" fill="none" stroke="var(--color-weight, #b87a00)" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M13 2L4 14h7l-1 8 9-12h-7z"/></g>
  <text x="118" y="550" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="15" font-weight="700" fill="var(--color-ink, #17211f)">算子按 num_key_value_heads 自己分组</text>
  <text x="118" y="570" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="12.5" font-weight="400" fill="var(--color-ink-muted, #5b6763)">num_heads=16 与 num_key_value_heads=8 一起传进去，K/V 不复制</text>
  <rect x="590.5" y="540.5" width="250.5" height="21.5" rx="10.8" fill="var(--color-surface, #fbfaf6)" stroke="var(--color-weight, #b87a00)" stroke-width="1"/><text x="715.8" y="558" font-family="'JetBrains Mono',ui-monospace,monospace" font-size="12.5" font-weight="400" fill="var(--color-weight, #b87a00)" text-anchor="middle">npu_fused_infer_attention_score</text>
  <line x1="40" y1="512" x2="880" y2="512" stroke="var(--color-accent, #e85b32)" stroke-width="2.5" stroke-dasharray="7 5"/>
  <text x="876" y="503" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="13" font-weight="700" fill="var(--color-accent, #e85b32)" text-anchor="end">过了这条线才分组：Python 侧到此只有 8 份</text>
  <rect x="40" y="142" width="46" height="34" rx="3" fill="var(--color-accent, #e85b32)" stroke="var(--color-accent, #e85b32)" stroke-width="1.1"/>
