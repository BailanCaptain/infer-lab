<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 400" width="900" height="400" role="img" aria-label="三栏都是 4 个查询头，头数只为示意，不对应任何模型。箭头从一组 K、V 指向读它的查询头；每个查询头再用自己的 Q 打分、汇合，得到自己那一份输出，所以三栏都出 4 份输出。MHA 每个查询头独占一组 K、V；GQA 每两个查询头共读一组；MQA 四个查询头共读同一组。">
  <title>三栏都是 4 个查询头，头数只为示意，不对应任何模型。箭头从一组 K、V 指向读它的查询头；每个查询头再用自己的 Q 打分、汇合，得到自己那一份输出，所以三栏都出 4 份输出。MHA 每个查询头独占一组 K、V；GQA 每两个查询头共读一组；MQA 四个查询头共读同一组。</title>
