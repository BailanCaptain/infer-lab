layout: scene
id: gqa
caption: 上排 16 个 Q 头、下排 8 个 K/V 头（Qwen3-0.6B 的真实头数），一格正好压住上面两格；下半张是算的时候这两个数怎么交给算子
size: [900, 660]

regions:
  - label: 一层里的头数：16 个 Q，8 个 K/V
    note: 两排一样长，因为每个头都是 128 维——GQA 砍的不是维度，是 K/V 的组数：16 组变 8 组。
    at: [20, 36]
    size: [860, 252]
    tone: neutral
  - label: 算的时候：两个数交给算子，Python 侧从没出现过 16 份 K/V
    note: 复制不是没发生，是发生在算子里面——昇腾自己写的多模态 encoder 那条路才真的 repeat_interleave。
    at: [20, 308]
    size: [860, 328]
    tone: ascend

brackets:
  - { at: [40, 138], span: 94, label: 2 个 Q 头共用一组, dir: up, tone: accent }

strips:
  - at: [40, 142]
    cells: 16
    cell: 46
    gap: 2
    h: 34
    highlights: [0, 1]
    tone: accent
    label: 16 个 Q 头 × 128 维，q_size = 2048
  - at: [40, 214]
    cells: 8
    cell: 94
    gap: 2
    h: 34
    highlights: [0]
    tone: ascend
    label: 8 个 K 头 + 8 个 V 头 × 128 维，kv_size = 1024

notes:
  - { at: [840, 194], text: 16 个 Q 头照样各算一遍，乘加次数没少, size: 12.5, anchor: end }
  - { at: [840, 266], text: 只有这一排进 KV Cache：4096 B／token／层, size: 12.5, anchor: end }
  - at: [60, 606]
    text: 16 和 8 这两个数一路传到算子入参为止，中间没有一步把 K/V 摊成 16 份：省的是字节数和读取量，不是乘加次数。
    size: 12.5
    width: 800
    strong: true

bands:
  - label: 缓存里就只有 8 个 KV 头
    sub: "(2, num_blocks, 128, 8, 128) —— 第四维那个 8 是 KV 头数，不是 16"
    fn: get_kv_cache_shape
    icon: grid
    at: [60, 386]
    size: [800, 50]
    tone: neutral
  - label: 取的时候 8 个头被压进最后一维
    sub: "key_cache.view(num_block, block_size, -1)：8 × 128 压成 1024"
    fn: _get_fia_params
    icon: layers
    at: [60, 444]
    size: [800, 50]
    tone: neutral
  - label: 算子按 num_key_value_heads 自己分组
