<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 540" width="900" height="540" role="img" aria-label="同为宽度 64 的两批通过五条判据对比：16×4 整齐 decode 命中整图 vs 混入 prefill 退回 eager" font-family="var(--font-sans)">
  <title>同宽 64 两批走过五条判据：16 条整齐 decode 命中 #64 整图 vs 混入 prefill 全组退 eager</title>
  <desc>Two batches both of total width 64 passing through the five GLM FULL_DECODE_ONLY gates including cross-DP minimum sync</desc>
  <defs>
    <marker id="fg-arr-teal" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="#087f73"/>
    </marker>
    <marker id="fg-arr-red" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="#b54237"/>
    </marker>
  </defs>

  <text x="16" y="28" font-size="16" font-weight="700" fill="#17211f">同为总宽 64 个 token，两批走过五条判据为何结局截然不同？</text>
  <text x="16" y="50" font-size="13.5" fill="#66716d">GLM 双机 FULL_DECODE_ONLY（MTP-3 每条 decode 占 1+3=4 位，7 档最大 128；总宽度相同 ≠ 共用同一张图）</text>

  <!-- Two Input Batches Visualized as Token Blocks -->
  <!-- Batch A -->
  <rect x="16" y="66" width="424" height="66" rx="7" fill="#ddf4ef" stroke="#087f73" stroke-width="1.4"/>
  <text x="28" y="88" font-size="14.5" font-weight="700" fill="#065f56">批次 A · 16 条整齐 decode（总宽 = 64）</text>
  <!-- 16 mini blocks of 4 -->
  <g fill="#087f73" opacity="0.88">
    <rect x="28" y="98" width="21" height="22" rx="3"/><rect x="52" y="98" width="21" height="22" rx="3"/>
    <rect x="76" y="98" width="21" height="22" rx="3"/><rect x="100" y="98" width="21" height="22" rx="3"/>
    <rect x="124" y="98" width="21" height="22" rx="3"/><rect x="148" y="98" width="21" height="22" rx="3"/>
    <rect x="172" y="98" width="21" height="22" rx="3"/><rect x="196" y="98" width="21" height="22" rx="3"/>
    <rect x="220" y="98" width="21" height="22" rx="3"/><rect x="244" y="98" width="21" height="22" rx="3"/>
    <rect x="268" y="98" width="21" height="22" rx="3"/><rect x="292" y="98" width="21" height="22" rx="3"/>
    <rect x="316" y="98" width="21" height="22" rx="3"/><rect x="340" y="98" width="21" height="22" rx="3"/>
    <rect x="364" y="98" width="21" height="22" rx="3"/><rect x="388" y="98" width="21" height="22" rx="3"/>
  </g>
  <text x="415" y="114" font-size="13.5" font-weight="700" fill="#065f56">×4</text>

  <!-- Batch B -->
  <rect x="460" y="66" width="424" height="66" rx="7" fill="#fff0e9" stroke="#b54237" stroke-width="1.4"/>
  <text x="472" y="88" font-size="14.5" font-weight="700" fill="#8f3229">批次 B · 14 条 decode + 1 段 prefill（总宽 = 64）</text>
  <g fill="#c78300" opacity="0.82">
    <rect x="472" y="98" width="19" height="22" rx="3"/><rect x="494" y="98" width="19" height="22" rx="3"/>
    <rect x="516" y="98" width="19" height="22" rx="3"/><rect x="538" y="98" width="19" height="22" rx="3"/>
    <rect x="560" y="98" width="19" height="22" rx="3"/><rect x="582" y="98" width="19" height="22" rx="3"/>
    <rect x="604" y="98" width="19" height="22" rx="3"/><rect x="626" y="98" width="19" height="22" rx="3"/>
    <rect x="648" y="98" width="19" height="22" rx="3"/><rect x="670" y="98" width="19" height="22" rx="3"/>
    <rect x="692" y="98" width="19" height="22" rx="3"/><rect x="714" y="98" width="19" height="22" rx="3"/>
    <rect x="736" y="98" width="19" height="22" rx="3"/><rect x="758" y="98" width="19" height="22" rx="3"/>
  </g>
  <rect x="782" y="98" width="90" height="22" rx="3" fill="#b54237"/>
  <text x="827" y="114" text-anchor="middle" font-size="13.5" font-weight="700" fill="#ffffff">prefill 8</text>

  <!-- 5 Gate Columns Header -->
  <g font-weight="700" text-anchor="middle">
    <rect x="16" y="152" width="166" height="44" rx="6" fill="#ece9df" stroke="#b8bcb5" stroke-width="1.2"/>
    <text x="99" y="172" font-size="14" fill="#17211f">闸门 1 · 阶段</text>
    <text x="99" y="190" font-size="13.5" font-weight="normal" fill="#4d5652">prefill 全算完？</text>

    <rect x="192" y="152" width="166" height="44" rx="6" fill="#ece9df" stroke="#b8bcb5" stroke-width="1.2"/>
    <text x="275" y="172" font-size="14" fill="#17211f">闸门 2 · 单条上限</text>
    <text x="275" y="190" font-size="13.5" font-weight="normal" fill="#4d5652">max_tok == 4？</text>

    <rect x="368" y="152" width="166" height="44" rx="6" fill="#ece9df" stroke="#b8bcb5" stroke-width="1.2"/>
    <text x="451" y="172" font-size="14" fill="#17211f">闸门 3 · 整齐度</text>
    <text x="451" y="190" font-size="13.5" font-weight="normal" fill="#4d5652">总宽 == 4×条数？</text>

    <rect x="544" y="152" width="166" height="44" rx="6" fill="#ece9df" stroke="#b8bcb5" stroke-width="1.2"/>
    <text x="627" y="172" font-size="14" fill="#17211f">闸门 4 · 最大档</text>
    <text x="627" y="190" font-size="13.5" font-weight="normal" fill="#4d5652">总宽 ≤ 128？</text>

    <rect x="720" y="152" width="164" height="44" rx="6" fill="#f7e7f2" stroke="#9a4b86" stroke-width="1.3"/>
    <text x="802" y="172" font-size="14" fill="#7a3a6a">闸门 5 · 跨 DP 取小</text>
    <text x="802" y="190" font-size="13.5" font-weight="normal" fill="#7a3a6a">min(DP0, DP1)</text>
  </g>

  <!-- Track A (Passes all 5 gates) -->
  <line x1="182" y1="242" x2="190" y2="242" stroke="#087f73" stroke-width="2" marker-end="url(#fg-arr-teal)"/>
  <line x1="358" y1="242" x2="366" y2="242" stroke="#087f73" stroke-width="2" marker-end="url(#fg-arr-teal)"/>
  <line x1="534" y1="242" x2="542" y2="242" stroke="#087f73" stroke-width="2" marker-end="url(#fg-arr-teal)"/>
  <line x1="710" y1="242" x2="718" y2="242" stroke="#087f73" stroke-width="2" marker-end="url(#fg-arr-teal)"/>

  <g>
    <rect x="16" y="210" width="166" height="64" rx="6" fill="#ddf4ef" stroke="#087f73" stroke-width="1.3"/>
    <text x="99" y="236" text-anchor="middle" font-size="14.5" font-weight="700" fill="#065f56">✓ A 通过</text>
    <text x="99" y="259" text-anchor="middle" font-size="13.5" fill="#4d5652">16 条均已完 prompt</text>

    <rect x="192" y="210" width="166" height="64" rx="6" fill="#ddf4ef" stroke="#087f73" stroke-width="1.3"/>
    <text x="275" y="236" text-anchor="middle" font-size="14.5" font-weight="700" fill="#065f56">✓ A 通过</text>
    <text x="275" y="259" text-anchor="middle" font-size="13.5" fill="#4d5652">单条最大 = 4</text>

    <rect x="368" y="210" width="166" height="64" rx="6" fill="#ddf4ef" stroke="#087f73" stroke-width="1.3"/>
    <text x="451" y="236" text-anchor="middle" font-size="14.5" font-weight="700" fill="#065f56">✓ A 通过</text>
    <text x="451" y="259" text-anchor="middle" font-size="13.5" fill="#4d5652">64 == 4 × 16</text>

    <rect x="544" y="210" width="166" height="64" rx="6" fill="#ddf4ef" stroke="#087f73" stroke-width="1.3"/>
    <text x="627" y="236" text-anchor="middle" font-size="14.5" font-weight="700" fill="#065f56">✓ A 通过</text>
    <text x="627" y="259" text-anchor="middle" font-size="13.5" fill="#4d5652">64 ≤ 128</text>

    <rect x="720" y="210" width="164" height="64" rx="6" fill="#087f73" stroke="#065f56" stroke-width="1.4"/>
    <text x="802" y="236" text-anchor="middle" font-size="14.5" font-weight="700" fill="#ffffff">命中整图 #64</text>
    <text x="802" y="259" text-anchor="middle" font-size="13.5" fill="#ddf4ef">min(FULL, FULL)</text>
  </g>

  <!-- Track B (Fails Gate 1, 2, 3 and drags DP1 down at Gate 5) -->
  <line x1="182" y1="328" x2="190" y2="328" stroke="#b54237" stroke-width="1.6" stroke-dasharray="4 3"/>
  <line x1="358" y1="328" x2="366" y2="328" stroke="#b54237" stroke-width="1.6" stroke-dasharray="4 3"/>
  <line x1="534" y1="328" x2="542" y2="328" stroke="#b54237" stroke-width="1.6" stroke-dasharray="4 3"/>
  <line x1="710" y1="328" x2="718" y2="328" stroke="#b54237" stroke-width="1.8" marker-end="url(#fg-arr-red)"/>

  <g>
    <rect x="16" y="294" width="166" height="72" rx="6" fill="#fff0e9" stroke="#b54237" stroke-width="1.6"/>
    <text x="99" y="320" text-anchor="middle" font-size="14.5" font-weight="700" fill="#8f3229">✗ B 首关拦截</text>
    <text x="99" y="341" text-anchor="middle" font-size="13.5" fill="#8f3229">含未完 prefill</text>
    <text x="99" y="359" text-anchor="middle" font-size="13.5" fill="#4d5652">（4 位尾块也拦）</text>

    <rect x="192" y="294" width="166" height="72" rx="6" fill="#fff0e9" stroke="#d88c82" stroke-width="1.2" stroke-dasharray="4 3"/>
    <text x="275" y="324" text-anchor="middle" font-size="14" font-weight="700" fill="#8f3229">✗ max = 8 &gt; 4</text>
    <text x="275" y="348" text-anchor="middle" font-size="13.5" fill="#4d5652">超单条解码宽</text>

    <rect x="368" y="294" width="166" height="72" rx="6" fill="#fff0e9" stroke="#d88c82" stroke-width="1.2" stroke-dasharray="4 3"/>
    <text x="451" y="324" text-anchor="middle" font-size="14" font-weight="700" fill="#8f3229">✗ 64 ≠ 4 × 15</text>
    <text x="451" y="348" text-anchor="middle" font-size="13.5" fill="#4d5652">并非每条都是 4</text>

    <rect x="544" y="294" width="166" height="72" rx="6" fill="#ece9df" stroke="#b8bcb5" stroke-width="1.2"/>
    <text x="627" y="324" text-anchor="middle" font-size="14" font-weight="700" fill="#4d5652">64 ≤ 128</text>
    <text x="627" y="348" text-anchor="middle" font-size="13.5" fill="#66716d">仅总宽够不顶用</text>

    <rect x="720" y="294" width="164" height="72" rx="6" fill="#b54237" stroke="#8f3229" stroke-width="1.4"/>
    <text x="802" y="322" text-anchor="middle" font-size="14.5" font-weight="700" fill="#ffffff">两组全退 eager</text>
    <text x="802" y="344" text-anchor="middle" font-size="13.5" fill="#fff0e9">min(NONE, FULL)</text>
    <text x="802" y="361" text-anchor="middle" font-size="13.5" fill="#fff0e9">= NONE · 不补齐</text>
  </g>

  <!-- Gate 1 safety note & Descriptor comparison -->
  <rect x="16" y="388" width="424" height="134" rx="7" fill="#fff4cf" stroke="#c78300" stroke-width="1.3"/>
  <text x="30" y="414" font-size="14.5" font-weight="700" fill="#936300">为什么闸门 1 必须看「计算进度」而非只看宽度？</text>
  <text x="30" y="440" font-size="13.5" fill="#4d5652">若一条请求的提示词尾块恰好剩下 4 个 token，宽度看起来</text>
  <text x="30" y="462" font-size="13.5" fill="#4d5652">与 1+3 投机 decode 完全整齐，但它尚未完成 prefill。</text>
  <text x="22" y="486" font-size="12" font-weight="700" fill="#8f3229">放进 decode 整图会读到未刷新的补齐缓冲，混入别请求遗留数据。</text>
  <text x="30" y="508" font-size="13.5" fill="#4d5652">因此投机分支必须先核 computed_tokens ≥ prompt_len。</text>

  <rect x="460" y="388" width="424" height="134" rx="7" fill="#e8edff" stroke="#4c65b6" stroke-width="1.3"/>
  <text x="474" y="414" font-size="14.5" font-weight="700" fill="#3a4f93">BatchDescriptor 匹配键（不止看 num_tokens = 64）</text>
  <rect x="474" y="428" width="396" height="36" rx="5" fill="#ddf4ef" stroke="#087f73" stroke-width="1.2"/>
  <text x="482" y="450" font-size="12" font-family="var(--font-mono)" fill="#065f56">A: (tok=64, req=16, uniform=True, lora=F) → HIT #64</text>
  <rect x="474" y="472" width="396" height="36" rx="5" fill="#fff0e9" stroke="#b54237" stroke-width="1.2"/>
  <text x="482" y="494" font-size="12" font-family="var(--font-mono)" fill="#8f3229">B: (tok=64, req=15, uniform=False) → MISS → NONE</text>
</svg>
