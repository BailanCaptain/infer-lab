<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 560" width="900" height="560" role="img" aria-label="图模式三件事拆解：FX 切分、编译后端与五档运行期分派" font-family="var(--font-sans)">
  <title>图模式三件事拆解：FX 图切分（splitting_ops）、AscendCompiler 编译路由与五档运行期分派</title>
  <desc>Separates FX splitting_ops, AscendCompiler backend routing, and runtime dispatch across NONE, PIECEWISE, FULL_AND_PIECEWISE, FULL_DECODE_ONLY, and FULL modes</desc>
  <defs>
    <marker id="gm-arr-ink" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="#4d5652"/>
    </marker>
    <marker id="gm-arr-teal" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="#087f73"/>
    </marker>
    <marker id="gm-arr-indigo" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="#4c65b6"/>
    </marker>
  </defs>

  <!-- Section 1: FX Graph Split & Compiler Routing -->
  <text x="16" y="28" font-size="16" font-weight="700" fill="#17211f">① 编译期 FX 切分（splitting_ops）与昇腾编译路由（AscendCompiler）</text>
  <text x="884" y="28" text-anchor="end" font-size="13.5" fill="#66716d">捕获范围 ≠ 编译结构 ≠ 单轮分派</text>

  <!-- Lane A: Piecewise Compilation -->
  <rect x="16" y="44" width="166" height="72" rx="6" fill="#fff0e9" stroke="#b54237" stroke-width="1.3"/>
  <text x="99" y="72" text-anchor="middle" font-size="14.5" font-weight="700" fill="#8f3229">分段编译路线</text>
  <text x="99" y="96" text-anchor="middle" font-size="13.5" font-family="var(--font-mono)" fill="#4d5652">PIECEWISE / F+P</text>

  <line x1="184" y1="80" x2="208" y2="80" stroke="#4c65b6" stroke-width="1.6" marker-end="url(#gm-arr-indigo)"/>

  <rect x="212" y="48" width="102" height="64" rx="6" fill="#ddf4ef" stroke="#087f73" stroke-width="1.3"/>
  <text x="263" y="74" text-anchor="middle" font-size="14" font-weight="700" fill="#065f56">子图 1</text>
  <text x="263" y="96" text-anchor="middle" font-size="13.5" fill="#4d5652">Norm / QKV</text>

  <line x1="316" y1="80" x2="332" y2="80" stroke="#4d5652" stroke-width="1.5" marker-end="url(#gm-arr-ink)"/>

  <rect x="336" y="48" width="166" height="64" rx="6" fill="#fff0e9" stroke="#b54237" stroke-width="1.4" stroke-dasharray="5 3"/>
  <text x="419" y="74" text-anchor="middle" font-size="14" font-weight="700" fill="#8f3229">Attention 切口</text>
  <text x="419" y="96" text-anchor="middle" font-size="13.5" fill="#8f3229">unified / mla / dsa</text>

  <line x1="504" y1="80" x2="520" y2="80" stroke="#4d5652" stroke-width="1.5" marker-end="url(#gm-arr-ink)"/>

  <rect x="524" y="48" width="102" height="64" rx="6" fill="#ddf4ef" stroke="#087f73" stroke-width="1.3"/>
  <text x="575" y="74" text-anchor="middle" font-size="14" font-weight="700" fill="#065f56">子图 2</text>
  <text x="575" y="96" text-anchor="middle" font-size="13.5" fill="#4d5652">OProj / MLP</text>

  <line x1="628" y1="80" x2="654" y2="80" stroke="#4c65b6" stroke-width="1.6" marker-end="url(#gm-arr-indigo)"/>

  <rect x="658" y="44" width="226" height="72" rx="6" fill="#e8edff" stroke="#4c65b6" stroke-width="1.4"/>
  <text x="771" y="72" text-anchor="middle" font-size="14.5" font-weight="700" fill="#3a4f93">fusion_pass_compile</text>
  <text x="771" y="96" text-anchor="middle" font-size="13.5" fill="#4d5652">主动关闭 npugraph_ex</text>

  <!-- Lane B: Full Compilation -->
  <rect x="16" y="132" width="166" height="72" rx="6" fill="#ddf4ef" stroke="#087f73" stroke-width="1.4"/>
  <text x="99" y="160" text-anchor="middle" font-size="14.5" font-weight="700" fill="#065f56">纯整图编译路线</text>
  <text x="99" y="184" text-anchor="middle" font-size="13.5" font-family="var(--font-mono)" fill="#4d5652">FULL / FULL_DEC</text>

  <line x1="184" y1="168" x2="208" y2="168" stroke="#087f73" stroke-width="1.6" marker-end="url(#gm-arr-teal)"/>

  <rect x="212" y="136" width="414" height="64" rx="6" fill="#ddf4ef" stroke="#087f73" stroke-width="1.5"/>
  <text x="419" y="162" text-anchor="middle" font-size="14.5" font-weight="700" fill="#065f56">整段 FX 单图（主动清空 splitting_ops = []）</text>
  <text x="419" y="185" text-anchor="middle" font-size="13.5" fill="#4d5652">Norm → QKV → Attention → OProj → MLP / MoE 连续不切口</text>

  <line x1="628" y1="168" x2="654" y2="168" stroke="#087f73" stroke-width="1.6" marker-end="url(#gm-arr-teal)"/>

  <rect x="658" y="132" width="226" height="72" rx="6" fill="#f7e7f2" stroke="#9a4b86" stroke-width="1.4"/>
  <text x="771" y="153" text-anchor="middle" font-size="13.5" font-weight="700" fill="#7a3a6a">默认 ex=True → npugraph_ex</text>
  <text x="771" y="174" text-anchor="middle" font-size="13.5" font-weight="700" fill="#3a4f93">显式 ex=False → fusion_pass</text>
  <text x="771" y="195" text-anchor="middle" font-size="13.5" fill="#4d5652">缺包退 torchair；可叠 static</text>

  <!-- Divider -->
  <line x1="16" y1="224" x2="884" y2="224" stroke="#b8bcb5" stroke-width="1.4" stroke-dasharray="6 4"/>

  <!-- Section 2: Runtime Dispatch Matrix (5 modes x 2 batch types) -->
  <text x="16" y="252" font-size="16" font-weight="700" fill="#17211f">② 运行期五档分派：整齐 decode 轮 vs 混入 prefill 轮（FULL 与 FULL_DECODE_ONLY 行为不同）</text>

  <!-- Column headers -->
  <rect x="16" y="268" width="214" height="34" rx="5" fill="#ece9df" stroke="#b8bcb5" stroke-width="1.2"/>
  <text x="123" y="290" text-anchor="middle" font-size="14" font-weight="700" fill="#17211f">cudagraph_mode</text>

  <rect x="238" y="268" width="206" height="34" rx="5" fill="#ece9df" stroke="#b8bcb5" stroke-width="1.2"/>
  <text x="341" y="290" text-anchor="middle" font-size="14" font-weight="700" fill="#17211f">整齐 decode 轮</text>

  <rect x="452" y="268" width="228" height="34" rx="5" fill="#ece9df" stroke="#b8bcb5" stroke-width="1.2"/>
  <text x="566" y="290" text-anchor="middle" font-size="14" font-weight="700" fill="#17211f">混合批 / prefill 轮</text>

  <rect x="688" y="268" width="196" height="34" rx="5" fill="#ece9df" stroke="#b8bcb5" stroke-width="1.2"/>
  <text x="786" y="290" text-anchor="middle" font-size="14" font-weight="700" fill="#17211f">FX 切分与编译</text>

  <!-- Row 1: NONE -->
  <rect x="16" y="308" width="214" height="34" rx="4" fill="#f7f5ef" stroke="#d8d8cf" stroke-width="1.1"/>
  <text x="28" y="330" font-size="13.5" font-weight="700" font-family="var(--font-mono)" fill="#4d5652">NONE</text>
  <rect x="238" y="308" width="206" height="34" rx="4" fill="#fff0e9" stroke="#d88c82" stroke-width="1.1"/>
  <text x="341" y="330" text-anchor="middle" font-size="13.5" fill="#8f3229">eager 逐算子</text>
  <rect x="452" y="308" width="228" height="34" rx="4" fill="#fff0e9" stroke="#d88c82" stroke-width="1.1"/>
  <text x="566" y="330" text-anchor="middle" font-size="13.5" fill="#8f3229">eager 逐算子</text>
  <rect x="688" y="308" width="196" height="34" rx="4" fill="#f7f5ef" stroke="#d8d8cf" stroke-width="1.1"/>
  <text x="786" y="330" text-anchor="middle" font-size="13.5" fill="#4d5652">连编译一并关闭</text>

  <!-- Row 2: PIECEWISE -->
  <rect x="16" y="346" width="214" height="34" rx="4" fill="#f7f5ef" stroke="#d8d8cf" stroke-width="1.1"/>
  <text x="28" y="368" font-size="13.5" font-weight="700" font-family="var(--font-mono)" fill="#3a4f93">PIECEWISE</text>
  <rect x="238" y="346" width="206" height="34" rx="4" fill="#fff4cf" stroke="#c78300" stroke-width="1.1"/>
  <text x="341" y="368" text-anchor="middle" font-size="13.5" fill="#936300">分段图（切口 eager）</text>
  <rect x="452" y="346" width="228" height="34" rx="4" fill="#fff4cf" stroke="#c78300" stroke-width="1.1"/>
  <text x="566" y="368" text-anchor="middle" font-size="13.5" fill="#936300">分段图（切口 eager）</text>
  <rect x="688" y="346" width="196" height="34" rx="4" fill="#e8edff" stroke="#4c65b6" stroke-width="1.1"/>
  <text x="786" y="368" text-anchor="middle" font-size="13.5" fill="#3a4f93">分段 FX · 本地 pass</text>

  <!-- Row 3: FULL_AND_PIECEWISE -->
  <rect x="16" y="384" width="214" height="34" rx="4" fill="#f7f5ef" stroke="#d8d8cf" stroke-width="1.1"/>
  <text x="28" y="406" font-size="13.5" font-weight="700" font-family="var(--font-mono)" fill="#3a4f93">FULL_AND_PIECEWISE</text>
  <rect x="238" y="384" width="206" height="34" rx="4" fill="#ddf4ef" stroke="#087f73" stroke-width="1.2"/>
  <text x="341" y="406" text-anchor="middle" font-size="13.5" font-weight="700" fill="#065f56">整图回放 (FULL)</text>
  <rect x="452" y="384" width="228" height="34" rx="4" fill="#fff4cf" stroke="#c78300" stroke-width="1.2"/>
  <text x="566" y="406" text-anchor="middle" font-size="13.5" fill="#936300">分段回放 (PIECEWISE)</text>
  <rect x="688" y="384" width="196" height="34" rx="4" fill="#e8edff" stroke="#4c65b6" stroke-width="1.1"/>
  <text x="786" y="406" text-anchor="middle" font-size="13.5" fill="#3a4f93">分段 FX（默认 O2）</text>

  <!-- Row 4: FULL_DECODE_ONLY -->
  <rect x="16" y="422" width="214" height="34" rx="4" fill="#ddf4ef" stroke="#087f73" stroke-width="1.3"/>
  <text x="28" y="444" font-size="13.5" font-weight="700" font-family="var(--font-mono)" fill="#065f56">FULL_DECODE_ONLY</text>
  <rect x="238" y="422" width="206" height="34" rx="4" fill="#ddf4ef" stroke="#087f73" stroke-width="1.3"/>
  <text x="341" y="444" text-anchor="middle" font-size="13.5" font-weight="700" fill="#065f56">整图回放 (FULL)</text>
  <rect x="452" y="422" width="228" height="34" rx="4" fill="#fff0e9" stroke="#b54237" stroke-width="1.4"/>
  <text x="566" y="444" text-anchor="middle" font-size="13.5" font-weight="700" fill="#8f3229">仅此档：混 prefill 退 eager</text>
  <rect x="688" y="422" width="196" height="34" rx="4" fill="#f7e7f2" stroke="#9a4b86" stroke-width="1.2"/>
  <text x="786" y="444" text-anchor="middle" font-size="13.5" fill="#7a3a6a">清空切分 · 按 ex 开关</text>

  <!-- Row 5: FULL -->
  <rect x="16" y="460" width="214" height="34" rx="4" fill="#ddf4ef" stroke="#087f73" stroke-width="1.3"/>
  <text x="28" y="482" font-size="13.5" font-weight="700" font-family="var(--font-mono)" fill="#065f56">FULL</text>
  <rect x="238" y="460" width="206" height="34" rx="4" fill="#ddf4ef" stroke="#087f73" stroke-width="1.3"/>
  <text x="341" y="482" text-anchor="middle" font-size="13.5" font-weight="700" fill="#065f56">整图回放 (FULL)</text>
  <rect x="452" y="460" width="228" height="34" rx="4" fill="#ddf4ef" stroke="#087f73" stroke-width="1.4"/>
  <text x="566" y="482" text-anchor="middle" font-size="13.5" font-weight="700" fill="#065f56">整图回放（后端支持混合批）</text>
  <rect x="688" y="460" width="196" height="34" rx="4" fill="#f7e7f2" stroke="#9a4b86" stroke-width="1.2"/>
  <text x="786" y="482" text-anchor="middle" font-size="13.5" fill="#7a3a6a">清空切分 · 按 ex 开关</text>

  <!-- Bottom note strip -->
  <rect x="16" y="508" width="868" height="40" rx="6" fill="#ece9df" stroke="#b8bcb5" stroke-width="1.2"/>
  <text x="30" y="533" font-size="13.5" fill="#17211f"><tspan font-weight="700" fill="#8f3229">排障注意：</tspan><tspan font-family="var(--font-mono)">--enforce-eager</tspan> 与 <tspan font-family="var(--font-mono)">NONE</tspan> 会同时关掉编译与捕获；仅关 <tspan font-family="var(--font-mono)">npugraph_ex</tspan> 会改走本地 pass，二者并非同一控制变量。</text>
</svg>
