<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 454" width="900" height="454" role="img" aria-label="图模式三层分工与 Xlite 按本步最大 DP 位置数分派预算标尺" font-family="var(--font-sans)">
  <title>昇腾图栈三层分工与 Xlite 预算分派标尺（decode-only 为什么也能跑小 prefill）</title>
  <desc>Three-layer graph stack (torch.compile, AscendCompiler, ACLGraphWrapper) alongside Xlite v0.28+ per-step max-DP token budget bar</desc>
  <defs>
    <marker id="xl-arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="#4d5652"/>
    </marker>
  </defs>

  <!-- Left: 3-Layer Stack -->
  <text x="16" y="28" font-size="16" font-weight="700" fill="#17211f">① 原生图栈三层分工（互不替代）</text>

  <rect x="16" y="48" width="388" height="78" rx="7" fill="#e8edff" stroke="#4c65b6" stroke-width="1.4"/>
  <circle cx="38" cy="74" r="12" fill="#4c65b6"/>
  <text x="38" y="79" text-anchor="middle" font-size="13.5" font-weight="700" fill="#ffffff">1</text>
  <text x="58" y="79" font-size="15" font-weight="700" fill="#3a4f93">上游 torch.compile 分段框架</text>
  <text x="30" y="108" font-size="13" fill="#4d5652">PIECEWISE 按 splitting_ops 切开；FULL 清空切分表</text>

  <line x1="210" y1="128" x2="210" y2="152" stroke="#4d5652" stroke-width="1.7" marker-end="url(#xl-arr)"/>

  <rect x="16" y="156" width="388" height="92" rx="7" fill="#f7e7f2" stroke="#9a4b86" stroke-width="1.4"/>
  <circle cx="38" cy="182" r="12" fill="#9a4b86"/>
  <text x="38" y="187" text-anchor="middle" font-size="13.5" font-weight="700" fill="#ffffff">2</text>
  <text x="58" y="187" font-size="15" font-weight="700" fill="#7a3a6a">昇腾 AscendCompiler（改算什么）</text>
  <text x="30" y="213" font-size="13.5" fill="#4d5652">开：npugraph_ex（ImportError 退 torchair）</text>
  <text x="30" y="235" font-size="13.5" fill="#4d5652">关：fusion_pass_compile（仍做本地 FX 融合）</text>

  <line x1="210" y1="250" x2="210" y2="274" stroke="#4d5652" stroke-width="1.7" marker-end="url(#xl-arr)"/>

  <rect x="16" y="278" width="388" height="84" rx="7" fill="#ddf4ef" stroke="#087f73" stroke-width="1.4"/>
  <circle cx="38" cy="304" r="12" fill="#087f73"/>
  <text x="38" y="309" text-anchor="middle" font-size="13.5" font-weight="700" fill="#ffffff">3</text>
  <text x="58" y="309" font-size="15" font-weight="700" fill="#065f56">ACLGraphWrapper（改怎么提交）</text>
  <text x="30" y="335" font-size="13.5" fill="#4d5652">启动期按固定宽度从大到小录图，运行期单次提交</text>
  <text x="30" y="354" font-size="13.5" fill="#065f56">服务期遇未录形状直接拒绝，绝不临时补录</text>

  <!-- Vertical divider -->
  <line x1="426" y1="16" x2="426" y2="372" stroke="#b8bcb5" stroke-width="1.4" stroke-dasharray="6 4"/>

  <!-- Right: Xlite Parallel Path & Token Budget Ruler -->
  <text x="448" y="28" font-size="15.5" font-weight="700" fill="#17211f">② 旁路 Xlite（v0.28+ 按本步最大 DP 位置数分派）</text>

  <!-- Formula box -->
  <rect x="448" y="48" width="436" height="72" rx="7" fill="#fff4cf" stroke="#c78300" stroke-width="1.3"/>
  <text x="462" y="74" font-size="14.5" font-weight="700" fill="#936300">decode-only 预算 = 向上补齐到 TP 倍数</text>
  <text x="462" y="102" font-size="12.5" font-family="var(--font-mono)" fill="#17211f">min(max_batched, N×(1+k)) → 32×(1+3)=128 (TP=8)</text>

  <!-- Number line ruler: 0 to 160 -->
  <text x="448" y="139" font-size="13.5" font-weight="700" fill="#17211f">示意对比：预算线 = 128 token</text>
  <text x="448" y="157" font-size="12.5" fill="#4d5652">（只看单步最大 rank，不按阶段排除 prefill）</text>

  <!-- Ruler track -->
  <rect x="448" y="166" width="320" height="32" rx="4" fill="#ddf4ef" stroke="#087f73" stroke-width="1.3"/>
  <text x="608" y="187" text-anchor="middle" font-size="13.5" font-weight="700" fill="#065f56">≤ 128 → 交给 Xlite runtime（含小 prefill）</text>
  <rect x="770" y="166" width="114" height="32" rx="4" fill="#fff0e9" stroke="#b54237" stroke-width="1.3"/>
  <text x="827" y="187" text-anchor="middle" font-size="13.5" font-weight="700" fill="#8f3229">&gt; 128 退原生</text>

  <!-- Budget threshold vertical line at x=768 (128 = 320px -> 2.5px/tok) -->
  <line x1="768" y1="162" x2="768" y2="334" stroke="#b54237" stroke-width="1.8" stroke-dasharray="5 3"/>
  <text x="768" y="350" text-anchor="middle" font-size="13.5" font-weight="700" fill="#8f3229">预算线 128</text>

  <!-- Bar 1: Case 1 (DP0=80, DP1=120 -> max=120 <= 128 -> Xlite!) -->
  <text x="448" y="222" font-size="13" font-weight="700" fill="#065f56">情形 A：DP0=80，DP1=120（含小 prefill）→ 取最大 120</text>
  <rect x="448" y="230" width="200" height="16" rx="3" fill="#4c65b6" opacity="0.65"/>
  <text x="654" y="243" font-size="13.5" fill="#3a4f93">DP0: 80</text>
  <rect x="448" y="250" width="300" height="18" rx="3" fill="#087f73"/>
  <text x="598" y="264" text-anchor="middle" font-size="13.5" font-weight="700" fill="#ffffff">max = 120 ≤ 128 ✓ 进 Xlite</text>

  <!-- Bar 2: Case 2 (Some rank = 160 -> > 128 -> fallback!) -->
  <text x="448" y="296" font-size="13" font-weight="700" fill="#8f3229">情形 B：任一 DP rank 达 160 → 超出 128</text>
  <rect x="448" y="304" width="400" height="22" rx="3" fill="#b54237"/>
  <text x="648" y="320" text-anchor="middle" font-size="13.5" font-weight="700" fill="#ffffff">max = 160 &gt; 128 → 回原生 runnable</text>

  <!-- Bottom note strip -->
  <rect x="16" y="382" width="868" height="58" rx="6" fill="#ece9df" stroke="#b8bcb5" stroke-width="1.2"/>
  <text x="30" y="405" font-size="13" fill="#17211f"><tspan font-weight="700" fill="#7a3a6a">注意边界：</tspan>Xlite 预算限制的是<tspan font-weight="700">本步单 rank 最大位置数</tspan>（非历史上下文长度，非跨 DP 相加）；</text>
  <text x="30" y="427" font-size="13" fill="#4d5652">v0.28 前旧镜像仍按 attention state 排除 prefill。</text>
</svg>
