<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 540" width="820" height="540" role="img" aria-label="A0 先选定设备、建立通信与执行环境，才进入 A1 请求入口；失败分支停在设备检查，图中是固定 GLM 执行侧的依赖顺序。">
  <title>A0 先选定设备、建立通信与执行环境，才进入 A1 请求入口；失败分支停在设备检查，图中是固定 GLM 执行侧的依赖顺序。</title>
  <defs><marker id="hardware-device-startup-ah-ink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="var(--color-ink, #17211f)"/></marker></defs>
  <path d="M265 105 L265 140" fill="none" stroke="var(--color-ink, #17211f)" stroke-width="1.4" marker-end="url(#hardware-device-startup-ah-ink)"/>
  <path d="M495 172 L550 172" fill="none" stroke="var(--color-ink, #17211f)" stroke-width="1.4" marker-end="url(#hardware-device-startup-ah-ink)"/>
  <path d="M265 204 L265 240" fill="none" stroke="var(--color-ink, #17211f)" stroke-width="1.4" marker-end="url(#hardware-device-startup-ah-ink)"/>
  <path d="M265 304 L265 340" fill="none" stroke="var(--color-ink, #17211f)" stroke-width="1.4" marker-end="url(#hardware-device-startup-ah-ink)"/>
  <path d="M265 404 L265 440" fill="none" stroke="var(--color-ink, #17211f)" stroke-width="1.4" marker-end="url(#hardware-device-startup-ah-ink)"/>
  <rect x="35" y="45" width="460" height="60" rx="8" fill="var(--color-surface-sunken, #ece9df)" stroke="var(--color-ink, #17211f)" stroke-width="1.5"/>
  <text x="265" y="71" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="14" font-weight="700" fill="var(--color-ink, #17211f)" text-anchor="middle">A0 · 读取平台与可见设备配置</text>
  <text x="265" y="90" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="13" font-weight="400" fill="var(--color-ink, #17211f)" text-anchor="middle">确定 NPU 设备类型和本机可见范围</text>
  <rect x="35" y="140" width="460" height="64" rx="8" fill="var(--color-kv, #4c65b6)" stroke="var(--color-ink, #17211f)" stroke-width="1.5"/>
  <text x="265" y="168" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="14" font-weight="700" fill="var(--color-ink-inverse, #ffffff)" text-anchor="middle">选择设备并检查启动显存</text>
  <text x="265" y="187" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="13" font-weight="400" fill="var(--color-ink-inverse, #ffffff)" text-anchor="middle">本地编号映射 → 绑定设备 → 读取内存快照</text>
  <rect x="550" y="140" width="230" height="64" rx="8" fill="var(--color-surface-sunken, #ece9df)" stroke="var(--color-control, #66716d)" stroke-opacity="0.4" stroke-width="1.5" stroke-dasharray="5 4"/>
  <text x="665" y="168" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="13" font-weight="400" fill="#4d5652" text-anchor="middle">初始化退出</text>
  <text x="665" y="187" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="13" font-weight="400" fill="#4d5652" text-anchor="middle">编号越界或空闲显存不足</text>
  <rect x="35" y="240" width="460" height="64" rx="8" fill="var(--color-comm, #9a4b86)" stroke="var(--color-ink, #17211f)" stroke-width="1.5"/>
  <text x="265" y="268" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="14" font-weight="700" fill="var(--color-ink-inverse, #ffffff)" text-anchor="middle">建立 HCCL 与模型并行组</text>
  <text x="265" y="287" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="13" font-weight="400" fill="var(--color-ink-inverse, #ffffff)" text-anchor="middle">决定本设备和哪些参与者协作</text>
  <rect x="35" y="340" width="460" height="64" rx="8" fill="var(--color-surface-sunken, #ece9df)" stroke="var(--color-ink, #17211f)" stroke-width="1.5"/>
  <text x="265" y="368" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="14" font-weight="700" fill="var(--color-ink, #17211f)" text-anchor="middle">创建 ModelRunner</text>
  <text x="265" y="387" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="13" font-weight="400" fill="var(--color-ink, #17211f)" text-anchor="middle">设备已就绪，执行组件才能引用它</text>
  <rect x="35" y="440" width="460" height="64" rx="8" fill="var(--color-surface-sunken, #ece9df)" stroke="var(--color-ink, #17211f)" stroke-width="1.5"/>
  <text x="265" y="468" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="14" font-weight="700" fill="var(--color-ink, #17211f)" text-anchor="middle">完成权重、状态池与预热 → A1</text>
  <text x="265" y="487" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="13" font-weight="400" fill="var(--color-ink, #17211f)" text-anchor="middle">此后才能接收请求并进入逐轮执行</text>
  <text x="517" y="128" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="13.5" font-weight="400" fill="var(--color-ink-muted, #66716d)" font-style="italic">失败</text>
  <text x="284" y="226" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="13.5" font-weight="400" fill="var(--color-ink-muted, #66716d)" font-style="italic">通过</text>
  <text x="555" y="285" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="13.5" font-weight="700" fill="var(--color-ink, #17211f)">主机负责组织</text>
  <text x="555" y="318" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="13.5" font-weight="400" fill="var(--color-ink-muted, #66716d)" font-style="italic">设备负责存储与计算</text>
</svg>
