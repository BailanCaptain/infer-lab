<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 540" width="900" height="540" role="img" aria-label="v0.30.0 昇腾四族硬件 Die 到逻辑 Device 拓扑与软件能力档案全景图" font-family="var(--font-sans)">
  <title>v0.30.0 昇腾四族硬件（HardwareProfile）硅片结构与软件能力全景</title>
  <desc>AscendDeviceType, HardwareProfile, NPUWorker310, FORCE_NZ, FP8_OPTIMIZED, CANN_MEGAMOE_MXFP, FP8_ATTENTION, NPUGRAPH_EX</desc>
  <defs>
    <marker id="h4-arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 1.5 L 8.5 5 L 0 8.5 z" fill="#4d5652"/>
    </marker>
    <marker id="h4-arr-t" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 1.5 L 8.5 5 L 0 8.5 z" fill="#087f73"/>
    </marker>
  </defs>

  <text x="16" y="28" font-size="16" font-weight="700" fill="#17211f">物理硅片 → 逻辑 Device 结构</text>
  <text x="276" y="28" font-size="16" font-weight="700" fill="#17211f">家族识别与 Profile 路由</text>
  <text x="580" y="28" font-size="16" font-weight="700" fill="#17211f">精度、图编译与互联契约</text>
  <line x1="12" y1="38" x2="888" y2="38" stroke="#b8bcb5" stroke-width="1.5"/>

  <!-- Row 1: Atlas A2 (y=48..162) -->
  <rect x="12" y="48" width="876" height="112" rx="9" fill="#ddf4ef" fill-opacity="0.45" stroke="#087f73" stroke-width="1.5"/>
  <!-- Physical Card -> 1 Die -> 1 Device silhouette -->
  <rect x="24" y="62" width="114" height="82" rx="7" fill="#ffffff" stroke="#087f73" stroke-width="1.5"/>
  <text x="81" y="81" text-anchor="middle" font-size="13.5" font-weight="700" fill="#065f56">1 物理板卡</text>
  <rect x="38" y="90" width="86" height="44" rx="5" fill="#ddf4ef" stroke="#087f73" stroke-width="1.4"/>
  <text x="81" y="117" text-anchor="middle" font-family="var(--font-mono)" font-size="13.5" font-weight="700" fill="#065f56">1 Die</text>
  <line x1="140" y1="104" x2="164" y2="104" stroke="#087f73" stroke-width="1.8" marker-end="url(#h4-arr-t)"/>
  <rect x="168" y="84" width="88" height="40" rx="6" fill="#ffffff" stroke="#087f73" stroke-width="1.4"/>
  <text x="212" y="109" text-anchor="middle" font-family="var(--font-mono)" font-size="13.5" font-weight="700" fill="#065f56">davinci0</text>

  <text x="276" y="76" font-size="15" font-weight="700" fill="#065f56">1. Atlas A2（910B · 码 220..225）</text>
  <text x="276" y="102" font-size="13.5" fill="#17211f">单芯直通（DIRECT）· 8 卡 = 8 Device</text>
  <text x="276" y="126" font-size="13.5" fill="#4d5652">默认 pip wheel · 标准 NPUWorker</text>
  <text x="276" y="149" font-size="13.5" fill="#66716d">TOPO_AFFINITY 绑核 · 64 GB/卡典型</text>

  <line x1="566" y1="58" x2="566" y2="150" stroke="#79aaa1" stroke-width="1.2" stroke-dasharray="4 3"/>
  <text x="580" y="76" font-size="14" font-weight="700" fill="#065f56">✓ BF16 / INT8 W8A8 / npugraph_ex</text>
  <text x="580" y="102" font-size="13.5" fill="#8f3229">原生分块 FP8 v0.30 回退 BF16 反量化</text>
  <text x="580" y="126" font-size="13.5" fill="#4d5652">800T A2 机内 7 链 HCCS · 层级 MC2</text>
  <text x="580" y="149" font-size="13.5" fill="#66716d">Qwen3-8B 单卡 TP1；30B-A3B 推 2~4 卡</text>

  <!-- Row 2: Atlas A3 (y=170..284) -->
  <rect x="12" y="170" width="876" height="112" rx="9" fill="#fff4cf" fill-opacity="0.45" stroke="#c78300" stroke-width="1.5"/>
  <!-- Physical Card -> 2 Dies -> 2 Devices silhouette -->
  <rect x="24" y="182" width="114" height="88" rx="7" fill="#ffffff" stroke="#c78300" stroke-width="1.5"/>
  <text x="81" y="200" text-anchor="middle" font-size="13.5" font-weight="700" fill="#936300">1 双芯卡</text>
  <rect x="34" y="208" width="94" height="25" rx="4" fill="#fff4cf" stroke="#c78300" stroke-width="1.3"/>
  <text x="81" y="226" text-anchor="middle" font-family="var(--font-mono)" font-size="13.5" font-weight="700" fill="#936300">Die 0</text>
  <rect x="34" y="238" width="94" height="25" rx="4" fill="#fff4cf" stroke="#c78300" stroke-width="1.3"/>
  <text x="81" y="256" text-anchor="middle" font-family="var(--font-mono)" font-size="13.5" font-weight="700" fill="#936300">Die 1</text>
  <line x1="140" y1="220" x2="164" y2="212" stroke="#c78300" stroke-width="1.6" marker-end="url(#h4-arr)"/>
  <line x1="140" y1="250" x2="164" y2="254" stroke="#c78300" stroke-width="1.6" marker-end="url(#h4-arr)"/>
  <rect x="168" y="192" width="88" height="32" rx="5" fill="#ffffff" stroke="#c78300" stroke-width="1.3"/>
  <text x="212" y="213" text-anchor="middle" font-family="var(--font-mono)" font-size="13.5" font-weight="700" fill="#936300">davinci0</text>
  <rect x="168" y="232" width="88" height="32" rx="5" fill="#ffffff" stroke="#c78300" stroke-width="1.3"/>
  <text x="212" y="253" text-anchor="middle" font-family="var(--font-mono)" font-size="13.5" font-weight="700" fill="#936300">davinci1</text>

  <text x="276" y="198" font-size="15" font-weight="700" fill="#936300">2. Atlas A3（双 Die · 码 250..256）</text>
  <text x="276" y="224" font-size="13.5" fill="#17211f">DUAL_CHIP_CARD · 8 模组 = 16 Device</text>
  <text x="276" y="248" font-size="13.5" fill="#4d5652">按 npu//2 寻卡；容器须成对挂 2k, 2k+1</text>
  <text x="276" y="271" font-size="13.5" fill="#66716d">镜像 :v0.30.0-a3 · 含 SuperPoD 超节点</text>

  <line x1="566" y1="180" x2="566" y2="272" stroke="#d8b882" stroke-width="1.2" stroke-dasharray="4 3"/>
  <text x="580" y="198" font-size="14" font-weight="700" fill="#936300">✓ 继承 A2 能力 + CANN_MEGAMOE</text>
  <text x="580" y="224" font-size="13.5" fill="#4d5652">支持 fullmesh_v2 与 RMS_NORM_CAST</text>
  <text x="580" y="248" font-size="13.5" fill="#4d5652">MemFabric / MemCache 超节点池化实践</text>
  <text x="580" y="271" font-size="13.5" fill="#66716d">1 张双芯卡即提供 2×64 GB 跑 30B TP2</text>

  <!-- Row 3: Atlas 300I DUO (310P) (y=292..406) -->
  <rect x="12" y="292" width="876" height="112" rx="9" fill="#fff0e9" fill-opacity="0.55" stroke="#b54237" stroke-width="1.5"/>
  <!-- 310P compact card + FORCE_NZ badge -->
  <rect x="24" y="306" width="114" height="82" rx="7" fill="#ffffff" stroke="#b54237" stroke-width="1.5"/>
  <text x="81" y="328" text-anchor="middle" font-family="var(--font-mono)" font-size="13.5" font-weight="700" fill="#8f3229">310P</text>
  <rect x="34" y="338" width="94" height="22" rx="4" fill="#fff0e9" stroke="#b54237" stroke-width="1.2"/>
  <text x="81" y="354" text-anchor="middle" font-family="var(--font-mono)" font-size="13.5" font-weight="700" fill="#8f3229">FORCE_NZ</text>
  <text x="81" y="381" text-anchor="middle" font-size="13.5" fill="#8f3229">FP16 / INT8</text>
  <rect x="168" y="316" width="88" height="62" rx="6" fill="#fff0e9" stroke="#b54237" stroke-width="1.4" stroke-dasharray="4 3"/>
  <text x="212" y="342" text-anchor="middle" font-size="13.5" font-weight="700" fill="#8f3229">✗ BF16</text>
  <text x="212" y="366" text-anchor="middle" font-size="13.5" font-weight="700" fill="#8f3229">✗ Triton</text>

  <text x="276" y="320" font-size="15" font-weight="700" fill="#8f3229">3. Atlas 300I DUO（310P · 码 200..205）</text>
  <text x="276" y="346" font-size="13.5" fill="#17211f">COMPATIBILITY 独立兼容栈 · NPUWorker310</text>
  <text x="276" y="370" font-size="13.5" fill="#4d5652">镜像 :v0.30.0-310p · 强制 FRACTAL_NZ</text>
  <text x="276" y="393" font-size="13.5" fill="#8f3229">不注册 AscendFp8Config，无原生 FP8 路</text>

  <line x1="566" y1="302" x2="566" y2="394" stroke="#d88c82" stroke-width="1.2" stroke-dasharray="4 3"/>
  <text x="580" y="320" font-size="14" font-weight="700" fill="#8f3229">✗ 禁 BF16 · ✗ 无 NPUGRAPH_EX</text>
  <text x="580" y="346" font-size="13.5" fill="#4d5652">必传 --dtype float16（含 W8A8SC）</text>
  <text x="580" y="370" font-size="13.5" fill="#4d5652">自动关闭 static/super kernel，限解码图</text>
  <text x="580" y="393" font-size="13.5" fill="#66716d">30B 须用 QuaRot-310 量化版 TP2（≤16k）</text>

  <!-- Row 4: Ascend 950 (A5) (y=414..528) -->
  <rect x="12" y="414" width="876" height="112" rx="9" fill="#e8edff" fill-opacity="0.5" stroke="#4c65b6" stroke-width="1.5"/>
  <!-- 950 UMA package: 2 AI Die + 2 IO Die + L0C->UB -->
  <rect x="24" y="426" width="232" height="88" rx="7" fill="#ffffff" stroke="#4c65b6" stroke-width="1.5"/>
  <text x="140" y="445" text-anchor="middle" font-size="13.5" font-weight="700" fill="#3a4f93">UMA 合封（96~144 GB）</text>
  <rect x="34" y="454" width="98" height="24" rx="4" fill="#e8edff" stroke="#4c65b6" stroke-width="1.3"/>
  <text x="83" y="471" text-anchor="middle" font-family="var(--font-mono)" font-size="13.5" font-weight="700" fill="#3a4f93">2×AI Die</text>
  <rect x="144" y="454" width="102" height="24" rx="4" fill="#f7e7f2" stroke="#9a4b86" stroke-width="1.3"/>
  <text x="195" y="471" text-anchor="middle" font-family="var(--font-mono)" font-size="13.5" font-weight="700" fill="#7a3a6a">2×IO Die</text>
  <rect x="34" y="484" width="212" height="22" rx="4" fill="#ddf4ef" stroke="#087f73" stroke-width="1.2"/>
  <text x="140" y="500" text-anchor="middle" font-family="var(--font-mono)" font-size="13.5" font-weight="700" fill="#065f56">L0C→UB 直通 · Unified Bus</text>

  <text x="276" y="442" font-size="15" font-weight="700" fill="#3a4f93">4. 昇腾 950PR / 950DT（A5 · 码 260）</text>
  <text x="276" y="468" font-size="13.5" fill="#17211f">FP8_OPTIMIZED 适配族 · 镜像 :v0.30.0-a5</text>
  <text x="276" y="492" font-size="13.5" fill="#4d5652">片内 CV 融合直通少绕 GM，支持 NDDMA</text>
  <text x="276" y="515" font-size="13.5" fill="#66716d">950DT 4 TB/s 高带宽左移 Roofline 脊点</text>

  <line x1="566" y1="424" x2="566" y2="516" stroke="#8c9fcc" stroke-width="1.2" stroke-dasharray="4 3"/>
  <text x="580" y="442" font-size="14" font-weight="700" fill="#3a4f93">✓ 原生 FP8 / MXFP8 / MXFP4 / HiF8</text>
  <text x="580" y="468" font-size="13.5" fill="#4d5652">开启 FP8_ATTENTION 与 MEGAMOE_MXFP</text>
  <text x="580" y="492" font-size="13.5" fill="#4d5652">Unified Bus 高速直通 + UBoE 互联</text>
  <text x="580" y="515" font-size="13.5" fill="#66716d">96/144 GB 档可单卡或 MXFP8 容纳 30B</text>
</svg>
