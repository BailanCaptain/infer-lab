<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 588" width="900" height="588" role="img" aria-label="昇腾 Atlas A3 板卡与逻辑设备映射拓扑及硬件排障判据图" font-family="var(--font-sans)">
  <title>昇腾硬件五组常见误解 vs v0.30.0 运行时真相排障对照图</title>
  <desc>上半部画出典型 Atlas A3 的 8 块双裸片物理板卡 Card 0..7 到 16 个逻辑设备 davinci0..15 的成对映射，并以 davinci5 演示反查 Card 2、同卡配对 davinci4 及 HCCS/RoCE 端口；下半部汇总独立显存账本、带宽三层口径、check_ascend_device_type 与 310P 约束、HCCL 解耦判据。</desc>
  <defs>
    <marker id="hwm-arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 1 1.5 L 8.5 5 L 1 8.5 z" fill="#c78300"/>
    </marker>
  </defs>

  <text x="16" y="28" font-size="16" font-weight="700" fill="#17211f">典型 Atlas A3 板卡 ↔ 逻辑设备映射（8 板卡 → 16 Device）与 v0.30.0 排障判据</text>

  <!-- Hero Panel: 8 Physical Cards <-> 16 Logical Devices + Reverse Lookup -->
  <rect x="14" y="40" width="872" height="272" rx="10" fill="#fbfaf6" stroke="#d8d8cf" stroke-width="1.3"/>
  <text x="28" y="63" font-size="13.5" font-weight="700" fill="#17211f">DUAL_CHIP_CARD 物理拓扑：单张物理卡含 2 颗裸片（2 个逻辑 Device），沿 davinci5 反查板卡与互联端口</text>

  <!-- Row 1: Card 0..3 (x = 26, 160, 294, 428; width = 124, height = 92) -->
  <g fill="#ffffff" stroke="#b8bcb5" stroke-width="1.2">
    <rect x="26" y="76" width="124" height="92" rx="7"/>
    <rect x="160" y="76" width="124" height="92" rx="7"/>
    <rect x="428" y="76" width="124" height="92" rx="7"/>
    <rect x="26" y="178" width="124" height="92" rx="7"/>
    <rect x="160" y="178" width="124" height="92" rx="7"/>
    <rect x="294" y="178" width="124" height="92" rx="7"/>
    <rect x="428" y="178" width="124" height="92" rx="7"/>
  </g>
  <!-- Highlighted Card 2 -->
  <rect x="294" y="76" width="124" height="92" rx="7" fill="#fff4cf" stroke="#c78300" stroke-width="1.8"/>

  <g font-size="12" font-weight="700" text-anchor="middle" fill="#4d5652">
    <text x="88" y="94">物理卡 Card 0</text>
    <text x="222" y="94">物理卡 Card 1</text>
    <text x="356" y="94" fill="#936300">物理卡 Card 2 ★</text>
    <text x="490" y="94">物理卡 Card 3</text>
    <text x="88" y="196">物理卡 Card 4</text>
    <text x="222" y="196">物理卡 Card 5</text>
    <text x="356" y="196">物理卡 Card 6</text>
    <text x="490" y="196">物理卡 Card 7</text>
  </g>

  <!-- 16 Logical Device Pills (width=52 < 80, height=34) -->
  <g fill="#ddf4ef" stroke="#087f73" stroke-width="1.1">
    <rect x="33" y="102" width="52" height="32" rx="4"/><rect x="91" y="102" width="52" height="32" rx="4"/>
    <rect x="167" y="102" width="52" height="32" rx="4"/><rect x="225" y="102" width="52" height="32" rx="4"/>
    <rect x="301" y="102" width="52" height="32" rx="4"/>
    <rect x="435" y="102" width="52" height="32" rx="4"/><rect x="493" y="102" width="52" height="32" rx="4"/>
    <rect x="33" y="204" width="52" height="32" rx="4"/><rect x="91" y="204" width="52" height="32" rx="4"/>
    <rect x="167" y="204" width="52" height="32" rx="4"/><rect x="225" y="204" width="52" height="32" rx="4"/>
    <rect x="301" y="204" width="52" height="32" rx="4"/><rect x="359" y="204" width="52" height="32" rx="4"/>
    <rect x="435" y="204" width="52" height="32" rx="4"/><rect x="493" y="204" width="52" height="32" rx="4"/>
  </g>
  <!-- Highlighted davinci5 -->
  <rect x="359" y="102" width="52" height="32" rx="4" fill="#c78300" stroke="#936300" stroke-width="1.5"/>

  <g font-family="var(--font-mono)" font-size="12" font-weight="700" text-anchor="middle" fill="#065f56">
    <text x="59" y="122.5">dev0</text><text x="117" y="122.5">dev1</text>
    <text x="193" y="122.5">dev2</text><text x="251" y="122.5">dev3</text>
    <text x="327" y="122.5">dev4</text><text x="385" y="122.5" fill="#ffffff">dev5</text>
    <text x="461" y="122.5">dev6</text><text x="519" y="122.5">dev7</text>
    <text x="59" y="224.5">dev8</text><text x="117" y="224.5">dev9</text>
    <text x="193" y="224.5">dev10</text><text x="251" y="224.5">dev11</text>
    <text x="327" y="224.5">dev12</text><text x="385" y="224.5">dev13</text>
    <text x="461" y="224.5">dev14</text><text x="519" y="224.5">dev15</text>
  </g>

  <g font-size="12" text-anchor="middle" fill="#7a3a6a">
    <text x="88" y="156">HCCS · 2×RoCE</text><text x="222" y="156">HCCS · 2×RoCE</text>
    <text x="356" y="156" font-weight="700" fill="#936300">片内UB · RoCE#5</text><text x="490" y="156">HCCS · 2×RoCE</text>
    <text x="88" y="258">HCCS · 2×RoCE</text><text x="222" y="258">HCCS · 2×RoCE</text>
    <text x="356" y="258">HCCS · 2×RoCE</text><text x="490" y="258">HCCS · 2×RoCE</text>
  </g>
  <text x="289" y="295" text-anchor="middle" font-size="12" fill="#4d5652">注：<tspan font-family="var(--font-mono)" font-weight="600">dev0..15</tspan> 对应宿主机 <tspan font-family="var(--font-mono)" font-weight="600">/dev/davinci0..15</tspan>；容器严禁只挂单个 <tspan font-family="var(--font-mono)" font-weight="600">davinci0</tspan></text>

  <!-- Right Reverse Lookup Box -->
  <path d="M 418 118 L 566 118" fill="none" stroke="#c78300" stroke-width="1.8" stroke-dasharray="4 3" marker-end="url(#hwm-arr)"/>
  <rect x="572" y="76" width="302" height="222" rx="8" fill="#ffffff" stroke="#c78300" stroke-width="1.4"/>
  <text x="586" y="100" font-size="13.5" font-weight="700" fill="#936300">单编号反查演练：davinci5（npu 5）</text>
  <text x="586" y="126" font-size="12.5" fill="#17211f">① 软件边界：<tspan font-family="var(--font-mono)" font-weight="600" fill="#065f56">set_device(5)</tspan> 独立显存与流</text>
  <text x="586" y="151" font-size="12.5" fill="#17211f">② 反查物理卡：<tspan font-family="var(--font-mono)" font-weight="700" fill="#936300">5 // 2 = Card 2</tspan>（第 3 张卡）</text>
  <text x="586" y="176" font-size="12.5" fill="#8f3229">③ 成对挂载：须同挂同卡伙伴 <tspan font-family="var(--font-mono)" font-weight="700">davinci4,5</tspan></text>
  <text x="586" y="201" font-size="12.5" fill="#3a4f93">④ 机内链路：同卡裸片高速直连 + 机内 HCCS</text>
  <text x="586" y="226" font-size="12.5" fill="#7a3a6a">⑤ 跨机端口：本裸片直出专属 RoCE 口 #5</text>
  <line x1="586" y1="241" x2="860" y2="241" stroke="#d8d8cf" stroke-width="1.1"/>
  <text x="586" y="262" font-size="12" font-weight="700" fill="#8f3229">✗ 误区：1 个 Device = 1 张物理板卡</text>
  <text x="586" y="284" font-size="12" fill="#065f56">✓ 真相：Device 是最小算子/HBM 边界，A3 一卡两芯</text>

  <!-- Lower 2x2 Verified Criteria Cards -->
  <rect x="14" y="324" width="430" height="120" rx="9" fill="#ffffff" stroke="#4c65b6" stroke-width="1.3"/>
  <text x="28" y="349" font-size="13.5" font-weight="700" fill="#8f3229">✗ 误区 2：主机 DRAM 够大或多机入柜就能合成一池</text>
  <text x="28" y="374" font-size="13.5" font-weight="700" fill="#3a4f93">✓ 真相：Host DRAM 与每卡 HBM 分记两本独立账</text>
  <text x="28" y="400" font-size="12.5" fill="#4d5652"><tspan font-family="var(--font-mono)" font-size="12">MemorySnapshot</tspan> / <tspan font-family="var(--font-mono)" font-size="12">mem_get_info</tspan> 仅核对当前 Device 空闲显存</text>
  <text x="28" y="425" font-size="12" fill="#66716d">超节点池化复用仍须付查找、校验、跨链搬运与布局恢复代价</text>

  <rect x="456" y="324" width="430" height="120" rx="9" fill="#ffffff" stroke="#087f73" stroke-width="1.3"/>
  <text x="470" y="349" font-size="13.5" font-weight="700" fill="#8f3229">✗ 误区 3：看峰值 TFLOPS 或 392 GB/s 就能算实测吞吐</text>
  <text x="470" y="374" font-size="13.5" font-weight="700" fill="#065f56">✓ 真相：区分多链聚合峰值、单口线速与有效吞吐</text>
  <text x="470" y="400" font-size="12.5" fill="#4d5652">392 GB/s 含 7 条 HCCS 链；单口 200GE 折 25 GB/s 未扣协议头</text>
  <text x="470" y="425" font-size="12" fill="#66716d">高频同步 TP 留机内 HCCS，跨机 RoCE 承载 DP / PP / EP</text>

  <rect x="14" y="456" width="430" height="120" rx="9" fill="#ffffff" stroke="#b54237" stroke-width="1.3"/>
  <text x="28" y="481" font-size="13.5" font-weight="700" fill="#8f3229">✗ 误区 4：默认 wheel 与 BF16 通跑 300I DUO (310P)</text>
  <text x="28" y="506" font-size="13.5" font-weight="700" fill="#065f56">✓ 真相：<tspan font-family="var(--font-mono)" font-size="13">check_ascend_device_type()</tspan> 锁卡，310P 禁 BF16</text>
  <text x="28" y="532" font-size="12.5" fill="#4d5652">运行期比对 <tspan font-family="var(--font-mono)" font-size="12">get_soc_version()</tspan>，跨卡族混跑直接抛 RuntimeError</text>
  <text x="28" y="557" font-size="12" fill="#66716d">310P 须换专属镜像、必传 <tspan font-family="var(--font-mono)" font-weight="600">--dtype float16</tspan> 且禁 <tspan font-family="var(--font-mono)" font-weight="600">npugraph_ex</tspan></text>

  <rect x="456" y="456" width="430" height="120" rx="9" fill="#ffffff" stroke="#9a4b86" stroke-width="1.3"/>
  <text x="470" y="481" font-size="13.5" font-weight="700" fill="#8f3229">✗ 误区 5：HCCL 即 HCCS、RoCE 必经网卡、DP 各存全模</text>
  <text x="470" y="506" font-size="13.5" font-weight="700" fill="#7a3a6a">✓ 真相：HCCL 是软件通信库，RoCE 可由 NPU 直出</text>
  <text x="470" y="532" font-size="12.5" fill="#4d5652">HCCL 统一跨 HCCS / UB / RoCE 编排集合通信与点对点收发</text>
  <text x="470" y="557" font-size="12" fill="#66716d">跨机 EP16 下两台 DP 机器合持一份完整路由专家集合</text>
</svg>
