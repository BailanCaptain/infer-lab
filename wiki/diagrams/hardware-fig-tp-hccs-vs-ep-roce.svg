<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 544" width="900" height="544" role="img" aria-label="双机拓扑机内 TP HCCS 与跨机 EP RoCE 激活路径及同比例带宽落差对比图" font-family="var(--font-sans)">
  <title>双机并行拓扑：机内 TP（HCCS 高速域）vs 跨机 EP（RoCE 仅传远端专家激活）</title>
  <desc>结合 init_distributed_environment 与 HardwareProfile（DUAL_CHIP_CARD、FP8_OPTIMIZED），以 2×8 双机集群为例画出两台服务器各自机内 TP8 HCCS Full Mesh 闭环（91 次 All-Reduce 不出机）与跨机 200GE RoCE（NPU 直出网口）仅转发命中远端专家的 token 激活向量并收回结果，底部按统一比例条对比 Atlas 800T A2 白皮书 7 链聚合 392 GB/s 与单口 RoCE 25 GB/s，并注明 800T A2 与 800I A2 子型号区分及 v0.30.0 单机 A3/950DT 演进。</desc>
  <defs>
    <marker id="hw-tp-arr-p" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto">
      <path d="M 0 1.5 L 8.5 5 L 0 8.5 z" fill="#9a4b86"/>
    </marker>
    <marker id="hw-tp-arr-t" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto">
      <path d="M 0 1.5 L 8.5 5 L 0 8.5 z" fill="#087f73"/>
    </marker>
  </defs>

  <!-- Zone 1 Title -->
  <text x="16" y="28" font-size="16" font-weight="700" fill="#17211f">① 双机拓扑分流：高频 TP 锁在机内 HCCS 域，跨机 RoCE 只传命中远端专家的激活</text>
  <line x1="14" y1="38" x2="886" y2="38" stroke="#b8bcb5" stroke-width="1.4"/>

  <!-- Left Node 0 -->
  <rect x="14" y="50" width="356" height="278" rx="10" fill="#ece9df" fill-opacity="0.55" stroke="#8a928f" stroke-width="1.5"/>
  <text x="28" y="75" font-size="15" font-weight="700" fill="#17211f">机器 0（DP 组 0 · rank 0..7）</text>
  <text x="28" y="96" font-size="13.5" fill="#4d5652">本地 Device 0..7 · 持有一半路由专家</text>

  <!-- Intra-node HCCS TP8 ring inside Node 0 -->
  <rect x="28" y="108" width="328" height="148" rx="10" fill="#fff4cf" fill-opacity="0.7" stroke="#c78300" stroke-width="2" stroke-dasharray="6 4"/>
  <text x="192" y="130" text-anchor="middle" font-size="14" font-weight="700" fill="#936300">机内 TP8 · HCCS Full Mesh 高速域</text>

  <!-- 8 NPU chips in Node 0 (2 rows x 4 cols) -->
  <g font-family="var(--font-mono)" font-size="13.5" font-weight="700" text-anchor="middle">
    <rect x="40" y="140" width="68" height="34" rx="5" fill="#ffffff" stroke="#c78300" stroke-width="1.4"/>
    <text x="74" y="162" fill="#17211f">NPU 0</text>
    <rect x="118" y="140" width="68" height="34" rx="5" fill="#ffffff" stroke="#c78300" stroke-width="1.4"/>
    <text x="152" y="162" fill="#17211f">NPU 1</text>
    <rect x="196" y="140" width="68" height="34" rx="5" fill="#ddf4ef" stroke="#087f73" stroke-width="2"/>
    <text x="230" y="162" fill="#065f56">NPU 2</text>
    <rect x="274" y="140" width="68" height="34" rx="5" fill="#ffffff" stroke="#c78300" stroke-width="1.4"/>
    <text x="308" y="162" fill="#17211f">NPU 3</text>

    <rect x="40" y="184" width="68" height="34" rx="5" fill="#ffffff" stroke="#c78300" stroke-width="1.4"/>
    <text x="74" y="206" fill="#17211f">NPU 4</text>
    <rect x="118" y="184" width="68" height="34" rx="5" fill="#ffffff" stroke="#c78300" stroke-width="1.4"/>
    <text x="152" y="206" fill="#17211f">NPU 5</text>
    <rect x="196" y="184" width="68" height="34" rx="5" fill="#ffffff" stroke="#c78300" stroke-width="1.4"/>
    <text x="230" y="206" fill="#17211f">NPU 6</text>
    <rect x="274" y="184" width="68" height="34" rx="5" fill="#ffffff" stroke="#c78300" stroke-width="1.4"/>
    <text x="308" y="206" fill="#17211f">NPU 7</text>
  </g>
  <text x="192" y="244" text-anchor="middle" font-size="13.5" font-weight="700" fill="#936300">每层 TP All-Reduce（整趟 91 次全留机内）</text>

  <rect x="28" y="266" width="328" height="50" rx="7" fill="#ffffff" stroke="#b8bcb5" stroke-width="1.2"/>
  <text x="40" y="288" font-size="13.5" font-weight="700" fill="#065f56">专家权重常驻持有卡，绝不跨机搬权重</text>
  <text x="40" y="308" font-size="13.5" fill="#4d5652">仅在 42 个 MoE 层外发命中远端的激活</text>

  <!-- Center Cross-Node RoCE Bridge -->
  <rect x="382" y="128" width="136" height="122" rx="9" fill="#f7e7f2" stroke="#9a4b86" stroke-width="1.6"/>
  <text x="450" y="156" text-anchor="middle" font-size="14.5" font-weight="700" fill="#7a3a6a">跨机 RoCE</text>
  <text x="450" y="180" text-anchor="middle" font-family="var(--font-mono)" font-size="13.5" font-weight="700" fill="#7a3a6a">200 Gbit/s</text>
  <text x="450" y="202" text-anchor="middle" font-size="13.5" fill="#4d5652">每端口（8×200GE）</text>
  <text x="450" y="224" text-anchor="middle" font-size="13.5" fill="#7a3a6a">NPU 直出网口</text>

  <!-- Dispatch & Combine curved arrows between Node 0 and Node 1 -->
  <path d="M 356 156 C 390 100, 510 100, 546 156" fill="none" stroke="#9a4b86" stroke-width="2.4" marker-end="url(#hw-tp-arr-p)"/>
  <text x="450" y="96" text-anchor="middle" font-size="13.5" font-weight="700" fill="#7a3a6a">EP Dispatch：只发激活向量</text>

  <path d="M 546 218 C 510 278, 390 278, 356 218" fill="none" stroke="#087f73" stroke-width="2.4" stroke-dasharray="6 4" marker-end="url(#hw-tp-arr-t)"/>
  <text x="450" y="290" text-anchor="middle" font-size="13.5" font-weight="700" fill="#065f56">EP Combine：算完收回结果</text>

  <!-- Right Node 1 -->
  <rect x="530" y="50" width="356" height="278" rx="10" fill="#ece9df" fill-opacity="0.55" stroke="#8a928f" stroke-width="1.5"/>
  <text x="544" y="75" font-size="15" font-weight="700" fill="#17211f">机器 1（DP 组 1 · rank 8..15）</text>
  <text x="544" y="96" font-size="13.5" fill="#4d5652">本地 Device 0..7 · 持有另一半路由专家</text>

  <!-- Intra-node HCCS TP8 ring inside Node 1 -->
  <rect x="544" y="108" width="328" height="148" rx="10" fill="#fff4cf" fill-opacity="0.7" stroke="#c78300" stroke-width="2" stroke-dasharray="6 4"/>
  <text x="708" y="130" text-anchor="middle" font-size="14" font-weight="700" fill="#936300">机内 TP8 · HCCS Full Mesh 高速域</text>

  <!-- 8 NPU chips in Node 1 -->
  <g font-family="var(--font-mono)" font-size="13.5" font-weight="700" text-anchor="middle">
    <rect x="556" y="140" width="68" height="34" rx="5" fill="#f7e7f2" stroke="#9a4b86" stroke-width="2"/>
    <text x="590" y="162" fill="#7a3a6a">NPU 0</text>
    <rect x="634" y="140" width="68" height="34" rx="5" fill="#ffffff" stroke="#c78300" stroke-width="1.4"/>
    <text x="668" y="162" fill="#17211f">NPU 1</text>
    <rect x="712" y="140" width="68" height="34" rx="5" fill="#ffffff" stroke="#c78300" stroke-width="1.4"/>
    <text x="746" y="162" fill="#17211f">NPU 2</text>
    <rect x="790" y="140" width="68" height="34" rx="5" fill="#ffffff" stroke="#c78300" stroke-width="1.4"/>
    <text x="824" y="162" fill="#17211f">NPU 3</text>

    <rect x="556" y="184" width="68" height="34" rx="5" fill="#ffffff" stroke="#c78300" stroke-width="1.4"/>
    <text x="590" y="206" fill="#17211f">NPU 4</text>
    <rect x="634" y="184" width="68" height="34" rx="5" fill="#ffffff" stroke="#c78300" stroke-width="1.4"/>
    <text x="668" y="206" fill="#17211f">NPU 5</text>
    <rect x="712" y="184" width="68" height="34" rx="5" fill="#ffffff" stroke="#c78300" stroke-width="1.4"/>
    <text x="746" y="206" fill="#17211f">NPU 6</text>
    <rect x="790" y="184" width="68" height="34" rx="5" fill="#ffffff" stroke="#c78300" stroke-width="1.4"/>
    <text x="824" y="206" fill="#17211f">NPU 7</text>
  </g>
  <text x="708" y="244" text-anchor="middle" font-size="13.5" font-weight="700" fill="#7a3a6a">远端命中专家本地算完即回传</text>

  <rect x="544" y="266" width="328" height="50" rx="7" fill="#fff0e9" stroke="#b54237" stroke-width="1.2"/>
  <text x="556" y="288" font-size="13.5" font-weight="700" fill="#8f3229">两台合持完整专家，非两份独立副本</text>
  <text x="556" y="308" font-size="13.5" fill="#4d5652">机器 1 即使无本地请求也协算机器 0 激活</text>

  <!-- Horizontal divider -->
  <line x1="14" y1="344" x2="886" y2="344" stroke="#b8bcb5" stroke-width="1.4" stroke-dasharray="6 4"/>

  <!-- Zone 2: Same-scale bandwidth comparison bar (1 GB/s = 1.15 px starting at x=230) -->
  <text x="16" y="372" font-size="16" font-weight="700" fill="#17211f">② 同比例带宽落差：为什么忌跨机切细粒度 TP（800T A2 白皮书参照，须区分 800I A2）</text>

  <text x="16" y="408" font-size="14" font-weight="700" fill="#936300">机内 HCCS（7 链聚合）</text>
  <rect x="230" y="388" width="451" height="28" rx="4" fill="#fff4cf" stroke="#c78300" stroke-width="1.6"/>
  <text x="455" y="407" text-anchor="middle" font-family="var(--font-mono)" font-size="13.5" font-weight="700" fill="#936300">392 GB/s（Atlas 800T A2，非任意两卡单链）</text>
  <text x="692" y="407" font-size="13.5" fill="#4d5652">承接每层 TP 同步</text>

  <text x="16" y="448" font-size="14" font-weight="700" fill="#7a3a6a">跨机 RoCE（单 200GE）</text>
  <rect x="230" y="428" width="29" height="28" rx="4" fill="#f7e7f2" stroke="#9a4b86" stroke-width="1.6"/>
  <text x="270" y="447" font-family="var(--font-mono)" font-size="13.5" font-weight="700" fill="#7a3a6a">25 GB/s（200 Gbit/s ÷ 8，约 1/16 · 未扣协议头）</text>

  <!-- v0.30.0 Single-node evolution strip -->
  <rect x="16" y="472" width="868" height="58" rx="8" fill="#ddf4ef" stroke="#087f73" stroke-width="1.4"/>
  <text x="30" y="497" font-size="14" font-weight="700" fill="#065f56">v0.30.0 单节点免跨跳演进：</text>
  <text x="218" y="497" font-size="13.5" fill="#17211f">单台 16 逻辑设备的 Atlas A3 或 8×96 GB 昇腾 950DT（MXFP8）可单机装下全部专家，</text>
  <text x="30" y="519" font-size="13.5" fill="#4d5652">消除跨机 RoCE 跳数；现场选型仍须以具体子型号（如 800T A2 vs 800I A2）手册与实测为准。</text>
</svg>
