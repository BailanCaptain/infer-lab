id: hardware-plate-cutaway
caption: >-
  昇腾四级物理层级与双裸片拓扑立体拆解：左侧对比 A2 单裸片板卡（1 Die + HBM，对应 1 个逻辑设备）与 A3 双裸片板卡（2 Dies 经片间互联封装在同一物理板卡，暴露为 2 个逻辑 rank）；中央展示单台服务器内主机 CPU 经 PCIe 连接 NPU 模组、模组间经 HCCS / UB 高速互联（8 模组对应 A2 的 8 卡或 A3 的 16 个逻辑设备）；右侧展示多节点机柜内跨服务器经 NPU 直出或板载 RoCE 接口互联。
