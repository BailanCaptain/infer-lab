<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 600" width="900" height="600" role="img" aria-label="固定 Ascend 建组路径：所有分支都会创建 Options 并带 group_name；MC2 分支省略的是 hccl_buffer_size 字段。数值为源码配置值，不是实测设备占用">
