<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 385" width="900" height="385" role="img" aria-label="精度推断与 ModelSlim vs 原生 fp8 开放式门禁图" font-family="var(--font-sans)">
  <title>权重精度三级回退推断与昇腾 ModelSlim quant_model_description.json 及原生 FP8 逐块动态门禁检查。</title>
  <desc>get_torch_dtype、get_safetensors_params_metadata（common_broadcastable_dtype）与 _get_and_verify_dtype / _resolve_auto_dtype 完成 dtype 至 float32 回退及自动降精度；昇腾侧 maybe_auto_detect_quantization 与 detect_quantization_method 优先检测 MODELSLIM_CONFIG_FILENAME，其次读取 quantization_config 并经 AscendFp8Config._verify_block_quantization 校验 weight_block_size 与 activation_scheme，不满足抛 NotImplementedError。</desc>

  <!-- Open Vertical Dashed Divider -->
  <line x1="408" y1="14" x2="408" y2="370" stroke="#CBD5E1" stroke-width="1.5" stroke-dasharray="6 4"/>

  <!-- Left Section: dtype Inference Chain -->
  <text x="14" y="30" font-size="16" font-weight="700" fill="#17211f">A. 权重精度推断与自动降精度链</text>

  <rect x="14" y="48" width="378" height="62" rx="7" fill="#EFF6FF" stroke="#1D4ED8" stroke-width="1.4"/>
  <text x="26" y="74" font-size="14.5" font-weight="700" fill="#1D4ED8">① 读 config.json 的 torch_dtype</text>
  <text x="26" y="98" font-size="13.5" fill="#334155">Qwen3 预设均为 "bfloat16"（每参数 2 B）</text>

  <line x1="203" y1="110" x2="203" y2="128" stroke="#64748B" stroke-width="1.6"/>
  <rect x="14" y="128" width="378" height="62" rx="7" fill="#FFFBEB" stroke="#B45309" stroke-width="1.4"/>
  <text x="26" y="154" font-size="14.5" font-weight="700" fill="#B45309">② 配置漏写：扫 .safetensors 文件头</text>
  <text x="26" y="178" font-size="13.5" fill="#334155">按张量可广播公共精度推断真实 dtype</text>

  <line x1="203" y1="190" x2="203" y2="208" stroke="#64748B" stroke-width="1.6"/>
  <rect x="14" y="208" width="378" height="60" rx="7" fill="#F8FAFC" stroke="#94A3B8" stroke-width="1.3"/>
  <text x="26" y="233" font-size="14.5" font-weight="700" fill="#334155">③ 元数据亦缺失：回落 float32</text>
  <text x="26" y="256" font-size="13.5" fill="#64748B">get_torch_dtype 兜底（每参数 4 B）</text>

  <line x1="203" y1="268" x2="203" y2="286" stroke="#0F766E" stroke-width="1.7"/>
  <rect x="14" y="286" width="378" height="64" rx="7" fill="#ECFDF5" stroke="#0F766E" stroke-width="1.4"/>
  <text x="26" y="313" font-size="14.5" font-weight="700" fill="#0F766E">④ 默认 --dtype auto 平台降精度</text>
  <text x="26" y="337" font-size="13.5" fill="#334155">float32 自动降为 NPU 首选 BF16 / FP16</text>

  <!-- Right Section: Ascend Quantization Detection & FP8 Gate -->
  <text x="424" y="30" font-size="16" font-weight="700" fill="#17211f">B. 昇腾量化识别与原生 FP8 门禁</text>

  <rect x="424" y="48" width="462" height="64" rx="7" fill="#ECFDF5" stroke="#0F766E" stroke-width="1.5"/>
  <text x="438" y="74" font-size="14.5" font-weight="700" fill="#0F766E">第一优先级：存在 quant_model_description.json</text>
  <text x="438" y="99" font-size="13.5" fill="#334155">detect_quantization_method 立即识别为 <tspan font-family="var(--font-mono)" font-weight="700">"ascend"</tspan></text>

  <text x="424" y="138" font-size="14" font-weight="700" fill="#475569">▼ 无该文件时 → 读 quantization_config</text>

  <rect x="424" y="154" width="172" height="88" rx="7" fill="#EFF6FF" stroke="#1D4ED8" stroke-width="1.4"/>
  <text x="510" y="180" text-anchor="middle" font-size="14" font-family="var(--font-mono)" font-weight="700" fill="#1D4ED8">compressed-tensors</text>
  <text x="510" y="205" text-anchor="middle" font-size="13.5" fill="#334155">通用压缩张量格式</text>
  <text x="510" y="229" text-anchor="middle" font-size="13.5" font-weight="700" fill="#0F766E">✓ 校验通过加载</text>

  <line x1="428" y1="262" x2="428" y2="348" stroke="#94A3B8" stroke-width="2.5"/>
  <text x="440" y="280" font-size="14" font-weight="700" fill="#334155">早期格式兼容</text>
  <text x="440" y="306" font-size="13.5" fill="#475569">ModelOpt ≤0.29</text>
  <text x="440" y="332" font-size="13.5" font-family="var(--font-mono)" fill="#334155">hf_quant_config</text>

  <text x="608" y="170" font-size="14.5" font-weight="700" fill="#92400E">原生 "fp8"（AscendFp8Config）：</text>

  <rect x="608" y="184" width="278" height="66" rx="7" fill="#ECFDF5" stroke="#0F766E" stroke-width="1.4"/>
  <text x="620" y="210" font-size="14.5" font-weight="700" fill="#0F766E">✓ 放行条件（逐块 + 动态）</text>
  <text x="620" y="236" font-size="13.5" font-family="var(--font-mono)" fill="#17211f">含 weight_block_size</text>

  <rect x="608" y="262" width="278" height="88" rx="7" fill="#FFF1F2" stroke="#BE123C" stroke-width="1.4"/>
  <text x="620" y="288" font-size="14.5" font-weight="700" fill="#BE123C">✗ per-tensor / channel</text>
  <text x="620" y="314" font-size="13.5" fill="#334155">抛 <tspan font-family="var(--font-mono)" font-weight="700" fill="#BE123C">NotImplementedError</tspan></text>
  <text x="620" y="338" font-size="13.5" fill="#64748B">须用 ModelSlim 重新量化</text>
</svg>
