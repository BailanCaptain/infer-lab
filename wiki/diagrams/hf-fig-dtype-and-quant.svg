<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 310" width="900" height="310" role="img" aria-label="精度推断与 ModelSlim vs 原生 fp8 开放式门禁图" font-family="var(--font-sans)">
  <title>权重精度三级回退推断与昇腾 ModelSlim quant_model_description.json 及原生 FP8 逐块动态门禁检查。</title>
  <desc>get_torch_dtype、get_safetensors_params_metadata（common_broadcastable_dtype）与 _get_and_verify_dtype / _resolve_auto_dtype 完成 dtype 至 float32 回退及自动降精度；昇腾侧 maybe_auto_detect_quantization 与 detect_quantization_method 优先检测 MODELSLIM_CONFIG_FILENAME，其次读取 quantization_config 并经 AscendFp8Config._verify_block_quantization 校验 weight_block_size 与 activation_scheme，不满足抛 NotImplementedError。</desc>

  <!-- Open Vertical Dashed Divider -->
  <line x1="404" y1="14" x2="404" y2="296" stroke="#CBD5E1" stroke-width="1.5" stroke-dasharray="6 4"/>

  <!-- Left Section: dtype Inference Chain (Zero Wrapper Cage) -->
  <text x="16" y="28" font-size="14" font-weight="700" fill="#17211f">A. 权重精度推断与自动降精度链</text>

  <rect x="16" y="44" width="372" height="50" rx="7" fill="#EFF6FF" stroke="#1D4ED8" stroke-width="1.4"/>
  <text x="28" y="65" font-size="12.5" font-weight="700" fill="#1D4ED8">① 读取 config.json 的 torch_dtype / dtype</text>
  <text x="28" y="84" font-size="11.5" fill="#334155">Qwen3 预设均为 "bfloat16"（BF16，每参数 2 B）</text>

  <line x1="202" y1="94" x2="202" y2="110" stroke="#64748B" stroke-width="1.5"/>
  <rect x="16" y="110" width="372" height="50" rx="7" fill="#FFFBEB" stroke="#B45309" stroke-width="1.4"/>
  <text x="28" y="131" font-size="12.5" font-weight="700" fill="#B45309">② 配置漏写：扫 .safetensors 文件头元数据</text>
  <text x="28" y="150" font-size="11.5" fill="#334155">按张量可广播公共精度推断真实 dtype</text>

  <line x1="202" y1="160" x2="202" y2="176" stroke="#64748B" stroke-width="1.5"/>
  <rect x="16" y="176" width="372" height="48" rx="7" fill="#F8FAFC" stroke="#94A3B8" stroke-width="1.3"/>
  <text x="28" y="197" font-size="12.5" font-weight="700" fill="#334155">③ 连元数据也缺失：回落 torch.float32</text>
  <text x="28" y="215" font-size="11.5" fill="#64748B">（get_torch_dtype 兜底，每参数 4 B）</text>

  <line x1="202" y1="224" x2="202" y2="240" stroke="#0F766E" stroke-width="1.6"/>
  <rect x="16" y="240" width="372" height="54" rx="7" fill="#ECFDF5" stroke="#0F766E" stroke-width="1.4"/>
  <text x="28" y="262" font-size="12.5" font-weight="700" fill="#0F766E">④ 默认 --dtype auto 激活平台降精度</text>
  <text x="28" y="282" font-size="11.5" fill="#334155">若为 float32 → 自动降为 NPU 首选 BF16 / FP16</text>

  <!-- Right Section: Ascend Quantization Detection & FP8 Gate (Zero Wrapper Cage) -->
  <text x="422" y="28" font-size="14" font-weight="700" fill="#17211f">B. 昇腾量化识别与原生 FP8 硬门禁（v0.30.0）</text>

  <rect x="422" y="44" width="462" height="54" rx="7" fill="#ECFDF5" stroke="#0F766E" stroke-width="1.5"/>
  <text x="436" y="66" font-size="12.5" font-weight="700" fill="#0F766E">第一优先级：存在 quant_model_description.json</text>
  <text x="436" y="86" font-size="11.5" fill="#334155">detect_quantization_method 立即识别为 <tspan font-family="var(--font-mono)" font-weight="700">"ascend"</tspan>（ModelSlim）</text>

  <text x="422" y="120" font-size="12" font-weight="700" fill="#475569">▼ 无该文件时 → 读 quantization_config（或旧版 hf_quant_config.json）</text>

  <!-- Sub-branch compressed-tensors -->
  <rect x="422" y="133" width="168" height="72" rx="7" fill="#EFF6FF" stroke="#1D4ED8" stroke-width="1.4"/>
  <text x="506" y="156" text-anchor="middle" font-size="12" font-family="var(--font-mono)" font-weight="700" fill="#1D4ED8">compressed-tensors</text>
  <text x="506" y="176" text-anchor="middle" font-size="11.5" fill="#334155">通用压缩张量格式</text>
  <text x="506" y="195" text-anchor="middle" font-size="11.5" font-weight="700" fill="#0F766E">✓ 校验通过正常加载</text>

  <!-- Open Legacy Note -->
  <line x1="426" y1="222" x2="426" y2="290" stroke="#94A3B8" stroke-width="2.5"/>
  <text x="436" y="237" font-size="12" font-weight="700" fill="#334155">早期格式兼容</text>
  <text x="436" y="257" font-size="11.5" fill="#475569">ModelOpt ≤0.29 独立</text>
  <text x="436" y="277" font-size="11.5" font-family="var(--font-mono)" fill="#334155">hf_quant_config.json</text>

  <!-- Sub-branch native fp8 (Open Header + 2 Sibling Outcome Nodes, Zero Nested Wrapper) -->
  <text x="604" y="147" font-size="12.5" font-weight="700" fill="#92400E">原生 "fp8"（AscendFp8Config 门禁）：</text>

  <rect x="604" y="158" width="280" height="60" rx="7" fill="#ECFDF5" stroke="#0F766E" stroke-width="1.4"/>
  <text x="616" y="180" font-size="12" font-weight="700" fill="#0F766E">✓ 唯一放行条件（逐块 + 动态激活）</text>
  <text x="616" y="202" font-size="11.5" font-family="var(--font-mono)" fill="#17211f">含 weight_block_size 且 dynamic</text>

  <rect x="604" y="228" width="280" height="66" rx="7" fill="#FFF1F2" stroke="#BE123C" stroke-width="1.4"/>
  <text x="616" y="249" font-size="12" font-weight="700" fill="#BE123C">✗ per-tensor / per-channel 缩放</text>
  <text x="616" y="269" font-size="11.5" fill="#334155">抛 <tspan font-family="var(--font-mono)" font-weight="700" fill="#BE123C">NotImplementedError</tspan> 拒绝加载</text>
  <text x="616" y="286" font-size="11.5" fill="#64748B">须用 ModelSlim 或 llm-compressor 重做</text>
</svg>
