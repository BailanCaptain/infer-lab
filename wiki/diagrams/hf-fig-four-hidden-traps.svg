<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 392" width="900" height="392" role="img" aria-label="周边四份配置文件四大隐形坑开放式排雷图" font-family="var(--font-sans)">
  <title>同目录周边四份配置文件（chat_template、model_max_length、index.json、generation_config.json）隐形坑排雷全景图。</title>
  <desc>四大隐形坑排雷：1. resolve_chat_template 经命令行、AutoProcessor、AutoTokenizer 与内置模板四级回落；2. _get_and_verify_max_len 对 model_max_length 取 min 截断；3. weight_map 差集抛 FileNotFoundError 且 filter_duplicate_safetensors_files 防双倍加载；4. try_get_generation_config 读取 GenerationConfig 静音接管采样参数。</desc>

  <!-- Open Dashed Crosshair Dividers (Zero Outer Quadrant Cages) -->
  <line x1="16" y1="194" x2="884" y2="194" stroke="#CBD5E1" stroke-width="1.5" stroke-dasharray="6 4"/>
  <line x1="448" y1="14" x2="448" y2="378" stroke="#CBD5E1" stroke-width="1.5" stroke-dasharray="6 4"/>

  <!-- Quadrant 1: chat_template 4-level fallback -->
  <circle cx="27" cy="26" r="11" fill="#1D4ED8"/>
  <text x="27" y="30" text-anchor="middle" font-size="12" font-weight="700" fill="#FFFFFF">1</text>
  <text x="44" y="31" font-size="13.5" font-weight="700" fill="#17211f">chat_template 四级回落（resolve_chat_template）</text>

  <rect x="16" y="46" width="110" height="46" rx="6" fill="#EFF6FF" stroke="#93C5FD" stroke-width="1.3"/>
  <text x="71" y="65" text-anchor="middle" font-size="11.5" font-weight="700" fill="#1E40AF">1. 命令行参数</text>
  <text x="71" y="83" text-anchor="middle" font-size="11" font-family="var(--font-mono)" fill="#334155">--chat-template</text>

  <text x="133" y="73" text-anchor="middle" font-size="12" font-weight="700" fill="#64748B">→</text>

  <rect x="140" y="46" width="96" height="46" rx="6" fill="#EFF6FF" stroke="#93C5FD" stroke-width="1.3"/>
  <text x="188" y="65" text-anchor="middle" font-size="11.5" font-weight="700" fill="#1E40AF">2. 处理器</text>
  <text x="188" y="83" text-anchor="middle" font-size="11" font-family="var(--font-mono)" fill="#334155">AutoProcessor</text>

  <text x="243" y="73" text-anchor="middle" font-size="12" font-weight="700" fill="#64748B">→</text>

  <rect x="250" y="46" width="96" height="46" rx="6" fill="#EFF6FF" stroke="#93C5FD" stroke-width="1.3"/>
  <text x="298" y="65" text-anchor="middle" font-size="11.5" font-weight="700" fill="#1E40AF">3. 分词配置</text>
  <text x="298" y="83" text-anchor="middle" font-size="11" font-family="var(--font-mono)" fill="#334155">AutoTokenizer</text>

  <text x="353" y="73" text-anchor="middle" font-size="12" font-weight="700" fill="#64748B">→</text>

  <rect x="360" y="46" width="72" height="46" rx="6" fill="#EFF6FF" stroke="#93C5FD" stroke-width="1.3"/>
  <text x="396" y="65" text-anchor="middle" font-size="11.5" font-weight="700" fill="#1E40AF">4. 内置</text>
  <text x="396" y="83" text-anchor="middle" font-size="11" fill="#475569">回落模板</text>

  <line x1="18" y1="106" x2="18" y2="176" stroke="#F43F5E" stroke-width="3"/>
  <text x="30" y="120" font-size="12" font-weight="700" fill="#BE123C">症状：四级皆空时能启动，调对话接口立即报错</text>
  <text x="30" y="143" font-size="12" fill="#334155">高发于裸预训练目录（缺模板字段与 .jinja）</text>
  <text x="30" y="167" font-size="12" font-weight="700" fill="#0F766E">解法：补齐 chat_template.jinja 或传 --chat-template</text>

  <!-- Quadrant 2: model_max_length silent truncation -->
  <circle cx="475" cy="26" r="11" fill="#BE123C"/>
  <text x="475" y="30" text-anchor="middle" font-size="12" font-weight="700" fill="#FFFFFF">2</text>
  <text x="492" y="31" font-size="13.5" font-weight="700" fill="#17211f">model_max_length 取 min 静音截断</text>

  <rect x="464" y="46" width="420" height="44" rx="6" fill="#FFFBEB" stroke="#D97706" stroke-width="1.4"/>
  <text x="674" y="73" text-anchor="middle" font-size="12" font-family="var(--font-mono)" font-weight="700" fill="#92400E">max_len = min( derived_max_len , model_max_length )</text>

  <line x1="466" y1="106" x2="466" y2="176" stroke="#F43F5E" stroke-width="3"/>
  <text x="478" y="120" font-size="12" fill="#334155">config.json 明明写 <tspan font-family="var(--font-mono)" font-weight="700">max_position_embeddings = 40960</tspan></text>
  <text x="478" y="143" font-size="12" font-weight="700" fill="#BE123C">但 tokenizer_config 误填 4096 → 上下文被悄悄截短！</text>
  <text x="478" y="167" font-size="12" font-weight="700" fill="#0F766E">解法：传 --max-model-len 显式覆盖，或修正该字段</text>

  <!-- Quadrant 3: index.json shard diff & consolidated dedup -->
  <circle cx="27" cy="220" r="11" fill="#B45309"/>
  <text x="27" y="224" text-anchor="middle" font-size="12" font-weight="700" fill="#FFFFFF">3</text>
  <text x="44" y="225" font-size="13.5" font-weight="700" fill="#17211f">index.json 差集报缺片与防双倍加载</text>

  <rect x="16" y="242" width="416" height="62" rx="7" fill="#FFF1F2" stroke="#FDA4AF" stroke-width="1.3"/>
  <text x="28" y="264" font-size="12" font-weight="700" fill="#BE123C">A. 漏片拦截：set(weight_map.values()) - 磁盘文件 != ∅</text>
  <text x="28" y="288" font-size="12" fill="#334155">断点续传少任一分片，立即抛 <tspan font-family="var(--font-mono)" font-weight="700" fill="#BE123C">FileNotFoundError</tspan></text>

  <rect x="16" y="314" width="416" height="64" rx="7" fill="#ECFDF5" stroke="#6EE7B7" stroke-width="1.3"/>
  <text x="28" y="336" font-size="12" font-weight="700" fill="#0F766E">B. 混合目录去重：filter_duplicate_safetensors_files</text>
  <text x="28" y="360" font-size="11.5" fill="#334155">同存 consolidated* 与分片时靠索引去重 —— <tspan font-weight="700" fill="#BE123C">勿删 index.json！</tspan></text>

  <!-- Quadrant 4: generation_config.json silent sampling override -->
  <circle cx="475" cy="220" r="11" fill="#0F766E"/>
  <text x="475" y="224" text-anchor="middle" font-size="12" font-weight="700" fill="#FFFFFF">4</text>
  <text x="492" y="225" font-size="13.5" font-weight="700" fill="#17211f">generation_config.json 静音改写采样默认</text>

  <rect x="464" y="242" width="420" height="56" rx="7" fill="#ECFDF5" stroke="#0F766E" stroke-width="1.3"/>
  <text x="476" y="263" font-size="12" font-weight="700" fill="#0F766E">读取入口：try_get_generation_config（回落读 config.json）</text>
  <text x="476" y="285" font-size="11.5" font-family="var(--font-mono)" fill="#334155">temperature | top_p | top_k | 额外 eos_token_id</text>

  <line x1="466" y1="312" x2="466" y2="376" stroke="#D97706" stroke-width="3"/>
  <text x="478" y="326" font-size="12" font-weight="700" fill="#92400E">现象：请求未显式传参时默认开启随机采样或遇词提前停</text>
  <text x="478" y="349" font-size="12" fill="#334155">并非框架异常，而是沿用了出厂 GenerationConfig 默认值</text>
  <text x="478" y="372" font-size="12" font-weight="700" fill="#0F766E">解法：启动传 --generation-config vllm 或请求显式传参</text>
</svg>
