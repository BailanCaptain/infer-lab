<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 390" width="900" height="390" role="img" aria-label="head_dim 2 倍算账陷阱开放式几何对比图" font-family="var(--font-sans)">
  <title>Qwen3-30B-A3B 的显式 head_dim = 128 与 GQA 分组几何比例及 2 倍算账陷阱对照。</title>
  <desc>对比盲套 get_hidden_size 除以 get_total_num_attention_heads 得 64 的错误心算，与 get_head_size 优先取显式 head_dim = 128 并在 Qwen3Attention 中构造 q_norm、k_norm 及 total_num_kv_heads = 4 的真实几何比例。</desc>

  <!-- Open Vertical Dashed Divider -->
  <line x1="432" y1="14" x2="432" y2="376" stroke="#b8bcb5" stroke-width="1.5" stroke-dasharray="6 4"/>

  <!-- Left Column: Wrong Assumption -->
  <text x="16" y="30" font-size="16" font-weight="700" fill="#b54237">✗ 错误心算：盲套 head_dim = H ÷ n_q</text>
  <text x="16" y="56" font-size="13.5" fill="#4d5652">Qwen3-30B-A3B：H = 2048，n_q = 32，n_kv = 4</text>

  <rect x="16" y="70" width="176" height="34" rx="5" fill="#d8d8cf" stroke="#4d5652" stroke-width="1.4"/>
  <text x="104" y="92" text-anchor="middle" font-size="14" font-family="var(--font-mono)" font-weight="700" fill="#17211f">hidden_size = 2048</text>

  <text x="16" y="130" font-size="14.5" font-weight="700" fill="#b54237">误推单头维度：2048 ÷ 32 = 64（窄头！）</text>

  <rect x="16" y="144" width="176" height="36" rx="5" fill="#fae1d8" stroke="#b54237" stroke-width="1.4"/>
  <text x="104" y="167" text-anchor="middle" font-size="13.5" font-family="var(--font-mono)" font-weight="700" fill="#8f3229">q_dim = 2048</text>
  <rect x="192" y="144" width="176" height="36" rx="5" fill="none" stroke="#b54237" stroke-width="1.4" stroke-dasharray="5 3"/>
  <text x="280" y="167" text-anchor="middle" font-size="13.5" font-weight="700" fill="#b54237">漏算一半 (-2048)</text>

  <rect x="16" y="196" width="44" height="32" rx="4" fill="#fae1d8" stroke="#b54237" stroke-width="1.3"/>
  <rect x="60" y="196" width="44" height="32" rx="4" fill="none" stroke="#b54237" stroke-width="1.3" stroke-dasharray="4 3"/>
  <text x="116" y="217" font-size="13.5" font-weight="700" fill="#8f3229">误算 kv_dim = 256（真实 512）</text>

  <line x1="18" y1="248" x2="18" y2="366" stroke="#b54237" stroke-width="3"/>
  <text x="30" y="264" font-size="15" font-weight="700" fill="#b54237">严重算账后果（全部少算 50%）：</text>
  <text x="30" y="294" font-size="13.5" fill="#4d5652">• 单层 Q/K/V/O 投影参数量少算一半</text>
  <text x="30" y="322" font-size="13.5" fill="#4d5652">• 每 token KV 误算 48 KiB（实为 96 KiB）</text>
  <text x="30" y="350" font-size="13.5" fill="#4d5652">• q_norm / k_norm 误当 64（实按 128 构造）</text>

  <!-- Right Column: Ground Truth in vLLM -->
  <text x="450" y="30" font-size="16" font-weight="700" fill="#087f73">✓ 源码真相：显式 "head_dim": 128 优先</text>
  <text x="450" y="56" font-size="13.5" font-family="var(--font-mono)" font-weight="700" fill="#087f73">get_head_size(): head_dim &gt; 0 ? 128 : H // n_q</text>

  <rect x="450" y="70" width="168" height="34" rx="5" fill="#d8d8cf" stroke="#4d5652" stroke-width="1.4"/>
  <text x="534" y="92" text-anchor="middle" font-size="14" font-family="var(--font-mono)" font-weight="700" fill="#17211f">H = 2048</text>
  <text x="630" y="92" font-size="14" font-weight="700" fill="#087f73">── q_proj 扩张 2× ──▶</text>

  <g>
    <rect x="450" y="118" width="328" height="38" rx="5" fill="#d7e0fb" stroke="#4c65b6" stroke-width="1.5"/>
    <line x1="532" y1="118" x2="532" y2="156" stroke="#4c65b6" stroke-width="1.2"/>
    <line x1="614" y1="118" x2="614" y2="156" stroke="#4c65b6" stroke-width="1.2"/>
    <line x1="696" y1="118" x2="696" y2="156" stroke="#4c65b6" stroke-width="1.2"/>
    <text x="491" y="142" text-anchor="middle" font-size="13.5" font-weight="700" fill="#3a4f93">8Q(1024)</text>
    <text x="573" y="142" text-anchor="middle" font-size="13.5" font-weight="700" fill="#3a4f93">8Q(1024)</text>
    <text x="655" y="142" text-anchor="middle" font-size="13.5" font-weight="700" fill="#3a4f93">8Q(1024)</text>
    <text x="737" y="142" text-anchor="middle" font-size="13.5" font-weight="700" fill="#3a4f93">8Q(1024)</text>
    <text x="786" y="134" font-size="14" font-weight="700" fill="#4c65b6">q_dim=4096</text>
    <text x="786" y="155" font-size="13.5" fill="#4d5652">(32 × 128)</text>
  </g>

  <line x1="491" y1="156" x2="473" y2="188" stroke="#087f73" stroke-width="1.4"/>
  <line x1="573" y1="156" x2="519" y2="188" stroke="#087f73" stroke-width="1.4"/>
  <line x1="655" y1="156" x2="565" y2="188" stroke="#087f73" stroke-width="1.4"/>
  <line x1="737" y1="156" x2="611" y2="188" stroke="#087f73" stroke-width="1.4"/>

  <g>
    <rect x="450" y="188" width="184" height="34" rx="5" fill="#faeab8" stroke="#c78300" stroke-width="1.4"/>
    <line x1="496" y1="188" x2="496" y2="222" stroke="#c78300"/>
    <line x1="542" y1="188" x2="542" y2="222" stroke="#c78300"/>
    <line x1="588" y1="188" x2="588" y2="222" stroke="#c78300"/>
    <text x="473" y="210" text-anchor="middle" font-size="13.5" font-weight="700" fill="#936300">KV1</text>
    <text x="519" y="210" text-anchor="middle" font-size="13.5" font-weight="700" fill="#936300">KV2</text>
    <text x="565" y="210" text-anchor="middle" font-size="13.5" font-weight="700" fill="#936300">KV3</text>
    <text x="611" y="210" text-anchor="middle" font-size="13.5" font-weight="700" fill="#936300">KV4</text>
    <text x="644" y="201" font-size="14" font-weight="700" fill="#936300">kv_dim = 4×128 = 512</text>
    <text x="644" y="222" font-size="13.5" fill="#4d5652">每 8 个 Q 头共享 1 个 KV 头</text>
  </g>

  <line x1="452" y1="248" x2="452" y2="366" stroke="#087f73" stroke-width="3"/>
  <text x="464" y="264" font-size="15" font-weight="700" fill="#087f73">Qwen3Attention 单层真实尺寸（18.88M）：</text>
  <text x="464" y="294" font-size="13.5" font-family="var(--font-mono)" fill="#4d5652">q_proj 2048×4096 | k/v_proj 2048×512</text>
  <text x="464" y="322" font-size="13.5" font-family="var(--font-mono)" fill="#4d5652">o_proj 4096×2048 | q_norm/k_norm: 128</text>
  <text x="464" y="350" font-size="13.5" fill="#4d5652">缺省 num_key_value_heads 时默认退回 MHA</text>
</svg>
