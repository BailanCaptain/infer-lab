<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 330" width="900" height="330" role="img" aria-label="head_dim 2 倍算账陷阱开放式几何对比图" font-family="var(--font-sans)">
  <title>Qwen3-30B-A3B 的显式 head_dim = 128 与 GQA 分组几何比例及 2 倍算账陷阱对照。</title>
  <desc>对比盲套 get_hidden_size 除以 get_total_num_attention_heads 得 64 的错误心算，与 get_head_size 优先取显式 head_dim = 128 并在 Qwen3Attention 中构造 q_norm、k_norm 及 total_num_kv_heads = 4 的真实几何比例。</desc>

  <!-- Open Vertical Dashed Divider -->
  <line x1="428" y1="14" x2="428" y2="316" stroke="#CBD5E1" stroke-width="1.5" stroke-dasharray="6 4"/>

  <!-- Left Column: Wrong Assumption (Open Section, Strokes Only on Tensors) -->
  <text x="16" y="28" font-size="14" font-weight="700" fill="#BE123C">✗ 错误心算：盲套旧经验 head_dim = H ÷ n_q</text>
  <text x="16" y="52" font-size="12" fill="#475569">已知 Qwen3-30B-A3B：H = 2048，n_q = 32，n_kv = 4</text>

  <!-- H bar = 168px representing 2048 -->
  <rect x="16" y="64" width="168" height="28" rx="4" fill="#E2E8F0" stroke="#475569" stroke-width="1.3"/>
  <text x="100" y="83" text-anchor="middle" font-size="12" font-family="var(--font-mono)" font-weight="700" fill="#1E293B">hidden_size = 2048</text>

  <text x="16" y="114" font-size="12.5" font-weight="700" fill="#BE123C">误推单头维度：2048 ÷ 32 = 64（窄头！）</text>

  <!-- Wrong q_dim bar = 168px + missing 168px ghost -->
  <rect x="16" y="125" width="168" height="32" rx="4" fill="#FFE4E6" stroke="#BE123C" stroke-width="1.4"/>
  <text x="100" y="146" text-anchor="middle" font-size="11.5" font-family="var(--font-mono)" font-weight="700" fill="#9F1239">误算 q_dim = 2048</text>
  <rect x="184" y="125" width="168" height="32" rx="4" fill="none" stroke="#BE123C" stroke-width="1.4" stroke-dasharray="5 3"/>
  <text x="268" y="146" text-anchor="middle" font-size="12" font-weight="700" fill="#BE123C">漏算整整一半 (-2048)</text>

  <!-- Wrong kv_dim bar -->
  <rect x="16" y="170" width="42" height="28" rx="4" fill="#FFE4E6" stroke="#BE123C" stroke-width="1.3"/>
  <rect x="58" y="170" width="42" height="28" rx="4" fill="none" stroke="#BE123C" stroke-width="1.3" stroke-dasharray="4 3"/>
  <text x="110" y="189" font-size="12" font-weight="600" fill="#9F1239">误算 kv_dim = 256（真实为 512）</text>

  <!-- Open Consequence List -->
  <line x1="18" y1="216" x2="18" y2="306" stroke="#F43F5E" stroke-width="3"/>
  <text x="30" y="230" font-size="13" font-weight="700" fill="#BE123C">严重算账后果（全部少算 50%）：</text>
  <text x="30" y="253" font-size="12" fill="#334155">• 单层 Q / K / V / O 投影矩阵参数量少算一半</text>
  <text x="30" y="276" font-size="12" fill="#334155">• 每 token KV cache 误算 48 KiB（真实 96.0 KiB）</text>
  <text x="30" y="299" font-size="12" fill="#334155">• q_norm / k_norm 误当 64（真实按 128 构造）</text>

  <!-- Right Column: Ground Truth in vLLM (Open Section, Strokes Only on Tensors) -->
  <text x="448" y="28" font-size="14" font-weight="700" fill="#0F766E">✓ 源码真相：显式 "head_dim": 128 优先</text>
  <text x="448" y="52" font-size="12" font-family="var(--font-mono)" font-weight="700" fill="#0F766E">get_head_size(): head_dim &gt; 0 ? 128 : H // n_q</text>

  <!-- H bar = 168px (2048) -> expands 2x to 336px (4096) -->
  <rect x="448" y="64" width="168" height="28" rx="4" fill="#E2E8F0" stroke="#475569" stroke-width="1.3"/>
  <text x="532" y="83" text-anchor="middle" font-size="12" font-family="var(--font-mono)" font-weight="700" fill="#1E293B">H = 2048</text>
  <text x="628" y="83" font-size="12" font-weight="700" fill="#0F766E">── q_proj 宽投影扩张 2× ──▶</text>

  <!-- True q_dim = 336px (4096 = 32 x 128), 4 GQA groups -->
  <g>
    <rect x="448" y="106" width="336" height="34" rx="4" fill="#DBEAFE" stroke="#1D4ED8" stroke-width="1.5"/>
    <line x1="532" y1="106" x2="532" y2="140" stroke="#1D4ED8" stroke-width="1.1"/>
    <line x1="616" y1="106" x2="616" y2="140" stroke="#1D4ED8" stroke-width="1.1"/>
    <line x1="700" y1="106" x2="700" y2="140" stroke="#1D4ED8" stroke-width="1.1"/>
    <text x="490" y="128" text-anchor="middle" font-size="11.5" font-weight="700" fill="#1E40AF">8Q (1024)</text>
    <text x="574" y="128" text-anchor="middle" font-size="11.5" font-weight="700" fill="#1E40AF">8Q (1024)</text>
    <text x="658" y="128" text-anchor="middle" font-size="11.5" font-weight="700" fill="#1E40AF">8Q (1024)</text>
    <text x="742" y="128" text-anchor="middle" font-size="11.5" font-weight="700" fill="#1E40AF">8Q (1024)</text>
    <text x="794" y="121" font-size="12" font-weight="700" fill="#1D4ED8">q_dim = 4096</text>
    <text x="794" y="138" font-size="11.5" fill="#475569">(32 × 128)</text>
  </g>

  <!-- GQA 8:1 Sharing Converging Lines -->
  <line x1="490" y1="140" x2="472" y2="168" stroke="#0F766E" stroke-width="1.3"/>
  <line x1="574" y1="140" x2="516" y2="168" stroke="#0F766E" stroke-width="1.3"/>
  <line x1="658" y1="140" x2="560" y2="168" stroke="#0F766E" stroke-width="1.3"/>
  <line x1="742" y1="140" x2="604" y2="168" stroke="#0F766E" stroke-width="1.3"/>

  <!-- True kv_dim = 4 KV heads x 128 = 512 -->
  <g>
    <rect x="450" y="168" width="176" height="30" rx="4" fill="#FEF3C7" stroke="#B45309" stroke-width="1.4"/>
    <line x1="494" y1="168" x2="494" y2="198" stroke="#B45309"/>
    <line x1="538" y1="168" x2="538" y2="198" stroke="#B45309"/>
    <line x1="582" y1="168" x2="582" y2="198" stroke="#B45309"/>
    <text x="472" y="188" text-anchor="middle" font-size="11.5" font-weight="700" fill="#92400E">KV1</text>
    <text x="516" y="188" text-anchor="middle" font-size="11.5" font-weight="700" fill="#92400E">KV2</text>
    <text x="560" y="188" text-anchor="middle" font-size="11.5" font-weight="700" fill="#92400E">KV3</text>
    <text x="604" y="188" text-anchor="middle" font-size="11.5" font-weight="700" fill="#92400E">KV4</text>
    <text x="638" y="182" font-size="12" font-weight="700" fill="#92400E">kv_dim = 4 × 128 = 512</text>
    <text x="638" y="199" font-size="11.5" fill="#475569">每 8 个 Q 头共享 1 组 KV 头</text>
  </g>

  <!-- Open Ground-Truth Summary -->
  <line x1="450" y1="216" x2="450" y2="306" stroke="#0F766E" stroke-width="3"/>
  <text x="462" y="230" font-size="13" font-weight="700" fill="#0F766E">Qwen3Attention 单层真实尺寸（18,876,672 参数）：</text>
  <text x="462" y="253" font-size="11.5" font-family="var(--font-mono)" fill="#334155">q_proj 2048×4096 | k/v_proj 2048×512 | o_proj 4096×2048</text>
  <text x="462" y="276" font-size="11.5" font-family="var(--font-mono)" fill="#334155">input_layernorm: 2048 | q_norm: 128 | k_norm: 128</text>
  <text x="462" y="299" font-size="12" fill="#475569">若缺省 num_key_value_heads，解析器默认 n_kv = n_q 退回 MHA</text>
</svg>
