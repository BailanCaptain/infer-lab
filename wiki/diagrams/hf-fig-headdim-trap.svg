<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 305" width="860" height="305" role="img" aria-label="head_dim 2 倍算账陷阱几何对比图" font-family="var(--font-sans)">
  <title>Qwen3-30B-A3B 的显式 head_dim = 128 与 GQA 分组几何比例及 2 倍算账陷阱对照。</title>
  <rect x="2" y="2" width="856" height="301" rx="6" fill="#FCFBF7" stroke="#DCD6C8"/>

  <!-- Left Half: Wrong Assumption -->
  <rect x="14" y="14" width="386" height="277" rx="6" fill="#FFF5F6" stroke="#F43F5E" stroke-width="1.3"/>
  <rect x="14" y="14" width="386" height="28" rx="5" fill="#FFE4E6"/>
  <text x="26" y="33" font-size="11.4" font-weight="800" fill="#BE123C">✗ 错误直觉：盲套旧经验 head_dim = H ÷ n_q</text>

  <text x="26" y="60" font-size="10.5" fill="#344054">输入隐藏向量 H = 2048，Q 头数 n_q = 32，KV 头数 n_kv = 4</text>
  <!-- H bar = 160px representing 2048 -->
  <rect x="26" y="70" width="160" height="24" rx="3" fill="#E2E8F0" stroke="#64748B"/>
  <text x="106" y="86" text-anchor="middle" font-size="10.2" font-family="var(--font-mono)" font-weight="700" fill="#1E293B">hidden_size = 2048</text>

  <text x="26" y="114" font-size="10.5" font-weight="700" fill="#BE123C">误推单头维度：2048 ÷ 32 = 64（窄头！）</text>
  <!-- Wrong q_dim bar = 160px (2048) -->
  <rect x="26" y="124" width="160" height="28" rx="3" fill="#FECDD3" stroke="#BE123C" stroke-width="1.2"/>
  <text x="106" y="142" text-anchor="middle" font-size="10" font-family="var(--font-mono)" font-weight="700" fill="#9F1239">误算 q_dim = 32×64 = 2048</text>
  <!-- Dashed ghost showing missing 2048 half! -->
  <rect x="186" y="124" width="160" height="28" rx="3" fill="none" stroke="#BE123C" stroke-width="1.2" stroke-dasharray="4 3"/>
  <text x="266" y="142" text-anchor="middle" font-size="10" font-weight="700" fill="#BE123C">漏算整整一半 (-2048)！</text>

  <!-- Wrong kv_dim bar -->
  <rect x="26" y="164" width="40" height="24" rx="3" fill="#FECDD3" stroke="#BE123C"/>
  <rect x="66" y="164" width="40" height="24" rx="3" fill="none" stroke="#BE123C" stroke-dasharray="3 2"/>
  <text x="116" y="180" font-size="10" fill="#9F1239">误算 kv_dim = 4×64 = 256（真实为 512）</text>

  <rect x="26" y="202" width="360" height="76" rx="4" fill="#FFFFFF" stroke="#FDA4AF"/>
  <text x="36" y="221" font-size="10.5" font-weight="700" fill="#BE123C">严重算账后果（全部少算 50%）：</text>
  <text x="36" y="238" font-size="10" fill="#344054">• 单层 q_proj / k_proj / v_proj / o_proj 权重参数量少算一半</text>
  <text x="36" y="254" font-size="10" fill="#344054">• 每 token 全层 BF16 KV cache 误算为 48 KiB（真实 96.0 KiB）</text>
  <text x="36" y="270" font-size="10" fill="#344054">• q_norm / k_norm 维度误当成 64（真实按 head_dim=128 构造）</text>

  <!-- Right Half: Ground Truth in vLLM -->
  <rect x="414" y="14" width="432" height="277" rx="6" fill="#F0FDF9" stroke="#0F766E" stroke-width="1.4"/>
  <rect x="414" y="14" width="432" height="28" rx="5" fill="#CCFBF1"/>
  <text x="426" y="33" font-size="11.4" font-weight="800" fill="#0F766E">✓ 真实配置与源码优先级：显式 "head_dim": 128 生效</text>

  <text x="426" y="58" font-size="10.2" font-family="var(--font-mono)" fill="#0F766E" font-weight="700">get_head_size(): head_dim &gt; 0 ? head_dim(128) : H // n_q</text>

  <!-- H bar = 160px (2048) -> expands via q_proj [2048 x 4096] to 320px (4096)! -->
  <rect x="426" y="68" width="160" height="22" rx="3" fill="#E2E8F0" stroke="#475569"/>
  <text x="506" y="83" text-anchor="middle" font-size="9.8" font-family="var(--font-mono)" font-weight="700" fill="#1E293B">H = 2048</text>
  <text x="600" y="83" font-size="10" fill="#0F766E" font-weight="700">── q_proj 宽投影扩张 2× ──▶</text>

  <!-- True q_dim = 320px (4096 = 32 x 128), split into 4 GQA groups of 8 Q heads -->
  <g>
    <rect x="426" y="102" width="320" height="30" rx="3" fill="#DBEAFE" stroke="#1D4ED8" stroke-width="1.4"/>
    <line x1="506" y1="102" x2="506" y2="132" stroke="#1D4ED8" stroke-width="1"/>
    <line x1="586" y1="102" x2="586" y2="132" stroke="#1D4ED8" stroke-width="1"/>
    <line x1="666" y1="102" x2="666" y2="132" stroke="#1D4ED8" stroke-width="1"/>
    <text x="466" y="121" text-anchor="middle" font-size="9.5" font-weight="700" fill="#1E40AF">8Q (1024)</text>
    <text x="546" y="121" text-anchor="middle" font-size="9.5" font-weight="700" fill="#1E40AF">8Q (1024)</text>
    <text x="626" y="121" text-anchor="middle" font-size="9.5" font-weight="700" fill="#1E40AF">8Q (1024)</text>
    <text x="706" y="121" text-anchor="middle" font-size="9.5" font-weight="700" fill="#1E40AF">8Q (1024)</text>
    <text x="754" y="116" font-size="10" font-weight="700" fill="#1D4ED8">q_dim = 4096</text>
    <text x="754" y="129" font-size="9.5" fill="#344054">(32×128 != 2048)</text>
  </g>

  <!-- GQA 8:1 Sharing Converging Lines -->
  <line x1="466" y1="132" x2="450" y2="156" stroke="#0F766E" stroke-width="1.2"/>
  <line x1="546" y1="132" x2="490" y2="156" stroke="#0F766E" stroke-width="1.2"/>
  <line x1="626" y1="132" x2="530" y2="156" stroke="#0F766E" stroke-width="1.2"/>
  <line x1="706" y1="132" x2="570" y2="156" stroke="#0F766E" stroke-width="1.2"/>

  <!-- True kv_dim = 4 KV heads x 128 = 512 -->
  <g>
    <rect x="430" y="156" width="160" height="28" rx="3" fill="#FEF3C7" stroke="#B45309" stroke-width="1.3"/>
    <line x1="470" y1="156" x2="470" y2="184" stroke="#B45309"/>
    <line x1="510" y1="156" x2="510" y2="184" stroke="#B45309"/>
    <line x1="550" y1="156" x2="550" y2="184" stroke="#B45309"/>
    <text x="450" y="174" text-anchor="middle" font-size="9" font-weight="700" fill="#92400E">KV1</text>
    <text x="490" y="174" text-anchor="middle" font-size="9" font-weight="700" fill="#92400E">KV2</text>
    <text x="530" y="174" text-anchor="middle" font-size="9" font-weight="700" fill="#92400E">KV3</text>
    <text x="570" y="174" text-anchor="middle" font-size="9" font-weight="700" fill="#92400E">KV4</text>
    <text x="600" y="168" font-size="10.2" font-weight="700" fill="#92400E">kv_dim = 4 × 128 = 512</text>
    <text x="600" y="182" font-size="9.6" fill="#344054">GQA：每 8 个 Q 头共享 1 组 K/V 头</text>
  </g>

  <rect x="426" y="202" width="406" height="76" rx="4" fill="#FFFFFF" stroke="#99F6E4"/>
  <text x="436" y="221" font-size="10.5" font-weight="700" fill="#0F766E">Qwen3Attention 精确落盘尺寸（单层 18,876,672 参数）：</text>
  <text x="436" y="238" font-size="10" font-family="var(--font-mono)" fill="#344054">q_proj: 2048×4096 | k_proj, v_proj: 2048×512 | o_proj: 4096×2048</text>
  <text x="436" y="254" font-size="10" font-family="var(--font-mono)" fill="#344054">input_layernorm: 2048 | q_norm: 128 | k_norm: 128</text>
  <text x="436" y="270" font-size="10" fill="#344054">若缺省 num_key_value_heads，解析器默认令 n_kv = n_q 退回标准 MHA</text>
</svg>
