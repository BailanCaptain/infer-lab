<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 425" width="900" height="425" role="img" aria-label="MoE 层判定公式与常驻显存 vs 激活算力及 KV 反差比例图" font-family="var(--font-sans)">
  <title>Qwen3MoeDecoderLayer 三条件门禁与常驻权重显存、单步激活参数及每 token KV cache 比例对照。</title>
  <desc>Qwen3MoeDecoderLayer 同时检查 mlp_only_layers、num_experts 与 decoder_sparse_step，满足时按 num_experts_per_tok 与 moe_intermediate_size 构造稀疏 MoE，否则退回 intermediate_size 稠密层。</desc>

  <!-- Top Band: 3-Condition Gate -->
  <text x="14" y="28" font-size="16" font-weight="700" fill="#17211f">A. Qwen3MoeDecoderLayer 第 i 层（0..47）稀疏与稠密分流门禁</text>

  <rect x="14" y="44" width="200" height="60" rx="7" fill="#e8edff" stroke="#4c65b6" stroke-width="1.4"/>
  <text x="114" y="68" text-anchor="middle" font-size="14" font-family="var(--font-mono)" font-weight="700" fill="#3a4f93">① i ∉ mlp_only_layers</text>
  <text x="114" y="92" text-anchor="middle" font-size="13.5" fill="#4d5652">30B-A3B 为 []（无例外）</text>

  <rect x="222" y="44" width="174" height="60" rx="7" fill="#e8edff" stroke="#4c65b6" stroke-width="1.4"/>
  <text x="309" y="68" text-anchor="middle" font-size="14" font-family="var(--font-mono)" font-weight="700" fill="#3a4f93">② num_experts &gt; 0</text>
  <text x="309" y="92" text-anchor="middle" font-size="13.5" fill="#4d5652">共 128 个路由专家</text>

  <rect x="404" y="44" width="214" height="60" rx="7" fill="#e8edff" stroke="#4c65b6" stroke-width="1.4"/>
  <text x="511" y="68" text-anchor="middle" font-size="13.5" font-family="var(--font-mono)" font-weight="700" fill="#3a4f93">③ (i+1)%sparse_step==0</text>
  <text x="511" y="92" text-anchor="middle" font-size="13.5" fill="#4d5652">decoder_sparse_step = 1</text>

  <rect x="626" y="55" width="54" height="38" rx="19" fill="#17211f"/>
  <text x="653" y="79" text-anchor="middle" font-size="13.5" font-weight="800" fill="#ffffff">AND</text>

  <rect x="688" y="38" width="198" height="34" rx="6" fill="#ddf4ef" stroke="#087f73" stroke-width="1.4"/>
  <text x="787" y="60" text-anchor="middle" font-size="13.5" font-weight="700" fill="#087f73">全真 → 稀疏 MoE（48层）</text>

  <rect x="688" y="80" width="198" height="34" rx="6" fill="#ece9df" stroke="#8a928f" stroke-width="1.3"/>
  <text x="787" y="102" text-anchor="middle" font-size="13.5" fill="#4d5652">任一假 → 稠密 MLP 层</text>

  <!-- Open Dashed Divider -->
  <line x1="14" y1="130" x2="886" y2="130" stroke="#b8bcb5" stroke-width="1.5" stroke-dasharray="6 4"/>

  <!-- Bottom Band: Proportional Memory & KV Bars -->
  <text x="14" y="160" font-size="16" font-weight="700" fill="#17211f">B. 常驻权重显存 vs 单步激活参数 vs 每 token KV cache 比例对账</text>

  <text x="14" y="194" font-size="15" font-weight="700" fill="#17211f">Qwen3-8B 权重</text>
  <text x="14" y="216" font-size="13.5" fill="#4d5652">稠密 36 层 · 全激活</text>
  <rect x="208" y="180" width="160" height="38" rx="5" fill="#4c65b6" stroke="#4c65b6" stroke-width="1.4"/>
  <text x="288" y="204" text-anchor="middle" font-size="14" font-weight="700" fill="#ffffff">15.26 GiB</text>
  <text x="380" y="204" font-size="14" font-weight="700" fill="#087f73">◀ 单卡可放，余留充裕 KV</text>

  <text x="14" y="254" font-size="15" font-weight="700" fill="#17211f">30B-A3B 权重</text>
  <text x="14" y="276" font-size="13.5" fill="#4d5652">128 常驻 / 单步选 8</text>
  <rect x="208" y="240" width="597" height="38" rx="5" fill="#faeab8" stroke="#c78300" stroke-width="1.4"/>
  <rect x="208" y="240" width="68" height="38" rx="5" fill="#c78300"/>
  <text x="242" y="264" text-anchor="middle" font-size="13.5" font-weight="700" fill="#ffffff">3.35B</text>
  <text x="556" y="264" text-anchor="middle" font-size="14" font-weight="700" fill="#936300">128 专家常驻：56.87 GiB（单卡 OOM）</text>
  <text x="208" y="304" font-size="13.5" font-weight="700" fill="#c78300">▲ num_experts_per_tok = 8（仅激活 3.35B）</text>

  <line x1="544" y1="172" x2="544" y2="294" stroke="#b54237" stroke-width="2" stroke-dasharray="5 3"/>
  <rect x="554" y="284" width="166" height="28" rx="5" fill="#fae1d8" stroke="#b54237" stroke-width="1.3"/>
  <text x="637" y="303" text-anchor="middle" font-size="13.5" font-weight="700" fill="#b54237">32 GiB 单卡显存上限</text>

  <text x="14" y="356" font-size="15" font-weight="700" fill="#17211f">每 token KV</text>
  <text x="14" y="380" font-size="13.5" fill="#4d5652">只看 L × n_kv × d_h</text>

  <rect x="208" y="332" width="312" height="32" rx="5" fill="#d7e0fb" stroke="#4c65b6" stroke-width="1.3"/>
  <text x="364" y="353" text-anchor="middle" font-size="14" font-weight="700" fill="#3a4f93">Qwen3-8B（8 KV 头）：144.0 KiB / tok</text>

  <rect x="208" y="374" width="208" height="32" rx="5" fill="#cbe9e2" stroke="#087f73" stroke-width="1.4"/>
  <text x="312" y="395" text-anchor="middle" font-size="14" font-weight="700" fill="#087f73">30B-A3B：96.0 KiB</text>
  <text x="428" y="395" font-size="14" font-weight="700" fill="#087f73">◀ 48 层仅 4 KV 头，缓存省 1/3！</text>
</svg>
