<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 268" width="900" height="268" role="img" aria-label="rope_scaling 两类家族缩放分流与 longrope 短上下文保护图" font-family="var(--font-sans)">
  <title>rope_scaling 在 vllm _get_and_verify_max_len 中的两类家族缩放分流与 longrope 短上下文回退保护。</title>
  <desc>_get_and_verify_max_len 读取 max_position_embeddings 与 rope_scaling（rope_parameters），区分倍乘型与已扩展长度型，并为 longrope 提供 original_max_position_embeddings 短上下文回退保护。</desc>
  <defs>
    <marker id="ropeAhBlue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="#1D4ED8"/>
    </marker>
    <marker id="ropeAhTeal" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="#0F766E"/>
    </marker>
    <marker id="ropeAhAmber" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="#D97706"/>
    </marker>
  </defs>

  <!-- Left Input Box -->
  <rect x="16" y="38" width="228" height="178" rx="8" fill="#FFFFFF" stroke="#17211f" stroke-width="1.5"/>
  <text x="30" y="64" font-size="13.5" font-weight="700" fill="#17211f">位置编码配置输入</text>
  <text x="30" y="90" font-size="12" font-family="var(--font-mono)" font-weight="700" fill="#1D4ED8">max_position_embeddings</text>
  <text x="30" y="109" font-size="11.5" fill="#475569">（Qwen3 三预设均为 40960）</text>
  <text x="30" y="133" font-size="12" font-family="var(--font-mono)" font-weight="700" fill="#0F766E">rope_theta: 1000000</text>
  <text x="30" y="157" font-size="12" font-family="var(--font-mono)" font-weight="700" fill="#B45309">rope_scaling</text>
  <text x="30" y="176" font-size="11.5" fill="#475569">（或新格式 rope_parameters）</text>
  <text x="30" y="201" font-size="11.5" font-family="var(--font-mono)" fill="#334155">→ _get_and_verify_max_len</text>

  <!-- Branch 1: Multiply by factor -->
  <path d="M 244 92 L 274 92 L 274 54 L 304 54" fill="none" stroke="#1D4ED8" stroke-width="1.7" marker-end="url(#ropeAhBlue)"/>
  <rect x="308" y="14" width="576" height="80" rx="8" fill="#EFF6FF" stroke="#1D4ED8" stroke-width="1.5"/>
  <text x="324" y="38" font-size="13.5" font-weight="700" fill="#1D4ED8">家族一（传统倍乘型）：linear / dynamic 等</text>
  <text x="324" y="61" font-size="12.5" fill="#17211f">推导最大上下文 = <tspan font-family="var(--font-mono)" font-weight="700">max_position_embeddings × factor</tspan></text>
  <text x="324" y="82" font-size="11.5" font-weight="600" fill="#B45309">容错兜底：若配置文件误填 "factor": null → 打印警告并按 factor = 1.0 计算</text>

  <!-- Branch 2: Already final length -->
  <path d="M 244 156 L 274 156 L 274 146 L 304 146" fill="none" stroke="#0F766E" stroke-width="1.7" marker-end="url(#ropeAhTeal)"/>
  <rect x="308" y="110" width="576" height="72" rx="8" fill="#ECFDF5" stroke="#0F766E" stroke-width="1.5"/>
  <text x="324" y="135" font-size="13" font-weight="700" fill="#0F766E">家族二（已扩展长度型）：yarn / su / longrope / llama3 / deepseek_yarn 等</text>
  <text x="324" y="162" font-size="12.5" fill="#17211f">直接采用 <tspan font-family="var(--font-mono)" font-weight="700">max_position_embeddings</tspan> 作为扩展后最终长度 —— <tspan font-weight="700" fill="#BE123C">绝不再二次乘以 factor！</tspan></text>

  <!-- Sibling Sub-Node (Not nested box-in-box): longrope short-context safeguard -->
  <path d="M 342 182 L 342 226 L 368 226" fill="none" stroke="#D97706" stroke-width="1.6" marker-end="url(#ropeAhAmber)"/>
  <rect x="372" y="196" width="512" height="60" rx="8" fill="#FFFBEB" stroke="#D97706" stroke-width="1.4"/>
  <text x="388" y="219" font-size="12.5" font-weight="700" fill="#92400E">★ longrope 专属短上下文精度保护：未显式指定 --max-model-len（或传 -1）时</text>
  <text x="388" y="242" font-size="12" fill="#334155">默认退回 <tspan font-family="var(--font-mono)" font-weight="700">original_max_position_embeddings</tspan>，防短文本缩放损精度</text>
</svg>
