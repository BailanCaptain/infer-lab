<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 320" width="900" height="320" role="img" aria-label="tie_word_embeddings 首尾词表共享与 maybe_untie_word_embeddings 开放式流程图" font-family="var(--font-sans)">
  <title>tie_word_embeddings 首尾词表共享省显存效应与 v0.30.0 maybe_untie_word_embeddings 防丢独立 lm_head 流程。</title>
  <desc>对比 embed_tokens 与 ParallelLMHead（lm_head）在 tie_word_embeddings 为 false 与 true 时的显存占用，并展示 v0.30.0 maybe_untie_word_embeddings 在检测到独立 lm_head 时的三步保护核验。</desc>

  <!-- Open Vertical Dashed Divider -->
  <line x1="434" y1="14" x2="434" y2="306" stroke="#CBD5E1" stroke-width="1.5" stroke-dasharray="6 4"/>

  <!-- Left Section: Tied vs Untied Memory Anatomy -->
  <text x="16" y="28" font-size="14" font-weight="700" fill="#17211f">A. 首尾词表矩阵（V = 151,936）物理占用</text>

  <!-- Case 1: Qwen3-8B untied -->
  <text x="16" y="56" font-size="12.5" font-weight="700" fill="#1D4ED8">Qwen3-8B（H = 4096，tie_word_embeddings: false）</text>
  <rect x="16" y="68" width="182" height="48" rx="6" fill="#DBEAFE" stroke="#1D4ED8" stroke-width="1.4"/>
  <text x="107" y="89" text-anchor="middle" font-size="12" font-weight="700" fill="#1E3A8A">前端 embed_tokens</text>
  <text x="107" y="107" text-anchor="middle" font-size="11.5" font-family="var(--font-mono)" fill="#334155">151,936×4,096 (0.62B)</text>

  <text x="215" y="98" text-anchor="middle" font-size="15" font-weight="800" fill="#1D4ED8">+</text>

  <rect x="232" y="68" width="182" height="48" rx="6" fill="#DBEAFE" stroke="#1D4ED8" stroke-width="1.4"/>
  <text x="323" y="89" text-anchor="middle" font-size="12" font-weight="700" fill="#1E3A8A">独立头 lm_head</text>
  <text x="323" y="107" text-anchor="middle" font-size="11.5" font-family="var(--font-mono)" fill="#334155">4,096×151,936 (0.62B)</text>

  <text x="16" y="140" font-size="12" fill="#334155">双表独立存储：合占 <tspan font-weight="700" fill="#17211f">1.24B 参数（BF16 占 2.32 GiB）</tspan></text>

  <line x1="16" y1="160" x2="414" y2="160" stroke="#CBD5E1" stroke-width="1.3" stroke-dasharray="4 3"/>

  <!-- Case 2: Qwen3-0.6B tied -->
  <text x="16" y="185" font-size="12.5" font-weight="700" fill="#0F766E">Qwen3-0.6B（H = 1024，tie_word_embeddings: true）</text>
  <rect x="16" y="197" width="194" height="48" rx="6" fill="#CCFBF1" stroke="#0F766E" stroke-width="1.5"/>
  <text x="113" y="218" text-anchor="middle" font-size="12" font-weight="700" fill="#0F766E">共享唯一矩阵 [V × H]</text>
  <text x="113" y="236" text-anchor="middle" font-size="11.5" font-family="var(--font-mono)" fill="#334155">151,936×1,024 (0.16B)</text>

  <line x1="210" y1="221" x2="244" y2="221" stroke="#0F766E" stroke-width="1.6"/>
  <rect x="244" y="197" width="170" height="48" rx="6" fill="#FFFFFF" stroke="#0F766E" stroke-width="1.4" stroke-dasharray="5 3"/>
  <text x="329" y="218" text-anchor="middle" font-size="12" font-weight="700" fill="#0F766E">ParallelLMHead 复用</text>
  <text x="329" y="236" text-anchor="middle" font-size="11.5" fill="#0F766E">新增参数 = 0（省 0.16B）</text>

  <text x="16" y="269" font-size="12" fill="#334155">整模型总参数收敛至 <tspan font-weight="700" fill="#0F766E">0.60B</tspan>（非嵌入主干为 <tspan font-weight="700">0.44B</tspan>）</text>
  <text x="16" y="291" font-size="11.5" fill="#64748B">注：Qwen3-30B-A3B 亦为 false（首尾独立各 0.31B 参数）</text>

  <!-- Right Section: v0.30.0 maybe_untie_word_embeddings -->
  <text x="454" y="28" font-size="14" font-weight="700" fill="#17211f">B. 微调冲突保护：maybe_untie_word_embeddings</text>

  <rect x="454" y="44" width="430" height="48" rx="7" fill="#FFFBEB" stroke="#D97706" stroke-width="1.4"/>
  <text x="468" y="64" font-size="12.5" font-weight="700" fill="#92400E">冲突输入：config.json 仍写 tie_word_embeddings: true</text>
  <text x="468" y="83" font-size="11.5" fill="#334155">但微调导出的 .safetensors 实际附带了独立的 lm_head 张量！</text>

  <!-- Old versions branch -->
  <line x1="547" y1="92" x2="547" y2="112" stroke="#BE123C" stroke-width="1.5"/>
  <rect x="454" y="112" width="186" height="92" rx="7" fill="#FFF1F2" stroke="#BE123C" stroke-width="1.4"/>
  <text x="466" y="134" font-size="12.5" font-weight="700" fill="#BE123C">✗ v0.23 / v0.26rc</text>
  <text x="466" y="155" font-size="11.5" fill="#334155">盲信配置强行共享权重，</text>
  <text x="466" y="174" font-size="11.5" font-weight="700" fill="#BE123C">将检查点独立 lm_head</text>
  <text x="466" y="192" font-size="11.5" font-weight="700" fill="#BE123C">静默丢弃（输出乱码）</text>

  <!-- Open source note -->
  <line x1="458" y1="222" x2="458" y2="294" stroke="#94A3B8" stroke-width="2.5"/>
  <text x="468" y="237" font-size="12" font-weight="700" fill="#334155">源码位置（v0.30.0+）</text>
  <text x="468" y="257" font-size="11.5" font-family="var(--font-mono)" fill="#475569">vllm/config/model.py</text>
  <text x="468" y="277" font-size="11.5" fill="#475569">防微调配置不一致丢权重</text>

  <!-- v0.30.0+ 3-step branch (No outer wrapper cage) -->
  <line x1="770" y1="92" x2="770" y2="108" stroke="#0F766E" stroke-width="1.5"/>
  <text x="656" y="123" font-size="12.5" font-weight="700" fill="#0F766E">✓ v0.30.0 / main 三步安全核验</text>

  <rect x="656" y="133" width="228" height="46" rx="6" fill="#ECFDF5" stroke="#0F766E" stroke-width="1.3"/>
  <text x="668" y="152" font-size="12" font-weight="700" fill="#17211f">① 加载前预探测权重文件</text>
  <text x="668" y="170" font-size="11.5" fill="#334155">发现存在独立 lm_head 张量</text>

  <line x1="770" y1="179" x2="770" y2="191" stroke="#0F766E" stroke-width="1.5"/>
  <rect x="656" y="191" width="228" height="46" rx="6" fill="#ECFDF5" stroke="#0F766E" stroke-width="1.3"/>
  <text x="668" y="210" font-size="12" font-weight="700" fill="#17211f">② 临时改 tie = false 双份载入</text>
  <text x="668" y="228" font-size="11.5" fill="#334155">embed_tokens 与 lm_head 均保留</text>

  <line x1="770" y1="237" x2="770" y2="249" stroke="#0F766E" stroke-width="1.5"/>
  <rect x="656" y="249" width="228" height="51" rx="6" fill="#ECFDF5" stroke="#0F766E" stroke-width="1.5"/>
  <text x="668" y="269" font-size="12" font-weight="700" fill="#0F766E">③ 加载后比对两张量数值</text>
  <text x="668" y="288" font-size="11.5" fill="#334155">相等则合并，不等则保留独立头</text>
</svg>
