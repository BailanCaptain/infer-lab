<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 660" width="900" height="660" role="img" aria-label="HuggingFace 模型目录五类文件拆解剖面与开放式引线直标图" font-family="var(--font-sans)">
  <title>HuggingFace 模型目录立体拆解剖面：轻量 JSON 配置蓝图与数十 GiB safetensors 权重金库的空间分工。</title>
  <desc>开放画布拆解 HuggingFace 目录五类文件与源码入口：get_config 读取 config.json 的 architectures 与 model_type，get_hf_text_config 解包 text_config 并由 ModelArchitectureConfig 与 ModelArchConfigConvertorBase.get_head_size 转换；resolve_chat_template 与 _get_and_verify_max_len 读取 tokenizer_config.json 及 model_max_length；try_get_generation_config 读取 generation_config.json；maybe_auto_detect_quantization、detect_quantization_method 与 AscendFp8Config 检查 weight_block_size（不满足抛 NotImplementedError）；DefaultModelLoader 与 filter_duplicate_safetensors_files 按 weight_map 加载权重分片。</desc>

  <!-- Large Tight-Cropped Transparent Cutaway Illustration -->
  <image href="./wiki-illustrations/hf-folder-cutaway.webp" x="175" y="116" width="550" height="438" preserveAspectRatio="xMidYMid meet"/>

  <!-- Leader Lines & Clean Ring Target Dots (Zero Crossing) -->
  <!-- 1: Top-Col 1 -> Blue JSON Blueprint Folder (269, 291) -->
  <line x1="145" y1="92" x2="269" y2="291" stroke="#4c65b6" stroke-width="1.7"/>
  <circle cx="269" cy="291" r="6" fill="#ffffff" stroke="#4c65b6" stroke-width="2"/>
  <circle cx="269" cy="291" r="2.8" fill="#4c65b6"/>

  <!-- 2: Top-Col 2 -> Teal TOKEN Card (310, 245) -->
  <line x1="295" y1="92" x2="310" y2="245" stroke="#b54237" stroke-width="1.7"/>
  <circle cx="310" cy="245" r="6" fill="#ffffff" stroke="#b54237" stroke-width="2"/>
  <circle cx="310" cy="245" r="2.8" fill="#b54237"/>

  <!-- 3: Top-Col 3 -> Purple GEN Dial Card (354, 219) -->
  <line x1="495" y1="92" x2="354" y2="219" stroke="#9a4b86" stroke-width="1.7"/>
  <circle cx="354" cy="219" r="6" fill="#ffffff" stroke="#9a4b86" stroke-width="2"/>
  <circle cx="354" cy="219" r="2.8" fill="#9a4b86"/>

  <!-- 4: Top-Col 4 -> Amber QUANT Gauge Folder (403, 193) -->
  <line x1="695" y1="92" x2="403" y2="193" stroke="#c78300" stroke-width="1.7"/>
  <circle cx="403" cy="193" r="6" fill="#ffffff" stroke="#c78300" stroke-width="2"/>
  <circle cx="403" cy="193" r="2.8" fill="#c78300"/>

  <!-- 5: Bottom-Col 1 -> Center Blueprint + Magnifier & Calipers (475, 272) -->
  <line x1="235" y1="564" x2="475" y2="272" stroke="#4c65b6" stroke-width="1.7"/>
  <circle cx="475" cy="272" r="6" fill="#ffffff" stroke="#4c65b6" stroke-width="2"/>
  <circle cx="475" cy="272" r="2.8" fill="#4c65b6"/>

  <!-- 6: Bottom-Col 2 -> SAFETENSORS Gold Weight Ingots in Vault (563, 403) -->
  <line x1="485" y1="564" x2="563" y2="403" stroke="#c78300" stroke-width="1.7"/>
  <circle cx="563" cy="403" r="6" fill="#ffffff" stroke="#c78300" stroke-width="2"/>
  <circle cx="563" cy="403" r="2.8" fill="#c78300"/>

  <!-- 7: Bottom-Col 3 -> INDEX Clipboard on Vault Wall (667, 350) -->
  <line x1="720" y1="564" x2="667" y2="350" stroke="#087f73" stroke-width="1.7"/>
  <circle cx="667" cy="350" r="6" fill="#ffffff" stroke="#087f73" stroke-width="2"/>
  <circle cx="667" cy="350" r="2.8" fill="#087f73"/>

  <!-- Top Open Band: 4 Borderless Callouts -->
  <g>
    <circle cx="26" cy="26" r="12" fill="#4c65b6"/>
    <text x="26" y="30.5" text-anchor="middle" font-size="12.5" font-weight="700" fill="#ffffff">1</text>
    <text x="44" y="31" font-size="15" font-weight="700" fill="#17211f">核心蓝图 config.json</text>
    <text x="14" y="56" font-size="13.5" fill="#4d5652">get_config 读架构与层数</text>
    <text x="14" y="78" font-size="13.5" fill="#4d5652">定 head_dim 与 torch_dtype</text>
  </g>

  <g>
    <circle cx="246" cy="26" r="12" fill="#b54237"/>
    <text x="246" y="30.5" text-anchor="middle" font-size="12.5" font-weight="700" fill="#ffffff">2</text>
    <text x="264" y="31" font-size="15" font-weight="700" fill="#17211f">分词配置 tokenizer</text>
    <text x="234" y="56" font-size="13.5" font-weight="600" fill="#b54237">坑 1&amp;2：缺对话模板即报错</text>
    <text x="234" y="78" font-size="13.5" fill="#4d5652">model_max_length 取 min</text>
  </g>

  <g>
    <circle cx="470" cy="26" r="12" fill="#9a4b86"/>
    <text x="470" y="30.5" text-anchor="middle" font-size="12.5" font-weight="700" fill="#ffffff">3</text>
    <text x="488" y="31" font-size="15" font-weight="700" fill="#17211f">默认采样 generation</text>
    <text x="458" y="56" font-size="13.5" fill="#4d5652">启动期读取出厂采样超参</text>
    <text x="458" y="78" font-size="13.5" font-weight="600" fill="#9a4b86">坑 4：静音接管默认温度</text>
  </g>

  <g>
    <circle cx="694" cy="26" r="12" fill="#c78300"/>
    <text x="694" y="30.5" text-anchor="middle" font-size="12.5" font-weight="700" fill="#ffffff">4</text>
    <text x="712" y="31" font-size="15" font-weight="700" fill="#17211f">昇腾量化识别门禁</text>
    <text x="682" y="56" font-size="13.5" fill="#4d5652">ModelSlim 自动转 ascend</text>
    <text x="682" y="78" font-size="13.5" font-weight="600" fill="#c78300">原生 fp8 缺逐块参数报错</text>
  </g>

  <!-- Bottom Open Band: 3 Wide Borderless Callouts -->
  <g>
    <circle cx="26" cy="584" r="12" fill="#4c65b6"/>
    <text x="26" y="588.5" text-anchor="middle" font-size="12.5" font-weight="700" fill="#ffffff">5</text>
    <text x="44" y="589" font-size="15" font-weight="700" fill="#17211f">多模态剥壳与尺寸转换</text>
    <text x="14" y="614" font-size="13.5" fill="#4d5652">get_hf_text_config 剥取子配置</text>
    <text x="14" y="636" font-size="13.5" fill="#4d5652">ModelArchitectureConfig 算头维</text>
  </g>

  <g>
    <circle cx="320" cy="584" r="12" fill="#c78300"/>
    <text x="320" y="588.5" text-anchor="middle" font-size="12.5" font-weight="700" fill="#ffffff">6</text>
    <text x="338" y="589" font-size="15" font-weight="700" fill="#17211f">权重金库 *.safetensors</text>
    <text x="308" y="614" font-size="13.5" fill="#4d5652">DefaultModelLoader 按映射装载</text>
    <text x="308" y="636" font-size="13.5" fill="#4d5652">漏写精度时扫文件头推断 dtype</text>
  </g>

  <g>
    <circle cx="614" cy="584" r="12" fill="#087f73"/>
    <text x="614" y="588.5" text-anchor="middle" font-size="12.5" font-weight="700" fill="#ffffff">7</text>
    <text x="632" y="589" font-size="15" font-weight="700" fill="#17211f">分片索引与防重复加载</text>
    <text x="602" y="614" font-size="13.5" font-weight="600" fill="#b54237">坑 3：weight_map 缺片即报错</text>
    <text x="602" y="636" font-size="13.5" fill="#4d5652">靠 index.json 剔除合并重复文件</text>
  </g>
</svg>
