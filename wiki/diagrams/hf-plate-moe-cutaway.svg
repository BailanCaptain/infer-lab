<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 645" width="900" height="645" role="img" aria-label="Qwen3-8B 与 Qwen3-30B-A3B 立体拆解剖面与开放式引线直标图" font-family="var(--font-sans)">
  <title>Qwen3-30B-A3B 立体拆解剖面：128 间常驻专家机房与单 token 仅点亮 8 间的显存与算力反差。</title>
  <desc>开放画布呈现 EMBED → 32Q:4KV → ROUTER → 8/128 ACTIVE MoE → LM_HEAD 立体架构剖面：ModelArchConfigConvertorBase.get_head_size 与 Qwen3Attention 读取显式 head_dim=128 及 total_num_kv_heads；Qwen3MoeDecoderLayer 按 num_experts、decoder_sparse_step、mlp_only_layers 构造 FusedMoEFactory（num_experts_per_tok=8，moe_intermediate_size=768）；末尾 ParallelLMHead 由 tie_word_embeddings 控制是否共享词表权重。</desc>

  <!-- Wide 820px Tight-Cropped Transparent Architecture Cutaway -->
  <image href="./wiki-illustrations/hf-moe-layer-cutaway.webp" x="40" y="114" width="820" height="409" preserveAspectRatio="xMidYMid meet"/>

  <!-- Leader Lines & Clean Ring Target Dots (Zero Crossing) -->
  <!-- 1: Top-Col 1 -> EMBED 3D Slab (98, 247) -->
  <line x1="135" y1="92" x2="98" y2="247" stroke="#4c65b6" stroke-width="1.7"/>
  <circle cx="98" cy="247" r="6" fill="#ffffff" stroke="#4c65b6" stroke-width="2"/>
  <circle cx="98" cy="247" r="2.8" fill="#4c65b6"/>

  <!-- 2: Top-Col 2 -> 32Q:4KV Royal Blue GQA Drawers (301, 310) -->
  <line x1="325" y1="92" x2="301" y2="310" stroke="#b54237" stroke-width="1.7"/>
  <circle cx="301" cy="310" r="6" fill="#ffffff" stroke="#b54237" stroke-width="2"/>
  <circle cx="301" cy="310" r="2.8" fill="#b54237"/>

  <!-- 3: Top-Col 3 -> Glowing Teal Active Expert Room (506, 282) -->
  <line x1="502" y1="92" x2="506" y2="282" stroke="#087f73" stroke-width="1.7"/>
  <circle cx="506" cy="282" r="6" fill="#ffffff" stroke="#087f73" stroke-width="2"/>
  <circle cx="506" cy="282" r="2.8" fill="#087f73"/>

  <!-- 4: Top-Col 4 -> Unlit Resident Brown Expert Pool (667, 224) -->
  <line x1="720" y1="92" x2="667" y2="224" stroke="#c78300" stroke-width="1.7"/>
  <circle cx="667" cy="224" r="6" fill="#ffffff" stroke="#c78300" stroke-width="2"/>
  <circle cx="667" cy="224" r="2.8" fill="#c78300"/>

  <!-- 5: Bottom-Col 1 -> 32Q Attention Projection Wires (210, 367) -->
  <line x1="185" y1="538" x2="210" y2="367" stroke="#4c65b6" stroke-width="1.7"/>
  <circle cx="210" cy="367" r="6" fill="#ffffff" stroke="#4c65b6" stroke-width="2"/>
  <circle cx="210" cy="367" r="2.8" fill="#4c65b6"/>

  <!-- 6: Bottom-Col 2 -> Glowing ROUTER Beam (352, 314) -->
  <line x1="395" y1="538" x2="352" y2="314" stroke="#087f73" stroke-width="1.7"/>
  <circle cx="352" cy="314" r="6" fill="#ffffff" stroke="#087f73" stroke-width="2"/>
  <circle cx="352" cy="314" r="2.8" fill="#087f73"/>

  <!-- 7: Bottom-Col 3 -> LM_HEAD Slab & tie_word_embeddings Wire (816, 359) -->
  <line x1="800" y1="538" x2="816" y2="359" stroke="#4c65b6" stroke-width="1.7"/>
  <circle cx="816" cy="359" r="6" fill="#ffffff" stroke="#4c65b6" stroke-width="2"/>
  <circle cx="816" cy="359" r="2.8" fill="#4c65b6"/>

  <!-- Top Open Band: 4 Borderless Callouts -->
  <g>
    <circle cx="26" cy="26" r="12" fill="#4c65b6"/>
    <text x="26" y="30.5" text-anchor="middle" font-size="12.5" font-weight="700" fill="#ffffff">1</text>
    <text x="44" y="31" font-size="15" font-weight="700" fill="#17211f">首端词表 EMBED</text>
    <text x="14" y="56" font-size="13.5" fill="#4d5652">V=151,936 · 8B 占 0.62B</text>
    <text x="14" y="78" font-size="13.5" fill="#4d5652">30B-A3B (H=2048) 0.31B</text>
  </g>

  <g>
    <circle cx="246" cy="26" r="12" fill="#b54237"/>
    <text x="246" y="30.5" text-anchor="middle" font-size="12.5" font-weight="700" fill="#ffffff">2</text>
    <text x="264" y="31" font-size="15" font-weight="700" fill="#17211f">head_dim=128 陷阱</text>
    <text x="234" y="56" font-size="13.5" font-weight="600" fill="#b54237">32Q×128=4096 != H(2048)</text>
    <text x="234" y="78" font-size="13.5" fill="#4d5652">GQA 32Q:4KV · 错算少一半</text>
  </g>

  <g>
    <circle cx="470" cy="26" r="12" fill="#087f73"/>
    <text x="470" y="30.5" text-anchor="middle" font-size="12.5" font-weight="700" fill="#ffffff">3</text>
    <text x="488" y="31" font-size="15" font-weight="700" fill="#17211f">单步点亮 8 / 128</text>
    <text x="458" y="56" font-size="13.5" fill="#4d5652">I_moe=768 · 48 层稀疏</text>
    <text x="458" y="78" font-size="13.5" font-weight="600" fill="#087f73">单 token 仅激活 3.35B</text>
  </g>

  <g>
    <circle cx="694" cy="26" r="12" fill="#c78300"/>
    <text x="694" y="30.5" text-anchor="middle" font-size="12.5" font-weight="700" fill="#ffffff">4</text>
    <text x="712" y="31" font-size="15" font-weight="700" fill="#17211f">常驻 128 专家池</text>
    <text x="682" y="56" font-size="13.5" fill="#4d5652">总重 30.53B = 56.87 GiB</text>
    <text x="682" y="78" font-size="13.5" font-weight="600" fill="#b54237">全驻留 · 32 GiB 单卡 OOM</text>
  </g>

  <!-- Bottom Open Band: 3 Wide Borderless Callouts -->
  <g>
    <circle cx="26" cy="560" r="12" fill="#4c65b6"/>
    <text x="26" y="564.5" text-anchor="middle" font-size="12.5" font-weight="700" fill="#ffffff">5</text>
    <text x="44" y="565" font-size="15" font-weight="700" fill="#17211f">对照 Qwen3-8B 稠密基座</text>
    <text x="14" y="590" font-size="13.5" fill="#4d5652">36 层 H=4096 · 权重 15.26 GiB</text>
    <text x="14" y="612" font-size="13.5" fill="#4d5652">144.0 KiB KV/tok · 32 GiB 可跑</text>
  </g>

  <g>
    <circle cx="320" cy="560" r="12" fill="#087f73"/>
    <text x="320" y="564.5" text-anchor="middle" font-size="12.5" font-weight="700" fill="#ffffff">6</text>
    <text x="338" y="565" font-size="15" font-weight="700" fill="#17211f">ROUTER 路由与 KV 反差</text>
    <text x="308" y="590" font-size="13.5" fill="#4d5652">FusedMoEFactory 选 8 省前馈算力</text>
    <text x="308" y="612" font-size="13.5" font-weight="600" fill="#087f73">48 层仅 4 KV 头 → 96.0 KiB/tok</text>
  </g>

  <g>
    <circle cx="614" cy="560" r="12" fill="#4c65b6"/>
    <text x="614" y="564.5" text-anchor="middle" font-size="12.5" font-weight="700" fill="#ffffff">7</text>
    <text x="632" y="565" font-size="15" font-weight="700" fill="#17211f">LM_HEAD 与词表共享开关</text>
    <text x="602" y="590" font-size="13.5" fill="#4d5652">tie_word_embeddings = false</text>
    <text x="602" y="612" font-size="13.5" fill="#4d5652">8B 双表 2.32 GiB；0.6B 共享省半</text>
  </g>
</svg>
