<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 595" width="900" height="595" role="img" aria-label="Qwen3-8B 与 Qwen3-30B-A3B 立体拆解剖面与开放式引线直标图" font-family="var(--font-sans)">
  <title>Qwen3-8B（稠密 36 层）与 Qwen3-30B-A3B（稀疏 MoE 48 层，128 选 8）的注意力分组头、前馈层驻留与激活反差，以及 BF16 权重显存与每 token KV cache 比例对照。</title>
  <desc>开放画布呈现 EMBED → 32Q:4KV → ROUTER → 8/128 ACTIVE MoE → LM_HEAD 立体架构剖面：ModelArchConfigConvertorBase.get_head_size 与 Qwen3Attention 读取显式 head_dim=128 及 total_num_kv_heads；Qwen3MoeDecoderLayer 按 num_experts、decoder_sparse_step、mlp_only_layers 构造 FusedMoEFactory（num_experts_per_tok=8，moe_intermediate_size=768）；末尾 ParallelLMHead 由 tie_word_embeddings 控制是否共享词表权重。</desc>

  <!-- Wide 820px Tight-Cropped Transparent Architecture Cutaway -->
  <image href="./wiki-illustrations/hf-moe-layer-cutaway.webp" x="40" y="92" width="820" height="409" preserveAspectRatio="xMidYMid meet"/>

  <!-- Leader Lines & Clean Ring Target Dots (Passing Cleanly Through Label Gaps) -->
  <!-- 1: Top-Col 1 -> EMBED 3D Slab (98, 225) -->
  <line x1="148" y1="76" x2="98" y2="225" stroke="#4338CA" stroke-width="1.6"/>
  <circle cx="98" cy="225" r="5.5" fill="#FFFFFF" stroke="#4338CA" stroke-width="2"/>
  <circle cx="98" cy="225" r="2.5" fill="#4338CA"/>

  <!-- 2: Top-Col 2 -> 32Q:4KV Royal Blue GQA Drawers (301, 288) -->
  <line x1="332" y1="76" x2="301" y2="288" stroke="#BE123C" stroke-width="1.6"/>
  <circle cx="301" cy="288" r="5.5" fill="#FFFFFF" stroke="#BE123C" stroke-width="2"/>
  <circle cx="301" cy="288" r="2.5" fill="#BE123C"/>

  <!-- 3: Top-Col 3 -> Glowing Teal Active Expert Room (506, 260) -->
  <line x1="490" y1="76" x2="506" y2="260" stroke="#0F766E" stroke-width="1.6"/>
  <circle cx="506" cy="260" r="5.5" fill="#FFFFFF" stroke="#0F766E" stroke-width="2"/>
  <circle cx="506" cy="260" r="2.5" fill="#0F766E"/>

  <!-- 4: Top-Col 4 -> Unlit Resident Brown Expert Pool (667, 202) -->
  <line x1="712" y1="76" x2="667" y2="202" stroke="#B45309" stroke-width="1.6"/>
  <circle cx="667" cy="202" r="5.5" fill="#FFFFFF" stroke="#B45309" stroke-width="2"/>
  <circle cx="667" cy="202" r="2.5" fill="#B45309"/>

  <!-- 5: Bottom-Col 1 -> 32Q Attention Projection Wires (210, 345) -->
  <line x1="185" y1="512" x2="210" y2="345" stroke="#1D4ED8" stroke-width="1.6"/>
  <circle cx="210" cy="345" r="5.5" fill="#FFFFFF" stroke="#1D4ED8" stroke-width="2"/>
  <circle cx="210" cy="345" r="2.5" fill="#1D4ED8"/>

  <!-- 6: Bottom-Col 2 -> Glowing ROUTER Beam (352, 292) -->
  <line x1="395" y1="512" x2="352" y2="292" stroke="#0F766E" stroke-width="1.6"/>
  <circle cx="352" cy="292" r="5.5" fill="#FFFFFF" stroke="#0F766E" stroke-width="2"/>
  <circle cx="352" cy="292" r="2.5" fill="#0F766E"/>

  <!-- 7: Bottom-Col 3 -> LM_HEAD Slab & tie_word_embeddings Wire (816, 337) -->
  <line x1="842" y1="512" x2="816" y2="337" stroke="#4338CA" stroke-width="1.6"/>
  <circle cx="816" cy="337" r="5.5" fill="#FFFFFF" stroke="#4338CA" stroke-width="2"/>
  <circle cx="816" cy="337" r="2.5" fill="#4338CA"/>

  <!-- Top Open Band: 4 Borderless Callouts -->
  <!-- Callout 1 -->
  <g>
    <circle cx="25" cy="24" r="11" fill="#4338CA"/>
    <text x="25" y="28" text-anchor="middle" font-size="12" font-weight="700" fill="#FFFFFF">1</text>
    <text x="42" y="29" font-size="13" font-weight="700" fill="#17211f">首端词表 EMBED</text>
    <text x="14" y="49" font-size="11.5" fill="#475569">V=151,936 · 8B 单表占 0.62B</text>
    <text x="14" y="66" font-size="11.5" fill="#475569">30B-A3B (H=2048) 占 0.31B</text>
  </g>

  <!-- Callout 2 -->
  <g>
    <circle cx="237" cy="24" r="11" fill="#BE123C"/>
    <text x="237" y="28" text-anchor="middle" font-size="12" font-weight="700" fill="#FFFFFF">2</text>
    <text x="254" y="29" font-size="13" font-weight="700" fill="#17211f">显式 head_dim=128 陷阱</text>
    <text x="226" y="49" font-size="11.5" font-weight="600" fill="#BE123C">32Q×128=4096 != H(2048)</text>
    <text x="226" y="66" font-size="11.5" fill="#475569">GQA 32Q:4KV · 错算 64 少一半</text>
  </g>

  <!-- Callout 3 -->
  <g>
    <circle cx="473" cy="24" r="11" fill="#0F766E"/>
    <text x="473" y="28" text-anchor="middle" font-size="12" font-weight="700" fill="#FFFFFF">3</text>
    <text x="490" y="29" font-size="13" font-weight="700" fill="#17211f">单步点亮 8 / 128 专家</text>
    <text x="462" y="49" font-size="11.5" fill="#475569">单专家 I_moe=768 · 48 层稀疏</text>
    <text x="462" y="66" font-size="11.5" font-weight="600" fill="#0F766E">单 token 仅激活 3.35B 参数</text>
  </g>

  <!-- Callout 4 -->
  <g>
    <circle cx="703" cy="24" r="11" fill="#B45309"/>
    <text x="703" y="28" text-anchor="middle" font-size="12" font-weight="700" fill="#FFFFFF">4</text>
    <text x="720" y="29" font-size="13" font-weight="700" fill="#17211f">常驻 128 专家显存池</text>
    <text x="692" y="49" font-size="11.5" fill="#475569">总参数 30.53B = 56.87 GiB</text>
    <text x="692" y="66" font-size="11.5" font-weight="600" fill="#BE123C">全专家驻留 · 32 GiB 单卡 OOM</text>
  </g>

  <!-- Bottom Open Band: 3 Wide Borderless Callouts -->
  <!-- Callout 5 -->
  <g>
    <circle cx="25" cy="528" r="11" fill="#1D4ED8"/>
    <text x="25" y="532" text-anchor="middle" font-size="12" font-weight="700" fill="#FFFFFF">5</text>
    <text x="42" y="533" font-size="13" font-weight="700" fill="#17211f">对照 Qwen3-8B 稠密基座</text>
    <text x="14" y="553" font-size="11.5" fill="#475569">36 层 H=4096 · 8 KV 头 · 权重 15.26 GiB</text>
    <text x="14" y="571" font-size="11.5" fill="#475569">每 token 144.0 KiB KV · 单张 32 GiB 可跑</text>
  </g>

  <!-- Callout 6 -->
  <g>
    <circle cx="319" cy="528" r="11" fill="#0F766E"/>
    <text x="319" y="532" text-anchor="middle" font-size="12" font-weight="700" fill="#FFFFFF">6</text>
    <text x="336" y="533" font-size="13" font-weight="700" fill="#17211f">ROUTER 路由与 KV 缓存反差</text>
    <text x="308" y="553" font-size="11.5" fill="#475569">FusedMoEFactory 动态选 8 · 省 93% 前馈算力</text>
    <text x="308" y="571" font-size="11.5" font-weight="600" fill="#0F766E">48 层仅 4 KV 头 → 96.0 KiB/tok（比 8B 省 1/3）</text>
  </g>

  <!-- Callout 7 -->
  <g>
    <circle cx="621" cy="528" r="11" fill="#4338CA"/>
    <text x="621" y="532" text-anchor="middle" font-size="12" font-weight="700" fill="#FFFFFF">7</text>
    <text x="638" y="533" font-size="13" font-weight="700" fill="#17211f">LM_HEAD 与词表共享开关</text>
    <text x="610" y="553" font-size="11.5" fill="#475569">ParallelLMHead 读 tie_word_embeddings=false</text>
    <text x="610" y="571" font-size="11.5" fill="#475569">8B 双表占 2.32 GiB；0.6B 设 true 省 0.16B</text>
  </g>
</svg>
