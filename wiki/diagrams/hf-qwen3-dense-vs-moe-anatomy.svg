<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 500" width="880" height="500" role="img" aria-label="Qwen3-8B 与 Qwen3-30B-A3B 立体拆解剖面引线直标图" font-family="var(--font-sans)">
  <title>Qwen3-8B（稠密 36 层）与 Qwen3-30B-A3B（稀疏 MoE 48 层，128 选 8）的注意力分组头、前馈层驻留与激活反差，以及 BF16 权重显存与每 token KV cache 比例对照。</title>
  <defs>
    <pattern id="gridA2" width="20" height="20" patternUnits="userSpaceOnUse">
      <path d="M 20 0 L 0 0 0 20" fill="none" stroke="#E7E1D3" stroke-width="0.6"/>
    </pattern>
  </defs>
  <rect x="2" y="2" width="876" height="496" rx="6" fill="#FCFBF7" stroke="#D5CEBE" stroke-width="1"/>
  <rect x="90" y="65" width="700" height="394" rx="5" fill="url(#gridA2)" stroke="#C6BFAF" stroke-width="1"/>

  <!-- Center Cutaway Illustration Slot -->
  <image href="./wiki-illustrations/hf-moe-layer-cutaway.jpg" x="90" y="65" width="700" height="394" preserveAspectRatio="xMidYMid meet"/>

  <!-- Leader Lines + Target Dots -->
  <!-- ① Left Dense Tower Attention & MLP -->
  <line x1="150" y1="58" x2="275" y2="165" stroke="#1D4ED8" stroke-width="1.8"/>
  <circle cx="275" cy="165" r="6" fill="#FFFFFF" fill-opacity="0.92" stroke="#1D4ED8" stroke-width="1.5"/>
  <circle cx="275" cy="165" r="3.2" fill="#1D4ED8"/>

  <!-- ② Right MoE Attention head_dim=128 != 2048/32 -->
  <line x1="455" y1="58" x2="545" y2="155" stroke="#BE123C" stroke-width="1.8"/>
  <circle cx="545" cy="155" r="6" fill="#FFFFFF" fill-opacity="0.92" stroke="#BE123C" stroke-width="1.5"/>
  <circle cx="545" cy="155" r="3.2" fill="#BE123C"/>

  <!-- ③ Right MoE 128 Experts Pool vs 8 Active -->
  <line x1="735" y1="58" x2="625" y2="250" stroke="#B45309" stroke-width="1.8"/>
  <circle cx="625" cy="250" r="6" fill="#FFFFFF" fill-opacity="0.92" stroke="#B45309" stroke-width="1.5"/>
  <circle cx="625" cy="250" r="3.2" fill="#B45309"/>

  <!-- ④ Left Margin: Untied Embeddings 2.32 GiB vs 0.6B Tied -->
  <line x1="170" y1="262" x2="252" y2="310" stroke="#4338CA" stroke-width="1.8"/>
  <circle cx="252" cy="310" r="6" fill="#FFFFFF" fill-opacity="0.92" stroke="#4338CA" stroke-width="1.5"/>
  <circle cx="252" cy="310" r="3.2" fill="#4338CA"/>

  <!-- ⑤ Right Margin: Router 128-choose-8 -->
  <line x1="710" y1="262" x2="612" y2="305" stroke="#0F766E" stroke-width="1.8"/>
  <circle cx="612" cy="305" r="6" fill="#FFFFFF" fill-opacity="0.92" stroke="#0F766E" stroke-width="1.5"/>
  <circle cx="612" cy="305" r="3.2" fill="#0F766E"/>

  <!-- ⑥ Bottom-Left: 8B Memory & KV -->
  <line x1="220" y1="462" x2="315" y2="405" stroke="#1D4ED8" stroke-width="1.8"/>
  <circle cx="315" cy="405" r="6" fill="#FFFFFF" fill-opacity="0.92" stroke="#1D4ED8" stroke-width="1.5"/>
  <circle cx="315" cy="405" r="3.2" fill="#1D4ED8"/>

  <!-- ⑦ Bottom-Right: 30B-A3B Memory & KV Reversal -->
  <line x1="655" y1="462" x2="575" y2="405" stroke="#0F766E" stroke-width="1.8"/>
  <circle cx="575" cy="405" r="6" fill="#FFFFFF" fill-opacity="0.92" stroke="#0F766E" stroke-width="1.5"/>
  <circle cx="575" cy="405" r="3.2" fill="#0F766E"/>

  <!-- Crisp Vector Callout Cards -->
  <!-- Top-Left ① -->
  <g>
    <rect x="8" y="6" width="276" height="52" rx="5" fill="#FFFDF9" stroke="#1D4ED8" stroke-width="1.3"/>
    <rect x="8" y="6" width="24" height="52" rx="4" fill="#DBEAFE"/>
    <text x="20" y="37" text-anchor="middle" font-size="12" font-weight="800" fill="#1D4ED8">①</text>
    <text x="38" y="23" font-size="11.2" font-weight="700" fill="#182230">左塔：Qwen3-8B 稠密 36 层主干</text>
    <text x="38" y="38" font-size="10.1" fill="#344054">H=4096，GQA 32Q / 8KV，head_dim=128</text>
    <text x="38" y="52" font-size="10" fill="#5E6B7D">稠密 SwiGLU I=12288，单步全参数 8.19B 参与</text>
  </g>

  <!-- Top-Center ② -->
  <g>
    <rect x="294" y="6" width="292" height="52" rx="5" fill="#FFFDF9" stroke="#BE123C" stroke-width="1.3"/>
    <rect x="294" y="6" width="24" height="52" rx="4" fill="#FFE4E6"/>
    <text x="306" y="37" text-anchor="middle" font-size="12" font-weight="800" fill="#BE123C">②</text>
    <text x="324" y="23" font-size="11.2" font-weight="700" fill="#BE123C">右塔注意力：head_dim=128 != 2048/32</text>
    <text x="324" y="38" font-size="10.1" fill="#182230">显式 head_dim=128 → 32Q 宽投影 4096 (2×H)</text>
    <text x="324" y="52" font-size="10" fill="#344054">KV 头减半为 4 个（kv_dim=512），错算 64 少一半</text>
  </g>

  <!-- Top-Right ③ -->
  <g>
    <rect x="596" y="6" width="276" height="52" rx="5" fill="#FFFDF9" stroke="#B45309" stroke-width="1.3"/>
    <rect x="596" y="6" width="24" height="52" rx="4" fill="#FEF3C7"/>
    <text x="608" y="37" text-anchor="middle" font-size="12" font-weight="800" fill="#B45309">③</text>
    <text x="626" y="23" font-size="11" font-weight="700" fill="#B45309">128 专家占 56.87 GiB vs 激活 8 专家仅 3.35B</text>
    <text x="626" y="38" font-size="10" fill="#182230">48 层全稀疏 MoE，单专家 I_moe=768</text>
    <text x="626" y="52" font-size="10" fill="#BE123C" font-weight="700">128 专家须全驻显存，32 GiB 单卡直接 OOM</text>
  </g>

  <!-- Left Margin ④ -->
  <g>
    <rect x="6" y="222" width="164" height="78" rx="5" fill="#FFFDF9" fill-opacity="0.96" stroke="#4338CA" stroke-width="1.25"/>
    <text x="14" y="239" font-size="10.6" font-weight="700" fill="#4338CA">④ tie_word_embeddings</text>
    <text x="14" y="255" font-size="9.9" fill="#344054">8B &amp; 30B 均为 false：</text>
    <text x="14" y="269" font-size="9.9" fill="#344054">8B 首尾双词表占 2.32 GiB；</text>
    <text x="14" y="284" font-size="9.8" fill="#0F766E" font-weight="700">0.6B 设为 true 立省 0.16B</text>
  </g>

  <!-- Right Margin ⑤ -->
  <g>
    <rect x="710" y="222" width="164" height="78" rx="5" fill="#FFFDF9" fill-opacity="0.96" stroke="#0F766E" stroke-width="1.25"/>
    <text x="718" y="239" font-size="10.6" font-weight="700" fill="#0F766E">⑤ Router 动态选 8/128</text>
    <text x="718" y="255" font-size="9.9" fill="#344054">单层全量驻留 6.04 亿参数</text>
    <text x="718" y="269" font-size="9.9" fill="#344054">单步激活仅 0.38 亿参数；</text>
    <text x="718" y="284" font-size="9.8" fill="#B45309" font-weight="700">算力省 93%，显存不能省！</text>
  </g>

  <!-- Bottom-Left ⑥ -->
  <g>
    <rect x="8" y="462" width="424" height="33" rx="5" fill="#FFFDF9" stroke="#1D4ED8" stroke-width="1.3"/>
    <text x="18" y="476" font-size="10.6" font-weight="700" fill="#1D4ED8">⑥ Qwen3-8B 显存底座：15.26 GiB 权重 + 144.0 KiB/token KV cache</text>
    <text x="18" y="490" font-size="10" fill="#344054">单张 32 GiB NPU 扣除静态权重后，仍可留出充裕显存池容纳长上下文 KV</text>
  </g>

  <!-- Bottom-Right ⑦ -->
  <g>
    <rect x="444" y="462" width="428" height="33" rx="5" fill="#FFFDF9" stroke="#0F766E" stroke-width="1.3"/>
    <text x="454" y="476" font-size="10.6" font-weight="700" fill="#0F766E">⑦ Qwen3-30B-A3B KV 反差：56.87 GiB 权重（需多卡），但仅 96.0 KiB/token KV</text>
    <text x="454" y="490" font-size="10" fill="#344054">48 层 × 4 KV 头 × 128 维 × 2×2B = 98,304 B/token，比 8B 反而节省三分之一缓存</text>
  </g>
</svg>
