<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 470" width="880" height="470" role="img" aria-label="一次计算依赖两份数据的教学示意。本卡输入乘权重得到 [5, 2]，另一张卡独立准备 [3, 1]；两份都到齐以后才能相加得到 [8, 3]。不代表 GLM 的某个具体算子。">
