<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 470" width="900" height="470" role="img" aria-label="闭环固定并发与开环到达率压测对比，以及冷启动预热与前缀缓存污染检查图" font-family="var(--font-sans)">
  <title>闭环并发 vs 开环到达率压测模式与预热/缓存可比性边界</title>
  <desc>Closed-loop concurrency vs open-loop Poisson arrival rate, coordinated omission gap, and warmup vs prefix cache pollution checks</desc>
  <defs>
    <marker id="ib-arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="#4d5652"/>
    </marker>
  </defs>

  <text x="16" y="28" font-size="16" font-weight="700" fill="#17211f">① 闭环固定并发 vs 开环到达率：为什么同一套服务会测出两种尾部时延</text>
  <text x="884" y="28" text-anchor="end" font-size="13.5" fill="#66716d">决定是否暴露真实排队增长</text>

  <rect x="16" y="44" width="424" height="176" rx="8" fill="#fff4cf" stroke="#c78300" stroke-width="1.4"/>
  <text x="32" y="72" font-size="15" font-weight="700" fill="#936300">闭环负载（固定并发 · 完成一条再补一条）</text>
  <text x="32" y="98" font-size="13.5" fill="#4d5652">• 服务一旦变慢，客户端自动放慢补发速度</text>
  <text x="32" y="122" font-size="13.5" fill="#4d5652">• 适合测饱和吞吐上限与固定在算宽度下的单步耗时</text>
  <text x="32" y="146" font-size="13.5" fill="#8f3229">• 风险：掩盖外部持续到达时的队列积压与 P95/P99 长尾</text>
  <rect x="32" y="164" width="392" height="40" rx="6" fill="#ece9df" stroke="#b8bcb5" stroke-width="1.2"/>
  <text x="228" y="189" text-anchor="middle" font-size="13.5" font-weight="700" fill="#17211f">吞吐看满载 ✓　但不能替代线上到达速率的 SLO 验收</text>

  <rect x="460" y="44" width="424" height="176" rx="8" fill="#ddf4ef" stroke="#087f73" stroke-width="1.4"/>
  <text x="476" y="72" font-size="15" font-weight="700" fill="#065f56">开环负载（按 request_rate / 泊松计划时刻发单）</text>
  <text x="476" y="98" font-size="13.5" fill="#4d5652">• 不管服务快慢，到达时间表照常推进，暴露排队失控</text>
  <text x="476" y="122" font-size="13.5" fill="#4d5652">• 生成器受并发上限阻塞时，须同记三时刻防等待消失：</text>
  <rect x="476" y="138" width="118" height="36" rx="5" fill="#e8edff" stroke="#4c65b6" stroke-width="1.2"/>
  <text x="535" y="161" text-anchor="middle" font-size="13.5" font-weight="700" fill="#3a4f93">计划 0 ms</text>
  <line x1="594" y1="156" x2="616" y2="156" stroke="#4d5652" stroke-width="1.5" marker-end="url(#ib-arr)"/>
  <rect x="618" y="138" width="122" height="36" rx="5" fill="#fff0e9" stroke="#b54237" stroke-width="1.2"/>
  <text x="679" y="161" text-anchor="middle" font-size="13.5" font-weight="700" fill="#8f3229">实发 200 ms</text>
  <line x1="740" y1="156" x2="762" y2="156" stroke="#4d5652" stroke-width="1.5" marker-end="url(#ib-arr)"/>
  <rect x="764" y="138" width="104" height="36" rx="5" fill="#ddf4ef" stroke="#087f73" stroke-width="1.2"/>
  <text x="816" y="161" text-anchor="middle" font-size="13.5" font-weight="700" fill="#065f56">首字 +100</text>
  <text x="476" y="201" font-size="13.5" fill="#8f3229">▸ 若只算实发起 TTFT=100 ms，就漏掉了生成器里等的 200 ms</text>

  <line x1="16" y1="242" x2="884" y2="242" stroke="#b8bcb5" stroke-width="1.4" stroke-dasharray="6 5"/>

  <text x="16" y="272" font-size="16" font-weight="700" fill="#17211f">② A/B 对照的冷暖隔离与结果留档：把一次性开销和缓存命中从收益里剥出来</text>

  <rect x="16" y="290" width="276" height="162" rx="8" fill="#e8edff" stroke="#4c65b6" stroke-width="1.4"/>
  <text x="32" y="318" font-size="14.5" font-weight="700" fill="#3a4f93">阶段 1 · 预热（剔除统计）</text>
  <text x="32" y="346" font-size="13.5" fill="#4d5652">• 消化首次图捕获与算子缓存</text>
  <text x="32" y="372" font-size="13.5" fill="#4d5652">• 明确冷请求或热前缀前提</text>
  <text x="32" y="398" font-size="13.5" fill="#3a4f93">• 严禁把同一条热缓存提示词</text>
  <text x="32" y="422" font-size="13.5" fill="#3a4f93">　当成 B 组独有的配置提速</text>

  <line x1="292" y1="371" x2="314" y2="371" stroke="#4d5652" stroke-width="1.6" marker-end="url(#ib-arr)"/>

  <rect x="316" y="290" width="276" height="162" rx="8" fill="#ddf4ef" stroke="#087f73" stroke-width="1.4"/>
  <text x="332" y="318" font-size="14.5" font-weight="700" fill="#065f56">阶段 2 · 无采集正式压测</text>
  <text x="332" y="346" font-size="13.5" fill="#4d5652">• 交错重复 A/B 消除环境漂移</text>
  <text x="332" y="372" font-size="13.5" fill="#4d5652">• 同步统计失败项与未完成项</text>
  <text x="332" y="398" font-size="13.5" fill="#065f56">• 按长度分组报 P50/P95/P99</text>
  <text x="332" y="422" font-size="13.5" fill="#065f56">• Goodput 须确认阈值已配置</text>

  <line x1="592" y1="371" x2="614" y2="371" stroke="#4d5652" stroke-width="1.6" marker-end="url(#ib-arr)"/>

  <rect x="616" y="290" width="268" height="162" rx="8" fill="#f7e7f2" stroke="#9a4b86" stroke-width="1.4"/>
  <text x="632" y="318" font-size="14.5" font-weight="700" fill="#7a3a6a">阶段 3 · 短窗剖析与复验</text>
  <text x="632" y="346" font-size="13.5" fill="#4d5652">• 单独短时开启 Profiler 定位</text>
  <text x="632" y="372" font-size="13.5" fill="#4d5652">• 不把开启采集的耗时混入收益</text>
  <text x="632" y="398" font-size="13.5" fill="#7a3a6a">• 区分前端墙上时钟与</text>
  <text x="632" y="422" font-size="13.5" fill="#7a3a6a">　EngineCore 单调时钟口径</text>
</svg>
