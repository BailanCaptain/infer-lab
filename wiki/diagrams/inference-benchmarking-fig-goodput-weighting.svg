<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 416" width="900" height="416" role="img" aria-label="10 秒 24 请求窗口 A/B 达标吞吐 Goodput 堆叠条与请求级 TPOT 60ms 对比全间隔 ITL 28ms 权重图" font-family="var(--font-sans)">
  <title>总吞吐相同时 Goodput 与可靠性门槛对比，以及 TPOT 与 ITL 样本权重差异</title>
  <desc>Left: proportional 24-request outcome bars comparing A (16 SLO-met, 1.6 req/s) vs B (18 SLO-met, 1.8 req/s) at identical 200 tok/s throughput and 91.67% max success rate below 99% gate. Right: sample weighting visual showing 60 ms request-level TPOT vs 28 ms all-ITL mean</desc>

  <!-- Left Panel: 24-Request 10s Window Outcome Bars (x=16..436) -->
  <text x="16" y="26" font-size="13.5" font-weight="700" fill="#17211f">一、同一 10 秒 24 条请求（示意）：吞吐相同，Goodput 不同</text>
  <text x="16" y="46" font-size="12.5" fill="#66716d">每格按请求条数等比（15 px/条 · 满宽 24 条 = 360 px）</text>

  <!-- 99% reliability gate line at 23.76 * 15 = 356px -> x = 66 + 356 = 422 -->
  <line x1="422" y1="74" x2="422" y2="236" stroke="#b54237" stroke-width="1.5" stroke-dasharray="4 3"/>
  <text x="422" y="70" text-anchor="end" font-size="12.5" font-weight="700" fill="#8f3229">99% 成功率门槛</text>

  <!-- Bar A (y = 80 .. 126): 16(240) + 4(60) + 2(30) + 2(30) = 360px -->
  <text x="16" y="108" font-size="14.5" font-weight="700" fill="#17211f">设置 A</text>
  <rect x="66" y="80" width="240" height="44" rx="4" fill="#ddf4ef" stroke="#087f73" stroke-width="1.4"/>
  <text x="186" y="107" text-anchor="middle" font-size="13.5" font-weight="700" fill="#065f56">16 达标 (1.6/s)</text>
  <rect x="306" y="80" width="60" height="44" rx="2" fill="#fff4cf" stroke="#c78300" stroke-width="1.3"/>
  <text x="336" y="107" text-anchor="middle" font-size="13.5" font-weight="700" fill="#936300">4 慢</text>
  <rect x="366" y="80" width="30" height="44" rx="2" fill="#fff0e9" stroke="#b54237" stroke-width="1.3"/>
  <text x="381" y="107" text-anchor="middle" font-size="13.5" font-weight="700" fill="#8f3229">2</text>
  <rect x="396" y="80" width="30" height="44" rx="2" fill="#f7e7f2" stroke="#9a4b86" stroke-width="1.3" stroke-dasharray="3 2"/>
  <text x="411" y="107" text-anchor="middle" font-size="13.5" fill="#7a3a6a">2</text>

  <!-- Bar B (y = 148 .. 194): 18(270) + 2(30) + 2(30) + 2(30) = 360px -->
  <text x="16" y="176" font-size="14.5" font-weight="700" fill="#065f56">设置 B</text>
  <rect x="66" y="148" width="270" height="44" rx="4" fill="#ddf4ef" stroke="#087f73" stroke-width="1.7"/>
  <text x="201" y="175" text-anchor="middle" font-size="13.5" font-weight="700" fill="#065f56">18 达标 (1.8/s · +2 条)</text>
  <rect x="336" y="148" width="30" height="44" rx="2" fill="#fff4cf" stroke="#c78300" stroke-width="1.3"/>
  <text x="351" y="175" text-anchor="middle" font-size="13.5" font-weight="700" fill="#936300">2</text>
  <rect x="366" y="148" width="30" height="44" rx="2" fill="#fff0e9" stroke="#b54237" stroke-width="1.3"/>
  <text x="381" y="175" text-anchor="middle" font-size="13.5" font-weight="700" fill="#8f3229">2</text>
  <rect x="396" y="148" width="30" height="44" rx="2" fill="#f7e7f2" stroke="#9a4b86" stroke-width="1.3" stroke-dasharray="3 2"/>
  <text x="411" y="175" text-anchor="middle" font-size="13.5" fill="#7a3a6a">2</text>

  <!-- Legend for stacked bar -->
  <g font-size="13.5">
    <rect x="16" y="210" width="14" height="14" rx="3" fill="#ddf4ef" stroke="#087f73"/>
    <text x="35" y="222" fill="#065f56">达标完成</text>
    <rect x="112" y="210" width="14" height="14" rx="3" fill="#fff4cf" stroke="#c78300"/>
    <text x="131" y="222" fill="#936300">完成超 SLO</text>
    <rect x="224" y="210" width="14" height="14" rx="3" fill="#fff0e9" stroke="#b54237"/>
    <text x="243" y="222" fill="#8f3229">已失败(2)</text>
    <rect x="322" y="210" width="14" height="14" rx="3" fill="#f7e7f2" stroke="#9a4b86" stroke-dasharray="3 2"/>
    <text x="341" y="222" fill="#7a3a6a">未完成(2)</text>
  </g>

  <!-- Bottom left takeaway -->
  <rect x="16" y="246" width="414" height="154" rx="8" fill="#ece9df" stroke="#b8bcb5" stroke-width="1.2"/>
  <text x="30" y="274" font-size="14.5" font-weight="700" fill="#17211f">为什么不能只报一个「200 token/秒」</text>
  <text x="30" y="302" font-size="13.5" fill="#065f56">1. 成功总吞吐相同（20×100÷10 = 200 tok/s）</text>
  <text x="30" y="328" font-size="13.5" fill="#065f56">2. 但 B 的 Goodput 更高（1.8 vs 1.6 请求/秒）</text>
  <text x="30" y="354" font-size="13.5" font-weight="700" fill="#8f3229">3. 最高成功率仅 (20+2)/24 = 91.67% &lt; 99%</text>
  <text x="30" y="380" font-size="13.5" fill="#4d5652">结论：B 改善了交付体验，但整批仍未过可靠性门禁</text>

  <!-- Vertical divider -->
  <line x1="452" y1="16" x2="452" y2="400" stroke="#b8bcb5" stroke-width="1.3" stroke-dasharray="6 4"/>

  <!-- Right Panel: TPOT (60 ms) vs ITL (28 ms) Weighting Visual (x=470..884) -->
  <text x="470" y="26" font-size="13.5" font-weight="700" fill="#17211f">二、同两份回答，为何 TPOT=60 ms 而 ITL=28 ms</text>
  <text x="470" y="46" font-size="12.5" fill="#66716d">柱高代表单次间隔时长，柱数代表在全间隔里的票数</text>

  <!-- Short answer: 1 bar of 100 ms (height = 110 px -> 1.1 px/ms) -->
  <text x="470" y="76" font-size="14" font-weight="700" fill="#8f3229">短回答（1 个间隔）</text>
  <rect x="492" y="88" width="54" height="110" rx="5" fill="#fff0e9" stroke="#b54237" stroke-width="1.6"/>
  <text x="519" y="146" text-anchor="middle" font-family="var(--font-mono)" font-size="13.5" font-weight="700" fill="#8f3229">100</text>
  <text x="519" y="216" text-anchor="middle" font-size="13.5" fill="#8f3229">1 票 (100 ms)</text>

  <!-- Long answer: 9 bars of 20 ms each (height = 22 px) -->
  <text x="614" y="76" font-size="14" font-weight="700" fill="#3a4f93">长回答（9 个间隔，每个 20 ms）</text>
  <g fill="#e8edff" stroke="#4c65b6" stroke-width="1.3">
    <rect x="614" y="176" width="24" height="22" rx="3"/>
    <rect x="642" y="176" width="24" height="22" rx="3"/>
    <rect x="670" y="176" width="24" height="22" rx="3"/>
    <rect x="698" y="176" width="24" height="22" rx="3"/>
    <rect x="726" y="176" width="24" height="22" rx="3"/>
    <rect x="754" y="176" width="24" height="22" rx="3"/>
    <rect x="782" y="176" width="24" height="22" rx="3"/>
    <rect x="810" y="176" width="24" height="22" rx="3"/>
    <rect x="838" y="176" width="24" height="22" rx="3"/>
  </g>
  <line x1="472" y1="198" x2="882" y2="198" stroke="#66716d" stroke-width="1.4"/>
  <text x="738" y="162" text-anchor="middle" font-family="var(--font-mono)" font-size="13.5" font-weight="700" fill="#3a4f93">9 × 20 ms</text>
  <text x="738" y="216" text-anchor="middle" font-size="13.5" fill="#3a4f93">请求占 1 票 · 间隔占 9 票</text>

  <!-- Two weighted mean comparison cards -->
  <rect x="470" y="246" width="414" height="72" rx="8" fill="#fff4cf" stroke="#c78300" stroke-width="1.4"/>
  <text x="486" y="274" font-size="14.5" font-weight="700" fill="#936300">请求级 TPOT 均值（每条请求各 1 票）</text>
  <text x="486" y="302" font-family="var(--font-mono)" font-size="14" font-weight="700" fill="#17211f">(100 + 20) ÷ 2 = 60 ms（反映用户体感）</text>

  <rect x="470" y="328" width="414" height="72" rx="8" fill="#e8edff" stroke="#4c65b6" stroke-width="1.4"/>
  <text x="486" y="356" font-size="14.5" font-weight="700" fill="#3a4f93">全部 ITL 均值（每个输出间隔各 1 票）</text>
  <text x="486" y="384" font-family="var(--font-mono)" font-size="14" font-weight="700" fill="#17211f">(100 + 9×20) ÷ 10 = 28 ms（长回答主导）</text>
</svg>
