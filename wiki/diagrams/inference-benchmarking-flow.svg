<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 420" width="880" height="420" role="img" aria-label="同一请求从计划发送走到首个输出。TTFT 从实际发送起算；生成器迟发的等待另记。箭头表示顺序，不按耗时比例；跨机器的绝对时刻须先对时。各站沿一条请求主线编号。">
  <title>同一请求从计划发送走到首个输出。TTFT 从实际发送起算；生成器迟发的等待另记。箭头表示顺序，不按耗时比例；跨机器的绝对时刻须先对时。各站沿一条请求主线编号。</title>
  <defs><marker id="inference-benchmarking-flow-ah-ink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="var(--color-ink, #17211f)"/></marker><marker id="inference-benchmarking-flow-ah-token" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="var(--color-token, #087f73)"/></marker></defs>
  <rect x="24" y="44" width="832" height="130" rx="16" fill="none" stroke="var(--color-line-strong, #b8bcb5)" stroke-width="1.5"/>
  <text x="40" y="32" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="15" font-weight="700" fill="var(--color-ink, #17211f)">客户端记录</text>
  <rect x="218" y="246" width="638" height="108" rx="16" fill="none" stroke="var(--color-line-strong, #b8bcb5)" stroke-width="1.5"/>
  <text x="234" y="234" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="15" font-weight="700" fill="var(--color-ink, #17211f)">服务记录：第 1–7 站</text>
  <path d="M182 105 L246 105" fill="none" stroke="var(--color-ink, #17211f)" stroke-width="1.4" marker-end="url(#inference-benchmarking-flow-ah-ink)"/>
  <path d="M311 126 L311 200 L200 200 L200 304 L246 304" fill="none" stroke="var(--color-token, #087f73)" stroke-width="1.4" marker-end="url(#inference-benchmarking-flow-ah-token)"/>
  <path d="M378 304 L444 304" fill="none" stroke="var(--color-ink, #17211f)" stroke-width="1.4" marker-end="url(#inference-benchmarking-flow-ah-ink)"/>
  <path d="M598 304 L664 304" fill="none" stroke="var(--color-token, #087f73)" stroke-width="1.4" marker-end="url(#inference-benchmarking-flow-ah-token)"/>
  <path d="M756 282 L756 126" fill="none" stroke="var(--color-token, #087f73)" stroke-width="1.4" marker-end="url(#inference-benchmarking-flow-ah-token)"/>
  <path d="M311 208 L756 208" fill="none" stroke="var(--color-ink, #17211f)" stroke-width="1.4" stroke-dasharray="7 5"/>
  <rect x="52" y="84" width="130" height="42" rx="8" fill="var(--color-surface-sunken, #ece9df)" stroke="var(--color-control, #66716d)" stroke-opacity="0.4" stroke-width="1.5" stroke-dasharray="5 4"/>
  <text x="117" y="110" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="13" font-weight="400" fill="#4d5652" text-anchor="middle">计划发送</text>
  <rect x="246" y="84" width="130" height="42" rx="8" fill="var(--color-token, #087f73)" stroke="var(--color-ink, #17211f)" stroke-width="1.5"/>
  <text x="311" y="110" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="14" font-weight="700" fill="var(--color-ink-inverse, #ffffff)" text-anchor="middle">实际发送</text>
  <rect x="686" y="84" width="140" height="42" rx="8" fill="var(--color-token, #087f73)" stroke="var(--color-ink, #17211f)" stroke-width="1.5"/>
  <text x="756" y="110" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="14" font-weight="700" fill="var(--color-ink-inverse, #ffffff)" text-anchor="middle">收到首个输出</text>
  <rect x="246" y="282" width="132" height="44" rx="8" fill="var(--color-surface-sunken, #ece9df)" stroke="var(--color-control, #66716d)" stroke-opacity="0.4" stroke-width="1.5" stroke-dasharray="5 4"/>
  <text x="312" y="309" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="13" font-weight="400" fill="#4d5652" text-anchor="middle">入口 → 调度</text>
  <rect x="444" y="282" width="154" height="44" rx="8" fill="var(--color-weight, #c78300)" stroke="var(--color-ink, #17211f)" stroke-width="1.5"/>
