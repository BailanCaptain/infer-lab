<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 420" width="900" height="420" role="img" aria-label="120 秒扩容冷启动就绪时间轴与 P/D 对端重启后旧状态交接失败对照图" font-family="var(--font-sans)">
  <title>120 秒冷启动就绪比例轴与 P/D 对端重启交接核对流</title>
  <desc>Proportional 120-second cold-start readiness milestone bar (0-30-90-100-110-120s) showing why machine allocation at 30s does not add capacity until 120s, plus P/D peer-restart stale identity vs clean re-handshake flow</desc>
  <defs>
    <marker id="rt-arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="#4d5652"/>
    </marker>
    <marker id="rt-red" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="#b54237"/>
    </marker>
    <marker id="rt-teal" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="#087f73"/>
    </marker>
  </defs>

  <!-- Section 1: Proportional 120s Cold-Start Readiness Bar (x=48..816, 768px = 120s -> 6.4 px/s) -->
  <text x="16" y="26" font-size="16" font-weight="700" fill="#17211f">① 扩容 120 秒冷启动就绪比例轴（示意）：拿到机器 ≠ 立即可接单</text>
  <text x="884" y="26" text-anchor="end" font-size="13.5" fill="#66716d">6.4 px/秒 等比例</text>

  <!-- Time ruler ticks: 0(48), 30(240), 90(624), 100(688), 110(752), 120(816) -->
  <line x1="48" y1="56" x2="868" y2="56" stroke="#4d5652" stroke-width="1.4" marker-end="url(#rt-arr)"/>
  <g stroke="#4d5652" stroke-width="1.2">
    <line x1="48" y1="51" x2="48" y2="61"/>
    <line x1="240" y1="51" x2="240" y2="61"/>
    <line x1="624" y1="51" x2="624" y2="61"/>
    <line x1="688" y1="51" x2="688" y2="61"/>
    <line x1="752" y1="51" x2="752" y2="61"/>
    <line x1="816" y1="51" x2="816" y2="61"/>
  </g>
  <g font-family="var(--font-mono)" font-size="13.5" fill="#4d5652" text-anchor="middle">
    <text x="48" y="46">0 s</text>
    <text x="240" y="46" font-weight="700" fill="#8f3229">30 s</text>
    <text x="624" y="46">90 s</text>
    <text x="688" y="46">100</text>
    <text x="752" y="46">110</text>
    <text x="826" y="46" font-weight="700" fill="#065f56">120 s ★</text>
  </g>

  <!-- Proportional stage bars (y = 70 .. 124) -->
  <rect x="48" y="72" width="190" height="48" rx="5" fill="#ece9df" stroke="#8a928f" stroke-width="1.4"/>
  <text x="143" y="94" text-anchor="middle" font-size="14" font-weight="700" fill="#17211f">分配机器</text>
  <text x="143" y="113" text-anchor="middle" font-size="13.5" fill="#4d5652">30 秒</text>

  <rect x="240" y="72" width="382" height="48" rx="5" fill="#fff4cf" stroke="#c78300" stroke-width="1.4"/>
  <text x="431" y="94" text-anchor="middle" font-size="14" font-weight="700" fill="#936300">拉起进程 + 加载模型权重（耗时最长）</text>
  <text x="431" y="113" text-anchor="middle" font-size="13.5" fill="#4d5652">30 → 90 秒（60 秒）</text>

  <rect x="624" y="72" width="62" height="48" rx="5" fill="#f7e7f2" stroke="#9a4b86" stroke-width="1.4"/>
  <text x="655" y="101" text-anchor="middle" font-size="13.5" font-weight="700" fill="#7a3a6a">通信</text>

  <rect x="688" y="72" width="62" height="48" rx="5" fill="#e8edff" stroke="#4c65b6" stroke-width="1.4"/>
  <text x="719" y="101" text-anchor="middle" font-size="13.5" font-weight="700" fill="#3a4f93">预热</text>

  <rect x="752" y="72" width="62" height="48" rx="5" fill="#ddf4ef" stroke="#087f73" stroke-width="1.5"/>
  <text x="783" y="101" text-anchor="middle" font-size="13.5" font-weight="700" fill="#065f56">注册</text>

  <rect x="818" y="72" width="66" height="48" rx="5" fill="#087f73"/>
  <text x="851" y="94" text-anchor="middle" font-size="13.5" font-weight="700" fill="#ffffff">真正</text>
  <text x="851" y="113" text-anchor="middle" font-size="13.5" font-weight="700" fill="#ffffff">接单</text>

  <!-- Under-bar warning bracket spanning 30s..120s -->
  <path d="M 240 128 L 240 140 L 814 140 L 814 128" fill="none" stroke="#b54237" stroke-width="1.6"/>
  <text x="527" y="162" text-anchor="middle" font-size="14" font-weight="700" fill="#8f3229">⚠ 若监控在 30 秒拿到机器时就加回容量，会高估接下来整整 90 秒的可用处理能力</text>
  <text x="527" y="184" text-anchor="middle" font-size="13.5" fill="#4d5652">同时核对「进程就绪」「路由分发」「真实完成代表请求」三类记录，并留意缓存变冷引起的 P 重算</text>

  <line x1="16" y1="204" x2="884" y2="204" stroke="#b8bcb5" stroke-width="1.3" stroke-dasharray="6 4"/>

  <!-- Section 2: P/D Peer Restart Identity Mismatch vs Clean Re-handshake -->
  <text x="16" y="232" font-size="16" font-weight="700" fill="#17211f">② P/D 分离对端重启：为什么相同 IP 的「新 P」就绪后，留下的「旧 D」却会失败</text>

  <!-- Old/New P Box -->
  <rect x="16" y="250" width="244" height="162" rx="8" fill="#e8edff" stroke="#4c65b6" stroke-width="1.5"/>
  <text x="30" y="276" font-size="14.5" font-weight="700" fill="#3a4f93">P 端原地重启（换代）</text>
  <rect x="30" y="288" width="216" height="44" rx="5" fill="#ece9df" stroke="#8a928f" stroke-dasharray="4 3"/>
  <text x="138" y="315" text-anchor="middle" font-size="13.5" fill="#66716d">旧 P（IP 相同 · 旧引擎 ID）已退出</text>
  <rect x="30" y="346" width="216" height="52" rx="5" fill="#ddf4ef" stroke="#087f73" stroke-width="1.4"/>
  <text x="138" y="369" text-anchor="middle" font-size="13.5" font-weight="700" fill="#065f56">新 P（IP 相同 · 新引擎 ID）</text>
  <text x="138" y="388" text-anchor="middle" font-size="13.5" fill="#4d5652">健康检查已通过，内存已重新登记</text>

  <!-- Two contrasting paths to Old D -->
  <line x1="260" y1="308" x2="310" y2="308" stroke="#b54237" stroke-width="1.8" marker-end="url(#rt-red)"/>
  <line x1="260" y1="372" x2="310" y2="372" stroke="#087f73" stroke-width="1.8" marker-end="url(#rt-teal)"/>

  <!-- Top path: Failure with stale registration -->
  <rect x="314" y="250" width="570" height="72" rx="8" fill="#fff0e9" stroke="#b54237" stroke-width="1.4"/>
  <text x="330" y="276" font-size="14.5" font-weight="700" fill="#8f3229">✗ 错用旧连接与旧内存登记：留守旧 D 首次拉 KV 即失败</text>
  <text x="330" y="302" font-size="13.5" fill="#17211f">地址相同 ≠ 旧引擎标识与内存句柄有效；切忌直接把失败归罪给模型计算或盲目清空缓存</text>

  <!-- Bottom path: Clean re-handshake & verified acceptance -->
  <rect x="314" y="332" width="570" height="80" rx="8" fill="#ddf4ef" stroke="#087f73" stroke-width="1.5"/>
  <text x="330" y="355" font-size="14" font-weight="700" fill="#065f56">✓ 正确收敛：按一代身份识别换代 → 协议协调重新握手 → 真实路由验收</text>
  <text x="330" y="378" font-size="13.5" font-weight="700" fill="#065f56">前提：须先等在途旧状态读取、握手与回调结束或安全取消，再清旧态重连</text>
  <text x="330" y="400" font-size="13.5" fill="#17211f">三组对照（全新 / 只重启 P / 全重建）定位跨重启残留；中断旧请求单独记账不销账</text>
</svg>
