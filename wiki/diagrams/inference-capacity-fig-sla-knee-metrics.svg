<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 490" width="900" height="490" role="img" aria-label="单实例 SLO 拐点、/metrics 与 ms_service_metric 监控指标及故障积压 120 秒增长与 80 秒消退曲线图" font-family="var(--font-sans)">
  <title>单实例 SLO 拐点、双层可观测指标与 N+1 故障积压消退模型</title>
  <desc>Single-instance SLA knee selection, Prometheus /metrics plus Ascend ms_service_metric guardrails, and 120s accumulation + 80s drain backlog curve</desc>
  <defs>
    <marker id="ic-arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="#4d5652"/>
    </marker>
  </defs>

  <text x="16" y="28" font-size="16" font-weight="700" fill="#17211f">① 单实例 SLO 拐点选择（示意）与线上 /metrics + ms_service_metric 放行哨兵</text>

  <!-- Top-left: SLA knee bars -->
  <rect x="16" y="44" width="446" height="192" rx="8" fill="#ece9df" stroke="#b8bcb5" stroke-width="1.3"/>
  <text x="32" y="70" font-size="14.5" font-weight="700" fill="#17211f">逐级加压找最高合格点（目标：2s 首字 ≥95% · 队列稳定）</text>

  <text x="32" y="102" font-size="13.5" fill="#4d5652">3 条/秒</text>
  <rect x="98" y="86" width="180" height="22" rx="4" fill="#ddf4ef" stroke="#087f73" stroke-width="1.2"/>
  <text x="286" y="102" font-size="13.5" fill="#065f56">99% 达标 · 队列稳定</text>

  <text x="32" y="134" font-size="13.5" fill="#4d5652">4 条/秒</text>
  <rect x="98" y="118" width="212" height="22" rx="4" fill="#ddf4ef" stroke="#087f73" stroke-width="1.2"/>
  <text x="318" y="134" font-size="13.5" fill="#065f56">98% 达标 · 队列稳定</text>

  <text x="32" y="166" font-size="13.5" font-weight="700" fill="#936300">5 条/秒</text>
  <rect x="98" y="150" width="244" height="22" rx="4" fill="#fff4cf" stroke="#c78300" stroke-width="1.5"/>
  <text x="350" y="166" font-size="13.5" font-weight="700" fill="#936300">96% ★ 拐点</text>

  <text x="32" y="198" font-size="13.5" font-weight="700" fill="#8f3229">6 条/秒</text>
  <rect x="98" y="182" width="248" height="22" rx="4" fill="#fff0e9" stroke="#b54237" stroke-width="1.4"/>
  <text x="354" y="198" font-size="13.5" font-weight="700" fill="#8f3229">82% ✗ 队列发散</text>

  <text x="32" y="224" font-size="13.5" fill="#4d5652">日常放行须低于 5 条/秒拐点，并按故障域预留 N+1 在线热备</text>

  <!-- Top-right: /metrics + ms_service_metric -->
  <rect x="478" y="44" width="406" height="192" rx="8" fill="#e8edff" stroke="#4c65b6" stroke-width="1.4"/>
  <text x="494" y="70" font-size="14.5" font-weight="700" fill="#3a4f93">准入与就绪观测双通道（共用 /metrics 端点）</text>
  <text x="494" y="98" font-size="13.5" font-weight="700" fill="#17211f">1. vLLM 原生 Prometheus（attach_router）</text>
  <text x="506" y="120" font-size="13.5" fill="#4d5652">• num_requests_waiting / kv_cache_usage_perc</text>
  <text x="506" y="142" font-size="13.5" fill="#4d5652">• TTFT / ITL 直方图与 request_success_total</text>
  <text x="494" y="170" font-size="13.5" font-weight="700" fill="#065f56">2. 昇腾 ms_service_metric（MetricProvider）</text>
  <text x="506" y="192" font-size="13.5" fill="#4d5652">• execute_model / _prepare_inputs 细粒度耗时</text>
  <text x="506" y="214" font-size="13.5" fill="#4d5652">• 8 项 engine:memory:* 显存分项 Gauge</text>

  <line x1="16" y1="256" x2="884" y2="256" stroke="#b8bcb5" stroke-width="1.4" stroke-dasharray="6 5"/>

  <!-- Bottom: Backlog accumulation & drain curve -->
  <text x="16" y="286" font-size="16" font-weight="700" fill="#17211f">② 为什么重启完成（120 秒）后，队列还要再等 80 秒才清空（示意：到达 12 条/秒）</text>

  <!-- Axes -->
  <line x1="80" y1="428" x2="848" y2="428" stroke="#66716d" stroke-width="1.6" marker-end="url(#ic-arr)"/>
  <line x1="80" y1="428" x2="80" y2="306" stroke="#66716d" stroke-width="1.6" marker-end="url(#ic-arr)"/>
  <text x="854" y="432" font-size="13.5" fill="#66716d">时间</text>
  <text x="20" y="320" font-size="13.5" fill="#66716d">积压条数</text>

  <!-- Triangle fill -->
  <polygon points="100,428 460,322 700,428" fill="#fff0e9" opacity="0.72"/>
  <polyline points="100,428 460,322 700,428 810,428" fill="none" stroke="#b54237" stroke-width="2.6"/>

  <!-- Key points -->
  <circle cx="100" cy="428" r="4.5" fill="#17211f"/>
  <circle cx="460" cy="322" r="5.5" fill="#b54237"/>
  <circle cx="700" cy="428" r="5" fill="#087f73"/>

  <!-- Vertical dashed marker at 120s -->
  <line x1="460" y1="322" x2="460" y2="428" stroke="#c78300" stroke-width="1.4" stroke-dasharray="4 4"/>

  <!-- Labels on curve -->
  <rect x="134" y="344" width="244" height="58" rx="6" fill="#fff0e9" stroke="#b54237" stroke-width="1.2"/>
  <text x="256" y="368" text-anchor="middle" font-size="14" font-weight="700" fill="#8f3229">故障缺口：净增 +2 条/秒</text>
  <text x="256" y="391" text-anchor="middle" font-size="13.5" fill="#4d5652">剩 2 套 = 10 条/秒 &lt; 到达 12</text>

  <text x="460" y="312" text-anchor="middle" font-size="14" font-weight="700" fill="#8f3229">峰值 240 条（120 秒：加载+预热+路由生效）</text>

  <rect x="520" y="344" width="256" height="58" rx="6" fill="#ddf4ef" stroke="#087f73" stroke-width="1.2"/>
  <text x="648" y="368" text-anchor="middle" font-size="14" font-weight="700" fill="#065f56">恢复消化：净减 −3 条/秒</text>
  <text x="648" y="391" text-anchor="middle" font-size="13.5" fill="#4d5652">3 套恢复 = 15 条/秒 → 80 秒清空</text>

  <!-- X-axis ticks -->
  <text x="100" y="450" text-anchor="middle" font-size="13.5" fill="#17211f">0 s（故障）</text>
  <text x="280" y="450" text-anchor="middle" font-size="13.5" fill="#66716d">60 s（约 120 条）</text>
  <text x="460" y="450" text-anchor="middle" font-size="13.5" font-weight="700" fill="#936300">120 s（新实例接单）</text>
  <text x="700" y="450" text-anchor="middle" font-size="13.5" font-weight="700" fill="#065f56">200 s（积压清零）</text>
  <text x="460" y="476" text-anchor="middle" font-size="13.5" fill="#4d5652">▸ 若采用 N+1=4 套在线热备（少 1 套仍剩 15 条/秒），可从根源消除这 120 秒的持续容量缺口</text>
</svg>
