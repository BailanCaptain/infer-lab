<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 500" width="900" height="500" role="img" aria-label="单实例 SLO 饱和拐点曲线、vLLM 与 ms_service_metric 双通道监控流向及 120 秒故障积压与 80 秒消退曲线图" font-family="var(--font-sans)">
  <title>单实例 SLO 饱和拐点曲线、双层可观测流向与故障积压消退模型</title>
  <desc>Top-left: SLA saturation knee curve (3-5 req/s above 95% SLO vs 6 req/s plunging to 82%). Top-right: vLLM + ms_service_metric converging to /metrics. Bottom: 120s accumulation (+2/s to 240) and 80s drain (-3/s to 0) backlog curve</desc>
  <defs>
    <marker id="ic-arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="#4d5652"/>
    </marker>
    <marker id="ic-blue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="#4c65b6"/>
    </marker>
  </defs>

  <!-- ================= TOP-LEFT: TRUE SLO SATURATION KNEE CURVE ================= -->
  <text x="16" y="26" font-size="15.5" font-weight="700" fill="#17211f">① 单实例 SLO 拐点曲线（示意）：选最高稳态点，不抄峰值</text>

  <!-- Chart area: x=68..438, y=54..206 (Y: 75% at y=200 -> 100% at y=65 => 5.4 px per %) -->
  <!-- Shaded safe band above 95% (95% -> y = 65 + 5*5.4 = 92) -->
  <rect x="68" y="56" width="362" height="36" fill="#ddf4ef" opacity="0.55"/>
  <rect x="68" y="92" width="362" height="114" fill="#fff0e9" opacity="0.35"/>

  <!-- Axes -->
  <line x1="68" y1="206" x2="442" y2="206" stroke="#4d5652" stroke-width="1.5" marker-end="url(#ic-arr)"/>
  <line x1="68" y1="206" x2="68" y2="48" stroke="#4d5652" stroke-width="1.5" marker-end="url(#ic-arr)"/>
  <!-- 95% SLO threshold line -->
  <line x1="68" y1="92" x2="432" y2="92" stroke="#b54237" stroke-width="1.5" stroke-dasharray="5 3"/>
  <text x="74" y="86" font-size="13.5" font-weight="700" fill="#8f3229">95% 首字达标门槛（2s 内）</text>

  <!-- Y ticks -->
  <g font-family="var(--font-mono)" font-size="13.5" fill="#66716d" text-anchor="end">
    <text x="62" y="70">100%</text>
    <text x="62" y="97" font-weight="700" fill="#8f3229">95%</text>
    <text x="62" y="167">82%</text>
  </g>
  <!-- X ticks: 3->116, 4->208, 5->300, 6->392 -->
  <g font-family="var(--font-mono)" font-size="13.5" fill="#4d5652" text-anchor="middle">
    <text x="116" y="226">3/s</text>
    <text x="208" y="226">4/s</text>
    <text x="300" y="226" font-weight="700" fill="#936300">5/s ★</text>
    <text x="392" y="226" font-weight="700" fill="#8f3229">6/s ✗</text>
  </g>

  <!-- Saturation knee polyline: (116,70.4) -> (208,75.8) -> (300,86.6) -> (392,162.2) -->
  <polyline points="116,70 208,76 300,87 392,162" fill="none" stroke="#087f73" stroke-width="2.6"/>
  <line x1="300" y1="87" x2="392" y2="162" stroke="#b54237" stroke-width="2.8"/>

  <!-- Data points & labels -->
  <circle cx="116" cy="70" r="4.5" fill="#087f73"/>
  <text x="116" y="61" text-anchor="middle" font-size="13.5" fill="#065f56">99%</text>

  <circle cx="208" cy="76" r="4.5" fill="#087f73"/>
  <text x="208" y="67" text-anchor="middle" font-size="13.5" fill="#065f56">98%</text>

  <circle cx="300" cy="87" r="6" fill="#c78300" stroke="#ffffff" stroke-width="1.5"/>
  <text x="306" y="75" font-size="13.5" font-weight="700" fill="#936300">96% 拐点</text>

  <circle cx="392" cy="162" r="5.5" fill="#b54237"/>
  <text x="382" y="185" text-anchor="end" font-size="13.5" font-weight="700" fill="#8f3229">82% 队列发散</text>
  <text x="382" y="201" text-anchor="end" font-size="13.5" fill="#4d5652">（完成 5.4/s）</text>

  <text x="16" y="248" font-size="13.5" fill="#4d5652">日常放行低于 5 条/秒，并按故障域配 N+1 在线热备</text>

  <!-- ================= TOP-RIGHT: DUAL OBSERVABILITY FLOW ================= -->
  <text x="478" y="26" font-size="15.5" font-weight="700" fill="#17211f">② 双通道准入哨兵（汇入同一 /metrics）</text>

  <!-- Source 1: vLLM -->
  <rect x="478" y="48" width="210" height="84" rx="8" fill="#e8edff" stroke="#4c65b6" stroke-width="1.4"/>
  <text x="492" y="72" font-size="14" font-weight="700" fill="#3a4f93">vLLM EngineCore</text>
  <text x="492" y="96" font-family="var(--font-mono)" font-size="13.5" fill="#17211f">waiting / kv_usage</text>
  <text x="492" y="118" font-family="var(--font-mono)" font-size="13.5" fill="#4d5652">TTFT / ITL / success</text>

  <!-- Source 2: Ascend ms_service_metric -->
  <rect x="478" y="146" width="210" height="84" rx="8" fill="#ddf4ef" stroke="#087f73" stroke-width="1.4"/>
  <text x="492" y="170" font-size="14" font-weight="700" fill="#065f56">ms_service_metric</text>
  <text x="492" y="194" font-family="var(--font-mono)" font-size="13.5" fill="#17211f">execute / prepare</text>
  <text x="492" y="216" font-family="var(--font-mono)" font-size="13.5" fill="#4d5652">8 项 engine:memory</text>

  <!-- Converging arrows to /metrics -->
  <path d="M 688 90 L 716 90 L 716 132 L 732 132" fill="none" stroke="#4c65b6" stroke-width="1.6" marker-end="url(#ic-blue)"/>
  <path d="M 688 188 L 716 188 L 716 146 L 732 146" fill="none" stroke="#087f73" stroke-width="1.6" marker-end="url(#ic-arr)"/>

  <!-- Unified /metrics ASGI sink -->
  <rect x="736" y="74" width="148" height="130" rx="8" fill="#fff4cf" stroke="#c78300" stroke-width="1.5"/>
  <text x="810" y="102" text-anchor="middle" font-family="var(--font-mono)" font-size="14.5" font-weight="700" fill="#936300">/metrics</text>
  <text x="810" y="126" text-anchor="middle" font-size="13.5" fill="#17211f">Prometheus</text>
  <text x="810" y="148" text-anchor="middle" font-size="13.5" fill="#4d5652">统一抓取端点</text>
  <line x1="750" y1="160" x2="870" y2="160" stroke="#c78300" stroke-width="1" stroke-dasharray="3 2"/>
  <text x="810" y="180" text-anchor="middle" font-size="13.5" font-weight="700" fill="#936300">驱动扩缩与</text>
  <text x="810" y="198" text-anchor="middle" font-size="13.5" font-weight="700" fill="#936300">准入限流</text>

  <line x1="16" y1="264" x2="884" y2="264" stroke="#b8bcb5" stroke-width="1.4" stroke-dasharray="6 5"/>

  <!-- ================= BOTTOM: BACKLOG ACCUMULATION & DRAIN CURVE ================= -->
  <text x="16" y="294" font-size="16" font-weight="700" fill="#17211f">③ 为什么重启完成（120 秒）后，队列还要再等 80 秒才清空（示意：到达 12 条/秒）</text>

  <line x1="80" y1="436" x2="848" y2="436" stroke="#66716d" stroke-width="1.6" marker-end="url(#ic-arr)"/>
  <line x1="80" y1="436" x2="80" y2="314" stroke="#66716d" stroke-width="1.6" marker-end="url(#ic-arr)"/>
  <text x="854" y="440" font-size="13.5" fill="#66716d">时间</text>
  <text x="18" y="328" font-size="13.5" fill="#66716d">积压条数</text>

  <polygon points="100,436 460,330 700,436" fill="#fff0e9" opacity="0.72"/>
  <polyline points="100,436 460,330 700,436 814,436" fill="none" stroke="#b54237" stroke-width="2.6"/>

  <circle cx="100" cy="436" r="4.5" fill="#17211f"/>
  <circle cx="460" cy="330" r="5.5" fill="#b54237"/>
  <circle cx="700" cy="436" r="5" fill="#087f73"/>
  <line x1="460" y1="330" x2="460" y2="436" stroke="#c78300" stroke-width="1.4" stroke-dasharray="4 4"/>

  <rect x="134" y="352" width="244" height="58" rx="6" fill="#fff0e9" stroke="#b54237" stroke-width="1.2"/>
  <text x="256" y="376" text-anchor="middle" font-size="14" font-weight="700" fill="#8f3229">故障缺口：净增 +2 条/秒</text>
  <text x="256" y="399" text-anchor="middle" font-size="13.5" fill="#4d5652">剩 2 套 = 10 条/秒 &lt; 到达 12</text>

  <text x="460" y="320" text-anchor="middle" font-size="14" font-weight="700" fill="#8f3229">峰值 240 条（120 秒：加载+预热+路由生效）</text>

  <rect x="520" y="352" width="256" height="58" rx="6" fill="#ddf4ef" stroke="#087f73" stroke-width="1.2"/>
  <text x="648" y="376" text-anchor="middle" font-size="14" font-weight="700" fill="#065f56">恢复消化：净减 −3 条/秒</text>
  <text x="648" y="399" text-anchor="middle" font-size="13.5" fill="#4d5652">3 套恢复 = 15 条/秒 → 80 秒清空</text>

  <text x="100" y="458" text-anchor="middle" font-size="13.5" fill="#17211f">0 s（故障）</text>
  <text x="280" y="458" text-anchor="middle" font-size="13.5" fill="#66716d">60 s（约 120 条）</text>
  <text x="460" y="458" text-anchor="middle" font-size="13.5" font-weight="700" fill="#936300">120 s（新实例接单）</text>
  <text x="700" y="458" text-anchor="middle" font-size="13.5" font-weight="700" fill="#065f56">200 s（积压清零）</text>
  <text x="460" y="486" text-anchor="middle" font-size="13.5" fill="#4d5652">▸ 采用 N+1=4 套在线热备（少 1 套仍剩 15 条/秒）可从根源消除这 120 秒持续缺口</text>
</svg>
