layout: figure
id: inference-capacity-intuition
caption: 工作去向示意，不表示每秒吞吐。左侧三套完整实例能分别接走工作；右侧 C 故障，工作只能交给 A、B。若到达量持续超过它们的能力，未接走的工作会留在队列里。每套可含多张卡，三个实例之间必须独立。
size: [820, 490]
frames:
  - { at: [20, 50], size: [370, 290], label: 故障前：三套实例分担工作 }
  - { at: [430, 50], size: [370, 290], label: 故障后：只能交给 A、B }
grids:
  - at: [80, 105]
    rows: 1
    cols: 3
    cell: [80, 38]
    tone: token
    style: solid
    cells: [{ at: [0, 0], text: 请求 }, { at: [0, 1], text: 请求 }, { at: [0, 2], text: 请求 }]
  - at: [80, 225]
    rows: 1
    cols: 3
    cell: [80, 44]
    tone: weight
    style: solid
    cells: [{ at: [0, 0], text: A }, { at: [0, 1], text: B }, { at: [0, 2], text: C }]
  - at: [490, 105]
    rows: 1
    cols: 3
    cell: [80, 38]
    tone: token
    style: solid
    cells: [{ at: [0, 0], text: 请求 }, { at: [0, 1], text: 请求 }, { at: [0, 2], text: 待处理, style: faded }]
  - at: [490, 225]
    rows: 1
    cols: 3
    cell: [80, 44]
    tone: weight
    style: solid
    cells: [{ at: [0, 0], text: A }, { at: [0, 1], text: B }, { at: [0, 2], text: 'C ×', tone: danger, style: ghost }]
