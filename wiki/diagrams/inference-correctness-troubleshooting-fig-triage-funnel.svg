<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 500" width="900" height="500" role="img" aria-label="输出异常排查四级分流漏斗：输入对齐、贪心首次分歧、执行与解析隔离、MSProbe 与 Runtime Guard 取证" font-family="var(--font-sans)">
  <title>输出异常排查四级漏斗：输入编号 → 贪心首次分歧 → 状态/解析器隔离 → MSProbe / Runtime Guard</title>
  <desc>Four-stage correctness triage funnel from token ID alignment through greedy determinism and parser/buffer checks to MSProbe and Runtime Guard</desc>
  <defs>
    <marker id="ict-arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="#4d5652"/>
    </marker>
  </defs>

  <text x="16" y="28" font-size="16" font-weight="700" fill="#17211f">输出异常四级排查漏斗：逐关收窄边界，只在最后才做逐层张量转储</text>

  <!-- Gate 1 -->
  <rect x="16" y="46" width="548" height="72" rx="8" fill="#e8edff" stroke="#4c65b6" stroke-width="1.4"/>
  <text x="32" y="72" font-size="14.5" font-weight="700" fill="#3a4f93">第 1 关 · 输入编号是否完全一致（如 [11,23,7] vs [11,23,9,7]）</text>
  <text x="32" y="98" font-size="13.5" fill="#4d5652">核对模板展开、工具定义、多模态裁剪与 return_dict（v5）</text>
  <line x1="564" y1="82" x2="594" y2="82" stroke="#4d5652" stroke-width="1.5" marker-end="url(#ict-arr)"/>
  <rect x="596" y="46" width="288" height="72" rx="8" fill="#fff0e9" stroke="#b54237" stroke-width="1.3"/>
  <text x="612" y="72" font-size="14" font-weight="700" fill="#8f3229">不等 → 停在输入层修复</text>
  <text x="612" y="98" font-size="13.5" fill="#4d5652">对齐模板并还原旧模板复现验证</text>

  <line x1="290" y1="118" x2="290" y2="140" stroke="#4d5652" stroke-width="1.5" marker-end="url(#ict-arr)"/>

  <!-- Gate 2 -->
  <rect x="16" y="144" width="548" height="72" rx="8" fill="#fff4cf" stroke="#c78300" stroke-width="1.4"/>
  <text x="32" y="170" font-size="14.5" font-weight="700" fill="#936300">第 2 关 · 切贪心确定性（temp &lt; 1e-5），钉死「首次分歧」共同前缀</text>
  <text x="32" y="196" font-size="13.5" fill="#4d5652">仅比首个不同 token 前的 raw logits 与惩罚/约束后分数（全 greedy 走提前返回）</text>
  <line x1="564" y1="180" x2="594" y2="180" stroke="#4d5652" stroke-width="1.5" marker-end="url(#ict-arr)"/>
  <rect x="596" y="144" width="288" height="72" rx="8" fill="#ddf4ef" stroke="#087f73" stroke-width="1.3"/>
  <text x="612" y="170" font-size="14" font-weight="700" fill="#065f56">生成编号一致 → 查展示/解析</text>
  <text x="612" y="196" font-size="13.5" fill="#4d5652">tool / reasoning parser · 停止串缓冲</text>

  <line x1="290" y1="216" x2="290" y2="238" stroke="#4d5652" stroke-width="1.5" marker-end="url(#ict-arr)"/>

  <!-- Gate 3 -->
  <rect x="16" y="242" width="868" height="92" rx="8" fill="#f7e7f2" stroke="#9a4b86" stroke-width="1.4"/>
  <text x="32" y="268" font-size="14.5" font-weight="700" fill="#7a3a6a">第 3 关 · 若首次分歧 raw logits 已不同：按四类受控对照隔离计算与状态变量</text>
  <text x="32" y="294" font-size="13.5" fill="#4d5652">• 前缀/历史复用：冷态 vs 命中块对照　　　　　• 批形状数值序：单跑 vs 混批（查 batch-invariance）</text>
  <text x="32" y="319" font-size="13.5" fill="#4d5652">• 图回放路径：ACLGraph vs Eager 对照　　　　• 低精度与 PD 交接：量化缩放对齐 + P/D 块校验值比对</text>

  <line x1="230" y1="334" x2="230" y2="356" stroke="#4d5652" stroke-width="1.5" marker-end="url(#ict-arr)"/>
  <line x1="670" y1="334" x2="670" y2="356" stroke="#4d5652" stroke-width="1.5" marker-end="url(#ict-arr)"/>

  <!-- Gate 4: Two capture paths -->
  <rect x="16" y="360" width="424" height="124" rx="8" fill="#ddf4ef" stroke="#087f73" stroke-width="1.4"/>
  <text x="32" y="388" font-size="14.5" font-weight="700" fill="#065f56">第 4A 关 · 稳定复现 → MSProbe 逐层精度对齐</text>
  <text x="32" y="414" font-size="13.5" fill="#4d5652">• 先 L1 statistics 摘要收窄异常层，再切 tensor</text>
  <text x="32" y="438" font-size="13.5" fill="#4d5652">• L0 / mix 产出 construct.json 支持图可视化对比</text>
  <text x="32" y="462" font-size="13.5" fill="#065f56">• 边界：graph 模式不支持动态 step/scope 控制</text>

  <rect x="460" y="360" width="424" height="124" rx="8" fill="#fff0e9" stroke="#b54237" stroke-width="1.4"/>
  <text x="476" y="388" font-size="14.5" font-weight="700" fill="#8f3229">第 4B 关 · 线上偶发 → Runtime Guard（main MRV2）</text>
  <text x="476" y="414" font-size="13.5" fill="#4d5652">• 检测器：token_repeat / logits_finite / spec_accept</text>
  <text x="476" y="438" font-size="13.5" fill="#4d5652">• 热更新递增水位 dump.manual_dump + 限额 dump_kv</text>
  <text x="476" y="462" font-size="13.5" fill="#8f3229">• 边界：v0.30.0 无此键；仅覆盖末级 PP 阶段 TP rank</text>
</svg>
