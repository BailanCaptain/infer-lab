caption: >-
  输出异常四级分流漏斗：先对齐输入 token ID 与模板（含 Transformers v5 return_dict 兼容），再切 greedy（temp < 1e-5 快速路径）定位首个分歧前缀上的 logits 与后处理分数，接着隔离缓存/批不变/图模式/量化/PD 传输四类状态差异并核对 tool/reasoning 解析器与停止串缓冲，最后按离线复现与线上偶发分别接入 MSProbe（L1→tensor）与 main MRV2 Runtime Guard（token_repeat / logits_finite / spec_acceptance + dump_kv）。
