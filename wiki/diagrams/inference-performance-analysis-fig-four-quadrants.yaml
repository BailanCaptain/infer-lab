caption: >-
  推理性能四象限几何指纹归因地图：以四幅缩微时序与 Roofline 图分别直观呈现 Host-bound（主机下发慢引起设备气泡）、Compute-bound（T=2048 顶在算力平顶）、HBM-bound（T=1 落在带宽斜坡）与 Comm/Straggler-bound（Rank 0 在 450 ms 算完却苦等 Rank 1 至 600 ms，实际交换仅 20 ms），并对齐每象限的首取证据与验证杠杆。
