mode: native-svg
id: inference-performance-analysis-fig-four-quadrants
caption: >-
  推理性能四象限归因地图：按时间线空隙、Roofline 算术强度与多卡到达时刻，将慢步切分为 Host-bound（主机准备与下发空隙）、Compute-bound（高算术强度大批矩阵乘）、HBM-bound（低算术强度小批权重复用不足与 KV 读取）与 Comm/Straggler-bound（迟到卡等待与真实链路拥塞），并对齐每类象限的首取证据与验证杠杆。
