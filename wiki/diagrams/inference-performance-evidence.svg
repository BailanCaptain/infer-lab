<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 610 684" width="610" height="684" role="img" aria-label="沿同一条请求查客户端、调度、设备和返回。左支说明尚未获调度；右支继续追已调度请求的结果。站点编号对应一条请求主线。">
  <title>沿同一条请求查客户端、调度、设备和返回。左支说明尚未获调度；右支继续追已调度请求的结果。站点编号对应一条请求主线。</title>
  <defs><marker id="inference-performance-evidence-ah-token" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="var(--color-token, #087f73)"/></marker><marker id="inference-performance-evidence-ah-ink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="var(--color-ink, #17211f)"/></marker><marker id="inference-performance-evidence-ah-weight" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="var(--color-weight, #c78300)"/></marker></defs>
  <path d="M305 84 L305 124" fill="none" stroke="var(--color-token, #087f73)" stroke-width="1.4" marker-end="url(#inference-performance-evidence-ah-token)"/>
  <path d="M125 198 L125 252" fill="none" stroke="var(--color-ink, #17211f)" stroke-width="1.4" marker-end="url(#inference-performance-evidence-ah-ink)"/>
  <path d="M425 198 L425 252" fill="none" stroke="var(--color-weight, #c78300)" stroke-width="1.4" marker-end="url(#inference-performance-evidence-ah-weight)"/>
  <path d="M425 344 L425 394" fill="none" stroke="var(--color-token, #087f73)" stroke-width="1.4" marker-end="url(#inference-performance-evidence-ah-token)"/>
  <path d="M425 468 L425 508" fill="none" stroke="var(--color-token, #087f73)" stroke-width="1.4" marker-end="url(#inference-performance-evidence-ah-token)"/>
  <path d="M425 572 L425 612" fill="none" stroke="var(--color-ink, #17211f)" stroke-width="1.4" marker-end="url(#inference-performance-evidence-ah-ink)"/>
  <path d="M125 344 L125 612" fill="none" stroke="var(--color-ink, #17211f)" stroke-width="1.4" marker-end="url(#inference-performance-evidence-ah-ink)"/>
  <rect x="30" y="20" width="550" height="64" rx="8" fill="var(--color-token-soft, #ddf4ef)" stroke="var(--color-token, #087f73)" stroke-width="1.4"/>
  <text x="305" y="48" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="14" font-weight="700" fill="var(--color-ink, #17211f)" text-anchor="middle">客户端：请求 D 的两次输出</text>
  <text x="305" y="67" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="13" font-weight="400" fill="#065f56" text-anchor="middle">先找到这次停顿的起点与终点</text>
  <rect x="30" y="124" width="550" height="74" rx="8" fill="var(--color-surface, #fbfaf6)" stroke="var(--color-control, #66716d)" stroke-opacity="0.45" stroke-width="1.3" stroke-dasharray="5 4"/>
  <text x="305" y="157" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="13" font-weight="400" fill="#4d5652" text-anchor="middle">第 1–2 站：入口 → Scheduler.schedule</text>
  <text x="305" y="176" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="13" font-weight="400" fill="#4d5652" text-anchor="middle">用请求 D 找到它所在的计算步骤</text>
  <rect x="20" y="252" width="210" height="92" rx="8" fill="var(--color-surface, #fbfaf6)" stroke="var(--color-danger, #b54237)" stroke-opacity="0.45" stroke-width="1.3" stroke-dasharray="5 4"/>
  <text x="125" y="294" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="13" font-weight="400" fill="#8f3229" text-anchor="middle">尚未安排</text>
  <text x="125" y="313" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="13" font-weight="400" fill="#8f3229" text-anchor="middle">查排队、缓存和抢占</text>
  <rect x="260" y="252" width="330" height="92" rx="8" fill="var(--color-weight-soft, #fff4cf)" stroke="var(--color-weight, #c78300)" stroke-width="1.4"/>
  <text x="425" y="294" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="14" font-weight="700" fill="var(--color-ink, #17211f)" text-anchor="middle">第 3–5 站：执行这一步</text>
  <text x="425" y="313" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="13" font-weight="400" fill="#936300" text-anchor="middle">ModelRunner / worker 的开始和结束</text>
  <rect x="260" y="394" width="330" height="74" rx="8" fill="var(--color-surface, #fbfaf6)" stroke="var(--color-control, #66716d)" stroke-opacity="0.45" stroke-width="1.3" stroke-dasharray="5 4"/>
  <text x="425" y="427" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="13" font-weight="400" fill="#4d5652" text-anchor="middle">第 6–7 站：处理与发送</text>
  <text x="425" y="446" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="13" font-weight="400" fill="#4d5652" text-anchor="middle">继续追同一步交出的 D 的结果</text>
  <rect x="260" y="508" width="330" height="64" rx="8" fill="var(--color-token-soft, #ddf4ef)" stroke="var(--color-token, #087f73)" stroke-width="1.4"/>
  <text x="425" y="536" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="14" font-weight="700" fill="var(--color-ink, #17211f)" text-anchor="middle">客户端收到 D 的下一次输出</text>
  <text x="425" y="555" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="13" font-weight="400" fill="#065f56" text-anchor="middle">对回最初记录的停顿终点</text>
  <rect x="20" y="612" width="570" height="56" rx="8" fill="var(--color-control-soft, #f1efe8)" stroke="var(--color-line-strong, #b8bcb5)" stroke-width="1.4"/>
  <text x="305" y="645" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="14" font-weight="700" fill="var(--color-ink, #17211f)" text-anchor="middle">选能区分原因的实验，再验收速度、代价和质量</text>
  <text x="147" y="232" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="14" font-weight="400" fill="var(--color-ink, #17211f)">未安排</text>
  <text x="447" y="232" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="14" font-weight="400" fill="var(--color-ink, #17211f)">已安排</text>
</svg>
