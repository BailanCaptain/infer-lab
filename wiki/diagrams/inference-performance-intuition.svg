  <rect x="568" y="82" width="40" height="38" fill="var(--color-token-soft, #ddf4ef)"/>
  <text x="588" y="105.7" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="13" font-weight="700" fill="#065f56" text-anchor="middle">N</text>
