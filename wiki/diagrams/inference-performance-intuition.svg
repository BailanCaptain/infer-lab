<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 420" width="880" height="420" role="img" aria-label="每个格子代表一个待计算位置，长输入只画出一小段。左侧本步只有 D；右侧把 D 和 N 的输入放进同一批。格子表示工作组成，箭头表示先后，不表示实测耗时。">
  <title>每个格子代表一个待计算位置，长输入只画出一小段。左侧本步只有 D；右侧把 D 和 N 的输入放进同一批。格子表示工作组成，箭头表示先后，不表示实测耗时。</title>
  <defs><marker id="inference-performance-intuition-ah-token" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="var(--color-token, #087f73)"/></marker><marker id="inference-performance-intuition-ah-weight" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="var(--color-weight, #c78300)"/></marker></defs>
  <rect x="24" y="44" width="394" height="330" rx="16" fill="none" stroke="var(--color-line-strong, #b8bcb5)" stroke-width="1.5"/>
  <text x="40" y="32" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="15" font-weight="700" fill="var(--color-ink, #17211f)">原来：只继续回答 D</text>
  <rect x="452" y="44" width="404" height="330" rx="16" fill="none" stroke="var(--color-line-strong, #b8bcb5)" stroke-width="1.5"/>
  <text x="468" y="32" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="15" font-weight="700" fill="var(--color-ink, #17211f)">现在：N 的长提示词也进来</text>
  <path d="M203 148 L203 190" fill="none" stroke="var(--color-token, #087f73)" stroke-width="1.4" marker-end="url(#inference-performance-intuition-ah-token)"/>
  <path d="M522 120 L522 190" fill="none" stroke="var(--color-token, #087f73)" stroke-width="1.4" marker-end="url(#inference-performance-intuition-ah-token)"/>
  <path d="M688 148 L688 190" fill="none" stroke="var(--color-token, #087f73)" stroke-width="1.4" marker-end="url(#inference-performance-intuition-ah-token)"/>
  <path d="M220 250 L220 302" fill="none" stroke="var(--color-weight, #c78300)" stroke-width="1.4" marker-end="url(#inference-performance-intuition-ah-weight)"/>
  <path d="M654 250 L654 302" fill="none" stroke="var(--color-weight, #c78300)" stroke-width="1.4" marker-end="url(#inference-performance-intuition-ah-weight)"/>
