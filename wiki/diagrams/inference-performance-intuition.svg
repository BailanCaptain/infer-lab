  <text x="628" y="105.7" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="13" font-weight="700" fill="#065f56" text-anchor="middle">N</text>
  <rect x="648" y="82" width="40" height="38" fill="var(--color-token-soft, #ddf4ef)"/>
  <text x="668" y="105.7" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="13" font-weight="700" fill="#065f56" text-anchor="middle">N</text>
  <rect x="688" y="82" width="40" height="38" fill="var(--color-token-soft, #ddf4ef)"/>
  <text x="708" y="105.7" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="13" font-weight="700" fill="#065f56" text-anchor="middle">N</text>
  <rect x="728" y="82" width="40" height="38" fill="var(--color-token-soft, #ddf4ef)"/>
  <text x="748" y="105.7" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="13" font-weight="700" fill="#065f56" text-anchor="middle">N</text>
  <rect x="768" y="82" width="40" height="38" fill="var(--color-token-soft, #ddf4ef)"/>
  <text x="788" y="105.7" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="13" font-weight="700" fill="#065f56" text-anchor="middle">…</text>
  <path d="M608 82v38M648 82v38M688 82v38M728 82v38M768 82v38" stroke="var(--color-ink, #17211f)" stroke-opacity="0.35" stroke-width="1" fill="none"/>
  <rect x="568" y="82" width="240" height="38" fill="none" stroke="var(--color-ink, #17211f)" stroke-width="1.3"/>
  <text x="688" y="142" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="13" font-weight="400" fill="#065f56" text-anchor="middle">N 的提示词位置</text>
  <rect x="108" y="190" width="224" height="60" rx="8" fill="var(--color-weight, #c78300)" stroke="var(--color-ink, #17211f)" stroke-width="1.5"/>
  <text x="220" y="225" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="14" font-weight="700" fill="var(--color-ink-inverse, #ffffff)" text-anchor="middle">同一步：续写 D</text>
  <rect x="488" y="190" width="332" height="60" rx="8" fill="var(--color-weight, #c78300)" stroke="var(--color-ink, #17211f)" stroke-width="1.5"/>
  <text x="654" y="225" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="14" font-weight="700" fill="var(--color-ink-inverse, #ffffff)" text-anchor="middle">同一步：续写 D ＋ 处理 N</text>
  <rect x="153" y="302" width="134" height="42" rx="8" fill="var(--color-token, #087f73)" stroke="var(--color-ink, #17211f)" stroke-width="1.5"/>
  <text x="220" y="328" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="14" font-weight="700" fill="var(--color-ink-inverse, #ffffff)" text-anchor="middle">D 的新输出</text>
  <rect x="587" y="302" width="134" height="42" rx="8" fill="var(--color-token, #087f73)" stroke="var(--color-ink, #17211f)" stroke-width="1.5"/>
  <text x="654" y="328" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="14" font-weight="700" fill="var(--color-ink-inverse, #ffffff)" text-anchor="middle">D 的新输出</text>
  <text x="220" y="364" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="13" font-weight="400" fill="var(--color-ink, #17211f)" text-anchor="middle">等本步完成，才能交回输出</text>
  <text x="654" y="364" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="13" font-weight="400" fill="var(--color-ink, #17211f)" text-anchor="middle">D 也要等包含 N 的这一步完成</text>
  <text x="440" y="403" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="14" font-weight="400" fill="var(--color-ink, #17211f)" text-anchor="middle">D 的问题没变；本步的工作变多了。接着查：它是否真的变慢？</text>
</svg>
