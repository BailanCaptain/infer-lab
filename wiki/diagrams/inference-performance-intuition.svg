  <text x="203" y="105.7" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="13" font-weight="700" fill="var(--color-ink-inverse, #ffffff)" text-anchor="middle">D</text>
  <rect x="174" y="82" width="58" height="38" fill="none" stroke="var(--color-ink, #17211f)" stroke-width="1.3"/>
  <text x="203" y="142" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="13" font-weight="400" fill="#065f56" text-anchor="middle">D 待算的下一个位置</text>
  <rect x="502" y="82" width="40" height="38" fill="var(--color-token, #087f73)"/>
  <text x="522" y="105.7" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="13" font-weight="700" fill="var(--color-ink-inverse, #ffffff)" text-anchor="middle">D</text>
