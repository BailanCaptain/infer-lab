mode: native-svg
id: inference-performance-troubleshooting-fig-tradeoffs
caption: >-
  性能优化的两个核心判断依据：（一）对排队占 800 ms 的请求仅把计算从 50 ms 减半到 25 ms，直接端到端仅从 860 ms 降至 835 ms，而治排队/路由偏斜可压至 160 ms；（二）单改批预算或并发会沿「批形状/补齐 → 图模式/eager → MC2/AllGather」产生连锁涟漪，四类无故障优化均须同步验收伴随代价。
