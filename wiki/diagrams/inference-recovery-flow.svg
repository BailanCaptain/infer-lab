<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 670" width="820" height="670" role="img" aria-label="服务控制流程示意。计划下线能交接仍可读取的状态；突然故障先判断还有什么状态可用，两条路都要验收客户端结果。">
  <title>服务控制流程示意。计划下线能交接仍可读取的状态；突然故障先判断还有什么状态可用，两条路都要验收客户端结果。</title>
  <defs><marker id="inference-recovery-flow-ah-ink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="var(--color-ink, #17211f)"/></marker><marker id="inference-recovery-flow-ah-token" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="var(--color-token, #087f73)"/></marker></defs>
  <path d="M205 80 L205 125" fill="none" stroke="var(--color-ink, #17211f)" stroke-width="1.4" marker-end="url(#inference-recovery-flow-ah-ink)"/>
  <path d="M615 80 L615 125" fill="none" stroke="var(--color-ink, #17211f)" stroke-width="1.4" marker-end="url(#inference-recovery-flow-ah-ink)"/>
  <path d="M205 195 L205 245" fill="none" stroke="var(--color-ink, #17211f)" stroke-width="1.4" marker-end="url(#inference-recovery-flow-ah-ink)"/>
  <path d="M615 195 L615 245" fill="none" stroke="var(--color-ink, #17211f)" stroke-width="1.4" marker-end="url(#inference-recovery-flow-ah-ink)"/>
  <path d="M105 305 L105 350" fill="none" stroke="var(--color-token, #087f73)" stroke-width="1.4" marker-end="url(#inference-recovery-flow-ah-token)"/>
  <path d="M305 305 L305 350" fill="none" stroke="var(--color-ink, #17211f)" stroke-width="1.4" marker-end="url(#inference-recovery-flow-ah-ink)"/>
  <path d="M515 305 L515 350" fill="none" stroke="var(--color-token, #087f73)" stroke-width="1.4" marker-end="url(#inference-recovery-flow-ah-token)"/>
  <path d="M715 305 L715 350" fill="none" stroke="var(--color-ink, #17211f)" stroke-width="1.4" marker-end="url(#inference-recovery-flow-ah-ink)"/>
  <path d="M105 430 L105 475" fill="none" stroke="var(--color-token, #087f73)" stroke-width="1.4" marker-end="url(#inference-recovery-flow-ah-token)"/>
  <path d="M305 430 L305 475" fill="none" stroke="var(--color-ink, #17211f)" stroke-width="1.4" marker-end="url(#inference-recovery-flow-ah-ink)"/>
  <path d="M515 430 L515 475" fill="none" stroke="var(--color-token, #087f73)" stroke-width="1.4" marker-end="url(#inference-recovery-flow-ah-token)"/>
  <path d="M715 430 L715 475" fill="none" stroke="var(--color-ink, #17211f)" stroke-width="1.4" marker-end="url(#inference-recovery-flow-ah-ink)"/>
  <path d="M205 540 L205 580" fill="none" stroke="var(--color-ink, #17211f)" stroke-width="1.4" marker-end="url(#inference-recovery-flow-ah-ink)"/>
  <path d="M615 540 L615 580" fill="none" stroke="var(--color-ink, #17211f)" stroke-width="1.4" marker-end="url(#inference-recovery-flow-ah-ink)"/>
  <rect x="20" y="20" width="370" height="60" rx="8" fill="var(--color-surface, #fbfaf6)" stroke="var(--color-control, #66716d)" stroke-opacity="0.45" stroke-width="1.3" stroke-dasharray="5 4"/>
  <text x="205" y="55" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="13" font-weight="400" fill="#4d5652" text-anchor="middle">计划下线：仍能工作</text>
  <rect x="430" y="20" width="370" height="60" rx="8" fill="var(--color-surface, #fbfaf6)" stroke="var(--color-danger, #b54237)" stroke-opacity="0.45" stroke-width="1.3" stroke-dasharray="5 4"/>
  <text x="615" y="55" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="13" font-weight="400" fill="#8f3229" text-anchor="middle">突然故障：状态未必可读</text>
  <rect x="20" y="125" width="370" height="70" rx="8" fill="var(--color-surface, #fbfaf6)" stroke="var(--color-token, #087f73)" stroke-opacity="0.45" stroke-width="1.3" stroke-dasharray="5 4"/>
  <text x="205" y="156" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="13" font-weight="400" fill="#065f56" text-anchor="middle">停接新单，等待已有请求</text>
  <text x="205" y="175" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="13" font-weight="400" fill="#065f56" text-anchor="middle">宽限期后检查剩余工作</text>
  <rect x="430" y="125" width="370" height="70" rx="8" fill="var(--color-surface, #fbfaf6)" stroke="var(--color-token, #087f73)" stroke-opacity="0.45" stroke-width="1.3" stroke-dasharray="5 4"/>
  <text x="615" y="156" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="13" font-weight="400" fill="#065f56" text-anchor="middle">隔离故障，核对可用状态</text>
  <text x="615" y="175" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="13" font-weight="400" fill="#065f56" text-anchor="middle">已保存历史与在途状态分开查</text>
  <rect x="20" y="245" width="370" height="60" rx="8" fill="var(--color-surface, #fbfaf6)" stroke="var(--color-kv, #4c65b6)" stroke-opacity="0.45" stroke-width="1.3" stroke-dasharray="5 4"/>
  <text x="205" y="280" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="13" font-weight="400" fill="#3a4f93" text-anchor="middle">有余量且支持迁移？</text>
  <rect x="430" y="245" width="370" height="60" rx="8" fill="var(--color-surface, #fbfaf6)" stroke="var(--color-kv, #4c65b6)" stroke-opacity="0.45" stroke-width="1.3" stroke-dasharray="5 4"/>
  <text x="615" y="280" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="13" font-weight="400" fill="#3a4f93" text-anchor="middle">状态足够且支持续传？</text>
  <rect x="20" y="350" width="170" height="80" rx="8" fill="var(--color-token-soft, #ddf4ef)" stroke="var(--color-token, #087f73)" stroke-width="1.4"/>
  <text x="105" y="386" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="14" font-weight="700" fill="var(--color-ink, #17211f)" text-anchor="middle">是：交接</text>
  <text x="105" y="405" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="13" font-weight="400" fill="#065f56" text-anchor="middle">等接收确认</text>
  <rect x="220" y="350" width="170" height="80" rx="8" fill="var(--color-surface, #fbfaf6)" stroke="var(--color-control, #66716d)" stroke-opacity="0.45" stroke-width="1.3" stroke-dasharray="5 4"/>
  <text x="305" y="386" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="13" font-weight="400" fill="#4d5652" text-anchor="middle">否：按策略</text>
  <text x="305" y="405" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="13" font-weight="400" fill="#4d5652" text-anchor="middle">等待或结束</text>
  <rect x="430" y="350" width="170" height="80" rx="8" fill="var(--color-token-soft, #ddf4ef)" stroke="var(--color-token, #087f73)" stroke-width="1.4"/>
  <text x="515" y="386" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="14" font-weight="700" fill="var(--color-ink, #17211f)" text-anchor="middle">是：接续</text>
  <text x="515" y="405" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="13" font-weight="400" fill="#065f56" text-anchor="middle">按协议恢复</text>
  <rect x="630" y="350" width="170" height="80" rx="8" fill="var(--color-surface, #fbfaf6)" stroke="var(--color-control, #66716d)" stroke-opacity="0.45" stroke-width="1.3" stroke-dasharray="5 4"/>
  <text x="715" y="386" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="13" font-weight="400" fill="#4d5652" text-anchor="middle">否：新尝试</text>
  <text x="715" y="405" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="13" font-weight="400" fill="#4d5652" text-anchor="middle">重算或报失败</text>
  <rect x="20" y="475" width="370" height="65" rx="8" fill="var(--color-surface, #fbfaf6)" stroke="var(--color-kv, #4c65b6)" stroke-opacity="0.45" stroke-width="1.3" stroke-dasharray="5 4"/>
  <text x="205" y="512.5" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="13" font-weight="400" fill="#3a4f93" text-anchor="middle">确认接管或结束，再释放</text>
  <rect x="430" y="475" width="370" height="65" rx="8" fill="var(--color-surface, #fbfaf6)" stroke="var(--color-control, #66716d)" stroke-opacity="0.45" stroke-width="1.3" stroke-dasharray="5 4"/>
  <text x="615" y="512.5" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="13" font-weight="400" fill="#4d5652" text-anchor="middle">关联尝试，限制重试负载</text>
  <rect x="20" y="580" width="780" height="70" rx="8" fill="var(--color-surface, #fbfaf6)" stroke="var(--color-control, #66716d)" stroke-opacity="0.45" stroke-width="1.3" stroke-dasharray="5 4"/>
  <text x="410" y="611" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="13" font-weight="400" fill="#4d5652" text-anchor="middle">验收：积压回落、目标恢复、输出正确、资源收尾</text>
  <text x="410" y="630" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="13" font-weight="400" fill="#4d5652" text-anchor="middle">第 1–2 站重新安排 → 第 3–7 站执行与返回 → 请求结束</text>
</svg>
