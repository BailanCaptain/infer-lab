<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 470" width="820" height="470" role="img" aria-label="先确认采集覆盖，再沿请求检查交接。左边是要确认的阶段，右边是回答“还没有”时先取的证据；有该请求的成功记录才继续向下，日志缺失本身不能证明没有执行。">
  <title>先确认采集覆盖，再沿请求检查交接。左边是要确认的阶段，右边是回答“还没有”时先取的证据；有该请求的成功记录才继续向下，日志缺失本身不能证明没有执行。</title>
  <defs><marker id="inference-troubleshooting-boundary-ah-ink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="var(--color-ink, #17211f)"/></marker><marker id="inference-troubleshooting-boundary-ah-control" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="var(--color-control, #66716d)"/></marker><marker id="inference-troubleshooting-boundary-ah-token" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="var(--color-token, #087f73)"/></marker><marker id="inference-troubleshooting-boundary-ah-weight" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="var(--color-weight, #c78300)"/></marker></defs>
  <path d="M210 84 L210 125" fill="none" stroke="var(--color-ink, #17211f)" stroke-width="1.4" marker-end="url(#inference-troubleshooting-boundary-ah-ink)"/>
  <path d="M210 189 L210 230" fill="none" stroke="var(--color-ink, #17211f)" stroke-width="1.4" marker-end="url(#inference-troubleshooting-boundary-ah-ink)"/>
  <path d="M210 294 L210 335" fill="none" stroke="var(--color-ink, #17211f)" stroke-width="1.4" marker-end="url(#inference-troubleshooting-boundary-ah-ink)"/>
  <path d="M395 52 L475 52" fill="none" stroke="var(--color-control, #66716d)" stroke-width="1.4" marker-end="url(#inference-troubleshooting-boundary-ah-control)"/>
  <path d="M395 157 L475 157" fill="none" stroke="var(--color-token, #087f73)" stroke-width="1.4" marker-end="url(#inference-troubleshooting-boundary-ah-token)"/>
  <path d="M395 262 L475 262" fill="none" stroke="var(--color-weight, #c78300)" stroke-width="1.4" marker-end="url(#inference-troubleshooting-boundary-ah-weight)"/>
  <path d="M395 367 L475 367" fill="none" stroke="var(--color-token, #087f73)" stroke-width="1.4" marker-end="url(#inference-troubleshooting-boundary-ah-token)"/>
  <rect x="25" y="20" width="370" height="64" rx="8" fill="var(--color-surface-sunken, #ece9df)" stroke="var(--color-control, #66716d)" stroke-opacity="0.4" stroke-width="1.5" stroke-dasharray="5 4"/>
  <text x="210" y="57" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="13" font-weight="400" fill="#4d5652" text-anchor="middle">启动：模型与设备准备好了？</text>
  <rect x="25" y="125" width="370" height="64" rx="8" fill="var(--color-token-soft, #ddf4ef)" stroke="var(--color-token, #087f73)" stroke-opacity="0.4" stroke-width="1.5" stroke-dasharray="5 4"/>
  <text x="210" y="162" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="13" font-weight="400" fill="#065f56" text-anchor="middle">第 1–2 站：请求收到并获调度？</text>
  <rect x="25" y="230" width="370" height="64" rx="8" fill="var(--color-weight-soft, #fff4cf)" stroke="var(--color-weight, #c78300)" stroke-opacity="0.4" stroke-width="1.5" stroke-dasharray="5 4"/>
  <text x="210" y="267" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="13" font-weight="400" fill="#936300" text-anchor="middle">第 3–5 站：参与卡完成这一步？</text>
  <rect x="25" y="335" width="370" height="64" rx="8" fill="var(--color-token-soft, #ddf4ef)" stroke="var(--color-token, #087f73)" stroke-opacity="0.4" stroke-width="1.5" stroke-dasharray="5 4"/>
  <text x="210" y="372" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="13" font-weight="400" fill="#065f56" text-anchor="middle">第 6–7 站：内容到达客户端？</text>
  <text x="230" y="111" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="13" font-weight="400" fill="var(--color-ink, #17211f)">已确认</text>
  <text x="230" y="216" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="13" font-weight="400" fill="var(--color-ink, #17211f)">已确认</text>
  <text x="230" y="321" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="13" font-weight="400" fill="var(--color-ink, #17211f)">已确认</text>
  <text x="434" y="42" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="13" font-weight="400" fill="var(--color-ink, #17211f)" text-anchor="middle">否</text>
  <text x="434" y="147" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="13" font-weight="400" fill="var(--color-ink, #17211f)" text-anchor="middle">否</text>
  <text x="434" y="252" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="13" font-weight="400" fill="var(--color-ink, #17211f)" text-anchor="middle">否</text>
  <text x="434" y="357" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="13" font-weight="400" fill="var(--color-ink, #17211f)" text-anchor="middle">否</text>
  <text x="490" y="45" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="15" font-weight="700" fill="var(--color-ink, #17211f)">查最后成功的启动阶段</text>
  <text x="490" y="69" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="13" font-weight="400" fill="var(--color-ink-muted, #66716d)" font-style="italic">加载、设备初始化、预热的记录</text>
  <text x="490" y="150" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="15" font-weight="700" fill="var(--color-ink, #17211f)">查请求 R 是否分到某一步</text>
  <text x="490" y="174" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="13" font-weight="400" fill="var(--color-ink-muted, #66716d)" font-style="italic">入口记录 → 队列 → 步骤中的请求</text>
  <text x="490" y="255" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="15" font-weight="700" fill="var(--color-ink, #17211f)">查该步各参与卡的进度</text>
  <text x="490" y="279" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="13" font-weight="400" fill="var(--color-ink-muted, #66716d)" font-style="italic">哪张卡先停住？此前有什么错误？</text>
  <text x="490" y="360" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="15" font-weight="700" fill="var(--color-ink, #17211f)">沿同一内容片段追返回</text>
  <text x="490" y="384" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="13" font-weight="400" fill="var(--color-ink-muted, #66716d)" font-style="italic">服务发出 → 代理收到 → 客户端收到</text>
  <text x="410" y="447" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="15" font-weight="400" fill="var(--color-ink, #17211f)" text-anchor="middle">对齐请求、步骤、参与进程与时间，再判断最后一次成功交接</text>
</svg>
