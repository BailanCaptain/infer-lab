<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 520" width="820" height="520" role="img" aria-label="同一响应流按相同时序重放（示意）。小格代表同一请求 R 的首个内容片段：直连能收到，经原代理配置被积压，修正缓冲后恢复逐段交付；恢复旧配置又积压，才支持本例的缓冲判断。片段编号是观察标注，不是假定接口字段。">
  <title>同一响应流按相同时序重放（示意）。小格代表同一请求 R 的首个内容片段：直连能收到，经原代理配置被积压，修正缓冲后恢复逐段交付；恢复旧配置又积压，才支持本例的缓冲判断。片段编号是观察标注，不是假定接口字段。</title>
  <defs><marker id="inference-troubleshooting-experiment-ah-token" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="var(--color-token, #087f73)"/></marker></defs>
  <rect x="20" y="40" width="780" height="110" rx="16" fill="none" stroke="var(--color-line-strong, #b8bcb5)" stroke-width="1.5"/>
  <text x="36" y="28" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="15" font-weight="700" fill="var(--color-ink, #17211f)">对照 1：直连，片段能够到达</text>
  <rect x="20" y="205" width="780" height="110" rx="16" fill="none" stroke="var(--color-line-strong, #b8bcb5)" stroke-width="1.5"/>
  <text x="36" y="193" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="15" font-weight="700" fill="var(--color-ink, #17211f)">对照 2：经过原代理，片段停在代理内</text>
  <rect x="20" y="370" width="780" height="110" rx="16" fill="none" stroke="var(--color-line-strong, #b8bcb5)" stroke-width="1.5"/>
  <text x="36" y="358" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="15" font-weight="700" fill="var(--color-ink, #17211f)">对照 3：只修正代理缓冲，客户端恢复逐段接收</text>
  <rect x="300" y="235" width="210" height="65" rx="16" fill="none" stroke="var(--color-line-strong, #b8bcb5)" stroke-width="1.5"/>
  <text x="316" y="223" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="15" font-weight="700" fill="var(--color-ink, #17211f)">代理已收到</text>
