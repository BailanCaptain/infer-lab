<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 460" width="900" height="460" role="img" aria-label="四种递推形式的机制对照：都维护矩阵状态；Delta 更新修正键对应的预测误差，GDN 增加每头统一衰减，KDA 允许 key 通道分别衰减。格子表示状态通道，不是测量值">
  <title>四种递推形式的机制对照：都维护矩阵状态；Delta 更新修正键对应的预测误差，GDN 增加每头统一衰减，KDA 允许 key 通道分别衰减。格子表示状态通道，不是测量值</title>
