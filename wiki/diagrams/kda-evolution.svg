<g text-anchor="middle">
  <text x="113" y="394" font-family="var(--font-mono)" font-size="12.5" font-weight="700" fill="#17211f">Sₜ = Sₜ₋₁ + vₜkₜᵀ</text>
  <text x="113" y="416" font-family="var(--font-mono)" font-size="12" fill="#4d5652">oₜ = Sₜqₜ</text>
  <text x="113" y="438" font-size="12" font-weight="700" fill="#b54237">记忆容量随步数迅速饱和</text>
  <text x="113" y="456" font-size="12" fill="#66716d">朴素核线性注意力基线</text>

  <text x="337" y="394" font-family="var(--font-mono)" font-size="12.5" font-weight="700" fill="#3a4f93">eₜ = vₜ − Sₜ₋₁kₜ</text>
  <text x="337" y="416" font-family="var(--font-mono)" font-size="12.5" font-weight="700" fill="#17211f">Sₜ = Sₜ₋₁ + βₜeₜkₜᵀ</text>
  <text x="337" y="438" font-size="12" font-weight="700" fill="#3a4f93">同键重复写零冗余不溢出</text>
  <text x="337" y="456" font-size="12" fill="#66716d">缺显式遗忘，远古噪声常驻</text>

  <text x="561" y="394" font-family="var(--font-mono)" font-size="12" font-weight="700" fill="#936300">S̄ₜ = αₜSₜ₋₁  (标量 αₜ)</text>
  <text x="561" y="416" font-family="var(--font-mono)" font-size="12" font-weight="700" fill="#17211f">Sₜ = S̄ₜ + βₜeₜkₜᵀ</text>
  <text x="561" y="438" font-size="12" font-weight="700" fill="#936300">每头 1 个系数平滑遗忘</text>
  <text x="561" y="456" font-size="12" fill="#66716d">代表：Qwen3-Next (GDN)</text>

  <text x="785" y="394" font-family="var(--font-mono)" font-size="12" font-weight="700" fill="#065f56">S̄ₜ = Sₜ₋₁diag(αₜ)</text>
  <text x="785" y="416" font-family="var(--font-mono)" font-size="12" font-weight="700" fill="#17211f">Sₜ = S̄ₜ + βₜeₜkₜᵀ</text>
  <text x="785" y="438" font-size="12" font-weight="700" fill="#065f56">高频列快忘 · 长程列常驻</text>
  <text x="785" y="456" font-size="12" fill="#66716d">代表：Kimi Linear / GLM</text>
</g>

<!-- Band 2: Side-by-Side Outer Product Column Update Examples -->
<rect x="10" y="486" width="878" height="186" rx="10" fill="#fbfaf6" stroke="#d8d8cf" stroke-width="1.3"/>
<text x="26" y="512" font-size="15" font-weight="700" fill="#17211f">外积增量 ΔS = β e kᵀ 的列更新对比（固定 β=1, e=(1, 2)ᵀ 示意：更新 k 所有非零分量对应的列）</text>

<!-- Left Sub-card: k = (0, 1) -->
<rect x="24" y="526" width="416" height="134" rx="8" fill="#ffffff" stroke="#4c65b6" stroke-width="1.2"/>
<text x="232" y="548" text-anchor="middle" font-size="13" font-weight="700" fill="#3a4f93">单列特例：k = (0, 1)ᵀ（仅第 2 分量非零）</text>
<text x="38" y="576" font-family="var(--font-mono)" font-size="12.5" font-weight="700" fill="#17211f">ΔS = [1, 2]ᵀ · [0, 1]</text>
<text x="38" y="602" font-size="12" fill="#4d5652">• 第 1 列增量：(0, 0)ᵀ（不变）</text>
<text x="38" y="626" font-size="12" font-weight="700" fill="#065f56">• 第 2 列增量：(1, 2)ᵀ（仅修第 2 列）</text>
<text x="38" y="648" font-size="12" fill="#66716d">坐标基向量下才退化为单列擦写</text>
<g stroke-width="1.2">
