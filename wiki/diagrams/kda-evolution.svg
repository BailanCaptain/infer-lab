<g text-anchor="middle">
  <text x="113" y="301" font-size="13" font-weight="700" fill="#8f3229">✗ 无预测误差回路</text>
  <text x="113" y="324" font-size="12" fill="#8f3229">不读旧状态直接叠 vₜkₜᵀ</text>
  <text x="113" y="346" font-size="12" fill="#b54237">相似键重复写 → 饱和串味</text>

  <text x="337" y="301" font-size="13" font-weight="700" fill="#065f56">↻ 预测误差回路</text>
  <text x="337" y="324" font-size="12" fill="#17211f">探针读出 v̂ₜ = Sₜ₋₁kₜ</text>
  <text x="337" y="346" font-size="12" fill="#065f56">按 βₜeₜkₜᵀ 更新非零键列</text>

  <text x="561" y="301" font-size="13" font-weight="700" fill="#936300">↻ 整块冲淡 + 误差回路</text>
  <text x="561" y="324" font-size="12" fill="#17211f">全矩阵同乘每头标量 αₜ</text>
  <text x="561" y="346" font-size="12" fill="#936300">误差 eₜ = vₜ − αₜSₜ₋₁kₜ</text>

  <text x="785" y="301" font-size="13" font-weight="700" fill="#7a3a6a">↻ 通道衰减 + 误差回路</text>
  <text x="785" y="324" font-size="12" fill="#17211f">当前门值 αₜ,ᵢ 独立衰减第 i 列</text>
  <text x="785" y="346" font-size="12" fill="#7a3a6a">误差 eₜ = vₜ − S̄ₜkₜ</text>
</g>
<g fill="#ffffff" stroke="#d8d8cf" stroke-width="1.3">
