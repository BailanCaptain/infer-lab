<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 400" width="900" height="400" role="img" aria-label="四种递推形式的机制对照：都维护一个矩阵状态。累加式直接加入新的键值关联；DeltaNet 改成按当前键的预测误差修正，误差用写入前的状态算；Gated DeltaNet 在修正前先按每头一个系数衰减旧状态；KDA 把衰减细化到每个 key 通道。格子表示状态通道，不是测量值。">
  <title>四种递推形式的机制对照：都维护一个矩阵状态。累加式直接加入新的键值关联；DeltaNet 改成按当前键的预测误差修正，误差用写入前的状态算；Gated DeltaNet 在修正前先按每头一个系数衰减旧状态；KDA 把衰减细化到每个 key 通道。格子表示状态通道，不是测量值。</title>
  <defs><marker id="kda-evolution-ah-control" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="var(--color-control, #66716d)"/></marker></defs>
