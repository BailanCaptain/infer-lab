<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 684" width="900" height="684" role="img" aria-label="四种递推状态更新机制对照与外积非零列更新双算例" font-family="var(--font-sans)">
<title>四种线性注意力状态递推演化对照与 βekᵀ 列更新双算例</title>
<desc>上半对比累加式、DeltaNet、Gated DeltaNet 与 KDA（标明 KDA 列衰减由当前步门值产生）；下半并排展示 β=1, e=(1,2) 时 k=(0,1) 单列更新与 k=(0.6,0.8) 双列增量 (0.6,1.2)、(0.8,1.6)。</desc>
