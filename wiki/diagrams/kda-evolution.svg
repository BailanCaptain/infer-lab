  <text x="565" y="272">dₖ 键通道</text>
  <text x="789" y="272">dₖ 键通道</text>
</g>
<!-- Read/Write Feedback Loop Arrows between Matrix and Error Circuit -->
<g fill="none" stroke-width="1.6">
  <line x1="101" y1="112" x2="101" y2="124" stroke="#b54237" marker-end="url(#arr-red)"/>
  <line x1="292" y1="256" x2="292" y2="298" stroke="#087f73" marker-end="url(#arr-teal)"/>
  <line x1="388" y1="300" x2="388" y2="258" stroke="#087f73" marker-end="url(#arr-teal)"/>
  <line x1="516" y1="256" x2="516" y2="298" stroke="#c78300" marker-end="url(#arr-amber)"/>
  <line x1="612" y1="300" x2="612" y2="258" stroke="#087f73" marker-end="url(#arr-teal)"/>
  <line x1="740" y1="256" x2="740" y2="298" stroke="#9a4b86" marker-end="url(#arr-plum)"/>
  <line x1="836" y1="300" x2="836" y2="258" stroke="#087f73" marker-end="url(#arr-teal)"/>
</g>
<!-- Feedback Error Circuit Cards -->
<rect x="20" y="302" width="186" height="92" rx="8" fill="#fff0e9" stroke="#b54237" stroke-width="1.3" stroke-dasharray="5 3"/>
<rect x="244" y="302" width="186" height="92" rx="8" fill="#ddf4ef" stroke="#087f73" stroke-width="1.3"/>
<rect x="468" y="302" width="186" height="92" rx="8" fill="#fff4cf" stroke="#c78300" stroke-width="1.3"/>
<rect x="692" y="302" width="186" height="92" rx="8" fill="#f7e7f2" stroke="#9a4b86" stroke-width="1.3"/>
<g text-anchor="middle">
  <text x="113" y="326" font-size="13.5" font-weight="700" fill="#8f3229">✗ 无预测误差回路</text>
  <text x="113" y="351" font-size="12.5" fill="#8f3229">不读旧状态直接叠 vₜkₜᵀ</text>
  <text x="113" y="375" font-size="12.5" fill="#b54237">相似键重复写 → 饱和串味</text>

  <text x="337" y="326" font-size="13.5" font-weight="700" fill="#065f56">↻ 预测误差回路</text>
  <text x="337" y="351" font-size="12.5" fill="#17211f">探针读出 v̂ₜ = Sₜ₋₁kₜ</text>
  <text x="337" y="375" font-size="12.5" fill="#065f56">按 eₜ = vₜ − v̂ₜ 定向擦写</text>

  <text x="561" y="326" font-size="13.5" font-weight="700" fill="#936300">↻ 整块冲淡 + 误差回路</text>
  <text x="561" y="351" font-size="12.5" fill="#17211f">全矩阵同乘每头标量 αₜ</text>
  <text x="561" y="375" font-size="12.5" fill="#936300">误差 eₜ = vₜ − αₜSₜ₋₁kₜ</text>

  <text x="785" y="326" font-size="13.5" font-weight="700" fill="#7a3a6a">↻ 通道衰减 + 误差回路</text>
  <text x="785" y="351" font-size="12.5" fill="#17211f">第 i 键列独立乘 αₜ,ᵢ</text>
  <text x="785" y="375" font-size="12.5" fill="#7a3a6a">误差 eₜ = vₜ − S̄ₜkₜ</text>
</g>
<!-- Recurrence Formula & Architecture Summary Cards -->
<g fill="#ffffff" stroke="#d8d8cf" stroke-width="1.3">
  <rect x="20" y="406" width="186" height="110" rx="8"/>
  <rect x="244" y="406" width="186" height="110" rx="8"/>
  <rect x="468" y="406" width="186" height="110" rx="8"/>
  <rect x="692" y="406" width="186" height="110" rx="8"/>
</g>
<g text-anchor="middle">
  <text x="113" y="430" font-family="var(--font-mono)" font-size="13" font-weight="700" fill="#17211f">Sₜ = Sₜ₋₁ + vₜkₜᵀ</text>
  <text x="113" y="454" font-family="var(--font-mono)" font-size="12.5" fill="#4d5652">oₜ = Sₜqₜ</text>
  <text x="113" y="481" font-size="12.5" font-weight="700" fill="#b54237">记忆容量随步数迅速饱和</text>
  <text x="113" y="503" font-size="12" fill="#66716d">朴素核线性注意力基线</text>

  <text x="337" y="430" font-family="var(--font-mono)" font-size="13" font-weight="700" fill="#3a4f93">eₜ = vₜ − Sₜ₋₁kₜ</text>
  <text x="337" y="454" font-family="var(--font-mono)" font-size="13" font-weight="700" fill="#17211f">Sₜ = Sₜ₋₁ + βₜeₜkₜᵀ</text>
  <text x="337" y="481" font-size="12.5" font-weight="700" fill="#3a4f93">同键重复写零冗余不溢出</text>
  <text x="337" y="503" font-size="12" fill="#66716d">缺显式遗忘，远古噪声常驻</text>

  <text x="561" y="430" font-family="var(--font-mono)" font-size="12.5" font-weight="700" fill="#936300">S̄ₜ = αₜSₜ₋₁  (标量 αₜ)</text>
  <text x="561" y="454" font-family="var(--font-mono)" font-size="12.5" font-weight="700" fill="#17211f">Sₜ = S̄ₜ + βₜeₜkₜᵀ</text>
  <text x="561" y="481" font-size="12.5" font-weight="700" fill="#936300">每头 1 个系数平滑遗忘</text>
  <text x="561" y="503" font-size="12" fill="#66716d">代表：Qwen3-Next (GDN)</text>

  <text x="785" y="430" font-family="var(--font-mono)" font-size="12.5" font-weight="700" fill="#065f56">S̄ₜ = Sₜ₋₁diag(αₜ)</text>
  <text x="785" y="454" font-family="var(--font-mono)" font-size="12.5" font-weight="700" fill="#17211f">Sₜ = S̄ₜ + βₜeₜkₜᵀ</text>
  <text x="785" y="481" font-size="12.5" font-weight="700" fill="#065f56">高频列快忘 · 长程列常驻</text>
  <text x="785" y="503" font-size="12" fill="#66716d">代表：Kimi Linear / GLM</text>
</g>
</svg>
