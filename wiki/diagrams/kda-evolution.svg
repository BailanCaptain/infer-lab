<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 540" width="900" height="540" role="img" aria-label="四种递推状态更新机制对照：累加式、DeltaNet、Gated DeltaNet 与 KDA" font-family="var(--font-sans)">
<title>四种线性注意力状态递推演化对照：累加式 → DeltaNet → Gated DeltaNet → KDA</title>
<desc>对比单头状态矩阵 S_t 在累加式、DeltaNet、Gated DeltaNet 与 KDA 四种法则下的输入门控、矩阵列衰减深浅与预测误差回路。</desc>
<defs>
  <marker id="arr-ctrl" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
    <path d="M1 1.5L8.5 5L1 8.5Z" fill="#66716d"/>
  </marker>
  <marker id="arr-teal" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
    <path d="M1 1.5L8.5 5L1 8.5Z" fill="#087f73"/>
  </marker>
  <marker id="arr-amber" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
    <path d="M1 1.5L8.5 5L1 8.5Z" fill="#c78300"/>
  </marker>
  <marker id="arr-plum" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
    <path d="M1 1.5L8.5 5L1 8.5Z" fill="#9a4b86"/>
  </marker>
  <marker id="arr-red" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
    <path d="M1 1.5L8.5 5L1 8.5Z" fill="#b54237"/>
  </marker>
</defs>
<g stroke="#d8d8cf" stroke-width="1.3">
  <rect x="10" y="12" width="206" height="516" rx="10" fill="#fbfaf6"/>
  <rect x="234" y="12" width="206" height="516" rx="10" fill="#fbfaf6"/>
  <rect x="458" y="12" width="206" height="516" rx="10" fill="#fbfaf6"/>
  <rect x="682" y="12" width="206" height="516" rx="10" fill="#fbfaf6"/>
  <line x1="22" y1="74" x2="204" y2="74"/>
  <line x1="246" y1="74" x2="428" y2="74"/>
  <line x1="470" y1="74" x2="652" y2="74"/>
  <line x1="694" y1="74" x2="876" y2="74"/>
</g>
<g stroke="#66716d" stroke-width="1.8" fill="none" marker-end="url(#arr-ctrl)">
  <line x1="217" y1="226" x2="232" y2="226"/>
  <line x1="441" y1="226" x2="456" y2="226"/>
  <line x1="665" y1="226" x2="680" y2="226"/>
</g>
<circle cx="32" cy="34" r="11" fill="#b54237"/>
<circle cx="256" cy="34" r="11" fill="#4c65b6"/>
<circle cx="480" cy="34" r="11" fill="#c78300"/>
<circle cx="704" cy="34" r="11" fill="#087f73"/>
<g font-weight="700">
  <text x="32" y="38.5" text-anchor="middle" font-size="12.5" fill="#ffffff">1</text>
  <text x="50" y="39" font-size="15.5" fill="#17211f">累加式注意力</text>
  <text x="256" y="38.5" text-anchor="middle" font-size="12.5" fill="#ffffff">2</text>
  <text x="274" y="39" font-size="15.5" fill="#17211f">DeltaNet</text>
  <text x="480" y="38.5" text-anchor="middle" font-size="12.5" fill="#ffffff">3</text>
  <text x="498" y="39" font-size="15.5" fill="#17211f">Gated DeltaNet</text>
  <text x="704" y="38.5" text-anchor="middle" font-size="12.5" fill="#ffffff">4</text>
  <text x="722" y="39" font-size="15.5" fill="#17211f">KDA 通道门控</text>
</g>
<text x="22" y="62" font-size="12.5" fill="#8f3229">直接盲加外积 · 无遗忘门</text>
<text x="246" y="62" font-size="12.5" fill="#3a4f93">读预测误差 · 定向擦写键列</text>
<text x="470" y="62" font-size="12.5" fill="#936300">每头标量 αₜ · 整块同速冲淡</text>
<text x="694" y="62" font-size="12.5" fill="#065f56">对角 diag(αₜ) · 按列独立遗忘</text>
<g stroke-width="1.2">
  <rect x="22" y="84" width="78" height="28" rx="6" fill="#ddf4ef" stroke="#087f73"/>
  <rect x="106" y="84" width="98" height="28" rx="6" fill="#ece9df" stroke="#d8d8cf"/>
  <rect x="246" y="84" width="78" height="28" rx="6" fill="#ddf4ef" stroke="#087f73"/>
  <rect x="330" y="84" width="98" height="28" rx="6" fill="#fff4cf" stroke="#c78300"/>
  <rect x="470" y="84" width="88" height="28" rx="6" fill="#ddf4ef" stroke="#087f73"/>
  <rect x="564" y="84" width="88" height="28" rx="6" fill="#fff4cf" stroke="#c78300"/>
  <rect x="694" y="84" width="88" height="28" rx="6" fill="#ddf4ef" stroke="#087f73"/>
  <rect x="788" y="84" width="88" height="28" rx="6" fill="#f7e7f2" stroke="#9a4b86"/>
</g>
<g font-size="12.5" font-weight="600" text-anchor="middle">
  <text x="61" y="102.5" fill="#065f56">输入 kₜ, vₜ</text>
  <text x="155" y="102.5" fill="#66716d">无衰减门</text>
  <text x="285" y="102.5" fill="#065f56">输入 kₜ, vₜ</text>
  <text x="379" y="102.5" fill="#936300">写入门 βₜ</text>
  <text x="514" y="102.5" fill="#065f56">kₜ, vₜ, βₜ</text>
  <text x="608" y="102.5" fill="#936300">标量 αₜ</text>
  <text x="738" y="102.5" fill="#065f56">kₜ, vₜ, βₜ</text>
  <text x="832" y="102.5" fill="#7a3a6a">向量 α₁..₄</text>
</g>
<g font-size="12.5" font-weight="700" text-anchor="middle" fill="#17211f">
  <text x="113" y="138">状态 Sₜ（旧记忆无损堆叠）</text>
  <text x="337" y="138">状态 Sₜ（定向擦写当前键列）</text>
  <text x="561" y="138">衰减态 αₜSₜ₋₁（全列同变淡）</text>
  <text x="785" y="138">Sₜ₋₁diag(αₜ)（各列独立深浅）</text>
</g>
<g font-size="12" font-family="var(--font-mono)" font-weight="700" text-anchor="middle">
  <text x="113" y="161" fill="#b54237">无遗忘 · 反复叠加过载</text>
  <text x="337" y="161" fill="#3a4f93">旧列不变 · 修 k₂ 列</text>
  <text x="516" y="161" fill="#936300">×αₜ</text>
  <text x="549" y="161" fill="#936300">×αₜ</text>
  <text x="582" y="161" fill="#936300">×αₜ</text>
  <text x="615" y="161" fill="#936300">×αₜ</text>
  <text x="740" y="161" fill="#7a3a6a">.20</text>
  <text x="773" y="161" fill="#065f56">.90</text>
  <text x="806" y="161" fill="#7a3a6a">.30</text>
  <text x="839" y="161" fill="#3a4f93">.95</text>
</g>
<!-- Col 1 Matrix (Overloaded) -->
<g stroke-width="1.3">
  <rect x="54" y="170" width="28" height="84" rx="3" fill="#6c82cc" stroke="#4c65b6"/>
  <rect x="87" y="170" width="28" height="84" rx="3" fill="#f3b8ae" stroke="#b54237"/>
  <rect x="120" y="170" width="28" height="84" rx="3" fill="#6c82cc" stroke="#4c65b6"/>
  <rect x="153" y="170" width="28" height="84" rx="3" fill="#566ec0" stroke="#4c65b6"/>
  <!-- Col 2 Matrix (DeltaNet: untouched indigo cols + targeted teal k2 col) -->
  <rect x="278" y="170" width="28" height="84" rx="3" fill="#9fb0e8" stroke="#4c65b6"/>
  <rect x="311" y="170" width="28" height="84" rx="3" fill="#b8efe4" stroke="#087f73"/>
  <rect x="344" y="170" width="28" height="84" rx="3" fill="#9fb0e8" stroke="#4c65b6"/>
  <rect x="377" y="170" width="28" height="84" rx="3" fill="#9fb0e8" stroke="#4c65b6"/>
  <!-- Col 3 Matrix (GDN: all cols uniformly faded by scalar alpha_t + k2 update) -->
  <rect x="502" y="170" width="28" height="84" rx="3" fill="#e8edff" stroke="#8ea0df"/>
  <rect x="535" y="170" width="28" height="84" rx="3" fill="#ddf4ef" stroke="#087f73"/>
  <rect x="568" y="170" width="28" height="84" rx="3" fill="#e8edff" stroke="#8ea0df"/>
  <rect x="601" y="170" width="28" height="84" rx="3" fill="#e8edff" stroke="#8ea0df"/>
  <!-- Col 4 Matrix (KDA: independent per-key-channel column decay shades) -->
  <rect x="726" y="170" width="28" height="84" rx="3" fill="#f2f4fc" stroke="#b8c3ea"/>
  <rect x="759" y="170" width="28" height="84" rx="3" fill="#b8efe4" stroke="#087f73"/>
  <rect x="792" y="170" width="28" height="84" rx="3" fill="#dfe6fb" stroke="#9fb0e8"/>
  <rect x="825" y="170" width="28" height="84" rx="3" fill="#6c82cc" stroke="#3a4f93"/>
</g>
<!-- 4x4 Row Grid Dividers across all 16 columns -->
<g stroke="#fbfaf6" stroke-width="1.4">
  <path d="M54 191h127M54 212h127M54 233h127"/>
  <path d="M278 191h127M278 212h127M278 233h127"/>
  <path d="M502 191h127M502 212h127M502 233h127"/>
  <path d="M726 191h127M726 212h127M726 233h127"/>
