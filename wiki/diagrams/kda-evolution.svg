<g font-family="var(--font-mono)" font-size="13" font-weight="700" text-anchor="middle">
  <text x="329" y="587" fill="#66716d">+0</text><text x="329" y="627" fill="#66716d">+0</text>
  <text x="392" y="587" fill="#065f56">+1</text><text x="392" y="627" fill="#065f56">+2</text>
</g>

<!-- Right Sub-card: k = (0.6, 0.8) -->
<rect x="458" y="526" width="416" height="134" rx="8" fill="#ddf4ef" stroke="#087f73" stroke-width="1.3"/>
<text x="666" y="548" text-anchor="middle" font-size="13" font-weight="700" fill="#065f56">一般键向量：k = (0.6, 0.8)ᵀ（两列同按分量更新）</text>
<text x="472" y="576" font-family="var(--font-mono)" font-size="12.5" font-weight="700" fill="#17211f">ΔS = [1, 2]ᵀ · [0.6, 0.8]</text>
<text x="472" y="602" font-size="12" font-weight="700" fill="#065f56">• 第 1 列增量：(0.6, 1.2)ᵀ</text>
<text x="472" y="626" font-size="12" font-weight="700" fill="#065f56">• 第 2 列增量：(0.8, 1.6)ᵀ</text>
<text x="472" y="648" font-size="12" fill="#4d5652">一般单位键按 kⱼ 权重同步更新多列</text>
