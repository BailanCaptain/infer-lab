id: kda-evolution
caption: >-
  四种线性注意力矩阵递推机制对照（以单头状态 Sₜ ∈ ℝ^(dᵥ×dₖ) 为例）：① 累加式直接盲加键值外积 vₜkₜᵀ，无遗忘门且无预测回路，相似键反复写入易饱和串味；② DeltaNet 在写入前先读预测值 Sₜ₋₁kₜ 并按误差 vₜ − Sₜ₋₁kₜ 定向擦写当前键列；③ Gated DeltaNet 先乘每头单一标量 αₜ 将整张旧状态同比例冲淡；④ KDA 升级为通道级对角衰减 diag(αₜ)，对不同 key 特征列独立控制遗忘快慢。
