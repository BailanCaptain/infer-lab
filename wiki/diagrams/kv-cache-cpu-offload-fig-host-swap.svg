<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 490" width="900" height="490" role="img" aria-label="KV Cache CPU Offload 计算流与 D2H/H2D 异步双流时间线，以及私有锁页张量与共享 mmap 两种主机布局图" font-family="var(--font-sans)">
  <title>KV Cache CPU Offload 三流异步时间线与双 Spec 主机内存布局</title>
  <desc>上半区展示计算流、D2H 备份流与 H2D 搬回流之间的事件同步、后台重叠拷贝、源页复用前等待以及请求 B 在 WAITING_FOR_REMOTE_KVS 的至少一步等待；下半区左右对照 NPUOffloadingSpec 私有锁页张量（执行组共享 cpu_bytes_to_use）与 NPUTieringOffloadingSpec 共享 mmap 区域（连文件系统次级层与纯 MLA 去重条件）。</desc>
  <defs>
    <marker id="off-arr-t" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 1.5 L 8.5 5 L 0 8.5 z" fill="#087f73"/>
    </marker>
    <marker id="off-arr-p" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 1.5 L 8.5 5 L 0 8.5 z" fill="#9a4b86"/>
    </marker>
    <marker id="off-arr-b" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 1.5 L 8.5 5 L 0 8.5 z" fill="#4c65b6"/>
    </marker>
  </defs>

  <!-- Zone 1: 3-Stream Asynchronous Timeline -->
  <circle cx="26" cy="24" r="12" fill="#087f73"/>
  <text x="26" y="28.5" text-anchor="middle" font-size="13" font-weight="700" fill="#ffffff">1</text>
  <text x="46" y="30" font-size="16" font-weight="700" fill="#17211f">三流异步重叠时间线：存等计算流写完，取挂起请求至少等一步</text>

  <!-- Lane 1: Compute Stream -->
  <text x="16" y="76" font-size="14" font-weight="700" fill="#065f56">计算流</text>
  <rect x="116" y="54" width="164" height="34" rx="4" fill="#ddf4ef" stroke="#087f73" stroke-width="1.4"/>
  <text x="198" y="76" text-anchor="middle" font-size="13.5" font-weight="700" fill="#065f56">A 算满段 0 (Prompt)</text>

  <rect x="292" y="54" width="212" height="34" rx="4" fill="#ece9df" stroke="#8a928f" stroke-width="1.2"/>
  <text x="398" y="76" text-anchor="middle" font-size="13.5" fill="#4d5652">继续算其他请求（与拷贝重叠）</text>

  <rect x="516" y="54" width="176" height="34" rx="4" fill="#ece9df" stroke="#8a928f" stroke-width="1.2"/>
  <text x="604" y="76" text-anchor="middle" font-size="13.5" fill="#4d5652">算其他请求（B 挂起）</text>

  <rect x="704" y="54" width="180" height="34" rx="4" fill="#ddf4ef" stroke="#087f73" stroke-width="1.5"/>
  <text x="794" y="76" text-anchor="middle" font-size="13.5" font-weight="700" fill="#065f56">B 恢复前向（省重算）</text>

  <!-- Lane 2: D2H Backup Stream -->
  <text x="16" y="132" font-size="14" font-weight="700" fill="#7a3a6a">D2H 备份流</text>
  <rect x="284" y="110" width="196" height="34" rx="4" fill="#f7e7f2" stroke="#9a4b86" stroke-width="1.4"/>
  <text x="382" y="132" text-anchor="middle" font-size="13.5" font-weight="700" fill="#7a3a6a">拷段 0 到主机 DRAM</text>
  <text x="492" y="132" font-size="13" fill="#7a3a6a">完成信号 → 主机登记可用</text>

  <!-- Sync event arrow Compute -> D2H -->
  <path d="M 280 88 L 280 127 L 284 127" fill="none" stroke="#9a4b86" stroke-width="1.8" marker-end="url(#off-arr-p)"/>
  <text x="272" y="106" text-anchor="end" font-size="13" fill="#7a3a6a">等写完事件</text>

  <!-- Reuse barrier callout -->
  <line x1="480" y1="90" x2="480" y2="110" stroke="#b54237" stroke-width="1.6" stroke-dasharray="3 2"/>
  <text x="476" y="103" text-anchor="end" font-size="13" fill="#8f3229">源页覆写前必等此点</text>

  <!-- Lane 3: H2D Restore Stream -->
  <text x="16" y="188" font-size="14" font-weight="700" fill="#3a4f93">H2D 搬回流</text>
  <rect x="516" y="166" width="180" height="34" rx="4" fill="#e8edff" stroke="#4c65b6" stroke-width="1.5"/>
  <text x="606" y="188" text-anchor="middle" font-size="13.5" font-weight="700" fill="#3a4f93">段 0 搬回 B 的空页</text>
  <text x="116" y="188" font-size="13.5" fill="#66716d">A 显存页被回收后，新请求 B 命中主机哈希 → 分空页并挂起</text>

  <!-- Sync arrow H2D complete -> Compute B resumes -->
  <path d="M 696 183 L 724 183 L 724 92" fill="none" stroke="#4c65b6" stroke-width="1.8" marker-end="url(#off-arr-b)"/>
  <text x="734" y="150" font-size="13" font-weight="700" fill="#3a4f93">全组完成通知</text>
  <text x="734" y="170" font-size="13" fill="#4d5652">至少晚一步恢复</text>

  <text x="16" y="222" font-size="13.5" fill="#4d5652">注意：传输流与计算流共享显存与主机总线带宽；实测有效带宽高于持平门槛（每位置字节 × prefill 速率）搬回才省时</text>

  <!-- Divider -->
  <line x1="16" y1="240" x2="884" y2="240" stroke="#b8bcb5" stroke-width="1.4" stroke-dasharray="6 5"/>

  <!-- Zone 2: Two v0.30.0 Host Memory Layouts Side-by-Side -->
  <circle cx="26" cy="266" r="12" fill="#4c65b6"/>
  <text x="26" y="270.5" text-anchor="middle" font-size="13" font-weight="700" fill="#ffffff">2</text>
  <text x="46" y="272" font-size="16" font-weight="700" fill="#17211f">v0.30.0 / main 双 Spec 主机内存布局：私有锁页张量 vs 共享 mmap 区域</text>

  <!-- Left Architecture: CPU-only NPUOffloadingSpec -->
  <rect x="16" y="290" width="424" height="186" rx="8" fill="#ffffff" stroke="#4c65b6" stroke-width="1.4"/>
  <text x="30" y="315" font-size="14.5" font-weight="700" fill="#3a4f93">A. CPU-only · NPUOffloadingSpec（私有锁页）</text>

  <!-- Budget bracket spanning Worker 0 & Worker 1 -->
  <rect x="30" y="328" width="188" height="58" rx="5" fill="#e8edff" stroke="#4c65b6" stroke-width="1.3"/>
  <text x="124" y="352" text-anchor="middle" font-size="13.5" font-weight="700" fill="#3a4f93">Worker 0 私有锁页张量</text>
  <text x="124" y="374" text-anchor="middle" font-size="13" fill="#4d5652">独立按页字节视图搬运</text>

  <rect x="234" y="328" width="192" height="58" rx="5" fill="#e8edff" stroke="#4c65b6" stroke-width="1.3"/>
  <text x="330" y="352" text-anchor="middle" font-size="13.5" font-weight="700" fill="#3a4f93">Worker 1 私有锁页张量</text>
  <text x="330" y="374" text-anchor="middle" font-size="13" fill="#4d5652">（同执行组合计分摊）</text>

  <path d="M 32 392 L 32 400 L 424 400 L 424 392" fill="none" stroke="#4c65b6" stroke-width="1.4"/>
  <text x="228" y="420" text-anchor="middle" font-size="13.5" font-weight="700" fill="#3a4f93">cpu_bytes_to_use = 执行组总预算（PP×TP×PCP）</text>
  <text x="30" y="446" font-size="13" fill="#4d5652">多 DP 实例同机须叠加预算；blocks_per_chunk 与 block_size 互斥</text>
  <text x="30" y="466" font-size="13" fill="#66716d">满池按 LRU（默认）或 ARC 淘汰，不增大 HBM 缓存池</text>

  <!-- Right Architecture: Tiering NPUTieringOffloadingSpec -->
  <rect x="460" y="290" width="424" height="186" rx="8" fill="#ffffff" stroke="#c78300" stroke-width="1.4"/>
  <text x="474" y="315" font-size="14.5" font-weight="700" fill="#936300">B. 多层存储 · NPUTieringOffloadingSpec（共享 mmap）</text>

  <!-- Top row: Workers & Scheduler -->
  <rect x="474" y="328" width="122" height="34" rx="4" fill="#ddf4ef" stroke="#087f73" stroke-width="1.2"/>
  <text x="535" y="350" text-anchor="middle" font-size="13" font-weight="700" fill="#065f56">Workers</text>
  <rect x="606" y="328" width="122" height="34" rx="4" fill="#ddf4ef" stroke="#087f73" stroke-width="1.2"/>
  <text x="667" y="350" text-anchor="middle" font-size="13" font-weight="700" fill="#065f56">调度侧 Manager</text>
  <rect x="738" y="328" width="132" height="34" rx="4" fill="#f7e7f2" stroke="#9a4b86" stroke-width="1.2"/>
  <text x="804" y="350" text-anchor="middle" font-size="13" font-weight="700" fill="#7a3a6a">文件系统次级层</text>

  <!-- Shared mmap box underneath -->
  <rect x="474" y="376" width="396" height="44" rx="5" fill="#fff4cf" stroke="#c78300" stroke-width="1.5"/>
  <text x="672" y="396" text-anchor="middle" font-size="13.5" font-weight="700" fill="#936300">SharedOffloadRegion（多进程共享 mmap 主机区域）</text>
  <text x="672" y="414" text-anchor="middle" font-size="13" fill="#4d5652">纯 MLA（单组 + 同节点纯 TP）可多 rank 共享单份去重</text>

  <text x="474" y="446" font-size="13" fill="#8f3229">注意：mmap 带宽不等同锁页张量，且次级层淘汰尚在演进</text>
  <text x="474" y="466" font-size="13" fill="#4d5652">混合 5 组 GLM 不满足纯 MLA 单份去重条件；拒 store_threshold</text>
</svg>
