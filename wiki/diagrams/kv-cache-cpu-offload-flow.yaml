layout: figure
id: kv-cache-cpu-offload-flow
caption: 常规整段路径：第2站先排保存计划，第4站计算写完后设备到主机传输才能开始；全部参与worker完成后主机副本才可用。后来的请求在第2站查本地与主机，借好设备页并等待加载完成，再进入前向。容量不足、查找未定或依赖未就绪时继续等待。
size: [880, 350]
items:
  - { at: [24, 55], size: [180, 62], text: 第2站：筛选保存段, sub: 边界、策略与主机容量, tone: control }
  - { at: [242, 55], size: [180, 62], text: 第4站：计算写完, sub: 传输流等待计算完成, tone: token }
  - { at: [460, 55], size: [180, 62], text: 设备 → 主机, sub: 传输完成才报告成功, tone: comm }
  - { at: [678, 55], size: [178, 62], text: 主机副本可用, sub: 汇总参与worker结果, tone: kv }
  - { at: [24, 218], size: [180, 62], text: 第2站：另一请求查找, sub: 先本地，再问外部命中, tone: control }
  - { at: [242, 218], size: [180, 62], text: 借设备页并挂起, sub: 容量与状态满足条件, tone: kv }
  - { at: [460, 218], size: [180, 62], text: 主机 → 设备, sub: 请求等待完成通知, tone: comm }
  - { at: [678, 218], size: [178, 62], text: 恢复前向, sub: 从实际命中边界继续, tone: token }
