<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 260" width="900" height="260" role="img" aria-label="显存里的 KV 块被挤掉之前先拷一份到主机内存；同一段开头再来、显存里已经没了，就从主机内存拷回来，不用重算">
  <title>显存里的 KV 块被挤掉之前先拷一份到主机内存；同一段开头再来、显存里已经没了，就从主机内存拷回来，不用重算</title>
  <defs><marker id="kv-cache-cpu-offload-ah-kv" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="var(--color-kv, #4c65b6)"/></marker></defs>
  <rect x="30" y="60" width="300" height="170" rx="16" fill="none" stroke="var(--color-line-strong, #b8bcb5)" stroke-width="1.5"/>
  <text x="46" y="48" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="15" font-weight="700" fill="var(--color-ink, #17211f)">显存（一颗 NPU）</text>
  <rect x="570" y="60" width="300" height="170" rx="16" fill="none" stroke="var(--color-line-strong, #b8bcb5)" stroke-width="1.5"/>
  <text x="586" y="48" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="15" font-weight="700" fill="var(--color-ink, #17211f)">主机内存</text>
  <path d="M310 112 L590 112" fill="none" stroke="var(--color-kv, #4c65b6)" stroke-width="1.4" marker-end="url(#kv-cache-cpu-offload-ah-kv)"/>
  <path d="M590 134 L310 134" fill="none" stroke="var(--color-kv, #4c65b6)" stroke-width="1.4" stroke-dasharray="7 5" marker-end="url(#kv-cache-cpu-offload-ah-kv)"/>
  <rect x="55" y="100" width="44" height="44" rx="4" fill="var(--color-kv, #4c65b6)" stroke="var(--color-ink, #17211f)" stroke-width="1.2"/>
  <rect x="107" y="100" width="44" height="44" rx="4" fill="var(--color-kv, #4c65b6)" stroke="var(--color-ink, #17211f)" stroke-width="1.2"/>
  <rect x="159" y="100" width="44" height="44" rx="4" fill="var(--color-kv, #4c65b6)" stroke="var(--color-ink, #17211f)" stroke-width="1.2"/>
  <rect x="211" y="100" width="44" height="44" rx="4" fill="var(--color-kv, #4c65b6)" stroke="var(--color-ink, #17211f)" stroke-width="1.2"/>
  <rect x="263" y="100" width="44" height="44" rx="4" fill="var(--color-kv-soft, #e8edff)" stroke="var(--color-kv, #4c65b6)" stroke-opacity="0.35" stroke-width="1.2"/>
  <rect x="595" y="100" width="44" height="44" rx="4" fill="var(--color-kv, #4c65b6)" stroke="var(--color-ink, #17211f)" stroke-width="1.2"/>
  <rect x="647" y="100" width="44" height="44" rx="4" fill="var(--color-kv, #4c65b6)" stroke="var(--color-ink, #17211f)" stroke-width="1.2"/>
  <rect x="699" y="100" width="44" height="44" rx="4" fill="none" stroke="var(--color-kv, #4c65b6)" stroke-width="1.5" stroke-dasharray="3 3"/>
  <rect x="751" y="100" width="44" height="44" rx="4" fill="none" stroke="var(--color-kv, #4c65b6)" stroke-width="1.5" stroke-dasharray="3 3"/>
  <rect x="803" y="100" width="44" height="44" rx="4" fill="none" stroke="var(--color-kv, #4c65b6)" stroke-width="1.5" stroke-dasharray="3 3"/>
  <text x="450" y="102" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="13" font-weight="400" fill="var(--color-ink, #17211f)" text-anchor="middle">存：挤掉之前拷一份</text>
  <text x="450" y="160" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="13" font-weight="400" fill="var(--color-ink, #17211f)" text-anchor="middle">取：同样开头再来时拷回</text>
  <text x="55" y="205" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="12.5" font-weight="400" fill="var(--color-ink-muted, #66716d)" font-style="italic">一个 KV 块 = 2048 个 token，20 MiB</text>
  <text x="595" y="205" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="12.5" font-weight="400" fill="var(--color-ink-muted, #66716d)" font-style="italic">锁页内存，容量自己给</text>
  <rect x="247" y="160" width="76" height="24" rx="12" fill="var(--color-danger, #b54237)"/>
  <text x="285" y="177" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="13" font-weight="700" fill="var(--color-ink-inverse, #ffffff)" text-anchor="middle">要被挤掉</text>
</svg>
