<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 600" width="900" height="600" role="img" aria-label="搬什么、什么时候搬全是上游定的；昇腾只换掉 worker 侧那段搬运，单位是一格不是一个 token（v0.23 维护分支 = v0.26 分支）">
  <title>搬什么、什么时候搬全是上游定的；昇腾只换掉 worker 侧那段搬运，单位是一格不是一个 token（v0.23 维护分支 = v0.26 分支）</title>
  <rect width="900" height="600" fill="var(--color-surface, #fbfaf6)"/>
  <rect x="20" y="26" width="860" height="152" rx="12" fill="var(--color-surface-sunken, #ece9df)"/>
  <rect x="36" y="40" width="147.3" height="26.5" rx="13.3" fill="var(--color-control, #5b6763)"/><text x="47" y="58.1" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="13.5" font-weight="700" fill="var(--color-ink-inverse, #ffffff)">上游 vLLM 的调度侧</text>
  <text x="38" y="83" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="12.5" font-weight="400" fill="var(--color-ink-muted, #5b6763)">块池多大、哪几格该被淘汰、什么时候存什么时候取，全在上游调度侧决定；发布分支上昇腾连 OffloadingConnector 都没有重新注册</text>
  <rect x="20" y="208" width="860" height="350" rx="12" fill="var(--color-weight-soft, #fff4cf)"/>
  <rect x="36" y="222" width="272" height="26.5" rx="13.3" fill="var(--color-weight, #b87a00)"/><text x="47" y="240.1" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="13.5" font-weight="700" fill="var(--color-ink-inverse, #ffffff)">vllm-ascend 只换了 worker 侧这一段</text>
  <text x="38" y="265" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="12.5" font-weight="400" fill="var(--color-ink-muted, #5b6763)">配置里必须自己用 spec_module_path 把 NPUOffloadingSpec 指出来，连接器名仍写上游的 OffloadingConnector</text>
  <line x1="20" y1="192" x2="880" y2="192" stroke="var(--color-accent, #e85b32)" stroke-width="2.5" stroke-dasharray="7 5"/>
