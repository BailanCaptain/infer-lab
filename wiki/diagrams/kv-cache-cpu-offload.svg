  <text x="44" y="488" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="12.5" font-weight="400" fill="var(--color-ink-muted, #5b6763)">官方示例的 block_size 128 和 NPU 块一样大，所以一格就是一个 NPU 块、128 个 token、14 MiB；num_cpu_blocks 写 1000，锁住的就是 </text>
  <text x="44" y="506.5" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="12.5" font-weight="400" fill="var(--color-ink-muted, #5b6763)">13.67 GiB 页锁定主机内存。</text>
  <text x="44" y="524" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="12.5" font-weight="600" fill="var(--color-ink, #17211f)">这就是那条 37 token 的请求得不到回填的原因：队列里只有它一条，NPU 块池不淘汰，取那一侧永远不触发。</text>
  <text x="20" y="574" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="12.5" font-weight="400" fill="var(--color-ink-muted, #5b6763)">main 上这一路换了形状：连接器与两个 spec 都被昇腾就地替换，容量参数改成字节预算，另外多一路挂文件系统 tier 的多级卸载。</text>
</svg>
