notes:
  - at: [44, 512]
    text: 每个规范视图一块 256 KiB，28 层 × K/V 两张 = 56 个视图；所以一次 store 是 8 × 56 = 448 个拷贝描述符，合计 112 MiB。
    size: 12.5
    width: 812
  - at: [44, 536]
    text: 这就是那条 37 token 的请求碰不到它的原因：一个 chunk 都凑不满，永远没有东西可搬。
    size: 12.5
    width: 812
    strong: true
  - at: [20, 574]
    text: 这张图只画 CPU 单层这一路；多级卸载把 CPU 池换成共享 mmap，再挂一层文件系统 tier，搬运路径不变。
    size: 12.5
    width: 860

