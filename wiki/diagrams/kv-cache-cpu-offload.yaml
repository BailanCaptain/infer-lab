layout: scene
id: kv-cache-cpu-offload
caption: 搬什么、什么时候搬全是上游定的；昇腾只换掉 worker 侧的三处，搬运单位是一个 chunk 不是一个块
size: [900, 588]

regions:
  - label: 上游 vLLM 的调度侧
    note: 块池多大、哪几块该被淘汰、什么时候存、什么时候取，全在上游调度侧决定；vllm-ascend 没有另写一份
    at: [20, 26]
    size: [860, 152]
    tone: upstream
  - label: vllm-ascend 只换了 worker 侧这三处
    note: 配置里写的仍是上游的 CPUOffloadingSpec 和 TieringOffloadingSpec，注册表里它们已经被换成昇腾实现
    at: [20, 208]
    size: [860, 348]
    tone: ascend

boundaries:
  - at: 192
    from: 20
    to: 880
    vertical: false
    label: 作业过了这条线才变成真正的字节拷贝

