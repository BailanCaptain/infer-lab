layout: figure
id: kv-cache-cpu-offload
caption: KV cache CPU offload 在主机内存里多存一份：显存里 A 的页被让给 C 以后，主机那份还在；B 用到同一段开头时，先在显存分好空页，再把主机那份搬回来，不用重算
