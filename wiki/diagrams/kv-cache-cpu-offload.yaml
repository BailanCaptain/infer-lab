    label: 一格要发 56 个拷贝描述符：28 层 × K/V 两张，每个 256 KiB

arrows:
  - { from: [450, 180], to: [450, 206], tone: ascend }
  - { from: [304, 372], to: [326, 372], tone: ascend }
  - { from: [578, 372], to: [602, 372], tone: ascend }

notes:
  - at: [44, 488]
    text: 官方示例的 block_size 128 和 NPU 块一样大，所以一格就是一个 NPU 块、128 个 token、14 MiB；num_cpu_blocks 写 1000，锁住的就是 13.67 GiB 页锁定主机内存。
    size: 12.5
    width: 812
  - at: [44, 524]
    text: 这就是那条 37 token 的请求得不到回填的原因：队列里只有它一条，NPU 块池不淘汰，取那一侧永远不触发。
    size: 12.5
    width: 812
    strong: true
  - at: [20, 574]
    text: main 上这一路换了形状：连接器与两个 spec 都被昇腾就地替换，容量参数改成字节预算，另外多一路挂文件系统 tier 的多级卸载。
    size: 12.5
    width: 860

