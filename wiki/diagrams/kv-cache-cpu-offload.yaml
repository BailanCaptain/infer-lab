layout: scene
id: kv-cache-cpu-offload
caption: 搬什么、什么时候搬全是上游定的；昇腾只换掉 worker 侧那段搬运，单位是一格不是一个 token（v0.23 维护分支 = v0.26 分支）
size: [900, 600]

regions:
  - label: 上游 vLLM 的调度侧
    note: 块池多大、哪几格该被淘汰、什么时候存什么时候取，全在上游调度侧决定；发布分支上昇腾连 OffloadingConnector 都没有重新注册
    at: [20, 26]
    size: [860, 152]
    tone: upstream
  - label: vllm-ascend 只换了 worker 侧这一段
    note: 配置里必须自己用 spec_module_path 把 NPUOffloadingSpec 指出来，连接器名仍写上游的 OffloadingConnector
    at: [20, 208]
    size: [860, 350]
    tone: ascend

boundaries:
  - at: 192
    from: 20
    to: 880
    vertical: false
    label: 作业过了这条线才变成真正的字节拷贝

boxes:
  - at: [44, 106]
    size: [390, 58]
    title: 决定哪几格搬、搬去哪一格
    sub: 前缀哈希与 LRU 都在上游，昇腾没重写
    fn: CPUOffloadingManager
    icon: queue
    tone: upstream
  - at: [458, 106]
    size: [398, 58]
    title: 发下来的是一格的作业
    sub: 一格 = block_size_factor 个 NPU 块
    fn: transfer_async
    icon: split
    tone: upstream
  - at: [44, 268]
    size: [812, 50]
    title: spec 只做两件事：挑上游的 manager、换自己的 handler
    sub: num_cpu_blocks 必填，缺了直接抛异常
    fn: NPUOffloadingSpec
    icon: box
    tone: ascend
  - at: [44, 334]
    size: [260, 76]
    title: 每层开两张 CPU 张量
    sub: dtype 与形状照抄 NPU 侧
    fn: CpuNpuOffloadingHandler
    icon: layers
    tone: ascend
  - at: [328, 334]
    size: [248, 76]
    title: 每方向一条固定流
    sub: 同方向内部严格串行
    fn: d2h_stream
    icon: queue
    tone: ascend
  - at: [604, 334]
    size: [252, 76]
    title: 一次批量 DMA 下发
    sub: CANN 8.5+ 压成一次调用
    fn: swap_blocks_batch
    icon: bolt
    tone: ascend

strips:
