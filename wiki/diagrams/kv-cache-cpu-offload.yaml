    size: [390, 58]
    title: 决定哪几块搬、搬去哪一格
    sub: 前缀哈希与 LRU 都在上游，昇腾没重写
    fn: OffloadingConnector
    icon: queue
    tone: upstream
  - at: [458, 106]
