<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 424" width="900" height="424" role="img" aria-label="已生成文本长度与有效 KV cache 槽位数双行时间轴及三大错位反例图" font-family="var(--font-sans)">
  <title>已生成文本总长（all_token_ids）与有效 KV 缓存进度（num_computed_tokens）双行对照：普通逐词生成结束时（P=3, G=4）文本有 7 枚 token 而 KV 仅 6 格（末词 y₃ 已采样尚未作为输入）；下方列出分块预填充未完（差值远大于 1）、前缀缓存全命中（上限 N-1）与投机拒稿/抢占重算三大错位场景。</title>
  <desc>关联源码符号：num_computed_tokens, all_token_ids, get_computed_blocks, max_cache_hit_length, allocate_slots</desc>
  <defs>
    <marker id="kvc-red" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto">
      <path d="M 0 1.5 L 8.5 5 L 0 8.5 z" fill="#b54237"/>
    </marker>
  </defs>

  <!-- Zone A: 7 vs 6 dual-row timeline -->
  <text x="14" y="28" font-size="16" font-weight="700" fill="#17211f">一、普通逐词生成结束（P=3, G=4）：为何文本有 7 个词，KV cache 只有 6 格？</text>
  <line x1="14" y1="40" x2="886" y2="40" stroke="#b8bcb5" stroke-width="1.3"/>

  <!-- Row 1 label -->
  <text x="14" y="77" font-family="var(--font-mono)" font-size="14" font-weight="700" fill="#17211f">all_token_ids</text>
  <text x="14" y="97" font-size="13.5" fill="#66716d">完整文本（7 格）</text>

  <!-- 7 token cells: x = 152 + i*104, w=96, h=46 -->
  <rect x="152" y="56" width="96" height="46" rx="6" fill="#fff4cf" stroke="#c78300" stroke-width="1.3"/>
  <text x="200" y="77" text-anchor="middle" font-family="var(--font-mono)" font-size="14" font-weight="700" fill="#936300">p₀</text>
  <text x="200" y="96" text-anchor="middle" font-size="13" fill="#66716d">提示词 0</text>

  <rect x="256" y="56" width="96" height="46" rx="6" fill="#fff4cf" stroke="#c78300" stroke-width="1.3"/>
  <text x="304" y="77" text-anchor="middle" font-family="var(--font-mono)" font-size="14" font-weight="700" fill="#936300">p₁</text>
  <text x="304" y="96" text-anchor="middle" font-size="13" fill="#66716d">提示词 1</text>

  <rect x="360" y="56" width="96" height="46" rx="6" fill="#fff4cf" stroke="#c78300" stroke-width="1.3"/>
  <text x="408" y="77" text-anchor="middle" font-family="var(--font-mono)" font-size="14" font-weight="700" fill="#936300">p₂</text>
  <text x="408" y="96" text-anchor="middle" font-size="13" fill="#66716d">提示词 2</text>

  <rect x="464" y="56" width="96" height="46" rx="6" fill="#ddf4ef" stroke="#087f73" stroke-width="1.3"/>
  <text x="512" y="77" text-anchor="middle" font-family="var(--font-mono)" font-size="14" font-weight="700" fill="#065f56">y₀</text>
  <text x="512" y="96" text-anchor="middle" font-size="13" fill="#66716d">输出 1</text>

  <rect x="568" y="56" width="96" height="46" rx="6" fill="#ddf4ef" stroke="#087f73" stroke-width="1.3"/>
  <text x="616" y="77" text-anchor="middle" font-family="var(--font-mono)" font-size="14" font-weight="700" fill="#065f56">y₁</text>
  <text x="616" y="96" text-anchor="middle" font-size="13" fill="#66716d">输出 2</text>

  <rect x="672" y="56" width="96" height="46" rx="6" fill="#ddf4ef" stroke="#087f73" stroke-width="1.3"/>
  <text x="720" y="77" text-anchor="middle" font-family="var(--font-mono)" font-size="14" font-weight="700" fill="#065f56">y₂</text>
  <text x="720" y="96" text-anchor="middle" font-size="13" fill="#66716d">输出 3</text>

  <rect x="776" y="56" width="110" height="46" rx="6" fill="#fff0e9" stroke="#b54237" stroke-width="1.8"/>
  <text x="831" y="77" text-anchor="middle" font-family="var(--font-mono)" font-size="14" font-weight="700" fill="#8f3229">y₃（停）</text>
  <text x="831" y="96" text-anchor="middle" font-size="13" font-weight="700" fill="#b54237">输出 4 · 刚采样</text>

  <!-- Vertical pointer arrow at slot 6 -->
  <path d="M 831 102 L 831 124" fill="none" stroke="#b54237" stroke-width="2" marker-end="url(#kvc-red)"/>

  <!-- Row 2 label -->
  <text x="14" y="151" font-family="var(--font-mono)" font-size="13.5" font-weight="700" fill="#3a4f93">computed_tokens</text>
  <text x="14" y="171" font-size="13.5" fill="#66716d">有效 KV（6 格）</text>

  <!-- 6 filled KV slots + 1 empty dashed slot -->
  <rect x="152" y="130" width="96" height="46" rx="6" fill="#e8edff" stroke="#4c65b6" stroke-width="1.4"/>
  <text x="200" y="151" text-anchor="middle" font-family="var(--font-mono)" font-size="14" font-weight="700" fill="#3a4f93">kv₀</text>
  <text x="200" y="170" text-anchor="middle" font-size="13" fill="#4d5652">步 1 写入</text>

  <rect x="256" y="130" width="96" height="46" rx="6" fill="#e8edff" stroke="#4c65b6" stroke-width="1.4"/>
  <text x="304" y="151" text-anchor="middle" font-family="var(--font-mono)" font-size="14" font-weight="700" fill="#3a4f93">kv₁</text>
  <text x="304" y="170" text-anchor="middle" font-size="13" fill="#4d5652">步 1 写入</text>

  <rect x="360" y="130" width="96" height="46" rx="6" fill="#e8edff" stroke="#4c65b6" stroke-width="1.4"/>
  <text x="408" y="151" text-anchor="middle" font-family="var(--font-mono)" font-size="14" font-weight="700" fill="#3a4f93">kv₂</text>
  <text x="408" y="170" text-anchor="middle" font-size="13" fill="#4d5652">步 1 写入</text>

  <rect x="464" y="130" width="96" height="46" rx="6" fill="#e8edff" stroke="#4c65b6" stroke-width="1.4"/>
  <text x="512" y="151" text-anchor="middle" font-family="var(--font-mono)" font-size="14" font-weight="700" fill="#3a4f93">kv₃</text>
  <text x="512" y="170" text-anchor="middle" font-size="13" fill="#4d5652">步 2 写入</text>

  <rect x="568" y="130" width="96" height="46" rx="6" fill="#e8edff" stroke="#4c65b6" stroke-width="1.4"/>
  <text x="616" y="151" text-anchor="middle" font-family="var(--font-mono)" font-size="14" font-weight="700" fill="#3a4f93">kv₄</text>
  <text x="616" y="170" text-anchor="middle" font-size="13" fill="#4d5652">步 3 写入</text>

  <rect x="672" y="130" width="96" height="46" rx="6" fill="#e8edff" stroke="#4c65b6" stroke-width="1.4"/>
  <text x="720" y="151" text-anchor="middle" font-family="var(--font-mono)" font-size="14" font-weight="700" fill="#3a4f93">kv₅</text>
  <text x="720" y="170" text-anchor="middle" font-size="13" fill="#4d5652">步 4 写入</text>

  <rect x="776" y="130" width="110" height="46" rx="6" fill="#fff0e9" stroke="#b54237" stroke-width="1.5" stroke-dasharray="5 3"/>
  <text x="831" y="151" text-anchor="middle" font-size="13.5" font-weight="700" fill="#8f3229">无 KV 槽位</text>
  <text x="831" y="170" text-anchor="middle" font-size="13" fill="#b54237">未作为输入</text>

  <text x="152" y="200" font-size="13.5" fill="#4d5652">结论：末词 y₃ 在步 4 末采样即结束，不再进步 5 写缓存；同理 <tspan font-weight="700" fill="#17211f">P=4, G=200 → 文本 204 词、KV 仅 203 格</tspan>。</text>

  <!-- Zone B: 3 Counterexamples where gap != 1 -->
  <line x1="14" y1="216" x2="886" y2="216" stroke="#b8bcb5" stroke-width="1.4" stroke-dasharray="6 4"/>
  <text x="14" y="244" font-size="16" font-weight="700" fill="#17211f">二、别把「少 1 格」当成普适定律：三种差值不等于 1 的运行时刻</text>

  <!-- Card 1: Chunked Prefill incomplete -->
  <rect x="14" y="260" width="278" height="150" rx="8" fill="#ffffff" stroke="#b54237" stroke-width="1.4"/>
  <text x="28" y="286" font-size="14.5" font-weight="700" fill="#8f3229">① 分块预填充未完（差值 ≫ 1）</text>
  <!-- proportional progress bar -->
  <rect x="28" y="300" width="250" height="22" rx="4" fill="#ece9df" stroke="#b8bcb5" stroke-width="1.1"/>
  <rect x="28" y="300" width="85" height="22" rx="4" fill="#4c65b6"/>
  <text x="70" y="316" text-anchor="middle" font-family="var(--font-mono)" font-size="13" font-weight="700" fill="#ffffff">2046</text>
  <text x="195" y="316" text-anchor="middle" font-size="13" fill="#8f3229">3954 未进前向</text>
  <text x="28" y="346" font-size="13.5" fill="#17211f">6000 词长提示词刚算完第 1 块，</text>
  <text x="28" y="370" font-size="13.5" fill="#4d5652"><tspan font-family="var(--font-mono)" font-weight="700">num_computed_tokens</tspan> 停在块尾，</text>
  <text x="28" y="394" font-size="13.5" font-weight="700" fill="#8f3229">与总词数相差数千格！</text>

  <!-- Card 2: Prefix Caching hit cap -->
  <rect x="311" y="260" width="278" height="150" rx="8" fill="#ffffff" stroke="#087f73" stroke-width="1.4"/>
  <text x="325" y="286" font-size="14.5" font-weight="700" fill="#065f56">② 前缀缓存全命中（上限 N − 1）</text>
  <rect x="325" y="300" width="212" height="22" rx="4" fill="#ddf4ef" stroke="#087f73" stroke-width="1.2"/>
  <text x="431" y="316" text-anchor="middle" font-size="13" font-weight="700" fill="#065f56">复用旧满块（≤ N−1）</text>
  <rect x="541" y="300" width="34" height="22" rx="4" fill="#fff4cf" stroke="#c78300" stroke-width="1.2"/>
  <text x="558" y="316" text-anchor="middle" font-family="var(--font-mono)" font-size="13" font-weight="700" fill="#936300">末1</text>
  <text x="325" y="346" font-size="13.5" fill="#17211f">即便整段提示词全命中，</text>
  <text x="325" y="370" font-size="13.5" fill="#4d5652"><tspan font-family="var(--font-mono)">max_cache_hit_length</tspan> 仍限 N−1，</text>
  <text x="325" y="394" font-size="13.5" fill="#065f56">至少重算末词（或末块）以出 logits</text>

  <!-- Card 3: Speculative reject / Preemption -->
  <rect x="608" y="260" width="278" height="150" rx="8" fill="#ffffff" stroke="#9a4b86" stroke-width="1.4"/>
  <text x="622" y="286" font-size="14.5" font-weight="700" fill="#7a3a6a">③ 投机拒稿 / 抢占回退</text>
  <rect x="622" y="300" width="144" height="22" rx="4" fill="#e8edff" stroke="#4c65b6" stroke-width="1.2"/>
  <text x="694" y="316" text-anchor="middle" font-size="13" font-weight="700" fill="#3a4f93">已确认进度</text>
  <rect x="770" y="300" width="102" height="22" rx="4" fill="#f7e7f2" stroke="#9a4b86" stroke-width="1.2" stroke-dasharray="4 3"/>
  <text x="821" y="316" text-anchor="middle" font-size="13" font-weight="700" fill="#7a3a6a">拒稿作废</text>
  <text x="622" y="346" font-size="13.5" fill="#17211f">被拒草稿虽写过槽位但作废，</text>
  <text x="622" y="370" font-size="13.5" fill="#4d5652">回退计数下步原地覆写；</text>
  <text x="622" y="394" font-size="13.5" fill="#7a3a6a">被抢占释块后计数直接归 0 重算</text>
</svg>
