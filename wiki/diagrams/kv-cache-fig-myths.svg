<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 480" width="900" height="480" role="img" aria-label="KV cache 五大常见误解对比图" font-family="var(--font-sans)">
<title>KV cache 五大常见直觉误区与源码真相对照</title>
<text x="238" y="32" text-anchor="middle" font-size="16" font-weight="700" fill="#b54237">✗ 常见直觉误区</text>
<text x="656" y="32" text-anchor="middle" font-size="16" font-weight="700" fill="#087f73">✓ 源码与机制真相</text>
<line x1="16" y1="46" x2="884" y2="46" stroke="#b8bcb5" stroke-width="1.5" stroke-dasharray="6 4"/>
<line x1="442" y1="14" x2="442" y2="468" stroke="#b8bcb5" stroke-width="1.4" stroke-dasharray="6 4"/>
<circle cx="28" cy="92" r="12" fill="#b54237"/>
<text x="28" y="96.5" text-anchor="middle" font-size="12.5" font-weight="700" fill="#ffffff">1</text>
<rect x="48" y="60" width="380" height="64" rx="6" fill="#fff0e9" stroke="#d88c82" stroke-width="1.3"/>
<text x="62" y="86" font-size="14.5" font-weight="700" fill="#b54237">「KV cache 省显存，存的是词向量」</text>
<text x="62" y="110" font-size="13.5" fill="#4d5652">误把以空间换时间当省显存，混淆输入与层状态</text>
<rect x="456" y="60" width="398" height="64" rx="6" fill="#ddf4ef" stroke="#79aaa1" stroke-width="1.3"/>
<text x="470" y="86" font-size="14.5" font-weight="700" fill="#065f56">拿显存换计算；逐层存注意力历史状态</text>
<text x="470" y="110" font-size="13.5" fill="#4d5652">省旧词前向；标准存 K/V，MLA 潜向量，KDA 定长矩阵</text>
<circle cx="28" cy="174" r="12" fill="#b54237"/>
<text x="28" y="178.5" text-anchor="middle" font-size="12.5" font-weight="700" fill="#ffffff">2</text>
<rect x="48" y="142" width="380" height="64" rx="6" fill="#fff0e9" stroke="#d88c82" stroke-width="1.3"/>
<text x="62" y="168" font-size="14.5" font-weight="700" fill="#b54237">「文本有 N 个词，缓存就有 N 格」</text>
<text x="62" y="192" font-size="13.5" fill="#4d5652">以为刚采样出的最新词当场就写进了各层缓存</text>
<rect x="456" y="142" width="398" height="64" rx="6" fill="#ddf4ef" stroke="#79aaa1" stroke-width="1.3"/>
<text x="470" y="168" font-size="14.5" font-weight="700" fill="#065f56">最新采样词等下一步进前向才写缓存</text>
<text x="470" y="192" font-size="13.5" fill="#4d5652"><tspan font-family="var(--font-mono)" font-weight="700">num_computed_tokens</tspan> 比总词数少 1（草稿另计）</text>
<circle cx="28" cy="256" r="12" fill="#b54237"/>
<text x="28" y="260.5" text-anchor="middle" font-size="12.5" font-weight="700" fill="#ffffff">3</text>
<rect x="48" y="224" width="380" height="64" rx="6" fill="#fff0e9" stroke="#d88c82" stroke-width="1.3"/>
<text x="62" y="250" font-size="14.5" font-weight="700" fill="#b54237">「有了缓存，下一步就不用读旧内容」</text>
<text x="62" y="274" font-size="13.5" fill="#4d5652">误以为省掉重算就等于省掉了每步显存读取</text>
<rect x="456" y="224" width="398" height="64" rx="6" fill="#ddf4ef" stroke="#79aaa1" stroke-width="1.3"/>
<text x="470" y="250" font-size="14.5" font-weight="700" fill="#065f56">省重算不省读取；标准层每步通读历史</text>
<text x="470" y="274" font-size="13.5" fill="#4d5652">Decode 受带宽主导；稀疏靠 top-k、线性靠定长减读</text>
<circle cx="28" cy="338" r="12" fill="#b54237"/>
<text x="28" y="342.5" text-anchor="middle" font-size="12.5" font-weight="700" fill="#ffffff">4</text>
<rect x="48" y="306" width="380" height="64" rx="6" fill="#fff0e9" stroke="#d88c82" stroke-width="1.3"/>
<text x="62" y="332" font-size="14.5" font-weight="700" fill="#b54237">「模型越大或 TP 翻倍，每卡必增减」</text>
<text x="62" y="356" font-size="13.5" fill="#4d5652">按总参数量估缓存，忽略 KV 头数与跨卡复制</text>
<rect x="456" y="306" width="398" height="64" rx="6" fill="#ddf4ef" stroke="#79aaa1" stroke-width="1.3"/>
<text x="470" y="332" font-size="14.5" font-weight="700" fill="#065f56">容量看层数与 KV 头；头不够切则复制</text>
<text x="470" y="356" font-size="13.5" fill="#4d5652">30B 仅 96 KiB/tok 小于 8B；TP 超头数保底存 1 头</text>
<circle cx="28" cy="420" r="12" fill="#b54237"/>
<text x="28" y="424.5" text-anchor="middle" font-size="12.5" font-weight="700" fill="#ffffff">5</text>
<rect x="48" y="388" width="380" height="64" rx="6" fill="#fff0e9" stroke="#d88c82" stroke-width="1.3"/>
<text x="62" y="414" font-size="14.5" font-weight="700" fill="#b54237">「关掉前缀复用就没缓存，结束清零」</text>
<text x="62" y="438" font-size="13.5" fill="#4d5652">混淆同请求跨步缓存与跨请求共享，误认清零</text>
<rect x="456" y="388" width="398" height="64" rx="6" fill="#ddf4ef" stroke="#79aaa1" stroke-width="1.3"/>
<text x="470" y="414" font-size="14.5" font-weight="700" fill="#065f56">同请求缓存常驻；结束只还块引用不清零</text>
<text x="470" y="438" font-size="13.5" fill="#4d5652">前缀全命中也限 <tspan font-family="var(--font-mono)" font-weight="700">num_tokens - 1</tspan>，末词重算取概率</text>
</svg>
