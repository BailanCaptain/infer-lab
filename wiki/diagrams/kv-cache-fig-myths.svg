<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 508" width="900" height="508" role="img" aria-label="KV cache 五大常见误解对比图" font-family="var(--font-sans)">
  <title>KV cache 五大常见直觉误区与源码真相对照：区分以显存换计算、普通逐词结束少 1 格与分块未完多格差、省重算不省每步读取、层数与 KV 头及 TP 复制规则，以及同请求常驻缓存与跨请求前缀复用边界。</title>
  <desc>关联源码符号：get_computed_blocks, max_cache_hit_length, allocate_slots, num_computed_tokens, all_token_ids, reshape_and_cache, key_cache, value_cache, slot_mapping</desc>

  <text x="230" y="32" text-anchor="middle" font-size="16" font-weight="700" fill="#b54237">✗ 常见直觉误区</text>
  <text x="668" y="32" text-anchor="middle" font-size="16" font-weight="700" fill="#087f73">✓ 源码与机制真相</text>
  <line x1="16" y1="46" x2="884" y2="46" stroke="#b8bcb5" stroke-width="1.5" stroke-dasharray="6 4"/>
  <line x1="434" y1="14" x2="434" y2="496" stroke="#b8bcb5" stroke-width="1.4" stroke-dasharray="6 4"/>

  <!-- Row 1 -->
  <circle cx="28" cy="94" r="13" fill="#b54237"/>
  <text x="28" y="98.5" text-anchor="middle" font-size="13" font-weight="700" fill="#ffffff">1</text>
  <rect x="48" y="60" width="374" height="68" rx="6" fill="#fff0e9" stroke="#d88c82" stroke-width="1.3"/>
  <text x="62" y="87" font-size="14.5" font-weight="700" fill="#b54237">「KV cache 省显存，存的是词向量」</text>
  <text x="62" y="113" font-size="13.5" fill="#4d5652">把以空间换时间当省显存，混淆输入与层状态</text>

  <rect x="448" y="60" width="438" height="68" rx="6" fill="#ddf4ef" stroke="#79aaa1" stroke-width="1.3"/>
  <text x="462" y="87" font-size="14.5" font-weight="700" fill="#065f56">拿显存换计算：逐层存注意力历史状态</text>
  <text x="462" y="113" font-size="13.5" fill="#4d5652">省 O(t²) 重算；标准存 K/V，MLA 潜向量，KDA 定长矩阵</text>

  <!-- Row 2 (P1 FIX + mini slot grid visual!) -->
  <circle cx="28" cy="184" r="13" fill="#b54237"/>
  <text x="28" y="188.5" text-anchor="middle" font-size="13" font-weight="700" fill="#ffffff">2</text>
  <rect x="48" y="144" width="374" height="80" rx="6" fill="#fff0e9" stroke="#d88c82" stroke-width="1.3"/>
  <text x="62" y="172" font-size="14.5" font-weight="700" fill="#b54237">「文本有 N 个词，缓存就有 N 格」</text>
  <text x="62" y="198" font-size="13.5" fill="#4d5652">以为刚采样出的最新词当场已写进各层缓存</text>
  <text x="62" y="216" font-size="13" fill="#8f3229">或误以为已算进度永远只比总词数少 1</text>

  <rect x="448" y="144" width="438" height="80" rx="6" fill="#ddf4ef" stroke="#79aaa1" stroke-width="1.3"/>
  <text x="462" y="170" font-size="14.5" font-weight="700" fill="#065f56">普通逐词生成、末词刚采样时少 1 格</text>
  <!-- Mini visual grid cue: 5 indigo + 1 dashed red -->
  <rect x="462" y="180" width="22" height="14" rx="2" fill="#4c65b6"/>
  <rect x="487" y="180" width="22" height="14" rx="2" fill="#4c65b6"/>
  <rect x="512" y="180" width="22" height="14" rx="2" fill="#4c65b6"/>
  <rect x="537" y="180" width="22" height="14" rx="2" fill="#4c65b6"/>
  <rect x="562" y="180" width="22" height="14" rx="2" fill="#fff0e9" stroke="#b54237" stroke-width="1.2" stroke-dasharray="3 2"/>
  <text x="594" y="192" font-size="13" fill="#4d5652">末词待下步输入才写 KV</text>
  <text x="462" y="215" font-size="13.5" fill="#8f3229">分块 prefill 未完时 <tspan font-family="var(--font-mono)" font-weight="700">num_computed_tokens</tspan> 可差数千格</text>

  <!-- Row 3 -->
  <circle cx="28" cy="274" r="13" fill="#b54237"/>
  <text x="28" y="278.5" text-anchor="middle" font-size="13" font-weight="700" fill="#ffffff">3</text>
  <rect x="48" y="240" width="374" height="68" rx="6" fill="#fff0e9" stroke="#d88c82" stroke-width="1.3"/>
  <text x="62" y="267" font-size="14.5" font-weight="700" fill="#b54237">「有了缓存，下一步就不用读旧内容」</text>
  <text x="62" y="293" font-size="13.5" fill="#4d5652">误把省掉重算等同于省掉每步显存读取</text>

  <rect x="448" y="240" width="438" height="68" rx="6" fill="#ddf4ef" stroke="#79aaa1" stroke-width="1.3"/>
  <text x="462" y="267" font-size="14.5" font-weight="700" fill="#065f56">省重算不省读取：标准层每步通读历史</text>
  <text x="462" y="293" font-size="13.5" fill="#4d5652">Decode 受 HBM 带宽主导；稀疏靠 top-k、线性靠定长减读</text>

  <!-- Row 4 (with mini bar comparison!) -->
  <circle cx="28" cy="364" r="13" fill="#b54237"/>
  <text x="28" y="368.5" text-anchor="middle" font-size="13" font-weight="700" fill="#ffffff">4</text>
  <rect x="48" y="324" width="374" height="80" rx="6" fill="#fff0e9" stroke="#d88c82" stroke-width="1.3"/>
  <text x="62" y="352" font-size="14.5" font-weight="700" fill="#b54237">「模型越大或 TP 翻倍，每卡必增减」</text>
  <text x="62" y="378" font-size="13.5" fill="#4d5652">按总参数量估缓存，忽略 KV 头数与跨卡复制</text>
  <text x="62" y="396" font-size="13" fill="#66716d">误以为 30B 缓存一定比 8B 大</text>

  <rect x="448" y="324" width="438" height="80" rx="6" fill="#ddf4ef" stroke="#79aaa1" stroke-width="1.3"/>
  <text x="462" y="350" font-size="14.5" font-weight="700" fill="#065f56">容量看层数与 KV 头；TP 超头数则复制</text>
  <!-- Mini proportional bars: 8B 144 vs 30B 96 -->
  <rect x="462" y="360" width="90" height="12" rx="2" fill="#4c65b6"/>
  <text x="558" y="371" font-family="var(--font-mono)" font-size="13" fill="#3a4f93">8B: 144 KiB</text>
  <rect x="668" y="360" width="60" height="12" rx="2" fill="#087f73"/>
  <text x="734" y="371" font-family="var(--font-mono)" font-size="13" fill="#065f56">30B: 96 KiB</text>
  <text x="462" y="395" font-size="13.5" fill="#4d5652">TP &gt; n_kv 时每卡保底存 1 头；GLM 潜向量整份复制</text>

  <!-- Row 5 -->
  <circle cx="28" cy="456" r="13" fill="#b54237"/>
  <text x="28" y="460.5" text-anchor="middle" font-size="13" font-weight="700" fill="#ffffff">5</text>
  <rect x="48" y="420" width="374" height="72" rx="6" fill="#fff0e9" stroke="#d88c82" stroke-width="1.3"/>
  <text x="62" y="447" font-size="14.5" font-weight="700" fill="#b54237">「关掉前缀复用就没缓存，结束清零」</text>
  <text x="62" y="474" font-size="13.5" fill="#4d5652">混淆同请求跨步缓存与跨请求共享，误认清零</text>

  <rect x="448" y="420" width="438" height="72" rx="6" fill="#ddf4ef" stroke="#79aaa1" stroke-width="1.3"/>
  <text x="462" y="447" font-size="14.5" font-weight="700" fill="#065f56">同请求缓存常驻；结束只还引用不清零</text>
  <text x="462" y="474" font-size="13.5" fill="#4d5652">全命中仍限 <tspan font-family="var(--font-mono)" font-weight="700">num_tokens - 1</tspan>，至少重算末词取概率</text>
</svg>
