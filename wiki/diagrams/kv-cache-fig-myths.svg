<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 576" width="900" height="576" role="img" aria-label="KV cache 单 token 36 层累积比例图与五大常见误解对照" font-family="var(--font-sans)">
  <title>KV cache 五大常见直觉误区与源码真相对照：单 token 词向量与 36 层 K/V 缓存叠栈及排障判据。</title>
  <desc>上半部对比同一 token 的 1 份输入词向量与穿越 Qwen3-8B 36 层产生的 2×8×128×2 B = 4 KiB/层 → 144 KiB/token K/V 缓存栈；下半部汇总拿显存换计算、末词步差、每步通读历史与同请求常驻判据。</desc>
  <defs>
    <marker id="kvm-arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 1 1.5 L 8.5 5 L 1 8.5 z" fill="#4c65b6"/>
    </marker>
  </defs>

  <text x="16" y="28" font-size="16" font-weight="700" fill="#17211f">单 Token 落点与容量比例尺（Qwen3-8B：4 KiB/层 × 36 层 = 144 KiB）及排障判据</text>

  <!-- Hero Panel: Input Embedding vs 36-Layer K/V Stack -->
  <rect x="14" y="40" width="872" height="256" rx="10" fill="#fbfaf6" stroke="#d8d8cf" stroke-width="1.3"/>
  <text x="28" y="63" font-size="13.5" font-weight="700" fill="#17211f">同一 token 轨迹：入口仅 1 份临时词向量，穿越 36 层时每层经 reshape_and_cache 写入独立 K/V 历史槽</text>

  <!-- Left: Transient Input Vector -->
  <rect x="26" y="76" width="224" height="204" rx="8" fill="#ffffff" stroke="#c78300" stroke-width="1.3"/>
  <text x="138" y="99" text-anchor="middle" font-size="13.5" font-weight="700" fill="#936300">① 入口词向量（仅 1 份）</text>
  <rect x="44" y="112" width="188" height="36" rx="5" fill="#fff4cf" stroke="#c78300" stroke-width="1.2"/>
  <text x="138" y="135" text-anchor="middle" font-family="var(--font-mono)" font-size="12.5" font-weight="700" fill="#936300">x₀ [1 × 4096] = 8 KiB</text>
  <text x="138" y="172" text-anchor="middle" font-size="12.5" font-weight="700" fill="#8f3229">✗ 绝非 KV cache 存储内容</text>
  <text x="138" y="196" text-anchor="middle" font-size="12" fill="#4d5652">仅作第 0 层输入激活，层间残差</text>
  <text x="138" y="217" text-anchor="middle" font-size="12" fill="#4d5652">前向算完当步释放，不驻留缓存池</text>
  <text x="138" y="254" text-anchor="middle" font-family="var(--font-mono)" font-size="12" fill="#66716d">all_token_ids[t] → embed</text>

  <path d="M 252 150 L 284 150" fill="none" stroke="#4c65b6" stroke-width="2" marker-end="url(#kvm-arr)"/>

  <!-- Right: 36-Layer K/V Cache Stack + Proportional Scale -->
  <rect x="290" y="76" width="584" height="204" rx="8" fill="#ffffff" stroke="#4c65b6" stroke-width="1.4"/>
  <text x="306" y="99" font-size="13.5" font-weight="700" fill="#3a4f93">② 逐层常驻 K/V 缓存叠栈（slot_mapping 落槽 · 共 36 层累加）</text>

  <!-- Layer Stack Visual (Left half of right card: x=306..556) -->
  <rect x="306" y="112" width="246" height="34" rx="5" fill="#dce4fc" stroke="#4c65b6" stroke-width="1.3"/>
  <text x="429" y="133.5" text-anchor="middle" font-family="var(--font-mono)" font-size="12" font-weight="700" fill="#3a4f93">Layer 0: K(2KiB)+V(2KiB) = 4KiB</text>
  <rect x="306" y="152" width="246" height="30" rx="5" fill="#e8edff" stroke="#4c65b6" stroke-width="1.1"/>
  <text x="429" y="171.5" text-anchor="middle" font-family="var(--font-mono)" font-size="12" fill="#3a4f93">Layer 1: 2×8头×128维×2B = 4KiB</text>
  <rect x="306" y="188" width="246" height="26" rx="5" fill="#fbfaf6" stroke="#b8bcb5" stroke-width="1.1" stroke-dasharray="4 3"/>
  <text x="429" y="205.5" text-anchor="middle" font-size="12" fill="#66716d">⋮ 中间逐层写入 key_cache / value_cache ⋮</text>
  <rect x="306" y="220" width="246" height="34" rx="5" fill="#dce4fc" stroke="#4c65b6" stroke-width="1.3"/>
  <text x="429" y="241.5" text-anchor="middle" font-family="var(--font-mono)" font-size="12" font-weight="700" fill="#3a4f93">Layer 35: K(2KiB)+V(2KiB) = 4KiB</text>
  <text x="429" y="270" text-anchor="middle" font-size="12" fill="#4d5652">单层公式：<tspan font-family="var(--font-mono)" font-weight="600">2 × n_kv × d_head × 2B</tspan></text>

  <!-- Proportional Capacity Bars (Right half: x=572..860; bar height=16 < 22!) -->
  <text x="572" y="124" font-size="12.5" font-weight="700" fill="#17211f">单 token 显存比例尺（严格按字节等比）：</text>
  <rect x="572" y="136" width="16" height="16" rx="3" fill="#c78300"/>
  <text x="596" y="148.5" font-size="12" fill="#936300">词向量临时激活：8 KiB（不入池）</text>
  <rect x="572" y="168" width="192" height="16" rx="3" fill="#087f73"/>
  <text x="572" y="201" font-size="12" fill="#065f56">Qwen3-30B-A3B（48层×4KV）：<tspan font-family="var(--font-mono)" font-weight="700">96 KiB/tok</tspan></text>
  <rect x="572" y="214" width="288" height="16" rx="3" fill="#4c65b6"/>
  <text x="572" y="248" font-size="12.5" font-weight="700" fill="#3a4f93">Qwen3-8B（36层×8KV）：36 × 4 = 144 KiB/tok</text>
  <text x="572" y="270" font-size="12" fill="#66716d">总参数更大（30B vs 8B），单词 KV 反而小 1/3！</text>

  <!-- Lower 2x2 Verified Criteria Matrix -->
  <rect x="14" y="308" width="430" height="122" rx="9" fill="#ffffff" stroke="#087f73" stroke-width="1.3"/>
  <text x="28" y="333" font-size="13.5" font-weight="700" fill="#8f3229">✗ 误区 1：KV cache 是为了省显存，存的是词向量</text>
  <text x="28" y="358" font-size="13.5" font-weight="700" fill="#065f56">✓ 真相：拿显存换计算，省掉 O(t²) 历史重算</text>
  <text x="28" y="384" font-size="12.5" fill="#4d5652">多占 HBM 换每步只算新词；标准层存 K/V，MLA 存潜向量</text>
  <text x="28" y="409" font-size="12" fill="#66716d">KDA 线性层存定长状态矩阵（体积不随上下文长度增长）</text>

  <rect x="456" y="308" width="430" height="122" rx="9" fill="#ffffff" stroke="#b54237" stroke-width="1.3"/>
  <text x="470" y="333" font-size="13.5" font-weight="700" fill="#8f3229">✗ 误区 2：文本有 N 个词，缓存里就一定有 N 格</text>
  <text x="470" y="358" font-size="13.5" font-weight="700" fill="#065f56">✓ 真相：刚采出的末词差 1 格；分块未完可差数千格</text>
  <rect x="470" y="369" width="22" height="14" rx="2" fill="#4c65b6"/><rect x="496" y="369" width="22" height="14" rx="2" fill="#4c65b6"/>
  <rect x="522" y="369" width="22" height="14" rx="2" fill="#4c65b6"/><rect x="548" y="369" width="22" height="14" rx="2" fill="#4c65b6"/>
  <rect x="574" y="369" width="22" height="14" rx="2" fill="#fff0e9" stroke="#b54237" stroke-width="1.2" stroke-dasharray="3 2"/>
  <text x="604" y="381" font-size="12" fill="#4d5652">末词待下步进前向才写 KV</text>
  <text x="470" y="409" font-size="12" fill="#8f3229">分块 prefill 中途 <tspan font-family="var(--font-mono)" font-weight="700">num_computed_tokens</tspan> 远小于总词数</text>

  <rect x="14" y="442" width="430" height="122" rx="9" fill="#ffffff" stroke="#4c65b6" stroke-width="1.3"/>
  <text x="28" y="467" font-size="13.5" font-weight="700" fill="#8f3229">✗ 误区 3：有缓存就不用再读旧历史；TP 翻倍必减半</text>
  <text x="28" y="492" font-size="13.5" font-weight="700" fill="#3a4f93">✓ 真相：省重算不省读取；TP &gt; n_kv 时跨卡复制</text>
  <text x="28" y="518" font-size="12.5" fill="#4d5652">标准 Decode 每步通读历史 K/V 受带宽主导（稀疏靠 top-k 减读）</text>
  <text x="28" y="543" font-size="12" fill="#66716d">TP 超 KV 头数保底存 1 头；GLM 的 MLA 潜向量逐卡整份复制</text>

  <rect x="456" y="442" width="430" height="122" rx="9" fill="#ffffff" stroke="#9a4b86" stroke-width="1.3"/>
  <text x="470" y="467" font-size="13.5" font-weight="700" fill="#8f3229">✗ 误区 4：关掉前缀复用就没缓存，请求结束清零 HBM</text>
  <text x="470" y="492" font-size="13.5" font-weight="700" fill="#7a3a6a">✓ 真相：同请求缓存常驻；结束只还引用不清零</text>
  <text x="470" y="518" font-size="12.5" fill="#4d5652"><tspan font-family="var(--font-mono)" font-size="12">allocate_slots</tspan> 常驻工作；跨请求共享才看 <tspan font-family="var(--font-mono)" font-size="12">get_computed_blocks</tspan></text>
  <text x="470" y="543" font-size="12" fill="#66716d">即使前缀全命中，上限仍锁在 <tspan font-family="var(--font-mono)" font-weight="600">max_cache_hit_length = N - 1</tspan></text>
</svg>
