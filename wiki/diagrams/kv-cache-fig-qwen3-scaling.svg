<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 496" width="900" height="496" role="img" aria-label="Qwen3 KV cache 扩展图" font-family="var(--font-sans)">
<title>Qwen3-8B 与 Qwen3-30B-A3B KV cache 扩展阶梯</title>
<line x1="448" y1="14" x2="448" y2="188" stroke="#b8bcb5" stroke-dasharray="6 4"/>
<line x1="16" y1="200" x2="884" y2="200" stroke="#b8bcb5" stroke-dasharray="6 4"/>
<text x="18" y="34" font-size="16" font-weight="700" fill="#17211f">Qwen3-8B · 稠密 GQA（36 层 · 8 KV 头）</text>
<text x="18" y="58" font-size="13.5" fill="#4d5652">单层：<tspan font-family="var(--font-mono)" fill="#3a4f93">2 × 8 × 128 × 2B = 4 KiB</tspan></text>
<rect x="18" y="70" width="360" height="36" rx="5" fill="#4c65b6"/>
<text x="198" y="93" text-anchor="middle" font-size="15" font-weight="700" fill="#ffffff">144 KiB / token（4 KiB × 36 层）</text>
<rect x="18" y="116" width="180" height="28" rx="5" fill="#fff4cf" stroke="#c78300"/>
<text x="108" y="135" text-anchor="middle" font-size="13.5" font-weight="700" fill="#936300">C8 0.5× = 72 KiB</text>
<text x="208" y="135" font-size="13.5" fill="#4d5652">INT8 / MXFP8（1 B/数）</text>
<text x="18" y="170" font-size="13.5" fill="#66716d">对比 MHA 32 头：GQA 4:1 已省 3/4</text>
<text x="466" y="34" font-size="16" font-weight="700" fill="#065f56">Qwen3-30B-A3B · MoE（48 层 · 4 KV 头）</text>
<text x="466" y="58" font-size="13.5" fill="#4d5652">单层：<tspan font-family="var(--font-mono)" fill="#065f56">2 × 4 × 128 × 2B = 2 KiB</tspan></text>
<rect x="466" y="70" width="360" height="36" rx="5" fill="#ece9df"/>
<rect x="466" y="70" width="240" height="36" rx="5" fill="#087f73"/>
<text x="586" y="93" text-anchor="middle" font-size="15" font-weight="700" fill="#ffffff">96 KiB / token（48 层）</text>
<text x="718" y="93" font-size="14" font-weight="700" fill="#087f73">省 1/3！</text>
<rect x="466" y="116" width="120" height="28" rx="5" fill="#ddf4ef" stroke="#087f73"/>
<text x="526" y="135" text-anchor="middle" font-size="13.5" font-weight="700" fill="#065f56">C8 48 KiB</text>
<text x="598" y="135" font-size="13.5" fill="#4d5652">TP4 每卡 24 KiB（C8 12 KiB）</text>
<text x="466" y="170" font-size="13.5" fill="#66716d">128 专家只占权重，不占 KV 缓存</text>
<text x="18" y="230" font-size="16" font-weight="700" fill="#17211f">扩展阶梯：1 token → 4K → 32K → B=32 批次 + C8 减半</text>
<circle cx="30" cy="268" r="12" fill="#4c65b6"/>
<text x="30" y="272.5" text-anchor="middle" font-size="12.5" font-weight="700" fill="#ffffff">1</text>
<text x="50" y="273" font-size="14.5" font-weight="700" fill="#17211f">单序列 4K（BF16）</text>
<rect x="248" y="250" width="174" height="34" rx="5" fill="#e8edff" stroke="#4c65b6"/>
<text x="335" y="272" text-anchor="middle" font-size="14" font-weight="700" fill="#3a4f93">8B：576 MiB</text>
<rect x="436" y="250" width="174" height="34" rx="5" fill="#ddf4ef" stroke="#087f73"/>
<text x="523" y="272" text-anchor="middle" font-size="14" font-weight="700" fill="#065f56">30B：384 MiB</text>
<text x="624" y="272" font-size="13.5" fill="#4d5652">单条短请求 &lt; 0.6 GiB</text>
<circle cx="30" cy="322" r="12" fill="#4c65b6"/>
<text x="30" y="326.5" text-anchor="middle" font-size="12.5" font-weight="700" fill="#ffffff">2</text>
<text x="50" y="327" font-size="14.5" font-weight="700" fill="#17211f">单序列 32K（BF16）</text>
<rect x="248" y="304" width="174" height="34" rx="5" fill="#e8edff" stroke="#4c65b6"/>
<text x="335" y="326" text-anchor="middle" font-size="14" font-weight="700" fill="#3a4f93">8B：4.5 GiB / 条</text>
<rect x="436" y="304" width="174" height="34" rx="5" fill="#ddf4ef" stroke="#087f73"/>
<text x="523" y="326" text-anchor="middle" font-size="14" font-weight="700" fill="#065f56">30B：3.0 GiB / 条</text>
<text x="624" y="326" font-size="13.5" fill="#4d5652">长度 ×8 容量 ×8（TP4 0.75 GiB/卡）</text>
<circle cx="30" cy="384" r="12" fill="#b54237"/>
<text x="30" y="388.5" text-anchor="middle" font-size="12.5" font-weight="700" fill="#ffffff">3</text>
<text x="50" y="389" font-size="14.5" font-weight="700" fill="#b54237">B=32 × 32K（BF16）</text>
<rect x="248" y="358" width="384" height="26" rx="5" fill="#b54237"/>
<text x="440" y="376" text-anchor="middle" font-size="14" font-weight="700" fill="#ffffff">Qwen3-8B：144 GiB</text>
<text x="644" y="376" font-size="13.5" font-weight="700" fill="#b54237">超 64 GiB 单卡 2.25×！</text>
<rect x="248" y="390" width="256" height="24" rx="5" fill="#4c65b6"/>
<text x="376" y="407" text-anchor="middle" font-size="13.5" font-weight="700" fill="#ffffff">30B 整模：96 GiB</text>
<text x="516" y="407" font-size="13.5" fill="#3a4f93">TP4 每卡分摊 24 GiB</text>
<circle cx="30" cy="454" r="12" fill="#087f73"/>
<text x="30" y="458.5" text-anchor="middle" font-size="12.5" font-weight="700" fill="#ffffff">4</text>
<text x="50" y="459" font-size="14.5" font-weight="700" fill="#065f56">B=32 开 C8（0.5×）</text>
<rect x="248" y="428" width="192" height="26" rx="5" fill="#c78300"/>
<text x="344" y="446" text-anchor="middle" font-size="14" font-weight="700" fill="#ffffff">8B C8：72 GiB</text>
<text x="452" y="446" font-size="13.5" font-weight="700" fill="#936300">INT8 / MXFP8 主体省 72 GiB</text>
<rect x="248" y="460" width="128" height="24" rx="5" fill="#087f73"/>
<text x="312" y="477" text-anchor="middle" font-size="13.5" font-weight="700" fill="#ffffff">30B：48 GiB</text>
<text x="388" y="477" font-size="13.5" fill="#065f56">TP4 每卡 12 GiB（MXFP8 另带微量缩放）</text>
</svg>
