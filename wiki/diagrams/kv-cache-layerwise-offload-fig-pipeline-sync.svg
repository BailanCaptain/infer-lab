<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 446" width="900" height="446" role="img" aria-label="Layerwise KV offload 逐层流水线与共享槽双栅栏" font-family="var(--font-sans)">
<title>Layerwise KV offload 逐层流水线与共享槽双栅栏</title>
<desc>Multi-stream layerwise H2D prefetch gate, compute overlap, async D2H save event, and dual completion barriers for shared-slot reuse across AscendStore and RD2H/P2P</desc>
<line x1="16" y1="268" x2="884" y2="268" stroke="#d8d8cf" stroke-width="1.5" stroke-dasharray="6 4"/>
<g stroke-width="1.4">
<rect x="16" y="54" width="154" height="52" rx="6" fill="#ece9df" stroke="#b8bcb5"/>
<rect x="16" y="122" width="154" height="52" rx="6" fill="#ece9df" stroke="#b8bcb5"/>
