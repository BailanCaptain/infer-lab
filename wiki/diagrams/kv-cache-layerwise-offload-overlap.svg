<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 470" width="900" height="470" role="img" aria-label="一个 4 层的模型跑一次前向（示意：每层搬入 2 ms、计算 3 ms、存出 2 ms）。上：整趟搬，计算等 16 ms，共 28 ms。下：提前加载开启、双向传输可并行且无争用的理想逐层排法，计算只在头尾各等 2 ms，共 16 ms。两条时间轴搬的字节一样多；实际加载慢或未提前发起时，每层也会等待。">
