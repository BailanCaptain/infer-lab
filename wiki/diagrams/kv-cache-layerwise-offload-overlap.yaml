layout: figure
id: kv-cache-layerwise-offload-overlap
caption: 一个 4 层的模型跑一次前向（示意：每层搬入 2 ms、计算 3 ms、存出 2 ms）。上：整趟搬，计算等 16 ms，共 28 ms。下：提前加载开启、双向传输可并行且无争用的理想逐层排法，计算只在头尾各等 2 ms，共 16 ms。两条时间轴搬的字节一样多；实际加载慢或未提前发起时，每层也会等待。
size: [900, 470]
texts:
  - { at: [20, 28], text: 4 层模型一次前向（示意数）, strong: true, size: 15 }
  - { at: [880, 28], text: 每层：搬入 2 ms · 计算 3 ms · 存出 2 ms, anchor: end, note: true }
  - { at: [20, 66], text: 整趟搬：先搬完四层，再算，再存, strong: true }
  - { at: [20, 272], text: 逐层搬：算第 L 层时，搬入 L+1、存出 L−1, strong: true }
  - { at: [800, 66], text: 计算在等 16 / 28 ms, anchor: end, tone: danger, strong: true }
  - { at: [880, 272], text: 计算在等 4 / 16 ms, anchor: end, tone: token, strong: true }
