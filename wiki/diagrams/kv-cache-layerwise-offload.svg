<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 370" width="900" height="370" role="img" aria-label="8 个缓存规格相同的层，每层的缓存占 P 字节（示意）。L0 独占一个槽；其余 7 层轮流用两个共享槽：S0 依次给 L1、L3、L5、L7，S1 依次给 L2、L4、L6。显存里的缓存主体从各层独占的 8P 降到 3P。代价是一个槽换给下一位之前，上一位必须已经存出完，所以 L3 的搬入要等 L1 存完。">
  <title>8 个缓存规格相同的层，每层的缓存占 P 字节（示意）。L0 独占一个槽；其余 7 层轮流用两个共享槽：S0 依次给 L1、L3、L5、L7，S1 依次给 L2、L4、L6。显存里的缓存主体从各层独占的 8P 降到 3P。代价是一个槽换给下一位之前，上一位必须已经存出完，所以 L3 的搬入要等 L1 存完。</title>
  <defs><marker id="kv-cache-layerwise-offload-ah-control" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="var(--color-control, #66716d)"/></marker></defs>
