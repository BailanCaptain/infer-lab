  <rect x="190" y="65" width="120" height="50" fill="var(--color-kv-soft, #e8edff)"/>
  <text x="250" y="94.7" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="13" font-weight="700" fill="var(--color-ink, #17211f)" text-anchor="middle">L0</text>
  <rect x="190" y="65" width="120" height="50" fill="none" stroke="var(--color-kv, #4c65b6)" stroke-width="1.4"/>
  <rect x="190" y="155" width="120" height="50" rx="4" fill="var(--color-surface, #fbfaf6)" stroke="var(--color-kv, #4c65b6)" stroke-opacity="0.45" stroke-width="1.3" stroke-dasharray="4 3"/>
  <text x="250" y="184.7" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="13" font-weight="700" fill="#3a4f93" text-anchor="middle">L1</text>
