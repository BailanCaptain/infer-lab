<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 805" width="880" height="805" role="img" aria-label="A2 管分配，Worker 在 A4 读写设备状态，A6 按接受结果更新进度。MLA 与 KDA 是逐层选择；继续请求回到下一步调度">
  <title>A2 管分配，Worker 在 A4 读写设备状态，A6 按接受结果更新进度。MLA 与 KDA 是逐层选择；继续请求回到下一步调度</title>
