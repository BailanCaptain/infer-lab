id: kv-cache-lifecycle
caption: >-
  混合模型中一个逻辑块 #b 与 KDA 状态页（p₀..p₃）的生命周期闭环：A2 由 EngineCore 在 CPU 分配整数块号；A3/A4 在 Worker 将 #b 展开为 5 个 128 核块写入 MLA 潜向量，或原地更新 KDA 候选页；A6 验稿回退时 MLA 仅回退 num_computed_tokens 下步覆写、KDA 选定对应接受页续算；A7 结束仅归还块引用，不清零 HBM。
