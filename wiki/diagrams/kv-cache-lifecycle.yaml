  - { at: [150, 599], size: [580, 62], text: A6 · 更新请求与已计算进度, sub: 按拒绝数量回退计数, style: plain }
  - { at: [70, 712], size: [335, 48], text: 继续：返回 A2，用有效历史接着算, tone: kv }
  - { at: [475, 712], size: [335, 48], text: 结束：A7 归还请求的块引用, tone: kv }
