  <circle cx="24" cy="140" r="11" fill="var(--color-comm, #9a4b86)"/><text x="24" y="145" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="13" font-weight="700" fill="var(--color-ink-inverse, #ffffff)" text-anchor="middle">2</text>
  <circle cx="24" cy="220" r="11" fill="var(--color-weight, #c78300)"/><text x="24" y="225" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="13" font-weight="700" fill="var(--color-ink-inverse, #ffffff)" text-anchor="middle">3</text>
  <circle cx="330" cy="300" r="11" fill="var(--color-token, #087f73)"/><text x="330" y="305" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="13" font-weight="700" fill="var(--color-ink-inverse, #ffffff)" text-anchor="middle">4</text>
  <circle cx="330" cy="400" r="11" fill="var(--color-kv, #4c65b6)"/><text x="330" y="405" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="13" font-weight="700" fill="var(--color-ink-inverse, #ffffff)" text-anchor="middle">5</text>
  <circle cx="640" cy="140" r="11" fill="var(--color-kv, #4c65b6)"/><text x="640" y="145" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="13" font-weight="700" fill="var(--color-ink-inverse, #ffffff)" text-anchor="middle">6</text>
  <circle cx="640" cy="220" r="11" fill="var(--color-kv, #4c65b6)"/><text x="640" y="225" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="13" font-weight="700" fill="var(--color-ink-inverse, #ffffff)" text-anchor="middle">7</text>
  <circle cx="640" cy="300" r="11" fill="var(--color-control, #66716d)"/><text x="640" y="305" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="13" font-weight="700" fill="var(--color-ink-inverse, #ffffff)" text-anchor="middle">8</text>
  <circle cx="640" cy="400" r="11" fill="var(--color-control, #66716d)"/><text x="640" y="405" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="13" font-weight="700" fill="var(--color-ink-inverse, #ffffff)" text-anchor="middle">9</text>
