<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 470" width="900" height="470" role="img" aria-label="一张卡的显存怎样一层层扣出 KV cache 的份额：先按总显存 × 显存比例定预算，再扣装权重时量到的占用、profile run 量到的激活峰值、用快照差量出的非 torch 增量（HCCL 缓冲属于这一项），余下的按每块字节数切成 KV 块。decode 图和后来才创建的缓冲在切完 KV 之后才出现，从预算外那一段支付。各段长短只示意先后与归属，不是实测比例。">
  <title>一张卡的显存怎样一层层扣出 KV cache 的份额：先按总显存 × 显存比例定预算，再扣装权重时量到的占用、profile run 量到的激活峰值、用快照差量出的非 torch 增量（HCCL 缓冲属于这一项），余下的按每块字节数切成 KV 块。decode 图和后来才创建的缓冲在切完 KV 之后才出现，从预算外那一段支付。各段长短只示意先后与归属，不是实测比例。</title>
  <defs><marker id="kv-cache-memory-profiling-ah-control" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="var(--color-control, #66716d)"/></marker><marker id="kv-cache-memory-profiling-ah-kv" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="var(--color-kv, #4c65b6)"/></marker><pattern id="kv-cache-memory-profiling-hatch" width="7" height="7" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="7" height="7" fill="var(--color-surface-sunken, #ece9df)"/><line x1="0" y1="0" x2="0" y2="7" stroke="var(--color-ink-muted, #66716d)" stroke-width="2"/></pattern></defs>
  <path d="M26 96 L26 150" fill="none" stroke="var(--color-control, #66716d)" stroke-width="1.4" marker-end="url(#kv-cache-memory-profiling-ah-control)"/>
  <path d="M26 176 L26 230" fill="none" stroke="var(--color-control, #66716d)" stroke-width="1.4" marker-end="url(#kv-cache-memory-profiling-ah-control)"/>
  <path d="M26 256 L26 310" fill="none" stroke="var(--color-control, #66716d)" stroke-width="1.4" marker-end="url(#kv-cache-memory-profiling-ah-control)"/>
  <path d="M597 346 L597 400" fill="none" stroke="var(--color-kv, #4c65b6)" stroke-width="1.4" marker-end="url(#kv-cache-memory-profiling-ah-kv)"/>
  <rect x="164" y="66" width="598.4" height="34" rx="4" fill="var(--color-control, #66716d)" stroke="var(--color-ink, #17211f)" stroke-width="1.3"/>
  <text x="180" y="88" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="13" font-weight="700" fill="var(--color-ink-inverse, #ffffff)">预算 = 总显存 × 显存比例</text>
  <rect x="762.4" y="66" width="105.6" height="34" rx="4" fill="url(#kv-cache-memory-profiling-hatch)" stroke="var(--color-ink-muted, #66716d)" stroke-width="1.3"/>
  <text x="778.4" y="88" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="13" font-weight="700" fill="var(--color-ink, #17211f)">预算外</text>
  <rect x="164" y="60" width="704" height="46" rx="7" fill="none" stroke="var(--color-ink, #17211f)" stroke-width="2.2"/>
  <text x="868" y="50" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="13" font-weight="700" fill="var(--color-ink, #17211f)" text-anchor="end">一张卡的总显存</text>
  <rect x="164" y="146" width="231" height="34" rx="4" fill="var(--color-weight, #c78300)" stroke="var(--color-ink, #17211f)" stroke-width="1.3"/>
  <text x="180" y="168" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="13" font-weight="700" fill="var(--color-ink-inverse, #ffffff)">权重</text>
  <rect x="164" y="140" width="598.4" height="46" rx="7" fill="none" stroke="var(--color-kv, #4c65b6)" stroke-width="2.2"/>
  <rect x="164" y="226" width="231" height="34" rx="4" fill="var(--color-weight, #c78300)" stroke="var(--color-ink, #17211f)" stroke-width="1.3"/>
  <text x="180" y="248" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="13" font-weight="700" fill="var(--color-ink-inverse, #ffffff)">权重</text>
  <rect x="395" y="226" width="22" height="34" rx="4" fill="var(--color-token, #087f73)" stroke="var(--color-ink, #17211f)" stroke-width="1.3"/>
  <rect x="164" y="220" width="598.4" height="46" rx="7" fill="none" stroke="var(--color-kv, #4c65b6)" stroke-width="2.2"/>
  <rect x="164" y="306" width="231" height="34" rx="4" fill="var(--color-weight, #c78300)" stroke="var(--color-ink, #17211f)" stroke-width="1.3"/>
  <text x="180" y="328" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="13" font-weight="700" fill="var(--color-ink-inverse, #ffffff)">权重</text>
  <rect x="395" y="306" width="22" height="34" rx="4" fill="var(--color-token, #087f73)" stroke="var(--color-ink, #17211f)" stroke-width="1.3"/>
  <rect x="417" y="306" width="15.4" height="34" rx="4" fill="var(--color-comm, #9a4b86)" stroke="var(--color-ink, #17211f)" stroke-width="1.3"/>
  <rect x="432.4" y="306" width="330" height="34" rx="4" fill="var(--color-kv, #4c65b6)" stroke="var(--color-ink, #17211f)" stroke-width="1.3"/>
  <text x="448.4" y="328" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="13" font-weight="700" fill="var(--color-ink-inverse, #ffffff)">KV cache 的份额</text>
  <rect x="762.4" y="306" width="105.6" height="34" rx="4" fill="url(#kv-cache-memory-profiling-hatch)" stroke="var(--color-ink-muted, #66716d)" stroke-width="1.3"/>
  <rect x="164" y="300" width="598.4" height="46" rx="7" fill="none" stroke="var(--color-kv, #4c65b6)" stroke-width="2.2"/>
  <rect x="482" y="400" width="230" height="52" rx="8" fill="var(--color-kv, #4c65b6)" stroke="var(--color-ink, #17211f)" stroke-width="1.5"/>
  <text x="597" y="422" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="14" font-weight="700" fill="var(--color-ink-inverse, #ffffff)" text-anchor="middle">切成 KV 块</text>
  <text x="597" y="441" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="13" font-weight="400" fill="var(--color-ink-inverse, #ffffff)" text-anchor="middle">块数 = 份额 ÷ 每块字节</text>
  <path d="M417 348 v8 h15.399999999999977 v-8" fill="none" stroke="var(--color-ink, #17211f)" stroke-width="1.5"/>
  <text x="424.7" y="378" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="14" font-weight="700" fill="var(--color-ink, #17211f)" text-anchor="middle">非 torch 增量（HCCL 缓冲等）</text>
  <path d="M762.4 348 v8 h105.60000000000002 v-8" fill="none" stroke="var(--color-ink, #17211f)" stroke-width="1.5"/>
  <text x="815.2" y="378" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="14" font-weight="700" fill="var(--color-ink, #17211f)" text-anchor="middle">切完 KV 才占：录图等</text>
  <text x="450" y="26" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="13.5" font-weight="700" fill="var(--color-ink, #17211f)" text-anchor="middle">预算先定下来，再一项项扣，剩下的切成 KV cache</text>
  <text x="46" y="88" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="13.5" font-weight="400" fill="var(--color-ink, #17211f)">定预算</text>
  <text x="46" y="168" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="13.5" font-weight="400" fill="var(--color-ink, #17211f)">扣权重</text>
  <text x="46" y="248" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="13.5" font-weight="400" fill="var(--color-ink, #17211f)">扣激活峰值</text>
  <text x="46" y="328" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="13.5" font-weight="400" fill="var(--color-ink, #17211f)">扣非 torch 增量</text>
  <text x="412" y="168" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="13.5" font-weight="400" fill="var(--color-ink, #17211f)">装权重时量：加载前后的占用差</text>
  <text x="434" y="248" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="13.5" font-weight="400" fill="var(--color-ink, #17211f)">激活峰值：试跑最大批量时的最高点</text>
  <circle cx="26" cy="83" r="11" fill="var(--color-control, #66716d)"/><text x="26" y="88" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="13" font-weight="700" fill="var(--color-ink-inverse, #ffffff)" text-anchor="middle">1</text>
  <circle cx="26" cy="163" r="11" fill="var(--color-weight, #c78300)"/><text x="26" y="168" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="13" font-weight="700" fill="var(--color-ink-inverse, #ffffff)" text-anchor="middle">2</text>
  <circle cx="26" cy="243" r="11" fill="var(--color-token, #087f73)"/><text x="26" y="248" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="13" font-weight="700" fill="var(--color-ink-inverse, #ffffff)" text-anchor="middle">3</text>
  <circle cx="26" cy="323" r="11" fill="var(--color-comm, #9a4b86)"/><text x="26" y="328" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="13" font-weight="700" fill="var(--color-ink-inverse, #ffffff)" text-anchor="middle">4</text>
</svg>
