<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 220" width="900" height="220" role="img" aria-label="一颗 NPU 的 64 GiB：九成里减掉权重和临时数据，剩下的给 KV；录图那一块落在九成之外">
  <title>一颗 NPU 的 64 GiB：九成里减掉权重和临时数据，剩下的给 KV；录图那一块落在九成之外</title>
  <defs><pattern id="kv-cache-memory-profiling-hatch" width="7" height="7" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="7" height="7" fill="var(--color-surface-sunken, #ece9df)"/><line x1="0" y1="0" x2="0" y2="7" stroke="var(--color-ink-muted, #66716d)" stroke-width="2"/></pattern></defs>
  <rect x="30" y="84" width="407.5" height="46" rx="4" fill="var(--color-weight, #c78300)" stroke="var(--color-ink, #17211f)" stroke-width="1.3"/>
  <text x="46" y="112" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="13" font-weight="700" fill="var(--color-ink-inverse, #ffffff)">权重 32.6</text>
  <rect x="437.5" y="84" width="43.8" height="46" rx="4" fill="var(--color-control, #66716d)" stroke="var(--color-ink, #17211f)" stroke-width="1.3"/>
  <rect x="481.3" y="84" width="268.8" height="46" rx="4" fill="var(--color-kv, #4c65b6)" stroke="var(--color-ink, #17211f)" stroke-width="1.3"/>
  <text x="497.3" y="112" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="13" font-weight="700" fill="var(--color-ink-inverse, #ffffff)">KV 预算 21.5</text>
  <rect x="750" y="84" width="22.5" height="46" rx="4" fill="var(--color-danger, #b54237)" stroke="var(--color-ink, #17211f)" stroke-width="1.3"/>
  <rect x="772.5" y="84" width="57.5" height="46" rx="4" fill="url(#kv-cache-memory-profiling-hatch)" stroke="var(--color-ink-muted, #66716d)" stroke-width="1.3"/>
  <rect x="30" y="78" width="800" height="58" rx="7" fill="none" stroke="var(--color-ink, #17211f)" stroke-width="2.2"/>
  <path d="M30 156 v8 h720 v-8" fill="none" stroke="var(--color-ink, #17211f)" stroke-width="1.5"/>
  <text x="390" y="186" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="14" font-weight="700" fill="var(--color-ink, #17211f)" text-anchor="middle">九成 57.6 GiB：减法只在这里面算</text>
  <path d="M750 156 v8 h80 v-8" fill="none" stroke="var(--color-ink, #17211f)" stroke-width="1.5"/>
  <text x="790" y="186" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="14" font-weight="700" fill="var(--color-ink, #17211f)" text-anchor="middle">留出的一成</text>
  <text x="30" y="58" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="14" font-weight="700" fill="var(--color-ink, #17211f)">一颗 NPU 显存 64 GiB</text>
  <text x="440" y="64" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="12.5" font-weight="400" fill="var(--color-ink-muted, #66716d)" font-style="italic">临时数据等 3.5</text>
  <text x="742" y="64" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="12.5" font-weight="400" fill="#8f3229">录图 1.8</text>
</svg>
