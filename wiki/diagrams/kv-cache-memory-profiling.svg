<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 270" width="900" height="270" role="img" aria-label="假设设备总内存64 GiB，使用比例0.9；缓存预算等于57.6 GiB减去36 GiB非缓存用量，图捕获的额外需求尚需评估">
  <title>假设设备总内存64 GiB，使用比例0.9；缓存预算等于57.6 GiB减去36 GiB非缓存用量，图捕获的额外需求尚需评估</title>
  <defs><pattern id="kv-cache-memory-profiling-hatch" width="7" height="7" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="7" height="7" fill="var(--color-surface-sunken, #ece9df)"/><line x1="0" y1="0" x2="0" y2="7" stroke="var(--color-ink-muted, #66716d)" stroke-width="2"/></pattern></defs>
  <rect x="50" y="100" width="360" height="48" rx="4" fill="var(--color-weight, #c78300)" stroke="var(--color-ink, #17211f)" stroke-width="1.3"/>
  <text x="66" y="129" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="13" font-weight="700" fill="var(--color-ink-inverse, #ffffff)">权重 30</text>
  <rect x="410" y="100" width="48" height="48" rx="4" fill="var(--color-token, #087f73)" stroke="var(--color-ink, #17211f)" stroke-width="1.3"/>
  <text x="426" y="129" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="13" font-weight="700" fill="var(--color-ink-inverse, #ffffff)">4</text>
  <rect x="458" y="100" width="24" height="48" rx="4" fill="var(--color-control, #66716d)" stroke="var(--color-ink, #17211f)" stroke-width="1.3"/>
  <text x="474" y="129" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="13" font-weight="700" fill="var(--color-ink-inverse, #ffffff)">2</text>
  <rect x="482" y="100" width="259.2" height="48" rx="4" fill="var(--color-kv, #4c65b6)" stroke="var(--color-ink, #17211f)" stroke-width="1.3"/>
  <text x="498" y="129" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="13" font-weight="700" fill="var(--color-ink-inverse, #ffffff)">缓存预算 21.6</text>
  <rect x="741.2" y="100" width="76.8" height="48" rx="4" fill="url(#kv-cache-memory-profiling-hatch)" stroke="var(--color-ink-muted, #66716d)" stroke-width="1.3"/>
  <text x="757.2" y="129" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="13" font-weight="700" fill="var(--color-ink, #17211f)">6.4</text>
  <rect x="50" y="94" width="768" height="60" rx="7" fill="none" stroke="var(--color-ink, #17211f)" stroke-width="2.2"/>
  <path d="M50 180 v8 h691.2 v-8" fill="none" stroke="var(--color-ink, #17211f)" stroke-width="1.5"/>
  <text x="395.6" y="210" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="14" font-weight="700" fill="var(--color-ink, #17211f)" text-anchor="middle">请求份额：64 × 0.9 = 57.6 GiB</text>
  <text x="50" y="48" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="13.5" font-weight="700" fill="var(--color-ink, #17211f)">教学假设 · 单位 GiB</text>
  <text x="433" y="84" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="13.5" font-weight="400" fill="var(--color-ink, #17211f)" text-anchor="middle">激活</text>
  <text x="469" y="63" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="13.5" font-weight="400" fill="var(--color-ink, #17211f)" text-anchor="middle">其他</text>
  <text x="779" y="84" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="13.5" font-weight="400" fill="var(--color-ink, #17211f)" text-anchor="middle">份额外</text>
  <text x="50" y="244" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="13.5" font-weight="400" fill="var(--color-ink-muted, #66716d)" font-style="italic">图捕获和运行峰值仍需留足空间；缓存预算不是全部空闲内存</text>
</svg>
