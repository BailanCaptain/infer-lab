    h: 34
    scale: 11
    frame: { value: 64, label: 一张卡的总显存, tone: ink }
    segments:
      - { value: 54.4, tone: control, text: 预算 = 总显存 × 显存比例 }
      - { value: 9.6, tone: control, style: hatch, text: 预算外 }
  - at: [164, 146]
    h: 34
    scale: 11
