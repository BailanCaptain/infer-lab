    tone: accent

notes:
  - at: [40, 246]
    text: "同一件事画到实际比例上：左边那三块是权重 1.11 + 激活峰值 2.30 + 非 torch 1.20，右边两段不在预算里"
    size: 13.5
    width: 820
    strong: true
  - at: [40, 430]
    text: "图捕获发生在 KV 张量申请之后：它那 1.80 GiB 吃的是 0.9 切剩下的这段尾巴，不进上面那个减法。尾巴不够，worker 就死在这一步——日志给出的 --kv-cache-memory 建议值正是用来补这个缺口。"
    size: 12.5
    width: 820

