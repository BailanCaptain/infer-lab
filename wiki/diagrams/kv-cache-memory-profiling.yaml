layout: figure
id: kv-cache-memory-profiling
caption: 一张卡的显存怎样一层层扣出 KV cache 的份额：先按总显存 × 显存比例定预算，再扣装权重时量到的占用、profile run 量到的激活峰值、用快照差量出的非 torch 增量（HCCL 缓冲属于这一项），余下的按每块字节数切成 KV 块。decode 图和后来才创建的缓冲在切完 KV 之后才出现，从预算外那一段支付。各段长短只示意先后与归属，不是实测比例。
