<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 356" width="900" height="356" role="img" aria-label="GLM 混合页对齐规则代入 1 字节潜向量后逻辑块从 640 变 1152 token 的同比例字节图" font-family="var(--font-sans)">
  <title>为什么潜向量压半 ≠ 块数翻倍：GLM 固定 KDA 状态 561,152 B 的最小页门槛</title>
  <desc>基于 min_attn_block_size、kernel_block_size、mamba_raw_size、attn_token_page_size：按统一字节比例尺画出 KDA 固定状态 561,152 B 红线、BF16 下 5×128=640 tok（655,360 B）过线，以及假设 1 B 潜向量下 5 块仅 327,680 B 不足、被迫扩至 9×128=1,152 tok（589,824 B）才过线。</desc>

  <text x="16" y="28" font-size="16" font-weight="700" fill="#17211f">同比例字节门槛：为什么把 GLM 潜向量压成 1 字节，逻辑块反而从 640 涨到 1,152？</text>
  <line x1="14" y1="38" x2="886" y2="38" stroke="#b8bcb5" stroke-width="1.4"/>

  <!-- Scale: 100,000 B = 90 px -> origin x=176; 561,152 B -> x = 176 + 505 = 681; 655,360 B -> x = 176 + 590 = 766; 589,824 B -> x = 176 + 531 = 707; 327,680 B -> x = 176 + 295 = 471 -->
  <!-- Row 1: Fixed KDA raw state 561,152 B -->
  <text x="16" y="84" font-size="14" font-weight="700" fill="#936300">KDA 固定状态</text>
  <text x="16" y="104" font-size="13.5" fill="#66716d">（不随潜向量缩）</text>
  <rect x="176" y="64" width="505" height="36" rx="5" fill="#fff4cf" stroke="#c78300" stroke-width="1.8"/>
  <text x="428" y="87" text-anchor="middle" font-family="var(--font-mono)" font-size="14" font-weight="700" fill="#936300">mamba_raw_size = 561,152 B（每层每请求刚性下限）</text>

  <!-- Vertical red minimum threshold line at 561,152 B (x=681) -->
  <line x1="681" y1="54" x2="681" y2="278" stroke="#b54237" stroke-width="2.2" stroke-dasharray="6 4"/>
  <text x="690" y="70" font-size="13.5" font-weight="700" fill="#8f3229">页大小刚性红线</text>
  <text x="690" y="90" font-family="var(--font-mono)" font-size="13.5" fill="#8f3229">≥ 561,152 B</text>

  <!-- Row 2: BF16 latent (1 KiB/tok -> 5 x 128 = 640 tok = 655,360 B -> w=590 px, 118 px per 128-tok block) -->
  <text x="16" y="144" font-size="14" font-weight="700" fill="#3a4f93">BF16 (1 KiB/tok)</text>
  <text x="16" y="164" font-size="13.5" fill="#4d5652">现有部署 640 tok</text>
  <g fill="#e8edff" stroke="#4c65b6" stroke-width="1.4" font-family="var(--font-mono)" font-size="13.5" font-weight="700" text-anchor="middle">
    <rect x="176" y="124" width="118" height="36" rx="3"/><text x="235" y="147" fill="#3a4f93">128</text>
    <rect x="294" y="124" width="118" height="36"/><text x="353" y="147" fill="#3a4f93">128</text>
    <rect x="412" y="124" width="118" height="36"/><text x="471" y="147" fill="#3a4f93">128</text>
    <rect x="530" y="124" width="118" height="36"/><text x="589" y="147" fill="#3a4f93">128</text>
    <rect x="648" y="124" width="118" height="36" rx="3"/><text x="707" y="147" fill="#3a4f93">128</text>
  </g>
  <text x="776" y="147" font-family="var(--font-mono)" font-size="13.5" font-weight="700" fill="#3a4f93">655 KB (5块✓)</text>

  <!-- Row 3: Hypothetical 1-byte latent (512 B/tok -> each 128-tok block = 65,536 B = 59 px; 9 blocks = 531 px -> x=707) -->
  <text x="16" y="212" font-size="14" font-weight="700" fill="#065f56">假设 1B (512 B)</text>
  <text x="16" y="232" font-size="13.5" fill="#065f56">重算 1,152 tok</text>
  <g stroke="#087f73" stroke-width="1.3" font-family="var(--font-mono)" font-size="13.5" font-weight="700" text-anchor="middle">
    <rect x="176" y="192" width="59" height="36" rx="3" fill="#ddf4ef"/><text x="205" y="215" fill="#065f56">1</text>
    <rect x="235" y="192" width="59" height="36" fill="#ddf4ef"/><text x="264" y="215" fill="#065f56">2</text>
    <rect x="294" y="192" width="59" height="36" fill="#ddf4ef"/><text x="323" y="215" fill="#065f56">3</text>
    <rect x="353" y="192" width="59" height="36" fill="#ddf4ef"/><text x="382" y="215" fill="#065f56">4</text>
    <rect x="412" y="192" width="59" height="36" fill="#ddf4ef"/><text x="441" y="215" fill="#065f56">5</text>
    <!-- Blocks 6..9 needed to cross red line -->
    <rect x="471" y="192" width="59" height="36" fill="#f7e7f2" stroke="#9a4b86"/><text x="500" y="215" fill="#7a3a6a">6</text>
    <rect x="530" y="192" width="59" height="36" fill="#f7e7f2" stroke="#9a4b86"/><text x="559" y="215" fill="#7a3a6a">7</text>
    <rect x="589" y="192" width="59" height="36" fill="#f7e7f2" stroke="#9a4b86"/><text x="618" y="215" fill="#7a3a6a">8</text>
    <rect x="648" y="192" width="59" height="36" rx="3" fill="#f7e7f2" stroke="#9a4b86"/><text x="677" y="215" fill="#7a3a6a">9</text>
  </g>
  <text x="718" y="215" font-family="var(--font-mono)" font-size="13.5" font-weight="700" fill="#7a3a6a">590 KB (须 9 块✓)</text>

  <text x="324" y="252" text-anchor="middle" font-size="13.5" fill="#8f3229">前 5 块仅 328 KB（装不下 KDA！）</text>
  <text x="588" y="252" text-anchor="middle" font-size="13.5" font-weight="700" fill="#7a3a6a">补扩 4 个 128 核块 → 9×128 = 1,152 tok</text>

  <!-- Takeaway strip -->
  <rect x="16" y="286" width="868" height="56" rx="8" fill="#ece9df" stroke="#b8bcb5" stroke-width="1.2"/>
  <text x="30" y="310" font-size="14" font-weight="700" fill="#17211f">结论：混合模型压窄一类缓存时，页大小与逻辑块长会联动重算</text>
  <text x="30" y="331" font-size="13.5" fill="#4d5652">KDA 状态仍固定占 12 块号，故「潜向量减半」推不出「块数或并发翻倍」（此为规则推演，db701c1f 未开）。</text>
</svg>
