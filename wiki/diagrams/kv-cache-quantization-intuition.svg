<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 400" width="880" height="400" role="img" aria-label="同一段留给 KV cache 的显存，按 BF16 存装得下 4 块；改按 INT8 存，每块装的位置数不变（这里一块是 4 个位置、每个位置 8 个数，示意），每个数只占一半宽，于是装得下 8 块。写入时把新位置的 k、v 压成 8 位，读取时乘回系数；本页主讲的实现里，系数每层 k、v 各一套、随权重加载，不占这段显存。每页的位置数、页对齐和其他状态会让实际容量偏离一倍，见正文。">
  <title>同一段留给 KV cache 的显存，按 BF16 存装得下 4 块；改按 INT8 存，每块装的位置数不变（这里一块是 4 个位置、每个位置 8 个数，示意），每个数只占一半宽，于是装得下 8 块。写入时把新位置的 k、v 压成 8 位，读取时乘回系数；本页主讲的实现里，系数每层 k、v 各一套、随权重加载，不占这段显存。每页的位置数、页对齐和其他状态会让实际容量偏离一倍，见正文。</title>
