layout: figure
id: kv-cache-quantization-intuition
caption: 同一段留给 KV cache 的显存，按 BF16 存装得下 4 块；改按 INT8 存，每块装的位置数不变（这里一块是 4 个位置、每个位置 8 个数，示意），每个数只占一半宽，于是装得下 8 块。静态系数与偏移随权重加载，另占显存，未计入图中的块载荷池。每页的位置数、页对齐和其他状态会改变实际容量，见正文。
