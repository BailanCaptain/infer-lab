<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 270" width="900" height="270" role="img" aria-label="写进 KV 块之前先除以 scale 压成 int8，一份 K、V 从 2 KiB 变 1 KiB（每 token 每层、一颗 NPU 独跑）；读的时候不先解开，连 scale 一起交给注意力算子">
  <title>写进 KV 块之前先除以 scale 压成 int8，一份 K、V 从 2 KiB 变 1 KiB（每 token 每层、一颗 NPU 独跑）；读的时候不先解开，连 scale 一起交给注意力算子</title>
  <defs><marker id="kv-cache-quantization-ah-kv" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="var(--color-kv, #4c65b6)"/></marker><marker id="kv-cache-quantization-ah-weight" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="var(--color-weight, #c78300)"/></marker></defs>
  <path d="M180 120 L240 120" fill="none" stroke="var(--color-kv, #4c65b6)" stroke-width="1.4" marker-end="url(#kv-cache-quantization-ah-kv)"/>
  <path d="M410 120 L470 120" fill="none" stroke="var(--color-kv, #4c65b6)" stroke-width="1.4" marker-end="url(#kv-cache-quantization-ah-kv)"/>
  <path d="M640 120 L700 120" fill="none" stroke="var(--color-kv, #4c65b6)" stroke-width="1.4" marker-end="url(#kv-cache-quantization-ah-kv)"/>
  <path d="M555 200 L325 150" fill="none" stroke="var(--color-weight, #c78300)" stroke-width="1.4" marker-end="url(#kv-cache-quantization-ah-weight)"/>
  <path d="M555 200 L785 150" fill="none" stroke="var(--color-weight, #c78300)" stroke-width="1.4" marker-end="url(#kv-cache-quantization-ah-weight)"/>
  <rect x="30" y="90" width="150" height="60" rx="8" fill="var(--color-kv-soft, #e8edff)" stroke="var(--color-kv, #4c65b6)" stroke-opacity="0.4" stroke-width="1.5" stroke-dasharray="5 4"/>
  <text x="105" y="116" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="13" font-weight="400" fill="#3a4f93" text-anchor="middle">K、V</text>
  <text x="105" y="135" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="13" font-weight="400" fill="#3a4f93" text-anchor="middle">bf16 · 2 KiB</text>
  <rect x="240" y="90" width="170" height="60" rx="8" fill="var(--color-surface-sunken, #ece9df)" stroke="var(--color-ink, #17211f)" stroke-width="1.5"/>
  <text x="325" y="125" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="14" font-weight="700" fill="var(--color-ink, #17211f)" text-anchor="middle">÷ scale 取整</text>
  <rect x="484" y="66" width="170" height="80" rx="8" fill="var(--color-kv, #4c65b6)" stroke="var(--color-ink, #17211f)" stroke-width="1.5"/>
  <rect x="477" y="73" width="170" height="80" rx="8" fill="var(--color-kv, #4c65b6)" stroke="var(--color-ink, #17211f)" stroke-width="1.5"/>
  <rect x="470" y="80" width="170" height="80" rx="8" fill="var(--color-kv, #4c65b6)" stroke="var(--color-ink, #17211f)" stroke-width="1.5"/>
  <text x="555" y="116" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="14" font-weight="700" fill="var(--color-ink-inverse, #ffffff)" text-anchor="middle">KV 块</text>
  <text x="555" y="135" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="13" font-weight="400" fill="var(--color-ink-inverse, #ffffff)" text-anchor="middle">int8 · 1 KiB</text>
  <rect x="700" y="90" width="170" height="60" rx="8" fill="var(--color-surface-sunken, #ece9df)" stroke="var(--color-ink, #17211f)" stroke-width="1.5"/>
  <text x="785" y="125" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="14" font-weight="700" fill="var(--color-ink, #17211f)" text-anchor="middle">注意力算子</text>
  <rect x="470" y="200" width="170" height="40" rx="8" fill="var(--color-weight-soft, #fff4cf)" stroke="var(--color-weight, #c78300)" stroke-opacity="0.4" stroke-width="1.5" stroke-dasharray="5 4"/>
  <text x="555" y="225" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="13" font-weight="400" fill="#936300" text-anchor="middle">scale</text>
