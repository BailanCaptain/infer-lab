<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 420" width="880" height="420" role="img" aria-label="固定 db 镜像中，不做 PD 分离、输入为 BF16 的普通 C8 路径示意。新 k、v 量化后写入；全新 prefill 且浮点值可用时直接读浮点，接历史则收拢并反量化；decode 由融合算子直接读分页 INT8。PD producer、图捕获与新版 C8-MXFP 另有入口，见正文。">
