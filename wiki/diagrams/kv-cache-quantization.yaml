layout: figure
id: kv-cache-quantization
caption: C8 缓存在一层里的写入与读取。上半是每层每步都走的写入：新位置的 k、v 压成 INT8，按槽位写进分页缓存。下半按执行阶段分三路：整段 prefill 直接用浮点 k、v；prefill 要接历史时，先把用到的块收拢成临时张量、乘回系数；decode 直接按块读 8 位、边读边乘回系数。三路最后进同一个 attention。
