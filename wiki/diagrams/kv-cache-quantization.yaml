    tone: ascend
  - at: [310, 142]
    size: [250, 72]
    title: 按层分发量化方法
    sub: is_c8_quant_layer 为真的层
    fn: get_quant_method
    tone: ascend
  - at: [576, 142]
    size: [250, 72]
    title: 改写这一层的 dtype 与 impl
    sub: kv_cache_torch_dtype = int8
    fn: create_weights
    tone: ascend

arrows:
  - { from: [294, 178], to: [308, 178], tone: ascend }
  - { from: [560, 178], to: [574, 178], tone: ascend }

