<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 374" width="900" height="374" role="img" aria-label="GLM 双机启用 Sparse KV offload 的五道门槛（四道代码硬拦与一项未验证清单）及假设显存收支比例条" font-family="var(--font-sans)">
  <title>GLM 双机五道门槛（四道代码硬拦 + 未验证清单）与假设放开后的定额热缓冲 vs 迁走主 KV 比例条</title>
  <desc>Four hard code blockers plus unverified model list check for GLM-5.3-Flash 2xA2 deployment (v0.30.0/main default -1 resolves to 8192 hot slots vs legacy 4096; default 110 GiB/DP vs 128 GiB/DP example), and exact-scale 3.75 GiB vs 48.8 GiB memory bars</desc>
  <defs>
    <marker id="spg-arr-danger" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0 1.5L9 5L0 8.5z" fill="#b54237"/>
    </marker>
  </defs>

  <!-- Section 1: 4 Hard Code Blockers + 1 Unverified Checklist Gate -->
  <circle cx="24" cy="24" r="12" fill="#b54237"/>
  <text x="24" y="28.5" text-anchor="middle" font-size="12.5" font-weight="700" fill="#ffffff">1</text>
  <text x="44" y="30" font-size="16" font-weight="700" fill="#17211f">放到 GLM 双机（Atlas 800 A2）：即便换到 v0.30.0 / main，仍面临四道硬报错 + 一项未验证</text>

  <g stroke-width="1.4">
    <rect x="16" y="48" width="160" height="118" rx="7" fill="#fff0e9" stroke="#b54237"/>
    <rect x="193" y="48" width="160" height="118" rx="7" fill="#fff0e9" stroke="#b54237"/>
    <rect x="370" y="48" width="160" height="118" rx="7" fill="#fff4cf" stroke="#c78300"/>
    <rect x="547" y="48" width="160" height="118" rx="7" fill="#fff0e9" stroke="#b54237"/>
    <rect x="724" y="48" width="160" height="118" rx="7" fill="#fff0e9" stroke="#b54237"/>
  </g>
  <path d="M176 107 H189 M353 107 H366 M530 107 H543 M707 107 H720" fill="none" stroke="#b54237" stroke-width="1.6" marker-end="url(#spg-arr-danger)"/>

  <g text-anchor="middle" font-size="13.5">
    <text x="96" y="73" font-weight="700" fill="#8f3229">关 1 · 硬件型号</text>
    <text x="96" y="98" fill="#17211f">本部署为 A2</text>
    <text x="96" y="120" fill="#4d5652">代码仅放行 A3</text>
    <text x="96" y="150" font-weight="700" fill="#8f3229">✗ RuntimeError</text>

    <text x="273" y="73" font-weight="700" fill="#8f3229">关 2 · 实例角色</text>
    <text x="273" y="98" fill="#17211f">主线 PD 混部</text>
    <text x="273" y="120" fill="#4d5652">须为 D 端 consumer</text>
    <text x="273" y="150" font-weight="700" fill="#8f3229">✗ AssertionError</text>

    <text x="450" y="73" font-weight="700" fill="#936300">关 3 · 支持清单</text>
    <text x="450" y="98" fill="#17211f">index_topk 检查可过</text>
    <text x="450" y="120" fill="#4d5652">未列入官方验证清单</text>
    <text x="450" y="150" font-weight="700" fill="#936300">⚠ 非代码硬拦</text>

    <text x="627" y="73" font-weight="700" fill="#8f3229">关 4 · 缓存布局</text>
    <text x="627" y="98" fill="#17211f">GLM 含 5 个组</text>
    <text x="627" y="120" fill="#4d5652">要求单组同块长</text>
    <text x="627" y="150" font-weight="700" fill="#8f3229">✗ ValueError</text>

    <text x="804" y="73" font-weight="700" fill="#8f3229">关 5 · 热槽对齐</text>
    <text x="804" y="98" fill="#17211f">默认 -1→8,192 槽</text>
    <text x="804" y="120" fill="#4d5652">旧 4096 均除不尽 640</text>
    <text x="804" y="150" font-weight="700" fill="#8f3229">✗ 最小需 2,560</text>
  </g>

  <!-- Divider -->
  <line x1="16" y1="184" x2="884" y2="184" stroke="#d8d8cf" stroke-width="1.4" stroke-dasharray="6 4"/>

  <!-- Section 2: Hypothetical Memory Trade-off Bar (32 reqs x 133K) -->
  <circle cx="24" cy="208" r="12" fill="#4c65b6"/>
  <text x="24" y="212.5" text-anchor="middle" font-size="12.5" font-weight="700" fill="#ffffff">2</text>
  <text x="44" y="214" font-size="16" font-weight="700" fill="#17211f">假设放开前四关后的显存收支对照（32 条满长 133,120 位置，不受支持布局假设）</text>

  <!-- Scale: 50 GiB = 640px -> 12.8 px/GiB -->
  <!-- Row 1: Offloaded main KV = 48.8 GiB -> 624px -->
  <text x="16" y="254" font-size="14" font-weight="700" fill="#3a4f93">迁至主机 DRAM</text>
  <text x="16" y="274" font-size="13.5" fill="#66716d">省下的设备主 KV</text>
  <rect x="160" y="238" width="624" height="36" rx="5" fill="#e8edff" stroke="#4c65b6" stroke-width="1.5"/>
  <text x="472" y="261" text-anchor="middle" font-size="13.5" font-weight="700" fill="#3a4f93">32×1.52 ≈ 48.8 GiB（默认 110 GiB/DP 够装；128 GiB 为示例；Indexer 留设备）</text>
  <text x="794" y="261" font-size="13.5" font-weight="700" fill="#3a4f93">随长增长</text>

  <!-- Row 2: Fixed hot buffer = 3.75 GiB -> exact 48px (3.75 x 12.8) -->
  <text x="16" y="308" font-size="14" font-weight="700" fill="#936300">定额设备热缓冲</text>
  <text x="16" y="328" font-size="13.5" fill="#66716d">12 层×128 行×2.5M</text>
  <rect x="160" y="292" width="48" height="36" rx="5" fill="#fff4cf" stroke="#c78300" stroke-width="1.5"/>
  <text x="218" y="315" font-size="13.5" fill="#936300"><tspan font-weight="700">3.75 GiB</tspan> 定额常驻（与上下文无关）；最坏全不命中每步每卡 H2D 搬回 3 GiB + 4.5 MiB</text>

  <text x="16" y="360" font-size="13.5" fill="#66716d">注：以上为按源码公式代入 GLM 参数的静态估算，不含主机查表、TP 同步与链路争用，不代表可执行路径实测。</text>
</svg>
