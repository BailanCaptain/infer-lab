layout: figure
id: kv-cache-sparse-offload-step
caption: 固定 main 的默认路径：新行从设备临时张量复制到主机，不写完整设备分页主缓存；选位置、查槽表、只搬缺失行并换成槽号后，attention 读设备热缓冲。
size: [880, 640]
frames:
  - {label: 一步 decode 在一个稀疏 MLA 层里, at: [20, 50], size: [840, 566]}
items:
  - {at: [210, 82], size: [470, 52], text: "① 新 K/V：设备临时张量 → 主机池", sub: "不写完整设备分页主缓存；TP 组由 rank 0 复制", tone: kv}
  - {at: [210, 160], size: [470, 52], text: "② indexer 给历史打分，选出这一步要读的位置", sub: "输出的是位置号，不是槽号", tone: weight}
  - {at: [210, 238], size: [470, 52], text: "③ 查这一层的槽表：哪些位置已经在槽里", sub: "在的算命中；其余记成缺失", style: plain}
  - {at: [210, 316], size: [470, 52], text: "④ 给缺失的位置挑槽", sub: "只从这一步没被选中的槽里挑，最久没用的先换", style: plain}
  - {at: [210, 394], size: [470, 52], text: "⑤ 只把缺失的行从主机搬进热缓冲", sub: "先等 rank 0 写完，组内各卡再各自搬自己缺的", tone: comm}
  - {at: [210, 472], size: [470, 52], text: "⑥ 把位置号换成槽号", sub: "attention 拿到的是热缓冲里的槽号", tone: token}
  - {at: [210, 550], size: [470, 52], text: "⑦ 稀疏 attention 读热缓冲，算完这一层", sub: "槽表留给下一步；下一层从 ① 重来", tone: kv}
