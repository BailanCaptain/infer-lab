layout: scene
id: kv-cache-sparse-offload
caption: D 节点上的一个 decode 步：主 KV 一直在主机，只有 top-k 里没命中的那几行跨过界线（v0.26 分支）
size: [900, 532]

regions:
  - label: 主机 pinned 池
    note: 每个 DP 一份，DP 内 TP 共享。全量主 KV 住这里，能开多大 batch 变成主机内存问题。
    at: [20, 44]
    size: [380, 424]
    tone: neutral
  - label: NPU
    note: 只剩 indexer 的 K 缓存和每层一份热缓冲区；主 paged KV 默认不分配。
    at: [500, 44]
    size: [380, 424]
    tone: ascend

boundaries:
  - { at: 450, from: 44, to: 468, vertical: true, label: "一个 decode 步只跨这条线两次" }

boxes:
  - at: [42, 130]
    size: [334, 70]
    title: 全量主 KV，pinned
    sub: 只有 TP rank 0 分配并写新行
    fn: k_caches_cpu / v_caches_cpu
    icon: box
    tone: neutral
  - at: [42, 300]
    size: [334, 70]
    title: 每层一张 LRU 驻留表
    sub: 命中挪队尾，miss 占队首可驱逐槽
    fn: lru_resident_compact
    icon: queue
    tone: upstream
  - at: [522, 130]
    size: [334, 70]
    title: 本步的 K 和 V 算完就走
    sub: 不落 NPU 主缓存，按 token 行下去
    fn: _compute_kv_only
    icon: calc
    tone: ascend
  - at: [522, 222]
    size: [334, 70]
    title: indexer 选中 2048 个历史位置
    sub: 模型自带的 DSA，与卸载无关
    fn: indexer_select_post_process
    icon: pick
    tone: ascend
  - at: [522, 380]
    size: [334, 70]
    title: 稀疏注意力只读热缓冲区
    sub: 喂进去的是物理槽位
    fn: _execute_sparse_flash_attention_process
    tone: accent

strips:
  - at: [42, 220]
    cells: 44
    cell: 7
    h: 16
    gap: 1
    tone: neutral
    label: 一行历史 = 1,950,336 个 token 的位置
  - at: [522, 322]
    cells: 13
    cell: 22
    gap: 4
    highlights: [2, 6, 11]
    tone: accent
    label: 热缓冲区一行 = 4096 个槽位，实心的是这一步搬上来的

