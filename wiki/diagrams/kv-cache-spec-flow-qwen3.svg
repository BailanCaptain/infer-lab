<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 420" width="900" height="420" role="img" aria-label="v0.30.0 标准 Qwen3-8B 启动与运行期的 KVCacheSpec 流水线：启动时 NPUPlatform 设定默认 block_size=128，全模型 36 层上报完全相同的 FullAttentionSpec（8KV 头、d_h=128），直接归并为单一缓存组（18 MiB/块），逻辑块与物理块 1:1 对齐（无异构模型 640 → 5×128 跨档折算）；运行期第 2、3、4 站全层共用同一份块表与槽位映射。">
  <title>v0.30.0 标准 Qwen3-8B 启动与运行期的 KVCacheSpec 流水线：启动时 NPUPlatform 设定默认 block_size=128，全模型 36 层上报完全相同的 FullAttentionSpec（8KV 头、d_h=128），直接归并为单一缓存组（18 MiB/块），逻辑块与物理块 1:1 对齐（无异构模型 640 → 5×128 跨档折算）；运行期第 2、3、4 站全层共用同一份块表与槽位映射。</title>
  <defs><marker id="kv-cache-spec-flow-qwen3-ah-ink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="var(--color-ink, #17211f)"/></marker><marker id="kv-cache-spec-flow-qwen3-ah-kv" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="var(--color-kv, #4c65b6)"/></marker><marker id="kv-cache-spec-flow-qwen3-ah-token" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="var(--color-token, #087f73)"/></marker></defs>
  <path d="M24 304 L876 304" fill="none" stroke="var(--color-ink-muted, #66716d)" stroke-width="1.4" stroke-dasharray="6 5"/>
  <text x="24" y="294" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="13" font-weight="700" fill="var(--color-ink-muted, #66716d)">启动时走一次：单一同构规格与建池</text>
  <text x="24" y="326" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="13" font-weight="700" fill="var(--color-ink-muted, #66716d)">每条请求运行期直读：1:1 块号直通</text>
  <path d="M216 75 L242 75" fill="none" stroke="var(--color-ink, #17211f)" stroke-width="1.4" marker-end="url(#kv-cache-spec-flow-qwen3-ah-ink)"/>
