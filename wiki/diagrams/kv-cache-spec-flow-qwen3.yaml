  - { from: [580, 363], to: [616, 363], tone: token }
texts:
  - { at: [450, 20], text: 'Qwen3-8B 单一同构 KVCacheSpec 流水线（128 tok/块 · 18 MiB/块）', anchor: middle, strong: true }
  - { at: [450, 272], text: '对比：仅含线性注意力或稀疏 MLA 的异构混合模型，才需多档块长最小公倍数对齐与多组拆分', anchor: middle, note: true }
