<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 430" width="900" height="430" role="img" aria-label="GLM 双机每台机器启动时走一遍上两排：配置检查先把逻辑块定成 640，各卡报规格并量显存，引擎再对齐两档页、编成 5 个组，按预算算块数，把块大小字段回写成各组最小值；各卡再按规划申请显存，把 MLA 页看成 5 个 kernel 块；最后引擎建调度器，调度粒度取各组块大小的最小公倍数。虚线框是另一条分支：不是 GLM 的混合模型走通用对齐；打开前缀缓存或 KV connector 时另算哈希粒度。下排是之后每条请求都要走的站点，它们只读这里定下的组和页。">
  <title>GLM 双机每台机器启动时走一遍上两排：配置检查先把逻辑块定成 640，各卡报规格并量显存，引擎再对齐两档页、编成 5 个组，按预算算块数，把块大小字段回写成各组最小值；各卡再按规划申请显存，把 MLA 页看成 5 个 kernel 块；最后引擎建调度器，调度粒度取各组块大小的最小公倍数。虚线框是另一条分支：不是 GLM 的混合模型走通用对齐；打开前缀缓存或 KV connector 时另算哈希粒度。下排是之后每条请求都要走的站点，它们只读这里定下的组和页。</title>
  <defs><marker id="kv-cache-spec-flow-ah-ink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="var(--color-ink, #17211f)"/></marker><marker id="kv-cache-spec-flow-ah-kv" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="var(--color-kv, #4c65b6)"/></marker><marker id="kv-cache-spec-flow-ah-token" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="var(--color-token, #087f73)"/></marker></defs>
