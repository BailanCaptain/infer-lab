layout: figure
id: kv-cache-spec-intuition
caption: 规格先说明每层要保存什么，再换成页的大小，最后按兼容的管理方式分组。图只画通用顺序；页是否补齐、分几组、哪些层共用显存，由实际模型布局决定。同组共用块号，各层的数据仍放在自己的页中。
