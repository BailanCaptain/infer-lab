  <text x="38" y="101" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="12.5" font-weight="400" fill="var(--color-ink-muted, #5b6763)">每层报一份 KVCacheSpec，引擎只从里面取一个数：一块多少字节。</text>
