<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 430" width="900" height="430" role="img" aria-label="每层先交一份规格。按位置增长的状态，一页等于「一个逻辑块的位置数 × 每个位置的字节」；每条请求只有一份的状态，一页就是整份状态。页再补到两档大小之一（斜线是补出来的空白），最后按共用块号的管理规则编组；GLM full 组把 MLA 大页与 indexer 小页成对管理，同组共用编号而非同样大的页。大页里的竖线是 kernel 块的边界。两档页各自按比例画，两档之间不按比例。">
  <title>每层先交一份规格。按位置增长的状态，一页等于「一个逻辑块的位置数 × 每个位置的字节」；每条请求只有一份的状态，一页就是整份状态。页再补到两档大小之一（斜线是补出来的空白），最后按共用块号的管理规则编组；GLM full 组把 MLA 大页与 indexer 小页成对管理，同组共用编号而非同样大的页。大页里的竖线是 kernel 块的边界。两档页各自按比例画，两档之间不按比例。</title>
  <defs><marker id="kv-cache-spec-ah-ink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="var(--color-ink, #17211f)"/></marker><marker id="kv-cache-spec-ah-kv" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="var(--color-kv, #4c65b6)"/></marker><pattern id="kv-cache-spec-hatch" width="7" height="7" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="7" height="7" fill="var(--color-surface-sunken, #ece9df)"/><line x1="0" y1="0" x2="0" y2="7" stroke="var(--color-ink-muted, #66716d)" stroke-width="2"/></pattern></defs>
  <path d="M24 222 L876 222" fill="none" stroke="var(--color-ink-muted, #66716d)" stroke-width="1.4" stroke-dasharray="6 5"/>
  <text x="24" y="212" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="13" font-weight="700" fill="var(--color-ink-muted, #66716d)">按位置增长</text>
  <text x="24" y="244" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="13" font-weight="700" fill="var(--color-ink-muted, #66716d)">每条请求一份</text>
  <path d="M260 72 L300 72" fill="none" stroke="var(--color-ink, #17211f)" stroke-width="1.4" marker-end="url(#kv-cache-spec-ah-ink)"/>
  <path d="M260 160 L300 160" fill="none" stroke="var(--color-ink, #17211f)" stroke-width="1.4" marker-end="url(#kv-cache-spec-ah-ink)"/>
  <path d="M260 284 L300 284" fill="none" stroke="var(--color-ink, #17211f)" stroke-width="1.4" marker-end="url(#kv-cache-spec-ah-ink)"/>
  <path d="M260 364 L300 364" fill="none" stroke="var(--color-ink, #17211f)" stroke-width="1.4" marker-end="url(#kv-cache-spec-ah-ink)"/>
  <path d="M600 72 L645 72 L645 106 L690 106" fill="none" stroke="var(--color-kv, #4c65b6)" stroke-width="1.4" marker-end="url(#kv-cache-spec-ah-kv)"/>
  <path d="M380 160 L645 160 L645 126 L690 126" fill="none" stroke="var(--color-kv, #4c65b6)" stroke-width="1.4" marker-end="url(#kv-cache-spec-ah-kv)"/>
  <path d="M380 284 L690 284" fill="none" stroke="var(--color-kv, #4c65b6)" stroke-width="1.4" marker-end="url(#kv-cache-spec-ah-kv)"/>
  <path d="M600 364 L690 364" fill="none" stroke="var(--color-kv, #4c65b6)" stroke-width="1.4" marker-end="url(#kv-cache-spec-ah-kv)"/>
  <rect x="300" y="57" width="60" height="30" rx="4" fill="var(--color-kv, #4c65b6)" stroke="var(--color-ink, #17211f)" stroke-width="1.3"/>
  <rect x="360" y="57" width="60" height="30" rx="4" fill="var(--color-kv, #4c65b6)" stroke="var(--color-ink, #17211f)" stroke-width="1.3"/>
  <rect x="420" y="57" width="60" height="30" rx="4" fill="var(--color-kv, #4c65b6)" stroke="var(--color-ink, #17211f)" stroke-width="1.3"/>
  <rect x="480" y="57" width="60" height="30" rx="4" fill="var(--color-kv, #4c65b6)" stroke="var(--color-ink, #17211f)" stroke-width="1.3"/>
  <rect x="540" y="57" width="60" height="30" rx="4" fill="var(--color-kv, #4c65b6)" stroke="var(--color-ink, #17211f)" stroke-width="1.3"/>
  <rect x="300" y="145" width="80" height="30" rx="4" fill="var(--color-kv, #4c65b6)" stroke="var(--color-ink, #17211f)" stroke-width="1.3"/>
  <rect x="300" y="269" width="8" height="30" rx="4" fill="var(--color-kv, #4c65b6)" stroke="var(--color-ink, #17211f)" stroke-width="1.3"/>
  <rect x="308" y="269" width="72" height="30" rx="4" fill="url(#kv-cache-spec-hatch)" stroke="var(--color-ink-muted, #66716d)" stroke-width="1.3"/>
  <rect x="300" y="349" width="256.8" height="30" rx="4" fill="var(--color-kv, #4c65b6)" stroke="var(--color-ink, #17211f)" stroke-width="1.3"/>
  <text x="316" y="369" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="13" font-weight="700" fill="var(--color-ink-inverse, #ffffff)">整份状态</text>
  <rect x="556.8" y="349" width="43.2" height="30" rx="4" fill="url(#kv-cache-spec-hatch)" stroke="var(--color-ink-muted, #66716d)" stroke-width="1.3"/>
  <rect x="24" y="44" width="236" height="56" rx="8" fill="var(--color-kv, #4c65b6)" stroke="var(--color-ink, #17211f)" stroke-width="1.5"/>
  <text x="142" y="68" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="14" font-weight="700" fill="var(--color-ink-inverse, #ffffff)" text-anchor="middle">MLA latent</text>
  <text x="142" y="87" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="13" font-weight="400" fill="var(--color-ink-inverse, #ffffff)" text-anchor="middle">每个位置存一份压缩表示</text>
  <rect x="24" y="132" width="236" height="56" rx="8" fill="var(--color-kv, #4c65b6)" stroke="var(--color-ink, #17211f)" stroke-width="1.5"/>
  <text x="142" y="156" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="14" font-weight="700" fill="var(--color-ink-inverse, #ffffff)" text-anchor="middle">indexer K</text>
  <text x="142" y="175" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="13" font-weight="400" fill="var(--color-ink-inverse, #ffffff)" text-anchor="middle">几个位置压成一条再存</text>
  <rect x="24" y="256" width="236" height="56" rx="8" fill="var(--color-kv, #4c65b6)" stroke="var(--color-ink, #17211f)" stroke-width="1.5"/>
  <text x="142" y="280" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="14" font-weight="700" fill="var(--color-ink-inverse, #ffffff)" text-anchor="middle">indexer 尾状态</text>
  <text x="142" y="299" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="13" font-weight="400" fill="var(--color-ink-inverse, #ffffff)" text-anchor="middle">还没凑满一条的那几个位置</text>
  <rect x="24" y="336" width="236" height="56" rx="8" fill="var(--color-kv, #4c65b6)" stroke="var(--color-ink, #17211f)" stroke-width="1.5"/>
  <text x="142" y="360" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="14" font-weight="700" fill="var(--color-ink-inverse, #ffffff)" text-anchor="middle">KDA 状态</text>
  <text x="142" y="379" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="13" font-weight="400" fill="var(--color-ink-inverse, #ffffff)" text-anchor="middle">卷积历史 + 递推矩阵，和长度无关</text>
  <rect x="690" y="86" width="186" height="60" rx="8" fill="var(--color-surface-sunken, #ece9df)" stroke="var(--color-ink, #17211f)" stroke-width="1.5"/>
  <text x="783" y="112" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="14" font-weight="700" fill="var(--color-ink, #17211f)" text-anchor="middle">full 组</text>
  <text x="783" y="131" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="13" font-weight="400" fill="var(--color-ink, #17211f)" text-anchor="middle">MLA 与 indexer K 成对</text>
  <rect x="690" y="256" width="186" height="56" rx="8" fill="var(--color-surface-sunken, #ece9df)" stroke="var(--color-ink, #17211f)" stroke-width="1.5"/>
  <text x="783" y="280" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="14" font-weight="700" fill="var(--color-ink, #17211f)" text-anchor="middle">尾状态组</text>
  <text x="783" y="299" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="13" font-weight="400" fill="var(--color-ink, #17211f)" text-anchor="middle">一块只管几个位置</text>
  <rect x="690" y="336" width="186" height="56" rx="8" fill="var(--color-surface-sunken, #ece9df)" stroke="var(--color-ink, #17211f)" stroke-width="1.5"/>
  <text x="783" y="360" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="14" font-weight="700" fill="var(--color-ink, #17211f)" text-anchor="middle">KDA 组</text>
  <text x="783" y="379" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="13" font-weight="400" fill="var(--color-ink, #17211f)" text-anchor="middle">按层交错拆成几组</text>
  <text x="24" y="26" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="13.5" font-weight="700" fill="var(--color-ink, #17211f)">① 每层交一份规格</text>
  <text x="300" y="26" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="13.5" font-weight="700" fill="var(--color-ink, #17211f)">② 换算成一页</text>
  <text x="690" y="26" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="13.5" font-weight="700" fill="var(--color-ink, #17211f)">③ 编成缓存组</text>
  <text x="300" y="106" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="12.5" font-weight="400" fill="var(--color-ink, #17211f)">大页 = 逻辑块位置数 × 每位置字节</text>
  <text x="300" y="194" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="12.5" font-weight="400" fill="var(--color-ink, #17211f)">小页 = 压缩后的条数 × 每条字节</text>
  <text x="300" y="318" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="12.5" font-weight="400" fill="var(--color-ink, #17211f)">整份补到小页大小</text>
  <text x="300" y="408" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="12.5" font-weight="400" fill="var(--color-ink, #17211f)">整份补到大页；逻辑块取到大页装得下它为止</text>
</svg>
