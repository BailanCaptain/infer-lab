<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 710" width="900" height="710" role="img" aria-label="声明趟数的是层，分配趟数的是字节，中间隔着引擎的一次显存探测（vllm-ascend main）">
  <title>声明趟数的是层，分配趟数的是字节，中间隔着引擎的一次显存探测（vllm-ascend main）</title>
