  <text x="20" y="478" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="13.5" font-weight="600" fill="var(--color-ink, #17211f)">声明趟数的是层，分配趟数的是字节。倒过来做不行：分配之前必须先知道单价。</text>
  <text x="20" y="572" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="13.5" font-weight="600" fill="var(--color-ink, #17211f)">一层的那份预算，落到显存里是两条互不相干的 int8 张量——首维那个 2 只活在形状里。</text>
  <text x="20" y="678" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="12.5" font-weight="400" fill="var(--color-ink-muted, #5b6763)">块大小、KV 头数、头维、dtype 这四项是模型定的，引擎只做一次除法。量化之所以能直接换成显存，就是因为它改的是这个除数。</text>
