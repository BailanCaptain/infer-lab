layout: figure
id: kv-cache-spec
caption: 每层先交一份规格。按位置增长的状态，一页等于「一个逻辑块的位置数 × 每个位置的字节」；每条请求只有一份的状态，一页就是整份状态。页再补到两档大小之一（斜线是补出来的空白），最后把页大小和管理方式都相同的层编成缓存组，同组共用一张块号清单。大页里的竖线是 kernel 块的边界。两档页各自按比例画，两档之间不按比例。
size: [900, 430]
dividers:
  - { from: [24, 222], to: [876, 222], sides: [按位置增长, 每条请求一份] }
items:
