  - { at: [24, 132], size: [236, 56], text: indexer K, sub: 几个位置压成一条再存, tone: kv }
  - { at: [24, 256], size: [236, 56], text: indexer 尾状态, sub: 还没凑满一条的那几个位置, tone: kv }
  - { at: [24, 336], size: [236, 56], text: KDA 状态, sub: 卷积历史 + 递推矩阵，和长度无关, tone: kv }
  - { at: [690, 86], size: [186, 60], text: full 组, sub: MLA 与 indexer K 成对, tone: control, style: plain }
  - { at: [690, 256], size: [186, 56], text: 尾状态组, sub: 一块只管几个位置, tone: control, style: plain }
  - { at: [690, 336], size: [186, 56], text: KDA 组, sub: 按层交错拆成几组, tone: control, style: plain }
