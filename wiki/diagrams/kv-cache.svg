<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 850 355" width="850" height="355" role="img" aria-label="一个请求的按位置缓存：本步写入新输入的状态，读取已有历史与本步状态；下一步继续使用追加后的历史">
  <title>一个请求的按位置缓存：本步写入新输入的状态，读取已有历史与本步状态；下一步继续使用追加后的历史</title>
  <defs><marker id="kv-cache-ah-kv" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="var(--color-kv, #4c65b6)"/></marker><marker id="kv-cache-ah-token" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="var(--color-token, #087f73)"/></marker></defs>
  <path d="M135 94 L135 153" fill="none" stroke="var(--color-kv, #4c65b6)" stroke-width="1.4" marker-end="url(#kv-cache-ah-kv)"/>
  <path d="M425 94 L425 153" fill="none" stroke="var(--color-token, #087f73)" stroke-width="1.4" marker-end="url(#kv-cache-ah-token)"/>
  <path d="M535 183 L620 183" fill="none" stroke="var(--color-kv, #4c65b6)" stroke-width="1.4" marker-end="url(#kv-cache-ah-kv)"/>
  <path d="M535 66 L720 66 L720 153" fill="none" stroke="var(--color-token, #087f73)" stroke-width="1.4" marker-end="url(#kv-cache-ah-token)"/>
  <path d="M282 213 L282 274" fill="none" stroke="var(--color-kv, #4c65b6)" stroke-width="1.4" marker-end="url(#kv-cache-ah-kv)"/>
  <rect x="30" y="38" width="210" height="56" rx="8" fill="var(--color-kv, #4c65b6)" stroke="var(--color-ink, #17211f)" stroke-width="1.5"/>
  <text x="135" y="62" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="14" font-weight="700" fill="var(--color-ink-inverse, #ffffff)" text-anchor="middle">已有历史</text>
  <text x="135" y="81" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="13" font-weight="400" fill="var(--color-ink-inverse, #ffffff)" text-anchor="middle">已算好的 K / V</text>
  <rect x="315" y="38" width="220" height="56" rx="8" fill="var(--color-token, #087f73)" stroke="var(--color-ink, #17211f)" stroke-width="1.5"/>
  <text x="425" y="62" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="14" font-weight="700" fill="var(--color-ink-inverse, #ffffff)" text-anchor="middle">本步新输入 token</text>
  <text x="425" y="81" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="13" font-weight="400" fill="var(--color-ink-inverse, #ffffff)" text-anchor="middle">算出本位置的 K / V</text>
  <rect x="30" y="153" width="505" height="60" rx="8" fill="var(--color-kv, #4c65b6)" stroke="var(--color-ink, #17211f)" stroke-width="1.5"/>
  <text x="282.5" y="179" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="14" font-weight="700" fill="var(--color-ink-inverse, #ffffff)" text-anchor="middle">追加后的历史</text>
  <text x="282.5" y="198" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="13" font-weight="400" fill="var(--color-ink-inverse, #ffffff)" text-anchor="middle">原有 K / V 保留 ＋ 本位置 K / V 写入</text>
  <rect x="620" y="153" width="200" height="60" rx="8" fill="var(--color-control, #66716d)" stroke="var(--color-ink, #17211f)" stroke-width="1.5"/>
  <text x="720" y="179" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="14" font-weight="700" fill="var(--color-ink-inverse, #ffffff)" text-anchor="middle">本步注意力</text>
  <text x="720" y="198" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="13" font-weight="400" fill="var(--color-ink-inverse, #ffffff)" text-anchor="middle">用查询读取历史</text>
  <rect x="30" y="274" width="505" height="54" rx="8" fill="var(--color-kv, #4c65b6)" stroke="var(--color-ink, #17211f)" stroke-width="1.5"/>
  <text x="282.5" y="297" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="14" font-weight="700" fill="var(--color-ink-inverse, #ffffff)" text-anchor="middle">下一步继续读取这份历史</text>
  <text x="282.5" y="316" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="13" font-weight="400" fill="var(--color-ink-inverse, #ffffff)" text-anchor="middle">再接入下一个新输入</text>
  <text x="150" y="127" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="13" font-weight="400" fill="var(--color-ink, #17211f)">保留</text>
  <text x="439" y="127" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="13" font-weight="400" fill="var(--color-ink, #17211f)">追加</text>
  <text x="549" y="167" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="13" font-weight="400" fill="var(--color-ink, #17211f)">读取</text>
  <text x="565" y="50" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="13" font-weight="400" fill="var(--color-ink, #17211f)">本步查询</text>
  <text x="300" y="248" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="13" font-weight="400" fill="var(--color-ink, #17211f)">跨步保存</text>
</svg>
