<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 594" width="900" height="594" role="img" aria-label="AscendStore 键碰撞反例与上游 MooncakeStore 四类资源归属比例条" font-family="var(--font-sans)">
  <title>AscendStore 记录键碰撞反例（同名目录换权重、TP8→TP4 撞卡号）与 MooncakeStore 四类资源归属比例条</title>
  <desc>AscendStoreConnector, SupportsHMA, configure_dspark_prefix_cache, DSparkPrefixKeys, MooncakeStoreConnector, _validate_kv_cache_config</desc>
  <defs>
    <marker id="kvp-arr-danger" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0 1.5L9 5L0 8.5z" fill="#b54237"/>
    </marker>
    <marker id="kvp-arr-plum" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0 1.5L9 5L0 8.5z" fill="#9a4b86"/>
    </marker>
  </defs>

  <!-- Zone 1: Key Anatomy & Two Collision Counterexamples -->
  <circle cx="24" cy="24" r="12" fill="#b54237"/>
  <text x="24" y="28.5" text-anchor="middle" font-size="12.5" font-weight="700" fill="#ffffff">1</text>
  <text x="44" y="30" font-size="16" font-weight="700" fill="#17211f">AscendStore 记录键解剖与两类真实撞键反例（名字对上 ≠ 内容兼容）</text>

  <!-- Key field anatomy chips -->
  <g stroke="#4c65b6" stroke-width="1.3" fill="#e8edff">
    <rect x="16" y="46" width="114" height="32" rx="5"/>
    <rect x="138" y="46" width="76" height="32" rx="5"/>
    <rect x="222" y="46" width="112" height="32" rx="5"/>
    <rect x="342" y="46" width="84" height="32" rx="5"/>
    <rect x="434" y="46" width="96" height="32" rx="5"/>
    <rect x="538" y="46" width="112" height="32" rx="5"/>
  </g>
  <g text-anchor="middle" font-size="13.5" font-weight="700" fill="#3a4f93">
    <text x="73" y="67">末级目录名</text>
    <text x="176" y="67">dcp 编号</text>
    <text x="278" y="67">头号 / 卡号</text>
    <text x="384" y="67">缓存组</text>
    <text x="482" y="67">状态种类</text>
    <text x="594" y="67">内容指纹</text>
  </g>
  <!-- Missing fields badge -->
  <rect x="662" y="46" width="222" height="32" rx="5" fill="#fff0e9" stroke="#b54237" stroke-width="1.4" stroke-dasharray="4 3"/>
  <text x="773" y="67" text-anchor="middle" font-size="13.5" font-weight="700" fill="#8f3229">缺失：权重版本 &amp; TP 总数</text>

  <!-- Counterexample A: Same leaf directory after weight swap -->
  <rect x="16" y="94" width="418" height="202" rx="8" fill="#fff0e9" stroke="#b54237" stroke-width="1.5"/>
  <text x="30" y="119" font-size="15" font-weight="700" fill="#8f3229">反例 A · 换权重但末级目录同名 → 静默读旧 KV</text>

  <rect x="30" y="134" width="192" height="36" rx="5" fill="#ffffff" stroke="#b54237" stroke-width="1.2"/>
  <text x="126" y="157" text-anchor="middle" font-size="13.5" font-family="var(--font-mono)" fill="#17211f">/ckpt/v1/Qwen3-8B</text>
  <rect x="30" y="180" width="192" height="36" rx="5" fill="#ffffff" stroke="#087f73" stroke-width="1.2"/>
  <text x="126" y="203" text-anchor="middle" font-size="13.5" font-family="var(--font-mono)" fill="#17211f">/ckpt/v2/Qwen3-8B</text>

  <path d="M222 152 H256 V174 H280 M222 198 H256 V174" fill="none" stroke="#b54237" stroke-width="1.6" marker-end="url(#kvp-arr-danger)"/>
  <rect x="286" y="148" width="134" height="54" rx="6" fill="#fff4cf" stroke="#c78300" stroke-width="1.4"/>
  <text x="353" y="171" text-anchor="middle" font-size="13.5" font-weight="700" fill="#936300">截取末级名</text>
  <text x="353" y="192" text-anchor="middle" font-size="13.5" font-family="var(--font-mono)" font-weight="700" fill="#8f3229">Qwen3-8B</text>

  <text x="30" y="244" font-size="13.5" fill="#17211f">两份不同权重算出完全相同的键（键不含权重哈希）</text>
  <text x="30" y="268" font-size="13.5" fill="#4d5652">读回旧权重 KV 不会报 KeyError，表现为静默精度崩坏</text>
  <text x="30" y="288" font-size="13.5" font-weight="700" fill="#8f3229">对策：换权重须清池或换命名空间（cache_salt）</text>

  <!-- Counterexample B: TP8 -> TP4 rank-ID collision -->
  <rect x="450" y="94" width="434" height="202" rx="8" fill="#fff4cf" stroke="#c78300" stroke-width="1.5"/>
  <text x="464" y="119" font-size="15" font-weight="700" fill="#936300">反例 B · TP8 → TP4 按卡号起名碰撞（8 个 KV 头）</text>

  <!-- TP8 row: 8 single-head cells -->
  <text x="464" y="154" font-size="13.5" font-weight="700" fill="#3a4f93">TP8 写入</text>
  <rect x="536" y="136" width="40" height="28" rx="3" fill="#b54237" fill-opacity="0.22" stroke="#b54237" stroke-width="1.5"/>
  <text x="556" y="155" text-anchor="middle" font-size="13.5" font-weight="700" fill="#8f3229">H0</text>
  <g fill="#e8edff" stroke="#4c65b6" stroke-width="1.2">
    <rect x="578" y="136" width="40" height="28" rx="3"/>
    <rect x="620" y="136" width="40" height="28" rx="3"/>
    <rect x="662" y="136" width="40" height="28" rx="3"/>
    <rect x="704" y="136" width="40" height="28" rx="3"/>
    <rect x="746" y="136" width="40" height="28" rx="3"/>
    <rect x="788" y="136" width="40" height="28" rx="3"/>
    <rect x="830" y="136" width="40" height="28" rx="3"/>
  </g>
  <g text-anchor="middle" font-size="13.5" fill="#4d5652">
    <text x="598" y="155">H1</text><text x="640" y="155">H2</text><text x="682" y="155">H3</text>
    <text x="724" y="155">H4</text><text x="766" y="155">H5</text><text x="808" y="155">H6</text><text x="850" y="155">H7</text>
  </g>

  <!-- TP4 row: 4 double-head cells -->
  <text x="464" y="198" font-size="13.5" font-weight="700" fill="#065f56">TP4 读取</text>
  <rect x="536" y="180" width="82" height="28" rx="3" fill="#fff0e9" stroke="#b54237" stroke-width="1.6"/>
  <text x="577" y="199" text-anchor="middle" font-size="13.5" font-weight="700" fill="#8f3229">H0 + H1</text>
  <g fill="#ddf4ef" stroke="#087f73" stroke-width="1.2">
    <rect x="620" y="180" width="82" height="28" rx="3"/>
    <rect x="704" y="180" width="82" height="28" rx="3"/>
    <rect x="788" y="180" width="82" height="28" rx="3"/>
  </g>
  <g text-anchor="middle" font-size="13.5" fill="#065f56">
    <text x="661" y="199">H2 + H3</text><text x="745" y="199">H4 + H5</text><text x="829" y="199">H6 + H7</text>
  </g>

  <text x="464" y="244" font-size="13.5" fill="#17211f">卡 0–3 均拼出相同键 <tspan font-family="var(--font-mono)" font-weight="700">rank=0..3</tspan>（键不含 TP 总数）</text>
  <text x="464" y="268" font-size="13.5" fill="#8f3229">但每卡切片从 1 个头变成 2 个头 → 形状与内容不兼容</text>
  <text x="464" y="288" font-size="13.5" fill="#66716d">特例：单 KV 头（MLA）全取 0；main 拆出 layerwise/ 子包</text>

  <!-- Divider -->
  <line x1="16" y1="312" x2="884" y2="312" stroke="#d8d8cf" stroke-width="1.4" stroke-dasharray="6 4"/>

  <!-- Zone 2: 4-Resource Ownership Bars (embedded 32+4 vs standalone 0+4 + Owner SSD 1280 MiB) -->
  <circle cx="24" cy="336" r="12" fill="#9a4b86"/>
  <text x="24" y="340.5" text-anchor="middle" font-size="12.5" font-weight="700" fill="#ffffff">2</text>
  <text x="44" y="342" font-size="16" font-weight="700" fill="#17211f">上游 MooncakeStore 四类资源归属（4 rank 示意：每卡 8 GiB 池 + 1 GiB 私有缓冲）</text>

  <!-- Row A: embedded (32 + 4 = 36 GiB inside vLLM) -->
  <text x="16" y="382" font-size="14.5" font-weight="700" fill="#3a4f93">embedded</text>
  <text x="16" y="402" font-size="13.5" fill="#66716d">默认 · 进程自带</text>

  <!-- Scale: 12 px/GiB -> 32 GiB = 384px, 4 GiB = 48px -->
  <rect x="148" y="364" width="384" height="44" rx="5" fill="#e8edff" stroke="#4c65b6" stroke-width="1.5"/>
  <text x="340" y="391" text-anchor="middle" font-size="14" font-weight="700" fill="#3a4f93">vLLM 贡献池：4 × 8 = 32 GiB</text>
  <rect x="536" y="364" width="76" height="44" rx="5" fill="#ddf4ef" stroke="#087f73" stroke-width="1.5"/>
  <text x="574" y="391" text-anchor="middle" font-size="13.5" font-weight="700" fill="#065f56">4 GiB</text>
  <text x="624" y="382" font-size="14" font-weight="700" fill="#17211f">vLLM 侧合计 36 GiB</text>
  <text x="624" y="402" font-size="13.5" fill="#66716d">推理退出即释放池内存</text>

  <!-- Row B: standalone-store (0 + 4 inside vLLM; 32 GiB + 1,280 MiB staging in Owner Client) -->
  <text x="16" y="446" font-size="14.5" font-weight="700" fill="#7a3a6a">standalone</text>
  <text x="16" y="466" font-size="13.5" fill="#66716d">独立池进程</text>

  <rect x="148" y="428" width="66" height="44" rx="5" fill="#ece9df" stroke="#b8bcb5" stroke-width="1.3" stroke-dasharray="3 2"/>
  <text x="181" y="455" text-anchor="middle" font-size="13.5" fill="#66716d">池 0 G</text>
  <rect x="218" y="428" width="76" height="44" rx="5" fill="#ddf4ef" stroke="#087f73" stroke-width="1.5"/>
  <text x="256" y="455" text-anchor="middle" font-size="13.5" font-weight="700" fill="#065f56">4 GiB</text>

  <line x1="296" y1="450" x2="346" y2="450" stroke="#9a4b86" stroke-width="2" marker-end="url(#kvp-arr-plum)"/>

  <!-- Owner Client box -->
  <rect x="352" y="422" width="532" height="56" rx="7" fill="#f7e7f2" stroke="#9a4b86" stroke-width="1.5"/>
  <rect x="364" y="432" width="246" height="36" rx="5" fill="#ffffff" stroke="#9a4b86" stroke-width="1.3"/>
  <text x="487" y="455" text-anchor="middle" font-size="13.5" font-weight="700" fill="#7a3a6a">Owner Client 独立主机池：32 GiB</text>
  <rect x="618" y="432" width="254" height="36" rx="5" fill="#fff0e9" stroke="#b54237" stroke-width="1.5"/>
  <text x="745" y="455" text-anchor="middle" font-size="13.5" font-weight="700" fill="#8f3229">SSD 暂存分批预算：1,280 MiB</text>

  <!-- 4-Resource Separation Summary Strip -->
  <g stroke-width="1.3">
    <rect x="16" y="498" width="194" height="82" rx="6" fill="#e8edff" stroke="#4c65b6"/>
    <rect x="224" y="498" width="206" height="82" rx="6" fill="#ddf4ef" stroke="#087f73"/>
    <rect x="444" y="498" width="206" height="82" rx="6" fill="#f7e7f2" stroke="#9a4b86"/>
    <rect x="664" y="498" width="220" height="82" rx="6" fill="#fff0e9" stroke="#b54237"/>
  </g>
  <g font-size="13.5">
    <text x="28" y="521" font-weight="700" fill="#3a4f93">① 设备侧 NPU KV 块</text>
    <text x="28" y="544" fill="#4d5652">取回的数据照占显存</text>
    <text x="28" y="566" fill="#66716d">池不扩大显存块池</text>

    <text x="236" y="521" font-weight="700" fill="#065f56">② vLLM 私有缓冲 (4 G)</text>
    <text x="236" y="544" fill="#4d5652">local_buffer_size 必正</text>
    <text x="236" y="566" fill="#66716d">调大它救不了存储暂存</text>

    <text x="456" y="521" font-weight="700" fill="#7a3a6a">③ 共享主机池 (32 G)</text>
    <text x="456" y="544" fill="#4d5652">独立持有≠持久不淘汰</text>
    <text x="456" y="566" fill="#66716d">master 只管元数据协调</text>

    <text x="676" y="521" font-weight="700" fill="#8f3229">④ Owner SSD 暂存</text>
    <text x="676" y="544" fill="#17211f">单 key &gt; 1,280 MiB</text>
    <text x="676" y="566" font-weight="700" fill="#8f3229">直接拒载并记失败块</text>
  </g>
</svg>
