<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 640" width="900" height="640" role="img" aria-label="固定 GLM 镜像的非逐层同步池路径。图中沿池有额外命中、本地分配成功的分支往下走；查询命中只是计划，失败报告仍受单组/多组限制。旧镜像在本步末等发送队列排空，后续版本的等待点见版本表。">
  <title>固定 GLM 镜像的非逐层同步池路径。图中沿池有额外命中、本地分配成功的分支往下走；查询命中只是计划，失败报告仍受单组/多组限制。旧镜像在本步末等发送队列排空，后续版本的等待点见版本表。</title>
  <defs><marker id="kv-pool-flow-ah-control" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="var(--color-control, #66716d)"/></marker></defs>
  <rect x="20" y="35" width="550" height="180" rx="16" fill="none" stroke="var(--color-line-strong, #b8bcb5)" stroke-width="1.5"/>
  <text x="36" y="23" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="15" font-weight="700" fill="var(--color-ink, #17211f)">主线第 2 站：调度与分配</text>
  <rect x="20" y="235" width="550" height="370" rx="16" fill="none" stroke="var(--color-line-strong, #b8bcb5)" stroke-width="1.5"/>
  <text x="36" y="223" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="15" font-weight="700" fill="var(--color-ink, #17211f)">主线第 3–4 站：准备输入与逐层前向</text>
  <path d="M295 117 L295 141" fill="none" stroke="var(--color-control, #66716d)" stroke-width="1.4" marker-end="url(#kv-pool-flow-ah-control)"/>
  <path d="M295 197 L295 261" fill="none" stroke="var(--color-control, #66716d)" stroke-width="1.4" marker-end="url(#kv-pool-flow-ah-control)"/>
  <path d="M295 317 L295 346" fill="none" stroke="var(--color-control, #66716d)" stroke-width="1.4" marker-end="url(#kv-pool-flow-ah-control)"/>
  <path d="M295 402 L295 431" fill="none" stroke="var(--color-control, #66716d)" stroke-width="1.4" marker-end="url(#kv-pool-flow-ah-control)"/>
  <path d="M295 487 L295 516" fill="none" stroke="var(--color-control, #66716d)" stroke-width="1.4" marker-end="url(#kv-pool-flow-ah-control)"/>
  <path d="M545 291 L606 291" fill="none" stroke="var(--color-control, #66716d)" stroke-width="1.4" stroke-dasharray="7 5" marker-end="url(#kv-pool-flow-ah-control)"/>
  <rect x="45" y="65" width="500" height="52" rx="8" fill="var(--color-surface-sunken, #ece9df)" stroke="var(--color-ink, #17211f)" stroke-width="1.5"/>
  <text x="295" y="87" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="14" font-weight="700" fill="var(--color-ink, #17211f)" text-anchor="middle">查询本地与外部池，计算额外命中</text>
  <text x="295" y="106" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="13" font-weight="400" fill="var(--color-ink, #17211f)" text-anchor="middle">角色与段长检查通过后才查询</text>
  <rect x="45" y="145" width="500" height="52" rx="8" fill="var(--color-kv, #4c65b6)" stroke="var(--color-ink, #17211f)" stroke-width="1.5"/>
  <text x="295" y="176" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="14" font-weight="700" fill="var(--color-ink-inverse, #ffffff)" text-anchor="middle">借本地块，记录哪些位置要从池里搬</text>
  <rect x="45" y="265" width="500" height="52" rx="8" fill="var(--color-kv, #4c65b6)" stroke="var(--color-ink, #17211f)" stroke-width="1.5"/>
  <text x="295" y="287" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="14" font-weight="700" fill="var(--color-ink-inverse, #ffffff)" text-anchor="middle">将块表换为地址与长度，调用后端加载</text>
  <text x="295" y="306" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="13" font-weight="400" fill="var(--color-ink-inverse, #ffffff)" text-anchor="middle">同步路径等待 get 返回</text>
  <rect x="45" y="350" width="500" height="52" rx="8" fill="var(--color-token, #087f73)" stroke="var(--color-ink, #17211f)" stroke-width="1.5"/>
  <text x="295" y="381" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="14" font-weight="700" fill="var(--color-ink-inverse, #ffffff)" text-anchor="middle">前向读取历史，并写入本步的新状态</text>
  <rect x="45" y="435" width="500" height="52" rx="8" fill="var(--color-kv, #4c65b6)" stroke="var(--color-ink, #17211f)" stroke-width="1.5"/>
  <text x="295" y="457" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="14" font-weight="700" fill="var(--color-ink-inverse, #ffffff)" text-anchor="middle">记录 NPU 事件，把可保存的段交给发送线程</text>
  <text x="295" y="476" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="13" font-weight="400" fill="var(--color-ink-inverse, #ffffff)" text-anchor="middle">后台 put 前先等计算事件</text>
  <rect x="45" y="520" width="500" height="52" rx="8" fill="var(--color-surface-sunken, #ece9df)" stroke="var(--color-ink, #17211f)" stroke-width="1.5"/>
  <text x="295" y="542" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="14" font-weight="700" fill="var(--color-ink, #17211f)" text-anchor="middle">本步末等待发送队列排空</text>
  <text x="295" y="561" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="13" font-weight="400" fill="var(--color-ink, #17211f)" text-anchor="middle">固定镜像的 wait_for_save</text>
  <rect x="610" y="260" width="270" height="88" rx="8" fill="var(--color-surface-sunken, #ece9df)" stroke="var(--color-ink, #17211f)" stroke-width="1.5"/>
  <text x="745" y="300" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="14" font-weight="700" fill="var(--color-ink, #17211f)" text-anchor="middle">加载失败另行处理</text>
  <text x="745" y="319" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="13" font-weight="400" fill="var(--color-ink, #17211f)" text-anchor="middle">单组上报无效块；多组只记错</text>
  <text x="610" y="375" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="13.5" font-weight="700" fill="var(--color-ink, #17211f)">查到不代表已经搬到</text>
  <text x="610" y="400" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="13.5" font-weight="400" fill="var(--color-ink-muted, #66716d)" font-style="italic">多组不能保证按默认 fail 终止</text>
  <text x="610" y="425" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="13.5" font-weight="400" fill="var(--color-ink-muted, #66716d)" font-style="italic">混合模型禁止 recompute 策略</text>
  <text x="30" y="625" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="13.5" font-weight="400" fill="var(--color-ink-muted, #66716d)" font-style="italic">未命中与分配不足回到调度决策；异步、逐层模式走各自的加载与等待分支。</text>
</svg>
