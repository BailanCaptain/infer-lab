<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 370" width="900" height="370" role="img" aria-label="假如在 GLM 双机上打开 KV Pool（本部署没开，照镜像源码推演）：一个 DP 组的 8 张卡合切每一层。full 组里的 MLA 潜向量和 indexer 缓存每卡一整份、8 卡相同，池里每块只存一条，名字里的卡号都取 0，8 张卡轮流写；KDA 的 64 个头按卡切开、每卡 8 个头，状态各不相同，3 个 KDA 组每组每块存 8 条，各带自己的卡号。">
  <title>假如在 GLM 双机上打开 KV Pool（本部署没开，照镜像源码推演）：一个 DP 组的 8 张卡合切每一层。full 组里的 MLA 潜向量和 indexer 缓存每卡一整份、8 卡相同，池里每块只存一条，名字里的卡号都取 0，8 张卡轮流写；KDA 的 64 个头按卡切开、每卡 8 个头，状态各不相同，3 个 KDA 组每组每块存 8 条，各带自己的卡号。</title>
