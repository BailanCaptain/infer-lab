layout: figure
id: kv-pool-intuition
caption: 两台推理实例接着同一个外部 KV 池。① 请求 A 在实例 1 上算完开头三段，经 KV connector 写进池，每段按内容指纹登记。② 请求 B 落在实例 2，开头与 A 相同，本地显存里一段也没有，connector 去池里查，得知前三段都在。③ 把这三段搬回实例 2 的显存。④ B 只算自己不同的尾巴。实例数、段数都是示意。
