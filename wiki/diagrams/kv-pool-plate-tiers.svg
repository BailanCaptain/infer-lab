<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 672" width="900" height="672" role="img" aria-label="KV Pool 多级存储剖面立体拆解图：展示 NPU HBM、HOST DRAM 与 SHARED KV POOL（含 SSD 扩展层）之间的分级搬运与显存直传关系" font-family="var(--font-sans)">
  <title>KV Pool 多级存储与跨实例共享池立体拆解：本地 NPU HBM 缓存热点前缀，HOST DRAM 承载本机内存与私有操作缓冲，SHARED KV POOL 将跨实例 DRAM 与 SSD 拼成统一外部前缀池，由 AscendStore 或上游 MooncakeStore 按内容指纹存取。</title>
  <desc>AscendStoreConnector, SupportsHMA, MooncakeStoreConnector, get_num_new_matched_tokens</desc>

  <!-- 紧裁透明底等距拆解剖面主图（1200x696 -> 740x429，无外层底框、直浮画布） -->
  <image href="./wiki-illustrations/kv-pool-tiers-cutaway.webp" x="80" y="128" width="740" height="429" preserveAspectRatio="xMidYMid meet"/>

  <!-- 非交叉矢量引线与双环靶点 -->
  <!-- 1 -> NPU HBM 顶部块阵 -->
  <line x1="180" y1="114" x2="180" y2="210" stroke="#4c65b6" stroke-width="1.6"/>
  <circle cx="180" cy="210" r="5.5" fill="#ffffff" stroke="#4c65b6" stroke-width="2"/>
  <circle cx="180" cy="210" r="2.5" fill="#4c65b6"/>

  <!-- 2 -> HOST DRAM 内存插槽 -->
  <line x1="448" y1="114" x2="448" y2="246" stroke="#087f73" stroke-width="1.6"/>
  <circle cx="448" cy="246" r="5.5" fill="#ffffff" stroke="#087f73" stroke-width="2"/>
  <circle cx="448" cy="246" r="2.5" fill="#087f73"/>

  <!-- 3 -> SHARED KV POOL 上排缓存机架（走 SHARED 字样左侧空隙，不遮位图标签） -->
  <line x1="612" y1="114" x2="612" y2="368" stroke="#c78300" stroke-width="1.6"/>
  <circle cx="612" cy="368" r="5.5" fill="#ffffff" stroke="#c78300" stroke-width="2"/>
  <circle cx="612" cy="368" r="2.5" fill="#c78300"/>

  <!-- 4 -> NPU 与 HOST 之间的传输块通道（走左下空白区 L 型引线，零交叉） -->
  <path d="M206 558 V248 H258" fill="none" stroke="#9a4b86" stroke-width="1.6"/>
  <circle cx="258" cy="248" r="5.5" fill="#ffffff" stroke="#9a4b86" stroke-width="2"/>
  <circle cx="258" cy="248" r="2.5" fill="#9a4b86"/>

  <!-- 5 -> SHARED KV POOL 内部 SSD 盘位 -->
  <line x1="576" y1="558" x2="576" y2="468" stroke="#b54237" stroke-width="1.6"/>
  <circle cx="576" cy="468" r="5.5" fill="#ffffff" stroke="#b54237" stroke-width="2"/>
  <circle cx="576" cy="468" r="2.5" fill="#b54237"/>

  <!-- 顶部开放式无边框矢量编号直标（标题 15px，说明 13.5px） -->
  <g id="callout-hbm">
    <circle cx="18" cy="26" r="12" fill="#4c65b6"/>
    <text x="18" y="30.5" text-anchor="middle" font-size="12.5" font-weight="700" fill="#ffffff">1</text>
    <text x="36" y="31" font-size="15" font-weight="700" fill="#17211f">NPU HBM 本地前缀层</text>
    <text x="36" y="56" font-size="13.5" fill="#4d5652">最快但容量最小，仅本实例可见</text>
    <text x="36" y="79" font-size="13.5" fill="#4d5652">调度先查本地 prefix caching</text>
    <text x="36" y="102" font-size="13.5" fill="#3a4f93">取回的外部块仍占本地块表</text>
  </g>

  <g id="callout-dram">
    <circle cx="314" cy="26" r="12" fill="#087f73"/>
    <text x="314" y="30.5" text-anchor="middle" font-size="12.5" font-weight="700" fill="#ffffff">2</text>
    <text x="332" y="31" font-size="15" font-weight="700" fill="#17211f">HOST DRAM 主机内存层</text>
    <text x="332" y="56" font-size="13.5" fill="#4d5652">承载本机贡献的池段或私有缓冲</text>
    <text x="332" y="79" font-size="13.5" fill="#4d5652">独立池下仍须保留 <tspan font-family="var(--font-mono)" font-weight="700">local_buffer</tspan></text>
    <text x="332" y="102" font-size="13.5" fill="#065f56">按 rank 累加，不随池外移归零</text>
  </g>

  <g id="callout-pool">
    <circle cx="608" cy="26" r="12" fill="#c78300"/>
    <text x="608" y="30.5" text-anchor="middle" font-size="12.5" font-weight="700" fill="#ffffff">3</text>
    <text x="626" y="31" font-size="15" font-weight="700" fill="#17211f">SHARED KV POOL 共享池</text>
    <text x="626" y="56" font-size="13.5" fill="#4d5652">多机同键共享，消除跨实例落空</text>
    <text x="626" y="79" font-size="13.5" fill="#4d5652">只认写满整段，全中仍留 1 位自算</text>
    <text x="626" y="102" font-size="13.5" fill="#936300">支持 Mooncake / Memcache / Yuanrong</text>
  </g>

  <!-- 底部开放式无边框矢量编号直标 -->
  <g id="callout-transfer">
    <circle cx="24" cy="580" r="12" fill="#9a4b86"/>
    <text x="24" y="584.5" text-anchor="middle" font-size="12.5" font-weight="700" fill="#ffffff">4</text>
    <text x="44" y="585" font-size="15" font-weight="700" fill="#17211f">已登记显存区间直传（<tspan font-family="var(--font-mono)">AscendStoreConnector</tspan>）</text>
    <text x="44" y="611" font-size="14" fill="#4d5652">启动时登记 KV 显存，查询只补「池连续命中 − 本地命中」的整段</text>
    <text x="44" y="636" font-size="14" fill="#4d5652">单头 MLA 跨卡同键只存一份；按头切分状态按卡号分开存</text>
    <text x="44" y="660" font-size="13.5" fill="#7a3a6a">代价：同步加载等待计入本步前向；换权重或改 TP 须清空防撞键</text>
  </g>

  <g id="callout-ssd">
    <circle cx="476" cy="580" r="12" fill="#b54237"/>
    <text x="476" y="584.5" text-anchor="middle" font-size="12.5" font-weight="700" fill="#ffffff">5</text>
    <text x="496" y="585" font-size="15" font-weight="700" fill="#17211f">SSD 扩展层与存储端暂存预算边界</text>
    <text x="496" y="611" font-size="14" fill="#4d5652">SSD 扩充冷前缀容量，读取仍须经存储端主机暂存区中转</text>
    <text x="496" y="636" font-size="14" fill="#4d5652">上游 <tspan font-family="var(--font-mono)" font-weight="700">MooncakeStoreConnector</tspan> 按 1,280 MiB 分批校验</text>
    <text x="496" y="660" font-size="13.5" fill="#8f3229">AscendStore 按 global rank 建子目录，多服务须分设根目录</text>
  </g>
</svg>
