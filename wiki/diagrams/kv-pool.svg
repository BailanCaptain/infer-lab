<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 350" width="900" height="350" role="img" aria-label="请求 A 有 24 个位置，每段 4 个位置（示意）。本地 prefix caching 已命中前 2 段（8 个位置），池里连续命中到前 5 段（20 个位置）；只有第 3–5 段要从池里搬回，最后一段池里没有，自己算。">
  <title>请求 A 有 24 个位置，每段 4 个位置（示意）。本地 prefix caching 已命中前 2 段（8 个位置），池里连续命中到前 5 段（20 个位置）；只有第 3–5 段要从池里搬回，最后一段池里没有，自己算。</title>
