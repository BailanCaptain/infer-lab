  <text x="289" y="56" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="13.5" font-weight="400" fill="var(--color-ink, #17211f)" text-anchor="middle">本地命中 8 个位置</text>
  <text x="751" y="56" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="13.5" font-weight="400" fill="#065f56" text-anchor="middle">自己算 4 个位置</text>
