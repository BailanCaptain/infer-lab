  <text x="38" y="287" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="12.5" font-weight="400" fill="var(--color-ink-muted, #5b6763)">存储客户端只在这里。REP 后台线程替调度器查表，主线程在前向前后搬数据。</text>
