timelines:
  - at: [24, 284]
    scale: 72
    start: 0
    end: 11
    labelW: 72
    laneH: 30
    gap: 12
    lanes:
      - label: 计算
        spans:
          - { from: 0, to: 1, tone: token, style: faded, text: 层 0 投影 }
          - { from: 1, to: 2, tone: danger, style: hatch, text: 等广播 }
          - { from: 2, to: 4, tone: token, text: 层 0 attention 及其余 }
          - { from: 4, to: 5, tone: token, style: faded, text: 层 1 投影 }
          - { from: 5, to: 7, tone: token, text: 层 1 attention 及其余 }
          - { from: 7, to: 8, tone: token, style: faded, text: 层 2 投影 }
          - { from: 8, to: 10, tone: token, text: 层 2 attention 及其余 }
      - label: 广播接收
        spans:
          - { from: 0, to: 2, tone: comm, text: 层 0 → 暂存 A }
          - { from: 2, to: 4.5, tone: comm, text: 层 1 → 暂存 B }
          - { from: 5, to: 7.5, tone: comm, text: 层 2 → 暂存 A }
          - { from: 8, to: 10.5, tone: comm, text: 层 3 → 暂存 B }
    marks:
      - { t: 2, label: 层 0 到位，发层 1 }
      - { t: 5, label: 层 1 已到，发层 2 }
