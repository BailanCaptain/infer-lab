layout: figure
id: kvpp-broadcast
caption: 示意，沿用上一张图的 8 层、4 卡。上排：算到第 2 层时，常驻卡 1 把这一层所有已分配的块整层广播出去，卡 0、2、3 收进暂存区 A；4 张卡随后各算自己那几个头，卡 1 直接用常驻的那份。下排按 MLA 路径示意：广播在单独的流上提前一层；第 0 层也可用投影计算遮挡一部分，只有未完成的部分暴露为等待。SFA 融合路径的等待点在融合预处理之前。暂存 A、B 轮流使用，时长为示意。
size: [900, 410]
texts:
  - { at: [24, 22], text: "算到第 2 层：卡 1 整层广播，其余 3 张卡收进暂存区", strong: true }
  - { at: [24, 256], text: "站在卡 3 看时间：广播提前一层", strong: true }
frames:
  - { at: [24, 76], size: [200, 150], label: 卡 0 }
  - { at: [242, 76], size: [200, 150], label: 卡 1 }
  - { at: [460, 76], size: [200, 150], label: 卡 2 }
  - { at: [678, 76], size: [200, 150], label: 卡 3 }
items:
  - { at: [40, 110], size: [168, 40], text: 暂存 A：第 2 层副本, tone: kv, style: faded }
  - { at: [258, 110], size: [168, 40], text: 常驻：第 2、3 层, tone: kv, style: solid }
  - { at: [476, 110], size: [168, 40], text: 暂存 A：第 2 层副本, tone: kv, style: faded }
  - { at: [694, 110], size: [168, 40], text: 暂存 A：第 2 层副本, tone: kv, style: faded }
  - { at: [40, 170], size: [168, 40], text: 算第 2 层：本卡的头, tone: token, style: plain }
  - { at: [258, 170], size: [168, 40], text: 算第 2 层：本卡的头, tone: token, style: plain }
  - { at: [476, 170], size: [168, 40], text: 算第 2 层：本卡的头, tone: token, style: plain }
  - { at: [694, 170], size: [168, 40], text: 算第 2 层：本卡的头, tone: token, style: plain }
