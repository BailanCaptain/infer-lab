<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 495" width="900" height="495" role="img" aria-label="固定 main 上 KVPP 的代码走向。上两排在启动时走一次：开关打开、组大小大于1才做检查；随后建组、分常驻层、按常驻与MTP及两暂存区算有效缓存块数，再换回逻辑字节报给引擎，分配时另有对齐余量。下排按MLA路径示意：本批没有历史、试跑或测显存时不广播；否则开头先发第0层，在首次访问缓存前等本层到位，随即发下一层。SFA融合路径在融合预处理前等待。">
  <title>固定 main 上 KVPP 的代码走向。上两排在启动时走一次：开关打开、组大小大于1才做检查；随后建组、分常驻层、按常驻与MTP及两暂存区算有效缓存块数，再换回逻辑字节报给引擎，分配时另有对齐余量。下排按MLA路径示意：本批没有历史、试跑或测显存时不广播；否则开头先发第0层，在首次访问缓存前等本层到位，随即发下一层。SFA融合路径在融合预处理前等待。</title>
