layout: figure
id: kvpp-flow
caption: vllm-ascend main 上 KVPP 的代码走向。上两排在启动时走一次：开关打开、组大小大于 1 才做启动检查，不满足任何一条就报错退出；随后建通信组、把层分给常驻卡、按「常驻 + MTP + 2 个最大层」算块数，再换回逻辑字节报给引擎，最后按块数分配并给每个attention 层挂上等待点。下排是每步前向：本批没有任何带历史的请求（全新 prefill、启动试跑、测显存）就整步不广播；否则开头先发第 0 层，每层在投影之后等本层到位，随即发下一层。
size: [900, 470]
dividers:
  - { from: [24, 262], to: [876, 262], sides: [启动时走一次, 每步前向都走] }
