layout: figure
id: kvpp
caption: 示意：一个 8 层的模型用 TP 分到 4 张卡。上排左边是不开 KVPP，每张卡都存全部 8 层的历史，内容一样；右边是开 KVPP，第 0、1 层只由卡 0 长期保存，第 2、3 层归卡 1，依此类推，每张卡另留 2 个暂存区。下排是新 token 往下算的顺序：每到一层，先由这一层的常驻卡把历史广播给另外 3 张卡，然后 4 张卡照旧各算自己那一份。
size: [900, 470]
texts:
  - { at: [24, 26], text: "不开 KVPP：4 张卡各存一整份", strong: true }
  - { at: [470, 26], text: "开 KVPP：每层只由一张卡常驻", strong: true }
  - { at: [30, 53], text: 层号, note: true }
  - { at: [476, 53], text: 层号, note: true }
  - { at: [24, 244], text: "新 token 逐层往下算：每层的历史由这层的常驻卡发来", strong: true }
  - { at: [24, 418], text: "以第 2 层为例：卡 1 常驻这一层，把它整层发给卡 0、2、3 的暂存区；随后 4 张卡照旧各算自己那几个头，TP 分工不变。", note: true, width: 850 }
  - { at: [24, 446], text: "暂存区里的副本用完就让给后面的层；只有常驻卡上的那份一直保留。", note: true, width: 850 }
