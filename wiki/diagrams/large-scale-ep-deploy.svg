<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 466" width="900" height="466" role="img" aria-label="vllm-ascend 官方示例（DeepSeek-R1，8 台 Atlas 800T A3，每台按 16 个可见逻辑设备计数）。P 一侧 4 台各自是一个 EP16，彼此不交换 token；D 一侧 4 台合成一个 EP64，每层 64 个 rank 一起交换。proxy 只挑服务、转交传输参数，KV cache 由连接器从 P 直接传到 D。">
  <title>vllm-ascend 官方示例（DeepSeek-R1，8 台 Atlas 800T A3，每台按 16 个可见逻辑设备计数）。P 一侧 4 台各自是一个 EP16，彼此不交换 token；D 一侧 4 台合成一个 EP64，每层 64 个 rank 一起交换。proxy 只挑服务、转交传输参数，KV cache 由连接器从 P 直接传到 D。</title>
