<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 568" width="900" height="568" role="img" aria-label="大规模 EP 三平面集群拓扑、跨机分层通信对比、拖尾概率柱状图与跳过 DP 同步逻辑门图" font-family="var(--font-sans)">
  <title>大规模 EP：外置路由与 P/D 专家域拓扑、A2 分层通信对比与跳过 DP 同步守卫</title>
  <desc>顶层展示外置 LB Proxy、4 组独立 Prefill EP16 与 4 机联合 Decode EP64 集群拓扑及 Mooncake KV 交接；中左用两机八卡拓扑对比扁平跨机 (M-1)/M RDMA 网状派发与 A2 分层通信先机内 HCCS 汇合再单跳跨机；中右用真实比例条形图展示 1-0.95^R 拖离小批概率（R=2 10%、R=16 56%、R=64 96%）与 A2 MC2 三门槛；底层以 AND 逻辑门汇总 decode 跳过每步 DP 同步的条件与 KV 端口偏移公式。</desc>
  <defs>
    <marker id="lsep-arr-teal" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M 0 1.5 L 8.5 5 L 0 8.5 z" fill="#087f73"/></marker>
    <marker id="lsep-arr-plum" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M 0 1.5 L 8.5 5 L 0 8.5 z" fill="#9a4b86"/></marker>
    <marker id="lsep-arr-red" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M 0 1.5 L 8.5 5 L 0 8.5 z" fill="#b54237"/></marker>
    <marker id="lsep-arr-gray" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M 0 1.5 L 8.5 5 L 0 8.5 z" fill="#66716d"/></marker>
  </defs>

  <text x="12" y="25" font-size="16" font-weight="700" fill="#17211f">一、三平面拓扑解耦：外置入口路由 × 独立 P 域（4×EP16）× 跨机 D 域（EP64）</text>
  <line x1="12" y1="35" x2="888" y2="35" stroke="#b8bcb5" stroke-width="1.3"/>

  <!-- Proxy Box -->
  <rect x="12" y="48" width="200" height="134" rx="9" fill="#ece9df" stroke="#b8bcb5" stroke-width="1.4"/>
  <text x="24" y="70" font-size="14" font-weight="700" fill="#17211f">外置 LB Proxy</text>
  <g font-size="12" fill="#4d5652">
    <text x="24" y="92">每 DP rank 独立端口</text>
    <text x="24" y="114">P：<tspan font-family="var(--font-mono)" fill="#936300">L/4×0.0345+120</tspan></text>
    <text x="24" y="136">D：<tspan font-family="var(--font-mono)" fill="#065f56">len(req_body)</tspan></text>
    <text x="24" y="158">仅分发 HTTP，不搬 KV</text>
    <text x="24" y="175" fill="#66716d">8 机示例共 72 个服务端点</text>
  </g>
  <path d="M 212 102 L 232 102" fill="none" stroke="#087f73" stroke-width="2" marker-end="url(#lsep-arr-teal)"/>

  <!-- Prefill Domain -->
  <rect x="238" y="48" width="276" height="134" rx="9" fill="#fff4cf" stroke="#c78300" stroke-width="1.4"/>
  <text x="250" y="70" font-size="14" font-weight="700" fill="#936300">Prefill 域（4 台独立 EP16，互不跨机）</text>
  <rect x="250" y="80" width="56" height="44" rx="5" fill="#ffffff" stroke="#c78300" stroke-width="1.2"/>
    <text x="278" y="98" font-size="12" font-weight="700" text-anchor="middle" fill="#936300">P机0</text>
    <text x="278" y="115" font-size="12" font-family="var(--font-mono)" text-anchor="middle" fill="#4d5652">EP16</text>
    <rect x="314" y="80" width="56" height="44" rx="5" fill="#ffffff" stroke="#c78300" stroke-width="1.2"/>
    <text x="342" y="98" font-size="12" font-weight="700" text-anchor="middle" fill="#936300">P机1</text>
    <text x="342" y="115" font-size="12" font-family="var(--font-mono)" text-anchor="middle" fill="#4d5652">EP16</text>
    <rect x="378" y="80" width="56" height="44" rx="5" fill="#ffffff" stroke="#c78300" stroke-width="1.2"/>
    <text x="406" y="98" font-size="12" font-weight="700" text-anchor="middle" fill="#936300">P机2</text>
    <text x="406" y="115" font-size="12" font-family="var(--font-mono)" text-anchor="middle" fill="#4d5652">EP16</text>
    <rect x="442" y="80" width="56" height="44" rx="5" fill="#ffffff" stroke="#c78300" stroke-width="1.2"/>
    <text x="470" y="98" font-size="12" font-weight="700" text-anchor="middle" fill="#936300">P机3</text>
    <text x="470" y="115" font-size="12" font-family="var(--font-mono)" text-anchor="middle" fill="#4d5652">EP16</text>
  <text x="250" y="146" font-size="12" fill="#4d5652">大批吞吐 (16k/eager)；仅产 1 tok 返句柄</text>
  <text x="250" y="166" font-size="12" fill="#936300">隔离长 prefill，防止拖离 D 端 MC2 通路</text>

  <!-- Mooncake P2P Arrow -->
  <path d="M 514 102 L 560 102" fill="none" stroke="#9a4b86" stroke-width="2.2" marker-end="url(#lsep-arr-plum)"/>
  <text x="537" y="92" font-size="12" font-weight="700" text-anchor="middle" fill="#7a3a6a">KV</text>
  <text x="537" y="120" font-size="12" text-anchor="middle" fill="#7a3a6a">直传</text>

  <!-- Decode Domain -->
  <rect x="566" y="48" width="322" height="134" rx="9" fill="#ddf4ef" stroke="#087f73" stroke-width="1.4"/>
  <text x="578" y="70" font-size="14" font-weight="700" fill="#065f56">Decode 专家域（4 机合 1 个 EP64 同步环）</text>
  <rect x="582" y="80" width="64" height="44" rx="5" fill="#ffffff" stroke="#087f73" stroke-width="1.2"/>
    <text x="614" y="98" font-size="12" font-weight="700" text-anchor="middle" fill="#065f56">D机0</text>
    <text x="614" y="115" font-size="12" font-family="var(--font-mono)" text-anchor="middle" fill="#4d5652">16×TP1</text>
    <rect x="656" y="80" width="64" height="44" rx="5" fill="#ffffff" stroke="#087f73" stroke-width="1.2"/>
    <text x="688" y="98" font-size="12" font-weight="700" text-anchor="middle" fill="#065f56">D机1</text>
    <text x="688" y="115" font-size="12" font-family="var(--font-mono)" text-anchor="middle" fill="#4d5652">16×TP1</text>
    <rect x="730" y="80" width="64" height="44" rx="5" fill="#ffffff" stroke="#087f73" stroke-width="1.2"/>
    <text x="762" y="98" font-size="12" font-weight="700" text-anchor="middle" fill="#065f56">D机2</text>
    <text x="762" y="115" font-size="12" font-family="var(--font-mono)" text-anchor="middle" fill="#4d5652">16×TP1</text>
    <rect x="804" y="80" width="64" height="44" rx="5" fill="#ffffff" stroke="#087f73" stroke-width="1.2"/>
    <text x="836" y="98" font-size="12" font-weight="700" text-anchor="middle" fill="#065f56">D机3</text>
    <text x="836" y="115" font-size="12" font-family="var(--font-mono)" text-anchor="middle" fill="#4d5652">16×TP1</text>
  <path d="M 614 128 L 836 128" fill="none" stroke="#087f73" stroke-width="2" stroke-dasharray="4 3"/>
  <text x="578" y="148" font-size="12" fill="#4d5652">小批低时延（256 tok / Graph）；每卡仅 4 专家</text>
  <text x="578" y="168" font-size="12" fill="#065f56">每层 MoE 全域同步，直连 P 拉取 KV（端口偏移）</text>

  <!-- Section 2 Header -->
  <text x="12" y="212" font-size="16" font-weight="700" fill="#17211f">二、扁平跨机 vs A2 分层通信拓扑 &amp; 全组按 max(tokens) 选路拖尾概率</text>
  <line x1="12" y1="222" x2="888" y2="222" stroke="#b8bcb5" stroke-width="1.3"/>

  <!-- Left: 2-Node Flat vs Hierarchy Topology (x=12..456, y=234..404) -->
  <rect x="12" y="234" width="444" height="170" rx="9" fill="#f7e7f2" stroke="#9a4b86" stroke-width="1.4"/>
  <text x="24" y="256" font-size="13.5" font-weight="700" fill="#7a3a6a">1. 扁平跨机 (M-1)/M 网状发包 vs A2 分层通信</text>

  <!-- Flat row -->
  <rect x="22" y="274" width="138" height="34" rx="5" fill="#fff0e9" stroke="#b54237" stroke-width="1.2"/>
  <rect x="28" y="282" width="23" height="18" rx="3" fill="#ffffff" stroke="#b54237" stroke-width="1.1"/><rect x="59" y="282" width="23" height="18" rx="3" fill="#ffffff" stroke="#b54237" stroke-width="1.1"/><rect x="90" y="282" width="23" height="18" rx="3" fill="#ffffff" stroke="#b54237" stroke-width="1.1"/><rect x="121" y="282" width="23" height="18" rx="3" fill="#ffffff" stroke="#b54237" stroke-width="1.1"/>
  <rect x="272" y="274" width="138" height="34" rx="5" fill="#fff0e9" stroke="#b54237" stroke-width="1.2"/>
  <rect x="278" y="282" width="23" height="18" rx="3" fill="#ffffff" stroke="#b54237" stroke-width="1.1"/><rect x="309" y="282" width="23" height="18" rx="3" fill="#ffffff" stroke="#b54237" stroke-width="1.1"/><rect x="340" y="282" width="23" height="18" rx="3" fill="#ffffff" stroke="#b54237" stroke-width="1.1"/><rect x="371" y="282" width="23" height="18" rx="3" fill="#ffffff" stroke="#b54237" stroke-width="1.1"/>
  <g stroke="#b54237" stroke-width="1.3" fill="none">
    <path d="M 160 282 L 266 282" marker-end="url(#lsep-arr-red)"/>
    <path d="M 160 291 L 266 291" marker-end="url(#lsep-arr-red)"/>
    <path d="M 160 300 L 266 300" marker-end="url(#lsep-arr-red)"/>
  </g>
  <text x="216" y="271" font-size="12" text-anchor="middle" font-weight="700" fill="#8f3229">扁平多跳 RDMA</text>
  <text x="446" y="296" font-size="12" font-weight="700" text-anchor="end" fill="#8f3229">7/8</text>

  <!-- Hierarchy row -->
  <rect x="22" y="344" width="138" height="34" rx="5" fill="#ddf4ef" stroke="#087f73" stroke-width="1.2"/>
  <rect x="28" y="352" width="23" height="18" rx="3" fill="#ffffff" stroke="#087f73" stroke-width="1.1"/><rect x="59" y="352" width="23" height="18" rx="3" fill="#ffffff" stroke="#087f73" stroke-width="1.1"/><rect x="90" y="352" width="23" height="18" rx="3" fill="#ffffff" stroke="#087f73" stroke-width="1.1"/><rect x="121" y="352" width="23" height="18" rx="3" fill="#ffffff" stroke="#087f73" stroke-width="1.1"/>
  <rect x="272" y="344" width="138" height="34" rx="5" fill="#ddf4ef" stroke="#087f73" stroke-width="1.2"/>
  <rect x="278" y="352" width="23" height="18" rx="3" fill="#ffffff" stroke="#087f73" stroke-width="1.1"/><rect x="309" y="352" width="23" height="18" rx="3" fill="#ffffff" stroke="#087f73" stroke-width="1.1"/><rect x="340" y="352" width="23" height="18" rx="3" fill="#ffffff" stroke="#087f73" stroke-width="1.1"/><rect x="371" y="352" width="23" height="18" rx="3" fill="#ffffff" stroke="#087f73" stroke-width="1.1"/>
  <rect x="168" y="347" width="96" height="28" rx="5" fill="#ffffff" stroke="#9a4b86" stroke-width="1.3"/>
  <text x="216" y="365" font-size="12" font-weight="700" text-anchor="middle" fill="#7a3a6a">单跳跨机汇聚</text>
  <path d="M 160 361 L 166 361" fill="none" stroke="#087f73" stroke-width="2"/>
  <path d="M 264 361 L 270 361" fill="none" stroke="#087f73" stroke-width="2"/>
  <text x="24" y="331" font-size="12" fill="#4d5652">A2 分层：先机内 HCCS 汇聚 → 单跳 RDMA → 机内分发（须 <tspan font-family="var(--font-mono)" fill="#7a3a6a">global_bs=0</tspan>）</text>
  <text x="24" y="396" font-size="12" fill="#4d5652">注：8 台均分跨机比 (M-1)/M = 7/8；A3 机内机外全走 HCCS</text>

  <!-- Right: Escalation Probability Bar Chart + A2 MC2 3 Gates (x=468..888, y=234..404) -->
  <rect x="468" y="234" width="420" height="170" rx="9" fill="#e8edff" stroke="#4c65b6" stroke-width="1.4"/>
  <text x="480" y="256" font-size="13.5" font-weight="700" fill="#3a4f93">2. 拖离 MC2 概率（1 - 0.95^R）与 A2 三门槛</text>

  <!-- Real proportional horizontal bars (max width 220px = 100%) -->
  <g font-size="12" font-family="var(--font-mono)">
    <text x="482" y="281" fill="#4d5652">R=2  (2卡)</text>
    <rect x="578" y="268" width="220" height="16" rx="4" fill="#ffffff" stroke="#d8d8cf"/>
    <rect x="578" y="268" width="22" height="16" rx="4" fill="#087f73"/>
    <text x="808" y="281" font-weight="700" fill="#065f56">10%</text>

    <text x="482" y="305" fill="#4d5652">R=16</text>
    <rect x="578" y="292" width="220" height="16" rx="4" fill="#ffffff" stroke="#d8d8cf"/>
    <rect x="578" y="292" width="123" height="16" rx="4" fill="#c78300"/>
    <text x="808" y="305" font-weight="700" fill="#936300">56%</text>

    <text x="482" y="329" fill="#4d5652">R=64</text>
    <rect x="578" y="316" width="220" height="16" rx="4" fill="#ffffff" stroke="#d8d8cf"/>
    <rect x="578" y="316" width="211" height="16" rx="4" fill="#b54237"/>
    <text x="808" y="329" font-weight="700" fill="#8f3229">96%</text>
  </g>

  <!-- A2 MC2 3 Gate Pills -->
  <g font-size="12" font-family="var(--font-mono)" text-anchor="middle" font-weight="700">
    <rect x="480" y="346" width="126" height="26" rx="5" fill="#ffffff" stroke="#4c65b6" stroke-width="1.2"/>
    <text x="543" y="363" fill="#3a4f93">experts/卡 ≤ 24</text>
    <rect x="614" y="346" width="110" height="26" rx="5" fill="#ffffff" stroke="#4c65b6" stroke-width="1.2"/>
    <text x="669" y="363" fill="#3a4f93">EP ≥ 16</text>
    <rect x="732" y="346" width="144" height="26" rx="5" fill="#ffffff" stroke="#4c65b6" stroke-width="1.2"/>
    <text x="804" y="363" fill="#3a4f93">tokens ≤ cap</text>
  </g>
  <text x="480" y="394" font-size="12" fill="#4d5652">v0.30.0+ 收敛 <tspan font-family="var(--font-mono)" fill="#3a4f93">select_moe_comm_method</tspan>（LoRA+EP 强走 A2A）</text>

  <!-- Section 3: Bottom AND-Gate Strip (y=418..556) -->
  <rect x="12" y="418" width="876" height="138" rx="9" fill="#fff0e9" stroke="#b54237" stroke-width="1.4"/>
  <text x="26" y="442" font-size="14.5" font-weight="700" fill="#8f3229">三、decode 跳过每步 DP 同步（should_skip_allreduce_across_dp_group）AND 守卫与 KV 端口偏移</text>

  <!-- 3 Input Condition Boxes -->
  <g stroke-width="1.2">
    <rect x="24" y="454" width="234" height="58" rx="7" fill="#ffffff" stroke="#b54237"/>
    <rect x="270" y="454" width="194" height="58" rx="7" fill="#ffffff" stroke="#b54237"/>
    <rect x="476" y="454" width="208" height="58" rx="7" fill="#ffffff" stroke="#b54237"/>
  </g>
  <g font-size="12" fill="#4d5652">
    <text x="34" y="474" font-weight="700" fill="#17211f">条件① 角色与互斥</text>
    <text x="34" y="492">MoE <tspan font-family="var(--font-mono)" fill="#8f3229">kv_consumer</tspan>，关 hierarchy</text>
    <text x="34" y="507">与 MegaMoe（main 排 qkv_iproj&gt;1）</text>

    <text x="280" y="474" font-weight="700" fill="#17211f">条件② Decode 路径</text>
    <text x="280" y="492">Decode 最大批命中</text>
    <text x="280" y="507" font-family="var(--font-mono)" fill="#065f56">MC2 / FUSED_MC2</text>

    <text x="486" y="474" font-weight="700" fill="#17211f">条件③ 触发放行分支</text>
    <text x="486" y="492">(Prefill 走 MC2 且图不分 P/D)</text>
    <text x="486" y="507"><tspan font-weight="700" fill="#065f56">OR</tspan> 开 <tspan font-family="var(--font-mono)" fill="#065f56">recompute_scheduler</tspan></text>
  </g>

  <path d="M 684 483 L 706 483" fill="none" stroke="#087f73" stroke-width="2" marker-end="url(#lsep-arr-teal)"/>
  <rect x="712" y="454" width="164" height="58" rx="7" fill="#ddf4ef" stroke="#087f73" stroke-width="1.4"/>
  <text x="794" y="476" font-size="13" font-weight="700" text-anchor="middle" fill="#065f56">全满足 → 跳过同步</text>
  <text x="794" y="498" font-size="12" text-anchor="middle" fill="#4d5652">改用真实 <tspan font-family="var(--font-mono)" fill="#065f56">global_bs</tspan></text>

  <!-- Port formula bar -->
  <text x="26" y="542" font-size="12.5" fill="#4d5652"><tspan font-weight="700" fill="#17211f">Mooncake KV 监听端口偏移：</tspan><tspan font-family="var(--font-mono)" font-weight="700" fill="#3a4f93">kv_port + dp_rank × (TP × PP × PCP) + device_index</tspan>（支持同机多 DP 独立监听不冲突）</text>
</svg>
