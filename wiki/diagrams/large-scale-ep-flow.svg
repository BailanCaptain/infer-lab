<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 624" width="900" height="624" role="img" aria-label="左：多 rank 示例取 DP 大于 1。启动时给出自己的 DP rank 编号，进入外置负载均衡模式，只管本机这一个 rank；在这些条件下稠密模型报错。MoE 服务仍要到 DP 主节点握手，和全组一起走每层 MoE；前端数量取默认值 1。右：vllm-ascend 示例 proxy 处理一条请求的先后；KV 由连接器在 P、D 之间直接传，proxy 只转交传输参数。">
  <title>左：多 rank 示例取 DP 大于 1。启动时给出自己的 DP rank 编号，进入外置负载均衡模式，只管本机这一个 rank；在这些条件下稠密模型报错。MoE 服务仍要到 DP 主节点握手，和全组一起走每层 MoE；前端数量取默认值 1。右：vllm-ascend 示例 proxy 处理一条请求的先后；KV 由连接器在 P、D 之间直接传，proxy 只转交传输参数。</title>
  <defs><marker id="large-scale-ep-flow-ah-ink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="var(--color-ink, #17211f)"/></marker><marker id="large-scale-ep-flow-ah-danger" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="var(--color-danger, #b54237)"/></marker><marker id="large-scale-ep-flow-ah-comm" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="var(--color-comm, #9a4b86)"/></marker><marker id="large-scale-ep-flow-ah-kv" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="var(--color-kv, #4c65b6)"/></marker></defs>
  <rect x="18" y="44" width="416" height="564" rx="16" fill="none" stroke="var(--color-line-strong, #b8bcb5)" stroke-width="1.5"/>
  <text x="34" y="32" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="15" font-weight="700" fill="var(--color-ink, #17211f)">启动：一个 vllm serve 进程成为一个 rank</text>
  <rect x="466" y="44" width="416" height="564" rx="16" fill="none" stroke="var(--color-line-strong, #b8bcb5)" stroke-width="1.5"/>
  <text x="482" y="32" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="15" font-weight="700" fill="var(--color-ink, #17211f)">一条请求：proxy 先挑 P，再挑 D</text>
  <path d="M163 130 L163 164" fill="none" stroke="var(--color-ink, #17211f)" stroke-width="1.4" marker-end="url(#large-scale-ep-flow-ah-ink)"/>
  <path d="M288 193 L306 193" fill="none" stroke="var(--color-danger, #b54237)" stroke-width="1.4" marker-end="url(#large-scale-ep-flow-ah-danger)"/>
  <path d="M163 222 L163 256" fill="none" stroke="var(--color-ink, #17211f)" stroke-width="1.4" marker-end="url(#large-scale-ep-flow-ah-ink)"/>
  <path d="M226 314 L226 348" fill="none" stroke="var(--color-ink, #17211f)" stroke-width="1.4" marker-end="url(#large-scale-ep-flow-ah-ink)"/>
  <path d="M226 406 L226 440" fill="none" stroke="var(--color-ink, #17211f)" stroke-width="1.4" marker-end="url(#large-scale-ep-flow-ah-ink)"/>
  <path d="M226 498 L226 532" fill="none" stroke="var(--color-comm, #9a4b86)" stroke-width="2.2" marker-end="url(#large-scale-ep-flow-ah-comm)"/>
  <path d="M674 130 L674 164" fill="none" stroke="var(--color-ink, #17211f)" stroke-width="1.4" marker-end="url(#large-scale-ep-flow-ah-ink)"/>
  <path d="M674 222 L674 256" fill="none" stroke="var(--color-ink, #17211f)" stroke-width="1.4" marker-end="url(#large-scale-ep-flow-ah-ink)"/>
  <path d="M674 314 L674 348" fill="none" stroke="var(--color-ink, #17211f)" stroke-width="1.4" marker-end="url(#large-scale-ep-flow-ah-ink)"/>
  <path d="M674 406 L674 440" fill="none" stroke="var(--color-kv, #4c65b6)" stroke-width="1.4" marker-end="url(#large-scale-ep-flow-ah-kv)"/>
  <path d="M674 498 L674 532" fill="none" stroke="var(--color-ink, #17211f)" stroke-width="1.4" marker-end="url(#large-scale-ep-flow-ah-ink)"/>
  <rect x="38" y="72" width="376" height="58" rx="8" fill="var(--color-surface-sunken, #ece9df)" stroke="var(--color-ink, #17211f)" stroke-width="1.5"/>
  <text x="226" y="97" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="14" font-weight="700" fill="var(--color-ink, #17211f)" text-anchor="middle">DP&gt;1，给出自己的 DP rank 编号</text>
  <text x="226" y="116" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="13" font-weight="400" fill="var(--color-ink, #17211f)" text-anchor="middle">同时给主节点地址和 RPC 端口</text>
  <rect x="38" y="164" width="250" height="58" rx="8" fill="var(--color-control, #66716d)" stroke="var(--color-ink, #17211f)" stroke-width="1.5"/>
  <text x="163" y="189" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="14" font-weight="700" fill="var(--color-ink-inverse, #ffffff)" text-anchor="middle">模型是 MoE 吗？</text>
  <text x="163" y="208" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="13" font-weight="400" fill="var(--color-ink-inverse, #ffffff)" text-anchor="middle">外置分派只对 MoE 开放</text>
  <rect x="306" y="164" width="108" height="58" rx="8" fill="var(--color-danger, #b54237)" stroke="var(--color-ink, #17211f)" stroke-width="1.5"/>
  <text x="360" y="189" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="14" font-weight="700" fill="var(--color-ink-inverse, #ffffff)" text-anchor="middle">不是：报错</text>
  <text x="360" y="208" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="13" font-weight="400" fill="var(--color-ink-inverse, #ffffff)" text-anchor="middle">改起独立实例</text>
  <rect x="38" y="256" width="376" height="58" rx="8" fill="var(--color-control, #66716d)" stroke="var(--color-ink, #17211f)" stroke-width="1.5"/>
  <text x="226" y="281" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="14" font-weight="700" fill="var(--color-ink-inverse, #ffffff)" text-anchor="middle">本机只管这 1 个 rank</text>
  <text x="226" y="300" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="13" font-weight="400" fill="var(--color-ink-inverse, #ffffff)" text-anchor="middle">本地 DP 个数只能是 1 或不写</text>
  <rect x="38" y="348" width="376" height="58" rx="8" fill="var(--color-control, #66716d)" stroke="var(--color-ink, #17211f)" stroke-width="1.5"/>
  <text x="226" y="373" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="14" font-weight="700" fill="var(--color-ink-inverse, #ffffff)" text-anchor="middle">默认起 1 个 API server</text>
  <text x="226" y="392" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="13" font-weight="400" fill="var(--color-ink-inverse, #ffffff)" text-anchor="middle">分派交给外部路由</text>
  <rect x="38" y="440" width="376" height="58" rx="8" fill="var(--color-control, #66716d)" stroke="var(--color-ink, #17211f)" stroke-width="1.5"/>
  <text x="226" y="465" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="14" font-weight="700" fill="var(--color-ink-inverse, #ffffff)" text-anchor="middle">客户端只连本机的 EngineCore</text>
  <text x="226" y="484" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="13" font-weight="400" fill="var(--color-ink-inverse, #ffffff)" text-anchor="middle">不再替其他 rank 排队、打分</text>
  <rect x="38" y="532" width="376" height="58" rx="8" fill="var(--color-comm, #9a4b86)" stroke="var(--color-ink, #17211f)" stroke-width="1.5"/>
  <text x="226" y="557" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="14" font-weight="700" fill="var(--color-ink-inverse, #ffffff)" text-anchor="middle">到 DP 主节点握手，加入 EP 组</text>
  <text x="226" y="576" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="13" font-weight="400" fill="var(--color-ink-inverse, #ffffff)" text-anchor="middle">每层 MoE 仍和全组一起 dispatch、combine</text>
  <rect x="486" y="72" width="376" height="58" rx="8" fill="var(--color-control, #66716d)" stroke="var(--color-ink, #17211f)" stroke-width="1.5"/>
  <text x="674" y="97" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="14" font-weight="700" fill="var(--color-ink-inverse, #ffffff)" text-anchor="middle">proxy 收到请求</text>
  <text x="674" y="116" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="13" font-weight="400" fill="var(--color-ink-inverse, #ffffff)" text-anchor="middle">按请求体长度给 P、D 各记一笔估算</text>
  <rect x="486" y="164" width="376" height="58" rx="8" fill="var(--color-control, #66716d)" stroke="var(--color-ink, #17211f)" stroke-width="1.5"/>
  <text x="674" y="189" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="14" font-weight="700" fill="var(--color-ink-inverse, #ffffff)" text-anchor="middle">挑估分之和最小的 P rank</text>
  <text x="674" y="208" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="13" font-weight="400" fill="var(--color-ink-inverse, #ffffff)" text-anchor="middle">只做 prefill，最多生成 1 个 token</text>
  <rect x="486" y="256" width="376" height="58" rx="8" fill="var(--color-kv, #4c65b6)" stroke="var(--color-ink, #17211f)" stroke-width="1.5"/>
  <text x="674" y="281" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="14" font-weight="700" fill="var(--color-ink-inverse, #ffffff)" text-anchor="middle">P 算完 prefill，返回 KV 传输参数</text>
  <text x="674" y="300" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="13" font-weight="400" fill="var(--color-ink-inverse, #ffffff)" text-anchor="middle">说明 D 该去哪里取哪些 KV 块</text>
  <rect x="486" y="348" width="376" height="58" rx="8" fill="var(--color-control, #66716d)" stroke="var(--color-ink, #17211f)" stroke-width="1.5"/>
  <text x="674" y="373" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="14" font-weight="700" fill="var(--color-ink-inverse, #ffffff)" text-anchor="middle">挑手上负载最小的 D rank</text>
  <text x="674" y="392" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="13" font-weight="400" fill="var(--color-ink-inverse, #ffffff)" text-anchor="middle">把 KV 传输参数一并转交</text>
  <rect x="486" y="440" width="376" height="58" rx="8" fill="var(--color-kv, #4c65b6)" stroke="var(--color-ink, #17211f)" stroke-width="1.5"/>
  <text x="674" y="465" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="14" font-weight="700" fill="var(--color-ink-inverse, #ffffff)" text-anchor="middle">D 通过连接器直接从 P 取 KV</text>
  <text x="674" y="484" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="13" font-weight="400" fill="var(--color-ink-inverse, #ffffff)" text-anchor="middle">KV 不经过 proxy</text>
  <rect x="486" y="532" width="376" height="58" rx="8" fill="var(--color-token, #087f73)" stroke="var(--color-ink, #17211f)" stroke-width="1.5"/>
  <text x="674" y="557" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="14" font-weight="700" fill="var(--color-ink-inverse, #ffffff)" text-anchor="middle">D 接着 decode</text>
  <text x="674" y="576" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="13" font-weight="400" fill="var(--color-ink-inverse, #ffffff)" text-anchor="middle">生成的结果经 proxy 返回用户</text>
  <text x="172" y="244" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="13.5" font-weight="400" fill="var(--color-ink, #17211f)">是</text>
</svg>
