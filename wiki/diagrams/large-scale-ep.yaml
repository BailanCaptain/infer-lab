layout: scene
id: large-scale-ep
caption: 同样是 16 张卡的一台机器，P 侧切成 2 个 DP rank、D 侧切成 16 个——每个 rank 就是一个独立的 server 进程，挑哪个由 vLLM 外面那层 proxy 决定（v0.23 维护分支）
size: [900, 700]

notes:
  - { at: [20, 30], text: "大规模 EP 的部署形态：一个 MoE 模型摊成 72 个互不相干的 server 进程", size: 15, strong: true }
  - at: [20, 604]
    text: "为什么非得摊这么大：A2 上要走 MC2，得同时满足每卡专家数不超过 24、EP 卡数不少于 16。DeepSeek-R1 有 256 个路由专家，单台 8 卡的 A2 算出来 num_experts_per_device 是 32，两条都不过，只能退回 all-gather。"
    size: 12.5
    width: 860
  - at: [20, 650]
    text: "四台 prefiller 各自当自己的 DP 主节点，四台 decoder 共用一个；64 个 decode 引擎写同一个 kv_port 也不会撞，因为 side_channel_port 先按全局 DP rank 偏移一次。"
    size: 12.5
    width: 860

boxes:
  - at: [250, 52]
    size: [400, 72]
    title: 外置 proxy：vLLM 外面的一层
    sub: 每个后端记 active_tokens，每次挑最小的那个
    fn: _priority
    tone: accent
    icon: pick

