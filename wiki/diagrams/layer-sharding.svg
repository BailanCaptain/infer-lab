  <text x="40" y="574" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="12.5" font-weight="400" fill="var(--color-ink-muted, #5b6763)">每次前向：持有 4 层的卡接收 57 × 112 = 6384 MiB；持有 3 层的卡接收 58 × 112 = 6496 MiB。每个非本地层搬整份 112 MiB，不能把全组平均量当</text>
  <text x="40" y="592.5" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="12.5" font-weight="400" fill="var(--color-ink-muted, #5b6763)">成每卡预算。</text>
  <text x="40" y="622" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="12.5" font-weight="600" fill="var(--color-ink, #17211f)">省下的是常驻容量，增加的是广播和窗口；batch 小、序列短时通常更难隐藏通信，实际时延须按工作负载测量。</text>
