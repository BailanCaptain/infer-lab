  <text x="480" y="311" text-anchor="middle" font-size="12" fill="#66716d">第 i+1 层前向窗口</text>
  <text x="742" y="311" text-anchor="middle" font-size="12" fill="#66716d">第 i+2 层前向窗口</text>

  <!-- Vertical dashed sync grid lines at wait_weight points (x=370, x=632) -->
  <line x1="370" y1="320" x2="370" y2="528" stroke="#9a4b86" stroke-width="1.2" stroke-dasharray="4 3"/>
  <line x1="632" y1="320" x2="632" y2="528" stroke="#9a4b86" stroke-width="1.2" stroke-dasharray="4 3"/>

  <!-- LANE 1: Compute Stream (y=328..374) -->
