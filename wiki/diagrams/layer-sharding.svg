  <!-- Proportional Memory Bars -->
  <text x="16" y="134" font-size="14" font-weight="700" fill="#17211f">单卡常驻显存按比例对比（最高卡预算 = ceil(61/16) + 2 窗口，不可简单按 1/K 或均值估）</text>

  <text x="16" y="164" font-size="13" font-weight="700" fill="#4d5652">全量常驻（61 层）</text>
  <rect x="196" y="146" width="610" height="24" rx="4" fill="#ece9df" stroke="#8a928f" stroke-width="1.2"/>
  <text x="501" y="163" text-anchor="middle" font-size="13" font-weight="700" fill="#17211f">6,832 MiB（约 6.67 GiB）</text>

  <text x="16" y="196" font-size="13" font-weight="700" fill="#065f56">rank 0–12（最高卡）</text>
  <rect x="196" y="178" width="40" height="24" rx="3" fill="#ddf4ef" stroke="#087f73" stroke-width="1.4"/>
  <rect x="236" y="178" width="20" height="24" rx="3" fill="#fff4cf" stroke="#c78300" stroke-width="1.4"/>
  <text x="266" y="195" font-size="13" font-weight="700" fill="#065f56">448 常驻 + 224 两窗口 = 672 MiB（约省 6.0 GiB；每步收 57 层 = 6,384 MiB）</text>

  <text x="16" y="228" font-size="13" font-weight="700" fill="#3a4f93">rank 13–15（持 3 层）</text>
  <rect x="196" y="210" width="30" height="24" rx="3" fill="#e8edff" stroke="#4c65b6" stroke-width="1.3"/>
  <rect x="226" y="210" width="20" height="24" rx="3" fill="#fff4cf" stroke="#c78300" stroke-width="1.4"/>
  <text x="256" y="227" font-size="13" fill="#3a4f93">336 常驻 + 224 两窗口 = 560 MiB（每步收 58 层 = 6,496 MiB ≈ 6.34 GiB）</text>

  <line x1="16" y1="248" x2="884" y2="248" stroke="#d8d8cf" stroke-width="1.3" stroke-dasharray="6 4"/>

  <!-- BAND 2: True 3-Lane Horizontal Overlap Gantt Timeline + Double-Buffer Rails -->
  <text x="16" y="274" font-size="16" font-weight="700" fill="#17211f">② 前向三轨时间轴：计算流、异步 Broadcast 流与双窗口交替（prefetch_step = 1）</text>
  <text x="16" y="294" font-size="13" fill="#66716d">同 series 须层号连续且 ≥ 3 层；加载后处理曾临时分配完整张量做广播与量化，非占位即峰值</text>

  <!-- Time Axis Ruler -->
  <line x1="116" y1="316" x2="876" y2="316" stroke="#8a928f" stroke-width="1.3" marker-end="url(#ls-arr-g)"/>
