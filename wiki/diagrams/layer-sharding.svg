<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 660" width="900" height="660" role="img" aria-label="第 i 层权重常驻在组内 rank i % K；其他卡通过两份窗口接收预取广播。下面是从层 0 开始、每层 112 MiB 的示意预算，旧路径限非空配置的 P 实例。">
  <title>第 i 层权重常驻在组内 rank i % K；其他卡通过两份窗口接收预取广播。下面是从层 0 开始、每层 112 MiB 的示意预算，旧路径限非空配置的 P 实例。</title>
  <rect width="900" height="660" fill="var(--color-surface, #fbfaf6)"/>
  <rect x="20" y="26" width="860" height="250" rx="12" fill="var(--color-weight-soft, #fff4cf)"/>
  <rect x="36" y="40" width="267.7" height="26.5" rx="13.3" fill="var(--color-weight, #b87a00)"/><text x="47" y="58.1" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="13.5" font-weight="700" fill="var(--color-ink-inverse, #ffffff)">加载期 · 分配常驻权重，再建立预取窗口</text>
  <text x="38" y="83" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="12.5" font-weight="400" fill="var(--color-ink-muted, #5b6763)">非本卡权重登记后改成单元素占位，参数加载函数不再写入；文件仍可能读取。加载后处理还会临时恢复完整张量做广播和量化处理。</text>
  <rect x="20" y="320" width="860" height="242" rx="12" fill="var(--color-kv-soft, #e8edff)"/>
  <rect x="36" y="334" width="267.7" height="26.5" rx="13.3" fill="var(--color-kv, #4c65b6)"/><text x="47" y="352.1" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="13.5" font-weight="700" fill="var(--color-ink-inverse, #ffffff)">前向期 · 提前一层广播，使用投影前等待</text>
  <text x="38" y="377" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="12.5" font-weight="400" fill="var(--color-ink-muted, #5b6763)">预取入口由注意力后端调用，下面是 MLA 路径的顺序；能否隐藏广播耗时取决于调用间隔、计算量和通信带宽。</text>
  <rect x="80" y="378" width="776" height="52" rx="10" fill="var(--color-kv-soft, #e8edff)"/>
  <rect x="80" y="378" width="5" height="52" rx="2.5" fill="var(--color-kv, #4c65b6)"/>
  <g transform="translate(103.8 393.8) scale(0.85)" fill="none" stroke="var(--color-kv, #4c65b6)" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M13 2L4 14h7l-1 8 9-12h-7z"/></g>
  <text x="138" y="401" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="15" font-weight="700" fill="var(--color-ink, #17211f)">① 为第 i+1 层发异步 broadcast</text>
  <text x="138" y="421" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="12.5" font-weight="400" fill="var(--color-ink-muted, #5b6763)">常驻卡是组内 rank (i+1) % K，其他卡写入窗口</text>
  <rect x="736.5" y="391.5" width="100.5" height="21.5" rx="10.8" fill="var(--color-surface, #fbfaf6)" stroke="var(--color-kv, #4c65b6)" stroke-width="1"/><text x="786.8" y="409" font-family="'JetBrains Mono',ui-monospace,monospace" font-size="12.5" font-weight="400" fill="var(--color-kv, #4c65b6)" text-anchor="middle">reach_layer</text>
