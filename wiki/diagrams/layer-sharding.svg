<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 668" width="900" height="668" role="img" aria-label="v0.23.0 layer_sharding 按层号 i % K 轮放权重、显存比例对照条、三轨时间轴重叠与双窗口交替，以及 v0.30.0/main 移除" font-family="var(--font-sans)">
  <title>v0.23.0 层间权重分片（layer_sharding）：第 i 层常驻在组内 rank i % K，非 owner 卡经两份整层窗口提前一层异步 Broadcast 取回（示意：61 层 o_proj、每层 112 MiB、K=16，仅限 P 节点）；v0.24.0rc（PR #11953）已删除，v0.30.0 与 main 拒收旧键。</title>
  <desc>Layer-modulo weight ownership strip (i % 16 across 61 layers), proportional HBM bars comparing 6,832 MiB full vs 672 MiB heaviest rank (448 resident + 224 two-window buffer), 3-lane overlap Gantt timeline (Compute stream, Async Broadcast stream, alternating Double-Buffer Window A/B with small-batch bubble), and v0.30.0/main removal notice.</desc>
  <defs>
    <marker id="ls-arr-t" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="#087f73"/>
    </marker>
    <marker id="ls-arr-p" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="#9a4b86"/>
    </marker>
    <marker id="ls-arr-g" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5.5" markerHeight="5.5" orient="auto">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="#66716d"/>
    </marker>
  </defs>

  <!-- BAND 1: 61-layer modulo ownership strip & proportional HBM bars (preserved) -->
  <text x="16" y="26" font-size="16" font-weight="700" fill="#17211f">① v0.23.0 按层号 i % K 轮放常驻（示意：61 层 o_proj，每层 112 MiB，K = 16，仅限 P 节点）</text>
  <text x="16" y="46" font-size="13.5" fill="#66716d">青格 = rank 0 常驻的 4 层（L0 / L16 / L32 / L48）；灰格 = 非 owner 层登记时置单元素占位（dispose_tensor）</text>

