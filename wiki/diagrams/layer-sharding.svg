  <text x="22" y="108" font-size="13.5" font-weight="700" fill="#065f56" font-family="var(--font-mono)">L0</text>
  <text x="246" y="108" font-size="13.5" font-weight="700" fill="#065f56" font-family="var(--font-mono)" text-anchor="middle">L16</text>
  <text x="470" y="108" font-size="13.5" font-weight="700" fill="#065f56" font-family="var(--font-mono)" text-anchor="middle">L32</text>
  <text x="694" y="108" font-size="13.5" font-weight="700" fill="#065f56" font-family="var(--font-mono)" text-anchor="middle">L48</text>
  <text x="868" y="108" font-size="13.5" fill="#66716d" font-family="var(--font-mono)" text-anchor="end">L60</text>

  <!-- Band 2: Proportional Memory Bars (6,832 MiB = 610px; 1 MiB = 0.0893px) -->
  <text x="16" y="138" font-size="14.5" font-weight="700" fill="#17211f">单卡常驻显存按比例对比（最高卡预算 = ceil(61/16) + 2 窗口，不可简单按 1/K 或均值估）</text>

  <!-- Full 61 layers = 6,832 MiB -> 610px -->
  <text x="16" y="168" font-size="13.5" font-weight="700" fill="#4d5652">全量常驻（61 层）</text>
  <rect x="196" y="150" width="610" height="24" rx="4" fill="#ece9df" stroke="#8a928f" stroke-width="1.2"/>
  <text x="501" y="167" text-anchor="middle" font-size="13.5" font-weight="700" fill="#17211f">6,832 MiB（约 6.67 GiB）</text>

  <!-- Rank 0-12 heaviest: 448 MiB (40px) + 224 MiB (20px) = 672 MiB (60px) -->
  <text x="16" y="202" font-size="13.5" font-weight="700" fill="#065f56">rank 0–12（最高卡）</text>
  <rect x="196" y="184" width="40" height="24" rx="3" fill="#ddf4ef" stroke="#087f73" stroke-width="1.4"/>
  <rect x="236" y="184" width="20" height="24" rx="3" fill="#fff4cf" stroke="#c78300" stroke-width="1.4"/>
  <text x="266" y="201" font-size="13.5" font-weight="700" fill="#065f56">448 常驻 + 224 两窗口 = 672 MiB（约省 6.0 GiB；每步收 57 层 = 6,384 MiB）</text>

  <!-- Rank 13-15: 336 MiB (30px) + 224 MiB (20px) = 560 MiB (50px) -->
  <text x="16" y="236" font-size="13.5" font-weight="700" fill="#3a4f93">rank 13–15（持 3 层）</text>
  <rect x="196" y="218" width="30" height="24" rx="3" fill="#e8edff" stroke="#4c65b6" stroke-width="1.3"/>
  <rect x="226" y="218" width="20" height="24" rx="3" fill="#fff4cf" stroke="#c78300" stroke-width="1.4"/>
  <text x="256" y="235" font-size="13.5" fill="#3a4f93">336 常驻 + 224 两窗口 = 560 MiB（每步收 58 层 = 6,496 MiB ≈ 6.34 GiB）</text>

  <line x1="16" y1="258" x2="884" y2="258" stroke="#d8d8cf" stroke-width="1.3" stroke-dasharray="6 4"/>

  <!-- Band 3: Dual-lane Forward Overlap Pipeline -->
  <text x="16" y="284" font-size="16" font-weight="700" fill="#17211f">② 前向期双轨流水：第 i 层计算尽量遮盖第 i+1 层异步广播（prefetch_step = 1）</text>
  <text x="16" y="304" font-size="13.5" fill="#66716d">同 series 须层号连续且 ≥ 3 层；加载后处理曾临时分配完整张量做广播与量化，非占位即峰值</text>

  <!-- Compute lane -->
  <text x="16" y="352" font-size="14" font-weight="700" fill="#3a4f93">计算流</text>
  <text x="16" y="372" font-size="13.5" fill="#66716d">主前向</text>

  <rect x="112" y="324" width="286" height="64" rx="8" fill="#e8edff" stroke="#4c65b6" stroke-width="1.4"/>
  <text x="255" y="349" text-anchor="middle" font-size="14" font-weight="700" fill="#3a4f93">执行第 i 层计算（掩盖下方广播）</text>
  <text x="255" y="372" text-anchor="middle" font-size="13.5" fill="#4d5652">小批短序列窗口窄，不保隐藏收益</text>
  <path d="M 398 356 L 430 356" fill="none" stroke="#087f73" stroke-width="1.8" marker-end="url(#ls-arr-t)"/>

  <rect x="436" y="324" width="212" height="64" rx="8" fill="#ddf4ef" stroke="#087f73" stroke-width="1.6"/>
  <text x="542" y="349" text-anchor="middle" font-size="14" font-weight="700" fill="#065f56">等第 i+1 层到位</text>
  <text x="542" y="372" text-anchor="middle" font-size="13.5" font-family="var(--font-mono)" fill="#17211f">wait_weight 验层号</text>
  <path d="M 648 356 L 674 356" fill="none" stroke="#087f73" stroke-width="1.8" marker-end="url(#ls-arr-t)"/>

  <rect x="680" y="324" width="204" height="64" rx="8" fill="#e8edff" stroke="#4c65b6" stroke-width="1.4"/>
  <text x="782" y="349" text-anchor="middle" font-size="14" font-weight="700" fill="#3a4f93">执行第 i+1 层 Linear</text>
  <text x="782" y="372" text-anchor="middle" font-size="13.5" fill="#4d5652">同时发 i+2 层预取</text>

  <!-- Broadcast lane -->
  <text x="16" y="436" font-size="14" font-weight="700" fill="#7a3a6a">通信流</text>
  <text x="16" y="456" font-size="13.5" fill="#66716d">异步广播</text>

  <rect x="112" y="408" width="376" height="64" rx="8" fill="#f7e7f2" stroke="#9a4b86" stroke-width="1.5"/>
  <text x="300" y="433" text-anchor="middle" font-size="14" font-weight="700" fill="#7a3a6a">reach_layer(async_op=True)：广播第 i+1 层 112 MiB</text>
  <text x="300" y="456" text-anchor="middle" font-size="13.5" fill="#4d5652">常驻卡 rank (i+1)%K 发给同 shard_weight 组写入空闲窗口</text>

  <path d="M 488 440 H 542 V 392" fill="none" stroke="#9a4b86" stroke-width="1.9" marker-end="url(#ls-arr-p)"/>

  <rect x="564" y="408" width="320" height="64" rx="8" fill="#fff4cf" stroke="#c78300" stroke-width="1.3"/>
  <text x="724" y="433" text-anchor="middle" font-size="14" font-weight="700" fill="#936300">两份窗口交替（ShardWindowMetadata）</text>
  <text x="724" y="456" text-anchor="middle" font-size="13.5" fill="#4d5652">1 份供当前层读、1 份接下一层广播</text>

  <line x1="16" y1="490" x2="884" y2="490" stroke="#d8d8cf" stroke-width="1.3" stroke-dasharray="6 4"/>

  <!-- Band 4: Removal & Distinction (no bullets) -->
  <rect x="16" y="506" width="424" height="106" rx="8" fill="#fff0e9" stroke="#b54237" stroke-width="1.5"/>
  <text x="32" y="532" font-size="14.5" font-weight="700" fill="#8f3229">v0.24.0rc（PR #11953）删除：v0.30.0 / main 拒收</text>
  <text x="32" y="558" font-size="13.5" fill="#17211f">v0.26 静默忽略；v0.30.0 与 main 按 extra=forbid 拒收</text>
  <text x="32" y="584" font-size="13.5" fill="#4d5652">GLM 双机混部触发仅限 P 节点报错，且 KDA+MLA 交错不连续</text>

  <rect x="460" y="506" width="424" height="106" rx="8" fill="#ddf4ef" stroke="#087f73" stroke-width="1.4"/>
  <text x="476" y="532" font-size="14.5" font-weight="700" fill="#065f56">新版去向：weight_switch ≠ 按层轮放同义替代</text>
  <text x="476" y="558" font-size="13.5" font-family="var(--font-mono)" fill="#17211f">enable_pcp_o_proj_weight_sharding (默认 True)</text>
  <text x="476" y="584" font-size="13.5" fill="#4d5652">沿 PCP 域切分「同一层」投影，不再按层号轮流归不同卡</text>
</svg>
