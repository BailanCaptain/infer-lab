<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 660" width="900" height="660" role="img" aria-label="第 i 层的权重只存在组内 rank i % K 上，前向时提前一层异步广播取回（v0.23.0 维护分支；main 上整条路径已删）">
  <title>第 i 层的权重只存在组内 rank i % K 上，前向时提前一层异步广播取回（v0.23.0 维护分支；main 上整条路径已删）</title>
  <rect width="900" height="660" fill="var(--color-surface, #fbfaf6)"/>
  <rect x="20" y="26" width="860" height="250" rx="12" fill="var(--color-weight-soft, #fff4cf)"/>
  <rect x="36" y="40" width="254.2" height="26.5" rx="13.3" fill="var(--color-weight, #b87a00)"/><text x="47" y="58.1" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="13.5" font-weight="700" fill="var(--color-ink-inverse, #ffffff)">加载期 · 注册时就把不归本卡的层丢掉</text>
  <text x="38" y="83" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="12.5" font-weight="400" fill="var(--color-ink-muted, #5b6763)">不归本卡的层直接置空张量、把 weight_loader 换成 no-op，连从磁盘读都省了；省下的显存是真的，代价写在下半张图里。</text>
  <rect x="20" y="320" width="860" height="242" rx="12" fill="var(--color-kv-soft, #e8edff)"/>
  <rect x="36" y="334" width="380.8" height="26.5" rx="13.3" fill="var(--color-kv, #4c65b6)"/><text x="47" y="352.1" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="13.5" font-weight="700" fill="var(--color-ink-inverse, #ffffff)">前向期 · 借一层 attention 的时间把下一层的权重搬回来</text>
  <text x="38" y="377" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="12.5" font-weight="400" fill="var(--color-ink-muted, #5b6763)">广播只有被更重的 prefill 计算盖住才划算，所以启动期硬校验 kv_role 必须是 kv_producer。</text>
  <rect x="80" y="378" width="776" height="52" rx="10" fill="var(--color-kv-soft, #e8edff)"/>
  <rect x="80" y="378" width="5" height="52" rx="2.5" fill="var(--color-kv, #4c65b6)"/>
  <g transform="translate(103.8 393.8) scale(0.85)" fill="none" stroke="var(--color-kv, #4c65b6)" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3a9 9 0 1 0 0 18 9 9 0 0 0 0-18z M12 7v5l3 2"/></g>
  <text x="138" y="401" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="15" font-weight="700" fill="var(--color-ink, #17211f)">① 进第 i 层 forward 前先等</text>
  <text x="138" y="421" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="12.5" font-weight="400" fill="var(--color-ink-muted, #5b6763)">窗口里的数据必须正是第 i 层的，否则断言炸</text>
  <rect x="736.5" y="391.5" width="100.5" height="21.5" rx="10.8" fill="var(--color-surface, #fbfaf6)" stroke="var(--color-kv, #4c65b6)" stroke-width="1"/><text x="786.8" y="409" font-family="'JetBrains Mono',ui-monospace,monospace" font-size="12.5" font-weight="400" fill="var(--color-kv, #4c65b6)" text-anchor="middle">wait_weight</text>
  <rect x="80" y="436" width="776" height="52" rx="10" fill="var(--color-kv-soft, #e8edff)"/>
  <rect x="80" y="436" width="5" height="52" rx="2.5" fill="var(--color-kv, #4c65b6)"/>
  <g transform="translate(103.8 451.8) scale(0.85)" fill="none" stroke="var(--color-kv, #4c65b6)" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M5 3h14v18H5z M8 7h8M8 11h2M12 11h2M8 15h2M12 15h2"/></g>
  <text x="138" y="459" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="15" font-weight="700" fill="var(--color-ink, #17211f)">② 第 i 层 attention 照常算</text>
  <text x="138" y="479" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="12.5" font-weight="400" fill="var(--color-ink-muted, #5b6763)">这段计算就是唯一能用来遮掩通信的时间</text>
  <text x="840" y="467" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="12.5" font-weight="400" fill="var(--color-ink-muted, #5b6763)" text-anchor="end">遮不住就是净亏</text>
  <rect x="80" y="494" width="776" height="52" rx="10" fill="var(--color-weight-soft, #fff4cf)"/>
  <rect x="80" y="494" width="5" height="52" rx="2.5" fill="var(--color-weight, #b87a00)"/>
  <g transform="translate(103.8 509.8) scale(0.85)" fill="none" stroke="var(--color-weight, #b87a00)" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M13 2L4 14h7l-1 8 9-12h-7z"/></g>
  <text x="138" y="517" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="15" font-weight="700" fill="var(--color-ink, #17211f)">③ 同时给第 i+1 层发异步 broadcast</text>
  <text x="138" y="537" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="12.5" font-weight="400" fill="var(--color-ink-muted, #5b6763)">src = 组内 ranks[(i+1) % K]，async_op=True</text>
  <rect x="736.5" y="507.5" width="100.5" height="21.5" rx="10.8" fill="var(--color-surface, #fbfaf6)" stroke="var(--color-weight, #b87a00)" stroke-width="1"/><text x="786.8" y="525" font-family="'JetBrains Mono',ui-monospace,monospace" font-size="12.5" font-weight="400" fill="var(--color-weight, #b87a00)" text-anchor="middle">reach_layer</text>
  <line x1="20" y1="296" x2="880" y2="296" stroke="var(--color-accent, #e85b32)" stroke-width="2.5" stroke-dasharray="7 5"/>
  <text x="876" y="287" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="13" font-weight="700" fill="var(--color-accent, #e85b32)" text-anchor="end">过了这条线，57/61 的权重已经不在本卡上——缺的那层只能等广播</text>
