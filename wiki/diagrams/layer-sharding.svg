  <!-- Strip labels -->
  <text x="22" y="138" font-size="13" font-weight="700" fill="#065f56" font-family="var(--font-mono)">L0</text>
  <text x="246" y="138" font-size="13" font-weight="700" fill="#065f56" font-family="var(--font-mono)" text-anchor="middle">L16</text>
  <text x="470" y="138" font-size="13" font-weight="700" fill="#065f56" font-family="var(--font-mono)" text-anchor="middle">L32</text>
  <text x="694" y="138" font-size="13" font-weight="700" fill="#065f56" font-family="var(--font-mono)" text-anchor="middle">L48</text>
  <text x="868" y="138" font-size="13" fill="#66716d" font-family="var(--font-mono)" text-anchor="end">L60</text>

  <!-- Memory budget cards -->
  <rect x="16" y="152" width="424" height="96" rx="8" fill="#ddf4ef" stroke="#087f73" stroke-width="1.4"/>
  <text x="30" y="176" font-size="14.5" font-weight="700" fill="#065f56">rank 0 常驻 4 层：4 × 112 = 448 MiB</text>
  <text x="30" y="200" font-size="13.5" fill="#4d5652">• 非 owner 层登记时置单元素占位（dispose_tensor）</text>
  <text x="30" y="222" font-size="13.5" fill="#4d5652">• 加载后处理曾临时分配完整张量做广播与量化</text>

  <rect x="460" y="152" width="424" height="96" rx="8" fill="#fff4cf" stroke="#c78300" stroke-width="1.4"/>
  <text x="474" y="176" font-size="14.5" font-weight="700" fill="#936300">另加 2 份整权重窗口：224 MiB → 共 672 MiB</text>
  <text x="474" y="200" font-size="13" fill="#4d5652" font-family="var(--font-mono)">ShardWindowMetadata (prefetch_step + 1 = 2)</text>
  <text x="474" y="222" font-size="13.5" fill="#4d5652">• 最高卡预算按 ceil(层数/K)+2，非简单 1/K</text>

  <!-- Divider -->
  <line x1="16" y1="268" x2="884" y2="268" stroke="#d8d8cf" stroke-width="1.2" stroke-dasharray="5 4"/>

  <!-- Phase 2: Per-layer forward pipeline -->
  <text x="16" y="294" font-size="14.5" font-weight="700" fill="#17211f">阶段二 · 前向期每层流水（注意力后端触发预取，执行该 Linear 前等待到位）</text>

  <rect x="16" y="308" width="270" height="106" rx="8" fill="#f7e7f2" stroke="#9a4b86" stroke-width="1.4"/>
  <text x="30" y="332" font-size="14.5" font-weight="700" fill="#7a3a6a">① 为第 i+1 层发异步广播</text>
  <text x="30" y="355" font-size="13" fill="#4d5652" font-family="var(--font-mono)">reach_layer (async_op=True)</text>
  <text x="30" y="378" font-size="13.5" fill="#4d5652">常驻卡 rank (i+1)%K 发广播</text>
  <text x="30" y="399" font-size="13.5" fill="#66716d">其余卡异步写入空闲窗口</text>

  <path d="M286 361 H310 m-5-5 l5 5 -5 5" fill="none" stroke="#66716d" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/>

  <rect x="315" y="308" width="270" height="106" rx="8" fill="#e8edff" stroke="#4c65b6" stroke-width="1.4"/>
  <text x="329" y="332" font-size="14.5" font-weight="700" fill="#3a4f93">② 第 i 层继续前向计算</text>
  <text x="329" y="355" font-size="13" fill="#4d5652" font-family="var(--font-mono)">overlap compute &amp; bcast</text>
  <text x="329" y="378" font-size="13.5" fill="#4d5652">用第 i 层计算尽量遮盖广播</text>
  <text x="329" y="399" font-size="13.5" fill="#66716d">小批短序列难隐藏，不保收益</text>

  <path d="M585 361 H609 m-5-5 l5 5 -5 5" fill="none" stroke="#66716d" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/>

  <rect x="614" y="308" width="270" height="106" rx="8" fill="#ddf4ef" stroke="#087f73" stroke-width="1.4"/>
  <text x="628" y="332" font-size="14.5" font-weight="700" fill="#065f56">③ 投影执行前等权重到位</text>
  <text x="628" y="355" font-size="13" fill="#4d5652" font-family="var(--font-mono)">wait_weight</text>
  <text x="628" y="378" font-size="13.5" fill="#4d5652">等待第 i 层异步句柄完成</text>
  <text x="628" y="399" font-size="13.5" fill="#66716d">并校验窗口层号必须匹配</text>

  <!-- Phase 3: Comm budget & removal cards -->
  <rect x="16" y="432" width="424" height="180" rx="8" fill="#ece9df" stroke="#b8bcb5" stroke-width="1.3"/>
  <text x="30" y="458" font-size="14.5" font-weight="700" fill="#17211f">单卡前向接收账（61 层示意，非实测）</text>
  <text x="30" y="484" font-size="13.5" fill="#4d5652">• rank 0–12（持 4 层）：每次前向收 57 × 112 =</text>
  <text x="30" y="506" font-size="13.5" font-weight="700" fill="#17211f">  6,384 MiB（约 6.23 GiB）</text>
  <text x="30" y="532" font-size="13.5" fill="#4d5652">• rank 13–15（持 3 层）：每次前向收 58 × 112 =</text>
  <text x="30" y="554" font-size="13.5" font-weight="700" fill="#17211f">  6,496 MiB（约 6.34 GiB）</text>
  <text x="30" y="582" font-size="13" fill="#66716d">注：同 series 需连续且 ≥ 3 层；不可用组均值替单卡预算</text>

  <rect x="460" y="432" width="424" height="180" rx="8" fill="#fff0e9" stroke="#b54237" stroke-width="1.4"/>
  <text x="474" y="458" font-size="14.5" font-weight="700" fill="#8f3229">v0.24.0rc（PR #11953）删除：v0.30.0 / main 拒收</text>
  <text x="474" y="484" font-size="13.5" fill="#4d5652">• v0.26.0rc 静默忽略；v0.30.0 (c09d3e20) 与</text>
  <text x="474" y="506" font-size="13.5" fill="#4d5652">  main (8d6180e2) 通常按 extra="forbid" 拒收旧键</text>
  <text x="474" y="532" font-size="13.5" fill="#4d5652">• 新版权重切换由 weight_switch 承接；默认 True 的</text>
  <text x="474" y="554" font-size="13" fill="#8f3229" font-family="var(--font-mono)">  enable_pcp_o_proj_weight_sharding</text>
  <text x="474" y="580" font-size="13.5" fill="#4d5652">  是沿 PCP 域切同一层，不是按层轮放的同义替代</text>
</svg>
