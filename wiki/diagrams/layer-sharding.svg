  <text x="16" y="366" font-size="12.5" fill="#66716d">主前向 Linear</text>

  <rect x="116" y="328" width="196" height="44" rx="6" fill="#e8edff" stroke="#4c65b6" stroke-width="1.4"/>
  <text x="214" y="348" text-anchor="middle" font-size="13" font-weight="700" fill="#3a4f93">执行第 i 层（读窗 A）</text>
  <text x="214" y="365" text-anchor="middle" font-size="12" fill="#4d5652">同时发第 i+1 层广播</text>

  <!-- Small-batch stall bubble between x=316..366 -->
  <rect x="316" y="328" width="50" height="44" rx="4" fill="#fff0e9" stroke="#b54237" stroke-width="1.2" stroke-dasharray="4 3"/>
  <text x="341" y="348" text-anchor="middle" font-size="12" font-weight="700" fill="#8f3229">气泡</text>
  <text x="341" y="365" text-anchor="middle" font-size="12" fill="#8f3229">等待</text>

  <rect x="374" y="328" width="196" height="44" rx="6" fill="#e8edff" stroke="#4c65b6" stroke-width="1.4"/>
  <text x="472" y="348" text-anchor="middle" font-size="13" font-weight="700" fill="#3a4f93">执行第 i+1 层（读窗 B）</text>
  <text x="472" y="365" text-anchor="middle" font-size="12" fill="#4d5652">同时发第 i+2 层广播</text>

  <rect x="574" y="328" width="54" height="44" rx="4" fill="#fff0e9" stroke="#b54237" stroke-width="1.2" stroke-dasharray="4 3"/>
  <text x="601" y="348" text-anchor="middle" font-size="12" font-weight="700" fill="#8f3229">气泡</text>
  <text x="601" y="365" text-anchor="middle" font-size="12" fill="#8f3229">等待</text>

  <rect x="636" y="328" width="242" height="44" rx="6" fill="#e8edff" stroke="#4c65b6" stroke-width="1.4"/>
  <text x="757" y="348" text-anchor="middle" font-size="13" font-weight="700" fill="#3a4f93">执行第 i+2 层（切回读窗 A）</text>
  <text x="757" y="365" text-anchor="middle" font-size="12" fill="#4d5652">小批短序窗口窄时，广播易长于计算</text>

  <!-- LANE 2: Async Broadcast Stream (y=392..438) -->
  <text x="16" y="412" font-size="13.5" font-weight="700" fill="#7a3a6a">通信流</text>
  <text x="16" y="430" font-size="12.5" fill="#66716d">异步广播</text>

  <rect x="128" y="392" width="238" height="44" rx="6" fill="#f7e7f2" stroke="#9a4b86" stroke-width="1.5"/>
  <text x="247" y="412" text-anchor="middle" font-size="12.5" font-weight="700" fill="#7a3a6a">reach_layer：广播第 i+1 层 (112M)</text>
  <text x="247" y="429" text-anchor="middle" font-size="12" fill="#4d5652">owner (i+1)%K → 写入空闲窗 B</text>

  <!-- Sync arrow up from Broadcast completion to Compute wait_weight -->
  <path d="M 358 392 L 358 376" fill="none" stroke="#9a4b86" stroke-width="1.8" marker-end="url(#ls-arr-p)"/>

  <rect x="386" y="392" width="242" height="44" rx="6" fill="#f7e7f2" stroke="#9a4b86" stroke-width="1.5"/>
  <text x="507" y="412" text-anchor="middle" font-size="12.5" font-weight="700" fill="#7a3a6a">reach_layer：广播第 i+2 层 (112M)</text>
  <text x="507" y="429" text-anchor="middle" font-size="12" fill="#4d5652">owner (i+2)%K → 写入空闲窗 A</text>

  <!-- Sync arrow up from Broadcast completion to Compute wait_weight -->
  <path d="M 620 392 L 620 376" fill="none" stroke="#9a4b86" stroke-width="1.8" marker-end="url(#ls-arr-p)"/>

  <rect x="648" y="392" width="230" height="44" rx="6" fill="#f7e7f2" stroke="#9a4b86" stroke-width="1.3" stroke-dasharray="5 3"/>
  <text x="763" y="412" text-anchor="middle" font-size="12.5" font-weight="700" fill="#7a3a6a">广播第 i+3 层 → 写入空闲窗 B</text>
  <text x="763" y="429" text-anchor="middle" font-size="12" font-family="var(--font-mono)" fill="#4d5652">wait_weight 验层号后交接</text>

  <!-- LANE 3: Double-Buffer Rails (Window A & Window B alternating) (y=456..522) -->
  <text x="16" y="476" font-size="13" font-weight="700" fill="#936300">窗口 A</text>
  <text x="16" y="512" font-size="13" font-weight="700" fill="#936300">窗口 B</text>

  <!-- Window A Rail (y=456, h=28) -->
  <rect x="116" y="456" width="250" height="28" rx="4" fill="#ddf4ef" stroke="#087f73" stroke-width="1.3"/>
  <text x="241" y="475" text-anchor="middle" font-size="12.5" font-weight="700" fill="#065f56">窗 A：供第 i 层只读（112 MiB）</text>
  <rect x="374" y="456" width="254" height="28" rx="4" fill="#fff4cf" stroke="#c78300" stroke-width="1.3"/>
  <text x="501" y="475" text-anchor="middle" font-size="12.5" font-weight="700" fill="#936300">窗 A：接收第 i+2 层广播写入</text>
  <rect x="636" y="456" width="242" height="28" rx="4" fill="#ddf4ef" stroke="#087f73" stroke-width="1.3"/>
  <text x="757" y="475" text-anchor="middle" font-size="12.5" font-weight="700" fill="#065f56">窗 A：供第 i+2 层只读</text>

  <!-- Window B Rail (y=492, h=28) -->
  <rect x="116" y="492" width="250" height="28" rx="4" fill="#fff4cf" stroke="#c78300" stroke-width="1.3"/>
  <text x="241" y="511" text-anchor="middle" font-size="12.5" font-weight="700" fill="#936300">窗 B：接收第 i+1 层广播写入</text>
  <rect x="374" y="492" width="254" height="28" rx="4" fill="#ddf4ef" stroke="#087f73" stroke-width="1.3"/>
  <text x="501" y="511" text-anchor="middle" font-size="12.5" font-weight="700" fill="#065f56">窗 B：供第 i+1 层只读（112 MiB）</text>
  <rect x="636" y="492" width="242" height="28" rx="4" fill="#fff4cf" stroke="#c78300" stroke-width="1.3"/>
  <text x="757" y="511" text-anchor="middle" font-size="12.5" font-weight="700" fill="#936300">窗 B：接收第 i+3 层广播写入</text>

  <line x1="16" y1="538" x2="884" y2="538" stroke="#d8d8cf" stroke-width="1.3" stroke-dasharray="6 4"/>

  <!-- BAND 3: Removal & Distinction -->
  <rect x="16" y="552" width="424" height="102" rx="8" fill="#fff0e9" stroke="#b54237" stroke-width="1.5"/>
  <text x="32" y="577" font-size="14" font-weight="700" fill="#8f3229">v0.24.0rc（PR #11953）删除：v0.30.0 / main 拒收</text>
  <text x="32" y="603" font-size="13" fill="#17211f">v0.26 静默忽略；v0.30.0 与 main 按 extra=forbid 拒收</text>
  <text x="32" y="629" font-size="13" fill="#4d5652">GLM 双机混部触发仅限 P 节点报错，且 KDA+MLA 交错不连续</text>

  <rect x="460" y="552" width="424" height="102" rx="8" fill="#ddf4ef" stroke="#087f73" stroke-width="1.4"/>
  <text x="476" y="577" font-size="14" font-weight="700" fill="#065f56">新版去向：weight_switch ≠ 按层轮放同义替代</text>
  <text x="476" y="603" font-size="13" font-family="var(--font-mono)" fill="#17211f">enable_pcp_o_proj_weight_sharding (默认 True)</text>
  <text x="476" y="629" font-size="13" fill="#4d5652">沿 PCP 域切分「同一层」投影，不再按层号轮流归不同卡</text>
</svg>
