<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 628" width="900" height="628" role="img" aria-label="v0.23.0 layer_sharding 按层号 i % K 轮放权重、两份预取窗口与异步广播前向流水，以及 v0.30.0/main 移除说明" font-family="var(--font-sans)">
  <title>v0.23.0 层间权重分片（layer_sharding）：第 i 层常驻在组内 rank i % K，非 owner 卡经两份整层窗口提前一层异步 Broadcast 取回（示意：61 层 o_proj、每层 112 MiB、K=16，仅限 P 节点）；v0.24.0rc（PR #11953）已删除，v0.30.0 与 main 拒收旧键。</title>
  <desc>Layer-modulo weight ownership (i % K) across 61 layers (K=16, 112 MiB/layer illustrative), two prefetch window buffers, async broadcast pipeline, and removal in v0.30.0/main.</desc>

  <text x="16" y="28" font-size="16" font-weight="700" fill="#17211f">v0.23.0 layer_sharding：按层号 i % K 轮放常驻与提前一层异步广播</text>
  <text x="16" y="48" font-size="13.5" fill="#66716d">示意：61 层 o_proj（L0–L60，每层 112 MiB），K = 16 卡建组；非空列表仅限 P 节点（kv_producer）</text>

  <!-- Phase 1: 61-layer strip showing rank 0 ownership (0, 16, 32, 48) -->
  <text x="16" y="78" font-size="14.5" font-weight="700" fill="#065f56">阶段一 · 加载与常驻分布（高亮 4 格 = rank 0 常驻层 L0 / L16 / L32 / L48；灰格 = 单元素占位）</text>

