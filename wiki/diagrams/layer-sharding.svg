  <text x="34" y="467" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="12.5" font-weight="600" fill="var(--color-kv, #4c65b6)">每层</text>
  <text x="40" y="574" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="12.5" font-weight="400" fill="var(--color-ink-muted, #5b6763)">每张卡对它不负责的那 15/16 的层都要收一份全量权重：61 × 15/16 × 112 MiB ≈ 6.3 GiB，每次前向、每张卡。摊到每层约 105 MiB，必须在一层 </text>
  <text x="40" y="592.5" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="12.5" font-weight="400" fill="var(--color-ink-muted, #5b6763)">attention 的时间里传完。</text>
  <text x="40" y="622" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="12.5" font-weight="600" fill="var(--color-ink, #17211f)">所以它省的是容量、花的是带宽：batch 小、序列短的时候遮不住这 105 MiB，开了就是纯负收益。</text>
</svg>
