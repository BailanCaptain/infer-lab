layout: figure
id: layers-sinkhorn
caption: Sinkhorn 迭代怎样把 4×4 系数改成每行、每列和都为 1（数为示意，第 ② 张保留三位小数）：最右一列是行和，最下一行是列和，红色是还不等于 1 的和。① 按行 softmax 后行和都是 1，但新流 1 一共收到 1.3 份；② 每列除以自己的列和，列和变成 1，行和被打乱；③ 行、列来回交替，20 轮后两个方向的和都是 1
size: [900, 240]
grids:
