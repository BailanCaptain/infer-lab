    rows: 5
    cols: 5
    cell: [46, 28]
    tone: token
    style: faded
    rowLabels: ['旧流 1', '旧流 2', '旧流 3', '旧流 4', '列和']
    colLabels: ['新流 1', '新流 2', '新流 3', '新流 4', '行和']
    label: ① 按行 softmax 后：行和都是 1
    cells:
