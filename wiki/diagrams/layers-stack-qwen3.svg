<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 422" width="900" height="422" role="img" aria-label="Qwen3-8B 36 层同构单残差流前向架构图，展示 embed_tokens 入口、单条 [T, 4096] 残差高速路、GQA 与 SwiGLU 双支路以及末层归一化与 lm_head">
  <title>Qwen3-8B 36 层同构单流残差前向栈</title>
  <desc>横向展示 Qwen3-8B 从 embed_tokens 进入单条 [T, 4096] 残差高速路，循环穿过 36 个完全同构的 DecoderLayer（每层包含 input_layernorm + GQA 32Q:8KV 逐头 QK-Norm/RoPE 与 post_attention_layernorm + SwiGLU 12288），最终经 model.norm 与 lm_head 输出词表分数。</desc>
  <defs>
    <marker id="arr-t" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse">
      <path d="M 1 1.5 L 8.5 5 L 1 8.5 z" fill="#087f73" />
    </marker>
    <marker id="arr-i" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse">
      <path d="M 1 1.5 L 8.5 5 L 1 8.5 z" fill="#4c65b6" />
    </marker>
    <marker id="arr-a" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse">
      <path d="M 1 1.5 L 8.5 5 L 1 8.5 z" fill="#c78300" />
    </marker>
    <marker id="arr-m" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse">
      <path d="M 1 1.5 L 8.5 5 L 1 8.5 z" fill="#66716d" />
    </marker>
  </defs>

  <!-- Title -->
  <text x="20" y="28" font-family="system-ui, -apple-system, sans-serif" font-size="16" font-weight="700" fill="#17211f">Qwen3-8B 单流逐层前向栈：全程 1 条 [T, 4096] 残差高速路</text>
  <text x="880" y="28" text-anchor="end" font-family="ui-monospace, SFMono-Regular, monospace" font-size="13.5" fill="#66716d">BF16 · 8 KiB / token</text>

  <!-- Left Entry: token IDs -> embed_tokens -->
  <rect x="20" y="64" width="124" height="44" rx="7" fill="#ece9df" stroke="#b8bcb5" stroke-width="1.4" />
  <text x="82" y="91" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, monospace" font-size="13.5" font-weight="700" fill="#17211f">input_ids [T]</text>
  <line x1="82" y1="108" x2="82" y2="134" stroke="#66716d" stroke-width="1.6" marker-end="url(#arr-m)" />

  <rect x="20" y="138" width="124" height="72" rx="8" fill="#ddf4ef" stroke="#087f73" stroke-width="1.6" />
  <text x="82" y="164" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, monospace" font-size="14" font-weight="700" fill="#065f56">embed_tokens</text>
  <text x="82" y="185" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, monospace" font-size="13.5" fill="#4d5652">[151936, 4096]</text>
  <text x="82" y="203" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="13.5" fill="#065f56">查表得初始流</text>

  <!-- Arrow from embed_tokens onto main residual highway -->
  <path d="M 144 174 L 164 174 L 164 102 L 182 102" fill="none" stroke="#087f73" stroke-width="2.6" marker-end="url(#arr-t)" />

  <!-- Center 36x Repeat Container -->
  <rect x="186" y="48" width="516" height="258" rx="10" fill="#ffffff" stroke="#b8bcb5" stroke-width="1.5" stroke-dasharray="6 4" />
  <text x="192" y="70" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="700" fill="#17211f">Qwen3DecoderLayer × 36 层同构串联（Layer 0 → 35，每层独立权重）</text>

  <!-- UNOBSTRUCTED MAIN RESIDUAL HIGHWAY (y=102) -->
  <line x1="186" y1="102" x2="412" y2="102" stroke="#087f73" stroke-width="3.2" marker-end="url(#arr-t)" />
  <line x1="444" y1="102" x2="652" y2="102" stroke="#087f73" stroke-width="3.2" marker-end="url(#arr-t)" />
  <line x1="684" y1="102" x2="728" y2="102" stroke="#087f73" stroke-width="3.2" marker-end="url(#arr-t)" />
  <text x="312" y="93" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, monospace" font-size="13.5" font-weight="700" fill="#065f56">残差流 [T, 4096]（恒等直通）</text>

  <!-- Sub-block 1: Attention (Indigo) -->
  <path d="M 214 102 L 214 198 L 228 198" fill="none" stroke="#4c65b6" stroke-width="1.8" marker-end="url(#arr-i)" />
  <rect x="232" y="138" width="174" height="122" rx="8" fill="#e8edff" stroke="#4c65b6" stroke-width="1.6" />
  <text x="319" y="160" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, monospace" font-size="13.5" font-weight="700" fill="#3a4f93">input_layernorm</text>
  <text x="319" y="180" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="13.5" fill="#4d5652">↓ RMSNorm (eps=1e-6)</text>
  <text x="319" y="204" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="14.5" font-weight="700" fill="#17211f">GQA（32Q : 8KV）</text>
  <text x="319" y="226" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, monospace" font-size="12" fill="#3a4f93">逐头 q/k_norm + RoPE</text>
  <text x="319" y="248" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, monospace" font-size="12" fill="#4d5652">d_h=128 · o_proj 回4096</text>
  <path d="M 406 198 L 430 198 L 430 118" fill="none" stroke="#4c65b6" stroke-width="1.8" marker-end="url(#arr-i)" />

  <!-- Sum Node 1 -->
  <circle cx="430" cy="102" r="14" fill="#ddf4ef" stroke="#087f73" stroke-width="2" />
  <text x="430" y="108" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="16" font-weight="700" fill="#065f56">+</text>

  <!-- Fused Add+RMSNorm Callout Tag between Sub-block 1 & 2 -->
  <rect x="448" y="114" width="178" height="22" rx="4" fill="#fff4cf" stroke="#c78300" stroke-width="1.1" />
  <text x="537" y="130" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, monospace" font-size="13" font-weight="700" fill="#936300">融合 npu_add_rms_norm</text>

  <!-- Sub-block 2: MLP SwiGLU (Amber) -->
  <path d="M 458 102 L 458 198 L 470 198" fill="none" stroke="#c78300" stroke-width="1.8" marker-end="url(#arr-a)" />
  <rect x="474" y="144" width="172" height="116" rx="8" fill="#fff4cf" stroke="#c78300" stroke-width="1.6" />
  <text x="560" y="166" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, monospace" font-size="13.5" font-weight="700" fill="#936300">post_attn_layernorm</text>
  <text x="560" y="186" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="13.5" fill="#4d5652">↓ RMSNorm (eps=1e-6)</text>
  <text x="560" y="210" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="14.5" font-weight="700" fill="#17211f">SwiGLU MLP</text>
  <text x="560" y="232" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, monospace" font-size="12" fill="#936300">4096 → 12288 → 4096</text>
  <text x="560" y="251" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, monospace" font-size="12" fill="#4d5652">bias=false · 无截断</text>
  <path d="M 646 198 L 670 198 L 670 118" fill="none" stroke="#c78300" stroke-width="1.8" marker-end="url(#arr-a)" />

  <!-- Sum Node 2 -->
  <circle cx="670" cy="102" r="14" fill="#ddf4ef" stroke="#087f73" stroke-width="2" />
  <text x="670" y="108" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="16" font-weight="700" fill="#065f56">+</text>

  <!-- Repeat Loop Arc at bottom of 36x container -->
  <path d="M 684 274 L 684 290 L 204 290 L 204 274" fill="none" stroke="#087f73" stroke-width="1.6" stroke-dasharray="4 3" marker-end="url(#arr-t)" />
  <rect x="334" y="276" width="220" height="24" rx="5" fill="#ddf4ef" stroke="#087f73" stroke-width="1.2" />
  <text x="444" y="293" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="13.5" font-weight="700" fill="#065f56">重复 36 层（第 0 → 35 层）</text>

  <!-- Right Exit: model.norm -> lm_head -->
  <rect x="732" y="64" width="148" height="72" rx="8" fill="#ece9df" stroke="#b8bcb5" stroke-width="1.5" />
  <text x="806" y="92" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, monospace" font-size="14" font-weight="700" fill="#17211f">model.norm</text>
  <text x="806" y="114" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="13.5" fill="#4d5652">末层最终 RMSNorm</text>
  <line x1="806" y1="136" x2="806" y2="162" stroke="#087f73" stroke-width="1.8" marker-end="url(#arr-t)" />

  <rect x="732" y="166" width="148" height="78" rx="8" fill="#ddf4ef" stroke="#087f73" stroke-width="1.6" />
  <text x="806" y="192" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, monospace" font-size="14" font-weight="700" fill="#065f56">lm_head</text>
  <text x="806" y="213" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, monospace" font-size="13.5" fill="#17211f">[4096, 151936]</text>
  <text x="806" y="233" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="13.5" fill="#065f56">选采样行 → 打分</text>
  <line x1="806" y1="244" x2="806" y2="268" stroke="#087f73" stroke-width="1.6" marker-end="url(#arr-t)" />
  <text x="806" y="290" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, monospace" font-size="13.5" font-weight="700" fill="#065f56">logits [B_s, V]</text>

  <!-- Bottom Telemetry Counters (4 structured architectural badges) -->
  <rect x="20" y="328" width="190" height="76" rx="8" fill="#ece9df" stroke="#d8d8cf" stroke-width="1.3" />
  <text x="115" y="356" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="14.5" font-weight="700" fill="#17211f">36 层 · 0 次切换</text>
  <text x="115" y="382" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="13" fill="#4d5652">全栈同构 GQA + SwiGLU</text>

  <rect x="222" y="328" width="246" height="76" rx="8" fill="#e8edff" stroke="#4c65b6" stroke-width="1.3" />
  <text x="345" y="356" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="14.5" font-weight="700" fill="#3a4f93">73 次主干 / 入口与最终 RMSNorm</text>
  <text x="345" y="382" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="13" fill="#4d5652">36×2 入口+1 末层（不含 q/k_norm）</text>

  <rect x="480" y="328" width="188" height="76" rx="8" fill="#ddf4ef" stroke="#087f73" stroke-width="1.3" />
  <text x="574" y="356" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="14.5" font-weight="700" fill="#065f56">72 次残差相加</text>
  <text x="574" y="382" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="13" fill="#4d5652">常与下一处 Norm 融合</text>

  <rect x="680" y="328" width="200" height="76" rx="8" fill="#fff4cf" stroke="#c78300" stroke-width="1.3" />
  <text x="780" y="356" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="14.5" font-weight="700" fill="#936300">MoE 变体：30B-A3B</text>
  <text x="780" y="382" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="13" fill="#4d5652">48 层单流，MLP 换 MoE</text>
</svg>
