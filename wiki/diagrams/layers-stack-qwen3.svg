<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 800" width="900" height="800" role="img" aria-label="标准 Qwen3-8B 在主线第 4 站的单流逐层前向栈：embed_tokens 查表产出单条 [T, 4096] 残差流，依次穿过结构完全相同的第 0–35 层（每层固定为 RMSNorm → 带逐头 Q/K Norm 与 RoPE 的 GQA → 残差相加 → RMSNorm → SwiGLU 12288 → 残差相加），出第 35 层后经最终 RMSNorm 与 lm_head [4096, 151936] 产出采样词表分数。">
