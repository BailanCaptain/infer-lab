<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 860" width="900" height="860" role="img" aria-label="主线第 4 站里 hidden 的先后与分支：embedding 交来一条，第 0 层入口复制成四条，每层两段各做一次入口混合和出口写回，第 44 层结束时求平均回到一条，再经最终 RMSNorm 和输出投影交给采样">
  <title>主线第 4 站里 hidden 的先后与分支：embedding 交来一条，第 0 层入口复制成四条，每层两段各做一次入口混合和出口写回，第 44 层结束时求平均回到一条，再经最终 RMSNorm 和输出投影交给采样</title>
  <defs><marker id="layers-stack-ah-ink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="var(--color-ink, #17211f)"/></marker><marker id="layers-stack-ah-token" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="var(--color-token, #087f73)"/></marker><marker id="layers-stack-ah-weight" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="var(--color-weight, #c78300)"/></marker></defs>
  <rect x="150" y="340" width="380" height="230" rx="16" fill="none" stroke="var(--color-line-strong, #b8bcb5)" stroke-width="1.5"/>
  <text x="166" y="328" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="15" font-weight="700" fill="var(--color-ink, #17211f)">每一层（第 0–44 层）</text>
  <path d="M340 64 L340 96" fill="none" stroke="var(--color-ink, #17211f)" stroke-width="1.4" marker-end="url(#layers-stack-ah-ink)"/>
  <path d="M340 148 L340 180" fill="none" stroke="var(--color-token, #087f73)" stroke-width="1.4" marker-end="url(#layers-stack-ah-token)"/>
  <path d="M340 224 L340 256" fill="none" stroke="var(--color-token, #087f73)" stroke-width="1.4" marker-end="url(#layers-stack-ah-token)"/>
  <path d="M340 308 L340 376" fill="none" stroke="var(--color-token, #087f73)" stroke-width="1.4" marker-end="url(#layers-stack-ah-token)"/>
  <path d="M340 440 L340 480" fill="none" stroke="var(--color-token, #087f73)" stroke-width="1.4" marker-end="url(#layers-stack-ah-token)"/>
  <path d="M340 544 L340 624" fill="none" stroke="var(--color-token, #087f73)" stroke-width="1.4" marker-end="url(#layers-stack-ah-token)"/>
  <path d="M480 646 L560 646 L560 408 L500 408" fill="none" stroke="var(--color-token, #087f73)" stroke-width="1.4" marker-end="url(#layers-stack-ah-token)"/>
  <path d="M340 668 L340 704" fill="none" stroke="var(--color-token, #087f73)" stroke-width="1.4" marker-end="url(#layers-stack-ah-token)"/>
  <path d="M340 756 L340 788" fill="none" stroke="var(--color-token, #087f73)" stroke-width="1.4" marker-end="url(#layers-stack-ah-token)"/>
  <path d="M130 468 L180 408" fill="none" stroke="var(--color-weight, #c78300)" stroke-width="1.4" marker-end="url(#layers-stack-ah-weight)"/>
  <path d="M130 468 L180 512" fill="none" stroke="var(--color-weight, #c78300)" stroke-width="1.4" marker-end="url(#layers-stack-ah-weight)"/>
  <rect x="200" y="20" width="280" height="44" rx="8" fill="var(--color-surface-sunken, #ece9df)" stroke="var(--color-ink, #17211f)" stroke-width="1.5"/>
  <text x="340" y="47" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="14" font-weight="700" fill="var(--color-ink, #17211f)" text-anchor="middle">本轮 T 个 token 编号</text>
  <rect x="200" y="96" width="280" height="52" rx="8" fill="var(--color-surface-sunken, #ece9df)" stroke="var(--color-ink, #17211f)" stroke-width="1.5"/>
  <text x="340" y="118" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="14" font-weight="700" fill="var(--color-ink, #17211f)" text-anchor="middle">embedding 查表</text>
  <text x="340" y="137" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="13" font-weight="400" fill="var(--color-ink, #17211f)" text-anchor="middle">TP8 各查一段，All-Reduce 拼齐</text>
  <rect x="200" y="180" width="280" height="44" rx="8" fill="var(--color-token, #087f73)" stroke="var(--color-ink, #17211f)" stroke-width="1.5"/>
  <text x="340" y="207" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="14" font-weight="700" fill="var(--color-ink-inverse, #ffffff)" text-anchor="middle">hidden [T, 4096]</text>
  <rect x="200" y="256" width="280" height="52" rx="8" fill="var(--color-token, #087f73)" stroke="var(--color-ink, #17211f)" stroke-width="1.5"/>
  <text x="340" y="278" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="14" font-weight="700" fill="var(--color-ink-inverse, #ffffff)" text-anchor="middle">第 0 层入口：复制成四条</text>
  <text x="340" y="297" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="13" font-weight="400" fill="var(--color-ink-inverse, #ffffff)" text-anchor="middle">[T, 4, 4096]，存成 [T, 16384]</text>
  <rect x="180" y="376" width="320" height="64" rx="8" fill="var(--color-surface-sunken, #ece9df)" stroke="var(--color-ink, #17211f)" stroke-width="1.5"/>
  <text x="340" y="404" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="14" font-weight="700" fill="var(--color-ink, #17211f)" text-anchor="middle">attention 段</text>
  <text x="340" y="423" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="13" font-weight="400" fill="var(--color-ink, #17211f)" text-anchor="middle">KDA 或稀疏 MLA，进出各一次 mHC</text>
  <rect x="180" y="480" width="320" height="64" rx="8" fill="var(--color-surface-sunken, #ece9df)" stroke="var(--color-ink, #17211f)" stroke-width="1.5"/>
  <text x="340" y="508" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="14" font-weight="700" fill="var(--color-ink, #17211f)" text-anchor="middle">MLP 段</text>
  <text x="340" y="527" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="13" font-weight="400" fill="var(--color-ink, #17211f)" text-anchor="middle">稠密 MLP 或 MoE，进出各一次 mHC</text>
  <rect x="20" y="440" width="110" height="56" rx="8" fill="var(--color-weight, #c78300)" stroke="var(--color-ink, #17211f)" stroke-width="1.5"/>
  <text x="75" y="464" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="14" font-weight="700" fill="var(--color-ink-inverse, #ffffff)" text-anchor="middle">本层权重</text>
  <text x="75" y="483" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="13" font-weight="400" fill="var(--color-ink-inverse, #ffffff)" text-anchor="middle">每层各一份</text>
  <rect x="200" y="624" width="280" height="44" rx="8" fill="var(--color-surface-sunken, #ece9df)" stroke="var(--color-ink, #17211f)" stroke-width="1.5"/>
  <text x="340" y="651" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="14" font-weight="700" fill="var(--color-ink, #17211f)" text-anchor="middle">是第 44 层吗？</text>
  <rect x="200" y="704" width="280" height="52" rx="8" fill="var(--color-token, #087f73)" stroke="var(--color-ink, #17211f)" stroke-width="1.5"/>
  <text x="340" y="726" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="14" font-weight="700" fill="var(--color-ink-inverse, #ffffff)" text-anchor="middle">四条求平均</text>
  <text x="340" y="745" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="13" font-weight="400" fill="var(--color-ink-inverse, #ffffff)" text-anchor="middle">[T, 4, 4096] → [T, 4096]</text>
  <rect x="200" y="788" width="280" height="52" rx="8" fill="var(--color-surface-sunken, #ece9df)" stroke="var(--color-ink, #17211f)" stroke-width="1.5"/>
  <text x="340" y="810" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="14" font-weight="700" fill="var(--color-ink, #17211f)" text-anchor="middle">最终 RMSNorm → 输出投影</text>
  <text x="340" y="829" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="13" font-weight="400" fill="var(--color-ink, #17211f)" text-anchor="middle">得到词表分数，交给第 5 站采样</text>
  <text x="596" y="40" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="13.5" font-weight="700" fill="var(--color-ink, #17211f)">主线第 4 站：逐层前向</text>
  <text x="596" y="380" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="13.5" font-weight="700" fill="var(--color-ink, #17211f)">按层号选子层</text>
  <text x="596" y="408" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="13" font-weight="400" fill="var(--color-ink, #17211f)">第 0–2 层：KDA + 稠密 MLP</text>
  <text x="596" y="432" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="13" font-weight="400" fill="var(--color-ink, #17211f)">3、7、…、43：稀疏 MLA + MoE</text>
  <text x="596" y="456" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="13" font-weight="400" fill="var(--color-ink, #17211f)">其余 31 层：KDA + MoE</text>
  <text x="568" y="530" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="13" font-weight="400" fill="var(--color-ink, #17211f)">否：进入下一层</text>
  <text x="350" y="690" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="13" font-weight="400" fill="var(--color-ink, #17211f)">是</text>
  <text x="596" y="730" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="13" font-weight="400" fill="var(--color-ink, #17211f)">MTP 层不走这条路：单条残差</text>
</svg>
