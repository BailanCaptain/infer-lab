layout: figure
id: layers-what
caption: hidden 与层的直觉（颜色深浅代表数的大小，数为示意）：每个位置一条 hidden，这里每条只画 4 个数，「她」的起点标出了数值，后文「一层怎么算」就从它算起；每一层读进所有位置的 hidden，交出同样多、同样长的一组新 hidden。第 1 层里「小红」从「借给」取到信息，第 2 层里「她」再从已经更新过的「小红」取信息；最后一层之后，用最后一个位置的 hidden 给下一个词打分
