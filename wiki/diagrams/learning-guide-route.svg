  <text x="30" y="119" font-size="13.5" fill="#087f73">零前置概念倒挂，先建立 Qwen3 通用直觉</text>

  <rect x="466" y="46" width="420" height="82" rx="10" fill="#fff4cf" stroke="#c78300" stroke-width="1.7"/>
