<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 568" width="900" height="568" role="img" aria-label="全站 01 至 12 目录阅读路线图：概念起步路线 A 沿 02 至 06 递进，新模型上线速查路线 B 走完 01 后直达 08 调参与排障，10 至 12 组随时查阅" font-family="var(--font-sans)">
  <title>全站 01–12 目录阅读路线：01 全景入门按背景分为「路线 A · 概念起步」（直入 02–06 原理主线）与「路线 B · 新模型上线速查」（走完 HF 解剖、上线、起服后直达 08 核心 CLI 调参与排障）；右侧按需深入 07 两仓架构与 09 旗舰双机全案；底部 10–12 三组作为字典与档案随时查阅。</title>
