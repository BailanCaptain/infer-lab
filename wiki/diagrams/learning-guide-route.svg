  <!-- 顶标题 -->
  <text x="14" y="28" font-size="16" font-weight="700" fill="#17211f">01–12 目录起步分流：路线 A 走左侧原理主线（02→06），路线 B 直奔 08 调参排障</text>

  <!-- 01 组起步入口（无外大框，双通道直接并列） -->
