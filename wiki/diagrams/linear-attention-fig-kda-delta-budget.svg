<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 496" width="900" height="496" role="img" aria-label="KDA 二维状态矩阵五步数值演进与单请求三笔显存记账拆解图" font-family="var(--font-sans)">
  <title>KDA 固定状态矩阵的 2×2 五步演进算例，以及 GLM 单请求 34 层 KDA（每卡 8 头）在净载荷 18.2 MiB、补齐页 85.0 MiB 与块号记账 95.6 MiB 之间的差异拆解。</title>
  <desc>上半部分以 2×2 矩阵格子直观演示 KDA 一步更新：旧状态 S_{t-1}=I 经按通道衰减 D=diag(0.5,1) 得 S̄=[[0.5,0],[0,1]]，预测 v̂=(0.5,0) 与真值 v=(3,2) 求得误差 e=(2.5,2)，按 β=0.5 纠错更新得 S_t=[[1.75,1],[0,1]]，最后由 q=(1,0) 读出 o=(1.75,1)；下半部分按比例对比三种静态容量口径并拆明多出 10.6 MiB 的两项来源。</desc>
  <defs>
    <marker id="kdaf-arr-b" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto">
      <path d="M 0 1.5 L 8.5 5 L 0 8.5 z" fill="#4c65b6"/>
    </marker>
    <marker id="kdaf-arr-a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto">
      <path d="M 0 1.5 L 8.5 5 L 0 8.5 z" fill="#c78300"/>
    </marker>
    <marker id="kdaf-arr-t" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto">
      <path d="M 0 1.5 L 8.5 5 L 0 8.5 z" fill="#087f73"/>
    </marker>
  </defs>

  <text x="14" y="24" font-size="16" font-weight="700" fill="#17211f">一、KDA 固定状态矩阵演进（2×2 示意：D=diag(0.5,1), k=q=(1,0), v=(3,2), β=0.5）</text>

  <!-- Step 0: S_{t-1} = I -->
  <rect x="14" y="40" width="136" height="176" rx="9" fill="#ece9df" stroke="#b8bcb5" stroke-width="1.4"/>
  <text x="82" y="64" text-anchor="middle" font-size="14" font-weight="700" fill="#17211f">旧状态 Sₜ₋₁</text>
  <!-- 2x2 grid -->
  <rect x="30" y="78" width="50" height="36" rx="4" fill="#ffffff" stroke="#b8bcb5" stroke-width="1.2"/>
  <text x="55" y="101" text-anchor="middle" font-size="14" font-family="var(--font-mono)" font-weight="700" fill="#17211f">1.0</text>
  <rect x="84" y="78" width="50" height="36" rx="4" fill="#ffffff" stroke="#b8bcb5" stroke-width="1.2"/>
  <text x="109" y="101" text-anchor="middle" font-size="14" font-family="var(--font-mono)" fill="#66716d">0</text>
  <rect x="30" y="118" width="50" height="36" rx="4" fill="#ffffff" stroke="#b8bcb5" stroke-width="1.2"/>
  <text x="55" y="141" text-anchor="middle" font-size="14" font-family="var(--font-mono)" fill="#66716d">0</text>
  <rect x="84" y="118" width="50" height="36" rx="4" fill="#ffffff" stroke="#b8bcb5" stroke-width="1.2"/>
  <text x="109" y="141" text-anchor="middle" font-size="14" font-family="var(--font-mono)" font-weight="700" fill="#17211f">1.0</text>
  <text x="82" y="176" text-anchor="middle" font-size="13" fill="#4d5652">固定 [dₖ, dᵥ]</text>
  <text x="82" y="198" text-anchor="middle" font-size="13" fill="#4d5652">行=key 通道</text>

  <line x1="150" y1="128" x2="170" y2="128" stroke="#4c65b6" stroke-width="1.9" marker-end="url(#kdaf-arr-b)"/>

  <!-- Step 1: Channel decay S_bar -->
  <rect x="174" y="40" width="154" height="176" rx="9" fill="#e8edff" stroke="#4c65b6" stroke-width="1.5"/>
  <text x="251" y="64" text-anchor="middle" font-size="14" font-weight="700" fill="#3a4f93">1. 通道衰减 S̄</text>
  <!-- 2x2 grid (Row 0 decayed to 0.5) -->
  <rect x="198" y="78" width="50" height="36" rx="4" fill="#fff4cf" stroke="#c78300" stroke-width="1.4"/>
  <text x="223" y="101" text-anchor="middle" font-size="14" font-family="var(--font-mono)" font-weight="700" fill="#936300">0.5</text>
  <rect x="252" y="78" width="50" height="36" rx="4" fill="#fff4cf" stroke="#c78300" stroke-width="1.1"/>
  <text x="277" y="101" text-anchor="middle" font-size="14" font-family="var(--font-mono)" fill="#936300">0</text>
  <rect x="198" y="118" width="50" height="36" rx="4" fill="#ffffff" stroke="#4c65b6" stroke-width="1.1"/>
  <text x="223" y="141" text-anchor="middle" font-size="14" font-family="var(--font-mono)" fill="#66716d">0</text>
  <rect x="252" y="118" width="50" height="36" rx="4" fill="#ffffff" stroke="#4c65b6" stroke-width="1.1"/>
  <text x="277" y="141" text-anchor="middle" font-size="14" font-family="var(--font-mono)" font-weight="700" fill="#17211f">1.0</text>
  <text x="251" y="176" text-anchor="middle" font-size="13" fill="#3a4f93">通道 0 ×0.5 减弱</text>
  <text x="251" y="198" text-anchor="middle" font-size="13" fill="#4d5652">通道 1 ×1.0 原样留</text>

  <line x1="328" y1="128" x2="348" y2="128" stroke="#c78300" stroke-width="1.9" marker-end="url(#kdaf-arr-a)"/>

  <!-- Step 2 & 3: Predict v_hat & Error e -->
  <rect x="352" y="40" width="176" height="176" rx="9" fill="#fff4cf" stroke="#c78300" stroke-width="1.5"/>
  <text x="440" y="64" text-anchor="middle" font-size="14" font-weight="700" fill="#936300">2–3. 预测与误差</text>
  <rect x="364" y="76" width="152" height="44" rx="6" fill="#ffffff" stroke="#c78300" stroke-width="1.1"/>
  <text x="440" y="95" text-anchor="middle" font-size="13" font-family="var(--font-mono)" fill="#4d5652">v̂ = S̄ᵀk = (0.5, 0)</text>
  <text x="440" y="113" text-anchor="middle" font-size="13" fill="#4d5652">先查旧记忆以为的 v</text>

  <rect x="364" y="128" width="152" height="48" rx="6" fill="#fff0e9" stroke="#b54237" stroke-width="1.3"/>
  <text x="440" y="149" text-anchor="middle" font-size="13.5" font-family="var(--font-mono)" font-weight="700" fill="#8f3229">e = v − v̂</text>
  <text x="440" y="168" text-anchor="middle" font-size="13.5" font-family="var(--font-mono)" font-weight="700" fill="#8f3229">= (2.5, 2.0)</text>

  <text x="440" y="198" text-anchor="middle" font-size="13" fill="#936300">只写偏差，防重复覆坏</text>

  <line x1="528" y1="128" x2="548" y2="128" stroke="#087f73" stroke-width="1.9" marker-end="url(#kdaf-arr-t)"/>

  <!-- Step 4: Updated S_t -->
  <rect x="552" y="40" width="166" height="176" rx="9" fill="#ddf4ef" stroke="#087f73" stroke-width="1.6"/>
  <text x="635" y="64" text-anchor="middle" font-size="14" font-weight="700" fill="#065f56">4. Delta 更新 Sₜ</text>
  <!-- 2x2 grid (Row 0 updated to [1.75, 1.0]) -->
  <rect x="572" y="78" width="60" height="36" rx="4" fill="#087f73"/>
  <text x="602" y="101" text-anchor="middle" font-size="14" font-family="var(--font-mono)" font-weight="700" fill="#ffffff">1.75</text>
  <rect x="636" y="78" width="60" height="36" rx="4" fill="#087f73"/>
  <text x="666" y="101" text-anchor="middle" font-size="14" font-family="var(--font-mono)" font-weight="700" fill="#ffffff">1.0</text>
  <rect x="572" y="118" width="60" height="36" rx="4" fill="#ffffff" stroke="#087f73" stroke-width="1.1"/>
  <text x="602" y="141" text-anchor="middle" font-size="14" font-family="var(--font-mono)" fill="#66716d">0</text>
  <rect x="636" y="118" width="60" height="36" rx="4" fill="#ffffff" stroke="#087f73" stroke-width="1.1"/>
  <text x="666" y="141" text-anchor="middle" font-size="14" font-family="var(--font-mono)" font-weight="700" fill="#17211f">1.0</text>
  <text x="635" y="176" text-anchor="middle" font-size="13" font-family="var(--font-mono)" fill="#065f56">S̄ + 0.5 · k · eᵀ</text>
  <text x="635" y="198" text-anchor="middle" font-size="13" fill="#4d5652">原地覆写，留给下步</text>

  <line x1="718" y1="128" x2="738" y2="128" stroke="#087f73" stroke-width="1.9" marker-end="url(#kdaf-arr-t)"/>

  <!-- Step 5: Readout o -->
  <rect x="742" y="40" width="144" height="176" rx="9" fill="#f7e7f2" stroke="#9a4b86" stroke-width="1.5"/>
  <text x="814" y="64" text-anchor="middle" font-size="14" font-weight="700" fill="#7a3a6a">5. 查询读出 o</text>
  <rect x="754" y="88" width="120" height="58" rx="6" fill="#ffffff" stroke="#9a4b86" stroke-width="1.3"/>
  <text x="814" y="112" text-anchor="middle" font-size="13.5" font-family="var(--font-mono)" font-weight="700" fill="#7a3a6a">o = Sₜᵀ q</text>
  <text x="814" y="134" text-anchor="middle" font-size="14" font-family="var(--font-mono)" font-weight="700" fill="#17211f">(1.75, 1.0)</text>
  <text x="814" y="176" text-anchor="middle" font-size="13" fill="#7a3a6a">常数 O(1) 访存</text>
  <text x="814" y="198" text-anchor="middle" font-size="13" fill="#4d5652">不回扫旧位置</text>

  <line x1="14" y1="232" x2="886" y2="232" stroke="#b8bcb5" stroke-width="1.3" stroke-dasharray="6 4"/>

  <text x="14" y="258" font-size="16" font-weight="700" fill="#17211f">二、固定状态 ≠ 不占显存：GLM 单请求 34 层 KDA（每卡 8 头）的三笔静态显存账</text>

  <!-- Bottom left: 3-tier proportional bar chart -->
  <rect x="14" y="274" width="548" height="210" rx="9" fill="#ffffff" stroke="#4c65b6" stroke-width="1.4"/>
  <text x="28" y="298" font-size="14.5" font-weight="700" fill="#3a4f93">三种记账口径对比（与长度无关：4 tok 与 13 万 tok 同价）</text>

  <text x="28" y="330" font-size="13.5" font-weight="700" fill="#17211f">① 单份净载荷（34 层 × 561,152 B）</text>
  <rect x="28" y="338" width="64" height="24" rx="4" fill="#087f73"/>
  <text x="102" y="355" font-size="13.5" font-weight="700" fill="#065f56">18.2 MiB（512 KiB 递推 + 36 KiB 卷积）</text>

  <text x="28" y="390" font-size="13.5" font-weight="700" fill="#17211f">② 补齐页容量（1 当前 + 3 草稿 = 4 页 × 655,360 B）</text>
  <rect x="28" y="398" width="256" height="24" rx="4" fill="#4c65b6"/>
  <rect x="284" y="398" width="43" height="24" rx="3" fill="#c78300"/>
  <text x="336" y="415" font-size="13.5" font-weight="700" fill="#3a4f93">85.0 MiB（含 14.4% 补齐）</text>

  <text x="28" y="450" font-size="13.5" font-weight="700" fill="#17211f">③ 块池记账（3 组 × 4 块 = 12 块号 × 7.969 MiB）</text>
  <rect x="28" y="458" width="336" height="20" rx="4" fill="#9a4b86"/>
  <text x="374" y="473" font-size="13.5" font-weight="700" fill="#7a3a6a">95.6 MiB（算并发看此值）</text>

  <!-- Bottom right: +10.6 MiB diff breakdown -->
  <rect x="578" y="274" width="308" height="210" rx="9" fill="#fff0e9" stroke="#b54237" stroke-width="1.4"/>
  <text x="592" y="300" font-size="14.5" font-weight="700" fill="#8f3229">为何块池账比页容量多 10.6 MiB？</text>
  <text x="592" y="330" font-size="13.5" fill="#17211f">• <tspan font-weight="700" fill="#8f3229">空主槽 +5.0 MiB</tspan>：11 层的两组</text>
  <text x="592" y="352" font-size="13.5" fill="#4d5652">  各空 1 个主槽（2 组 × 4 块）</text>
  <text x="592" y="382" font-size="13.5" fill="#17211f">• <tspan font-weight="700" fill="#8f3229">闲置小槽 +5.6 MiB</tspan>：每块号绑</text>
  <text x="592" y="404" font-size="13.5" fill="#4d5652">  12 个索引小槽，KDA 用不上</text>
  <text x="592" y="438" font-size="13.5" font-weight="700" fill="#17211f">抢占代价边界：</text>
  <text x="592" y="460" font-size="13.5" fill="#4d5652">覆盖不可逆，回收后须重扫整段历史</text>
</svg>
