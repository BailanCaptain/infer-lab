<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 700" width="880" height="700" role="img" aria-label="一层 KDA 在 GLM 专用实现里的先后与分支：投影和短卷积对所有位置一样，接下来按这一步要算的位置种类分三条路，算完拼回原来的行序，再过输出门控与输出投影，最后在 TP 组内归约一次。">
