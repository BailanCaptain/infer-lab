    symbols: [_run_prefill, l2norm_fwd, kda_gate_cumsum, chunk_kda_fwd]
  - source: vllm-ascend@db701c1f:vllm_ascend/ops/kimi_kda.py#L586-L659
    symbols: [split_non_spec, index_copy_]
