id: linear-attention-flow
mode: native-svg
size: [900, 442]
caption: 有 attention 元数据时，一层 KDA 在 GLM 专用实现里的逻辑流程：各类位置都要经过投影和短卷积，再按位置种类分流进入分段 64 prefill、单步 decode 递推与 4 页投机验证三条路径，算完经 index_copy_ 拼回原行序，经过输出门控与投影，最后在 TP 组内 All-Reduce 一次；无元数据的陪跑或试跑跳过短卷积与递推，继续执行外层投影与门控。
