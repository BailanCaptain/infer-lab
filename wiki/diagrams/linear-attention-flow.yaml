    symbols: [forward, q_proj, b_proj, f_b_proj, o_proj]
  - source: vllm-ascend@db701c1f:vllm_ascend/ops/kimi_kda.py#L294-L331
    symbols: [_run_causal_conv1d, npu_causal_conv1d_custom]
  - source: vllm-ascend@db701c1f:vllm_ascend/ops/kimi_kda.py#L343-L388
    symbols: [_recurrent_gate, _run_recurrent, recurrent_kda]
