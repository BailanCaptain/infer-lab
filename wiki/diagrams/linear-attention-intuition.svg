<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 440" width="880" height="440" role="img" aria-label="通用示意图，只画原理。上半是标准 attention：历史每个位置都留着自己的 k、v，当前位置逐个打分。下半是 linear attention：同一段历史先压进一个大小固定的状态，当前 token 先用 k、v 更新状态，再用 q 从状态里读出本层输出，状态留给下一个位置。格子只表示状态有固定的行列，不代表数值。">
  <title>通用示意图，只画原理。上半是标准 attention：历史每个位置都留着自己的 k、v，当前位置逐个打分。下半是 linear attention：同一段历史先压进一个大小固定的状态，当前 token 先用 k、v 更新状态，再用 q 从状态里读出本层输出，状态留给下一个位置。格子只表示状态有固定的行列，不代表数值。</title>
  <defs><marker id="linear-attention-intuition-ah-kv" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="var(--color-kv, #4c65b6)"/></marker><marker id="linear-attention-intuition-ah-token" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="var(--color-token, #087f73)"/></marker></defs>
  <rect x="24" y="36" width="832" height="124" rx="16" fill="none" stroke="var(--color-line-strong, #b8bcb5)" stroke-width="1.5"/>
  <text x="40" y="24" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="15" font-weight="700" fill="var(--color-ink, #17211f)">对照：标准 attention 每个位置都要留住</text>
  <rect x="24" y="196" width="832" height="216" rx="16" fill="none" stroke="var(--color-line-strong, #b8bcb5)" stroke-width="1.5"/>
  <text x="40" y="184" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="15" font-weight="700" fill="var(--color-ink, #17211f)">linear attention：先压进一个固定大小的状态，再更新、再读出</text>
