<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 500" width="900" height="500" role="img" aria-label="标准 Softmax 注意力 O(t²) 增长历史表对比线性注意力结合律固定矩阵状态 Sₜ" font-family="var(--font-sans)">
<title>标准 Softmax 注意力 vs 线性注意力结合律定长矩阵状态 Sₜ</title>
<desc>上半展示标准 Softmax 注意力下三角 O(t²) 分数表与不断增长的 KV 历史表；下半展示线性注意力利用结合律改变乘法顺序，维护固定大小矩阵状态 S_t ∈ R^(d_v × d_k)。</desc>
<defs>
  <marker id="la-red" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
    <path d="M1 1.5L8.5 5L1 8.5Z" fill="#b54237"/>
  </marker>
  <marker id="la-teal" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
    <path d="M1 1.5L8.5 5L1 8.5Z" fill="#087f73"/>
  </marker>
  <marker id="la-indigo" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
    <path d="M1 1.5L8.5 5L1 8.5Z" fill="#4c65b6"/>
  </marker>
</defs>
<!-- Top Panel: Standard Softmax Attention -->
<rect x="14" y="12" width="872" height="214" rx="10" fill="#fbfaf6" stroke="#d8d8cf" stroke-width="1.3"/>
<circle cx="36" cy="36" r="11" fill="#b54237"/>
<text x="36" y="40.5" text-anchor="middle" font-size="12.5" font-weight="700" fill="#ffffff">1</text>
<text x="54" y="41" font-size="16" font-weight="700" fill="#17211f">标准 Softmax 注意力：exp 归一化锁死括号，KV 历史随步数 t 持续膨胀</text>
<line x1="28" y1="56" x2="872" y2="56" stroke="#d8d8cf" stroke-width="1.2"/>

<!-- Growing KV History Table (Left) -->
<rect x="28" y="68" width="218" height="144" rx="8" fill="#ffffff" stroke="#d8d8cf" stroke-width="1.2"/>
<text x="137" y="89" text-anchor="middle" font-size="13.5" font-weight="700" fill="#3a4f93">逐位置追加 KV 历史表 [t × d]</text>
<g stroke="#4c65b6" stroke-width="1">
  <rect x="44" y="99" width="86" height="15" rx="2" fill="#e8edff"/>
  <rect x="138" y="99" width="86" height="15" rx="2" fill="#e8edff"/>
  <rect x="44" y="118" width="86" height="15" rx="2" fill="#dce4fc"/>
  <rect x="138" y="118" width="86" height="15" rx="2" fill="#dce4fc"/>
  <rect x="44" y="137" width="86" height="15" rx="2" fill="#cbd7fa"/>
  <rect x="138" y="137" width="86" height="15" rx="2" fill="#cbd7fa"/>
  <rect x="44" y="156" width="86" height="15" rx="2" fill="#b5c6f7"/>
  <rect x="138" y="156" width="86" height="15" rx="2" fill="#b5c6f7"/>
  <rect x="44" y="175" width="86" height="15" rx="2" fill="#fae1d8" stroke="#b54237"/>
  <rect x="138" y="175" width="86" height="15" rx="2" fill="#fae1d8" stroke="#b54237"/>
</g>
<text x="87" y="110.5" text-anchor="middle" font-size="12" fill="#3a4f93">K₁ … Kₜ₋₁</text>
<text x="181" y="110.5" text-anchor="middle" font-size="12" fill="#3a4f93">V₁ … Vₜ₋₁</text>
<text x="87" y="186.5" text-anchor="middle" font-size="12" font-weight="700" fill="#8f3229">+ Kₜ 追加</text>
<text x="181" y="186.5" text-anchor="middle" font-size="12" font-weight="700" fill="#8f3229">+ Vₜ 追加</text>
<text x="137" y="205" text-anchor="middle" font-size="12" fill="#b54237">↓ 显存与单步访存随 t 线性增长</text>

<!-- O(t^2) Lower-Triangular Score Matrix (Center) -->
<rect x="268" y="68" width="298" height="144" rx="8" fill="#ffffff" stroke="#d8d8cf" stroke-width="1.2"/>
<text x="417" y="89" text-anchor="middle" font-size="13.5" font-weight="700" fill="#8f3229">先算 softmax(QKᵀ) 下三角分数表 O(t²)</text>
<g stroke="#d8d8cf" stroke-width="1">
  <rect x="286" y="100" width="96" height="96" fill="#ece9df"/>
</g>
<g fill="#f3b8ae" stroke="#b54237" stroke-width="0.9">
  <rect x="286" y="100" width="19.2" height="19.2"/>
  <rect x="286" y="119.2" width="38.4" height="19.2"/>
  <rect x="286" y="138.4" width="57.6" height="19.2"/>
  <rect x="286" y="157.6" width="76.8" height="19.2"/>
  <rect x="286" y="176.8" width="96" height="19.2" fill="#e89a8d"/>
</g>
<text x="394" y="124" font-size="12.5" font-family="var(--font-mono)" font-weight="700" fill="#8f3229">(softmax(qₜK₁:ₜᵀ)) V₁:ₜ</text>
<text x="394" y="149" font-size="12.5" fill="#4d5652">非线性归一化必须等 t 个</text>
<text x="394" y="170" font-size="12.5" fill="#4d5652">打分全部凑齐才能加权 V</text>
<text x="394" y="193" font-size="12" font-weight="700" fill="#b54237">✗ 无法交换括号顺序</text>
<!-- Top Right Bottleneck Card -->
<rect x="588" y="68" width="284" height="144" rx="8" fill="#fff0e9" stroke="#b54237" stroke-width="1.2"/>
<text x="730" y="89" text-anchor="middle" font-size="13.5" font-weight="700" fill="#8f3229">长序列计算与访存瓶颈</text>
<text x="602" y="116" font-size="12.5" fill="#8f3229">• Prefill 总算力：O(t²·d) 平方暴涨</text>
<text x="602" y="141" font-size="12.5" fill="#8f3229">• Decode 每步：重读 1..t 全部 KV</text>
<text x="602" y="166" font-size="12.5" fill="#8f3229">• 显存占用：随上下文 t 线性扩张</text>
<text x="602" y="193" font-size="12" fill="#66716d">优势：各旧位置独立留存，可精确回查</text>
<g fill="none" stroke="#b54237" stroke-width="1.6" marker-end="url(#la-red)">
  <line x1="246" y1="140" x2="266" y2="140"/>
  <line x1="566" y1="140" x2="586" y2="140"/>
</g>

<!-- Bottom Panel: Linear Attention Fixed Matrix State -->
<rect x="14" y="240" width="872" height="248" rx="10" fill="#fbfaf6" stroke="#d8d8cf" stroke-width="1.3"/>
<circle cx="36" cy="264" r="11" fill="#087f73"/>
<text x="36" y="268.5" text-anchor="middle" font-size="12.5" font-weight="700" fill="#ffffff">2</text>
<text x="54" y="269" font-size="16" font-weight="700" fill="#17211f">线性注意力：核映射去 Softmax，结合律重打括号维护定长矩阵 Sₜ ∈ ℝ^(dᵥ×dₖ)</text>
<line x1="28" y1="284" x2="872" y2="284" stroke="#d8d8cf" stroke-width="1.2"/>

<!-- Bottom Left: Associativity Card -->
<rect x="28" y="296" width="280" height="176" rx="8" fill="#fff4cf" stroke="#c78300" stroke-width="1.2"/>
<text x="168" y="319" text-anchor="middle" font-size="13.5" font-weight="700" fill="#936300">矩阵乘法结合律交换顺序</text>
<text x="168" y="346" text-anchor="middle" font-family="var(--font-mono)" font-size="12.5" fill="#66716d">∑ᵢ vᵢ (φ(kᵢ)ᵀ φ(qₜ))  [先内积]</text>
<text x="168" y="373" text-anchor="middle" font-family="var(--font-mono)" font-size="13" font-weight="700" fill="#065f56">= ( ∑ᵢ₌₁ᵗ vᵢ φ(kᵢ)ᵀ ) φ(qₜ)</text>
<text x="168" y="400" text-anchor="middle" font-family="var(--font-mono)" font-size="12.5" font-weight="700" fill="#17211f">Sₜ = ∑ᵢ₌₁ᵗ vᵢ φ(kᵢ)ᵀ ∈ ℝ^(dᵥ×dₖ)</text>
<text x="168" y="429" text-anchor="middle" font-size="12.5" fill="#936300">不论提示词 4 词还是 128K 词</text>
<text x="168" y="452" text-anchor="middle" font-size="12.5" font-weight="700" fill="#936300">全部折叠进固定 dᵥ×dₖ 状态矩阵</text>

<!-- Bottom Center: Fixed State Matrix S_t -->
<rect x="330" y="296" width="258" height="176" rx="8" fill="#ffffff" stroke="#087f73" stroke-width="1.3"/>
<text x="459" y="319" text-anchor="middle" font-size="13.5" font-weight="700" fill="#065f56">定长矩阵状态 Sₜ₋₁ → Sₜ</text>
<g stroke-width="1.2">
  <rect x="406" y="334" width="24" height="72" rx="3" fill="#9fb0e8" stroke="#4c65b6"/>
  <rect x="433" y="334" width="24" height="72" rx="3" fill="#b8efe4" stroke="#087f73"/>
  <rect x="460" y="334" width="24" height="72" rx="3" fill="#dce4fc" stroke="#4c65b6"/>
  <rect x="487" y="334" width="24" height="72" rx="3" fill="#9fb0e8" stroke="#4c65b6"/>
</g>
<path d="M406 352h105M406 370h105M406 388h105" stroke="#ffffff" stroke-width="1.4"/>
<text x="368" y="362" text-anchor="middle" font-size="12" font-weight="700" fill="#065f56">① 写入</text>
<text x="368" y="382" text-anchor="middle" font-family="var(--font-mono)" font-size="12" fill="#4d5652">kₜ, vₜ</text>
<text x="550" y="362" text-anchor="middle" font-size="12" font-weight="700" fill="#065f56">② 读出</text>
<text x="550" y="382" text-anchor="middle" font-family="var(--font-mono)" font-size="12" fill="#4d5652">Sₜφ(qₜ)</text>
<text x="459" y="432" text-anchor="middle" font-size="12.5" font-weight="700" fill="#3a4f93">↻ Sₜ 原地留给 t+1 步继续递推</text>
<text x="459" y="454" text-anchor="middle" font-size="12" fill="#66716d">形状恒为 [dᵥ, dₖ]，与位置数 t 无关</text>

<!-- Bottom Right: Linear Attention Summary -->
<rect x="610" y="296" width="262" height="176" rx="8" fill="#ddf4ef" stroke="#087f73" stroke-width="1.2"/>
<text x="741" y="319" text-anchor="middle" font-size="13.5" font-weight="700" fill="#065f56">输出 oₜ = Sₜφ(qₜ) 与双态收益</text>
<text x="624" y="346" font-size="12.5" fill="#065f56">• 序列总计算：O(t·dᵥdₖ) 线性增长</text>
<text x="624" y="372" font-size="12.5" fill="#065f56">• Decode 单步：只读写 1 份定长 Sₜ</text>
<text x="624" y="398" font-size="12.5" fill="#065f56">• Prefill：Chunkwise 分块矩阵乘</text>
<text x="624" y="424" font-size="12.5" fill="#065f56">• Decode：Recurrent 逐词原地更新</text>
<text x="624" y="452" font-size="12" fill="#4d5652">折中：历史融合进 Sₜ，容量受维度限制</text>
<g fill="none" stroke="#087f73" stroke-width="1.6" marker-end="url(#la-teal)">
  <line x1="308" y1="370" x2="328" y2="370"/>
  <line x1="588" y1="370" x2="608" y2="370"/>
</g>
</svg>
