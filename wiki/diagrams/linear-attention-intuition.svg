  <path d="M464 330 L464 284" fill="none" stroke="var(--color-token, #087f73)" stroke-width="1.4" marker-end="url(#linear-attention-intuition-ah-token)"/>
  <path d="M692 330 L692 284" fill="none" stroke="var(--color-token, #087f73)" stroke-width="1.4" marker-end="url(#linear-attention-intuition-ah-token)"/>
  <path d="M574 332 L574 386 L342 386 L342 332" fill="none" stroke="var(--color-kv, #4c65b6)" stroke-width="1.4" stroke-dasharray="7 5" marker-end="url(#linear-attention-intuition-ah-kv)"/>
  <rect x="56" y="84" width="28" height="28" rx="4" fill="var(--color-kv, #4c65b6)" stroke="var(--color-ink, #17211f)" stroke-width="1.2"/>
