caption: >-
  标准 Softmax 注意力与线性注意力的核心机制对照：上半区因非线性 softmax(QKᵀ/√dₖ) 耦合查询与全部历史键，整段仍需 O(t²d) 交互且 Decode 每步须重扫全部历史 KV；下半区用核映射去掉逐位置 Softmax，借矩阵乘法结合律重打括号将历史压缩进固定形状矩阵状态 Sₜ ∈ ℝ^(dᵥ×dₖ)，并对照现代无显式分母读出 oₜ=Sₜφ(qₜ)（示意值 6）与早期归一化核读出 Sₜφ(qₜ)/(zₜᵀφ(qₜ))（另存 zₜ=∑φ(kᵢ)，示意 6÷3=2）。
