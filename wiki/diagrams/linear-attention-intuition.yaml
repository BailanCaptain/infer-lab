id: linear-attention-intuition
caption: >-
  标准 Softmax 注意力与线性注意力的核心机制对照：上半区因非线性 softmax(QKᵀ/√dₖ) 耦合查询与全部历史键，即便在线分块可免存整张分数表、逐块重标定分母与加权 V，整段仍需 O(t²d) 交互且 Decode 每步须重扫全部历史 KV；下半区用核映射去掉逐位置 Softmax，借矩阵乘法结合律重打括号，将任意长历史压缩进固定形状矩阵状态 Sₜ ∈ ℝ^(dᵥ×dₖ)，每步仅原地更新并读出该定长状态。
