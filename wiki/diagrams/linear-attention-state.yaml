id: linear-attention-state
caption: >-
  线性注意力的双执行态与状态传递数据流：上半区 Prefill 采用 Chunkwise 分块算法（示意 C=2, dₖ=2, dᵥ=1；生产常取 C=64），每块均由「跨块项 + 块内项」两路相加汇合为 O_c [C×dᵥ]（初态 S₀=0 时首位置跨块项为 0、块内项为 2，完整输出仍为 2），块间按序传递定长状态 S₀ → S₁ → S₂ 并将最终 S_final 与短卷积尾窗写回请求的设备状态槽；下半区 Decode 单步从设备状态槽读取 Sₜ₋₁ 与短卷积缓存，经衰减、预测误差外积原地更新 Sₜ 并读出 oₜ。
