<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 720" width="900" height="720" role="img" aria-label="标准 Qwen3-8B（词表 151,936）在 TP=2 下从第 35 层末尾到采样的流转：单流 hidden [T, 4096] 经最终 RMSNorm 后，先按 logits_indices 挑出每条请求需采样的最后 1 行（单请求为 [1, 4096]），再由本卡 ParallelLMHead 乘半张词表权重得到 [1, 75968] 分数，最后经一次 TP All-Gather 拼齐 [1, 151936] 完整词表 logits 交给 Sampler（TP=1 则直接完整输出、0 次通信）。">
  <title>标准 Qwen3-8B（词表 151,936）在 TP=2 下从第 35 层末尾到采样的流转：单流 hidden [T, 4096] 经最终 RMSNorm 后，先按 logits_indices 挑出每条请求需采样的最后 1 行（单请求为 [1, 4096]），再由本卡 ParallelLMHead 乘半张词表权重得到 [1, 75968] 分数，最后经一次 TP All-Gather 拼齐 [1, 151936] 完整词表 logits 交给 Sampler（TP=1 则直接完整输出、0 次通信）。</title>
  <defs><marker id="lm-head-flow-qwen3-ah-ink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="var(--color-ink, #17211f)"/></marker></defs>
  <path d="M380 76 L380 106" fill="none" stroke="var(--color-ink, #17211f)" stroke-width="1.4" marker-end="url(#lm-head-flow-qwen3-ah-ink)"/>
  <path d="M380 158 L380 188" fill="none" stroke="var(--color-ink, #17211f)" stroke-width="1.4" marker-end="url(#lm-head-flow-qwen3-ah-ink)"/>
  <path d="M380 240 L380 270" fill="none" stroke="var(--color-ink, #17211f)" stroke-width="1.4" marker-end="url(#lm-head-flow-qwen3-ah-ink)"/>
  <path d="M600 294 L640 294" fill="none" stroke="var(--color-ink, #17211f)" stroke-width="1.4" stroke-dasharray="7 5" marker-end="url(#lm-head-flow-qwen3-ah-ink)"/>
  <path d="M380 318 L380 350" fill="none" stroke="var(--color-ink, #17211f)" stroke-width="1.4" marker-end="url(#lm-head-flow-qwen3-ah-ink)"/>
  <path d="M380 406 L380 438" fill="none" stroke="var(--color-ink, #17211f)" stroke-width="1.4" marker-end="url(#lm-head-flow-qwen3-ah-ink)"/>
  <path d="M600 462 L640 462" fill="none" stroke="var(--color-ink, #17211f)" stroke-width="1.4" stroke-dasharray="7 5" marker-end="url(#lm-head-flow-qwen3-ah-ink)"/>
  <path d="M380 486 L380 518" fill="none" stroke="var(--color-ink, #17211f)" stroke-width="1.4" marker-end="url(#lm-head-flow-qwen3-ah-ink)"/>
  <path d="M380 574 L380 600" fill="none" stroke="var(--color-ink, #17211f)" stroke-width="1.4" marker-end="url(#lm-head-flow-qwen3-ah-ink)"/>
  <path d="M380 642 L380 662" fill="none" stroke="var(--color-ink, #17211f)" stroke-width="1.4" marker-end="url(#lm-head-flow-qwen3-ah-ink)"/>
  <rect x="160" y="24" width="440" height="52" rx="8" fill="var(--color-token-soft, #ddf4ef)" stroke="var(--color-token, #087f73)" stroke-width="1.4"/>
  <text x="380" y="46" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="14" font-weight="700" fill="var(--color-ink, #17211f)" text-anchor="middle">第 35 层输出 → 最终 RMSNorm</text>
  <text x="380" y="65" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="13" font-weight="400" fill="#065f56" text-anchor="middle">单流 hidden [T, 4096]，TP=2 两卡一致</text>
  <rect x="160" y="106" width="440" height="52" rx="8" fill="var(--color-control-soft, #f1efe8)" stroke="var(--color-line-strong, #b8bcb5)" stroke-width="1.4"/>
  <text x="380" y="128" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="14" font-weight="700" fill="var(--color-ink, #17211f)" text-anchor="middle">按 logits_indices 挑出采样行</text>
  <text x="380" y="147" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="13" font-weight="400" fill="var(--color-ink-muted, #66716d)" text-anchor="middle">标准单请求取末位 1 行 → [1, 4096]</text>
  <rect x="160" y="188" width="440" height="52" rx="8" fill="var(--color-control-soft, #f1efe8)" stroke="var(--color-line-strong, #b8bcb5)" stroke-width="1.4"/>
  <text x="380" y="210" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="14" font-weight="700" fill="var(--color-ink, #17211f)" text-anchor="middle">进入 AscendLogitsProcessor._get_logits</text>
  <text x="380" y="229" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="13" font-weight="400" fill="var(--color-ink-muted, #66716d)" text-anchor="middle">检查独立 lmhead_tp 与归约采样开关</text>
  <rect x="160" y="270" width="440" height="48" rx="8" fill="var(--color-control-soft, #f1efe8)" stroke="var(--color-line-strong, #b8bcb5)" stroke-width="1.4"/>
  <text x="380" y="290" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="14" font-weight="700" fill="var(--color-ink, #17211f)" text-anchor="middle">单独配置了 lmhead_tp 吗？</text>
  <text x="380" y="309" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="13" font-weight="400" fill="var(--color-ink-muted, #66716d)" text-anchor="middle">默认未设，复用模型 TP=2</text>
  <rect x="640" y="264" width="236" height="60" rx="8" fill="var(--color-surface, #fbfaf6)" stroke="var(--color-comm, #9a4b86)" stroke-opacity="0.45" stroke-width="1.3" stroke-dasharray="5 4"/>
  <text x="758" y="290" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="13" font-weight="400" fill="#7a3a6a" text-anchor="middle">收集 hidden 分段打分</text>
  <text x="758" y="309" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="13" font-weight="400" fill="#7a3a6a" text-anchor="middle">算完再按请求切回</text>
  <rect x="160" y="350" width="440" height="56" rx="8" fill="var(--color-weight-soft, #fff4cf)" stroke="var(--color-weight, #c78300)" stroke-width="1.4"/>
  <text x="380" y="374" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="14" font-weight="700" fill="var(--color-ink, #17211f)" text-anchor="middle">本卡 ParallelLMHead：[1, 4096] × [4096, 75968]</text>
  <text x="380" y="393" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="13" font-weight="400" fill="#936300" text-anchor="middle">每卡算出半张词表 [1, 75968] 分数</text>
  <rect x="160" y="438" width="440" height="48" rx="8" fill="var(--color-control-soft, #f1efe8)" stroke="var(--color-line-strong, #b8bcb5)" stroke-width="1.4"/>
  <text x="380" y="458" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="14" font-weight="700" fill="var(--color-ink, #17211f)" text-anchor="middle">开启分段采样归约了吗？</text>
  <text x="380" y="477" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="13" font-weight="400" fill="var(--color-ink-muted, #66716d)" text-anchor="middle">默认关闭，走标准拼齐</text>
  <rect x="640" y="432" width="236" height="60" rx="8" fill="var(--color-surface, #fbfaf6)" stroke="var(--color-comm, #9a4b86)" stroke-opacity="0.45" stroke-width="1.3" stroke-dasharray="5 4"/>
  <text x="758" y="458" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="13" font-weight="400" fill="#7a3a6a" text-anchor="middle">各卡先取局部候选</text>
  <text x="758" y="477" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="13" font-weight="400" fill="#7a3a6a" text-anchor="middle">免去全词表 All-Gather</text>
  <rect x="160" y="518" width="440" height="56" rx="8" fill="var(--color-comm-soft, #f5e6f0)" stroke="var(--color-comm, #9a4b86)" stroke-width="1.4"/>
  <text x="380" y="542" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="14" font-weight="700" fill="var(--color-ink, #17211f)" text-anchor="middle">TP=2 All-Gather → [1, 151936] logits</text>
  <text x="380" y="561" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="13" font-weight="400" fill="#7a3a6a" text-anchor="middle">两卡拼出完整词表分数（TP=1 免通信）</text>
  <rect x="160" y="600" width="440" height="42" rx="8" fill="var(--color-control-soft, #f1efe8)" stroke="var(--color-line-strong, #b8bcb5)" stroke-width="1.4"/>
  <text x="380" y="617" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="14" font-weight="700" fill="var(--color-ink, #17211f)" text-anchor="middle">按 org_vocab_size 裁掉词表对齐补列</text>
  <text x="380" y="636" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="13" font-weight="400" fill="var(--color-ink-muted, #66716d)" text-anchor="middle">151,936 恰被 2 整除，无需删列</text>
  <rect x="160" y="662" width="440" height="46" rx="8" fill="var(--color-token-soft, #ddf4ef)" stroke="var(--color-token, #087f73)" stroke-width="1.4"/>
  <text x="380" y="690" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="14" font-weight="700" fill="var(--color-ink, #17211f)" text-anchor="middle">送入第 5 站 Sampler 抽取 1 个新 token</text>
  <text x="620" y="282" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="13.5" font-weight="400" fill="var(--color-ink, #17211f)" text-anchor="middle">设了</text>
  <text x="620" y="450" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="13.5" font-weight="400" fill="var(--color-ink, #17211f)" text-anchor="middle">开启</text>
  <text x="392" y="338" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="13.5" font-weight="400" fill="var(--color-ink, #17211f)">默认未设</text>
  <text x="392" y="506" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="13.5" font-weight="400" fill="var(--color-ink, #17211f)">默认关闭</text>
</svg>
