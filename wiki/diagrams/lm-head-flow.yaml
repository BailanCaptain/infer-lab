layout: figure
id: lm-head-flow
caption: 固定 db701c1f、普通 TP8 且 SP 关闭时，GLM 双机每张卡上从最后一层到采样的先后。两个开关未设置，走左边默认路径：先挑出要打分的行，本卡乘自己那段权重，再一次 TP8 All-Gather 拼齐分数；右边是开关分支。图中 prefill 每请求 1 行指完整提示词已处理且未请求提示词概率的情况。MTP 草拟复用输出权重、投影与收集路径，但它走单流 MTP 模块，不经过主干第 44 层的四流平均。
size: [900, 770]
items:
  - { at: [180, 20], size: [420, 52], text: 最后一层之后：四路折回一条 → 最终 RMSNorm, sub: '每卡 [T, 4096]，8 张卡相同', tone: token }
  - { at: [180, 104], size: [420, 52], text: 挑出要打分的行, sub: prefill 每请求 1 行；带 3 个候选的 decode 每请求 4 行, style: plain }
  - { at: [180, 188], size: [420, 52], text: 进入 Ascend 版的打分函数, sub: 先看两个开关，决定走哪条路, style: plain }
  - { at: [180, 272], size: [420, 48], text: 细粒度 TP 给输出头单独设了规模吗？, sub: 默认规模 0, style: plain }
  - { at: [640, 266], size: [240, 60], text: 收集 hidden → 分段打分, sub: 再用 All-to-All 送回, tone: comm, style: faded }
  - { at: [180, 356], size: [420, 56], text: '本卡矩阵乘 [n, 4096] × [4096, 19360]', sub: 得到本卡 19360 个词的分数, tone: weight }
  - { at: [180, 448], size: [420, 48], text: 采样归约开了吗？, sub: 默认关, style: plain }
  - { at: [640, 442], size: [240, 60], text: 不拼齐分数, sub: 各卡留自己那段，采样按分段做, tone: comm, style: faded }
  - { at: [180, 532], size: [420, 56], text: 'TP8 All-Gather → [n, 154880]', sub: 8 张卡都拿到完整分数, tone: comm }
  - { at: [180, 620], size: [420, 44], text: 去掉词表补齐的列, sub: 154880 没有补齐，这一步不删任何列, style: plain }
  - { at: [180, 696], size: [420, 52], text: 采样：贪心取最大，或按温度抽, sub: MTP 草拟每遍也走这条路，取最大, tone: token }
