<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 340" width="900" height="340" role="img" aria-label="示意：词表只有 6 个 token。提示词「我喜欢」走完所有层后，最后一个位置留下一条 4 个数的隐藏向量。lm_head 给每个词存一列、一列也是 4 个数；隐藏向量和某一列逐位相乘再相加，就是这个词的分数。6 列各做一次，得到 6 个分数（logits），其中「猫」最高，采样就最可能挑中它。">
  <title>示意：词表只有 6 个 token。提示词「我喜欢」走完所有层后，最后一个位置留下一条 4 个数的隐藏向量。lm_head 给每个词存一列、一列也是 4 个数；隐藏向量和某一列逐位相乘再相加，就是这个词的分数。6 列各做一次，得到 6 个分数（logits），其中「猫」最高，采样就最可能挑中它。</title>
