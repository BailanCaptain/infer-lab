layout: figure
id: lm-head-intuition
caption: 示意：词表只有 6 个 token。提示词「我喜欢」走完所有层后，最后一个位置留下一条 4 个数的隐藏向量。lm_head 给每个词存一列、一列也是 4 个数；隐藏向量和某一列逐位相乘再相加，就是这个词的分数。6 列各做一次，得到 6 个分数（logits），其中「猫」最高，采样就最可能挑中它。
size: [900, 340]
texts:
  - { at: [30, 34], text: '提示词「我喜欢」走完所有层，最后一个位置交出一条向量', strong: true }
  - { at: [221, 128], text: 和每一列, anchor: middle, size: 12.5 }
  - { at: [221, 146], text: 逐位相乘, anchor: middle, size: 12.5 }
  - { at: [221, 164], text: 再相加, anchor: middle, size: 12.5 }
  - { at: [614, 136], text: 输出权重, strong: true, tone: weight }
  - { at: [614, 156], text: 每个词一列, size: 12.5 }
  - { at: [614, 174], text: 一列 4 个数, size: 12.5 }
