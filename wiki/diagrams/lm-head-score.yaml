    rows: 4
    cols: 1
    cell: [64, 36]
    tone: token
    style: solid
    label: 隐藏向量 h
    cells:
      - { at: [0, 0], text: '1.0' }
      - { at: [1, 0], text: '0.5' }
      - { at: [2, 0], text: '−1.0' }
      - { at: [3, 0], text: '2.0' }
  - at: [202, 80]
    rows: 4
    cols: 1
    cell: [64, 36]
    tone: weight
    style: solid
    label: 「猫」这一列
    cells:
