layout: figure
id: lm-head-score
caption: 示意：隐藏向量 h = [1.0, 0.5, −1.0, 2.0] 和输出权重里「猫」那一列 [0.6, 0.2, −0.4, 0.5] 对齐，逐位相乘得到 [0.6, 0.1, 0.4, 1.0]，加起来是 2.1，就是「猫」的分数。其余 5 列照样各做一次，得到下面一排 6 个分数；表里的数都是为演示编的。
size: [900, 390]
texts:
  - { at: [30, 34], text: 先只看「猫」这一列：对齐的位置相乘，再全部加起来, strong: true }
  - { at: [170, 158], text: '×', anchor: middle, size: 22 }
  - { at: [300, 158], text: '=', anchor: middle, size: 22 }
  - { at: [60, 318], text: 6 列各算一次, strong: true }
