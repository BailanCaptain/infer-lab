<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 480" width="900" height="480" role="img" aria-label="GLM 双机的一个 TP 组：输出权重共 154880 个词，按词编号切成 8 段，每张卡存连续的 19360 个词（图里画出卡 0、卡 1、卡 7，中间 5 张同理）。8 张卡拿同一批完整的隐藏向量各算自己那段，得到的分数已是这些词的最终分数，不需要相加；All-Gather 把 8 段按词编号首尾相接，8 张卡每张都拿到底部这条完整的 154880 个分数，不是只汇到某一张卡。n 是这一步要打分的行数。">
  <title>GLM 双机的一个 TP 组：输出权重共 154880 个词，按词编号切成 8 段，每张卡存连续的 19360 个词（图里画出卡 0、卡 1、卡 7，中间 5 张同理）。8 张卡拿同一批完整的隐藏向量各算自己那段，得到的分数已是这些词的最终分数，不需要相加；All-Gather 把 8 段按词编号首尾相接，8 张卡每张都拿到底部这条完整的 154880 个分数，不是只汇到某一张卡。n 是这一步要打分的行数。</title>
