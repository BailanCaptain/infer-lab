  - { at: [590, 246], text: '⋯', anchor: middle, size: 22 }
  - { at: [50, 458], text: 'All-Gather：拼成完整的 [n, 154880]', tone: comm, strong: true }
  - { at: [470, 458], text: 不是收到某一张卡上：8 张卡各有这一整条, tone: comm }
