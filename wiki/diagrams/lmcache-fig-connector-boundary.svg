<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 486" width="900" height="486" role="img" aria-label="LMCache 与 vLLM 引擎交接边界、use_native 双路分流及昇腾仓内注册移除演进" font-family="var(--font-sans)">
  <title>LMCache 引擎交接边界、use_native 分流与 v0.30.0/main 移除仓内注册演进</title>
  <desc>LMCacheConnectorV1, requires_piecewise_for_cudagraph, register_kv_caches, bind_connector_metadata, register_connector</desc>
  <defs>
    <marker id="lmc1-arr-blue" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0 1.5L9 5L0 8.5z" fill="#4c65b6"/>
    </marker>
    <marker id="lmc1-arr-teal" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0 1.5L9 5L0 8.5z" fill="#087f73"/>
    </marker>
    <marker id="lmc1-arr-plum" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0 1.5L9 5L0 8.5z" fill="#9a4b86"/>
    </marker>
    <marker id="lmc1-arr-ink" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0 1.5L9 5L0 8.5z" fill="#17211f"/>
    </marker>
  </defs>

  <!-- Zone 1: Engine <-> Connector (use_native fork) <-> Tiered Storage -->
  <circle cx="24" cy="24" r="12" fill="#4c65b6"/>
  <text x="24" y="28.5" text-anchor="middle" font-size="12.5" font-weight="700" fill="#ffffff">1</text>
  <text x="44" y="30" font-size="16" font-weight="700" fill="#17211f">交接边界：引擎管调度借块，LMCacheConnectorV1 按 use_native 分流到外部存储</text>

  <!-- Left: vLLM Engine -->
  <rect x="16" y="48" width="240" height="196" rx="8" fill="#e8edff" stroke="#4c65b6" stroke-width="1.5"/>
  <text x="30" y="72" font-size="15" font-weight="700" fill="#3a4f93">vLLM 推理引擎侧</text>
  <rect x="30" y="86" width="212" height="44" rx="5" fill="#ffffff" stroke="#4c65b6" stroke-width="1.2"/>
  <text x="136" y="106" text-anchor="middle" font-size="13.5" font-weight="700" fill="#3a4f93">① Scheduler 排队查询</text>
  <text x="136" y="123" text-anchor="middle" font-size="13.5" fill="#4d5652">照常借本地块与排队</text>
  <rect x="30" y="138" width="212" height="44" rx="5" fill="#ffffff" stroke="#4c65b6" stroke-width="1.2"/>
  <text x="136" y="158" text-anchor="middle" font-size="13.5" font-weight="700" fill="#3a4f93">② Worker 前后搬两趟</text>
  <text x="136" y="175" text-anchor="middle" font-size="13.5" fill="#4d5652">传显存槽位地址加载/写回</text>
  <rect x="30" y="190" width="212" height="40" rx="5" fill="#ece9df" stroke="#b8bcb5" stroke-width="1.2"/>
  <text x="136" y="215" text-anchor="middle" font-size="13.5" fill="#4d5652">③ 结束暂缓还块防覆写</text>

  <!-- Arrows Engine <-> Connector -->
  <line x1="256" y1="108" x2="294" y2="108" stroke="#4c65b6" stroke-width="1.8" marker-end="url(#lmc1-arr-blue)"/>
  <line x1="256" y1="160" x2="294" y2="160" stroke="#4c65b6" stroke-width="1.8" marker-end="url(#lmc1-arr-blue)"/>

  <!-- Center: LMCacheConnectorV1 + use_native fork -->
  <rect x="300" y="48" width="292" height="196" rx="8" fill="#f7e7f2" stroke="#9a4b86" stroke-width="1.5"/>
  <text x="314" y="72" font-size="15" font-weight="700" fill="#7a3a6a">LMCacheConnectorV1 插口</text>
  <rect x="314" y="88" width="264" height="54" rx="6" fill="#ffffff" stroke="#9a4b86" stroke-width="1.4"/>
  <text x="326" y="110" font-size="13.5" font-weight="700" fill="#7a3a6a">use_native = false（默认）</text>
  <text x="326" y="132" font-size="13.5" fill="#4d5652">→ 调外部 lmcache 软件包 adapter</text>

  <rect x="314" y="152" width="264" height="54" rx="6" fill="#fff4cf" stroke="#c78300" stroke-width="1.4"/>
  <text x="326" y="174" font-size="13.5" font-weight="700" fill="#936300">use_native = true（显式指定）</text>
  <text x="326" y="196" font-size="13.5" fill="#4d5652">→ 走 vLLM 自带 v1 adapter</text>

  <text x="446" y="232" text-anchor="middle" font-size="13.5" font-weight="700" fill="#7a3a6a">逐层模式强制 piecewise 录图（v0.30.0+）</text>

  <!-- Arrows Connector <-> Storage -->
  <line x1="592" y1="115" x2="630" y2="115" stroke="#9a4b86" stroke-width="1.8" marker-end="url(#lmc1-arr-plum)"/>
  <line x1="592" y1="179" x2="630" y2="179" stroke="#087f73" stroke-width="1.8" marker-end="url(#lmc1-arr-teal)"/>

  <!-- Right: Tiered Storage Stack -->
  <rect x="636" y="48" width="248" height="196" rx="8" fill="#ddf4ef" stroke="#087f73" stroke-width="1.5"/>
  <text x="650" y="72" font-size="15" font-weight="700" fill="#065f56">外部 LMCache 分层存储</text>
  <rect x="650" y="86" width="220" height="36" rx="5" fill="#ffffff" stroke="#087f73" stroke-width="1.2"/>
  <text x="760" y="109" text-anchor="middle" font-size="13.5" font-weight="700" fill="#065f56">L2 · 主机内存（可单独关闭）</text>
  <rect x="650" y="130" width="220" height="36" rx="5" fill="#ffffff" stroke="#087f73" stroke-width="1.2"/>
  <text x="760" y="153" text-anchor="middle" font-size="13.5" font-weight="700" fill="#065f56">L3 · 本地磁盘（独立配置）</text>
  <rect x="650" y="174" width="220" height="36" rx="5" fill="#ffffff" stroke="#087f73" stroke-width="1.2"/>
  <text x="760" y="197" text-anchor="middle" font-size="13.5" font-weight="700" fill="#065f56">L4 · 远端共享存储</text>
  <text x="760" y="232" text-anchor="middle" font-size="13.5" fill="#4d5652">全中仍留 1 位给引擎采样</text>

  <!-- Divider -->
  <line x1="16" y1="262" x2="884" y2="262" stroke="#d8d8cf" stroke-width="1.4" stroke-dasharray="6 4"/>

  <!-- Zone 2: Ascend Packaging Removal Diff (v0.23/v0.26 vs v0.30.0/main) -->
  <circle cx="24" cy="286" r="12" fill="#c78300"/>
  <text x="24" y="290.5" text-anchor="middle" font-size="12.5" font-weight="700" fill="#ffffff">2</text>
  <text x="44" y="292" font-size="16" font-weight="700" fill="#17211f">昇腾注册路径演进：v0.30.0 / main 移除仓内薄包装，改由插件包自注册</text>

  <!-- Old path -->
  <rect x="16" y="310" width="414" height="114" rx="8" fill="#ece9df" stroke="#b8bcb5" stroke-width="1.4"/>
  <text x="30" y="335" font-size="14.5" font-weight="700" fill="#4d5652">v0.23.0 / v0.26.0rc（旧仓内薄包装）</text>
  <rect x="30" y="348" width="180" height="34" rx="5" fill="#ffffff" stroke="#b8bcb5" stroke-width="1.2"/>
  <text x="120" y="370" text-anchor="middle" font-size="13.5" font-family="var(--font-mono)" fill="#17211f">LMCacheAscendConnector</text>
  <line x1="210" y1="365" x2="236" y2="365" stroke="#17211f" stroke-width="1.5" marker-end="url(#lmc1-arr-ink)"/>
  <rect x="242" y="348" width="174" height="34" rx="5" fill="#ffffff" stroke="#b8bcb5" stroke-width="1.2"/>
  <text x="329" y="370" text-anchor="middle" font-size="13.5" fill="#4d5652">import 插件再导上游类</text>
  <text x="30" y="408" font-size="13.5" fill="#66716d">仓内无存储策略；升级后沿用旧名会报找不到连接器</text>

  <!-- New path -->
  <rect x="454" y="310" width="430" height="114" rx="8" fill="#fff4cf" stroke="#c78300" stroke-width="1.5"/>
  <text x="468" y="335" font-size="14.5" font-weight="700" fill="#936300">v0.30.0 / main（插件包自注册 + 延迟加载适配）</text>
  <rect x="468" y="348" width="194" height="34" rx="5" fill="#fff0e9" stroke="#b54237" stroke-width="1.3" stroke-dasharray="4 3"/>
  <text x="565" y="370" text-anchor="middle" font-size="13.5" font-weight="700" fill="#8f3229">✗ 仓内注册与包装已删</text>
  <line x1="662" y1="365" x2="686" y2="365" stroke="#17211f" stroke-width="1.5" marker-end="url(#lmc1-arr-ink)"/>
  <rect x="692" y="348" width="178" height="34" rx="5" fill="#ddf4ef" stroke="#087f73" stroke-width="1.3"/>
  <text x="781" y="370" text-anchor="middle" font-size="13.5" font-weight="700" fill="#065f56">插件包独立注册入口</text>
  <text x="468" y="408" font-size="13.5" fill="#4d5652">main 增 bind_connector_metadata 对接延迟加载时序</text>

  <!-- Bottom 4-version alignment bar -->
  <rect x="16" y="438" width="868" height="36" rx="6" fill="#ece9df" stroke="#d8d8cf" stroke-width="1.2"/>
  <text x="450" y="461" text-anchor="middle" font-size="13.5" font-weight="700" fill="#17211f">四方版本须同时钉定：vLLM  +  vllm-ascend  +  LMCache  +  LMCache-Ascend（不直接登记 NPU 显存直传）</text>
</svg>
