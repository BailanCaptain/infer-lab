<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 290" width="900" height="290" role="img" aria-label="发布分支由 vllm-ascend 替 LMCache 登记名字再转过去；main 把登记交回 LMCache-Ascend 插件">
  <title>发布分支由 vllm-ascend 替 LMCache 登记名字再转过去；main 把登记交回 LMCache-Ascend 插件</title>
  <defs><marker id="lmcache-ah-control" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="var(--color-control, #66716d)"/></marker><marker id="lmcache-ah-kv" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="var(--color-kv, #4c65b6)"/></marker></defs>
  <rect x="30" y="50" width="560" height="200" rx="16" fill="none" stroke="var(--color-line-strong, #b8bcb5)" stroke-width="1.5"/>
  <text x="46" y="38" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="15" font-weight="700" fill="var(--color-ink, #17211f)">v0.23 / v0.26 分支</text>
  <rect x="620" y="50" width="250" height="200" rx="16" fill="none" stroke="var(--color-line-strong, #b8bcb5)" stroke-width="1.5"/>
  <text x="636" y="38" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="15" font-weight="700" fill="var(--color-ink, #17211f)">main</text>
  <path d="M185 145 L243 145" fill="none" stroke="var(--color-control, #66716d)" stroke-width="1.4" marker-end="url(#lmcache-ah-control)"/>
  <path d="M375 145 L433 145" fill="none" stroke="var(--color-kv, #4c65b6)" stroke-width="1.4" marker-end="url(#lmcache-ah-kv)"/>
  <rect x="55" y="110" width="130" height="70" rx="8" fill="var(--color-surface-sunken, #ece9df)" stroke="var(--color-ink, #17211f)" stroke-width="1.5"/>
  <text x="120" y="150" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="14" font-weight="700" fill="var(--color-ink, #17211f)" text-anchor="middle">vllm-ascend 登记</text>
  <rect x="245" y="110" width="130" height="70" rx="8" fill="var(--color-surface-sunken, #ece9df)" stroke="var(--color-control, #66716d)" stroke-opacity="0.4" stroke-width="1.5" stroke-dasharray="5 4"/>
  <text x="310" y="150" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="13" font-weight="400" fill="#4d5652" text-anchor="middle">昇腾包装层</text>
  <rect x="435" y="110" width="130" height="70" rx="8" fill="var(--color-kv, #4c65b6)" stroke="var(--color-ink, #17211f)" stroke-width="1.5"/>
  <text x="500" y="150" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="14" font-weight="700" fill="var(--color-ink-inverse, #ffffff)" text-anchor="middle">LMCache 存取</text>
  <rect x="650" y="110" width="190" height="70" rx="8" fill="var(--color-kv, #4c65b6)" stroke="var(--color-ink, #17211f)" stroke-width="1.5"/>
  <text x="745" y="150" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="14" font-weight="700" fill="var(--color-ink-inverse, #ffffff)" text-anchor="middle">插件自己登记并存取</text>
  <rect x="650" y="205" width="115" height="24" rx="12" fill="var(--color-danger, #b54237)"/>
  <text x="707.5" y="222" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="13" font-weight="700" fill="var(--color-ink-inverse, #ffffff)" text-anchor="middle">旧名字不再登记</text>
</svg>
