<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 424" width="900" height="424" role="img" aria-label="分层命中的教学示意：假设主机内存有段 1、段 2，磁盘或远端有段 3，段 4 未命中、自己计算。箭头表示查询与恢复的逻辑方向；是否逐层探测、远端数据是否经过主机内存由外部 LMCache 实现决定，本图的 pins 只证明连接器的查询、加载与保存接口。">
  <title>分层命中的教学示意：假设主机内存有段 1、段 2，磁盘或远端有段 3，段 4 未命中、自己计算。箭头表示查询与恢复的逻辑方向；是否逐层探测、远端数据是否经过主机内存由外部 LMCache 实现决定，本图的 pins 只证明连接器的查询、加载与保存接口。</title>
  <defs><marker id="lmcache-ah-control" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="var(--color-control, #66716d)"/></marker><marker id="lmcache-ah-kv" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="var(--color-kv, #4c65b6)"/></marker></defs>
  <rect x="20" y="60" width="860" height="92" rx="16" fill="none" stroke="var(--color-line-strong, #b8bcb5)" stroke-width="1.5"/>
  <text x="36" y="48" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="15" font-weight="700" fill="var(--color-ink, #17211f)">显存（本实例）</text>
