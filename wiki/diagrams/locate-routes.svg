<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 250" width="900" height="250" role="img" aria-label="三种起点，第一站各不相同：报错先找插件自己的第一帧，配置项先找配置文件，上游名字先找补丁目录；三条路最后都缩到一个方法">
  <title>三种起点，第一站各不相同：报错先找插件自己的第一帧，配置项先找配置文件，上游名字先找补丁目录；三条路最后都缩到一个方法</title>
  <defs><marker id="locate-routes-ah-ink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="var(--color-ink, #17211f)"/></marker><marker id="locate-routes-ah-control" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="var(--color-control, #66716d)"/></marker></defs>
  <path d="M150 74 L150 110" fill="none" stroke="var(--color-ink, #17211f)" stroke-width="1.4" marker-end="url(#locate-routes-ah-ink)"/>
  <path d="M450 74 L450 110" fill="none" stroke="var(--color-ink, #17211f)" stroke-width="1.4" marker-end="url(#locate-routes-ah-ink)"/>
  <path d="M750 74 L750 110" fill="none" stroke="var(--color-ink, #17211f)" stroke-width="1.4" marker-end="url(#locate-routes-ah-ink)"/>
  <path d="M150 154 L450 190" fill="none" stroke="var(--color-control, #66716d)" stroke-width="1.4" marker-end="url(#locate-routes-ah-control)"/>
  <path d="M450 154 L450 190" fill="none" stroke="var(--color-control, #66716d)" stroke-width="1.4" marker-end="url(#locate-routes-ah-control)"/>
  <path d="M750 154 L450 190" fill="none" stroke="var(--color-control, #66716d)" stroke-width="1.4" marker-end="url(#locate-routes-ah-control)"/>
  <rect x="50" y="30" width="200" height="44" rx="8" fill="var(--color-surface-sunken, #ece9df)" stroke="var(--color-ink, #17211f)" stroke-width="1.5"/>
  <text x="150" y="57" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="14" font-weight="700" fill="var(--color-ink, #17211f)" text-anchor="middle">一条报错</text>
  <rect x="350" y="30" width="200" height="44" rx="8" fill="var(--color-surface-sunken, #ece9df)" stroke="var(--color-ink, #17211f)" stroke-width="1.5"/>
  <text x="450" y="57" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="14" font-weight="700" fill="var(--color-ink, #17211f)" text-anchor="middle">一个配置项</text>
  <rect x="650" y="30" width="200" height="44" rx="8" fill="var(--color-surface-sunken, #ece9df)" stroke="var(--color-ink, #17211f)" stroke-width="1.5"/>
  <text x="750" y="57" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="14" font-weight="700" fill="var(--color-ink, #17211f)" text-anchor="middle">一个上游名字</text>
  <rect x="50" y="110" width="200" height="44" rx="8" fill="var(--color-control, #66716d)" stroke="var(--color-ink, #17211f)" stroke-width="1.5"/>
  <text x="150" y="137" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="14" font-weight="700" fill="var(--color-ink-inverse, #ffffff)" text-anchor="middle">插件的第一帧</text>
  <rect x="350" y="110" width="200" height="44" rx="8" fill="var(--color-control, #66716d)" stroke="var(--color-ink, #17211f)" stroke-width="1.5"/>
  <text x="450" y="137" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="14" font-weight="700" fill="var(--color-ink-inverse, #ffffff)" text-anchor="middle">配置文件里的键</text>
  <rect x="650" y="110" width="200" height="44" rx="8" fill="var(--color-control, #66716d)" stroke="var(--color-ink, #17211f)" stroke-width="1.5"/>
  <text x="750" y="137" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="14" font-weight="700" fill="var(--color-ink-inverse, #ffffff)" text-anchor="middle">先查补丁目录</text>
  <rect x="325" y="190" width="250" height="44" rx="8" fill="var(--color-ink, #17211f)" stroke="var(--color-ink, #17211f)" stroke-width="1.5"/>
