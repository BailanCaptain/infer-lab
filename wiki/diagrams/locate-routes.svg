<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 350" width="900" height="350" role="img" aria-label="由学习问题选择数据、配置或实现入口，最后记录可核实的条件和结果；异常位置提供线索，不直接等于根因">
  <title>由学习问题选择数据、配置或实现入口，最后记录可核实的条件和结果；异常位置提供线索，不直接等于根因</title>
  <defs><marker id="locate-routes-ah-token" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="var(--color-token, #087f73)"/></marker><marker id="locate-routes-ah-control" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="var(--color-control, #66716d)"/></marker><marker id="locate-routes-ah-weight" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="var(--color-weight, #c78300)"/></marker></defs>
  <path d="M150 95 L150 155" fill="none" stroke="var(--color-token, #087f73)" stroke-width="1.4" marker-end="url(#locate-routes-ah-token)"/>
  <path d="M450 95 L450 155" fill="none" stroke="var(--color-control, #66716d)" stroke-width="1.4" marker-end="url(#locate-routes-ah-control)"/>
  <path d="M750 95 L750 155" fill="none" stroke="var(--color-weight, #c78300)" stroke-width="1.4" marker-end="url(#locate-routes-ah-weight)"/>
  <path d="M150 215 L150 250 L350 250 L350 285" fill="none" stroke="var(--color-token, #087f73)" stroke-width="1.4" marker-end="url(#locate-routes-ah-token)"/>
  <path d="M450 215 L450 285" fill="none" stroke="var(--color-control, #66716d)" stroke-width="1.4" marker-end="url(#locate-routes-ah-control)"/>
  <path d="M750 215 L750 250 L550 250 L550 285" fill="none" stroke="var(--color-weight, #c78300)" stroke-width="1.4" marker-end="url(#locate-routes-ah-weight)"/>
  <rect x="30" y="35" width="240" height="60" rx="8" fill="var(--color-token, #087f73)" stroke="var(--color-ink, #17211f)" stroke-width="1.5"/>
  <text x="150" y="61" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="14" font-weight="700" fill="var(--color-ink-inverse, #ffffff)" text-anchor="middle">请求数据怎样变化</text>
  <text x="150" y="80" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="13" font-weight="400" fill="var(--color-ink-inverse, #ffffff)" text-anchor="middle">请求 → 批次 → 模型输出</text>
  <rect x="330" y="35" width="240" height="60" rx="8" fill="var(--color-control, #66716d)" stroke="var(--color-ink, #17211f)" stroke-width="1.5"/>
  <text x="450" y="61" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="14" font-weight="700" fill="var(--color-ink-inverse, #ffffff)" text-anchor="middle">配置为何这样生效</text>
  <text x="450" y="80" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="13" font-weight="400" fill="var(--color-ink-inverse, #ffffff)" text-anchor="middle">输入值与实际值</text>
  <rect x="630" y="35" width="240" height="60" rx="8" fill="var(--color-weight, #c78300)" stroke="var(--color-ink, #17211f)" stroke-width="1.5"/>
  <text x="750" y="61" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="14" font-weight="700" fill="var(--color-ink-inverse, #ffffff)" text-anchor="middle">实际执行哪个实现</text>
  <text x="750" y="80" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="13" font-weight="400" fill="var(--color-ink-inverse, #ffffff)" text-anchor="middle">对象构造与方法调用</text>
  <rect x="30" y="155" width="240" height="60" rx="8" fill="var(--color-token, #087f73)" stroke="var(--color-ink, #17211f)" stroke-width="1.5"/>
  <text x="150" y="181" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="14" font-weight="700" fill="var(--color-ink-inverse, #ffffff)" text-anchor="middle">追输入输出与状态</text>
  <text x="150" y="200" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="13" font-weight="400" fill="var(--color-ink-inverse, #ffffff)" text-anchor="middle">调度 / Runner / 模型</text>
  <rect x="330" y="155" width="240" height="60" rx="8" fill="var(--color-control, #66716d)" stroke="var(--color-ink, #17211f)" stroke-width="1.5"/>
  <text x="450" y="181" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="14" font-weight="700" fill="var(--color-ink-inverse, #ffffff)" text-anchor="middle">追合并、检查与消费者</text>
  <text x="450" y="200" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="13" font-weight="400" fill="var(--color-ink-inverse, #ffffff)" text-anchor="middle">包括环境兼容和覆盖</text>
  <rect x="630" y="155" width="240" height="60" rx="8" fill="var(--color-weight, #c78300)" stroke="var(--color-ink, #17211f)" stroke-width="1.5"/>
  <text x="750" y="181" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="14" font-weight="700" fill="var(--color-ink-inverse, #ffffff)" text-anchor="middle">追登记与分派条件</text>
  <text x="750" y="200" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="13" font-weight="400" fill="var(--color-ink-inverse, #ffffff)" text-anchor="middle">模型 / 后端 / 算子 / 补丁</text>
  <rect x="250" y="285" width="400" height="50" rx="8" fill="var(--color-ink, #17211f)" stroke="var(--color-ink, #17211f)" stroke-width="1.5"/>
  <text x="450" y="315" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="14" font-weight="700" fill="var(--color-ink-inverse, #ffffff)" text-anchor="middle">固定版本 + 条件 + 源码范围 + 结果</text>
</svg>
