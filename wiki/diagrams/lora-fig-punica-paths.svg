<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 534" width="900" height="534" role="img" aria-label="Multi-LoRA Punica 槽号混批压抬汇聚流与昇腾 PunicaWrapperNPU 决策分派图" font-family="var(--font-sans)">
  <title>Multi-LoRA Punica 槽号混批汇聚几何与昇腾 PunicaWrapperNPU 执行路径分派</title>
  <desc>Geometric multi-LoRA batching with slot index [0, 1, 0, -1], parallel base xW^T and slot-routed shrink/expand (xA^T)B^T gather, plus PunicaWrapperNPU execution path decision gates and LoRA+EP&gt;1 forced ALLTOALL</desc>
  <defs>
    <marker id="lr-arr-t" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="#087f73"/>
    </marker>
    <marker id="lr-arr-a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="#c78300"/>
    </marker>
    <marker id="lr-arr-b" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="#4c65b6"/>
    </marker>
    <marker id="lr-arr-r" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="#b54237"/>
    </marker>
  </defs>

  <!-- ZONE 1: Multi-LoRA Punica Shrink/Expand Gather Geometry -->
  <text x="14" y="24" font-size="16" font-weight="700" fill="#17211f">① 多适配器混批几何：基座 W 只存一份，逐行槽号路由低秩压/抬旁路（s 加载期已乘入 B）</text>

  <!-- Left: Input X [4, d_in] + Slot Index Vector -->
  <text x="14" y="50" font-size="13.5" font-weight="700" fill="#4d5652">输入 X [4, d_in]</text>
  <text x="142" y="50" font-size="13.5" font-weight="700" fill="#3a4f93">槽号表</text>
  <g stroke-width="1.3" font-size="13.5" font-weight="700">
    <rect x="14" y="58" width="116" height="30" rx="4" fill="#ddf4ef" stroke="#087f73"/><text x="72" y="78" text-anchor="middle" fill="#065f56">行 0（请求 A）</text>
    <rect x="136" y="58" width="44" height="30" rx="4" fill="#ddf4ef" stroke="#087f73"/><text x="158" y="78" text-anchor="middle" font-family="var(--font-mono)" fill="#065f56">0</text>

    <rect x="14" y="94" width="116" height="30" rx="4" fill="#fff4cf" stroke="#c78300"/><text x="72" y="114" text-anchor="middle" fill="#936300">行 1（请求 B）</text>
    <rect x="136" y="94" width="44" height="30" rx="4" fill="#fff4cf" stroke="#c78300"/><text x="158" y="114" text-anchor="middle" font-family="var(--font-mono)" fill="#936300">1</text>

    <rect x="14" y="130" width="116" height="30" rx="4" fill="#ddf4ef" stroke="#087f73"/><text x="72" y="150" text-anchor="middle" fill="#065f56">行 2（请求 A）</text>
    <rect x="136" y="130" width="44" height="30" rx="4" fill="#ddf4ef" stroke="#087f73"/><text x="158" y="150" text-anchor="middle" font-family="var(--font-mono)" fill="#065f56">0</text>

    <rect x="14" y="166" width="116" height="30" rx="4" fill="#ece9df" stroke="#b8bcb5"/><text x="72" y="186" text-anchor="middle" fill="#4d5652">行 3（纯基座）</text>
    <rect x="136" y="166" width="44" height="30" rx="4" fill="#ece9df" stroke="#b8bcb5"/><text x="158" y="186" text-anchor="middle" font-family="var(--font-mono)" fill="#66716d">−1</text>
  </g>

  <!-- Upper Main Track: Shared Base W -->
  <path d="M 180 73 C 222 73, 224 68, 274 68" fill="none" stroke="#4c65b6" stroke-width="1.8" marker-end="url(#lr-arr-b)"/>
  <rect x="280" y="48" width="388" height="42" rx="6" fill="#e8edff" stroke="#4c65b6" stroke-width="1.5"/>
  <text x="474" y="74" text-anchor="middle" font-size="14" font-weight="700" fill="#3a4f93">主路 · 全 4 行共用一份基座权重 W → xWᵀ [4, d_out]</text>
  <path d="M 668 69 L 732 69 L 732 108" fill="none" stroke="#4c65b6" stroke-width="1.8" marker-end="url(#lr-arr-b)"/>

  <!-- Lower Bypass Track: Punica Slot-Routed Shrink (A) -> Narrow r -> Expand (B) -->
  <path d="M 180 78 C 216 78, 220 116, 274 116" fill="none" stroke="#087f73" stroke-width="1.7" marker-end="url(#lr-arr-t)"/>
  <path d="M 180 145 C 220 145, 224 126, 274 126" fill="none" stroke="#087f73" stroke-width="1.7" marker-end="url(#lr-arr-t)"/>
  <rect x="280" y="102" width="124" height="34" rx="5" fill="#ddf4ef" stroke="#087f73" stroke-width="1.4"/>
  <text x="342" y="124" text-anchor="middle" font-size="13.5" font-weight="700" fill="#065f56">槽 0 · 压 A₀</text>
  <path d="M 404 119 L 442 119" fill="none" stroke="#087f73" stroke-width="1.6" marker-end="url(#lr-arr-t)"/>
  <rect x="448" y="105" width="52" height="28" rx="4" fill="#ffffff" stroke="#087f73" stroke-width="1.3"/>
  <text x="474" y="124" text-anchor="middle" font-size="13.5" font-family="var(--font-mono)" fill="#065f56">r 维</text>
  <path d="M 500 119 L 538 119" fill="none" stroke="#087f73" stroke-width="1.6" marker-end="url(#lr-arr-t)"/>
  <rect x="544" y="102" width="124" height="34" rx="5" fill="#ddf4ef" stroke="#087f73" stroke-width="1.4"/>
  <text x="606" y="124" text-anchor="middle" font-size="13.5" font-weight="700" fill="#065f56">槽 0 · 抬 B₀</text>
  <path d="M 668 119 L 710 124" fill="none" stroke="#087f73" stroke-width="1.7" marker-end="url(#lr-arr-t)"/>

  <path d="M 180 109 C 228 109, 232 158, 274 158" fill="none" stroke="#c78300" stroke-width="1.7" marker-end="url(#lr-arr-a)"/>
  <rect x="280" y="142" width="124" height="34" rx="5" fill="#fff4cf" stroke="#c78300" stroke-width="1.4"/>
  <text x="342" y="164" text-anchor="middle" font-size="13.5" font-weight="700" fill="#936300">槽 1 · 压 A₁</text>
  <path d="M 404 159 L 442 159" fill="none" stroke="#c78300" stroke-width="1.6" marker-end="url(#lr-arr-a)"/>
  <rect x="448" y="145" width="52" height="28" rx="4" fill="#ffffff" stroke="#c78300" stroke-width="1.3"/>
  <text x="474" y="164" text-anchor="middle" font-size="13.5" font-family="var(--font-mono)" fill="#936300">r 维</text>
  <path d="M 500 159 L 538 159" fill="none" stroke="#c78300" stroke-width="1.6" marker-end="url(#lr-arr-a)"/>
  <rect x="544" y="142" width="124" height="34" rx="5" fill="#fff4cf" stroke="#c78300" stroke-width="1.4"/>
  <text x="606" y="164" text-anchor="middle" font-size="13.5" font-weight="700" fill="#936300">槽 1 · 抬 B₁</text>
  <path d="M 668 159 L 714 140" fill="none" stroke="#c78300" stroke-width="1.7" marker-end="url(#lr-arr-a)"/>

  <path d="M 180 181 L 274 196" fill="none" stroke="#b8bcb5" stroke-width="1.4" stroke-dasharray="4 3"/>
  <rect x="280" y="182" width="388" height="28" rx="4" fill="#ece9df" stroke="#b8bcb5" stroke-width="1.2"/>
  <text x="474" y="201" text-anchor="middle" font-size="13.5" fill="#4d5652">槽 −1（行 3）：算子按槽号跳过或置零，仅保留基座主路</text>

  <!-- Sum circle + Output Y -->
  <circle cx="732" cy="130" r="18" fill="#ffffff" stroke="#17211f" stroke-width="1.6"/>
  <text x="732" y="136" text-anchor="middle" font-size="18" font-weight="700" fill="#17211f">+</text>
  <path d="M 750 130 L 778 130" fill="none" stroke="#087f73" stroke-width="1.8" marker-end="url(#lr-arr-t)"/>
  <rect x="784" y="96" width="100" height="68" rx="6" fill="#ddf4ef" stroke="#087f73" stroke-width="1.5"/>
  <text x="834" y="124" text-anchor="middle" font-size="14" font-weight="700" fill="#065f56">输出 Y</text>
  <text x="834" y="148" text-anchor="middle" font-size="13.5" font-family="var(--font-mono)" fill="#065f56">[4, d_out]</text>

  <text x="14" y="226" font-size="13" fill="#4d5652">显存按配置名额（max_loras × max_lora_rank，默认 1×16）预分配；超名额新请求入跳过队列，CPU 缓存满按 LRU 换出</text>

  <line x1="14" y1="242" x2="886" y2="242" stroke="#b8bcb5" stroke-width="1.4" stroke-dasharray="6 5"/>

  <!-- ZONE 2: PunicaWrapperNPU Decision Flow -->
  <text x="14" y="270" font-size="16" font-weight="700" fill="#17211f">② 昇腾 PunicaWrapperNPU 路径决策流（v0.30.0 / main）与 MoE EP 通信约束</text>

  <rect x="14" y="330" width="136" height="62" rx="7" fill="#ece9df" stroke="#17211f" stroke-width="1.4"/>
  <text x="82" y="356" text-anchor="middle" font-size="13.5" font-weight="700" fill="#17211f">PunicaWrapper</text>
  <text x="82" y="378" text-anchor="middle" font-size="13" font-family="var(--font-mono)" fill="#4d5652">NPU 路径分派</text>

  <path d="M 150 344 C 172 344, 174 305, 190 305" fill="none" stroke="#b54237" stroke-width="1.8" marker-end="url(#lr-arr-r)"/>
  <path d="M 150 361 L 190 361" fill="none" stroke="#087f73" stroke-width="1.8" marker-end="url(#lr-arr-t)"/>
  <path d="M 150 378 C 172 378, 174 424, 190 424" fill="none" stroke="#4c65b6" stroke-width="1.8" marker-end="url(#lr-arr-b)"/>

  <rect x="196" y="282" width="424" height="46" rx="6" fill="#fff0e9" stroke="#b54237" stroke-width="1.4"/>
  <text x="208" y="301" font-size="12.5" font-weight="700" fill="#8f3229">无 LORA_CUSTOM_OPS 或 max_lora_rank ≥ 128</text>
  <text x="208" y="319" font-size="12.5" font-weight="700" fill="#8f3229">→ 静默退纯 PyTorch</text>

  <rect x="196" y="336" width="424" height="46" rx="6" fill="#ddf4ef" stroke="#087f73" stroke-width="1.4"/>
  <text x="208" y="355" font-size="12.5" font-weight="700" fill="#065f56">max_loras == 1（A2/A3 BF16 r≤64 T≤128）</text>
  <text x="208" y="373" font-size="12.5" font-weight="700" fill="#065f56">→ Triton 融合 / Matmul</text>

  <rect x="196" y="390" width="424" height="68" rx="6" fill="#e8edff" stroke="#4c65b6" stroke-width="1.4"/>
  <text x="208" y="409" font-size="12.5" font-weight="700" fill="#3a4f93">标准多槽：AscendC SGMV（普通线性）/</text>
  <text x="208" y="427" font-size="12.5" font-weight="700" fill="#3a4f93">BGMV（MoE · logits · 310P 图）</text>
  <text x="208" y="446" font-size="12.5" fill="#4d5652">main 增分类头 FP32 einsum；_use_sgmv() 在 310P 图捕获切 BGMV</text>

  <rect x="638" y="282" width="246" height="176" rx="7" fill="#f7e7f2" stroke="#9a4b86" stroke-width="1.5"/>
  <text x="761" y="310" text-anchor="middle" font-size="14.5" font-weight="700" fill="#7a3a6a">MoE 挂 LoRA 通信锁</text>
  <line x1="652" y1="322" x2="870" y2="322" stroke="#9a4b86" stroke-width="1" opacity="0.5"/>
  <text x="652" y="350" font-size="13" font-weight="700" fill="#8f3229">EP &gt; 1 → 强制 ALLTOALL</text>
  <text x="652" y="378" font-size="13" fill="#4d5652">MC2 融合核无法插低秩旁路</text>
  <text x="652" y="406" font-size="13" fill="#4d5652">v0.30.0 支持 W8A8 动态量化</text>
  <text x="652" y="434" font-size="13" fill="#7a3a6a">GLM 双机未开 LoRA（EP16）</text>

  <rect x="14" y="470" width="870" height="52" rx="6" fill="#ece9df" stroke="#b8bcb5" stroke-width="1.2"/>
  <text x="449" y="491" text-anchor="middle" font-size="13" fill="#17211f">ACL Graph 捕获按 BatchDescriptor 的 has_lora 与活跃适配器数分桶；</text>
  <text x="449" y="511" text-anchor="middle" font-size="13" fill="#17211f">v0.30.0 起 GraphParams 合并回 1 份，不再按 has_lora 拆表</text>
</svg>
