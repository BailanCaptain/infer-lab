mode: native-svg
id: lora-resolver-loading
caption: >-
  LoRA Resolver 按请求名自动解析与加载控制流：API 前端 _check_model 先查基座名与已登记适配器（命中即走左侧零查找快路）；遇到未知名且开启 VLLM_ALLOW_RUNTIME_LORA_UPDATING 时，加同名并发锁并依次调用已注册 Resolver 校验 adapter_config.json 与基座路径字符串，再交由引擎读入 safetensors 权重验证秩与模块兼容性，成功后登记复用（无候选返 404，全部候选加载失败返 400）。
