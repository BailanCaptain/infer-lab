  <rect x="324.2" y="90.5" width="109.4" height="27" rx="13.5" fill="var(--color-accent, #e85b32)"/><text x="335.2" y="109" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="14" font-weight="700" fill="var(--color-ink-inverse, #ffffff)">请求 2 · 槽 1</text>
  <rect x="488.8" y="90.5" width="140.2" height="27" rx="13.5" fill="var(--color-ink-faint, #8a928f)"/><text x="499.8" y="109" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="14" font-weight="700" fill="var(--color-ink-inverse, #ffffff)">请求 3 · 不挂 · -1</text>
  <text x="40" y="224" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="12.5" font-weight="400" fill="var(--color-ink-muted, #5b6763)">槽号不是适配器编号：activate_adapter 把适配器放进表里第一个空格，那个下标才是槽号；</text>
  <text x="40" y="242.5" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="12.5" font-weight="400" fill="var(--color-ink-muted, #5b6763)">token_lora_indices 里逐 token 存的就是它，-1 表示这一行什么都不加，算子按行跳过。</text>
  <text x="40" y="396" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="12.5" font-weight="400" fill="var(--color-ink-muted, #5b6763)">挂了 LoRA 的线性层每层多两步：先 x·Aᵀ 把 1024 维压到 r（shrink），再 ·Bᵀ 抬回输出宽度、乘上 scale 加进基座的输出（expand）。</text>
  <text x="40" y="664" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="12.5" font-weight="400" fill="var(--color-ink-muted, #5b6763)">而 NPU 上占掉的地不是一个适配器那么多：lora_a_stacked / lora_b_stacked 的第一维直接是 max_loras，槽位在建层时就全开好了，加载几</text>
  <text x="40" y="682.5" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="12.5" font-weight="400" fill="var(--color-ink-muted, #5b6763)">个适配器都一样。</text>
</svg>
