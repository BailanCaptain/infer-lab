  <title>基座权重只有一份；每一行带一个槽号，昇腾侧只接管「按槽号取两个小矩阵再乘回去」这一段</title>
  <rect width="900" height="720" fill="var(--color-surface, #fbfaf6)"/>
  <rect x="20" y="26" width="860" height="250" rx="12" fill="var(--color-surface-sunken, #ece9df)"/>
