  <text x="38" y="83" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="12.5" font-weight="400" fill="var(--color-ink-muted, #5b6763)">适配器注册、占槽、按 token 展开成下标，全在上游那一侧，昇腾没有另写一份</text>
  <rect x="20" y="320" width="860" height="230" rx="12" fill="var(--color-weight-soft, #fff4cf)"/>
