notes:
  - at: [40, 224]
    text: "槽号不是适配器编号：activate_adapter 把适配器放进表里第一个空格，那个下标才是槽号；token_lora_indices 里逐 token 存的就是它，-1 表示这一行什么都不加，算子按行跳过。"
    size: 12.5
    width: 584
  - at: [40, 396]
    text: "挂了 LoRA 的线性层每层多两步：先 x·Aᵀ 把 1024 维压到 r（shrink），再 ·Bᵀ 抬回输出宽度、乘上 scale 加进基座的输出（expand）。"
    size: 12.5
    width: 816
  - at: [40, 664]
    text: "而 NPU 上占掉的地不是一个适配器那么多：lora_a_stacked / lora_b_stacked 的第一维直接是 max_loras，槽位在建层时就全开好了，加载几个适配器都一样。"
    size: 12.5
    width: 816

boundaries:
