<text x="588" y="383" font-family="var(--font-mono)" font-size="14" font-weight="700" fill="#065f56">= 33 B / 32 = 1.03125 B/elem<tspan x="528" y="441" fill="#3a4f93">= 17 B / 32 = 0.53125 B/elem</tspan><tspan x="618" y="499" fill="#7a3a6a">局部 9 B/16 = 0.5625 B + 全局</tspan></text>
