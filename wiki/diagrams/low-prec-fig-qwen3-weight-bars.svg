<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 422" width="900" height="422" role="img" aria-label="Qwen3-30B-A3B 路由专家五种精度同比例字节账与 DeepSeek V4.1 三类缓存变体对比图" font-family="var(--font-sans)">
  <title>Qwen3-30B-A3B 48 层路由专家同比例权重+尺度字节条及多缓存变体</title>
  <desc>结合 AscendW8A8MXFP8DynamicLinearMethod 与 AscendW4A4MXFP4DynamicLinearMethod（group_size、weight_scale、float4_e2m1fn_x2），按同一比例尺画出 BF16（54.00 GiB）、INT8（27.08 GiB）、MXFP8（27.84 GiB）、NVFP4（15.19 GiB）与 MXFP4（14.34 GiB）中载荷与尺度的真实体积，并对比 DeepSeek V4.1 三种缓存分组。</desc>

  <!-- Zone 1: True-scale bars (1 GiB = 8.4 px starting at x=142, 54 GiB = 453.6 px -> x=596) -->
  <text x="16" y="28" font-size="16" font-weight="700" fill="#17211f">① 同比例字节账：Qwen3-30B-A3B 48 层路由专家（28.99B 元素 · 本体载荷 + 块尺度）</text>
  <line x1="14" y1="38" x2="886" y2="38" stroke="#b8bcb5" stroke-width="1.4"/>

  <g font-size="14" font-weight="700">
    <text x="16" y="75" fill="#3a4f93">BF16 基线</text>
    <text x="16" y="114" fill="#936300">INT8 逐通道</text>
    <text x="16" y="153" fill="#065f56">MXFP8 (32组)</text>
    <text x="16" y="192" fill="#7a3a6a">NVFP4 (16组)</text>
    <text x="16" y="231" fill="#065f56">MXFP4 (32组)</text>
  </g>

  <!-- Bar 1: BF16 54.00 GiB = 454 px -->
  <rect x="142" y="56" width="454" height="26" rx="4" fill="#e8edff" stroke="#4c65b6" stroke-width="1.5"/>
  <text x="369" y="74" text-anchor="middle" font-family="var(--font-mono)" font-size="13.5" font-weight="700" fill="#3a4f93">54.00 GiB（2.00 B/elem）</text>
  <text x="608" y="74" font-family="var(--font-mono)" font-size="13.5" fill="#4d5652">100.0% 基准</text>

  <!-- Bar 2: INT8 27.00 GiB (227px) + 0.08 GiB (1px) -->
  <rect x="142" y="95" width="227" height="26" rx="4" fill="#fff4cf" stroke="#c78300" stroke-width="1.5"/>
  <rect x="369" y="95" width="3" height="26" fill="#9a4b86"/>
  <text x="255" y="113" text-anchor="middle" font-family="var(--font-mono)" font-size="13.5" font-weight="700" fill="#936300">27.00 GiB</text>
  <text x="384" y="113" font-family="var(--font-mono)" font-size="13.5" fill="#4d5652">+ 84 MiB 通道尺 = 50.15%</text>

  <!-- Bar 3: MXFP8 27.00 (227px) + 0.84375 (7px) = 27.84 GiB -->
  <rect x="142" y="134" width="227" height="26" rx="4" fill="#ddf4ef" stroke="#087f73" stroke-width="1.5"/>
  <rect x="369" y="134" width="8" height="26" rx="2" fill="#f7e7f2" stroke="#9a4b86" stroke-width="1.4"/>
  <text x="255" y="152" text-anchor="middle" font-family="var(--font-mono)" font-size="13.5" font-weight="700" fill="#065f56">27.00 GiB</text>
  <text x="390" y="152" font-family="var(--font-mono)" font-size="13.5" font-weight="700" fill="#065f56">+ 0.84 GiB E8M0 = 27.84 GiB（省 48.44%）</text>

  <!-- Bar 4: NVFP4 13.50 (113px) + 1.6875 (14px) = 15.19 GiB -->
  <rect x="142" y="173" width="113" height="26" rx="4" fill="#fff4cf" stroke="#c78300" stroke-width="1.5"/>
  <rect x="255" y="173" width="15" height="26" rx="2" fill="#f7e7f2" stroke="#9a4b86" stroke-width="1.5"/>
  <text x="198" y="191" text-anchor="middle" font-family="var(--font-mono)" font-size="13.5" font-weight="700" fill="#936300">13.50</text>
  <text x="282" y="191" font-family="var(--font-mono)" font-size="13.5" font-weight="700" fill="#7a3a6a">+ 1.69 GiB E4M3 = 15.19 GiB（省 71.88%）</text>

  <!-- Bar 5: MXFP4 13.50 (113px) + 0.84375 (7px) = 14.34 GiB -->
  <rect x="142" y="212" width="113" height="26" rx="4" fill="#ddf4ef" stroke="#087f73" stroke-width="1.5"/>
  <rect x="255" y="212" width="8" height="26" rx="2" fill="#f7e7f2" stroke="#9a4b86" stroke-width="1.5"/>
  <text x="198" y="230" text-anchor="middle" font-family="var(--font-mono)" font-size="13.5" font-weight="700" fill="#065f56">13.50</text>
  <text x="276" y="230" font-family="var(--font-mono)" font-size="13.5" font-weight="700" fill="#065f56">+ 0.84 GiB E8M0 = 14.34 GiB（省 73.44%，非 75%）</text>

  <!-- Legend -->
  <rect x="142" y="248" width="14" height="12" rx="2" fill="#f7e7f2" stroke="#9a4b86" stroke-width="1.3"/>
  <text x="162" y="259" font-size="13.5" fill="#7a3a6a">梅紫段 = 块级缩放尺度元数据（尚未含 NZ 对齐补齐与未量化层）</text>

  <!-- Divider -->
  <line x1="14" y1="274" x2="886" y2="274" stroke="#b8bcb5" stroke-width="1.4" stroke-dasharray="6 4"/>

  <!-- Zone 2: DeepSeek V4.1 3 Cache Variants -->
  <text x="16" y="302" font-size="16" font-weight="700" fill="#17211f">② 同模型三类历史缓存按敏感度分档（DeepSeek V4.1 快照对照，勿统称 MXFP4）</text>

  <rect x="16" y="316" width="276" height="94" rx="8" fill="#fff4cf" stroke="#c78300" stroke-width="1.4"/>
  <text x="30" y="341" font-size="14.5" font-weight="700" fill="#936300">分页主 KV（定制 16 项）</text>
  <rect x="30" y="352" width="166" height="22" rx="3" fill="#ffffff" stroke="#c78300" stroke-width="1.2"/>
  <text x="113" y="368" text-anchor="middle" font-family="var(--font-mono)" font-size="13.5" fill="#936300">16×E2M1</text>
  <rect x="200" y="352" width="78" height="22" rx="3" fill="#f7e7f2" stroke="#9a4b86" stroke-width="1.2"/>
  <text x="239" y="368" text-anchor="middle" font-family="var(--font-mono)" font-size="13.5" fill="#7a3a6a">E4M3</text>
  <text x="30" y="396" font-size="13.5" fill="#4d5652">省去全局 FP32 尺，配合 QAT</text>

  <rect x="312" y="316" width="276" height="94" rx="8" fill="#e8edff" stroke="#4c65b6" stroke-width="1.4"/>
  <text x="326" y="341" font-size="14.5" font-weight="700" fill="#3a4f93">索引 K（标准 MXFP4）</text>
  <rect x="326" y="352" width="166" height="22" rx="3" fill="#ffffff" stroke="#4c65b6" stroke-width="1.2"/>
  <text x="409" y="368" text-anchor="middle" font-family="var(--font-mono)" font-size="13.5" fill="#3a4f93">32×E2M1</text>
  <rect x="496" y="352" width="78" height="22" rx="3" fill="#f7e7f2" stroke="#9a4b86" stroke-width="1.2"/>
  <text x="535" y="368" text-anchor="middle" font-family="var(--font-mono)" font-size="13.5" fill="#7a3a6a">E8M0</text>
  <text x="326" y="396" font-size="13.5" fill="#4d5652">严格 32 项一尺，供稀疏筛选</text>

  <rect x="608" y="316" width="276" height="94" rx="8" fill="#ddf4ef" stroke="#087f73" stroke-width="1.4"/>
  <text x="622" y="341" font-size="14.5" font-weight="700" fill="#065f56">SWA 窗口 KV（MXFP8）</text>
  <rect x="622" y="352" width="166" height="22" rx="3" fill="#ffffff" stroke="#087f73" stroke-width="1.2"/>
  <text x="705" y="368" text-anchor="middle" font-family="var(--font-mono)" font-size="13.5" fill="#065f56">32×FP8</text>
  <rect x="792" y="352" width="78" height="22" rx="3" fill="#f7e7f2" stroke="#9a4b86" stroke-width="1.2"/>
  <text x="831" y="368" text-anchor="middle" font-family="var(--font-mono)" font-size="13.5" fill="#7a3a6a">E8M0</text>
  <text x="622" y="396" font-size="13.5" fill="#4d5652">保留 8 位照顾近期窗口敏感性</text>
</svg>
