<g font-weight="700">
<text x="16" y="26" font-size="16" fill="#17211f">低精度问题四层取证路线：先分清位域错读、正常舍入与尺度错配</text>
<text x="34" y="91" font-size="14" fill="#17211f">① 加载期：核对同一串字节按哪种位域规则切分</text>
<text x="34" y="199" font-size="14" fill="#17211f">② 量化期：保留一组可复算的原值、载荷与读回值</text>
<text x="34" y="307" font-size="14" fill="#17211f">③ 第 3–5 站前向：固定同一输入定位首次数值分歧</text>
<text x="34" y="415" font-size="14" fill="#8f3229">④ 仅缓存换入或分片后异常：严查载荷与 scale 配对</text>
<text x="718" y="95" text-anchor="middle" font-size="13" fill="#3a4f93">按 E4M3 (1/4/3) → 读出 1.5</text>
<text x="718" y="133" text-anchor="middle" font-size="13" fill="#936300">按 E5M2 (1/5/2) → 读出 1.0</text>
<text x="523" y="210" text-anchor="middle" font-size="13.5" fill="#3a4f93">E2M1 格载荷 + 系数</text>
<text x="746" y="210" text-anchor="middle" font-size="13.5" fill="#065f56">正常舍入读回 x̂</text>
<text x="528" y="318" text-anchor="middle" font-size="13.5" fill="#936300">高精度参考点积 y</text>
<text x="749" y="318" text-anchor="middle" font-size="13.5" fill="#7a3a6a">量化后点积 ŷ</text>
<text x="538" y="425" text-anchor="middle" font-size="13" fill="#17211f">缓存载荷未变</text>
<text x="748" y="425" text-anchor="middle" font-size="13" fill="#8f3229">✗ 误乘异组 scale = 4</text>
</g>
<g font-size="13" fill="#17211f">
<text x="34" y="115">底层 8 位编码未坏，换错格式就会把 1.5 读成 1.0</text>
<text x="34" y="223">原值 (0.3, 1.2, 2.8) 除以本组 s = 0.5 落入最近格</text>
<text x="34" y="331">与权重 w = (1, -1, 2) 点积后追踪后续层放大情况</text>
<text x="34" y="439">同一份 [0.5, 2, 6] 载荷被放大 8 倍，与舍入误差性质不同</text>
