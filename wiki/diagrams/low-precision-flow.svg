<text x="746" y="234" text-anchor="middle">(0.25, 1, 3)</text>
<text x="528" y="342" text-anchor="middle">4.70（基线结果）</text>
<text x="749" y="342" text-anchor="middle">5.25（差 +0.55）</text>
<text x="538" y="448" text-anchor="middle">[0.5, 2, 6]</text>
<text x="748" y="448" text-anchor="middle" fill="#8f3229" font-weight="600">突刺 (2, 8, 24) !</text>
</g>
<g font-size="12.5" fill="#4d5652">
<text x="16" y="47">箭头表示排查下一项检查，不表示前向时序；实际 attention 先读历史 KV 转换后再计算，新 KV 写入也在前向内部</text>
<text x="499" y="86" text-anchor="middle">同一字节 00111100</text>
<text x="34" y="137">核对项：dtype 枚举、指数偏置、HiF8 Dot 位</text>
<text x="34" y="245">核对项：分组粒度（16 / 32 项）与预期半格误差</text>
<text x="34" y="353">同步拆出取数、在线量化与 Cube 乘加分段耗时</text>
<text x="34" y="461" fill="#8f3229">核对项：块号映射、转置轴向与成套换入恢复</text>
