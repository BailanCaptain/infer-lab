<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 610 470" width="610" height="470" role="img" aria-label="低精度问题的排查顺序，箭头表示下一项检查，不表示模型执行顺序。实际 attention 先读取历史 KV，转换后参与计算；新 KV 的写入也发生在前向内部。">
  <title>低精度问题的排查顺序，箭头表示下一项检查，不表示模型执行顺序。实际 attention 先读取历史 KV，转换后参与计算；新 KV 的写入也发生在前向内部。</title>
  <defs><marker id="low-precision-flow-ah-ink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="var(--color-ink, #17211f)"/></marker></defs>
  <path d="M305 84 L305 130" fill="none" stroke="var(--color-ink, #17211f)" stroke-width="1.4" marker-end="url(#low-precision-flow-ah-ink)"/>
  <path d="M305 194 L305 240" fill="none" stroke="var(--color-ink, #17211f)" stroke-width="1.4" marker-end="url(#low-precision-flow-ah-ink)"/>
  <path d="M305 304 L305 350" fill="none" stroke="var(--color-ink, #17211f)" stroke-width="1.4" marker-end="url(#low-precision-flow-ah-ink)"/>
  <rect x="30" y="20" width="550" height="64" rx="8" fill="var(--color-surface-sunken, #ece9df)" stroke="var(--color-control, #66716d)" stroke-opacity="0.4" stroke-width="1.5" stroke-dasharray="5 4"/>
  <text x="305" y="48" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="13" font-weight="400" fill="#4d5652" text-anchor="middle">加载：按哪种规则解读同一份字节</text>
  <text x="305" y="67" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="13" font-weight="400" fill="#4d5652" text-anchor="middle">00111100：E4M3 读成 1.5，E5M2 读成 1.0</text>
  <rect x="30" y="130" width="550" height="64" rx="8" fill="var(--color-kv-soft, #e8edff)" stroke="var(--color-kv, #4c65b6)" stroke-opacity="0.4" stroke-width="1.5" stroke-dasharray="5 4"/>
  <text x="305" y="158" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="13" font-weight="400" fill="#3a4f93" text-anchor="middle">量化：先保留一组可复查的原值与读回值</text>
  <text x="305" y="177" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="13" font-weight="400" fill="#3a4f93" text-anchor="middle">(0.3, 1.2, 2.8) → (0.25, 1, 3)：这是舍入差异</text>
  <rect x="30" y="240" width="550" height="64" rx="8" fill="var(--color-weight-soft, #fff4cf)" stroke="var(--color-weight, #c78300)" stroke-opacity="0.4" stroke-width="1.5" stroke-dasharray="5 4"/>
  <text x="305" y="268" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="13" font-weight="400" fill="#936300" text-anchor="middle">第 3–5 站：用同一输入定位首次计算差异</text>
  <text x="305" y="287" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="13" font-weight="400" fill="#936300" text-anchor="middle">本例点积 4.7 → 5.25；再看后续放大与任务质量</text>
  <rect x="30" y="350" width="550" height="80" rx="8" fill="var(--color-accent-soft, #fff0e9)" stroke="var(--color-danger, #b54237)" stroke-opacity="0.4" stroke-width="1.5" stroke-dasharray="5 4"/>
  <text x="305" y="386" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="13" font-weight="400" fill="#8f3229" text-anchor="middle">若仅缓存换入后异常，查数据与系数是否配对</text>
  <text x="305" y="405" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="13" font-weight="400" fill="#8f3229" text-anchor="middle">载荷未变但读回 (2, 8, 24)：检查是否错配 scale=4</text>
</svg>
