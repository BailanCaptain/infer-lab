  <rect x="616" y="264" width="80" height="38" fill="var(--color-weight, #c78300)"/>
  <text x="656" y="287.7" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="13" font-weight="700" fill="var(--color-ink-inverse, #ffffff)" text-anchor="middle">0.5</text>
