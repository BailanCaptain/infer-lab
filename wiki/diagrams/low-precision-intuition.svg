<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 480" width="820" height="480" role="img" aria-label="与正文相同的三个教学数值。保存一行四位编码及对应系数；这里为便于阅读，格内显示编码代表的数。读回值不再等于原值，且载荷与系数必须成套解释。">
  <title>与正文相同的三个教学数值。保存一行四位编码及对应系数；这里为便于阅读，格内显示编码代表的数。读回值不再等于原值，且载荷与系数必须成套解释。</title>
