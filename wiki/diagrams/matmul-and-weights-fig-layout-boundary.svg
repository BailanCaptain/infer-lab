<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 512" width="900" height="512" role="img" aria-label="矩阵乘权重形状变换、昇腾 NZ 分块布局与动态 W8A8 执行链及误区对照" font-family="var(--font-sans)">
  <title>权重从数学形状 [H, F] 到内存创建 [F, H]、昇腾加载后转置与 FRACTAL_NZ 分块及动态 W8A8 执行链的三道形态边界，以及四组常见误解对照。</title>
  <desc>上半部分展示线性层权重在数学公式、PyTorch 创建、昇腾加载后处理转置加 FRACTAL_NZ 转换以及 npu_quant_matmul 执行时的四重形态；下半部分排雷四组高频误解。</desc>
  <defs>
    <marker id="mm-arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto">
      <path d="M 0 1.5 L 8.5 5 L 0 8.5 z" fill="#c78300"/>
    </marker>
    <marker id="mm-arr-t" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto">
      <path d="M 0 1.5 L 8.5 5 L 0 8.5 z" fill="#087f73"/>
    </marker>
  </defs>

  <text x="14" y="28" font-size="16" font-weight="700" fill="#17211f">一、同一片权重的四重形态：别把数学形状、创建形状和设备布局混成一件事</text>

  <rect x="14" y="46" width="194" height="162" rx="9" fill="#e8edff" stroke="#4c65b6" stroke-width="1.5"/>
  <text x="111" y="72" text-anchor="middle" font-size="15" font-weight="700" fill="#3a4f93">1. 数学公式视角</text>
  <text x="111" y="99" text-anchor="middle" font-size="14" font-family="var(--font-mono)" font-weight="700" fill="#3a4f93">Y = X · W</text>
  <text x="111" y="126" text-anchor="middle" font-size="13.5" fill="#17211f">X:[T, H] × W:[H, F]</text>
  <text x="111" y="150" text-anchor="middle" font-size="13.5" fill="#4d5652">W 每一列 = 1 条配方</text>
  <text x="111" y="174" text-anchor="middle" font-size="13.5" fill="#4d5652">输出形状 Y:[T, F]</text>
  <text x="111" y="196" text-anchor="middle" font-size="13.5" fill="#4d5652">（教学画图统一口径）</text>

  <path d="M 208 127 L 230 127" fill="none" stroke="#c78300" stroke-width="2" marker-end="url(#mm-arr)"/>

  <rect x="236" y="46" width="206" height="162" rx="9" fill="#fff4cf" stroke="#c78300" stroke-width="1.5"/>
  <text x="339" y="72" text-anchor="middle" font-size="15" font-weight="700" fill="#936300">2. 加载建张量（转置）</text>
  <text x="339" y="99" text-anchor="middle" font-size="13.5" font-family="var(--font-mono)" font-weight="700" fill="#936300">get_weight → [F, H]</text>
  <text x="339" y="126" text-anchor="middle" font-size="13.5" fill="#17211f">按 [输出维, 输入维] 建</text>
  <text x="339" y="150" text-anchor="middle" font-size="13.5" fill="#4d5652">W8A8 主体为 INT8</text>
  <text x="339" y="174" text-anchor="middle" font-size="13.5" fill="#4d5652">另配 per-channel scale</text>
  <text x="339" y="196" text-anchor="middle" font-size="13.5" fill="#4d5652">（与 PyTorch Linear 同）</text>

  <path d="M 442 127 L 464 127" fill="none" stroke="#c78300" stroke-width="2" marker-end="url(#mm-arr)"/>

  <rect x="470" y="46" width="202" height="162" rx="9" fill="#f7e7f2" stroke="#9a4b86" stroke-width="1.5"/>
  <text x="571" y="72" text-anchor="middle" font-size="15" font-weight="700" fill="#7a3a6a">3. 加载后处理布局</text>
  <text x="571" y="99" text-anchor="middle" font-size="13.5" font-family="var(--font-mono)" font-weight="700" fill="#7a3a6a">.transpose(0, 1)</text>
  <text x="571" y="126" text-anchor="middle" font-size="13.5" fill="#17211f">转回 [H, F] 并连续化</text>
  <text x="571" y="150" text-anchor="middle" font-size="13.5" fill="#4d5652">条件调用 <tspan font-family="var(--font-mono)" font-weight="700">maybe_trans_nz</tspan></text>
  <text x="571" y="174" text-anchor="middle" font-size="13.5" fill="#4d5652">转为昇腾 FRACTAL_NZ</text>
  <text x="571" y="196" text-anchor="middle" font-size="13.5" fill="#4d5652">（Cube 单元分块读取）</text>

  <path d="M 672 127 L 694 127" fill="none" stroke="#087f73" stroke-width="2" marker-end="url(#mm-arr-t)"/>

  <rect x="700" y="46" width="186" height="162" rx="9" fill="#ddf4ef" stroke="#087f73" stroke-width="1.5"/>
  <text x="793" y="72" text-anchor="middle" font-size="15" font-weight="700" fill="#065f56">4. 动态 W8A8 执行</text>
  <text x="793" y="99" text-anchor="middle" font-size="13.5" font-family="var(--font-mono)" font-weight="700" fill="#065f56">npu_dynamic_quant</text>
  <text x="793" y="126" text-anchor="middle" font-size="13.5" fill="#17211f">输入逐 token 量化 INT8</text>
  <text x="793" y="150" text-anchor="middle" font-size="13.5" font-family="var(--font-mono)" font-weight="700" fill="#065f56">npu_quant_matmul</text>
  <text x="793" y="174" text-anchor="middle" font-size="13.5" fill="#4d5652">带双 scale 反量化输出</text>
  <text x="793" y="196" text-anchor="middle" font-size="13.5" font-weight="700" fill="#065f56">输出恢复 x.dtype(BF16)</text>

  <rect x="14" y="220" width="872" height="40" rx="7" fill="#ece9df" stroke="#b8bcb5" stroke-width="1.2"/>
  <text x="28" y="245" font-size="13.5" fill="#17211f"><tspan font-weight="700" fill="#936300">排查形状报错口诀：</tspan>先标明看的是「数学形状」「加载前创建形状」还是「加载后转置/NZ 形状」，再核对是否做了 TP 切分。</text>

  <line x1="14" y1="276" x2="886" y2="276" stroke="#b8bcb5" stroke-width="1.4" stroke-dasharray="6 4"/>

  <text x="14" y="304" font-size="16" font-weight="700" fill="#17211f">二、四组常见误解与源码真相对照</text>

  <rect x="14" y="318" width="424" height="84" rx="8" fill="#ffffff" stroke="#d8d8cf" stroke-width="1.3"/>
  <text x="28" y="344" font-size="14.5" font-weight="700" fill="#8f3229">✗ 误解：W8A8 权重是 INT8，算完输出也是 INT8</text>
  <text x="28" y="370" font-size="13.5" font-weight="700" fill="#065f56">✓ 真相：output_dtype 固定设回输入 dtype（BF16）</text>
  <text x="28" y="392" font-size="13.5" fill="#4d5652">仅乘加用 INT8，算子内同时用 weight_scale + pertoken_scale 还原</text>

  <rect x="462" y="318" width="424" height="84" rx="8" fill="#ffffff" stroke="#d8d8cf" stroke-width="1.3"/>
  <text x="476" y="344" font-size="14.5" font-weight="700" fill="#8f3229">✗ 误解：稠密 MLP 有三个逻辑矩阵 = 3 次矩阵乘</text>
  <text x="476" y="370" font-size="13.5" font-weight="700" fill="#065f56">✓ 真相：gate 与 up 合并列切，每层仅 2 次量化乘</text>
  <text x="476" y="392" font-size="13.5" fill="#4d5652">GLM 每卡 gate/up 合并占 12 MiB，down 占 6 MiB（均为 INT8）</text>

  <rect x="14" y="416" width="424" height="84" rx="8" fill="#ffffff" stroke="#d8d8cf" stroke-width="1.3"/>
  <text x="28" y="442" font-size="14.5" font-weight="700" fill="#8f3229">✗ 误解：输出列数齐了 = 数值已经完整算完</text>
  <text x="28" y="468" font-size="13.5" font-weight="700" fill="#065f56">✓ 真相：RowParallelLinear 归约前每卡只是部分和</text>
  <text x="28" y="490" font-size="13.5" fill="#4d5652">down 算完 [4, 4096] 须等 TP8 All-Reduce 相加才是真值</text>

  <rect x="462" y="416" width="424" height="84" rx="8" fill="#ffffff" stroke="#d8d8cf" stroke-width="1.3"/>
  <text x="476" y="442" font-size="14.5" font-weight="700" fill="#8f3229">✗ 误解：权重容量 96 MiB = 单卡占用或一次访存量</text>
  <text x="476" y="468" font-size="13.5" font-weight="700" fill="#065f56">✓ 真相：96 MiB 是未分片 BF16 逻辑容量，访存另测</text>
  <text x="476" y="490" font-size="13.5" fill="#4d5652">设备实占需计 TP 分片与量化，访存受分块与片上缓存复用影响</text>
</svg>
