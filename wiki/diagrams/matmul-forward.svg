<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 760" width="860" height="760" role="img" aria-label="A4 中 attention 之后按层型进入稠密 MLP 或 MoE；稠密分支的逻辑顺序是合并投影、门控、降维、归约，再回到残差流。">
  <title>A4 中 attention 之后按层型进入稠密 MLP 或 MoE；稠密分支的逻辑顺序是合并投影、门控、降维、归约，再回到残差流。</title>
