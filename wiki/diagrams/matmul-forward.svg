  <text x="430" y="640" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="13" font-weight="400" fill="var(--color-ink-inverse, #ffffff)" text-anchor="middle">三个逻辑投影的输出重新进入层间状态</text>
