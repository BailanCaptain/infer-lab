layout: figure
id: matmul-shapes
caption: 同一输入行与每一列权重分别乘加，依次填出一行输出；格子只示意行列关系，不代表 GLM 的实际维度。
size: [820, 330]
grids:
  - at: [45, 95]
    rows: 2
    cols: 3
    cell: [45, 45]
    gap: 0
    tone: token
    style: faded
    label: 输入矩阵
    cells:
      - { at: [0, 0], text: x_a, style: solid }
      - { at: [0, 1], text: x_b, style: solid }
      - { at: [0, 2], text: x_c, style: solid }
  - at: [280, 72]
    rows: 3
    cols: 3
    cell: [45, 45]
    gap: 0
    tone: weight
    style: faded
    label: 权重矩阵
    cells:
      - { at: [0, 0], text: w_a, style: solid }
      - { at: [1, 0], text: w_b, style: solid }
      - { at: [2, 0], text: w_c, style: solid }
  - at: [625, 95]
    rows: 2
    cols: 3
    cell: [45, 45]
    gap: 0
    tone: token
    style: faded
    label: 输出矩阵
    cells:
      - { at: [0, 0], text: y, style: solid }
      - { at: [0, 1], text: →, style: plain }
      - { at: [0, 2], text: →, style: plain }
nodes:
  - { at: [510, 240], r: 25, text: Σ }
links:
  - { from: [180, 117], via: [[205, 117], [205, 240]], to: [485, 240], tone: token }
  - { from: [302, 207], via: [[302, 275], [510, 275]], to: [510, 265], tone: weight }
  - { from: [535, 240], via: [[575, 240], [575, 117]], to: [625, 117], tone: token }
texts:
  - { at: [112, 32], text: 固定一行, anchor: middle, strong: true }
  - { at: [348, 32], text: 逐列取出, anchor: middle, strong: true }
  - { at: [692, 32], text: 填满这一行, anchor: middle, strong: true }
  - { at: [230, 139], text: '×', size: 24, anchor: middle }
  - { at: [350, 305], text: 对应相乘, anchor: middle, note: true }
  - { at: [580, 292], text: Σ：把乘积加起来, anchor: middle, note: true }
