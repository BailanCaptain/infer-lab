<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 470" width="900" height="470" role="img" aria-label="同卡外部显存释放触发严格递减断言与多模态试跑提示边界图">
  <defs>
    <marker id="arr-ink" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse">
      <path d="M1,1.5 L8.5,5 L1,8.5 z" fill="#4d5652"/>
    </marker>
    <marker id="arr-err" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse">
      <path d="M1,1.5 L8.5,5 L1,8.5 z" fill="#b54237"/>
    </marker>
    <marker id="arr-teal" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse">
      <path d="M1,1.5 L8.5,5 L1,8.5 z" fill="#087f73"/>
    </marker>
    <pattern id="hatch-release" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <line x1="0" y1="0" x2="0" y2="8" stroke="#b54237" stroke-width="1.5" stroke-opacity="0.35"/>
    </pattern>
  </defs>

  <!-- ZONE 1: External Interference (y=8..234) -->
  <rect x="8" y="8" width="884" height="226" rx="10" fill="#f8f6f0" stroke="#d8d8cf" stroke-width="1.2"/>
  <rect x="20" y="18" width="256" height="24" rx="12" fill="#fff0e9" stroke="#b54237" stroke-width="1"/>
  <text x="148" y="34" text-anchor="middle" font-family="var(--font-sans)" font-size="13.5" font-weight="700" fill="#8f3229">1. 同卡外部释放为何触发断言失败</text>
  <text x="290" y="34" font-family="var(--font-sans)" font-size="13.5" fill="#4d5652">容器隔离进程视图，不隔离同卡物理 HBM 差分读数（示意 100 GiB 卡）</text>

  <!-- Row 1: t0 init_snapshot (scale: 1 GiB = 5.0 px, x=156..656 => 500 px) -->
  <text x="22" y="74" font-family="var(--font-mono)" font-size="14" font-weight="700" fill="#17211f">t0 init_snapshot</text>
  <text x="22" y="93" font-family="var(--font-sans)" font-size="13.5" fill="#66716d">建通信组前拍快照</text>

  <!-- Bar t0: 20 GiB other (100px) + 80 GiB free (400px) -->
  <rect x="156" y="56" width="100" height="42" rx="4" fill="#ece9df" stroke="#b8bcb5" stroke-width="1.2"/>
  <text x="206" y="82" text-anchor="middle" font-family="var(--font-sans)" font-size="13.5" font-weight="700" fill="#4d5652">他进程 20G</text>
  <rect x="256" y="56" width="400" height="42" rx="4" fill="#ddf4ef" stroke="#087f73" stroke-width="1.3"/>
  <text x="456" y="82" text-anchor="middle" font-family="var(--font-sans)" font-size="14" font-weight="700" fill="#065f56">整卡空闲 init_free = 80 GiB</text>

  <!-- Event transitions between t0 and t1 -->
  <rect x="156" y="110" width="234" height="30" rx="6" fill="#fff0e9" stroke="#b54237" stroke-width="1.2" stroke-dasharray="4 3"/>
  <text x="273" y="130" text-anchor="middle" font-family="var(--font-sans)" font-size="13.5" font-weight="700" fill="#8f3229">另一容器退场释放 −10 GiB</text>

  <rect x="404" y="110" width="252" height="30" rx="6" fill="#e8edff" stroke="#4c65b6" stroke-width="1.2"/>
  <text x="530" y="130" text-anchor="middle" font-family="var(--font-sans)" font-size="13.5" font-weight="700" fill="#3a4f93">本 vLLM 加载+试跑新增 +2 GiB</text>

  <!-- Down arrows showing bar shift -->
  <line x1="256" y1="98" x2="206" y2="152" stroke="#b54237" stroke-width="1.5" stroke-dasharray="4 3" marker-end="url(#arr-err)"/>
  <line x1="656" y1="98" x2="656" y2="152" stroke="#4d5652" stroke-width="1.3" marker-end="url(#arr-ink)"/>

  <!-- Row 2: t1 after_profile (scale: 1 GiB = 5.0 px, x=156..656 => 500 px) -->
  <text x="22" y="172" font-family="var(--font-mono)" font-size="14" font-weight="700" fill="#17211f">t1 after_profile</text>
  <text x="22" y="191" font-family="var(--font-sans)" font-size="13.5" fill="#66716d">试跑结束读剩余空闲</text>

  <!-- Bar t1: 10 GiB other (50px: 156..206) + 2 GiB self (10px->use 26px min readable, annotate exact 2G; wait let's keep strict proportional or clearly marked!) -->
  <!-- Let's make scale 100 GiB = 500px: 10 GiB = 50px (156..206), 2 GiB = 10px (206..216), 88 GiB = 440px (216..656)! Put "+2G" callout cleanly above/below! -->
  <rect x="156" y="154" width="50" height="42" rx="3" fill="#ece9df" stroke="#b8bcb5" stroke-width="1.2"/>
  <text x="181" y="180" text-anchor="middle" font-family="var(--font-sans)" font-size="13.5" font-weight="700" fill="#4d5652">10G</text>

  <rect x="206" y="154" width="12" height="42" fill="#4c65b6" stroke="#3a4f93" stroke-width="1.2"/>

  <!-- Highlight the 40px (8 GiB) net free expansion inside the 88 GiB bar -->
  <rect x="218" y="154" width="438" height="42" rx="4" fill="#ddf4ef" stroke="#087f73" stroke-width="1.3"/>
  <rect x="218" y="154" width="38" height="42" fill="url(#hatch-release)" stroke="#b54237" stroke-width="1.2" stroke-dasharray="3 2"/>
  <text x="456" y="180" text-anchor="middle" font-family="var(--font-sans)" font-size="14" font-weight="700" fill="#065f56">整卡空闲 free_after = 88 GiB（反增 +8 GiB）</text>

  <!-- Exact bottom annotations for the thin 2 GiB and 8 GiB slices -->
  <line x1="212" y1="196" x2="212" y2="212" stroke="#4c65b6" stroke-width="1.4"/>
  <text x="172" y="224" font-family="var(--font-sans)" font-size="13.5" font-weight="700" fill="#3a4f93">本实例 +2G</text>
  <line x1="237" y1="196" x2="280" y2="212" stroke="#b54237" stroke-width="1.4"/>
  <text x="284" y="224" font-family="var(--font-sans)" font-size="13.5" font-weight="700" fill="#8f3229">净空回涨 8 GiB（Δ = 80 − 88 = −8 GiB）</text>

  <!-- Right Verdict Card (x=674..880, y=54..222) -->
  <line x1="656" y1="175" x2="670" y2="175" stroke="#b54237" stroke-width="1.8" marker-end="url(#arr-err)"/>
  <rect x="674" y="54" width="206" height="168" rx="8" fill="#fff0e9" stroke="#b54237" stroke-width="1.5"/>
  <text x="777" y="77" text-anchor="middle" font-family="var(--font-sans)" font-size="14.5" font-weight="700" fill="#8f3229">NPUWorker 严格断言</text>
  <line x1="686" y1="87" x2="868" y2="87" stroke="#b54237" stroke-width="1" stroke-opacity="0.35"/>
  <text x="777" y="108" text-anchor="middle" font-family="var(--font-mono)" font-size="13.5" font-weight="700" fill="#8f3229">init_free &gt; after_free</text>
  <text x="777" y="130" text-anchor="middle" font-family="var(--font-mono)" font-size="14" font-weight="700" fill="#b54237">80 &gt; 88 → False ✗</text>
  <text x="777" y="154" text-anchor="middle" font-family="var(--font-sans)" font-size="13.5" font-weight="700" fill="#17211f">抛 AssertionError</text>
  <text x="777" y="175" text-anchor="middle" font-family="var(--font-sans)" font-size="13.5" fill="#4d5652">基准污染，≠ 显存 OOM</text>
  <rect x="688" y="186" width="178" height="26" rx="5" fill="#ffffff" stroke="#b54237" stroke-width="1"/>
  <text x="777" y="204" text-anchor="middle" font-family="var(--font-sans)" font-size="13.5" font-weight="700" fill="#8f3229">修法：隔卡 / 错峰拉起</text>

  <!-- ZONE 2: Multimodal limit_mm_per_prompt & Host DRAM Isolation (y=248..462) -->
  <rect x="8" y="248" width="884" height="214" rx="10" fill="#f8f6f0" stroke="#d8d8cf" stroke-width="1.2"/>
  <rect x="20" y="258" width="280" height="24" rx="12" fill="#ddf4ef" stroke="#087f73" stroke-width="1"/>
  <text x="160" y="274" text-anchor="middle" font-family="var(--font-sans)" font-size="13.5" font-weight="700" fill="#065f56">2. 多模态试跑尺寸提示 ≠ 运行期限制</text>
  <text x="302" y="274" font-family="var(--font-mono)" font-size="12" fill="#4d5652">--limit-mm-per-prompt '{"image":{"count":5,"width":512,"height":512}}'</text>

  <!-- Left container: NPU HBM side (x=20..582, y=294..448) -->
  <rect x="20" y="294" width="562" height="154" rx="8" fill="#ffffff" stroke="#b8bcb5" stroke-width="1.2"/>
  <text x="34" y="316" font-family="var(--font-sans)" font-size="14" font-weight="700" fill="#17211f">NPU HBM 设备侧：拆清同一参数里的两类字段</text>

  <!-- Sub-card A: count -->
  <rect x="34" y="328" width="248" height="108" rx="7" fill="#ddf4ef" stroke="#087f73" stroke-width="1.3"/>
  <text x="48" y="351" font-family="var(--font-mono)" font-size="14" font-weight="700" fill="#065f56">count（数量上限）</text>
  <rect x="194" y="335" width="76" height="22" rx="11" fill="#087f73"/>
  <text x="232" y="351" text-anchor="middle" font-family="var(--font-sans)" font-size="13.5" font-weight="700" fill="#ffffff">运行期生效</text>
  <text x="48" y="378" font-family="var(--font-sans)" font-size="13.5" fill="#17211f">• 单请求最多 5 图 / 1 视频</text>
  <text x="48" y="401" font-family="var(--font-sans)" font-size="13.5" fill="#17211f">• 准入硬闸门，超限直接拒收</text>
  <text x="48" y="424" font-family="var(--font-sans)" font-size="13.5" fill="#065f56">真正卡住线上并发媒体数</text>

  <!-- Sub-card B: width/height/num_frames -->
  <rect x="296" y="328" width="272" height="108" rx="7" fill="#fff4cf" stroke="#c78300" stroke-width="1.3"/>
  <text x="310" y="351" font-family="var(--font-mono)" font-size="13.5" font-weight="700" fill="#936300">width/height/num_frames</text>
  <rect x="492" y="335" width="66" height="22" rx="11" fill="#c78300"/>
  <text x="525" y="351" text-anchor="middle" font-family="var(--font-sans)" font-size="13.5" font-weight="700" fill="#ffffff">仅试跑</text>
  <text x="310" y="378" font-family="var(--font-sans)" font-size="13.5" fill="#17211f">• 只改 profile_run 假输入规格</text>
  <text x="310" y="401" font-family="var(--font-sans)" font-size="13.5" font-weight="700" fill="#8f3229">✗ 不自动缩放线上真实大图</text>
  <text x="310" y="424" font-family="var(--font-sans)" font-size="13.5" font-weight="700" fill="#8f3229">✗ 不封顶运行期 encoder cache</text>

  <!-- Isolation Divider between NPU HBM and Host DRAM -->
  <line x1="600" y1="298" x2="600" y2="444" stroke="#b54237" stroke-width="1.6" stroke-dasharray="5 4"/>
  <rect x="585" y="358" width="30" height="24" rx="5" fill="#fff0e9" stroke="#b54237" stroke-width="1.1"/>
  <text x="600" y="375" text-anchor="middle" font-family="var(--font-sans)" font-size="14" font-weight="700" fill="#8f3229">≠</text>

  <!-- Right container: Host DRAM side (x=618..880, y=294..448) -->
  <rect x="618" y="294" width="262" height="154" rx="8" fill="#f7e7f2" stroke="#9a4b86" stroke-width="1.3"/>
  <text x="749" y="318" text-anchor="middle" font-family="var(--font-sans)" font-size="14" font-weight="700" fill="#7a3a6a">Host DRAM 主机内存（独立账）</text>
  <line x1="632" y1="328" x2="866" y2="328" stroke="#9a4b86" stroke-width="1" stroke-opacity="0.35"/>
  <rect x="634" y="340" width="230" height="32" rx="6" fill="#ffffff" stroke="#9a4b86" stroke-width="1.1"/>
  <text x="749" y="361" text-anchor="middle" font-family="var(--font-mono)" font-size="13.5" font-weight="700" fill="#7a3a6a">mm_processor_cache_gb</text>
  <text x="634" y="395" font-family="var(--font-sans)" font-size="13.5" fill="#17211f">• 存多模态预处理缓存，不在 NPU 上</text>
  <text x="634" y="418" font-family="var(--font-sans)" font-size="13.5" fill="#17211f">• 调小 NPU KV 预算不缩小主机缓存</text>
  <text x="634" y="440" font-family="var(--font-sans)" font-size="13.5" font-weight="700" fill="#7a3a6a">控像素需改模型预处理器像素上限</text>
</svg>
