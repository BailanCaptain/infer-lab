<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 496" width="900" height="496" role="img" aria-label="示意：昇腾 HBM 显存预算与启动量测五大常见误解与 v0.30.0 源码机制横向对照板。" font-family="var(--font-sans)">
  <title>示意：昇腾 HBM 显存预算与启动量测五大常见误解对照（v0.30.0）。涵盖 HCCL 已含在试跑差值内、ACLGraph 录图占用预算外 1−u 余量、物理块数不等于并发数、同卡进程释放显存触发断言失败，以及显式字节预算仍执行试跑编译。</title>
  <desc>关联源码符号：kv_cache_memory_bytes, profile_run, non_torch_increase, free_memory, capture_model, redundancy_buffer, check_memory, min_num_blocks</desc>

  <text x="16" y="28" font-size="16" font-weight="700" fill="#b54237">✗ 常见错误直觉</text>
  <text x="404" y="28" font-size="16" font-weight="700" fill="#087f73">✓ 真实源码机制（vLLM Ascend v0.30.0 主基线）</text>
  <line x1="16" y1="42" x2="884" y2="42" stroke="#b8bcb5" stroke-width="1.4"/>
  <line x1="388" y1="12" x2="388" y2="484" stroke="#b8bcb5" stroke-width="1.4" stroke-dasharray="5 4"/>

  <!-- Row 1 -->
  <rect x="16" y="54" width="358" height="76" rx="7" fill="#fff0e9" stroke="#d88c82" stroke-width="1.2"/>
  <text x="28" y="82" font-size="14.5" font-weight="700" fill="#8f3229">① 在试跑扣减外再手扣 HCCL</text>
  <text x="28" y="110" font-size="13.5" fill="#4d5652">把通信组配置额从可用 KV 里二次扣除</text>

  <rect x="404" y="54" width="480" height="76" rx="7" fill="#ddf4ef" stroke="#79aaa1" stroke-width="1.3"/>
  <text x="418" y="82" font-size="14.5" font-weight="700" fill="#065f56">建组晚于启动快照，HCCL 已含在 non_torch_increase</text>
  <text x="418" y="110" font-size="13.5" fill="#4d5652">共享域去重且已入账；仅录图建议值另扣 150 MiB 裕度</text>

  <!-- Row 2 -->
  <rect x="16" y="142" width="358" height="76" rx="7" fill="#fff0e9" stroke="#d88c82" stroke-width="1.2"/>
  <text x="28" y="170" font-size="14.5" font-weight="700" fill="#8f3229">② 比例拉到 0.98 榨干空闲显存</text>
  <text x="28" y="198" font-size="13.5" fill="#4d5652">误以为预算外 1−u 空着不用就是浪费</text>

  <rect x="404" y="142" width="480" height="76" rx="7" fill="#ddf4ef" stroke="#79aaa1" stroke-width="1.3"/>
  <text x="418" y="170" font-size="14.5" font-weight="700" fill="#065f56">ACLGraph 录图在切完 KV 之后，全靠 1−u 余量买单</text>
  <text x="418" y="198" font-size="13.5" fill="#4d5652">NPUWorker 不预扣图显存；留太少会在 capture_model OOM</text>

  <!-- Row 3 -->
  <rect x="16" y="230" width="358" height="76" rx="7" fill="#fff0e9" stroke="#d88c82" stroke-width="1.2"/>
  <text x="28" y="258" font-size="14.5" font-weight="700" fill="#8f3229">③ 切出的块数 = 最大并发请求数</text>
  <text x="28" y="286" font-size="13.5" fill="#4d5652">把 min_num_blocks 直接等同于 max_num_seqs</text>

  <rect x="404" y="230" width="480" height="76" rx="7" fill="#ddf4ef" stroke="#79aaa1" stroke-width="1.3"/>
  <text x="418" y="258" font-size="14.5" font-weight="700" fill="#065f56">块数只定 token 槽位池（check_memory 另扣 1 个空块）</text>
  <text x="418" y="286" font-size="13.5" fill="#4d5652">请求按真实长度动态借块，混合线性注意力还占固定状态块</text>

  <!-- Row 4 -->
  <rect x="16" y="318" width="358" height="76" rx="7" fill="#fff0e9" stroke="#d88c82" stroke-width="1.2"/>
  <text x="28" y="346" font-size="14.5" font-weight="700" fill="#8f3229">④ 启动期别人释放显存只会更好</text>
  <text x="28" y="374" font-size="13.5" fill="#4d5652">以为整卡空闲变多总归有利于通过量测</text>

  <rect x="404" y="318" width="480" height="76" rx="7" fill="#ddf4ef" stroke="#79aaa1" stroke-width="1.3"/>
  <text x="418" y="346" font-size="14.5" font-weight="700" fill="#065f56">空闲回升会触发 free_memory 严格递减断言失败</text>
  <text x="418" y="374" font-size="13.5" fill="#4d5652">试跑后空闲 ≥ 初始快照即抛 Error in memory profiling</text>

  <!-- Row 5 -->
  <rect x="16" y="406" width="358" height="76" rx="7" fill="#fff0e9" stroke="#d88c82" stroke-width="1.2"/>
  <text x="28" y="434" font-size="14.5" font-weight="700" fill="#8f3229">⑤ 传显式字节预算可跳过试跑提速</text>
  <text x="28" y="462" font-size="13.5" fill="#4d5652">以为设 kv_cache_memory_bytes 能省前向耗时</text>

  <rect x="404" y="406" width="480" height="76" rx="7" fill="#ddf4ef" stroke="#79aaa1" stroke-width="1.3"/>
  <text x="418" y="434" font-size="14.5" font-weight="700" fill="#065f56">照常跑 profile_run() 完成首次编译，只跳过扣减算式</text>
  <text x="418" y="462" font-size="13.5" fill="#4d5652">启动快照空闲检查仍按比例执行，稀疏卸载与 KVPP 照算</text>
</svg>
