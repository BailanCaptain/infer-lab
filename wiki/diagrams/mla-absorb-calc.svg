<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 360" width="900" height="360" role="img" aria-label="同一个分数的两种算法（数为示意，接低秩压缩的例子）：左边先用头 1 的 K 上投影把 c₀ 还原成 k₀,₁，再和 q 点积；右边先把这块上投影行列互换后乘进 q，得到 q̃，再直接和 c₀ 点积。两边都是 6，而 q̃ 只算一次就能和每个历史位置的潜向量点乘">
  <title>同一个分数的两种算法（数为示意，接低秩压缩的例子）：左边先用头 1 的 K 上投影把 c₀ 还原成 k₀,₁，再和 q 点积；右边先把这块上投影行列互换后乘进 q，得到 q̃，再直接和 c₀ 点积。两边都是 6，而 q̃ 只算一次就能和每个历史位置的潜向量点乘</title>
