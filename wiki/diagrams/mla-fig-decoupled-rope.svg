<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 364" width="900" height="364" role="img" aria-label="RoPE 为何阻断 MLA 吸收、DeepSeek-V2 Decoupled RoPE 绕行与 GLM NoPE 零 RoPE 段对比图" font-family="var(--font-sans)">
  <title>为什么直接对展开 K 施加 RoPE 会破坏 MLA 权重吸收、DeepSeek-V2 如何通过 Decoupled RoPE 拆通道绕开，以及 GLM-5.3-Flash 为何设 qk_rope_head_dim=0 不存 RoPE 段。</title>
  <desc>三条横向方案对比：一、直接对展开后的 K 施加 RoPE 时，随相对位置变化的旋转矩阵 R(t-s) 夹在 q_i 与 W_UK_i^T 之间，无法提前合并，吸收失效；二、DeepSeek-V2 的 Decoupled RoPE 将主通路 512 维潜向量保持 NoPE 以继续吸收，并另存 64 维已旋转共享 k^R（总 576 维）独立点积相加；三、GLM-5.3-Flash 设 qk_rope_head_dim=0 且 mla_use_nope=true，主缓存仅存 512 维纯潜向量（1,024 B BF16），吸收零阻碍。</desc>

  <text x="14" y="24" font-size="16" font-weight="700" fill="#17211f">RoPE 与 MLA 吸收的冲突，以及两条工程解法（DeepSeek-V2 vs GLM-5.3-Flash）</text>

  <!-- Row 1: Naive RoPE blocks absorb -->
  <rect x="14" y="38" width="872" height="94" rx="9" fill="#fff0e9" stroke="#b54237" stroke-width="1.5"/>
  <text x="28" y="62" font-size="14.5" font-weight="700" fill="#8f3229">✗ 朴素方案：直接对展开后的 K 施加 RoPE → 吸收失效</text>
  <!-- Equation blocks showing R(t-s) wedged between q and W_UK -->
  <rect x="28" y="74" width="66" height="42" rx="6" fill="#ffffff" stroke="#4c65b6" stroke-width="1.3"/>
  <text x="61" y="100" text-anchor="middle" font-size="14" font-family="var(--font-mono)" font-weight="700" fill="#3a4f93">qᵢ</text>
  <text x="106" y="100" text-anchor="middle" font-size="15" font-weight="700" fill="#4d5652">·</text>
  <rect x="118" y="74" width="160" height="42" rx="6" fill="#b54237"/>
  <text x="198" y="94" text-anchor="middle" font-size="13.5" font-family="var(--font-mono)" font-weight="700" fill="#ffffff">R(t − s)</text>
  <text x="198" y="111" text-anchor="middle" font-size="13" fill="#fff0e9">随历史位置 s 变！</text>
  <text x="290" y="100" text-anchor="middle" font-size="15" font-weight="700" fill="#4d5652">·</text>
  <rect x="302" y="74" width="104" height="42" rx="6" fill="#fff4cf" stroke="#c78300" stroke-width="1.3"/>
  <text x="354" y="100" text-anchor="middle" font-size="14" font-family="var(--font-mono)" font-weight="700" fill="#936300">W_UKᵢᵀ</text>
  <text x="418" y="100" text-anchor="middle" font-size="15" font-weight="700" fill="#4d5652">·</text>
  <rect x="430" y="74" width="68" height="42" rx="6" fill="#ddf4ef" stroke="#087f73" stroke-width="1.3"/>
  <text x="464" y="100" text-anchor="middle" font-size="14" font-family="var(--font-mono)" font-weight="700" fill="#065f56">cₛᵀ</text>

  <text x="518" y="92" font-size="13.5" font-weight="700" fill="#8f3229">矩阵乘法不可交换：R(t−s) 挡在中间</text>
  <text x="518" y="113" font-size="13.5" fill="#4d5652">无法把 W_UKᵢᵀ 提前并进 qᵢ，被迫逐历史位置重算 K</text>

  <!-- Row 2: DeepSeek-V2 Decoupled RoPE -->
  <rect x="14" y="146" width="872" height="106" rx="9" fill="#e8edff" stroke="#4c65b6" stroke-width="1.5"/>
  <text x="28" y="170" font-size="14.5" font-weight="700" fill="#3a4f93">✓ DeepSeek-V2 解法：Decoupled RoPE（主潜向量照常吸收 + 另存 64 维已旋转小通道）</text>

  <rect x="28" y="182" width="248" height="54" rx="7" fill="#ddf4ef" stroke="#087f73" stroke-width="1.3"/>
  <text x="152" y="204" text-anchor="middle" font-size="13.5" font-family="var(--font-mono)" font-weight="700" fill="#065f56">(qᵢ · W_UKᵢᵀ) · cₛᵀ</text>
  <text x="152" y="226" text-anchor="middle" font-size="13" fill="#065f56">主通道 NoPE · 512 维（完整吸收）</text>

  <text x="294" y="215" text-anchor="middle" font-size="18" font-weight="700" fill="#3a4f93">+</text>

  <rect x="312" y="182" width="234" height="54" rx="7" fill="#fff4cf" stroke="#c78300" stroke-width="1.3"/>
  <text x="429" y="204" text-anchor="middle" font-size="13.5" font-family="var(--font-mono)" font-weight="700" fill="#936300">qᵢᴿ · kₛᴿ（已旋转）</text>
  <text x="429" y="226" text-anchor="middle" font-size="13" fill="#936300">位置通道 · 64 维（不经过 W_UK）</text>

  <rect x="564" y="182" width="308" height="54" rx="7" fill="#ffffff" stroke="#4c65b6" stroke-width="1.2"/>
  <text x="718" y="204" text-anchor="middle" font-size="13.5" font-weight="700" fill="#17211f">每位置缓存 = 512 + 64 = <tspan font-family="var(--font-mono)" fill="#3a4f93">576</tspan> 维</text>
  <text x="718" y="226" text-anchor="middle" font-size="13" fill="#4d5652">打分直接相加；缩放分母用 √(128 + 64)</text>

  <!-- Row 3: GLM-5.3-Flash NoPE -->
  <rect x="14" y="266" width="872" height="86" rx="9" fill="#ddf4ef" stroke="#087f73" stroke-width="1.5"/>
  <text x="28" y="290" font-size="14.5" font-weight="700" fill="#065f56">✓ GLM-5.3-Flash 配置：qk_rope_head_dim = 0, mla_use_nope = true（无 RoPE 段）</text>
  <rect x="28" y="302" width="330" height="38" rx="6" fill="#ffffff" stroke="#087f73" stroke-width="1.3"/>
  <text x="193" y="326" text-anchor="middle" font-size="13.5" font-family="var(--font-mono)" font-weight="700" fill="#065f56">主缓存仅存 512 维纯潜向量（1,024 B BF16）</text>
  <text x="374" y="319" font-size="13.5" fill="#17211f">• RoPE 通道宽 0，跳过旋转，吸收零阻碍（缩放 ÷√256）</text>
  <text x="374" y="339" font-size="13" fill="#4d5652">• 位置感由 34 层 KDA 递推 + indexer 池偏置 + 因果掩码提供</text>
</svg>
