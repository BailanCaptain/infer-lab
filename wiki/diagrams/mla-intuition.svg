<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 600" width="880" height="600" role="img" aria-label="MLA 的直觉。写入时，新位置被压成一条所有头共用的潜向量 c，存进 KV cache；读取时只取本次选中的位置，由各头的上投影从 c 得到 K 和 V，再照常做多头 attention。10 个位置、选中 4 个只是示意。">
  <title>MLA 的直觉。写入时，新位置被压成一条所有头共用的潜向量 c，存进 KV cache；读取时只取本次选中的位置，由各头的上投影从 c 得到 K 和 V，再照常做多头 attention。10 个位置、选中 4 个只是示意。</title>
