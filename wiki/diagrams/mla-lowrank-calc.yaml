layout: figure
id: mla-lowrank-calc
caption: 低秩压缩走一遍（数为示意）：位置 0 的隐藏向量 h₀ 乘下投影，压成只有 2 个数的潜向量 c₀，进 KV cache 的只有它；每个头再用自己的上投影，从同一条 c₀ 还原出自己的 K 和 V。右边四条共 8 个数，是普通多头要为这个位置存的量
