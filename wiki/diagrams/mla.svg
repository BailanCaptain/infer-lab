  <path d="M620 514 l-11 -5.5 l0 11 z" fill="var(--color-accent, #e85b32)"/>
  <path d="M786 146 L870 146 L870 462 L560 462 L560 470" fill="none" stroke="var(--color-accent, #e85b32)" stroke-width="1.8" stroke-dasharray="6 4"/>
  <path d="M560 470 l-5.5 -11 l11 0 z" fill="var(--color-accent, #e85b32)"/>
  <rect x="641.8" y="452" width="146.5" height="19" rx="6" fill="var(--color-surface, #fbfaf6)"/>
  <text x="715" y="466" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="12.5" font-weight="400" fill="var(--color-ink-muted, #5b6763)" text-anchor="middle">decode 直接拿整块缓存</text>
  <path d="M236 112 l0 -9 L778 103 l0 9" fill="none" stroke="var(--color-ink-faint, #8a928f)" stroke-width="1.4" opacity="0.75"/>
  <text x="507" y="95" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="12.5" font-weight="600" fill="var(--color-ink-faint, #8a928f)" text-anchor="middle">每 token 每层 576 × 2 B = 1152 B</text>
  <text x="20" y="600" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="12.5" font-weight="400" fill="var(--color-ink-muted, #5b6763)">一层一个 token 只占 (512 + 64) × 2 = 1152 字节：prefill 每次重新展开，decode 一次都不展开。</text>
</svg>
