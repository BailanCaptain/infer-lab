<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 614" width="900" height="614" role="img" aria-label="缓存里只有 512 维潜向量加 64 维 RoPE 段；prefill 把它展开，decode 改把展开矩阵搬到 Q 那边">
  <title>缓存里只有 512 维潜向量加 64 维 RoPE 段；prefill 把它展开，decode 改把展开矩阵搬到 Q 那边</title>
  <rect width="900" height="614" fill="var(--color-surface, #fbfaf6)"/>
  <rect x="20" y="22" width="860" height="186" rx="12" fill="var(--color-weight-soft, #fff4cf)"/>
  <rect x="36" y="36" width="157" height="26.5" rx="13.3" fill="var(--color-weight, #b87a00)"/><text x="47" y="54.1" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="13.5" font-weight="700" fill="var(--color-ink-inverse, #ffffff)">写进缓存的只有这一条</text>
  <text x="38" y="79" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="12.5" font-weight="400" fill="var(--color-ink-muted, #5b6763)">压缩发生在一个投影里，RMSNorm、RoPE 和落盘由同一个融合算子做完。</text>
  <rect x="20" y="228" width="860" height="156" rx="12" fill="var(--color-surface-sunken, #ece9df)"/>
  <rect x="36" y="242" width="167" height="26.5" rx="13.3" fill="var(--color-control, #5b6763)"/><text x="47" y="260.1" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="13.5" font-weight="700" fill="var(--color-ink-inverse, #ffffff)">prefill 这一路：解压</text>
  <text x="38" y="285" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="12.5" font-weight="400" fill="var(--color-ink-muted, #5b6763)">从缓存取回的 512 维要先展开成每个头的 K 和 V，再喂给算子。</text>
  <rect x="20" y="404" width="860" height="176" rx="12" fill="var(--color-accent-soft, #fff0e9)"/>
  <rect x="36" y="418" width="212.6" height="26.5" rx="13.3" fill="var(--color-accent, #e85b32)"/><text x="47" y="436.1" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="13.5" font-weight="700" fill="var(--color-ink-inverse, #ffffff)">decode 这一路：一次都不解压</text>
  <text x="38" y="461" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="12.5" font-weight="400" fill="var(--color-ink-muted, #5b6763)">q 先被搬进 512 维的潜空间，算子的 key 和 value 收到同一个张量。</text>
  <rect x="236" y="118" width="56" height="56" rx="3" fill="var(--color-weight, #b87a00)" stroke="var(--color-weight, #b87a00)" stroke-width="1.1"/>
  <rect x="296" y="118" width="56" height="56" rx="3" fill="var(--color-weight, #b87a00)" stroke="var(--color-weight, #b87a00)" stroke-width="1.1"/>
  <rect x="356" y="118" width="56" height="56" rx="3" fill="var(--color-weight, #b87a00)" stroke="var(--color-weight, #b87a00)" stroke-width="1.1"/>
  <rect x="416" y="118" width="56" height="56" rx="3" fill="var(--color-weight, #b87a00)" stroke="var(--color-weight, #b87a00)" stroke-width="1.1"/>
  <rect x="476" y="118" width="56" height="56" rx="3" fill="var(--color-weight, #b87a00)" stroke="var(--color-weight, #b87a00)" stroke-width="1.1"/>
  <rect x="536" y="118" width="56" height="56" rx="3" fill="var(--color-weight, #b87a00)" stroke="var(--color-weight, #b87a00)" stroke-width="1.1"/>
  <rect x="596" y="118" width="56" height="56" rx="3" fill="var(--color-weight, #b87a00)" stroke="var(--color-weight, #b87a00)" stroke-width="1.1"/>
  <rect x="656" y="118" width="56" height="56" rx="3" fill="var(--color-weight, #b87a00)" stroke="var(--color-weight, #b87a00)" stroke-width="1.1"/>
  <text x="236" y="192" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="12.5" font-weight="400" fill="var(--color-ink-muted, #5b6763)">kv_lora_rank = 512（一格 64 维）</text>
  <rect x="722" y="118" width="56" height="56" rx="3" fill="var(--color-accent, #e85b32)" stroke="var(--color-accent, #e85b32)" stroke-width="1.1"/>
  <text x="722" y="192" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="12.5" font-weight="400" fill="var(--color-ink-muted, #5b6763)">qk_rope_head_dim = 64</text>
  <rect x="36" y="112" width="176" height="76" rx="11" fill="var(--color-surface, #fbfaf6)" stroke="var(--color-weight, #b87a00)" stroke-width="1.5"/>
  <text x="52" y="138" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="14.5" font-weight="700" fill="var(--color-ink, #17211f)">压一次</text>
  <text x="52" y="156" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="12.5" font-weight="400" fill="var(--color-ink-muted, #5b6763)">576 = 512 + 64</text>
  <text x="52" y="173" font-family="'JetBrains Mono',ui-monospace,monospace" font-size="12.5" font-weight="400" fill="var(--color-weight, #b87a00)">kv_a_proj_with_mqa</text>
  <rect x="36" y="300" width="246" height="70" rx="11" fill="var(--color-surface, #fbfaf6)" stroke="var(--color-control, #5b6763)" stroke-width="1.5"/>
  <text x="52" y="331.5" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="14.5" font-weight="700" fill="var(--color-ink, #17211f)">解压：512 → 每头 128+128</text>
  <text x="52" y="349.5" font-family="'JetBrains Mono',ui-monospace,monospace" font-size="12.5" font-weight="400" fill="var(--color-control, #5b6763)">kv_b_proj</text>
  <rect x="302" y="300" width="286" height="70" rx="11" fill="var(--color-surface, #fbfaf6)" stroke="var(--color-weight, #b87a00)" stroke-width="1.5"/>
  <text x="318" y="323" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="14.5" font-weight="700" fill="var(--color-ink, #17211f)">算子收三个不同的张量</text>
  <text x="318" y="341" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="12.5" font-weight="400" fill="var(--color-ink-muted, #5b6763)">query / key / value 各自独立</text>
  <text x="318" y="358" font-family="'JetBrains Mono',ui-monospace,monospace" font-size="12.5" font-weight="400" fill="var(--color-weight, #b87a00)">npu_fused_infer_attention_score</text>
  <rect x="608" y="300" width="252" height="70" rx="11" fill="var(--color-surface, #fbfaf6)" stroke="var(--color-accent, #e85b32)" stroke-width="1.5"/>
  <text x="624" y="331.5" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="14.5" font-weight="700" fill="var(--color-ink, #17211f)">block_table 传 None</text>
  <text x="624" y="349.5" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="12.5" font-weight="400" fill="var(--color-ink-muted, #5b6763)">这一步的 KV 还在手上</text>
  <rect x="36" y="476" width="248" height="76" rx="11" fill="var(--color-surface, #fbfaf6)" stroke="var(--color-weight, #b87a00)" stroke-width="1.5"/>
  <text x="52" y="502" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="14.5" font-weight="700" fill="var(--color-ink, #17211f)">W_UK 搬到 Q 这边</text>
  <text x="52" y="520" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="12.5" font-weight="400" fill="var(--color-ink-muted, #5b6763)">q 每头 128 → 512</text>
  <text x="52" y="537" font-family="'JetBrains Mono',ui-monospace,monospace" font-size="12.5" font-weight="400" fill="var(--color-weight, #b87a00)">_q_proj_and_k_up_proj</text>
  <rect x="304" y="476" width="300" height="76" rx="11" fill="var(--color-surface, #fbfaf6)" stroke="var(--color-accent, #e85b32)" stroke-width="1.5"/>
  <text x="320" y="502" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="14.5" font-weight="700" fill="var(--color-ink, #17211f)">key 和 value 是同一个张量</text>
  <text x="320" y="520" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="12.5" font-weight="400" fill="var(--color-ink-muted, #5b6763)">k_nope 就是缓存里那 512 维</text>
  <text x="320" y="537" font-family="'JetBrains Mono',ui-monospace,monospace" font-size="12.5" font-weight="400" fill="var(--color-accent, #e85b32)">npu_fused_infer_attention_score_v2</text>
  <rect x="624" y="476" width="236" height="76" rx="11" fill="var(--color-surface, #fbfaf6)" stroke="var(--color-control, #5b6763)" stroke-width="1.5"/>
  <text x="640" y="502" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="14.5" font-weight="700" fill="var(--color-ink, #17211f)">出来的还是 512 维</text>
  <text x="640" y="520" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="12.5" font-weight="400" fill="var(--color-ink-muted, #5b6763)">W_UV 再映回 v_head_dim</text>
  <text x="640" y="537" font-family="'JetBrains Mono',ui-monospace,monospace" font-size="12.5" font-weight="400" fill="var(--color-control, #5b6763)">_v_up_proj</text>
  <path d="M216 150 L230 150" fill="none" stroke="var(--color-weight, #b87a00)" stroke-width="1.8"/>
  <path d="M230 150 l-11 -5.5 l0 11 z" fill="var(--color-weight, #b87a00)"/>
  <path d="M286 335 L298 335" fill="none" stroke="var(--color-control, #5b6763)" stroke-width="1.8"/>
  <path d="M298 335 l-11 -5.5 l0 11 z" fill="var(--color-control, #5b6763)"/>
  <path d="M592 335 L604 335" fill="none" stroke="var(--color-control, #5b6763)" stroke-width="1.8"/>
  <path d="M604 335 l-11 -5.5 l0 11 z" fill="var(--color-control, #5b6763)"/>
  <path d="M288 514 L300 514" fill="none" stroke="var(--color-accent, #e85b32)" stroke-width="1.8"/>
  <path d="M300 514 l-11 -5.5 l0 11 z" fill="var(--color-accent, #e85b32)"/>
