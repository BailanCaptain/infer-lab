<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 700" width="880" height="700" role="img" aria-label="GLM 一个稀疏 MLA 层在每张卡上的执行顺序（专用镜像 db701c1f）。左列写历史，中列准备查询，右列选位置，三路在稀疏 FlashAttention 内核汇合；虚线框是 Q 不做低秩压缩时的另一分支，GLM 不走。">
  <title>GLM 一个稀疏 MLA 层在每张卡上的执行顺序（专用镜像 db701c1f）。左列写历史，中列准备查询，右列选位置，三路在稀疏 FlashAttention 内核汇合；虚线框是 Q 不做低秩压缩时的另一分支，GLM 不走。</title>
  <defs><marker id="mla-ah-ink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="var(--color-ink, #17211f)"/></marker></defs>
  <rect x="20" y="44" width="840" height="630" rx="16" fill="none" stroke="var(--color-line-strong, #b8bcb5)" stroke-width="1.5"/>
  <text x="36" y="32" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="15" font-weight="700" fill="var(--color-ink, #17211f)">一个稀疏 MLA 层的前向（每卡）· 主线第 4 站，主干 11 层与 MTP 层各跑一次</text>
  <path d="M720 100 L726 100" fill="none" stroke="var(--color-ink, #17211f)" stroke-width="1.4" stroke-dasharray="7 5"/>
  <path d="M240 130 L240 155 L170 155 L170 180" fill="none" stroke="var(--color-ink, #17211f)" stroke-width="1.4" marker-end="url(#mla-ah-ink)"/>
  <path d="M440 130 L440 180" fill="none" stroke="var(--color-ink, #17211f)" stroke-width="1.4" marker-end="url(#mla-ah-ink)"/>
  <path d="M570 210 L580 210" fill="none" stroke="var(--color-ink, #17211f)" stroke-width="1.4" marker-end="url(#mla-ah-ink)"/>
  <path d="M170 240 L170 280" fill="none" stroke="var(--color-ink, #17211f)" stroke-width="1.4" marker-end="url(#mla-ah-ink)"/>
  <path d="M440 240 L440 280" fill="none" stroke="var(--color-ink, #17211f)" stroke-width="1.4" marker-end="url(#mla-ah-ink)"/>
  <path d="M710 240 L710 280" fill="none" stroke="var(--color-ink, #17211f)" stroke-width="1.4" marker-end="url(#mla-ah-ink)"/>
  <path d="M170 340 L170 390" fill="none" stroke="var(--color-ink, #17211f)" stroke-width="1.4" marker-end="url(#mla-ah-ink)"/>
  <path d="M440 340 L440 390" fill="none" stroke="var(--color-ink, #17211f)" stroke-width="1.4" marker-end="url(#mla-ah-ink)"/>
  <path d="M710 340 L710 390" fill="none" stroke="var(--color-ink, #17211f)" stroke-width="1.4" marker-end="url(#mla-ah-ink)"/>
  <path d="M440 450 L440 490" fill="none" stroke="var(--color-ink, #17211f)" stroke-width="1.4" marker-end="url(#mla-ah-ink)"/>
  <path d="M440 550 L440 590" fill="none" stroke="var(--color-ink, #17211f)" stroke-width="1.4" marker-end="url(#mla-ah-ink)"/>
  <rect x="160" y="70" width="560" height="60" rx="8" fill="var(--color-weight, #c78300)" stroke="var(--color-ink, #17211f)" stroke-width="1.5"/>
  <text x="440" y="96" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="14" font-weight="700" fill="var(--color-ink-inverse, #ffffff)" text-anchor="middle">合并压缩投影：隐藏 4096 → Q 中间 1536 + KV 潜向量 512</text>
  <text x="440" y="115" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="13" font-weight="400" fill="var(--color-ink-inverse, #ffffff)" text-anchor="middle">Q 做低秩压缩时才建这一个投影；每卡一整份，不按 TP 切</text>
  <rect x="726" y="66" width="128" height="68" rx="8" fill="var(--color-surface-sunken, #ece9df)" stroke="var(--color-ink, #17211f)" stroke-opacity="0.4" stroke-width="1.5" stroke-dasharray="5 4"/>
  <text x="790" y="96" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="13" font-weight="400" fill="var(--color-ink, #17211f)" text-anchor="middle">Q 不压缩</text>
  <text x="790" y="115" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="13" font-weight="400" fill="var(--color-ink, #17211f)" text-anchor="middle">改建两个投影</text>
  <rect x="40" y="180" width="260" height="60" rx="8" fill="var(--color-kv, #4c65b6)" stroke="var(--color-ink, #17211f)" stroke-width="1.5"/>
  <text x="170" y="206" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="14" font-weight="700" fill="var(--color-ink-inverse, #ffffff)" text-anchor="middle">KV 潜向量 512 维</text>
  <text x="170" y="225" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="13" font-weight="400" fill="var(--color-ink-inverse, #ffffff)" text-anchor="middle">RMSNorm 后写入本层主缓存</text>
  <rect x="310" y="180" width="260" height="60" rx="8" fill="var(--color-token, #087f73)" stroke="var(--color-ink, #17211f)" stroke-width="1.5"/>
  <text x="440" y="206" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="14" font-weight="700" fill="var(--color-ink-inverse, #ffffff)" text-anchor="middle">Q 中间表示 1536 维</text>
  <text x="440" y="225" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="13" font-weight="400" fill="var(--color-ink-inverse, #ffffff)" text-anchor="middle">RMSNorm</text>
  <rect x="580" y="180" width="260" height="60" rx="8" fill="var(--color-control, #66716d)" stroke="var(--color-ink, #17211f)" stroke-width="1.5"/>
  <text x="710" y="206" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="14" font-weight="700" fill="var(--color-ink-inverse, #ffffff)" text-anchor="middle">indexer 选位置</text>
  <text x="710" y="225" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="13" font-weight="400" fill="var(--color-ink-inverse, #ffffff)" text-anchor="middle">也读这份 Q 中间表示</text>
  <rect x="40" y="280" width="260" height="60" rx="8" fill="var(--color-surface-sunken, #ece9df)" stroke="var(--color-ink, #17211f)" stroke-width="1.5"/>
  <text x="170" y="306" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="14" font-weight="700" fill="var(--color-ink, #17211f)" text-anchor="middle">RoPE 维数 = 0：跳过</text>
  <text x="170" y="325" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="13" font-weight="400" fill="var(--color-ink, #17211f)" text-anchor="middle">大于 0 的模型在此旋转并另存一段</text>
  <rect x="310" y="280" width="260" height="60" rx="8" fill="var(--color-weight, #c78300)" stroke="var(--color-ink, #17211f)" stroke-width="1.5"/>
  <text x="440" y="306" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="14" font-weight="700" fill="var(--color-ink-inverse, #ffffff)" text-anchor="middle">Q 展开，再吸收 K 的上投影</text>
  <text x="440" y="325" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="13" font-weight="400" fill="var(--color-ink-inverse, #ffffff)" text-anchor="middle">每卡 8 头：8×256 → 8×512</text>
  <rect x="580" y="280" width="260" height="60" rx="8" fill="var(--color-token, #087f73)" stroke="var(--color-ink, #17211f)" stroke-width="1.5"/>
  <text x="710" y="306" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="14" font-weight="700" fill="var(--color-ink-inverse, #ffffff)" text-anchor="middle">位置清单</text>
  <text x="710" y="325" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="13" font-weight="400" fill="var(--color-ink-inverse, #ffffff)" text-anchor="middle">每个查询一行，宽 2051</text>
  <rect x="160" y="390" width="560" height="60" rx="8" fill="var(--color-kv, #4c65b6)" stroke="var(--color-ink, #17211f)" stroke-width="1.5"/>
  <text x="440" y="416" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="14" font-weight="700" fill="var(--color-ink-inverse, #ffffff)" text-anchor="middle">稀疏 FlashAttention 内核：按清单读潜向量</text>
  <text x="440" y="435" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="13" font-weight="400" fill="var(--color-ink-inverse, #ffffff)" text-anchor="middle">同一份潜向量既当 K 也当 V；不传 RoPE</text>
  <rect x="160" y="490" width="560" height="60" rx="8" fill="var(--color-weight, #c78300)" stroke="var(--color-ink, #17211f)" stroke-width="1.5"/>
  <text x="440" y="516" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="14" font-weight="700" fill="var(--color-ink-inverse, #ffffff)" text-anchor="middle">V 的上投影：每头 512 → 256</text>
  <text x="440" y="535" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="13" font-weight="400" fill="var(--color-ink-inverse, #ffffff)" text-anchor="middle">由 KV 展开投影在加载权重后拆出，原投影随即释放</text>
  <rect x="160" y="590" width="560" height="60" rx="8" fill="var(--color-surface-sunken, #ece9df)" stroke="var(--color-ink, #17211f)" stroke-width="1.5"/>
  <text x="440" y="616" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="14" font-weight="700" fill="var(--color-ink, #17211f)" text-anchor="middle">输出投影，再做一次 TP8 All-Reduce</text>
  <text x="440" y="635" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="13" font-weight="400" fill="var(--color-ink, #17211f)" text-anchor="middle">本层唯一一次集合通信</text>
</svg>
