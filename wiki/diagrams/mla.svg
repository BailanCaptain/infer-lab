<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 472" width="900" height="472" role="img" aria-label="GLM 一个稀疏 MLA 层在单张 NPU 卡上的三路前向与 TP8 汇总图" font-family="var(--font-sans)">
  <title>GLM-5.3-Flash 一个稀疏 MLA 层在单张 NPU 卡（TP8）上的完整执行路径：压缩投影分出潜向量、查询与索引三路，汇入稀疏 FlashAttention 内核、V 上投影与输出投影 All-Reduce。</title>
  <desc>顶部展示每卡整份执行的合并压缩投影 fused_qkv_a_proj（4096 → 1536 Q 中间表示 + 512 KV 潜向量；右侧虚线标注 Q 不压缩的通用分支）；中部三条并行通道：左路 KV 潜向量经 RMSNorm 写入主缓存（RoPE=0 跳过）、中路 Q 中间表示经 q_b_proj 按头切分到本卡 8 头（8×256）再吸收 W_UK_T 成 8×512、右路 indexer 共用 1536 维 Q 中间表示产出宽 2051 的位置清单；底部三路汇入 npu_sparse_flash_attention（同一份潜向量兼作 K/V），再经 V 上投影 W_UV（8×512→8×256）、o_proj 与本层唯一的 TP8 All-Reduce。</desc>
  <defs>
    <marker id="ml-arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto">
      <path d="M 0 1.5 L 8.5 5 L 0 8.5 z" fill="#4d5652"/>
    </marker>
    <marker id="ml-arr-i" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto">
      <path d="M 0 1.5 L 8.5 5 L 0 8.5 z" fill="#4c65b6"/>
    </marker>
    <marker id="ml-arr-p" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto">
      <path d="M 0 1.5 L 8.5 5 L 0 8.5 z" fill="#9a4b86"/>
    </marker>
  </defs>

  <text x="14" y="24" font-size="16" font-weight="700" fill="#17211f">GLM 一层稀疏 MLA 前向（TP8 单卡口径 · 主干 11 层 + 第 45 层 MTP）</text>

  <!-- Step 1: Fused compression projection -->
  <rect x="14" y="40" width="676" height="62" rx="9" fill="#fff4cf" stroke="#c78300" stroke-width="1.5"/>
  <text x="28" y="64" font-size="14.5" font-weight="700" fill="#936300">1. 合并压缩投影 <tspan font-family="var(--font-mono)">fused_qkv_a_proj</tspan>（每卡一整份，不按 TP 切）</text>
  <text x="28" y="88" font-size="13.5" fill="#17211f">隐藏向量 <tspan font-family="var(--font-mono)" font-weight="700">[4096]</tspan> → <tspan font-family="var(--font-mono)" font-weight="700" fill="#3a4f93">KV 潜向量 [512]</tspan> + <tspan font-family="var(--font-mono)" font-weight="700" fill="#065f56">Q 中间表示 [1536]</tspan></text>

  <!-- Dashed alt branch -->
  <rect x="706" y="40" width="180" height="62" rx="8" fill="#ece9df" stroke="#b8bcb5" stroke-width="1.2" stroke-dasharray="4 3"/>
  <text x="796" y="66" text-anchor="middle" font-size="13.5" font-weight="700" fill="#66716d">若 Q 不做低秩压缩</text>
  <text x="796" y="88" text-anchor="middle" font-size="13" fill="#66716d">改建两个独立投影</text>

  <!-- Split arrows to 3 columns -->
  <path d="M 150 102 L 150 124" fill="none" stroke="#4c65b6" stroke-width="1.8" marker-end="url(#ml-arr-i)"/>
  <path d="M 450 102 L 450 124" fill="none" stroke="#4d5652" stroke-width="1.8" marker-end="url(#ml-arr)"/>
  <path d="M 590 102 L 590 114 L 748 114 L 748 124" fill="none" stroke="#4d5652" stroke-width="1.8" marker-end="url(#ml-arr)"/>

  <!-- 3 Parallel Columns (y=128..286) -->
  <!-- Column 1: Write KV history -->
  <rect x="14" y="128" width="276" height="156" rx="9" fill="#e8edff" stroke="#4c65b6" stroke-width="1.5"/>
  <text x="28" y="152" font-size="14.5" font-weight="700" fill="#3a4f93">2. 写历史（8 卡整份复制）</text>
  <rect x="28" y="164" width="248" height="48" rx="6" fill="#ffffff" stroke="#4c65b6" stroke-width="1.1"/>
  <text x="152" y="185" text-anchor="middle" font-size="13.5" font-weight="700" fill="#17211f">潜向量 512 维 → RMSNorm</text>
  <text x="152" y="204" text-anchor="middle" font-size="13" fill="#3a4f93">按槽位写入本层 BF16 主缓存</text>
  <rect x="28" y="220" width="248" height="50" rx="6" fill="#ece9df" stroke="#b8bcb5" stroke-width="1.1"/>
  <text x="152" y="241" text-anchor="middle" font-size="13.5" font-family="var(--font-mono)" font-weight="700" fill="#4d5652">qk_rope_head_dim = 0</text>
  <text x="152" y="261" text-anchor="middle" font-size="13" fill="#4d5652">跳过旋转，不另存 RoPE 段</text>

  <!-- Column 2: Query expand + K absorb -->
  <rect x="306" y="128" width="286" height="156" rx="9" fill="#ddf4ef" stroke="#087f73" stroke-width="1.5"/>
  <text x="320" y="152" font-size="14.5" font-weight="700" fill="#065f56">4. 准备查询（TP8 按头切）</text>
  <rect x="320" y="164" width="258" height="48" rx="6" fill="#ffffff" stroke="#087f73" stroke-width="1.1"/>
  <text x="449" y="185" text-anchor="middle" font-size="13.5" font-weight="700" fill="#17211f">Q 中间 [1536] → RMSNorm</text>
  <text x="449" y="204" text-anchor="middle" font-size="13" fill="#065f56">q_b_proj → 本卡 8 头 × 256 维</text>
  <rect x="320" y="220" width="258" height="50" rx="6" fill="#fff4cf" stroke="#c78300" stroke-width="1.2"/>
  <text x="449" y="241" text-anchor="middle" font-size="13.5" font-weight="700" fill="#936300">吸收 K 上投影（× W_UK_T）</text>
  <text x="449" y="261" text-anchor="middle" font-size="13" font-family="var(--font-mono)" fill="#17211f">8 × 256 → 8 × 512（进潜空间）</text>

  <!-- Column 3: Indexer selection -->
  <rect x="608" y="128" width="278" height="156" rx="9" fill="#f7e7f2" stroke="#9a4b86" stroke-width="1.5"/>
  <text x="622" y="152" font-size="14.5" font-weight="700" fill="#7a3a6a">3. Indexer 选位置（卡内无通信）</text>
  <rect x="622" y="164" width="250" height="48" rx="6" fill="#ffffff" stroke="#9a4b86" stroke-width="1.1"/>
  <text x="747" y="185" text-anchor="middle" font-size="13.5" fill="#17211f">共用 Q 中间 [1536] + h</text>
  <text x="747" y="204" text-anchor="middle" font-size="13" fill="#7a3a6a">32 头 × 128 维对完整池粗打分</text>
  <rect x="622" y="220" width="250" height="50" rx="6" fill="#ffffff" stroke="#9a4b86" stroke-width="1.2"/>
  <text x="747" y="241" text-anchor="middle" font-size="13.5" font-weight="700" fill="#17211f">产出位置清单（宽 2051）</text>
  <text x="747" y="261" text-anchor="middle" font-size="13" fill="#4d5652">Top-512 池 × 4 + 0–3 尾（空填 −1）</text>

  <!-- Merge arrows into SFA kernel -->
  <path d="M 152 284 L 152 308" fill="none" stroke="#4c65b6" stroke-width="1.8" marker-end="url(#ml-arr-i)"/>
  <path d="M 449 284 L 449 308" fill="none" stroke="#4d5652" stroke-width="1.8" marker-end="url(#ml-arr)"/>
  <path d="M 747 284 L 747 308" fill="none" stroke="#9a4b86" stroke-width="1.8" marker-end="url(#ml-arr-p)"/>

  <!-- Step 5: SFA Kernel -->
  <rect x="14" y="312" width="872" height="62" rx="9" fill="#e8edff" stroke="#4c65b6" stroke-width="1.6"/>
  <text x="450" y="336" text-anchor="middle" font-size="14.5" font-weight="700" fill="#3a4f93">5. 稀疏 FlashAttention 内核 <tspan font-family="var(--font-mono)">npu_sparse_flash_attention</tspan>（按清单经 block_table 直读）</text>
  <text x="450" y="360" text-anchor="middle" font-size="13.5" fill="#17211f">同一份 512 维潜缓存兼作 K 和 V · 本卡 8 头在 512 维内完成打分/softmax/汇合（缩放 ÷√256 = 16）</text>

  <line x1="450" y1="374" x2="450" y2="394" stroke="#4d5652" stroke-width="1.8" marker-end="url(#ml-arr)"/>

  <!-- Step 6: V up-proj + o_proj + All-Reduce -->
  <rect x="14" y="398" width="444" height="62" rx="9" fill="#fff4cf" stroke="#c78300" stroke-width="1.5"/>
  <text x="28" y="422" font-size="14.5" font-weight="700" fill="#936300">6A. V 上投影 × W_UV + 输出投影 o_proj</text>
  <text x="28" y="446" font-size="13.5" fill="#17211f">8×512 → 8×256（拼 2048）→ 按行切 <tspan font-family="var(--font-mono)">o_proj</tspan> 得 4096 部分和</text>

  <line x1="458" y1="429" x2="484" y2="429" stroke="#9a4b86" stroke-width="2" marker-end="url(#ml-arr-p)"/>

  <rect x="490" y="398" width="396" height="62" rx="9" fill="#f7e7f2" stroke="#9a4b86" stroke-width="1.6"/>
  <text x="688" y="422" text-anchor="middle" font-size="14.5" font-weight="700" fill="#7a3a6a">6B. TP8 All-Reduce（本层唯一一次集合通信）</text>
  <text x="688" y="446" text-anchor="middle" font-size="13.5" fill="#17211f">8 张卡部分和相加，还原完整 4096 维输出送入残差</text>
</svg>
