    via: [[870, 146], [870, 462], [560, 462]]
    to: [560, 470]
    label: decode 直接拿整块缓存
    style: dashed
    tone: accent

notes:
  - at: [20, 600]
    text: "一层一个 token 只占 (512 + 64) × 2 = 1152 字节：prefill 每次重新展开，decode 一次都不展开。"
