layout: figure
id: mla
caption: GLM 一个稀疏 MLA 层在每张卡上的执行顺序（专用镜像 db701c1f）。左列写历史，中列准备查询，右列选位置，三路在稀疏 FlashAttention 内核汇合；虚线框是 Q 不做低秩压缩时的另一分支，GLM 不走。
size: [880, 700]
frames:
  - { at: [20, 44], size: [840, 630], label: 一个稀疏 MLA 层的前向（每卡）· 主线第 4 站，主干 11 层与 MTP 层各跑一次 }
items:
  - { at: [160, 70], size: [560, 60], text: 合并压缩投影：隐藏 4096 → Q 中间 1536 + KV 潜向量 512, sub: Q 做低秩压缩时才建这一个投影；每卡一整份，不按 TP 切, tone: weight }
  - { at: [726, 66], size: [128, 68], text: Q 不压缩, sub: 改建两个投影, style: faded }
  - { at: [40, 180], size: [260, 60], text: KV 潜向量 512 维, sub: RMSNorm 后写入本层主缓存, tone: kv }
  - { at: [310, 180], size: [260, 60], text: Q 中间表示 1536 维, sub: RMSNorm, tone: token }
  - { at: [580, 180], size: [260, 60], text: indexer 选位置, sub: 也读这份 Q 中间表示, tone: control }
  - { at: [40, 280], size: [260, 60], text: RoPE 维数 = 0：跳过, sub: 大于 0 的模型在此旋转并另存一段, style: plain }
  - { at: [310, 280], size: [260, 60], text: Q 展开，再吸收 K 的上投影, sub: 每卡 8 头：8×256 → 8×512, tone: weight }
  - { at: [580, 280], size: [260, 60], text: 位置清单, sub: 每个查询一行，宽 2051, tone: token }
  - { at: [160, 390], size: [560, 60], text: 稀疏 FlashAttention 内核：按清单读潜向量, sub: 同一份潜向量既当 K 也当 V；不传 RoPE, tone: kv }
  - { at: [160, 490], size: [560, 60], text: V 的上投影：每头 512 → 256, sub: 由 KV 展开投影在加载权重后拆出，原投影随即释放, tone: weight }
  - { at: [160, 590], size: [560, 60], text: 输出投影，再做一次 TP8 All-Reduce, sub: 本层唯一一次集合通信, style: plain }
