<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 380" width="880" height="380" role="img" aria-label="通用单路 pre-norm 子层（以 MLP 为例）。hidden x 分两路：上方 residual 旁路原样保留 x；下方支路先做 RMSNorm，再经 gate、up 两个投影升宽，SiLU 门控后逐元素相乘，down 投影降回原宽，得到改变量 Δ；最后 y = x + Δ。H 为 hidden 宽度，F 为中间宽度。注意力子层套在同一结构里，只是把支路里的 MLP 换成注意力。">
  <title>通用单路 pre-norm 子层（以 MLP 为例）。hidden x 分两路：上方 residual 旁路原样保留 x；下方支路先做 RMSNorm，再经 gate、up 两个投影升宽，SiLU 门控后逐元素相乘，down 投影降回原宽，得到改变量 Δ；最后 y = x + Δ。H 为 hidden 宽度，F 为中间宽度。注意力子层套在同一结构里，只是把支路里的 MLP 换成注意力。</title>
  <defs><marker id="mlp-residual-layer-ah-token" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="var(--color-token, #087f73)"/></marker><marker id="mlp-residual-layer-ah-ink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="var(--color-ink, #17211f)"/></marker></defs>
  <rect x="290" y="108" width="392" height="196" rx="16" fill="none" stroke="var(--color-line-strong, #b8bcb5)" stroke-width="1.5"/>
  <text x="306" y="96" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="15" font-weight="700" fill="var(--color-ink, #17211f)">MLP（前馈网络）：升宽 → 门控 → 降回</text>
  <path d="M110 210 L138 210" fill="none" stroke="var(--color-token, #087f73)" stroke-width="1.4" marker-end="url(#mlp-residual-layer-ah-token)"/>
  <path d="M262 210 L282 210 L282 160 L304 160" fill="none" stroke="var(--color-ink, #17211f)" stroke-width="1.4" marker-end="url(#mlp-residual-layer-ah-ink)"/>
  <path d="M262 210 L282 210 L282 262 L304 262" fill="none" stroke="var(--color-ink, #17211f)" stroke-width="1.4" marker-end="url(#mlp-residual-layer-ah-ink)"/>
  <path d="M416 160 L436 160" fill="none" stroke="var(--color-ink, #17211f)" stroke-width="1.4" marker-end="url(#mlp-residual-layer-ah-ink)"/>
  <path d="M516 160 L548 160 L548 192" fill="none" stroke="var(--color-ink, #17211f)" stroke-width="1.4" marker-end="url(#mlp-residual-layer-ah-ink)"/>
  <path d="M416 262 L548 262 L548 228" fill="none" stroke="var(--color-ink, #17211f)" stroke-width="1.4" marker-end="url(#mlp-residual-layer-ah-ink)"/>
  <path d="M566 210 L582 210" fill="none" stroke="var(--color-ink, #17211f)" stroke-width="1.4" marker-end="url(#mlp-residual-layer-ah-ink)"/>
  <path d="M674 210 L720 210" fill="none" stroke="var(--color-token, #087f73)" stroke-width="1.4" marker-end="url(#mlp-residual-layer-ah-token)"/>
  <path d="M760 210 L784 210" fill="none" stroke="var(--color-token, #087f73)" stroke-width="1.4" marker-end="url(#mlp-residual-layer-ah-token)"/>
  <path d="M65 196 L65 62 L740 62 L740 190" fill="none" stroke="var(--color-token, #087f73)" stroke-width="1.4" marker-end="url(#mlp-residual-layer-ah-token)"/>
  <rect x="20" y="196" width="90" height="28" fill="var(--color-token, #087f73)" stroke="var(--color-ink, #17211f)" stroke-width="1.3"/>
  <path d="M35 196v28M50 196v28M65 196v28M80 196v28M95 196v28" stroke="var(--color-ink, #17211f)" stroke-opacity="0.35" stroke-width="1" fill="none"/>
  <text x="65" y="244" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="13" font-weight="400" fill="#065f56" text-anchor="middle">输入 x</text>
  <text x="65" y="264" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="13" font-weight="400" fill="var(--color-ink-muted, #66716d)" text-anchor="middle" font-style="italic">[H]</text>
  <rect x="784" y="196" width="80" height="28" fill="var(--color-token, #087f73)" stroke="var(--color-ink, #17211f)" stroke-width="1.3"/>
  <path d="M800 196v28M816 196v28M832 196v28M848 196v28" stroke="var(--color-ink, #17211f)" stroke-opacity="0.35" stroke-width="1" fill="none"/>
  <text x="824" y="244" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="13" font-weight="400" fill="#065f56" text-anchor="middle">输出 y</text>
  <text x="824" y="264" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="13" font-weight="400" fill="var(--color-ink-muted, #66716d)" text-anchor="middle" font-style="italic">[H]</text>
  <rect x="138" y="180" width="124" height="60" rx="8" fill="var(--color-surface-sunken, #ece9df)" stroke="var(--color-ink, #17211f)" stroke-width="1.5"/>
  <text x="200" y="206" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="14" font-weight="700" fill="var(--color-ink, #17211f)" text-anchor="middle">RMSNorm</text>
  <text x="200" y="225" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="13" font-weight="400" fill="var(--color-ink, #17211f)" text-anchor="middle">÷ 均方根，× γ</text>
  <rect x="304" y="138" width="112" height="44" rx="8" fill="var(--color-weight, #c78300)" stroke="var(--color-ink, #17211f)" stroke-width="1.5"/>
  <text x="360" y="156" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="14" font-weight="700" fill="var(--color-ink-inverse, #ffffff)" text-anchor="middle">gate 投影</text>
  <text x="360" y="175" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="13" font-weight="400" fill="var(--color-ink-inverse, #ffffff)" text-anchor="middle">H → F</text>
  <rect x="304" y="240" width="112" height="44" rx="8" fill="var(--color-weight, #c78300)" stroke="var(--color-ink, #17211f)" stroke-width="1.5"/>
  <text x="360" y="258" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="14" font-weight="700" fill="var(--color-ink-inverse, #ffffff)" text-anchor="middle">up 投影</text>
  <text x="360" y="277" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="13" font-weight="400" fill="var(--color-ink-inverse, #ffffff)" text-anchor="middle">H → F</text>
  <rect x="436" y="138" width="80" height="44" rx="8" fill="var(--color-surface-sunken, #ece9df)" stroke="var(--color-ink, #17211f)" stroke-width="1.5"/>
  <text x="476" y="165" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="14" font-weight="700" fill="var(--color-ink, #17211f)" text-anchor="middle">SiLU</text>
  <rect x="582" y="188" width="92" height="44" rx="8" fill="var(--color-weight, #c78300)" stroke="var(--color-ink, #17211f)" stroke-width="1.5"/>
  <text x="628" y="206" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="14" font-weight="700" fill="var(--color-ink-inverse, #ffffff)" text-anchor="middle">down 投影</text>
  <text x="628" y="225" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="13" font-weight="400" fill="var(--color-ink-inverse, #ffffff)" text-anchor="middle">F → H</text>
  <circle cx="548" cy="210" r="18" fill="var(--color-surface, #fbfaf6)" stroke="var(--color-ink, #17211f)" stroke-width="1.5"/>
  <text x="548" y="216" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="20" font-weight="700" fill="var(--color-ink, #17211f)" text-anchor="middle">⊙</text>
  <circle cx="740" cy="210" r="20" fill="var(--color-surface, #fbfaf6)" stroke="var(--color-ink, #17211f)" stroke-width="1.5"/>
  <text x="740" y="216" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="20" font-weight="700" fill="var(--color-ink, #17211f)" text-anchor="middle">+</text>
  <text x="400" y="48" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="13.5" font-weight="700" fill="var(--color-ink, #17211f)" text-anchor="middle">residual 旁路：x 不做任何变换，直接送到出口</text>
  <text x="697" y="200" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="13.5" font-weight="700" fill="var(--color-ink, #17211f)" text-anchor="middle">Δ</text>
  <text x="740" y="262" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="13.5" font-weight="700" fill="var(--color-ink, #17211f)" text-anchor="middle">y = x + Δ</text>
  <text x="200" y="338" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="13" font-weight="400" fill="var(--color-ink, #17211f)" text-anchor="middle">① 只在支路入口做 RMSNorm（pre-norm）</text>
  <text x="486" y="338" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="13" font-weight="400" fill="var(--color-ink, #17211f)" text-anchor="middle">② 支路算出改变量 Δ，形状与 x 相同</text>
  <text x="760" y="338" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="13" font-weight="400" fill="var(--color-ink, #17211f)" text-anchor="middle">③ 两路逐元素相加</text>
</svg>
