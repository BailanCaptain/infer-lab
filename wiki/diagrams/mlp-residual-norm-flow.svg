<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 1040" width="880" height="1040" role="img" aria-label="第 4 站逐层前向里，一层怎样安排 RMSNorm、子层与 residual。主干 45 层走左栏：每个子层前后各一次 mHC 混合，四条流代替单条旁路；MTP 层走右栏的单条 pre-norm 写法。MTP 块外的输入先按位置清零和配方 rot 条件处理，再分别 RMSNorm、拼接投影；出块后先 TP All-Reduce，再 RMSNorm 和词表投影。图中重点画块内的旁路与子层顺序。底部采用本页普通 TP8 教学基线，未走序列并行的 Reduce-Scatter 路径。">
