layout: figure
id: mlp-residual-norm-flow
caption: 第 4 站逐层前向里，一层怎样安排 RMSNorm、子层与 residual。主干 45 层走左栏：每个子层前后各一次 mHC 混合，四条流代替单条旁路；MTP 层走右栏：正是本页首图的单条 pre-norm 写法，旁路暂存输入、子层后直接相加；块外进块前、出块后另有 RMSNorm。底部展开前 3 层的稠密 MLP 在 TP8 下每卡的走法。
