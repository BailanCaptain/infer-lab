  <text x="437.5" y="225" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="13" font-weight="700" fill="var(--color-ink, #17211f)" text-anchor="middle">各层历史状态</text>
  </g>
  <path d="M215 115 L315 115" fill="none" stroke="var(--color-token, #087f73)" stroke-width="1.4" marker-end="url(#model-runner-layout-ah-token)"/>
  <path d="M555 115 L670 115" fill="none" stroke="var(--color-token, #087f73)" stroke-width="1.4" marker-end="url(#model-runner-layout-ah-token)"/>
  <path d="M767 145 L767 305" fill="none" stroke="var(--color-weight, #c78300)" stroke-width="1.4" marker-end="url(#model-runner-layout-ah-weight)"/>
  <path d="M670 338 L550 338" fill="none" stroke="var(--color-token, #087f73)" stroke-width="1.4" marker-end="url(#model-runner-layout-ah-token)"/>
