  <circle cx="448" cy="442" r="11" fill="var(--color-ink, #17211f)"/><text x="448" y="447" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="13" font-weight="700" fill="var(--color-ink-inverse, #ffffff)" text-anchor="middle">6</text>
  <circle cx="668" cy="442" r="11" fill="var(--color-ink, #17211f)"/><text x="668" y="447" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="13" font-weight="700" fill="var(--color-ink-inverse, #ffffff)" text-anchor="middle">7</text>
