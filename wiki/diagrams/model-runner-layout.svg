<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 540" width="900" height="540" role="img" aria-label="示意例子：A 本步算 1 个 token，C 是新请求、本步算 3 个。引擎对 model runner 发两次调用。第一次调用里，runner 先按计划改好自己跨步保留的请求记录（①），拼出 4 行输入（②），跑一遍模型（③），只把每条请求最后一行（第 0、3 行）变成词表分数（④），连同计划和隐藏向量一起放进执行状态，这次调用返回空。第二次调用取出并清空执行状态（⑤），采样出 token（⑥），有「允许哪些词」时先按它压掉不许出现的词，按请求交回（⑦）。上方三样东西跨步保留，执行状态只活在两次调用之间。">
  <title>示意例子：A 本步算 1 个 token，C 是新请求、本步算 3 个。引擎对 model runner 发两次调用。第一次调用里，runner 先按计划改好自己跨步保留的请求记录（①），拼出 4 行输入（②），跑一遍模型（③），只把每条请求最后一行（第 0、3 行）变成词表分数（④），连同计划和隐藏向量一起放进执行状态，这次调用返回空。第二次调用取出并清空执行状态（⑤），采样出 token（⑥），有「允许哪些词」时先按它压掉不许出现的词，按请求交回（⑦）。上方三样东西跨步保留，执行状态只活在两次调用之间。</title>
  <defs><marker id="model-runner-layout-ah-ink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="var(--color-ink, #17211f)"/></marker><marker id="model-runner-layout-ah-control" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="var(--color-control, #66716d)"/></marker><marker id="model-runner-layout-ah-kv" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="var(--color-kv, #4c65b6)"/></marker><marker id="model-runner-layout-ah-weight" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="var(--color-weight, #c78300)"/></marker></defs>
  <rect x="16" y="36" width="868" height="88" rx="16" fill="none" stroke="var(--color-line-strong, #b8bcb5)" stroke-width="1.5"/>
  <text x="32" y="24" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="15" font-weight="700" fill="var(--color-ink, #17211f)">跨步保留：不随哪一次调用清空</text>
  <rect x="16" y="172" width="868" height="100" rx="16" fill="none" stroke="var(--color-line-strong, #b8bcb5)" stroke-width="1.5"/>
  <text x="32" y="160" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="15" font-weight="700" fill="var(--color-ink, #17211f)">第一次调用：准备并前向，这次返回空</text>
  <rect x="16" y="408" width="868" height="100" rx="16" fill="none" stroke="var(--color-line-strong, #b8bcb5)" stroke-width="1.5"/>
  <text x="32" y="396" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="15" font-weight="700" fill="var(--color-ink, #17211f)">第二次调用：采样，返回每条请求的新 token</text>
