  <path d="M465 378 L465 400 L323 400 L323 426" fill="none" stroke="var(--color-control, #66716d)" stroke-width="1.4" marker-end="url(#model-runner-layout-ah-control)"/>
  <path d="M113 490 L113 500 L543 500 L543 490" fill="none" stroke="var(--color-control, #66716d)" stroke-width="1.4" stroke-dasharray="7 5" marker-end="url(#model-runner-layout-ah-control)"/>
  <path d="M418 458 L448 458" fill="none" stroke="var(--color-ink, #17211f)" stroke-width="1.4" marker-end="url(#model-runner-layout-ah-ink)"/>
