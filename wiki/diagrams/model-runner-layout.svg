  <path d="M348 228 L368 228" fill="none" stroke="var(--color-ink, #17211f)" stroke-width="1.4" marker-end="url(#model-runner-layout-ah-ink)"/>
  <path d="M518 228 L538 228" fill="none" stroke="var(--color-ink, #17211f)" stroke-width="1.4" marker-end="url(#model-runner-layout-ah-ink)"/>
  <path d="M688 228 L708 228" fill="none" stroke="var(--color-ink, #17211f)" stroke-width="1.4" marker-end="url(#model-runner-layout-ah-ink)"/>
  <path d="M330 196 L330 138 L240 138 L240 108" fill="none" stroke="var(--color-control, #66716d)" stroke-width="1.4" stroke-dasharray="7 5" marker-start="url(#model-runner-layout-ah-control)" marker-end="url(#model-runner-layout-ah-control)"/>
  <path d="M560 196 L560 108" fill="none" stroke="var(--color-kv, #4c65b6)" stroke-width="1.4" stroke-dasharray="7 5" marker-start="url(#model-runner-layout-ah-kv)" marker-end="url(#model-runner-layout-ah-kv)"/>
  <path d="M650 108 L650 196" fill="none" stroke="var(--color-weight, #c78300)" stroke-width="1.4" stroke-dasharray="7 5" marker-end="url(#model-runner-layout-ah-weight)"/>
  <path d="M790 260 L790 348 L630 348" fill="none" stroke="var(--color-control, #66716d)" stroke-width="1.4" marker-end="url(#model-runner-layout-ah-control)"/>
  <path d="M465 384 L465 404 L392 404 L392 442" fill="none" stroke="var(--color-control, #66716d)" stroke-width="1.4" marker-end="url(#model-runner-layout-ah-control)"/>
  <path d="M113 506 L113 536 L543 536 L543 506" fill="none" stroke="var(--color-control, #66716d)" stroke-width="1.4" stroke-dasharray="7 5" marker-end="url(#model-runner-layout-ah-control)"/>
  <path d="M418 474 L448 474" fill="none" stroke="var(--color-ink, #17211f)" stroke-width="1.4" marker-end="url(#model-runner-layout-ah-ink)"/>
  <path d="M638 474 L668 474" fill="none" stroke="var(--color-ink, #17211f)" stroke-width="1.4" marker-end="url(#model-runner-layout-ah-ink)"/>
  <rect x="40" y="52" width="240" height="56" rx="8" fill="var(--color-control-soft, #f1efe8)" stroke="var(--color-line-strong, #b8bcb5)" stroke-width="1.4"/>
  <text x="160" y="76" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="14" font-weight="700" fill="var(--color-ink, #17211f)" text-anchor="middle">请求记录（持久批次）</text>
  <text x="160" y="95" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="13" font-weight="400" fill="var(--color-ink-muted, #66716d)" text-anchor="middle">谁坐第几行、已算到第几、块表</text>
  <rect x="330" y="52" width="240" height="56" rx="8" fill="var(--color-control-soft, #f1efe8)" stroke="var(--color-line-strong, #b8bcb5)" stroke-width="1.4"/>
  <text x="450" y="76" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="14" font-weight="700" fill="var(--color-ink, #17211f)" text-anchor="middle">KV cache</text>
  <text x="450" y="95" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="13" font-weight="400" fill="#3a4f93" text-anchor="middle">各层为算过的位置留下的历史</text>
  <rect x="620" y="52" width="240" height="56" rx="8" fill="var(--color-control-soft, #f1efe8)" stroke="var(--color-line-strong, #b8bcb5)" stroke-width="1.4"/>
  <text x="740" y="76" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="14" font-weight="700" fill="var(--color-ink, #17211f)" text-anchor="middle">权重</text>
  <text x="740" y="95" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="13" font-weight="400" fill="#936300" text-anchor="middle">普通推理跨步复用</text>
  <rect x="28" y="196" width="150" height="64" rx="8" fill="var(--color-surface, #fbfaf6)" stroke="var(--color-control, #66716d)" stroke-opacity="0.45" stroke-width="1.3" stroke-dasharray="5 4"/>
  <text x="103" y="224" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="13" font-weight="400" fill="#4d5652" text-anchor="middle">调度计划</text>
  <text x="103" y="243" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="13" font-weight="400" fill="#4d5652" text-anchor="middle">A 算 1 个 · C 算 3 个</text>
  <rect x="198" y="196" width="150" height="64" rx="8" fill="var(--color-control-soft, #f1efe8)" stroke="var(--color-control, #66716d)" stroke-width="1.4"/>
  <text x="273" y="224" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="14" font-weight="700" fill="var(--color-ink, #17211f)" text-anchor="middle">对账</text>
  <text x="273" y="243" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="13" font-weight="400" fill="var(--color-ink-muted, #66716d)" text-anchor="middle">A 已算 5 · C 新来</text>
  <rect x="368" y="196" width="150" height="64" rx="8" fill="var(--color-token-soft, #ddf4ef)" stroke="var(--color-token, #087f73)" stroke-width="1.4"/>
  <text x="443" y="224" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="14" font-weight="700" fill="var(--color-ink, #17211f)" text-anchor="middle">拼输入</text>
  <text x="443" y="243" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="13" font-weight="400" fill="#065f56" text-anchor="middle">4 行：a₅ c₀ c₁ c₂</text>
  <rect x="538" y="196" width="150" height="64" rx="8" fill="var(--color-weight-soft, #fff4cf)" stroke="var(--color-weight, #c78300)" stroke-width="1.4"/>
  <text x="613" y="224" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="14" font-weight="700" fill="var(--color-ink, #17211f)" text-anchor="middle">跑模型</text>
  <text x="613" y="243" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="13" font-weight="400" fill="#936300" text-anchor="middle">4 行进，4 行出</text>
  <rect x="708" y="196" width="164" height="64" rx="8" fill="var(--color-token-soft, #ddf4ef)" stroke="var(--color-token, #087f73)" stroke-width="1.4"/>
  <text x="790" y="224" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="14" font-weight="700" fill="var(--color-ink, #17211f)" text-anchor="middle">选第 0、3 行</text>
  <text x="790" y="243" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="13" font-weight="400" fill="#065f56" text-anchor="middle">只这 2 行算词表分数</text>
  <rect x="300" y="312" width="330" height="72" rx="8" fill="var(--color-control-soft, #f1efe8)" stroke="var(--color-control, #66716d)" stroke-width="1.4"/>
  <text x="465" y="344" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="14" font-weight="700" fill="var(--color-ink, #17211f)" text-anchor="middle">执行状态（暂存）</text>
  <text x="465" y="363" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="13" font-weight="400" fill="var(--color-ink-muted, #66716d)" text-anchor="middle">计划 · 2 行词表分数 · 隐藏向量 · 元数据</text>
  <rect x="28" y="442" width="170" height="64" rx="8" fill="var(--color-surface, #fbfaf6)" stroke="var(--color-control, #66716d)" stroke-opacity="0.45" stroke-width="1.3" stroke-dasharray="5 4"/>
  <text x="113" y="470" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="13" font-weight="400" fill="#4d5652" text-anchor="middle">允许哪些词</text>
  <text x="113" y="489" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="13" font-weight="400" fill="#4d5652" text-anchor="middle">可选，引擎趁前向时算</text>
  <rect x="228" y="442" width="190" height="64" rx="8" fill="var(--color-control-soft, #f1efe8)" stroke="var(--color-control, #66716d)" stroke-width="1.4"/>
  <text x="323" y="470" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="14" font-weight="700" fill="var(--color-ink, #17211f)" text-anchor="middle">取出并清空</text>
  <text x="323" y="489" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="13" font-weight="400" fill="var(--color-ink-muted, #66716d)" text-anchor="middle">下次前向前必须取走</text>
  <rect x="448" y="442" width="190" height="64" rx="8" fill="var(--color-token-soft, #ddf4ef)" stroke="var(--color-token, #087f73)" stroke-width="1.4"/>
  <text x="543" y="470" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="14" font-weight="700" fill="var(--color-ink, #17211f)" text-anchor="middle">采样</text>
  <text x="543" y="489" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="13" font-weight="400" fill="#065f56" text-anchor="middle">每行分数挑 1 个 token</text>
  <rect x="668" y="442" width="204" height="64" rx="8" fill="var(--color-token-soft, #ddf4ef)" stroke="var(--color-token, #087f73)" stroke-width="1.4"/>
  <text x="770" y="470" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="14" font-weight="700" fill="var(--color-ink, #17211f)" text-anchor="middle">按请求交回</text>
  <text x="770" y="489" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="13" font-weight="400" fill="#065f56" text-anchor="middle">A → a₆ · C → c₃</text>
  <text x="645" y="378" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="13.5" font-weight="400" fill="var(--color-ink-muted, #66716d)" font-style="italic">这次调用返回空，结果先留在这里</text>
