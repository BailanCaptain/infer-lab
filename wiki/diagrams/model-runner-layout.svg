  <circle cx="708" cy="196" r="11" fill="var(--color-ink, #17211f)"/><text x="708" y="201" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="13" font-weight="700" fill="var(--color-ink-inverse, #ffffff)" text-anchor="middle">4</text>
