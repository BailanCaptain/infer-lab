  <defs><marker id="model-runner-layout-ah-ink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="var(--color-ink, #17211f)"/></marker></defs>
  <path d="M170 90 L197 90" fill="none" stroke="var(--color-ink, #17211f)" stroke-width="1.4" marker-end="url(#model-runner-layout-ah-ink)"/>
