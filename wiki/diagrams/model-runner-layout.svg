<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 465" width="900" height="465" role="img" aria-label="A/C 第三轮的逻辑形状：四个输入位置完成模型计算，选出两行形成生成 logits；未画填充、TP 分片或投机分支">
  <title>A/C 第三轮的逻辑形状：四个输入位置完成模型计算，选出两行形成生成 logits；未画填充、TP 分片或投机分支</title>
  <defs><marker id="model-runner-layout-ah-token" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="var(--color-token, #087f73)"/></marker><marker id="model-runner-layout-ah-weight" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="var(--color-weight, #c78300)"/></marker><marker id="model-runner-layout-ah-kv" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="var(--color-kv, #4c65b6)"/></marker></defs>
  <g data-hardware="memory">
