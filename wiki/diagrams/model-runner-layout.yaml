layout: figure
id: model-runner-layout
caption: 示意例子：A 本步算 1 个 token，C 是新请求、本步算 3 个。引擎对 model runner 发两次调用。第一次调用里，runner 先按计划改好自己跨步保留的请求记录（①），拼出 4 行输入（②），跑一遍模型（③），只把每条请求最后一行（第 0、3 行）变成词表分数（④），连同计划和隐藏向量一起放进执行状态，这次调用返回空。第二次调用取出并清空执行状态（⑤），采样出 token（⑥），有「允许哪些词」时先按它压掉不许出现的词，按请求交回（⑦）。上方三样东西跨步保留，执行状态只活在两次调用之间。
size: [900, 540]
frames:
  - { at: [16, 36], size: [868, 88], label: 跨步保留：不随哪一次调用清空 }
  - { at: [16, 172], size: [868, 100], label: 第一次调用：准备并前向，这次返回空 }
  - { at: [16, 408], size: [868, 100], label: 第二次调用：采样，返回每条请求的新 token }
items:
  - { at: [40, 52], size: [240, 56], text: 请求记录（持久批次）, sub: 谁坐第几行、已算到第几、块表, tone: control, style: plain }
  - { at: [330, 52], size: [240, 56], text: KV cache, sub: 各层为算过的位置留下的历史, tone: kv, style: plain }
  - { at: [620, 52], size: [240, 56], text: 权重, sub: 普通推理跨步复用, tone: weight, style: plain }
  - { at: [28, 190], size: [150, 64], text: 调度计划, sub: A 算 1 个 · C 算 3 个, tone: control, style: faded }
  - { at: [198, 190], size: [150, 64], text: 对账, sub: A 已算 5 · C 新来, tone: control }
  - { at: [368, 190], size: [150, 64], text: 拼输入, sub: 4 行：a₅ c₀ c₁ c₂, tone: token }
  - { at: [538, 190], size: [150, 64], text: 跑模型, sub: 4 行进，4 行出, tone: weight }
  - { at: [708, 190], size: [164, 64], text: 选第 0、3 行, sub: 只这 2 行算词表分数, tone: token }
  - { at: [300, 306], size: [330, 72], text: 执行状态（暂存）, sub: 计划 · 2 行词表分数 · 隐藏向量 · 元数据, tone: control }
  - { at: [28, 426], size: [170, 64], text: 允许哪些词, sub: 可选，引擎趁前向时算, tone: control, style: faded }
  - { at: [228, 426], size: [190, 64], text: 取出并清空, sub: 下次前向前必须取走, tone: control }
  - { at: [448, 426], size: [190, 64], text: 采样, sub: 每行分数挑 1 个 token, tone: token }
  - { at: [668, 426], size: [204, 64], text: 按请求交回, sub: A → a₆ · C → c₃, tone: token }
