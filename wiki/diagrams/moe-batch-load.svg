<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 470" width="900" height="470" role="img" aria-label="稀疏 MoE 批内专家归拢与跨卡负载不均木桶等待" font-family="var(--font-sans)">
<title>MoE 批内专家归拢与跨卡负载不均：4 个 token 选 top-2 覆盖 5 个专家</title>
<desc>4 个 token 各选 2 个专家共 8 次配对：卡 A 的专家 1-3 共收到 6 行（其中专家 2 聚集 4 行），卡 B 的专家 4-6 仅收到 2 行，底部时间条展示同步等待。</desc>
<defs>
  <marker id="mb-teal" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
    <path d="M1 1.5L8.5 5L1 8.5Z" fill="#087f73"/>
  </marker>
</defs>

<text x="18" y="32" font-size="16" font-weight="700" fill="#17211f">稀疏 MoE 批内按专家归拢：4 个 token 各选 top-2 = 8 次配对（覆盖 5 个专家，冷热倾斜）</text>

<!-- Left: Batch of 4 Tokens -->
<rect x="14" y="48" width="182" height="252" rx="10" fill="#fbfaf6" stroke="#087f73" stroke-width="1.3"/>
<text x="105" y="72" text-anchor="middle" font-size="14" font-weight="700" fill="#065f56">本批输入 · 4 行</text>
<g fill="#ddf4ef" stroke="#087f73" stroke-width="1.2">
  <rect x="26" y="86" width="158" height="36" rx="5"/>
  <rect x="26" y="130" width="158" height="36" rx="5"/>
  <rect x="26" y="174" width="158" height="36" rx="5"/>
  <rect x="26" y="218" width="158" height="36" rx="5"/>
</g>
<g font-size="12.5" font-weight="700" text-anchor="middle" fill="#065f56">
  <text x="105" y="108.5">「我」 → E1, E2</text>
  <text x="105" y="152.5">「吃」 → E2, E5</text>
  <text x="105" y="196.5">「了」 → E2, E3</text>
  <text x="105" y="240.5">「苹果」→ E2, E4</text>
</g>
<text x="105" y="282" text-anchor="middle" font-size="12" font-weight="700" fill="#065f56">单词选 2 ≠ 整批只用 2</text>

<line x1="196" y1="174" x2="216" y2="174" stroke="#087f73" stroke-width="1.8" marker-end="url(#mb-teal)"/>

<!-- Card A: Experts 1..3 (Total 6 Rows, Hot Expert 2) -->
<rect x="218" y="48" width="326" height="252" rx="10" fill="#fbfaf6" stroke="#c78300" stroke-width="1.3"/>
<text x="381" y="72" text-anchor="middle" font-size="14" font-weight="700" fill="#936300">卡 A · 专家 1–3（共收到 6 行）</text>

<rect x="230" y="86" width="94" height="198" rx="7" fill="#fff4cf" stroke="#c78300" stroke-width="1.2"/>
<text x="277" y="108" text-anchor="middle" font-size="12.5" font-weight="700" fill="#936300">专家 E1</text>
<text x="277" y="126" text-anchor="middle" font-size="12" fill="#4d5652">收到 1 行</text>
<rect x="242" y="138" width="70" height="28" rx="4" fill="#ffffff" stroke="#087f73" stroke-width="1.1"/>
<text x="277" y="156.5" text-anchor="middle" font-size="12" font-weight="700" fill="#065f56">我</text>

<rect x="334" y="86" width="94" height="198" rx="7" fill="#fff0e9" stroke="#b54237" stroke-width="1.4"/>
<text x="381" y="108" text-anchor="middle" font-size="12.5" font-weight="700" fill="#8f3229">E2 热点!</text>
<text x="381" y="126" text-anchor="middle" font-size="12" font-weight="700" fill="#b54237">收到 4 行</text>
<g fill="#ffffff" stroke="#b54237" stroke-width="1.1">
  <rect x="346" y="136" width="70" height="26" rx="4"/>
  <rect x="346" y="166" width="70" height="26" rx="4"/>
  <rect x="346" y="196" width="70" height="26" rx="4"/>
  <rect x="346" y="226" width="70" height="26" rx="4"/>
</g>
<g font-size="12" font-weight="700" text-anchor="middle" fill="#8f3229">
  <text x="381" y="153.5">我</text><text x="381" y="183.5">吃</text><text x="381" y="213.5">了</text><text x="381" y="243.5">苹果</text>
</g>
<text x="381" y="272" text-anchor="middle" font-size="12" fill="#8f3229">批量矩阵乘</text>

<rect x="438" y="86" width="94" height="198" rx="7" fill="#fff4cf" stroke="#c78300" stroke-width="1.2"/>
<text x="485" y="108" text-anchor="middle" font-size="12.5" font-weight="700" fill="#936300">专家 E3</text>
<text x="485" y="126" text-anchor="middle" font-size="12" fill="#4d5652">收到 1 行</text>
<rect x="450" y="138" width="70" height="28" rx="4" fill="#ffffff" stroke="#087f73" stroke-width="1.1"/>
<text x="485" y="156.5" text-anchor="middle" font-size="12" font-weight="700" fill="#065f56">了</text>
<!-- Card B: Experts 4..6 (Total 2 Rows, Expert 6 Idle) -->
<rect x="560" y="48" width="326" height="252" rx="10" fill="#fbfaf6" stroke="#4c65b6" stroke-width="1.3"/>
<text x="723" y="72" text-anchor="middle" font-size="14" font-weight="700" fill="#3a4f93">卡 B · 专家 4–6（仅收到 2 行）</text>

<rect x="572" y="86" width="94" height="198" rx="7" fill="#fff4cf" stroke="#c78300" stroke-width="1.2"/>
<text x="619" y="108" text-anchor="middle" font-size="12.5" font-weight="700" fill="#936300">专家 E4</text>
<text x="619" y="126" text-anchor="middle" font-size="12" fill="#4d5652">收到 1 行</text>
<rect x="584" y="138" width="70" height="28" rx="4" fill="#ffffff" stroke="#087f73" stroke-width="1.1"/>
<text x="619" y="156.5" text-anchor="middle" font-size="12" font-weight="700" fill="#065f56">苹果</text>

<rect x="676" y="86" width="94" height="198" rx="7" fill="#fff4cf" stroke="#c78300" stroke-width="1.2"/>
<text x="723" y="108" text-anchor="middle" font-size="12.5" font-weight="700" fill="#936300">专家 E5</text>
<text x="723" y="126" text-anchor="middle" font-size="12" fill="#4d5652">收到 1 行</text>
<rect x="688" y="138" width="70" height="28" rx="4" fill="#ffffff" stroke="#087f73" stroke-width="1.1"/>
<text x="723" y="156.5" text-anchor="middle" font-size="12" font-weight="700" fill="#065f56">吃</text>

<rect x="780" y="86" width="94" height="198" rx="7" fill="#ece9df" stroke="#b8bcb5" stroke-width="1.2" stroke-dasharray="5 3"/>
<text x="827" y="108" text-anchor="middle" font-size="12.5" font-weight="700" fill="#66716d">专家 E6</text>
<text x="827" y="126" text-anchor="middle" font-size="12" fill="#66716d">收到 0 行</text>
<text x="827" y="186" text-anchor="middle" font-size="12" fill="#66716d">本批轮空</text>

<!-- Bottom Synchronization & Straggler Timeline -->
<rect x="14" y="316" width="872" height="140" rx="10" fill="#fbfaf6" stroke="#d8d8cf" stroke-width="1.3"/>
<text x="28" y="340" font-size="13.5" font-weight="700" fill="#17211f">跨卡同步点等待示意（假设逐行线性等成本、忽略通信与固定开销）</text>

<text x="74" y="375" text-anchor="end" font-size="13" font-weight="700" fill="#936300">卡 A</text>
<rect x="86" y="356" width="420" height="28" rx="5" fill="#fff4cf" stroke="#c78300" stroke-width="1.2"/>
<text x="296" y="374.5" text-anchor="middle" font-size="12.5" font-weight="700" fill="#936300">连续计算 6 行（热点专家 E2 决定慢卡尾延迟）</text>

<text x="74" y="417" text-anchor="end" font-size="13" font-weight="700" fill="#3a4f93">卡 B</text>
<rect x="86" y="398" width="138" height="28" rx="5" fill="#ddf4ef" stroke="#087f73" stroke-width="1.2"/>
<text x="155" y="416.5" text-anchor="middle" font-size="12.5" font-weight="700" fill="#065f56">计算 2 行</text>
<rect x="228" y="398" width="278" height="28" rx="5" fill="#fff0e9" stroke="#b54237" stroke-width="1.2" stroke-dasharray="5 3"/>
<text x="367" y="416.5" text-anchor="middle" font-size="12.5" font-weight="700" fill="#b54237">✗ 空等慢卡 A 完成剩余 4 行</text>

<line x1="514" y1="350" x2="514" y2="434" stroke="#9a4b86" stroke-width="2.2" stroke-dasharray="4 3"/>
<rect x="530" y="352" width="342" height="88" rx="7" fill="#f7e7f2" stroke="#9a4b86" stroke-width="1.2"/>
<text x="544" y="375" font-size="13" font-weight="700" fill="#7a3a6a">Combine 回收同步屏障</text>
<text x="544" y="399" font-size="12" fill="#4d5652">• 训练期压平：aux loss / 路由校正偏置</text>
<text x="544" y="421" font-size="12" font-weight="700" fill="#7a3a6a">• 推理期治理：EPLB 搬动或复制热点专家</text>
</svg>
