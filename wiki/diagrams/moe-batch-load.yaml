layout: figure
id: moe-batch-load
caption: 4 个 token 各选 2 个专家，共 8 个配对、覆盖 5 个专家。各专家把收到的行批量送入自己的投影和激活。卡 A 的专家共算 6 行，卡 B 共算 2 行；下方时间条是假设逐行成本相同且线性、忽略通信和固定开销的示意。实际利用率和重叠会改变耗时，不能直接由行数推出时间比例。
