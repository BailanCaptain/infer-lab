layout: figure
id: moe-batch-load
caption: 接着「我吃了苹果」的例子（数为示意）：4 个 token 各选 2 个专家，一共 8 个配对、用到 5 个专家。每个专家把收到的 token 叠成一个矩阵，一行一个 token 的隐藏向量，做一次矩阵乘。专家 1–3 在卡 A、专家 4–6 在卡 B 时，卡 A 要算 6 行、卡 B 只算 2 行，卡 B 算完只能等着，这一层的耗时由卡 A 决定。
