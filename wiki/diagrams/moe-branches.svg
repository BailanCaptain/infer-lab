  <path d="M654 244 L654 256" fill="none" stroke="var(--color-weight, #c78300)" stroke-width="1.4" marker-end="url(#moe-branches-ah-weight)"/>
  <path d="M654 298 L654 310" fill="none" stroke="var(--color-weight, #c78300)" stroke-width="1.4" marker-end="url(#moe-branches-ah-weight)"/>
  <path d="M222 352 L222 412 L421 412" fill="none" stroke="var(--color-token, #087f73)" stroke-width="1.4" marker-end="url(#moe-branches-ah-token)"/>
  <path d="M654 352 L654 412 L459 412" fill="none" stroke="var(--color-token, #087f73)" stroke-width="1.4" marker-end="url(#moe-branches-ah-token)"/>
  <rect x="330" y="44" width="220" height="50" rx="8" fill="var(--color-token-soft, #ddf4ef)" stroke="var(--color-token, #087f73)" stroke-width="1.4"/>
