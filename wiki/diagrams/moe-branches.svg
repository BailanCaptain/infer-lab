<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 488" width="880" height="488" role="img" aria-label="GLM 双机 W8A8、共享专家 TP8、多流关闭的教学基线下，两支都使用同一 token 的隐藏向量，连线不表示同时执行。左侧先打分选 8 个，跨卡派发与回收见专家并行页；右侧所有 token 都过，调用反量化、限幅 SwiGLU、再量化的融合算子。两支输出在出口相加，宽度不变；共享专家复制等条件改变时须另核分片与通信。">
  <title>GLM 双机 W8A8、共享专家 TP8、多流关闭的教学基线下，两支都使用同一 token 的隐藏向量，连线不表示同时执行。左侧先打分选 8 个，跨卡派发与回收见专家并行页；右侧所有 token 都过，调用反量化、限幅 SwiGLU、再量化的融合算子。两支输出在出口相加，宽度不变；共享专家复制等条件改变时须另核分片与通信。</title>
  <defs><marker id="moe-branches-ah-token" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="var(--color-token, #087f73)"/></marker><marker id="moe-branches-ah-control" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="var(--color-control, #66716d)"/></marker><marker id="moe-branches-ah-weight" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="var(--color-weight, #c78300)"/></marker></defs>
  <rect x="40" y="128" width="364" height="252" rx="16" fill="none" stroke="var(--color-line-strong, #b8bcb5)" stroke-width="1.5"/>
  <text x="56" y="116" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="15" font-weight="700" fill="var(--color-ink, #17211f)">路由专家分支 · 要打分</text>
  <rect x="468" y="128" width="372" height="252" rx="16" fill="none" stroke="var(--color-line-strong, #b8bcb5)" stroke-width="1.5"/>
  <text x="484" y="116" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="15" font-weight="700" fill="var(--color-ink, #17211f)">共享专家分支 · 不打分</text>
  <path d="M330 69 L300 69 L300 148" fill="none" stroke="var(--color-token, #087f73)" stroke-width="1.4" marker-end="url(#moe-branches-ah-token)"/>
  <path d="M550 69 L700 69 L700 148" fill="none" stroke="var(--color-token, #087f73)" stroke-width="1.4" marker-end="url(#moe-branches-ah-token)"/>
  <path d="M222 190 L222 202" fill="none" stroke="var(--color-control, #66716d)" stroke-width="1.4" marker-end="url(#moe-branches-ah-control)"/>
  <path d="M222 244 L222 256" fill="none" stroke="var(--color-control, #66716d)" stroke-width="1.4" marker-end="url(#moe-branches-ah-control)"/>
