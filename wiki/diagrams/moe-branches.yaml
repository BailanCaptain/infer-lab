layout: figure
id: moe-branches
caption: 一层 MoE 在 GLM 双机部署（W8A8、多流重叠默认关）里的两条分支。每个 token 的同一条隐藏向量同时进入两支。左边的路由专家要先打分再选 8 个，跨卡的派发与回收归专家并行页；右边的共享专家不打分、不选，所有 token 都过，而且走的是把反量化、限幅 SwiGLU 与再量化合在一起的融合算子。两条分支的输出在层出口相加，宽度不变。
