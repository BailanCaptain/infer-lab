<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 390" width="900" height="390" role="img" aria-label="WeightSwitchMixin 运行期权重本地分片与全量视图动态切换流程" font-family="var(--font-sans)">
<title>WeightSwitchMixin 运行期权重动态重切分与零拷贝视图切换</title>
<desc>Runtime local shard to full weight all-gather, pool reuse, and tensor.set_ view switching lifecycle</desc>
<g stroke-width="1.4">
<rect x="16" y="56" width="196" height="128" rx="8" fill="#e8edff" stroke="#4c65b6"/>
<rect x="242" y="56" width="204" height="128" rx="8" fill="#f7e7f2" stroke="#9a4b86"/>
<rect x="476" y="56" width="196" height="128" rx="8" fill="#ddf4ef" stroke="#087f73"/>
<rect x="702" y="56" width="182" height="128" rx="8" fill="#fff4cf" stroke="#c78300"/>
<rect x="16" y="218" width="420" height="156" rx="8" fill="#ece9df" stroke="#b8bcb5"/>
<rect x="464" y="218" width="420" height="156" rx="8" fill="#fff0e9" stroke="#b54237"/>
</g>
<path d="M212 120h28m-5-4l5 4-5 4M446 120h28m-5-4l5 4-5 4M672 120h28m-5-4l5 4-5 4" fill="none" stroke="#17211f" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/>
<circle cx="28" cy="24" r="12.5" fill="#4c65b6"/>
<g font-weight="700">
<text x="28" y="28.5" text-anchor="middle" font-size="13" fill="#ffffff">1</text>
<text x="48" y="30" font-size="16" fill="#17211f">WeightSwitchMixin 运行期权重二次重切分（以 OProjWeightSwitchMixin 为例）</text>
<text x="114" y="82" text-anchor="middle" font-size="14.5" fill="#3a4f93">① 静态常驻分片</text>
<text x="344" y="82" text-anchor="middle" font-size="14.5" fill="#7a3a6a">② 异步拉齐拼全</text>
<text x="574" y="82" text-anchor="middle" font-size="14.5" fill="#065f56">③ 零拷贝切全量</text>
<text x="793" y="82" text-anchor="middle" font-size="14.5" fill="#936300">④ 退出恢复分片</text>
<text x="30" y="244" font-size="15" fill="#17211f">两类声明规约与复用内存池</text>
<text x="478" y="244" font-size="15" fill="#8f3229">显存账单与硬性前置约束</text>
</g>
<g fill="#4d5652" font-size="13.5">
<text x="114" y="108" text-anchor="middle">加载期按 world_size</text>
<text x="114" y="132" text-anchor="middle">再切 1/N 本地分片</text>
<text x="114" y="158" text-anchor="middle" font-weight="600" fill="#3a4f93">HBM 仅留 local_tensor</text>
<text x="344" y="108" text-anchor="middle">all_gather_weight()</text>
<text x="344" y="132" text-anchor="middle">调用 all_gather_async</text>
<text x="344" y="158" text-anchor="middle" font-weight="600" fill="#7a3a6a">写入共享 full_pools</text>
<text x="574" y="108" text-anchor="middle">wait_weight_all_gather</text>
<text x="574" y="132" text-anchor="middle">switch_weight(True)</text>
<text x="574" y="158" text-anchor="middle" font-weight="600" fill="#065f56">attr.set_(full_tensor)</text>
<text x="793" y="108" text-anchor="middle">finally 分支自动触发</text>
<text x="793" y="132" text-anchor="middle">switch_weight(False)</text>
<text x="793" y="158" text-anchor="middle" font-weight="600" fill="#936300">attr.set_(local_tensor)</text>
<text x="30" y="272">• weight_switch_gather_specs：须跨卡拼接的权重及量化 scale</text>
<text x="30" y="297">• weight_switch_repeat_specs：各卡相同、仅本地 repeat 的参数</text>
<text x="30" y="322">• 同规格多层共享一块 pool 缓冲（按 dtype/dim/shape 建键）</text>
<text x="30" y="347">• 通信可与前置注意力计算异步重叠，掩盖 All-Gather 时延</text>
<text x="478" y="272">• 仅允许线性层存在至多 1 条既有切分轴（input 或 output）</text>
<text x="478" y="297">• 切分维必须被 config.world_size 整除，否则抛 RuntimeError</text>
<text x="478" y="322">• 量化方法须完成校验并显式置 supports_weight_switch = True</text>
<text x="478" y="347">• 上一轮异步 handle 未 wait 完前禁止重入第二次 All-Gather</text>
</g>
</svg>
