<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 536" width="900" height="536" role="img" aria-label="Qwen3-30B-A3B 纯路由 MoE 架构对照与模块化交接 Standard 对 BatchedExperts 24 槽位矩阵图" font-family="var(--font-sans)">
  <title>Qwen3-30B-A3B 纯路由 MoE（128 选 8、0 共享专家）与通信/计算交接布局图：左侧 Standard [M=6, K=4] 紧凑配对行对比右侧 BatchedExperts [E=3, T=8, K=4] 共 24 预留槽位（6 个实色有效格 + 18 个虚框空槽，BF16 输入区 192 B）。</title>
  <desc>上半区展示 Qwen3-30B-A3B 单支纯路由 MoE 流程及带共享专家变体差异；下半区以卡 A（持有专家 1–3，有效负载 [1, 4, 1]，每专家容量 T=8，宽度 K=4）真实绘制 Standard [6, 4] 紧凑行与 BatchedExperts [3, 8, 4] 的 24 个槽位格子。</desc>
  <defs>
    <marker id="moeq-arr-t" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto">
      <path d="M 0 1.5 L 8.5 5 L 0 8.5 z" fill="#087f73"/>
    </marker>
    <marker id="moeq-arr-a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto">
      <path d="M 0 1.5 L 8.5 5 L 0 8.5 z" fill="#c78300"/>
    </marker>
    <marker id="moeq-arr-p" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto">
      <path d="M 0 1.5 L 8.5 5 L 0 8.5 z" fill="#9a4b86"/>
    </marker>
  </defs>

  <text x="14" y="26" font-size="16" font-weight="700" fill="#17211f">一、Qwen3-30B-A3B 纯路由单支（128 选 8、0 共享专家）与双支变体边界</text>
  <line x1="12" y1="38" x2="888" y2="38" stroke="#b8bcb5" stroke-width="1.3"/>

  <rect x="12" y="50" width="132" height="84" rx="8" fill="#ddf4ef" stroke="#087f73" stroke-width="1.5"/>
  <text x="78" y="77" text-anchor="middle" font-size="15" font-weight="700" fill="#065f56">输入隐藏态</text>
  <text x="78" y="102" text-anchor="middle" font-size="13.5" font-family="var(--font-mono)" fill="#17211f">x [T, 2048]</text>
  <text x="78" y="124" text-anchor="middle" font-size="13.5" fill="#4d5652">单支直入路由</text>

  <path d="M 144 92 L 172 92" fill="none" stroke="#c78300" stroke-width="2" marker-end="url(#moeq-arr-a)"/>

  <rect x="178" y="50" width="246" height="84" rx="8" fill="#fff4cf" stroke="#c78300" stroke-width="1.5"/>
  <text x="192" y="75" font-size="14.5" font-weight="700" fill="#936300">1. Softmax Router（128 选 8）</text>
  <text x="192" y="99" font-size="13.5" fill="#17211f">FP32 Softmax → Top-8 归一到 <tspan font-family="var(--font-mono)" font-weight="700" fill="#065f56">1.0</tspan></text>
  <text x="192" y="122" font-size="13.5" fill="#66716d">无校正偏置 bias，无额外缩放因子</text>

  <path d="M 424 92 L 452 92" fill="none" stroke="#9a4b86" stroke-width="2" marker-end="url(#moeq-arr-p)"/>

  <rect x="458" y="50" width="250" height="84" rx="8" fill="#f7e7f2" stroke="#9a4b86" stroke-width="1.5"/>
  <text x="472" y="75" font-size="14.5" font-weight="700" fill="#7a3a6a">2. 路由专家池（EP 跨卡驻留）</text>
  <text x="472" y="99" font-size="13.5" fill="#17211f">SwiGLU <tspan font-family="var(--font-mono)" fill="#7a3a6a">2048→768</tspan> · 仅乘 1 次权重</text>
  <text x="472" y="122" font-size="13.5" fill="#66716d">prepare / experts / finalize 成对交接</text>

  <path d="M 708 92 L 734 92" fill="none" stroke="#087f73" stroke-width="2" marker-end="url(#moeq-arr-t)"/>

