  <rect x="12" y="146" width="876" height="44" rx="7" fill="#e8edff" stroke="#4c65b6" stroke-width="1.3" stroke-dasharray="5 3"/>
  <text x="26" y="173" font-size="13.5" fill="#17211f"><tspan font-weight="700" fill="#3a4f93">异构变体对照（DeepSeek-V3 / GLM-5）：</tspan>改用 <tspan font-family="var(--font-mono)" fill="#3a4f93">sigmoid + bias</tspan> 选人、原分数乘 <tspan font-family="var(--font-mono)" fill="#3a4f93">r</tspan>，并另加常驻 <tspan font-family="var(--font-mono)" fill="#3a4f93">y_shared</tspan> 支路</text>

  <text x="14" y="226" font-size="16" font-weight="700" fill="#17211f">二、通信与计算交接的两种张量排布（卡 A 持专家 1–3，实际命中 [1, 4, 1]，每专家容量 T = 8）</text>
