<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 404" width="860" height="404" role="img" aria-label="一个 token 过一层 MoE：router 给池里每个专家打一个分（虚线连着的是打了分但没选中的），只把这个 token 发给分最高的几个（图里 k=2），各专家算完后按 router 给的权重相加，得到这一层的输出。图里只画 6 个专家，GLM 的实际数量见后面的 GLM 小节。">
  <title>一个 token 过一层 MoE：router 给池里每个专家打一个分（虚线连着的是打了分但没选中的），只把这个 token 发给分最高的几个（图里 k=2），各专家算完后按 router 给的权重相加，得到这一层的输出。图里只画 6 个专家，GLM 的实际数量见后面的 GLM 小节。</title>
  <defs><marker id="moe-intuition-ah-token" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="var(--color-token, #087f73)"/></marker><marker id="moe-intuition-ah-weight" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="var(--color-weight, #c78300)"/></marker></defs>
  <rect x="380" y="40" width="200" height="320" rx="16" fill="none" stroke="var(--color-line-strong, #b8bcb5)" stroke-width="1.5"/>
  <text x="396" y="28" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="15" font-weight="700" fill="var(--color-ink, #17211f)">专家池 · 图里画 6 个</text>
  <path d="M164 187 L196 187" fill="none" stroke="var(--color-token, #087f73)" stroke-width="1.4" marker-end="url(#moe-intuition-ah-token)"/>
  <path d="M566 123 L612 123 L612 176 L652 176" fill="none" stroke="var(--color-weight, #c78300)" stroke-width="1.4" marker-end="url(#moe-intuition-ah-weight)"/>
