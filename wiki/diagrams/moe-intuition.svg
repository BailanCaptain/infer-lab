  <path d="M732 214 L732 268" fill="none" stroke="var(--color-token, #087f73)" stroke-width="1.4" marker-end="url(#moe-intuition-ah-token)"/>
  <path d="M346 187 L394 75" fill="none" stroke="var(--color-ink, #17211f)" stroke-width="1.4" stroke-dasharray="7 5"/>
  <path d="M346 187 L394 171" fill="none" stroke="var(--color-ink, #17211f)" stroke-width="1.4" stroke-dasharray="7 5"/>
  <path d="M346 187 L394 267" fill="none" stroke="var(--color-ink, #17211f)" stroke-width="1.4" stroke-dasharray="7 5"/>
  <path d="M346 187 L394 315" fill="none" stroke="var(--color-ink, #17211f)" stroke-width="1.4" stroke-dasharray="7 5"/>
  <path d="M346 187 L394 123" fill="none" stroke="var(--color-token, #087f73)" stroke-width="1.4" marker-end="url(#moe-intuition-ah-token)"/>
  <path d="M346 187 L394 219" fill="none" stroke="var(--color-token, #087f73)" stroke-width="1.4" marker-end="url(#moe-intuition-ah-token)"/>
  <rect x="24" y="160" width="140" height="54" rx="8" fill="var(--color-token, #087f73)" stroke="var(--color-ink, #17211f)" stroke-width="1.5"/>
  <text x="94" y="183" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="14" font-weight="700" fill="var(--color-ink-inverse, #ffffff)" text-anchor="middle">一个 token</text>
  <text x="94" y="202" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="13" font-weight="400" fill="var(--color-ink-inverse, #ffffff)" text-anchor="middle">的隐藏向量</text>
  <rect x="196" y="160" width="150" height="54" rx="8" fill="var(--color-control, #66716d)" stroke="var(--color-ink, #17211f)" stroke-width="1.5"/>
  <text x="271" y="183" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="14" font-weight="700" fill="var(--color-ink-inverse, #ffffff)" text-anchor="middle">router 打分</text>
  <text x="271" y="202" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="13" font-weight="400" fill="var(--color-ink-inverse, #ffffff)" text-anchor="middle">每个专家一个分数</text>
  <rect x="394" y="56" width="172" height="38" rx="8" fill="var(--color-weight-soft, #fff4cf)" stroke="var(--color-weight, #c78300)" stroke-opacity="0.4" stroke-width="1.5" stroke-dasharray="5 4"/>
