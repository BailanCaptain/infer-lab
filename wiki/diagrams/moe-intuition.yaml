caption: 「苹果」这个 token 过一层 MoE（示意）：router 给池里每个专家打一个分（虚线连着的是打了分但没选中的），只把这个 token 发给分最高的几个（图里 k=2），各专家算完后按 router 给的权重相加，得到这一层的输出。图里只画 6 个专家，GLM 的实际数量见后面的 GLM 小节。
