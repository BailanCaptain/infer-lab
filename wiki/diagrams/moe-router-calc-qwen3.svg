<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 490" width="900" height="490" role="img" aria-label="标准 Softmax Top-k 路由逐步演算（以 6 选 2 示意 Qwen3-30B-A3B 的 128 选 8 机制，数为示意）：① 门控线性层算出原始 logits z；② 对全池做一次 Softmax 得到概率 p（无路由校正偏置 b）；③ 直接挑出概率最大的 k=2 个专家（专家 2 与专家 3）；④ 将入选的 2 个概率除以它们的和 0.75 重归一化（norm_topk_prob=true），使组合权重严格相加等于 1.00；⑤ 将被选中专家的输出按 0.73 与 0.27 加权求和得到本层输出。">
  <title>标准 Softmax Top-k 路由逐步演算（以 6 选 2 示意 Qwen3-30B-A3B 的 128 选 8 机制，数为示意）：① 门控线性层算出原始 logits z；② 对全池做一次 Softmax 得到概率 p（无路由校正偏置 b）；③ 直接挑出概率最大的 k=2 个专家（专家 2 与专家 3）；④ 将入选的 2 个概率除以它们的和 0.75 重归一化（norm_topk_prob=true），使组合权重严格相加等于 1.00；⑤ 将被选中专家的输出按 0.73 与 0.27 加权求和得到本层输出。</title>
