<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 620" width="900" height="620" role="img" aria-label="Mooncake 显存地址条带、V2 三线完成泳道与 D2RH 两跳解耦图" font-family="var(--font-sans)">
  <title>Mooncake 地址换算与连续段合并、V2 三线完成泳道及 D2RH 两跳解耦</title>
  <desc>KVCacheRecvingThread, _handle_request, _send_done_recv_signal, _transfer_kv_cache_all_groups, batch_transfer_sync_read, finished_recving, failed_recving, DEFAULT_KV_LEASE_DURATION, kv_lease_duration</desc>
  <defs>
    <marker id="mc2-arr-plum" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto">
      <path d="M0 1.5L9 5L0 8.5z" fill="#9a4b86"/>
    </marker>
    <marker id="mc2-arr-amber" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto">
      <path d="M0 1.5L9 5L0 8.5z" fill="#c78300"/>
    </marker>
    <marker id="mc2-arr-teal" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto">
      <path d="M0 1.5L9 5L0 8.5z" fill="#087f73"/>
    </marker>
    <marker id="mc2-arr-danger" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto">
      <path d="M0 1.5L9 5L0 8.5z" fill="#b54237"/>
    </marker>
    <marker id="mc2-arr-blue" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto">
      <path d="M0 1.5L9 5L0 8.5z" fill="#4c65b6"/>
    </marker>
  </defs>

  <!-- Zone 1: Address Strip (base + block * stride) & Contiguous Merge -->
  <circle cx="24" cy="24" r="12" fill="#4c65b6"/>
  <text x="24" y="28.5" text-anchor="middle" font-size="12.5" font-weight="700" fill="#ffffff">1</text>
  <text x="44" y="30" font-size="16" font-weight="700" fill="#17211f">地址条带：addr(b) = base + b × stride，有效载荷与页补齐决定能否并段</text>

  <!-- Case A: stride > bytes (page padding breaks merge) -->
  <text x="16" y="64" font-size="14" font-weight="700" fill="#3a4f93">含页补齐（stride &gt; bytes）：跳过灰区，2 块拆 2 段</text>
  <rect x="16" y="74" width="128" height="32" rx="4" fill="#e8edff" stroke="#4c65b6" stroke-width="1.4"/>
  <text x="80" y="95" text-anchor="middle" font-size="13.5" font-weight="700" fill="#3a4f93">P#7 载荷 (64K)</text>
  <rect x="144" y="74" width="46" height="32" rx="3" fill="#ece9df" stroke="#b8bcb5" stroke-width="1.2" stroke-dasharray="3 2"/>
  <text x="167" y="95" text-anchor="middle" font-size="13.5" fill="#66716d">补齐</text>
  <rect x="190" y="74" width="128" height="32" rx="4" fill="#e8edff" stroke="#4c65b6" stroke-width="1.4"/>
  <text x="254" y="95" text-anchor="middle" font-size="13.5" font-weight="700" fill="#3a4f93">P#8 载荷 (64K)</text>
  <rect x="318" y="74" width="46" height="32" rx="3" fill="#ece9df" stroke="#b8bcb5" stroke-width="1.2" stroke-dasharray="3 2"/>
  <text x="341" y="95" text-anchor="middle" font-size="13.5" fill="#66716d">补齐</text>

  <!-- Two separate transfer arrows -->
  <line x1="370" y1="84" x2="432" y2="84" stroke="#9a4b86" stroke-width="1.8" marker-end="url(#mc2-arr-plum)"/>
  <line x1="370" y1="98" x2="432" y2="98" stroke="#9a4b86" stroke-width="1.8" marker-end="url(#mc2-arr-plum)"/>
  <text x="401" y="76" text-anchor="middle" font-size="13.5" font-weight="700" fill="#7a3a6a">2 段</text>

  <rect x="440" y="74" width="128" height="32" rx="4" fill="#ddf4ef" stroke="#087f73" stroke-width="1.4"/>
  <text x="504" y="95" text-anchor="middle" font-size="13.5" font-weight="700" fill="#065f56">D#3 (1,192K)</text>
  <rect x="568" y="74" width="46" height="32" rx="3" fill="#ece9df" stroke="#b8bcb5" stroke-width="1.2" stroke-dasharray="3 2"/>
  <text x="591" y="95" text-anchor="middle" font-size="13.5" fill="#66716d">补齐</text>
  <rect x="614" y="74" width="128" height="32" rx="4" fill="#ddf4ef" stroke="#087f73" stroke-width="1.4"/>
  <text x="678" y="95" text-anchor="middle" font-size="13.5" font-weight="700" fill="#065f56">D#4</text>
  <text x="754" y="95" font-size="13.5" fill="#4d5652">仅搬有效 bytes</text>

  <!-- Case B: stride == bytes (contiguous merge) -->
  <text x="16" y="138" font-size="14" font-weight="700" fill="#065f56">紧邻无补齐（stride == bytes 且块号连续）：P#7–8 → D#3–4 并成 1 段</text>
  <rect x="16" y="148" width="256" height="32" rx="4" fill="#e8edff" stroke="#4c65b6" stroke-width="1.8"/>
  <line x1="144" y1="148" x2="144" y2="180" stroke="#4c65b6" stroke-width="1.2" stroke-dasharray="3 2"/>
  <text x="80" y="169" text-anchor="middle" font-size="13.5" font-weight="700" fill="#3a4f93">P#7 (5,448K)</text>
  <text x="208" y="169" text-anchor="middle" font-size="13.5" font-weight="700" fill="#3a4f93">P#8 (5,512K)</text>

  <line x1="278" y1="164" x2="432" y2="164" stroke="#087f73" stroke-width="2.6" marker-end="url(#mc2-arr-teal)"/>
  <text x="355" y="154" text-anchor="middle" font-size="13.5" font-weight="700" fill="#065f56">合并为 1 段 (128 KiB)</text>

  <rect x="440" y="148" width="256" height="32" rx="4" fill="#ddf4ef" stroke="#087f73" stroke-width="1.8"/>
  <line x1="568" y1="148" x2="568" y2="180" stroke="#087f73" stroke-width="1.2" stroke-dasharray="3 2"/>
  <text x="504" y="169" text-anchor="middle" font-size="13.5" font-weight="700" fill="#065f56">D#3 (1,192K)</text>
  <text x="632" y="169" text-anchor="middle" font-size="13.5" font-weight="700" fill="#065f56">D#4 (1,256K)</text>
  <text x="708" y="169" font-size="13.5" font-weight="700" fill="#065f56">段数减半（6→3 段）</text>

  <!-- Divider 1 -->
  <line x1="16" y1="198" x2="884" y2="198" stroke="#d8d8cf" stroke-width="1.4" stroke-dasharray="6 4"/>

  <!-- Zone 2: 3-Line Completion Swimlane -->
  <circle cx="24" cy="222" r="12" fill="#9a4b86"/>
  <text x="24" y="226.5" text-anchor="middle" font-size="12.5" font-weight="700" fill="#ffffff">2</text>
  <text x="44" y="228" font-size="16" font-weight="700" fill="#17211f">V2 三线完成泳道：读尝试结束、通知 P 释块、D 判定能否开算，三者分开记账</text>

  <!-- Swimlane 1: D workers read attempts -->
  <rect x="16" y="248" width="158" height="58" rx="6" fill="#e8edff" stroke="#4c65b6" stroke-width="1.4"/>
  <text x="95" y="272" text-anchor="middle" font-size="14" font-weight="700" fill="#3a4f93">线 1 · D workers</text>
  <text x="95" y="294" text-anchor="middle" font-size="13.5" fill="#4d5652">读尝试结束</text>

  <rect x="200" y="248" width="176" height="26" rx="4" fill="#ddf4ef" stroke="#087f73" stroke-width="1.3"/>
  <text x="288" y="266" text-anchor="middle" font-size="13.5" fill="#065f56">Worker 0：读成功 ✓</text>
  <rect x="200" y="280" width="176" height="26" rx="4" fill="#fff0e9" stroke="#b54237" stroke-width="1.3"/>
  <text x="288" y="298" text-anchor="middle" font-size="13.5" fill="#8f3229">Worker 1：某组读失败 ✗</text>

  <path d="M376 261 H404 V277 H430 M376 293 H404 V277" fill="none" stroke="#4c65b6" stroke-width="1.6" marker-end="url(#mc2-arr-blue)"/>
  <rect x="436" y="252" width="218" height="50" rx="6" fill="#ece9df" stroke="#b8bcb5" stroke-width="1.3"/>
  <text x="545" y="274" text-anchor="middle" font-size="14" font-weight="700" fill="#17211f">D 调度侧汇合各卡结果</text>
  <text x="545" y="294" text-anchor="middle" font-size="13.5" fill="#4d5652">get_transfer_results</text>

  <rect x="676" y="252" width="208" height="50" rx="6" fill="#fff0e9" stroke="#b54237" stroke-width="1.2" stroke-dasharray="4 3"/>
  <text x="780" y="274" text-anchor="middle" font-size="13.5" font-weight="700" fill="#8f3229">早期主干缺口：多组失败</text>
  <text x="780" y="294" text-anchor="middle" font-size="13.5" fill="#8f3229">仅告警，未上报调度器</text>

  <!-- Zero-crossing split from aggregator to Lane 2 and Lane 3 -->
  <line x1="480" y1="302" x2="480" y2="321" stroke="#c78300" stroke-width="1.8" marker-end="url(#mc2-arr-amber)"/>
  <path d="M452 302 V315 H187 V404 H675 V411" fill="none" stroke="#9a4b86" stroke-width="1.8" marker-end="url(#mc2-arr-plum)"/>
  <line x1="323" y1="404" x2="323" y2="411" stroke="#9a4b86" stroke-width="1.8" marker-end="url(#mc2-arr-plum)"/>

  <!-- Swimlane 2: Request-level P release -->
  <rect x="16" y="326" width="158" height="68" rx="6" fill="#fff4cf" stroke="#c78300" stroke-width="1.4"/>
  <text x="95" y="354" text-anchor="middle" font-size="14" font-weight="700" fill="#936300">线 2 · 请求级通知</text>
  <text x="95" y="376" text-anchor="middle" font-size="13.5" fill="#4d5652">P 回收源块</text>

  <rect x="200" y="326" width="300" height="68" rx="6" fill="#fff4cf" stroke="#c78300" stroke-width="1.4"/>
  <text x="350" y="351" text-anchor="middle" font-size="13.5" font-weight="700" fill="#936300">无论成败，发请求级释放通知 → P 还块</text>
  <text x="350" y="375" text-anchor="middle" font-size="13.5" fill="#4d5652">释放仅代表 P 可回收，不承诺 D 可开算</text>

  <line x1="500" y1="360" x2="526" y2="360" stroke="#c78300" stroke-width="1.8" stroke-dasharray="4 3" marker-end="url(#mc2-arr-amber)"/>
  <rect x="532" y="326" width="352" height="68" rx="6" fill="#ece9df" stroke="#b8bcb5" stroke-width="1.3"/>
  <text x="708" y="346" text-anchor="middle" font-size="13.5" font-weight="700" fill="#17211f">通知丢失兜底（按版本分叉）</text>
  <text x="708" y="366" text-anchor="middle" font-size="13.5" fill="#4d5652">v0.30.0：沿用 480 s 超时强放</text>
  <text x="708" y="385" text-anchor="middle" font-size="13.5" font-weight="700" fill="#3a4f93">main：kv_lease_duration(默认 120 s)+D 心跳</text>

  <!-- Swimlane 3: D failure aggregation & decision -->
  <rect x="16" y="414" width="158" height="58" rx="6" fill="#f7e7f2" stroke="#9a4b86" stroke-width="1.4"/>
  <text x="95" y="438" text-anchor="middle" font-size="14" font-weight="700" fill="#7a3a6a">线 3 · D 失败汇合</text>
  <text x="95" y="460" text-anchor="middle" font-size="13.5" fill="#4d5652">判定能否开算</text>

  <rect x="200" y="414" width="246" height="58" rx="6" fill="#ddf4ef" stroke="#087f73" stroke-width="1.4"/>
  <text x="323" y="438" text-anchor="middle" font-size="14" font-weight="700" fill="#065f56">✓ failed_recving 为空</text>
  <text x="323" y="459" text-anchor="middle" font-size="13.5" fill="#4d5652">离开挂起队列，D 正式开算</text>

  <rect x="466" y="414" width="418" height="58" rx="6" fill="#fff0e9" stroke="#b54237" stroke-width="1.5"/>
  <text x="675" y="438" text-anchor="middle" font-size="14" font-weight="700" fill="#8f3229">✗ failed_recving 命中（v0.30.0 / main 分离上报）</text>
  <text x="675" y="459" text-anchor="middle" font-size="13.5" fill="#17211f">默认 fail 报错结束；允许重算时清零进度、处理目的块再算</text>

  <!-- Divider 2 -->
  <line x1="16" y1="492" x2="884" y2="492" stroke="#d8d8cf" stroke-width="1.4" stroke-dasharray="6 4"/>

  <!-- Zone 3: Compact D2RH Two-Hop Inset -->
  <circle cx="24" cy="516" r="12" fill="#087f73"/>
  <text x="24" y="520.5" text-anchor="middle" font-size="12.5" font-weight="700" fill="#ffffff">3</text>
  <text x="44" y="522" font-size="16" font-weight="700" fill="#17211f">D2RH 两跳变体（MooncakeD2RHConnectorV1）：先落 D 主机，解耦 P 源块等待</text>

  <rect x="16" y="538" width="166" height="66" rx="8" fill="#fff4cf" stroke="#c78300" stroke-width="1.5"/>
  <text x="99" y="565" text-anchor="middle" font-size="14.5" font-weight="700" fill="#936300">P 显存 HBM</text>
  <text x="99" y="588" text-anchor="middle" font-size="13.5" fill="#4d5652">源块待释放</text>

  <line x1="184" y1="571" x2="346" y2="571" stroke="#9a4b86" stroke-width="2.2" marker-end="url(#mc2-arr-plum)"/>
  <text x="265" y="560" text-anchor="middle" font-size="13.5" font-weight="700" fill="#7a3a6a">跳 1：D2RH 网络拉</text>
  <text x="265" y="592" text-anchor="middle" font-size="13.5" font-weight="700" fill="#065f56">完成即放 P 源块 ✓</text>

  <rect x="352" y="538" width="196" height="66" rx="8" fill="#e8edff" stroke="#4c65b6" stroke-width="1.5"/>
  <text x="450" y="565" text-anchor="middle" font-size="14.5" font-weight="700" fill="#3a4f93">D 主机内存 DRAM</text>
  <text x="450" y="588" text-anchor="middle" font-size="13.5" fill="#4d5652">主机命中 ≠ 设备可算</text>

  <line x1="550" y1="571" x2="712" y2="571" stroke="#087f73" stroke-width="2.2" marker-end="url(#mc2-arr-teal)"/>
  <text x="631" y="560" text-anchor="middle" font-size="13.5" font-weight="700" fill="#065f56">跳 2：本机 H2D 搬入</text>
  <text x="631" y="592" text-anchor="middle" font-size="13.5" fill="#4d5652">完后再开算 &amp; 释 DRAM</text>

  <rect x="718" y="538" width="166" height="66" rx="8" fill="#ddf4ef" stroke="#087f73" stroke-width="1.5"/>
  <text x="801" y="565" text-anchor="middle" font-size="14.5" font-weight="700" fill="#065f56">D 显存 HBM</text>
  <text x="801" y="588" text-anchor="middle" font-size="13.5" fill="#4d5652">分到块后开算</text>
</svg>
