<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 526" width="900" height="526" role="img" aria-label="Mooncake 非对称 TP KV 头拼装机制、GQA+C8 禁配错读与连接器家族选型图" font-family="var(--font-sans)">
  <title>Mooncake 非对称 TP KV 头拼装、GQA+C8 错读阻断与连接器家族选型</title>
  <desc>pd_tp_ratio, pd_head_ratio, num_head_replica, _check_mooncake_c8_kv_cache_quant, _validate_sfa_dcp_kv_sp, cp_kv_cache_interleave_size, register_connector, KVConnectorFactory</desc>
  <defs>
    <marker id="mc-a" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto">
      <path d="M0 1.5L9 5L0 8.5z" fill="#4c65b6"/>
    </marker>
    <marker id="mc-d" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto">
      <path d="M0 1.5L9 5L0 8.5z" fill="#b54237"/>
    </marker>
  </defs>

  <!-- Section 1: Asymmetric TP Head Resharding -->
  <circle cx="24" cy="24" r="12" fill="#4c65b6"/>
  <text x="24" y="28.5" text-anchor="middle" font-size="12.5" font-weight="700" fill="#ffffff">1</text>
  <text x="44" y="30" font-size="16" font-weight="700" fill="#17211f">非对称 TP 下谁拼 KV 头：按实际持有头算 r_head，不按裸 TP 比</text>

  <!-- Left geometric TP4 -> TP2 head merge -->
  <rect x="16" y="46" width="424" height="202" rx="8" fill="#e8edff" stroke="#4c65b6" stroke-width="1.5"/>
  <text x="30" y="70" font-size="14.5" font-weight="700" fill="#3a4f93">示意：8 KV 头，P=TP4（2 头/卡）→ D=TP2（4 头/卡）</text>

  <rect x="30" y="82" width="166" height="44" rx="6" fill="#fff4cf" stroke="#c78300" stroke-width="1.4"/>
  <text x="113" y="102" text-anchor="middle" font-size="13.5" font-weight="700" fill="#936300">P rank 0（头 0–1）</text>
  <text x="113" y="120" text-anchor="middle" font-size="13.5" fill="#66716d">每块每层 32 KiB</text>

  <rect x="30" y="132" width="166" height="44" rx="6" fill="#fff4cf" stroke="#c78300" stroke-width="1.4"/>
  <text x="113" y="152" text-anchor="middle" font-size="13.5" font-weight="700" fill="#936300">P rank 1（头 2–3）</text>
  <text x="113" y="170" text-anchor="middle" font-size="13.5" fill="#66716d">每块每层 32 KiB</text>

  <path d="M196 104 L248 120 M196 154 L248 138" fill="none" stroke="#4c65b6" stroke-width="1.8" marker-end="url(#mc-a)"/>

  <rect x="254" y="96" width="172" height="66" rx="6" fill="#ddf4ef" stroke="#087f73" stroke-width="1.5"/>
  <text x="340" y="122" text-anchor="middle" font-size="14" font-weight="700" fill="#065f56">D rank 0（头 0–3）</text>
  <text x="340" y="146" text-anchor="middle" font-size="13.5" fill="#17211f">合并重排 64 KiB</text>

  <rect x="30" y="186" width="396" height="52" rx="6" fill="#ffffff" stroke="#4c65b6" stroke-width="1.2"/>
  <text x="42" y="207" font-size="13.5" font-weight="700" fill="#3a4f93">r_head = min(TP_P, H_kv) ÷ min(TP_D, H_kv)</text>
  <text x="42" y="228" font-size="13.5" fill="#4d5652">TP16→TP8 遇 8 头得 1（均持 1 头），不能按 16÷8 算 2</text>

  <!-- Right 3 geometric mode bars -->
  <rect x="456" y="46" width="428" height="58" rx="7" fill="#ddf4ef" stroke="#087f73" stroke-width="1.4"/>
  <text x="470" y="70" font-size="14" font-weight="700" fill="#065f56">V1 整批拉：D 读半块，读完后在 D 本地重排</text>
  <text x="470" y="92" font-size="13.5" fill="#4d5652">跨 P rank 分批提交批量读；连续块且无补齐时并段</text>

  <rect x="456" y="112" width="428" height="58" rx="7" fill="#f7e7f2" stroke="#9a4b86" stroke-width="1.4"/>
  <text x="470" y="136" font-size="14" font-weight="700" fill="#7a3a6a">Layerwise 逐层推：P 发前先交换重排再写出</text>
  <text x="470" y="158" font-size="13.5" fill="#4d5652">仅在 r_head &gt; 1 或量化路径时建重排流与中转缓冲</text>

  <rect x="456" y="178" width="428" height="70" rx="7" fill="#fff4cf" stroke="#c78300" stroke-width="1.4"/>
  <text x="470" y="202" font-size="14" font-weight="700" fill="#936300">启动硬校验（v0.30.0 / main）</text>
  <text x="470" y="223" font-size="13.5" fill="#17211f">非 MLA 须 TP_P % TP_D == 0 且 D 端 PP = 1</text>
  <text x="470" y="241" font-size="13.5" fill="#4d5652">DCP &gt; 1 强检 interleave_size == block_size；MLA 组内复制</text>

  <!-- Divider -->
  <line x1="16" y1="264" x2="884" y2="264" stroke="#d8d8cf" stroke-width="1.4" stroke-dasharray="6 4"/>

  <!-- Section 2: GQA + C8 Byte-Mismatch Visual + Compact Family Selection Strip -->
  <circle cx="24" cy="288" r="12" fill="#b54237"/>
  <text x="24" y="292.5" text-anchor="middle" font-size="12.5" font-weight="700" fill="#ffffff">2</text>
  <text x="44" y="294" font-size="16" font-weight="700" fill="#17211f">GQA + C8 禁配阻断与 Mooncake 连接器家族选型（v0.30.0 / main）</text>

  <!-- Top Highlight Strip: GQA + C8 bf16 -> int8 byte mismatch -->
  <rect x="16" y="310" width="868" height="64" rx="7" fill="#fff0e9" stroke="#b54237" stroke-width="1.5"/>
  <rect x="26" y="324" width="136" height="36" rx="5" fill="#fff4cf" stroke="#c78300" stroke-width="1.3"/>
  <text x="94" y="347" text-anchor="middle" font-size="13" font-weight="700" fill="#936300">P 显存：bf16 (2B)</text>
  <line x1="162" y1="342" x2="240" y2="342" stroke="#b54237" stroke-width="2" stroke-dasharray="5 3" marker-end="url(#mc-d)"/>
  <text x="201" y="333" text-anchor="middle" font-size="13" font-weight="700" fill="#8f3229">裸拷错读 ✗</text>
  <rect x="246" y="324" width="136" height="36" rx="5" fill="#e8edff" stroke="#4c65b6" stroke-width="1.3"/>
  <text x="314" y="347" text-anchor="middle" font-size="13" font-weight="700" fill="#3a4f93">D 显存：int8 (1B)</text>
  <text x="396" y="338" font-size="14" font-weight="700" fill="#8f3229">GQA + C8 禁用普通 MooncakeConnector（启动抛 ValueError）</text>
  <text x="396" y="360" font-size="13" fill="#4d5652">解法：关闭 C8，或改用「先量化再发送」的 MooncakeLayerwiseConnector</text>

  <!-- 4 Clean Family Choice Tiles -->
  <g stroke-width="1.4">
    <rect x="16" y="388" width="206" height="124" rx="7" fill="#ddf4ef" stroke="#087f73"/>
    <rect x="236" y="388" width="206" height="124" rx="7" fill="#f7e7f2" stroke="#9a4b86"/>
    <rect x="456" y="388" width="206" height="124" rx="7" fill="#fff4cf" stroke="#c78300"/>
    <rect x="676" y="388" width="208" height="124" rx="7" fill="#e8edff" stroke="#4c65b6"/>
  </g>
  <g font-size="13.5">
    <text x="28" y="413" font-size="14.5" font-weight="700" fill="#065f56">✓ V1 / V2 (Pull)</text>
    <text x="28" y="438" fill="#17211f">D 主动拉，P 押源块</text>
    <text x="28" y="460" fill="#4d5652">V2 解 PCP=1 报失败集</text>
    <text x="28" y="482" fill="#4d5652">main V2 按参数分流</text>
    <text x="28" y="502" font-weight="700" fill="#065f56">V2 启动即拒 kv_both</text>

    <text x="248" y="413" font-size="14.5" font-weight="700" fill="#7a3a6a">✓ Layerwise / Push</text>
    <text x="248" y="438" fill="#17211f">D 先分块，P 逐层推</text>
    <text x="248" y="460" fill="#4d5652">理想重叠藏 L-1 层</text>
    <text x="248" y="482" fill="#4d5652">旧版限 D PCP=1/单模块</text>
    <text x="248" y="502" font-weight="700" fill="#7a3a6a">main 落地 Push 实现</text>

    <text x="468" y="413" font-size="14.5" font-weight="700" fill="#936300">△ Hybrid / D2RH</text>
    <text x="468" y="438" fill="#17211f">Hybrid 递推态限同 TP</text>
    <text x="468" y="460" fill="#4d5652">D2RH 先落 D 主机内存</text>
    <text x="468" y="482" fill="#4d5652">首跳完即提前释 P 块</text>
    <text x="468" y="502" font-weight="700" fill="#936300">进程登记上限 256 段</text>

    <text x="688" y="413" font-size="14.5" font-weight="700" fill="#3a4f93">✓ AscendStore 池</text>
    <text x="688" y="438" fill="#17211f">按内容指纹跨机存取</text>
    <text x="688" y="460" fill="#4d5652">别名 ConnectorStoreV1</text>
    <text x="688" y="482" fill="#4d5652">不配对 P/D、无握手口</text>
    <text x="688" y="502" font-weight="700" fill="#3a4f93">JSON 勿与上游互换</text>
  </g>
</svg>
