  <path d="M582 414 L582 430" fill="none" stroke="var(--color-ink, #17211f)" stroke-width="1.4" marker-end="url(#mooncake-connector-hooks-ah-ink)"/>
  <path d="M644 387 L666 387" fill="none" stroke="var(--color-ink, #17211f)" stroke-width="1.4" marker-end="url(#mooncake-connector-hooks-ah-ink)"/>
