<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 766" width="900" height="766" role="img" aria-label="同一个连接器类在两类进程里各造一份，按主线站点从左往右看一步里它在哪几处被叫到。调度器那一半只记账：远端能补几个位置、D 上哪些目的块等着收、请求结束时 P 的源块押不押；worker 那一半在前向开始前把要收、要发的请求交给后台线程，在每层注意力算完后可以顺手发出这一层（只有 Layerwise 这样做，V1 这里是空操作），步末把收完、发完的请求报回调度器。真正的字节由后台线程交给 Mooncake 传输引擎，按对方显存地址直接读写。">
  <title>同一个连接器类在两类进程里各造一份，按主线站点从左往右看一步里它在哪几处被叫到。调度器那一半只记账：远端能补几个位置、D 上哪些目的块等着收、请求结束时 P 的源块押不押；worker 那一半在前向开始前把要收、要发的请求交给后台线程，在每层注意力算完后可以顺手发出这一层（只有 Layerwise 这样做，V1 这里是空操作），步末把收完、发完的请求报回调度器。真正的字节由后台线程交给 Mooncake 传输引擎，按对方显存地址直接读写。</title>
  <defs><marker id="mooncake-connector-hooks-ah-control" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="var(--color-control, #66716d)"/></marker><marker id="mooncake-connector-hooks-ah-ink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="var(--color-ink, #17211f)"/></marker><marker id="mooncake-connector-hooks-ah-comm" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="var(--color-comm, #9a4b86)"/></marker></defs>
  <rect x="20" y="64" width="860" height="230" rx="16" fill="none" stroke="var(--color-line-strong, #b8bcb5)" stroke-width="1.5"/>
  <text x="36" y="52" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="15" font-weight="700" fill="var(--color-ink, #17211f)">调度器进程（每个实例一个）</text>
  <rect x="20" y="330" width="860" height="190" rx="16" fill="none" stroke="var(--color-line-strong, #b8bcb5)" stroke-width="1.5"/>
  <text x="36" y="318" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="15" font-weight="700" fill="var(--color-ink, #17211f)">worker 进程（每张卡一个）</text>
  <rect x="20" y="556" width="860" height="190" rx="16" fill="none" stroke="var(--color-line-strong, #b8bcb5)" stroke-width="1.5"/>
  <text x="36" y="544" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="15" font-weight="700" fill="var(--color-ink, #17211f)">worker 里的后台线程与传输引擎</text>
  <path d="M120 150 L120 162" fill="none" stroke="var(--color-control, #66716d)" stroke-width="1.4" marker-end="url(#mooncake-connector-hooks-ah-control)"/>
