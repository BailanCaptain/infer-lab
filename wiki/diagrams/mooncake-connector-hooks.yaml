  - { at: [36, 228], size: [168, 54], text: ③ 打包本步清单, sub: 随调度结果发下去, tone: control }
  - { at: [666, 96], size: [200, 54], text: ⑦ 请求结束：押不押块, sub: V1 的 P 押，Layerwise 不押, tone: control }
  - { at: [666, 194], size: [200, 54], text: ⑧ 收到完成名单, sub: 放源块，放行等数据的请求, tone: control }
