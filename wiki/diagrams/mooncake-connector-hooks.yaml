layout: figure
id: mooncake-connector-hooks
caption: 同一个连接器类在两类进程里各造一份，按主线站点从左往右看一步里它在哪几处被叫到。调度器那一半只记账：远端能补几个位置、D 上哪些目的块等着收、请求结束时 P 的源块押不押；worker 那一半在前向开始前把要收、要发的请求交给后台线程，在每层注意力算完后可以顺手发出这一层（只有 Layerwise 这样做，V1 这里是空操作），步末把收完、发完的请求报回调度器。真正的字节由后台线程交给 Mooncake 传输引擎，按对方显存地址直接读写。
size: [900, 766]
frames:
  - { label: 调度器进程（每个实例一个）, at: [20, 64], size: [860, 230] }
  - { label: worker 进程（每张卡一个）, at: [20, 330], size: [860, 190] }
  - { label: worker 里的后台线程与传输引擎, at: [20, 556], size: [860, 190] }
