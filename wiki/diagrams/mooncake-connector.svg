<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 250" width="900" height="250" role="img" aria-label="整块拉要等 P 节点 28 层全算完才开始搬；逐层推把前 27 层的搬运藏进 P 还在算的时间里。两条路 D 节点都要等 28 层到齐（示意，搬运时长按每层四分之一层计算时间画）">
