<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 492" width="900" height="492" role="img" aria-label="Mooncake 连接器做的三件事：先对表，再按层搬，完成通知按 V1 整批拉与 Layerwise 逐层推分成两条独立路径" font-family="var(--font-sans)">
  <title>Mooncake 连接器三步交接：对表、按层搬，以及 V1 尝试完成通知 vs Layerwise 末层写完通知分叉</title>
  <desc>batch_transfer_sync_read, batch_transfer_sync_write</desc>
  <defs>
    <marker id="mc-conn-ah-ctrl" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto">
      <path d="M0 1.5L9 5L0 8.5z" fill="#66716d"/>
    </marker>
    <marker id="mc-conn-ah-plum" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto">
      <path d="M0 1.5L9 5L0 8.5z" fill="#9a4b86"/>
    </marker>
    <marker id="mc-conn-ah-teal" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto">
      <path d="M0 1.5L9 5L0 8.5z" fill="#087f73"/>
    </marker>
    <marker id="mc-conn-ah-amber" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto">
      <path d="M0 1.5L9 5L0 8.5z" fill="#c78300"/>
    </marker>
  </defs>

  <!-- Title -->
  <text x="450" y="24" text-anchor="middle" font-size="15.5" font-weight="700" fill="#17211f">先对好块号，再按层搬历史，最后按协议发完成通知</text>

  <!-- Left Frame: P Instance -->
  <rect x="20" y="46" width="286" height="278" rx="12" fill="none" stroke="#b8bcb5" stroke-width="1.5"/>
  <text x="36" y="74" font-size="15" font-weight="700" fill="#17211f">P 实例：算完提示词的一方</text>

  <!-- Right Frame: D Instance -->
  <rect x="594" y="46" width="286" height="278" rx="12" fill="none" stroke="#b8bcb5" stroke-width="1.5"/>
  <text x="610" y="74" font-size="15" font-weight="700" fill="#17211f">D 实例：接着生成的一方</text>

  <!-- Step 1: Table mapping -->
  <rect x="326" y="54" width="248" height="58" rx="8" fill="#ece9df" stroke="#b8bcb5" stroke-width="1.4"/>
  <text x="450" y="79" text-anchor="middle" font-size="14.5" font-weight="700" fill="#17211f">① 两端对表</text>
  <text x="450" y="100" text-anchor="middle" font-size="12.5" fill="#4d5652">P#7→D#3，P#12→D#5，换显存地址</text>
  <line x1="326" y1="83" x2="310" y2="83" stroke="#66716d" stroke-width="1.5" marker-end="url(#mc-conn-ah-ctrl)"/>
  <line x1="574" y1="83" x2="590" y2="83" stroke="#66716d" stroke-width="1.5" marker-end="url(#mc-conn-ah-ctrl)"/>

  <!-- P 3x2 grid -->
  <g font-size="13.5" fill="#4d5652" text-anchor="middle">
    <text x="148" y="128">7 号块</text>
    <text x="234" y="128">12 号块</text>
  </g>
  <g font-size="13.5" fill="#17211f" text-anchor="end">
    <text x="98" y="164">层 0</text>
    <text x="98" y="218">层 1</text>
    <text x="98" y="272">层 2</text>
  </g>
  <g fill="#e8edff" stroke="#4c65b6" stroke-width="1.4">
    <rect x="108" y="136" width="80" height="46" rx="5"/>
    <rect x="194" y="136" width="80" height="46" rx="5"/>
    <rect x="108" y="190" width="80" height="46" rx="5"/>
    <rect x="194" y="190" width="80" height="46" rx="5"/>
    <rect x="108" y="244" width="80" height="46" rx="5"/>
    <rect x="194" y="244" width="80" height="46" rx="5"/>
  </g>
  <text x="163" y="312" text-anchor="middle" font-size="13.5" fill="#66716d">源块：这条请求在 P 上的历史</text>

  <!-- D 3x2 grid -->
  <g font-size="13.5" fill="#4d5652" text-anchor="middle">
    <text x="698" y="128">3 号块</text>
    <text x="784" y="128">5 号块</text>
  </g>
  <g fill="#e8edff" stroke="#4c65b6" stroke-width="1.4">
    <rect x="658" y="136" width="80" height="46" rx="5"/>
    <rect x="744" y="136" width="80" height="46" rx="5"/>
    <rect x="658" y="190" width="80" height="46" rx="5"/>
    <rect x="744" y="190" width="80" height="46" rx="5"/>
  </g>
  <g fill="#ffffff" stroke="#4c65b6" stroke-opacity="0.55" stroke-width="1.3" stroke-dasharray="4 3">
    <rect x="658" y="244" width="80" height="46" rx="5"/>
    <rect x="744" y="244" width="80" height="46" rx="5"/>
  </g>
  <text x="740" y="312" text-anchor="middle" font-size="13.5" fill="#66716d">目的块先分好，再等数据到位</text>

  <!-- Step 2: Layer-by-layer transfer arrows -->
  <line x1="278" y1="159" x2="652" y2="159" stroke="#9a4b86" stroke-width="2.2" marker-end="url(#mc-conn-ah-plum)"/>
  <line x1="278" y1="213" x2="652" y2="213" stroke="#9a4b86" stroke-width="2.2" marker-end="url(#mc-conn-ah-plum)"/>
  <line x1="278" y1="267" x2="652" y2="267" stroke="#9a4b86" stroke-width="2.2" stroke-dasharray="7 5" marker-end="url(#mc-conn-ah-plum)"/>
  <rect x="356" y="176" width="188" height="26" rx="5" fill="#f7e7f2" stroke="#9a4b86" stroke-width="1.2"/>
  <text x="450" y="194" text-anchor="middle" font-size="13.5" font-weight="700" fill="#7a3a6a">② 同层对同层搬运</text>

  <!-- Step 3: Split cleanly into V1 vs Layerwise completion protocols -->
  <line x1="20" y1="344" x2="880" y2="344" stroke="#d8d8cf" stroke-width="1.4" stroke-dasharray="6 4"/>
  <text x="20" y="368" font-size="15" font-weight="700" fill="#17211f">③ 完成通知按协议分两条路（不是统一的「最后一层到齐」）</text>

  <!-- Left Branch: V1 (Batch Pull) -->
  <rect x="20" y="382" width="420" height="98" rx="8" fill="#fff4cf" stroke="#c78300" stroke-width="1.5"/>
  <text x="34" y="406" font-size="14.5" font-weight="700" fill="#936300">V1 整批拉：D 读尝试结束 → 分成「释 P」与「判成败」</text>
  <text x="34" y="430" font-size="13.5" fill="#17211f">• D 读完或失败均发通知 → P 收到后才释放源块</text>
  <text x="34" y="452" font-size="13.5" fill="#4d5652">• D 按成败结果推进：成功才开算；失败按 fail / recompute 处理</text>
  <text x="34" y="472" font-size="13.5" font-weight="700" fill="#936300">（若通知丢失，P 源块押至 480 s 超时强放）</text>

  <!-- Right Branch: Layerwise (Push) -->
  <rect x="460" y="382" width="420" height="98" rx="8" fill="#ddf4ef" stroke="#087f73" stroke-width="1.5"/>
  <text x="474" y="406" font-size="14.5" font-weight="700" fill="#065f56">Layerwise 逐层推：P 末层写完回调 → 通知 D 放行</text>
  <text x="474" y="430" font-size="13.5" fill="#17211f">• P 算完一层写一层，最后一层写完后回调通知 D</text>
  <text x="474" y="452" font-size="13.5" fill="#4d5652">• D 仍须等最后一层到齐才把请求放回可调度队列</text>
  <text x="474" y="472" font-size="13.5" font-weight="700" fill="#065f56">（旧 Layerwise 的 P 请求结束即还块，不走 V1 请求级押块）</text>
</svg>
