  <text x="148" y="144.5" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="13" font-weight="700" fill="var(--color-ink, #17211f)" text-anchor="end">逐层推 · P 算</text>
  <path d="M160 154H790" stroke="var(--color-line-strong, #b8bcb5)" stroke-width="1"/>
