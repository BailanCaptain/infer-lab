  <text x="20" y="566" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="12.5" font-weight="400" fill="var(--color-ink-muted, #5b6763)">两条路的终点一样：D 都要等 28 层全到齐才开始 decode。逐层传省下来的是传输时间——它被藏进了 P 算后面那些层的时间里；另一半好处是 D 的块在 P </text>
