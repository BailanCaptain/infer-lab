<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 450" width="900" height="450" role="img" aria-label="连接器做的三件事：先对表，再按层搬，完成通知后 D 才开始算、V1 的 P 也到这时才放源块；块号和层数都是示意。">
  <title>连接器做的三件事：先对表，再按层搬，完成通知后 D 才开始算、V1 的 P 也到这时才放源块；块号和层数都是示意。</title>
  <defs><marker id="mooncake-connector-ah-control" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="var(--color-control, #66716d)"/></marker><marker id="mooncake-connector-ah-comm" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="var(--color-comm, #9a4b86)"/></marker></defs>
  <rect x="20" y="50" width="300" height="330" rx="16" fill="none" stroke="var(--color-line-strong, #b8bcb5)" stroke-width="1.5"/>
  <text x="36" y="38" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="15" font-weight="700" fill="var(--color-ink, #17211f)">P 实例：算完提示词的一方</text>
  <rect x="580" y="50" width="300" height="330" rx="16" fill="none" stroke="var(--color-line-strong, #b8bcb5)" stroke-width="1.5"/>
  <text x="596" y="38" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="15" font-weight="700" fill="var(--color-ink, #17211f)">D 实例：接着生成的一方</text>
  <path d="M345 93 L320 93" fill="none" stroke="var(--color-control, #66716d)" stroke-width="1.4" marker-end="url(#mooncake-connector-ah-control)"/>
  <path d="M555 93 L580 93" fill="none" stroke="var(--color-control, #66716d)" stroke-width="1.4" marker-end="url(#mooncake-connector-ah-control)"/>
  <path d="M286 175 L645 175" fill="none" stroke="var(--color-comm, #9a4b86)" stroke-width="2.2" marker-end="url(#mooncake-connector-ah-comm)"/>
  <path d="M286 231 L645 231" fill="none" stroke="var(--color-comm, #9a4b86)" stroke-width="2.2" marker-end="url(#mooncake-connector-ah-comm)"/>
  <path d="M286 287 L645 287" fill="none" stroke="var(--color-comm, #9a4b86)" stroke-width="2.2" stroke-dasharray="7 5" marker-end="url(#mooncake-connector-ah-comm)"/>
  <path d="M345 346 L320 346" fill="none" stroke="var(--color-control, #66716d)" stroke-width="1.4" marker-end="url(#mooncake-connector-ah-control)"/>
  <path d="M555 346 L580 346" fill="none" stroke="var(--color-control, #66716d)" stroke-width="1.4" marker-end="url(#mooncake-connector-ah-control)"/>
  <rect x="120" y="150" width="80" height="50" rx="4" fill="var(--color-kv-soft, #e8edff)" stroke="var(--color-kv, #4c65b6)" stroke-width="1.4"/>
  <rect x="206" y="150" width="80" height="50" rx="4" fill="var(--color-kv-soft, #e8edff)" stroke="var(--color-kv, #4c65b6)" stroke-width="1.4"/>
  <rect x="120" y="206" width="80" height="50" rx="4" fill="var(--color-kv-soft, #e8edff)" stroke="var(--color-kv, #4c65b6)" stroke-width="1.4"/>
  <rect x="206" y="206" width="80" height="50" rx="4" fill="var(--color-kv-soft, #e8edff)" stroke="var(--color-kv, #4c65b6)" stroke-width="1.4"/>
  <rect x="120" y="262" width="80" height="50" rx="4" fill="var(--color-kv-soft, #e8edff)" stroke="var(--color-kv, #4c65b6)" stroke-width="1.4"/>
  <rect x="206" y="262" width="80" height="50" rx="4" fill="var(--color-kv-soft, #e8edff)" stroke="var(--color-kv, #4c65b6)" stroke-width="1.4"/>
  <text x="110" y="179.5" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="13" font-weight="400" fill="var(--color-ink, #17211f)" text-anchor="end">层 0</text>
  <text x="110" y="235.5" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="13" font-weight="400" fill="var(--color-ink, #17211f)" text-anchor="end">层 1</text>
  <text x="110" y="291.5" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="13" font-weight="400" fill="var(--color-ink, #17211f)" text-anchor="end">层 2</text>
  <text x="160" y="140" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="13" font-weight="400" fill="var(--color-ink-muted, #66716d)" text-anchor="middle">7 号块</text>
  <text x="246" y="140" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="13" font-weight="400" fill="var(--color-ink-muted, #66716d)" text-anchor="middle">12 号块</text>
  <rect x="647" y="150" width="80" height="50" rx="4" fill="var(--color-kv-soft, #e8edff)" stroke="var(--color-kv, #4c65b6)" stroke-width="1.4"/>
  <rect x="733" y="150" width="80" height="50" rx="4" fill="var(--color-kv-soft, #e8edff)" stroke="var(--color-kv, #4c65b6)" stroke-width="1.4"/>
  <rect x="647" y="206" width="80" height="50" rx="4" fill="var(--color-kv-soft, #e8edff)" stroke="var(--color-kv, #4c65b6)" stroke-width="1.4"/>
  <rect x="733" y="206" width="80" height="50" rx="4" fill="var(--color-kv-soft, #e8edff)" stroke="var(--color-kv, #4c65b6)" stroke-width="1.4"/>
  <rect x="647" y="262" width="80" height="50" rx="4" fill="var(--color-surface, #fbfaf6)" stroke="var(--color-kv, #4c65b6)" stroke-opacity="0.45" stroke-width="1.3" stroke-dasharray="4 3"/>
  <rect x="733" y="262" width="80" height="50" rx="4" fill="var(--color-surface, #fbfaf6)" stroke="var(--color-kv, #4c65b6)" stroke-opacity="0.45" stroke-width="1.3" stroke-dasharray="4 3"/>
  <text x="687" y="140" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="13" font-weight="400" fill="var(--color-ink-muted, #66716d)" text-anchor="middle">3 号块</text>
  <text x="773" y="140" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="13" font-weight="400" fill="var(--color-ink-muted, #66716d)" text-anchor="middle">5 号块</text>
  <rect x="345" y="62" width="210" height="62" rx="8" fill="var(--color-control-soft, #f1efe8)" stroke="var(--color-control, #66716d)" stroke-width="1.4"/>
  <text x="450" y="89" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="14" font-weight="700" fill="var(--color-ink, #17211f)" text-anchor="middle">① 两端对表</text>
  <text x="450" y="108" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="13" font-weight="400" fill="var(--color-ink-muted, #66716d)" text-anchor="middle">7→3，12→5，再换成地址</text>
  <rect x="345" y="318" width="210" height="56" rx="8" fill="var(--color-control-soft, #f1efe8)" stroke="var(--color-control, #66716d)" stroke-width="1.4"/>
  <text x="450" y="342" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="14" font-weight="700" fill="var(--color-ink, #17211f)" text-anchor="middle">③ 最后一层到齐</text>
  <text x="450" y="361" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="13" font-weight="400" fill="var(--color-ink-muted, #66716d)" text-anchor="middle">发完成通知，两端各自继续</text>
  <text x="450" y="26" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="13.5" font-weight="700" fill="var(--color-ink, #17211f)" text-anchor="middle">先对好块号，再按层把历史搬过去</text>
  <text x="466" y="206" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="13.5" font-weight="400" fill="#7a3a6a" text-anchor="middle">② 同一层对同一层地搬</text>
  <text x="170" y="362" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="13.5" font-weight="400" fill="var(--color-ink-muted, #66716d)" text-anchor="middle" font-style="italic">源块：这条请求在 P 上的历史</text>
  <text x="730" y="362" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="13.5" font-weight="400" fill="var(--color-ink-muted, #66716d)" text-anchor="middle" font-style="italic">目的块先分好，再等数据</text>
  <text x="450" y="410" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="13.5" font-weight="400" fill="var(--color-ink-muted, #66716d)" text-anchor="middle" font-style="italic">V1：P 全部层算完，D 一次读回；Layerwise：P 算完一层就写一层</text>
</svg>
