  <text x="148" y="106.5" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="13" font-weight="700" fill="var(--color-ink, #17211f)" text-anchor="end">整块拉 · 搬</text>
  <path d="M160 116H790" stroke="var(--color-line-strong, #b8bcb5)" stroke-width="1"/>
