layout: figure
id: mooncake-connector
caption: 整块拉要等 P 节点 28 层全算完才开始搬；逐层推把前 27 层的搬运藏进 P 还在算的时间里。两条路 D 节点都要等 28 层到齐（示意，搬运时长按每层四分之一层计算时间画）
size: [900, 250]

timelines:
  - at: [30, 50]
    scale: 18
    start: 0
    end: 35
    ticks: 7
    unit: 层的计算时间
    labelW: 130
    lanes:
      - label: 整块拉 · P 算
        spans:
          - { from: 0, to: 28, tone: token, style: faded }
      - label: 整块拉 · 搬
        spans:
          - { from: 28, to: 35, tone: comm, text: D 一次读走 28 层 }
      - label: 逐层推 · P 算
        spans:
          - { from: 0, to: 28, tone: token, style: faded }
      - label: 逐层推 · 搬
        spans:
          - { from: 1, to: 28.25, tone: comm, text: P 每算完一层就推一层 }
    marks:
      - { t: 28.25, label: 逐层推：到齐 }
      - { t: 35, label: 整块拉：到齐 }

pins:
  - source: vllm-ascend@2c59ff10:vllm_ascend/distributed/kv_transfer/kv_p2p/mooncake_connector.py#L962-L969
    symbols: [batch_transfer_sync_read]
