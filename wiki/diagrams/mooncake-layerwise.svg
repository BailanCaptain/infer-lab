  <path d="M330 328v5" stroke="var(--color-ink, #17211f)" stroke-width="1.3"/>
  <text x="330" y="348" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="12" font-weight="400" fill="var(--color-ink-muted, #66716d)" text-anchor="middle">1</text>
  <path d="M480 328v5" stroke="var(--color-ink, #17211f)" stroke-width="1.3"/>
