<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 400" width="900" height="400" role="img" aria-label="同样三层、同样的字节，两种搬法的时间线（示意：每层计算 1 个时间单位，每层传输 0.5 个单位，假设传输不和别的流量抢链路）。上面是默认的 V1：P 三层都算完、请求结束，D 才一次读回三层，到齐在 4.5。下面是 Layerwise：D 在 P 开算之前就分好了目的块，P 每算完一层就把这一层写过去，前两层的传输藏进了 P 算后面几层的时间里，到齐在 3.5。最后一层的传输两种做法都省不掉，D 也都要等三层到齐才开始 decode。">
  <title>同样三层、同样的字节，两种搬法的时间线（示意：每层计算 1 个时间单位，每层传输 0.5 个单位，假设传输不和别的流量抢链路）。上面是默认的 V1：P 三层都算完、请求结束，D 才一次读回三层，到齐在 4.5。下面是 Layerwise：D 在 P 开算之前就分好了目的块，P 每算完一层就把这一层写过去，前两层的传输藏进了 P 算后面几层的时间里，到齐在 3.5。最后一层的传输两种做法都省不掉，D 也都要等三层到齐才开始 decode。</title>
