layout: figure
id: mooncake-layerwise
caption: 同样三层、同样的字节，两种搬法的时间线（示意：每层计算 1 个时间单位，每层传输 0.5 个单位，假设传输不和别的流量抢链路）。上面是本页基线 V1：P 三层都算完、请求结束，D 才一次读回三层，到齐在 4.5。下面是 Layerwise：D 在 P 开算之前就分好了目的块，P 每算完一层就把这一层写过去，前两层的传输藏进了 P 算后面几层的时间里，到齐在 3.5。最后一层的传输两种做法都省不掉，D 也都要等三层到齐才开始 decode。
size: [900, 400]
timelines:
  - at: [30, 70]
    scale: 150
    start: 0
    end: 4.5
    ticks: 1
    labelW: 150
    laneH: 32
    gap: 12
    lanes:
      - label: V1 · P 计算
        spans:
          - { from: 0, to: 1, tone: token, text: 层 0 }
          - { from: 1, to: 2, tone: token, text: 层 1 }
          - { from: 2, to: 3, tone: token, text: 层 2 }
      - label: V1 · D 读取
        spans:
          - { from: 3, to: 4.5, tone: comm, text: 三层一起读 }
    marks:
      - { t: 4.5, label: 到齐 }
  - at: [30, 240]
    scale: 150
    start: 0
    end: 4.5
    ticks: 1
    labelW: 150
    laneH: 32
    gap: 12
    lanes:
      - label: Layerwise · P 计算
        spans:
          - { from: 0, to: 1, tone: token, text: 层 0 }
          - { from: 1, to: 2, tone: token, text: 层 1 }
          - { from: 2, to: 3, tone: token, text: 层 2 }
      - label: Layerwise · P 写到 D
        spans:
          - { from: 1, to: 1.5, tone: comm, text: 层 0 }
          - { from: 2, to: 2.5, tone: comm, text: 层 1 }
          - { from: 3, to: 3.5, tone: comm, text: 层 2 }
    marks:
      - { t: 3.5, label: 到齐 }
texts:
  - { at: [30, 44], text: 整批拉：P 全部算完，D 才开始读, strong: true }
  - { at: [30, 214], text: 逐层推：P 算完一层就写一层, strong: true }
  - { at: [450, 384], text: 省下的是前两层的传输；最后一层照样要等, anchor: middle, note: true }
