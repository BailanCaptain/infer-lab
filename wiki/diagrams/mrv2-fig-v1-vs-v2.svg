<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 470" width="900" height="470" role="img" aria-label="MRV1 每步宿主重排全量拷贝 vs MRV2 常驻设备缓冲与索引异步写入几何对照" font-family="var(--font-sans)">
  <title>Model Runner V1 宿主整排搬运 vs Model Runner V2 常驻设备缓冲与零拷贝视图几何对照</title>
  <desc>Architectural memory-layout comparison: MRV1 CPU full-row reshuffle and H2D copy vs MRV2 UVA RequestState, async idx_mapping H2D, pre-allocated NPU AscendInputBuffers with +2 FIA tail slots, and Triton AscendBlockTables</desc>
  <defs>
    <marker id="mv-arr-red" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="#b54237"/>
    </marker>
    <marker id="mv-arr-teal" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="#087f73"/>
    </marker>
    <marker id="mv-arr-indigo" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="#4c65b6"/>
    </marker>
  </defs>

  <line x1="436" y1="14" x2="436" y2="456" stroke="#b8bcb5" stroke-width="1.5" stroke-dasharray="6 4"/>

  <!-- LEFT: MRV1 -->
  <circle cx="28" cy="28" r="12" fill="#b54237"/>
  <text x="28" y="33" text-anchor="middle" font-size="13.5" font-weight="700" fill="#ffffff">1</text>
  <text x="48" y="34" font-size="16" font-weight="700" fill="#17211f">MRV1（v0.30.0 默认 · main 已删）</text>
  <text x="16" y="54" font-size="13.5" fill="#66716d">Host 逐组重建输入张量 + 活跃块表非阻塞 H2D</text>

  <!-- Host Zone Left -->
  <rect x="16" y="68" width="400" height="162" rx="7" fill="#fff4cf" fill-opacity="0.45" stroke="#c78300" stroke-width="1.3"/>
  <text x="28" y="90" font-size="13.5" font-weight="700" fill="#936300">HOST CPU · NPUInputBatch（全量请求表）</text>
  <rect x="28" y="102" width="376" height="44" rx="5" fill="#ffffff" stroke="#c78300" stroke-width="1.2"/>
  <text x="216" y="129" text-anchor="middle" font-size="13.5" fill="#17211f">_update_states：删/补/压紧空行 + 整行重排</text>
  <rect x="28" y="156" width="376" height="60" rx="5" fill="#fff0e9" stroke="#b54237" stroke-width="1.3"/>
  <text x="216" y="180" text-anchor="middle" font-size="14" font-weight="700" fill="#8f3229">_prepare_inputs（Host 逐组重建）</text>
  <text x="216" y="202" text-anchor="middle" font-size="13.5" fill="#4d5652">重建输入张量 + copy_to_gpu(num_reqs) 非阻塞拷</text>

  <!-- Heavy H2D Barrier Arrow -->
  <line x1="216" y1="232" x2="216" y2="274" stroke="#b54237" stroke-width="2.6" marker-end="url(#mv-arr-red)"/>
  <rect x="92" y="238" width="248" height="24" rx="12" fill="#b54237"/>
  <text x="216" y="255" text-anchor="middle" font-size="13.5" font-weight="700" fill="#ffffff">Host 逐组重建与重排开销</text>

  <!-- Device Zone Left -->
  <rect x="16" y="278" width="400" height="84" rx="7" fill="#ece9df" stroke="#b8bcb5" stroke-width="1.3"/>
  <text x="28" y="302" font-size="14" font-weight="700" fill="#17211f">NPU 设备侧（紧耦合单体）</text>
  <text x="28" y="326" font-size="13.5" fill="#4d5652">旧 DYNAMIC_EPLB 独立控面；已支持共享 KV 底板</text>
  <text x="28" y="348" font-size="13.5" fill="#8f3229">不支持 PCP / 路由专家回传 / CPP 异步调度</text>

  <rect x="16" y="378" width="400" height="72" rx="7" fill="#fff0e9" stroke="#d88c82" stroke-width="1.2"/>
  <text x="28" y="404" font-size="14" font-weight="700" fill="#8f3229">版本去向：main 分支已物理删除</text>
  <text x="28" y="428" font-size="13.5" fill="#4d5652">v0.30.0 仍默认；main 设 =0 直接抛 ValueError</text>

  <!-- RIGHT: MRV2 -->
  <circle cx="468" cy="28" r="12" fill="#087f73"/>
  <text x="468" y="33" text-anchor="middle" font-size="13.5" font-weight="700" fill="#ffffff">2</text>
  <text x="488" y="34" font-size="16" font-weight="700" fill="#17211f">MRV2（v0.30.0 可选 · main 唯一）</text>
  <text x="456" y="54" font-size="13.5" fill="#66716d">薄继承上游 GPUModelRunner，模块化拆分 worker/v2/</text>

  <!-- Host / UVA Zone Right -->
  <rect x="456" y="68" width="428" height="90" rx="7" fill="#ddf4ef" fill-opacity="0.45" stroke="#087f73" stroke-width="1.3"/>
  <text x="468" y="90" font-size="14" font-weight="700" fill="#065f56">HOST / UVA · 持久 InputBatch / RequestState 增量更新</text>
  <rect x="468" y="102" width="194" height="44" rx="5" fill="#ffffff" stroke="#087f73" stroke-width="1.2"/>
  <text x="565" y="122" text-anchor="middle" font-size="13.5" font-weight="700" fill="#065f56">all_token_ids → UVA</text>
  <text x="565" y="140" text-anchor="middle" font-size="13.5" fill="#4d5652">固定行不搬动，省显存</text>
  <rect x="674" y="102" width="198" height="44" rx="5" fill="#ffffff" stroke="#4c65b6" stroke-width="1.2"/>
  <text x="773" y="122" text-anchor="middle" font-size="13.5" font-weight="700" fill="#3a4f93">torch.from_numpy 视图</text>
  <text x="773" y="140" text-anchor="middle" font-size="13.5" fill="#4d5652">零拷贝共享长度给 CPU</text>

  <!-- Lightweight async H2D arrow -->
  <line x1="670" y1="160" x2="670" y2="196" stroke="#087f73" stroke-width="2" marker-end="url(#mv-arr-teal)"/>
  <rect x="490" y="164" width="360" height="24" rx="12" fill="#087f73"/>
  <text x="670" y="181" text-anchor="middle" font-size="13.5" font-weight="700" fill="#ffffff">上传步内边界索引（query_start_loc 等）</text>

  <!-- NPU Pre-allocated Persistent Buffers Right -->
  <rect x="456" y="200" width="428" height="162" rx="7" fill="#e8edff" fill-opacity="0.5" stroke="#4c65b6" stroke-width="1.4"/>
  <text x="468" y="224" font-size="14" font-weight="700" fill="#3a4f93">NPU 常驻预分配缓冲（固定地址天然契合 ACL Graph）</text>

  <!-- AscendInputBuffers with explicit +2 FIA tail cells -->
  <rect x="468" y="236" width="228" height="72" rx="5" fill="#ffffff" stroke="#4c65b6" stroke-width="1.3"/>
  <text x="478" y="256" font-size="13.5" font-weight="700" fill="#3a4f93">AscendInputBuffers</text>
  <!-- Visual query_start_loc cells showing +2 FIA tail -->
  <rect x="478" y="266" width="128" height="28" rx="3" fill="#e8edff" stroke="#4c65b6"/>
  <text x="542" y="285" text-anchor="middle" font-size="13.5" font-family="var(--font-mono)" fill="#3a4f93">q_loc[max_req]</text>
  <rect x="610" y="266" width="76" height="28" rx="3" fill="#fff4cf" stroke="#c78300" stroke-width="1.4"/>
  <text x="648" y="285" text-anchor="middle" font-size="13.5" font-weight="700" fill="#936300">+2 FIA</text>

  <!-- AscendBlockTables Triton -->
  <rect x="706" y="236" width="166" height="72" rx="5" fill="#ddf4ef" stroke="#087f73" stroke-width="1.3"/>
  <text x="789" y="258" text-anchor="middle" font-size="13.5" font-weight="700" fill="#065f56">AscendBlockTables</text>
  <text x="789" y="280" text-anchor="middle" font-size="13.5" fill="#4d5652">Triton 核聚合块表</text>
  <text x="789" y="299" text-anchor="middle" font-size="13.5" font-family="var(--font-mono)" fill="#065f56">就地算 slot_map</text>

  <rect x="468" y="318" width="404" height="34" rx="5" fill="#fff4cf" stroke="#c78300" stroke-width="1.2"/>
  <text x="670" y="340" text-anchor="middle" font-size="12" font-weight="700" fill="#936300">标准化共享 KV 底板（连续 K/V + 2 MiB 对齐，与 V1 共用基座）</text>

  <!-- Capability Footer Right -->
  <rect x="456" y="378" width="428" height="72" rx="7" fill="#ddf4ef" stroke="#087f73" stroke-width="1.3"/>
  <text x="468" y="404" font-size="14" font-weight="700" fill="#065f56">高阶特性底座（全部按模块化子组件挂载）</text>
  <text x="468" y="428" font-size="13.5" fill="#4d5652">PCP · 上游控面 EPLB · CPP 异步 · 路由专家回传 · DSV4.1 A5</text>
</svg>
