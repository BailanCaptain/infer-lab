id: mrv2-fig-v1-vs-v2
caption: >-
  Model Runner V1 与 Model Runner V2 的状态持有与每步输入流转对比：V1 每步由 Host 侧 NPUInputBatch 重整并搬运输入，而 V2 通过常驻设备侧 AscendInputBuffers 与 UVA/零拷贝共享的 AscendRequestState 直接切片更新，并在 main（8d6180e2）统一替代 V1。
