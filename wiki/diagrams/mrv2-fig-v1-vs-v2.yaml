mode: native-svg
id: mrv2-fig-v1-vs-v2
caption: >-
  Model Runner V1 与 V2 内存布局与数据流对照：左侧 MRV1 在 Host 侧逐组重建输入张量并经 copy_to_gpu 非阻塞拷贝活跃块表（已支持共享 KV 底板）；右侧 MRV2 以 UVA 持久 InputBatch/RequestState 增量更新、上传步内边界索引（query_start_loc 等），并在 NPU 常驻预分配 AscendInputBuffers（含 FIA +2 尾位）与 Triton AscendBlockTables 上就地聚合计算。
