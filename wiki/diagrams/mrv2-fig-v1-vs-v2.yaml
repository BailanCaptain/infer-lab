  - source: vllm-ascend@c09d3e20:vllm_ascend/worker/v2/states.py#L24-L46
    symbols: [AscendRequestState, num_computed_tokens_cpu]
  - source: vllm-ascend@c09d3e20:vllm_ascend/worker/v2/model_runner.py#L135-L170
    symbols: [NPUModelRunner, GPUModelRunner, supports_standardized_shared_kv_backing]
