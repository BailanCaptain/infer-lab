<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 410" width="900" height="410" role="img" aria-label="上游 v0.30.0、Ascend v0.30.0 与 Ascend main 三条 MRV2 切换决策路径对比" font-family="var(--font-sans)">
  <title>VLLM_USE_V2_MODEL_RUNNER 跨仓与跨版决策对比：上游自动开 vs Ascend v0.30.0 默认关 vs main 强制唯一</title>
  <desc>Three-column decision comparison across upstream vLLM v0.30.0 (auto-True with Triton), vLLM Ascend v0.30.0 (patched default-False plus 5 mandatory MRV2 gates), and vLLM Ascend main (V1 deleted, =0 raises ValueError)</desc>

  <text x="16" y="28" font-size="16" font-weight="700" fill="#17211f">别把上游逻辑套到昇腾：三条 use_v2_model_runner 开关决策对照</text>
  <text x="884" y="28" text-anchor="end" font-size="13.5" fill="#66716d">未设置环境变量时的真实行为</text>

  <!-- Col 1: Upstream v0.30.0 -->
  <rect x="16" y="48" width="276" height="196" rx="8" fill="#e8edff" stroke="#4c65b6" stroke-width="1.3"/>
  <rect x="28" y="60" width="252" height="32" rx="5" fill="#4c65b6"/>
  <text x="154" y="81" text-anchor="middle" font-size="14" font-weight="700" fill="#ffffff">上游 vLLM v0.30.0</text>
  <text x="154" y="116" text-anchor="middle" font-size="14.5" font-weight="700" fill="#3a4f93">未设变量 → 自动 True</text>
  <text x="30" y="144" font-size="13.5" fill="#4d5652">条件：HAS_TRITON = True 且</text>
  <text x="30" y="166" font-size="13.5" fill="#4d5652">未触发 MRV2 不支持特性清单</text>
  <rect x="28" y="186" width="252" height="44" rx="5" fill="#ffffff" stroke="#4c65b6" stroke-width="1.1"/>
  <text x="154" y="206" text-anchor="middle" font-size="13.5" font-weight="700" fill="#8f3229">注意：Ascend v0.30.0</text>
  <text x="154" y="224" text-anchor="middle" font-size="13.5" fill="#4d5652">用补丁屏蔽了这条自动开启！</text>

  <!-- Col 2: Ascend v0.30.0 -->
  <rect x="312" y="48" width="276" height="196" rx="8" fill="#fff4cf" stroke="#c78300" stroke-width="1.5"/>
  <rect x="324" y="60" width="252" height="32" rx="5" fill="#c78300"/>
  <text x="450" y="81" text-anchor="middle" font-size="14" font-weight="700" fill="#ffffff">vLLM Ascend v0.30.0（主基线）</text>
  <text x="450" y="116" text-anchor="middle" font-size="14.5" font-weight="700" fill="#936300">未设变量 → 显式 False（MRV1）</text>
  <text x="326" y="144" font-size="13.5" fill="#4d5652">由 patch_use_v2_model_runner</text>
  <text x="326" y="166" font-size="13.5" fill="#4d5652">覆写为纯读环境变量开关</text>
  <rect x="324" y="186" width="252" height="44" rx="5" fill="#ffffff" stroke="#c78300" stroke-width="1.2"/>
  <text x="450" y="206" text-anchor="middle" font-size="13.5" font-weight="700" font-family="var(--font-mono)" fill="#065f56">export VLLM_USE_V2...=1</text>
  <text x="450" y="224" text-anchor="middle" font-size="13.5" fill="#4d5652">才切到 worker/v2/model_runner</text>

  <!-- Col 3: Ascend main -->
  <rect x="608" y="48" width="276" height="196" rx="8" fill="#ddf4ef" stroke="#087f73" stroke-width="1.5"/>
  <rect x="620" y="60" width="252" height="32" rx="5" fill="#087f73"/>
  <text x="746" y="81" text-anchor="middle" font-size="14" font-weight="700" fill="#ffffff">vLLM Ascend main (8d6180e2)</text>
  <text x="746" y="116" text-anchor="middle" font-size="14.5" font-weight="700" fill="#065f56">恒定 True · MRV1 物理删除</text>
  <text x="622" y="144" font-size="13.5" fill="#4d5652">mrv2_utils.py 锁定为唯一路径，</text>
  <text x="622" y="166" font-size="13.5" fill="#4d5652">纯多模态编码器走 MMEncoder</text>
  <rect x="620" y="186" width="252" height="44" rx="5" fill="#fff0e9" stroke="#b54237" stroke-width="1.3"/>
  <text x="746" y="206" text-anchor="middle" font-size="13.5" font-weight="700" fill="#8f3229">旧脚本残留 =0 直接抛错！</text>
  <text x="746" y="224" text-anchor="middle" font-size="13.5" fill="#4d5652">ValueError（不再静默忽略）</text>

  <!-- Bottom: 5 Mandatory MRV2 Gates in v0.30.0 -->
  <line x1="16" y1="264" x2="884" y2="264" stroke="#b8bcb5" stroke-width="1.4" stroke-dasharray="6 4"/>
  <text x="16" y="292" font-size="15.5" font-weight="700" fill="#8f3229">v0.30.0 下未导出 =1 即启动报错（ValueError）的五类硬性场景：</text>

  <rect x="16" y="308" width="164" height="84" rx="6" fill="#fff0e9" stroke="#b54237" stroke-width="1.2"/>
  <text x="98" y="334" text-anchor="middle" font-size="14" font-weight="700" fill="#8f3229">1. PCP &gt; 1</text>
  <text x="98" y="358" text-anchor="middle" font-size="13.5" fill="#4d5652">预填充上下文并行</text>
  <text x="98" y="378" text-anchor="middle" font-size="13.5" fill="#66716d">MRV1 无支持</text>

  <rect x="192" y="308" width="164" height="84" rx="6" fill="#fff0e9" stroke="#b54237" stroke-width="1.2"/>
  <text x="274" y="334" text-anchor="middle" font-size="14" font-weight="700" fill="#8f3229">2. DSV4.1 (A5)</text>
  <text x="274" y="358" text-anchor="middle" font-size="13.5" fill="#4d5652">DeepseekV41 /</text>
  <text x="274" y="378" text-anchor="middle" font-size="13.5" fill="#66716d">DSpark 昇腾 950</text>

  <rect x="368" y="308" width="164" height="84" rx="6" fill="#fff0e9" stroke="#b54237" stroke-width="1.2"/>
  <text x="450" y="334" text-anchor="middle" font-size="14" font-weight="700" fill="#8f3229">3. 路由回传 (R3)</text>
  <text x="450" y="358" text-anchor="middle" font-size="13.5" fill="#4d5652">enable_return_</text>
  <text x="450" y="378" text-anchor="middle" font-size="13.5" fill="#66716d">routed_experts</text>

  <rect x="544" y="308" width="164" height="84" rx="6" fill="#fff0e9" stroke="#b54237" stroke-width="1.2"/>
  <text x="626" y="334" text-anchor="middle" font-size="14" font-weight="700" fill="#8f3229">4. CPP + 异步</text>
  <text x="626" y="358" text-anchor="middle" font-size="13.5" fill="#4d5652">profiling_chunk</text>
  <text x="626" y="378" text-anchor="middle" font-size="13.5" fill="#66716d">+ async_sched</text>

  <rect x="720" y="308" width="164" height="84" rx="6" fill="#fff0e9" stroke="#b54237" stroke-width="1.2"/>
  <text x="802" y="334" text-anchor="middle" font-size="14" font-weight="700" fill="#8f3229">5. 新控面 EPLB</text>
  <text x="802" y="358" text-anchor="middle" font-size="13.5" fill="#4d5652">--enable-eplb 配</text>
  <text x="802" y="378" text-anchor="middle" font-size="13.5" fill="#66716d">phase / stair</text>
</svg>
