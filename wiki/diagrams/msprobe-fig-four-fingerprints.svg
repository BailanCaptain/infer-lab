<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 436" width="900" height="436" role="img" aria-label="msprobe 定位到的四类高频首分歧算子指纹图：RoPE 旋转偏移、QuantMatmul 缩放漂移、MoE 专家分叉与 FlashAttention Decode 发散" font-family="var(--font-sans)">
  <title>四类高频首分歧算子的张量与步骤指纹速查图</title>
  <desc>2x2 geometric fingerprint diagrams for the 4 most common first-divergence ops: RoPE layer-0 Q/K rotation drop, QuantMatmul scale/NZ amplitude drift, MoE top-k routing fork or zeroed EP rows, and FlashAttention step-0 aligned vs step-1 decode KV divergence</desc>
  <defs>
    <marker id="fp-arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="#4d5652"/>
    </marker>
    <marker id="fp-red" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="#b54237"/>
    </marker>
  </defs>

  <text x="16" y="26" font-size="16" font-weight="700" fill="#17211f">抓到首分歧算子后先对指纹：四类高频底层落点与首查项</text>

  <!-- Card 1 (Top-Left): RoPE -->
  <rect x="16" y="44" width="424" height="180" rx="8" fill="#ffffff" stroke="#4c65b6" stroke-width="1.5"/>
  <text x="30" y="70" font-size="14.5" font-weight="700" fill="#3a4f93">① RoPE（第 0 层旋转位置编码后立刻偏离）</text>
  <!-- Mini flow: Q/K proj OK -> [RoPE cos/sin] -> Error! -->
  <rect x="30" y="88" width="112" height="42" rx="5" fill="#ddf4ef" stroke="#087f73" stroke-width="1.3"/>
  <text x="86" y="106" text-anchor="middle" font-size="13.5" font-weight="700" fill="#065f56">L0 Q/K 投影</text>
  <text x="86" y="123" text-anchor="middle" font-size="13.5" fill="#065f56">完全对齐 ✓</text>
  <line x1="142" y1="109" x2="164" y2="109" stroke="#4d5652" stroke-width="1.4" marker-end="url(#fp-arr)"/>
  <rect x="166" y="88" width="112" height="42" rx="5" fill="#e8edff" stroke="#4c65b6" stroke-width="1.5"/>
  <text x="222" y="106" text-anchor="middle" font-size="13.5" font-weight="700" fill="#3a4f93">RoPE 旋转</text>
  <text x="222" y="123" text-anchor="middle" font-family="var(--font-mono)" font-size="13.5" fill="#3a4f93">cos / sin</text>
  <line x1="278" y1="109" x2="300" y2="109" stroke="#b54237" stroke-width="1.5" marker-end="url(#fp-red)"/>
  <rect x="302" y="88" width="124" height="42" rx="5" fill="#fff0e9" stroke="#b54237" stroke-width="1.5"/>
  <text x="364" y="106" text-anchor="middle" font-size="13.5" font-weight="700" fill="#8f3229">首层即大误差</text>
  <text x="364" y="123" text-anchor="middle" font-size="13.5" fill="#8f3229">✗ 立刻分叉</text>
  <text x="30" y="158" font-size="13.5" fill="#17211f">首查：<tspan font-family="var(--font-mono)">positions</tspan> 索引、<tspan font-family="var(--font-mono)">update_cos_sin</tspan> 缓存</text>
  <text x="30" y="182" font-size="13.5" fill="#4d5652">核对交错（interleave）vs 分段旋转排布是否匹配权重</text>
  <text x="30" y="208" font-size="13.5" font-weight="700" fill="#3a4f93">特征：往往在 Layer 0、step 0 就已暴露</text>

  <!-- Card 2 (Top-Right): QuantMatmul -->
  <rect x="460" y="44" width="424" height="180" rx="8" fill="#ffffff" stroke="#c78300" stroke-width="1.5"/>
  <text x="474" y="70" font-size="14.5" font-weight="700" fill="#936300">② QuantMatmul（输入对齐，输出缩放倍数漂移）</text>
  <!-- Visual amplitude comparison bars: Ref vs Drifted -->
  <text x="474" y="102" font-size="13.5" fill="#065f56">标杆输出幅值</text>
  <rect x="572" y="87" width="176" height="20" rx="4" fill="#ddf4ef" stroke="#087f73" stroke-width="1.3"/>
  <text x="758" y="102" font-family="var(--font-mono)" font-size="13.5" fill="#065f56">norm = 1.0×</text>

  <text x="474" y="132" font-size="13.5" fill="#8f3229">待测量化输出</text>
  <rect x="572" y="117" width="268" height="20" rx="4" fill="#fff0e9" stroke="#b54237" stroke-width="1.5"/>
  <text x="706" y="132" text-anchor="middle" font-size="13.5" font-weight="700" fill="#8f3229">整体倍率漂移 / 局部截断</text>

  <text x="474" y="162" font-size="13.5" fill="#17211f">首查：权重 <tspan font-family="var(--font-mono)">scale / offset</tspan>、<tspan font-family="var(--font-mono)">weight_nz_mode</tspan></text>
  <text x="474" y="186" font-size="13.5" fill="#4d5652">核对 <tspan font-family="var(--font-mono)">quant_description</tspan>（<tspan font-family="var(--font-mono)">W8A8</tspan> vs <tspan font-family="var(--font-mono)">W8A8_DYNAMIC</tspan>）</text>
  <text x="474" y="210" font-size="13.5" font-weight="700" fill="#936300">特征：进入线性层前一致，出线性层即偏移</text>

  <!-- Card 3 (Bottom-Left): MoE -->
  <rect x="16" y="240" width="424" height="182" rx="8" fill="#ffffff" stroke="#9a4b86" stroke-width="1.5"/>
  <text x="30" y="266" font-size="14.5" font-weight="700" fill="#7a3a6a">③ MoE 路由与融合专家（索引分叉或个别行全零）</text>
  <!-- Gate OK -> Forking Top-K / Zeroed row -->
  <rect x="30" y="284" width="112" height="42" rx="5" fill="#ddf4ef" stroke="#087f73" stroke-width="1.3"/>
  <text x="86" y="302" text-anchor="middle" font-size="13.5" font-weight="700" fill="#065f56">Gate logits</text>
  <text x="86" y="319" text-anchor="middle" font-size="13.5" fill="#065f56">一致 ✓</text>
  <line x1="142" y1="305" x2="164" y2="305" stroke="#4d5652" stroke-width="1.4" marker-end="url(#fp-arr)"/>
  <rect x="166" y="284" width="118" height="42" rx="5" fill="#f7e7f2" stroke="#9a4b86" stroke-width="1.5"/>
  <text x="225" y="302" text-anchor="middle" font-size="13.5" font-weight="700" fill="#7a3a6a">Top-K / EP</text>
  <text x="225" y="319" text-anchor="middle" font-size="13.5" fill="#7a3a6a">Dispatch/Comb</text>
  <line x1="284" y1="305" x2="306" y2="305" stroke="#b54237" stroke-width="1.5" marker-end="url(#fp-red)"/>
  <rect x="308" y="284" width="118" height="42" rx="5" fill="#fff0e9" stroke="#b54237" stroke-width="1.5"/>
  <text x="367" y="302" text-anchor="middle" font-size="13.5" font-weight="700" fill="#8f3229">选错专家</text>
  <text x="367" y="319" text-anchor="middle" font-size="13.5" fill="#8f3229">或某行全零</text>
  <text x="30" y="354" font-size="13.5" fill="#17211f">首查：门控精度、并列打平、EPLB 物理专家映射</text>
  <text x="30" y="378" font-size="13.5" fill="#4d5652">快筛：<tspan font-family="var(--font-mono)">VLLM_BATCH_INVARIANT=1</tspan> 关自定义核复验</text>
  <text x="30" y="404" font-size="13.5" font-weight="700" fill="#7a3a6a">注意：关核正常须再分「自定义核 bug」vs「批漂移」</text>

  <!-- Card 4 (Bottom-Right): FlashAttention / PagedAttention -->
  <rect x="460" y="240" width="424" height="182" rx="8" fill="#ffffff" stroke="#087f73" stroke-width="1.5"/>
  <text x="474" y="266" font-size="14.5" font-weight="700" fill="#065f56">④ FlashAttention / PagedAttn（首步对，Decode 散）</text>
  <!-- Step 0 OK -> KV Cache Write/Read -> Step 1 Diverge! -->
  <rect x="474" y="284" width="118" height="42" rx="5" fill="#ddf4ef" stroke="#087f73" stroke-width="1.3"/>
  <text x="533" y="302" text-anchor="middle" font-size="13.5" font-weight="700" fill="#065f56">step 0 Prefill</text>
  <text x="533" y="319" text-anchor="middle" font-size="13.5" fill="#065f56">全层对齐 ✓</text>
  <line x1="592" y1="305" x2="614" y2="305" stroke="#4d5652" stroke-width="1.4" marker-end="url(#fp-arr)"/>
  <rect x="616" y="284" width="114" height="42" rx="5" fill="#e8edff" stroke="#4c65b6" stroke-width="1.4"/>
  <text x="673" y="302" text-anchor="middle" font-size="13.5" font-weight="700" fill="#3a4f93">读写 KV 块</text>
  <text x="673" y="319" text-anchor="middle" font-family="var(--font-mono)" font-size="13.5" fill="#3a4f93">slot / C8</text>
  <line x1="730" y1="305" x2="752" y2="305" stroke="#b54237" stroke-width="1.5" marker-end="url(#fp-red)"/>
  <rect x="754" y="284" width="116" height="42" rx="5" fill="#fff0e9" stroke="#b54237" stroke-width="1.5"/>
  <text x="812" y="302" text-anchor="middle" font-size="13.5" font-weight="700" fill="#8f3229">step 1 Decode</text>
  <text x="812" y="319" text-anchor="middle" font-size="13.5" fill="#8f3229">逐步发散 ✗</text>
  <text x="474" y="354" font-size="13.5" fill="#17211f">首查：<tspan font-family="var(--font-mono)">slot_mapping</tspan>、块表偏移、C8 KV 缩放还原</text>
  <text x="474" y="378" font-size="13.5" fill="#4d5652">对照：Eager vs <tspan font-family="var(--font-mono)">FULL_DECODE_ONLY</tspan> 下的 FIA 填充</text>
  <text x="474" y="404" font-size="13.5" font-weight="700" fill="#065f56">特征：只读历史 KV 后才分叉，高度锁定缓存路径</text>
</svg>
