    symbols: [_merge_multimodal_embeddings, inputs_embeds, multimodal_embeddings, is_multimodal]
  - source: vllm@ced6857a:vllm/model_executor/models/vision.py#L295-L325
    symbols: [run_dp_sharded_vision_model, tensor_model_parallel_all_gather]
  - source: vllm-ascend@c09d3e20:vllm_ascend/ops/rotary_embedding.py#L601-L683
