<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 490" width="900" height="490" role="img" aria-label="ScoreEncoderCacheManager 两级编码器缓存三态流转、评分公式以及 NPU 常驻池 promote_percentile 20% 门槛与 watermark 20% 水位标尺图">
  <title>ScoreEncoderCacheManager 两级缓存流转与 NPU 评分水位标尺</title>
  <desc>上半部分展示 ViT 新算嵌入落入 pinned CPU 大池与请求存续期暂存的 tmp_encoder_cache（无活跃请求引用该 mm_hash 即释），二次命中在空槽足够或不含 clock 得分 ≥ promote_percentile 门槛时于当前 NPU 流经 non_blocking H2D 晋升至常驻池；下半部分展示按分升序标尺、watermark=20% 预留水位及 torch.npu.Event 追踪拷贝完成与源缓冲寿命机制。</desc>
  <defs>
    <marker id="arr-t" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse">
      <path d="M 1 1.5 L 8.5 5 L 1 8.5 z" fill="#087f73" />
    </marker>
    <marker id="arr-a" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse">
      <path d="M 1 1.5 L 8.5 5 L 1 8.5 z" fill="#c78300" />
    </marker>
    <marker id="arr-i" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse">
      <path d="M 1 1.5 L 8.5 5 L 1 8.5 z" fill="#4c65b6" />
    </marker>
    <marker id="arr-r" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse">
      <path d="M 1 1.5 L 8.5 5 L 1 8.5 z" fill="#b54237" />
    </marker>
    <marker id="arr-m" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse">
      <path d="M 1 1.5 L 8.5 5 L 1 8.5 z" fill="#66716d" />
    </marker>
  </defs>

  <!-- ================= TOP BAND: 3-State Flow ================= -->
  <text x="20" y="28" font-family="system-ui, -apple-system, sans-serif" font-size="16" font-weight="700" fill="#17211f">1. ScoreEncoderCacheManager 三态流转（CPU 池 · 临时槽 · NPU 常驻池）</text>

  <!-- Node 1: ViT Fresh Encode -->
  <rect x="20" y="54" width="154" height="106" rx="8" fill="#fff4cf" stroke="#c78300" stroke-width="1.6" />
  <text x="97" y="82" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="14.5" font-weight="700" fill="#936300">ViT 首次编码</text>
  <text x="97" y="106" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, monospace" font-size="13.5" fill="#17211f">_cache_encoder</text>
  <text x="97" y="126" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, monospace" font-size="13.5" fill="#17211f">_output()</text>
  <text x="97" y="148" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="13.5" fill="#66716d">未命中时产出新嵌入</text>

  <!-- Arrow 1a: ViT -> Pinned CPU Cache -->
  <path d="M 174 88 L 236 88" fill="none" stroke="#4c65b6" stroke-width="2" stroke-dasharray="5 3" marker-end="url(#arr-i)" />
  <text x="205" y="79" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="12.5" font-weight="700" fill="#3a4f93">异步 D2H</text>

  <!-- Arrow 1b: ViT -> tmp_encoder_cache -->
  <path d="M 97 160 L 97 196 L 236 196" fill="none" stroke="#66716d" stroke-width="1.8" marker-end="url(#arr-m)" />
  <text x="166" y="188" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="13" fill="#4d5652">请求期暂存</text>

  <!-- Node 2: Pinned CPU Cache Pool -->
  <rect x="240" y="48" width="276" height="114" rx="8" fill="#e8edff" stroke="#4c65b6" stroke-width="1.6" />
  <text x="378" y="72" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="700" fill="#3a4f93">Pinned CPU 大池（cpu_encoder_cache）</text>
  <text x="378" y="95" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="12" fill="#17211f">默认 100,000 槽 · pin_memory + non_blocking</text>
  <rect x="248" y="108" width="260" height="42" rx="6" fill="#ffffff" stroke="#4c65b6" stroke-width="1.2" />
  <text x="378" y="126" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, monospace" font-size="11.5" font-weight="700" fill="#17211f">score = (freq + clock) × cal_cost(s)</text>
  <text x="378" y="144" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="12" fill="#4d5652">大图 O(s²) 重算更贵，同等热度得分更高</text>

  <!-- Node 2b: tmp_encoder_cache -->
  <rect x="240" y="176" width="276" height="44" rx="7" fill="#ece9df" stroke="#b8bcb5" stroke-width="1.4" />
  <text x="378" y="196" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, monospace" font-size="12.5" font-weight="700" fill="#4d5652">tmp_encoder_cache（设备临时槽）</text>
  <text x="378" y="214" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="12" fill="#66716d">无活跃请求引用该 mm_hash 即删；缺项同步补拷</text>

  <!-- Arrow 2 -> 3: should_promote -> NPU Resident Cache -->
  <path d="M 516 96 L 610 96" fill="none" stroke="#087f73" stroke-width="2.2" marker-end="url(#arr-t)" />
  <text x="563" y="84" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="13.5" font-weight="700" fill="#065f56">直晋或 ≥门槛</text>
  <text x="563" y="114" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, monospace" font-size="13" fill="#065f56">当前流 H2D</text>

  <!-- Fallback arrow CPU -> tmp_encoder_cache -->
  <path d="M 378 162 L 378 174" fill="none" stroke="#66716d" stroke-width="1.6" stroke-dasharray="3 2" marker-end="url(#arr-m)" />

  <!-- Node 3: NPU Resident Cache -->
  <rect x="614" y="48" width="266" height="172" rx="8" fill="#ddf4ef" stroke="#087f73" stroke-width="1.8" />
  <text x="747" y="74" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="14.5" font-weight="700" fill="#065f56">NPU 常驻池（encoder_cache）</text>
  <text x="747" y="98" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="13.5" fill="#17211f">热点高频 + 高重算代价嵌入直驻 HBM</text>
  <rect x="628" y="112" width="238" height="44" rx="6" fill="#ffffff" stroke="#087f73" stroke-width="1.2" />
  <text x="747" y="131" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, monospace" font-size="13.5" font-weight="700" fill="#065f56">should_promote() 判定</text>
  <text x="747" y="149" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="13" fill="#4d5652">空槽足直晋；不足则无 clock 分 ≥ 门槛</text>
  <rect x="628" y="164" width="238" height="44" rx="6" fill="#fff0e9" stroke="#b54237" stroke-width="1.2" />
  <text x="747" y="183" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, monospace" font-size="13.5" font-weight="700" fill="#8f3229">evict_from_npu() 批量腾挪</text>
  <text x="747" y="201" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="13" fill="#4d5652">淘汰低分项直至留出 watermark 空槽</text>

  <!-- Section Divider -->
  <line x1="20" y1="238" x2="880" y2="238" stroke="#d8d8cf" stroke-width="1.5" />

  <!-- ================= BOTTOM BAND: NPU HBM Score-Sorted Ruler & Event Strip ================= -->
  <text x="20" y="264" font-family="system-ui, -apple-system, sans-serif" font-size="16" font-weight="700" fill="#17211f">2. NPU 可回收槽位按 score 升序标尺：promote_percentile 与 watermark</text>

  <!-- Horizontal Sorted Bar (x=20..880, width=860) -->
  <!-- Left 20% = 172px: Eviction / Promote Percentile Threshold -->
  <rect x="20" y="298" width="172" height="52" rx="5" fill="#fff0e9" stroke="#b54237" stroke-width="1.6" />
  <text x="106" y="320" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="700" fill="#8f3229">低分 0%–20%</text>
  <text x="106" y="341" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="13.5" fill="#8f3229">优先淘汰区</text>

  <!-- Next 20% = 172px: Watermark Headroom Target -->
  <rect x="194" y="298" width="172" height="52" rx="5" fill="#fff4cf" stroke="#c78300" stroke-width="1.6" stroke-dasharray="5 3" />
  <text x="280" y="320" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, monospace" font-size="14" font-weight="700" fill="#936300">watermark = 20%</text>
  <text x="280" y="341" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="13.5" fill="#4d5652">腾挪目标空槽余量</text>

  <!-- Right 60% = 512px: High-Score Hot Resident Zone -->
  <rect x="368" y="298" width="512" height="52" rx="5" fill="#ddf4ef" stroke="#087f73" stroke-width="1.6" />
  <text x="624" y="320" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="14.5" font-weight="700" fill="#065f56">高分热点常驻区（score 越高越靠右，稳定留守 NPU HBM）</text>
  <text x="624" y="341" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, monospace" font-size="12.5" fill="#4d5652">clock 每 64 次请求衰减（上限 15）· Qwen3.5 L_vis=27 / 默认 32</text>

  <!-- Vertical Threshold Pin at x=192 -->
  <line x1="192" y1="278" x2="192" y2="366" stroke="#b54237" stroke-width="2.4" />
  <text x="198" y="290" font-family="ui-monospace, SFMono-Regular, monospace" font-size="13.5" font-weight="700" fill="#8f3229">▲ promote_percentile = 0.2（score ≥ 门槛即晋升）</text>

  <!-- Event Tracking Strip at bottom -->
  <rect x="20" y="382" width="860" height="94" rx="8" fill="#ece9df" stroke="#d8d8cf" stroke-width="1.3" />
  <text x="34" y="404" font-family="system-ui, -apple-system, sans-serif" font-size="13.5" font-weight="700" fill="#17211f">Worker 拷贝护航（_process_encoder_cache_scheduler_output）：</text>
  <rect x="34" y="416" width="214" height="24" rx="4" fill="#e8edff" stroke="#4c65b6" stroke-width="1.2" />
  <text x="141" y="433" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, monospace" font-size="12.5" font-weight="700" fill="#3a4f93">当前流 non_blocking 拷贝</text>
  <line x1="248" y1="428" x2="278" y2="428" stroke="#087f73" stroke-width="1.6" marker-end="url(#arr-t)" />
  <rect x="282" y="416" width="194" height="24" rx="4" fill="#ddf4ef" stroke="#087f73" stroke-width="1.2" />
  <text x="379" y="433" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="12.5" font-weight="700" fill="#065f56">Event 追踪完成与释放</text>
  <text x="34" y="463" font-family="system-ui, -apple-system, sans-serif" font-size="13" fill="#4d5652">拷贝在当前 NPU 流排队，由 torch.npu.Event 追踪完成与源缓冲寿命；原生 EncoderCacheManager 仅做 NPU 内 FIFO</text>
</svg>
