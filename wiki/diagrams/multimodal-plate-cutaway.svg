<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 598" width="860" height="598" role="img" aria-label="多模态推理三级硬件流水线立体拆解剖面图：左侧 CPU 将原图切分为三维 PATCH GRID 并展开占位符，中段 ViT ENCODER 计算视觉特征并配合可选 EC CACHE，右侧按掩码原地覆写进 LLM TOKENS 占位槽并以三维 M-RoPE 注入 (T,H,W) 时空坐标" font-family="var(--font-sans)">
  <title>多模态视觉编码到语言主干的三级物理流水拆解：前端 CPU 先将媒体切为 PATCH GRID 并在序列中预留等长占位槽；NPU 侧对未命中可选 EC CACHE 的媒体跑完 ViT ENCODER 产出视觉嵌入（开启 ScoreEncoderCacheManager 时按空槽充足直升或热度评分在两级池间晋升）；最终按占位掩码原地覆写进 LLM TOKENS 并由 M-RoPE 注入 (T, H, W) 三维坐标。</title>
  <desc>关联源码符号：_apply_hf_processor_main, ScoreEncoderCacheManager, should_promote, AscendMRotaryEmbedding</desc>

  <image href="./wiki-illustrations/multimodal-vit-cutaway.webp" x="40" y="132" width="780" height="324" preserveAspectRatio="xMidYMid meet"/>

  <line x1="194" y1="114" x2="194" y2="255" stroke="#c78300" stroke-width="1.6"/>
  <circle cx="194" cy="255" r="5.5" fill="#ffffff" stroke="#c78300" stroke-width="2"/>
  <circle cx="194" cy="255" r="2.5" fill="#c78300"/>

  <line x1="414" y1="114" x2="414" y2="262" stroke="#c78300" stroke-width="1.6"/>
  <circle cx="414" cy="262" r="5.5" fill="#ffffff" stroke="#c78300" stroke-width="2"/>
  <circle cx="414" cy="262" r="2.5" fill="#c78300"/>

  <line x1="672" y1="114" x2="672" y2="262" stroke="#087f73" stroke-width="1.6"/>
  <circle cx="672" cy="262" r="5.5" fill="#ffffff" stroke="#087f73" stroke-width="2"/>
  <circle cx="672" cy="262" r="2.5" fill="#087f73"/>

  <line x1="542" y1="486" x2="542" y2="310" stroke="#4c65b6" stroke-width="1.6"/>
  <circle cx="542" cy="310" r="5.5" fill="#ffffff" stroke="#4c65b6" stroke-width="2"/>
  <circle cx="542" cy="310" r="2.5" fill="#4c65b6"/>

  <line x1="622" y1="486" x2="622" y2="408" stroke="#9a4b86" stroke-width="1.6"/>
  <circle cx="622" cy="408" r="5.5" fill="#ffffff" stroke="#9a4b86" stroke-width="2"/>
  <circle cx="622" cy="408" r="2.5" fill="#9a4b86"/>

  <g id="callout-patch">
    <circle cx="20" cy="26" r="11" fill="#c78300"/>
    <text x="20" y="30.5" text-anchor="middle" font-size="12" font-weight="700" fill="#ffffff">1</text>
    <text x="38" y="31" font-size="14" font-weight="700" fill="#17211f">CPU 切块与占位 (PATCH GRID)</text>
    <text x="38" y="55" font-size="12.5" fill="#4d5652">前端解码像素并算出精确视觉词数</text>
    <text x="38" y="77" font-size="12.5" fill="#4d5652">在 <tspan font-family="var(--font-mono)" font-weight="700">input_ids</tspan> 预铺等长占位与网格</text>
    <text x="38" y="99" font-size="12.5" fill="#936300">不必等 NPU 算完视觉塔即可入队</text>
  </g>

  <g id="callout-vit">
    <circle cx="300" cy="26" r="11" fill="#c78300"/>
    <text x="300" y="30.5" text-anchor="middle" font-size="12" font-weight="700" fill="#ffffff">2</text>
    <text x="318" y="31" font-size="14" font-weight="700" fill="#17211f">视觉编码塔 (ViT ENCODER)</text>
    <text x="318" y="55" font-size="12.5" fill="#4d5652">仅对未命中缓存媒体跑 ViT 与投影</text>
    <text x="318" y="77" font-size="12.5" fill="#4d5652">可设 <tspan font-family="var(--font-mono)" font-weight="700">mm-encoder-tp-mode=data</tspan></text>
    <text x="318" y="99" font-size="12.5" fill="#936300">多图按卡分摊，省逐层张量通信</text>
  </g>

  <g id="callout-merge">
    <circle cx="580" cy="26" r="11" fill="#087f73"/>
    <text x="580" y="30.5" text-anchor="middle" font-size="12" font-weight="700" fill="#ffffff">3</text>
    <text x="598" y="31" font-size="14" font-weight="700" fill="#17211f">掩码原地覆写 (LLM TOKENS)</text>
    <text x="598" y="55" font-size="12.5" fill="#4d5652">按 <tspan font-family="var(--font-mono)" font-weight="700">is_multimodal</tspan> 填回嵌入槽位</text>
    <text x="598" y="77" font-size="12.5" fill="#4d5652">行数与占位不符立抛 <tspan font-family="var(--font-mono)" font-weight="700">ValueError</tspan></text>
    <text x="598" y="99" font-size="12.5" fill="#065f56">同占 KV 槽（Qwen3-VL 另注层间特征）</text>
  </g>

  <g id="callout-eccache">
    <circle cx="20" cy="510" r="11" fill="#4c65b6"/>
    <text x="20" y="514.5" text-anchor="middle" font-size="12" font-weight="700" fill="#ffffff">4</text>
    <text x="38" y="515" font-size="14" font-weight="700" fill="#17211f">单级与可选两级编码缓存 (EC CACHE)</text>
    <text x="38" y="539" font-size="12.5" fill="#4d5652">默认单级 FIFO；配 <tspan font-family="var(--font-mono)" font-weight="700">ScoreEncoderCacheManager</tspan> 启两级池</text>
    <text x="38" y="562" font-size="12.5" fill="#3a4f93">空槽充足直升或按评分晋升（CPU 满按 FIFO 清零引用项）</text>
  </g>

  <g id="callout-mrope">
    <circle cx="456" cy="510" r="11" fill="#9a4b86"/>
    <text x="456" y="514.5" text-anchor="middle" font-size="12" font-weight="700" fill="#ffffff">5</text>
    <text x="474" y="515" font-size="14" font-weight="700" fill="#17211f">三维时空位置旋转 (M-RoPE · T / H / W)</text>
    <text x="474" y="539" font-size="12.5" fill="#4d5652">按帧 <tspan font-family="var(--font-mono)" font-weight="700">T</tspan>、行 <tspan font-family="var(--font-mono)" font-weight="700">H</tspan>、列 <tspan font-family="var(--font-mono)" font-weight="700">W</tspan> 旋转（分三段或交错排布）</text>
    <text x="474" y="562" font-size="12.5" fill="#7a3a6a">纯文本处三轴相等，严格退化回标准一维 RoPE</text>
  </g>
</svg>
