<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 560" width="900" height="560" role="img" aria-label="v0.23.0 多流重叠门控（SP + AllGather）跨流执行与汇合，以及 v0.30.0 和 main 已删除状态" font-family="var(--font-sans)">
  <title>v0.23.0 的 SP + AllGather 路径：共享专家与选专家提前提交到 gate_stream；当前流先量化，quant_stream 再收集隐藏态，量化尺度另在当前流收集；v0.30.0 与 main 已整体移除（PR #11956）。</title>
  <desc>Three-stream MoE prepare overlap in v0.23.0 (default stream, quant_stream, gate_stream) joining before routed expert execution, with v0.30.0 and main removal notice.</desc>

  <text x="16" y="28" font-size="16" font-weight="700" fill="#17211f">v0.23.0 多流重叠门控（SP + AllGather 路径）与跨流汇合</text>
  <text x="16" y="48" font-size="13.5" fill="#66716d">两条类级单例副流各自起飞、各自 join；跨流传结果靠模块级单例 FlashCommon3Context</text>

  <!-- Phase vertical guides -->
  <line x1="342" y1="78" x2="342" y2="404" stroke="#b8bcb5" stroke-width="1.2" stroke-dasharray="5 4"/>
  <text x="342" y="72" font-size="13" font-weight="600" fill="#66716d" text-anchor="middle">副流起飞</text>
  <line x1="682" y1="78" x2="682" y2="404" stroke="#b8bcb5" stroke-width="1.2" stroke-dasharray="5 4"/>
  <text x="682" y="72" font-size="13" font-weight="600" fill="#66716d" text-anchor="middle">双副流 join</text>

  <!-- Horizontal lane separators -->
  <line x1="16" y1="188" x2="884" y2="188" stroke="#d8d8cf" stroke-width="1" stroke-dasharray="4 4"/>
  <line x1="16" y1="296" x2="884" y2="296" stroke="#d8d8cf" stroke-width="1" stroke-dasharray="4 4"/>

  <!-- Left lane labels -->
  <text x="16" y="130" font-size="14.5" font-weight="700" fill="#17211f">默认流</text>
  <text x="16" y="150" font-size="13.5" fill="#66716d">主执行线</text>

  <text x="16" y="238" font-size="13.5" font-weight="700" fill="#7a3a6a" font-family="var(--font-mono)">quant_stream</text>
  <text x="16" y="258" font-size="13.5" fill="#66716d">类级单例副流</text>

  <text x="16" y="346" font-size="13.5" font-weight="700" fill="#936300" font-family="var(--font-mono)">gate_stream</text>
  <text x="16" y="366" font-size="13.5" fill="#66716d">类级单例副流</text>

  <!-- Lane 1: Default Stream -->
  <rect x="140" y="92" width="192" height="84" rx="8" fill="#ece9df" stroke="#b8bcb5" stroke-width="1.4"/>
  <text x="152" y="116" font-size="14.5" font-weight="700" fill="#17211f">1. 挂共享专家</text>
  <text x="152" y="139" font-size="13" fill="#4d5652" font-family="var(--font-mono)">shared_forward_impl</text>
  <text x="152" y="161" font-size="13.5" fill="#66716d">需带共享专家的 MoE</text>

  <rect x="352" y="92" width="194" height="84" rx="8" fill="#ddf4ef" stroke="#087f73" stroke-width="1.4"/>
  <text x="364" y="116" font-size="14.5" font-weight="700" fill="#065f56">2. 动态量化隐藏态</text>
  <text x="364" y="139" font-size="13" fill="#4d5652" font-family="var(--font-mono)">npu_dynamic_quant</text>
  <text x="364" y="161" font-size="13.5" fill="#4d5652">当前流量化 + 收 scale</text>

  <rect x="692" y="92" width="192" height="84" rx="8" fill="#ddf4ef" stroke="#087f73" stroke-width="1.4"/>
  <text x="704" y="116" font-size="14.5" font-weight="700" fill="#065f56">3. 汇合算路由专家</text>
  <text x="704" y="139" font-size="13" fill="#4d5652" font-family="var(--font-mono)">_quant_method.apply</text>
  <text x="704" y="161" font-size="13.5" fill="#4d5652">读 context 的 topk</text>

  <!-- Lane 2: quant_stream -->
  <rect x="352" y="200" width="320" height="84" rx="8" fill="#f7e7f2" stroke="#9a4b86" stroke-width="1.4"/>
  <text x="364" y="224" font-size="14.5" font-weight="700" fill="#7a3a6a">副流 EP All-Gather（隐藏态）</text>
  <text x="364" y="247" font-size="13" fill="#4d5652" font-family="var(--font-mono)">fc3_all_gather_and_maybe_unpad_impl</text>
  <text x="364" y="269" font-size="13.5" fill="#4d5652">经专用通信组 fc3_quant_x（W8A8）</text>

  <!-- Lane 3: gate_stream -->
  <rect x="352" y="308" width="144" height="84" rx="8" fill="#fff4cf" stroke="#c78300" stroke-width="1.4"/>
  <text x="364" y="332" font-size="14.5" font-weight="700" fill="#936300">共享专家 FFN</text>
  <text x="364" y="355" font-size="13" fill="#4d5652" font-family="var(--font-mono)">shared_experts</text>
  <text x="364" y="377" font-size="13.5" fill="#4d5652">本地隐藏态直算</text>

  <rect x="508" y="308" width="164" height="84" rx="8" fill="#fff4cf" stroke="#c78300" stroke-width="1.4"/>
  <text x="520" y="332" font-size="14.5" font-weight="700" fill="#936300">路由 + 写 context</text>
  <text x="520" y="355" font-size="13" fill="#4d5652" font-family="var(--font-mono)">select_experts</text>
  <text x="520" y="377" font-size="13.5" fill="#4d5652">写 topk 与共享输出</text>

  <!-- Planar arrows (zero crossings) -->
  <path d="M332 134 H349 m-5-5 l5 5 -5 5" fill="none" stroke="#087f73" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M546 134 H689 m-5-5 l5 5 -5 5" fill="none" stroke="#087f73" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="617" y="124" font-size="13" font-weight="600" fill="#065f56" text-anchor="middle">等两条副流 join</text>

  <!-- Launch gate_stream from Box 1A -->
  <path d="M236 176 V350 H349 m-5-5 l5 5 -5 5" fill="none" stroke="#c78300" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- Launch quant_stream from Box 1B -->
  <path d="M449 176 V197 m-5-5 l5 5 5-5" fill="none" stroke="#9a4b86" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- Between gate_stream boxes -->
  <path d="M496 350 H506 m-4-4 l4 4 -4 4" fill="none" stroke="#c78300" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Join quant_stream and gate_stream into Box 1C -->
  <path d="M672 242 H756 V179 m-5 5 l5-5 5 5" fill="none" stroke="#9a4b86" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M672 350 H822 V179 m-5 5 l5-5 5 5" fill="none" stroke="#c78300" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Overlap window bracket -->
  <path d="M352 402 v8 H672 v-8" fill="none" stroke="#c78300" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="512" y="430" font-size="13.5" font-weight="600" fill="#936300" text-anchor="middle">真正的重叠窗口仅此一段（实际重叠与收益须实测，日志不证明生效）</text>

  <!-- Bottom comparison & removal cards -->
  <rect x="16" y="448" width="424" height="96" rx="8" fill="#ece9df" stroke="#b8bcb5" stroke-width="1.3"/>
  <text x="30" y="472" font-size="14.5" font-weight="700" fill="#17211f">关闭（默认）行为</text>
  <text x="30" y="496" font-size="13.5" fill="#4d5652">• 共享专家与路由留在默认流顺序执行</text>
  <text x="30" y="518" font-size="13.5" fill="#4d5652">• SP + AllGather 时 prepare 照样收 hidden 与 logits</text>

  <rect x="460" y="448" width="424" height="96" rx="8" fill="#fff0e9" stroke="#b54237" stroke-width="1.3"/>
  <text x="474" y="472" font-size="14.5" font-weight="700" fill="#8f3229">v0.30.0 (c09d3e20) / main (8d6180e2) 已删除</text>
  <text x="474" y="496" font-size="13.5" fill="#4d5652">• v0.24.0rc（PR #11956）起整套移除此键与旧路径</text>
  <text x="474" y="518" font-size="13.5" fill="#4d5652">• 残留此键按 extra="forbid" 拒收（Omni 告警过滤）</text>
</svg>
