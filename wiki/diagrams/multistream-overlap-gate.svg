  <path d="M408 294 l-11 -5.5 l0 11 z" fill="var(--color-accent, #e85b32)"/>
  <path d="M646 294 L712 294 L712 216" fill="none" stroke="var(--color-accent, #e85b32)" stroke-width="1.8"/>
  <path d="M712 216 l-5.5 11 l11 0 z" fill="var(--color-accent, #e85b32)"/>
  <path d="M646 418 L740 418 L740 216" fill="none" stroke="var(--color-accent, #e85b32)" stroke-width="1.8"/>
