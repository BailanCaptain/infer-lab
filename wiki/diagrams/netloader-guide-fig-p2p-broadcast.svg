<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 476" width="900" height="476" role="img" aria-label="Netloader 已有实例到新实例的 P2P 权重握手传输、INT8_CACHE 分流与磁盘回退架构图" font-family="var(--font-sans)">
  <title>Netloader：同分片 TCP 握手、2 进程临时 HCCL 传输、INT8_CACHE 与磁盘回退机制</title>
  <desc>关联源码符号：ModelNetLoaderElastic, INT8_CACHE, disk_fallback_loader_extra_config, enable_multithread_load</desc>
  <defs>
    <marker id="nl-arr-t" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="#087f73"/>
    </marker>
    <marker id="nl-arr-p" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="#9a4b86"/>
    </marker>
    <marker id="nl-arr-r" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="#b54237"/>
    </marker>
  </defs>

  <!-- Zone 1: P2P Broadcast Flow -->
  <text x="16" y="28" font-size="16" font-weight="700" fill="#17211f">① 启动期同分片 P2P 权重搬运：rank 对 rank 建 2 进程临时 HCCL 通信组</text>

  <rect x="16" y="44" width="248" height="126" rx="7" fill="#e8edff" stroke="#4c65b6" stroke-width="1.4"/>
  <text x="30" y="70" font-size="14.5" font-weight="700" fill="#3a4f93">供方旧实例（Server）</text>
  <text x="30" y="94" font-size="13.5" fill="#4d5652">已加载模型并开 TCP 监听</text>
  <text x="30" y="116" font-size="13.5" fill="#4d5652">端口 = LISTEN_PORT + rank</text>
  <text x="30" y="138" font-size="13.5" fill="#3a4f93">draft 通道另加 +10000 偏移</text>
  <text x="30" y="160" font-size="13.5" fill="#4d5652">后台线程发送（串行接单）</text>

  <line x1="266" y1="84" x2="312" y2="84" stroke="#087f73" stroke-width="1.8" marker-end="url(#nl-arr-t)"/>
  <line x1="312" y1="130" x2="266" y2="130" stroke="#9a4b86" stroke-width="1.8" marker-end="url(#nl-arr-p)"/>

  <rect x="316" y="44" width="268" height="126" rx="7" fill="#ddf4ef" stroke="#087f73" stroke-width="1.4"/>
  <text x="330" y="70" font-size="14.5" font-weight="700" fill="#065f56">TCP 握手 + 临时 HCCL 搬运</text>
  <text x="330" y="94" font-size="13.5" fill="#4d5652">核：rank / 路径串 / TP / PP</text>
  <text x="330" y="116" font-size="13.5" fill="#065f56" font-weight="600">v0.30.0 增：缓存模式+清单</text>
  <text x="330" y="138" font-size="13.5" fill="#4d5652">按遍历序发/收张量 + barrier</text>
  <text x="330" y="160" font-size="13.5" fill="#66716d">仍无权重内容哈希，不重切片</text>

  <line x1="586" y1="107" x2="622" y2="107" stroke="#087f73" stroke-width="1.8" marker-end="url(#nl-arr-t)"/>

  <rect x="626" y="44" width="258" height="126" rx="7" fill="#f7e7f2" stroke="#9a4b86" stroke-width="1.4"/>
  <text x="640" y="70" font-size="14.5" font-weight="700" fill="#7a3a6a">接收新实例（Client）</text>
  <text x="640" y="94" font-size="13.5" fill="#4d5652">按 SOURCE 顺序试候选地址</text>
  <text x="640" y="116" font-size="13.5" fill="#4d5652">先建参数空位，接收写入卡内</text>
  <text x="640" y="138" font-size="13.5" fill="#7a3a6a">收完后自身也开监听供扩容</text>
  <text x="640" y="160" font-size="13.5" fill="#4d5652">之后才量显存、建 KV 池</text>

  <line x1="16" y1="188" x2="884" y2="188" stroke="#b8bcb5" stroke-width="1.4" stroke-dasharray="6 5"/>

  <!-- Zone 2: INT8_CACHE & Fallback -->
  <text x="16" y="216" font-size="16" font-weight="700" fill="#17211f">② INT8_CACHE 布局模式与加载失败回退边界（v0.23 vs v0.30.0 / main）</text>

  <rect x="16" y="232" width="424" height="124" rx="7" fill="#fff4cf" stroke="#c78300" stroke-width="1.4"/>
  <text x="30" y="258" font-size="14.5" font-weight="700" fill="#936300">量化权重布局：INT8_CACHE = no / hbm / dram</text>
  <text x="30" y="282" font-size="13.5" fill="#4d5652">• v0.30.0 / main（no）：直接传后处理后的推理布局 + 清单</text>
  <text x="30" y="304" font-size="13.5" fill="#4d5652">• hbm / dram：供方留原始 int8 副本，接收端再做后处理</text>
  <text x="30" y="326" font-size="13.5" fill="#8f3229" font-weight="600">• draft 供方只要非 no（含 dram）均强制改存 HBM 副本</text>
  <text x="30" y="346" font-size="13.5" fill="#936300">• 新旧版布局与 manifest 协议不同，不可跨版混接</text>

  <rect x="460" y="232" width="424" height="124" rx="7" fill="#fff0e9" stroke="#b54237" stroke-width="1.4"/>
  <text x="474" y="258" font-size="14.5" font-weight="700" fill="#8f3229">两级容错与磁盘回退（DefaultModelLoader）</text>
  <text x="474" y="282" font-size="13.5" fill="#4d5652">• TCP 连接/握手拒收：继续顺序试 SOURCE 下一候选</text>
  <text x="474" y="304" font-size="13.5" fill="#4d5652">• HCCL 传输中断：不再轮询其他供方，直接回退读磁盘</text>
  <text x="474" y="326" font-size="13.5" fill="#065f56" font-weight="600">• v0.30.0 经 disk_fallback_loader_extra_config 过滤</text>
  <text x="474" y="346" font-size="13.5" fill="#4d5652">  保留 enable_multithread_load 等 3 键、剔除专有键</text>

  <line x1="16" y1="374" x2="884" y2="374" stroke="#b8bcb5" stroke-width="1.4" stroke-dasharray="6 5"/>

  <!-- Zone 3: Practical details -->
  <text x="16" y="400" font-size="16" font-weight="700" fill="#17211f">③ 通信缓冲拼写、对比 RFork 与双机冷启动前提</text>

  <rect x="16" y="414" width="424" height="52" rx="7" fill="#ece9df" stroke="#b8bcb5" stroke-width="1.3"/>
  <text x="30" y="437" font-size="13.5" font-weight="700" fill="#17211f">HCCL_BUFFSIZE（非 BUFFERSIZE）默认 200 MB × 收发双倍</text>
  <text x="30" y="458" font-size="13.5" fill="#4d5652">每通信域另占片上缓冲；GLM 教程未启用 Netloader</text>

  <rect x="460" y="414" width="424" height="52" rx="7" fill="#ddf4ef" stroke="#087f73" stroke-width="1.3"/>
  <text x="474" y="437" font-size="13.5" font-weight="700" fill="#065f56">对比 RFork：静态 SOURCE 地址 vs Planner 动态租约</text>
  <text x="474" y="458" font-size="13.5" fill="#4d5652">双机同冷启动无已加载供方，EP16 不同专家分片不可互指</text>
</svg>
