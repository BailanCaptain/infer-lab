<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 735" width="880" height="735" role="img" aria-label="固定 GLM 提交中的启动分支。选择 Netloader 后，每个 Worker 独立取来源、握手、接收；没有来源或传输返回失败就回默认加载。两路随后尝试启动供其他实例取权重的监听服务，再完成所需的权重后处理。主模型带草稿模型时还有加载草稿前的同步；后续才到 KV cache、预热和请求处理。">
  <title>固定 GLM 提交中的启动分支。选择 Netloader 后，每个 Worker 独立取来源、握手、接收；没有来源或传输返回失败就回默认加载。两路随后尝试启动供其他实例取权重的监听服务，再完成所需的权重后处理。主模型带草稿模型时还有加载草稿前的同步；后续才到 KV cache、预热和请求处理。</title>
  <defs><marker id="netloader-guide-flow-ah-control" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="var(--color-control, #66716d)"/></marker><marker id="netloader-guide-flow-ah-comm" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="var(--color-comm, #9a4b86)"/></marker><marker id="netloader-guide-flow-ah-danger" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="var(--color-danger, #b54237)"/></marker><marker id="netloader-guide-flow-ah-weight" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="var(--color-weight, #c78300)"/></marker></defs>
  <path d="M340 80 L340 108 L190 108 L190 135" fill="none" stroke="var(--color-control, #66716d)" stroke-width="1.4" marker-end="url(#netloader-guide-flow-ah-control)"/>
