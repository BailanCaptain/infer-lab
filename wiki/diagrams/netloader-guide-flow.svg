  <path d="M520 164 L385 164 L385 330 L190 330 L190 355" fill="none" stroke="var(--color-control, #66716d)" stroke-width="1.4" stroke-dasharray="7 5" marker-end="url(#netloader-guide-flow-ah-control)"/>
  <path d="M665 303 L665 355" fill="none" stroke="var(--color-comm, #9a4b86)" stroke-width="2.2" marker-end="url(#netloader-guide-flow-ah-comm)"/>
  <path d="M520 274 L450 274 L450 340 L300 340 L300 355" fill="none" stroke="var(--color-danger, #b54237)" stroke-width="1.4" stroke-dasharray="7 5" marker-end="url(#netloader-guide-flow-ah-danger)"/>
  <path d="M520 395 L320 395" fill="none" stroke="var(--color-danger, #b54237)" stroke-width="1.4" stroke-dasharray="7 5" marker-end="url(#netloader-guide-flow-ah-danger)"/>
  <path d="M190 413 L190 450 L350 450 L350 478" fill="none" stroke="var(--color-weight, #c78300)" stroke-width="1.4" marker-end="url(#netloader-guide-flow-ah-weight)"/>
  <path d="M665 413 L665 450 L540 450 L540 478" fill="none" stroke="var(--color-weight, #c78300)" stroke-width="1.4" marker-end="url(#netloader-guide-flow-ah-weight)"/>
