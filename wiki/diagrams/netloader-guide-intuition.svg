<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 504" width="900" height="504" role="img" aria-label="NetLoader 启动期卡间点对点权重交接三阶段与两路回退分流示意图" font-family="var(--font-sans)">
  <title>NetLoader 启动期卡间点对点权重交接三阶段与两路失败回退边界</title>
  <desc>展示供方先读盘开监听、新实例经 TCP 握手与 2 进程临时 HCCL 组接过同分片权重、接收后各自独立持权推理三阶段，并区分 TCP 注册失败（源 A 试候选 B，耗尽再读盘）与已选供方 HCCL 接收失败（直接进入默认加载路径）两路兜底。</desc>
  <defs>
    <marker id="nli-arr-a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="#c78300"/>
    </marker>
    <marker id="nli-arr-p" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="#9a4b86"/>
    </marker>
    <marker id="nli-arr-t" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="#087f73"/>
    </marker>
  </defs>

  <!-- Stage 1 Band -->
  <rect x="16" y="14" width="868" height="114" rx="8" fill="#f5f1e8" stroke="#d5cfc0" stroke-width="1.3"/>
  <text x="30" y="38" font-size="14.5" font-weight="700" fill="#17211f">① 先有一份可用权重：首个供方实例从存储读盘，装入 NPU 并开启监听端口</text>

  <rect x="34" y="52" width="216" height="62" rx="6" fill="#fbfaf6" stroke="#8c8577" stroke-width="1.4" stroke-dasharray="5 3"/>
  <rect x="48" y="63" width="38" height="10" rx="2" fill="#efe9dc" stroke="#8c8577" stroke-width="1"/>
  <rect x="48" y="77" width="38" height="10" rx="2" fill="#efe9dc" stroke="#8c8577" stroke-width="1"/>
  <rect x="48" y="91" width="38" height="10" rx="2" fill="#efe9dc" stroke="#8c8577" stroke-width="1"/>
  <text x="98" y="79" font-size="13.5" font-weight="700" fill="#17211f">共享存储 / 本地盘</text>
  <text x="98" y="101" font-size="12.5" fill="#4d5652">safetensors 权重文件</text>

  <path d="M 254 83 L 526 83" fill="none" stroke="#c78300" stroke-width="2" marker-end="url(#nli-arr-a)"/>
  <rect x="316" y="59" width="148" height="22" rx="4" fill="#fff4cf" stroke="#c78300" stroke-width="1"/>
  <text x="390" y="75" text-anchor="middle" font-size="12.5" font-weight="700" fill="#936300">首次常规读盘加载</text>

  <rect x="534" y="48" width="332" height="68" rx="7" fill="#fff4cf" stroke="#c78300" stroke-width="1.6"/>
  <text x="550" y="71" font-size="13.5" font-weight="700" fill="#936300">供方实例（NPU 0 · rank 0）</text>
  <rect x="550" y="81" width="44" height="24" rx="3" fill="#f6dca0" stroke="#c78300" stroke-width="1.2"/>
  <text x="572" y="98" text-anchor="middle" font-size="12.5" font-weight="700" fill="#7a5100">W₀</text>
  <rect x="600" y="81" width="44" height="24" rx="3" fill="#f6dca0" stroke="#c78300" stroke-width="1.2"/>
  <text x="622" y="98" text-anchor="middle" font-size="12.5" font-weight="700" fill="#7a5100">W₁</text>
  <rect x="650" y="81" width="44" height="24" rx="3" fill="#f6dca0" stroke="#c78300" stroke-width="1.2"/>
  <text x="672" y="98" text-anchor="middle" font-size="12.5" font-weight="700" fill="#7a5100">W₂</text>
  <text x="706" y="98" font-size="12.5" fill="#4d5652">监听 LISTEN_PORT</text>

  <!-- Stage 2 Band -->
  <rect x="16" y="140" width="868" height="132" rx="8" fill="#f5f1e8" stroke="#d5cfc0" stroke-width="1.3"/>
  <text x="30" y="164" font-size="14.5" font-weight="700" fill="#17211f">② 新实例启动：TCP 核对同分片与清单，建 2 进程临时 HCCL 组逐张量直传</text>

  <rect x="34" y="178" width="286" height="80" rx="7" fill="#fff4cf" stroke="#c78300" stroke-width="1.6"/>
  <text x="50" y="202" font-size="13.5" font-weight="700" fill="#936300">供方 NPU · 已装好权重分片</text>
  <rect x="50" y="214" width="42" height="24" rx="3" fill="#f6dca0" stroke="#c78300" stroke-width="1.2"/>
  <text x="71" y="231" text-anchor="middle" font-size="12.5" font-weight="700" fill="#7a5100">W₀</text>
  <rect x="98" y="214" width="42" height="24" rx="3" fill="#f6dca0" stroke="#c78300" stroke-width="1.2"/>
  <text x="119" y="231" text-anchor="middle" font-size="12.5" font-weight="700" fill="#7a5100">W₁</text>
  <rect x="146" y="214" width="42" height="24" rx="3" fill="#f6dca0" stroke="#c78300" stroke-width="1.2"/>
  <text x="167" y="231" text-anchor="middle" font-size="12.5" font-weight="700" fill="#7a5100">W₂</text>
  <text x="198" y="231" font-size="12.5" fill="#4d5652">后台可继续推理</text>

  <path d="M 324 204 L 530 204" fill="none" stroke="#9a4b86" stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#nli-arr-p)"/>
  <text x="427" y="195" text-anchor="middle" font-size="12" fill="#7a3a6a">TCP 核对身份 + 缓存模式/清单</text>

  <path d="M 324 234 L 530 234" fill="none" stroke="#9a4b86" stroke-width="2.4" marker-end="url(#nli-arr-p)"/>
  <rect x="348" y="240" width="158" height="22" rx="4" fill="#f7e7f2" stroke="#9a4b86" stroke-width="1.1"/>
  <text x="427" y="256" text-anchor="middle" font-size="12.5" font-weight="700" fill="#7a3a6a">临时 HCCL 卡间发送张量</text>

  <rect x="534" y="178" width="332" height="80" rx="7" fill="#fbfaf6" stroke="#9a4b86" stroke-width="1.6" stroke-dasharray="6 3"/>
  <text x="550" y="202" font-size="13.5" font-weight="700" fill="#7a3a6a">新实例 NPU · 同形状参数空位（绕开读盘）</text>
  <rect x="550" y="214" width="44" height="24" rx="3" fill="#f7e7f2" stroke="#9a4b86" stroke-width="1.2"/>
  <text x="572" y="231" text-anchor="middle" font-size="12.5" font-weight="700" fill="#7a3a6a">W₀</text>
  <rect x="600" y="214" width="44" height="24" rx="3" fill="#fbfaf6" stroke="#9a4b86" stroke-width="1.2" stroke-dasharray="3 2"/>
  <text x="622" y="231" text-anchor="middle" font-size="12.5" fill="#7a3a6a">W₁</text>
  <rect x="650" y="214" width="44" height="24" rx="3" fill="#fbfaf6" stroke="#9a4b86" stroke-width="1.2" stroke-dasharray="3 2"/>
  <text x="672" y="231" text-anchor="middle" font-size="12.5" fill="#7a3a6a">W₂</text>
  <text x="706" y="231" font-size="12.5" fill="#4d5652">v0.30.0 传后处理布局</text>

  <!-- Stage 3 Band -->
  <rect x="16" y="284" width="868" height="104" rx="8" fill="#f5f1e8" stroke="#d5cfc0" stroke-width="1.3"/>
  <text x="30" y="308" font-size="14.5" font-weight="700" fill="#17211f">③ 接收完成：两张卡各自持有独立显存副本，后续生成不再跨卡借权重</text>

  <rect x="34" y="322" width="286" height="54" rx="7" fill="#ddf4ef" stroke="#087f73" stroke-width="1.5"/>
  <text x="177" y="345" text-anchor="middle" font-size="13.5" font-weight="700" fill="#065f56">供方实例 · 保留本卡权重继续服务</text>
  <text x="177" y="366" text-anchor="middle" font-size="12.5" fill="#4d5652">监听端口可继续供下一批扩容实例拉取</text>

  <rect x="534" y="322" width="332" height="54" rx="7" fill="#ddf4ef" stroke="#087f73" stroke-width="1.5"/>
  <text x="700" y="345" text-anchor="middle" font-size="13.5" font-weight="700" fill="#065f56">新实例 · 权重齐备 → 分 KV Cache 与预热</text>
  <text x="700" y="366" text-anchor="middle" font-size="12.5" fill="#4d5652">自身也可开监听成为新供方</text>

  <path d="M 700 260 L 700 318" fill="none" stroke="#087f73" stroke-width="1.8" marker-end="url(#nli-arr-t)"/>

  <!-- Stage 4: Two-Branch Fallback Split -->
  <rect x="16" y="400" width="868" height="92" rx="8" fill="#fbfaf6" stroke="#b54237" stroke-width="1.3" stroke-dasharray="5 3"/>
  <text x="30" y="422" font-size="13.5" font-weight="700" fill="#8f3229">④ 异常分流边界：区分「TCP 注册轮询」与「已选源后 HCCL 接收失败」（均不卡死启动）</text>

  <rect x="30" y="432" width="412" height="50" rx="6" fill="#fff4cf" stroke="#c78300" stroke-width="1.2"/>
  <text x="236" y="452" text-anchor="middle" font-size="12.5" font-weight="700" fill="#936300">TCP 连接 / 注册失败：源 A 失败 → 顺序试候选 B</text>
  <text x="236" y="473" text-anchor="middle" font-size="12" fill="#4d5652">仅当候选列表全部耗尽（或未配来源）才走读盘</text>

  <rect x="458" y="432" width="412" height="50" rx="6" fill="#fff0e9" stroke="#b54237" stroke-width="1.2"/>
  <text x="664" y="452" text-anchor="middle" font-size="12.5" font-weight="700" fill="#8f3229">已选来源并进入 HCCL 后接收失败：不再轮询剩余候选</text>
  <text x="664" y="473" text-anchor="middle" font-size="12" fill="#4d5652">直接进入默认加载路径读盘（v0.30.0 保留多线程配置）</text>
</svg>
