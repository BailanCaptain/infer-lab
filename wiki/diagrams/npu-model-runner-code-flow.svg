<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 640" width="900" height="640" role="img" aria-label="一步里 model runner 的先后顺序和岔路。左列是第一次调用，对应主线第 3、4 站：先确认上一份执行状态已被取走，再对账、准备输入、定执行方式、建注意力元数据、前向，最后只把选中的行变成词表分数，存进执行状态，返回空。右列是第二次调用，对应第 5 站：取出并清空执行状态，有结构化输出时先套允许词表，再采样、整理结果、草拟下一步候选、打包交回。淡色框是提前离开主路的出口；虚线表示两次调用之间由引擎转手。">
  <title>一步里 model runner 的先后顺序和岔路。左列是第一次调用，对应主线第 3、4 站：先确认上一份执行状态已被取走，再对账、准备输入、定执行方式、建注意力元数据、前向，最后只把选中的行变成词表分数，存进执行状态，返回空。右列是第二次调用，对应第 5 站：取出并清空执行状态，有结构化输出时先套允许词表，再采样、整理结果、草拟下一步候选、打包交回。淡色框是提前离开主路的出口；虚线表示两次调用之间由引擎转手。</title>
  <defs><marker id="npu-model-runner-code-flow-ah-ink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="var(--color-ink, #17211f)"/></marker><marker id="npu-model-runner-code-flow-ah-control" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="var(--color-control, #66716d)"/></marker></defs>
  <rect x="16" y="36" width="428" height="588" rx="16" fill="none" stroke="var(--color-line-strong, #b8bcb5)" stroke-width="1.5"/>
