<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 560" width="900" height="560" role="img" aria-label="NPUModelRunner 单槽位状态机：EMPTY 与 OCCUPIED 严格交替、原地回放覆写风险与三层寿命标尺" font-family="var(--font-sans)">
  <title>ExecuteModelState 单槽位状态机、报错保护边、原地回放覆写风险与 Runner 三层对象寿命</title>
  <desc>Single-slot state machine cycling between EMPTY and OCCUPIED via execute_model and sample_tokens, error loop when execute_model fires on non-empty slot, in-place replay buffer overwrite hazard, non-state early exits, and 3-tier lifetime ruler</desc>
  <defs>
    <marker id="sm-arr-teal" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="#087f73"/>
    </marker>
    <marker id="sm-arr-indigo" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="#4c65b6"/>
    </marker>
    <marker id="sm-arr-red" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="#b54237"/>
    </marker>
    <marker id="sm-arr-ink" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="#4d5652"/>
    </marker>
  </defs>

  <!-- Title -->
  <text x="16" y="28" font-size="16" font-weight="700" fill="#17211f">① ExecuteModelState 单槽位状态机：两次 RPC 严格交替与覆写红线</text>
  <text x="884" y="28" text-anchor="end" font-size="13.5" fill="#66716d">主模型只在 RPC 1 跑一遍</text>

  <!-- State Node 1: EMPTY (Left) -->
  <rect x="28" y="102" width="196" height="104" rx="52" fill="#ddf4ef" stroke="#087f73" stroke-width="2"/>
  <text x="126" y="142" text-anchor="middle" font-size="16" font-weight="700" fill="#065f56">状态：EMPTY</text>
  <text x="126" y="166" text-anchor="middle" font-size="13.5" font-family="var(--font-mono)" fill="#4d5652">state = None</text>
  <text x="126" y="188" text-anchor="middle" font-size="13.5" fill="#065f56">允许进入下一轮前向</text>

  <!-- State Node 2: OCCUPIED (Middle-Right) -->
  <rect x="442" y="102" width="222" height="104" rx="18" fill="#fff4cf" stroke="#c78300" stroke-width="2"/>
  <text x="553" y="134" text-anchor="middle" font-size="16" font-weight="700" fill="#936300">状态：OCCUPIED</text>
  <text x="553" y="158" text-anchor="middle" font-size="13.5" font-weight="700" fill="#17211f">单槽存 12 项张量引用</text>
  <text x="553" y="180" text-anchor="middle" font-size="12" font-family="var(--font-mono)" fill="#4d5652">logits · hidden · attn_meta</text>
  <text x="553" y="198" text-anchor="middle" font-size="13.5" fill="#936300">零拷贝，延长张量寿命</text>

  <!-- Top Arc: RPC 1 execute_model (EMPTY -> OCCUPIED) -->
  <path d="M 190 102 C 250 48, 420 48, 480 100" fill="none" stroke="#087f73" stroke-width="2.2" marker-end="url(#sm-arr-teal)"/>
  <rect x="234" y="42" width="204" height="44" rx="6" fill="#ffffff" stroke="#087f73" stroke-width="1.2"/>
  <text x="336" y="61" text-anchor="middle" font-size="13.5" font-weight="700" fill="#065f56">RPC 1: execute_model()</text>
  <text x="336" y="80" text-anchor="middle" font-size="13.5" fill="#4d5652">前向+选行写槽，返回 None</text>

  <!-- Bottom Arc: RPC 2 sample_tokens (OCCUPIED -> EMPTY) -->
  <path d="M 480 208 C 420 264, 250 264, 190 210" fill="none" stroke="#4c65b6" stroke-width="2.2" marker-end="url(#sm-arr-indigo)"/>
  <rect x="220" y="220" width="232" height="44" rx="6" fill="#ffffff" stroke="#4c65b6" stroke-width="1.2"/>
  <text x="336" y="239" text-anchor="middle" font-size="13.5" font-weight="700" fill="#3a4f93">RPC 2: sample_tokens()</text>
  <text x="336" y="258" text-anchor="middle" font-size="13.5" fill="#4d5652">先解包并置槽 None，再采样草拟</text>

  <!-- Red Error Guard Edge on OCCUPIED -->
  <path d="M 624 102 C 654 58, 720 58, 738 80" fill="none" stroke="#b54237" stroke-width="2" marker-end="url(#sm-arr-red)"/>
  <rect x="688" y="82" width="196" height="72" rx="7" fill="#fff0e9" stroke="#b54237" stroke-width="1.6"/>
  <text x="786" y="106" text-anchor="middle" font-size="14" font-weight="700" fill="#8f3229">✗ 槽非空再调 RPC 1</text>
  <text x="786" y="127" text-anchor="middle" font-size="13.5" font-family="var(--font-mono)" fill="#8f3229">RuntimeError</text>
  <text x="786" y="146" text-anchor="middle" font-size="13.5" fill="#4d5652">State error 拒绝覆写</text>

  <!-- In-Place Replay Overwrite Hazard Box linked to OCCUPIED -->
  <path d="M 664 182 L 686 196" fill="none" stroke="#b54237" stroke-width="1.6" stroke-dasharray="4 3" marker-end="url(#sm-arr-red)"/>
  <rect x="688" y="168" width="196" height="92" rx="7" fill="#fff0e9" stroke="#d88c82" stroke-width="1.3"/>
  <text x="786" y="191" text-anchor="middle" font-size="14" font-weight="700" fill="#8f3229">图回放原地覆写隐患</text>
  <text x="786" y="213" text-anchor="middle" font-size="13.5" fill="#4d5652">hidden 指向固定图输出缓冲</text>
  <text x="786" y="234" text-anchor="middle" font-size="13.5" fill="#4d5652">入口先解包置 None 留局部引用</text>
  <text x="786" y="253" text-anchor="middle" font-size="13.5" font-weight="700" fill="#8f3229">草稿层须在下轮回放前读完</text>

  <!-- Early Exits (Stay in EMPTY, bypass slot!) -->
  <path d="M 126 208 L 126 290" fill="none" stroke="#4d5652" stroke-width="1.6" stroke-dasharray="4 3" marker-end="url(#sm-arr-ink)"/>
  <rect x="16" y="294" width="868" height="72" rx="7" fill="#f7e7f2" stroke="#9a4b86" stroke-width="1.3"/>
  <text x="30" y="319" font-size="14.5" font-weight="700" fill="#7a3a6a">不写槽四条旁路（保持 EMPTY；PP 开 broadcast_pp_output 收末段 logits 后仍写槽）：</text>
  <rect x="30" y="330" width="182" height="26" rx="4" fill="#ffffff" stroke="#9a4b86" stroke-width="1"/>
  <text x="121" y="348" text-anchor="middle" font-size="13.5" fill="#4d5652">0 token：空返 / KV 协作</text>
  <rect x="222" y="330" width="280" height="26" rx="4" fill="#ffffff" stroke="#9a4b86" stroke-width="1"/>
  <text x="362" y="348" text-anchor="middle" font-size="13.5" fill="#4d5652">PP 非末段（未开 broadcast_pp_output）</text>
  <rect x="512" y="330" width="166" height="26" rx="4" fill="#ffffff" stroke="#9a4b86" stroke-width="1"/>
  <text x="595" y="348" text-anchor="middle" font-size="13.5" fill="#4d5652">Pooling：直交向量</text>
  <rect x="688" y="330" width="182" height="26" rx="4" fill="#ffffff" stroke="#9a4b86" stroke-width="1"/>
  <text x="779" y="348" text-anchor="middle" font-size="13.5" fill="#7a3a6a">DP1 陪跑：_dummy_run</text>

  <!-- Divider -->
  <line x1="16" y1="384" x2="884" y2="384" stroke="#b8bcb5" stroke-width="1.4" stroke-dasharray="6 4"/>

  <!-- Section 2: 3-Tier Lifetime Ruler -->
  <text x="16" y="410" font-size="16" font-weight="700" fill="#17211f">② Runner 对象三层寿命标尺（读 5,000+ 行源码时的定位坐标）</text>

  <!-- Bar 1: Service-wide -->
  <rect x="16" y="426" width="868" height="34" rx="5" fill="#e8edff" stroke="#4c65b6" stroke-width="1.3"/>
  <text x="30" y="448" font-size="14" font-weight="700" fill="#3a4f93">整个服务期（启动一次）</text>
  <text x="234" y="448" font-size="13.5" fill="#4d5652">模型权重 · 物理 KV 缓存池 · 已录 ACL 图 · 注意力后端分组</text>

  <!-- Bar 2: Cross-step -->
  <rect x="16" y="468" width="664" height="34" rx="5" fill="#ddf4ef" stroke="#087f73" stroke-width="1.3"/>
  <text x="30" y="490" font-size="14" font-weight="700" fill="#065f56">跨步增量改（活在多步间）</text>
  <text x="234" y="490" font-size="13.5" fill="#4d5652">持久批次 input_batch · 块表 · 接受数表 · 异步留卡 token</text>
  <text x="692" y="490" font-size="13.5" fill="#66716d">main 迁入 MRV2 常驻</text>

  <!-- Bar 3: Inter-RPC -->
  <rect x="16" y="510" width="460" height="34" rx="5" fill="#fff4cf" stroke="#c78300" stroke-width="1.3"/>
  <text x="30" y="532" font-size="14" font-weight="700" fill="#936300">步内 / 两次 RPC 间</text>
  <text x="196" y="532" font-size="13.5" fill="#4d5652">拼装输入 · 层间激活 · ExecuteModelState</text>
  <text x="488" y="532" font-size="13.5" fill="#8f3229">用完即清，下步原地覆写</text>
</svg>
