caption: >-
  NPUModelRunner 单槽位状态机与对象寿命标尺：上半刻画 ExecuteModelState 在 EMPTY 与 OCCUPIED 之间随 execute_model / sample_tokens 严格交替（RPC 2 入口先解包并置槽 None，再用局部引用完成采样与草拟）、槽非空抛 State error、固定图缓冲原地覆写红线及四条不写槽旁路（含未开 broadcast_pp_output 的 PP 非末段）；下半用三级寿命条区分服务级、跨步级与单步级对象。
