<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 456" width="900" height="456" role="img" aria-label="视觉编码器末段编译区间放宽标尺与 GLM 双机四条融合规则命中边界" font-family="var(--font-sans)">
  <title>视觉编码器末段编译区间放宽（2³¹−1）与 GLM 双机四条融合规则实际命中盘点</title>
  <desc>Number-line showing last compile range upper bound expansion to 2^31-1 for vision encoder compilation, plus four-rule hit audit for GLM dual-node deployment</desc>
  <defs>
    <marker id="cv-arr-teal" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="#087f73"/>
    </marker>
  </defs>

  <!-- Section 1: Vision Encoder Compile Range Number-Line -->
  <text x="16" y="28" font-size="16" font-weight="700" fill="#17211f">① 视觉编码器编译（compile_mm_encoder）：仅放宽最后一段编译区间的上界</text>
  <text x="884" y="28" text-anchor="end" font-size="13.5" fill="#66716d">独立于 cudagraph_mm_encoder 图捕获</text>

  <!-- Track 1: Language Ranges -->
  <text x="16" y="64" font-size="14" font-weight="700" fill="#4d5652">语言主干区间（示意）：</text>
  <rect x="200" y="46" width="128" height="32" rx="5" fill="#e8edff" stroke="#4c65b6" stroke-width="1.3"/>
  <text x="264" y="67" text-anchor="middle" font-size="14" font-weight="700" font-family="var(--font-mono)" fill="#3a4f93">[1, 4]</text>
  <rect x="342" y="46" width="128" height="32" rx="5" fill="#e8edff" stroke="#4c65b6" stroke-width="1.3"/>
  <text x="406" y="67" text-anchor="middle" font-size="14" font-weight="700" font-family="var(--font-mono)" fill="#3a4f93">[5, 8]</text>
  <text x="486" y="67" font-size="13.5" fill="#66716d">← 上界止于 8（max_num_batched_tokens）</text>

  <!-- Track 2: Vision Ranges -->
  <text x="16" y="114" font-size="14" font-weight="700" fill="#065f56">视觉编码区间（放宽后）：</text>
  <rect x="200" y="96" width="128" height="32" rx="5" fill="#e8edff" stroke="#4c65b6" stroke-width="1.3"/>
  <text x="264" y="117" text-anchor="middle" font-size="14" font-weight="700" font-family="var(--font-mono)" fill="#3a4f93">[1, 4] 保留</text>

  <rect x="342" y="96" width="542" height="32" rx="5" fill="#ddf4ef" stroke="#087f73" stroke-width="1.5"/>
  <text x="613" y="117" text-anchor="middle" font-size="14" font-weight="700" font-family="var(--font-mono)" fill="#065f56">[5, 2³¹ − 1 = 2,147,483,647]（起点 5 不变，仅扩末段上界）</text>

  <!-- Marker for 10 vision tokens -->
  <circle cx="460" cy="148" r="6" fill="#087f73"/>
  <line x1="460" y1="142" x2="460" y2="130" stroke="#087f73" stroke-width="1.6" marker-end="url(#cv-arr-teal)"/>
  <text x="474" y="148" font-size="13" font-weight="700" fill="#065f56">本步 10 个视觉位置 → 落入第 2 区间</text>
  <text x="474" y="167" font-size="13" fill="#065f56">（未预分配 2³¹ 显存，也不放开输入上限）</text>

  <line x1="16" y1="192" x2="884" y2="192" stroke="#b8bcb5" stroke-width="1.4" stroke-dasharray="6 4"/>

  <!-- Section 2: GLM Dual-Node 4-Rule Audit Grid -->
  <text x="16" y="220" font-size="16" font-weight="700" fill="#17211f">② 复杂异构实战对照：GLM 双机（W8A8 / FULL_DECODE_ONLY）四条本地规则盘点</text>
  <text x="16" y="242" font-size="13.5" fill="#66716d">官方命令开 npugraph_ex、关 static_kernel；下表核对四条本地规则的拓扑与门槛（外部后端自有改写须另查日志）</text>

  <!-- 2x2 Rule Cards -->
  <rect x="16" y="258" width="424" height="86" rx="7" fill="#fff0e9" stroke="#b54237" stroke-width="1.3"/>
  <text x="30" y="284" font-size="14.5" font-weight="700" fill="#8f3229">1. 归一化接量化（AddRMSNormQuant）</text>
  <text x="30" y="308" font-size="13" fill="#4d5652">mHC 主干先 hc_pre 再传单入参 RMSNorm（无 residual）</text>
  <text x="30" y="330" font-size="13" font-weight="700" fill="#8f3229">→ 不能从 W8A8 直接推出主干命中该规则</text>

  <rect x="460" y="258" width="424" height="86" rx="7" fill="#fff4cf" stroke="#c78300" stroke-width="1.3"/>
  <text x="474" y="284" font-size="14.5" font-weight="700" fill="#936300">2. Q/K 归一化接 RoPE（QKNormRope）</text>
  <text x="474" y="308" font-size="13" fill="#4d5652">要求注册上下文存在上游 Attention 层且 head_dim = 128</text>
  <text x="474" y="330" font-size="13" font-weight="700" fill="#936300">→ 主干为 MLA/KDA，是否登记须核最终注册上下文</text>

  <rect x="16" y="356" width="424" height="86" rx="7" fill="#e8edff" stroke="#4c65b6" stroke-width="1.3"/>
  <text x="30" y="382" font-size="14.5" font-weight="700" fill="#3a4f93">3. All-Reduce 接归一化（AllReduceRMS）</text>
  <text x="30" y="406" font-size="13" fill="#4d5652">本地管理器要求编译区间起点 &gt; 512 token</text>
  <text x="30" y="428" font-size="13" font-weight="700" fill="#3a4f93">→ decode 宽度 ≤ 128 不满足本地条件（外部后端另核）</text>

  <rect x="460" y="356" width="424" height="86" rx="7" fill="#ddf4ef" stroke="#087f73" stroke-width="1.3"/>
  <text x="474" y="382" font-size="14.5" font-weight="700" fill="#065f56">4. 乘系数接相加（MulsAdd）</text>
  <text x="474" y="406" font-size="13" fill="#4d5652">精度条件满足；仅匹配模型指定的 routed_scaling_factor</text>
  <text x="474" y="428" font-size="13" font-weight="700" fill="#065f56">→ 实际命中次数以编译日志与 trace 为准</text>
</svg>
