<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 470" width="900" height="470" role="img" aria-label="归一化接量化 Pass 图改写：消除 BF16 中间张量显存往返并保留双输出" font-family="var(--font-sans)">
  <title>Pass 图改写实例：AddRMSNorm → StaticQuant 消除 BF16 中间张量显存往返，保留 [4,6] 残差与 [8,12] 整数输出</title>
  <desc>Before vs after FX graph rewrite for AddRMSNormQuant showing elimination of the [0.78, 1.18] BF16 global memory round-trip while preserving [4,6] residual and [8,12] quantized output</desc>
  <defs>
    <marker id="rw-arr-ink" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="#4d5652"/>
    </marker>
    <marker id="rw-arr-red" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="#b54237"/>
    </marker>
    <marker id="rw-arr-teal" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="#087f73"/>
    </marker>
    <marker id="rw-arr-indigo" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="#4c65b6"/>
    </marker>
  </defs>

  <text x="16" y="28" font-size="16" font-weight="700" fill="#17211f">Pass 图改写实演：AddRMSNorm → StaticQuant 如何消除中间 BF16 往返</text>
  <text x="884" y="28" text-anchor="end" font-size="13.5" fill="#66716d">示意输入 x=[3,4], res=[1,2], γ=[1,1], s=0.1</text>

  <!-- Center Rewrite Arrow -->
  <line x1="450" y1="48" x2="450" y2="392" stroke="#b8bcb5" stroke-width="1.4" stroke-dasharray="6 4"/>
  <rect x="404" y="194" width="92" height="36" rx="18" fill="#087f73"/>
  <text x="450" y="217" text-anchor="middle" font-size="14" font-weight="700" fill="#ffffff">Pass 改写 →</text>

  <!-- LEFT HALF: BEFORE (Unfused) -->
  <text x="16" y="64" font-size="15" font-weight="700" fill="#8f3229">✗ 替换前（Pattern）：两步独立算子，中间 BF16 进出显存</text>

  <!-- Inputs Left -->
  <rect x="26" y="80" width="152" height="40" rx="5" fill="#fff4cf" stroke="#c78300" stroke-width="1.2"/>
  <text x="102" y="105" text-anchor="middle" font-size="13.5" font-weight="700" fill="#936300">x = [3, 4]</text>
  <rect x="218" y="80" width="160" height="40" rx="5" fill="#e8edff" stroke="#4c65b6" stroke-width="1.2"/>
  <text x="298" y="105" text-anchor="middle" font-size="13.5" font-weight="700" fill="#3a4f93">residual = [1, 2]</text>

  <path d="M 102 120 L 160 144" fill="none" stroke="#4d5652" stroke-width="1.5" marker-end="url(#rw-arr-ink)"/>
  <path d="M 298 120 L 240 144" fill="none" stroke="#4d5652" stroke-width="1.5" marker-end="url(#rw-arr-ink)"/>

  <!-- Node 1 Left -->
  <rect x="46" y="148" width="316" height="54" rx="7" fill="#fff4cf" stroke="#c78300" stroke-width="1.4"/>
  <text x="204" y="172" text-anchor="middle" font-size="14" font-weight="700" font-family="var(--font-mono)" fill="#936300">npu_add_rms_norm_bias</text>
  <text x="204" y="193" text-anchor="middle" font-size="13.5" fill="#4d5652">残差和 [4,6] · RMS ≈ 5.10</text>

  <!-- Output A Left (Residual kept) -->
  <path d="M 110 202 L 110 330" fill="none" stroke="#4c65b6" stroke-width="1.7" marker-end="url(#rw-arr-indigo)"/>
  <rect x="24" y="334" width="170" height="48" rx="6" fill="#e8edff" stroke="#4c65b6" stroke-width="1.3"/>
  <text x="109" y="355" text-anchor="middle" font-size="14" font-weight="700" fill="#3a4f93">残差 [4, 6]</text>
  <text x="109" y="374" text-anchor="middle" font-size="13.5" fill="#4d5652">写回 GM 传下层</text>

  <!-- Intermediate GM Round-Trip (RED!) -->
  <path d="M 290 202 L 290 220" fill="none" stroke="#b54237" stroke-width="1.8" marker-end="url(#rw-arr-red)"/>
  <rect x="192" y="224" width="196" height="44" rx="5" fill="#fff0e9" stroke="#b54237" stroke-width="1.5" stroke-dasharray="5 3"/>
  <text x="290" y="244" text-anchor="middle" font-size="13.5" font-weight="700" fill="#8f3229">BF16 [0.78, 1.18]</text>
  <text x="290" y="262" text-anchor="middle" font-size="13.5" fill="#8f3229">写出 GM → 再整块读回</text>
  <path d="M 290 268 L 290 284" fill="none" stroke="#b54237" stroke-width="1.8" marker-end="url(#rw-arr-red)"/>

  <!-- Node 2 Left -->
  <rect x="200" y="288" width="180" height="36" rx="6" fill="#f7e7f2" stroke="#9a4b86" stroke-width="1.3"/>
  <text x="290" y="311" text-anchor="middle" font-size="13.5" font-weight="700" font-family="var(--font-mono)" fill="#7a3a6a">vllm.quantize(s=0.1)</text>
  <path d="M 290 324 L 290 332" fill="none" stroke="#087f73" stroke-width="1.6" marker-end="url(#rw-arr-teal)"/>

  <!-- Output B Left -->
  <rect x="206" y="334" width="170" height="48" rx="6" fill="#ddf4ef" stroke="#087f73" stroke-width="1.3"/>
  <text x="291" y="355" text-anchor="middle" font-size="14" font-weight="700" fill="#065f56">INT8 [8, 12]</text>
  <text x="291" y="374" text-anchor="middle" font-size="13.5" fill="#4d5652">送下层整数矩阵乘</text>

  <!-- RIGHT HALF: AFTER (Fused) -->
  <text x="514" y="64" font-size="15" font-weight="700" fill="#065f56">✓ 替换后（Replacement）：单核内完成，省去中间落盘</text>

  <!-- Inputs Right -->
  <rect x="524" y="80" width="152" height="40" rx="5" fill="#fff4cf" stroke="#c78300" stroke-width="1.2"/>
  <text x="600" y="105" text-anchor="middle" font-size="13.5" font-weight="700" fill="#936300">x = [3, 4]</text>
  <rect x="716" y="80" width="160" height="40" rx="5" fill="#e8edff" stroke="#4c65b6" stroke-width="1.2"/>
  <text x="796" y="105" text-anchor="middle" font-size="13.5" font-weight="700" fill="#3a4f93">residual = [1, 2]</text>

  <path d="M 600 120 L 656 144" fill="none" stroke="#087f73" stroke-width="1.6" marker-end="url(#rw-arr-teal)"/>
  <path d="M 796 120 L 740 144" fill="none" stroke="#087f73" stroke-width="1.6" marker-end="url(#rw-arr-teal)"/>

  <!-- Single Fused Node Right -->
  <rect x="520" y="148" width="360" height="148" rx="8" fill="#ddf4ef" stroke="#087f73" stroke-width="1.7"/>
  <text x="700" y="176" text-anchor="middle" font-size="15" font-weight="700" font-family="var(--font-mono)" fill="#065f56">npu_add_rms_norm_quant</text>
  <text x="700" y="200" text-anchor="middle" font-size="13.5" fill="#4d5652">单融合核内依次算：残差和 [4,6] → RMS ≈ 5.10 → ÷ 0.1</text>

  <!-- Struck-out intermediate box inside chip -->
  <rect x="546" y="216" width="308" height="44" rx="5" fill="#ffffff" stroke="#087f73" stroke-width="1.2" stroke-dasharray="4 3"/>
  <text x="700" y="236" text-anchor="middle" font-size="13.5" font-weight="700" fill="#065f56">BF16 [0.78, 1.18] 留片上直接量化</text>
  <text x="700" y="254" text-anchor="middle" font-size="13.5" fill="#8f3229">✗ 消除中间写出 GM 与再次读回</text>

  <text x="700" y="284" text-anchor="middle" font-size="13.5" font-weight="700" fill="#065f56">同时返回两路外部消费者需要的张量</text>

  <!-- Dual Preserved Outputs Right -->
  <path d="M 608 296 L 608 330" fill="none" stroke="#4c65b6" stroke-width="1.7" marker-end="url(#rw-arr-indigo)"/>
  <path d="M 792 296 L 792 330" fill="none" stroke="#087f73" stroke-width="1.7" marker-end="url(#rw-arr-teal)"/>

  <rect x="522" y="334" width="170" height="48" rx="6" fill="#e8edff" stroke="#4c65b6" stroke-width="1.4"/>
  <text x="607" y="355" text-anchor="middle" font-size="14" font-weight="700" fill="#3a4f93">✓ 保留残差 [4, 6]</text>
  <text x="607" y="374" text-anchor="middle" font-size="13.5" fill="#4d5652">仍写出 GM 供下层</text>

  <rect x="708" y="334" width="170" height="48" rx="6" fill="#ddf4ef" stroke="#087f73" stroke-width="1.4"/>
  <text x="793" y="355" text-anchor="middle" font-size="14" font-weight="700" fill="#065f56">✓ 保留 INT8 [8, 12]</text>
  <text x="793" y="374" text-anchor="middle" font-size="13.5" fill="#4d5652">直通下层 W8A8 矩阵乘</text>

  <!-- Bottom Guard Bar -->
  <rect x="16" y="404" width="868" height="52" rx="6" fill="#ece9df" stroke="#b8bcb5" stroke-width="1.2"/>
  <text x="30" y="427" font-size="14" font-weight="700" fill="#17211f">配置开启 ≠ 候选已注册 ≠ 图中真命中：</text>
  <text x="30" y="447" font-size="13.5" fill="#4d5652">匹配严格看计算图拓扑、dtype、ε 常量与硬件/量化条件（例：GLM mHC 无 residual 入参，不直接匹配本条残差+RMSNorm 规则）。</text>
</svg>
