<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 712" width="880" height="712" role="img" aria-label="同一批规则在启动时登记两处，之后由哪条编译路径应用取决于一个开关；录完图还要到 B4 再判一次这一轮能不能回放。">
  <title>同一批规则在启动时登记两处，之后由哪条编译路径应用取决于一个开关；录完图还要到 B4 再判一次这一轮能不能回放。</title>
  <defs><marker id="npugraph-ex-flow-ah-ink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="var(--color-ink, #17211f)"/></marker></defs>
  <path d="M440 78 L440 116" fill="none" stroke="var(--color-ink, #17211f)" stroke-width="1.4" marker-end="url(#npugraph-ex-flow-ah-ink)"/>
  <path d="M440 162 L440 200" fill="none" stroke="var(--color-ink, #17211f)" stroke-width="1.4" marker-end="url(#npugraph-ex-flow-ah-ink)"/>
  <path d="M340 246 L215 300" fill="none" stroke="var(--color-ink, #17211f)" stroke-width="1.4" marker-end="url(#npugraph-ex-flow-ah-ink)"/>
  <path d="M560 246 L665 300" fill="none" stroke="var(--color-ink, #17211f)" stroke-width="1.4" marker-end="url(#npugraph-ex-flow-ah-ink)"/>
  <path d="M215 352 L215 392" fill="none" stroke="var(--color-ink, #17211f)" stroke-width="1.4" marker-end="url(#npugraph-ex-flow-ah-ink)"/>
  <path d="M665 352 L665 392" fill="none" stroke="var(--color-ink, #17211f)" stroke-width="1.4" marker-end="url(#npugraph-ex-flow-ah-ink)"/>
  <path d="M215 444 L340 492" fill="none" stroke="var(--color-ink, #17211f)" stroke-width="1.4" marker-end="url(#npugraph-ex-flow-ah-ink)"/>
  <path d="M665 444 L560 492" fill="none" stroke="var(--color-ink, #17211f)" stroke-width="1.4" marker-end="url(#npugraph-ex-flow-ah-ink)"/>
  <path d="M440 542 L440 580" fill="none" stroke="var(--color-ink, #17211f)" stroke-width="1.4" marker-end="url(#npugraph-ex-flow-ah-ink)"/>
  <path d="M320 626 L205 650" fill="none" stroke="var(--color-ink, #17211f)" stroke-width="1.4" marker-end="url(#npugraph-ex-flow-ah-ink)"/>
  <path d="M560 626 L675 650" fill="none" stroke="var(--color-ink, #17211f)" stroke-width="1.4" marker-end="url(#npugraph-ex-flow-ah-ink)"/>
  <rect x="210" y="32" width="460" height="46" rx="8" fill="var(--color-control, #66716d)" stroke="var(--color-ink, #17211f)" stroke-width="1.5"/>
  <text x="440" y="60" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="14" font-weight="700" fill="var(--color-ink-inverse, #ffffff)" text-anchor="middle">启动：平台按图模式档位决定还编不编</text>
  <rect x="180" y="116" width="520" height="46" rx="8" fill="var(--color-control, #66716d)" stroke="var(--color-ink, #17211f)" stroke-width="1.5"/>
  <text x="440" y="144" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="14" font-weight="700" fill="var(--color-ink-inverse, #ffffff)" text-anchor="middle">规则登记两处：上游匹配器 + 外部后端的替换接口</text>
  <rect x="250" y="200" width="380" height="46" rx="8" fill="var(--color-control, #66716d)" stroke="var(--color-ink, #17211f)" stroke-width="1.5"/>
  <text x="440" y="228" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="14" font-weight="700" fill="var(--color-ink-inverse, #ffffff)" text-anchor="middle">外部编译后端还开着吗？</text>
  <rect x="40" y="300" width="350" height="52" rx="8" fill="var(--color-weight, #c78300)" stroke="var(--color-ink, #17211f)" stroke-width="1.5"/>
  <text x="215" y="331" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="14" font-weight="700" fill="var(--color-ink-inverse, #ffffff)" text-anchor="middle">开：外部后端编译并替换</text>
  <rect x="490" y="300" width="350" height="52" rx="8" fill="var(--color-weight, #c78300)" stroke="var(--color-ink, #17211f)" stroke-width="1.5"/>
  <text x="665" y="331" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="14" font-weight="700" fill="var(--color-ink-inverse, #ffffff)" text-anchor="middle">关：inductor 编译，本地 pass manager 应用</text>
  <rect x="40" y="392" width="350" height="52" rx="8" fill="var(--color-weight, #c78300)" stroke="var(--color-ink, #17211f)" stroke-width="1.5"/>
  <text x="215" y="423" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="14" font-weight="700" fill="var(--color-ink-inverse, #ffffff)" text-anchor="middle">可选 static kernel：筛出宽度提前编译</text>
  <rect x="490" y="392" width="350" height="52" rx="8" fill="var(--color-weight, #c78300)" stroke="var(--color-ink, #17211f)" stroke-width="1.5"/>
  <text x="665" y="423" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="14" font-weight="700" fill="var(--color-ink-inverse, #ffffff)" text-anchor="middle">按编译区间逐条判断哪条规则适用</text>
  <rect x="210" y="492" width="460" height="50" rx="8" fill="var(--color-control, #66716d)" stroke="var(--color-ink, #17211f)" stroke-width="1.5"/>
  <text x="440" y="522" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="14" font-weight="700" fill="var(--color-ink-inverse, #ffffff)" text-anchor="middle">启动期按各个宽度分别录图</text>
  <rect x="190" y="580" width="500" height="46" rx="8" fill="var(--color-control, #66716d)" stroke="var(--color-ink, #17211f)" stroke-width="1.5"/>
  <text x="440" y="608" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="14" font-weight="700" fill="var(--color-ink-inverse, #ffffff)" text-anchor="middle">B4：本轮整齐、宽度在档内、两组模式一致？</text>
  <rect x="60" y="650" width="290" height="34" rx="8" fill="var(--color-token, #087f73)" stroke="var(--color-ink, #17211f)" stroke-width="1.5"/>
  <text x="205" y="672" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="14" font-weight="700" fill="var(--color-ink-inverse, #ffffff)" text-anchor="middle">是 → 用新数据回放那一份</text>
  <rect x="530" y="650" width="290" height="34" rx="8" fill="var(--color-ink, #17211f)" stroke="var(--color-ink, #17211f)" stroke-width="1.5"/>
  <text x="675" y="672" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="14" font-weight="700" fill="var(--color-ink-inverse, #ffffff)" text-anchor="middle">否 → 这一轮逐个算子提交</text>
  <text x="250" y="274" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="13.5" font-weight="400" fill="var(--color-ink, #17211f)">开（默认）</text>
  <text x="640" y="274" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="13.5" font-weight="400" fill="var(--color-ink, #17211f)">关（仍然编译）</text>
  <text x="440" y="376" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="13.5" font-weight="400" fill="var(--color-ink, #17211f)" text-anchor="middle">两条路用的是同一批规则，换的只是谁来应用</text>
  <text x="440" y="472" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="13.5" font-weight="400" fill="var(--color-ink, #17211f)" text-anchor="middle">档位是 NONE 时上面这段整个不做</text>
  <text x="440" y="568" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="13.5" font-weight="400" fill="var(--color-ink, #17211f)" text-anchor="middle">编译成功与本轮命中图是两次判断</text>
</svg>
