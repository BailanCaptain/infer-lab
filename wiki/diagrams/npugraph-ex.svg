<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 500" width="900" height="500" role="img" aria-label="MulsAdd 算子融合前后对比：显存往返 128 B 与片上 UB 原位累加" font-family="var(--font-sans)">
  <title>同一段「乘系数再相加」：不融合时中间结果进出显存往返 128 B，融合后留驻片上 UB</title>
  <desc>Two-lane comparison of unfused mul + add (writing and reading 64 B intermediate tensor in HBM = 128 B extra traffic) versus fused muls_add via MulsAddFusionPass keeping intermediate values inside AI Core UB</desc>
  <defs>
    <marker id="ng-arr-ink" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="#4d5652"/>
    </marker>
    <marker id="ng-arr-amber" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="#c78300"/>
    </marker>
    <marker id="ng-arr-teal" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="#087f73"/>
    </marker>
    <pattern id="ng-grid-coral" width="13" height="10" patternUnits="userSpaceOnUse">
      <rect width="13" height="10" fill="#ffd9cc" stroke="#b54237" stroke-width="0.8"/>
    </pattern>
    <pattern id="ng-grid-amber" width="13" height="10" patternUnits="userSpaceOnUse">
      <rect width="13" height="10" fill="#ffe89e" stroke="#c78300" stroke-width="0.8"/>
    </pattern>
  </defs>

  <text x="20" y="28" font-size="15.5" font-weight="700" fill="#17211f">算子融合前后对比（4×8 BF16 = 64 B 示意）：消除中间张量的显存往返</text>

  <!-- TOP LANE: UNFUSED -->
  <rect x="16" y="46" width="868" height="196" rx="8" fill="#fff4cf" fill-opacity="0.24" stroke="#c78300" stroke-width="1.4" stroke-dasharray="6 3"/>
  <rect x="28" y="56" width="388" height="28" rx="5" fill="#c78300"/>
  <text x="222" y="75" text-anchor="middle" font-size="13" font-weight="700" fill="#ffffff">不融合路径：两次独立算子下发 · 中间结果落地显存</text>

  <!-- Input x -->
  <rect x="28" y="100" width="132" height="108" rx="6" fill="#fff0e9" stroke="#b54237" stroke-width="1.3"/>
  <rect x="42" y="110" width="104" height="40" fill="url(#ng-grid-coral)" stroke="#b54237" stroke-width="1"/>
  <text x="94" y="172" text-anchor="middle" font-size="12.5" font-weight="700" fill="#8f3229">输入 x [4×8]</text>
  <text x="94" y="193" text-anchor="middle" font-size="12" fill="#4d5652">BF16 · 64 B</text>

  <line x1="160" y1="154" x2="184" y2="154" stroke="#4d5652" stroke-width="1.7" marker-end="url(#ng-arr-ink)"/>

  <!-- Kernel 1 -->
  <rect x="188" y="118" width="120" height="72" rx="6" fill="#e5f4f1" stroke="#087f73" stroke-width="1.4"/>
  <text x="248" y="148" text-anchor="middle" font-size="13" font-weight="700" fill="#065f56">算子 1：× 系数</text>
  <text x="248" y="171" text-anchor="middle" font-size="12" font-family="var(--font-mono)" fill="#4d5652">aten.mul</text>

  <line x1="308" y1="154" x2="334" y2="154" stroke="#c78300" stroke-width="1.8" marker-end="url(#ng-arr-amber)"/>

  <!-- HBM Temp Tensor -->
  <rect x="338" y="92" width="216" height="136" rx="6" fill="#fff4cf" stroke="#c78300" stroke-width="1.6" stroke-dasharray="5 3"/>
  <text x="446" y="113" text-anchor="middle" font-size="12.5" font-weight="700" fill="#936300">设备显存（HBM）临时缓冲</text>
  <rect x="394" y="121" width="104" height="30" fill="url(#ng-grid-amber)" stroke="#c78300" stroke-width="1"/>
  <text x="446" y="172" text-anchor="middle" font-size="12.5" font-weight="700" fill="#8f3229">temp [4×8] = 64 B</text>
  <text x="446" y="194" text-anchor="middle" font-size="12" fill="#936300">写出 64 B + 读回 64 B</text>
  <text x="446" y="215" text-anchor="middle" font-size="12" font-weight="700" fill="#b54237">= 128 B 额外显存往返</text>

  <line x1="554" y1="154" x2="580" y2="154" stroke="#c78300" stroke-width="1.8" marker-end="url(#ng-arr-amber)"/>

  <!-- Kernel 2 -->
  <rect x="584" y="118" width="126" height="72" rx="6" fill="#e5f4f1" stroke="#087f73" stroke-width="1.4"/>
  <text x="647" y="148" text-anchor="middle" font-size="13" font-weight="700" fill="#065f56">算子 2：＋ y</text>
  <text x="647" y="171" text-anchor="middle" font-size="12" fill="#4d5652">另读 y (64 B)</text>

  <line x1="710" y1="154" x2="736" y2="154" stroke="#4d5652" stroke-width="1.7" marker-end="url(#ng-arr-ink)"/>

  <!-- Output unfused -->
  <rect x="740" y="100" width="132" height="108" rx="6" fill="#fff0e9" stroke="#b54237" stroke-width="1.3"/>
  <rect x="754" y="110" width="104" height="40" fill="url(#ng-grid-coral)" stroke="#b54237" stroke-width="1"/>
  <text x="806" y="172" text-anchor="middle" font-size="12.5" font-weight="700" fill="#8f3229">输出 [4×8]</text>
  <text x="806" y="193" text-anchor="middle" font-size="12" fill="#4d5652">写出 64 B</text>

  <!-- BOTTOM LANE: FUSED -->
  <rect x="16" y="260" width="868" height="224" rx="8" fill="#e5f4f1" fill-opacity="0.28" stroke="#087f73" stroke-width="1.5"/>
  <rect x="28" y="270" width="430" height="28" rx="5" fill="#087f73"/>
  <text x="243" y="289" text-anchor="middle" font-size="13" font-weight="700" fill="#ffffff">融合路径：MulsAddPattern 替换为单算子 muls_add（片上直连）</text>

  <!-- Input x & y -->
  <rect x="28" y="312" width="146" height="72" rx="6" fill="#fff0e9" stroke="#b54237" stroke-width="1.3"/>
  <text x="101" y="340" text-anchor="middle" font-size="12.5" font-weight="700" fill="#8f3229">输入 x [4×8]</text>
  <text x="101" y="363" text-anchor="middle" font-size="12" fill="#4d5652">BF16 · 读入 64 B</text>

  <rect x="28" y="398" width="146" height="72" rx="6" fill="#fff0e9" stroke="#b54237" stroke-width="1.3"/>
  <text x="101" y="426" text-anchor="middle" font-size="12.5" font-weight="700" fill="#8f3229">输入 y [4×8]</text>
  <text x="101" y="449" text-anchor="middle" font-size="12" fill="#4d5652">BF16 · 读入 64 B</text>

  <path d="M 174 348 L 206 348 L 206 372 L 232 372" fill="none" stroke="#087f73" stroke-width="1.8" marker-end="url(#ng-arr-teal)"/>
  <path d="M 174 434 L 206 434 L 206 410 L 232 410" fill="none" stroke="#087f73" stroke-width="1.8" marker-end="url(#ng-arr-teal)"/>

  <!-- Fused Kernel / UB -->
  <rect x="236" y="312" width="464" height="158" rx="8" fill="#ffffff" stroke="#087f73" stroke-width="1.8"/>
  <rect x="248" y="322" width="440" height="28" rx="4" fill="#ebeef9"/>
  <text x="468" y="341" text-anchor="middle" font-size="12.5" font-weight="700" fill="#2d3e75">单个融合算子 muls_add · AI Core 片上缓冲（UB）</text>

  <rect x="254" y="362" width="196" height="62" rx="5" fill="#e5f4f1" stroke="#087f73" stroke-width="1.3"/>
  <text x="352" y="388" text-anchor="middle" font-size="12.5" font-weight="700" fill="#065f56">① 片上乘系数 x × scale</text>
  <text x="352" y="410" text-anchor="middle" font-size="12" fill="#4d5652">结果留驻片上 UB</text>

  <line x1="450" y1="393" x2="482" y2="393" stroke="#087f73" stroke-width="1.8" marker-end="url(#ng-arr-teal)"/>

  <rect x="486" y="362" width="198" height="62" rx="5" fill="#e5f4f1" stroke="#087f73" stroke-width="1.3"/>
  <text x="585" y="388" text-anchor="middle" font-size="12.5" font-weight="700" fill="#065f56">② 片上原位相加 ＋ y</text>
  <text x="585" y="410" text-anchor="middle" font-size="12" fill="#4d5652">0 B 中间显存读写</text>

  <text x="468" y="452" text-anchor="middle" font-size="12.5" font-weight="700" fill="#065f56">净省：1 次算子启动 + 128 B 中间张量显存往返</text>

  <line x1="700" y1="391" x2="736" y2="391" stroke="#087f73" stroke-width="1.8" marker-end="url(#ng-arr-teal)"/>

  <!-- Output fused -->
  <rect x="740" y="337" width="132" height="108" rx="6" fill="#fff0e9" stroke="#b54237" stroke-width="1.3"/>
  <rect x="754" y="347" width="104" height="40" fill="url(#ng-grid-coral)" stroke="#b54237" stroke-width="1"/>
  <text x="806" y="409" text-anchor="middle" font-size="12.5" font-weight="700" fill="#8f3229">输出 [4×8]</text>
  <text x="806" y="430" text-anchor="middle" font-size="12" fill="#4d5652">仅写出 64 B</text>
</svg>
