<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 720" width="900" height="720" role="img" aria-label="开关造 pattern，pattern 注册两遍，编译时才二选一——所以「关掉 npugraph_ex」换的是执行者，不是这批融合本身">
  <title>开关造 pattern，pattern 注册两遍，编译时才二选一——所以「关掉 npugraph_ex」换的是执行者，不是这批融合本身</title>
  <rect width="900" height="720" fill="var(--color-surface, #fbfaf6)"/>
  <rect x="20" y="320" width="412" height="300" rx="12" fill="var(--color-kv-soft, #e8edff)"/>
  <rect x="36" y="334" width="348.2" height="26.5" rx="13.3" fill="var(--color-kv, #4c65b6)"/><text x="47" y="352.1" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="13.5" font-weight="700" fill="var(--color-ink-inverse, #ffffff)">npugraph_ex 关着（PIECEWISE / NONE / 310P）</text>
  <text x="38" y="377" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="12.5" font-weight="400" fill="var(--color-ink-muted, #5b6763)">那条请求在这边：默认模式就把它写回了 False</text>
  <rect x="468" y="320" width="412" height="300" rx="12" fill="var(--color-weight-soft, #fff4cf)"/>
  <rect x="484" y="334" width="357.1" height="26.5" rx="13.3" fill="var(--color-weight, #b87a00)"/><text x="495" y="352.1" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="13.5" font-weight="700" fill="var(--color-ink-inverse, #ffffff)">npugraph_ex 开着（FULL / FULL_DECODE_ONLY）</text>
  <text x="486" y="377" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="12.5" font-weight="400" fill="var(--color-ink-muted, #5b6763)">cudagraph_mode 必须显式换成这两个之一</text>
  <rect x="20" y="20" width="860" height="50" rx="10" fill="var(--color-kv-soft, #e8edff)"/>
  <rect x="20" y="20" width="5" height="50" rx="2.5" fill="var(--color-kv, #4c65b6)"/>
  <text x="42" y="42" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="15" font-weight="700" fill="var(--color-ink, #17211f)">ascend_compilation_config：三个 fuse_* 开关</text>
  <text x="42" y="62" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="12.5" font-weight="400" fill="var(--color-ink-muted, #5b6763)">fuse_norm_quant / fuse_qknorm_rope / fuse_muls_add；v0.23 另有 fuse_allreduce_rms</text>
  <rect x="655.5" y="32.5" width="205.5" height="21.5" rx="10.8" fill="var(--color-surface, #fbfaf6)" stroke="var(--color-kv, #4c65b6)" stroke-width="1"/><text x="758.3" y="50" font-family="'JetBrains Mono',ui-monospace,monospace" font-size="12.5" font-weight="400" fill="var(--color-kv, #4c65b6)" text-anchor="middle">ascend_compilation_config</text>
  <rect x="20" y="82" width="860" height="62" rx="10" fill="var(--color-weight-soft, #fff4cf)"/>
  <rect x="20" y="82" width="5" height="62" rx="2.5" fill="var(--color-weight, #b87a00)"/>
  <text x="42" y="110" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="15" font-weight="700" fill="var(--color-ink, #17211f)">GraphFusionPassManager.configure()：按开关造 pattern</text>
  <text x="42" y="130" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="12.5" font-weight="400" fill="var(--color-ink-muted, #5b6763)">register() 注册两遍：一遍给 torch 的 PatternMatcherPass，一遍给 npugraph_ex</text>
  <rect x="693" y="100.5" width="168" height="21.5" rx="10.8" fill="var(--color-surface, #fbfaf6)" stroke="var(--color-weight, #b87a00)" stroke-width="1"/><text x="777" y="118" font-family="'JetBrains Mono',ui-monospace,monospace" font-size="12.5" font-weight="400" fill="var(--color-weight, #b87a00)" text-anchor="middle">register_replacement</text>
  <line x1="450" y1="322" x2="450" y2="620" stroke="var(--color-accent, #e85b32)" stroke-width="2.5" stroke-dasharray="7 5"/>
  <text x="450" y="311" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="13" font-weight="700" fill="var(--color-accent, #e85b32)" text-anchor="middle">AscendCompiler.compile() 在这里二选一</text>
  <rect x="20" y="158" width="425" height="56" rx="11" fill="var(--color-surface, #fbfaf6)" stroke="var(--color-weight, #b87a00)" stroke-width="1.5"/>
  <text x="36" y="174" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="14.5" font-weight="700" fill="var(--color-ink, #17211f)">fuse_norm_quant</text>
  <text x="36" y="192" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="12.5" font-weight="400" fill="var(--color-ink-muted, #5b6763)">npu_add_rms_norm 接量化 → 一个算子</text>
  <text x="36" y="209" font-family="'JetBrains Mono',ui-monospace,monospace" font-size="12.5" font-weight="400" fill="var(--color-weight, #b87a00)">npu_add_rms_norm_dynamic_quant</text>
  <rect x="455" y="158" width="425" height="56" rx="11" fill="var(--color-surface, #fbfaf6)" stroke="var(--color-weight, #b87a00)" stroke-width="1.5"/>
  <text x="471" y="174" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="14.5" font-weight="700" fill="var(--color-ink, #17211f)">fuse_qknorm_rope</text>
  <text x="471" y="192" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="12.5" font-weight="400" fill="var(--color-ink-muted, #5b6763)">qkv 切分 + 按头 RMSNorm + RoPE → 一个算子</text>
  <text x="471" y="209" font-family="'JetBrains Mono',ui-monospace,monospace" font-size="12.5" font-weight="400" fill="var(--color-weight, #b87a00)">split_qkv_rmsnorm_rope</text>
  <rect x="20" y="226" width="425" height="56" rx="11" fill="var(--color-surface, #fbfaf6)" stroke="var(--color-weight, #b87a00)" stroke-width="1.5"/>
  <text x="36" y="242" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="14.5" font-weight="700" fill="var(--color-ink, #17211f)">fuse_muls_add</text>
  <text x="36" y="260" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="12.5" font-weight="400" fill="var(--color-ink-muted, #5b6763)">x * scale + y → 一个 Triton 算子</text>
  <text x="36" y="277" font-family="'JetBrains Mono',ui-monospace,monospace" font-size="12.5" font-weight="400" fill="var(--color-weight, #b87a00)">muls_add</text>
  <rect x="455" y="226" width="425" height="56" rx="11" fill="var(--color-surface, #fbfaf6)" stroke="var(--color-ink-faint, #8a928f)" stroke-width="1.5"/>
  <text x="471" y="242" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="14.5" font-weight="700" fill="var(--color-ink, #17211f)">fuse_allreduce_rms（只有 v0.23 有）</text>
  <text x="471" y="260" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="12.5" font-weight="400" fill="var(--color-ink-muted, #5b6763)">matmul + AllReduce + 残差 + RMSNorm → 一个算子</text>
  <text x="471" y="277" font-family="'JetBrains Mono',ui-monospace,monospace" font-size="12.5" font-weight="400" fill="var(--color-ink-faint, #8a928f)">MatmulAllReduceAddRMSNormPass</text>
  <rect x="36" y="394" width="380" height="54" rx="11" fill="var(--color-surface, #fbfaf6)" stroke="var(--color-kv, #4c65b6)" stroke-width="1.5"/>
  <text x="52" y="417.5" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="14.5" font-weight="700" fill="var(--color-ink, #17211f)">fusion_pass_compile()</text>
  <text x="52" y="435.5" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="12.5" font-weight="400" fill="var(--color-ink-muted, #5b6763)">自己的匹配器逐条跑这批 pattern</text>
  <rect x="36" y="462" width="380" height="54" rx="11" fill="var(--color-surface, #fbfaf6)" stroke="var(--color-kv, #4c65b6)" stroke-width="1.5"/>
  <text x="52" y="485.5" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="14.5" font-weight="700" fill="var(--color-ink, #17211f)">改完的图交回 torch.compile</text>
  <text x="52" y="503.5" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="12.5" font-weight="400" fill="var(--color-ink-muted, #5b6763)">只在匹配到的地方发生替换</text>
  <rect x="36" y="530" width="380" height="62" rx="11" fill="var(--color-surface, #fbfaf6)" stroke="var(--color-ink-faint, #8a928f)" stroke-width="1.5"/>
  <text x="52" y="557.5" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="14.5" font-weight="700" fill="var(--color-ink, #17211f)">静态 kernel 与 super kernel 都用不上</text>
  <text x="52" y="575.5" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="12.5" font-weight="400" fill="var(--color-ink-muted, #5b6763)">两级加码都挂在 npugraph_ex 下面</text>
  <rect x="484" y="394" width="380" height="54" rx="11" fill="var(--color-surface, #fbfaf6)" stroke="var(--color-weight, #b87a00)" stroke-width="1.5"/>
  <text x="500" y="417.5" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="14.5" font-weight="700" fill="var(--color-ink, #17211f)">npugraph_ex_compile()</text>
  <text x="500" y="435.5" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="12.5" font-weight="400" fill="var(--color-ink-muted, #5b6763)">装不上就回落 torchair，不报错</text>
  <rect x="484" y="462" width="380" height="54" rx="11" fill="var(--color-surface, #fbfaf6)" stroke="var(--color-weight, #b87a00)" stroke-width="1.5"/>
  <text x="500" y="477" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="14.5" font-weight="700" fill="var(--color-ink, #17211f)">整张图交给外部后端优化</text>
  <text x="500" y="495" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="12.5" font-weight="400" fill="var(--color-ink-muted, #5b6763)">自带默认融合清单 + 注册进来的 pattern</text>
  <text x="500" y="512" font-family="'JetBrains Mono',ui-monospace,monospace" font-size="12.5" font-weight="400" fill="var(--color-weight, #b87a00)">force_eager</text>
  <rect x="484" y="530" width="380" height="62" rx="11" fill="var(--color-surface, #fbfaf6)" stroke="var(--color-accent, #e85b32)" stroke-width="1.5"/>
  <text x="500" y="549" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="14.5" font-weight="700" fill="var(--color-ink, #17211f)">再往上两级加码</text>
  <text x="500" y="567" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="12.5" font-weight="400" fill="var(--color-ink-muted, #5b6763)">按 batch_size 编定形算子，再合成 super kernel</text>
  <text x="500" y="584" font-family="'JetBrains Mono',ui-monospace,monospace" font-size="12.5" font-weight="400" fill="var(--color-accent, #e85b32)">static_kernel_compile</text>
  <text x="20" y="636" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="12.5" font-weight="400" fill="var(--color-ink-muted, #5b6763)">两条路吃的是同一批 pattern：pattern 由 fuse_* 开关决定造不造，enable_npugraph_ex 只决定由谁来匹配。</text>
  <text x="20" y="664" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="12.5" font-weight="400" fill="var(--color-ink-muted, #5b6763)">默认的 FULL_AND_PIECEWISE 要走 piecewise 编译，平台层在那条分支里把 enable_npugraph_ex 与 enable_static_kernel 写回 False。</text>
  <text x="20" y="692" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="12.5" font-weight="400" fill="var(--color-ink-muted, #5b6763)">四条 pass 里只有 fuse_qknorm_rope 在那条请求上有东西可匹配：28 层各中一次，每层 3 个算子并成 1 个。</text>
</svg>
