  <path d="M450 332 L450 388" fill="none" stroke="var(--color-ink, #17211f)" stroke-width="1.4" marker-end="url(#npugraph-ex-ah-ink)"/>
  <path d="M450 72 L245 140" fill="none" stroke="var(--color-control, #66716d)" stroke-width="1.4" marker-end="url(#npugraph-ex-ah-control)"/>
  <path d="M450 72 L655 140" fill="none" stroke="var(--color-control, #66716d)" stroke-width="1.4" marker-end="url(#npugraph-ex-ah-control)"/>
