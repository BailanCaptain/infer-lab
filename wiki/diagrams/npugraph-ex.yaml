layout: scene
id: npugraph-ex
caption: 开关造 pattern，pattern 注册两遍，编译时才二选一——所以「关掉 npugraph_ex」换的是执行者，不是这批融合本身
size: [900, 720]

bands:
  - label: "ascend_compilation_config：三个 fuse_* 开关"
    sub: "fuse_norm_quant / fuse_qknorm_rope / fuse_muls_add；v0.23 另有 fuse_allreduce_rms"
    fn: ascend_compilation_config
    at: [20, 20]
    size: [860, 50]
    tone: neutral
  - label: "GraphFusionPassManager.configure()：按开关造 pattern"
    sub: "register() 注册两遍：一遍给 torch 的 PatternMatcherPass，一遍给 npugraph_ex"
    fn: register_replacement
    at: [20, 82]
    size: [860, 62]
    tone: ascend

boxes:
  - at: [20, 158]
    size: [425, 56]
    title: fuse_norm_quant
    sub: "npu_add_rms_norm 接量化 → 一个算子"
    fn: npu_add_rms_norm_dynamic_quant
    tone: ascend
  - at: [455, 158]
    size: [425, 56]
    title: fuse_qknorm_rope
    sub: "qkv 切分 + 按头 RMSNorm + RoPE → 一个算子"
    fn: split_qkv_rmsnorm_rope
    tone: ascend
  - at: [20, 226]
    size: [425, 56]
    title: fuse_muls_add
    sub: "x * scale + y → 一个 Triton 算子"
    fn: muls_add
    tone: ascend
  - at: [455, 226]
    size: [425, 56]
    title: "fuse_allreduce_rms（只有 v0.23 有）"
    sub: "matmul + AllReduce + 残差 + RMSNorm → 一个算子"
    fn: MatmulAllReduceAddRMSNormPass
    tone: muted

  - at: [36, 394]
    size: [380, 54]
    title: "fusion_pass_compile()"
    sub: 自己的匹配器逐条跑这批 pattern
    tone: neutral
  - at: [36, 462]
    size: [380, 54]
    title: 改完的图交回 torch.compile
    sub: 只在匹配到的地方发生替换
    tone: neutral
  - at: [36, 530]
    size: [380, 62]
    title: 静态 kernel 与 super kernel 都用不上
    sub: 两级加码都挂在 npugraph_ex 下面
    tone: muted

  - at: [484, 394]
    size: [380, 54]
    title: "npugraph_ex_compile()"
    sub: 装不上就回落 torchair，不报错
    tone: ascend
  - at: [484, 462]
    size: [380, 54]
    title: 整张图交给外部后端优化
    sub: 自带默认融合清单 + 注册进来的 pattern
    fn: force_eager
    tone: ascend
  - at: [484, 530]
    size: [380, 62]
    title: 再往上两级加码
    sub: 按 batch_size 编定形算子，再合成 super kernel
    fn: static_kernel_compile
    tone: accent

boundaries:
  - at: 450
    from: 322
    to: 620
    vertical: true
    label: "AscendCompiler.compile() 在这里二选一"

regions:
  - label: "npugraph_ex 关着（PIECEWISE / NONE / 310P）"
    note: "那条请求在这边：默认模式就把它写回了 False"
    at: [20, 320]
    size: [412, 300]
    tone: neutral
  - label: "npugraph_ex 开着（FULL / FULL_DECODE_ONLY）"
    note: "cudagraph_mode 必须显式换成这两个之一"
    at: [468, 320]
    size: [412, 300]
    tone: ascend

notes:
  - at: [20, 636]
    text: "两条路吃的是同一批 pattern：pattern 由 fuse_* 开关决定造不造，enable_npugraph_ex 只决定由谁来匹配。"
    size: 12.5
    width: 860
  - at: [20, 664]
    text: "默认的 FULL_AND_PIECEWISE 要走 piecewise 编译，平台层在那条分支里把 enable_npugraph_ex 与 enable_static_kernel 写回 False。"
    size: 12.5
    width: 860
  - at: [20, 692]
    text: "四条 pass 里只有 fuse_qknorm_rope 在那条请求上有东西可匹配：28 层各中一次，每层 3 个算子并成 1 个。"
    size: 12.5
    width: 860

pins:
  - source: vllm-ascend@2c59ff10:vllm_ascend/compilation/compiler_interface.py#L282-L301
    symbols: [fusion_pass_compile, npugraph_ex_compile, AscendCompiler]
  - source: vllm-ascend@2c59ff10:vllm_ascend/compilation/passes/base_pattern.py#L41-L63
    symbols: [register_replacement, PatternMatcherPass]
  - source: vllm-ascend@2c59ff10:vllm_ascend/compilation/graph_fusion_pass_manager.py#L49-L79
    symbols:
      [
        ascend_compilation_config,
        GraphFusionPassManager,
        fuse_norm_quant,
        fuse_qknorm_rope,
        fuse_allreduce_rms,
        fuse_muls_add,
        MatmulAllReduceAddRMSNormPass,
      ]
  - source: vllm-ascend@2c59ff10:vllm_ascend/compilation/passes/norm_quant_fusion_pass.py#L296-L321
    symbols: [npu_add_rms_norm, npu_add_rms_norm_dynamic_quant]
  - source: vllm-ascend@2c59ff10:vllm_ascend/compilation/passes/qknorm_rope_fusion_pass.py#L52-L102
    symbols: [split_qkv_rmsnorm_rope]
  - source: vllm-ascend@2c59ff10:vllm_ascend/compilation/passes/muls_add_pass.py#L54-L94
    symbols: [muls_add]
  - source: vllm-ascend@2c59ff10:vllm_ascend/compilation/compiler_interface.py#L110-L146
    symbols: [force_eager, static_kernel_compile]
  - source: vllm-ascend@2c59ff10:vllm_ascend/platform.py#L589-L643
    symbols: [enable_npugraph_ex, enable_static_kernel, cudagraph_mode]
