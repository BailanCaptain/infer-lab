<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 500" width="900" height="500" role="img" aria-label="v0.30.0 模型教程 52 篇筛选漏斗">
  <title>v0.30.0 模型教程 52 篇筛选漏斗：剔除 27 篇 3 行停服桩、分清 20+5 活跃食谱与 GLM5.md 同文件分叉陷阱</title>
  <desc>开放画布展示 docs/source/tutorials/models/ 下 52 篇模型文档分流为 27 篇 discontinued 停服桩（跳回 v0.23.0）与 25 篇活跃食谱（20 篇 v0.30.0 标准镜像 + 5 篇专属镜像/nightly），对照 Supported、Experimental、Unverified、Unmaintained、Unsupported 五态图例，并在底部揭示 GLM5.md 同页分叉（GLM-5 停服、GLM-5.1 活跃且需 transformers &gt;= 5.2.0）。</desc>
  <defs>
    <marker id="rf-arr-red" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto">
      <path d="M 0 1.5 L 8.5 5 L 0 8.5 z" fill="#b54237"/>
    </marker>
    <marker id="rf-arr-green" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto">
      <path d="M 0 1.5 L 8.5 5 L 0 8.5 z" fill="#087f73"/>
    </marker>
  </defs>

  <g role="group" aria-label="入口：52 篇教程目录与支持矩阵五态">
    <rect x="12" y="14" width="248" height="336" rx="12" fill="#ffffff" stroke="#66716d" stroke-width="1.5"/>
    <text x="26" y="42" font-family="var(--font-sans)" font-size="16" font-weight="700" fill="#17211f">教程目录总盘点</text>
    <text x="26" y="68" font-family="var(--font-mono)" font-size="13.5" font-weight="600" fill="#4d5652">tutorials/models/</text>
    <text x="26" y="96" font-family="var(--font-sans)" font-size="15" font-weight="700" fill="#17211f">共 52 篇模型文档</text>

    <rect x="26" y="110" width="106" height="32" rx="6" fill="#fae1d8" stroke="#b54237" stroke-width="1.2"/>
    <text x="79" y="131" text-anchor="middle" font-family="var(--font-sans)" font-size="13.5" font-weight="700" fill="#8f3229">27 停服 52%</text>

    <rect x="140" y="110" width="106" height="32" rx="6" fill="#cbe9e2" stroke="#087f73" stroke-width="1.2"/>
    <text x="193" y="131" text-anchor="middle" font-family="var(--font-sans)" font-size="13.5" font-weight="700" fill="#065f56">25 活跃 48%</text>

    <line x1="26" y1="158" x2="246" y2="158" stroke="#d8d8cf" stroke-width="1.3" stroke-dasharray="4 3"/>
    <text x="26" y="188" font-family="var(--font-sans)" font-size="14" fill="#065f56">• <tspan font-family="var(--font-mono)" font-weight="700">Supported</tspan> 正式支持</text>
    <text x="26" y="220" font-family="var(--font-sans)" font-size="14" fill="#4c65b6">• <tspan font-family="var(--font-mono)" font-weight="700">Experimental</tspan> 实验受限</text>
    <text x="26" y="252" font-family="var(--font-sans)" font-size="14" fill="#c78300">• <tspan font-family="var(--font-mono)" font-weight="700">Unverified</tspan> 未完整测</text>
    <text x="26" y="284" font-family="var(--font-sans)" font-size="14" fill="#b54237">• <tspan font-family="var(--font-mono)" font-weight="700">Unmaintained</tspan> 停服不修</text>
    <text x="26" y="316" font-family="var(--font-sans)" font-size="14" fill="#66716d">• <tspan font-family="var(--font-mono)" font-weight="700">Unsupported</tspan> 硬件禁跑</text>
  </g>

  <path d="M 260 122 L 278 122 L 278 71 L 292 71" fill="none" stroke="#b54237" stroke-width="2" stroke-linejoin="round" marker-end="url(#rf-arr-red)"/>
  <path d="M 260 132 L 278 132 L 278 264 L 292 264" fill="none" stroke="#087f73" stroke-width="2" stroke-linejoin="round" marker-end="url(#rf-arr-green)"/>

  <g role="group" aria-label="剔除分支：27 篇 3 行停服桩">
    <rect x="296" y="14" width="592" height="114" rx="12" fill="#fff0e9" stroke="#b54237" stroke-width="1.5"/>
    <text x="314" y="44" font-family="var(--font-sans)" font-size="16" font-weight="700" fill="#8f3229">✗ 剔除 27 篇「3 行停服桩」(<tspan font-family="var(--font-mono)" font-size="15">discontinued</tspan>)</text>
    <text x="314" y="76" font-family="var(--font-mono)" font-size="13.5" font-weight="600" fill="#8f3229">This model has been discontinued since v0.30.0</text>
    <text x="314" y="106" font-family="var(--font-sans)" font-size="14" fill="#4d5652">判据：矩阵标 <tspan font-family="var(--font-mono)" font-weight="600">Unmaintained</tspan>，或全文仅 3 行跳回 <tspan font-family="var(--font-mono)" font-weight="600">v0.23.0</tspan></text>
  </g>

  <g role="group" aria-label="保留分支：25 篇活跃食谱分为 20 与 5 两档">
    <text x="296" y="160" font-family="var(--font-sans)" font-size="16" font-weight="700" fill="#065f56">✓ 锁定 25 篇活跃食谱（拉镜像前先核对两档安装节）</text>

    <rect x="296" y="176" width="288" height="174" rx="12" fill="#ddf4ef" stroke="#087f73" stroke-width="1.5"/>
    <text x="312" y="206" font-family="var(--font-sans)" font-size="15" font-weight="700" fill="#065f56">A 档 · 20 篇用标准镜像</text>
    <text x="312" y="238" font-family="var(--font-sans)" font-size="14" fill="#17211f">• 标尺：<tspan font-family="var(--font-mono)" font-weight="600">Qwen3-8B / 30B-A3B</tspan></text>
    <text x="312" y="268" font-family="var(--font-sans)" font-size="14" fill="#17211f">• 主力：<tspan font-family="var(--font-mono)">Qwen3.5~3.8 · GLM-5.1</tspan></text>
    <text x="312" y="298" font-family="var(--font-sans)" font-size="14" fill="#17211f">• 多模态：<tspan font-family="var(--font-mono)">Qwen-VL · Gemma4</tspan></text>
    <text x="312" y="328" font-family="var(--font-mono)" font-size="13.5" font-weight="600" fill="#087f73">镜像：vllm-ascend:v0.30.0*</text>

    <rect x="598" y="176" width="290" height="174" rx="12" fill="#fff4cf" stroke="#c78300" stroke-width="1.5"/>
    <text x="614" y="206" font-family="var(--font-sans)" font-size="15" font-weight="700" fill="#936300">B 档 · 5 篇需专属镜像</text>
    <text x="614" y="238" font-family="var(--font-mono)" font-size="13.5" font-weight="600" fill="#936300">• Qwen3.8-2.4T → :qwen3.8-*</text>
    <text x="614" y="268" font-family="var(--font-sans)" font-size="14" fill="#936300">• <tspan font-family="var(--font-mono)" font-weight="600">Qwen3.8-Next</tspan>（专属 -a3 包）</text>
    <text x="614" y="298" font-family="var(--font-mono)" font-size="13.5" fill="#936300">• DeepSeek-V4-Flash (nightly)</text>
    <text x="614" y="328" font-family="var(--font-mono)" font-size="13.5" fill="#936300">• Hy4-preview · Dots3-Note</text>
  </g>

  <line x1="12" y1="368" x2="888" y2="368" stroke="#b8bcb5" stroke-width="1.4" stroke-dasharray="6 5"/>

  <g role="group" aria-label="同文件分叉高发陷阱 GLM5.md">
    <text x="14" y="396" font-family="var(--font-sans)" font-size="16" font-weight="700" fill="#8f3229">⚠ 同文件分叉高发陷阱：<tspan font-family="var(--font-mono)" font-size="15">GLM5.md</tspan>（同页两代模型命运相反）</text>

    <rect x="12" y="410" width="430" height="78" rx="10" fill="#fff0e9" stroke="#b54237" stroke-width="1.5"/>
    <text x="28" y="439" font-family="var(--font-sans)" font-size="15" font-weight="700" fill="#b54237">✗ 第 11 行：GLM-5 已停服 (Unmaintained)</text>
    <text x="28" y="469" font-family="var(--font-sans)" font-size="14" fill="#8f3229">自 <tspan font-family="var(--font-mono)" font-weight="600">v0.30.0</tspan> 起 <tspan font-family="var(--font-mono)">discontinued</tspan>，仅留 <tspan font-family="var(--font-mono)">v0.23.0</tspan> 链接</text>

    <rect x="458" y="410" width="430" height="78" rx="10" fill="#ddf4ef" stroke="#087f73" stroke-width="1.5"/>
    <text x="474" y="439" font-family="var(--font-sans)" font-size="15" font-weight="700" fill="#065f56">✓ 第 13 行起：GLM-5.1 正式活跃 (Supported)</text>
    <text x="474" y="469" font-family="var(--font-sans)" font-size="14" fill="#087f73">支持 A2 / A3 / 950DT，需 <tspan font-family="var(--font-mono)" font-weight="600">transformers &gt;= 5.2.0</tspan></text>
  </g>
</svg>
