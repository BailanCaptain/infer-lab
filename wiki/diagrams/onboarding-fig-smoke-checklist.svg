<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 476" width="900" height="476" role="img" aria-label="Qwen3-8B / Qwen3-30B-A3B 最小上线三步流水线">
  <title>Qwen3-8B / Qwen3-30B-A3B 最小上线三步流水线：宿主机与目录自检、三套启动模板对照与双接口冒烟闭环</title>
  <desc>开放画布分三阶段展示最小上线验证：Step 1 查 npu-smi info 与目录 JSON（含 quant_model_description 走 ASCEND_QUANTIZATION_METHOD 及离线 VLLM_USE_MODELSCOPE）；Step 2 对照 A2/A3 单卡 8B FULL_DECODE_ONLY、四卡 30B-A3B TP4+EP+ascend 与 310P float16 + cudagraph_capture_sizes + enable_npugraph_ex:false（内置 Qwen3 均无需 --trust-remote-code）；Step 3 用 /v1/models 与 /v1/completions 完成冒烟闭环。</desc>
  <defs>
    <marker id="sc-arr-pipe" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto">
      <path d="M 0 1.5 L 8.5 5 L 0 8.5 z" fill="#17211f"/>
    </marker>
  </defs>

  <line x1="262" y1="14" x2="262" y2="462" stroke="#CBD5E1" stroke-width="1.3" stroke-dasharray="5 4"/>
  <line x1="667" y1="14" x2="667" y2="462" stroke="#CBD5E1" stroke-width="1.3" stroke-dasharray="5 4"/>

  <g role="group" aria-label="Step 1 宿主机与目录自检">
    <circle cx="22" cy="26" r="12" fill="#1D4ED8"/>
    <text x="22" y="30.5" text-anchor="middle" font-family="var(--font-sans)" font-size="12.5" font-weight="700" fill="#FFFFFF">1</text>
    <text x="42" y="32" font-family="var(--font-sans)" font-size="16" font-weight="700" fill="#17211f">宿主机与目录自检</text>

    <rect x="10" y="52" width="242" height="178" rx="10" fill="#FFFFFF" stroke="#94A3B8" stroke-width="1.4"/>
    <text x="22" y="82" font-family="var(--font-sans)" font-size="15" font-weight="700" fill="#0F172A">1. 认卡型与绑空闲卡</text>
    <text x="22" y="112" font-family="var(--font-mono)" font-size="14" font-weight="700" fill="#1D4ED8">$ npu-smi info</text>
    <text x="22" y="140" font-family="var(--font-sans)" font-size="14" fill="#334155">确认 A2 / A3 / 310P / 950</text>
    <text x="22" y="170" font-family="var(--font-mono)" font-size="13.5" font-weight="600" fill="#475569">ASCEND_RT_VISIBLE_DEVICES</text>
    <text x="22" y="200" font-family="var(--font-sans)" font-size="13.5" fill="#64748B">单卡设 <tspan font-family="var(--font-mono)" font-weight="600">0</tspan> · 四卡设 <tspan font-family="var(--font-mono)" font-weight="600">0,1,2,3</tspan></text>

    <rect x="10" y="244" width="242" height="216" rx="10" fill="#FFFFFF" stroke="#94A3B8" stroke-width="1.4"/>
    <text x="22" y="274" font-family="var(--font-sans)" font-size="15" font-weight="700" fill="#0F172A">2. 读目录 JSON 配开关</text>
    <text x="22" y="304" font-family="var(--font-sans)" font-size="14" fill="#334155">• 读 <tspan font-family="var(--font-mono)" font-weight="600">config.json</tspan> 确认架构</text>
    <text x="22" y="334" font-family="var(--font-mono)" font-size="13.5" fill="#0F766E">• quant_model_description</text>
    <text x="22" y="362" font-family="var(--font-mono)" font-size="13.5" font-weight="700" fill="#0F766E">  → --quantization ascend</text>
    <text x="22" y="394" font-family="var(--font-sans)" font-size="14" fill="#BE123C">• 310P 浮点必传 <tspan font-family="var(--font-mono)" font-weight="700">float16</tspan></text>
    <text x="22" y="426" font-family="var(--font-mono)" font-size="13.5" fill="#475569">VLLM_USE_MODELSCOPE=True</text>
  </g>

  <path d="M 252 255 L 268 255" fill="none" stroke="#17211f" stroke-width="2" marker-end="url(#sc-arr-pipe)"/>

  <g role="group" aria-label="Step 2 三套最小启动模板">
    <circle cx="284" cy="26" r="12" fill="#334155"/>
    <text x="284" y="30.5" text-anchor="middle" font-family="var(--font-sans)" font-size="12.5" font-weight="700" fill="#FFFFFF">2</text>
    <text x="304" y="32" font-family="var(--font-sans)" font-size="16" font-weight="700" fill="#17211f">三套启动模板 <tspan font-size="13.5" font-weight="600" fill="#0F766E">(内置免 trust-remote-code)</tspan></text>

    <rect x="272" y="52" width="384" height="126" rx="10" fill="#EFF6FF" stroke="#1D4ED8" stroke-width="1.4"/>
    <text x="286" y="80" font-family="var(--font-sans)" font-size="15" font-weight="700" fill="#1E40AF">模板 A · A2 / A3 单卡 Qwen3-8B</text>
    <text x="286" y="109" font-family="var(--font-mono)" font-size="13.5" fill="#1E293B">vllm serve Qwen3-8B (BF16 基线)</text>
    <text x="286" y="136" font-family="var(--font-mono)" font-size="13.5" fill="#475569">expandable_segments:True</text>
    <text x="286" y="162" font-family="var(--font-mono)" font-size="13.5" font-weight="700" fill="#1D4ED8">cudagraph_mode: &quot;FULL_DECODE_ONLY&quot;</text>

    <rect x="272" y="192" width="384" height="126" rx="10" fill="#F0FDFA" stroke="#0F766E" stroke-width="1.4"/>
    <text x="286" y="220" font-family="var(--font-sans)" font-size="15" font-weight="700" fill="#134E4A">模板 B · A2 / A3 四卡 Qwen3-30B-A3B</text>
    <text x="286" y="249" font-family="var(--font-mono)" font-size="13.5" fill="#1E293B">--tensor-parallel-size 4</text>
    <text x="286" y="276" font-family="var(--font-mono)" font-size="13.5" fill="#1E293B">--enable-expert-parallel</text>
    <text x="286" y="302" font-family="var(--font-mono)" font-size="13.5" font-weight="700" fill="#0F766E">--quantization ascend + FULL_DECODE_ONLY</text>

    <rect x="272" y="332" width="384" height="128" rx="10" fill="#FFF1F2" stroke="#BE123C" stroke-width="1.4"/>
    <text x="286" y="360" font-family="var(--font-sans)" font-size="15" font-weight="700" fill="#9F1239">模板 C · 300I DUO (310P) 必改三项</text>
    <text x="286" y="389" font-family="var(--font-mono)" font-size="13.5" font-weight="700" fill="#BE123C">--dtype float16 + FULL_DECODE_ONLY</text>
    <text x="286" y="416" font-family="var(--font-mono)" font-size="13.5" fill="#881337">cudagraph_capture_sizes: [1,2,4,8]</text>
    <text x="286" y="443" font-family="var(--font-mono)" font-size="13.5" font-weight="700" fill="#881337">enable_npugraph_ex: false</text>
  </g>

  <path d="M 656 255 L 674 255" fill="none" stroke="#17211f" stroke-width="2" marker-end="url(#sc-arr-pipe)"/>

  <g role="group" aria-label="Step 3 双接口冒烟闭环">
    <circle cx="690" cy="26" r="12" fill="#059669"/>
    <text x="690" y="30.5" text-anchor="middle" font-family="var(--font-sans)" font-size="12.5" font-weight="700" fill="#FFFFFF">3</text>
    <text x="710" y="32" font-family="var(--font-sans)" font-size="16" font-weight="700" fill="#17211f">双接口冒烟闭环</text>

    <rect x="678" y="52" width="212" height="114" rx="10" fill="#F0FDF4" stroke="#059669" stroke-width="1.4"/>
    <text x="690" y="82" font-family="var(--font-sans)" font-size="14.5" font-weight="700" fill="#065F46">等就绪日志再发请求：</text>
    <text x="690" y="112" font-family="var(--font-mono)" font-size="13.5" font-weight="700" fill="#15803D">Application startup</text>
    <text x="690" y="140" font-family="var(--font-mono)" font-size="13.5" font-weight="700" fill="#15803D">complete.</text>

    <rect x="678" y="180" width="212" height="124" rx="10" fill="#FFFFFF" stroke="#94A3B8" stroke-width="1.4"/>
    <text x="690" y="210" font-family="var(--font-sans)" font-size="15" font-weight="700" fill="#0F172A">探针 1 · 核验服务名</text>
    <text x="690" y="242" font-family="var(--font-mono)" font-size="14" font-weight="700" fill="#1D4ED8">GET /v1/models</text>
    <text x="690" y="274" font-family="var(--font-sans)" font-size="14" fill="#475569">返回 <tspan font-family="var(--font-mono)" font-weight="600">qwen3-8b</tspan> 服务名</text>

    <rect x="678" y="318" width="212" height="142" rx="10" fill="#ECFDF5" stroke="#059669" stroke-width="1.5"/>
    <text x="690" y="348" font-family="var(--font-sans)" font-size="15" font-weight="700" fill="#065F46">探针 2 · 核验真实吐字</text>
    <text x="690" y="378" font-family="var(--font-mono)" font-size="13.5" font-weight="700" fill="#047857">POST /v1/completions</text>
    <text x="690" y="408" font-family="var(--font-mono)" font-size="13.5" fill="#334155">max_tokens:5, temp:0</text>
    <text x="690" y="438" font-family="var(--font-sans)" font-size="14" font-weight="700" fill="#065F46">✓ 非空输出即四关全通</text>
  </g>
</svg>
