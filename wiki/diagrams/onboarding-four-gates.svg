<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 360" width="880" height="360" role="img">
  <title>昇腾新模型上线四道关全景：五维版本与卡型锁死、52 篇食谱去伪存真、三路 ModelRegistry 解析与四类权重代际分流</title>
  <desc>按第一关五维版本锁死、第二关 52 篇食谱去伪存真、第三关 ModelRegistry 三路解析、第四关四类权重与硬件代际分流的顺序展示昇腾新模型上线检查流水线及关键报错陷阱。</desc>
  <defs>
    <marker id="arrow-main" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto">
      <path d="M 0 1.5 L 8.5 5 L 0 8.5 z" fill="#334155"/>
    </marker>
    <marker id="arrow-green" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 1.5 L 8.5 5 L 0 8.5 z" fill="#059669"/>
    </marker>
    <marker id="arrow-red" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 1.5 L 8.5 5 L 0 8.5 z" fill="#DC2626"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="880" height="360" rx="8" fill="#FBFAF6"/>

  <g role="group" aria-label="第一关：五维版本锁死">
    <rect x="16" y="12" width="404" height="154" rx="10" fill="#FFFFFF" stroke="#94A3B8" stroke-width="1.5"/>
    <rect x="28" y="21" width="54" height="20" rx="10" fill="#4338CA"/>
    <text x="55" y="35" text-anchor="middle" font-family="var(--font-sans)" font-size="11" font-weight="700" fill="#FFFFFF">第一关</text>
    <text x="90" y="36" font-family="var(--font-sans)" font-size="13.5" font-weight="700" fill="#0F172A">五维版本锁死与四族镜像对齐</text>

    <rect x="28" y="49" width="96" height="22" rx="5" fill="#ECFEFF" stroke="#0891B2" stroke-width="1.1"/>
    <text x="76" y="64" text-anchor="middle" font-family="var(--font-mono)" font-size="10.5" font-weight="600" fill="#0E7490">vllm 0.30.0</text>

    <rect x="130" y="49" width="142" height="22" rx="5" fill="#FEF3C7" stroke="#D97706" stroke-width="1.1"/>
    <text x="201" y="64" text-anchor="middle" font-family="var(--font-mono)" font-size="10.5" font-weight="600" fill="#92400E">vllm-ascend 0.30.0</text>

    <rect x="278" y="49" width="130" height="22" rx="5" fill="#F1F5F9" stroke="#64748B" stroke-width="1.1"/>
    <text x="343" y="64" text-anchor="middle" font-family="var(--font-mono)" font-size="10.5" font-weight="600" fill="#334155">CANN 9.2.1</text>

    <rect x="28" y="77" width="162" height="22" rx="5" fill="#F1F5F9" stroke="#64748B" stroke-width="1.1"/>
    <text x="109" y="92" text-anchor="middle" font-family="var(--font-mono)" font-size="10.2" font-weight="600" fill="#334155">torch_npu 2.10.0.post7</text>

    <rect x="196" y="77" width="212" height="22" rx="5" fill="#EEF2FF" stroke="#4F46E5" stroke-width="1.1"/>
    <text x="302" y="92" text-anchor="middle" font-family="var(--font-sans)" font-size="10.5" font-weight="600" fill="#3730A3">四族镜像: A2 / A3 / 310P / 950DT</text>

    <rect x="28" y="107" width="380" height="49" rx="6" fill="#FEF2F2" stroke="#DC2626" stroke-width="1.3"/>
    <text x="38" y="125" font-family="var(--font-sans)" font-size="10.8" font-weight="700" fill="#991B1B">⚠ 错装默认 pip wheel（仅面向 A2）跑在非 A2 卡：</text>
    <text x="38" y="145" font-family="var(--font-mono)" font-size="10.5" font-weight="600" fill="#B91C1C">check_ascend_device_type() → RuntimeError</text>
  </g>

  <line x1="420" y1="89" x2="454" y2="89" stroke="#334155" stroke-width="2" marker-end="url(#arrow-main)"/>

  <g role="group" aria-label="第二关：52 篇食谱去伪存真">
    <rect x="460" y="12" width="404" height="154" rx="10" fill="#FFFFFF" stroke="#94A3B8" stroke-width="1.5"/>
    <rect x="472" y="21" width="54" height="20" rx="10" fill="#0F766E"/>
    <text x="499" y="35" text-anchor="middle" font-family="var(--font-sans)" font-size="11" font-weight="700" fill="#FFFFFF">第二关</text>
    <text x="534" y="36" font-family="var(--font-sans)" font-size="13.5" font-weight="700" fill="#0F172A">52 篇模型食谱去伪存真</text>

    <rect x="472" y="49" width="110" height="48" rx="6" fill="#F8FAFC" stroke="#64748B" stroke-width="1.2"/>
    <text x="527" y="68" text-anchor="middle" font-family="var(--font-mono)" font-size="9.8" fill="#475569">tutorials/models/</text>
    <text x="527" y="87" text-anchor="middle" font-family="var(--font-sans)" font-size="11.5" font-weight="700" fill="#0F172A">共 52 篇文档</text>

    <line x1="582" y1="73" x2="602" y2="73" stroke="#059669" stroke-width="1.8" marker-end="url(#arrow-green)"/>

    <rect x="608" y="49" width="244" height="48" rx="6" fill="#ECFDF5" stroke="#059669" stroke-width="1.3"/>
    <text x="618" y="68" font-family="var(--font-sans)" font-size="11.2" font-weight="700" fill="#065F46">✓ 锁定 25 篇活跃食谱</text>
    <text x="618" y="87" font-family="var(--font-sans)" font-size="10.2" fill="#047857">20 标准镜像 + 5 专属镜像/nightly-main</text>

    <line x1="527" y1="97" x2="527" y2="105" stroke="#DC2626" stroke-width="1.6"/>
    <rect x="472" y="107" width="380" height="49" rx="6" fill="#FEF2F2" stroke="#DC2626" stroke-width="1.3"/>
    <text x="482" y="125" font-family="var(--font-sans)" font-size="10.8" font-weight="700" fill="#991B1B">✕ 剔除 27 篇 3 行停服桩（Discontinued stub）</text>
    <text x="482" y="145" font-family="var(--font-sans)" font-size="10.5" font-weight="600" fill="#B91C1C">⚠ GLM5.md 同文件分叉：GLM-5 已停服，仅 GLM-5.1 活跃</text>
  </g>

  <path d="M 662 166 L 662 180 L 218 180 L 218 190" fill="none" stroke="#334155" stroke-width="2" stroke-linejoin="round" marker-end="url(#arrow-main)"/>
  <rect x="378" y="171" width="124" height="18" rx="9" fill="#E2E8F0" stroke="#94A3B8" stroke-width="1"/>
  <text x="440" y="183" text-anchor="middle" font-family="var(--font-sans)" font-size="10" font-weight="600" fill="#334155">环境与食谱核准后</text>

  <g role="group" aria-label="第三关：三路模型类解析">
    <rect x="16" y="194" width="404" height="154" rx="10" fill="#FFFFFF" stroke="#94A3B8" stroke-width="1.5"/>
    <rect x="28" y="203" width="54" height="20" rx="10" fill="#B45309"/>
    <text x="55" y="217" text-anchor="middle" font-family="var(--font-sans)" font-size="11" font-weight="700" fill="#FFFFFF">第三关</text>
    <text x="90" y="218" font-family="var(--font-sans)" font-size="13.5" font-weight="700" fill="#0F172A">ModelRegistry 三路模型类解析</text>

    <rect x="28" y="231" width="380" height="32" rx="6" fill="#FEF3C7" stroke="#D97706" stroke-width="1.2"/>
    <text x="38" y="251" font-family="var(--font-sans)" font-size="11" fill="#78350F"><tspan font-weight="700">路径 B</tspan>：<tspan font-family="var(--font-mono)">vllm-ascend</tspan> 29 项专有注册与覆写（<tspan font-family="var(--font-mono)">Qwen3_5*</tspan>）</text>

    <rect x="28" y="269" width="380" height="32" rx="6" fill="#ECFEFF" stroke="#0891B2" stroke-width="1.2"/>
    <text x="38" y="289" font-family="var(--font-sans)" font-size="11" fill="#155E75"><tspan font-weight="700">路径 A</tspan>：上游 <tspan font-family="var(--font-mono)">vllm</tspan> 原生架构 + NPU 算子适配（<tspan font-family="var(--font-mono)">Qwen3*</tspan>）</text>

    <rect x="28" y="307" width="380" height="32" rx="6" fill="#F8FAFC" stroke="#64748B" stroke-width="1.2"/>
    <text x="38" y="327" font-family="var(--font-sans)" font-size="11" fill="#334155"><tspan font-weight="700">路径 C</tspan>：<tspan font-family="var(--font-mono)">transformers</tspan> 回退 ｜ 均不兼容抛 <tspan font-family="var(--font-mono)" font-weight="700" fill="#B91C1C">ValueError</tspan></text>
  </g>

  <line x1="420" y1="271" x2="454" y2="271" stroke="#334155" stroke-width="2" marker-end="url(#arrow-main)"/>

  <g role="group" aria-label="第四关：四类权重与硬件代际分流">
    <rect x="460" y="194" width="404" height="154" rx="10" fill="#FFFFFF" stroke="#94A3B8" stroke-width="1.5"/>
    <rect x="472" y="203" width="54" height="20" rx="10" fill="#7C3AED"/>
    <text x="499" y="217" text-anchor="middle" font-family="var(--font-sans)" font-size="11" font-weight="700" fill="#FFFFFF">第四关</text>
    <text x="534" y="218" font-family="var(--font-sans)" font-size="13.5" font-weight="700" fill="#0F172A">四类权重探测与硬件代际分流</text>

    <rect x="472" y="229" width="112" height="23" rx="5" fill="#FEF3C7" stroke="#D97706" stroke-width="1.1"/>
    <text x="528" y="244" text-anchor="middle" font-family="var(--font-sans)" font-size="9.2" font-weight="600" fill="#92400E">① ModelSlim ascend</text>
    <text x="589" y="244" text-anchor="middle" font-family="var(--font-sans)" font-size="9.5" fill="#64748B">→</text>

    <rect x="594" y="229" width="122" height="23" rx="5" fill="#ECFEFF" stroke="#0891B2" stroke-width="1.1"/>
    <text x="655" y="244" text-anchor="middle" font-family="var(--font-mono)" font-size="9.1" font-weight="600" fill="#0E7490">② compressed-tensors</text>
    <text x="721" y="244" text-anchor="middle" font-family="var(--font-sans)" font-size="9.5" fill="#64748B">→</text>

    <rect x="726" y="229" width="70" height="23" rx="5" fill="#FEE2E2" stroke="#DC2626" stroke-width="1.1"/>
    <text x="761" y="244" text-anchor="middle" font-family="var(--font-sans)" font-size="9.5" font-weight="700" fill="#991B1B">③ 分块 FP8</text>
    <text x="801" y="244" text-anchor="middle" font-family="var(--font-sans)" font-size="9.5" fill="#64748B">→</text>

    <rect x="806" y="229" width="46" height="23" rx="5" fill="#F1F5F9" stroke="#64748B" stroke-width="1.1"/>
    <text x="829" y="244" text-anchor="middle" font-family="var(--font-sans)" font-size="9.5" font-weight="600" fill="#334155">④ 浮点</text>

    <rect x="472" y="259" width="380" height="48" rx="6" fill="#FEF2F2" stroke="#DC2626" stroke-width="1.3"/>
    <text x="482" y="276" font-family="var(--font-sans)" font-size="10.5" fill="#1E293B"><tspan font-weight="700">原生分块 FP8：</tspan><tspan fill="#047857" font-weight="600">950DT 转 MXFP8 (1B)</tspan> ｜ <tspan fill="#B91C1C" font-weight="700">310P 无执行路径</tspan></text>
    <text x="482" y="296" font-family="var(--font-sans)" font-size="10.5" font-weight="700" fill="#B91C1C">⚠ A2/A3 静默反量化回 BF16，驻留权重显存直接翻倍 (2×)！</text>

    <rect x="472" y="313" width="380" height="26" rx="6" fill="#EFF6FF" stroke="#2563EB" stroke-width="1.1"/>
    <text x="482" y="330" font-family="var(--font-sans)" font-size="10.3" fill="#1E40AF"><tspan font-weight="700">浮点：</tspan>A2/A3/950 用 BF16 ｜ <tspan fill="#B91C1C" font-weight="700">310P 禁 BF16，必加 --dtype float16</tspan></text>
  </g>
</svg>
