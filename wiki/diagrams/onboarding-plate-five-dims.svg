<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 500" width="880" height="500" role="img">
  <title>五维配套拆解剖面与中文引线直标：四层软件栈 ABI 咬合、check_ascend_device_type 启动门禁与四大硬件族分流</title>
  <desc>等距立体拆解剖面配合六组矢量圆点引线直标：左侧依次为 vllm 0.30.0、vllm-ascend 0.30.0 插件层、torch_npu 2.10.0.post7 与 CANN 9.2.1，中央为 check_ascend_device_type() 运行时卡型校验锁，右侧为 A2、A3、310P、950DT 四大硬件族。</desc>
  <defs>
    <pattern id="grid-five-dims" width="20" height="20" patternUnits="userSpaceOnUse">
      <path d="M 20 0 L 0 0 0 20" fill="none" stroke="#E7E1D3" stroke-width="0.6"/>
    </pattern>
  </defs>

  <rect x="2" y="2" width="876" height="496" rx="8" fill="#FCFBF7" stroke="#C8C0B0" stroke-width="1.2"/>
  <rect x="100" y="66" width="680" height="382" rx="6" fill="url(#grid-five-dims)" stroke="#D5CEBE" stroke-width="1"/>

  <image href="./wiki-illustrations/onboarding-five-dims-cutaway.jpg" x="100" y="66" width="680" height="382" preserveAspectRatio="xMidYMid meet"/>

  <g role="group" aria-label="引线与圆点锚点">
    <line x1="208" y1="58" x2="290" y2="146" stroke="#1D4ED8" stroke-width="1.8"/>
    <circle cx="290" cy="146" r="6" fill="#FFFFFF" fill-opacity="0.92" stroke="#1D4ED8" stroke-width="1.6"/>
    <circle cx="290" cy="146" r="3.2" fill="#1D4ED8"/>

    <line x1="196" y1="176" x2="256" y2="222" stroke="#0F766E" stroke-width="1.8"/>
    <circle cx="256" cy="222" r="6" fill="#FFFFFF" fill-opacity="0.92" stroke="#0F766E" stroke-width="1.6"/>
    <circle cx="256" cy="222" r="3.2" fill="#0F766E"/>

    <line x1="196" y1="286" x2="262" y2="284" stroke="#B45309" stroke-width="1.8"/>
    <circle cx="262" cy="284" r="6" fill="#FFFFFF" fill-opacity="0.92" stroke="#B45309" stroke-width="1.6"/>
    <circle cx="262" cy="284" r="3.2" fill="#B45309"/>

    <line x1="224" y1="450" x2="290" y2="349" stroke="#334155" stroke-width="1.8"/>
    <circle cx="290" cy="349" r="6" fill="#FFFFFF" fill-opacity="0.92" stroke="#334155" stroke-width="1.6"/>
    <circle cx="290" cy="349" r="3.2" fill="#334155"/>

    <line x1="468" y1="58" x2="462" y2="228" stroke="#BE123C" stroke-width="2"/>
    <circle cx="462" cy="228" r="6.5" fill="#FFFFFF" fill-opacity="0.94" stroke="#BE123C" stroke-width="1.8"/>
    <circle cx="462" cy="228" r="3.5" fill="#BE123C"/>

    <line x1="636" y1="450" x2="626" y2="366" stroke="#4338CA" stroke-width="1.8"/>
    <circle cx="626" cy="366" r="6" fill="#FFFFFF" fill-opacity="0.92" stroke="#4338CA" stroke-width="1.6"/>
    <circle cx="626" cy="366" r="3.2" fill="#4338CA"/>

    <line x1="738" y1="138" x2="660" y2="145" stroke="#1D4ED8" stroke-width="1.2" stroke-dasharray="3 2"/>
    <circle cx="660" cy="145" r="3.5" fill="#1D4ED8"/>
    <line x1="738" y1="208" x2="660" y2="213" stroke="#0F766E" stroke-width="1.2" stroke-dasharray="3 2"/>
    <circle cx="660" cy="213" r="3.5" fill="#0F766E"/>
    <line x1="738" y1="274" x2="656" y2="275" stroke="#BE123C" stroke-width="1.2" stroke-dasharray="3 2"/>
    <circle cx="656" cy="275" r="3.5" fill="#BE123C"/>
    <line x1="738" y1="344" x2="664" y2="348" stroke="#7C3AED" stroke-width="1.2" stroke-dasharray="3 2"/>
    <circle cx="664" cy="348" r="3.5" fill="#7C3AED"/>
  </g>

  <g role="group" aria-label="① vllm 0.30.0">
    <rect x="8" y="6" width="276" height="52" rx="6" fill="#FFFDF9" stroke="#1D4ED8" stroke-width="1.4"/>
    <rect x="8" y="6" width="24" height="52" rx="5" fill="#DBEAFE"/>
    <text x="20" y="37" text-anchor="middle" font-family="var(--font-sans)" font-size="12" font-weight="800" fill="#1D4ED8">①</text>
    <text x="38" y="23" font-family="var(--font-sans)" font-size="11.2" font-weight="700" fill="#0F172A">上游引擎层：<tspan font-family="var(--font-mono)">vllm 0.30.0</tspan></text>
    <text x="38" y="39" font-family="var(--font-mono)" font-size="9.6" font-weight="600" fill="#1E40AF">VLLM_TARGET_DEVICE=&quot;empty&quot;</text>
    <text x="38" y="52" font-family="var(--font-sans)" font-size="9.6" fill="#475569">提供调度器、注册表与服务入口（锁 ced6857a）</text>
  </g>

  <g role="group" aria-label="⑤ 启动门禁 check_ascend_device_type">
    <rect x="294" y="6" width="578" height="52" rx="6" fill="#FFFDF9" stroke="#BE123C" stroke-width="1.5"/>
    <rect x="294" y="6" width="24" height="52" rx="5" fill="#FFE4E6"/>
    <text x="306" y="37" text-anchor="middle" font-family="var(--font-sans)" font-size="12" font-weight="800" fill="#BE123C">⑤</text>
    <text x="326" y="23" font-family="var(--font-sans)" font-size="11.2" font-weight="700" fill="#881337">启动门禁 <tspan font-family="var(--font-mono)">check_ascend_device_type()</tspan>：运行时比对 SoC 与构建期卡型</text>
    <text x="326" y="39" font-family="var(--font-sans)" font-size="10" font-weight="700" fill="#BE123C">⚠ 标准 pip wheel 仅锁死 A2；装在 A3 / 310P / 950DT 上加载权重前当场抛 RuntimeError！</text>
    <text x="326" y="52" font-family="var(--font-mono)" font-size="8.9" fill="#475569">NPUWorker.__init__ → torch_npu.npu.get_soc_version() vs _build_info.__device_type__</text>
  </g>

  <g role="group" aria-label="② vllm-ascend 插件层">
    <rect x="8" y="132" width="188" height="84" rx="6" fill="#FFFDF9" fill-opacity="0.96" stroke="#0F766E" stroke-width="1.3"/>
    <text x="16" y="150" font-family="var(--font-sans)" font-size="10.8" font-weight="700" fill="#0F766E">② 插件层 vllm-ascend 0.30.0</text>
    <text x="16" y="167" font-family="var(--font-sans)" font-size="9.8" fill="#334155">编译期解析 <tspan font-family="var(--font-mono)">SOC_VERSION</tspan> 写入</text>
    <text x="16" y="182" font-family="var(--font-mono)" font-size="9.4" font-weight="600" fill="#0F766E">_build_info.__device_type__</text>
    <text x="16" y="198" font-family="var(--font-sans)" font-size="9.6" fill="#475569">挂载平台、算子与 29 项模型</text>
    <text x="16" y="210" font-family="var(--font-sans)" font-size="9.4" fill="#64748B">（基线锁死 c09d3e20）</text>
  </g>

  <g role="group" aria-label="③ torch_npu 与 triton-ascend">
    <rect x="8" y="240" width="188" height="90" rx="6" fill="#FFFDF9" fill-opacity="0.96" stroke="#B45309" stroke-width="1.3"/>
    <text x="16" y="258" font-family="var(--font-sans)" font-size="10.8" font-weight="700" fill="#B45309">③ PyTorch 昇腾扩展与编译器</text>
    <text x="16" y="275" font-family="var(--font-mono)" font-size="9.5" font-weight="600" fill="#92400E">torch_npu 2.10.0.post7</text>
    <text x="16" y="291" font-family="var(--font-mono)" font-size="9.5" font-weight="600" fill="#92400E">triton-ascend 3.6.0.post2</text>
    <text x="16" y="307" font-family="var(--font-sans)" font-size="9.6" font-weight="700" fill="#BE123C">注意：310P 不支持 triton！</text>
    <text x="16" y="321" font-family="var(--font-sans)" font-size="9.4" fill="#475569">另锁 transformers==5.14.1</text>
  </g>

  <g role="group" aria-label="右侧四卡微标签">
    <rect x="738" y="120" width="134" height="36" rx="5" fill="#EFF6FF" fill-opacity="0.96" stroke="#1D4ED8" stroke-width="1.1"/>
    <text x="746" y="135" font-family="var(--font-sans)" font-size="10" font-weight="700" fill="#1E40AF">Atlas A2 (910b*)</text>
    <text x="746" y="149" font-family="var(--font-sans)" font-size="9.2" fill="#334155">默认 pip wheel 唯一目标</text>

    <rect x="738" y="190" width="134" height="36" rx="5" fill="#F0FDF4" fill-opacity="0.96" stroke="#0F766E" stroke-width="1.1"/>
    <text x="746" y="205" font-family="var(--font-sans)" font-size="10" font-weight="700" fill="#0F766E">Atlas A3 (双 Die)</text>
    <text x="746" y="219" font-family="var(--font-sans)" font-size="9.2" fill="#334155">单卡映射 2 个可见设备</text>

    <rect x="738" y="256" width="134" height="36" rx="5" fill="#FFF1F2" fill-opacity="0.96" stroke="#BE123C" stroke-width="1.1"/>
    <text x="746" y="271" font-family="var(--font-sans)" font-size="10" font-weight="700" fill="#BE123C">310P (300I DUO)</text>
    <text x="746" y="285" font-family="var(--font-sans)" font-size="9.2" fill="#881337">禁 BF16 / 禁 Triton</text>

    <rect x="738" y="326" width="134" height="36" rx="5" fill="#F5F3FF" fill-opacity="0.96" stroke="#7C3AED" stroke-width="1.1"/>
    <text x="746" y="341" font-family="var(--font-sans)" font-size="10" font-weight="700" fill="#5B21B6">950DT (A5 系列)</text>
    <text x="746" y="355" font-family="var(--font-sans)" font-size="9.2" fill="#334155">原生 MXFP8 / MXFP4</text>
  </g>

  <g role="group" aria-label="④ CANN 9.2.1 底层算子与通信栈">
    <rect x="8" y="450" width="414" height="44" rx="6" fill="#FFFDF9" stroke="#334155" stroke-width="1.4"/>
    <rect x="8" y="450" width="24" height="44" rx="5" fill="#E2E8F0"/>
    <text x="20" y="477" text-anchor="middle" font-family="var(--font-sans)" font-size="12" font-weight="800" fill="#1E293B">④</text>
    <text x="38" y="468" font-family="var(--font-sans)" font-size="10.5" font-weight="700" fill="#0F172A">底层计算与集合通信栈：<tspan font-family="var(--font-mono)">CANN 9.2.1</tspan>（配套 NNAL 9.2.0 / HDK 26.1.1）</text>
    <text x="38" y="485" font-family="var(--font-sans)" font-size="9.1" fill="#475569">AscendC 算子与 HCCL 强依赖同代 ABI；混装跨代 CANN 易触发缺符号或图异常</text>
  </g>

  <g role="group" aria-label="⑥ 四大硬件族分流">
    <rect x="432" y="450" width="440" height="44" rx="6" fill="#FFFDF9" stroke="#4338CA" stroke-width="1.4"/>
    <rect x="432" y="450" width="24" height="44" rx="5" fill="#E0E7FF"/>
    <text x="444" y="477" text-anchor="middle" font-family="var(--font-sans)" font-size="12" font-weight="800" fill="#4338CA">⑥</text>
    <text x="462" y="468" font-family="var(--font-sans)" font-size="10.5" font-weight="700" fill="#1E1B4B">四大硬件族分流：A2 / A3 (双Die) / 310P (禁BF16) / 950DT (MXFP)</text>
    <text x="462" y="485" font-family="var(--font-sans)" font-size="9.1" fill="#475569">由 <tspan font-family="var(--font-mono)">HardwareProfile</tspan> 按卡型分发专属 Worker（如 <tspan font-family="var(--font-mono)">NPUWorker310</tspan>）、图模式与低比特</text>
  </g>
</svg>
