<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 668" width="900" height="668" role="img" aria-label="五维配套拆解剖面与开放式中文引线直标图" font-family="var(--font-sans)">
  <title>五维配套拆解剖面与中文引线直标：四层软件栈 ABI 咬合、check_ascend_device_type 启动门禁与四大硬件族分流</title>
  <desc>开放画布呈现五维配套等距立体拆解剖面：左侧依次为 vllm 0.30.0、vllm-ascend 0.30.0 插件层（编译期解析 SOC_VERSION 经 device_type_from_soc_version 写入 __device_type__）、torch_npu 2.10.0.post7 与 CANN 9.2.1；中央 NPUWorker 调用 check_ascend_device_type（get_soc_version、device_type_from_runtime_soc，失配抛 RuntimeError）；右侧 HardwareProfile 按 A2、A3、310P（NPUWorker310）、950DT（FP8_OPTIMIZED、CANN_MEGAMOE_MXFP）分流。</desc>

  <!-- Large Tight-Cropped Transparent Cutaway Illustration -->
  <image href="./wiki-illustrations/onboarding-five-dims-cutaway.webp" x="85" y="122" width="730" height="436" preserveAspectRatio="xMidYMid meet"/>

  <!-- Leader Lines & Ring Target Dots -->
  <!-- 1: VLLM 0.30 Blue Slab -->
  <line x1="150" y1="98" x2="246" y2="200" stroke="#4c65b6" stroke-width="1.8"/>
  <circle cx="246" cy="200" r="6" fill="#ffffff" stroke="#4c65b6" stroke-width="2"/>
  <circle cx="246" cy="200" r="2.8" fill="#4c65b6"/>

  <!-- 2: VLLM-ASCEND Teal Slab -->
  <line x1="410" y1="98" x2="255" y2="286" stroke="#087f73" stroke-width="1.8"/>
  <circle cx="255" cy="286" r="6" fill="#ffffff" stroke="#087f73" stroke-width="2"/>
  <circle cx="255" cy="286" r="2.8" fill="#087f73"/>

  <!-- 3: Center SOC CHECK Key & Lock -->
  <line x1="680" y1="98" x2="428" y2="346" stroke="#b54237" stroke-width="2"/>
  <circle cx="428" cy="346" r="6.5" fill="#ffffff" stroke="#b54237" stroke-width="2"/>
  <circle cx="428" cy="346" r="3" fill="#b54237"/>

  <!-- 4: TORCH_NPU Amber Slab -->
  <line x1="150" y1="568" x2="235" y2="376" stroke="#c78300" stroke-width="1.8"/>
  <circle cx="235" cy="376" r="6" fill="#ffffff" stroke="#c78300" stroke-width="2"/>
  <circle cx="235" cy="376" r="2.8" fill="#c78300"/>

  <!-- 5: CANN 9.2 Dark Slate Slab -->
  <line x1="425" y1="568" x2="262" y2="468" stroke="#4d5652" stroke-width="1.8"/>
  <circle cx="262" cy="468" r="6" fill="#ffffff" stroke="#4d5652" stroke-width="2"/>
  <circle cx="262" cy="468" r="2.8" fill="#4d5652"/>

  <!-- 6: Right 4 Hardware Families Stack -->
  <line x1="710" y1="568" x2="635" y2="455" stroke="#4c65b6" stroke-width="1.8"/>
  <circle cx="635" cy="455" r="6" fill="#ffffff" stroke="#4c65b6" stroke-width="2"/>
  <circle cx="635" cy="455" r="2.8" fill="#4c65b6"/>

  <!-- Top Open Band: 3 Borderless Callouts -->
  <g>
    <circle cx="26" cy="28" r="12" fill="#4c65b6"/>
    <text x="26" y="32.5" text-anchor="middle" font-size="12.5" font-weight="700" fill="#ffffff">1</text>
    <text x="46" y="34" font-size="15" font-weight="700" fill="#17211f">引擎层：vllm 0.30.0</text>
    <text x="14" y="61" font-size="13.5" font-family="var(--font-mono)" font-weight="600" fill="#3a4f93">VLLM_TARGET_DEVICE=&quot;empty&quot;</text>
    <text x="14" y="86" font-size="14" fill="#4d5652">提供 V1 调度器与模型注册表</text>
  </g>

  <g>
    <circle cx="318" cy="28" r="12" fill="#087f73"/>
    <text x="318" y="32.5" text-anchor="middle" font-size="12.5" font-weight="700" fill="#ffffff">2</text>
    <text x="338" y="34" font-size="15" font-weight="700" fill="#17211f">插件层：vllm-ascend 0.30.0</text>
    <text x="306" y="61" font-size="13.5" fill="#4d5652">编译期写入 <tspan font-family="var(--font-mono)" font-weight="600">__device_type__</tspan></text>
    <text x="306" y="86" font-size="14" font-weight="600" fill="#087f73">挂载昇腾算子与 29 项模型适配</text>
  </g>

  <g>
    <circle cx="616" cy="28" r="12" fill="#b54237"/>
    <text x="616" y="32.5" text-anchor="middle" font-size="12.5" font-weight="700" fill="#ffffff">3</text>
    <text x="636" y="34" font-size="15" font-weight="700" fill="#8f3229">门禁锁：SoC 卡型一致性校验</text>
    <text x="604" y="61" font-size="13.5" font-family="var(--font-mono)" font-weight="600" fill="#8f3229">check_ascend_device_type()</text>
    <text x="604" y="86" font-size="14" font-weight="700" fill="#b54237">默认 wheel 仅锁 A2，失配抛错</text>
  </g>

  <!-- Bottom Open Band: 3 Borderless Callouts -->
  <g>
    <circle cx="26" cy="586" r="12" fill="#c78300"/>
    <text x="26" y="590.5" text-anchor="middle" font-size="12.5" font-weight="700" fill="#ffffff">4</text>
    <text x="46" y="592" font-size="15" font-weight="700" fill="#17211f">扩展层：torch_npu 2.10.0</text>
    <text x="14" y="619" font-size="13.5" fill="#4d5652">配套 <tspan font-family="var(--font-mono)">post7</tspan> 与 <tspan font-family="var(--font-mono)">triton-ascend</tspan></text>
    <text x="14" y="644" font-size="14" font-weight="600" fill="#b54237">注意：310P 严禁装 triton</text>
  </g>

  <g>
    <circle cx="318" cy="586" r="12" fill="#4d5652"/>
    <text x="318" y="590.5" text-anchor="middle" font-size="12.5" font-weight="700" fill="#ffffff">5</text>
    <text x="338" y="592" font-size="15" font-weight="700" fill="#17211f">底层计算通信栈：CANN 9.2.1</text>
    <text x="306" y="619" font-size="13.5" fill="#4d5652">配套 NNAL 9.2.0 与 HDK 26.1.1</text>
    <text x="306" y="644" font-size="14" fill="#4d5652">算子与 HCCL 强绑定同代 ABI</text>
  </g>

  <g>
    <circle cx="616" cy="586" r="12" fill="#4c65b6"/>
    <text x="616" y="590.5" text-anchor="middle" font-size="12.5" font-weight="700" fill="#ffffff">6</text>
    <text x="636" y="592" font-size="15" font-weight="700" fill="#17211f">四族分流：HardwareProfile</text>
    <text x="604" y="619" font-size="13.5" fill="#4d5652">A2 · A3 双Die · 310P (禁BF16)</text>
    <text x="604" y="644" font-size="13.5" font-weight="600" fill="#4c65b6">950DT 启用 FP8 / MEGAMOE_MXFP</text>
  </g>
</svg>
