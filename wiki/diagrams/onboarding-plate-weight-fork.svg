<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 500" width="880" height="500" role="img">
  <title>权重探测与硬件代际转换拆解剖面：四级自动探测优先级、950DT 重排 MXFP8、A2/A3 静默反量化翻倍与 310P 限制</title>
  <desc>等距立体传送带拆解剖面配合四组矢量圆点引线直标：左侧扫描门对应 maybe_auto_detect_quantization 四级探测优先级，右上支路对应 950DT 在线重组 MXFP8 保持约 30 GB，右中路障对应 310P 走 COMPATIBILITY 不注册 AscendFp8Config，右下膨胀块对应 A2/A3 静默反量化回 BF16 翻倍至约 60 GB。</desc>
  <defs>
    <pattern id="grid-weight-fork" width="20" height="20" patternUnits="userSpaceOnUse">
      <path d="M 20 0 L 0 0 0 20" fill="none" stroke="#E7E1D3" stroke-width="0.6"/>
    </pattern>
  </defs>

  <rect x="2" y="2" width="876" height="496" rx="8" fill="#FCFBF7" stroke="#C8C0B0" stroke-width="1.2"/>
  <rect x="100" y="66" width="680" height="382" rx="6" fill="url(#grid-weight-fork)" stroke="#D5CEBE" stroke-width="1"/>

  <image href="./wiki-illustrations/onboarding-weight-fork-cutaway.jpg" x="100" y="66" width="680" height="382" preserveAspectRatio="xMidYMid meet"/>

  <g role="group" aria-label="引线与圆点锚点">
    <line x1="254" y1="60" x2="286" y2="196" stroke="#1D4ED8" stroke-width="1.8"/>
    <circle cx="286" cy="196" r="6" fill="#FFFFFF" fill-opacity="0.92" stroke="#1D4ED8" stroke-width="1.6"/>
    <circle cx="286" cy="196" r="3.2" fill="#1D4ED8"/>

    <line x1="636" y1="60" x2="606" y2="148" stroke="#0F766E" stroke-width="1.8"/>
    <circle cx="606" cy="148" r="6" fill="#FFFFFF" fill-opacity="0.92" stroke="#0F766E" stroke-width="1.6"/>
    <circle cx="606" cy="148" r="3.2" fill="#0F766E"/>

    <line x1="698" y1="242" x2="613" y2="253" stroke="#B45309" stroke-width="1.8"/>
    <circle cx="613" cy="253" r="6" fill="#FFFFFF" fill-opacity="0.92" stroke="#B45309" stroke-width="1.6"/>
    <circle cx="613" cy="253" r="3.2" fill="#B45309"/>

    <line x1="624" y1="450" x2="624" y2="378" stroke="#BE123C" stroke-width="2"/>
    <circle cx="624" cy="378" r="6.5" fill="#FFFFFF" fill-opacity="0.94" stroke="#BE123C" stroke-width="1.8"/>
    <circle cx="624" cy="378" r="3.5" fill="#BE123C"/>
  </g>

  <g role="group" aria-label="① 四级自动探测优先级">
    <rect x="8" y="6" width="416" height="54" rx="6" fill="#FFFDF9" stroke="#1D4ED8" stroke-width="1.4"/>
    <rect x="8" y="6" width="24" height="54" rx="5" fill="#DBEAFE"/>
    <text x="20" y="38" text-anchor="middle" font-family="var(--font-sans)" font-size="12" font-weight="800" fill="#1D4ED8">①</text>
    <text x="38" y="23" font-family="var(--font-sans)" font-size="10.8" font-weight="700" fill="#0F172A"><tspan font-family="var(--font-mono)">maybe_auto_detect_quantization()</tspan> 四级探测优先级</text>
    <text x="38" y="39" font-family="var(--font-sans)" font-size="9.6" font-weight="600" fill="#1E40AF">1. ModelSlim (ascend) → 2. compressed-tensors → 3. 分块 fp8 → 4. 浮点</text>
    <text x="38" y="53" font-family="var(--font-sans)" font-size="9.3" fill="#475569">未显式传 --quantization 时自动匹配；仅带 weight_block_size 的分块 FP8 可走第 3 级</text>
  </g>

  <g role="group" aria-label="② 950DT 在线重组为 MXFP8">
    <rect x="434" y="6" width="438" height="54" rx="6" fill="#FFFDF9" stroke="#0F766E" stroke-width="1.4"/>
    <rect x="434" y="6" width="24" height="54" rx="5" fill="#CCFBF1"/>
    <text x="446" y="38" text-anchor="middle" font-family="var(--font-sans)" font-size="12" font-weight="800" fill="#0F766E">②</text>
    <text x="464" y="23" font-family="var(--font-sans)" font-size="10.8" font-weight="700" fill="#134E4A">原生分块 FP8 (30 GB) 在 950DT：在线重组为 MXFP8 (~30 GB)</text>
    <text x="464" y="39" font-family="var(--font-sans)" font-size="9.6" font-weight="600" fill="#0F766E"><tspan font-family="var(--font-mono)">is_950()</tspan> 调 <tspan font-family="var(--font-mono)">_mx_quantize()</tspan> 保 1B/参数（配 E8M0 微缩放）</text>
    <text x="464" y="53" font-family="var(--font-sans)" font-size="9.3" fill="#475569">仅被注意力吸收的 <tspan font-family="var(--font-mono)">kv_b_proj</tspan> 与归约维非 32 倍数的线性层局部回退浮点</text>
  </g>

  <g role="group" aria-label="④ 310P 走 COMPATIBILITY 后端">
    <rect x="698" y="186" width="174" height="98" rx="6" fill="#FFFDF9" fill-opacity="0.97" stroke="#B45309" stroke-width="1.4"/>
    <text x="706" y="204" font-family="var(--font-sans)" font-size="10.6" font-weight="800" fill="#92400E">④ 310P 兼容后端限制</text>
    <text x="706" y="220" font-family="var(--font-sans)" font-size="9.4" fill="#334155">走 <tspan font-family="var(--font-mono)" font-weight="700" fill="#B45309">COMPATIBILITY</tspan> 后端</text>
    <text x="706" y="235" font-family="var(--font-sans)" font-size="9.4" fill="#334155">不注册 <tspan font-family="var(--font-mono)">AscendFp8Config</tspan></text>
    <text x="706" y="251" font-family="var(--font-sans)" font-size="9.5" font-weight="700" fill="#BE123C">✗ 不支持原生 FP8 权重</text>
    <text x="706" y="266" font-family="var(--font-sans)" font-size="9.4" fill="#78350F">浮点必传 <tspan font-family="var(--font-mono)" font-weight="700">--dtype float16</tspan></text>
    <text x="706" y="279" font-family="var(--font-sans)" font-size="9.1" fill="#64748B">或改用 W8A8-310P 量化包</text>
  </g>

  <g role="group" aria-label="③ A2/A3 静默反量化显存翻倍陷阱">
    <rect x="8" y="450" width="864" height="44" rx="6" fill="#FFF1F2" stroke="#BE123C" stroke-width="1.6"/>
    <rect x="8" y="450" width="26" height="44" rx="5" fill="#BE123C"/>
    <text x="21" y="477" text-anchor="middle" font-family="var(--font-sans)" font-size="12" font-weight="800" fill="#FFFFFF">③</text>
    <text x="42" y="468" font-family="var(--font-sans)" font-size="11.2" font-weight="800" fill="#881337">致命显存坑：原生分块 FP8 在 Atlas A2 / A3 静默反量化回 BF16，驻留权重直接翻倍至 ~60 GB (2×)！</text>
    <text x="42" y="485" font-family="var(--font-sans)" font-size="9.6" fill="#9F1239"><tspan font-family="var(--font-mono)" font-weight="600">mxfp8_method is None</tspan> 时调用 <tspan font-family="var(--font-mono)" font-weight="600">resolve_block_scales()</tspan> 展开为 <tspan font-family="var(--font-mono)">BF16</tspan> (2B/参数)；在 A2/A3 省显存请选 ModelSlim <tspan font-family="var(--font-mono)">W8A8 / W4A8</tspan></text>
  </g>
</svg>
