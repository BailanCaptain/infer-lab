<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 646" width="900" height="646" role="img" aria-label="权重探测与硬件代际转换拆解剖面与开放式中文引线直标图" font-family="var(--font-sans)">
  <title>权重探测与硬件代际转换拆解剖面：四级自动探测优先级、950DT 重排 MXFP8、A2/A3 静默反量化翻倍与 310P 限制</title>
  <desc>开放画布呈现权重探测与硬件代际分流立体剖面：左侧扫描门对应 maybe_auto_detect_quantization（ASCEND_QUANTIZATION_METHOD、COMPRESSED_TENSORS_METHOD、FP8_METHOD）；右上支路对应 is_950 下 AscendW8A8MXFP8DynamicLinearMethod 在 process_weights_after_loading 调用 _mx_quantize（跳过 kv_b_proj）；右中路障对应 310P 属 QuantizationBackendFamily.COMPATIBILITY（仅注册 AscendModelSlimConfig310，不似 STANDARD 注册 AscendFp8Config）；右下对应 A2/A3 调用 resolve_block_scales 静默反量化回 BF16（显存翻倍 2×）。</desc>

  <!-- Large 820px Tight-Cropped Transparent Cutaway Illustration -->
  <image href="./wiki-illustrations/onboarding-weight-fork-cutaway.webp" x="40" y="120" width="820" height="411" preserveAspectRatio="xMidYMid meet"/>

  <!-- Leader Lines & Ring Target Dots -->
  <!-- 1: 4-Tier Isometric Scanner -->
  <line x1="210" y1="100" x2="253" y2="284" stroke="#4c65b6" stroke-width="1.8"/>
  <circle cx="253" cy="284" r="6" fill="#ffffff" stroke="#4c65b6" stroke-width="2"/>
  <circle cx="253" cy="284" r="2.8" fill="#4c65b6"/>

  <!-- 2: 950DT -> MXFP8 30GB Branch -->
  <line x1="655" y1="100" x2="680" y2="194" stroke="#087f73" stroke-width="1.8"/>
  <circle cx="680" cy="194" r="6" fill="#ffffff" stroke="#087f73" stroke-width="2"/>
  <circle cx="680" cy="194" r="2.8" fill="#087f73"/>

  <!-- 3: 310P Red Barrier Gate -->
  <line x1="275" y1="544" x2="663" y2="301" stroke="#c78300" stroke-width="1.8"/>
  <circle cx="663" cy="301" r="6" fill="#ffffff" stroke="#c78300" stroke-width="2"/>
  <circle cx="663" cy="301" r="2.8" fill="#c78300"/>

  <!-- 4: A2/A3 -> BF16 60GB (2X) Expansion Block -->
  <line x1="688" y1="544" x2="688" y2="430" stroke="#b54237" stroke-width="2"/>
  <circle cx="688" cy="430" r="6.5" fill="#ffffff" stroke="#b54237" stroke-width="2"/>
  <circle cx="688" cy="430" r="3" fill="#b54237"/>

  <!-- Top Open Band: 2 Wide Borderless Callouts -->
  <g>
    <circle cx="26" cy="28" r="12" fill="#4c65b6"/>
    <text x="26" y="32.5" text-anchor="middle" font-size="12.5" font-weight="700" fill="#ffffff">1</text>
    <text x="46" y="34" font-size="15" font-weight="700" fill="#17211f">四级探测：<tspan font-family="var(--font-mono)" font-size="14">maybe_auto_detect_quantization</tspan></text>
    <text x="14" y="62" font-size="14" fill="#4d5652">顺序：<tspan font-family="var(--font-mono)" font-weight="600">ascend → compressed-tensors → fp8</tspan> → 浮点</text>
    <text x="14" y="88" font-size="13.5" font-weight="600" fill="#3a4f93">含 <tspan font-family="var(--font-mono)">quant_model_description.json</tspan> 自动命中 ascend</text>
  </g>

  <g>
    <circle cx="478" cy="28" r="12" fill="#087f73"/>
    <text x="478" y="32.5" text-anchor="middle" font-size="12.5" font-weight="700" fill="#ffffff">2</text>
    <text x="498" y="34" font-size="15" font-weight="700" fill="#17211f">950DT (<tspan font-family="var(--font-mono)" font-size="14">is_950</tspan>)：在线重排 MXFP8</text>
    <text x="466" y="62" font-size="14" font-weight="700" fill="#065f56">调 <tspan font-family="var(--font-mono)">_mx_quantize</tspan> 保 ~1 B/参数（30B 约 30 GB）</text>
    <text x="466" y="88" font-size="13.5" fill="#4d5652">仅 <tspan font-family="var(--font-mono)">kv_b_proj</tspan> 与非 32 倍数层回退浮点</text>
  </g>

  <!-- Bottom Open Band: 2 Wide Borderless Callouts -->
  <g>
    <circle cx="26" cy="562" r="12" fill="#c78300"/>
    <text x="26" y="566.5" text-anchor="middle" font-size="12.5" font-weight="700" fill="#ffffff">3</text>
    <text x="46" y="568" font-size="15" font-weight="700" fill="#936300">310P (<tspan font-family="var(--font-mono)" font-size="14">COMPATIBILITY</tspan>)：拦截原生 FP8</text>
    <text x="14" y="596" font-size="13.5" fill="#4d5652">仅注册 <tspan font-family="var(--font-mono)">ModelSlimConfig310</tspan>，不注册 <tspan font-family="var(--font-mono)">Fp8Config</tspan></text>
    <text x="14" y="622" font-size="14" font-weight="600" fill="#c78300">浮点必传 <tspan font-family="var(--font-mono)">--dtype float16</tspan> 或选 <tspan font-family="var(--font-mono)">W8A8-310P</tspan></text>
  </g>

  <g>
    <circle cx="478" cy="562" r="12" fill="#b54237"/>
    <text x="478" y="566.5" text-anchor="middle" font-size="12.5" font-weight="700" fill="#ffffff">4</text>
    <text x="498" y="568" font-size="15" font-weight="700" fill="#8f3229">A2 / A3 显存翻倍坑：静默反量化回 BF16 (2×)</text>
    <text x="466" y="596" font-size="14" font-weight="700" fill="#b54237">调 <tspan font-family="var(--font-mono)">resolve_block_scales()</tspan> 展开为 60 GB 驻留</text>
    <text x="466" y="622" font-size="13.5" fill="#4d5652">真省一半显存请选社区昇腾版 <tspan font-family="var(--font-mono)" font-weight="600">W8A8 / W4A8</tspan> 权重</text>
  </g>
</svg>
