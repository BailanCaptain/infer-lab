<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 560" width="900" height="560" role="img" aria-label="GLM-5.3-Flash 45 层排布条与 R1 单层 MoE 跨 16 卡 dispatch/combine 及共享专家并行走读图" font-family="var(--font-sans)">
  <title>第 4 站：45 层排布条与 R1 在一层 MoE 里的跨 16 卡流转（MC2 路径 + 并行共享专家）</title>
  <desc>45-layer architectural strip (3 KDA+Dense, 11 Sparse MLA+MoE, 31 KDA+MoE) expanding Layer 3 MoE to show routed path (4 rows padded to 8, TP8 slice, EP16 MC2 dispatch across all 16 ranks including pad-source ranks and dummy DP1, combine, TP8 All-Gather -> routed_out) running in parallel with shared_experts taking pre-dispatch hidden_states [4, 4096] -> shared_out, summed at the end</desc>
  <defs>
    <marker id="orm-arr-p" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="#9a4b86"/>
    </marker>
    <marker id="orm-arr-t" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="#087f73"/>
    </marker>
    <marker id="orm-arr-b" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="#4c65b6"/>
    </marker>
  </defs>

  <!-- TOP BAND: 45-Layer Strip -->
  <text x="14" y="24" font-size="15.5" font-weight="700" fill="#17211f">① 主干 45 层排布（层 0–44）：每 3 层 KDA 配 1 层稀疏 MLA，前 3 层稠密、后 42 层 MoE</text>

  <!-- Legend -->
  <rect x="14" y="34" width="16" height="14" rx="3" fill="#fff4cf" stroke="#c78300" stroke-width="1.2"/>
  <text x="36" y="46" font-size="13.5" fill="#936300" font-weight="700">L0–2：KDA + 稠密（3 层）</text>
  <rect x="236" y="34" width="16" height="14" rx="3" fill="#e8edff" stroke="#4c65b6" stroke-width="1.2"/>
  <text x="258" y="46" font-size="13.5" fill="#3a4f93" font-weight="700">L3,7,…,43：稀疏 MLA + MoE（11 层）</text>
  <rect x="536" y="34" width="16" height="14" rx="3" fill="#ddf4ef" stroke="#087f73" stroke-width="1.2"/>
  <text x="558" y="46" font-size="13.5" fill="#065f56" font-weight="700">其余 31 层：KDA + MoE</text>

  <!-- 45 individual layer cells: x = 14 + i*19.3 (width 17, gap 2.3) -> total 868px -->
  <g stroke-width="1.1">
    <!-- L0-L2: KDA+Dense (amber) -->
    <rect x="14" y="56" width="17" height="28" rx="2" fill="#fff4cf" stroke="#c78300"/>
    <rect x="33" y="56" width="17" height="28" rx="2" fill="#fff4cf" stroke="#c78300"/>
    <rect x="52" y="56" width="17" height="28" rx="2" fill="#fff4cf" stroke="#c78300"/>
    <!-- L3: MLA+MoE (highlighted!) -->
    <rect x="71" y="54" width="18" height="32" rx="2" fill="#4c65b6" stroke="#17211f" stroke-width="1.6"/>
    <!-- L4-6 KDA+MoE, L7 MLA+MoE -->
    <rect x="91" y="56" width="17" height="28" rx="2" fill="#ddf4ef" stroke="#087f73"/>
    <rect x="110" y="56" width="17" height="28" rx="2" fill="#ddf4ef" stroke="#087f73"/>
    <rect x="129" y="56" width="17" height="28" rx="2" fill="#ddf4ef" stroke="#087f73"/>
    <rect x="148" y="56" width="17" height="28" rx="2" fill="#e8edff" stroke="#4c65b6"/>
    <!-- L8-10, L11 -->
    <rect x="167" y="56" width="17" height="28" rx="2" fill="#ddf4ef" stroke="#087f73"/>
    <rect x="186" y="56" width="17" height="28" rx="2" fill="#ddf4ef" stroke="#087f73"/>
    <rect x="205" y="56" width="17" height="28" rx="2" fill="#ddf4ef" stroke="#087f73"/>
    <rect x="224" y="56" width="17" height="28" rx="2" fill="#e8edff" stroke="#4c65b6"/>
    <!-- L12-14, L15 -->
    <rect x="243" y="56" width="17" height="28" rx="2" fill="#ddf4ef" stroke="#087f73"/>
    <rect x="262" y="56" width="17" height="28" rx="2" fill="#ddf4ef" stroke="#087f73"/>
    <rect x="281" y="56" width="17" height="28" rx="2" fill="#ddf4ef" stroke="#087f73"/>
    <rect x="300" y="56" width="17" height="28" rx="2" fill="#e8edff" stroke="#4c65b6"/>
    <!-- L16-18, L19 -->
    <rect x="319" y="56" width="17" height="28" rx="2" fill="#ddf4ef" stroke="#087f73"/>
    <rect x="338" y="56" width="17" height="28" rx="2" fill="#ddf4ef" stroke="#087f73"/>
    <rect x="357" y="56" width="17" height="28" rx="2" fill="#ddf4ef" stroke="#087f73"/>
    <rect x="376" y="56" width="17" height="28" rx="2" fill="#e8edff" stroke="#4c65b6"/>
    <!-- L20-22, L23 -->
    <rect x="395" y="56" width="17" height="28" rx="2" fill="#ddf4ef" stroke="#087f73"/>
    <rect x="414" y="56" width="17" height="28" rx="2" fill="#ddf4ef" stroke="#087f73"/>
    <rect x="433" y="56" width="17" height="28" rx="2" fill="#ddf4ef" stroke="#087f73"/>
    <rect x="452" y="56" width="17" height="28" rx="2" fill="#e8edff" stroke="#4c65b6"/>
    <!-- L24-26, L27 -->
    <rect x="471" y="56" width="17" height="28" rx="2" fill="#ddf4ef" stroke="#087f73"/>
    <rect x="490" y="56" width="17" height="28" rx="2" fill="#ddf4ef" stroke="#087f73"/>
    <rect x="509" y="56" width="17" height="28" rx="2" fill="#ddf4ef" stroke="#087f73"/>
    <rect x="528" y="56" width="17" height="28" rx="2" fill="#e8edff" stroke="#4c65b6"/>
    <!-- L28-30, L31 -->
    <rect x="547" y="56" width="17" height="28" rx="2" fill="#ddf4ef" stroke="#087f73"/>
    <rect x="566" y="56" width="17" height="28" rx="2" fill="#ddf4ef" stroke="#087f73"/>
    <rect x="585" y="56" width="17" height="28" rx="2" fill="#ddf4ef" stroke="#087f73"/>
    <rect x="604" y="56" width="17" height="28" rx="2" fill="#e8edff" stroke="#4c65b6"/>
    <!-- L32-34, L35 -->
    <rect x="623" y="56" width="17" height="28" rx="2" fill="#ddf4ef" stroke="#087f73"/>
    <rect x="642" y="56" width="17" height="28" rx="2" fill="#ddf4ef" stroke="#087f73"/>
    <rect x="661" y="56" width="17" height="28" rx="2" fill="#ddf4ef" stroke="#087f73"/>
    <rect x="680" y="56" width="17" height="28" rx="2" fill="#e8edff" stroke="#4c65b6"/>
    <!-- L36-38, L39 -->
    <rect x="699" y="56" width="17" height="28" rx="2" fill="#ddf4ef" stroke="#087f73"/>
    <rect x="718" y="56" width="17" height="28" rx="2" fill="#ddf4ef" stroke="#087f73"/>
    <rect x="737" y="56" width="17" height="28" rx="2" fill="#ddf4ef" stroke="#087f73"/>
    <rect x="756" y="56" width="17" height="28" rx="2" fill="#e8edff" stroke="#4c65b6"/>
    <!-- L40-42, L43, L44 -->
    <rect x="775" y="56" width="17" height="28" rx="2" fill="#ddf4ef" stroke="#087f73"/>
    <rect x="794" y="56" width="17" height="28" rx="2" fill="#ddf4ef" stroke="#087f73"/>
    <rect x="813" y="56" width="17" height="28" rx="2" fill="#ddf4ef" stroke="#087f73"/>
    <rect x="832" y="56" width="17" height="28" rx="2" fill="#e8edff" stroke="#4c65b6"/>
    <rect x="851" y="56" width="17" height="28" rx="2" fill="#ddf4ef" stroke="#087f73"/>
  </g>
  <!-- Layer index ticks -->
  <g font-size="13.5" fill="#66716d" font-family="var(--font-mono)">
    <text x="14" y="102">L0</text>
    <text x="71" y="102" font-weight="700" fill="#3a4f93">L3</text>
    <text x="300" y="102">L15</text>
    <text x="604" y="102">L31</text>
    <text x="832" y="102">L43</text>
    <text x="860" y="102">44</text>
  </g>
  <!-- Zoom funnel from L3 -->
  <path d="M 71 88 L 16 124 M 89 88 L 884 124" fill="none" stroke="#4c65b6" stroke-width="1.2" stroke-dasharray="5 4"/>

  <!-- MAIN WALKTHROUGH: One MoE Layer across 16 cards -->
  <text x="14" y="144" font-size="15.5" font-weight="700" fill="#17211f">② 展开单层 MoE（如 L3，R1 宽 T = 4 ≤ 128 门槛 → 走 MC2）：路由专家与共享专家并行吃原始 hidden_states</text>

  <!-- Col 1: Input [4, 4096] padded to [8, 4096] & TP8 row slice -->
  <text x="32" y="170" font-size="14" font-weight="700" fill="#065f56">1. 4→8 补齐 → TP8 切片</text>
  <!-- Left bracket gathering real hidden_states [4, 4096] for parallel shared_experts -->
  <path d="M 28 184 L 22 184 L 22 296 L 28 296" fill="none" stroke="#087f73" stroke-width="1.6"/>
  <!-- Real rows 0-3 -->
  <g stroke-width="1.3" font-size="13.5" font-weight="700">
    <rect x="32" y="180" width="182" height="27" rx="4" fill="#ddf4ef" stroke="#087f73"/>
    <text x="41" y="198" fill="#065f56">node0 卡 0 ← 真行 p₀</text>
    <rect x="32" y="211" width="182" height="27" rx="4" fill="#ddf4ef" stroke="#087f73"/>
    <text x="41" y="229" fill="#065f56">node0 卡 1 ← 真行 p₁</text>
    <rect x="32" y="242" width="182" height="27" rx="4" fill="#ddf4ef" stroke="#087f73"/>
    <text x="41" y="260" fill="#065f56">node0 卡 2 ← 真行 p₂</text>
    <rect x="32" y="273" width="182" height="27" rx="4" fill="#ddf4ef" stroke="#087f73"/>
    <text x="41" y="291" fill="#065f56">node0 卡 3 ← 真行 p₃</text>
  </g>
  <!-- Pad rows 4-7 -->
  <g stroke-width="1.2" font-size="13.5">
    <rect x="32" y="308" width="182" height="54" rx="5" fill="#ece9df" stroke="#b8bcb5" stroke-dasharray="4 3"/>
    <text x="41" y="330" font-weight="700" fill="#4d5652">node0 卡 4–7 ← 填充行</text>
    <text x="41" y="352" fill="#66716d">源切片无真 token</text>
  </g>
  <rect x="32" y="370" width="182" height="50" rx="5" fill="#fff4cf" stroke="#c78300" stroke-width="1.2"/>
  <text x="41" y="391" font-size="13.5" font-weight="700" fill="#936300">每真行选 8 路专家</text>
  <text x="41" y="411" font-size="13.5" fill="#4d5652">dispatch ≤ 32,800 B/卡</text>

  <!-- Dispatch Arrows (curved plum) fanning to BOTH node0 (0-7) and node1 (8-15) -->
  <path d="M 214 193 C 266 193, 272 198, 324 198" fill="none" stroke="#9a4b86" stroke-width="1.8" marker-end="url(#orm-arr-p)"/>
  <path d="M 214 224 C 268 224, 274 268, 324 268" fill="none" stroke="#9a4b86" stroke-width="1.8" marker-end="url(#orm-arr-p)"/>
  <path d="M 214 255 C 268 255, 274 342, 324 342" fill="none" stroke="#9a4b86" stroke-width="1.8" marker-end="url(#orm-arr-p)"/>
  <path d="M 214 286 C 268 286, 274 392, 324 392" fill="none" stroke="#9a4b86" stroke-width="1.8" marker-end="url(#orm-arr-p)"/>
  <rect x="222" y="294" width="98" height="44" rx="5" fill="#f7e7f2" stroke="#9a4b86" stroke-width="1.2"/>
  <text x="271" y="314" text-anchor="middle" font-size="13.5" font-weight="700" fill="#7a3a6a">EP16 MC2</text>
  <text x="271" y="332" text-anchor="middle" font-size="13.5" fill="#7a3a6a">dispatch</text>

  <!-- Col 2: 16 Destination Expert Ranks (node0 0-7 + node1 8-15) -->
  <text x="330" y="170" font-size="14" font-weight="700" fill="#7a3a6a">2. EP16 目的卡（每卡 18 专家：18r..18r+17）</text>

  <!-- node0 0-3 -->
  <rect x="330" y="180" width="286" height="56" rx="6" fill="#ddf4ef" stroke="#087f73" stroke-width="1.4"/>
  <text x="342" y="202" font-size="13.5" font-weight="700" fill="#065f56">node0 卡 0–3（专家 #0–71）</text>
  <text x="342" y="224" font-size="13.5" fill="#4d5652">收到路由命中的真 token → 算本地专家</text>

  <!-- node0 4-7 (pad source ranks STILL doing real expert work!) -->
  <rect x="330" y="244" width="286" height="60" rx="6" fill="#fff4cf" stroke="#c78300" stroke-width="1.5"/>
  <text x="342" y="267" font-size="13.5" font-weight="700" fill="#936300">node0 卡 4–7（专家 #72–143）</text>
  <text x="342" y="290" font-size="13.5" font-weight="700" fill="#8f3229">源行虽是填充，作为目的卡仍算真专家！</text>

  <!-- node1 8-15 (DP1 dummy ranks STILL doing real expert work!) -->
  <rect x="330" y="312" width="286" height="108" rx="6" fill="#f7e7f2" stroke="#9a4b86" stroke-width="1.5"/>
  <text x="340" y="336" font-size="13.5" font-weight="700" fill="#7a3a6a">node1 · DP1 卡 8–15（专家 #144–287）</text>
  <text x="342" y="360" font-size="13.5" fill="#17211f">无本地请求，跑 4-token dummy 陪跑</text>
  <text x="342" y="384" font-size="13.5" font-weight="700" fill="#8f3229">跨机收到 node0 路由来的真 token！</text>
  <text x="342" y="408" font-size="13.5" fill="#4d5652">若路由均匀，16 卡每卡期望算 2 行真任务</text>

  <!-- Combine arrows from Col 2 -> Col 3A (all stay above y=300 so zero crossing with bypass rail) -->
  <path d="M 616 208 L 662 214" fill="none" stroke="#9a4b86" stroke-width="1.8" marker-end="url(#orm-arr-p)"/>
  <path d="M 616 274 L 662 234" fill="none" stroke="#9a4b86" stroke-width="1.8" marker-end="url(#orm-arr-p)"/>
  <path d="M 616 332 L 662 254" fill="none" stroke="#9a4b86" stroke-width="1.8" marker-end="url(#orm-arr-p)"/>
  <rect x="617" y="277" width="60" height="19" rx="4" fill="#ffffff"/>
  <text x="647" y="291" text-anchor="middle" font-size="12" font-weight="700" fill="#7a3a6a">combine</text>

  <!-- Col 3: Routed Output (3A) + Parallel Shared Expert (3B) -> Merge (3C) -->
  <text x="666" y="170" font-size="14" font-weight="700" fill="#065f56">3. 路由收回 ∥ 共享专家相加</text>

  <!-- Box 3A: Routed Expert Combine + TP8 All-Gather -->
  <rect x="666" y="180" width="202" height="94" rx="6" fill="#e8edff" stroke="#4c65b6" stroke-width="1.4"/>
  <text x="674" y="203" font-size="13" font-weight="700" fill="#3a4f93">MC2 combine（≤65,536 B）</text>
  <text x="676" y="225" font-size="13.5" fill="#4d5652">TP8 All-Gather（8,192 B/卡）</text>
  <line x1="676" y1="238" x2="858" y2="238" stroke="#b8bcb5" stroke-width="1"/>
  <text x="676" y="261" font-size="13.5" font-weight="700" fill="#3a4f93">输出 routed_out [4, 4096]</text>

  <!-- Box 3B: Parallel Shared Expert taking PRE-DISPATCH hidden_states -->
  <rect x="666" y="298" width="202" height="88" rx="6" fill="#ddf4ef" stroke="#087f73" stroke-width="1.5"/>
  <text x="674" y="321" font-size="13.5" font-weight="700" fill="#065f56">并行共享专家（TP8 切分）</text>
  <text x="674" y="344" font-size="13.5" fill="#17211f">直吃原始 hidden_states</text>
  <text x="674" y="368" font-size="12.5" font-weight="700" fill="#065f56">TP8 All-Reduce → shared_out</text>

  <!-- Pre-dispatch parallel bypass rail: original hidden_states -> Box 3B (zero crossing!) -->
  <path d="M 22 240 L 14 240 L 14 446 L 646 446 L 646 342 L 662 342" fill="none" stroke="#087f73" stroke-width="2" marker-end="url(#orm-arr-t)"/>
  <rect x="60" y="432" width="556" height="26" rx="4" fill="#ffffff" stroke="#087f73" stroke-width="1.1"/>
  <text x="338" y="450" text-anchor="middle" font-size="13" font-weight="700" fill="#065f56">并行旁路：原始 hidden_states [4, 4096] 直入共享专家（不经 dispatch/combine）</text>

  <!-- Merge Box 3C: routed_out + shared_out -->
  <path d="M 868 227 L 884 227 L 884 426 L 872 426" fill="none" stroke="#4c65b6" stroke-width="2" marker-end="url(#orm-arr-b)"/>
  <path d="M 767 386 L 767 402" fill="none" stroke="#087f73" stroke-width="2" marker-end="url(#orm-arr-t)"/>
  <rect x="666" y="406" width="202" height="40" rx="6" fill="#fff4cf" stroke="#c78300" stroke-width="1.4"/>
  <text x="767" y="431" text-anchor="middle" font-size="13.5" font-weight="700" fill="#936300">routed + shared → 4 路 mHC</text>

  <!-- Bottom Accounting Strip -->
  <rect x="14" y="472" width="872" height="74" rx="7" fill="#ece9df" stroke="#b8bcb5" stroke-width="1.3"/>
  <text x="28" y="497" font-size="14" font-weight="700" fill="#17211f">单层逻辑副本账（未合并同卡目标）：dispatch 32,800 B + combine 65,536 B = 98,336 B/token/层（42 层 ≈ 3.94 MiB）</text>
  <text x="28" y="525" font-size="13.5" fill="#4d5652">边界：两组任一边本步超过 MC2 门槛 128 个 token（16 × 8），两边一起翻到 AllGather；16 张卡必须同步参与每层通信</text>
</svg>
