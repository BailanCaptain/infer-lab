<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 230" width="900" height="230" role="img" aria-label="一条请求在一颗 NPU 上占的两块地方：注意力的笔记很小，线性注意力的状态大得多">
  <title>一条请求在一颗 NPU 上占的两块地方：注意力的笔记很小，线性注意力的状态大得多</title>
  <defs><pattern id="one-request-memory-hatch" width="7" height="7" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="7" height="7" fill="var(--color-surface-sunken, #ece9df)"/><line x1="0" y1="0" x2="0" y2="7" stroke="var(--color-ink-muted, #66716d)" stroke-width="2"/></pattern></defs>
  <rect x="180" y="62" width="20.8" height="26" rx="4" fill="var(--color-kv, #4c65b6)" stroke="var(--color-ink, #17211f)" stroke-width="1.3"/>
  <rect x="200.8" y="62" width="159.2" height="26" rx="4" fill="url(#one-request-memory-hatch)" stroke="var(--color-ink-muted, #66716d)" stroke-width="1.3"/>
  <rect x="180" y="56" width="180" height="38" rx="7" fill="none" stroke="var(--color-kv, #4c65b6)" stroke-width="2.2"/>
  <text x="360" y="46" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="13" font-weight="700" fill="var(--color-kv, #4c65b6)" text-anchor="end">一个块预留 20 MiB</text>
  <rect x="180" y="140" width="276.3" height="26" rx="4" fill="var(--color-token, #087f73)" stroke="var(--color-ink, #17211f)" stroke-width="1.3"/>
  <text x="196" y="158" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="13" font-weight="700" fill="var(--color-ink-inverse, #ffffff)">状态本身 30.7 MiB</text>
  <rect x="456.3" y="140" width="270" height="26" rx="4" fill="url(#one-request-memory-hatch)" stroke="var(--color-ink-muted, #66716d)" stroke-width="1.3"/>
  <text x="30" y="82" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="13.5" font-weight="400" fill="#3a4f93">注意力的笔记</text>
  <text x="180" y="114" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="13" font-weight="400" fill="#3a4f93">真正写进去 2.3 MiB</text>
  <text x="30" y="160" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="13.5" font-weight="400" fill="#065f56">线性注意力的状态</text>
  <text x="456" y="190" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="13" font-weight="400" fill="var(--color-ink, #17211f)">这一段是补齐的空白</text>
  <text x="180" y="214" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="12.5" font-weight="400" fill="var(--color-ink-muted, #66716d)" font-style="italic">每 1 MiB 约 9 像素</text>
  <text x="460" y="214" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="12.5" font-weight="400" fill="var(--color-ink-muted, #66716d)" font-style="italic">回答再长，下面这条也不变</text>
</svg>
