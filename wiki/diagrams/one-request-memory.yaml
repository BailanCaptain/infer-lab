layout: figure
id: one-request-memory
caption: 一条请求在一颗 NPU 上占的两块地方：注意力的笔记很小，线性注意力的状态大得多
size: [900, 230]

texts:
  - { at: [30, 82], text: 注意力的笔记, size: 13.5, tone: kv }
  - { at: [180, 114], text: 真正写进去 2.3 MiB, size: 13, tone: kv }
  - { at: [30, 160], text: 线性注意力的状态, size: 13.5, tone: token }
  - { at: [456, 190], text: 这一段是补齐的空白, size: 13 }
  - { at: [180, 214], text: 每 1 MiB 约 9 像素, size: 12.5, note: true }
  - { at: [460, 214], text: 回答再长，下面这条也不变, size: 12.5, note: true }

bars:
  # 9 像素 = 1 MiB。上：一个块预留 2048 × 10 KiB = 20 MiB，这条请求只写进 237 × 10 KiB
  # 下：30 层线性注意力，每层状态 1 MiB + 24 KiB，页面被补齐到 2 MiB + 24 KiB
  - at: [180, 62]
    h: 26
    scale: 9
    frame: { value: 20, label: 一个块预留 20 MiB, tone: kv }
    segments:
      - { value: 2.31, tone: kv }
      - { value: 17.69, tone: kv, style: hatch }
  - at: [180, 140]
    h: 26
    scale: 9
    segments:
      - { value: 30.7, tone: token, text: 状态本身 30.7 MiB }
      - { value: 30, tone: token, style: hatch }
