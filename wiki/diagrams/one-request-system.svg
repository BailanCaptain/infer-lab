<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 680" width="900" height="680" role="img" aria-label="一条请求的七站：上面三列分别在 node0 的前端进程、DP0 的引擎进程和 node0 每张卡的 worker 进程里；最下面是 node1，它的 8 个 worker 每步陪跑，同时可能计算路由到本机专家的真实 token。两机还交换每步的 DP 元数据。框的个数不表示进程数">
  <title>一条请求的七站：上面三列分别在 node0 的前端进程、DP0 的引擎进程和 node0 每张卡的 worker 进程里；最下面是 node1，它的 8 个 worker 每步陪跑，同时可能计算路由到本机专家的真实 token。两机还交换每步的 DP 元数据。框的个数不表示进程数</title>
