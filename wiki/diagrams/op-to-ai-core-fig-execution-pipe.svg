<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 558" width="900" height="558" role="img" aria-label="从 Python 算子经 Host Tiling 分核到 AI Core 片上流水的完整几何链路" font-family="var(--font-sans)">
  <title>npu_add_rms_norm_bias 四段执行链：C++ 三输出预分配、Host 10 行分 4 核 Tiling 与 AI Core GM↔UB 片上流水</title>
  <desc>Geometric execution pipeline showing C++ pre-allocation of 3 tensors (y, rstd, s), Host tiling splitting 10 rows into 3+3+3+1 across 4 Vector cores with UB budget bar, and AI Core GM-to-UB CopyIn (immediate residual write-back), Vector Reduce with Sync Barrier, and CopyOut</desc>
  <defs>
    <marker id="ac-arr-ink" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="#4d5652"/>
    </marker>
    <marker id="ac-arr-teal" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="#087f73"/>
    </marker>
    <marker id="ac-arr-indigo" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="#4c65b6"/>
    </marker>
    <marker id="ac-arr-plum" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="#9a4b86"/>
    </marker>
  </defs>

  <text x="16" y="28" font-size="16" font-weight="700" fill="#17211f">① Host 侧：C++ 预分配三输出 → Host Tiling 分核分块（以 10 行、4 个 Vector 核为例）</text>
  <text x="16" y="50" font-size="13.5" fill="#66716d">GLM 无 residual 时直调 npu_rms_norm</text>

  <g transform="translate(0, 18)">
  <!-- Stage 1: Python / C++ Adapter -->
  <rect x="16" y="46" width="236" height="176" rx="7" fill="#ddf4ef" stroke="#087f73" stroke-width="1.4"/>
  <text x="28" y="72" font-size="14.5" font-weight="700" fill="#065f56">1. Python → C++ 适配层</text>
  <text x="28" y="96" font-size="13.5" fill="#4d5652">预分配 3 份 GM 输出张量：</text>
  <rect x="28" y="106" width="66" height="32" rx="4" fill="#ffffff" stroke="#087f73" stroke-width="1.2"/>
  <text x="61" y="127" text-anchor="middle" font-size="13.5" font-weight="700" fill="#065f56">y 归一</text>
  <rect x="100" y="106" width="66" height="32" rx="4" fill="#ffffff" stroke="#4c65b6" stroke-width="1.2"/>
  <text x="133" y="127" text-anchor="middle" font-size="13.5" font-weight="700" fill="#3a4f93">rstd</text>
  <rect x="172" y="106" width="68" height="32" rx="4" fill="#ffffff" stroke="#c78300" stroke-width="1.2"/>
  <text x="206" y="127" text-anchor="middle" font-size="13.5" font-weight="700" fill="#936300">s 残差</text>
  <rect x="28" y="152" width="212" height="56" rx="5" fill="#087f73"/>
  <text x="134" y="175" text-anchor="middle" font-size="13.5" font-weight="700" font-family="var(--font-mono)" fill="#ffffff">EXEC_NPU_CMD</text>
  <text x="134" y="196" text-anchor="middle" font-size="13.5" font-family="var(--font-mono)" fill="#ddf4ef">aclnnAddRmsNormBias</text>

  <line x1="254" y1="134" x2="278" y2="134" stroke="#4d5652" stroke-width="1.7" marker-end="url(#ac-arr-ink)"/>

  <!-- Stage 2: Host Tiling Visual Row Split -->
  <rect x="282" y="46" width="406" height="176" rx="7" fill="#e8edff" stroke="#4c65b6" stroke-width="1.4"/>
  <text x="296" y="72" font-size="14.5" font-weight="700" fill="#3a4f93">2. Host Tiling：10 行 ÷ 4 核 → 3 + 3 + 3 + 1</text>

  <!-- Visual 10 rows partitioned into 4 cores -->
  <rect x="296" y="86" width="90" height="46" rx="4" fill="#ffffff" stroke="#4c65b6" stroke-width="1.3"/>
  <text x="341" y="106" text-anchor="middle" font-size="13.5" font-weight="700" fill="#3a4f93">Core 0</text>
  <text x="341" y="124" text-anchor="middle" font-size="13.5" font-family="var(--font-mono)" fill="#4d5652">行 0, 1, 2</text>

  <rect x="394" y="86" width="90" height="46" rx="4" fill="#ffffff" stroke="#4c65b6" stroke-width="1.3"/>
  <text x="439" y="106" text-anchor="middle" font-size="13.5" font-weight="700" fill="#3a4f93">Core 1</text>
  <text x="439" y="124" text-anchor="middle" font-size="13.5" font-family="var(--font-mono)" fill="#4d5652">行 3, 4, 5</text>

  <rect x="492" y="86" width="90" height="46" rx="4" fill="#ffffff" stroke="#4c65b6" stroke-width="1.3"/>
  <text x="537" y="106" text-anchor="middle" font-size="13.5" font-weight="700" fill="#3a4f93">Core 2</text>
  <text x="537" y="124" text-anchor="middle" font-size="13.5" font-family="var(--font-mono)" fill="#4d5652">行 6, 7, 8</text>

  <rect x="590" y="86" width="84" height="46" rx="4" fill="#fff4cf" stroke="#c78300" stroke-width="1.4"/>
  <text x="632" y="106" text-anchor="middle" font-size="13.5" font-weight="700" fill="#936300">尾核 3</text>
  <text x="632" y="124" text-anchor="middle" font-size="13.5" font-family="var(--font-mono)" fill="#936300">行 9 (1行)</text>

  <!-- UB Capacity Budget Bar -->
  <text x="296" y="156" font-size="13.5" font-weight="700" fill="#3a4f93">片上 UB 容量二次划分（先扣预留，余量定每轮搬入行数）：</text>
  <rect x="296" y="166" width="110" height="24" rx="4" fill="#ece9df" stroke="#b8bcb5"/>
  <text x="351" y="183" text-anchor="middle" font-size="13.5" fill="#66716d">UB 预留</text>
  <rect x="410" y="166" width="264" height="24" rx="4" fill="#4c65b6"/>
  <text x="542" y="183" text-anchor="middle" font-size="13.5" font-weight="700" fill="#ffffff">可用 UB → 定单轮块大小与 tiling key</text>
  <text x="296" y="210" font-size="13.5" fill="#4d5652">行少时不必满核：如 2 行 ÷ 4 核仅启 2 核（BlockDim=2）</text>

  <line x1="690" y1="134" x2="714" y2="134" stroke="#4d5652" stroke-width="1.7" marker-end="url(#ac-arr-ink)"/>

  <!-- Stage 3: Task Queue Dispatch -->
  <rect x="718" y="46" width="166" height="176" rx="7" fill="#fff4cf" stroke="#c78300" stroke-width="1.4"/>
  <text x="801" y="72" text-anchor="middle" font-size="14.5" font-weight="700" fill="#936300">3. 任务队列下发</text>
  <text x="801" y="98" text-anchor="middle" font-size="13.5" fill="#4d5652">打包 tiling 参数</text>
  <text x="801" y="118" text-anchor="middle" font-size="13.5" fill="#4d5652">异步入队 Stream</text>
  <rect x="730" y="132" width="142" height="76" rx="5" fill="#ffffff" stroke="#c78300" stroke-width="1.2"/>
  <text x="801" y="154" text-anchor="middle" font-size="13.5" font-weight="700" fill="#936300">按 key 选模板</text>
  <text x="801" y="176" text-anchor="middle" font-size="13.5" fill="#4d5652">逐行 / 宽切分 /</text>
  <text x="801" y="196" text-anchor="middle" font-size="13.5" fill="#4d5652">合并多行模板</text>

  <!-- Divider -->
  <line x1="16" y1="240" x2="884" y2="240" stroke="#b8bcb5" stroke-width="1.4" stroke-dasharray="6 4"/>

  <!-- Section 2: Device AI Core GM <-> UB Pipeline -->
  <text x="16" y="268" font-size="16" font-weight="700" fill="#17211f">② 设备侧 AI Core 片上循环（GM 全局内存 ↔ UB 向量片上缓冲，单核核内循环）</text>

  <!-- GM Band Top -->
  <rect x="16" y="284" width="868" height="44" rx="6" fill="#e8edff" stroke="#4c65b6" stroke-width="1.3"/>
  <text x="30" y="311" font-size="14" font-weight="700" fill="#3a4f93">GM 全局内存</text>
  <rect x="148" y="292" width="144" height="28" rx="4" fill="#ffffff" stroke="#4c65b6"/><text x="220" y="311" text-anchor="middle" font-size="13.5" fill="#17211f">读 x, residual</text>
  <rect x="330" y="292" width="166" height="28" rx="4" fill="#fff4cf" stroke="#c78300" stroke-width="1.3"/><text x="413" y="311" text-anchor="middle" font-size="13.5" font-weight="700" fill="#936300">写回更新残差 s</text>
  <rect x="706" y="292" width="164" height="28" rx="4" fill="#ddf4ef" stroke="#087f73" stroke-width="1.3"/><text x="788" y="311" text-anchor="middle" font-size="13.5" font-weight="700" fill="#065f56">写出 y 与 rstd</text>

  <!-- Vertical DMA Arrows between GM and UB -->
  <line x1="186" y1="328" x2="186" y2="362" stroke="#4c65b6" stroke-width="1.8" marker-end="url(#ac-arr-indigo)"/>
  <line x1="354" y1="362" x2="354" y2="328" stroke="#c78300" stroke-width="1.8" marker-end="url(#ac-arr-ink)"/>
  <line x1="788" y1="362" x2="788" y2="328" stroke="#087f73" stroke-width="1.8" marker-end="url(#ac-arr-teal)"/>

  <!-- UB On-Chip Pipeline Band -->
  <rect x="16" y="366" width="868" height="94" rx="7" fill="#f7e7f2" fill-opacity="0.5" stroke="#9a4b86" stroke-width="1.4"/>
  <text x="30" y="392" font-size="14" font-weight="700" fill="#7a3a6a">AI Core 片上 UB &amp; Vector 单元</text>

  <rect x="148" y="398" width="218" height="50" rx="6" fill="#ffffff" stroke="#9a4b86" stroke-width="1.3"/>
  <text x="257" y="420" text-anchor="middle" font-size="14" font-weight="700" fill="#7a3a6a">CopyIn：s = x + res</text>
  <text x="257" y="440" text-anchor="middle" font-size="13.5" fill="#936300">相加后立刻将 s 写回 GM</text>

  <line x1="368" y1="423" x2="392" y2="423" stroke="#9a4b86" stroke-width="1.7" marker-end="url(#ac-arr-plum)"/>

  <rect x="396" y="398" width="286" height="50" rx="6" fill="#9a4b86"/>
  <text x="539" y="420" text-anchor="middle" font-size="13.5" font-weight="700" fill="#ffffff">Vector Compute（归约 → 屏障 → 缩放）</text>
  <text x="539" y="440" text-anchor="middle" font-size="13.5" fill="#f7e7f2">Σs²/H + ε → 同步等归约 → × r × γ</text>

  <line x1="684" y1="423" x2="704" y2="423" stroke="#087f73" stroke-width="1.7" marker-end="url(#ac-arr-teal)"/>

  <rect x="708" y="398" width="162" height="50" rx="6" fill="#ddf4ef" stroke="#087f73" stroke-width="1.4"/>
  <text x="789" y="420" text-anchor="middle" font-size="14" font-weight="700" fill="#065f56">CopyOutY / Rstd</text>
  <text x="789" y="440" text-anchor="middle" font-size="13.5" fill="#4d5652">写回 GM · 循环至尾行</text>

  <!-- Bottom 2 Clarity Badges -->
  <rect x="16" y="476" width="424" height="48" rx="6" fill="#ece9df" stroke="#b8bcb5" stroke-width="1.2"/>
  <text x="30" y="505" font-size="13.5" fill="#17211f"><tspan font-weight="700" fill="#7a3a6a">Cube vs Vector：</tspan>RMSNorm 主体在 Vector；矩阵乘才进 Cube</text>

  <rect x="460" y="476" width="424" height="48" rx="6" fill="#ece9df" stroke="#b8bcb5" stroke-width="1.2"/>
  <text x="474" y="505" font-size="13.5" fill="#17211f"><tspan font-weight="700" fill="#3a4f93">Tiling ≠ KV Block：</tspan>前者分算子行块，后者由 A3 块表管历史</text>
  </g>
</svg>
