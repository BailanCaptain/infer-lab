<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 450" width="860" height="450" role="img" aria-label="一个融合算子可包含矩阵与向量执行段；箭头表示数据依赖，交接方式由具体实现决定。归一化对照只需要向量计算，不经过矩阵乘。">
  <title>一个融合算子可包含矩阵与向量执行段；箭头表示数据依赖，交接方式由具体实现决定。归一化对照只需要向量计算，不经过矩阵乘。</title>
  <defs><marker id="op-to-ai-core-intuition-ah-token" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="var(--color-token, #087f73)"/></marker></defs>
  <rect x="20" y="35" width="820" height="220" rx="16" fill="none" stroke="var(--color-line-strong, #b8bcb5)" stroke-width="1.5"/>
  <text x="36" y="23" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="15" font-weight="700" fill="var(--color-ink, #17211f)">一张卡内：矩阵乘与激活融合算子的分工</text>
  <rect x="20" y="285" width="820" height="140" rx="16" fill="none" stroke="var(--color-line-strong, #b8bcb5)" stroke-width="1.5"/>
  <text x="36" y="273" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="15" font-weight="700" fill="var(--color-ink, #17211f)">对照：纯向量的 RMSNorm</text>
  <path d="M180 128 L225 128" fill="none" stroke="var(--color-token, #087f73)" stroke-width="1.4" marker-end="url(#op-to-ai-core-intuition-ah-token)"/>
  <path d="M380 128 L455 128" fill="none" stroke="var(--color-token, #087f73)" stroke-width="1.4" marker-end="url(#op-to-ai-core-intuition-ah-token)"/>
  <path d="M635 128 L685 128" fill="none" stroke="var(--color-token, #087f73)" stroke-width="1.4" marker-end="url(#op-to-ai-core-intuition-ah-token)"/>
  <path d="M180 367 L290 367" fill="none" stroke="var(--color-token, #087f73)" stroke-width="1.4" marker-end="url(#op-to-ai-core-intuition-ah-token)"/>
  <path d="M590 367 L685 367" fill="none" stroke="var(--color-token, #087f73)" stroke-width="1.4" marker-end="url(#op-to-ai-core-intuition-ah-token)"/>
  <rect x="45" y="95" width="135" height="65" rx="8" fill="var(--color-token-soft, #ddf4ef)" stroke="var(--color-token, #087f73)" stroke-width="1.4"/>
  <text x="112.5" y="123.5" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="14" font-weight="700" fill="var(--color-ink, #17211f)" text-anchor="middle">输入与权重</text>
  <text x="112.5" y="142.5" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="13" font-weight="400" fill="#065f56" text-anchor="middle">搬入当前数据块</text>
  <rect x="225" y="95" width="155" height="65" rx="8" fill="var(--color-weight-soft, #fff4cf)" stroke="var(--color-weight, #c78300)" stroke-width="1.4"/>
  <text x="302.5" y="123.5" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="14" font-weight="700" fill="var(--color-ink, #17211f)" text-anchor="middle">Cube 矩阵单元</text>
  <text x="302.5" y="142.5" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="13" font-weight="400" fill="#936300" text-anchor="middle">对应相乘并累加</text>
  <rect x="455" y="95" width="180" height="65" rx="8" fill="var(--color-token-soft, #ddf4ef)" stroke="var(--color-token, #087f73)" stroke-width="1.4"/>
  <text x="545" y="123.5" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="14" font-weight="700" fill="var(--color-ink, #17211f)" text-anchor="middle">Vector 向量单元</text>
  <text x="545" y="142.5" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="13" font-weight="400" fill="#065f56" text-anchor="middle">激活与逐元素处理</text>
  <rect x="685" y="95" width="130" height="65" rx="8" fill="var(--color-token-soft, #ddf4ef)" stroke="var(--color-token, #087f73)" stroke-width="1.4"/>
  <text x="750" y="123.5" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="14" font-weight="700" fill="var(--color-ink, #17211f)" text-anchor="middle">输出</text>
  <text x="750" y="142.5" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="13" font-weight="400" fill="#065f56" text-anchor="middle">交给下一步</text>
  <rect x="45" y="340" width="135" height="55" rx="8" fill="var(--color-token-soft, #ddf4ef)" stroke="var(--color-token, #087f73)" stroke-width="1.4"/>
  <text x="112.5" y="372.5" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="14" font-weight="700" fill="var(--color-ink, #17211f)" text-anchor="middle">一行输入</text>
  <rect x="290" y="330" width="300" height="75" rx="8" fill="var(--color-token-soft, #ddf4ef)" stroke="var(--color-token, #087f73)" stroke-width="1.4"/>
  <text x="440" y="363.5" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="14" font-weight="700" fill="var(--color-ink, #17211f)" text-anchor="middle">Vector：归约再缩放</text>
  <text x="440" y="382.5" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="13" font-weight="400" fill="#065f56" text-anchor="middle">整行求尺度 → 每个数乘尺度与权重</text>
  <rect x="685" y="340" width="130" height="55" rx="8" fill="var(--color-token-soft, #ddf4ef)" stroke="var(--color-token, #087f73)" stroke-width="1.4"/>
  <text x="750" y="372.5" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="14" font-weight="700" fill="var(--color-ink, #17211f)" text-anchor="middle">同宽输出</text>
  <text x="417" y="85" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="13" font-weight="400" fill="var(--color-ink, #17211f)" text-anchor="middle">中间结果</text>
  <text x="45" y="203" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="14" font-weight="400" fill="var(--color-ink, #17211f)">先取得矩阵乘结果，再做激活；融合把执行段组织到同一算子内</text>
</svg>
