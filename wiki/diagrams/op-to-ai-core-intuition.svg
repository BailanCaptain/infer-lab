<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 480" width="900" height="480" role="img" aria-label="AI Core 内矩阵乘与激活融合算子 Cube 到 Vector 数值变换对比纯 Vector RMSNorm" font-family="var(--font-sans)">
<title>算子落到 AI Core 的分工：Cube 矩阵乘 [5,-1] → Vector ReLU [5,0] vs 纯 Vector RMSNorm [3,4]</title>
<desc>主轨用 1×2 输入 [1,2] 乘 2×2 权重 [[1,-1],[2,0]] 展示 Cube 产出 [5,-1] 再经 Vector ReLU 产出 [5,0]；旁轨用 [3,4] 对照纯 Vector 的 RMSNorm 整行归约与同宽输出。</desc>
<defs>
  <marker id="ac-amber" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
    <path d="M1 1.5L8.5 5L1 8.5Z" fill="#c78300"/>
  </marker>
  <marker id="ac-teal" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
    <path d="M1 1.5L8.5 5L1 8.5Z" fill="#087f73"/>
  </marker>
  <marker id="ac-indigo" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
    <path d="M1 1.5L8.5 5L1 8.5Z" fill="#4c65b6"/>
  </marker>
</defs>

<!-- Main Track: MatMul + Activation Fusion (Cube -> Vector) -->
<rect x="14" y="12" width="872" height="238" rx="10" fill="#fbfaf6" stroke="#d8d8cf" stroke-width="1.3"/>
<circle cx="36" cy="36" r="11" fill="#c78300"/>
<text x="36" y="40.5" text-anchor="middle" font-size="12.5" font-weight="700" fill="#ffffff">1</text>
<text x="54" y="41" font-size="15.5" font-weight="700" fill="#17211f">主轨 · 矩阵乘与激活融合算子：Cube 乘加出 [5, -1] → Vector 激活出 [5, 0]</text>
<line x1="28" y1="56" x2="872" y2="56" stroke="#d8d8cf" stroke-width="1.2"/>

<!-- Stage 1: Load Input [1,2] & Weight [[1,-1],[2,0]] -->
<rect x="26" y="68" width="224" height="168" rx="8" fill="#ffffff" stroke="#087f73" stroke-width="1.2"/>
<text x="138" y="90" text-anchor="middle" font-size="12.5" font-weight="700" fill="#065f56">① 搬入数据块（输入 × 权重）</text>
<text x="68" y="114" text-anchor="middle" font-size="12" fill="#4d5652">输入 x [1×2]</text>
<g stroke="#087f73" stroke-width="1.2" fill="#ddf4ef" font-family="var(--font-mono)" font-size="13" font-weight="700" text-anchor="middle">
  <rect x="36" y="124" width="32" height="28" rx="4"/><text x="52" y="143" fill="#065f56" stroke="none">1</text>
  <rect x="72" y="124" width="32" height="28" rx="4"/><text x="88" y="143" fill="#065f56" stroke="none">2</text>
</g>
<text x="122" y="143" text-anchor="middle" font-size="14" font-weight="700" fill="#17211f">×</text>
<text x="184" y="114" text-anchor="middle" font-size="12" fill="#936300">权重 W [2×2]</text>
<g stroke="#c78300" stroke-width="1.2" fill="#fff4cf" font-family="var(--font-mono)" font-size="12.5" font-weight="700" text-anchor="middle">
  <rect x="142" y="122" width="38" height="26" rx="3"/><text x="161" y="139.5" fill="#936300" stroke="none">1</text>
  <rect x="184" y="122" width="38" height="26" rx="3"/><text x="203" y="139.5" fill="#936300" stroke="none">-1</text>
  <rect x="142" y="152" width="38" height="26" rx="3"/><text x="161" y="169.5" fill="#936300" stroke="none">2</text>
  <rect x="184" y="152" width="38" height="26" rx="3"/><text x="203" y="169.5" fill="#936300" stroke="none">0</text>
</g>
<text x="138" y="214" text-anchor="middle" font-size="12" fill="#4d5652">从设备内存分块搬入片上缓冲</text>

<!-- Stage 2: Cube Matrix Unit -> [5, -1] -->
<rect x="270" y="68" width="206" height="168" rx="8" fill="#fff4cf" stroke="#c78300" stroke-width="1.3"/>
<text x="373" y="90" text-anchor="middle" font-size="13" font-weight="700" fill="#936300">② Cube 矩阵单元</text>
<text x="373" y="114" text-anchor="middle" font-family="var(--font-mono)" font-size="12" fill="#17211f">列0: 1×1 + 2×2 = 5</text>
<text x="373" y="136" text-anchor="middle" font-family="var(--font-mono)" font-size="12" fill="#17211f">列1: 1×(-1)+2×0 = -1</text>
<text x="373" y="160" text-anchor="middle" font-size="12" font-weight="700" fill="#936300">Cube 出口中间张量 [1×2]：</text>
<g stroke="#c78300" stroke-width="1.3" fill="#ffffff" font-family="var(--font-mono)" font-size="13.5" font-weight="700" text-anchor="middle">
  <rect x="318" y="170" width="50" height="32" rx="4"/><text x="343" y="191" fill="#936300" stroke="none">5</text>
  <rect x="376" y="170" width="50" height="32" rx="4"/><text x="401" y="191" fill="#8f3229" stroke="none">-1</text>
</g>
<text x="373" y="222" text-anchor="middle" font-size="12" fill="#4d5652">按数据依赖交给下一执行段</text>

<!-- Stage 3: Vector Unit ReLU -> [5, 0] -->
<rect x="496" y="68" width="202" height="168" rx="8" fill="#ddf4ef" stroke="#087f73" stroke-width="1.3"/>
<text x="597" y="90" text-anchor="middle" font-size="13" font-weight="700" fill="#065f56">③ Vector 向量单元</text>
<text x="597" y="114" text-anchor="middle" font-size="12" fill="#17211f">逐元素非线性激活（ReLU 示意）</text>
<text x="597" y="136" text-anchor="middle" font-family="var(--font-mono)" font-size="12" fill="#065f56">max([5, -1], 0)</text>
<text x="597" y="160" text-anchor="middle" font-size="12" font-weight="700" fill="#065f56">Vector ReLU 出口 [1×2]：</text>
<g stroke="#087f73" stroke-width="1.3" fill="#ffffff" font-family="var(--font-mono)" font-size="13.5" font-weight="700" text-anchor="middle">
  <rect x="542" y="170" width="50" height="32" rx="4"/><text x="567" y="191" fill="#065f56" stroke="none">5</text>
  <rect x="600" y="170" width="50" height="32" rx="4"/><text x="625" y="191" fill="#065f56" stroke="none">0</text>
</g>
<text x="597" y="222" text-anchor="middle" font-size="12" fill="#4d5652">实际 MLP 亦可融 SwiGLU+量化</text>

<!-- Stage 4: Fused Output -->
<rect x="718" y="68" width="154" height="168" rx="8" fill="#ffffff" stroke="#087f73" stroke-width="1.2"/>
<text x="795" y="90" text-anchor="middle" font-size="13" font-weight="700" fill="#17211f">④ 算子输出</text>
<g stroke="#087f73" stroke-width="1.3" fill="#b8efe4" font-family="var(--font-mono)" font-size="13.5" font-weight="700" text-anchor="middle">
  <rect x="742" y="114" width="48" height="34" rx="4"/><text x="766" y="136" fill="#065f56" stroke="none">5</text>
  <rect x="798" y="114" width="48" height="34" rx="4"/><text x="822" y="136" fill="#065f56" stroke="none">0</text>
</g>
<text x="795" y="176" text-anchor="middle" font-size="12" fill="#065f56">融合进同一算子调用</text>
<text x="795" y="198" text-anchor="middle" font-size="12" fill="#4d5652">省去独立算子下发</text>
<text x="795" y="220" text-anchor="middle" font-size="12" fill="#66716d">写出供下一步消费</text>

<g fill="none" stroke-width="1.7">
  <line x1="250" y1="152" x2="268" y2="152" stroke="#c78300" marker-end="url(#ac-amber)"/>
  <line x1="476" y1="152" x2="494" y2="152" stroke="#087f73" marker-end="url(#ac-teal)"/>
  <line x1="698" y1="152" x2="716" y2="152" stroke="#087f73" marker-end="url(#ac-teal)"/>
</g>

<!-- Side Track: Pure Vector RMSNorm on [3, 4] -->
<rect x="14" y="264" width="872" height="204" rx="10" fill="#fbfaf6" stroke="#d8d8cf" stroke-width="1.3"/>
<circle cx="36" cy="288" r="11" fill="#4c65b6"/>
<text x="36" y="292.5" text-anchor="middle" font-size="12.5" font-weight="700" fill="#ffffff">2</text>
<text x="54" y="293" font-size="15.5" font-weight="700" fill="#17211f">旁轨对照 · 纯向量的 RMSNorm：输入 [3, 4] 整行归约再逐元素缩放（不经过 Cube 矩阵单元）</text>
<line x1="28" y1="308" x2="872" y2="308" stroke="#d8d8cf" stroke-width="1.2"/>

<rect x="26" y="320" width="176" height="134" rx="8" fill="#ffffff" stroke="#4c65b6" stroke-width="1.2"/>
<text x="114" y="343" text-anchor="middle" font-size="12.5" font-weight="700" fill="#3a4f93">一行输入 [1×2]</text>
<g stroke="#4c65b6" stroke-width="1.2" fill="#e8edff" font-family="var(--font-mono)" font-size="13.5" font-weight="700" text-anchor="middle">
  <rect x="60" y="358" width="50" height="34" rx="4"/><text x="85" y="380" fill="#3a4f93" stroke="none">3</text>
  <rect x="118" y="358" width="50" height="34" rx="4"/><text x="143" y="380" fill="#3a4f93" stroke="none">4</text>
</g>
<text x="114" y="418" text-anchor="middle" font-size="12" fill="#4d5652">设 γ=[1, 1], ε=0 示意</text>
<text x="114" y="439" text-anchor="middle" font-size="12" fill="#66716d">无需矩阵权重乘加</text>

<rect x="222" y="320" width="242" height="134" rx="8" fill="#e8edff" stroke="#4c65b6" stroke-width="1.3"/>
<text x="343" y="343" text-anchor="middle" font-size="12.5" font-weight="700" fill="#3a4f93">Vector ① 整行归约求尺度 r</text>
<text x="343" y="370" text-anchor="middle" font-family="var(--font-mono)" font-size="12" fill="#17211f">均方 ms = (3² + 4²) ÷ 2 = 12.5</text>
<text x="343" y="395" text-anchor="middle" font-family="var(--font-mono)" font-size="12.5" font-weight="700" fill="#3a4f93">尺度 r = 1/√12.5 ≈ 0.283</text>
<text x="343" y="422" text-anchor="middle" font-size="12" fill="#4d5652">把整行 [3, 4] 归约为 1 个共享标量</text>
<text x="343" y="442" text-anchor="middle" font-size="12" fill="#66716d">✗ 不使用 Cube 矩阵单元</text>

<rect x="484" y="320" width="194" height="134" rx="8" fill="#ddf4ef" stroke="#087f73" stroke-width="1.3"/>
<text x="581" y="343" text-anchor="middle" font-size="12.5" font-weight="700" fill="#065f56">Vector ② 逐元素乘 r·γ</text>
<text x="581" y="372" text-anchor="middle" font-family="var(--font-mono)" font-size="12" fill="#17211f">y₀ = 3 × 0.283 × 1</text>
<text x="581" y="397" text-anchor="middle" font-family="var(--font-mono)" font-size="12" fill="#17211f">y₁ = 4 × 0.283 × 1</text>
<text x="581" y="428" text-anchor="middle" font-size="12" fill="#065f56">每个通道乘同一行尺度 r</text>

<rect x="698" y="320" width="174" height="134" rx="8" fill="#ffffff" stroke="#087f73" stroke-width="1.2"/>
<text x="785" y="343" text-anchor="middle" font-size="12.5" font-weight="700" fill="#065f56">同宽输出 [1×2]</text>
<g stroke="#087f73" stroke-width="1.2" fill="#ddf4ef" font-family="var(--font-mono)" font-size="12.5" font-weight="700" text-anchor="middle">
  <rect x="720" y="362" width="60" height="34" rx="4"/><text x="750" y="384" fill="#065f56" stroke="none">0.85</text>
  <rect x="788" y="362" width="62" height="34" rx="4"/><text x="819" y="384" fill="#065f56" stroke="none">1.13</text>
</g>
<text x="785" y="422" text-anchor="middle" font-size="12" fill="#065f56">均方归一为 1 · 宽度不变</text>

<g fill="none" stroke-width="1.7">
  <line x1="202" y1="387" x2="220" y2="387" stroke="#4c65b6" marker-end="url(#ac-indigo)"/>
  <line x1="464" y1="387" x2="482" y2="387" stroke="#087f73" marker-end="url(#ac-teal)"/>
  <line x1="678" y1="387" x2="696" y2="387" stroke="#087f73" marker-end="url(#ac-teal)"/>
</g>
</svg>
