<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 604" width="900" height="604" role="img" aria-label="一次 RMSNorm 从 Python 掉到 AI Core：中间那个 if 就是第三层和第二层的分界">
  <title>一次 RMSNorm 从 Python 掉到 AI Core：中间那个 if 就是第三层和第二层的分界</title>
  <rect width="900" height="604" fill="var(--color-surface, #fbfaf6)"/>
  <rect x="20" y="56" width="860" height="68" rx="10" fill="var(--color-surface-sunken, #ece9df)"/>
  <rect x="20" y="56" width="5" height="68" rx="2.5" fill="var(--color-control, #5b6763)"/>
  <g transform="translate(43.8 79.8) scale(0.85)" fill="none" stroke="var(--color-control, #5b6763)" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M4 12h6m0 0l-4-4m4 4l-4 4M14 5h6v6h-6zM14 13h6v6h-6z"/></g>
  <text x="78" y="87" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="15" font-weight="700" fill="var(--color-ink, #17211f)">上游决定「这个算子归谁」</text>
  <text x="78" y="107" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="12.5" font-weight="400" fill="var(--color-ink-muted, #5b6763)">is_out_of_tree() 为真，于是分派到 forward_oot</text>
  <rect x="723" y="77.5" width="138" height="21.5" rx="10.8" fill="var(--color-surface, #fbfaf6)" stroke="var(--color-control, #5b6763)" stroke-width="1"/><text x="792" y="95" font-family="'JetBrains Mono',ui-monospace,monospace" font-size="12.5" font-weight="400" fill="var(--color-control, #5b6763)" text-anchor="middle">dispatch_forward</text>
  <rect x="20" y="138" width="860" height="68" rx="10" fill="var(--color-weight-soft, #fff4cf)"/>
  <rect x="20" y="138" width="5" height="68" rx="2.5" fill="var(--color-weight, #b87a00)"/>
  <g transform="translate(43.8 161.8) scale(0.85)" fill="none" stroke="var(--color-weight, #b87a00)" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3l9 5-9 5-9-5z M3 13l9 5 9-5"/></g>
  <text x="78" y="169" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="15" font-weight="700" fill="var(--color-ink, #17211f)">昇腾接住它</text>
  <text x="78" y="189" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="12.5" font-weight="400" fill="var(--color-ink-muted, #5b6763)">ops/layernorm.py 里的 AscendRMSNorm</text>
  <rect x="760.5" y="159.5" width="100.5" height="21.5" rx="10.8" fill="var(--color-surface, #fbfaf6)" stroke="var(--color-weight, #b87a00)" stroke-width="1"/><text x="810.8" y="177" font-family="'JetBrains Mono',ui-monospace,monospace" font-size="12.5" font-weight="400" fill="var(--color-weight, #b87a00)" text-anchor="middle">forward_oot</text>
  <line x1="20" y1="368" x2="880" y2="368" stroke="var(--color-accent, #e85b32)" stroke-width="2.5" stroke-dasharray="7 5"/>
  <text x="876" y="359" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="13" font-weight="700" fill="var(--color-accent, #e85b32)" text-anchor="end">这条线以下要过完整的 CMake 构建</text>
  <rect x="20" y="252" width="420" height="96" rx="11" fill="var(--color-surface, #fbfaf6)" stroke="var(--color-accent, #e85b32)" stroke-width="1.5"/>
  <rect x="32" y="284" width="32" height="32" rx="9" fill="var(--color-accent-soft, #fff0e9)"/><g transform="translate(38.4 290.4) scale(0.8)" fill="none" stroke="var(--color-accent, #e85b32)" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M13 2L4 14h7l-1 8 9-12h-7z"/></g>
  <text x="72" y="288" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="14.5" font-weight="700" fill="var(--color-ink, #17211f)">enable_custom_op() 为真</text>
  <text x="72" y="306" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="12.5" font-weight="400" fill="var(--color-ink-muted, #5b6763)">一次调用把 add、norm、bias 一起算完</text>
  <text x="72" y="323" font-family="'JetBrains Mono',ui-monospace,monospace" font-size="12.5" font-weight="400" fill="var(--color-accent, #e85b32)">torch.ops._C_ascend</text>
  <rect x="460" y="252" width="420" height="96" rx="11" fill="var(--color-surface, #fbfaf6)" stroke="var(--color-kv, #4c65b6)" stroke-width="1.5"/>
  <rect x="472" y="284" width="32" height="32" rx="9" fill="var(--color-kv-soft, #e8edff)"/><g transform="translate(478.4 290.4) scale(0.8)" fill="none" stroke="var(--color-kv, #4c65b6)" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2l9 5v10l-9 5-9-5V7z M3 7l9 5 9-5M12 12v10"/></g>
  <text x="512" y="288" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="14.5" font-weight="700" fill="var(--color-ink, #17211f)">为假，退回 CANN 现成算子</text>
  <text x="512" y="306" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="12.5" font-weight="400" fill="var(--color-ink-muted, #5b6763)">先 npu_add_rms_norm，再单独加一次 bias</text>
  <text x="512" y="323" font-family="'JetBrains Mono',ui-monospace,monospace" font-size="12.5" font-weight="400" fill="var(--color-kv, #4c65b6)">torch_npu</text>
  <rect x="20" y="386" width="420" height="76" rx="11" fill="var(--color-surface, #fbfaf6)" stroke="var(--color-accent, #e85b32)" stroke-width="1.5"/>
  <text x="36" y="420.5" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="14.5" font-weight="700" fill="var(--color-ink, #17211f)">csrc/…/op_host</text>
  <text x="36" y="438.5" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="12.5" font-weight="400" fill="var(--color-ink-muted, #5b6763)">tiling 在 CPU 上算：一次往 UB 里塞多少个元素</text>
  <rect x="20" y="476" width="420" height="76" rx="11" fill="var(--color-surface, #fbfaf6)" stroke="var(--color-accent, #e85b32)" stroke-width="1.5"/>
  <text x="36" y="510.5" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="14.5" font-weight="700" fill="var(--color-ink, #17211f)">csrc/…/op_kernel</text>
  <text x="36" y="528.5" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="12.5" font-weight="400" fill="var(--color-ink-muted, #5b6763)">__global__ __aicore__，真正跑在 AI Core 上</text>
  <rect x="460" y="386" width="420" height="166" rx="11" fill="var(--color-surface, #fbfaf6)" stroke="var(--color-kv, #4c65b6)" stroke-width="1.5"/>
  <text x="476" y="465.5" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="14.5" font-weight="700" fill="var(--color-ink, #17211f)">CANN 已经编好的算子</text>
  <text x="476" y="483.5" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="12.5" font-weight="400" fill="var(--color-ink-muted, #5b6763)">不用自己编，但 bias 要多走一趟 elementwise</text>
  <path d="M230 206 L230 248" fill="none" stroke="var(--color-accent, #e85b32)" stroke-width="1.8"/>
  <path d="M230 248 l-5.5 -11 l11 0 z" fill="var(--color-accent, #e85b32)"/>
  <path d="M670 206 L670 248" fill="none" stroke="var(--color-ink-faint, #8a928f)" stroke-width="1.8"/>
  <path d="M670 248 l-5.5 -11 l11 0 z" fill="var(--color-ink-faint, #8a928f)"/>
  <rect x="626.5" y="217" width="87" height="19" rx="6" fill="var(--color-surface, #fbfaf6)"/>
  <text x="670" y="231" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="12.5" font-weight="400" fill="var(--color-ink-muted, #5b6763)" text-anchor="middle">够用就停在这</text>
  <path d="M230 348 L230 382" fill="none" stroke="var(--color-accent, #e85b32)" stroke-width="1.8"/>
  <path d="M230 382 l-5.5 -11 l11 0 z" fill="var(--color-accent, #e85b32)"/>
  <path d="M230 462 L230 472" fill="none" stroke="var(--color-accent, #e85b32)" stroke-width="1.8"/>
  <path d="M230 472 l-5.5 -11 l11 0 z" fill="var(--color-accent, #e85b32)"/>
  <text x="20" y="232" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="13" font-weight="600" fill="var(--color-ink, #17211f)">同一个方法体里的一个 if，两条路的代价完全不同</text>
  <text x="20" y="578" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="12.5" font-weight="400" fill="var(--color-ink-muted, #5b6763)">那条请求每一步 forward 要跑 28 层，每层两次 RMSNorm——一步 56 次，200 步 11200 次。省下的那一趟 elementwise 是乘以 11200 的。</text>
  <text x="20" y="598" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="12.5" font-weight="400" fill="var(--color-ink-muted, #5b6763)">判断顺序自上而下：能用现成算子拼出来就别往下走。COMPILE_CUSTOM_KERNELS 关掉时，下面那两层根本不编。</text>
</svg>
