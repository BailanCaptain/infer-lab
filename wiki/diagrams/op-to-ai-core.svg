<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 700" width="900" height="700" role="img" aria-label="上方是 GLM 的无 residual 归一化调用；下方另以可选残差融合扩展展示 Host 分块与设备内存访问">
