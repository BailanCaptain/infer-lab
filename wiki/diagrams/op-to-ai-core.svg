<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 600" width="900" height="600" role="img" aria-label="一次归一化从上游落到 AI Core：分岔一边是自己编的融合算子（要过构建），一边是 CANN 现成算子">
  <title>一次归一化从上游落到 AI Core：分岔一边是自己编的融合算子（要过构建），一边是 CANN 现成算子</title>
  <defs><marker id="op-to-ai-core-ah-control" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="var(--color-control, #66716d)"/></marker><marker id="op-to-ai-core-ah-token" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="var(--color-token, #087f73)"/></marker><marker id="op-to-ai-core-ah-ink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="var(--color-ink, #17211f)"/></marker></defs>
  <path d="M20 388 L440 388" fill="none" stroke="var(--color-ink-muted, #66716d)" stroke-width="1.4" stroke-dasharray="6 5"/>
  <text x="20" y="378" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="13" font-weight="700" fill="var(--color-ink-muted, #66716d)">Python，改了就生效</text>
  <text x="20" y="410" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="13" font-weight="700" fill="var(--color-ink-muted, #66716d)">构建产物，改了要重编</text>
  <path d="M450 88 L450 112" fill="none" stroke="var(--color-control, #66716d)" stroke-width="1.4" marker-end="url(#op-to-ai-core-ah-control)"/>
  <path d="M450 180 L240 240" fill="none" stroke="var(--color-token, #087f73)" stroke-width="1.4" marker-end="url(#op-to-ai-core-ah-token)"/>
  <path d="M450 180 L670 240" fill="none" stroke="var(--color-ink, #17211f)" stroke-width="1.4" marker-end="url(#op-to-ai-core-ah-ink)"/>
  <path d="M240 332 L240 416" fill="none" stroke="var(--color-token, #087f73)" stroke-width="1.4" marker-end="url(#op-to-ai-core-ah-token)"/>
  <path d="M240 484 L240 508" fill="none" stroke="var(--color-token, #087f73)" stroke-width="1.4" marker-end="url(#op-to-ai-core-ah-token)"/>
  <rect x="230" y="24" width="440" height="64" rx="8" fill="var(--color-control, #66716d)" stroke="var(--color-ink, #17211f)" stroke-width="1.5"/>
  <text x="450" y="52" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="14" font-weight="700" fill="var(--color-ink-inverse, #ffffff)" text-anchor="middle">上游 vLLM 分派</text>
  <text x="450" y="71" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="13" font-weight="400" fill="var(--color-ink-inverse, #ffffff)" text-anchor="middle">平台自报「树外」，调用交给昇腾</text>
  <rect x="230" y="116" width="440" height="64" rx="8" fill="var(--color-control, #66716d)" stroke="var(--color-ink, #17211f)" stroke-width="1.5"/>
  <text x="450" y="144" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="14" font-weight="700" fill="var(--color-ink-inverse, #ffffff)" text-anchor="middle">昇腾接住这次归一化</text>
  <text x="450" y="163" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="13" font-weight="400" fill="var(--color-ink-inverse, #ffffff)" text-anchor="middle">带着残差进来，走到一处分岔</text>
  <rect x="60" y="244" width="360" height="88" rx="8" fill="var(--color-token, #087f73)" stroke="var(--color-ink, #17211f)" stroke-width="1.5"/>
  <text x="240" y="284" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="14" font-weight="700" fill="var(--color-ink-inverse, #ffffff)" text-anchor="middle">自己编的融合算子</text>
  <text x="240" y="303" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="13" font-weight="400" fill="var(--color-ink-inverse, #ffffff)" text-anchor="middle">加残差、归一化、加偏置一次做完</text>
  <rect x="480" y="244" width="380" height="88" rx="8" fill="var(--color-surface-sunken, #ece9df)" stroke="var(--color-ink, #17211f)" stroke-width="1.5"/>
  <text x="670" y="284" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="14" font-weight="700" fill="var(--color-ink, #17211f)" text-anchor="middle">CANN 现成算子</text>
  <text x="670" y="303" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="13" font-weight="400" fill="var(--color-ink, #17211f)" text-anchor="middle">加残差、归一化；偏置另跑一趟</text>
  <rect x="60" y="420" width="360" height="64" rx="8" fill="var(--color-control, #66716d)" stroke="var(--color-ink, #17211f)" stroke-width="1.5"/>
  <text x="240" y="448" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="14" font-weight="700" fill="var(--color-ink-inverse, #ffffff)" text-anchor="middle">切分计划（CPU 上现算）</text>
  <text x="240" y="467" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="13" font-weight="400" fill="var(--color-ink-inverse, #ffffff)" text-anchor="middle">一趟往片上缓存搬多少个数</text>
  <rect x="60" y="512" width="360" height="64" rx="8" fill="var(--color-control, #66716d)" stroke="var(--color-ink, #17211f)" stroke-width="1.5"/>
  <text x="240" y="540" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="14" font-weight="700" fill="var(--color-ink-inverse, #ffffff)" text-anchor="middle">核函数（AI Core 上跑）</text>
  <text x="240" y="559" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="13" font-weight="400" fill="var(--color-ink-inverse, #ffffff)" text-anchor="middle">按切分的号码挑一条模板</text>
  <text x="480" y="382" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="12.5" font-weight="400" fill="var(--color-ink-muted, #66716d)" font-style="italic">偏置只有带量化偏置的模型才有；这条 bf16 请求两边等价</text>
  <text x="480" y="430" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="12.5" font-weight="400" fill="var(--color-ink-muted, #66716d)" font-style="italic">CANN 算子已经编好，停在这一侧不用碰构建</text>
  <text x="480" y="560" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="12.5" font-weight="400" fill="var(--color-ink, #17211f)">一步 80 次、200 步 16000 次，都从最上面进来</text>
  <rect x="480" y="340" width="167" height="24" rx="12" fill="var(--color-danger, #b54237)"/>
  <text x="563.5" y="357" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="13" font-weight="700" fill="var(--color-ink-inverse, #ffffff)" text-anchor="middle">带偏置的模型多一趟搬运</text>
  <circle cx="200" cy="56" r="11" fill="var(--color-ink, #17211f)"/><text x="200" y="61" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="13" font-weight="700" fill="var(--color-ink-inverse, #ffffff)" text-anchor="middle">1</text>
  <circle cx="200" cy="148" r="11" fill="var(--color-ink, #17211f)"/><text x="200" y="153" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="13" font-weight="700" fill="var(--color-ink-inverse, #ffffff)" text-anchor="middle">2</text>
  <circle cx="36" cy="452" r="11" fill="var(--color-ink, #17211f)"/><text x="36" y="457" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="13" font-weight="700" fill="var(--color-ink-inverse, #ffffff)" text-anchor="middle">3</text>
  <circle cx="36" cy="544" r="11" fill="var(--color-ink, #17211f)"/><text x="36" y="549" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="13" font-weight="700" fill="var(--color-ink-inverse, #ffffff)" text-anchor="middle">4</text>
</svg>
