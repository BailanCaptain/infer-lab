<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 588" width="860" height="588" role="img" aria-label="从算子调用到 AI Core 硬件流水的四级立体拆解剖面图：主机侧 HOST TILING 计算分块与 tilingKey，经异步 TASK STREAM 提交至设备侧，从 GM TILES 全局显存经搬入段分流送入 L1/L0 → CUBE 矩阵路或 UB → VECTOR 向量路，算完经各自写回通路（FixPipe 或 MTE3，图中以 MTE OUT 概括 CopyOut 阶段）落回 GM" font-family="var(--font-sans)">
  <title>从主机算子调用落到 AI Core 执行的四级立体剖面：Host 侧 op_host 先按片上可用缓冲（如扣除 UB_USED 预留开销后的 UB 容量）完成分块规划与 tilingKey 选择，将任务描述符推入异步 TASK STREAM；设备侧按分块从 GM TILES 分流搬入 L1/L0 → CUBE（经 L0C → FixPipe → GM 写回）或 UB → VECTOR（经 UB → MTE3 → GM 写回，图中以 MTE OUT 统一示意 CopyOut 写出阶段）。</title>
  <desc>关联源码符号：forward_oot, UB_USED</desc>

  <image href="./wiki-illustrations/op-to-aicore-cutaway.webp" x="40" y="130" width="780" height="317" preserveAspectRatio="xMidYMid meet"/>

  <line x1="150" y1="114" x2="150" y2="177" stroke="#c78300" stroke-width="1.6"/>
  <circle cx="150" cy="177" r="5.5" fill="#ffffff" stroke="#c78300" stroke-width="2"/>
  <circle cx="150" cy="177" r="2.5" fill="#c78300"/>

  <line x1="462" y1="114" x2="462" y2="272" stroke="#4c65b6" stroke-width="1.6"/>
  <circle cx="462" cy="272" r="5.5" fill="#ffffff" stroke="#4c65b6" stroke-width="2"/>
  <circle cx="462" cy="272" r="2.5" fill="#4c65b6"/>

  <line x1="664" y1="114" x2="664" y2="244" stroke="#087f73" stroke-width="1.6"/>
  <circle cx="664" cy="244" r="5.5" fill="#ffffff" stroke="#087f73" stroke-width="2"/>
  <circle cx="664" cy="244" r="2.5" fill="#087f73"/>

  <line x1="314" y1="476" x2="314" y2="336" stroke="#c78300" stroke-width="1.6"/>
  <circle cx="314" cy="336" r="5.5" fill="#ffffff" stroke="#c78300" stroke-width="2"/>
  <circle cx="314" cy="336" r="2.5" fill="#c78300"/>

  <line x1="712" y1="476" x2="712" y2="371" stroke="#4c65b6" stroke-width="1.6"/>
  <circle cx="712" cy="371" r="5.5" fill="#ffffff" stroke="#4c65b6" stroke-width="2"/>
  <circle cx="712" cy="371" r="2.5" fill="#4c65b6"/>

  <g id="callout-tiling">
    <circle cx="20" cy="26" r="11" fill="#c78300"/>
    <text x="20" y="30.5" text-anchor="middle" font-size="12" font-weight="700" fill="#ffffff">1</text>
    <text x="38" y="31" font-size="14" font-weight="700" fill="#17211f">Host 分块规划 (op_host)</text>
    <text x="38" y="55" font-size="12.5" fill="#4d5652">按输入形状与片上容量切核数块长</text>
    <text x="38" y="77" font-size="12.5" fill="#4d5652">选定 <tspan font-family="var(--font-mono)" font-weight="700">tilingKey</tspan> 打包 <tspan font-family="var(--font-mono)" font-weight="700">TilingData</tspan></text>
    <text x="38" y="99" font-size="12.5" fill="#936300">在 CPU 定分工，不替设备算张量</text>
  </g>

  <g id="callout-gm">
    <circle cx="300" cy="26" r="11" fill="#4c65b6"/>
    <text x="300" y="30.5" text-anchor="middle" font-size="12" font-weight="700" fill="#ffffff">2</text>
    <text x="318" y="31" font-size="14" font-weight="700" fill="#17211f">全局显存切片 (GM TILES)</text>
    <text x="318" y="55" font-size="12.5" fill="#4d5652">大张量常驻 GM，超片上缓冲分批搬</text>
    <text x="318" y="77" font-size="12.5" fill="#4d5652">未融合算子须写出中间量再重读</text>
    <text x="318" y="99" font-size="12.5" fill="#3a4f93">残差融合在同次核内复用搬入行</text>
  </g>

  <g id="callout-aicore-pipe">
    <circle cx="580" cy="26" r="11" fill="#087f73"/>
    <text x="580" y="30.5" text-anchor="middle" font-size="12" font-weight="700" fill="#ffffff">3</text>
    <text x="598" y="31" font-size="14" font-weight="700" fill="#17211f">核内双路缓冲 (AI CORE)</text>
    <text x="598" y="55" font-size="12.5" fill="#4d5652">矩阵路走 <tspan font-family="var(--font-mono)" font-weight="700">L1→L0A/B→Cube</tspan></text>
    <text x="598" y="77" font-size="12.5" fill="#4d5652">向量路走 <tspan font-family="var(--font-mono)" font-weight="700">UB→Vector</tspan>（如归约）</text>
    <text x="598" y="99" font-size="12.5" fill="#065f56">双缓冲让搬运与计算在时间上重叠</text>
  </g>

  <g id="callout-stream">
    <circle cx="20" cy="500" r="11" fill="#c78300"/>
    <text x="20" y="504.5" text-anchor="middle" font-size="12" font-weight="700" fill="#ffffff">4</text>
    <text x="38" y="505" font-size="14" font-weight="700" fill="#17211f">异步任务流下发 (TASK STREAM)</text>
    <text x="38" y="529" font-size="12.5" fill="#4d5652">Host 把核启动描述符排进设备流后立即继续</text>
    <text x="38" y="552" font-size="12.5" fill="#936300">算子融合还能把两次独立下发合并成一次核启动</text>
  </g>

  <g id="callout-mte">
    <circle cx="432" cy="500" r="11" fill="#4c65b6"/>
    <text x="432" y="504.5" text-anchor="middle" font-size="12" font-weight="700" fill="#ffffff">5</text>
    <text x="450" y="505" font-size="14" font-weight="700" fill="#17211f">搬入计算写出流水 (CopyIn / Compute / CopyOut)</text>
    <text x="450" y="529" font-size="12.5" fill="#4d5652">硬件写出分别走 <tspan font-family="var(--font-mono)" font-weight="700">L0C→FixPipe→GM</tspan> 或 <tspan font-family="var(--font-mono)" font-weight="700">UB→MTE3→GM</tspan></text>
    <text x="450" y="552" font-size="12.5" fill="#3a4f93">图中 <tspan font-family="var(--font-mono)" font-weight="700">MTE OUT</tspan> 概括写出阶段；后续仍用的残差照常回写</text>
  </g>
</svg>
