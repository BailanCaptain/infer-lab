<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 416" width="900" height="416" role="img" aria-label="GLM 双机四类特殊层的算子落点与分支约束：W8A8 动态量化线性层、KDA 34 层、稀疏 MLA 11 层与 MoE MC2/AllGather">
  <defs>
    <marker id="arr-teal" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,1 L9,5 L0,9 z" fill="#087f73"/>
    </marker>
    <marker id="arr-amber" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,1 L9,5 L0,9 z" fill="#c78300"/>
    </marker>
    <marker id="arr-indigo" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,1 L9,5 L0,9 z" fill="#4c65b6"/>
    </marker>
    <marker id="arr-plum" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,1 L9,5 L0,9 z" fill="#9a4b86"/>
    </marker>
  </defs>

  <text x="20" y="28" font-family="sans-serif" font-size="16" font-weight="700" fill="#17211f">四类特殊层的设备算子落点与硬依赖约束（GLM 双机对照）</text>

  <!-- Card 1: W8A8 Quantized Linear (Top-Left, Teal) -->
  <rect x="20" y="46" width="420" height="168" rx="10" fill="#ddf4ef" stroke="#087f73" stroke-width="1.5"/>
  <rect x="20" y="46" width="420" height="32" rx="10" fill="#087f73"/>
  <rect x="20" y="66" width="420" height="12" fill="#087f73"/>
  <text x="34" y="68" font-family="sans-serif" font-size="14" font-weight="700" fill="#ffffff">① 动态量化矩阵乘（W8A8 Linear）</text>

  <rect x="34" y="90" width="122" height="44" rx="6" fill="#ffffff" stroke="#087f73" stroke-width="1.1"/>
  <text x="95" y="109" text-anchor="middle" font-family="monospace" font-size="13.5" font-weight="700" fill="#065f56">dynamic_quant</text>
  <text x="95" y="127" text-anchor="middle" font-family="sans-serif" font-size="13.5" fill="#4d5652">INT8+per-tok</text>
  <line x1="156" y1="112" x2="176" y2="112" stroke="#087f73" stroke-width="1.6" marker-end="url(#arr-teal)"/>
  <rect x="180" y="90" width="144" height="44" rx="6" fill="#ffffff" stroke="#087f73" stroke-width="1.1"/>
  <text x="252" y="109" text-anchor="middle" font-family="monospace" font-size="13.5" font-weight="700" fill="#065f56">quant_matmul</text>
  <text x="252" y="127" text-anchor="middle" font-family="sans-serif" font-size="13.5" fill="#4d5652">内置反量化(NZ)</text>
  <line x1="324" y1="112" x2="344" y2="112" stroke="#087f73" stroke-width="1.6" marker-end="url(#arr-teal)"/>
  <rect x="348" y="90" width="78" height="44" rx="6" fill="#ece9df" stroke="#087f73" stroke-width="1.1"/>
  <text x="387" y="117" text-anchor="middle" font-family="monospace" font-size="13.5" font-weight="700" fill="#17211f">BF16</text>

  <text x="34" y="160" font-family="sans-serif" font-size="13.5" fill="#17211f">• Python 无独立反量化调用；权重按默认策略转 NZ</text>
  <text x="34" y="182" font-family="sans-serif" font-size="13.5" fill="#065f56">• 例外：KDA q/k/v/o 及门控投影显式保持 BF16</text>

  <!-- Card 2: KDA Linear Attention (Top-Right, Amber) -->
  <rect x="460" y="46" width="420" height="168" rx="10" fill="#fff4cf" stroke="#c78300" stroke-width="1.5"/>
  <rect x="460" y="46" width="420" height="32" rx="10" fill="#c78300"/>
  <rect x="460" y="66" width="420" height="12" fill="#c78300"/>
  <text x="474" y="68" font-family="sans-serif" font-size="14" font-weight="700" fill="#ffffff">② KDA 线性注意力（主干 34 层 · 自研扩展）</text>

  <rect x="474" y="90" width="112" height="44" rx="6" fill="#ffffff" stroke="#c78300" stroke-width="1.1"/>
  <text x="530" y="109" text-anchor="middle" font-family="sans-serif" font-size="13.5" font-weight="700" fill="#936300">因果短卷积</text>
  <text x="530" y="127" text-anchor="middle" font-family="monospace" font-size="13.5" fill="#4d5652">window = 4</text>
  <line x1="586" y1="102" x2="612" y2="96" stroke="#c78300" stroke-width="1.6" marker-end="url(#arr-amber)"/>
  <line x1="586" y1="122" x2="612" y2="128" stroke="#c78300" stroke-width="1.6" marker-end="url(#arr-amber)"/>

  <rect x="616" y="84" width="250" height="26" rx="5" fill="#ffffff" stroke="#c78300" stroke-width="1"/>
  <text x="626" y="102" font-family="sans-serif" font-size="13.5" fill="#17211f">Prefill: L2 + 前缀和 + 分块(64)</text>
  <rect x="616" y="114" width="250" height="26" rx="5" fill="#ffffff" stroke="#c78300" stroke-width="1"/>
  <text x="626" y="132" font-family="sans-serif" font-size="13.5" fill="#17211f">Decode/投机: 递推算子(多候选写回)</text>

  <text x="474" y="164" font-family="sans-serif" font-size="13.5" font-weight="700" fill="#8f3229">• 硬依赖：Prefill 缺自编译扩展直接抛错，不退 PyTorch</text>
  <text x="474" y="186" font-family="sans-serif" font-size="13.5" fill="#4d5652">• 混批分开调递推与分块，按 decode 在前拼接还原</text>

  <!-- Card 3: Sparse MLA Attention (Bottom-Left, Indigo) -->
  <rect x="20" y="232" width="420" height="168" rx="10" fill="#e8edff" stroke="#4c65b6" stroke-width="1.5"/>
  <rect x="20" y="232" width="420" height="32" rx="10" fill="#4c65b6"/>
  <rect x="20" y="252" width="420" height="12" fill="#4c65b6"/>
  <text x="34" y="254" font-family="sans-serif" font-size="14" font-weight="700" fill="#ffffff">③ 稀疏 MLA 注意力（11 层 + MTP）</text>

  <rect x="34" y="276" width="132" height="44" rx="6" fill="#ffffff" stroke="#4c65b6" stroke-width="1.1"/>
  <text x="100" y="295" text-anchor="middle" font-family="sans-serif" font-size="13.5" font-weight="700" fill="#3a4f93">取 packed MLA</text>
  <text x="100" y="313" text-anchor="middle" font-family="sans-serif" font-size="13.5" fill="#4d5652">校验 latent/RoPE</text>
  <line x1="166" y1="298" x2="188" y2="298" stroke="#4c65b6" stroke-width="1.6" marker-end="url(#arr-indigo)"/>
  <rect x="192" y="276" width="234" height="44" rx="6" fill="#ffffff" stroke="#4c65b6" stroke-width="1.3"/>
  <text x="309" y="295" text-anchor="middle" font-family="monospace" font-size="13.5" font-weight="700" fill="#3a4f93">aclnnSparseFlashAttention</text>
  <text x="309" y="313" text-anchor="middle" font-family="monospace" font-size="13.5" fill="#4d5652">Q:TND · KV:PA_BSND · blk=1</text>

  <text x="34" y="346" font-family="sans-serif" font-size="13.5" fill="#17211f">• 不把三份缓存临时拼成完整 KV；经 csrc 扩展调用 CANN</text>
  <text x="34" y="368" font-family="sans-serif" font-size="13.5" fill="#3a4f93">• A2 适配层先拼两段 Query，只认 sparse_mode=3</text>

  <!-- Card 4: MoE Dispatch / Expert / Combine (Bottom-Right, Plum) -->
  <rect x="460" y="232" width="420" height="168" rx="10" fill="#f7e7f2" stroke="#9a4b86" stroke-width="1.5"/>
  <rect x="460" y="232" width="420" height="32" rx="10" fill="#9a4b86"/>
  <rect x="460" y="252" width="420" height="12" fill="#9a4b86"/>
  <text x="474" y="254" font-family="sans-serif" font-size="14" font-weight="700" fill="#ffffff">④ MoE 分发 · 分组专家计算 · 合并</text>

  <rect x="474" y="276" width="112" height="44" rx="6" fill="#ffffff" stroke="#9a4b86" stroke-width="1.1"/>
  <text x="530" y="295" text-anchor="middle" font-family="sans-serif" font-size="13.5" font-weight="700" fill="#7a3a6a">MC2 / AG</text>
  <text x="530" y="313" text-anchor="middle" font-family="sans-serif" font-size="13.5" fill="#4d5652">分发 Dispatch</text>
  <line x1="586" y1="298" x2="604" y2="298" stroke="#9a4b86" stroke-width="1.6" marker-end="url(#arr-plum)"/>
  <rect x="608" y="276" width="144" height="44" rx="6" fill="#ffffff" stroke="#9a4b86" stroke-width="1.3"/>
  <text x="680" y="295" text-anchor="middle" font-family="sans-serif" font-size="13.5" font-weight="700" fill="#7a3a6a">GMM + SwiGLU</text>
  <text x="680" y="313" text-anchor="middle" font-family="sans-serif" font-size="13.5" fill="#4d5652">融合或分离 → GMM2</text>
  <line x1="752" y1="298" x2="770" y2="298" stroke="#9a4b86" stroke-width="1.6" marker-end="url(#arr-plum)"/>
  <rect x="774" y="276" width="92" height="44" rx="6" fill="#ffffff" stroke="#9a4b86" stroke-width="1.1"/>
  <text x="820" y="295" text-anchor="middle" font-family="sans-serif" font-size="13.5" font-weight="700" fill="#7a3a6a">MC2 / AG</text>
  <text x="820" y="313" text-anchor="middle" font-family="sans-serif" font-size="13.5" fill="#4d5652">合并 Combine</text>

  <text x="474" y="346" font-family="sans-serif" font-size="13.5" fill="#17211f">• 达专家数/EP/token 容量条件走 MC2，大批换 AllGather</text>
  <text x="474" y="368" font-family="sans-serif" font-size="13.5" fill="#7a3a6a">• W8A8 分组矩阵乘 + SwiGLU 融合路径须权重预转 NZ</text>
</svg>
