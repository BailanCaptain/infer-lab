<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 500" width="900" height="500" role="img" aria-label="v0.30.0 标准 Qwen3-8B / Qwen3-30B-A3B 的算子替换与图执行路径选择：模块调用先经 CustomOp 绑定到昇腾 forward_oot 实现，再按 enforce_eager、PIECEWISE / FULL_AND_PIECEWISE（注意力处切段）与 FULL_DECODE_ONLY（整图保留并可叠加 npugraph_ex FX 融合）三路落到 NPU 流上执行。">
  <title>v0.30.0 标准 Qwen3-8B / Qwen3-30B-A3B 的算子替换与图执行路径选择：模块调用先经 CustomOp 绑定到昇腾 forward_oot 实现，再按 enforce_eager、PIECEWISE / FULL_AND_PIECEWISE（注意力处切段）与 FULL_DECODE_ONLY（整图保留并可叠加 npugraph_ex FX 融合）三路落到 NPU 流上执行。</title>
  <defs><marker id="ops-ir-selection-qwen3-ah-ink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="var(--color-ink, #17211f)"/></marker><marker id="ops-ir-selection-qwen3-ah-token" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="var(--color-token, #087f73)"/></marker><marker id="ops-ir-selection-qwen3-ah-weight" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="var(--color-weight, #c78300)"/></marker><marker id="ops-ir-selection-qwen3-ah-kv" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="var(--color-kv, #4c65b6)"/></marker></defs>
  <path d="M330 82 L330 110 L156 110 L156 140" fill="none" stroke="var(--color-ink, #17211f)" stroke-width="1.4" marker-end="url(#ops-ir-selection-qwen3-ah-ink)"/>
  <path d="M450 82 L450 140" fill="none" stroke="var(--color-token, #087f73)" stroke-width="1.4" marker-end="url(#ops-ir-selection-qwen3-ah-token)"/>
  <path d="M570 82 L570 110 L744 110 L744 140" fill="none" stroke="var(--color-weight, #c78300)" stroke-width="1.4" marker-end="url(#ops-ir-selection-qwen3-ah-weight)"/>
  <path d="M156 212 L156 258" fill="none" stroke="var(--color-ink, #17211f)" stroke-width="1.4" marker-end="url(#ops-ir-selection-qwen3-ah-ink)"/>
  <path d="M450 212 L450 258" fill="none" stroke="var(--color-kv, #4c65b6)" stroke-width="1.4" marker-end="url(#ops-ir-selection-qwen3-ah-kv)"/>
  <path d="M744 212 L744 258" fill="none" stroke="var(--color-weight, #c78300)" stroke-width="1.4" marker-end="url(#ops-ir-selection-qwen3-ah-weight)"/>
  <path d="M156 326 L156 354 L330 354 L330 382" fill="none" stroke="var(--color-ink, #17211f)" stroke-width="1.4" marker-end="url(#ops-ir-selection-qwen3-ah-ink)"/>
  <path d="M450 326 L450 382" fill="none" stroke="var(--color-kv, #4c65b6)" stroke-width="1.4" marker-end="url(#ops-ir-selection-qwen3-ah-kv)"/>
  <path d="M744 326 L744 354 L570 354 L570 382" fill="none" stroke="var(--color-weight, #c78300)" stroke-width="1.4" marker-end="url(#ops-ir-selection-qwen3-ah-weight)"/>
  <rect x="230" y="24" width="440" height="58" rx="8" fill="var(--color-control-soft, #f1efe8)" stroke="var(--color-control, #66716d)" stroke-width="1.4"/>
  <text x="450" y="49" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="14" font-weight="700" fill="var(--color-ink, #17211f)" text-anchor="middle">Qwen3 层内运算（RMSNorm / QKV / Attention / SwiGLU / MoE）</text>
  <text x="450" y="68" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="13" font-weight="400" fill="var(--color-ink-muted, #66716d)" text-anchor="middle">CustomOp 注册表先将上游模块绑定至昇腾 forward_oot</text>
  <rect x="24" y="140" width="264" height="72" rx="8" fill="var(--color-control-soft, #f1efe8)" stroke="var(--color-line-strong, #b8bcb5)" stroke-width="1.4"/>
  <text x="156" y="172" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="14" font-weight="700" fill="var(--color-ink, #17211f)" text-anchor="middle">enforce_eager = True</text>
  <text x="156" y="191" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="13" font-weight="400" fill="var(--color-ink-muted, #66716d)" text-anchor="middle">Python 逐算子即时下发 torch_npu</text>
  <rect x="318" y="140" width="264" height="72" rx="8" fill="var(--color-token-soft, #ddf4ef)" stroke="var(--color-token, #087f73)" stroke-width="1.4"/>
  <text x="450" y="172" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="14" font-weight="700" fill="var(--color-ink, #17211f)" text-anchor="middle">PIECEWISE / FULL+PIECEWISE</text>
  <text x="450" y="191" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="13" font-weight="400" fill="#065f56" text-anchor="middle">AscendCompiler 按注意力切分子图</text>
  <rect x="612" y="140" width="264" height="72" rx="8" fill="var(--color-weight-soft, #fff4cf)" stroke="var(--color-weight, #c78300)" stroke-width="1.4"/>
  <text x="744" y="172" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="14" font-weight="700" fill="var(--color-ink, #17211f)" text-anchor="middle">FULL_DECODE_ONLY（纯解码整图）</text>
  <text x="744" y="191" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="13" font-weight="400" fill="#936300" text-anchor="middle">清空 splitting_ops 保持整图完整</text>
  <rect x="24" y="258" width="264" height="68" rx="8" fill="var(--color-control-soft, #f1efe8)" stroke="var(--color-line-strong, #b8bcb5)" stroke-width="1.4"/>
  <text x="156" y="288" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="14" font-weight="700" fill="var(--color-ink, #17211f)" text-anchor="middle">0 图捕获开销</text>
  <text x="156" y="307" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="13" font-weight="400" fill="var(--color-ink-muted, #66716d)" text-anchor="middle">适合排障与启动期 profile_run</text>
  <rect x="318" y="258" width="264" height="68" rx="8" fill="var(--color-kv-soft, #e8edff)" stroke="var(--color-kv, #4c65b6)" stroke-width="1.4"/>
  <text x="450" y="288" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="14" font-weight="700" fill="var(--color-ink, #17211f)" text-anchor="middle">捕获分段 ACLGraph</text>
  <text x="450" y="307" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="13" font-weight="400" fill="#3a4f93" text-anchor="middle">兼容混合批，默认关闭 npugraph_ex</text>
  <rect x="612" y="258" width="264" height="68" rx="8" fill="var(--color-weight-soft, #fff4cf)" stroke="var(--color-weight, #c78300)" stroke-width="1.4"/>
  <text x="744" y="288" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="14" font-weight="700" fill="var(--color-ink, #17211f)" text-anchor="middle">叠加 npugraph_ex 图融合</text>
  <text x="744" y="307" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="13" font-weight="400" fill="#936300" text-anchor="middle">纯 decode 整图；prefill 走 eager</text>
  <rect x="210" y="382" width="480" height="62" rx="8" fill="var(--color-control-soft, #f1efe8)" stroke="var(--color-ink, #17211f)" stroke-width="1.4"/>
  <text x="450" y="409" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="14" font-weight="700" fill="var(--color-ink, #17211f)" text-anchor="middle">昇腾 NPU 流执行核函数（Cube + Vector + HCCL）</text>
  <text x="450" y="428" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="13" font-weight="400" fill="var(--color-ink-muted, #66716d)" text-anchor="middle">命中已录档位直接回放任务流，大幅削减主机侧下发延迟</text>
  <text x="450" y="474" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="13.5" font-weight="400" fill="var(--color-ink-muted, #66716d)" text-anchor="middle" font-style="italic">编译与捕获档位在启动期 check_and_update_config 锁定，运行期按批尺寸自动路由</text>
</svg>
