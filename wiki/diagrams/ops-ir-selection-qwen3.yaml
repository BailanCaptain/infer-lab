layout: figure
id: ops-ir-selection-qwen3
caption: v0.30.0 标准 Qwen3-8B / Qwen3-30B-A3B 的算子替换与图执行路径选择：模块调用先经 CustomOp 绑定到昇腾 forward_oot 实现，再按 enforce_eager、PIECEWISE / FULL_AND_PIECEWISE（注意力处切段）与 FULL_DECODE_ONLY（整图保留并可叠加 npugraph_ex FX 融合）三路落到 NPU 流上执行。
size: [900, 500]
items:
  - { at: [230, 24], size: [440, 58], text: 'Qwen3 层内运算（RMSNorm / QKV / Attention / SwiGLU / MoE）', sub: 'CustomOp 注册表先将上游模块绑定至昇腾 forward_oot', tone: control }
  - { at: [24, 140], size: [264, 72], text: 'enforce_eager = True', sub: 'Python 逐算子即时下发 torch_npu', tone: control, style: plain }
  - { at: [318, 140], size: [264, 72], text: 'PIECEWISE / FULL+PIECEWISE', sub: 'AscendCompiler 按注意力切分子图', tone: token }
  - { at: [612, 140], size: [264, 72], text: 'FULL_DECODE_ONLY（纯解码整图）', sub: '清空 splitting_ops 保持整图完整', tone: weight }
  - { at: [24, 258], size: [264, 68], text: '0 图捕获开销', sub: '适合排障与启动期 profile_run', style: plain }
  - { at: [318, 258], size: [264, 68], text: '捕获分段 ACLGraph', sub: '兼容混合批，默认关闭 npugraph_ex', tone: kv }
  - { at: [612, 258], size: [264, 68], text: '叠加 npugraph_ex 图融合', sub: '纯 decode 整图；prefill 走 eager', tone: weight }
  - { at: [210, 382], size: [480, 62], text: '昇腾 NPU 流执行核函数（Cube + Vector + HCCL）', sub: '命中已录档位直接回放任务流，大幅削减主机侧下发延迟', tone: ink }
