<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 470" width="900" height="470" role="img" aria-label="那条请求里的一次矩阵乘，从 Python 一路掉到 AI Core 要穿过四层">
  <title>那条请求里的一次矩阵乘，从 Python 一路掉到 AI Core 要穿过四层</title>
  <rect width="900" height="470" fill="var(--color-surface, #fbfaf6)"/>
  <rect x="64" y="56" width="816" height="74" rx="10" fill="var(--color-weight-soft, #fff4cf)"/>
  <rect x="64" y="56" width="5" height="74" rx="2.5" fill="var(--color-weight, #b87a00)"/>
  <g transform="translate(87.8 82.8) scale(0.85)" fill="none" stroke="var(--color-weight, #b87a00)" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3l9 5-9 5-9-5z M3 13l9 5 9-5"/></g>
  <text x="122" y="90" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="15" font-weight="700" fill="var(--color-ink, #17211f)">vllm_ascend/ops/</text>
  <text x="122" y="110" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="12.5" font-weight="400" fill="var(--color-ink-muted, #5b6763)">89 个文件、23484 行。走上游 CustomOp 注册这个正规口子，不是 patch。</text>
  <text x="864" y="98" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="12.5" font-weight="400" fill="var(--color-ink-muted, #5b6763)" text-anchor="end">上游算子在昇腾上实现不优时改这里</text>
  <rect x="64" y="144" width="816" height="74" rx="10" fill="var(--color-kv-soft, #e8edff)"/>
  <rect x="64" y="144" width="5" height="74" rx="2.5" fill="var(--color-kv, #4c65b6)"/>
  <g transform="translate(87.8 170.8) scale(0.85)" fill="none" stroke="var(--color-kv, #4c65b6)" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2l9 5v10l-9 5-9-5V7z M3 7l9 5 9-5M12 12v10"/></g>
  <text x="122" y="178" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="15" font-weight="700" fill="var(--color-ink, #17211f)">torch_npu</text>
  <text x="122" y="198" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="12.5" font-weight="400" fill="var(--color-ink-muted, #5b6763)">CANN 已经提供的算子，直接调，不改。</text>
  <text x="864" y="186" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="12.5" font-weight="400" fill="var(--color-ink-muted, #5b6763)" text-anchor="end">绝大多数算子停在这一层</text>
  <rect x="64" y="232" width="816" height="74" rx="10" fill="var(--color-accent-soft, #fff0e9)"/>
  <rect x="64" y="232" width="5" height="74" rx="2.5" fill="var(--color-accent, #e85b32)"/>
  <g transform="translate(87.8 258.8) scale(0.85)" fill="none" stroke="var(--color-accent, #e85b32)" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M13 2L4 14h7l-1 8 9-12h-7z"/></g>
  <text x="122" y="266" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="15" font-weight="700" fill="var(--color-ink, #17211f)">csrc/ 编出来的自定义 aclnn 算子</text>
  <text x="122" y="286" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="12.5" font-weight="400" fill="var(--color-ink-muted, #5b6763)">装进 vllm_ascend/cann_ops_custom/，绑到 torch.ops._C_ascend</text>
  <text x="864" y="274" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="12.5" font-weight="400" fill="var(--color-ink-muted, #5b6763)" text-anchor="end">CANN 里没有、或要做特定融合时才下来</text>
  <rect x="64" y="320" width="816" height="74" rx="10" fill="var(--color-canvas, #f5f2ea)"/>
  <rect x="64" y="320" width="5" height="74" rx="2.5" fill="var(--color-ink-faint, #8a928f)"/>
  <g transform="translate(87.8 346.8) scale(0.85)" fill="none" stroke="var(--color-ink-faint, #8a928f)" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M7 7h10v10H7z M10 3v4M14 3v4M10 17v4M14 17v4M3 10h4M3 14h4M17 10h4M17 14h4"/></g>
  <text x="122" y="354" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="15" font-weight="700" fill="var(--color-ink, #17211f)">CANN / AI Core</text>
  <text x="122" y="374" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="12.5" font-weight="400" fill="var(--color-ink-muted, #5b6763)">真正的乘加发生在这里。不改。</text>
  <text x="864" y="362" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="12.5" font-weight="400" fill="var(--color-ink-muted, #5b6763)" text-anchor="end">一次矩阵乘的终点</text>
  <path d="M40 60 L40 392 L40 392" fill="none" stroke="var(--color-accent, #e85b32)" stroke-width="1.8"/>
  <path d="M40 392 l-11 -5.5 l0 11 z" fill="var(--color-accent, #e85b32)"/>
  <text x="20" y="424" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="12.5" font-weight="400" fill="var(--color-ink-muted, #5b6763)">判断顺序自上而下：能在 ops/ 里用现成 torch_npu 算子拼出来的，就不要下到 csrc/——后者要过完整 CMake 构建，而 COMPILE_CUSTOM_KERNELS 关掉</text>
  <text x="20" y="442.5" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="12.5" font-weight="400" fill="var(--color-ink-muted, #5b6763)">时这一层根本不编。</text>
  <text x="20" y="462" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="12.5" font-weight="400" fill="var(--color-ink-muted, #5b6763)">register_dummy_fusion_op 往 torch.ops._C_ascend 上挂了 9 个占位融合算子，让上游引用融合算子的代码路径有东西可调。看到 dummyFusionOp </text>
  <text x="20" y="480.5" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="12.5" font-weight="400" fill="var(--color-ink-muted, #5b6763)">不是没写完。</text>
</svg>
