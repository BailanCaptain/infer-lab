<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 590" width="900" height="590" role="img" aria-label="从调度计划到设备状态：上方是每轮接口交接，下方展开资源记录、执行映射与缓存张量的对应关系；颜色表示数据语义">
  <title>从调度计划到设备状态：上方是每轮接口交接，下方展开资源记录、执行映射与缓存张量的对应关系；颜色表示数据语义</title>
  <defs><marker id="ownership-boundary-ah-control" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="var(--color-control, #66716d)"/></marker><marker id="ownership-boundary-ah-token" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="var(--color-token, #087f73)"/></marker><marker id="ownership-boundary-ah-kv" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="var(--color-kv, #4c65b6)"/></marker></defs>
  <g data-hardware="memory">
  <rect x="650" y="330" width="205" height="74" rx="3" fill="var(--color-kv-soft, #e8edff)" stroke="var(--color-kv, #4c65b6)" stroke-width="1.5"/>
  <path d="M655 396h195M655 400h195" fill="none" stroke="var(--color-kv, #4c65b6)" stroke-width="1.5"/>
  <text x="752.5" y="371" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="13" font-weight="700" fill="var(--color-ink, #17211f)" text-anchor="middle">注意力状态张量</text>
  </g>
  <path d="M250 116 L340 116" fill="none" stroke="var(--color-control, #66716d)" stroke-width="1.4" marker-end="url(#ownership-boundary-ah-control)"/>
  <path d="M560 116 L650 116" fill="none" stroke="var(--color-control, #66716d)" stroke-width="1.4" marker-end="url(#ownership-boundary-ah-control)"/>
  <path d="M752 147 L752 220 L147 220 L147 147" fill="none" stroke="var(--color-token, #087f73)" stroke-width="1.4" marker-end="url(#ownership-boundary-ah-token)"/>
  <path d="M147 147 L30 147 L30 310 L147 310 L147 335" fill="none" stroke="var(--color-kv, #4c65b6)" stroke-width="1.4" stroke-dasharray="7 5" marker-end="url(#ownership-boundary-ah-kv)"/>
  <path d="M250 367 L340 367" fill="none" stroke="var(--color-kv, #4c65b6)" stroke-width="1.4" marker-end="url(#ownership-boundary-ah-kv)"/>
  <path d="M560 367 L650 367" fill="none" stroke="var(--color-kv, #4c65b6)" stroke-width="1.4" marker-end="url(#ownership-boundary-ah-kv)"/>
  <path d="M855 116 L878 116 L878 367 L855 367" fill="none" stroke="var(--color-kv, #4c65b6)" stroke-width="1.4" marker-start="url(#ownership-boundary-ah-kv)" marker-end="url(#ownership-boundary-ah-kv)"/>
  <rect x="45" y="85" width="205" height="62" rx="8" fill="var(--color-surface-sunken, #ece9df)" stroke="var(--color-ink, #17211f)" stroke-width="1.5"/>
  <text x="147.5" y="112" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="14" font-weight="700" fill="var(--color-ink, #17211f)" text-anchor="middle">Scheduler</text>
  <text x="147.5" y="131" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="13" font-weight="400" fill="var(--color-ink, #17211f)" text-anchor="middle">请求进度与本轮安排</text>
  <rect x="340" y="85" width="220" height="62" rx="8" fill="var(--color-surface-sunken, #ece9df)" stroke="var(--color-ink, #17211f)" stroke-width="1.5"/>
  <text x="450" y="112" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="14" font-weight="700" fill="var(--color-ink, #17211f)" text-anchor="middle">Executor / Worker</text>
  <text x="450" y="131" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="13" font-weight="400" fill="var(--color-ink, #17211f)" text-anchor="middle">下发操作与收集结果</text>
  <rect x="650" y="85" width="205" height="62" rx="8" fill="var(--color-surface-sunken, #ece9df)" stroke="var(--color-ink, #17211f)" stroke-width="1.5"/>
  <text x="752.5" y="112" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="14" font-weight="700" fill="var(--color-ink, #17211f)" text-anchor="middle">Runner</text>
  <text x="752.5" y="131" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="13" font-weight="400" fill="var(--color-ink, #17211f)" text-anchor="middle">批次张量与模型计算</text>
  <rect x="45" y="335" width="205" height="64" rx="8" fill="var(--color-kv, #4c65b6)" stroke="var(--color-ink, #17211f)" stroke-width="1.5"/>
  <text x="147.5" y="363" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="14" font-weight="700" fill="var(--color-ink-inverse, #ffffff)" text-anchor="middle">资源分配记录</text>
  <text x="147.5" y="382" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="13" font-weight="400" fill="var(--color-ink-inverse, #ffffff)" text-anchor="middle">请求 → 可用状态存储</text>
  <rect x="340" y="335" width="220" height="64" rx="8" fill="var(--color-kv, #4c65b6)" stroke="var(--color-ink, #17211f)" stroke-width="1.5"/>
  <text x="450" y="363" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="14" font-weight="700" fill="var(--color-ink-inverse, #ffffff)" text-anchor="middle">执行侧映射</text>
  <text x="450" y="382" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="13" font-weight="400" fill="var(--color-ink-inverse, #ffffff)" text-anchor="middle">块表、槽位与状态索引</text>
  <text x="45" y="35" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="13.5" font-weight="700" fill="var(--color-ink, #17211f)">本轮执行与结果更新</text>
  <text x="450" y="199" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="13.5" font-weight="400" fill="#065f56" text-anchor="middle">请求 ID 与生成结果返回引擎</text>
  <text x="45" y="287" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="13.5" font-weight="700" fill="var(--color-ink, #17211f)">存储分配与实际读写</text>
  <text x="45" y="455" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="13.5" font-weight="400" fill="var(--color-ink, #17211f)">引擎决定资源分配，执行侧建立映射，注意力实现读写张量</text>
  <text x="45" y="510" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="13.5" font-weight="400" fill="var(--color-ink, #17211f)">请求结束 → 更新引用与运行集合 → 后续请求使用可回收资源</text>
  <text x="45" y="558" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="13.5" font-weight="400" fill="var(--color-ink-muted, #66716d)" font-style="italic">KDA 递推状态与稀疏注意力历史采用各自的布局和索引</text>
</svg>
