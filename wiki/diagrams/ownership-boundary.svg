  <text x="40" y="44" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="14" font-weight="700" fill="var(--color-ink, #17211f)">决定算哪些 token · 选择与分配</text>
  <text x="560" y="44" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="14" font-weight="700" fill="var(--color-ink, #17211f)">决定怎么算出来 · 执行</text>
  <text x="40" y="372" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="12.5" font-weight="400" fill="var(--color-ink-muted, #66716d)" font-style="italic">多卡时这条线同时是进程边界；单 NPU 时两边同住一个进程，交接不变</text>
