  <path d="M514 284 L560 217" fill="none" stroke="var(--color-control, #66716d)" stroke-width="1.4" marker-end="url(#ownership-boundary-ah-control)"/>
  <rect x="40" y="70" width="280" height="46" rx="8" fill="var(--color-control, #66716d)" stroke="var(--color-ink, #17211f)" stroke-width="1.5"/>
