  <text x="462" y="38" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="13" font-weight="700" fill="var(--color-ink-muted, #66716d)">vllm-ascend</text>
  <path d="M320 93 L386 284" fill="none" stroke="var(--color-control, #66716d)" stroke-width="1.4" marker-end="url(#ownership-boundary-ah-control)"/>
