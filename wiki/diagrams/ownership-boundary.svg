<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 400" width="900" height="400" role="img" aria-label="界线左边 vLLM 决定「算哪些」，右边昇腾决定「怎么算」；跨过界线的只有一份清单（v0.23.0）">
