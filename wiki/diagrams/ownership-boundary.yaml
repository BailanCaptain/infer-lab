  - { at: [40, 44], text: 决定算哪些 token · 选择与分配, size: 14, strong: true }
  - { at: [560, 44], text: 决定怎么算出来 · 执行, size: 14, strong: true }
  - { at: [40, 372], text: 多卡时这条线同时是进程边界；单 NPU 时两边同住一个进程，交接不变, size: 12.5, note: true }

