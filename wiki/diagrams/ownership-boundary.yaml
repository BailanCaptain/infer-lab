  - { at: [40, 132], size: [280, 46], text: 每条这一步算几个 token, tone: control }
  - { at: [40, 194], size: [280, 46], text: 把 KV 块整块分好, tone: kv }

  - { at: [362, 258], size: [176, 52], text: 清单, sub: 算谁 · 算多少 · 块在哪, tone: control }

  - { at: [560, 70], size: [300, 46], text: 挑哪套注意力实现, tone: control }
  - { at: [560, 132], size: [300, 46], text: 这个 token 落进块里哪一格, tone: kv }
  - { at: [560, 194], size: [300, 46], text: 算子在 NPU 上真的算, tone: weight }

