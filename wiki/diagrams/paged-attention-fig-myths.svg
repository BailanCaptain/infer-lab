<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 480" width="900" height="480" role="img" aria-label="PagedAttention 五大常见误解与源码真相正误对比图" font-family="var(--font-sans)">
  <title>PagedAttention 五大常见误解与源码真相速查：区分消灭外部碎片与有界末块内部碎片、昇腾 refresh_block_size 静默改回 128、算子原地跨块寻址无拼拷、分页存储布局与算子名解耦，以及 free_blocks 只减 ref_cnt 不清零显存。</title>
  <desc>关联源码符号：free_blocks, ref_cnt, free_block_queue, enable_prefix_caching, enable_chunked_prefill, block_size, block_table, npu_fused_infer_attention_score</desc>

  <!-- 开放式顶部分栏标题与中轴虚线 -->
  <text x="218" y="32" text-anchor="middle" font-size="16" font-weight="700" fill="#b54237">✗ 常见直觉误区</text>
  <text x="668" y="32" text-anchor="middle" font-size="16" font-weight="700" fill="#087f73">✓ 源码与硬件真相</text>
  <line x1="16" y1="46" x2="884" y2="46" stroke="#b8bcb5" stroke-width="1.5" stroke-dasharray="6 4"/>
  <line x1="440" y1="14" x2="440" y2="468" stroke="#b8bcb5" stroke-width="1.4" stroke-dasharray="6 4"/>

  <!-- 误解 1 -->
  <circle cx="30" cy="92" r="12" fill="#b54237"/>
  <text x="30" y="96.5" text-anchor="middle" font-size="12.5" font-weight="700" fill="#ffffff">1</text>
  <rect x="50" y="60" width="374" height="64" rx="6" fill="#fff0e9" stroke="#d88c82" stroke-width="1.3"/>
  <text x="64" y="86" font-size="14.5" font-weight="700" fill="#b54237">「用了分页后，KV 显存浪费彻底归零」</text>
  <text x="64" y="110" font-size="13.5" fill="#4d5652">把外部碎片消失误当成完全没有空闲槽位</text>

  <rect x="448" y="60" width="440" height="64" rx="6" fill="#ddf4ef" stroke="#79aaa1" stroke-width="1.3"/>
  <text x="460" y="86" font-size="14.5" font-weight="700" fill="#065f56">消灭的是外部碎片；末块仍有有界内部空余</text>
  <text x="460" y="110" font-size="13.5" fill="#4d5652">单组按位置增长至多空 <tspan font-family="var(--font-mono)" font-weight="700">block_size - 1</tspan> 格（另有投机预留）</text>

  <!-- 误解 2 -->
  <circle cx="30" cy="174" r="12" fill="#b54237"/>
  <text x="30" y="178.5" text-anchor="middle" font-size="12.5" font-weight="700" fill="#ffffff">2</text>
  <rect x="50" y="142" width="374" height="64" rx="6" fill="#fff0e9" stroke="#d88c82" stroke-width="1.3"/>
  <text x="64" y="168" font-size="14.5" font-weight="700" fill="#b54237">「传 --block-size 16 在昇腾一定按 16 切」</text>
  <text x="64" y="192" font-size="13.5" fill="#4d5652">照搬 GPU 参数，以为命令行写了就会保留</text>

  <rect x="448" y="142" width="440" height="64" rx="6" fill="#ddf4ef" stroke="#79aaa1" stroke-width="1.3"/>
  <text x="460" y="168" font-size="14.5" font-weight="700" fill="#065f56">开着默认 APC 或分块预填充即静默改回 128</text>
  <text x="460" y="192" font-size="13.5" fill="#4d5652"><tspan font-family="var(--font-mono)" font-weight="700">enable_prefix_caching</tspan> 或 <tspan font-family="var(--font-mono)" font-weight="700">enable_chunked_prefill</tspan> 均触发</text>

  <!-- 误解 3 -->
  <circle cx="30" cy="256" r="12" fill="#b54237"/>
  <text x="30" y="260.5" text-anchor="middle" font-size="12.5" font-weight="700" fill="#ffffff">3</text>
  <rect x="50" y="224" width="374" height="64" rx="6" fill="#fff0e9" stroke="#d88c82" stroke-width="1.3"/>
  <text x="64" y="250" font-size="14.5" font-weight="700" fill="#b54237">「算注意力前先把离散块拷回连续张量」</text>
  <text x="64" y="274" font-size="13.5" fill="#4d5652">以为算子只认连续内存，每步先做一次拼接</text>

  <rect x="448" y="224" width="440" height="64" rx="6" fill="#ddf4ef" stroke="#79aaa1" stroke-width="1.3"/>
  <text x="460" y="250" font-size="14.5" font-weight="700" fill="#065f56">零拼拷！注意力内核拿块表原地跨块读取</text>
  <text x="460" y="274" font-size="13.5" fill="#4d5652">每步拼回连续缓冲区等于重拷整段历史，分页即失效</text>

  <!-- 误解 4 -->
  <circle cx="30" cy="338" r="12" fill="#b54237"/>
  <text x="30" y="342.5" text-anchor="middle" font-size="12.5" font-weight="700" fill="#ffffff">4</text>
  <rect x="50" y="306" width="374" height="64" rx="6" fill="#fff0e9" stroke="#d88c82" stroke-width="1.3"/>
  <text x="64" y="332" font-size="14.5" font-weight="700" fill="#b54237">「没调同名 PagedAttention 算子就没分页」</text>
  <text x="64" y="356" font-size="13.5" fill="#4d5652">将存储寻址机制与特定算子名字混为一谈</text>

  <rect x="448" y="306" width="440" height="64" rx="6" fill="#ddf4ef" stroke="#79aaa1" stroke-width="1.3"/>
  <text x="460" y="332" font-size="14.5" font-weight="700" fill="#065f56">分页是缓存布局；FIA / SFA 原生消费块表</text>
  <text x="460" y="356" font-size="13.5" fill="#4d5652">常规向 <tspan font-family="var(--font-mono)" font-weight="700">npu_fused_infer_attention_score</tspan> 传块表</text>

  <!-- 误解 5 -->
  <circle cx="30" cy="420" r="12" fill="#b54237"/>
  <text x="30" y="424.5" text-anchor="middle" font-size="12.5" font-weight="700" fill="#ffffff">5</text>
  <rect x="50" y="388" width="374" height="64" rx="6" fill="#fff0e9" stroke="#d88c82" stroke-width="1.3"/>
  <text x="64" y="414" font-size="14.5" font-weight="700" fill="#b54237">「请求结束时物理块的 KV 数据立刻清零」</text>
  <text x="64" y="438" font-size="13.5" fill="#4d5652">以为归还块号就会把对应 HBM 显存刷成 0</text>

  <rect x="448" y="388" width="440" height="64" rx="6" fill="#ddf4ef" stroke="#79aaa1" stroke-width="1.3"/>
  <text x="460" y="414" font-size="14.5" font-weight="700" fill="#065f56"><tspan font-family="var(--font-mono)">free_blocks</tspan> 只减 <tspan font-family="var(--font-mono)">ref_cnt</tspan>，HBM 数据原地保留</text>
  <text x="460" y="438" font-size="13.5" fill="#4d5652">挂回 <tspan font-family="var(--font-mono)" font-weight="700">free_block_queue</tspan> 队尾作 LRU 候选，直等前缀命中</text>
</svg>
