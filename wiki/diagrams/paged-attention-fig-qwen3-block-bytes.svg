<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 545" width="900" height="545" role="img" aria-label="Qwen3-8B 与 Qwen3-30B-A3B 单块字节构成比例与昇腾 block_size 对齐权衡图" font-family="var(--font-sans)">
  <title>Qwen3-8B 与 Qwen3-30B-A3B 在昇腾默认 block_size = 128（BF16）下的单块字节构成比例及块大小选型权衡：30B-A3B 虽有 48 层，但 KV 头减半（8→4）使整块全层显存从 18 MiB 降至 12 MiB；下半幅对照 16 / 128 / 512 在昇腾 refresh_block_size 下的对齐与覆写规则。</title>
  <desc>关联源码符号：AttentionSpec, num_kv_heads, head_size, page_size_bytes, get_kv_cache_shape, get_supported_kernel_block_sizes, A5_C8_MXFP_KV_CACHE_BLOCK_SIZE, refresh_block_size</desc>

  <!-- 开放式分界虚线 -->
  <line x1="450" y1="14" x2="450" y2="294" stroke="#b8bcb5" stroke-width="1.5" stroke-dasharray="6 4"/>
  <line x1="16" y1="308" x2="884" y2="308" stroke="#b8bcb5" stroke-width="1.5" stroke-dasharray="6 4"/>

  <!-- 左上：Qwen3-8B 单块解剖 -->
  <text x="18" y="34" font-size="16" font-weight="700" fill="#17211f">Qwen3-8B · 稠密 GQA（36 层 · 8 KV 头）</text>
  <text x="18" y="64" font-size="13.5" fill="#4d5652">① 1 token 单层：<tspan font-family="var(--font-mono)" font-weight="700" fill="#3a4f93">2(K,V) × 8 × 128 × 2B = 4 KiB</tspan>（全层 144 KiB）</text>

  <text x="18" y="98" font-size="13.5" font-weight="700" fill="#17211f">② 单层 1 块（<tspan font-family="var(--font-mono)">page_size_bytes</tspan>，128 tok）：</text>
  <rect x="18" y="110" width="256" height="30" rx="5" fill="#e8edff" stroke="#4c65b6" stroke-width="1.4"/>
  <text x="146" y="130" text-anchor="middle" font-size="13.5" font-family="var(--font-mono)" font-weight="700" fill="#3a4f93">128 × 4 KiB = 512 KiB / 层</text>

  <text x="18" y="168" font-size="13.5" font-weight="700" fill="#17211f">③ 全模型 36 层 × 1 块（1:1 真实面积比例）：</text>
  <rect x="18" y="180" width="360" height="44" rx="6" fill="#4c65b6" stroke="#3a4f93" stroke-width="1.4"/>
  <text x="198" y="207" text-anchor="middle" font-size="15" font-weight="700" fill="#ffffff">18 MiB / 块（512 KiB × 36 层）</text>

  <text x="18" y="252" font-size="13.5" font-family="var(--font-mono)" fill="#4d5652">shape: (2, num_blocks, 128, 8, 128)</text>
  <text x="18" y="278" font-size="13.5" font-weight="700" fill="#3a4f93">10 GiB 预算：567 可借块（72,576 tok）</text>

  <!-- 右上：Qwen3-30B-A3B 单块解剖 -->
  <text x="466" y="34" font-size="16" font-weight="700" fill="#936300">Qwen3-30B-A3B · 稀疏 MoE（48 层 · 4 KV 头）</text>
  <text x="466" y="64" font-size="13.5" fill="#4d5652">① 1 token 单层：<tspan font-family="var(--font-mono)" font-weight="700" fill="#065f56">2(K,V) × 4 × 128 × 2B = 2 KiB</tspan>（全层 96 KiB）</text>

  <text x="466" y="98" font-size="13.5" font-weight="700" fill="#17211f">② 单层 1 块（KV 头减半，单层页宽减半）：</text>
  <rect x="466" y="110" width="256" height="30" rx="5" fill="#ece9df"/>
  <rect x="466" y="110" width="128" height="30" rx="5" fill="#ddf4ef" stroke="#087f73" stroke-width="1.4"/>
  <text x="530" y="130" text-anchor="middle" font-size="13.5" font-family="var(--font-mono)" font-weight="700" fill="#065f56">256 KiB</text>
  <text x="610" y="130" font-size="13.5" fill="#66716d">仅为 8B 单层的 1/2</text>

  <text x="466" y="168" font-size="13.5" font-weight="700" fill="#17211f">③ 全模型 48 层 × 1 块（层数 +1/3，总块仍省 1/3）：</text>
  <rect x="466" y="180" width="360" height="44" rx="6" fill="#d8d8cf"/>
  <rect x="466" y="180" width="240" height="44" rx="6" fill="#087f73" stroke="#065f56" stroke-width="1.4"/>
  <text x="586" y="207" text-anchor="middle" font-size="15" font-weight="700" fill="#ffffff">12 MiB / 块（48 层）</text>
  <text x="720" y="207" font-size="14" font-weight="700" fill="#087f73">省 6 MiB！</text>

  <text x="466" y="252" font-size="13.5" font-family="var(--font-mono)" fill="#4d5652">shape: (2, num_blocks, 128, 4, 128)</text>
  <text x="466" y="278" font-size="13.5" font-weight="700" fill="#065f56">10 GiB 预算：852 可借块（109,056 tok，+50%）</text>

  <!-- 下半幅：block_size 粒度权衡与昇腾对齐护栏 -->
  <text x="18" y="340" font-size="16" font-weight="700" fill="#17211f">昇腾 block_size 三档粒度权衡与 refresh_block_size 对齐护栏</text>

  <!-- 档位 1：16 -->
  <rect x="18" y="362" width="272" height="44" rx="6" fill="#fff0e9" stroke="#b54237" stroke-width="1.4"/>
  <text x="154" y="390" text-anchor="middle" font-size="14.5" font-weight="700" fill="#b54237">细粒度：16（GPU 默认值）</text>
  <line x1="20" y1="418" x2="20" y2="528" stroke="#b54237" stroke-width="3"/>
  <text x="32" y="436" font-size="13.5" fill="#4d5652">利：末块最多仅空 15 个槽位</text>
  <text x="32" y="462" font-size="13.5" fill="#4d5652">弊：块表宽 8 倍，打碎 NPU 连续访存</text>
  <text x="32" y="490" font-size="13.5" font-weight="700" fill="#b54237">昇腾行为：开 APC 或分块预填充时</text>
  <text x="32" y="516" font-size="13.5" font-weight="700" fill="#b54237">被静默重置回 128！</text>

  <!-- 档位 2：128 -->
  <rect x="314" y="362" width="272" height="44" rx="6" fill="#ddf4ef" stroke="#087f73" stroke-width="1.6"/>
  <text x="450" y="390" text-anchor="middle" font-size="14.5" font-weight="700" fill="#065f56">昇腾标准甜点：128（NPU 默认）</text>
  <line x1="316" y1="418" x2="316" y2="528" stroke="#087f73" stroke-width="3"/>
  <text x="328" y="436" font-size="13.5" fill="#4d5652">契合 <tspan font-family="var(--font-mono)" font-weight="700">AscendAttentionBackend</tspan> 内核页</text>
  <text x="328" y="462" font-size="13.5" fill="#4d5652">对齐 NPU <tspan font-family="var(--font-mono)" font-weight="700">NZ</tspan> 分形与突发 DMA 搬运</text>
  <text x="328" y="490" font-size="13.5" fill="#065f56">满足 <tspan font-family="var(--font-mono)" font-weight="700">C8 INT8</tspan> 的 32 倍数断言</text>
  <text x="328" y="516" font-size="13.5" font-weight="700" fill="#087f73">末块浪费上限：127 tok / 请求</text>

  <!-- 档位 3：512 -->
  <rect x="610" y="362" width="272" height="44" rx="6" fill="#fff4cf" stroke="#c78300" stroke-width="1.4"/>
  <text x="746" y="390" text-anchor="middle" font-size="14.5" font-weight="700" fill="#936300">粗粒度：512（C8_MXFP 专用）</text>
  <line x1="612" y1="418" x2="612" y2="528" stroke="#c78300" stroke-width="3"/>
  <text x="624" y="436" font-size="13.5" fill="#4d5652">触发：<tspan font-family="var(--font-mono)" font-weight="700">--kv-cache-dtype mxfp8</tspan></text>
  <text x="624" y="462" font-size="13.5" fill="#4d5652">QFA 内核硬性要求 512-tok 整页</text>
  <text x="624" y="490" font-size="13.5" font-weight="700" fill="#936300">未传参自动抬升至 512；显式错传</text>
  <text x="624" y="516" font-size="13.5" font-weight="700" fill="#b54237">非 512 倍数直接抛 ValueError</text>
</svg>
