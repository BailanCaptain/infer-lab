  - { at: [459, 92], size: [120, 56], text: 请求 B, tone: kv, style: faded }
  - { at: [594, 92], size: [120, 56], text: 空闲, style: plain }
  - { at: [729, 92], size: [120, 56], text: 空闲, style: plain }

texts:
