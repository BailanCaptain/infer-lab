  - { at: [54, 200], text: 请求 B 写满了第一块才拿到第二块，两块中间隔着别人, size: 12.5, note: true }
  - { at: [54, 252], text: 放大「这条请求」的那一块, size: 13.5, strong: true }
  - { at: [54, 356], text: 237 个 token 一块就装下；空着的 1811 个位置别的请求拿不走, size: 12.5 }

