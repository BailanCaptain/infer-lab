<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 480" width="900" height="480" role="img" aria-label="enable_force_eplb 路由覆写机制与跨 rank 偏斜示意" font-family="var(--font-sans)">
  <title>enable_force_eplb 与 EPLB 区别及轮转映射边界</title>
  <desc>Left: Comparison of real EPLB weight migration versus enable_force_eplb overwriting topk_ids after log2phy while keeping topk_weights. Right: Round-robin arithmetic example [[6,3],[7,0]] and EP4 cross-rank skew [4,4,4,0].</desc>
  <defs>
    <marker id="fe-arr-teal" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="#087f73"/>
    </marker>
    <marker id="fe-arr-red" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="#b54237"/>
    </marker>
    <marker id="fe-arr-amber" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="#c78300"/>
    </marker>
  </defs>

  <!-- Vertical split -->
  <line x1="448" y1="14" x2="448" y2="466" stroke="#b8bcb5" stroke-width="1.5" stroke-dasharray="6 4"/>

  <!-- LEFT HALF: EPLB vs enable_force_eplb -->
  <text x="16" y="28" font-size="16" font-weight="700" fill="#17211f">A. 改的对象完全不同：搬权重 vs 覆写路由</text>
  <text x="16" y="50" font-size="13.5" fill="#66716d">名字虽带 EPLB，实为只测带宽上限的压测夹具</text>

  <!-- Real EPLB strip -->
  <text x="16" y="82" font-size="14.5" font-weight="700" fill="#065f56">✓ 正常 EPLB（保精度）</text>
  <rect x="16" y="92" width="126" height="54" rx="6" fill="#ddf4ef" stroke="#087f73" stroke-width="1.3"/>
  <text x="79" y="114" text-anchor="middle" font-size="14" font-weight="700" fill="#065f56">真实 Router</text>
  <text x="79" y="135" text-anchor="middle" font-size="13.5" fill="#4d5652">topk_ids + 权重</text>

  <line x1="144" y1="119" x2="168" y2="119" stroke="#087f73" stroke-width="1.7" marker-end="url(#fe-arr-teal)"/>

  <rect x="172" y="92" width="118" height="54" rx="6" fill="#e8edff" stroke="#4c65b6" stroke-width="1.3"/>
  <text x="231" y="114" text-anchor="middle" font-size="14" font-weight="700" fill="#3a4f93">log2phy 查表</text>
  <text x="231" y="135" text-anchor="middle" font-size="13.5" fill="#4d5652">搬专家权重位置</text>

  <line x1="292" y1="119" x2="316" y2="119" stroke="#087f73" stroke-width="1.7" marker-end="url(#fe-arr-teal)"/>

  <rect x="320" y="92" width="112" height="54" rx="6" fill="#ddf4ef" stroke="#087f73" stroke-width="1.3"/>
  <text x="376" y="114" text-anchor="middle" font-size="14" font-weight="700" fill="#065f56">数值等价</text>
  <text x="376" y="135" text-anchor="middle" font-size="13.5" fill="#065f56">权重配对正确</text>

  <!-- Force EPLB strip -->
  <text x="16" y="180" font-size="14.5" font-weight="700" fill="#8f3229">✗ enable_force_eplb=true（精度失效）</text>

  <rect x="16" y="190" width="126" height="72" rx="6" fill="#ece9df" stroke="#b8bcb5" stroke-width="1.3"/>
  <text x="79" y="212" text-anchor="middle" font-size="14" font-weight="700" fill="#17211f">log2phy 后</text>
  <text x="79" y="234" text-anchor="middle" font-size="13" fill="#4d5652">含 mix_placement</text>
  <text x="79" y="254" text-anchor="middle" font-size="13" fill="#66716d">共享专家末列</text>

  <line x1="144" y1="226" x2="168" y2="226" stroke="#b54237" stroke-width="1.7" marker-end="url(#fe-arr-red)"/>

  <rect x="172" y="190" width="136" height="72" rx="6" fill="#fff0e9" stroke="#b54237" stroke-width="1.5"/>
  <text x="240" y="212" text-anchor="middle" font-size="14" font-weight="700" fill="#8f3229">整表覆写 topk_ids</text>
  <text x="240" y="234" text-anchor="middle" font-size="13" fill="#4d5652">仅 0..N_logical-1</text>
  <text x="240" y="254" text-anchor="middle" font-size="12.5" font-weight="700" fill="#8f3229">保留原 topk_weights</text>

  <line x1="310" y1="226" x2="330" y2="226" stroke="#b54237" stroke-width="1.7" marker-end="url(#fe-arr-red)"/>

  <rect x="334" y="190" width="98" height="72" rx="6" fill="#fff0e9" stroke="#b54237" stroke-width="1.5"/>
  <text x="383" y="220" text-anchor="middle" font-size="14" font-weight="700" fill="#8f3229">输出失真</text>
  <text x="383" y="244" text-anchor="middle" font-size="13.5" fill="#8f3229">严禁生产</text>

  <!-- Priority & Mutex callouts -->
  <line x1="16" y1="276" x2="432" y2="276" stroke="#d8d8cf" stroke-width="1.2"/>
  <text x="16" y="298" font-size="14.5" font-weight="700" fill="#17211f">执行优先级与硬互斥边界</text>

  <rect x="16" y="310" width="416" height="60" rx="6" fill="#fff4cf" stroke="#c78300" stroke-width="1.3"/>
  <text x="28" y="334" font-size="14" font-weight="700" fill="#936300">① 排在 elif enable_force_load_balance 之前</text>
  <text x="28" y="357" font-size="13.5" fill="#4d5652">连 profile / dummy run 的随机均衡也会被它直接覆盖</text>

  <rect x="16" y="380" width="416" height="88" rx="6" fill="#fff0e9" stroke="#b54237" stroke-width="1.3"/>
  <text x="28" y="402" font-size="14" font-weight="700" fill="#8f3229">② 四条件同时成立 → 抛 ValueError</text>
  <text x="28" y="423" font-size="13" font-family="var(--font-mono)" fill="#4d5652">enable_force_eplb ∧ dynamic_eplb</text>
  <text x="28" y="441" font-size="13" font-family="var(--font-mono)" fill="#4d5652">∧ model_config ≠ None ∧ is_moe</text>
  <text x="28" y="460" font-size="12.5" fill="#66716d">注：静态摆放与冗余专家不触发互斥，但编号不对齐物理位</text>

  <!-- RIGHT HALF: Single-table vs Cross-rank skew -->
  <text x="468" y="28" font-size="16" font-weight="700" fill="#17211f">B. 单表均匀 ≠ 跨 rank 合计均匀（示意）</text>
  <text x="468" y="50" font-size="13.5" fill="#66716d">cursor = arange(T·k) + T·k·ep_rank + ep_rank</text>

  <!-- Example 1: Single table 8 experts, EP2, rank 1 -->
  <text x="464" y="82" font-size="13.5" font-weight="700" fill="#065f56">例 1 · 单张表内均分：8 专家 / EP2 / rank 1 / 2 token / top_k=2</text>

  <!-- 2x2 grid for [[6,3],[7,0]] -->
  <rect x="468" y="94" width="84" height="44" rx="5" fill="#f7e7f2" stroke="#9a4b86" stroke-width="1.3"/>
  <text x="510" y="112" text-anchor="middle" font-size="14" font-weight="700" fill="#7a3a6a">E6</text>
  <text x="510" y="132" text-anchor="middle" font-size="13" fill="#4d5652">→ R1</text>

  <rect x="558" y="94" width="84" height="44" rx="5" fill="#ddf4ef" stroke="#087f73" stroke-width="1.3"/>
  <text x="600" y="112" text-anchor="middle" font-size="14" font-weight="700" fill="#065f56">E3</text>
  <text x="600" y="132" text-anchor="middle" font-size="13" fill="#4d5652">→ R0</text>

  <rect x="468" y="144" width="84" height="44" rx="5" fill="#f7e7f2" stroke="#9a4b86" stroke-width="1.3"/>
  <text x="510" y="162" text-anchor="middle" font-size="14" font-weight="700" fill="#7a3a6a">E7</text>
  <text x="510" y="182" text-anchor="middle" font-size="13" fill="#4d5652">→ R1</text>

  <rect x="558" y="144" width="84" height="44" rx="5" fill="#ddf4ef" stroke="#087f73" stroke-width="1.3"/>
  <text x="600" y="162" text-anchor="middle" font-size="14" font-weight="700" fill="#065f56">E0</text>
  <text x="600" y="182" text-anchor="middle" font-size="13" fill="#4d5652">→ R0</text>

  <!-- Summary of Ex 1 -->
  <text x="660" y="112" font-size="14" font-weight="700" fill="#17211f">token 0 → [6, 3]</text>
  <text x="660" y="134" font-size="14" font-weight="700" fill="#17211f">token 1 → [7, 0]</text>
  <text x="660" y="160" font-size="13.5" fill="#065f56">R0 收 2 槽，R1 收 2 槽</text>
  <text x="660" y="180" font-size="13.5" fill="#66716d">其余 4 个专家为 0 槽</text>

  <!-- Divider -->
  <line x1="468" y1="208" x2="884" y2="208" stroke="#d8d8cf" stroke-width="1.2"/>

  <!-- Example 2: Cross-rank skew [4, 4, 4, 0] -->
  <text x="464" y="234" font-size="13.5" font-weight="700" fill="#8f3229">例 2 · 跨 rank 叠加陷阱：8 专家 / EP4 / 每卡 1 token / top_k=3</text>
  <text x="468" y="256" font-size="13.5" fill="#4d5652">起点 0, 4, 8, 12 取模重合：R0/R2 均发 [0,2,4]，R1/R3 均发 [1,3,5]</text>

  <!-- Bar chart of target rank totals [4, 4, 4, 0] -->
  <text x="468" y="290" font-size="13.5" font-weight="700" fill="#17211f">目标 R0 (E0,E1)</text>
  <rect x="610" y="274" width="212" height="22" rx="4" fill="#c78300"/>
  <text x="832" y="290" font-size="14" font-weight="700" fill="#936300">4 槽</text>

  <text x="468" y="322" font-size="13.5" font-weight="700" fill="#17211f">目标 R1 (E2,E3)</text>
  <rect x="610" y="306" width="212" height="22" rx="4" fill="#c78300"/>
  <text x="832" y="322" font-size="14" font-weight="700" fill="#936300">4 槽</text>

  <text x="468" y="354" font-size="13.5" font-weight="700" fill="#17211f">目标 R2 (E4,E5)</text>
  <rect x="610" y="338" width="212" height="22" rx="4" fill="#c78300"/>
  <text x="832" y="354" font-size="14" font-weight="700" fill="#936300">4 槽</text>

  <text x="468" y="386" font-size="13.5" font-weight="700" fill="#8f3229">目标 R3 (E6,E7)</text>
  <rect x="610" y="370" width="12" height="22" rx="4" fill="#fff0e9" stroke="#b54237" stroke-width="1.4" stroke-dasharray="3 2"/>
  <text x="634" y="386" font-size="14" font-weight="700" fill="#8f3229">0 槽（完全空闲！）</text>

  <!-- Takeaway strip -->
  <rect x="468" y="408" width="416" height="56" rx="6" fill="#ece9df" stroke="#b8bcb5" stroke-width="1.3"/>
  <text x="480" y="432" font-size="14" font-weight="700" fill="#17211f">结论：单张表各卡最多差 1，但多张表累加可叠出 [4,4,4,0]</text>
  <text x="480" y="453" font-size="13.5" fill="#4d5652">压测前须核对 (T·k, ep_size) 与跨 rank 合计，勿假定自动均分</text>
</svg>
