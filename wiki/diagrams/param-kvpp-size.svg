<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 520" width="900" height="520" role="img" aria-label="kvpp_config.size 空间分层映射（10 层 TP=2 PCP=2 示意）与 2 块 scratch 缓冲导致的容量天花板比例图" font-family="var(--font-sans)">
  <title>kvpp_config.size：TP×PCP 连续分段、余数瓶颈与 2 块 Scratch 天花板</title>
  <desc>Spatial layout of 10 MLA layers partitioned across TP=2 x PCP=2 (size=4) using divmod(10, 4)=(2,2) plus 2 fixed scratch buffers, showing bottleneck on heaviest rank and L/3 scaling ceiling for a 60-layer illustrative model.</desc>

  <!-- Band 1: 10-layer TP=2, PCP=2 ownership grid -->
  <text x="16" y="26" font-size="16" font-weight="700" fill="#17211f">① 示意：10 层非混合 MLA（无 MTP，TP=2 × PCP=2 ⇒ size=4）连续分段与 2 块 Scratch</text>
  <text x="16" y="46" font-size="13.5" fill="#66716d">divmod(10, 4) = (2, 2)：前 2 个 rank 多拿 1 层；v0.30.0 / main 用 kvpp_rank = pcp_rank × TP + tp_rank 防 PCP 撞号</text>

  <!-- Column headers -->
  <text x="26" y="76" font-size="13.5" font-weight="700" fill="#17211f">卡号与组内编号</text>
  <text x="236" y="76" font-size="13.5" font-weight="700" fill="#065f56">常驻层（连续切段）</text>
  <text x="540" y="76" font-size="13.5" font-weight="700" fill="#936300">+ 写死 2 块 Scratch</text>
  <text x="880" y="76" text-anchor="end" font-size="13.5" font-weight="700" fill="#17211f">物理层数</text>

  <!-- Rank 0: (0,0) -> L0 L1 L2 + S0 S1 = 5 -->
  <text x="26" y="109" font-size="13.5" font-weight="700" fill="#17211f">rank 0</text>
  <text x="82" y="109" font-size="13.5" font-family="var(--font-mono)" fill="#4d5652">(pcp0, tp0)</text>
  <rect x="236" y="88" width="88" height="30" rx="5" fill="#ddf4ef" stroke="#087f73" stroke-width="1.4"/>
  <text x="280" y="108" text-anchor="middle" font-size="13.5" font-weight="700" fill="#065f56">L0</text>
  <rect x="330" y="88" width="88" height="30" rx="5" fill="#ddf4ef" stroke="#087f73" stroke-width="1.4"/>
  <text x="374" y="108" text-anchor="middle" font-size="13.5" font-weight="700" fill="#065f56">L1</text>
  <rect x="424" y="88" width="88" height="30" rx="5" fill="#ddf4ef" stroke="#087f73" stroke-width="1.4"/>
  <text x="468" y="108" text-anchor="middle" font-size="13.5" font-weight="700" fill="#065f56">L2 (+余1)</text>
  <rect x="540" y="88" width="110" height="30" rx="5" fill="#fff4cf" stroke="#c78300" stroke-width="1.4"/>
  <text x="595" y="108" text-anchor="middle" font-size="13.5" font-weight="700" fill="#936300">当前层 S0</text>
  <rect x="656" y="88" width="110" height="30" rx="5" fill="#fff4cf" stroke="#c78300" stroke-width="1.4"/>
  <text x="711" y="108" text-anchor="middle" font-size="13.5" font-weight="700" fill="#936300">预取层 S1</text>
  <rect x="786" y="88" width="98" height="30" rx="5" fill="#fff0e9" stroke="#b54237" stroke-width="1.4"/>
  <text x="835" y="108" text-anchor="middle" font-size="13.5" font-weight="700" fill="#8f3229">5 层（瓶颈）</text>

  <!-- Rank 1: (0,1) -> L3 L4 L5 + S0 S1 = 5 -->
  <text x="26" y="147" font-size="13.5" font-weight="700" fill="#17211f">rank 1</text>
  <text x="82" y="147" font-size="13.5" font-family="var(--font-mono)" fill="#4d5652">(pcp0, tp1)</text>
  <rect x="236" y="126" width="88" height="30" rx="5" fill="#ddf4ef" stroke="#087f73" stroke-width="1.4"/>
  <text x="280" y="146" text-anchor="middle" font-size="13.5" font-weight="700" fill="#065f56">L3</text>
  <rect x="330" y="126" width="88" height="30" rx="5" fill="#ddf4ef" stroke="#087f73" stroke-width="1.4"/>
  <text x="374" y="146" text-anchor="middle" font-size="13.5" font-weight="700" fill="#065f56">L4</text>
  <rect x="424" y="126" width="88" height="30" rx="5" fill="#ddf4ef" stroke="#087f73" stroke-width="1.4"/>
  <text x="468" y="146" text-anchor="middle" font-size="13.5" font-weight="700" fill="#065f56">L5 (+余1)</text>
  <rect x="540" y="126" width="110" height="30" rx="5" fill="#fff4cf" stroke="#c78300" stroke-width="1.4"/>
  <text x="595" y="146" text-anchor="middle" font-size="13.5" font-weight="700" fill="#936300">当前层 S0</text>
  <rect x="656" y="126" width="110" height="30" rx="5" fill="#fff4cf" stroke="#c78300" stroke-width="1.4"/>
  <text x="711" y="146" text-anchor="middle" font-size="13.5" font-weight="700" fill="#936300">预取层 S1</text>
  <rect x="786" y="126" width="98" height="30" rx="5" fill="#fff0e9" stroke="#b54237" stroke-width="1.4"/>
  <text x="835" y="146" text-anchor="middle" font-size="13.5" font-weight="700" fill="#8f3229">5 层（瓶颈）</text>

  <!-- Rank 2: (1,0) -> L6 L7 + S0 S1 = 4 -->
  <text x="26" y="185" font-size="13.5" font-weight="700" fill="#17211f">rank 2</text>
  <text x="82" y="185" font-size="13.5" font-family="var(--font-mono)" fill="#4d5652">(pcp1, tp0)</text>
  <rect x="236" y="164" width="88" height="30" rx="5" fill="#e8edff" stroke="#4c65b6" stroke-width="1.3"/>
  <text x="280" y="184" text-anchor="middle" font-size="13.5" font-weight="700" fill="#3a4f93">L6</text>
  <rect x="330" y="164" width="88" height="30" rx="5" fill="#e8edff" stroke="#4c65b6" stroke-width="1.3"/>
  <text x="374" y="184" text-anchor="middle" font-size="13.5" font-weight="700" fill="#3a4f93">L7</text>
  <rect x="424" y="164" width="88" height="30" rx="5" fill="#fbfaf6" stroke="#d8d8cf" stroke-width="1.2" stroke-dasharray="4 3"/>
  <text x="468" y="184" text-anchor="middle" font-size="13.5" fill="#66716d">—</text>
  <rect x="540" y="164" width="110" height="30" rx="5" fill="#fff4cf" stroke="#c78300" stroke-width="1.4"/>
  <text x="595" y="184" text-anchor="middle" font-size="13.5" font-weight="700" fill="#936300">当前层 S0</text>
  <rect x="656" y="164" width="110" height="30" rx="5" fill="#fff4cf" stroke="#c78300" stroke-width="1.4"/>
  <text x="711" y="184" text-anchor="middle" font-size="13.5" font-weight="700" fill="#936300">预取层 S1</text>
  <rect x="786" y="164" width="98" height="30" rx="5" fill="#ece9df" stroke="#b8bcb5" stroke-width="1.2"/>
  <text x="835" y="184" text-anchor="middle" font-size="13.5" fill="#17211f">4 层</text>

  <!-- Rank 3: (1,1) -> L8 L9 + S0 S1 = 4 -->
  <text x="26" y="223" font-size="13.5" font-weight="700" fill="#17211f">rank 3</text>
  <text x="82" y="223" font-size="13.5" font-family="var(--font-mono)" fill="#4d5652">(pcp1, tp1)</text>
  <rect x="236" y="202" width="88" height="30" rx="5" fill="#e8edff" stroke="#4c65b6" stroke-width="1.3"/>
  <text x="280" y="222" text-anchor="middle" font-size="13.5" font-weight="700" fill="#3a4f93">L8</text>
  <rect x="330" y="202" width="88" height="30" rx="5" fill="#e8edff" stroke="#4c65b6" stroke-width="1.3"/>
  <text x="374" y="222" text-anchor="middle" font-size="13.5" font-weight="700" fill="#3a4f93">L9</text>
  <rect x="424" y="202" width="88" height="30" rx="5" fill="#fbfaf6" stroke="#d8d8cf" stroke-width="1.2" stroke-dasharray="4 3"/>
  <text x="468" y="222" text-anchor="middle" font-size="13.5" fill="#66716d">—</text>
  <rect x="540" y="202" width="110" height="30" rx="5" fill="#fff4cf" stroke="#c78300" stroke-width="1.4"/>
  <text x="595" y="222" text-anchor="middle" font-size="13.5" font-weight="700" fill="#936300">当前层 S0</text>
  <rect x="656" y="202" width="110" height="30" rx="5" fill="#fff4cf" stroke="#c78300" stroke-width="1.4"/>
  <text x="711" y="222" text-anchor="middle" font-size="13.5" font-weight="700" fill="#936300">预取层 S1</text>
  <rect x="786" y="202" width="98" height="30" rx="5" fill="#ece9df" stroke="#b8bcb5" stroke-width="1.2"/>
  <text x="835" y="222" text-anchor="middle" font-size="13.5" fill="#17211f">4 层</text>

  <!-- Bottleneck formula bar -->
  <rect x="16" y="244" width="868" height="36" rx="6" fill="#ece9df" stroke="#b8bcb5" stroke-width="1.2"/>
  <text x="450" y="267" text-anchor="middle" font-size="14" font-weight="700" fill="#17211f">全组块数取各卡最小值 ⇒ 由最重卡（5 层）决定，10 层放大比 = 10 / (3 + 2) = 2×（而非卡数 4×）；MTP 另每卡全留</text>

  <line x1="16" y1="296" x2="884" y2="296" stroke="#d8d8cf" stroke-width="1.3" stroke-dasharray="6 4"/>

  <!-- Band 2: Proportional Scaling Bars for 60-layer model (20x ceiling) -->
  <text x="16" y="322" font-size="16" font-weight="700" fill="#17211f">② 60 层简化算例：写死的 2 块 Scratch 把容量放大倍数封顶在 L / 3 = 20×</text>
  <text x="16" y="342" font-size="13.5" fill="#66716d">每块物理层数 = ceil(60 / size) + 2；右侧为相对 size=1（60 层）的理论容量比（各层等大、无 MTP 简化口径）</text>

  <!-- Max bar width = 560px representing 20x (28px per 1x) -->
  <!-- size=1: 1x -> 28px -->
  <text x="16" y="376" font-size="13.5" font-weight="700" fill="#17211f">size = 1（关闭）</text>
  <rect x="196" y="358" width="28" height="24" rx="4" fill="#ece9df" stroke="#8a928f" stroke-width="1.2"/>
  <text x="234" y="375" font-size="13.5" fill="#4d5652">1.0×（60 常驻 + 0 scratch）</text>

  <!-- size=8: 60/(8+2)=6x -> 168px -->
  <text x="16" y="410" font-size="13.5" font-weight="700" fill="#3a4f93">size = 8（TP8）</text>
  <rect x="196" y="392" width="168" height="24" rx="4" fill="#e8edff" stroke="#4c65b6" stroke-width="1.3"/>
  <text x="374" y="409" font-size="13.5" font-weight="700" fill="#3a4f93">6.0×（ceil(60/8)=8 常驻 + 2 scratch = 10 层）</text>

  <!-- size=16: 60/(4+2)=10x -> 280px -->
  <text x="16" y="444" font-size="13.5" font-weight="700" fill="#065f56">size = 16（TP16）</text>
  <rect x="196" y="426" width="280" height="24" rx="4" fill="#ddf4ef" stroke="#087f73" stroke-width="1.4"/>
  <text x="486" y="443" font-size="13.5" font-weight="700" fill="#065f56">10.0×（ceil(60/16)=4 常驻 + 2 scratch = 6 层）</text>

  <!-- size>=60: 60/(1+2)=20x -> 560px (ceiling line at x=756) -->
  <text x="16" y="478" font-size="13.5" font-weight="700" fill="#936300">size ≥ 60（极限）</text>
  <rect x="196" y="460" width="560" height="24" rx="4" fill="#fff4cf" stroke="#c78300" stroke-width="1.5"/>
  <text x="476" y="477" text-anchor="middle" font-size="13.5" font-weight="700" fill="#936300">封顶 20.0×（1 常驻 + 2 scratch = 3 层）</text>

  <!-- Vertical ceiling line -->
  <line x1="756" y1="354" x2="756" y2="496" stroke="#b54237" stroke-width="1.8" stroke-dasharray="5 3"/>
  <text x="764" y="380" font-size="13.5" font-weight="700" fill="#8f3229">L / 3 天花板</text>
  <text x="764" y="400" font-size="13.5" fill="#8f3229">（卡数再多</text>
  <text x="764" y="420" font-size="13.5" fill="#8f3229">也跨不过）</text>

  <text x="16" y="508" font-size="13.5" fill="#66716d">注：写入 additional_config.kvpp_config.size 会被工厂函数剔除；有效入口仅 enable_kvpp，且要求非 hybrid MLA（GLM-5.3-Flash 不适用）。</text>
</svg>
