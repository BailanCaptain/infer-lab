<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 460" width="900" height="460" role="img" aria-label="load_window_bins 顺序分箱压缩：均值守恒、方差归零与均衡度反向下降反例" font-family="var(--font-sans)">
  <title>load_window_bins 分段压缩后的守恒量与反直觉变化</title>
  <desc>Top: 5-step example compressed into 2 bins preserving exact weighted global mean (A=4, B=6) while collapsing variance and covariance to 0. Bottom: 4-step example (1000,0),(1,1),(1,1),(1,1) showing balance dropping from 0.800 at 4 bins to 0.667 at 2 bins.</desc>
  <defs>
    <marker id="lb-arr-indigo" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="#4c65b6"/>
    </marker>
    <marker id="lb-arr-red" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="#b54237"/>
    </marker>
  </defs>

  <!-- TOP PANEL: 5 steps -> 2 bins -->
  <text x="16" y="28" font-size="16" font-weight="700" fill="#17211f">A. 顺序压箱：全窗均值守恒，段内波动与协方差可归零（5 步 → 2 段示意）</text>
  <text x="16" y="49" font-size="13.5" fill="#66716d">边界公式：np.arange(num_bins + 1) * num_samples // num_bins → 0, 2, 5（前段 2 步，后段 3 步）</text>

  <!-- Raw 5 steps -->
  <text x="16" y="84" font-size="14" font-weight="700" fill="#17211f">原始 5 步</text>
  <!-- Step 0,1 bracket -->
  <rect x="104" y="64" width="60" height="50" rx="5" fill="#e8edff" stroke="#4c65b6" stroke-width="1.3"/>
  <text x="134" y="84" text-anchor="middle" font-size="13.5" font-weight="700" fill="#3a4f93">A:2</text>
  <text x="134" y="104" text-anchor="middle" font-size="13.5" fill="#4d5652">B:8</text>

  <rect x="170" y="64" width="60" height="50" rx="5" fill="#e8edff" stroke="#4c65b6" stroke-width="1.3"/>
  <text x="200" y="84" text-anchor="middle" font-size="13.5" font-weight="700" fill="#3a4f93">A:6</text>
  <text x="200" y="104" text-anchor="middle" font-size="13.5" fill="#4d5652">B:4</text>

  <!-- Step 2,3,4 -->
  <rect x="242" y="64" width="60" height="50" rx="5" fill="#fff4cf" stroke="#c78300" stroke-width="1.3"/>
  <text x="272" y="84" text-anchor="middle" font-size="13.5" font-weight="700" fill="#936300">A:0</text>
  <text x="272" y="104" text-anchor="middle" font-size="13.5" fill="#4d5652">B:10</text>

  <rect x="308" y="64" width="60" height="50" rx="5" fill="#fff4cf" stroke="#c78300" stroke-width="1.3"/>
  <text x="338" y="84" text-anchor="middle" font-size="13.5" font-weight="700" fill="#936300">A:4</text>
  <text x="338" y="104" text-anchor="middle" font-size="13.5" fill="#4d5652">B:6</text>

  <rect x="374" y="64" width="60" height="50" rx="5" fill="#fff4cf" stroke="#c78300" stroke-width="1.3"/>
  <text x="404" y="84" text-anchor="middle" font-size="13.5" font-weight="700" fill="#936300">A:8</text>
  <text x="404" y="104" text-anchor="middle" font-size="13.5" fill="#4d5652">B:2</text>

  <!-- Compression arrows -->
  <path d="M 167 118 L 167 146" fill="none" stroke="#4c65b6" stroke-width="1.7" marker-end="url(#lb-arr-indigo)"/>
  <path d="M 338 118 L 338 146" fill="none" stroke="#4c65b6" stroke-width="1.7" marker-end="url(#lb-arr-indigo)"/>

  <!-- 2 Compressed bins -->
  <text x="16" y="176" font-size="14" font-weight="700" fill="#17211f">压成 2 段</text>
  <rect x="104" y="150" width="126" height="54" rx="6" fill="#ddf4ef" stroke="#087f73" stroke-width="1.4"/>
  <text x="167" y="173" text-anchor="middle" font-size="14" font-weight="700" fill="#065f56">段 1（权 2 步）</text>
  <text x="167" y="194" text-anchor="middle" font-size="13.5" fill="#17211f">均 A=4, B=6</text>

  <rect x="242" y="150" width="192" height="54" rx="6" fill="#ddf4ef" stroke="#087f73" stroke-width="1.4"/>
  <text x="338" y="173" text-anchor="middle" font-size="14" font-weight="700" fill="#065f56">段 2（权 3 步）</text>
  <text x="338" y="194" text-anchor="middle" font-size="13.5" fill="#17211f">均 A=4, B=6</text>

  <!-- Result callout on top right -->
  <path d="M 442 177 L 474 177" fill="none" stroke="#4c65b6" stroke-width="1.7" marker-end="url(#lb-arr-indigo)"/>

  <rect x="480" y="64" width="404" height="62" rx="6" fill="#ddf4ef" stroke="#087f73" stroke-width="1.3"/>
  <text x="494" y="89" font-size="14.5" font-weight="700" fill="#065f56">✓ 严格不变：步数加权全窗均值</text>
  <text x="494" y="112" font-size="13.5" fill="#4d5652">(2×4 + 3×4)/5 = 4，(2×6 + 3×6)/5 = 6（与原 5 步精确相等）</text>

  <rect x="480" y="140" width="404" height="64" rx="6" fill="#fff0e9" stroke="#b54237" stroke-width="1.3"/>
  <text x="494" y="165" font-size="14.5" font-weight="700" fill="#8f3229">✗ 丢失项：段内剧烈起伏被抹平</text>
  <text x="494" y="188" font-size="13.5" fill="#4d5652">两段均值同为 (4, 6) → 压缩后方差与协方差全部归 0</text>

  <!-- Horizontal divider -->
  <line x1="16" y1="226" x2="884" y2="226" stroke="#b8bcb5" stroke-width="1.5" stroke-dasharray="6 4"/>

  <!-- BOTTOM PANEL: Counter-intuitive balance drop -->
  <text x="16" y="254" font-size="16" font-weight="700" fill="#17211f">B. 反直觉边界：段数调小，均衡度反而可能下降（4 步 → 2 段示意）</text>
  <text x="16" y="275" font-size="13.5" fill="#66716d">2 卡各 1 专家，4 步负载：(1000, 0)、(1, 1)、(1, 1)、(1, 1) —— 因“先平均负载再算峰均比 ≠ 先算峰均比再平均”</text>

  <!-- Left comparison: 4 bins -->
  <rect x="16" y="294" width="406" height="150" rx="7" fill="#ece9df" stroke="#b8bcb5" stroke-width="1.3"/>
  <text x="30" y="320" font-size="14.5" font-weight="700" fill="#17211f">4 段（不压缩，每步 1 段）</text>
  <text x="30" y="346" font-size="13.5" font-family="var(--font-mono)" fill="#4d5652">各段峰均比：[2.0, 1.0, 1.0, 1.0]</text>
  <text x="30" y="370" font-size="13.5" fill="#4d5652">平均峰均比 = (2+1+1+1) / 4 = 1.25</text>
  <!-- Balance bar -->
  <rect x="30" y="388" width="280" height="22" rx="4" fill="#ddf4ef" stroke="#087f73" stroke-width="1.2"/>
  <rect x="30" y="388" width="224" height="22" rx="4" fill="#087f73"/>
  <text x="320" y="404" font-size="14.5" font-weight="700" fill="#065f56">均衡度 0.800</text>
  <text x="30" y="432" font-size="13.5" fill="#065f56">若绝对门槛 = 0.70：0.800 &gt; 0.70 → 拦截不放行</text>

  <!-- Arrow between -->
  <path d="M 426 368 L 468 368" fill="none" stroke="#b54237" stroke-width="1.8" marker-end="url(#lb-arr-red)"/>
  <text x="447" y="356" text-anchor="middle" font-size="13.5" font-weight="700" fill="#8f3229">压成</text>
  <text x="447" y="390" text-anchor="middle" font-size="13.5" font-weight="700" fill="#8f3229">2 段</text>

  <!-- Right comparison: 2 bins -->
  <rect x="474" y="294" width="410" height="150" rx="7" fill="#fff0e9" stroke="#b54237" stroke-width="1.4"/>
  <text x="488" y="320" font-size="14.5" font-weight="700" fill="#8f3229">2 段（每 2 步合 1 段，步数权各 2）</text>
  <text x="488" y="346" font-size="13.5" font-family="var(--font-mono)" fill="#4d5652">段均 (500.5, 0.5)→1.998；(1, 1)→1.0</text>
  <text x="488" y="370" font-size="13.5" fill="#4d5652">平均峰均比 ≈ (1.998 + 1.0) / 2 ≈ 1.499</text>
  <!-- Balance bar -->
  <rect x="488" y="388" width="280" height="22" rx="4" fill="#fff4cf" stroke="#b54237" stroke-width="1.2"/>
  <rect x="488" y="388" width="187" height="22" rx="4" fill="#b54237"/>
  <text x="778" y="404" font-size="14.5" font-weight="700" fill="#8f3229">均衡度 0.667</text>
  <text x="488" y="432" font-size="13.5" font-weight="700" fill="#8f3229">同一绝对门槛 0.70：0.667 ≤ 0.70 → 反向放行！</text>
</svg>
