<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 520" width="900" height="520" role="img" aria-label="enable_pcp_embedding_lmhead_weight_sharding 按 TP 乘 PCP 网格切分 8 行词表权重及 Embedding 与 LM Head 两侧新增通信流程" font-family="var(--font-sans)">
  <title>enable_pcp_embedding_lmhead_weight_sharding：TP×PCP 词表网格与双侧通信</title>
  <desc>Spatial sharding of an 8-row vocabulary matrix across TP=2 x PCP=2 (PCP inner dimension, 2 rows per card, lookup for token id=5 hitting only shard 2), followed by Embedding and LM Head communication pipelines and mutual-exclusion gates.</desc>
  <defs>
    <marker id="pe-arr-t" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="#087f73"/>
    </marker>
    <marker id="pe-arr-p" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="#9a4b86"/>
    </marker>
    <marker id="pe-arr-b" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="#4c65b6"/>
    </marker>
  </defs>

  <!-- Band 1: 8-row Vocab TP=2 x PCP=2 Grid -->
  <text x="16" y="26" font-size="16" font-weight="700" fill="#17211f">① 词表按 TP × PCP 网格切分（示意：补齐词表 8 行，TP=2, PCP=2，PCP 为内维）</text>
  <text x="16" y="46" font-size="13.5" fill="#66716d">每卡行数从 1/TP（4 行）降为 1/(TP×PCP)（2 行）；查询 token id = 5 时仅分片 2 命中，其余贡献 0</text>

  <!-- Shard 0: (tp0, pcp0) rows 0-1 -->
  <rect x="16" y="64" width="204" height="92" rx="8" fill="#ece9df" stroke="#b8bcb5" stroke-width="1.3"/>
  <text x="118" y="88" text-anchor="middle" font-size="14" font-weight="700" fill="#17211f">分片 0 · (tp0, pcp0)</text>
  <text x="118" y="112" text-anchor="middle" font-size="13.5" font-family="var(--font-mono)" fill="#4d5652">词表行 [0, 1]</text>
  <text x="118" y="138" text-anchor="middle" font-size="13.5" fill="#66716d">查 id=5 → 输出 0</text>

  <!-- Shard 1: (tp0, pcp1) rows 2-3 -->
  <rect x="236" y="64" width="204" height="92" rx="8" fill="#ece9df" stroke="#b8bcb5" stroke-width="1.3"/>
  <text x="338" y="88" text-anchor="middle" font-size="14" font-weight="700" fill="#17211f">分片 1 · (tp0, pcp1)</text>
  <text x="338" y="112" text-anchor="middle" font-size="13.5" font-family="var(--font-mono)" fill="#4d5652">词表行 [2, 3]</text>
  <text x="338" y="138" text-anchor="middle" font-size="13.5" fill="#66716d">查 id=5 → 输出 0</text>

  <!-- Shard 2: (tp1, pcp0) rows 4-5 (HIT!) -->
  <rect x="456" y="64" width="208" height="92" rx="8" fill="#ddf4ef" stroke="#087f73" stroke-width="2"/>
  <text x="560" y="88" text-anchor="middle" font-size="14" font-weight="700" fill="#065f56">分片 2 · (tp1, pcp0)</text>
  <text x="560" y="112" text-anchor="middle" font-size="13.5" font-family="var(--font-mono)" font-weight="700" fill="#17211f">词表行 [4, 5]</text>
  <text x="560" y="138" text-anchor="middle" font-size="13.5" font-weight="700" fill="#065f56">✓ 查 id=5 命中有效向量</text>

  <!-- Shard 3: (tp1, pcp1) rows 6-7 -->
  <rect x="680" y="64" width="204" height="92" rx="8" fill="#ece9df" stroke="#b8bcb5" stroke-width="1.3"/>
  <text x="782" y="88" text-anchor="middle" font-size="14" font-weight="700" fill="#17211f">分片 3 · (tp1, pcp1)</text>
  <text x="782" y="112" text-anchor="middle" font-size="13.5" font-family="var(--font-mono)" fill="#4d5652">词表行 [6, 7]</text>
  <text x="782" y="138" text-anchor="middle" font-size="13.5" fill="#66716d">查 id=5 → 输出 0</text>

  <!-- Grouping brackets for TP0 vs TP1 -->
  <path d="M 20 162 v 6 H 436 v -6" fill="none" stroke="#4c65b6" stroke-width="1.6"/>
  <text x="228" y="185" text-anchor="middle" font-size="13.5" font-weight="700" fill="#3a4f93">TP rank 0 管行 0–3（组内再按 PCP 拆半）</text>

  <path d="M 460 162 v 6 H 880 v -6" fill="none" stroke="#087f73" stroke-width="1.6"/>
  <text x="670" y="185" text-anchor="middle" font-size="13.5" font-weight="700" fill="#065f56">TP rank 1 管行 4–7（组内再按 PCP 拆半）</text>

  <line x1="16" y1="202" x2="884" y2="202" stroke="#d8d8cf" stroke-width="1.3" stroke-dasharray="6 4"/>

  <!-- Band 2: Two Communication Pipelines (Embedding vs LM Head) -->
  <text x="16" y="228" font-size="16" font-weight="700" fill="#17211f">② 显存换通信：Embedding 多 2 次 PCP 通信，LM Head 常规取 logits 多 1 次 PCP All-Gather</text>

  <!-- Track A: Embedding -->
  <text x="16" y="274" font-size="14" font-weight="700" fill="#065f56">embed_tokens</text>
  <text x="16" y="294" font-size="13.5" fill="#66716d">输入查表侧</text>

  <rect x="136" y="246" width="174" height="62" rx="7" fill="#f7e7f2" stroke="#9a4b86" stroke-width="1.5"/>
  <text x="223" y="270" text-anchor="middle" font-size="13.5" font-weight="700" fill="#7a3a6a">1. PCP All-Gather</text>
  <text x="223" y="293" text-anchor="middle" font-size="13.5" fill="#4d5652">收齐各卡 token ID</text>
  <path d="M 310 277 L 328 277" fill="none" stroke="#9a4b86" stroke-width="1.7" marker-end="url(#pe-arr-p)"/>

  <rect x="334" y="246" width="154" height="62" rx="7" fill="#fff4cf" stroke="#c78300" stroke-width="1.3"/>
  <text x="411" y="270" text-anchor="middle" font-size="13.5" font-weight="700" fill="#936300">2. 本地查分片</text>
  <text x="411" y="293" text-anchor="middle" font-size="13.5" fill="#4d5652">仅命中片非零</text>
  <path d="M 488 277 L 506 277" fill="none" stroke="#9a4b86" stroke-width="1.7" marker-end="url(#pe-arr-p)"/>

  <rect x="512" y="246" width="182" height="62" rx="7" fill="#f7e7f2" stroke="#9a4b86" stroke-width="1.5"/>
  <text x="603" y="270" text-anchor="middle" font-size="13.5" font-weight="700" fill="#7a3a6a">3. PCP Reduce-Scatter</text>
  <text x="603" y="293" text-anchor="middle" font-size="13.5" fill="#4d5652">送回各自 token 行</text>
  <path d="M 694 277 L 712 277" fill="none" stroke="#4c65b6" stroke-width="1.7" marker-end="url(#pe-arr-b)"/>

  <rect x="718" y="246" width="166" height="62" rx="7" fill="#e8edff" stroke="#4c65b6" stroke-width="1.4"/>
  <text x="801" y="270" text-anchor="middle" font-size="13.5" font-weight="700" fill="#3a4f93">4. TP All-Reduce</text>
  <text x="801" y="293" text-anchor="middle" font-size="13.5" fill="#4d5652">合齐词表维输出</text>

  <!-- Track B: LM Head -->
  <text x="16" y="354" font-size="14" font-weight="700" fill="#3a4f93">lm_head</text>
  <text x="16" y="374" font-size="13.5" fill="#66716d">输出 logits 侧</text>

  <rect x="136" y="326" width="194" height="62" rx="7" fill="#fff4cf" stroke="#c78300" stroke-width="1.3"/>
  <text x="233" y="350" text-anchor="middle" font-size="13.5" font-weight="700" fill="#936300">1. 本地词表片投影</text>
  <text x="233" y="373" text-anchor="middle" font-size="13.5" fill="#4d5652">算 1/(TP×PCP) logits</text>
  <path d="M 330 357 L 352 357" fill="none" stroke="#9a4b86" stroke-width="1.7" marker-end="url(#pe-arr-p)"/>

  <rect x="358" y="326" width="184" height="62" rx="7" fill="#f7e7f2" stroke="#9a4b86" stroke-width="1.5"/>
  <text x="450" y="350" text-anchor="middle" font-size="13.5" font-weight="700" fill="#7a3a6a">2. PCP All-Gather</text>
  <text x="450" y="373" text-anchor="middle" font-size="13.5" fill="#4d5652">先拼齐内维 PCP 分片</text>
  <path d="M 542 357 L 564 357" fill="none" stroke="#4c65b6" stroke-width="1.7" marker-end="url(#pe-arr-b)"/>

  <rect x="570" y="326" width="174" height="62" rx="7" fill="#e8edff" stroke="#4c65b6" stroke-width="1.4"/>
  <text x="657" y="350" text-anchor="middle" font-size="13.5" font-weight="700" fill="#3a4f93">3. TP All-Gather</text>
  <text x="657" y="373" text-anchor="middle" font-size="13.5" fill="#4d5652">再拼完整词表 logits</text>

  <rect x="756" y="326" width="128" height="62" rx="7" fill="#ece9df" stroke="#b8bcb5" stroke-width="1.2" stroke-dasharray="4 3"/>
  <text x="820" y="350" text-anchor="middle" font-size="13.5" font-weight="700" fill="#4d5652">skip_gather</text>
  <text x="820" y="373" text-anchor="middle" font-size="13.5" fill="#66716d">两条均跳过</text>

  <line x1="16" y1="406" x2="884" y2="406" stroke="#d8d8cf" stroke-width="1.3" stroke-dasharray="6 4"/>

  <!-- Band 3: Priority Gate, Mutex & Static Buffer Cap -->
  <rect x="16" y="422" width="276" height="84" rx="8" fill="#ddf4ef" stroke="#087f73" stroke-width="1.4"/>
  <text x="154" y="446" text-anchor="middle" font-size="14" font-weight="700" fill="#065f56">生效门优先级</text>
  <text x="154" y="470" text-anchor="middle" font-size="13.5" fill="#17211f">disable_tp=True 先走复制</text>
  <text x="154" y="492" text-anchor="middle" font-size="13.5" fill="#4d5652">否则 PCP&gt;1 + V2 runner</text>

  <rect x="312" y="422" width="276" height="84" rx="8" fill="#fff0e9" stroke="#b54237" stroke-width="1.4"/>
  <text x="450" y="446" text-anchor="middle" font-size="14" font-weight="700" fill="#8f3229">硬互斥（须显式关本键）</text>
  <text x="450" y="470" text-anchor="middle" font-size="13.5" fill="#17211f">同模块细粒度 TP 抛错</text>
  <text x="450" y="492" text-anchor="middle" font-size="13.5" fill="#8f3229">main + batch_sharded_sampling</text>

  <rect x="608" y="422" width="276" height="84" rx="8" fill="#fff4cf" stroke="#c78300" stroke-width="1.4"/>
  <text x="746" y="446" text-anchor="middle" font-size="14" font-weight="700" fill="#936300">静态交换缓冲上限</text>
  <text x="746" y="470" text-anchor="middle" font-size="13.5" fill="#17211f">embedding token 超限报错</text>
  <text x="746" y="492" text-anchor="middle" font-size="13.5" fill="#4d5652">须核图捕获上限与批预算</text>
</svg>
