<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 488" width="900" height="488" role="img" aria-label="SFA-DCP 解码 query All-Gather 后的 head-major 转 t-major 视图与连续化分叉示意，以及四类绕过门槛" font-family="var(--font-sans)">
  <title>sfa_dcp_force_tmajor_restore：head-major 转 t-major 视图 vs 连续化拷贝及四类绕过</title>
  <desc>Tensor layout transition from head-major [4, 2, 3] stride [6, 3, 1] via permute to strided t-major [2, 4, 3] stride [3, 6, 1] (default false, zero-copy) vs contiguous() deep copy of 24 elements (true when non-contiguous; no copy for T=1), followed by four bypass conditions.</desc>
  <defs>
    <marker id="sd-arr-t" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="#087f73"/>
    </marker>
    <marker id="sd-arr-a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="#c78300"/>
    </marker>
    <marker id="sd-arr-b" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="#4c65b6"/>
    </marker>
  </defs>

  <!-- Band 1: Tensor Layout & Stride Transformation -->
  <text x="16" y="26" font-size="16" font-weight="700" fill="#17211f">① 纯 Decode 步 Query 汇聚后的布局转换（示意：T=2, H=2, D=3, 汇聚组 G=2）</text>
  <text x="16" y="46" font-size="13.5" fill="#66716d">异步 All-Gather 按第 0 维收齐 head-major 缓冲 → permute 转回 t-major → 按开关决定是否 .contiguous()</text>

  <!-- Stage 1: Head-major buffer -->
  <rect x="16" y="64" width="218" height="106" rx="8" fill="#e8edff" stroke="#4c65b6" stroke-width="1.4"/>
  <text x="125" y="88" text-anchor="middle" font-size="14" font-weight="700" fill="#3a4f93">All-Gather 收回缓冲</text>
  <text x="125" y="110" text-anchor="middle" font-size="13.5" font-family="var(--font-mono)" fill="#17211f">head-major [4, 2, 3]</text>
  <text x="125" y="132" text-anchor="middle" font-size="13.5" font-family="var(--font-mono)" fill="#3a4f93">stride = [6, 3, 1]</text>
  <text x="125" y="155" text-anchor="middle" font-size="13.5" fill="#4d5652">（优先 Triton 融合准备）</text>

  <path d="M 234 117 L 266 117" fill="none" stroke="#4c65b6" stroke-width="1.8" marker-end="url(#sd-arr-b)"/>

  <!-- Stage 2: permute -->
  <rect x="272" y="74" width="154" height="86" rx="8" fill="#ece9df" stroke="#b8bcb5" stroke-width="1.4"/>
  <text x="349" y="100" text-anchor="middle" font-size="14" font-weight="700" fill="#17211f">permute 换轴</text>
  <text x="349" y="122" text-anchor="middle" font-size="13.5" font-family="var(--font-mono)" fill="#17211f">[2, 4, 3]</text>
  <text x="349" y="144" text-anchor="middle" font-size="13.5" font-family="var(--font-mono)" fill="#8f3229">stride [3, 6, 1]</text>

  <!-- Branch A (top): default false -->
  <path d="M 426 98 H 450 V 88 H 472" fill="none" stroke="#087f73" stroke-width="1.9" marker-end="url(#sd-arr-t)"/>
  <rect x="478" y="60" width="234" height="72" rx="8" fill="#ddf4ef" stroke="#087f73" stroke-width="1.6"/>
  <text x="595" y="83" text-anchor="middle" font-size="14" font-weight="700" fill="#065f56">默认 false（keep_view=True）</text>
  <text x="595" y="104" text-anchor="middle" font-size="13.5" fill="#17211f">保留跨步视图 · 零数据拷贝</text>
  <text x="595" y="123" text-anchor="middle" font-size="13.5" fill="#065f56">直接共享底层 head-major 存储</text>

  <!-- Branch B (bottom): true -->
  <path d="M 426 136 H 450 V 184 H 472" fill="none" stroke="#c78300" stroke-width="1.9" marker-end="url(#sd-arr-a)"/>
  <rect x="478" y="146" width="234" height="78" rx="8" fill="#fff4cf" stroke="#c78300" stroke-width="1.6"/>
  <text x="595" y="169" text-anchor="middle" font-size="14" font-weight="700" fill="#936300">设 true（keep_view=False）</text>
  <text x="595" y="190" text-anchor="middle" font-size="13.5" fill="#17211f">非连续时 .contiguous() 拷贝</text>
  <text x="595" y="210" text-anchor="middle" font-size="13.5" fill="#936300">T=2 拷 24 元素 · T=1 已连续不拷</text>

  <!-- Join to torch.split -->
  <path d="M 712 96 H 734 V 136 H 750" fill="none" stroke="#087f73" stroke-width="1.6" marker-end="url(#sd-arr-t)"/>
  <path d="M 712 184 H 734 V 144 H 750" fill="none" stroke="#c78300" stroke-width="1.6" marker-end="url(#sd-arr-a)"/>

  <rect x="756" y="88" width="128" height="104" rx="8" fill="#f7e7f2" stroke="#9a4b86" stroke-width="1.4"/>
  <text x="820" y="114" text-anchor="middle" font-size="14" font-weight="700" fill="#7a3a6a">torch.split</text>
  <text x="820" y="138" text-anchor="middle" font-size="13.5" font-family="var(--font-mono)" fill="#17211f">ql_nope</text>
  <text x="820" y="158" text-anchor="middle" font-size="13.5" font-family="var(--font-mono)" fill="#17211f">q_pe</text>
  <text x="820" y="180" text-anchor="middle" font-size="13.5" fill="#4d5652">（均不复制）</text>

  <line x1="16" y1="242" x2="884" y2="242" stroke="#d8d8cf" stroke-width="1.3" stroke-dasharray="6 4"/>

  <!-- Band 2: Four Path Boundary Conditions -->
  <text x="16" y="268" font-size="16" font-weight="700" fill="#17211f">② 路径边界：①–③ 不进恢复分支（写 true 无效）· ④ 跳过跨卡收集但仍过本键恢复</text>

  <rect x="16" y="284" width="206" height="96" rx="8" fill="#fff0e9" stroke="#b54237" stroke-width="1.3"/>
  <text x="119" y="308" text-anchor="middle" font-size="14" font-weight="700" fill="#8f3229">1. 未进 SFA-DCP 类</text>
  <text x="119" y="332" text-anchor="middle" font-size="13.5" fill="#17211f">须 SFA 稀疏 + DCP &gt; 1</text>
  <text x="119" y="356" text-anchor="middle" font-size="13.5" fill="#66716d">kpool（如 GLM）被排除</text>

  <rect x="236" y="284" width="206" height="96" rx="8" fill="#fff0e9" stroke="#b54237" stroke-width="1.3"/>
  <text x="339" y="308" text-anchor="middle" font-size="14" font-weight="700" fill="#8f3229">2. 批次含 prefill</text>
  <text x="339" y="332" text-anchor="middle" font-size="13.5" fill="#17211f">_has_prefill 提前 return</text>
  <text x="339" y="356" text-anchor="middle" font-size="13.5" fill="#66716d">走 KV-gather（写死连续）</text>

  <rect x="456" y="284" width="206" height="96" rx="8" fill="#fff0e9" stroke="#b54237" stroke-width="1.3"/>
  <text x="559" y="308" text-anchor="middle" font-size="14" font-weight="700" fill="#8f3229">3. 开 enable_dsa_cp</text>
  <text x="559" y="332" text-anchor="middle" font-size="13.5" fill="#17211f">MRO 继承 dim=0 汇聚</text>
  <text x="559" y="356" text-anchor="middle" font-size="13.5" fill="#66716d">restore_perm=None 跳过</text>

  <rect x="676" y="284" width="208" height="96" rx="8" fill="#ece9df" stroke="#b8bcb5" stroke-width="1.3"/>
  <text x="780" y="308" text-anchor="middle" font-size="14" font-weight="700" fill="#17211f">4. PCP+DCP 特殊路径</text>
  <text x="780" y="332" text-anchor="middle" font-size="13.5" fill="#17211f">DCP==PCP 不发 gather</text>
  <text x="780" y="356" text-anchor="middle" font-size="13.5" fill="#66716d">仍过本键，形状按实际算</text>

  <!-- Band 3: Version & Main Quantized Packed Gather Note -->
  <rect x="16" y="398" width="868" height="74" rx="8" fill="#ddf4ef" stroke="#087f73" stroke-width="1.3"/>
  <text x="32" y="423" font-size="14.5" font-weight="700" fill="#065f56">版本与读取细节：v0.30.0 (c09d3e20) / main (8d6180e2) 保留（v0.23 / v0.26 静默忽略）</text>
  <text x="32" y="450" font-size="13.5" fill="#17211f">main 在量化 KV（int8 / fp8）时改走 _finish_dcp_packed_gather，仍传 keep_view=not 本开关；读函数无 lru_cache 但无在线重捕获接口</text>
</svg>
