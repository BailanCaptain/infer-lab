mode: native-svg
id: param-sfa-dcp-force-tmajor
caption: >-
  sfa_dcp_force_tmajor_restore（默认 False）控制 SFA-DCP 纯 decode 路径中 query gather 收回后转 t-major 时是否追加 .contiguous() 拷贝：默认 keep_view=True 仅 permute 零拷贝切分，设 True 仅在视图非连续（如 T=2 步长 [3,6,1]）时触发复制（T=1 已连续不拷贝）；含 prefill 批次、开启 DSA-CP 或 kpool 模型均会直接绕过。
