<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 470" width="900" height="470" role="img" aria-label="STAIR 双门滞回或关系标尺：相对门槛 0.95 与绝对下限 0.90 协同消除 0.85×0.95=0.81 盲区" font-family="var(--font-sans)">
  <title>STAIR 双门滞回标尺与 0.85×0.95=0.81 盲区托底</title>
  <desc>Top: Prerequisite gate order (all-zero skip, no/NaN anchor pass, dual-gate OR). Middle: Balance ruler from 0.75 to 1.00 showing why an anchor at 0.85 would wait until 0.8075 (~0.81) under relative gate alone, rescued by the 0.90 absolute floor. Bottom: Four concrete scenarios A/B/C/D.</desc>
  <defs>
    <marker id="dg-arr-ink" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="#4d5652"/>
    </marker>
    <marker id="dg-arr-red" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="#b54237"/>
    </marker>
  </defs>

  <!-- Title -->
  <text x="16" y="28" font-size="16" font-weight="700" fill="#17211f">STAIR 双门滞回标尺：relative (0.95) ∨ absolute (0.90) 与 0.81 停滞盲区</text>
  <text x="16" y="49" font-size="13.5" fill="#66716d">均衡度 balance = 1 ÷ 平均峰均比（1.00 最优）；任一道门满足（含等号 ≤）即放行进入规划，锚点仅在提交搬运后更新</text>

  <!-- Top Strip: Prerequisite Order -->
  <rect x="16" y="66" width="206" height="56" rx="6" fill="#ece9df" stroke="#b8bcb5" stroke-width="1.3"/>
  <text x="119" y="89" text-anchor="middle" font-size="14" font-weight="700" fill="#17211f">① 全零负载窗口？</text>
  <text x="119" y="110" text-anchor="middle" font-size="13.5" fill="#66716d">是 → 返回 None 跳过</text>

  <line x1="224" y1="94" x2="246" y2="94" stroke="#4d5652" stroke-width="1.7" marker-end="url(#dg-arr-ink)"/>

  <rect x="250" y="66" width="232" height="56" rx="6" fill="#ddf4ef" stroke="#087f73" stroke-width="1.3"/>
  <text x="366" y="89" text-anchor="middle" font-size="14" font-weight="700" fill="#065f56">② 无提交锚点（None/NaN）？</text>
  <text x="366" y="110" text-anchor="middle" font-size="13.5" fill="#065f56">是 → 首轮直接放行规划</text>

  <line x1="484" y1="94" x2="506" y2="94" stroke="#4d5652" stroke-width="1.7" marker-end="url(#dg-arr-ink)"/>

  <rect x="510" y="66" width="374" height="56" rx="6" fill="#fff4cf" stroke="#c78300" stroke-width="1.4"/>
  <text x="697" y="89" text-anchor="middle" font-size="14" font-weight="700" fill="#936300">③ 存储预测峰均比有限且 ≥ 1</text>
  <text x="697" y="110" text-anchor="middle" font-size="13.5" fill="#4d5652">取倒数得平衡锚 ∈ (0,1]（如 0.85），双门判 ≤</text>

  <!-- Middle: Continuous Balance Ruler (0.75 at x=60 -> 1.00 at x=840; scale: 1 unit = 3120px, 0.05 = 156px) -->
  <!-- Wait: 0.75=60, 0.80=216, 0.85=372, 0.90=528, 0.95=684, 1.00=840 -->
  <text x="16" y="148" font-size="14.5" font-weight="700" fill="#17211f">双门叠加标尺（横轴为当前均衡度 balance，上方标注对应平均峰均比）</text>

  <!-- Zone bands on ruler -->
  <!-- Absolute trigger zone: 0.75..0.90 (x=60..528) -->
  <rect x="60" y="182" width="468" height="36" rx="4" fill="#fff0e9" stroke="#b54237" stroke-width="1.3"/>
  <text x="294" y="205" text-anchor="middle" font-size="14" font-weight="700" fill="#8f3229">绝对下限放行区（balance ≤ 0.90，即峰均比 ≥ 1.11）</text>

  <!-- Hysteresis buffer / relative-only zone: 0.90..1.00 (x=528..840) -->
  <rect x="528" y="182" width="312" height="36" rx="4" fill="#ddf4ef" stroke="#087f73" stroke-width="1.3"/>
  <text x="684" y="205" text-anchor="middle" font-size="14" font-weight="700" fill="#065f56">高均衡区（仅靠相对门触发）</text>

  <!-- Absolute 0.90 vertical wall -->
  <line x1="528" y1="162" x2="528" y2="332" stroke="#b54237" stroke-width="2" stroke-dasharray="5 3"/>

  <!-- Ticks along ruler -->
  <line x1="60" y1="218" x2="60" y2="228" stroke="#4d5652" stroke-width="1.5"/>
  <text x="60" y="246" text-anchor="middle" font-size="13.5" fill="#4d5652">0.75</text>
  <text x="60" y="174" text-anchor="middle" font-size="13.5" fill="#66716d">1.33×</text>

  <line x1="216" y1="218" x2="216" y2="228" stroke="#4d5652" stroke-width="1.5"/>
  <text x="216" y="246" text-anchor="middle" font-size="13.5" fill="#4d5652">0.80</text>
  <text x="216" y="174" text-anchor="middle" font-size="13.5" fill="#66716d">1.25×</text>

  <line x1="372" y1="218" x2="372" y2="228" stroke="#4d5652" stroke-width="1.5"/>
  <text x="372" y="246" text-anchor="middle" font-size="13.5" fill="#4d5652">0.85</text>
  <text x="372" y="174" text-anchor="middle" font-size="13.5" fill="#66716d">1.18×</text>

  <line x1="528" y1="218" x2="528" y2="228" stroke="#b54237" stroke-width="2"/>
  <text x="528" y="246" text-anchor="middle" font-size="14" font-weight="700" fill="#8f3229">0.90 (绝对线)</text>
  <text x="528" y="174" text-anchor="middle" font-size="13.5" font-weight="700" fill="#8f3229">1.11×</text>

  <line x1="684" y1="218" x2="684" y2="228" stroke="#4d5652" stroke-width="1.5"/>
  <text x="684" y="246" text-anchor="middle" font-size="13.5" fill="#4d5652">0.95</text>
  <text x="684" y="174" text-anchor="middle" font-size="13.5" fill="#66716d">1.05×</text>

  <line x1="840" y1="218" x2="840" y2="228" stroke="#087f73" stroke-width="1.5"/>
  <text x="840" y="246" text-anchor="middle" font-size="13.5" font-weight="700" fill="#065f56">1.00</text>
  <text x="840" y="174" text-anchor="middle" font-size="13.5" font-weight="700" fill="#065f56">1.00×</text>

  <!-- Track 1: Low-anchor stall example (Anchor 0.85 -> Relative waits for 0.8075 (~0.81)!) -->
  <!-- 0.8075 -> x = 60 + (0.8075-0.75)*3120 = 60 + 179.4 = 239 -->
  <rect x="60" y="264" width="460" height="64" rx="6" fill="#fff4cf" stroke="#c78300" stroke-width="1.4"/>
  <circle cx="372" cy="286" r="5" fill="#4c65b6"/>
  <circle cx="239" cy="286" r="5" fill="#b54237"/>
  <line x1="366" y1="286" x2="247" y2="286" stroke="#b54237" stroke-width="2" marker-end="url(#dg-arr-red)"/>
  <text x="305" y="279" text-anchor="middle" font-size="13.5" font-weight="700" fill="#8f3229">× 0.95</text>
  <text x="384" y="291" font-size="13.5" font-weight="700" fill="#3a4f93">低锚点 0.85</text>
  <text x="228" y="291" text-anchor="end" font-size="13.5" font-weight="700" fill="#8f3229">相对门等到 ~0.81</text>
  <text x="290" y="317" text-anchor="middle" font-size="13.5" font-weight="700" fill="#936300">无绝对门会停滞在 0.81–0.85；绝对门 0.90 立刻托底</text>

  <!-- Track 2: High-anchor relative catch (Anchor 0.980 -> 0.980*0.95 = 0.931; current 0.917 triggers!) -->
  <!-- 0.980 -> x=778, 0.917 -> x=581 -->
  <rect x="538" y="264" width="346" height="64" rx="6" fill="#e8edff" stroke="#4c65b6" stroke-width="1.4"/>
  <circle cx="778" cy="286" r="5" fill="#4c65b6"/>
  <circle cx="581" cy="286" r="5" fill="#9a4b86"/>
  <line x1="772" y1="286" x2="589" y2="286" stroke="#4c65b6" stroke-width="2" marker-end="url(#dg-arr-ink)"/>
  <text x="680" y="279" text-anchor="middle" font-size="13.5" font-weight="700" fill="#3a4f93">比值 0.936 ≤ 0.95</text>
  <text x="790" y="291" font-size="13.5" font-weight="700" fill="#3a4f93">锚 0.98</text>
  <text x="711" y="317" text-anchor="middle" font-size="13.5" font-weight="700" fill="#7a3a6a">高均衡层跌至 0.917：绝对门抓不到，相对门补位</text>

  <!-- Bottom 3 Scenario Chips -->
  <line x1="16" y1="346" x2="884" y2="346" stroke="#d8d8cf" stroke-width="1.2"/>
  <text x="16" y="370" font-size="14.5" font-weight="700" fill="#17211f">四类典型判定速查（默认 0.95 / 0.90）：</text>

  <rect x="16" y="382" width="276" height="72" rx="6" fill="#ddf4ef" stroke="#087f73" stroke-width="1.3"/>
  <text x="28" y="406" font-size="14" font-weight="700" fill="#065f56">A. 轻微抖动 → 拦截跳过</text>
  <text x="28" y="428" font-size="13.5" fill="#4d5652">锚 0.952 → 现 0.926 (比 0.972)</text>
  <text x="28" y="446" font-size="13.5" fill="#065f56">双门均不触发，省去无效搬运</text>

  <rect x="308" y="382" width="276" height="72" rx="6" fill="#e8edff" stroke="#4c65b6" stroke-width="1.3"/>
  <text x="320" y="406" font-size="14" font-weight="700" fill="#3a4f93">B. 好层退化 → 相对门放行</text>
  <text x="320" y="428" font-size="13.5" fill="#4d5652">锚 0.980 → 现 0.917 (比 0.936)</text>
  <text x="320" y="446" font-size="13.5" fill="#3a4f93">现 &gt; 0.90 绝对门抓不到，相对门补位</text>

  <rect x="600" y="382" width="284" height="72" rx="6" fill="#fff0e9" stroke="#b54237" stroke-width="1.3"/>
  <text x="612" y="406" font-size="14" font-weight="700" fill="#8f3229">C. 先天偏斜 / 低锚 → 绝对门放行</text>
  <text x="612" y="428" font-size="13.5" fill="#4d5652">锚 0.847 → 现 0.840 (比 0.992)</text>
  <text x="612" y="446" font-size="13.5" fill="#8f3229">现 ≤ 0.90 触发绝对门（进规划≠必搬）</text>
</svg>
