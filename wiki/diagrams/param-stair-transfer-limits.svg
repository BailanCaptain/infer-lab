<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 480" width="900" height="480" role="img" aria-label="STAIR 每卡与每节点搬运限额双独立账本判定与副本步数截断" font-family="var(--font-sans)">
  <title>STAIR 每卡与每节点搬运双独立账本对照</title>
  <desc>Top: 2-node x 2-rank topology showing three transfer combinations under rank_transfer_limit=2 and cross_node_transfer_limit=1: parallel same-direction cross-node rejected, cross-node swap allowed, intra-node + cross-node allowed. Bottom: Independent in/out accounting, replica step cap min(extra_slots, ranks*limit), and 0 legality difference.</desc>
  <defs>
    <marker id="tl-arr-red" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="#b54237"/>
    </marker>
    <marker id="tl-arr-teal" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="#087f73"/>
    </marker>
    <marker id="tl-arr-plum" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="#9a4b86"/>
    </marker>
  </defs>

  <!-- Title -->
  <text x="16" y="28" font-size="16" font-weight="700" fill="#17211f">两套独立账本同时把关：rank_transfer_limit（按卡）∧ cross_node_transfer_limit（按节点）</text>
  <text x="16" y="49" font-size="13.5" fill="#66716d">2 节点 × 2 卡示意（每卡上限 = 2，每节点跨机上限 = 1）；两方向分别计数，原地保留专家计 0 次</text>

  <!-- Case 1: Same direction 2 cross-node -> REJECT -->
  <rect x="16" y="68" width="276" height="226" rx="7" fill="#fff0e9" stroke="#b54237" stroke-width="1.4"/>
  <text x="28" y="92" font-size="14.5" font-weight="700" fill="#8f3229">① 同向两笔跨机 → 拒绝</text>
  <text x="28" y="113" font-size="13.5" fill="#4d5652">R2→R0 且 R3→R1</text>

  <!-- Node 0 & Node 1 mini diagram inside Case 1 -->
  <rect x="28" y="126" width="96" height="92" rx="5" fill="#ffffff" stroke="#b8bcb5" stroke-width="1.2"/>
  <text x="76" y="146" text-anchor="middle" font-size="13.5" font-weight="700" fill="#3a4f93">节点 0</text>
  <rect x="40" y="154" width="72" height="24" rx="4" fill="#e8edff" stroke="#4c65b6" stroke-width="1"/>
  <text x="76" y="171" text-anchor="middle" font-size="13.5" font-weight="700" fill="#17211f">R0</text>
  <rect x="40" y="186" width="72" height="24" rx="4" fill="#e8edff" stroke="#4c65b6" stroke-width="1"/>
  <text x="76" y="203" text-anchor="middle" font-size="13.5" font-weight="700" fill="#17211f">R1</text>

  <rect x="184" y="126" width="96" height="92" rx="5" fill="#ffffff" stroke="#b8bcb5" stroke-width="1.2"/>
  <text x="232" y="146" text-anchor="middle" font-size="13.5" font-weight="700" fill="#7a3a6a">节点 1</text>
  <rect x="196" y="154" width="72" height="24" rx="4" fill="#f7e7f2" stroke="#9a4b86" stroke-width="1"/>
  <text x="232" y="171" text-anchor="middle" font-size="13.5" font-weight="700" fill="#17211f">R2</text>
  <rect x="196" y="186" width="72" height="24" rx="4" fill="#f7e7f2" stroke="#9a4b86" stroke-width="1"/>
  <text x="232" y="203" text-anchor="middle" font-size="13.5" font-weight="700" fill="#17211f">R3</text>

  <!-- Two red arrows right to left -->
  <line x1="194" y1="166" x2="118" y2="166" stroke="#b54237" stroke-width="2" marker-end="url(#tl-arr-red)"/>
  <line x1="194" y1="198" x2="118" y2="198" stroke="#b54237" stroke-width="2" marker-end="url(#tl-arr-red)"/>

  <text x="28" y="242" font-size="13.5" fill="#065f56">✓ 每卡：各占 1 ≤ 2（通过）</text>
  <text x="28" y="264" font-size="13.5" font-weight="700" fill="#8f3229">✗ 节点 0 收 2 / 节点 1 发 2</text>
  <text x="28" y="284" font-size="13.5" fill="#8f3229">超跨机上限 1 → 方案作废</text>

  <!-- Case 2: Swap -> ALLOW -->
  <rect x="310" y="68" width="280" height="226" rx="7" fill="#ddf4ef" stroke="#087f73" stroke-width="1.4"/>
  <text x="322" y="92" font-size="14.5" font-weight="700" fill="#065f56">② 双向对调各一笔 → 允许</text>
  <text x="322" y="113" font-size="13.5" fill="#4d5652">R2→R0 且 R1→R3（全局达 2×1=2）</text>

  <rect x="322" y="126" width="96" height="92" rx="5" fill="#ffffff" stroke="#b8bcb5" stroke-width="1.2"/>
  <text x="370" y="146" text-anchor="middle" font-size="13.5" font-weight="700" fill="#3a4f93">节点 0</text>
  <rect x="334" y="154" width="72" height="24" rx="4" fill="#e8edff" stroke="#4c65b6" stroke-width="1"/>
  <text x="370" y="171" text-anchor="middle" font-size="13.5" font-weight="700" fill="#17211f">R0</text>
  <rect x="334" y="186" width="72" height="24" rx="4" fill="#e8edff" stroke="#4c65b6" stroke-width="1"/>
  <text x="370" y="203" text-anchor="middle" font-size="13.5" font-weight="700" fill="#17211f">R1</text>

  <rect x="480" y="126" width="96" height="92" rx="5" fill="#ffffff" stroke="#b8bcb5" stroke-width="1.2"/>
  <text x="528" y="146" text-anchor="middle" font-size="13.5" font-weight="700" fill="#7a3a6a">节点 1</text>
  <rect x="492" y="154" width="72" height="24" rx="4" fill="#f7e7f2" stroke="#9a4b86" stroke-width="1"/>
  <text x="528" y="171" text-anchor="middle" font-size="13.5" font-weight="700" fill="#17211f">R2</text>
  <rect x="492" y="186" width="72" height="24" rx="4" fill="#f7e7f2" stroke="#9a4b86" stroke-width="1"/>
  <text x="528" y="203" text-anchor="middle" font-size="13.5" font-weight="700" fill="#17211f">R3</text>

  <line x1="490" y1="166" x2="412" y2="166" stroke="#087f73" stroke-width="2" marker-end="url(#tl-arr-teal)"/>
  <line x1="408" y1="198" x2="486" y2="198" stroke="#087f73" stroke-width="2" marker-end="url(#tl-arr-teal)"/>

  <text x="322" y="242" font-size="13.5" fill="#065f56">✓ 每卡：各占 1 ≤ 2</text>
  <text x="322" y="264" font-size="13.5" font-weight="700" fill="#065f56">✓ 节点 0：收 1 / 发 1（独立记）</text>
  <text x="322" y="284" font-size="13.5" fill="#065f56">✓ 节点 1：收 1 / 发 1（全过）</text>

  <!-- Case 3: Cross + Intra-node -> ALLOW -->
  <rect x="608" y="68" width="276" height="226" rx="7" fill="#ddf4ef" stroke="#087f73" stroke-width="1.4"/>
  <text x="620" y="92" font-size="14.5" font-weight="700" fill="#065f56">③ 1 笔跨机 + 机内对调 → 允许</text>
  <text x="620" y="113" font-size="13.5" fill="#4d5652">R2→R0 且机内 R0↔R1</text>

  <rect x="620" y="126" width="102" height="92" rx="5" fill="#ffffff" stroke="#b8bcb5" stroke-width="1.2"/>
  <text x="671" y="146" text-anchor="middle" font-size="13.5" font-weight="700" fill="#3a4f93">节点 0</text>
  <rect x="630" y="154" width="66" height="24" rx="4" fill="#e8edff" stroke="#4c65b6" stroke-width="1"/>
  <text x="663" y="171" text-anchor="middle" font-size="13.5" font-weight="700" fill="#17211f">R0</text>
  <rect x="630" y="186" width="66" height="24" rx="4" fill="#e8edff" stroke="#4c65b6" stroke-width="1"/>
  <text x="663" y="203" text-anchor="middle" font-size="13.5" font-weight="700" fill="#17211f">R1</text>
  <!-- Intra-node double arrow on right edge of R0-R1 -->
  <path d="M 708 164 L 708 200" fill="none" stroke="#9a4b86" stroke-width="2" marker-start="url(#tl-arr-plum)" marker-end="url(#tl-arr-plum)"/>

  <rect x="776" y="126" width="96" height="92" rx="5" fill="#ffffff" stroke="#b8bcb5" stroke-width="1.2"/>
  <text x="824" y="146" text-anchor="middle" font-size="13.5" font-weight="700" fill="#7a3a6a">节点 1</text>
  <rect x="788" y="154" width="72" height="24" rx="4" fill="#f7e7f2" stroke="#9a4b86" stroke-width="1"/>
  <text x="824" y="171" text-anchor="middle" font-size="13.5" font-weight="700" fill="#17211f">R2</text>
  <rect x="788" y="186" width="72" height="24" rx="4" fill="#f7e7f2" stroke="#9a4b86" stroke-width="1"/>
  <text x="824" y="203" text-anchor="middle" font-size="13.5" font-weight="700" fill="#17211f">R3</text>

  <line x1="786" y1="166" x2="702" y2="166" stroke="#087f73" stroke-width="2" marker-end="url(#tl-arr-teal)"/>

  <text x="620" y="242" font-size="13.5" fill="#065f56">✓ R0 收 2 发 1；R1 收 1 发 1</text>
  <text x="620" y="264" font-size="13.5" font-weight="700" fill="#7a3a6a">✓ 机内搬运不扣跨机额度！</text>
  <text x="620" y="284" font-size="13.5" fill="#065f56">节点 0 跨机仅收 1 / 发 0</text>

  <!-- Bottom Strip: Three Critical Key Differences -->
  <line x1="16" y1="312" x2="884" y2="312" stroke="#b8bcb5" stroke-width="1.5" stroke-dasharray="6 4"/>

  <!-- Box Left: 0 Legality & Replica step cap -->
  <rect x="16" y="330" width="424" height="134" rx="7" fill="#fff4cf" stroke="#c78300" stroke-width="1.4"/>
  <text x="30" y="356" font-size="14.5" font-weight="700" fill="#936300">rank_transfer_limit 独有特性</text>
  <text x="30" y="382" font-size="13.5" font-weight="700" fill="#8f3229">• 取值 0 非法（仅许 -1 或 ≥ 1）</text>
  <text x="30" y="406" font-size="13.5" fill="#4d5652">• 第二作用：截断增量副本挪动步数</text>
  <text x="30" y="428" font-size="13.5" font-family="var(--font-mono)" fill="#17211f">  限额&gt;0: min(额外槽, 卡×限额) | -1: 额外槽</text>
  <text x="30" y="450" font-size="13.5" fill="#66716d">  例：8 卡 12 额外槽，限 1→8 步；限 2→12 步</text>

  <!-- Box Right: cross_node 0 legality + tiebreak + Gloo -->
  <rect x="460" y="330" width="424" height="134" rx="7" fill="#e8edff" stroke="#4c65b6" stroke-width="1.4"/>
  <text x="474" y="356" font-size="14.5" font-weight="700" fill="#3a4f93">cross_node_transfer_limit 独有特性</text>
  <text x="474" y="382" font-size="13.5" font-weight="700" fill="#065f56">• 取值 0 合法（禁外机引入；机内扩副本覆盖可缩集合）</text>
  <text x="474" y="406" font-size="13.5" fill="#4d5652">• 即使设 -1，均峰比差在 1e-9 打平时仍优先少跨机</text>
  <text x="474" y="428" font-size="13.5" font-weight="700" fill="#8f3229">• 两者共用陷阱：回退 torch_gloo 仅将未显式项 -1→1</text>
  <text x="474" y="450" font-size="13.5" fill="#66716d">  用户显式写出的 0 或 -1 原样保留不被覆盖</text>
</svg>
