<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 432" width="900" height="432" role="img" aria-label="固定旧 GLM 的两组常规入口：① 平台准备钩子或通用插件加载 global patch；② Worker 构造加载 worker patch。替换影响之后按该绑定查找的代码，早先复制的引用与子类父类不会自动变化。图中两组换的是不同名字；fork 可继承已有绑定，spawn 的新解释器重新加载。左侧均衡开关关闭时，BalanceScheduler.schedule 转调上游主体；实际导入与内部条件仍须分别核对。">
  <title>固定旧 GLM 的两组常规入口：① 平台准备钩子或通用插件加载 global patch；② Worker 构造加载 worker patch。替换影响之后按该绑定查找的代码，早先复制的引用与子类父类不会自动变化。图中两组换的是不同名字；fork 可继承已有绑定，spawn 的新解释器重新加载。左侧均衡开关关闭时，BalanceScheduler.schedule 转调上游主体；实际导入与内部条件仍须分别核对。</title>
  <defs><marker id="patch-binding-ah-control" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="var(--color-control, #66716d)"/></marker><marker id="patch-binding-ah-ink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="var(--color-ink, #17211f)"/></marker><marker id="patch-binding-ah-weight" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="var(--color-weight, #c78300)"/></marker></defs>
  <rect x="20" y="132" width="420" height="290" rx="16" fill="none" stroke="var(--color-line-strong, #b8bcb5)" stroke-width="1.5"/>
  <text x="36" y="120" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="15" font-weight="700" fill="var(--color-ink, #17211f)">① global patch：Worker 出生前就要用的名字</text>
  <rect x="460" y="132" width="420" height="290" rx="16" fill="none" stroke="var(--color-line-strong, #b8bcb5)" stroke-width="1.5"/>
  <text x="476" y="120" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="15" font-weight="700" fill="var(--color-ink, #17211f)">② worker patch：只在 Worker 里用的名字</text>
  <path d="M210 77 L250 77" fill="none" stroke="var(--color-control, #66716d)" stroke-width="1.4" marker-end="url(#patch-binding-ah-control)"/>
  <path d="M440 77 L480 77" fill="none" stroke="var(--color-control, #66716d)" stroke-width="1.4" marker-end="url(#patch-binding-ah-control)"/>
  <path d="M670 77 L710 77" fill="none" stroke="var(--color-control, #66716d)" stroke-width="1.4" marker-end="url(#patch-binding-ah-control)"/>
