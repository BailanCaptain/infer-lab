<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 456" width="900" height="456" role="img" aria-label="Python 符号表改指向与 from-import 副本滞留双改写原理图" font-family="var(--font-sans)">
  <title>Monkey Patch 符号表改写与 from-import 副本双改写对比</title>
  <desc>Left shows live module attribute patching in patch/platform and patch/worker; right shows why from-import copies retain stale bindings unless both source and consumer modules are patched.</desc>
  <defs>
    <marker id="pb-arr-g" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto"><path d="M0 1.5L8.5 5L0 8.5z" fill="#66716d"/></marker>
    <marker id="pb-arr-t" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto"><path d="M0 1.5L8.5 5L0 8.5z" fill="#087f73"/></marker>
    <marker id="pb-arr-a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto"><path d="M0 1.5L8.5 5L0 8.5z" fill="#c78300"/></marker>
    <marker id="pb-arr-r" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto"><path d="M0 1.5L8.5 5L0 8.5z" fill="#b54237"/></marker>
  </defs>

  <text x="16" y="26" font-size="16" font-weight="700" fill="#17211f">进程内 Monkey Patch：改「模块符号表」指向，与 from-import 副本陷阱</text>
  <text x="16" y="48" font-size="13.5" fill="#66716d">只改当前 Python 进程内存中的「名字 → 对象」映射，不碰磁盘上的上游源码；各进程彼此隔离</text>

  <text x="16" y="80" font-size="15" font-weight="700" fill="#17211f">左：按「模块.名字」现场查表（两类补丁改不同阶段的名字）</text>

  <rect x="16" y="94" width="430" height="162" rx="8" fill="#ddf4ef" stroke="#087f73" stroke-width="1.4"/>
  <text x="30" y="118" font-size="14.5" font-weight="700" fill="#065f56">① global patch（patch/platform · Worker 出生前）</text>
  <rect x="30" y="132" width="176" height="44" rx="6" fill="#ffffff" stroke="#087f73" stroke-width="1.2"/>
  <text x="118" y="152" text-anchor="middle" font-size="13.5" font-weight="700" fill="#17211f" font-family="var(--font-mono)">scheduler.Scheduler</text>
  <text x="118" y="170" text-anchor="middle" font-size="13.5" fill="#66716d">上游模块符号槽</text>

  <path d="M206 146 H254" fill="none" stroke="#b8bcb5" stroke-width="1.5" stroke-dasharray="4 3" marker-end="url(#pb-arr-g)"/>
  <text x="230" y="140" text-anchor="middle" font-size="13.5" font-weight="700" fill="#b54237">✕</text>
  <rect x="260" y="130" width="172" height="36" rx="6" fill="#ece9df" stroke="#b8bcb5" stroke-width="1.2"/>
  <text x="346" y="153" text-anchor="middle" font-size="13.5" fill="#66716d">原上游 Scheduler</text>

  <path d="M206 164 C228 164, 232 198, 254 198" fill="none" stroke="#087f73" stroke-width="2" marker-end="url(#pb-arr-t)"/>
  <rect x="260" y="176" width="172" height="44" rx="6" fill="#ffffff" stroke="#087f73" stroke-width="1.4"/>
  <text x="346" y="196" text-anchor="middle" font-size="13.5" font-weight="700" fill="#065f56" font-family="var(--font-mono)">BalanceScheduler</text>
  <text x="346" y="214" text-anchor="middle" font-size="13.5" fill="#4d5652">开关关闭则转调父类</text>
  <text x="30" y="244" font-size="13.5" fill="#4d5652">生效进程：API Server · EngineCore · Worker</text>

  <rect x="16" y="272" width="430" height="166" rx="8" fill="#fff4cf" stroke="#c78300" stroke-width="1.4"/>
  <text x="30" y="296" font-size="14.5" font-weight="700" fill="#936300">② worker patch（patch/worker · Worker 构造开头）</text>
  <rect x="30" y="310" width="176" height="44" rx="6" fill="#ffffff" stroke="#c78300" stroke-width="1.2"/>
  <text x="118" y="330" text-anchor="middle" font-size="13.5" font-weight="700" fill="#17211f" font-family="var(--font-mono)">GroupCoordinator</text>
  <text x="118" y="348" text-anchor="middle" font-size="13.5" fill="#66716d">通信模块符号槽</text>

  <path d="M206 324 H254" fill="none" stroke="#b8bcb5" stroke-width="1.5" stroke-dasharray="4 3" marker-end="url(#pb-arr-g)"/>
  <text x="230" y="318" text-anchor="middle" font-size="13.5" font-weight="700" fill="#b54237">✕</text>
  <rect x="260" y="308" width="172" height="36" rx="6" fill="#ece9df" stroke="#b8bcb5" stroke-width="1.2"/>
  <text x="346" y="331" text-anchor="middle" font-size="13.5" fill="#66716d">原上游通信组类</text>

  <path d="M206 342 C228 342, 232 376, 254 376" fill="none" stroke="#c78300" stroke-width="2" marker-end="url(#pb-arr-a)"/>
  <rect x="260" y="354" width="172" height="44" rx="6" fill="#ffffff" stroke="#c78300" stroke-width="1.4"/>
  <text x="346" y="374" text-anchor="middle" font-size="13.5" font-weight="700" fill="#936300" font-family="var(--font-mono)">GroupCoordPatch</text>
  <text x="346" y="392" text-anchor="middle" font-size="13.5" fill="#4d5652">补齐 all_to_all 通信</text>
  <text x="30" y="424" font-size="13.5" fill="#4d5652">生效进程：各 Worker（uni 下落在 EngineCore 内）</text>

  <line x1="464" y1="68" x2="464" y2="442" stroke="#b8bcb5" stroke-width="1.4" stroke-dasharray="6 4"/>

  <text x="482" y="80" font-size="15" font-weight="700" fill="#8f3229">右：from-import 副本滞留与双处改写</text>

  <rect x="482" y="94" width="402" height="162" rx="8" fill="#fff0e9" stroke="#b54237" stroke-width="1.4"/>
  <text x="496" y="118" font-size="14.5" font-weight="700" fill="#8f3229">✗ 只改源模块：消费方副本仍指旧函数</text>

  <rect x="496" y="132" width="176" height="44" rx="6" fill="#ffffff" stroke="#087f73" stroke-width="1.2"/>
  <text x="584" y="152" text-anchor="middle" font-size="13.5" font-weight="700" fill="#065f56">源 kv_cache_utils</text>
  <text x="584" y="170" text-anchor="middle" font-size="13.5" fill="#065f56">已改 → 昇腾新函数 ✓</text>

  <rect x="496" y="190" width="176" height="50" rx="6" fill="#ffffff" stroke="#b54237" stroke-width="1.4"/>
  <text x="584" y="211" text-anchor="middle" font-size="13.5" font-weight="700" fill="#8f3229">消费方 engine.core</text>
  <text x="584" y="231" text-anchor="middle" font-size="13.5" fill="#4d5652">早先 from ... import</text>

  <line x1="672" y1="215" x2="718" y2="215" stroke="#b54237" stroke-width="2" marker-end="url(#pb-arr-r)"/>
  <rect x="724" y="188" width="146" height="52" rx="6" fill="#ece9df" stroke="#b54237" stroke-width="1.3"/>
  <text x="797" y="210" text-anchor="middle" font-size="13.5" font-weight="700" fill="#8f3229">滞留旧实现</text>
  <text x="797" y="230" text-anchor="middle" font-size="13.5" fill="#4d5652">补丁静默失效！</text>

  <rect x="482" y="272" width="402" height="166" rx="8" fill="#e8edff" stroke="#4c65b6" stroke-width="1.4"/>
  <text x="496" y="296" font-size="14.5" font-weight="700" fill="#3a4f93">✓ 双处改写：源模块 + 消费方副本同步替换</text>

  <rect x="496" y="310" width="176" height="44" rx="6" fill="#ffffff" stroke="#4c65b6" stroke-width="1.2"/>
  <text x="584" y="330" text-anchor="middle" font-size="13.5" font-weight="700" fill="#3a4f93">源 kv_cache_utils</text>
  <text x="584" y="348" text-anchor="middle" font-size="13.5" fill="#4d5652">符号槽改写</text>

  <rect x="496" y="366" width="176" height="44" rx="6" fill="#ffffff" stroke="#4c65b6" stroke-width="1.4"/>
  <text x="584" y="386" text-anchor="middle" font-size="13.5" font-weight="700" fill="#3a4f93">消费方 engine.core</text>
  <text x="584" y="404" text-anchor="middle" font-size="13.5" fill="#4d5652">末尾同步覆写副本</text>

  <path d="M672 332 H696 V356 H718" fill="none" stroke="#087f73" stroke-width="1.8" marker-end="url(#pb-arr-t)"/>
  <path d="M672 388 H696 V366 H718" fill="none" stroke="#087f73" stroke-width="1.8" marker-end="url(#pb-arr-t)"/>

  <rect x="724" y="330" width="146" height="62" rx="6" fill="#ddf4ef" stroke="#087f73" stroke-width="1.4"/>
  <text x="797" y="356" text-anchor="middle" font-size="14" font-weight="700" fill="#065f56">昇腾新实现</text>
  <text x="797" y="378" text-anchor="middle" font-size="13.5" fill="#4d5652">全路径一致命中</text>

  <text x="496" y="428" font-size="13.5" fill="#4d5652">同理：权重后处理补丁也双改；已建子类父类不会自动变</text>
</svg>
