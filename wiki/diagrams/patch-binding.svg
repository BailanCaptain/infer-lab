  <text x="485" y="362" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="13.5" font-weight="400" fill="var(--color-ink, #17211f)">同类：通信组、权重后处理、图尺寸、采样函数</text>
