layout: figure
id: patch-binding
caption: 进程一启动，上游模块里的名字指向上游实现。请求到来之前，这些名字被改指两次：① 平台注册时打 global patch，改的是前端和 EngineCore 在 Worker 出生前就要用的名字；② Worker 启动时打 worker patch，改的是只在 Worker 里用到的名字。之后凡是按名字去模块里取实现的代码，拿到的都是昇腾版本。每个进程各有一份名字，各改各的。左边的 BalanceScheduler 在本部署开关关着，名字换了，调度仍交回上游
size: [900, 432]
