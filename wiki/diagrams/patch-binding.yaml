layout: figure
id: patch-binding
caption: 固定旧 GLM 的两组常规入口：① 平台准备钩子或通用插件加载 global patch；② Worker 构造加载 worker patch。替换影响之后按该绑定查找的代码，早先复制的引用与子类父类不会自动变化。图中两组换的是不同名字；fork 可继承已有绑定，spawn 的新解释器重新加载。左侧均衡开关关闭时，BalanceScheduler.schedule 转调上游主体；实际导入与内部条件仍须分别核对。
size: [900, 432]
