  <text x="20" y="404" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="12.5" font-weight="400" fill="var(--color-ink-muted, #5b6763)">数量本身不是结论：清单里每条都写了 Related PR 与 Future Plan，相当一部分在等上游合 PR 之后删掉。要判断质量得看那两栏。</text>
