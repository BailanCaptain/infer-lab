<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 560" width="900" height="560" role="img" aria-label="固定旧 GLM 的 global patch 由平台准备钩子或三个通用插件入口触发，worker patch 由 NPUWorker 构造触发，随后才登记算子、初始化配置与基类。正常成功导入由标记和模块缓存去重，失败、显式重载与直接调用安装函数须另看，不能据此证明补丁幂等。目录入口与补丁内部各有条件；最下方示意两个按需入口。">
  <title>固定旧 GLM 的 global patch 由平台准备钩子或三个通用插件入口触发，worker patch 由 NPUWorker 构造触发，随后才登记算子、初始化配置与基类。正常成功导入由标记和模块缓存去重，失败、显式重载与直接调用安装函数须另看，不能据此证明补丁幂等。目录入口与补丁内部各有条件；最下方示意两个按需入口。</title>
  <defs><marker id="patch-timing-ah-control" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="var(--color-control, #66716d)"/></marker><marker id="patch-timing-ah-weight" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="var(--color-weight, #c78300)"/></marker></defs>
  <path d="M16 238 L884 238" fill="none" stroke="var(--color-ink-muted, #66716d)" stroke-width="1.4" stroke-dasharray="6 5"/>
