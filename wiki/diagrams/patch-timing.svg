  <text x="498" y="346" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="12.5" font-weight="400" fill="var(--color-ink-muted, #5b6763)">from vllm_ascend.patch import worker</text>
  <rect x="476" y="362" width="388" height="50" rx="10" fill="var(--color-weight-soft, #fff4cf)"/>
  <rect x="476" y="362" width="5" height="50" rx="2.5" fill="var(--color-weight, #b87a00)"/>
