<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 270" width="900" height="270" role="img" aria-label="服务启动时补丁分两批换：Worker 出生之前换全局补丁，Worker 出生那一刻换 Worker 补丁；请求进来时都已换好">
  <title>服务启动时补丁分两批换：Worker 出生之前换全局补丁，Worker 出生那一刻换 Worker 补丁；请求进来时都已换好</title>
  <defs><marker id="patch-timing-ah-ink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="var(--color-ink, #17211f)"/></marker><marker id="patch-timing-ah-control" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="var(--color-control, #66716d)"/></marker><marker id="patch-timing-ah-weight" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="var(--color-weight, #c78300)"/></marker></defs>
  <path d="M450 24 L450 250" fill="none" stroke="var(--color-ink-muted, #66716d)" stroke-width="1.4" stroke-dasharray="6 5"/>
  <path d="M200 74 L250 74" fill="none" stroke="var(--color-ink, #17211f)" stroke-width="1.4" marker-end="url(#patch-timing-ah-ink)"/>
  <path d="M420 74 L480 74" fill="none" stroke="var(--color-ink, #17211f)" stroke-width="1.4" marker-end="url(#patch-timing-ah-ink)"/>
  <path d="M650 74 L700 74" fill="none" stroke="var(--color-ink, #17211f)" stroke-width="1.4" marker-end="url(#patch-timing-ah-ink)"/>
  <path d="M115 100 L115 168" fill="none" stroke="var(--color-control, #66716d)" stroke-width="1.4" marker-end="url(#patch-timing-ah-control)"/>
  <path d="M335 100 L335 168" fill="none" stroke="var(--color-control, #66716d)" stroke-width="1.4" marker-end="url(#patch-timing-ah-control)"/>
  <path d="M565 100 L565 168" fill="none" stroke="var(--color-weight, #c78300)" stroke-width="1.4" marker-end="url(#patch-timing-ah-weight)"/>
  <rect x="30" y="50" width="170" height="48" rx="8" fill="var(--color-surface-sunken, #ece9df)" stroke="var(--color-ink, #17211f)" stroke-width="1.5"/>
  <text x="115" y="79" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="14" font-weight="700" fill="var(--color-ink, #17211f)" text-anchor="middle">选中平台</text>
  <rect x="250" y="50" width="170" height="48" rx="8" fill="var(--color-surface-sunken, #ece9df)" stroke="var(--color-ink, #17211f)" stroke-width="1.5"/>
  <text x="335" y="79" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="14" font-weight="700" fill="var(--color-ink, #17211f)" text-anchor="middle">EngineCore 起来</text>
  <rect x="480" y="50" width="170" height="48" rx="8" fill="var(--color-surface-sunken, #ece9df)" stroke="var(--color-ink, #17211f)" stroke-width="1.5"/>
  <text x="565" y="79" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="14" font-weight="700" fill="var(--color-ink, #17211f)" text-anchor="middle">Worker 出生</text>
  <rect x="700" y="50" width="170" height="48" rx="8" fill="var(--color-token-soft, #ddf4ef)" stroke="var(--color-token, #087f73)" stroke-opacity="0.4" stroke-width="1.5" stroke-dasharray="5 4"/>
  <text x="785" y="79" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="13" font-weight="400" fill="#065f56" text-anchor="middle">接请求</text>
  <rect x="30" y="170" width="390" height="56" rx="8" fill="var(--color-control, #66716d)" stroke="var(--color-ink, #17211f)" stroke-width="1.5"/>
  <text x="225" y="194" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="14" font-weight="700" fill="var(--color-ink-inverse, #ffffff)" text-anchor="middle">全局补丁</text>
  <text x="225" y="213" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="13" font-weight="400" fill="var(--color-ink-inverse, #ffffff)" text-anchor="middle">块大小 2048 在这批里</text>
  <rect x="480" y="170" width="170" height="56" rx="8" fill="var(--color-weight, #c78300)" stroke="var(--color-ink, #17211f)" stroke-width="1.5"/>
  <text x="565" y="194" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="14" font-weight="700" fill="var(--color-ink-inverse, #ffffff)" text-anchor="middle">Worker 补丁</text>
  <text x="565" y="213" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="13" font-weight="400" fill="var(--color-ink-inverse, #ffffff)" text-anchor="middle">40 层怎么算</text>
</svg>
