  <text x="382" y="89.5" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="12.5" font-weight="400" fill="var(--color-ink-muted, #5b6763)">函数体只有四行</text>
  <path d="M400 108 L400 130 L230 130 L230 156" fill="none" stroke="var(--color-control, #5b6763)" stroke-width="1.8"/>
