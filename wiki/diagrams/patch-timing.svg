  <text x="560" y="476" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="13.5" font-weight="400" fill="var(--color-ink-muted, #66716d)" font-style="italic">之后用到：建通信组、加载权重、第 4–5 站</text>
