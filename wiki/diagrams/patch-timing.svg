  <path d="M500 108 L500 130 L670 130 L670 156" fill="none" stroke="var(--color-weight, #b87a00)" stroke-width="1.8"/>
  <path d="M670 156 l-5.5 -11 l11 0 z" fill="var(--color-weight, #b87a00)"/>
  <text x="20" y="430" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="12.5" font-weight="400" fill="var(--color-ink-muted, #5b6763)">没有第三种时机。生效方式是 import 的副作用，没有注册表——所以「顺序」就是两个 __init__.py 里 import 语句的顺序。</text>
  <text x="20" y="448" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="12.5" font-weight="400" fill="var(--color-ink-muted, #5b6763)">在 NPUWorker.__init__ 里，adapt_patch() 排在注册算子、解 AscendConfig、super().__init__() 之前：后面那些都要用被改过的上游行为。</text>
