layout: figure
id: patch-timing
caption: 上半是 global patch：平台准备钩子和三个通用插件入口都会调同一个分流函数，同一进程里只有第一次真正导入 patch/platform；下半是 worker patch：NPUWorker 构造函数第一步调分流函数导入 patch/worker，打完才登记昇腾算子、建 Ascend 配置、初始化基类。两个目录的入口文件按芯片、vLLM 版本、环境变量等条件决定导入哪些文件，导入时文件里的赋值语句完成替换。最下面是两个目录之外、按配置才导入的零散入口
size: [900, 560]
