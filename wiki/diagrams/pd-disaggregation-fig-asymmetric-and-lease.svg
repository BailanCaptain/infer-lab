<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 470" width="900" height="470" role="img" aria-label="PD 分离非对称实例配比约束、GLM 1P1D 代价比例与源块释放协议对照图" font-family="var(--font-sans)">
  <title>PD 分离非对称实例配比、GLM 直拆代价与源块释放协议对照</title>
  <desc>is_kv_producer, is_kv_consumer, _decode_pp_size, _kv_lease_duration, _heartbeat_interval</desc>
  <defs>
    <marker id="pd-arr-plum" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto">
      <path d="M0 1.5L9 5L0 8.5z" fill="#9a4b86"/>
    </marker>
    <marker id="pd-arr-teal" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto">
      <path d="M0 1.5L9 5L0 8.5z" fill="#087f73"/>
    </marker>
  </defs>

  <!-- Section 1: Asymmetric P vs D & GLM 1P1D proportional bar -->
  <circle cx="24" cy="24" r="12" fill="#c78300"/>
  <text x="24" y="28.5" text-anchor="middle" font-size="12.5" font-weight="700" fill="#ffffff">1</text>
  <text x="44" y="30" font-size="16" font-weight="700" fill="#17211f">P / D 非对称配比约束，以及双机 GLM 硬拆 1P1D 的显存与通信代价</text>

  <!-- Left: P Node -->
  <rect x="14" y="48" width="252" height="122" rx="8" fill="#fff4cf" stroke="#c78300" stroke-width="1.5"/>
  <text x="22" y="72" font-size="15" font-weight="700" fill="#936300">P 实例（kv_producer）</text>
  <text x="22" y="96" font-size="13" fill="#17211f">算力受限：TP / PP / PCP 压 TTFT</text>
  <text x="22" y="118" font-size="13" fill="#4d5652">约束：非 MLA 须 TP_P % TP_D == 0</text>
  <text x="22" y="140" font-size="12.5" fill="#4d5652">交棒：min=max=1；混合 N&gt;1 截末位</text>
  <text x="22" y="160" font-size="13" font-weight="700" fill="#936300">V1 押源块至收完/超时，抢占碰不到</text>

  <!-- Center: RDMA Bridge -->
  <line x1="268" y1="96" x2="362" y2="96" stroke="#9a4b86" stroke-width="2.2" marker-end="url(#pd-arr-plum)"/>
  <text x="315" y="84" text-anchor="middle" font-size="14" font-weight="700" fill="#7a3a6a">P2P 搬 KV</text>
  <text x="315" y="116" text-anchor="middle" font-size="13" fill="#66716d">双边暂占显存</text>
  <rect x="268" y="132" width="94" height="30" rx="5" fill="#fff0e9" stroke="#b54237" stroke-width="1.2"/>
  <text x="315" y="152" text-anchor="middle" font-size="12" font-weight="700" fill="#8f3229">V2 拒 kv_both</text>

  <!-- Right: D Node -->
  <rect x="368" y="48" width="258" height="122" rx="8" fill="#ddf4ef" stroke="#087f73" stroke-width="1.5"/>
  <text x="376" y="72" font-size="15" font-weight="700" fill="#065f56">D 实例（kv_consumer）</text>
  <text x="376" y="96" font-size="13" fill="#17211f">带宽受限：大 DP / EP；V1 强制 PP=1</text>
  <text x="376" y="118" font-size="12.5" fill="#4d5652">先借块挂 WAITING_FOR_REMOTE_KVS</text>
  <text x="376" y="140" font-size="13" fill="#4d5652">等待排 0 token，留纯净 decode 图</text>
  <text x="376" y="160" font-size="13" font-weight="700" fill="#065f56">V1 抢占不重拉旧 P 块；D 自采首词</text>

  <!-- Far Right: GLM 1P1D Proportional Bar -->
  <rect x="638" y="48" width="248" height="122" rx="8" fill="#fff0e9" stroke="#b54237" stroke-width="1.4" stroke-dasharray="5 3"/>
  <text x="654" y="72" font-size="14.5" font-weight="700" fill="#8f3229">GLM 双机直拆 1P1D 代价</text>
  <text x="654" y="94" font-size="13.5" fill="#4d5652">双机混部 EP16（MC2 ✓）</text>
  <rect x="654" y="100" width="214" height="18" rx="4" fill="#087f73" fill-opacity="0.22" stroke="#087f73" stroke-width="1.2"/>
  <text x="761" y="114" text-anchor="middle" font-size="13.5" font-weight="700" fill="#065f56">3,908 块 · 18 专家/卡</text>
  <text x="654" y="138" font-size="13.5" fill="#8f3229">直拆 EP8（退 AllGather ✗）</text>
  <!-- 1577 / 3908 * 214 = 86.3px -->
  <rect x="654" y="144" width="86" height="18" rx="4" fill="#b54237" fill-opacity="0.24" stroke="#b54237" stroke-width="1.2"/>
  <rect x="740" y="144" width="128" height="18" rx="4" fill="#ece9df" stroke="#d8d8cf" stroke-width="1" stroke-dasharray="3 2"/>
  <text x="804" y="157" text-anchor="middle" font-size="12.5" font-weight="700" fill="#8f3229">1,577 块 · 36 专家</text>

  <!-- Divider -->
  <line x1="16" y1="194" x2="884" y2="194" stroke="#d8d8cf" stroke-width="1.4" stroke-dasharray="6 4"/>

  <!-- Section 2: Release Protocol Timeline Comparison -->
  <circle cx="24" cy="222" r="12" fill="#9a4b86"/>
  <text x="24" y="226.5" text-anchor="middle" font-size="12.5" font-weight="700" fill="#ffffff">2</text>
  <text x="44" y="228" font-size="16" font-weight="700" fill="#17211f">P 源块何时释放：Mooncake V1 固定超时兜底 vs 上游 NIXL 动态心跳租约</text>

  <!-- Lane A: Mooncake V1 -->
  <text x="16" y="266" font-size="14.5" font-weight="700" fill="#7a3a6a">Mooncake V1</text>
  <text x="16" y="286" font-size="13.5" fill="#66716d">昇腾基线协议</text>

  <line x1="156" y1="274" x2="868" y2="274" stroke="#b8bcb5" stroke-width="1.6"/>
  <!-- P finish -->
  <circle cx="156" cy="274" r="5" fill="#c78300"/>
  <text x="156" y="258" text-anchor="middle" font-size="13.5" font-weight="700" fill="#936300">P 算完押块</text>
  <!-- Normal release -->
  <rect x="156" y="262" width="196" height="24" rx="4" fill="#f7e7f2" stroke="#9a4b86" stroke-width="1.3"/>
  <text x="254" y="279" text-anchor="middle" font-size="13.5" fill="#7a3a6a">D 读完/失败发通知</text>
  <circle cx="352" cy="274" r="5" fill="#087f73"/>
  <text x="352" y="308" text-anchor="middle" font-size="13.5" font-weight="700" fill="#065f56">正常/失败即放块</text>
  <!-- Timeout fallback -->
  <rect x="352" y="262" width="430" height="24" rx="4" fill="#fff0e9" stroke="#b54237" stroke-width="1.3" stroke-dasharray="5 3"/>
  <text x="567" y="279" text-anchor="middle" font-size="13.5" fill="#8f3229">若 D 失联无回音：持续押块（不可抢占），直至 480 s 兜底</text>
  <circle cx="782" cy="274" r="5.5" fill="#b54237"/>
  <text x="826" y="258" text-anchor="middle" font-size="13.5" font-weight="700" fill="#8f3229">480 s 强放</text>
  <text x="640" y="308" text-anchor="middle" font-size="13.5" fill="#66716d">（D2RH 改两跳落 D 主机 DRAM，首跳完即可提前放 P）</text>

  <!-- Lane B: NIXL Lease -->
  <text x="16" y="366" font-size="14.5" font-weight="700" fill="#3a4f93">上游 NIXL</text>
  <text x="16" y="386" font-size="13.5" fill="#66716d">CUDA 拉取对照</text>

  <line x1="156" y1="374" x2="868" y2="374" stroke="#b8bcb5" stroke-width="1.6"/>
  <circle cx="156" cy="374" r="5" fill="#4c65b6"/>
  <text x="156" y="358" text-anchor="middle" font-size="13.5" font-weight="700" fill="#3a4f93">初始 30 s</text>
  <!-- Initial lease bar -->
  <rect x="156" y="362" width="210" height="24" rx="4" fill="#e8edff" stroke="#4c65b6" stroke-width="1.3"/>
  <text x="261" y="379" text-anchor="middle" font-size="13.5" fill="#3a4f93">D 排队每 5 s 发心跳</text>
  <!-- Heartbeat ticks on bar top edge so text stays unobstructed -->
  <circle cx="216" cy="362" r="4" fill="#087f73"/>
  <circle cx="276" cy="362" r="4" fill="#087f73"/>
  <circle cx="336" cy="362" r="4" fill="#087f73"/>
  <!-- Extended window -->
  <rect x="366" y="362" width="194" height="24" rx="4" fill="#ddf4ef" stroke="#087f73" stroke-width="1.3"/>
  <text x="463" y="379" text-anchor="middle" font-size="13.5" fill="#065f56">max(到期, t_hb+20) 续约</text>
  <!-- Early release / Lost expiry -->
  <rect x="576" y="352" width="292" height="46" rx="6" fill="#ece9df" stroke="#b8bcb5" stroke-width="1.2"/>
  <text x="590" y="372" font-size="13.5" font-weight="700" fill="#17211f">消费齐即早放；失联按短租约快收</text>
  <text x="590" y="391" font-size="13.5" fill="#66716d">跨轮 D 留块 480 s 固定 TTL（另表）</text>

  <!-- Bottom note -->
  <rect x="16" y="420" width="868" height="38" rx="6" fill="#ece9df" stroke="#d8d8cf" stroke-width="1.2"/>
  <text x="26" y="444" font-size="12.5" fill="#4d5652">核心差异：Mooncake V1 靠单次完成通知 + 480 s 超时兜底；NIXL 靠排队期心跳把“故障慢回收”与“排队丢状态”解耦（详见后文时间尺）。</text>
</svg>
