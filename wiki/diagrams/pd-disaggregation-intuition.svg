<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 470" width="900" height="470" role="img" aria-label="未分块、未开投机解码的直观对照。上面是默认混部：生成中的请求 A、B 每步各算 1 个位置，新来一条 4 个 token 的提示词后，这一步变成 1 + 1 + 4 = 6 个位置，A、B 要等它一起算完。下面是 PD 分离：P 实例把提示词算成历史 KV cache 传给 D 实例继续逐步生成，D 的 decode 步不再被长提示词插入打断。长提示词可分块，开启投机时可一次处理多个候选；框只示意角色分工，不代表固定卡数。">
  <title>未分块、未开投机解码的直观对照。上面是默认混部：生成中的请求 A、B 每步各算 1 个位置，新来一条 4 个 token 的提示词后，这一步变成 1 + 1 + 4 = 6 个位置，A、B 要等它一起算完。下面是 PD 分离：P 实例把提示词算成历史 KV cache 传给 D 实例继续逐步生成，D 的 decode 步不再被长提示词插入打断。长提示词可分块，开启投机时可一次处理多个候选；框只示意角色分工，不代表固定卡数。</title>
  <defs><marker id="pd-disaggregation-intuition-ah-ink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="var(--color-ink, #17211f)"/></marker><marker id="pd-disaggregation-intuition-ah-comm" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="var(--color-comm, #9a4b86)"/></marker></defs>
  <rect x="20" y="50" width="860" height="150" rx="16" fill="none" stroke="var(--color-line-strong, #b8bcb5)" stroke-width="1.5"/>
  <text x="36" y="38" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="15" font-weight="700" fill="var(--color-ink, #17211f)">混部（默认）：同一实例同时处理 prefill 与 decode</text>
  <rect x="20" y="250" width="370" height="180" rx="16" fill="none" stroke="var(--color-line-strong, #b8bcb5)" stroke-width="1.5"/>
  <text x="36" y="238" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="15" font-weight="700" fill="var(--color-ink, #17211f)">P 实例：只做 prefill</text>
  <rect x="510" y="250" width="370" height="180" rx="16" fill="none" stroke="var(--color-line-strong, #b8bcb5)" stroke-width="1.5"/>
  <text x="526" y="238" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="15" font-weight="700" fill="var(--color-ink, #17211f)">D 实例：只做 decode</text>
  <path d="M215 83 L475 83" fill="none" stroke="var(--color-ink, #17211f)" stroke-width="1.4" marker-end="url(#pd-disaggregation-intuition-ah-ink)"/>
  <path d="M215 167 L475 167" fill="none" stroke="var(--color-ink, #17211f)" stroke-width="1.4" marker-end="url(#pd-disaggregation-intuition-ah-ink)"/>
  <path d="M425 125 L475 125" fill="none" stroke="var(--color-ink, #17211f)" stroke-width="1.4" marker-end="url(#pd-disaggregation-intuition-ah-ink)"/>
  <path d="M665 125 L710 125" fill="none" stroke="var(--color-ink, #17211f)" stroke-width="1.4" marker-end="url(#pd-disaggregation-intuition-ah-ink)"/>
  <path d="M190 306 L220 306" fill="none" stroke="var(--color-ink, #17211f)" stroke-width="1.4" marker-end="url(#pd-disaggregation-intuition-ah-ink)"/>
  <path d="M295 332 L295 360" fill="none" stroke="var(--color-ink, #17211f)" stroke-width="1.4" marker-end="url(#pd-disaggregation-intuition-ah-ink)"/>
  <path d="M330 386 L530 386" fill="none" stroke="var(--color-comm, #9a4b86)" stroke-width="2.2" marker-end="url(#pd-disaggregation-intuition-ah-comm)"/>
  <path d="M615 360 L615 332" fill="none" stroke="var(--color-ink, #17211f)" stroke-width="1.4" marker-end="url(#pd-disaggregation-intuition-ah-ink)"/>
  <path d="M700 306 L730 306" fill="none" stroke="var(--color-ink, #17211f)" stroke-width="1.4" marker-end="url(#pd-disaggregation-intuition-ah-ink)"/>
  <rect x="45" y="62" width="170" height="42" rx="8" fill="var(--color-token-soft, #ddf4ef)" stroke="var(--color-token, #087f73)" stroke-width="1.4"/>
  <text x="130" y="79" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="14" font-weight="700" fill="var(--color-ink, #17211f)" text-anchor="middle">生成中的请求 A</text>
  <text x="130" y="98" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="13" font-weight="400" fill="#065f56" text-anchor="middle">这一步 1 个新位置</text>
  <rect x="45" y="146" width="170" height="42" rx="8" fill="var(--color-token-soft, #ddf4ef)" stroke="var(--color-token, #087f73)" stroke-width="1.4"/>
  <text x="130" y="163" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="14" font-weight="700" fill="var(--color-ink, #17211f)" text-anchor="middle">生成中的请求 B</text>
  <text x="130" y="182" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="13" font-weight="400" fill="#065f56" text-anchor="middle">这一步 1 个新位置</text>
  <rect x="255" y="98" width="170" height="54" rx="8" fill="var(--color-token-soft, #ddf4ef)" stroke="var(--color-token, #087f73)" stroke-width="1.4"/>
  <text x="340" y="121" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="14" font-weight="700" fill="var(--color-ink, #17211f)" text-anchor="middle">新请求的提示词</text>
  <text x="340" y="140" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="13" font-weight="400" fill="#065f56" text-anchor="middle">示意 4 个 token</text>
  <rect x="475" y="70" width="190" height="110" rx="8" fill="var(--color-weight-soft, #fff4cf)" stroke="var(--color-weight, #c78300)" stroke-width="1.4"/>
  <text x="570" y="121" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="14" font-weight="700" fill="var(--color-ink, #17211f)" text-anchor="middle">同一步一起算</text>
  <text x="570" y="140" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="13" font-weight="400" fill="#936300" text-anchor="middle">1 + 1 + 4 = 6 个位置</text>
  <rect x="710" y="98" width="150" height="54" rx="8" fill="var(--color-token-soft, #ddf4ef)" stroke="var(--color-token, #087f73)" stroke-width="1.4"/>
  <text x="785" y="130" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="14" font-weight="700" fill="var(--color-ink, #17211f)" text-anchor="middle">各自的下一个 token</text>
  <rect x="40" y="280" width="150" height="52" rx="8" fill="var(--color-token-soft, #ddf4ef)" stroke="var(--color-token, #087f73)" stroke-width="1.4"/>
  <text x="115" y="302" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="14" font-weight="700" fill="var(--color-ink, #17211f)" text-anchor="middle">新请求的提示词</text>
  <text x="115" y="321" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="13" font-weight="400" fill="#065f56" text-anchor="middle">示意 4 个 token</text>
  <rect x="220" y="280" width="150" height="52" rx="8" fill="var(--color-weight-soft, #fff4cf)" stroke="var(--color-weight, #c78300)" stroke-width="1.4"/>
  <text x="295" y="302" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="14" font-weight="700" fill="var(--color-ink, #17211f)" text-anchor="middle">prefill</text>
  <text x="295" y="321" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="13" font-weight="400" fill="#936300" text-anchor="middle">一次把整段算完</text>
  <rect x="130" y="360" width="200" height="52" rx="8" fill="var(--color-kv-soft, #e8edff)" stroke="var(--color-kv, #4c65b6)" stroke-width="1.4"/>
  <text x="230" y="382" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="14" font-weight="700" fill="var(--color-ink, #17211f)" text-anchor="middle">历史 KV cache</text>
  <text x="230" y="401" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="13" font-weight="400" fill="#3a4f93" text-anchor="middle">算完的键值块准备跨实例传输</text>
  <rect x="530" y="360" width="170" height="52" rx="8" fill="var(--color-kv-soft, #e8edff)" stroke="var(--color-kv, #4c65b6)" stroke-width="1.4"/>
  <text x="615" y="391" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="14" font-weight="700" fill="var(--color-ink, #17211f)" text-anchor="middle">写入 D 自己的 KV 块池</text>
  <rect x="530" y="280" width="170" height="52" rx="8" fill="var(--color-weight-soft, #fff4cf)" stroke="var(--color-weight, #c78300)" stroke-width="1.4"/>
  <text x="615" y="302" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="14" font-weight="700" fill="var(--color-ink, #17211f)" text-anchor="middle">decode</text>
  <text x="615" y="321" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="13" font-weight="400" fill="#936300" text-anchor="middle">一步一个 token</text>
  <rect x="730" y="286" width="130" height="40" rx="8" fill="var(--color-token-soft, #ddf4ef)" stroke="var(--color-token, #087f73)" stroke-width="1.4"/>
  <text x="795" y="311" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="14" font-weight="700" fill="var(--color-ink, #17211f)" text-anchor="middle">y₀ y₁ y₂ …</text>
  <text x="450" y="18" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="13.5" font-weight="700" fill="var(--color-ink, #17211f)" text-anchor="middle">同一条请求的两个阶段：放在同一实例混着跑，还是拆给 P / D 两类实例</text>
  <text x="450" y="376" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="13.5" font-weight="400" fill="#7a3a6a" text-anchor="middle">跨实例传输 KV</text>
  <text x="450" y="458" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="13.5" font-weight="400" fill="var(--color-ink-muted, #66716d)" text-anchor="middle" font-style="italic">拆开以后多出一次 KV 传输交接：D 拿到键值块之前，这条请求需等待传输完成</text>
</svg>
