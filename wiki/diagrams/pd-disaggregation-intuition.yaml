layout: figure
id: pd-disaggregation-intuition
caption: 未分块、未开投机解码的直观对照。上面是默认混部：生成中的请求 A、B 每步各算 1 个位置，新来一条 4 个 token 的提示词后，这一步变成 1 + 1 + 4 = 6 个位置，A、B 要等它一起算完。下面是 PD 分离：P 实例把提示词算成历史 KV cache 传给 D 实例继续逐步生成，D 的 decode 步不再被长提示词插入打断。长提示词可分块，开启投机时可一次处理多个候选；框只示意角色分工，不代表固定卡数。
size: [900, 470]
frames:
  - { at: [20, 50], size: [860, 150], label: 混部（默认）：同一实例同时处理 prefill 与 decode }
  - { at: [20, 250], size: [370, 180], label: P 实例：只做 prefill }
  - { at: [510, 250], size: [370, 180], label: D 实例：只做 decode }
items:
  - { at: [45, 62], size: [170, 42], text: 生成中的请求 A, sub: 这一步 1 个新位置, tone: token }
  - { at: [45, 146], size: [170, 42], text: 生成中的请求 B, sub: 这一步 1 个新位置, tone: token }
  - { at: [255, 98], size: [170, 54], text: 新请求的提示词, sub: 示意 4 个 token, tone: token }
  - { at: [475, 70], size: [190, 110], text: 同一步一起算, sub: 1 + 1 + 4 = 6 个位置, tone: weight }
  - { at: [710, 98], size: [150, 54], text: 各自的下一个 token, tone: token }
  - { at: [40, 280], size: [150, 52], text: 新请求的提示词, sub: 示意 4 个 token, tone: token }
  - { at: [220, 280], size: [150, 52], text: prefill, sub: 一次把整段算完, tone: weight }
  - { at: [130, 360], size: [200, 52], text: 历史 KV cache, sub: 算完的键值块准备跨实例传输, tone: kv }
  - { at: [530, 360], size: [170, 52], text: 写入 D 自己的 KV 块池, tone: kv }
  - { at: [530, 280], size: [170, 52], text: decode, sub: 一步一个 token, tone: weight }
