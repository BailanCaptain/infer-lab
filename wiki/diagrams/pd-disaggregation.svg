<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 660" width="900" height="660" role="img" aria-label="状态交接的逻辑顺序：P 保留来源状态，D 分配目的块并接收；完成信息分别触发继续执行和源块释放。图不表示固定耗时或 GLM 已验证部署">
  <title>状态交接的逻辑顺序：P 保留来源状态，D 分配目的块并接收；完成信息分别触发继续执行和源块释放。图不表示固定耗时或 GLM 已验证部署</title>
  <defs><marker id="pd-disaggregation-ah-kv" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="var(--color-kv, #4c65b6)"/></marker><marker id="pd-disaggregation-ah-control" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="var(--color-control, #66716d)"/></marker><marker id="pd-disaggregation-ah-token" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="var(--color-token, #087f73)"/></marker></defs>
  <rect x="30" y="60" width="340" height="540" rx="16" fill="none" stroke="var(--color-line-strong, #b8bcb5)" stroke-width="1.5"/>
  <text x="46" y="48" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="15" font-weight="700" fill="var(--color-ink, #17211f)">P 执行组</text>
  <rect x="530" y="60" width="340" height="540" rx="16" fill="none" stroke="var(--color-line-strong, #b8bcb5)" stroke-width="1.5"/>
  <text x="546" y="48" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="15" font-weight="700" fill="var(--color-ink, #17211f)">D 执行组</text>
  <path d="M200 160 L200 270" fill="none" stroke="var(--color-kv, #4c65b6)" stroke-width="1.4" marker-end="url(#pd-disaggregation-ah-kv)"/>
  <path d="M335 287 L565 287" fill="none" stroke="var(--color-control, #66716d)" stroke-width="1.4" marker-end="url(#pd-disaggregation-ah-control)"/>
  <path d="M335 325 L445 325 L445 430 L565 430" fill="none" stroke="var(--color-kv, #4c65b6)" stroke-width="1.4" marker-end="url(#pd-disaggregation-ah-kv)"/>
  <path d="M700 315 L700 405" fill="none" stroke="var(--color-control, #66716d)" stroke-width="1.4" marker-end="url(#pd-disaggregation-ah-control)"/>
  <path d="M700 460 L700 510" fill="none" stroke="var(--color-token, #087f73)" stroke-width="1.4" marker-end="url(#pd-disaggregation-ah-token)"/>
  <path d="M565 450 L470 450 L470 537 L335 537" fill="none" stroke="var(--color-control, #66716d)" stroke-width="1.4" marker-end="url(#pd-disaggregation-ah-control)"/>
  <rect x="65" y="105" width="270" height="55" rx="8" fill="var(--color-token, #087f73)" stroke="var(--color-ink, #17211f)" stroke-width="1.5"/>
  <text x="200" y="137.5" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="14" font-weight="700" fill="var(--color-ink-inverse, #ffffff)" text-anchor="middle">计算到交接位置</text>
  <rect x="65" y="270" width="270" height="65" rx="8" fill="var(--color-kv, #4c65b6)" stroke="var(--color-ink, #17211f)" stroke-width="1.5"/>
  <text x="200" y="298.5" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="14" font-weight="700" fill="var(--color-ink-inverse, #ffffff)" text-anchor="middle">保留来源状态</text>
  <text x="200" y="317.5" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="13" font-weight="400" fill="var(--color-ink-inverse, #ffffff)" text-anchor="middle">发布块 / 位置元数据</text>
  <rect x="65" y="510" width="270" height="55" rx="8" fill="var(--color-control, #66716d)" stroke="var(--color-ink, #17211f)" stroke-width="1.5"/>
  <text x="200" y="542.5" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="14" font-weight="700" fill="var(--color-ink-inverse, #ffffff)" text-anchor="middle">释放传输保留块</text>
  <rect x="565" y="260" width="270" height="55" rx="8" fill="var(--color-control, #66716d)" stroke="var(--color-ink, #17211f)" stroke-width="1.5"/>
  <text x="700" y="292.5" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="14" font-weight="700" fill="var(--color-ink-inverse, #ffffff)" text-anchor="middle">分配目的块</text>
  <rect x="565" y="405" width="270" height="55" rx="8" fill="var(--color-kv, #4c65b6)" stroke="var(--color-ink, #17211f)" stroke-width="1.5"/>
  <text x="700" y="437.5" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="14" font-weight="700" fill="var(--color-ink-inverse, #ffffff)" text-anchor="middle">接收状态完成</text>
  <rect x="565" y="510" width="270" height="55" rx="8" fill="var(--color-token, #087f73)" stroke="var(--color-ink, #17211f)" stroke-width="1.5"/>
  <text x="700" y="542.5" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="14" font-weight="700" fill="var(--color-ink-inverse, #ffffff)" text-anchor="middle">继续模型计算</text>
  <text x="450" y="264" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="13.5" font-weight="400" fill="#4d5652" text-anchor="middle">控制元数据</text>
  <text x="437" y="377" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="13.5" font-weight="400" fill="#3a4f93" text-anchor="end">按组搬运</text>
  <text x="450" y="577" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="13.5" font-weight="400" fill="#4d5652" text-anchor="middle">完成通知后释放</text>
  <text x="450" y="634" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="13.5" font-weight="400" fill="var(--color-ink-muted, #66716d)" text-anchor="middle" font-style="italic">源块编号和目的块编号分别属于各自的块池</text>
</svg>
