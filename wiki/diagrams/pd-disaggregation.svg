<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 240" width="900" height="240" role="img" aria-label="KV 怎么从 P 节点到 D 节点：P 算完问题留下 1 块 KV，D 把整块拉过去；D 说收完了，P 才放块，D 再重算最后 1 个 token 开始吐字（Qwen3-0.6B，1P1D）">
  <title>KV 怎么从 P 节点到 D 节点：P 算完问题留下 1 块 KV，D 把整块拉过去；D 说收完了，P 才放块，D 再重算最后 1 个 token 开始吐字（Qwen3-0.6B，1P1D）</title>
  <defs><marker id="pd-disaggregation-ah-ink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="var(--color-ink, #17211f)"/></marker><marker id="pd-disaggregation-ah-kv" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="var(--color-kv, #4c65b6)"/></marker><marker id="pd-disaggregation-ah-control" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="var(--color-control, #66716d)"/></marker></defs>
  <rect x="30" y="64" width="360" height="150" rx="16" fill="none" stroke="var(--color-line-strong, #b8bcb5)" stroke-width="1.5"/>
  <text x="46" y="52" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="15" font-weight="700" fill="var(--color-ink, #17211f)">P 节点</text>
  <rect x="510" y="64" width="360" height="150" rx="16" fill="none" stroke="var(--color-line-strong, #b8bcb5)" stroke-width="1.5"/>
  <text x="526" y="52" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="15" font-weight="700" fill="var(--color-ink, #17211f)">D 节点</text>
  <path d="M185 122 L225 122" fill="none" stroke="var(--color-ink, #17211f)" stroke-width="1.4" marker-end="url(#pd-disaggregation-ah-ink)"/>
  <path d="M355 122 L545 122" fill="none" stroke="var(--color-kv, #4c65b6)" stroke-width="1.4" marker-end="url(#pd-disaggregation-ah-kv)"/>
  <path d="M675 122 L715 122" fill="none" stroke="var(--color-ink, #17211f)" stroke-width="1.4" marker-end="url(#pd-disaggregation-ah-ink)"/>
  <path d="M610 144 L610 180 L290 180 L290 144" fill="none" stroke="var(--color-control, #66716d)" stroke-width="1.4" stroke-dasharray="7 5" marker-end="url(#pd-disaggregation-ah-control)"/>
  <rect x="55" y="100" width="130" height="44" rx="8" fill="var(--color-token, #087f73)" stroke="var(--color-ink, #17211f)" stroke-width="1.5"/>
  <text x="120" y="127" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="14" font-weight="700" fill="var(--color-ink-inverse, #ffffff)" text-anchor="middle">算 37 个 token</text>
  <rect x="225" y="100" width="130" height="44" rx="8" fill="var(--color-kv, #4c65b6)" stroke="var(--color-ink, #17211f)" stroke-width="1.5"/>
  <text x="290" y="127" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="14" font-weight="700" fill="var(--color-ink-inverse, #ffffff)" text-anchor="middle">1 块 KV</text>
  <rect x="545" y="100" width="130" height="44" rx="8" fill="var(--color-kv, #4c65b6)" stroke="var(--color-ink, #17211f)" stroke-width="1.5"/>
  <text x="610" y="127" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="14" font-weight="700" fill="var(--color-ink-inverse, #ffffff)" text-anchor="middle">1 块 KV</text>
  <rect x="715" y="100" width="130" height="44" rx="8" fill="var(--color-token, #087f73)" stroke="var(--color-ink, #17211f)" stroke-width="1.5"/>
  <text x="780" y="127" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="14" font-weight="700" fill="var(--color-ink-inverse, #ffffff)" text-anchor="middle">重算最后 1 个</text>
  <text x="450" y="110" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="13.5" font-weight="400" fill="#3a4f93" text-anchor="middle">D 整块拉过来</text>
  <text x="450" y="202" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="13.5" font-weight="400" fill="#4d5652" text-anchor="middle">收完了，P 才放块</text>
</svg>
