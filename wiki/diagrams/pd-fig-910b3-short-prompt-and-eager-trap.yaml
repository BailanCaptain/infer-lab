caption: >-
  Ascend 910B3（v0.30.0，均匀 262-token 输入 / 128-token 输出）PD 分离实测双层剖析（注：2P2D/4P4D 组同时改变拆池拓扑、双端 --enforce-eager、关闭 prefix caching、max_model_len=16384 与 30B u=0.88→0.85，属于多参数组合对照）：上层展示在 P 池运行采样全为 Running:0（8B 8/8、30B 7/7）、两跳代理、8B 每请求 216 段离散块读取（27 MiB/rank，c=1 读 207.49/346.74 ms）及 ADXL endpoint 回退告警（8B 4,991 行、30B 19,941 行）等组合条件下，c=1 TTFT 观测值为 6.07×（8B 2P2D 对 TP2）与 2.20×（30B 4P4D 对 TP4+EP4，最慢 rank 传输仅 16.64 ms 却净增 +396.97 ms）；下层对比 4P4D+Eager 组合下 48 层 MoE 后 127 步 Decode TPOT 由 77.90 升至 307.83 ms（3.952×，+229.93 ms/步，对比稠密 8B 1.729×），纯 PD 与纯 Eager 各自占比待同拓扑单变量对照拆分。
