<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 486" width="900" height="486" role="img" aria-label="钉住版本 GLM full 组 4 块变 1 块少传与 D 端断言或静默截齐分叉图" font-family="var(--font-sans)">
  <title>钉住版本 GLM full 组 4→1 少传块与 D 端整除断言或静默截齐分叉</title>
  <desc>_get_group_transfer_info, _get_transfer_block_ids, _get_kernel_block_ids, _truncate_request_for_prefill</desc>
  <defs>
    <marker id="glm-arr-danger" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto">
      <path d="M0 1.5L9 5L0 8.5z" fill="#b54237"/>
    </marker>
    <marker id="glm-arr-plum" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto">
      <path d="M0 1.5L9 5L0 8.5z" fill="#9a4b86"/>
    </marker>
    <marker id="glm-arr-ink" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto">
      <path d="M0 1.5L9 5L0 8.5z" fill="#17211f"/>
    </marker>
  </defs>

  <!-- Header -->
  <circle cx="24" cy="24" r="12" fill="#b54237"/>
  <text x="24" y="28.5" text-anchor="middle" font-size="12.5" font-weight="700" fill="#ffffff">1</text>
  <text x="44" y="30" font-size="16" font-weight="700" fill="#17211f">钉住版本 V1 在 GLM full 组的 4 → 1 块失配（示意提示词 2,000 token）</text>

  <!-- Step 0: N > 1 tail trim bar -->
  <rect x="16" y="48" width="868" height="38" rx="6" fill="#ece9df" stroke="#b8bcb5" stroke-width="1.2"/>
  <text x="30" y="72" font-size="14" fill="#17211f">混合模型 N &gt; 1 末位截断：P 交出 <tspan font-weight="700" fill="#936300">2,000 - 1 = 1,999 token</tspan>（门槛：prompt ≤ 641 时仅需 1 块，两式同得 1 不触发）</text>

  <!-- Left panel: True 4 blocks shared by MLA & Indexer -->
  <rect x="16" y="102" width="414" height="154" rx="8" fill="#e8edff" stroke="#4c65b6" stroke-width="1.5"/>
  <text x="30" y="126" font-size="14.5" font-weight="700" fill="#3a4f93">实际 full 组（MLA 与 Indexer 共用 4 个逻辑块）</text>
  <!-- 4 blocks -->
  <g stroke="#4c65b6" stroke-width="1.4" fill="#ffffff">
    <rect x="30" y="140" width="88" height="44" rx="5"/>
    <rect x="128" y="140" width="88" height="44" rx="5"/>
    <rect x="226" y="140" width="88" height="44" rx="5"/>
    <rect x="324" y="140" width="88" height="44" rx="5"/>
  </g>
  <g text-anchor="middle" font-size="13.5">
    <text x="74" y="160" font-weight="700" fill="#3a4f93">块 B0</text>
    <text x="74" y="177" fill="#66716d">0–639</text>
    <text x="172" y="160" font-weight="700" fill="#3a4f93">块 B1</text>
    <text x="172" y="177" fill="#66716d">640–1279</text>
    <text x="270" y="160" font-weight="700" fill="#3a4f93">块 B2</text>
    <text x="270" y="177" fill="#66716d">1280–1919</text>
    <text x="368" y="160" font-weight="700" fill="#3a4f93">块 B3</text>
    <text x="368" y="177" fill="#66716d">1920–1998</text>
  </g>
  <text x="30" y="208" font-size="13.5" fill="#17211f">MLA（压缩比 1）+ Indexer（块内 4:1）共用同一套块号</text>
  <text x="30" y="232" font-size="14" font-weight="700" fill="#3a4f93">应传块数 = ⌈1,999 ÷ 640⌉ = 4 块</text>

  <!-- Arrow between left and right -->
  <line x1="432" y1="176" x2="466" y2="176" stroke="#b54237" stroke-width="2.2" marker-end="url(#glm-arr-danger)"/>

  <!-- Right panel: V1 Bug 1 block selected -->
  <rect x="472" y="102" width="412" height="154" rx="8" fill="#fff0e9" stroke="#b54237" stroke-width="1.5"/>
  <text x="486" y="126" font-size="14.5" font-weight="700" fill="#8f3229">V1 误算：遍历覆盖压缩比为 4 → 仅选 1 块</text>
  <!-- 1 selected + 3 dropped -->
  <rect x="486" y="140" width="88" height="44" rx="5" fill="#ddf4ef" stroke="#087f73" stroke-width="1.6"/>
  <text x="530" y="160" text-anchor="middle" font-size="13.5" font-weight="700" fill="#065f56">块 B0 ✓</text>
  <text x="530" y="177" text-anchor="middle" font-size="13.5" fill="#065f56">仅传此块</text>
  <g stroke="#b54237" stroke-width="1.4" stroke-dasharray="4 3" fill="#ffffff" fill-opacity="0.7">
    <rect x="584" y="140" width="88" height="44" rx="5"/>
    <rect x="682" y="140" width="88" height="44" rx="5"/>
    <rect x="780" y="140" width="88" height="44" rx="5"/>
  </g>
  <g text-anchor="middle" font-size="13.5" fill="#8f3229">
    <text x="628" y="160" font-weight="700">B1 ✗</text>
    <text x="628" y="177">被裁掉</text>
    <text x="726" y="160" font-weight="700">B2 ✗</text>
    <text x="726" y="177">被裁掉</text>
    <text x="824" y="160" font-weight="700">B3 ✗</text>
    <text x="824" y="177">被裁掉</text>
  </g>
  <text x="486" y="208" font-size="13.5" fill="#17211f">误算单块跨度：640 × 4 = 2,560 位置/块</text>
  <text x="486" y="232" font-size="14" font-weight="700" fill="#8f3229">实选块数 = ⌈1,999 ÷ 2,560⌉ = 1 块（4 → 1）</text>

  <!-- Connector down to D-side check -->
  <line x1="678" y1="256" x2="678" y2="274" stroke="#17211f" stroke-width="1.6"/>
  <path d="M678 274 H450 V284" fill="none" stroke="#17211f" stroke-width="1.6" marker-end="url(#glm-arr-ink)"/>

  <!-- Section 2: D-side Divisibility Check & Two Outcomes -->
  <rect x="132" y="290" width="636" height="62" rx="8" fill="#fff4cf" stroke="#c78300" stroke-width="1.6"/>
  <text x="450" y="314" text-anchor="middle" font-size="14.5" font-weight="700" fill="#936300">D 端 _get_kernel_block_ids 整除校验：remote_block_size % kernel_size == 0</text>
  <text x="450" y="338" text-anchor="middle" font-size="13.5" fill="#4d5652">P 报来最小组块长 remote_block_size = 4（D worker 实际 kernel_size 缺双机运行实测，待核）</text>

  <!-- Branch arrows -->
  <path d="M320 352 V372 H222 V382" fill="none" stroke="#b54237" stroke-width="1.8" marker-end="url(#glm-arr-danger)"/>
  <path d="M580 352 V372 H678 V382" fill="none" stroke="#9a4b86" stroke-width="1.8" marker-end="url(#glm-arr-plum)"/>

  <!-- Branch A: AssertionError -->
  <rect x="16" y="388" width="412" height="86" rx="8" fill="#fff0e9" stroke="#b54237" stroke-width="1.5"/>
  <text x="30" y="414" font-size="15" font-weight="700" fill="#8f3229">分支 A · 整除不通过 → 断言失败</text>
  <text x="30" y="438" font-size="13.5" fill="#17211f">在截齐之前直接抛 AssertionError 中止交接</text>
  <text x="30" y="460" font-size="13.5" fill="#66716d">静态读码无法定案是否先撞此处，待双机实跑验证</text>

  <!-- Branch B: Silent Truncation -->
  <rect x="472" y="388" width="412" height="86" rx="8" fill="#f7e7f2" stroke="#9a4b86" stroke-width="1.5"/>
  <text x="486" y="412" font-size="15" font-weight="700" fill="#7a3a6a">分支 B · 校验通过 → 截齐后 3 个目的块未写入</text>
  <!-- 4 destination blocks -->
  <rect x="486" y="422" width="84" height="24" rx="4" fill="#ddf4ef" stroke="#087f73" stroke-width="1.3"/>
  <text x="528" y="439" text-anchor="middle" font-size="13.5" font-weight="700" fill="#065f56">D0 ← B0</text>
  <g stroke="#b54237" stroke-width="1.3" stroke-dasharray="3 2" fill="#fff0e9">
    <rect x="578" y="422" width="90" height="24" rx="4"/>
    <rect x="676" y="422" width="90" height="24" rx="4"/>
    <rect x="774" y="422" width="90" height="24" rx="4"/>
  </g>
  <g text-anchor="middle" font-size="13.5" fill="#8f3229">
    <text x="623" y="439">D1 未写入</text>
    <text x="721" y="439">D2 未写入</text>
    <text x="819" y="439">D3 未写入</text>
  </g>
  <text x="486" y="466" font-size="13.5" fill="#7a3a6a">min(1, 4) 不报错，调度器仍按 1,999 位已算好继续</text>
</svg>
