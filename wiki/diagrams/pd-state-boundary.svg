<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 430" width="900" height="430" role="img" aria-label="need_truncate 且 N=4 的教学路径：P 处理前三个输入形成 S₃；D 从这一边界处理 p₃ 得到 S₄。S 表示完整所需历史，不表示某一层或一块 KV">
