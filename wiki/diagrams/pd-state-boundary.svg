<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 540" width="900" height="540" role="img" aria-label="以 R1 的 4 个提示词 token 为例看交接点。上面是 GLM 这类带递推状态的混合模型：P 故意少算最后 1 个位置，交出「处理完 3 个位置」的状态 S₃，D 只算 p₃。S₃ 包含 MLA 历史、indexer 的未满池尾状态及 KDA 状态；此时还没凑满 4 个位置，没有完成的 indexer 池。下面是纯注意力模型：P 算满 4 个位置，D 收到 4 格 K/V 后退回 1 格，重算 p₃ 才能采样。两种情形都由 D 算出首 token。">
  <title>以 R1 的 4 个提示词 token 为例看交接点。上面是 GLM 这类带递推状态的混合模型：P 故意少算最后 1 个位置，交出「处理完 3 个位置」的状态 S₃，D 只算 p₃。S₃ 包含 MLA 历史、indexer 的未满池尾状态及 KDA 状态；此时还没凑满 4 个位置，没有完成的 indexer 池。下面是纯注意力模型：P 算满 4 个位置，D 收到 4 格 K/V 后退回 1 格，重算 p₃ 才能采样。两种情形都由 D 算出首 token。</title>
