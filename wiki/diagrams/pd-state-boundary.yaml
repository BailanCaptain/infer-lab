layout: figure
id: pd-state-boundary
caption: 以 R1 的 4 个提示词 token 为例看交接点。上面是 GLM 这类带递推状态的混合模型：P 故意少算最后 1 个位置，交出「处理完 3 个位置」的状态 S₃，D 只算 p₃。下面是纯注意力模型：P 算满 4 个位置，D 收到 4 格 K/V 后退回 1 格，重算 p₃ 才能采样。两种情形都由 D 算出首 token。
size: [900, 540]
frames:
  - { at: [20, 50], size: [860, 200], label: 带递推状态的混合模型（GLM）：P 少算最后 1 个位置 }
  - { at: [262, 72], size: [250, 162], label: S₃：交给 D 的状态, inside: true }
  - { at: [20, 300], size: [860, 190], label: 纯注意力模型：P 算满，D 退回 1 格再算 }
grids:
  - { at: [45, 80], rows: 1, cols: 3, cell: [56, 34], tone: token, style: plain, cells: [{ at: [0, 0], text: p₀ }, { at: [0, 1], text: p₁ }, { at: [0, 2], text: p₂ }] }
  - { at: [560, 80], rows: 1, cols: 1, cell: [56, 34], tone: token, style: plain, cells: [{ at: [0, 0], text: p₃ }] }
  - { at: [45, 322], rows: 1, cols: 4, cell: [50, 34], tone: token, style: plain, cells: [{ at: [0, 0], text: p₀ }, { at: [0, 1], text: p₁ }, { at: [0, 2], text: p₂ }, { at: [0, 3], text: p₃ }] }
