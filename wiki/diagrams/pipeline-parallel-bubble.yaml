layout: figure
id: pipeline-parallel-bubble
caption: 示意：只有一条请求时两颗 NPU 轮流空等；两批请求同时在路上，两颗就都忙起来
size: [900, 300]

texts:
  - { at: [30, 34], text: 只有一条请求：总有一颗在空等, size: 14, strong: true }
  - { at: [30, 170], text: A、B 两批同时在路上：两颗都在忙, size: 14, strong: true }

