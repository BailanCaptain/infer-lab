layout: figure
id: pipeline-parallel-flow
caption: 一个 token 的隐藏向量依次流过 4 段（示意：隐藏向量缩成 2 个数，每过一层每个数加 1）。每格一行是 4 张卡，每张卡中间的琥珀色小块是它放的 2 层，上面一排是送进这一段的隐藏向量，下面一排是这一段算出来的；紫色箭头是交给下一段的隐藏向量，只有这 2 个数，层的权重留在原卡。一格里只有一张卡在算，其余的卡在等。
size: [880, 1000]
frames:
  - { label: '① 卡 0：embedding 查得 [1, 0]，过第 0、1 层，把 [3, 2] 发给卡 1', at: [8, 30], size: [864, 212] }
  - { label: '② 卡 1 过第 2、3 层，把 [5, 4] 发给卡 2', at: [8, 280], size: [864, 212] }
  - { label: '③ 卡 2 过第 4、5 层，把 [7, 6] 发给卡 3', at: [8, 530], size: [864, 212] }
  - { label: '④ 卡 3 过第 6、7 层得 [9, 8]，出口采样出下一个 token', at: [8, 780], size: [864, 212] }
grids:
  # ① 卡 0 的输入
  - { at: [76, 52], rows: 1, cols: 2, cell: [46, 30], tone: token, style: faded,
      cells: [{ at: [0, 0], text: '1' }, { at: [0, 1], text: '0' }] }
  - { at: [94, 102], rows: 2, cols: 1, cell: [56, 24], gap: 4, tone: weight, style: faded, cells: [{ at: [0, 0], text: 层 0 }, { at: [1, 0], text: 层 1 }] }
  # ① 卡 0 算出的
