  <text x="40" y="578" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="12.5" font-weight="400" fill="var(--color-ink-muted, #5b6763)">每卡的 KV 也只按自己那 14 层分：14 × 4 KiB = 56 KiB 每 token，正好是单卡 112 KiB 的一半；界线上一步只过 2 × tokens × 1024 × 2 B，</text>
  <text x="40" y="596.5" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="12.5" font-weight="400" fill="var(--color-ink-muted, #5b6763)">decode 是 4 KiB、37 个 token 的 prefill 是 148 KiB。</text>
  <text x="40" y="622" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="12.5" font-weight="600" fill="var(--color-ink, #17211f)">两段串着跑，所以一条请求填不满流水线：要靠 EngineCore 的批队列同时压住 pp_size 步，才有活让两段同时忙。</text>
