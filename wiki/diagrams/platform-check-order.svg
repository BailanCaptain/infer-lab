<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 650" width="900" height="650" role="img" aria-label="校验与改写在同一个函数里按固定先后跑：两道早退之后先认量化，再跑四个校验（任一不通过就报错退出），然后修不兼容组合并建昇腾配置，接着定编译与图模式、选 Worker 类、定块大小，最后三条按 PD 角色的检查。四个校验里管着本部署的是并行那一条，因为这里 DP 是 2">
  <title>校验与改写在同一个函数里按固定先后跑：两道早退之后先认量化，再跑四个校验（任一不通过就报错退出），然后修不兼容组合并建昇腾配置，接着定编译与图模式、选 Worker 类、定块大小，最后三条按 PD 角色的检查。四个校验里管着本部署的是并行那一条，因为这里 DP 是 2</title>
  <defs><marker id="platform-check-order-ah-control" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="var(--color-control, #66716d)"/></marker><marker id="platform-check-order-ah-danger" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="var(--color-danger, #b54237)"/></marker><marker id="platform-check-order-ah-comm" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="var(--color-comm, #9a4b86)"/></marker><marker id="platform-check-order-ah-weight" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="var(--color-weight, #c78300)"/></marker></defs>
  <path d="M149 126 L149 152" fill="none" stroke="var(--color-control, #66716d)" stroke-width="1.4" marker-end="url(#platform-check-order-ah-control)"/>
