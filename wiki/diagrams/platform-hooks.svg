<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 464" width="900" height="464" role="img" aria-label="上游在启动过程里向 Platform 问问题的那几个时刻">
  <title>上游在启动过程里向 Platform 问问题的那几个时刻</title>
  <rect width="900" height="464" fill="var(--color-surface, #fbfaf6)"/>
  <rect x="20" y="40" width="860" height="372" rx="12" fill="var(--color-surface-sunken, #ece9df)"/>
  <rect x="36" y="54" width="111.6" height="26.5" rx="13.3" fill="var(--color-control, #5b6763)"/><text x="47" y="72.1" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="13.5" font-weight="700" fill="var(--color-ink-inverse, #ffffff)">vLLM 启动过程</text>
  <text x="38" y="97" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="12.5" font-weight="400" fill="var(--color-ink-muted, #5b6763)">每个站点都是上游主动来问硬件插件一句。插件能改的，就是这些时刻。</text>
