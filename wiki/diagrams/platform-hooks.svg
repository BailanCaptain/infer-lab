<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 400" width="880" height="400" role="img" aria-label="同一组问题，两种设备各给一列答案：上游调用点只管提问，当前平台在启动时被选中一个，换设备只换右边这一列。浅框内是同一组方法，不是调用路上的一站">
  <title>同一组问题，两种设备各给一列答案：上游调用点只管提问，当前平台在启动时被选中一个，换设备只换右边这一列。浅框内是同一组方法，不是调用路上的一站</title>
