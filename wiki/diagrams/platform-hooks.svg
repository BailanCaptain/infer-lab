<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 300" width="880" height="300" role="img" aria-label="上游按共同契约提问，当前平台返回设备属性、配置处理结果或实现路径；箭头表示接口调用与回答">
  <title>上游按共同契约提问，当前平台返回设备属性、配置处理结果或实现路径；箭头表示接口调用与回答</title>
  <defs><marker id="platform-hooks-ah-control" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="var(--color-control, #66716d)"/></marker></defs>
  <path d="M250 98 L330 98" fill="none" stroke="var(--color-control, #66716d)" stroke-width="1.4" marker-end="url(#platform-hooks-ah-control)"/>
  <path d="M550 98 L630 98" fill="none" stroke="var(--color-control, #66716d)" stroke-width="1.4" marker-end="url(#platform-hooks-ah-control)"/>
  <path d="M630 145 L550 145" fill="none" stroke="var(--color-control, #66716d)" stroke-width="1.4" marker-end="url(#platform-hooks-ah-control)"/>
  <path d="M330 145 L250 145" fill="none" stroke="var(--color-control, #66716d)" stroke-width="1.4" marker-end="url(#platform-hooks-ah-control)"/>
  <rect x="30" y="75" width="220" height="90" rx="8" fill="var(--color-control, #66716d)" stroke="var(--color-ink, #17211f)" stroke-width="1.5"/>
  <text x="140" y="116" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="14" font-weight="700" fill="var(--color-ink-inverse, #ffffff)" text-anchor="middle">上游调用方</text>
  <text x="140" y="135" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="13" font-weight="400" fill="var(--color-ink-inverse, #ffffff)" text-anchor="middle">构造配置与执行组件</text>
  <rect x="330" y="75" width="220" height="90" rx="8" fill="var(--color-control, #66716d)" stroke="var(--color-ink, #17211f)" stroke-width="1.5"/>
  <text x="440" y="116" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="14" font-weight="700" fill="var(--color-ink-inverse, #ffffff)" text-anchor="middle">平台接口契约</text>
  <text x="440" y="135" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="13" font-weight="400" fill="var(--color-ink-inverse, #ffffff)" text-anchor="middle">约定输入、输出与副作用</text>
  <rect x="630" y="75" width="220" height="90" rx="8" fill="var(--color-control, #66716d)" stroke="var(--color-ink, #17211f)" stroke-width="1.5"/>
  <text x="740" y="116" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="14" font-weight="700" fill="var(--color-ink-inverse, #ffffff)" text-anchor="middle">当前平台实现</text>
  <text x="740" y="135" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="13" font-weight="400" fill="var(--color-ink-inverse, #ffffff)" text-anchor="middle">按设备回答与选择</text>
  <text x="30" y="32" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="13.5" font-weight="400" fill="var(--color-ink, #17211f)">设备属性？配置能否使用？选哪套执行实现？</text>
  <text x="30" y="217" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="13.5" font-weight="400" fill="var(--color-ink, #17211f)">回答：属性值 ／ 调整配置或报错 ／ 实现路径</text>
  <text x="30" y="267" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="13.5" font-weight="400" fill="var(--color-ink-muted, #66716d)" font-style="italic">这些箭头传递调用与结果，矩阵计算由后续执行组件完成</text>
</svg>
