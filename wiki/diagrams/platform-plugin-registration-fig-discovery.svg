<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 520" width="900" height="520" role="img" aria-label="vLLM 插件发现四关故障传播图与 vllm-ascend 三组六入口结构图" font-family="var(--font-sans)">
  <title>插件发现、VLLM_PLUGINS 精确过滤、四关故障分支与三组六入口映射</title>
  <desc>Top shows 4-gate plugin loading pipeline with distinct failure branches (missing dist-info, VLLM_PLUGINS=all trap, load try/except skip, func() uncaught crash with pre-flipped plugins_loaded latch); bottom maps the 3-group 6-entry setup.py inventory and CPU target bypass.</desc>
  <defs>
    <marker id="pr-arr-g" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto"><path d="M0 1.5L8.5 5L0 8.5z" fill="#66716d"/></marker>
    <marker id="pr-arr-r" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto"><path d="M0 1.5L8.5 5L0 8.5z" fill="#b54237"/></marker>
    <marker id="pr-arr-t" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto"><path d="M0 1.5L8.5 5L0 8.5z" fill="#087f73"/></marker>
  </defs>

  <text x="16" y="26" font-size="16" font-weight="700" fill="#17211f">① 插件加载四关与故障传播边界：「装包成功」≠「注册成功」≠「设备可用」</text>

  <!-- Gate 1 -->
  <rect x="16" y="46" width="194" height="84" rx="8" fill="#ece9df" stroke="#66716d" stroke-width="1.4"/>
  <text x="28" y="72" font-size="14.5" font-weight="700" fill="#17211f">1. 读安装元数据</text>
  <text x="28" y="96" font-size="13.5" fill="#4d5652" font-family="var(--font-mono)">importlib.metadata</text>
  <text x="28" y="118" font-size="13.5" fill="#4d5652">仅查清单，不 import</text>

  <line x1="210" y1="88" x2="236" y2="88" stroke="#66716d" stroke-width="1.8" marker-end="url(#pr-arr-g)"/>

  <!-- Gate 2 -->
  <rect x="242" y="46" width="194" height="84" rx="8" fill="#fff4cf" stroke="#c78300" stroke-width="1.4"/>
  <text x="254" y="72" font-size="14.5" font-weight="700" fill="#936300">2. 白名单精确过滤</text>
  <text x="254" y="96" font-size="13.5" fill="#4d5652" font-family="var(--font-mono)">VLLM_PLUGINS</text>
  <text x="254" y="118" font-size="13.5" fill="#4d5652">未设全放；仅认入口名</text>

  <line x1="436" y1="88" x2="462" y2="88" stroke="#66716d" stroke-width="1.8" marker-end="url(#pr-arr-g)"/>

  <!-- Gate 3 -->
  <rect x="468" y="46" width="194" height="84" rx="8" fill="#e8edff" stroke="#4c65b6" stroke-width="1.4"/>
  <text x="480" y="72" font-size="14.5" font-weight="700" fill="#3a4f93">3. plugin.load()</text>
  <text x="480" y="96" font-size="13.5" fill="#4d5652">导入模块取函数对象</text>
  <text x="480" y="118" font-size="13.5" fill="#3a4f93" font-weight="600">外层包 try / except</text>

  <line x1="662" y1="88" x2="688" y2="88" stroke="#087f73" stroke-width="1.8" marker-end="url(#pr-arr-t)"/>

  <!-- Gate 4 -->
  <rect x="694" y="46" width="190" height="84" rx="8" fill="#ddf4ef" stroke="#087f73" stroke-width="1.5"/>
  <text x="706" y="72" font-size="14.5" font-weight="700" fill="#065f56">4. 调用入口 func()</text>
  <text x="706" y="96" font-size="13.5" fill="#8f3229" font-weight="700">先置 plugins_loaded=T</text>
  <text x="706" y="118" font-size="13.5" fill="#4d5652">执行循环不包 try</text>

  <!-- 4 Explicit Downward Failure Exits -->
  <line x1="113" y1="130" x2="113" y2="162" stroke="#b54237" stroke-width="1.5" stroke-dasharray="4 3" marker-end="url(#pr-arr-r)"/>
  <rect x="16" y="168" width="194" height="68" rx="6" fill="#fff0e9" stroke="#b54237" stroke-width="1.2"/>
  <text x="28" y="193" font-size="13.5" font-weight="700" fill="#8f3229">查不到条目</text>
  <text x="28" y="218" font-size="13.5" fill="#4d5652">跨环境装包或未安装</text>

  <line x1="339" y1="130" x2="339" y2="162" stroke="#b54237" stroke-width="1.5" stroke-dasharray="4 3" marker-end="url(#pr-arr-r)"/>
  <rect x="242" y="168" width="194" height="68" rx="6" fill="#fff0e9" stroke="#b54237" stroke-width="1.2"/>
  <text x="254" y="193" font-size="13.5" font-weight="700" fill="#8f3229">写 =all 反而滤空！</text>
  <text x="254" y="218" font-size="13.5" fill="#4d5652">不认包名，漏名如未装</text>

  <line x1="565" y1="130" x2="565" y2="162" stroke="#4c65b6" stroke-width="1.5" stroke-dasharray="4 3" marker-end="url(#pr-arr-g)"/>
  <rect x="468" y="168" width="194" height="68" rx="6" fill="#ece9df" stroke="#66716d" stroke-width="1.2"/>
  <text x="480" y="193" font-size="13.5" font-weight="700" fill="#17211f">容错跳过（静默退回）</text>
  <text x="480" y="218" font-size="13.5" fill="#4d5652">记日志继续，或落他平台</text>

  <line x1="789" y1="130" x2="789" y2="162" stroke="#b54237" stroke-width="1.8" marker-end="url(#pr-arr-r)"/>
  <rect x="694" y="168" width="190" height="68" rx="6" fill="#fff0e9" stroke="#b54237" stroke-width="1.5"/>
  <text x="706" y="193" font-size="13.5" font-weight="700" fill="#8f3229">直接中止进程！</text>
  <text x="706" y="218" font-size="13.5" fill="#8f3229">同进程再调也不重试</text>

  <!-- Divider -->
  <line x1="16" y1="258" x2="884" y2="258" stroke="#b8bcb5" stroke-width="1.4" stroke-dasharray="6 4"/>

  <!-- ZONE 2: 3 Groups 6 Entries Map (v0.30.0 / main) -->
  <text x="16" y="286" font-size="16" font-weight="700" fill="#17211f">② vllm-ascend setup.py 三组六入口清单（v0.30.0 / main）与平台仲裁规则</text>

  <!-- Group 1: platform_plugins -->
  <rect x="16" y="304" width="276" height="96" rx="8" fill="#ddf4ef" stroke="#087f73" stroke-width="1.4"/>
  <text x="30" y="330" font-size="14" font-weight="700" fill="#065f56">组 1 · vllm.platform_plugins (1)</text>
  <text x="30" y="356" font-size="13.5" fill="#17211f" font-family="var(--font-mono)">ascend → NPUPlatform</text>
  <text x="30" y="382" font-size="13.5" fill="#4d5652">只交类路径字符串，不探测 NPU</text>

  <!-- Group 3: ms_service_metric -->
  <rect x="16" y="412" width="276" height="92" rx="8" fill="#f7e7f2" stroke="#9a4b86" stroke-width="1.3"/>
  <text x="30" y="438" font-size="14" font-weight="700" fill="#7a3a6a">组 3 · ms_service_metric (1)</text>
  <text x="30" y="464" font-size="13.5" fill="#4d5652">v0.30.0 新增服务级指标入口</text>
  <text x="30" y="488" font-size="13.5" fill="#7a3a6a">main 迁至 observability.ms_metrics</text>

  <!-- Group 2: general_plugins (center, showing 3 patch vs 1 model-only) -->
  <rect x="310" y="304" width="320" height="200" rx="8" fill="#fff4cf" stroke="#c78300" stroke-width="1.4"/>
  <text x="324" y="330" font-size="14" font-weight="700" fill="#936300">组 2 · vllm.general_plugins (4)</text>

  <rect x="324" y="344" width="292" height="84" rx="6" fill="#ffffff" stroke="#c78300" stroke-width="1.2"/>
  <text x="336" y="368" font-size="13.5" font-weight="700" fill="#936300">前 3 个入口首行先补 global patch：</text>
  <text x="336" y="392" font-size="13.5" fill="#4d5652">connector · model_loader · profiling</text>
  <text x="330" y="415" font-size="12" fill="#66716d">main 先锁 MRV2；connector 增 ec_transfer</text>

  <rect x="324" y="438" width="292" height="54" rx="6" fill="#e8edff" stroke="#4c65b6" stroke-width="1.2"/>
  <text x="336" y="461" font-size="13.5" font-weight="700" fill="#3a4f93">第 4 个：ascend_model（不补 patch）</text>
  <text x="336" y="483" font-size="13.5" fill="#4d5652">仅登记「架构名 → 昇腾模型类」映射</text>

  <!-- Right Panel: Arbitration + CPU bypass -->
  <rect x="648" y="304" width="236" height="200" rx="8" fill="#ece9df" stroke="#66716d" stroke-width="1.3"/>
  <text x="662" y="330" font-size="14" font-weight="700" fill="#17211f">平台仲裁与 v0.30.0 例外</text>
  <rect x="662" y="344" width="208" height="44" rx="5" fill="#ddf4ef" stroke="#087f73" stroke-width="1.1"/>
  <text x="766" y="364" text-anchor="middle" font-size="13.5" font-weight="700" fill="#065f56">单外部激活 → 压过内置</text>
  <text x="766" y="382" text-anchor="middle" font-size="13.5" fill="#4d5652">切回他卡须卸包或排除</text>

  <rect x="662" y="398" width="208" height="44" rx="5" fill="#fff0e9" stroke="#b54237" stroke-width="1.1"/>
  <text x="766" y="418" text-anchor="middle" font-size="13.5" font-weight="700" fill="#8f3229">≥2 外部激活 → 抛冲突错</text>
  <text x="766" y="436" text-anchor="middle" font-size="13.5" fill="#4d5652">RuntimeError 立即停机</text>

  <rect x="662" y="452" width="208" height="40" rx="5" fill="#ffffff" stroke="#4c65b6" stroke-width="1.2"/>
  <text x="766" y="477" text-anchor="middle" font-size="13.5" font-weight="700" fill="#3a4f93">v0.30.0+ 显式 CPU 直通</text>
</svg>
