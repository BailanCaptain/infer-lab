<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 670" width="880" height="670" role="img" aria-label="A0 内的平台交接按启动先后展开；配置失败在建卡前退出，成功后由 Worker 加载模型并继续后端相关调整">
  <title>A0 内的平台交接按启动先后展开；配置失败在建卡前退出，成功后由 Worker 加载模型并继续后端相关调整</title>
  <defs><marker id="platform-startup-contract-ah-control" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="var(--color-control, #66716d)"/></marker><marker id="platform-startup-contract-ah-danger" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="var(--color-danger, #b54237)"/></marker></defs>
  <path d="M330 112 L330 155" fill="none" stroke="var(--color-control, #66716d)" stroke-width="1.4" marker-end="url(#platform-startup-contract-ah-control)"/>
  <path d="M330 217 L330 260" fill="none" stroke="var(--color-control, #66716d)" stroke-width="1.4" marker-end="url(#platform-startup-contract-ah-control)"/>
  <path d="M580 296 L645 296" fill="none" stroke="var(--color-danger, #b54237)" stroke-width="1.4" marker-end="url(#platform-startup-contract-ah-danger)"/>
