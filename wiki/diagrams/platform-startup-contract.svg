  <text x="330" y="556" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="13" font-weight="400" fill="var(--color-ink-inverse, #ffffff)" text-anchor="middle">之后量显存、建缓存、捕获执行图</text>
  <text x="356" y="359" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="13.5" font-weight="400" fill="var(--color-ink-muted, #66716d)" font-style="italic">通过</text>
  <text x="30" y="24" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="13.5" font-weight="400" fill="var(--color-ink, #17211f)">A0 部署启动：本图展开平台交接，完整进程链见调用链页</text>
  <text x="30" y="621" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="13.5" font-weight="400" fill="var(--color-ink, #17211f)">就绪后 → A1 接收请求 → 调度与准备输入 → A4 模型计算</text>
