  <text x="636" y="392" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="14" font-weight="700" fill="var(--color-ink, #17211f)" text-anchor="middle">全 36 / 48 层统一绑定 AscendAttentionBackend</text>
