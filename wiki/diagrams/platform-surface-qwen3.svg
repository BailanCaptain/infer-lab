<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 510" width="900" height="510" role="img" aria-label="v0.30.0（c09d3e20）中 NPUPlatform 在标准 Qwen3 启动时做的三件事：先结合 HardwareProfile（A2 / A3 / 310P）校验配置组合；再就地写回默认 Worker / Runner（V1 或可选 MRV2）、同构 block_size = 128 与图捕获预算；最后在构建全部 Qwen3 层时统一答复 AscendAttentionBackend（无需异构层私有后端绕行）。">
  <title>v0.30.0（c09d3e20）中 NPUPlatform 在标准 Qwen3 启动时做的三件事：先结合 HardwareProfile（A2 / A3 / 310P）校验配置组合；再就地写回默认 Worker / Runner（V1 或可选 MRV2）、同构 block_size = 128 与图捕获预算；最后在构建全部 Qwen3 层时统一答复 AscendAttentionBackend（无需异构层私有后端绕行）。</title>
