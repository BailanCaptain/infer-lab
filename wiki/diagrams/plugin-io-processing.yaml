layout: figure
id: plugin-io-processing
caption: IO 插件可以把一份应用数据展开成多个模型输入。在线服务按输入编号收齐结果后调用插件合并；图以方形影像切片示意，不表示四片必须同时计算，也不表示 GLM 使用此插件。
