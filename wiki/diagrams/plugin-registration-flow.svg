<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 470" width="880" height="470" role="img" aria-label="按本例默认 spawn、入口均被允许并成功执行计，前端、EngineCore 和 Worker 各自完成通用登记；三个入口先保证全局补丁，模型入口只加映射。平台组在当前平台缓存为空且首次访问时解析，成功后缓存对象">
  <title>按本例默认 spawn、入口均被允许并成功执行计，前端、EngineCore 和 Worker 各自完成通用登记；三个入口先保证全局补丁，模型入口只加映射。平台组在当前平台缓存为空且首次访问时解析，成功后缓存对象</title>
