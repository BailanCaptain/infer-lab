layout: figure
id: plugin-registration-flow
caption: 上半部是通用组：前端、EngineCore 和每个 worker 起来时各调一次加载函数，四个入口里有三个先补一次全局补丁，模型入口只往注册表加条目。下半部是平台组：同一进程第一次要用当前平台时才解析，解析结果缓存起来。
size: [880, 470]
frames:
  - { label: 通用组：每个进程各执行一遍, at: [16, 62], size: [848, 258] }
items:
  - { at: [34, 78], size: [166, 54], text: 前端进程, sub: 解析启动参数时, tone: control }
  - { at: [34, 158], size: [166, 54], text: EngineCore 进程 ×2, sub: 初始化时, tone: control }
  - { at: [34, 238], size: [166, 54], text: worker 进程 ×16, sub: 初始化时, tone: control }
  - { at: [254, 158], size: [178, 54], text: 读通用组清单, sub: 本进程只跑一次, tone: weight }
  - { at: [486, 88], size: [180, 54], text: 三个入口, sub: 先补全局补丁, tone: weight }
  - { at: [486, 238], size: [180, 54], text: 模型入口, sub: 不补补丁, tone: weight }
  - { at: [692, 88], size: [158, 54], text: 另外三类登记, sub: 连接器、加载器、采集, tone: weight }
  - { at: [700, 238], size: [150, 54], text: 模型注册表, sub: 多出几条映射, tone: weight }
  - { at: [34, 388], size: [166, 54], text: 本进程第一次, sub: 要用当前平台, tone: control }
  - { at: [254, 388], size: [178, 54], text: 读平台组清单, sub: 得到一个类路径, tone: control }
  - { at: [486, 388], size: [180, 54], text: 按名字导入并建对象, sub: 之后一直用它, tone: control }
