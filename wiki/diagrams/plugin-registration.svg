<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 400" width="900" height="400" role="img" aria-label="安装元数据经发现与过滤后进入两类注册路径；注册表就绪与设备初始化是不同阶段">
  <title>安装元数据经发现与过滤后进入两类注册路径；注册表就绪与设备初始化是不同阶段</title>
  <defs><marker id="plugin-registration-ah-ink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="var(--color-ink, #17211f)"/></marker><marker id="plugin-registration-ah-control" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="var(--color-control, #66716d)"/></marker><marker id="plugin-registration-ah-weight" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="var(--color-weight, #c78300)"/></marker></defs>
  <path d="M180 187 L215 187" fill="none" stroke="var(--color-ink, #17211f)" stroke-width="1.4" marker-end="url(#plugin-registration-ah-ink)"/>
  <path d="M385 187 L408 187 L408 97 L430 97" fill="none" stroke="var(--color-control, #66716d)" stroke-width="1.4" marker-end="url(#plugin-registration-ah-control)"/>
  <path d="M385 187 L408 187 L408 277 L430 277" fill="none" stroke="var(--color-weight, #c78300)" stroke-width="1.4" marker-end="url(#plugin-registration-ah-weight)"/>
  <path d="M600 97 L645 97" fill="none" stroke="var(--color-control, #66716d)" stroke-width="1.4" marker-end="url(#plugin-registration-ah-control)"/>
  <path d="M600 277 L645 277" fill="none" stroke="var(--color-weight, #c78300)" stroke-width="1.4" marker-end="url(#plugin-registration-ah-weight)"/>
  <rect x="20" y="155" width="160" height="64" rx="8" fill="var(--color-control, #66716d)" stroke="var(--color-ink, #17211f)" stroke-width="1.5"/>
  <text x="100" y="183" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="14" font-weight="700" fill="var(--color-ink-inverse, #ffffff)" text-anchor="middle">安装元数据</text>
  <text x="100" y="202" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="13" font-weight="400" fill="var(--color-ink-inverse, #ffffff)" text-anchor="middle">entry points</text>
  <rect x="215" y="155" width="170" height="64" rx="8" fill="var(--color-control, #66716d)" stroke="var(--color-ink, #17211f)" stroke-width="1.5"/>
  <text x="300" y="183" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="14" font-weight="700" fill="var(--color-ink-inverse, #ffffff)" text-anchor="middle">发现与过滤</text>
  <text x="300" y="202" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="13" font-weight="400" fill="var(--color-ink-inverse, #ffffff)" text-anchor="middle">入口白名单</text>
  <rect x="430" y="65" width="170" height="64" rx="8" fill="var(--color-control, #66716d)" stroke="var(--color-ink, #17211f)" stroke-width="1.5"/>
  <text x="515" y="93" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="14" font-weight="700" fill="var(--color-ink-inverse, #ffffff)" text-anchor="middle">平台入口</text>
  <text x="515" y="112" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="13" font-weight="400" fill="var(--color-ink-inverse, #ffffff)" text-anchor="middle">返回类路径</text>
  <rect x="430" y="245" width="170" height="64" rx="8" fill="var(--color-weight, #c78300)" stroke="var(--color-ink, #17211f)" stroke-width="1.5"/>
  <text x="515" y="273" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="14" font-weight="700" fill="var(--color-ink-inverse, #ffffff)" text-anchor="middle">通用入口</text>
  <text x="515" y="292" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="13" font-weight="400" fill="var(--color-ink-inverse, #ffffff)" text-anchor="middle">执行登记函数</text>
  <rect x="645" y="65" width="230" height="64" rx="8" fill="var(--color-control, #66716d)" stroke="var(--color-ink, #17211f)" stroke-width="1.5"/>
  <text x="760" y="93" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="14" font-weight="700" fill="var(--color-ink-inverse, #ffffff)" text-anchor="middle">当前平台</text>
  <text x="760" y="112" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="13" font-weight="400" fill="var(--color-ink-inverse, #ffffff)" text-anchor="middle">唯一有效 OOT 优先</text>
  <rect x="645" y="245" width="230" height="64" rx="8" fill="var(--color-weight, #c78300)" stroke="var(--color-ink, #17211f)" stroke-width="1.5"/>
  <text x="760" y="273" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="14" font-weight="700" fill="var(--color-ink-inverse, #ffffff)" text-anchor="middle">模型等注册结果</text>
  <text x="760" y="292" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="13" font-weight="400" fill="var(--color-ink-inverse, #ffffff)" text-anchor="middle">GLM 架构 → 实现类</text>
  <text x="20" y="36" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="16" font-weight="400" fill="var(--color-ink, #17211f)">安装提供入口，执行入口才产生注册结果</text>
  <text x="645" y="160" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="13.5" font-weight="400" fill="var(--color-ink-muted, #66716d)" font-style="italic">多个外部平台激活会冲突</text>
  <text x="20" y="364" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="13.5" font-weight="400" fill="var(--color-ink-muted, #66716d)" font-style="italic">进程内登记：前端 / EngineCore / Worker</text>
</svg>
