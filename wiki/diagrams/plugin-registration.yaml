layout: scene
id: plugin-registration
caption: 装包时写进元数据的五个口，vLLM 在两个不同的进程里分两次来取
size: [900, 470]

regions:
  - label: 安装期
    note: 装完包就写在磁盘的元数据里，跟有没有跑代码无关
    at: [20, 40]
    size: [370, 400]
    tone: neutral
  - label: 启动期
    note: vLLM 主动来扫，昇腾不调用 vLLM 一行代码
    at: [420, 40]
    size: [460, 400]
    tone: ascend

boundaries:
  - { at: 405, from: 40, to: 440, label: 这条线两边不是同一个时刻 }

boxes:
  - { at: [40, 128], size: [330, 52], title: "vllm.platform_plugins", sub: "ascend → register()，返回一个字符串", tone: neutral, icon: plug }
  - { at: [40, 196], size: [330, 40], title: register_connector, sub: KV 连接器与权重传输引擎, tone: muted }
  - { at: [40, 244], size: [330, 40], title: register_model_loader, sub: netloader 与 rfork 两个加载器, tone: muted }
  - { at: [40, 292], size: [330, 40], title: register_service_profiling, sub: 服务级 profiling 配置, tone: muted }
  - { at: [40, 340], size: [330, 40], title: register_model, sub: 昇腾自己的模型实现, tone: muted }

  - { at: [470, 120], size: [390, 68], title: Main 进程：挑平台, sub: "拿到字符串才 import，这时才第一次碰 torch_npu", fn: NPUPlatform, tone: ascend, icon: search }
  - { at: [470, 250], size: [390, 84], title: EngineCore 子进程：加载 general plugin, sub: "四个里有三个第一句是 _ensure_global_patch()", fn: _ensure_global_patch, tone: ascend, icon: patch }

arrows:
  - { from: [374, 154], to: [466, 154], tone: neutral }
  - { from: [374, 288], to: [466, 288], tone: muted }

brackets:
  - { at: [40, 386], span: 330, label: "vllm.general_plugins（这四个）", dir: down, tone: muted }

notes:
  - { at: [470, 360], text: "为什么这四个要自己补一次 patch：子进程是新起的解释器，Main 进程里那次 import 的副作用不会被继承。", size: 12.5, width: 390 }
  - { at: [20, 460], text: "register() 返回的是类路径字符串而不是类——这样 vLLM 可以先比完几个平台插件，确定用昇腾之后才把 torch_npu 拉进进程。", size: 12.5, width: 860 }

pins:
  - source: vllm-ascend@2c59ff10:setup.py#L543-L551
    symbols: [vllm.platform_plugins, vllm.general_plugins]
  - source: vllm-ascend@2c59ff10:vllm_ascend/__init__.py#L38-L42
    symbols: [register]
  - source: vllm-ascend@2c59ff10:vllm_ascend/__init__.py#L44-L77
    symbols: [register_connector, register_model_loader, register_service_profiling, register_model]
  - source: vllm-ascend@2c59ff10:vllm_ascend/__init__.py#L19-L35
    symbols: [_ensure_global_patch]
  - source: vllm-ascend@2c59ff10:vllm_ascend/platform.py#L128-L146
    symbols: [NPUPlatform]
