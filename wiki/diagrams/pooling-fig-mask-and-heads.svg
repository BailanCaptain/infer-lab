<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 632" width="900" height="632" role="img" aria-label="昇腾 Pooling 4×4 注意力掩码矩阵分岔、[N_total, H] 池化行选取与 Whisper 交叉注意力整段 K/V 写入对比图" font-family="var(--font-sans)">
  <title>昇腾 Pooling 4×4 掩码矩阵、行切片池化头与 Whisper 交叉注意力</title>
  <desc>顶区并排绘制三张 4×4 注意力可见性矩阵：因果掩码（上三角 -∞）、A2/A3/950DT 双向（mask=None 走 npu_fusion_attention）与 310P 双向（全零 FRACTAL_NZ 掩码）；中区绘制 [N_total, H] 紧凑隐藏状态矩阵上 CLSPool、LastPool、MeanPool 的行选取与分块约束；底区对比常规自注意力按解码步截断与 Whisper ENCODER_DECODER 整段 1500 帧写入。</desc>
  <defs>
    <marker id="pmh-arr-t" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 1.5 L 8.5 5 L 0 8.5 z" fill="#087f73"/>
    </marker>
    <marker id="pmh-arr-b" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 1.5 L 8.5 5 L 0 8.5 z" fill="#4c65b6"/>
    </marker>
    <marker id="pmh-arr-p" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 1.5 L 8.5 5 L 0 8.5 z" fill="#9a4b86"/>
    </marker>
  </defs>

  <!-- Zone 1: Three 4x4 Visibility Matrices -->
  <circle cx="26" cy="24" r="12" fill="#c78300"/>
  <text x="26" y="28.5" text-anchor="middle" font-size="13" font-weight="700" fill="#ffffff">1</text>
  <text x="46" y="30" font-size="16" font-weight="700" fill="#17211f">4×4 注意力可见性矩阵：因果池化 vs A2/A3/950DT 双向（None） vs 310P 双向（全零 NZ）</text>

  <!-- Matrix A: Causal 4x4 (x=54, y=72, cell 46x26) -->
  <text x="146" y="58" text-anchor="middle" font-size="14.5" font-weight="700" fill="#936300">因果池化 (Qwen3-Emb · causal=True)</text>
  <g font-size="13" font-family="var(--font-mono)" fill="#66716d" text-anchor="middle">
    <text x="77" y="76">k0</text><text x="123" y="76">k1</text><text x="169" y="76">k2</text><text x="215" y="76">k3</text>
    <text x="42" y="100" text-anchor="end">q0</text><text x="42" y="126" text-anchor="end">q1</text>
    <text x="42" y="152" text-anchor="end">q2</text><text x="42" y="178" text-anchor="end">q3</text>
  </g>
  <g stroke-width="1.2">
    <!-- Row 0 -->
    <rect x="54" y="82" width="44" height="24" rx="3" fill="#ddf4ef" stroke="#087f73"/>
    <rect x="100" y="82" width="44" height="24" rx="3" fill="#fff0e9" stroke="#b54237"/>
    <rect x="146" y="82" width="44" height="24" rx="3" fill="#fff0e9" stroke="#b54237"/>
    <rect x="192" y="82" width="44" height="24" rx="3" fill="#fff0e9" stroke="#b54237"/>
    <!-- Row 1 -->
    <rect x="54" y="108" width="44" height="24" rx="3" fill="#ddf4ef" stroke="#087f73"/>
    <rect x="100" y="108" width="44" height="24" rx="3" fill="#ddf4ef" stroke="#087f73"/>
    <rect x="146" y="108" width="44" height="24" rx="3" fill="#fff0e9" stroke="#b54237"/>
    <rect x="192" y="108" width="44" height="24" rx="3" fill="#fff0e9" stroke="#b54237"/>
    <!-- Row 2 -->
    <rect x="54" y="134" width="44" height="24" rx="3" fill="#ddf4ef" stroke="#087f73"/>
    <rect x="100" y="134" width="44" height="24" rx="3" fill="#ddf4ef" stroke="#087f73"/>
    <rect x="146" y="134" width="44" height="24" rx="3" fill="#ddf4ef" stroke="#087f73"/>
    <rect x="192" y="134" width="44" height="24" rx="3" fill="#fff0e9" stroke="#b54237"/>
    <!-- Row 3 -->
    <rect x="54" y="160" width="44" height="24" rx="3" fill="#ddf4ef" stroke="#087f73"/>
    <rect x="100" y="160" width="44" height="24" rx="3" fill="#ddf4ef" stroke="#087f73"/>
    <rect x="146" y="160" width="44" height="24" rx="3" fill="#ddf4ef" stroke="#087f73"/>
    <rect x="192" y="160" width="44" height="24" rx="3" fill="#ddf4ef" stroke="#087f73"/>
  </g>
  <g font-size="13" text-anchor="middle" font-weight="700">
    <text x="76" y="99" fill="#065f56">✓</text><text x="122" y="99" fill="#8f3229">-∞</text><text x="168" y="99" fill="#8f3229">-∞</text><text x="214" y="99" fill="#8f3229">-∞</text>
    <text x="76" y="125" fill="#065f56">✓</text><text x="122" y="125" fill="#065f56">✓</text><text x="168" y="125" fill="#8f3229">-∞</text><text x="214" y="125" fill="#8f3229">-∞</text>
    <text x="76" y="151" fill="#065f56">✓</text><text x="122" y="151" fill="#065f56">✓</text><text x="168" y="151" fill="#065f56">✓</text><text x="214" y="151" fill="#8f3229">-∞</text>
    <text x="76" y="177" fill="#065f56">✓</text><text x="122" y="177" fill="#065f56">✓</text><text x="168" y="177" fill="#065f56">✓</text><text x="214" y="177" fill="#065f56">✓</text>
  </g>
  <text x="146" y="206" text-anchor="middle" font-size="13.5" fill="#4d5652">2048×2048 bool → 标准 FIA</text>

  <!-- Matrix B: Bidirectional Standard NPU (mask=None, x=354) -->
  <text x="446" y="58" text-anchor="middle" font-size="14.5" font-weight="700" fill="#065f56">A2/A3/950DT 双向 (mask = None)</text>
  <g font-size="13" font-family="var(--font-mono)" fill="#66716d" text-anchor="middle">
    <text x="377" y="76">k0</text><text x="423" y="76">k1</text><text x="469" y="76">k2</text><text x="515" y="76">k3</text>
    <text x="342" y="100" text-anchor="end">q0</text><text x="342" y="126" text-anchor="end">q1</text>
    <text x="342" y="152" text-anchor="end">q2</text><text x="342" y="178" text-anchor="end">q3</text>
  </g>
  <g fill="#ddf4ef" stroke="#087f73" stroke-width="1.2">
    <rect x="354" y="82" width="44" height="24" rx="3"/><rect x="400" y="82" width="44" height="24" rx="3"/><rect x="446" y="82" width="44" height="24" rx="3"/><rect x="492" y="82" width="44" height="24" rx="3"/>
    <rect x="354" y="108" width="44" height="24" rx="3"/><rect x="400" y="108" width="44" height="24" rx="3"/><rect x="446" y="108" width="44" height="24" rx="3"/><rect x="492" y="108" width="44" height="24" rx="3"/>
    <rect x="354" y="134" width="44" height="24" rx="3"/><rect x="400" y="134" width="44" height="24" rx="3"/><rect x="446" y="134" width="44" height="24" rx="3"/><rect x="492" y="134" width="44" height="24" rx="3"/>
    <rect x="354" y="160" width="44" height="24" rx="3"/><rect x="400" y="160" width="44" height="24" rx="3"/><rect x="446" y="160" width="44" height="24" rx="3"/><rect x="492" y="160" width="44" height="24" rx="3"/>
  </g>
  <g font-size="13" text-anchor="middle" font-weight="700" fill="#065f56">
    <text x="376" y="99">✓</text><text x="422" y="99">✓</text><text x="468" y="99">✓</text><text x="514" y="99">✓</text>
    <text x="376" y="125">✓</text><text x="422" y="125">✓</text><text x="468" y="125">✓</text><text x="514" y="125">✓</text>
    <text x="376" y="151">✓</text><text x="422" y="151">✓</text><text x="468" y="151">✓</text><text x="514" y="151">✓</text>
    <text x="376" y="177">✓</text><text x="422" y="177">✓</text><text x="468" y="177">✓</text><text x="514" y="177">✓</text>
  </g>
  <text x="446" y="206" text-anchor="middle" font-size="13.5" font-weight="700" fill="#065f56">绕开 FIA → npu_fusion_attention</text>

  <!-- Matrix C: Bidirectional 310P (All-zero additive FRACTAL_NZ, x=654) -->
  <text x="746" y="58" text-anchor="middle" font-size="14.5" font-weight="700" fill="#8f3229">Atlas 310P 双向 (全零 NZ 掩码)</text>
  <g font-size="13" font-family="var(--font-mono)" fill="#66716d" text-anchor="middle">
    <text x="677" y="76">k0</text><text x="723" y="76">k1</text><text x="769" y="76">k2</text><text x="815" y="76">k3</text>
    <text x="642" y="100" text-anchor="end">q0</text><text x="642" y="126" text-anchor="end">q1</text>
    <text x="642" y="152" text-anchor="end">q2</text><text x="642" y="178" text-anchor="end">q3</text>
  </g>
  <g fill="#fff4cf" stroke="#c78300" stroke-width="1.2">
    <rect x="654" y="82" width="44" height="24" rx="3"/><rect x="700" y="82" width="44" height="24" rx="3"/><rect x="746" y="82" width="44" height="24" rx="3"/><rect x="792" y="82" width="44" height="24" rx="3"/>
    <rect x="654" y="108" width="44" height="24" rx="3"/><rect x="700" y="108" width="44" height="24" rx="3"/><rect x="746" y="108" width="44" height="24" rx="3"/><rect x="792" y="108" width="44" height="24" rx="3"/>
    <rect x="654" y="134" width="44" height="24" rx="3"/><rect x="700" y="134" width="44" height="24" rx="3"/><rect x="746" y="134" width="44" height="24" rx="3"/><rect x="792" y="134" width="44" height="24" rx="3"/>
    <rect x="654" y="160" width="44" height="24" rx="3"/><rect x="700" y="160" width="44" height="24" rx="3"/><rect x="746" y="160" width="44" height="24" rx="3"/><rect x="792" y="160" width="44" height="24" rx="3"/>
  </g>
  <g font-size="13" font-family="var(--font-mono)" text-anchor="middle" font-weight="700" fill="#936300">
    <text x="676" y="99">+0</text><text x="722" y="99">+0</text><text x="768" y="99">+0</text><text x="814" y="99">+0</text>
    <text x="676" y="125">+0</text><text x="722" y="125">+0</text><text x="768" y="125">+0</text><text x="814" y="125">+0</text>
    <text x="676" y="151">+0</text><text x="722" y="151">+0</text><text x="768" y="151">+0</text><text x="814" y="151">+0</text>
    <text x="676" y="177">+0</text><text x="722" y="177">+0</text><text x="768" y="177">+0</text><text x="814" y="177">+0</text>
  </g>
  <text x="746" y="206" text-anchor="middle" font-size="13.5" font-weight="700" fill="#8f3229">310P 拒 None → 转 FRACTAL_NZ</text>

  <!-- Divider 1 -->
  <line x1="16" y1="224" x2="884" y2="224" stroke="#b8bcb5" stroke-width="1.4" stroke-dasharray="6 5"/>

  <!-- Zone 2: [N_total, H] Row Selection for CLS / LAST / MEAN -->
  <circle cx="26" cy="250" r="12" fill="#4c65b6"/>
  <text x="26" y="254.5" text-anchor="middle" font-size="13" font-weight="700" fill="#ffffff">2</text>
  <text x="46" y="256" font-size="16" font-weight="700" fill="#17211f">末层紧凑矩阵 [N_total, H] 行选取：CLS / LAST / MEAN 与分块约束</text>

  <!-- Left: Stacked [7, H] hidden states matrix -->
  <text x="16" y="284" font-size="13.5" font-weight="700" fill="#17211f">输入 hidden_states [N_total=7, H]</text>
  <!-- Req 1 (4 rows: r0..r3) -->
  <rect x="16" y="294" width="212" height="24" rx="3" fill="#e8edff" stroke="#4c65b6" stroke-width="1.5"/>
  <text x="122" y="311" text-anchor="middle" font-size="13" font-weight="700" fill="#3a4f93">Req 1 · 行 0 [CLS 首词]</text>
  <rect x="16" y="320" width="212" height="22" rx="3" fill="#ece9df" stroke="#b8bcb5" stroke-width="1.1"/>
  <text x="122" y="336" text-anchor="middle" font-size="13" fill="#4d5652">Req 1 · 行 1</text>
  <rect x="16" y="344" width="212" height="22" rx="3" fill="#ece9df" stroke="#b8bcb5" stroke-width="1.1"/>
  <text x="122" y="360" text-anchor="middle" font-size="13" fill="#4d5652">Req 1 · 行 2</text>
  <rect x="16" y="368" width="212" height="24" rx="3" fill="#ddf4ef" stroke="#087f73" stroke-width="1.5"/>
  <text x="122" y="385" text-anchor="middle" font-size="13" font-weight="700" fill="#065f56">Req 1 · 行 3 [LAST 末词]</text>
  <!-- Req 2 (3 rows: r4..r6) -->
  <rect x="16" y="398" width="212" height="24" rx="3" fill="#e8edff" stroke="#4c65b6" stroke-width="1.5"/>
  <text x="122" y="415" text-anchor="middle" font-size="13" font-weight="700" fill="#3a4f93">Req 2 · 行 4 [CLS 首词]</text>
  <rect x="16" y="424" width="212" height="22" rx="3" fill="#ece9df" stroke="#b8bcb5" stroke-width="1.1"/>
  <text x="122" y="440" text-anchor="middle" font-size="13" fill="#4d5652">Req 2 · 行 5</text>
  <rect x="16" y="448" width="212" height="24" rx="3" fill="#ddf4ef" stroke="#087f73" stroke-width="1.5"/>
  <text x="122" y="465" text-anchor="middle" font-size="13" font-weight="700" fill="#065f56">Req 2 · 行 6 [LAST 末词]</text>

  <!-- Right: 3 Pooler Head Rows -->
  <!-- CLS -->
  <path d="M 230 306 L 284 306" fill="none" stroke="#4c65b6" stroke-width="1.8" marker-end="url(#pmh-arr-b)"/>
  <rect x="290" y="280" width="594" height="58" rx="6" fill="#e8edff" stroke="#4c65b6" stroke-width="1.4"/>
  <text x="304" y="304" font-size="14.5" font-weight="700" fill="#3a4f93">CLSPool：直切首行 [行 0, 行 4]（BERT / BGE）</text>
  <rect x="706" y="287" width="166" height="26" rx="5" fill="#fff0e9" stroke="#b54237" stroke-width="1.3"/>
  <text x="789" y="305" text-anchor="middle" font-size="13.5" font-weight="700" fill="#8f3229">✗ 禁 partial prefill</text>
  <text x="304" y="328" font-size="13.5" fill="#4d5652">first_token_indices_gpu</text>

  <!-- LAST -->
  <path d="M 230 380 L 284 380" fill="none" stroke="#087f73" stroke-width="1.8" marker-end="url(#pmh-arr-t)"/>
  <rect x="290" y="346" width="594" height="64" rx="6" fill="#ddf4ef" stroke="#087f73" stroke-width="1.4"/>
  <text x="304" y="370" font-size="14.5" font-weight="700" fill="#065f56">LastPool：直切末行 [行 3, 行 6]</text>
  <rect x="706" y="353" width="166" height="26" rx="5" fill="#ffffff" stroke="#087f73" stroke-width="1.3"/>
  <text x="789" y="371" text-anchor="middle" font-size="13.5" font-weight="700" fill="#065f56">✓ 适配因果 + 分块</text>
  <text x="304" y="398" font-size="13.5" fill="#4d5652">Qwen3-Embedding / Reward · last_token_indices_gpu（末位汇聚因果全句）</text>

  <!-- MEAN -->
  <path d="M 230 444 L 284 444" fill="none" stroke="#9a4b86" stroke-width="1.8" marker-end="url(#pmh-arr-p)"/>
  <rect x="290" y="418" width="594" height="66" rx="6" fill="#f7e7f2" stroke="#9a4b86" stroke-width="1.4"/>
  <text x="304" y="442" font-size="14.5" font-weight="700" fill="#7a3a6a">MeanPool：整段行均值 [mean(0..3), mean(4..6)]</text>
  <rect x="706" y="425" width="166" height="26" rx="5" fill="#fff0e9" stroke="#b54237" stroke-width="1.3"/>
  <text x="789" y="443" text-anchor="middle" font-size="13.5" font-weight="700" fill="#8f3229">✗ 禁 partial prefill</text>
  <text x="304" y="471" font-size="13.5" fill="#4d5652">L2 归一 · 按 16 MiB 分块 FP32 index_add_（H=4096 时每块 1024 token）</text>

  <g transform="translate(0, 12)">
  <!-- Divider 2 -->
  <line x1="16" y1="490" x2="884" y2="490" stroke="#b8bcb5" stroke-width="1.4" stroke-dasharray="6 5"/>

  <!-- Zone 3: Whisper Encoder-Decoder Full K/V vs Current Decoder Step -->
  <circle cx="26" cy="516" r="12" fill="#9a4b86"/>
  <text x="26" y="520.5" text-anchor="middle" font-size="13" font-weight="700" fill="#ffffff">3</text>
  <text x="46" y="522" font-size="16" font-weight="700" fill="#17211f">Whisper Encoder-Decoder 特判：交叉注意力整段写入 Encoder K/V，不按解码步截断</text>

  <!-- Row 1: Self-Attention truncated to num_actual_tokens -->
  <text x="16" y="556" font-size="13.5" font-weight="700" fill="#4d5652">常规自注意力写入</text>
  <rect x="150" y="536" width="96" height="28" rx="4" fill="#ddf4ef" stroke="#087f73" stroke-width="1.4"/>
  <text x="198" y="555" text-anchor="middle" font-size="13" font-weight="700" fill="#065f56">当前 1 步</text>
  <rect x="252" y="536" width="380" height="28" rx="4" fill="#ece9df" stroke="#b8bcb5" stroke-width="1.2" stroke-dasharray="4 3"/>
  <text x="442" y="555" text-anchor="middle" font-size="13.5" fill="#66716d">[:num_actual_tokens] 截断后方填充槽位</text>
  <text x="646" y="555" font-size="13.5" fill="#4d5652">常规 Decoder 逐词追加</text>

  <!-- Row 2: ENCODER_DECODER full 1500-frame write -->
  <text x="16" y="596" font-size="13.5" font-weight="700" fill="#7a3a6a">ENCODER_DECODER</text>
  <rect x="150" y="576" width="482" height="28" rx="4" fill="#f7e7f2" stroke="#9a4b86" stroke-width="1.5"/>
  <text x="391" y="595" text-anchor="middle" font-size="13.5" font-weight="700" fill="#7a3a6a">完整写入整段音频 Encoder K/V（如 30 s 对应全部 1,500 帧）</text>
  <rect x="646" y="576" width="238" height="28" rx="4" fill="#fff4cf" stroke="#c78300" stroke-width="1.3"/>
  <text x="765" y="595" text-anchor="middle" font-size="13" font-weight="700" fill="#936300">图模式自动降级 PIECEWISE / NONE</text>
  </g>
</svg>
