<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 438" width="900" height="438" role="img" aria-label="生成式评分概率重归一比例条与实时语音转写 WebSocket 事件时序图" font-family="var(--font-sans)">
  <title>生成式评分概率重归一与实时语音转写事件时序</title>
  <desc>左半区在统一 [0, 1] 标尺上展示 /generative_scoring 在 full vocab（A=0.1, B=0.3, 其他=0.6）、apply_softmax=true 传 [A, B] 得 0.25、单标签 [A] 得 1.0 以及 apply_softmax=false 得 0.1 四种口径；右半区展示 /v1/realtime 的 WebSocket 状态机与 PCM16 16kHz 帧宽账。</desc>
  <defs>
    <marker id="psa-arr-t" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 1.5 L 8.5 5 L 0 8.5 z" fill="#087f73"/>
    </marker>
    <marker id="psa-arr-b" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 1.5 L 8.5 5 L 0 8.5 z" fill="#4c65b6"/>
    </marker>
  </defs>

  <line x1="452" y1="14" x2="452" y2="424" stroke="#d8d8cf" stroke-width="1.5" stroke-dasharray="6 4"/>

  <!-- Left Half: /generative_scoring renormalization bars -->
  <circle cx="26" cy="24" r="12" fill="#087f73"/>
  <text x="26" y="28.5" text-anchor="middle" font-size="13" font-weight="700" fill="#ffffff">1</text>
  <text x="46" y="30" font-size="16" font-weight="700" fill="#17211f">/generative_scoring：重归一口径对比</text>

  <!-- Scale x=16..376 (width 360px = 1.0) -->
  <text x="16" y="64" font-size="13.5" font-weight="700" fill="#4d5652">完整词表原始概率（A=0.1, B=0.3, 其余=0.6）</text>
  <rect x="16" y="74" width="36" height="32" rx="3" fill="#ddf4ef" stroke="#087f73" stroke-width="1.4"/>
  <text x="34" y="95" text-anchor="middle" font-size="13" font-weight="700" fill="#065f56">A</text>
  <rect x="52" y="74" width="108" height="32" rx="3" fill="#e8edff" stroke="#4c65b6" stroke-width="1.4"/>
  <text x="106" y="95" text-anchor="middle" font-size="13.5" font-weight="700" fill="#3a4f93">B 0.30</text>
  <rect x="160" y="74" width="216" height="32" rx="3" fill="#ece9df" stroke="#b8bcb5" stroke-width="1.2"/>
  <text x="268" y="95" text-anchor="middle" font-size="13.5" fill="#66716d">其余词 0.60</text>

  <!-- Case 1: apply_softmax=true [A, B] -> 0.25 -->
  <text x="16" y="136" font-size="13.5" font-weight="700" fill="#065f56">① 默认 apply_softmax=true 传 [A, B]（仅子集重归一）</text>
  <rect x="16" y="146" width="90" height="32" rx="3" fill="#ddf4ef" stroke="#087f73" stroke-width="1.5"/>
  <text x="61" y="167" text-anchor="middle" font-size="13.5" font-weight="700" fill="#065f56">A = 0.25</text>
  <rect x="106" y="146" width="270" height="32" rx="3" fill="#e8edff" stroke="#4c65b6" stroke-width="1.3"/>
  <text x="241" y="167" text-anchor="middle" font-size="13.5" fill="#3a4f93">B = 0.75（返回首项 A）</text>

  <!-- Case 2: single label [A] -> 1.0 trap -->
  <text x="16" y="208" font-size="13.5" font-weight="700" fill="#8f3229">② 误传单标签 [A]（apply_softmax=true 陷阱）</text>
  <rect x="16" y="218" width="360" height="32" rx="3" fill="#fff0e9" stroke="#b54237" stroke-width="1.5" stroke-dasharray="4 3"/>
  <text x="196" y="239" text-anchor="middle" font-size="13.5" font-weight="700" fill="#8f3229">0.1 ÷ 0.1 = 1.00（恒为 1，非模型确信！）</text>

  <!-- Case 3: apply_softmax=false -> raw 0.1 -->
  <text x="16" y="280" font-size="13.5" font-weight="700" fill="#936300">③ apply_softmax=false（raw_logprobs 模式）</text>
  <rect x="16" y="290" width="360" height="32" rx="3" fill="#ece9df" stroke="#b8bcb5" stroke-width="1.1"/>
  <rect x="16" y="290" width="36" height="32" rx="3" fill="#fff4cf" stroke="#c78300" stroke-width="1.5"/>
  <text x="62" y="311" font-size="13.5" font-weight="700" fill="#936300">exp(ln 0.1) = 0.10（全词表原概率）</text>
  <text x="16" y="342" font-size="13" fill="#936300">注：仅 raw_logprobs 为概率；raw_logits 时非概率</text>

  <text x="16" y="376" font-size="13.5" fill="#4d5652">硬边界：query 与 items 分别分词直拼不补空格/模板；</text>
  <text x="16" y="400" font-size="13.5" fill="#4d5652">超长截前 max_model_len-1；单 token 标签 ≤128 且未贯通 MTP</text>

  <!-- Right Half: /v1/realtime WebSocket Sequence -->
  <circle cx="480" cy="24" r="12" fill="#4c65b6"/>
  <text x="480" y="28.5" text-anchor="middle" font-size="13" font-weight="700" fill="#ffffff">2</text>
  <text x="500" y="30" font-size="16" font-weight="700" fill="#17211f">/v1/realtime 实时语音转写：事件时序与帧宽</text>

  <!-- Vertical flow of 5 events -->
  <rect x="472" y="54" width="410" height="44" rx="6" fill="#ece9df" stroke="#8a928f" stroke-width="1.3"/>
  <text x="486" y="81" font-size="13.5" font-weight="700" fill="#17211f">① 收 <tspan font-family="var(--font-mono)">session.created</tspan>（建立 WebSocket 会话）</text>

  <line x1="677" y1="98" x2="677" y2="116" stroke="#4c65b6" stroke-width="1.6" marker-end="url(#psa-arr-b)"/>

  <rect x="472" y="120" width="410" height="50" rx="6" fill="#e8edff" stroke="#4c65b6" stroke-width="1.4"/>
  <text x="486" y="142" font-size="13.5" font-weight="700" fill="#3a4f93">② 发 <tspan font-family="var(--font-mono)">session.update</tspan>（校验模型名称）</text>
  <text x="486" y="162" font-size="13" fill="#8f3229">此前先发 commit 会直接报错 model_not_validated</text>

  <line x1="677" y1="170" x2="677" y2="188" stroke="#4c65b6" stroke-width="1.6" marker-end="url(#psa-arr-b)"/>

  <rect x="472" y="192" width="410" height="44" rx="6" fill="#ddf4ef" stroke="#087f73" stroke-width="1.4"/>
  <text x="486" y="219" font-size="13.5" font-weight="700" fill="#065f56">③ 发普通 <tspan font-family="var(--font-mono)">input_audio_buffer.commit</tspan>（启动生成）</text>

  <line x1="677" y1="236" x2="677" y2="254" stroke="#087f73" stroke-width="1.6" marker-end="url(#psa-arr-t)"/>

  <rect x="472" y="258" width="410" height="82" rx="6" fill="#fff4cf" stroke="#c78300" stroke-width="1.4"/>
  <text x="486" y="280" font-size="13.5" font-weight="700" fill="#936300">④ 逐段 <tspan font-family="var(--font-mono)">input_audio_buffer.append</tspan></text>
  <text x="486" y="302" font-size="13.5" fill="#936300">PCM16 / 16kHz / 单声道（禁直传 MP3）</text>
  <text x="486" y="324" font-size="13" font-family="var(--font-mono)" fill="#4d5652">32,000 B/s 原始 → 42,668 base64 字符/s</text>

  <line x1="677" y1="340" x2="677" y2="358" stroke="#087f73" stroke-width="1.6" marker-end="url(#psa-arr-t)"/>

  <rect x="472" y="362" width="410" height="58" rx="6" fill="#f7e7f2" stroke="#9a4b86" stroke-width="1.4"/>
  <text x="486" y="385" font-size="13.5" font-weight="700" fill="#7a3a6a">⑤ 发 <tspan font-family="var(--font-mono)">commit (final=true)</tspan> 放结束标志</text>
  <text x="486" y="409" font-size="13" fill="#4d5652">期间收取 <tspan font-family="var(--font-mono)">transcription.delta</tspan> 与 <tspan font-family="var(--font-mono)">transcription.done</tspan></text>
</svg>
