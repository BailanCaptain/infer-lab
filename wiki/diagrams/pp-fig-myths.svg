<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 568" width="900" height="568" role="img" aria-label="流水线并行两段双微批节拍泳道与四大工程排雷判据" font-family="var(--font-sans)">
<title>流水线并行（PP）两段双微批节拍泳道与 v0.30.0 四大工程判据</title>
<desc>两段双微批节拍泳道展示同微批跨段串行与异微批重叠及气泡，并对照 get_pp_indices、VLLM_PP_LAYER_PARTITION、embed_tokens、lm_head、PPMissingLayer、MoeDistributeDispatch、MooncakeConnectorV1、_decode_pp_size 四项源码边界。</desc>
<defs>
  <marker id="pp-plum" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
    <path d="M1 1.5L8.5 5L1 8.5Z" fill="#9a4b86"/>
  </marker>
</defs>

<text x="16" y="29" font-size="16" font-weight="700" fill="#17211f">流水线并行（PP）节拍泳道与四大工程排雷判据（示意节拍 + v0.30.0 源码边界）</text>

<!-- ① 2-Stage × 2-Micro-batch Timeline Swimlane -->
<rect x="14" y="42" width="872" height="202" rx="10" fill="#fbfaf6" stroke="#087f73" stroke-width="1.3"/>
<text x="28" y="65" font-size="14" font-weight="700" fill="#065f56">① 两段双微批节拍泳道（PP=2 示意）：同微批跨段串行不降单请求延迟，异微批重叠填气泡提吞吐</text>

<g font-size="12" font-weight="700" fill="#66716d" text-anchor="middle">
  <text x="138" y="88">拍 0</text>
  <text x="298" y="88">拍 1</text>
  <text x="458" y="88">拍 2</text>
  <text x="614" y="88">拍 3</text>
</g>
<g stroke="#d8d8cf" stroke-width="1" stroke-dasharray="4 3">
  <line x1="138" y1="94" x2="138" y2="208"/>
  <line x1="298" y1="94" x2="298" y2="208"/>
  <line x1="458" y1="94" x2="458" y2="208"/>
  <line x1="614" y1="94" x2="614" y2="208"/>
</g>
<rect x="298" y="96" width="160" height="112" rx="6" fill="#ddf4ef" fill-opacity="0.35"/>

<text x="28" y="120" font-size="13" font-weight="700" fill="#17211f">Stage 0</text>
<text x="28" y="140" font-size="12" fill="#66716d">前半层</text>
<rect x="140" y="102" width="156" height="44" rx="6" fill="#ddf4ef" stroke="#087f73" stroke-width="1.3"/>
<text x="218" y="129" text-anchor="middle" font-size="12.5" font-weight="700" fill="#065f56">微批 A · 前半层</text>
<rect x="300" y="102" width="156" height="44" rx="6" fill="#e8edff" stroke="#4c65b6" stroke-width="1.3"/>
<text x="378" y="129" text-anchor="middle" font-size="12.5" font-weight="700" fill="#32478c">微批 B · 前半层</text>
<rect x="460" y="102" width="152" height="44" rx="6" fill="#ece9df" stroke="#9aa39f" stroke-width="1.2" stroke-dasharray="5 3"/>
<text x="536" y="129" text-anchor="middle" font-size="12" fill="#66716d">气泡（排空空闲）</text>

<text x="28" y="178" font-size="13" font-weight="700" fill="#17211f">Stage 1</text>
<text x="28" y="198" font-size="12" fill="#66716d">后半层（晚1拍）</text>
<rect x="140" y="160" width="156" height="44" rx="6" fill="#ece9df" stroke="#9aa39f" stroke-width="1.2" stroke-dasharray="5 3"/>
<text x="218" y="187" text-anchor="middle" font-size="12" fill="#66716d">气泡（等 A 激活）</text>
<rect x="300" y="160" width="156" height="44" rx="6" fill="#ddf4ef" stroke="#087f73" stroke-width="1.3"/>
<text x="378" y="187" text-anchor="middle" font-size="12.5" font-weight="700" fill="#065f56">微批 A · 后半层</text>
<rect x="460" y="160" width="152" height="44" rx="6" fill="#e8edff" stroke="#4c65b6" stroke-width="1.3"/>
<text x="536" y="187" text-anchor="middle" font-size="12.5" font-weight="700" fill="#32478c">微批 B · 后半层</text>

<g fill="none" stroke="#9a4b86" stroke-width="1.8" marker-end="url(#pp-plum)">
  <path d="M292 146 L306 158"/>
  <path d="M452 146 L466 158"/>
</g>
<text x="140" y="229" font-size="12.5" fill="#7a3a6a" font-weight="700">↘ P2P 交接：微批 A 沿拍 0→1→2 串行过段</text>
<text x="414" y="229" font-size="12.5" fill="#065f56" font-weight="700">★ 拍 1–2 异微批重叠（B ∥ A）</text>

<rect x="626" y="80" width="246" height="152" rx="7" fill="#ffffff" stroke="#d8d8cf" stroke-width="1.2"/>
<text x="638" y="102" font-size="13" font-weight="700" fill="#17211f">单请求 Decode 选型判据</text>
<text x="638" y="125" font-size="12" fill="#b54237">✗ 同一 token 前后层不能并行计算</text>
<text x="638" y="147" font-size="12" fill="#17211f">✓ 比机内 TP 多 P2P 交接与气泡</text>
<text x="638" y="169" font-size="12" fill="#4d5652">· 仅替慢跨机 TP 时或反降时延</text>
<text x="638" y="191" font-size="12" font-weight="700" fill="#065f56">· 单机装得下低延迟优先选 TP</text>
<text x="638" y="213" font-size="12" fill="#4d5652">· 靠 ≥ PP 个微批填满流水提吞吐</text>

<!-- ② Stage Memory Asymmetry -->
<rect x="14" y="256" width="428" height="168" rx="10" fill="#fbfaf6" stroke="#c78300" stroke-width="1.3"/>
<text x="28" y="279" font-size="14" font-weight="700" fill="#936300">② 层数均分 ≠ 显存均衡：首尾段多挂词表头尾模块</text>

<rect x="28" y="292" width="190" height="25" rx="4" fill="#fff4cf" stroke="#c78300" stroke-width="1.1"/>
<text x="123" y="309" text-anchor="middle" font-size="12" font-weight="700" fill="#936300">首段：embed_tokens</text>
<rect x="28" y="321" width="190" height="25" rx="4" fill="#e8edff" stroke="#4c65b6" stroke-width="1.1"/>
<text x="123" y="338" text-anchor="middle" font-size="12" fill="#32478c">L 层 Transformer</text>
<rect x="28" y="350" width="190" height="24" rx="4" fill="#ece9df" stroke="#9aa39f" stroke-width="1" stroke-dasharray="4 3"/>
<text x="123" y="366" text-anchor="middle" font-size="12" fill="#66716d">PPMissingLayer（无头）</text>

<rect x="232" y="292" width="196" height="24" rx="4" fill="#ece9df" stroke="#9aa39f" stroke-width="1" stroke-dasharray="4 3"/>
<text x="330" y="308" text-anchor="middle" font-size="12" fill="#66716d">PPMissingLayer（无嵌入）</text>
<rect x="232" y="320" width="196" height="25" rx="4" fill="#e8edff" stroke="#4c65b6" stroke-width="1.1"/>
<text x="330" y="337" text-anchor="middle" font-size="12" fill="#32478c">L 层 Transformer</text>
<rect x="232" y="349" width="196" height="27" rx="4" fill="#fff0e9" stroke="#b54237" stroke-width="1.2"/>
<text x="330" y="367" text-anchor="middle" font-size="12" font-weight="700" fill="#b54237">末段：norm+lm_head+采样/MTP</text>

<text x="28" y="395" font-size="12" fill="#4d5652">get_pp_indices 默认避开末段分配余数层（防末段先 OOM）</text>
<text x="28" y="414" font-size="12" font-weight="700" fill="#065f56">调优：实测各段显存，用 VLLM_PP_LAYER_PARTITION 调平</text>

<!-- ③ Cross-Node RoCE MoE Guardrail -->
<rect x="458" y="256" width="428" height="168" rx="10" fill="#fbfaf6" stroke="#b54237" stroke-width="1.3"/>
<text x="472" y="279" font-size="14" font-weight="700" fill="#8f3229">③ 跨机 RoCE MoE 禁区：启动未报错 ≠ 拓扑受支持</text>

<rect x="472" y="292" width="400" height="56" rx="6" fill="#fff0e9" stroke="#b54237" stroke-width="1.2"/>
<text x="484" y="314" font-size="12.5" font-weight="700" fill="#b54237">✗ 误配：跨机 RoCE MoE 同开 PP &gt; 1 与 DP &gt; 1</text>
<text x="484" y="337" font-size="12" fill="#8f3229">MoeDistributeDispatch 不支持；无启动拦截，运行期挂死！</text>

<rect x="472" y="356" width="400" height="56" rx="6" fill="#ddf4ef" stroke="#087f73" stroke-width="1.2"/>
<text x="484" y="378" font-size="12.5" font-weight="700" fill="#065f56">✓ 护栏：跨机 RoCE MoE 必须固定 PP = 1 或 DP = 1</text>
<text x="484" y="401" font-size="12" fill="#17211f">切勿仅凭卡数够乘积或进程能拉起就判定组合可用</text>

<!-- ④ Disaggregated P/D Mooncake Asymmetric Contract -->
<rect x="14" y="436" width="872" height="118" rx="10" fill="#fbfaf6" stroke="#4c65b6" stroke-width="1.3"/>
<text x="28" y="459" font-size="14" font-weight="700" fill="#32478c">④ P/D 分离 MooncakeConnectorV1 非对称契约：P 侧可开 PP，D 侧硬约束 decode.pp_size == 1</text>

<rect x="28" y="472" width="264" height="68" rx="7" fill="#e8edff" stroke="#4c65b6" stroke-width="1.2"/>
<text x="160" y="496" text-anchor="middle" font-size="12.5" font-weight="700" fill="#32478c">P 侧（Prefill）：允许 PP_P &gt; 1</text>
<text x="160" y="520" text-anchor="middle" font-size="12" fill="#17211f">VLLM_PP_LAYER_PARTITION 仅导 P 侧</text>

<rect x="312" y="472" width="276" height="68" rx="7" fill="#f7e7f2" stroke="#9a4b86" stroke-width="1.2"/>
<text x="450" y="496" text-anchor="middle" font-size="12.5" font-weight="700" fill="#7a3a6a">双端 extra_config 同步声明</text>
<text x="450" y="520" text-anchor="middle" font-size="12" fill="#17211f">同填 prefill.pp_size 与 pp_layer_partition</text>

<rect x="608" y="472" width="264" height="68" rx="7" fill="#ddf4ef" stroke="#087f73" stroke-width="1.2"/>
<text x="740" y="496" text-anchor="middle" font-size="12.5" font-weight="700" fill="#065f56">D 侧（Decode）：_decode_pp_size = 1</text>
<text x="740" y="520" text-anchor="middle" font-size="12" fill="#17211f">严禁照抄 PP&gt;1 或复制分段环境变量</text>

<g fill="none" stroke="#9a4b86" stroke-width="1.6" marker-end="url(#pp-plum)">
  <line x1="292" y1="506" x2="310" y2="506"/>
  <line x1="588" y1="506" x2="606" y2="506"/>
</g>
</svg>
