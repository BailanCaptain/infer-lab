<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 496" width="900" height="496" role="img" aria-label="流水线并行四大常见工程误判与源码真相排雷图" font-family="var(--font-sans)">
<title>流水线并行四大常见工程误判与 v0.30.0 源码真相排雷图</title>
<desc>get_pp_indices, VLLM_PP_LAYER_PARTITION, embed_tokens, lm_head, PPMissingLayer, MooncakeConnectorV1, MoeDistributeDispatch, _decode_pp_size</desc>
<line x1="14" y1="246" x2="886" y2="246" stroke="#b8bcb5" stroke-width="1.5" stroke-dasharray="6 4"/>
<line x1="450" y1="14" x2="450" y2="482" stroke="#b8bcb5" stroke-width="1.5" stroke-dasharray="6 4"/>
<circle cx="26" cy="28" r="12" fill="#b54237"/>
<text x="26" y="32.5" text-anchor="middle" font-size="12.5" font-weight="700" fill="#ffffff">1</text>
<text x="44" y="34" font-size="16" font-weight="700" fill="#17211f">单请求 Decode 时延误区</text>
<rect x="14" y="48" width="392" height="58" rx="6" fill="#fff0e9" stroke="#d88c82" stroke-width="1.3"/>
<text x="26" y="73" font-size="14" font-weight="700" fill="#b54237">✗ 误判：切 PP 段能让单条请求 Decode 更快</text>
<text x="26" y="95" font-size="13.5" fill="#8f3229">以为同一 token 的前后半层能同时并行计算</text>
<line x1="16" y1="120" x2="16" y2="226" stroke="#087f73" stroke-width="3"/>
<text x="28" y="138" font-size="14" font-weight="700" fill="#065f56">✓ 真相：单请求串行过段 + P2P 交接与气泡</text>
<text x="28" y="166" font-size="13.5" fill="#17211f">比机内 TP 多等待；靠 ≥PP 个微批填满提吞吐</text>
<text x="28" y="194" font-size="13.5" fill="#4d5652">仅在替代慢速跨机 TP 时，局部性或反降时延</text>
<text x="28" y="220" font-size="13.5" font-weight="700" fill="#087f73">判据：单机装得下且重低并发延迟时优先选 TP</text>
<circle cx="478" cy="28" r="12" fill="#c78300"/>
<text x="478" y="32.5" text-anchor="middle" font-size="12.5" font-weight="700" fill="#ffffff">2</text>
<text x="496" y="34" font-size="16" font-weight="700" fill="#17211f">层数均分 ≠ 首尾段显存均衡</text>
<rect x="466" y="48" width="392" height="58" rx="6" fill="#fff0e9" stroke="#d88c82" stroke-width="1.3"/>
<text x="478" y="73" font-size="14" font-weight="700" fill="#b54237">✗ 误判：隐藏层数均分 = 各段显存与耗时均等</text>
<text x="478" y="95" font-size="13.5" fill="#8f3229">忽略首尾额外模块与异构层/草稿模型开销</text>
<line x1="468" y1="120" x2="468" y2="226" stroke="#087f73" stroke-width="3"/>
<text x="480" y="138" font-size="13.5" font-weight="700" fill="#065f56">✓ 真相：首段多 embed_tokens，末段多 norm</text>
<text x="480" y="166" font-size="13.5" fill="#17211f">+ lm_head + 采样（及 MTP 草稿层）易先 OOM</text>
<text x="480" y="194" font-size="13.5" fill="#4d5652">get_pp_indices 默认避开末段分配余数层</text>
<text x="480" y="220" font-size="13.5" font-weight="700" fill="#087f73">调优：实测各段并用 VLLM_PP_LAYER_PARTITION</text>
<circle cx="26" cy="278" r="12" fill="#9a4b86"/>
<text x="26" y="282.5" text-anchor="middle" font-size="12.5" font-weight="700" fill="#ffffff">3</text>
<text x="44" y="284" font-size="16" font-weight="700" fill="#17211f">跨机 RoCE 下 PP×DP MoE 禁区</text>
<rect x="14" y="298" width="392" height="58" rx="6" fill="#fff0e9" stroke="#d88c82" stroke-width="1.3"/>
<text x="26" y="323" font-size="14" font-weight="700" fill="#b54237">✗ 误判：卡数够乘积就能跨机同开 PP&gt;1 与 DP&gt;1</text>
<text x="26" y="345" font-size="13.5" fill="#8f3229">以为启动未抛异常就代表通信拓扑受支持</text>
<line x1="16" y1="370" x2="16" y2="476" stroke="#b54237" stroke-width="3"/>
<text x="28" y="388" font-size="13.5" font-weight="700" fill="#8f3229">✓ 真相：跨机 RoCE MoE 暂不支持 PP&gt;1 × DP&gt;1</text>
<text x="28" y="416" font-size="13.5" fill="#17211f">MoeDistributeDispatch 不支持该组合通信路径</text>
<text x="28" y="444" font-size="13.5" font-weight="700" fill="#b54237">高危：Python 无启动拦截，误配运行期会挂死！</text>
<text x="28" y="470" font-size="13.5" font-weight="700" fill="#087f73">解法：跨机 RoCE MoE 必须固定 PP=1 或 DP=1</text>
<circle cx="478" cy="278" r="12" fill="#4c65b6"/>
<text x="478" y="282.5" text-anchor="middle" font-size="12.5" font-weight="700" fill="#ffffff">4</text>
<text x="496" y="284" font-size="16" font-weight="700" fill="#17211f">P/D 分离 Mooncake D 侧约束</text>
<rect x="466" y="298" width="392" height="58" rx="6" fill="#fff0e9" stroke="#d88c82" stroke-width="1.3"/>
<text x="478" y="323" font-size="14" font-weight="700" fill="#b54237">✗ 误判：P 侧开了 PP，D 侧也能照抄设 PP&gt;1</text>
<text x="478" y="345" font-size="13.5" fill="#8f3229">或把 P 侧分段环境变量原样复制给 D 进程</text>
<line x1="468" y1="370" x2="468" y2="476" stroke="#087f73" stroke-width="3"/>
<text x="480" y="388" font-size="13.5" font-weight="700" fill="#065f56">✓ 真相：MooncakeConnectorV1 要求 decode.pp_size=1</text>
<text x="480" y="416" font-size="13.5" fill="#17211f">双端 extra_config 同步写 prefill.pp_size</text>
<text x="480" y="444" font-size="13.5" fill="#4d5652">自定义分段双端同填 pp_layer_partition</text>
<text x="480" y="470" font-size="13.5" font-weight="700" fill="#087f73">禁忌：VLLM_PP_LAYER_PARTITION 仅导出于 P 侧</text>
</svg>
