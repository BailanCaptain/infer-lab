  <text x="92" y="162" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="12.5" font-weight="400" fill="var(--color-ink-muted, #5b6763)">静态 W8A8 的 apply 内，按类名精确匹配</text>
  <text x="92" y="179" font-family="'JetBrains Mono',ui-monospace,monospace" font-size="12.5" font-weight="400" fill="var(--color-weight, #b87a00)">AscendW8A8LinearMethod</text>
