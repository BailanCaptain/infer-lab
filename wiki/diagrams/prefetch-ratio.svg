<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 624" width="900" height="624" role="img" aria-label="v0.23.0 prefetch_ratio 三组四入口到预取字节换算、18 MiB 截断与零值回填整块规则" font-family="var(--font-sans)">
  <title>v0.23.0 维护分支中 prefetch_ratio 换算为预取字节数的流程：四处入口共享乘法公式，MLP 正值在 Python 侧截断到 18 MiB，启用组内缺项或写 0 会在 maybe_npu_prefetch 中转为整块请求；v0.24.0rc（PR #11949）起随父配置删除，v0.30.0 与 main 无等价替代键。</title>
  <desc>Four hook entry points for attn, moe, and mlp prefetch ratios in v0.23.0, byte calculation and 18 MiB MLP cap, zero-to-full-tensor trap, and v0.30.0/main removal notice.</desc>

  <text x="16" y="28" font-size="16" font-weight="700" fill="#17211f">v0.23.0 prefetch_ratio：三组四入口与预取字节换算流</text>
  <text x="16" y="48" font-size="13.5" fill="#66716d">mlp 与 moe 按模型类型互斥；attn 要求静态 W8A8 且输入非 int8（MLA / SFA 独立预取不读本比例）</text>

  <!-- 2x2 Entry Point Cards -->
  <rect x="16" y="66" width="424" height="82" rx="8" fill="#e8edff" stroke="#4c65b6" stroke-width="1.3"/>
  <text x="30" y="90" font-size="14.5" font-weight="700" fill="#3a4f93">attn.qkv / attn.o（默认 1.0 / 1.0）</text>
  <text x="30" y="113" font-size="13" fill="#4d5652" font-family="var(--font-mono)">AscendW8A8LinearMethod</text>
  <text x="30" y="135" font-size="13.5" fill="#4d5652">静态 W8A8 apply 内按类名精确匹配，无 token 门槛</text>

  <rect x="460" y="66" width="424" height="82" rx="8" fill="#f7e7f2" stroke="#9a4b86" stroke-width="1.3"/>
  <text x="474" y="90" font-size="14.5" font-weight="700" fill="#7a3a6a">moe.gate_up（默认 0.8）</text>
  <text x="474" y="113" font-size="13" fill="#4d5652" font-family="var(--font-mono)">select_experts</text>
  <text x="474" y="135" font-size="13.5" fill="#4d5652">MoE 模型，入口行数 ≥ 96 且须取到 w13_weight</text>

  <rect x="16" y="160" width="424" height="82" rx="8" fill="#ddf4ef" stroke="#087f73" stroke-width="1.3"/>
  <text x="30" y="184" font-size="14.5" font-weight="700" fill="#065f56">mlp.gate_up（默认 1.0）</text>
  <text x="30" y="207" font-size="13" fill="#4d5652" font-family="var(--font-mono)">CustomRowParallelOp</text>
  <text x="30" y="229" font-size="13.5" fill="#4d5652">稠密模型、token &lt; 500，在自定义行并行 apply 触发</text>

  <rect x="460" y="160" width="424" height="82" rx="8" fill="#ddf4ef" stroke="#087f73" stroke-width="1.3"/>
  <text x="474" y="184" font-size="14.5" font-weight="700" fill="#065f56">mlp.down（默认 1.0）</text>
  <text x="474" y="207" font-size="13" fill="#4d5652" font-family="var(--font-mono)">AscendSiluAndMul</text>
  <text x="474" y="229" font-size="13.5" fill="#4d5652">稠密模型、token &lt; 500，在带钩子 SwiGLU 前触发</text>

  <!-- Connector down to byte calculation -->
  <path d="M450 246 V274 m-5-5 l5 5 5-5" fill="none" stroke="#66716d" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="464" y="264" font-size="13" fill="#66716d">满足父开关与路径门槛后进入字节换算</text>

  <!-- 3-step byte conversion pipeline -->
  <rect x="16" y="280" width="270" height="98" rx="8" fill="#ece9df" stroke="#b8bcb5" stroke-width="1.3"/>
  <text x="30" y="304" font-size="14.5" font-weight="700" fill="#17211f">① 比例乘成字节数</text>
  <text x="30" y="327" font-size="13" fill="#4d5652" font-family="var(--font-mono)">int(ratio * weight_bytes)</text>
  <text x="30" y="350" font-size="13.5" fill="#4d5652">按本卡分片权重字节数取整</text>
  <text x="30" y="369" font-size="13" fill="#66716d">越界值（1.2 / -0.5）构造时丢弃</text>

  <path d="M286 329 H310 m-5-5 l5 5 -5 5" fill="none" stroke="#66716d" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/>

  <rect x="315" y="280" width="270" height="98" rx="8" fill="#fff4cf" stroke="#c78300" stroke-width="1.4"/>
  <text x="329" y="304" font-size="14.5" font-weight="700" fill="#936300">② MLP 侧 18 MiB 截断</text>
  <text x="329" y="327" font-size="13" fill="#4d5652" font-family="var(--font-mono)">MAX_PREFETCH_WEIGHT_SIZE</text>
  <text x="329" y="350" font-size="13.5" fill="#4d5652">MLP 正字节请求截断至 18 MiB</text>
  <text x="329" y="369" font-size="13" fill="#66716d">attn / moe 后端上限仍待实机核验</text>

  <path d="M585 329 H609 m-5-5 l5 5 -5 5" fill="none" stroke="#66716d" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/>

  <rect x="614" y="280" width="270" height="98" rx="8" fill="#ddf4ef" stroke="#087f73" stroke-width="1.4"/>
  <text x="628" y="304" font-size="14.5" font-weight="700" fill="#065f56">③ 独立流提交预取</text>
  <text x="628" y="327" font-size="13" fill="#4d5652" font-family="var(--font-mono)">maybe_npu_prefetch</text>
  <text x="628" y="350" font-size="13.5" fill="#4d5652">切流调 npu_prefetch 搬至 L2</text>
  <text x="628" y="369" font-size="13" fill="#66716d">计算流在 postprocess 处等回</text>

  <!-- Trap callout card -->
  <rect x="16" y="396" width="868" height="106" rx="8" fill="#fff4cf" stroke="#c78300" stroke-width="1.4"/>
  <text x="30" y="421" font-size="14.5" font-weight="700" fill="#936300">关键陷阱：启用组内漏写或写 0，会在 maybe_npu_prefetch 中改写成「整块权重」请求</text>
  <text x="30" y="446" font-size="13.5" fill="#4d5652">• 传了 prefetch_ratio 就整体替换默认字典；非空组里漏项或乘积取整为 0 时，max_size ≤ 0 会被改为整块权重</text>
  <text x="30" y="470" font-size="13.5" fill="#4d5652">• 只有整组过滤后全为 0 或为空才会关闭该组；输入空 dict 或漏写整组会先回填默认，与「过滤后为空」不同</text>
  <text x="30" y="492" font-size="13" fill="#66716d">提示：越界值静默丢弃不报错，若同组仍有非零项且进入调用，被丢弃项即按缺项走整块请求</text>

  <!-- Removal card -->
  <rect x="16" y="516" width="868" height="92" rx="8" fill="#fff0e9" stroke="#b54237" stroke-width="1.3"/>
  <text x="30" y="540" font-size="14.5" font-weight="700" fill="#8f3229">v0.24.0rc（PR #11949）随父配置删除：v0.30.0 (c09d3e20) / main (8d6180e2) 无等价替代键</text>
  <text x="30" y="564" font-size="13.5" fill="#4d5652">• v0.26.0rc 静默忽略旧父键；v0.30.0 与 main 通常按 extra="forbid" 拒收（装有 vllm_omni 时告警过滤）</text>
  <text x="30" y="588" font-size="13.5" fill="#4d5652">• 把子键挪到顶层同样无效；磁盘预读 --safetensors-load-strategy 与 CPU offload 均不沿用这组比例</text>
</svg>
