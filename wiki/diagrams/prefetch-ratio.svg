  <path d="M320 588 l0 9 L578 597 l0 -9" fill="none" stroke="var(--color-accent, #e85b32)" stroke-width="1.4" opacity="0.75"/>
  <text x="449" y="615" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="12.5" font-weight="600" fill="var(--color-accent, #e85b32)" text-anchor="middle">mlp 这一侧超过 18 MiB 就被截平，0.8 与 1.0 可能等价；attn / moe 要等后端上限核实</text>
  <text x="20" y="744" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="12.5" font-weight="400" fill="var(--color-ink-muted, #5b6763)">整组全零会关闭该组；过滤后无有效非零项也会关闭。空 dict 或整组省略则回填默认；父开关关闭时均不发预取。</text>
  <text x="20" y="770" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="12.5" font-weight="600" fill="var(--color-ink, #17211f)">越界值（1.2、-0.5）在构造时丢弃；剩余同组仍有非零项且实际进入调用，缺项才会按零尺寸处理。</text>
</svg>
