<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 716" width="900" height="716" role="img" aria-label="五个比例各管一条路，走的却是同一个算式：ratio × 单卡权重字节数，再被 18 MiB 夹一次（vllm-ascend v0.23 维护分支）">
  <title>五个比例各管一条路，走的却是同一个算式：ratio × 单卡权重字节数，再被 18 MiB 夹一次（vllm-ascend v0.23 维护分支）</title>
  <rect width="900" height="716" fill="var(--color-surface, #fbfaf6)"/>
  <rect x="20" y="44" width="860" height="206" rx="12" fill="var(--color-weight-soft, #fff4cf)"/>
  <rect x="36" y="58" width="170.5" height="26.5" rx="13.3" fill="var(--color-weight, #b87a00)"/><text x="47" y="76.1" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="13.5" font-weight="700" fill="var(--color-ink-inverse, #ffffff)">三组比例，三道各自的门</text>
  <text x="38" y="101" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="12.5" font-weight="400" fill="var(--color-ink-muted, #5b6763)">mlp 与 moe 按模型类型互斥，一次运行最多有一组生效；attn 那一组还要模型是 W8A8 静态量化</text>
  <rect x="20" y="302" width="860" height="208" rx="12" fill="var(--color-kv-soft, #e8edff)"/>
  <rect x="36" y="316" width="224.5" height="26.5" rx="13.3" fill="var(--color-kv, #4c65b6)"/><text x="47" y="334.1" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="13.5" font-weight="700" fill="var(--color-ink-inverse, #ffffff)">写进去的小数怎么变成搬运字节数</text>
  <text x="38" y="359" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="12.5" font-weight="400" fill="var(--color-ink-muted, #5b6763)">三组共用这条算式，差别只在谁来夹上限</text>
  <rect x="40" y="142" width="256" height="96" rx="11" fill="var(--color-surface, #fbfaf6)" stroke="var(--color-weight, #b87a00)" stroke-width="1.5"/>
  <rect x="52" y="174" width="32" height="32" rx="9" fill="var(--color-weight-soft, #fff4cf)"/><g transform="translate(58.4 180.4) scale(0.8)" fill="none" stroke="var(--color-weight, #b87a00)" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M7 7h10v10H7z M10 3v4M14 3v4M10 17v4M14 17v4M3 10h4M3 14h4M17 10h4M17 14h4"/></g>
  <text x="92" y="178" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="14.5" font-weight="700" fill="var(--color-ink, #17211f)">attn.qkv / attn.o</text>
  <text x="92" y="196" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="12.5" font-weight="400" fill="var(--color-ink-muted, #5b6763)">起点在量化线性层内部</text>
  <text x="92" y="213" font-family="'JetBrains Mono',ui-monospace,monospace" font-size="12.5" font-weight="400" fill="var(--color-weight, #b87a00)">AscendW8A8LinearMethod</text>
  <rect x="318" y="142" width="256" height="96" rx="11" fill="var(--color-surface, #fbfaf6)" stroke="var(--color-weight, #b87a00)" stroke-width="1.5"/>
  <rect x="330" y="174" width="32" height="32" rx="9" fill="var(--color-weight-soft, #fff4cf)"/><g transform="translate(336.4 180.4) scale(0.8)" fill="none" stroke="var(--color-weight, #b87a00)" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3l8 5v8l-8 5-8-5V8z M12 3v18"/></g>
  <text x="370" y="178" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="14.5" font-weight="700" fill="var(--color-ink, #17211f)">moe.gate_up</text>
  <text x="370" y="196" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="12.5" font-weight="400" fill="var(--color-ink-muted, #5b6763)">门控 top_k 之前，token ≥ 96</text>
  <text x="370" y="213" font-family="'JetBrains Mono',ui-monospace,monospace" font-size="12.5" font-weight="400" fill="var(--color-weight, #b87a00)">select_experts</text>
  <rect x="596" y="142" width="256" height="96" rx="11" fill="var(--color-surface, #fbfaf6)" stroke="var(--color-weight, #b87a00)" stroke-width="1.5"/>
  <rect x="608" y="174" width="32" height="32" rx="9" fill="var(--color-weight-soft, #fff4cf)"/><g transform="translate(614.4 180.4) scale(0.8)" fill="none" stroke="var(--color-weight, #b87a00)" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3l9 5-9 5-9-5z M3 13l9 5 9-5"/></g>
  <text x="648" y="178" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="14.5" font-weight="700" fill="var(--color-ink, #17211f)">mlp.gate_up / down</text>
  <text x="648" y="196" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="12.5" font-weight="400" fill="var(--color-ink-muted, #5b6763)">稠密模型，token &lt; 500</text>
  <text x="648" y="213" font-family="'JetBrains Mono',ui-monospace,monospace" font-size="12.5" font-weight="400" fill="var(--color-weight, #b87a00)">AscendSiluAndMul</text>
  <rect x="40" y="396" width="258" height="96" rx="11" fill="var(--color-surface, #fbfaf6)" stroke="var(--color-kv, #4c65b6)" stroke-width="1.5"/>
  <rect x="52" y="428" width="32" height="32" rx="9" fill="var(--color-kv-soft, #e8edff)"/><g transform="translate(58.4 434.4) scale(0.8)" fill="none" stroke="var(--color-kv, #4c65b6)" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M5 3h14v18H5z M8 7h8M8 11h2M12 11h2M8 15h2M12 15h2"/></g>
  <text x="92" y="432" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="14.5" font-weight="700" fill="var(--color-ink, #17211f)">① 乘成字节数</text>
  <text x="92" y="450" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="12.5" font-weight="400" fill="var(--color-ink-muted, #5b6763)">单卡权重字节 × 这一项的比例</text>
  <text x="92" y="467" font-family="'JetBrains Mono',ui-monospace,monospace" font-size="12.5" font-weight="400" fill="var(--color-kv, #4c65b6)">prefetch_ratio</text>
  <rect x="320" y="396" width="258" height="96" rx="11" fill="var(--color-surface, #fbfaf6)" stroke="var(--color-kv, #4c65b6)" stroke-width="1.5"/>
  <rect x="332" y="428" width="32" height="32" rx="9" fill="var(--color-kv-soft, #e8edff)"/><g transform="translate(338.4 434.4) scale(0.8)" fill="none" stroke="var(--color-kv, #4c65b6)" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M12 8a4 4 0 1 0 0 8 4 4 0 0 0 0-8z M12 2v3M12 19v3M2 12h3M19 12h3M5 5l2 2M17 17l2 2M19 5l-2 2M7 17l-2 2"/></g>
  <text x="372" y="432" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="14.5" font-weight="700" fill="var(--color-ink, #17211f)">② 夹到 18 MiB</text>
  <text x="372" y="450" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="12.5" font-weight="400" fill="var(--color-ink-muted, #5b6763)">mlp 自己夹，其余靠后端夹</text>
  <text x="372" y="467" font-family="'JetBrains Mono',ui-monospace,monospace" font-size="12.5" font-weight="400" fill="var(--color-kv, #4c65b6)">MAX_PREFETCH_WEIGHT_SIZE</text>
  <rect x="600" y="396" width="258" height="96" rx="11" fill="var(--color-surface, #fbfaf6)" stroke="var(--color-accent, #e85b32)" stroke-width="1.5"/>
  <rect x="612" y="428" width="32" height="32" rx="9" fill="var(--color-accent-soft, #fff0e9)"/><g transform="translate(618.4 434.4) scale(0.8)" fill="none" stroke="var(--color-accent, #e85b32)" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M13 2L4 14h7l-1 8 9-12h-7z"/></g>
  <text x="652" y="432" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="14.5" font-weight="700" fill="var(--color-ink, #17211f)">③ 副流上发预取</text>
  <text x="652" y="450" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="12.5" font-weight="400" fill="var(--color-ink-muted, #5b6763)">计算流在 postprocess 处等回来</text>
  <text x="652" y="467" font-family="'JetBrains Mono',ui-monospace,monospace" font-size="12.5" font-weight="400" fill="var(--color-accent, #e85b32)">npu_prefetch</text>
  <rect x="40" y="560" width="820" height="84" rx="11" fill="var(--color-surface, #fbfaf6)" stroke="var(--color-accent, #e85b32)" stroke-width="1.5"/>
  <rect x="52" y="586" width="32" height="32" rx="9" fill="var(--color-accent-soft, #fff0e9)"/><g transform="translate(58.4 592.4) scale(0.8)" fill="none" stroke="var(--color-accent, #e85b32)" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M13 2L4 14h7l-1 8 9-12h-7z"/></g>
  <text x="92" y="590" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="14.5" font-weight="700" fill="var(--color-ink, #17211f)">漏写一项不是「不预取」，是 100% 预取</text>
  <text x="92" y="608" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="12.5" font-weight="400" fill="var(--color-ink-muted, #5b6763)">比例取不到按 0 算，而 max_size ≤ 0 会被改写成整块权重——方向正好反了</text>
  <text x="92" y="625" font-family="'JetBrains Mono',ui-monospace,monospace" font-size="12.5" font-weight="400" fill="var(--color-accent, #e85b32)">maybe_npu_prefetch</text>
  <path d="M298 444 L318 444" fill="none" stroke="var(--color-kv, #4c65b6)" stroke-width="1.8"/>
  <path d="M318 444 l-11 -5.5 l0 11 z" fill="var(--color-kv, #4c65b6)"/>
  <path d="M578 444 L598 444" fill="none" stroke="var(--color-kv, #4c65b6)" stroke-width="1.8"/>
  <path d="M598 444 l-11 -5.5 l0 11 z" fill="var(--color-kv, #4c65b6)"/>
  <path d="M169 250 L169 300" fill="none" stroke="var(--color-weight, #b87a00)" stroke-width="1.8"/>
  <path d="M169 300 l-5.5 -11 l11 0 z" fill="var(--color-weight, #b87a00)"/>
  <path d="M447 250 L447 300" fill="none" stroke="var(--color-weight, #b87a00)" stroke-width="1.8"/>
  <path d="M447 300 l-5.5 -11 l11 0 z" fill="var(--color-weight, #b87a00)"/>
  <path d="M725 250 L725 300" fill="none" stroke="var(--color-weight, #b87a00)" stroke-width="1.8"/>
  <path d="M725 300 l-5.5 -11 l11 0 z" fill="var(--color-weight, #b87a00)"/>
  <path d="M320 518 l0 9 L578 527 l0 -9" fill="none" stroke="var(--color-accent, #e85b32)" stroke-width="1.4" opacity="0.75"/>
  <text x="449" y="545" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="12.5" font-weight="600" fill="var(--color-accent, #e85b32)" text-anchor="middle">权重一超过 22.5 MiB，0.8 和 1.0 在这里被夹成同一个数</text>
  <text x="20" y="674" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="12.5" font-weight="400" fill="var(--color-ink-muted, #5b6763)">想关掉一组，唯一正确的写法是把该组每一项都写成 0——全 0 时这一组的 enable 被置 False；写成空 dict 或整组不写，都会回退到内建默认值。</text>
  <text x="20" y="700" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="12.5" font-weight="600" fill="var(--color-ink, #17211f)">越界值（1.2、-0.5）在构造阶段被静默丢出字典，随后就落进上面那条「按 0 算」的分支。</text>
</svg>
