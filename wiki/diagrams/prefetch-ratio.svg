  <text x="38" y="101" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="12.5" font-weight="400" fill="var(--color-ink-muted, #5b6763)">mlp 与 moe 按模型类型互斥；attn 要求当前层走静态 W8A8 且输入不是 int8</text>
