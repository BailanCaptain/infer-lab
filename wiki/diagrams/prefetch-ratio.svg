<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 786" width="900" height="786" role="img" aria-label="满足开关与调用条件后，比例乘本地权重字节数；MLP 正请求尺寸在 Python 截到 18 MiB，零尺寸在公共封装改为整块。attn / moe 后端上限待核（v0.23 维护分支）">
  <title>满足开关与调用条件后，比例乘本地权重字节数；MLP 正请求尺寸在 Python 截到 18 MiB，零尺寸在公共封装改为整块。attn / moe 后端上限待核（v0.23 维护分支）</title>
