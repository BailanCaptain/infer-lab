layout: scene
id: prefetch-ratio
caption: 五个比例各管一条路，走的却是同一个算式：ratio × 单卡权重字节数，再被 18 MiB 夹一次（vllm-ascend v0.23 维护分支）
size: [900, 716]

regions:
  - label: 三组比例，三道各自的门
    note: mlp 与 moe 按模型类型互斥，一次运行最多有一组生效；attn 那一组还要模型是 W8A8 静态量化
    at: [20, 44]
    size: [860, 206]
    tone: ascend
  - label: 写进去的小数怎么变成搬运字节数
    note: 三组共用这条算式，差别只在谁来夹上限
    at: [20, 302]
    size: [860, 208]
    tone: neutral

boxes:
  - at: [40, 142]
    size: [256, 96]
    title: attn.qkv / attn.o
    sub: 起点在量化线性层内部
    fn: AscendW8A8LinearMethod
    tone: ascend
    icon: chip
  - at: [318, 142]
    size: [256, 96]
    title: moe.gate_up
    sub: 门控 top_k 之前，token ≥ 96
    fn: select_experts
    tone: ascend
    icon: pick
  - at: [596, 142]
    size: [256, 96]
    title: mlp.gate_up / down
    sub: 稠密模型，token < 500
    fn: AscendSiluAndMul
    tone: ascend
    icon: layers

  - at: [40, 396]
    size: [258, 96]
    title: ① 乘成字节数
    sub: 单卡权重字节 × 这一项的比例
    fn: prefetch_ratio
    tone: neutral
    icon: calc
  - at: [320, 396]
    size: [258, 96]
    title: ② 夹到 18 MiB
    sub: mlp 自己夹，其余靠后端夹
    fn: MAX_PREFETCH_WEIGHT_SIZE
    tone: neutral
    icon: gear
  - at: [600, 396]
    size: [258, 96]
    title: ③ 副流上发预取
    sub: 计算流在 postprocess 处等回来
    fn: npu_prefetch
    tone: accent
    icon: bolt

  - at: [40, 560]
    size: [820, 84]
    title: "漏写一项不是「不预取」，是 100% 预取"
    sub: 比例取不到按 0 算，而 max_size ≤ 0 会被改写成整块权重——方向正好反了
    fn: maybe_npu_prefetch
    tone: accent
    icon: bolt

arrows:
  - { from: [298, 444], to: [318, 444], tone: neutral }
  - { from: [578, 444], to: [598, 444], tone: neutral }
