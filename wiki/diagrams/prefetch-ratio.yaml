  - { from: [447, 250], to: [447, 300], tone: ascend }
  - { from: [725, 250], to: [725, 300], tone: ascend }

brackets:
  - { at: [320, 518], span: 258, dir: down, label: 权重一超过 22.5 MiB，0.8 和 1.0 在这里被夹成同一个数, tone: accent }

notes:
  - at: [20, 674]
    text: "想关掉一组，唯一正确的写法是把该组每一项都写成 0——全 0 时这一组的 enable 被置 False；写成空 dict 或整组不写，都会回退到内建默认值。"
    size: 12.5
    width: 860
  - at: [20, 700]
    text: "越界值（1.2、-0.5）在构造阶段被静默丢出字典，随后就落进上面那条「按 0 算」的分支。"
    size: 12.5
    width: 860
    strong: true

