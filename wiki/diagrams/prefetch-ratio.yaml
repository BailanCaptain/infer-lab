layout: scene
id: prefetch-ratio
caption: 五个比例各管一条路，走的却是同一个算式：ratio × 单卡权重字节数；之后 mlp 在 Python 侧截到 18 MiB，attn / moe 的后端上限待核（vllm-ascend v0.23 维护分支）
size: [900, 786]

regions:
  - label: 三组比例，四个各自的入口
    note: mlp 与 moe 按模型类型互斥，一次运行最多有一组生效；attn 那一组还要模型是 W8A8 静态量化
    at: [20, 44]
    size: [860, 300]
    tone: ascend
  - label: 写进去的小数怎么变成搬运字节数
    note: 三组共用这条算式，差别在于截不截、由谁来截
    at: [20, 372]
    size: [860, 208]
    tone: neutral

boxes:
  - at: [40, 108]
    size: [390, 96]
    title: attn.qkv / attn.o
    sub: 静态 W8A8 的 apply 内，按类名精确匹配
    fn: AscendW8A8LinearMethod
    tone: ascend
    icon: chip
  - at: [460, 108]
    size: [390, 96]
    title: moe.gate_up
    sub: token ≥ 96，还要取得到 w13_weight
    fn: select_experts
    tone: ascend
    icon: pick
  - at: [40, 220]
    size: [390, 96]
    title: mlp.gate_up
    sub: 稠密模型、token < 500，入口在行并行 apply
    fn: CustomRowParallelOp
    tone: ascend
    icon: layers
  - at: [460, 220]
    size: [390, 96]
    title: mlp.down
    sub: 同样的门槛，走带钩子的 SwiGLU
    fn: AscendSiluAndMul
    tone: ascend
    icon: layers

  - at: [40, 466]
    size: [258, 96]
    title: ① 乘成字节数
    sub: 单卡权重字节 × 这一项的比例
    fn: prefetch_ratio
    tone: neutral
    icon: calc
  - at: [320, 466]
    size: [258, 96]
    title: ② 看要不要截
    sub: mlp 截到 18 MiB；其余待核
    fn: MAX_PREFETCH_WEIGHT_SIZE
    tone: neutral
    icon: gear
  - at: [600, 466]
    size: [258, 96]
    title: ③ 副流上发预取
    sub: 计算流在 postprocess 处等回来
    fn: npu_prefetch
    tone: accent
    icon: bolt

  - at: [40, 630]
    size: [820, 84]
    title: "漏写一项不是「不预取」，是 100% 预取"
    sub: 比例取不到按 0 算，而 max_size ≤ 0 会被改写成整块权重——方向正好反了
    fn: maybe_npu_prefetch
    tone: accent
    icon: bolt

