<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 388" width="900" height="388" role="img" aria-label="提示词概率 prompt_logprobs 错位一格评分原理与额外开销图示" font-family="var(--font-sans)">
  <title>提示词概率（prompt_logprobs）错位 1 格评分原理：隐藏向量 h₀..h₂ 分别投影评估下一枚已知提示词 x₁..x₃，末行 h₃ 照常选出首词 y₀，首位置 x₀ 因无前序位置固定返回 None（扁平容器为 {}）；开启后新增 N-1 行 lm_head 投影开销并默认跳过前缀缓存读取。</title>
  <desc>关联源码符号：_get_prompt_logprobs_dict, prompt_logprobs, compute_logits, skip_reading_prefix_cache</desc>
  <defs>
    <marker id="plp-amber" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto">
      <path d="M 0 1.5 L 8.5 5 L 0 8.5 z" fill="#c78300"/>
    </marker>
    <marker id="plp-teal" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto">
      <path d="M 0 1.5 L 8.5 5 L 0 8.5 z" fill="#087f73"/>
    </marker>
  </defs>

  <text x="14" y="28" font-size="16" font-weight="700" fill="#17211f">prompt_logprobs 错位 1 格评分：hᵢ 已看过 xᵢ，只能投影评估下一枚 xᵢ₊₁</text>
  <line x1="14" y1="40" x2="886" y2="40" stroke="#b8bcb5" stroke-width="1.3"/>

  <!-- Top row label -->
  <text x="14" y="84" font-size="14" font-weight="700" fill="#4d5652">已知序列</text>
  <text x="14" y="104" font-size="13.5" fill="#66716d">与首输出</text>

  <!-- x0..x3 token tiles + y0 -->
  <rect x="92" y="58" width="134" height="54" rx="7" fill="#ece9df" stroke="#8a928f" stroke-width="1.4" stroke-dasharray="4 3"/>
  <text x="159" y="81" text-anchor="middle" font-size="14.5" font-weight="700" fill="#4d5652">x₀（首位置）</text>
  <text x="159" y="103" text-anchor="middle" font-family="var(--font-mono)" font-size="13.5" font-weight="700" fill="#8f3229">None / {}</text>

  <rect x="248" y="58" width="134" height="54" rx="7" fill="#fff4cf" stroke="#c78300" stroke-width="1.5"/>
  <text x="315" y="81" text-anchor="middle" font-size="14.5" font-weight="700" fill="#936300">x₁（已知词）</text>
  <text x="315" y="103" text-anchor="middle" font-size="13.5" fill="#4d5652">如「你」ln p≈-1.46</text>

  <rect x="404" y="58" width="134" height="54" rx="7" fill="#fff4cf" stroke="#c78300" stroke-width="1.5"/>
  <text x="471" y="81" text-anchor="middle" font-size="14.5" font-weight="700" fill="#936300">x₂（已知词）</text>
  <text x="471" y="103" text-anchor="middle" font-size="13.5" fill="#4d5652">取真实 x₂ 得分</text>

  <rect x="560" y="58" width="134" height="54" rx="7" fill="#fff4cf" stroke="#c78300" stroke-width="1.5"/>
  <text x="627" y="81" text-anchor="middle" font-size="14.5" font-weight="700" fill="#936300">x₃（末提示词）</text>
  <text x="627" y="103" text-anchor="middle" font-size="13.5" fill="#4d5652">取真实 x₃ 得分</text>

  <rect x="722" y="58" width="164" height="54" rx="7" fill="#ddf4ef" stroke="#087f73" stroke-width="1.8"/>
  <text x="804" y="81" text-anchor="middle" font-size="14.5" font-weight="700" fill="#065f56">新输出首词 y₀</text>
  <text x="804" y="103" text-anchor="middle" font-size="13.5" fill="#065f56">经采样选出（常驻）</text>

  <!-- Diagonal arrows h_i -> x_{i+1} -->
  <path d="M 190 180 L 296 117" fill="none" stroke="#c78300" stroke-width="2" stroke-dasharray="5 3" marker-end="url(#plp-amber)"/>
  <path d="M 346 180 L 452 117" fill="none" stroke="#c78300" stroke-width="2" stroke-dasharray="5 3" marker-end="url(#plp-amber)"/>
  <path d="M 502 180 L 608 117" fill="none" stroke="#c78300" stroke-width="2" stroke-dasharray="5 3" marker-end="url(#plp-amber)"/>
  <path d="M 658 180 L 774 117" fill="none" stroke="#087f73" stroke-width="2.4" marker-end="url(#plp-teal)"/>

  <!-- Mid labels along arrows -->
  <text x="159" y="144" text-anchor="middle" font-size="13.5" fill="#8f3229">无前序输入</text>
  <text x="159" y="164" text-anchor="middle" font-size="13.5" fill="#66716d">绝非概率为 0</text>
  <text x="272" y="158" text-anchor="middle" font-size="13.5" font-weight="700" fill="#936300">lm_head</text>
  <text x="428" y="158" text-anchor="middle" font-size="13.5" font-weight="700" fill="#936300">lm_head</text>
  <text x="584" y="158" text-anchor="middle" font-size="13.5" font-weight="700" fill="#936300">lm_head</text>
  <text x="760" y="160" text-anchor="middle" font-family="var(--font-mono)" font-size="13.5" font-weight="700" fill="#065f56">logits_indices</text>

  <!-- Bottom row label -->
  <text x="14" y="204" font-size="14" font-weight="700" fill="#4d5652">末层隐藏</text>
  <text x="14" y="224" font-size="13.5" fill="#66716d">向量输出</text>

  <!-- h0..h3 tiles -->
  <rect x="92" y="182" width="134" height="52" rx="7" fill="#fff4cf" stroke="#c78300" stroke-width="1.4" stroke-dasharray="5 3"/>
  <text x="159" y="204" text-anchor="middle" font-family="var(--font-mono)" font-size="14.5" font-weight="700" fill="#936300">h₀ (看 0)</text>
  <text x="159" y="225" text-anchor="middle" font-size="13.5" fill="#66716d">额外投影 · 评 x₁</text>

  <rect x="248" y="182" width="134" height="52" rx="7" fill="#fff4cf" stroke="#c78300" stroke-width="1.4" stroke-dasharray="5 3"/>
  <text x="315" y="204" text-anchor="middle" font-family="var(--font-mono)" font-size="14.5" font-weight="700" fill="#936300">h₁ (看 0..1)</text>
  <text x="315" y="225" text-anchor="middle" font-size="13.5" fill="#66716d">额外投影 · 评 x₂</text>

  <rect x="404" y="182" width="134" height="52" rx="7" fill="#fff4cf" stroke="#c78300" stroke-width="1.4" stroke-dasharray="5 3"/>
  <text x="471" y="204" text-anchor="middle" font-family="var(--font-mono)" font-size="14.5" font-weight="700" fill="#936300">h₂ (看 0..2)</text>
  <text x="471" y="225" text-anchor="middle" font-size="13.5" fill="#66716d">额外投影 · 评 x₃</text>

  <rect x="560" y="182" width="134" height="52" rx="7" fill="#ddf4ef" stroke="#087f73" stroke-width="1.8"/>
  <text x="627" y="204" text-anchor="middle" font-family="var(--font-mono)" font-size="14.5" font-weight="700" fill="#065f56">h₃ (看 0..3)</text>
  <text x="627" y="225" text-anchor="middle" font-size="13.5" font-weight="700" fill="#065f56">普通路径必切末行</text>

  <rect x="722" y="182" width="164" height="52" rx="7" fill="#e8edff" stroke="#4c65b6" stroke-width="1.3"/>
  <text x="804" y="204" text-anchor="middle" font-size="14" font-weight="700" fill="#3a4f93">k &gt; 0 最多返 k+1 项</text>
  <text x="804" y="225" text-anchor="middle" font-size="13.5" fill="#4d5652">k = 0 仅留实际词分</text>

  <!-- Divider -->
  <line x1="14" y1="252" x2="886" y2="252" stroke="#b8bcb5" stroke-width="1.4" stroke-dasharray="6 4"/>

  <!-- Bottom 2 engineering cost callouts (open left-bar style) -->
  <rect x="14" y="268" width="4" height="106" rx="2" fill="#c78300"/>
  <text x="28" y="288" font-size="15" font-weight="700" fill="#936300">开销一：不重跑 36 层主干，全压在 N−1 行词表投影</text>
  <text x="28" y="314" font-size="13.5" fill="#17211f">• Qwen3-8B（N=2048）即使传 <tspan font-family="var(--font-mono)" font-weight="700">prompt_logprobs=0</tspan>：</text>
  <text x="42" y="338" font-size="13.5" fill="#4d5652">仍算 <tspan font-family="var(--font-mono)" font-weight="700">[2047, 151936]</tspan>（FP32 约 <tspan font-weight="700" fill="#936300">1.16 GiB</tspan>）并全词表归一</text>
  <text x="28" y="364" font-size="13.5" fill="#4d5652">• 分块 Prefill 暂存于 <tspan font-family="var(--font-mono)">in_progress_prompt_logprobs_cpu</tspan></text>

  <rect x="466" y="268" width="4" height="106" rx="2" fill="#b54237"/>
  <text x="480" y="288" font-size="15" font-weight="700" fill="#8f3229">开销二：默认自动跳过读取已有前缀缓存</text>
  <text x="480" y="314" font-size="13.5" fill="#17211f">• 已有 KV cache 只存 K/V，未保留词表概率分布</text>
  <text x="480" y="338" font-size="13.5" fill="#4d5652">• <tspan font-family="var(--font-mono)" font-weight="700">skip_reading_prefix_cache</tspan> 自动置 <tspan font-family="var(--font-mono)" font-weight="700">True</tspan>（含传 0）</text>
  <text x="480" y="364" font-size="13.5" fill="#4d5652">• 仅跳过读取，不等于全局关闭缓存或禁止写入新块</text>
</svg>
