<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 538" width="900" height="538" role="img" aria-label="两步同宽 4 个位置的 Prefill 与 Decode+MTP 对比及混合批分块执行路径图" font-family="var(--font-sans)">
  <title>同样宽 4 个位置，引擎如何区分 Prefill 与 Decode（GLM 双机 R1 + MTP 3 候选对照）：左栏展示第 1 步 Prefill（p₀..p₃、PrefillNoCache、退回 Eager、KDA 分段并行、仅切末行选出 y₀）；右栏展示第 2 步 Decode+MTP（y₀+d₁..d₃、SpecDecoding、回放 4-tok 整图、KDA 递推、切 4 行返回 1..4 词）；底栏展示 ChunkedPrefill 混合批按行分路与中间分块采样丢弃。</title>
  <desc>关联源码符号：num_new_tokens, token_budget, _build_attn_state, PrefillNoCache, SpecDecoding, ChunkedPrefill, uniform_decode, _run_recurrent, _run_prefill, logits_indices, discard_requests_mask</desc>

  <text x="14" y="28" font-size="16" font-weight="700" fill="#17211f">表面宽度都是 4，为什么走两条截然不同的执行路？（GLM 双机 R1 + MTP 3 候选）</text>
  <line x1="14" y1="40" x2="886" y2="40" stroke="#b8bcb5" stroke-width="1.3"/>
  <line x1="450" y1="48" x2="450" y2="370" stroke="#b8bcb5" stroke-width="1.4" stroke-dasharray="6 4"/>

  <!-- LEFT PANEL: Step 1 Prefill -->
  <text x="16" y="66" font-size="15.5" font-weight="700" fill="#936300">第 1 步 · Prefill（宽度 4：全新提示词）</text>
  <text x="16" y="88" font-family="var(--font-mono)" font-size="13.5" font-weight="700" fill="#936300">进度 0 → 4</text>

  <g transform="translate(0, 18)">
  <!-- 4 prompt token cells -->
  <rect x="16" y="84" width="98" height="44" rx="6" fill="#fff4cf" stroke="#c78300" stroke-width="1.4"/>
  <text x="65" y="104" text-anchor="middle" font-family="var(--font-mono)" font-size="14" font-weight="700" fill="#936300">p₀</text>
  <text x="65" y="122" text-anchor="middle" font-size="13" fill="#66716d">pos 0</text>

  <rect x="122" y="84" width="98" height="44" rx="6" fill="#fff4cf" stroke="#c78300" stroke-width="1.4"/>
  <text x="171" y="104" text-anchor="middle" font-family="var(--font-mono)" font-size="14" font-weight="700" fill="#936300">p₁</text>
  <text x="171" y="122" text-anchor="middle" font-size="13" fill="#66716d">pos 1</text>

  <rect x="228" y="84" width="98" height="44" rx="6" fill="#fff4cf" stroke="#c78300" stroke-width="1.4"/>
  <text x="277" y="104" text-anchor="middle" font-family="var(--font-mono)" font-size="14" font-weight="700" fill="#936300">p₂</text>
  <text x="277" y="122" text-anchor="middle" font-size="13" fill="#66716d">pos 2</text>

  <rect x="334" y="84" width="98" height="44" rx="6" fill="#ddf4ef" stroke="#087f73" stroke-width="1.8"/>
  <text x="383" y="104" text-anchor="middle" font-family="var(--font-mono)" font-size="14" font-weight="700" fill="#065f56">p₃ ★</text>
  <text x="383" y="122" text-anchor="middle" font-size="13" font-weight="700" fill="#065f56">pos 3 切末行</text>

  <!-- Step 1 rows -->
  <rect x="16" y="142" width="416" height="44" rx="6" fill="#fff0e9" stroke="#d88c82" stroke-width="1.2"/>
  <text x="28" y="162" font-size="13.5" font-weight="700" fill="#8f3229">状态与图模式：<tspan font-family="var(--font-mono)">PrefillNoCache</tspan> → 退回 Eager</text>
  <text x="28" y="180" font-size="13.5" fill="#4d5652">提示词未算完（uniform_decode=False）；DP 空闲组同退</text>

  <rect x="16" y="196" width="416" height="44" rx="6" fill="#e8edff" stroke="#8c9fcc" stroke-width="1.2"/>
  <text x="28" y="216" font-size="13.5" font-weight="700" fill="#3a4f93">45 层前向：KDA 走 <tspan font-family="var(--font-mono)">_run_prefill</tspan>（64 位分段并行）</text>
  <text x="28" y="234" font-size="13.5" fill="#4d5652">历史从零建档；11 层稀疏 MLA 写 4 格潜向量与尾状态</text>

  <rect x="16" y="250" width="416" height="44" rx="6" fill="#ddf4ef" stroke="#087f73" stroke-width="1.4"/>
  <text x="28" y="270" font-size="13.5" font-weight="700" fill="#065f56">选词输出：<tspan font-family="var(--font-mono)">logits_indices = [3]</tspan>（仅 1 行进 lm_head）</text>
  <text x="28" y="288" font-size="13.5" fill="#17211f">当场产出首词 <tspan font-family="var(--font-mono)" font-weight="700">y₀</tspan>，随后 MTP 草拟 3 个候选 <tspan font-family="var(--font-mono)">d₁..d₃</tspan></text>

  <text x="16" y="320" font-size="13.5" fill="#66716d">▸ 调度器仍按统一公式：应算 4 − 已算 0 = 4（夹在 8192 内）</text>
  <text x="16" y="342" font-size="13.5" fill="#66716d">▸ 额外要提示词概率时才另投前 3 行，不计入此处生成行数</text>
  </g>

  <!-- RIGHT PANEL: Step 2 Decode + MTP -->
  <text x="468" y="66" font-size="15.5" font-weight="700" fill="#065f56">第 2 步起 · Decode + MTP（宽度 4：验稿续写）</text>
  <text x="468" y="88" font-family="var(--font-mono)" font-size="13.5" font-weight="700" fill="#065f56">历史 4 → 5..8</text>

  <g transform="translate(0, 18)">
  <!-- 1 confirmed + 3 draft cells -->
  <rect x="468" y="84" width="98" height="44" rx="6" fill="#ddf4ef" stroke="#087f73" stroke-width="1.6"/>
  <text x="517" y="104" text-anchor="middle" font-family="var(--font-mono)" font-size="14" font-weight="700" fill="#065f56">y₀ ★</text>
  <text x="517" y="122" text-anchor="middle" font-size="13" fill="#065f56">确定 · 切行</text>

  <rect x="574" y="84" width="98" height="44" rx="6" fill="#f7e7f2" stroke="#9a4b86" stroke-width="1.5" stroke-dasharray="4 3"/>
  <text x="623" y="104" text-anchor="middle" font-family="var(--font-mono)" font-size="14" font-weight="700" fill="#7a3a6a">d₁ ★</text>
  <text x="623" y="122" text-anchor="middle" font-size="13" fill="#7a3a6a">候选 1 · 切行</text>

  <rect x="680" y="84" width="98" height="44" rx="6" fill="#f7e7f2" stroke="#9a4b86" stroke-width="1.5" stroke-dasharray="4 3"/>
  <text x="729" y="104" text-anchor="middle" font-family="var(--font-mono)" font-size="14" font-weight="700" fill="#7a3a6a">d₂ ★</text>
  <text x="729" y="122" text-anchor="middle" font-size="13" fill="#7a3a6a">候选 2 · 切行</text>

  <rect x="786" y="84" width="98" height="44" rx="6" fill="#f7e7f2" stroke="#9a4b86" stroke-width="1.5" stroke-dasharray="4 3"/>
  <text x="835" y="104" text-anchor="middle" font-family="var(--font-mono)" font-size="14" font-weight="700" fill="#7a3a6a">d₃ ★</text>
  <text x="835" y="122" text-anchor="middle" font-size="13" fill="#7a3a6a">候选 3 · 切行</text>

  <!-- Step 2 rows -->
  <rect x="468" y="142" width="416" height="44" rx="6" fill="#ddf4ef" stroke="#087f73" stroke-width="1.4"/>
  <text x="480" y="162" font-size="13.5" font-weight="700" fill="#065f56">状态与图模式：<tspan font-family="var(--font-mono)">SpecDecoding</tspan> → 回放 4-tok 整图</text>
  <text x="480" y="180" font-size="13.5" fill="#4d5652">全批已完提示词且整齐（uniform_decode=True），4..128 档</text>

  <rect x="468" y="196" width="416" height="44" rx="6" fill="#e8edff" stroke="#4c65b6" stroke-width="1.3"/>
  <text x="480" y="216" font-size="13.5" font-weight="700" fill="#3a4f93">45 层前向：KDA 走 <tspan font-family="var(--font-mono)">_run_recurrent</tspan>（递推 + 留槽）</text>
  <text x="480" y="234" font-size="13.5" fill="#4d5652">复用前 4 格 KV 历史；KDA 为 3 候选各自保留独立状态页</text>

  <rect x="468" y="250" width="416" height="44" rx="6" fill="#f7e7f2" stroke="#9a4b86" stroke-width="1.4"/>
  <text x="480" y="270" font-size="13.5" font-weight="700" fill="#7a3a6a">选词输出：<tspan font-family="var(--font-mono)">logits_indices = [0..3]</tspan>（全部 4 行验证）</text>
  <text x="480" y="288" font-size="13.5" fill="#17211f">按接受率一次交回 <tspan font-weight="700" fill="#7a3a6a">1..4 个确定词</tspan>；剩余 199 词需 50..199 步</text>

  <text x="468" y="320" font-size="13.5" fill="#66716d">▸ 调度公式相同：应算 (5 + 3 候选) − 已算 4 = 4</text>
  <text x="468" y="342" font-size="13.5" fill="#66716d">▸ 被拒候选在步末回退进度（MLA 覆写、KDA 选对应页续算）</text>

  <!-- Divider to Zone 3 -->
  <line x1="14" y1="364" x2="886" y2="364" stroke="#b8bcb5" stroke-width="1.4" stroke-dasharray="6 4"/>
  <text x="14" y="392" font-size="15.5" font-weight="700" fill="#17211f">第三路 · 混合批与分块续算（<tspan font-family="var(--font-mono)" fill="#3a4f93">ChunkedPrefill</tspan>：如场景 M 的 48 Decode + 6000 Prefill）</text>

  <!-- Bottom two side-by-side mechanism cards -->
  <rect x="14" y="406" width="424" height="100" rx="8" fill="#e8edff" stroke="#4c65b6" stroke-width="1.4"/>
  <text x="28" y="432" font-size="14.5" font-weight="700" fill="#3a4f93">按行分路 + 通信切档（打破整图回放）</text>
  <text x="28" y="458" font-size="13.5" fill="#17211f">• 总宽 <tspan font-family="var(--font-mono)" font-weight="700">6048 ≤ 8192</tspan>，贴 ChunkedPrefill 退回 Eager</text>
  <text x="28" y="484" font-size="13.5" fill="#4d5652">• KDA 拆 12 递推 + 6000 分段再拼回；MoE 过 128 改 AllGather</text>

  <rect x="462" y="406" width="424" height="100" rx="8" fill="#fff0e9" stroke="#b54237" stroke-width="1.4"/>
  <text x="476" y="432" font-size="14.5" font-weight="700" fill="#8f3229">分块中间段：照常采样，但由掩码丢弃结果</text>
  <text x="476" y="458" font-size="13.5" fill="#17211f">• 提示词未完时 <tspan font-family="var(--font-mono)" font-weight="700">discard_requests_mask</tspan> 标记清零</text>
  <text x="476" y="484" font-size="13.5" fill="#4d5652">• 带种子请求回拨 RNG 偏移 <tspan font-family="var(--font-mono)" font-weight="700">-4</tspan>；仅末段真正交出首词 y₀</text>
  </g>
</svg>
