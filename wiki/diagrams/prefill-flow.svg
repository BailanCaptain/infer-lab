<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 972" width="880" height="972" role="img" aria-label="本部署一步之内怎样认出 prefill：调度只按进度差排数量；runner 贴注意力状态标签，再判断能否回放 decode 图；前向按行分路；最后按请求取行算分数，提示词没算完的这次采样丢弃。圆圈编号对应请求主线的站。">
  <title>本部署一步之内怎样认出 prefill：调度只按进度差排数量；runner 贴注意力状态标签，再判断能否回放 decode 图；前向按行分路；最后按请求取行算分数，提示词没算完的这次采样丢弃。圆圈编号对应请求主线的站。</title>
  <defs><marker id="prefill-flow-ah-ink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="var(--color-ink, #17211f)"/></marker></defs>
  <path d="M440 78 L440 118" fill="none" stroke="var(--color-ink, #17211f)" stroke-width="1.4" marker-end="url(#prefill-flow-ah-ink)"/>
  <path d="M320 176 L320 198 L155 198 L155 220" fill="none" stroke="var(--color-ink, #17211f)" stroke-width="1.4" marker-end="url(#prefill-flow-ah-ink)"/>
  <path d="M440 176 L440 220" fill="none" stroke="var(--color-ink, #17211f)" stroke-width="1.4" marker-end="url(#prefill-flow-ah-ink)"/>
