layout: figure
id: prefill-flow
caption: 本部署一步之内怎样认出 prefill：调度只按进度差排数量；runner 贴注意力状态标签，再判断能否回放 decode 图；前向按行分路；最后按请求取行算分数，提示词没算完的这次采样丢弃。圆圈编号对应请求主线的站。
size: [880, 972]
items:
  - { at: [200, 20], size: [480, 58], text: ② 调度：本步数量 = 进度差, sub: 再被每组每步 8192 的预算和长度上限夹住, style: plain }
  - { at: [200, 118], size: [480, 58], text: ③ runner 给这一批贴注意力状态标签, sub: 看每条请求算过没有、本步几个位置, style: plain }
  - { at: [20, 220], size: [270, 70], text: 全是新提示词, sub: PrefillNoCache · R1 第 1 步, tone: token }
  - { at: [305, 220], size: [270, 70], text: 全是 1 个确定 + 候选, sub: SpecDecoding · R1 第 2 步起, tone: token }
  - { at: [590, 220], size: [270, 70], text: 混合批或续算的分块, sub: ChunkedPrefill · 场景 M 第 2 步, tone: token }
  - { at: [200, 340], size: [480, 58], text: ④ 能回放 decode 图吗？, sub: 要求提示词都已算完、每条宽度整齐, style: plain }
  - { at: [20, 450], size: [400, 62], text: 否：eager，逐个下发算子, sub: 含 prefill 的步都走这里, tone: control }
  - { at: [460, 450], size: [400, 62], text: 是：回放启动时录好的图, sub: 尺寸 4…128，两组对齐后一起用, tone: control }
  - { at: [200, 562], size: [480, 62], text: ④ 前向：同一套 45 层权重, sub: KDA 的 prefill 行分段算，decode 行逐位置递推, tone: weight }
  - { at: [200, 674], size: [480, 62], text: ⑤ 每条请求取哪几行算词表分数？, sub: 没有候选取最后 1 行；有候选取 1 + 候选数行, style: plain }
  - { at: [200, 786], size: [480, 58], text: 这条请求的提示词算完了吗？, style: plain }
  - { at: [20, 890], size: [400, 62], text: 否：这次采样结果丢弃, sub: 分块 prefill 的中间段, tone: token, style: faded }
  - { at: [460, 890], size: [400, 62], text: 是：得到输出 token, sub: prefill 的最后一段产出首 token, tone: token }
