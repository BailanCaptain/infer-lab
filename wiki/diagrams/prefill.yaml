layout: figure
id: prefill
caption: 普通自回归示意（不分块、不复用开头、不猜候选）：第 1 步把已知的 4 个提示词位置一起送进一次前向，4 个位置都留下历史，只用最后一个位置的输出选出 y₀；此后每步只送进上一步选出的 1 个 token，读前面全部历史、再写 1 格。
