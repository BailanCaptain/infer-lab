<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 500" width="900" height="500" role="img" aria-label="Prefix Caching 链式块指纹、倒序淘汰队列与混合缓存组 0 到 2000 位置只砍不涨对齐标尺图" font-family="var(--font-sans)">
  <title>Prefix Caching 链式块指纹、倒序淘汰与混合多组只砍不涨标尺</title>
  <desc>上半区展示额外身份键与块 token 构成链式指纹 H0→H1，以及 refcount=0 的块按倒序归还空闲队列使开头块最晚被淘汰；下半区在 0..2000 统一位置标尺上展示 Full 组（砍至 1920）、KDA align 组（1280 留档砍至 1280）与尾状态组（滑窗通过）如何收敛到公共恢复边界 1280。</desc>
  <defs>
    <marker id="apcf-arr-t" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto">
      <path d="M 0 1.5 L 8.5 5 L 0 8.5 z" fill="#087f73"/>
    </marker>
    <marker id="apcf-arr-b" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto">
      <path d="M 0 1.5 L 8.5 5 L 0 8.5 z" fill="#4c65b6"/>
    </marker>
    <marker id="apcf-arr-r" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto">
      <path d="M 0 1.5 L 8.5 5 L 0 8.5 z" fill="#b54237"/>
    </marker>
  </defs>

  <!-- Zone 1: Hash chain + Reverse Free Queue -->
  <circle cx="26" cy="24" r="12" fill="#087f73"/>
  <text x="26" y="28.5" text-anchor="middle" font-size="13" font-weight="700" fill="#ffffff">1</text>
  <text x="46" y="30" font-size="16" font-weight="700" fill="#17211f">链式块指纹（认完整输入身份）与空闲队列倒序淘汰（前缀开头留最久）</text>

  <rect x="14" y="48" width="188" height="114" rx="7" fill="#fff4cf" stroke="#c78300" stroke-width="1.4"/>
  <text x="26" y="72" font-size="14" font-weight="700" fill="#936300">额外身份键（分域注入）</text>
  <text x="26" y="96" font-size="13" fill="#936300"><tspan font-family="var(--font-mono)" font-weight="700">cache_salt</tspan>：仅首块 B₀</text>
  <text x="26" y="118" font-size="13" fill="#17211f">LoRA ID：每一块均注入</text>
  <text x="26" y="140" font-size="13" fill="#4d5652">多模态/embed：按块跨度</text>

  <line x1="202" y1="105" x2="222" y2="105" stroke="#087f73" stroke-width="1.8" marker-end="url(#apcf-arr-t)"/>

  <rect x="226" y="48" width="166" height="114" rx="7" fill="#ddf4ef" stroke="#087f73" stroke-width="1.4"/>
  <text x="238" y="72" font-size="14" font-weight="700" fill="#065f56">块 0 指纹 H₀</text>
  <text x="238" y="96" font-size="13" font-family="var(--font-mono)" fill="#17211f">hash(B₀, extra₀)</text>
  <text x="238" y="120" font-size="13" fill="#065f56">含 salt+LoRA+跨块项</text>
  <text x="238" y="144" font-size="13" fill="#4d5652">命中 refcount +1</text>

  <line x1="392" y1="105" x2="414" y2="105" stroke="#087f73" stroke-width="1.8" marker-end="url(#apcf-arr-t)"/>

  <rect x="418" y="48" width="166" height="114" rx="7" fill="#ddf4ef" stroke="#087f73" stroke-width="1.4"/>
  <text x="430" y="72" font-size="14" font-weight="700" fill="#065f56">块 1 指纹 H₁</text>
  <text x="424" y="96" font-size="12" font-family="var(--font-mono)" fill="#17211f">hash(H₀,B₁,extra₁)</text>
  <text x="430" y="120" font-size="13" fill="#17211f">含 LoRA+跨块项(无salt)</text>
  <text x="430" y="144" font-size="13" fill="#4d5652">前块不同则全链断</text>

  <line x1="584" y1="105" x2="606" y2="105" stroke="#4c65b6" stroke-width="1.8" marker-end="url(#apcf-arr-b)"/>

  <!-- Visual Reverse-Order Free Queue Strip -->
  <rect x="610" y="48" width="274" height="114" rx="7" fill="#e8edff" stroke="#4c65b6" stroke-width="1.4"/>
  <text x="624" y="72" font-size="14" font-weight="700" fill="#3a4f93">refcount=0 倒序归还空闲队列</text>
  <rect x="624" y="84" width="74" height="32" rx="4" fill="#fff0e9" stroke="#b54237" stroke-width="1.3"/>
  <text x="661" y="105" text-anchor="middle" font-size="13" font-weight="700" fill="#8f3229">尾块 B2</text>
  <rect x="706" y="84" width="74" height="32" rx="4" fill="#ffffff" stroke="#4c65b6" stroke-width="1.2"/>
  <text x="743" y="105" text-anchor="middle" font-size="13" fill="#3a4f93">块 B1</text>
  <rect x="788" y="84" width="82" height="32" rx="4" fill="#ddf4ef" stroke="#087f73" stroke-width="1.5"/>
  <text x="829" y="105" text-anchor="middle" font-size="13" font-weight="700" fill="#065f56">首块 B0</text>
  <text x="624" y="138" font-size="13" fill="#8f3229">← 先被借走抹登记</text>
  <text x="870" y="138" text-anchor="end" font-size="13" font-weight="700" fill="#065f56">前缀留最久 →</text>
  <text x="624" y="156" font-size="13" fill="#4d5652">共用块池无专属预算，借出时才驱逐</text>

  <!-- Divider -->
  <line x1="14" y1="180" x2="884" y2="180" stroke="#b8bcb5" stroke-width="1.4" stroke-dasharray="6 5"/>

  <!-- Zone 2: Multi-Group Shrink-Only Alignment Ruler (0..2000 tokens, x=156..756, 600px = 2000 -> 0.3px/tok; 640=348, 1280=540, 1920=732, 2000=756) -->
  <circle cx="26" cy="206" r="12" fill="#4c65b6"/>
  <text x="26" y="210.5" text-anchor="middle" font-size="13" font-weight="700" fill="#ffffff">2</text>
  <text x="46" y="212" font-size="16" font-weight="700" fill="#17211f">混合模型「只砍不涨」多组对齐标尺（示意 2,000 token 输入：为何恢复粒度卡在 640）</text>

  <!-- Position ruler ticks -->
  <g font-size="13" font-family="var(--font-mono)" fill="#66716d" text-anchor="middle">
    <text x="156" y="240">0</text>
    <text x="348" y="240">640</text>
    <text x="540" y="240" font-weight="700" fill="#065f56">1,280 (公共边界)</text>
    <text x="732" y="240" text-anchor="end">1,920</text>
    <text x="756" y="240" text-anchor="start">2,000</text>
  </g>
  <g stroke="#d8d8cf" stroke-width="1" stroke-dasharray="3 3">
    <line x1="156" y1="246" x2="156" y2="412"/>
    <line x1="348" y1="246" x2="348" y2="412"/>
    <line x1="732" y1="246" x2="732" y2="412"/>
    <line x1="756" y1="246" x2="756" y2="412"/>
  </g>

  <!-- Track 1: Full group (MLA + indexer K, 640-token blocks) -->
  <text x="14" y="276" font-size="14" font-weight="700" fill="#3a4f93">1. Full 组</text>
  <text x="14" y="295" font-size="13" fill="#4d5652">MLA / indexer K</text>
  <rect x="156" y="256" width="192" height="36" rx="3" fill="#ddf4ef" stroke="#087f73" stroke-width="1.3"/>
  <text x="252" y="279" text-anchor="middle" font-size="13.5" fill="#065f56">整块 640 ✓</text>
  <rect x="348" y="256" width="192" height="36" rx="3" fill="#ddf4ef" stroke="#087f73" stroke-width="1.3"/>
  <text x="444" y="279" text-anchor="middle" font-size="13.5" fill="#065f56">整块 640 ✓</text>
  <rect x="540" y="256" width="192" height="36" rx="3" fill="#e8edff" stroke="#4c65b6" stroke-width="1.3"/>
  <text x="636" y="279" text-anchor="middle" font-size="13.5" fill="#3a4f93">整块 640 ✓</text>
  <rect x="732" y="256" width="24" height="36" rx="2" fill="#fff0e9" stroke="#b54237" stroke-width="1.2" stroke-dasharray="3 2"/>
  <text x="768" y="279" font-size="13.5" font-weight="700" fill="#8f3229">砍到 1,920</text>

  <!-- Track 2: KDA group (align checkpoint only at 1280) -->
  <text x="14" y="332" font-size="14" font-weight="700" fill="#7a3a6a">2. KDA 组 (×3)</text>
  <text x="14" y="351" font-size="13" fill="#4d5652">align 步终点留档</text>
  <rect x="156" y="312" width="376" height="36" rx="3" fill="#ece9df" stroke="#b8bcb5" stroke-width="1.2" stroke-dasharray="4 3"/>
  <text x="344" y="335" text-anchor="middle" font-size="13.5" fill="#4d5652">前块填占位块（有目标点一档即够）</text>
  <rect x="532" y="312" width="16" height="36" rx="2" fill="#9a4b86"/>
  <rect x="548" y="312" width="208" height="36" rx="3" fill="#fff0e9" stroke="#b54237" stroke-width="1.3" stroke-dasharray="4 3"/>
  <text x="652" y="335" text-anchor="middle" font-size="13.5" font-weight="700" fill="#8f3229">1,920 无档 → 砍回 1,280！</text>
  <text x="768" y="335" font-size="13.5" font-weight="700" fill="#7a3a6a">逼退全组重查</text>

  <!-- Track 3: Tail group (sliding window) -->
  <text x="14" y="388" font-size="14" font-weight="700" fill="#936300">3. 尾状态组</text>
  <text x="14" y="407" font-size="13" fill="#4d5652">indexer 滑窗</text>
  <rect x="156" y="368" width="332" height="34" rx="3" fill="#ece9df" stroke="#d8d8cf" stroke-width="1"/>
  <text x="322" y="390" text-anchor="middle" font-size="13" fill="#66716d">窗口之前不要求留存</text>
  <rect x="488" y="368" width="52" height="34" rx="3" fill="#fff4cf" stroke="#c78300" stroke-width="1.5"/>
  <text x="514" y="390" text-anchor="middle" font-size="13" font-weight="700" fill="#936300">窗口✓</text>
  <text x="556" y="382" font-size="13.5" font-weight="700" fill="#065f56">← 全组点头收敛于 1,280</text>
  <text x="556" y="402" font-size="13" fill="#4d5652">旧镜像哈希粒度 4 ≠ 恢复粒度 640</text>

  <!-- Bold vertical convergence line at 1280 (x=540) -->
  <line x1="540" y1="246" x2="540" y2="416" stroke="#087f73" stroke-width="2.4" stroke-dasharray="6 4"/>

  <!-- Bottom version evolution strip -->
  <rect x="14" y="432" width="870" height="54" rx="6" fill="#ece9df" stroke="#b8bcb5" stroke-width="1.2"/>
  <text x="28" y="455" font-size="13.5" fill="#17211f"><tspan font-weight="700" fill="#065f56">v0.30.0 / main 演进：</tspan>生成式 hybrid 默认开启 APC，先按 is_prefix_cacheable 剔除私有尾状态组再算哈希粒度（GLM 得 640）；</text>
  <text x="28" y="476" font-size="13.5" fill="#4d5652">全命中仍须重算末 token 拿 logits；prompt_logprobs 默认跳过查表；命中直省 Prefill，不省新 token 的历史读取与 Decode</text>
</svg>
