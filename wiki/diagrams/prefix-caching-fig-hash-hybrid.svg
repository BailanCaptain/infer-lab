<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 456" width="900" height="456" role="img" aria-label="Prefix Caching 链式块指纹与混合模型公共命中边界示意图" font-family="var(--font-sans)">
  <title>Prefix Caching 链式块指纹与混合缓存组公共恢复边界</title>
  <desc>上半区展示链式块哈希如何把 cache_salt、LoRA、多模态指纹、前块哈希与当前块 token 串联以唯一标识前缀，并通过引用计数在共享池内复用与倒序淘汰；下半区展示混合模型调度器如何执行“只砍不涨”循环协调 full、KDA align 与尾状态组，并解释为何哈希粒度 4 不等于恢复边界 640。</desc>
  <defs>
    <marker id="apcf-arr-t" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto">
      <path d="M 0 1.5 L 8.5 5 L 0 8.5 z" fill="#087f73"/>
    </marker>
    <marker id="apcf-arr-b" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto">
      <path d="M 0 1.5 L 8.5 5 L 0 8.5 z" fill="#4c65b6"/>
    </marker>
    <marker id="apcf-arr-r" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto">
      <path d="M 0 1.5 L 8.5 5 L 0 8.5 z" fill="#b54237"/>
    </marker>
  </defs>

  <text x="14" y="28" font-size="16" font-weight="700" fill="#17211f">一、链式块指纹（Block Hash）：认累计前缀与完整输入身份，而非只看文本</text>
  <line x1="12" y1="40" x2="888" y2="40" stroke="#b8bcb5" stroke-width="1.3"/>

  <rect x="12" y="56" width="206" height="122" rx="8" fill="#fff4cf" stroke="#c78300" stroke-width="1.5"/>
  <text x="26" y="80" font-size="14.5" font-weight="700" fill="#936300">额外身份键（首块注入）</text>
  <text x="26" y="104" font-size="13.5" fill="#17211f">• <tspan font-family="var(--font-mono)" fill="#936300">cache_salt</tspan>（租户隔离）</text>
  <text x="26" y="126" font-size="13.5" fill="#17211f">• LoRA ID / 多模态指纹</text>
  <text x="26" y="148" font-size="13.5" fill="#17211f">• 直接输入的 embedding</text>
  <text x="26" y="168" font-size="13.5" fill="#66716d">同文本不同图/LoRA 不串</text>

  <path d="M 218 117 L 244 117" fill="none" stroke="#087f73" stroke-width="2" marker-end="url(#apcf-arr-t)"/>

  <rect x="250" y="56" width="192" height="122" rx="8" fill="#ddf4ef" stroke="#087f73" stroke-width="1.5"/>
  <text x="264" y="80" font-size="14.5" font-weight="700" fill="#065f56">块 0 指纹 H₀</text>
  <text x="264" y="106" font-size="13.5" font-family="var(--font-mono)" fill="#17211f">hash(extra, B₀)</text>
  <text x="264" y="132" font-size="13.5" fill="#17211f">命中则 refcount +1</text>
  <text x="264" y="156" font-size="13.5" fill="#4d5652">零复制共享物理块</text>

  <path d="M 442 117 L 468 117" fill="none" stroke="#087f73" stroke-width="2" marker-end="url(#apcf-arr-t)"/>

  <rect x="474" y="56" width="192" height="122" rx="8" fill="#ddf4ef" stroke="#087f73" stroke-width="1.5"/>
  <text x="488" y="80" font-size="14.5" font-weight="700" fill="#065f56">块 1 指纹 H₁</text>
  <text x="488" y="106" font-size="13.5" font-family="var(--font-mono)" fill="#17211f">hash(H₀, B₁)</text>
  <text x="488" y="132" font-size="13.5" fill="#17211f">前块不同则全链断开</text>
  <text x="488" y="156" font-size="13.5" fill="#4d5652">保证前缀严格连续</text>

  <path d="M 666 117 L 692 117" fill="none" stroke="#4c65b6" stroke-width="2" marker-end="url(#apcf-arr-b)"/>

  <rect x="698" y="56" width="190" height="122" rx="8" fill="#e8edff" stroke="#4c65b6" stroke-width="1.5"/>
  <text x="712" y="80" font-size="14.5" font-weight="700" fill="#3a4f93">空闲队列与淘汰</text>
  <text x="712" y="104" font-size="13.5" fill="#17211f">refcount=0 归还队列</text>
  <text x="712" y="126" font-size="13.5" fill="#17211f">被借走时才抹去登记</text>
  <text x="712" y="148" font-size="13.5" fill="#3a4f93">倒序归还：开头留最久</text>
  <text x="712" y="168" font-size="13.5" fill="#66716d">未分配额外专属预算</text>

  <text x="14" y="216" font-size="16" font-weight="700" fill="#17211f">二、混合模型“只砍不涨”公共命中边界：为什么指纹粒度 ≠ 可恢复粒度</text>
  <line x1="12" y1="228" x2="888" y2="228" stroke="#b8bcb5" stroke-width="1.3"/>

  <rect x="12" y="244" width="276" height="134" rx="8" fill="#ffffff" stroke="#4c65b6" stroke-width="1.4"/>
  <text x="26" y="270" font-size="14.5" font-weight="700" fill="#3a4f93">1. Full 组（MLA + indexer K）</text>
  <text x="26" y="296" font-size="13.5" fill="#17211f">• 按 640 整块覆盖历史</text>
  <text x="26" y="320" font-size="13.5" fill="#17211f">• 必须写满且登记仍在</text>
  <text x="26" y="344" font-size="13.5" fill="#4d5652">• 候选位置砍到 640 整数倍</text>
  <text x="26" y="366" font-size="13.5" fill="#66716d">• 即使指纹每 4 格算一次</text>

  <rect x="306" y="244" width="286" height="134" rx="8" fill="#ffffff" stroke="#9a4b86" stroke-width="1.4"/>
  <text x="320" y="270" font-size="14.5" font-weight="700" fill="#7a3a6a">2. KDA 组（align 边界留档）</text>
  <text x="320" y="296" font-size="13.5" fill="#17211f">• 仅在对齐步终点留状态档</text>
  <text x="320" y="320" font-size="13.5" fill="#17211f">• 命中有档点即够，前块填占位</text>
  <text x="320" y="344" font-size="13.5" fill="#7a3a6a">• 无档点则直接向后砍回最近档</text>
  <text x="320" y="366" font-size="13.5" fill="#66716d">• 要求 chunked prefill 开启</text>

  <rect x="610" y="244" width="278" height="134" rx="8" fill="#fff0e9" stroke="#b54237" stroke-width="1.4"/>
  <text x="624" y="270" font-size="14.5" font-weight="700" fill="#8f3229">3. 公共交集与两条硬门槛</text>
  <text x="624" y="296" font-size="13.5" fill="#17211f">• 任一组砍短 → 全组重查至收敛</text>
  <text x="624" y="320" font-size="13.5" fill="#17211f">• 全命中仍须重算末 token 拿 logits</text>
  <text x="624" y="344" font-size="13.5" fill="#8f3229">• 命中省 Prefill，不省 Decode</text>
  <text x="624" y="366" font-size="13.5" fill="#66716d">• prompt_logprobs 默认跳过查表</text>

  <rect x="12" y="390" width="876" height="54" rx="8" fill="#ece9df" stroke="#b8bcb5" stroke-width="1.2"/>
  <text x="26" y="413" font-size="13.5" fill="#17211f"><tspan font-size="14" font-weight="700" fill="#065f56">v0.30.0 / main 演进：</tspan>生成式 hybrid 模型默认打开 APC，先按 is_prefix_cacheable 剔除私有尾状态组再算哈希粒度（GLM 得 640）；</text>
  <text x="26" y="434" font-size="13.5" fill="#4d5652">固定旧 GLM 镜像（v0.23）默认关闭 APC，显式开启时哈希粒度为 4 但公共恢复长度仍卡在 640 的整数倍。</text>
</svg>
