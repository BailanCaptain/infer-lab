<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 420" width="880" height="420" role="img" aria-label="第2站调度先查前缀。禁用或请求跳过读取时按零命中继续；混合模型寻找共同恢复边界。容量与依赖检查通过后借用命中块并补新块；启用APC且无需延迟登记时，按本步已确定的位置登记。随后第4站前向才写入新状态。登记不等于状态已经就绪。图按固定旧版路径说明。">
  <title>第2站调度先查前缀。禁用或请求跳过读取时按零命中继续；混合模型寻找共同恢复边界。容量与依赖检查通过后借用命中块并补新块；启用APC且无需延迟登记时，按本步已确定的位置登记。随后第4站前向才写入新状态。登记不等于状态已经就绪。图按固定旧版路径说明。</title>
  <defs><marker id="prefix-caching-flow-ah-ink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="var(--color-ink, #17211f)"/></marker></defs>
  <path d="M204 84 L260 84" fill="none" stroke="var(--color-ink, #17211f)" stroke-width="1.4" marker-end="url(#prefix-caching-flow-ah-ink)"/>
  <path d="M434 84 L490 84" fill="none" stroke="var(--color-ink, #17211f)" stroke-width="1.4" marker-end="url(#prefix-caching-flow-ah-ink)"/>
  <path d="M347 114 L347 294" fill="none" stroke="var(--color-ink, #17211f)" stroke-width="1.4" stroke-dasharray="7 5" marker-end="url(#prefix-caching-flow-ah-ink)"/>
  <path d="M578 114 L578 174" fill="none" stroke="var(--color-ink, #17211f)" stroke-width="1.4" marker-end="url(#prefix-caching-flow-ah-ink)"/>
  <path d="M666 204 L690 204 L690 84 L666 84" fill="none" stroke="var(--color-ink, #17211f)" stroke-width="1.4" stroke-dasharray="7 5" marker-end="url(#prefix-caching-flow-ah-ink)"/>
  <path d="M490 204 L347 204 L347 294" fill="none" stroke="var(--color-ink, #17211f)" stroke-width="1.4" marker-end="url(#prefix-caching-flow-ah-ink)"/>
  <path d="M434 324 L490 324" fill="none" stroke="var(--color-ink, #17211f)" stroke-width="1.4" marker-end="url(#prefix-caching-flow-ah-ink)"/>
  <path d="M666 324 L710 324" fill="none" stroke="var(--color-ink, #17211f)" stroke-width="1.4" marker-end="url(#prefix-caching-flow-ah-ink)"/>
  <rect x="24" y="54" width="180" height="60" rx="8" fill="var(--color-control-soft, #f1efe8)" stroke="var(--color-line-strong, #b8bcb5)" stroke-width="1.4"/>
  <text x="114" y="80" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="14" font-weight="700" fill="var(--color-ink, #17211f)" text-anchor="middle">第2站：请求等待调度</text>
  <text x="114" y="99" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="13" font-weight="400" fill="#065f56" text-anchor="middle">输入身份与缓存配置</text>
  <rect x="260" y="54" width="174" height="60" rx="8" fill="var(--color-control-soft, #f1efe8)" stroke="var(--color-control, #66716d)" stroke-width="1.4"/>
  <text x="347" y="80" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="14" font-weight="700" fill="var(--color-ink, #17211f)" text-anchor="middle">允许读取前缀吗</text>
  <text x="347" y="99" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="13" font-weight="400" fill="var(--color-ink-muted, #66716d)" text-anchor="middle">开关与请求跳过条件</text>
  <rect x="490" y="54" width="176" height="60" rx="8" fill="var(--color-kv-soft, #e8edff)" stroke="var(--color-kv, #4c65b6)" stroke-width="1.4"/>
  <text x="578" y="80" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="14" font-weight="700" fill="var(--color-ink, #17211f)" text-anchor="middle">各组查指纹和状态</text>
  <text x="578" y="99" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="13" font-weight="400" fill="#3a4f93" text-anchor="middle">全组都能恢复才命中</text>
  <rect x="490" y="174" width="176" height="60" rx="8" fill="var(--color-control-soft, #f1efe8)" stroke="var(--color-control, #66716d)" stroke-width="1.4"/>
  <text x="578" y="200" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="14" font-weight="700" fill="var(--color-ink, #17211f)" text-anchor="middle">缩短到共同边界</text>
  <text x="578" y="219" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="13" font-weight="400" fill="var(--color-ink-muted, #66716d)" text-anchor="middle">有组退让就重新检查</text>
  <rect x="260" y="294" width="174" height="60" rx="8" fill="var(--color-control-soft, #f1efe8)" stroke="var(--color-control, #66716d)" stroke-width="1.4"/>
  <text x="347" y="320" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="14" font-weight="700" fill="var(--color-ink, #17211f)" text-anchor="middle">检查容量与依赖</text>
  <text x="347" y="339" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="13" font-weight="400" fill="var(--color-ink-muted, #66716d)" text-anchor="middle">未就绪则本步等待</text>
  <rect x="490" y="294" width="176" height="60" rx="8" fill="var(--color-kv-soft, #e8edff)" stroke="var(--color-kv, #4c65b6)" stroke-width="1.4"/>
  <text x="578" y="320" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="14" font-weight="700" fill="var(--color-ink, #17211f)" text-anchor="middle">借块与引用</text>
  <text x="578" y="339" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="13" font-weight="400" fill="#3a4f93" text-anchor="middle">APC启用时登记位置</text>
  <rect x="710" y="294" width="146" height="60" rx="8" fill="var(--color-kv-soft, #e8edff)" stroke="var(--color-kv, #4c65b6)" stroke-width="1.4"/>
  <text x="783" y="320" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="14" font-weight="700" fill="var(--color-ink, #17211f)" text-anchor="middle">第4站前向</text>
  <text x="783" y="339" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="13" font-weight="400" fill="#3a4f93" text-anchor="middle">计算并写入新状态</text>
  <text x="24" y="25" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="14" font-weight="700" fill="var(--color-ink, #17211f)">前缀命中 → 共同恢复边界 → 借块 → 继续计算</text>
  <text x="440" y="68" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="13" font-weight="400" fill="var(--color-ink, #17211f)">是</text>
  <text x="224" y="174" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="13" font-weight="400" fill="var(--color-ink, #17211f)">否：零命中</text>
  <text x="368" y="252" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="13" font-weight="400" fill="var(--color-ink, #17211f)">全组可接上</text>
  <text x="714" y="144" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="13" font-weight="400" fill="var(--color-ink, #17211f)">仍有组需退让</text>
  <text x="24" y="392" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="13" font-weight="400" fill="var(--color-ink, #17211f)">指纹更细不等于恢复更细；容量不足也不等于前缀没有命中。</text>
</svg>
