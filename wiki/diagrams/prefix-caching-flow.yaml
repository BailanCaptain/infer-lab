  - { at: [490, 54], size: [176, 60], text: 各组查指纹和状态, sub: 全组都能恢复才命中, tone: kv }
  - { at: [490, 174], size: [176, 60], text: 缩短到共同边界, sub: 有组退让就重新检查, tone: control }
  - { at: [260, 294], size: [174, 60], text: 检查容量与依赖, sub: 未就绪则本步等待, tone: control }
  - { at: [490, 294], size: [176, 60], text: 借块与引用, sub: APC启用时登记位置, tone: kv }
  - { at: [710, 294], size: [146, 60], text: 第4站前向, sub: 计算并写入新状态, tone: kv }
