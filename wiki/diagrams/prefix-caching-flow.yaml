layout: figure
id: prefix-caching-flow
caption: 第2站调度先查前缀。禁用或请求跳过读取时按零命中继续；混合模型寻找共同恢复边界。容量与依赖检查通过后借用命中块并补新块；启用APC且无需延迟登记时，按本步已确定的位置登记。随后第4站前向才写入新状态。登记不等于状态已经就绪。图按固定旧版路径说明。
size: [880, 420]
