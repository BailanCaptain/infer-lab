<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 320" width="900" height="320" role="img" aria-label="两条请求开头相同。请求 A 先来，开头写满的块 0、块 1 已经算完并按 block hash（块指纹）登记；请求 B 来时逐块对指纹，对上的块号直接填进自己的块表，这两块的计数变成 2，显存里始终只有一份。两条请求各自的尾巴没写满、内容不同，各写各的块，各自从尾块接着算。">
  <title>两条请求开头相同。请求 A 先来，开头写满的块 0、块 1 已经算完并按 block hash（块指纹）登记；请求 B 来时逐块对指纹，对上的块号直接填进自己的块表，这两块的计数变成 2，显存里始终只有一份。两条请求各自的尾巴没写满、内容不同，各写各的块，各自从尾块接着算。</title>
  <defs><marker id="prefix-caching-ah-kv" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="var(--color-kv, #4c65b6)"/></marker><marker id="prefix-caching-ah-token" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="var(--color-token, #087f73)"/></marker></defs>
  <rect x="230" y="96" width="300" height="128" rx="16" fill="none" stroke="var(--color-line-strong, #b8bcb5)" stroke-width="1.5"/>
  <text x="246" y="84" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="15" font-weight="700" fill="var(--color-ink, #17211f)">写满的前缀块：显存里只有一份</text>
  <path d="M174 90 L212 90 L212 144 L254 144" fill="none" stroke="var(--color-kv, #4c65b6)" stroke-width="1.4" marker-end="url(#prefix-caching-ah-kv)"/>
  <path d="M174 230 L212 230 L212 176 L254 176" fill="none" stroke="var(--color-kv, #4c65b6)" stroke-width="1.4" marker-end="url(#prefix-caching-ah-kv)"/>
  <path d="M506 144 L566 144 L566 90 L620 90" fill="none" stroke="var(--color-token, #087f73)" stroke-width="1.4" marker-end="url(#prefix-caching-ah-token)"/>
  <path d="M506 176 L566 176 L566 230 L620 230" fill="none" stroke="var(--color-token, #087f73)" stroke-width="1.4" marker-end="url(#prefix-caching-ah-token)"/>
  <rect x="24" y="64" width="150" height="52" rx="8" fill="var(--color-surface-sunken, #ece9df)" stroke="var(--color-ink, #17211f)" stroke-width="1.5"/>
  <text x="99" y="86" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="14" font-weight="700" fill="var(--color-ink, #17211f)" text-anchor="middle">请求 A</text>
  <text x="99" y="105" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="13" font-weight="400" fill="var(--color-ink, #17211f)" text-anchor="middle">先来，开头已算完</text>
  <rect x="24" y="204" width="150" height="52" rx="8" fill="var(--color-surface-sunken, #ece9df)" stroke="var(--color-ink, #17211f)" stroke-width="1.5"/>
  <text x="99" y="226" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="14" font-weight="700" fill="var(--color-ink, #17211f)" text-anchor="middle">请求 B</text>
  <text x="99" y="245" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="13" font-weight="400" fill="var(--color-ink, #17211f)" text-anchor="middle">后来，开头一模一样</text>
  <rect x="254" y="128" width="116" height="64" rx="8" fill="var(--color-kv, #4c65b6)" stroke="var(--color-ink, #17211f)" stroke-width="1.5"/>
  <text x="312" y="156" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="14" font-weight="700" fill="var(--color-ink-inverse, #ffffff)" text-anchor="middle">块 0</text>
  <text x="312" y="175" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="13" font-weight="400" fill="var(--color-ink-inverse, #ffffff)" text-anchor="middle">写满 · 计数 2</text>
  <rect x="390" y="128" width="116" height="64" rx="8" fill="var(--color-kv, #4c65b6)" stroke="var(--color-ink, #17211f)" stroke-width="1.5"/>
  <text x="448" y="156" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="14" font-weight="700" fill="var(--color-ink-inverse, #ffffff)" text-anchor="middle">块 1</text>
  <text x="448" y="175" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="13" font-weight="400" fill="var(--color-ink-inverse, #ffffff)" text-anchor="middle">写满 · 计数 2</text>
  <rect x="620" y="64" width="180" height="52" rx="8" fill="var(--color-surface-sunken, #ece9df)" stroke="var(--color-ink, #17211f)" stroke-width="1.5"/>
  <text x="710" y="86" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="14" font-weight="700" fill="var(--color-ink, #17211f)" text-anchor="middle">A 自己的尾块</text>
  <text x="710" y="105" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="13" font-weight="400" fill="var(--color-ink, #17211f)" text-anchor="middle">没写满，接着往里写</text>
  <rect x="620" y="204" width="180" height="52" rx="8" fill="var(--color-surface-sunken, #ece9df)" stroke="var(--color-ink, #17211f)" stroke-width="1.5"/>
  <text x="710" y="226" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="14" font-weight="700" fill="var(--color-ink, #17211f)" text-anchor="middle">B 自己的尾块</text>
  <text x="710" y="245" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="13" font-weight="400" fill="var(--color-ink, #17211f)" text-anchor="middle">没写满，另一块</text>
  <text x="24" y="24" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="13" font-weight="700" fill="var(--color-ink, #17211f)">开头相同的两条请求：写满的前缀块两边共用，尾巴各写各的</text>
  <text x="186" y="130" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="12" font-weight="400" fill="var(--color-ink, #17211f)">指同一份</text>
  <text x="548" y="120" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="12" font-weight="400" fill="var(--color-ink, #17211f)">各自续写</text>
  <text x="24" y="292" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="12" font-weight="400" fill="var(--color-ink, #17211f)">只画份数：命中的块不重算也不复制；每条请求从自己的尾块继续。</text>
</svg>
