layout: figure
id: prefix-caching
caption: 两条请求开头相同。请求 A 先来，开头写满的块 0、块 1 已经算完并按 block hash（块指纹）登记；请求 B 来时逐块对指纹，对上的块号直接填进自己的块表，这两块的计数变成 2，显存里始终只有一份。两条请求各自的尾巴没写满、内容不同，各写各的块，各自从尾块接着算。
size: [900, 320]
items:
  - { at: [24, 64], size: [150, 52], text: 请求 A, sub: 先来，开头已算完, tone: control, style: plain }
  - { at: [24, 204], size: [150, 52], text: 请求 B, sub: 后来，开头一模一样, tone: control, style: plain }
  - { at: [254, 128], size: [116, 64], text: 块 0, sub: 写满 · 计数 2, tone: kv }
  - { at: [390, 128], size: [116, 64], text: 块 1, sub: 写满 · 计数 2, tone: kv }
  - { at: [620, 64], size: [180, 52], text: A 自己的尾块, sub: 没写满，接着往里写, tone: token, style: plain }
  - { at: [620, 204], size: [180, 52], text: B 自己的尾块, sub: 没写满，另一块, tone: token, style: plain }
frames:
  - { at: [230, 96], size: [300, 128], label: 写满的前缀块：显存里只有一份 }
