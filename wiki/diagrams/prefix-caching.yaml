layout: figure
id: prefix-caching
caption: 第二次提问 6037 个 token，开头 6000 个和上一次相同；只有写满的前两块能直接拿来用，第三块连同相同的 1904 个 token 一起重算
size: [900, 190]

bars:
  # 0.13 像素 = 1 个 token；框是 3 个块 × 2048 = 6144 个位置
  - at: [40, 70]
    h: 40
    scale: 0.13
    frame: { value: 6144 }
    segments:
      - { value: 4096, tone: kv, text: 命中 4096 个 token }
      - { value: 1904, tone: danger, text: 开头相同也重算 1904 }
      - { value: 37, tone: token }

brackets:
  - { from: 40, to: 306, y: 122, label: 块 1：直接拿来用 }
  - { from: 306, to: 572, y: 122, label: 块 2：直接拿来用 }
  - { from: 572, to: 839, y: 122, label: 块 3：没写满，现算 }

texts:
  - { at: [40, 42], text: 一个块 = 2048 个 token, size: 14, strong: true }
  - { at: [823, 60], text: 新问题 37, size: 13, anchor: middle, tone: token }

pins:
  - source: vllm-ascend@baa023ad:vllm_ascend/patch/platform/patch_mamba_config.py#L127-L185
    symbols: [attn_block_size, mamba_block_size]
  - source: vllm-ascend@baa023ad:vllm_ascend/patch/platform/patch_kv_cache_utils.py#L82-L138
    symbols: [_ascend_resolve_kv_cache_block_sizes, resolve_kv_cache_block_sizes]
