<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 566" width="900" height="566" role="img" aria-label="v0.30.0 中 NPUModelRunner 在标准 Qwen3-8B 上拍平批次输入的顺序：Scheduler 计划送达 Worker 后，先同步持久批次 input_batch；随后在 _prepare_inputs 中异步提交单组 128-tok 块表，把多条在途请求拍平成连续一维的 input_ids [T]、positions [T]、前缀和边界 query_start_loc [B+1]，并在 NPU 上算出单一 slot_mapping [T] 与采样行索引 logits_indices，最后构建全 36 层共用的 1 份 AscendMetadata 送入第 4 站。">
  <title>v0.30.0 中 NPUModelRunner 在标准 Qwen3-8B 上拍平批次输入的顺序：Scheduler 计划送达 Worker 后，先同步持久批次 input_batch；随后在 _prepare_inputs 中异步提交单组 128-tok 块表，把多条在途请求拍平成连续一维的 input_ids [T]、positions [T]、前缀和边界 query_start_loc [B+1]，并在 NPU 上算出单一 slot_mapping [T] 与采样行索引 logits_indices，最后构建全 36 层共用的 1 份 AscendMetadata 送入第 4 站。</title>
  <defs><marker id="prepare-inputs-code-flow-qwen3-ah-ink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="var(--color-ink, #17211f)"/></marker><marker id="prepare-inputs-code-flow-qwen3-ah-control" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="var(--color-control, #66716d)"/></marker></defs>
  <rect x="16" y="132" width="868" height="322" rx="16" fill="none" stroke="var(--color-line-strong, #b8bcb5)" stroke-width="1.5"/>
  <text x="32" y="156" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="13" font-weight="700" fill="var(--color-ink, #17211f)">第 3 站 _prepare_inputs：把多请求拍平为一维连续张量（NPUModelRunner）</text>
