<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 566" width="900" height="566" role="img" aria-label="一步里 model runner 的先后顺序。第 2 站的调度计划经广播队列发给本组 8 个 worker；每个 worker 先把持久批次改成和计划一致，本步没有 token 时不进常规输入准备，按配置完成必要协作后提前返回。接着准备输入：先发起块表拷贝，再定每行属于谁和这一步的形态，填位置和 token id、边界和长度，在 NPU 上算槽位，最后按有没有草稿决定选哪几行。之后补齐行数（图尺寸、两个 DP 组对齐），按缓存组建好注意力元数据，进入第 4 站。">
  <title>一步里 model runner 的先后顺序。第 2 站的调度计划经广播队列发给本组 8 个 worker；每个 worker 先把持久批次改成和计划一致，本步没有 token 时不进常规输入准备，按配置完成必要协作后提前返回。接着准备输入：先发起块表拷贝，再定每行属于谁和这一步的形态，填位置和 token id、边界和长度，在 NPU 上算槽位，最后按有没有草稿决定选哪几行。之后补齐行数（图尺寸、两个 DP 组对齐），按缓存组建好注意力元数据，进入第 4 站。</title>
  <defs><marker id="prepare-inputs-code-flow-ah-ink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="var(--color-ink, #17211f)"/></marker><marker id="prepare-inputs-code-flow-ah-control" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="var(--color-control, #66716d)"/></marker></defs>
  <rect x="16" y="132" width="868" height="322" rx="16" fill="none" stroke="var(--color-line-strong, #b8bcb5)" stroke-width="1.5"/>
  <text x="32" y="156" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="13" font-weight="700" fill="var(--color-ink, #17211f)">第 3 站 准备输入（每个 worker 的 model runner）</text>
  <path d="M284 70 L324 70" fill="none" stroke="var(--color-ink, #17211f)" stroke-width="1.4" marker-end="url(#prepare-inputs-code-flow-ah-ink)"/>
