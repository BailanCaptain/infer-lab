<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 416" width="900" height="416" role="img" aria-label="A/C 第三轮拼接与槽位映射推导图：持久批次状态经本步计划展平成 4 行 Ragged 张量、块表查槽位与末尾选行">
  <defs>
    <marker id="arr-teal" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,1 L9,5 L0,9 z" fill="#087f73"/>
    </marker>
    <marker id="arr-amber" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,1 L9,5 L0,9 z" fill="#c78300"/>
    </marker>
    <marker id="arr-indigo" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,1 L9,5 L0,9 z" fill="#4c65b6"/>
    </marker>
  </defs>

  <text x="20" y="28" font-family="sans-serif" font-size="16" font-weight="700" fill="#17211f">A / C 第三轮拼接：从持久批次展开为 4 行输入、槽位映射与末尾选行</text>

  <!-- Left: Persistent Batch Inputs -->
  <rect x="20" y="46" width="236" height="168" rx="9" fill="#f7f5ef" stroke="#b8bcb5" stroke-width="1.4"/>
  <rect x="20" y="46" width="236" height="32" rx="9" fill="#4d5652"/>
  <rect x="20" y="66" width="236" height="12" fill="#4d5652"/>
  <text x="138" y="68" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="700" fill="#ffffff">持久批次 + 调度计划</text>

  <rect x="32" y="88" width="212" height="54" rx="6" fill="#ddf4ef" stroke="#087f73" stroke-width="1.2"/>
  <text x="42" y="108" font-family="sans-serif" font-size="13.5" font-weight="700" fill="#065f56">Row 0: 请求 A（本步 +1）</text>
  <text x="42" y="130" font-family="monospace" font-size="13.5" fill="#17211f">已算=5 · blocks=[7, 2]</text>

  <rect x="32" y="150" width="212" height="54" rx="6" fill="#fff4cf" stroke="#c78300" stroke-width="1.2"/>
  <text x="42" y="170" font-family="sans-serif" font-size="13.5" font-weight="700" fill="#936300">Row 1: 请求 C（本步 +3）</text>
  <text x="42" y="192" font-family="monospace" font-size="13.5" fill="#17211f">已算=0 · blocks=[9]</text>

  <!-- Formula Card bottom-left -->
  <rect x="20" y="228" width="236" height="168" rx="9" fill="#e8edff" stroke="#4c65b6" stroke-width="1.4"/>
  <text x="34" y="254" font-family="sans-serif" font-size="14" font-weight="700" fill="#3a4f93">块表查槽公式（块长=4）</text>
  <text x="34" y="280" font-family="monospace" font-size="13.5" font-weight="700" fill="#17211f">blk = blocks[⌊p/4⌋]</text>
  <text x="34" y="302" font-family="monospace" font-size="13.5" font-weight="700" fill="#17211f">slot = blk×4 + (p%4)</text>
  <line x1="34" y1="318" x2="242" y2="318" stroke="#4c65b6" stroke-opacity="0.35" stroke-width="1"/>
  <text x="34" y="340" font-family="sans-serif" font-size="13.5" fill="#065f56">A (p=5): ⌊5/4⌋=1 → blk 2</text>
  <text x="34" y="360" font-family="monospace" font-size="13.5" fill="#065f56">→ slot = 2×4+1 = 9</text>
  <text x="34" y="382" font-family="sans-serif" font-size="13.5" fill="#936300">C (p=0..2): blk 9 → 36..38</text>

  <!-- Connectors Left -> Center -->
  <line x1="256" y1="115" x2="286" y2="115" stroke="#087f73" stroke-width="1.8" marker-end="url(#arr-teal)"/>
  <line x1="256" y1="177" x2="286" y2="177" stroke="#c78300" stroke-width="1.8" marker-end="url(#arr-amber)"/>
  <line x1="256" y1="296" x2="286" y2="296" stroke="#4c65b6" stroke-width="1.8" marker-end="url(#arr-indigo)"/>

  <!-- Center: 4-Row Ragged Tensor Strips -->
  <rect x="292" y="46" width="368" height="350" rx="10" fill="#ffffff" stroke="#b8bcb5" stroke-width="1.4"/>
  <text x="476" y="72" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="700" fill="#17211f">本步 4 行紧排张量（按 token 维度）</text>

  <!-- Column headers (row 0..3) -->
  <text x="424" y="96" text-anchor="middle" font-family="monospace" font-size="13.5" font-weight="700" fill="#065f56">行 0 (A)</text>
  <text x="492" y="96" text-anchor="middle" font-family="monospace" font-size="13.5" font-weight="700" fill="#936300">行 1 (C)</text>
  <text x="556" y="96" text-anchor="middle" font-family="monospace" font-size="13.5" font-weight="700" fill="#936300">行 2 (C)</text>
  <text x="620" y="96" text-anchor="middle" font-family="monospace" font-size="13.5" font-weight="700" fill="#936300">行 3 (C)</text>

  <!-- Strip 1: req_row -->
  <text x="304" y="128" font-family="monospace" font-size="13.5" font-weight="700" fill="#4d5652">req_row</text>
  <rect x="394" y="106" width="60" height="32" rx="5" fill="#ddf4ef" stroke="#087f73" stroke-width="1.2"/>
  <text x="424" y="128" text-anchor="middle" font-family="monospace" font-size="14" font-weight="700" fill="#065f56">0</text>
  <rect x="462" y="106" width="60" height="32" rx="5" fill="#fff4cf" stroke="#c78300" stroke-width="1.2"/>
  <text x="492" y="128" text-anchor="middle" font-family="monospace" font-size="14" font-weight="700" fill="#936300">1</text>
  <rect x="526" y="106" width="60" height="32" rx="5" fill="#fff4cf" stroke="#c78300" stroke-width="1.2"/>
  <text x="556" y="128" text-anchor="middle" font-family="monospace" font-size="14" font-weight="700" fill="#936300">1</text>
  <rect x="590" y="106" width="60" height="32" rx="5" fill="#fff4cf" stroke="#c78300" stroke-width="1.2"/>
  <text x="620" y="128" text-anchor="middle" font-family="monospace" font-size="14" font-weight="700" fill="#936300">1</text>

  <!-- Strip 2: positions -->
  <text x="304" y="172" font-family="monospace" font-size="13.5" font-weight="700" fill="#4d5652">positions</text>
  <rect x="394" y="150" width="60" height="32" rx="5" fill="#ddf4ef" stroke="#087f73" stroke-width="1.2"/>
  <text x="424" y="172" text-anchor="middle" font-family="monospace" font-size="14" font-weight="700" fill="#065f56">5</text>
  <rect x="462" y="150" width="60" height="32" rx="5" fill="#fff4cf" stroke="#c78300" stroke-width="1.2"/>
  <text x="492" y="172" text-anchor="middle" font-family="monospace" font-size="14" font-weight="700" fill="#936300">0</text>
  <rect x="526" y="150" width="60" height="32" rx="5" fill="#fff4cf" stroke="#c78300" stroke-width="1.2"/>
  <text x="556" y="172" text-anchor="middle" font-family="monospace" font-size="14" font-weight="700" fill="#936300">1</text>
  <rect x="590" y="150" width="60" height="32" rx="5" fill="#fff4cf" stroke="#c78300" stroke-width="1.2"/>
  <text x="620" y="172" text-anchor="middle" font-family="monospace" font-size="14" font-weight="700" fill="#936300">2</text>

  <!-- Strip 3: input_ids -->
  <text x="304" y="216" font-family="monospace" font-size="13.5" font-weight="700" fill="#4d5652">input_ids</text>
  <rect x="394" y="194" width="60" height="32" rx="5" fill="#ddf4ef" stroke="#087f73" stroke-width="1.2"/>
  <text x="424" y="216" text-anchor="middle" font-family="monospace" font-size="14" font-weight="700" fill="#065f56">a₅</text>
  <rect x="462" y="194" width="60" height="32" rx="5" fill="#fff4cf" stroke="#c78300" stroke-width="1.2"/>
  <text x="492" y="216" text-anchor="middle" font-family="monospace" font-size="14" font-weight="700" fill="#936300">c₀</text>
  <rect x="526" y="194" width="60" height="32" rx="5" fill="#fff4cf" stroke="#c78300" stroke-width="1.2"/>
  <text x="556" y="216" text-anchor="middle" font-family="monospace" font-size="14" font-weight="700" fill="#936300">c₁</text>
  <rect x="590" y="194" width="60" height="32" rx="5" fill="#fff4cf" stroke="#c78300" stroke-width="1.2"/>
  <text x="620" y="216" text-anchor="middle" font-family="monospace" font-size="14" font-weight="700" fill="#936300">c₂</text>

  <!-- Strip 4: block_id -->
  <text x="304" y="260" font-family="monospace" font-size="13.5" font-weight="700" fill="#4d5652">block_id</text>
  <rect x="394" y="238" width="60" height="32" rx="5" fill="#e8edff" stroke="#4c65b6" stroke-width="1.1"/>
  <text x="424" y="260" text-anchor="middle" font-family="monospace" font-size="14" fill="#3a4f93">2</text>
  <rect x="462" y="238" width="60" height="32" rx="5" fill="#e8edff" stroke="#4c65b6" stroke-width="1.1"/>
  <text x="492" y="260" text-anchor="middle" font-family="monospace" font-size="14" fill="#3a4f93">9</text>
  <rect x="526" y="238" width="60" height="32" rx="5" fill="#e8edff" stroke="#4c65b6" stroke-width="1.1"/>
  <text x="556" y="260" text-anchor="middle" font-family="monospace" font-size="14" fill="#3a4f93">9</text>
  <rect x="590" y="238" width="60" height="32" rx="5" fill="#e8edff" stroke="#4c65b6" stroke-width="1.1"/>
  <text x="620" y="260" text-anchor="middle" font-family="monospace" font-size="14" fill="#3a4f93">9</text>

  <!-- Strip 5: slot_mapping -->
  <text x="304" y="304" font-family="monospace" font-size="13.5" font-weight="700" fill="#3a4f93">slot_map</text>
  <rect x="394" y="282" width="60" height="32" rx="5" fill="#e8edff" stroke="#4c65b6" stroke-width="1.6"/>
  <text x="424" y="304" text-anchor="middle" font-family="monospace" font-size="14" font-weight="700" fill="#3a4f93">9</text>
  <rect x="462" y="282" width="60" height="32" rx="5" fill="#e8edff" stroke="#4c65b6" stroke-width="1.6"/>
  <text x="492" y="304" text-anchor="middle" font-family="monospace" font-size="14" font-weight="700" fill="#3a4f93">36</text>
  <rect x="526" y="282" width="60" height="32" rx="5" fill="#e8edff" stroke="#4c65b6" stroke-width="1.6"/>
  <text x="556" y="304" text-anchor="middle" font-family="monospace" font-size="14" font-weight="700" fill="#3a4f93">37</text>
  <rect x="590" y="282" width="60" height="32" rx="5" fill="#e8edff" stroke="#4c65b6" stroke-width="1.6"/>
  <text x="620" y="304" text-anchor="middle" font-family="monospace" font-size="14" font-weight="700" fill="#3a4f93">38</text>

  <!-- Segment Brackets + logits_indices highlight -->
  <path d="M396,326 L396,336 L452,336 L452,326" fill="none" stroke="#087f73" stroke-width="1.6"/>
  <text x="424" y="355" text-anchor="middle" font-family="sans-serif" font-size="13.5" font-weight="700" fill="#065f56">A [0, 1)</text>
  <path d="M464,326 L464,336 L648,336 L648,326" fill="none" stroke="#c78300" stroke-width="1.6"/>
  <text x="556" y="355" text-anchor="middle" font-family="sans-serif" font-size="13.5" font-weight="700" fill="#936300">C [1, 4)</text>

  <rect x="394" y="364" width="60" height="22" rx="11" fill="#087f73"/>
  <text x="424" y="380" text-anchor="middle" font-family="sans-serif" font-size="13.5" font-weight="700" fill="#ffffff">选行 0</text>
  <rect x="590" y="364" width="60" height="22" rx="11" fill="#c78300"/>
  <text x="620" y="380" text-anchor="middle" font-family="sans-serif" font-size="13.5" font-weight="700" fill="#ffffff">选行 3</text>

  <!-- Right: Request-level Metadata Summary -->
  <line x1="660" y1="196" x2="686" y2="196" stroke="#087f73" stroke-width="1.8" marker-end="url(#arr-teal)"/>

  <rect x="692" y="46" width="188" height="350" rx="10" fill="#f7f5ef" stroke="#b8bcb5" stroke-width="1.4"/>
  <rect x="692" y="46" width="188" height="32" rx="10" fill="#087f73"/>
  <rect x="692" y="66" width="188" height="12" fill="#087f73"/>
  <text x="786" y="68" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="700" fill="#ffffff">按请求元数据</text>

  <rect x="704" y="92" width="164" height="62" rx="7" fill="#ffffff" stroke="#d8d8cf" stroke-width="1"/>
  <text x="716" y="114" font-family="monospace" font-size="13.5" font-weight="700" fill="#17211f">query_start_loc</text>
  <text x="716" y="138" font-family="monospace" font-size="14" font-weight="700" fill="#065f56">[0, 1, 4]</text>

  <rect x="704" y="166" width="164" height="62" rx="7" fill="#ffffff" stroke="#d8d8cf" stroke-width="1"/>
  <text x="716" y="188" font-family="monospace" font-size="13.5" font-weight="700" fill="#17211f">seq_lens</text>
  <text x="716" y="212" font-family="monospace" font-size="14" font-weight="700" fill="#3a4f93">[6, 3]</text>

  <rect x="704" y="240" width="164" height="66" rx="7" fill="#fff4cf" stroke="#c78300" stroke-width="1.3"/>
  <text x="716" y="262" font-family="monospace" font-size="13.5" font-weight="700" fill="#936300">logits_indices</text>
  <text x="716" y="286" font-family="monospace" font-size="14" font-weight="700" fill="#936300">[0, 3]</text>

  <text x="706" y="330" font-family="sans-serif" font-size="13.5" font-weight="700" fill="#17211f">历史完全隔离：</text>
  <text x="706" y="352" font-family="sans-serif" font-size="13.5" fill="#4d5652">A 只看自己 6 格</text>
  <text x="706" y="374" font-family="sans-serif" font-size="13.5" fill="#4d5652">C 只看自己 3 格</text>
</svg>
