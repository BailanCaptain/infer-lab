<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 540" width="900" height="540" role="img" aria-label="准备输入双轨并行流水与常规组 vs 线性注意力组边界张量格对照" font-family="var(--font-sans)">
  <title>Host 拼装与非阻塞块表 H2D 并行流水，及补齐行在 slot_mapping / query_start_loc / KDA 边界的真实格值</title>
  <desc>Dual-track overlapping Host CPU and DMA H2D timeline meeting at NPU compute_slot_mapping kernel, plus explicit tensor cell grids comparing padded regular/SFA query_start_loc with fake requests vs KDA query_start_loc repeating last real boundary</desc>
  <defs>
    <marker id="pi-arr-ink" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="#4d5652"/>
    </marker>
    <marker id="pi-arr-indigo" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="#4c65b6"/>
    </marker>
    <marker id="pi-arr-teal" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="#087f73"/>
    </marker>
  </defs>

  <!-- Section 1: Dual-Track Overlapping Timeline -->
  <text x="16" y="28" font-size="16" font-weight="700" fill="#17211f">① 并行流水：首行非阻塞发起块表 H2D，与 CPU 展平重叠后汇入 NPU 槽位核</text>

  <!-- Track 1: Host CPU -->
  <rect x="16" y="48" width="112" height="56" rx="5" fill="#fff4cf" stroke="#c78300" stroke-width="1.3"/>
  <text x="72" y="72" text-anchor="middle" font-size="14" font-weight="700" fill="#936300">Host CPU</text>
  <text x="72" y="93" text-anchor="middle" font-size="13.5" fill="#4d5652">Pinned 缓冲</text>

  <rect x="142" y="48" width="184" height="56" rx="6" fill="#fff4cf" stroke="#c78300" stroke-width="1.3"/>
  <text x="234" y="72" text-anchor="middle" font-size="14" font-weight="700" fill="#936300">_update_states 对账</text>
  <text x="234" y="93" text-anchor="middle" font-size="13.5" fill="#4d5652">恢复替换块号·四段重排</text>

  <line x1="328" y1="76" x2="352" y2="76" stroke="#4d5652" stroke-width="1.6" marker-end="url(#pi-arr-ink)"/>

  <rect x="356" y="48" width="242" height="56" rx="6" fill="#fff4cf" stroke="#c78300" stroke-width="1.3"/>
  <text x="477" y="72" text-anchor="middle" font-size="14" font-weight="700" fill="#936300">NumPy 展平一排新 token</text>
  <text x="477" y="93" text-anchor="middle" font-size="13.5" fill="#4d5652">repeat 行号 · positions · 边界/选行</text>

  <!-- Track 2: DMA / H2D -->
  <rect x="16" y="118" width="112" height="52" rx="5" fill="#e8edff" stroke="#4c65b6" stroke-width="1.3"/>
  <text x="72" y="140" text-anchor="middle" font-size="14" font-weight="700" fill="#3a4f93">DMA H2D</text>
  <text x="72" y="160" text-anchor="middle" font-size="13.5" fill="#4d5652">与 CPU 重叠</text>

  <!-- Branch arrow from start of prepare_inputs down to DMA -->
  <path d="M 340 76 L 340 144 L 354 144" fill="none" stroke="#4c65b6" stroke-width="1.6" stroke-dasharray="4 3" marker-end="url(#pi-arr-indigo)"/>
  <rect x="356" y="118" width="242" height="52" rx="6" fill="#e8edff" stroke="#4c65b6" stroke-width="1.4"/>
  <text x="477" y="140" text-anchor="middle" font-size="14" font-weight="700" fill="#3a4f93">首行 commit_block_table</text>
  <text x="477" y="160" text-anchor="middle" font-size="13.5" fill="#4d5652">非阻塞拷活跃行块表 + 异步差值判拷贝</text>

  <!-- Merge arrows into NPU Kernel -->
  <path d="M 600 76 L 626 104" fill="none" stroke="#087f73" stroke-width="1.7" marker-end="url(#pi-arr-teal)"/>
  <path d="M 600 144 L 626 118" fill="none" stroke="#087f73" stroke-width="1.7" marker-end="url(#pi-arr-teal)"/>

  <rect x="630" y="54" width="254" height="110" rx="7" fill="#ddf4ef" stroke="#087f73" stroke-width="1.5"/>
  <text x="757" y="80" text-anchor="middle" font-size="14.5" font-weight="700" fill="#065f56">NPU 槽位核 + 公共底稿</text>
  <text x="757" y="104" text-anchor="middle" font-size="13.5" font-family="var(--font-mono)" fill="#17211f">compute_slot_mapping()</text>
  <text x="757" y="128" text-anchor="middle" font-size="13.5" fill="#4d5652">可融合时单核算，否则按 KV 组算</text>
  <text x="757" y="150" text-anchor="middle" font-size="13.5" font-weight="700" fill="#065f56">跳过 Mamba 组 → 公共底稿</text>

  <line x1="16" y1="186" x2="884" y2="186" stroke="#b8bcb5" stroke-width="1.4" stroke-dasharray="6 4"/>

  <!-- Section 2: Tensor Cell Grids for Padding (A/C 4 real tokens padded to width 6!) -->
  <text x="16" y="214" font-size="16" font-weight="700" fill="#17211f">② 补齐行不是新请求：A(1) + C(3) 补到宽度 6 时，三张表怎么标清楚？</text>
  <text x="16" y="236" font-size="13.5" fill="#66716d">示意将 4 个有效 token（行 0..3）向上补齐 2 行（行 4..5）；按缓存组分别换入对应块表与两份不同边界</text>

  <!-- Grid 1: slot_mapping -->
  <text x="16" y="270" font-size="14" font-weight="700" font-family="var(--font-mono)" fill="#3a4f93">slot_mapping</text>
  <text x="16" y="291" font-size="13.5" fill="#66716d">（写入 KV 槽）</text>
  <g text-anchor="middle" font-family="var(--font-mono)" font-size="14" font-weight="700">
    <rect x="168" y="252" width="74" height="42" rx="4" fill="#ddf4ef" stroke="#087f73" stroke-width="1.3"/><text x="205" y="278" fill="#065f56">9 (A)</text>
    <rect x="246" y="252" width="74" height="42" rx="4" fill="#e8edff" stroke="#4c65b6" stroke-width="1.3"/><text x="283" y="278" fill="#3a4f93">36 (C)</text>
    <rect x="324" y="252" width="74" height="42" rx="4" fill="#e8edff" stroke="#4c65b6" stroke-width="1.3"/><text x="361" y="278" fill="#3a4f93">37 (C)</text>
    <rect x="402" y="252" width="74" height="42" rx="4" fill="#e8edff" stroke="#4c65b6" stroke-width="1.3"/><text x="439" y="278" fill="#3a4f93">38 (C)</text>
    <rect x="486" y="252" width="74" height="42" rx="4" fill="#ece9df" stroke="#b54237" stroke-width="1.4" stroke-dasharray="4 3"/><text x="523" y="278" fill="#8f3229">-1</text>
    <rect x="564" y="252" width="74" height="42" rx="4" fill="#ece9df" stroke="#b54237" stroke-width="1.4" stroke-dasharray="4 3"/><text x="601" y="278" fill="#8f3229">-1</text>
  </g>
  <text x="652" y="270" font-size="13.5" font-weight="700" fill="#8f3229">尾部填 -1（不写 KV）</text>
  <text x="652" y="290" font-size="13.5" fill="#4d5652">长度 seq_lens 补位填 0</text>

  <!-- Grid 2: Regular / SFA query_start_loc -->
  <text x="16" y="334" font-size="14" font-weight="700" fill="#7a3a6a">常规 / 稀疏 MLA 边界</text>
  <text x="16" y="352" font-size="13.5" font-family="var(--font-mono)" fill="#66716d">_pad_for_fia</text>
  <g text-anchor="middle" font-family="var(--font-mono)" font-size="14" font-weight="700">
    <rect x="168" y="314" width="74" height="42" rx="4" fill="#f7e7f2" stroke="#9a4b86" stroke-width="1.3"/><text x="205" y="340" fill="#7a3a6a">0</text>
    <rect x="246" y="314" width="74" height="42" rx="4" fill="#f7e7f2" stroke="#9a4b86" stroke-width="1.3"/><text x="283" y="340" fill="#7a3a6a">1</text>
    <rect x="324" y="314" width="74" height="42" rx="4" fill="#f7e7f2" stroke="#9a4b86" stroke-width="1.3"/><text x="361" y="340" fill="#7a3a6a">4</text>
    <rect x="402" y="314" width="114" height="42" rx="4" fill="#fff4cf" stroke="#c78300" stroke-width="1.4" stroke-dasharray="4 3"/><text x="459" y="340" fill="#936300">→ 补假请求 6</text>
  </g>
  <text x="530" y="332" font-size="13.5" font-weight="700" fill="#7a3a6a">尾值必须等于补齐后总行数 6</text>
  <text x="530" y="352" font-size="13.5" fill="#4d5652">算子按假请求段包住补齐行（SFA / FIA）</text>

  <!-- Grid 3: KDA / GDN query_start_loc -->
  <text x="16" y="396" font-size="14" font-weight="700" fill="#8f3229">KDA / GDN 专用边界</text>
  <text x="16" y="414" font-size="13.5" font-family="var(--font-mono)" fill="#66716d">gdn_q_start_loc</text>
  <g text-anchor="middle" font-family="var(--font-mono)" font-size="14" font-weight="700">
    <rect x="168" y="376" width="74" height="42" rx="4" fill="#ddf4ef" stroke="#087f73" stroke-width="1.3"/><text x="205" y="402" fill="#065f56">0</text>
    <rect x="246" y="376" width="74" height="42" rx="4" fill="#ddf4ef" stroke="#087f73" stroke-width="1.3"/><text x="283" y="402" fill="#065f56">1</text>
    <rect x="324" y="376" width="74" height="42" rx="4" fill="#ddf4ef" stroke="#087f73" stroke-width="1.3"/><text x="361" y="402" fill="#065f56">4</text>
    <rect x="402" y="376" width="114" height="42" rx="4" fill="#fff0e9" stroke="#b54237" stroke-width="1.4"/><text x="459" y="402" fill="#8f3229">重复 4, 4 ...</text>
  </g>
  <text x="530" y="394" font-size="13.5" font-weight="700" fill="#8f3229">不含假请求 · 仅重复最后真实边界 4</text>
  <text x="530" y="414" font-size="13.5" fill="#4d5652">KDA 块号直接当状态页号，不算逐位槽位</text>

  <!-- Bottom Version Evolution Strip -->
  <rect x="16" y="444" width="868" height="80" rx="7" fill="#ece9df" stroke="#b8bcb5" stroke-width="1.2"/>
  <text x="28" y="470" font-size="14.5" font-weight="700" fill="#17211f">版本分野：v0.30.0 默认 MRV1 宿主整排 vs main 统一 MRV2 常驻缓冲</text>
  <text x="28" y="494" font-size="12.5" fill="#4d5652"><tspan font-weight="700" fill="#936300">v0.30.0 (c09d3e20)：</tspan>MRV1 入口在 <tspan font-family="var(--font-mono)">model_runner_v1.py#L1279</tspan>（启动拒绝 PCP&gt;1）；设 VLLM_USE_V2_MODEL_RUNNER=1 可切 V2。</text>
  <text x="28" y="514" font-size="12.5" fill="#4d5652"><tspan font-weight="700" fill="#065f56">main (8d6180e2)：</tspan>移除 V1，统一由 <tspan font-family="var(--font-mono)">worker/v2/input_batch.py</tspan> 的 <tspan font-family="var(--font-mono)">AscendInputBuffers</tspan> 预分配常驻并就地切片更新。</text>
</svg>
