<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 390" width="900" height="390" role="img" aria-label="按最长补齐 vs vLLM 首尾相接展平对比，及三套不可混用的编号" font-family="var(--font-sans)">
  <title>为什么首尾相接展平而不是按最长补齐：A(1) + C(3) 几何格对照与三套编号</title>
  <desc>Visual comparison of rectangular padding (2x3=6 cells with 2 wasted) vs vLLM ragged 1D packing (4 tight cells) paired with the three distinct IDs: batch row, request position, and KV cache slot</desc>

  <!-- Left: Rectangular Padding (BAD) -->
  <text x="16" y="28" font-size="16" font-weight="700" fill="#8f3229">✗ 排法一：每条请求一行，按最长补齐（2×3 = 6 格）</text>

  <text x="16" y="68" font-size="14" font-weight="700" fill="#065f56">请求 A</text>
  <rect x="86" y="44" width="94" height="38" rx="5" fill="#ddf4ef" stroke="#087f73" stroke-width="1.4"/>
  <text x="133" y="68" text-anchor="middle" font-size="14" font-weight="700" fill="#065f56">a₅</text>
  <rect x="186" y="44" width="94" height="38" rx="5" fill="#fff0e9" stroke="#b54237" stroke-width="1.3" stroke-dasharray="5 3"/>
  <text x="233" y="68" text-anchor="middle" font-size="13.5" fill="#8f3229">PAD 白算</text>
  <rect x="286" y="44" width="94" height="38" rx="5" fill="#fff0e9" stroke="#b54237" stroke-width="1.3" stroke-dasharray="5 3"/>
  <text x="333" y="68" text-anchor="middle" font-size="13.5" fill="#8f3229">PAD 白算</text>

  <text x="16" y="116" font-size="14" font-weight="700" fill="#3a4f93">请求 C</text>
  <rect x="86" y="92" width="94" height="38" rx="5" fill="#e8edff" stroke="#4c65b6" stroke-width="1.4"/>
  <text x="133" y="116" text-anchor="middle" font-size="14" font-weight="700" fill="#3a4f93">c₀</text>
  <rect x="186" y="92" width="94" height="38" rx="5" fill="#e8edff" stroke="#4c65b6" stroke-width="1.4"/>
  <text x="233" y="116" text-anchor="middle" font-size="14" font-weight="700" fill="#3a4f93">c₁</text>
  <rect x="286" y="92" width="94" height="38" rx="5" fill="#e8edff" stroke="#4c65b6" stroke-width="1.4"/>
  <text x="333" y="116" text-anchor="middle" font-size="14" font-weight="700" fill="#3a4f93">c₂</text>

  <rect x="16" y="148" width="388" height="70" rx="7" fill="#fff0e9" stroke="#d88c82" stroke-width="1.2"/>
  <text x="26" y="174" font-size="14" font-weight="700" fill="#8f3229">混批代价极高：</text>
  <text x="26" y="198" font-size="12.5" fill="#4d5652">1 条 decode(1) + 1 条 prefill(2000) → decode 行补 1999 格！</text>

  <!-- Vertical Divider -->
  <line x1="426" y1="16" x2="426" y2="224" stroke="#b8bcb5" stroke-width="1.4" stroke-dasharray="6 4"/>

  <!-- Right: Ragged 1D Packing (GOOD) -->
  <text x="448" y="28" font-size="16" font-weight="700" fill="#065f56">✓ 排法二：vLLM 首尾相接展平（仅 4 行，0 补齐格）</text>

  <!-- 4 tight packed cells -->
  <rect x="448" y="48" width="102" height="44" rx="5" fill="#ddf4ef" stroke="#087f73" stroke-width="1.5"/>
  <text x="499" y="75" text-anchor="middle" font-size="15" font-weight="700" fill="#065f56">a₅</text>
  <rect x="556" y="48" width="102" height="44" rx="5" fill="#e8edff" stroke="#4c65b6" stroke-width="1.5"/>
  <text x="607" y="75" text-anchor="middle" font-size="15" font-weight="700" fill="#3a4f93">c₀</text>
  <rect x="664" y="48" width="102" height="44" rx="5" fill="#e8edff" stroke="#4c65b6" stroke-width="1.5"/>
  <text x="715" y="75" text-anchor="middle" font-size="15" font-weight="700" fill="#3a4f93">c₁</text>
  <rect x="772" y="48" width="112" height="44" rx="5" fill="#e8edff" stroke="#4c65b6" stroke-width="1.5"/>
  <text x="828" y="75" text-anchor="middle" font-size="15" font-weight="700" fill="#3a4f93">c₂</text>

  <!-- Brackets showing query_start_loc = [0, 1, 4] -->
  <path d="M 448 100 L 448 110 L 550 110 L 550 100" fill="none" stroke="#087f73" stroke-width="1.6"/>
  <text x="499" y="128" text-anchor="middle" font-size="13.5" font-weight="700" fill="#065f56">A: [0, 1)</text>
  <path d="M 556 100 L 556 110 L 884 110 L 884 100" fill="none" stroke="#4c65b6" stroke-width="1.6"/>
  <text x="720" y="128" text-anchor="middle" font-size="13.5" font-weight="700" fill="#3a4f93">C: [1, 4)  （query_start_loc = [0, 1, 4]）</text>

  <rect x="448" y="148" width="436" height="70" rx="7" fill="#ddf4ef" stroke="#087f73" stroke-width="1.2"/>
  <text x="462" y="174" font-size="14" font-weight="700" fill="#065f56">展平的代价：每个 token 丢失身份 → 必须配齐身份表</text>
  <text x="462" y="198" font-size="13.5" fill="#4d5652">线性层 4 行共乘同一份权重；注意力靠边界/长度/块表隔离历史</text>

  <!-- Bottom: 3 Distinct IDs Comparison Bar -->
  <line x1="16" y1="242" x2="884" y2="242" stroke="#b8bcb5" stroke-width="1.4" stroke-dasharray="6 4"/>
  <text x="16" y="270" font-size="16" font-weight="700" fill="#17211f">同一个 token 身上有三套独立编号（严禁互相替代）</text>

  <rect x="16" y="286" width="278" height="88" rx="7" fill="#fff4cf" stroke="#c78300" stroke-width="1.3"/>
  <text x="30" y="312" font-size="14.5" font-weight="700" fill="#936300">① 批次行号（每步重排）</text>
  <text x="30" y="338" font-size="14" font-weight="700" font-family="var(--font-mono)" fill="#17211f">[0, 1, 2, 3]</text>
  <text x="30" y="360" font-size="13.5" fill="#4d5652">a₅ 坐行 0 · c₀ 坐行 1</text>

  <rect x="310" y="286" width="278" height="88" rx="7" fill="#ddf4ef" stroke="#087f73" stroke-width="1.3"/>
  <text x="324" y="312" font-size="14.5" font-weight="700" fill="#065f56">② 请求内位置（跨步累加）</text>
  <text x="324" y="338" font-size="14" font-weight="700" font-family="var(--font-mono)" fill="#17211f">[5, 0, 1, 2]</text>
  <text x="324" y="360" font-size="13.5" fill="#4d5652">a₅ 位置 5 · c₀ 位置 0（给 RoPE）</text>

  <rect x="604" y="286" width="280" height="88" rx="7" fill="#e8edff" stroke="#4c65b6" stroke-width="1.3"/>
  <text x="618" y="312" font-size="14.5" font-weight="700" fill="#3a4f93">③ KV 槽位（经块表换算）</text>
  <text x="618" y="338" font-size="14" font-weight="700" font-family="var(--font-mono)" fill="#17211f">[9, 36, 37, 38]</text>
  <text x="618" y="360" font-size="13.5" fill="#4d5652">a₅ 写格 9 · c₀ 写格 36（非块号）</text>
</svg>
