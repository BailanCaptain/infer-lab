  <text x="20" y="272" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="13.5" font-weight="600" fill="var(--color-ink, #17211f)">中间那一步具体在算什么</text>
  <text x="140" y="372" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="12.5" font-weight="400" fill="var(--color-ink-muted, #5b6763)">位置 128 ÷ 128 = 第 1 列</text>
  <text x="420" y="372" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="12.5" font-weight="400" fill="var(--color-ink-muted, #5b6763)">128 % 128 = 第 0 格</text>
  <text x="20" y="412" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="14" font-weight="600" fill="var(--color-ink, #17211f)">slot = block_table[req][128 // 128] × 128 + 128 % 128 = b1 × 128 + 0</text>
  <text x="20" y="446" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="12.5" font-weight="400" fill="var(--color-ink-muted, #5b6763)">这道除法和取模就是「分页」在代码里的全部形态。上游只给了 b0、b1 两个整数，落到哪一格是这里算的——两件事分在两个进程里。</text>
  <text x="20" y="482" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="12.5" font-weight="400" fill="var(--color-ink-muted, #5b6763)">批里没排满的位置要填 PAD_SLOT_ID：一个哨兵槽位，写进去不会弄坏任何人的 KV。</text>
</svg>
