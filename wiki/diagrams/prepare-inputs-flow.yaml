layout: figure
id: prepare-inputs-flow
caption: 示意数：A 已算 5 个位置、本步 1 个 token；C 是新请求、本步 3 个。准备输入把这 4 个 token 排成一排，一列一个，每列写明属于谁、是哪个词（token id）、在自己请求里排第几（位置）、KV 写进缓存池哪一格（槽位；块长按 4，A 的块表 [7, 2]、C 的 [9]）。下面三张短表按请求记：边界说 A 占第 0 列、C 占第 1–3 列，长度是算完后各有几个位置，选行是要拿去预测下一个 token 的列。token id 和位置送进模型；边界、长度连同块表和槽位组成注意力元数据；输出头只算选中的第 0、3 列。
size: [900, 420]
items:
