<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 652" width="900" height="652" role="img" aria-label="v0.30.0 profiling_chunk_config（CPP）启动拟合与每步动态截断流程，以及 main PR #21310 移除说明" font-family="var(--font-sans)">
  <title>v0.30.0 (c09d3e20) 动态切块（CPP）工作流：启动期实测拟合二次曲线并设目标时延，运行期按已算前缀反解正根、平滑、向上对齐并仅收窄 token 预算（在线校准完成后切至非负最小二乘历史模型）；main (8d6180e2) 已随 PR #21310（839f53831）整体移除。</title>
  <desc>Startup quadratic latency profiling and per-step prefill chunk prediction pipeline in v0.30.0 (c09d3e20), including history-aware calibration model and PR #21310 removal on main (8d6180e2).</desc>

  <text x="16" y="28" font-size="16" font-weight="700" fill="#17211f">v0.30.0 (c09d3e20) 动态切块（CPP）：启动拟合与每步预算截断流</text>
  <text x="16" y="48" font-size="13.5" fill="#66716d">先量出本机延迟曲线，再按每条请求已有前缀长度反解本步 token 切块大小，缓解 PP 多阶段等待气泡</text>

  <!-- Phase 1: Startup profiling -->
  <text x="16" y="76" font-size="14.5" font-weight="700" fill="#3a4f93">阶段一 · 启动期（只做一次，复用 dummy_run 实测延迟）</text>

  <rect x="16" y="88" width="270" height="74" rx="8" fill="#e8edff" stroke="#4c65b6" stroke-width="1.3"/>
  <text x="30" y="112" font-size="14.5" font-weight="700" fill="#3a4f93">1. 预热 + 采点实测</text>
  <text x="30" y="134" font-size="13.5" fill="#4d5652">1 次预热 + 尝试 64 个点</text>
  <text x="30" y="153" font-size="13" fill="#66716d">跳过失败点，至少 8 个有效点</text>

  <path d="M286 125 H310 m-5-5 l5 5 -5 5" fill="none" stroke="#4c65b6" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/>

  <rect x="315" y="88" width="270" height="74" rx="8" fill="#e8edff" stroke="#4c65b6" stroke-width="1.3"/>
  <text x="329" y="112" font-size="14.5" font-weight="700" fill="#3a4f93">2. 拟合启动延迟曲线</text>
  <text x="329" y="134" font-size="13.5" fill="#4d5652" font-family="var(--font-mono)">f(l) = a*l^2 + b*l + c</text>
  <text x="329" y="153" font-size="13" fill="#66716d">最小二乘拟合单块耗时关系</text>

  <path d="M585 125 H609 m-5-5 l5 5 -5 5" fill="none" stroke="#4c65b6" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/>

  <rect x="614" y="88" width="270" height="74" rx="8" fill="#e8edff" stroke="#4c65b6" stroke-width="1.3"/>
  <text x="628" y="112" font-size="14.5" font-weight="700" fill="#3a4f93">3. 设定初始目标耗时</text>
  <text x="628" y="134" font-size="13.5" fill="#4d5652" font-family="var(--font-mono)">f(base_chunk) - f(0)</text>
  <text x="628" y="153" font-size="13" fill="#66716d">基准块来自 max_num_batched_tokens</text>

  <!-- Phase 2: Per-step runtime calculation -->
  <text x="16" y="192" font-size="14.5" font-weight="700" fill="#065f56">阶段二 · 每个 prefill 步（对满足条件的续算请求反解块长并截断预算）</text>

  <rect x="16" y="204" width="868" height="54" rx="7" fill="#ddf4ef" stroke="#087f73" stroke-width="1.3"/>
  <text x="32" y="227" font-size="14" font-weight="700" fill="#065f56">① 取本批剩余时间预算 T（并按在线校准状态选方程）</text>
  <text x="868" y="227" font-size="13" fill="#065f56" font-family="var(--font-mono)" text-anchor="end">target_latency / predict_with_history</text>
  <text x="32" y="248" font-size="13.5" fill="#4d5652">在线校准（need_timing 默认开）攒够 3 次零历史 + 超过 max_fit_chunk 个历史样本后，切至 v0.30.0 非负最小二乘历史模型</text>

  <rect x="16" y="266" width="868" height="54" rx="7" fill="#ddf4ef" stroke="#087f73" stroke-width="1.3"/>
  <text x="32" y="289" font-size="14" font-weight="700" fill="#065f56">② 按请求已有前缀长度 L（或 H）解二次方程正根 x</text>
  <text x="868" y="289" font-size="13" fill="#065f56" font-family="var(--font-mono)" text-anchor="end">discriminant = B*B - 4*A*C</text>
  <text x="32" y="310" font-size="13.5" fill="#4d5652">启动模型解 a·x² + (2aL + b)·x − T = 0；v0.30.0 历史模型 f(C,H) = a·C(C+H) + b·C + c 解 a·x² + (aH + b)·x + (c − T) = 0</text>

  <rect x="16" y="328" width="868" height="54" rx="7" fill="#ddf4ef" stroke="#087f73" stroke-width="1.3"/>
  <text x="32" y="351" font-size="14" font-weight="700" fill="#065f56">③ 按 smooth_factor 在基准块与预测值间线性平滑</text>
  <text x="868" y="351" font-size="13" fill="#065f56" font-family="var(--font-mono)" text-anchor="end">smooth_factor ∈ (0, 1]</text>
  <text x="32" y="372" font-size="13.5" fill="#4d5652">smoothed = base_chunk_size + smooth_factor × (x − base_chunk_size)（源码拒绝 0；默认 1.0 直接用原始预测）</text>

  <rect x="16" y="390" width="868" height="54" rx="7" fill="#ddf4ef" stroke="#087f73" stroke-width="1.3"/>
  <text x="32" y="413" font-size="14" font-weight="700" fill="#065f56">④ 下限钳制并向上对齐块粒度</text>
  <text x="868" y="413" font-size="13" fill="#065f56" font-family="var(--font-mono)" text-anchor="end">min_chunk / max(page_size, 64)</text>
  <text x="32" y="434" font-size="13.5" fill="#4d5652">先取 max(int(smoothed), min_chunk)，再向上取整到 align = max(page_size, 64) 的倍数（设计文档误写向下取整）</text>

  <rect x="16" y="452" width="868" height="54" rx="7" fill="#fff4cf" stroke="#c78300" stroke-width="1.4"/>
  <text x="32" y="475" font-size="14" font-weight="700" fill="#936300">⑤ 截断调度器原有 token 预算（只收窄、不放大）</text>
  <text x="868" y="475" font-size="13" fill="#936300" font-family="var(--font-mono)" text-anchor="end">predict_chunk_size → min(predicted, budget)</text>
  <text x="32" y="496" font-size="13.5" fill="#4d5652">num_new_tokens = min(predicted_chunk, num_new_tokens)；求根失败时按校准态与剩余时间预算回退或停止继续装入</text>

  <!-- Phase 3: Active v0.30.0 vs Removed main -->
  <rect x="16" y="524" width="424" height="112" rx="8" fill="#ece9df" stroke="#b8bcb5" stroke-width="1.3"/>
  <text x="30" y="548" font-size="14.5" font-weight="700" fill="#17211f">v0.30.0 (c09d3e20) 有效入口与硬前提</text>
  <text x="30" y="572" font-size="13.5" fill="#4d5652">• 推荐 scheduler_config.profiling_chunk_config</text>
  <text x="30" y="594" font-size="13.5" fill="#4d5652">• 必开 PP &gt; 1；互斥 balance_scheduling / DyntraLB</text>
  <text x="30" y="616" font-size="13.5" fill="#4d5652">• 支持 SRF；开 async_scheduling 须配 MRv2</text>

  <rect x="460" y="524" width="424" height="112" rx="8" fill="#fff0e9" stroke="#b54237" stroke-width="1.4"/>
  <text x="474" y="548" font-size="14.5" font-weight="700" fill="#8f3229">main (8d6180e2) 已整体移除（PR #21310）</text>
  <text x="474" y="572" font-size="13.5" fill="#4d5652">• 提交 839f53831 删除整套 CPP 功能、配置与文档</text>
  <text x="474" y="594" font-size="13.5" fill="#4d5652">• 升级 main 须删此键，否则按 extra="forbid" 拒收</text>
  <text x="474" y="616" font-size="13.5" fill="#66716d">• 仅环境可发现 vllm_omni 时告警并过滤未知顶层键</text>
</svg>
