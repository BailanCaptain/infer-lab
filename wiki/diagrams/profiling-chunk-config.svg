<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 616" width="900" height="616" role="img" aria-label="v0.30.0 profiling_chunk_config（CPP）固定切块气泡 vs 动态缩块直观对比、五步求根流水与在线校准停止双条件，以及 main PR #21310 移除" font-family="var(--font-sans)">
  <title>profiling_chunk_config（CPP）：等长块耗时膨胀 vs 动态缩块流水、五步反解与在线校准</title>
  <desc>Geometric contrast between fixed chunked prefill latency growth (T1 &lt; T2 &lt; T3 causing PP bubbles) and CPP dynamic shrinking chunks targeting constant latency T, followed by the 5-step runtime formula pipeline with concrete numeric example (8192 to 5632), online calibration dual stop condition, and PR #21310 removal on main.</desc>
  <defs>
    <marker id="pcc-arr-t" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="#087f73"/>
    </marker>
    <marker id="pcc-arr-b" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="#4c65b6"/>
    </marker>
  </defs>

  <!-- Band 1: Geometric PP Bubble vs Equal-Time Dynamic Chunks -->
  <text x="16" y="26" font-size="16" font-weight="700" fill="#17211f">① 为什么需要动态切块（CPP）：等长块越往后越慢 vs 按前缀 L 反解缩块齐平耗时</text>

  <!-- Left: Fixed chunks -> growing time -> PP bubbles -->
  <text x="16" y="54" font-size="14" font-weight="700" fill="#8f3229">✗ 普通固定块（每块 token 相等，但历史 L 越长越慢）</text>
  <text x="16" y="84" font-size="13.5" fill="#4d5652">PP0</text>
  <rect x="64" y="64" width="76" height="28" rx="4" fill="#fff4cf" stroke="#c78300" stroke-width="1.3"/>
  <text x="102" y="83" text-anchor="middle" font-size="13.5" font-weight="700" fill="#936300">块1 (T1)</text>
  <rect x="144" y="64" width="118" height="28" rx="4" fill="#fff4cf" stroke="#c78300" stroke-width="1.3"/>
  <text x="203" y="83" text-anchor="middle" font-size="13.5" font-weight="700" fill="#936300">块2 (T2 &gt; T1)</text>
  <rect x="266" y="64" width="166" height="28" rx="4" fill="#fff0e9" stroke="#b54237" stroke-width="1.4"/>
  <text x="349" y="83" text-anchor="middle" font-size="13.5" font-weight="700" fill="#8f3229">块3 (T3 ≫ T1)</text>

  <text x="16" y="120" font-size="13.5" fill="#4d5652">PP1</text>
  <rect x="64" y="100" width="76" height="28" rx="4" fill="#ece9df" stroke="#b8bcb5" stroke-width="1.2" stroke-dasharray="4 3"/>
  <text x="102" y="119" text-anchor="middle" font-size="13.5" fill="#66716d">启动</text>
  <rect x="144" y="100" width="76" height="28" rx="4" fill="#e8edff" stroke="#4c65b6" stroke-width="1.3"/>
  <text x="182" y="119" text-anchor="middle" font-size="13.5" fill="#3a4f93">块1</text>
  <rect x="224" y="100" width="38" height="28" rx="4" fill="#fff0e9" stroke="#b54237" stroke-width="1.3" stroke-dasharray="3 2"/>
  <text x="243" y="119" text-anchor="middle" font-size="13.5" font-weight="700" fill="#8f3229">等</text>
  <rect x="266" y="100" width="118" height="28" rx="4" fill="#e8edff" stroke="#4c65b6" stroke-width="1.3"/>
  <text x="325" y="119" text-anchor="middle" font-size="13.5" fill="#3a4f93">块2</text>
  <rect x="388" y="100" width="44" height="28" rx="4" fill="#fff0e9" stroke="#b54237" stroke-width="1.3" stroke-dasharray="3 2"/>
  <text x="410" y="119" text-anchor="middle" font-size="13.5" font-weight="700" fill="#8f3229">气泡</text>

  <!-- Vertical separator -->
  <line x1="450" y1="44" x2="450" y2="136" stroke="#d8d8cf" stroke-width="1.3" stroke-dasharray="5 4"/>

  <!-- Right: CPP dynamic shrinking chunks -> equal time -> smooth pipeline -->
  <text x="468" y="54" font-size="14" font-weight="700" fill="#065f56">✓ CPP 动态缩块（前缀越长块越小，每块耗时逼近 T）</text>
  <text x="468" y="84" font-size="13.5" fill="#4d5652">PP0</text>
  <rect x="516" y="64" width="104" height="28" rx="4" fill="#ddf4ef" stroke="#087f73" stroke-width="1.4"/>
  <text x="568" y="83" text-anchor="middle" font-size="13.5" font-weight="700" fill="#065f56">大块1 ≈ T</text>
  <rect x="624" y="64" width="104" height="28" rx="4" fill="#ddf4ef" stroke="#087f73" stroke-width="1.4"/>
  <text x="676" y="83" text-anchor="middle" font-size="13.5" font-weight="700" fill="#065f56">中块2 ≈ T</text>
  <rect x="732" y="64" width="104" height="28" rx="4" fill="#ddf4ef" stroke="#087f73" stroke-width="1.4"/>
  <text x="784" y="83" text-anchor="middle" font-size="13.5" font-weight="700" fill="#065f56">小块3 ≈ T</text>

  <text x="468" y="120" font-size="13.5" fill="#4d5652">PP1</text>
  <rect x="516" y="100" width="104" height="28" rx="4" fill="#ece9df" stroke="#b8bcb5" stroke-width="1.2" stroke-dasharray="4 3"/>
  <text x="568" y="119" text-anchor="middle" font-size="13.5" fill="#66716d">启动填充</text>
  <rect x="624" y="100" width="104" height="28" rx="4" fill="#e8edff" stroke="#4c65b6" stroke-width="1.4"/>
  <text x="676" y="119" text-anchor="middle" font-size="13.5" font-weight="700" fill="#3a4f93">大块1 ≈ T</text>
  <rect x="732" y="100" width="104" height="28" rx="4" fill="#e8edff" stroke="#4c65b6" stroke-width="1.4"/>
  <text x="784" y="119" text-anchor="middle" font-size="13.5" font-weight="700" fill="#3a4f93">中块2 ≈ T</text>
  <rect x="840" y="100" width="44" height="28" rx="4" fill="#e8edff" stroke="#4c65b6" stroke-width="1.2"/>
  <text x="862" y="119" text-anchor="middle" font-size="13.5" fill="#3a4f93">块3</text>

  <line x1="16" y1="150" x2="884" y2="150" stroke="#d8d8cf" stroke-width="1.3" stroke-dasharray="6 4"/>

  <!-- Band 2: Startup Profiling -> 4-step Runtime Calculation with concrete numeric trace -->
  <text x="16" y="176" font-size="16" font-weight="700" fill="#17211f">② 启动拟合曲线与每步 4 级换算流水（含公式复核示意：8192 → 5632）</text>

  <!-- Row 2A: Startup Profiling (3 boxes) -->
  <rect x="16" y="192" width="270" height="68" rx="8" fill="#e8edff" stroke="#4c65b6" stroke-width="1.3"/>
  <text x="151" y="216" text-anchor="middle" font-size="14" font-weight="700" fill="#3a4f93">启动 1 · 1 预热 + 64 采点</text>
  <text x="151" y="238" text-anchor="middle" font-size="13.5" fill="#4d5652">复用 dummy_run，至少 8 有效点</text>
  <path d="M 286 226 L 310 226" fill="none" stroke="#4c65b6" stroke-width="1.7" marker-end="url(#pcc-arr-b)"/>

  <rect x="315" y="192" width="270" height="68" rx="8" fill="#e8edff" stroke="#4c65b6" stroke-width="1.3"/>
  <text x="450" y="216" text-anchor="middle" font-size="14" font-weight="700" fill="#3a4f93">启动 2 · 拟合二次延迟曲线</text>
  <text x="450" y="238" text-anchor="middle" font-size="13.5" font-family="var(--font-mono)" fill="#17211f">f(l) = a*l^2 + b*l + c</text>
  <path d="M 585 226 L 609 226" fill="none" stroke="#4c65b6" stroke-width="1.7" marker-end="url(#pcc-arr-b)"/>

  <rect x="614" y="192" width="270" height="68" rx="8" fill="#e8edff" stroke="#4c65b6" stroke-width="1.3"/>
  <text x="749" y="216" text-anchor="middle" font-size="14" font-weight="700" fill="#3a4f93">启动 3 · 设目标耗时 T</text>
  <text x="749" y="238" text-anchor="middle" font-size="13.5" font-family="var(--font-mono)" fill="#17211f">f(base_chunk) - f(0)</text>

  <!-- Row 2B: Runtime 4-step pipeline -->
  <rect x="16" y="278" width="202" height="92" rx="8" fill="#ddf4ef" stroke="#087f73" stroke-width="1.4"/>
  <text x="117" y="302" text-anchor="middle" font-size="14" font-weight="700" fill="#065f56">① 解二次正根 x</text>
  <text x="117" y="324" text-anchor="middle" font-size="13.5" font-family="var(--font-mono)" fill="#17211f">disc&lt;0 或 x≤0 判空</text>
  <text x="117" y="348" text-anchor="middle" font-size="13.5" fill="#4d5652">例：原预测 x = 3000</text>
  <path d="M 218 324 L 238 324" fill="none" stroke="#087f73" stroke-width="1.8" marker-end="url(#pcc-arr-t)"/>

  <rect x="242" y="278" width="202" height="92" rx="8" fill="#ddf4ef" stroke="#087f73" stroke-width="1.4"/>
  <text x="343" y="302" text-anchor="middle" font-size="14" font-weight="700" fill="#065f56">② 与基准块插值</text>
  <text x="343" y="324" text-anchor="middle" font-size="13.5" font-family="var(--font-mono)" fill="#17211f">smooth_factor∈(0,1]</text>
  <text x="343" y="348" text-anchor="middle" font-size="13.5" fill="#4d5652">s=0.5 → 5596</text>
  <path d="M 444 324 L 464 324" fill="none" stroke="#087f73" stroke-width="1.8" marker-end="url(#pcc-arr-t)"/>

  <rect x="468" y="278" width="202" height="92" rx="8" fill="#ddf4ef" stroke="#087f73" stroke-width="1.4"/>
  <text x="569" y="302" text-anchor="middle" font-size="14" font-weight="700" fill="#065f56">③ 下限 + 向上对齐</text>
  <text x="569" y="324" text-anchor="middle" font-size="13.5" font-family="var(--font-mono)" fill="#17211f">ceil(max, align)</text>
  <text x="569" y="348" text-anchor="middle" font-size="13.5" fill="#4d5652">min 4096, 128→5632</text>
  <path d="M 670 324 L 690 324" fill="none" stroke="#087f73" stroke-width="1.8" marker-end="url(#pcc-arr-t)"/>

  <rect x="694" y="278" width="190" height="92" rx="8" fill="#fff4cf" stroke="#c78300" stroke-width="1.6"/>
  <text x="789" y="302" text-anchor="middle" font-size="14" font-weight="700" fill="#936300">④ 只收窄预算</text>
  <text x="789" y="324" text-anchor="middle" font-size="13.5" font-family="var(--font-mono)" fill="#17211f">min(pred, budget)</text>
  <text x="789" y="348" text-anchor="middle" font-size="13.5" fill="#936300">绝不放大原预算</text>

  <line x1="16" y1="390" x2="884" y2="390" stroke="#d8d8cf" stroke-width="1.3" stroke-dasharray="6 4"/>

  <!-- Band 3: Online Calibration Switch + v0.30.0 vs main Removal -->
  <text x="16" y="416" font-size="16" font-weight="700" fill="#17211f">③ 在线校准切换双条件与 v0.30.0 / main 存续边界</text>

  <!-- Calibration dual-condition bar -->
  <rect x="16" y="432" width="868" height="64" rx="8" fill="#f7e7f2" stroke="#9a4b86" stroke-width="1.4"/>
  <text x="32" y="456" font-size="14" font-weight="700" fill="#7a3a6a">在线校准：首次成功拟合（最早第 5 点）即置 with_history_ready 切至 NNLS 历史模型 a·C(C+H)+b·C+c</text>
  <text x="32" y="481" font-size="13.5" fill="#17211f">停止计时另须双条件：① 3 次零历史有效批  AND  ② 历史样本严格 &gt; max_fit_chunk（默认 30 即第 31 点后停）</text>

  <!-- v0.30.0 vs main split -->
  <rect x="16" y="510" width="424" height="90" rx="8" fill="#ddf4ef" stroke="#087f73" stroke-width="1.4"/>
  <text x="32" y="534" font-size="14.5" font-weight="700" fill="#065f56">v0.30.0 (c09d3e20) 生效硬前提</text>
  <text x="32" y="559" font-size="13.5" fill="#17211f">必开 PP &gt; 1（GLM 双机 PP=1 报错）+ chunked prefill</text>
  <text x="32" y="584" font-size="13.5" fill="#4d5652">互斥 balance / DyntraLB；可开 SRF；异步须 MRv2</text>

  <rect x="460" y="510" width="424" height="90" rx="8" fill="#fff0e9" stroke="#b54237" stroke-width="1.5"/>
  <text x="476" y="534" font-size="14.5" font-weight="700" fill="#8f3229">main (8d6180e2) 已整体移除（PR #21310）</text>
  <text x="476" y="559" font-size="13.5" fill="#17211f">提交 839f53831 删除整套 CPP 功能、配置与文档</text>
  <text x="476" y="584" font-size="13.5" fill="#8f3229">升级 main 须删此键，否则按 extra=forbid 拒收</text>
</svg>
