layout: scene
id: profiling-chunk-config
caption: 固定 main baa023ad 的启动模型预测路径；历史模型拟合成功后改用带前缀特征的方程。只有满足动态分支条件的 prefill 请求才使用预测，失效处理见正文。
size: [900, 700]

regions:
  - label: 启动期 · 只做一次
    note: 测量本机延迟后拟合；换硬件仍需重做测量，并比较基准块大小和实际负载。
    at: [20, 26]
    size: [860, 170]
    tone: upstream
  - label: 每个 prefill 步 · 算出这一步切多少
    note: 目标是让各块耗时接近，减少等待；实际切块仍受拟合误差、下限和调度预算限制。
    at: [20, 216]
    size: [860, 412]
    tone: ascend

boxes:
  - at: [36, 112]
    size: [266, 70]
    title: 尝试采集 64 个有效点
    sub: 另有一次预热；失败点跳过
    tone: upstream
  - at: [318, 112]
    size: [250, 70]
    title: 每个都真跑一次 forward
    sub: 量毫秒级延迟
    tone: upstream
  - at: [584, 112]
    size: [274, 70]
    title: 最小二乘拟合二次模型
    sub: f(l) = a·l² + b·l + c
    tone: upstream

arrows:
  - { from: [304, 147], to: [316, 147], tone: upstream }
  - { from: [570, 147], to: [582, 147], tone: upstream }

bands:
  - label: ① 定目标时间
    sub: 初始目标为 f(base_chunk_size) − f(0)；求根用本批剩余预算 T
    fn: target_latency
    icon: clock
    at: [52, 292]
    size: [828, 56]
    tone: ascend
  - label: ② 解二次方程取正根
    sub: a·x² + (2aL + b)·x − T = 0，L 是这条请求已经算过的前缀长度
    fn: discriminant
    icon: calc
    at: [52, 356]
    size: [828, 56]
    tone: ascend
  - label: ③ 平滑
    sub: smoothed = base_chunk_size + smooth_factor × (x − base_chunk_size)
    fn: smooth_factor
    icon: diff
    at: [52, 420]
    size: [828, 56]
    tone: ascend
  - label: ④ 下限 + 对齐
    sub: max(int(smoothed), min_chunk)，再向上取整到 max(page_size, 64) 的倍数
    fn: min_chunk
    icon: grid
    at: [52, 484]
    size: [828, 56]
    tone: ascend
  - label: ⑤ 截断
    sub: 有效预测与原 token 预算取较小值；失败按校准状态与剩余时间预算处理
    fn: predict_chunk_size
    icon: split
    at: [52, 548]
    size: [828, 56]
    tone: accent

notes:
  - at: [20, 646]
    text: 关闭动态切块后沿用普通调度约束：token 预算、剩余请求长度、缓存及其他资源限制。
    size: 12.5
    width: 860
    strong: true
  - at: [20, 670]
    text: PP > 1，按指南启用 chunked prefill，与 balance scheduling 互斥；启动测量增加真实 forward。
    size: 12.5
    width: 860

pins:
  - source: vllm-ascend@baa023ad:vllm_ascend/core/profiling_chunk_predictor.py#L281-L315
    symbols:
      - base_chunk_size
      - target_latency
      - discriminant
      - smoothed
      - smooth_factor
      - min_chunk
      - page_size
  - source: vllm-ascend@baa023ad:vllm_ascend/core/scheduler_profiling_chunk.py#L301-L360
    symbols: [predict_chunk_size, predicted_chunk, num_new_tokens]
  - source: vllm-ascend@baa023ad:vllm_ascend/ascend_config.py#L573-L598
    symbols: [max_num_batched_tokens]
  - source: >-
      vllm-ascend@baa023ad:docs/source/developer_guide/Design_Documents/dynamic_chunked_pipeline_parallel.md#L54-L63
    symbols: [base_chunk_size]
