<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 384" width="900" height="384" role="img" aria-label="Amdahl 同比例耗时拆账（100 ms 降为 80 ms 仅 1.25 倍）与四笔显存账边界图" font-family="var(--font-sans)">
  <title>为什么权重字节减半 ≠ 推理快一倍：Amdahl 同比例耗时拆账与四笔显存账</title>
  <desc>结合 calculate_metrics、tpots、ttfts、resolve_block_scales、model_dtype：上半部用同一毫秒比例尺对比 100 ms 原始耗时（读权 60 + 其余 40）与 80 ms 量化耗时（读权 30 + 转换 10 + 其余 40，仅 1.25×）；下半部串联磁盘文件、驻留显存、启动转换峰值与净增 KV 块四笔账。</desc>

  <!-- Zone 1: True-Scale Amdahl Latency Bars (1 ms = 5.6 px starting at x=162 -> 100 ms = 560 px -> x=722) -->
  <text x="16" y="28" font-size="16" font-weight="700" fill="#17211f">① 同比例耗时拆账（示意无重叠）：量化只缩短被优化段，新增转换也要计时</text>
  <line x1="14" y1="38" x2="886" y2="38" stroke="#b8bcb5" stroke-width="1.4"/>

  <!-- Bar 1: Original 100 ms = 60 ms (336 px) + 40 ms (224 px) -->
  <text x="16" y="84" font-size="14.5" font-weight="700" fill="#17211f">原始浮点前向</text>
  <text x="16" y="104" font-family="var(--font-mono)" font-size="13.5" fill="#66716d">100 ms (1.00×)</text>

  <rect x="162" y="62" width="336" height="44" rx="4" fill="#e8edff" stroke="#4c65b6" stroke-width="1.6"/>
  <text x="330" y="89" text-anchor="middle" font-size="14" font-weight="700" fill="#3a4f93">读权重：60 ms（可被量化减半）</text>

  <rect x="498" y="62" width="224" height="44" rx="4" fill="#ece9df" stroke="#8a928f" stroke-width="1.5"/>
  <text x="610" y="89" text-anchor="middle" font-size="14" font-weight="700" fill="#4d5652">其余计算/通信：40 ms</text>
  <text x="734" y="89" font-family="var(--font-mono)" font-size="14" font-weight="700" fill="#17211f">100 ms</text>

  <!-- Bar 2: Quantized 80 ms = 30 ms (168 px) + 10 ms (56 px) + 40 ms (224 px) + 20 ms saved (112 px) -->
  <text x="16" y="150" font-size="14.5" font-weight="700" fill="#065f56">权重减半量化后</text>
  <text x="16" y="170" font-family="var(--font-mono)" font-size="13.5" font-weight="700" fill="#065f56">80 ms (1.25×)</text>

  <rect x="162" y="128" width="168" height="44" rx="4" fill="#ddf4ef" stroke="#087f73" stroke-width="1.6"/>
  <text x="246" y="155" text-anchor="middle" font-size="13.5" font-weight="700" fill="#065f56">读权重 30 ms</text>

  <rect x="330" y="128" width="56" height="44" fill="#fff0e9" stroke="#b54237" stroke-width="1.6"/>
  <text x="358" y="155" text-anchor="middle" font-family="var(--font-mono)" font-size="13.5" font-weight="700" fill="#8f3229">+10</text>

  <rect x="386" y="128" width="224" height="44" rx="4" fill="#ece9df" stroke="#8a928f" stroke-width="1.5"/>
  <text x="498" y="155" text-anchor="middle" font-size="14" font-weight="700" fill="#4d5652">其余工作：仍为 40 ms</text>

  <!-- Net saved 20 ms ghost bar -->
  <rect x="610" y="128" width="112" height="44" rx="4" fill="#ddf4ef" fill-opacity="0.45" stroke="#087f73" stroke-width="1.5" stroke-dasharray="5 3"/>
  <text x="666" y="148" text-anchor="middle" font-size="13.5" font-weight="700" fill="#065f56">净省 20 ms</text>
  <text x="666" y="166" text-anchor="middle" font-family="var(--font-mono)" font-size="13.5" fill="#065f56">(-20%)</text>

  <text x="734" y="155" font-family="var(--font-mono)" font-size="14" font-weight="700" fill="#065f56">1.25× 非 2×</text>

  <!-- Callout pointing to +10 ms quant/dequant -->
  <text x="358" y="196" text-anchor="middle" font-size="13.5" font-weight="700" fill="#8f3229">▲ 新增量化 / 反量化 10 ms</text>

  <!-- Divider -->
  <line x1="14" y1="214" x2="886" y2="214" stroke="#b8bcb5" stroke-width="1.4" stroke-dasharray="6 4"/>

  <!-- Zone 2: 4-Account HBM Strip -->
  <text x="16" y="242" font-size="16" font-weight="700" fill="#17211f">② 文件小了为何显存没按比例降：必须分记四笔显存账</text>

  <rect x="16" y="258" width="204" height="110" rx="8" fill="#ece9df" stroke="#8a928f" stroke-width="1.3"/>
  <text x="28" y="284" font-size="14" font-weight="700" fill="#17211f">1. 磁盘文件大小</text>
  <text x="28" y="309" font-size="13.5" fill="#4d5652">只反映 checkpoint 体积</text>
  <text x="28" y="332" font-size="13.5" fill="#4d5652">若加载反量化，HBM</text>
  <text x="28" y="354" font-size="13.5" font-weight="700" fill="#8f3229">按展开后宽类型算</text>

  <rect x="236" y="258" width="208" height="110" rx="8" fill="#e8edff" stroke="#4c65b6" stroke-width="1.4"/>
  <text x="248" y="284" font-size="14" font-weight="700" fill="#3a4f93">2. 加载后权重驻留</text>
  <text x="248" y="309" font-size="13.5" fill="#4d5652">含 scale / 零点 / 派生项</text>
  <text x="248" y="332" font-size="13.5" fill="#4d5652">含保留高精度的敏感层</text>
  <text x="248" y="354" font-size="13.5" fill="#3a4f93">含未对齐 NZ 分形补齐</text>

  <rect x="460" y="258" width="204" height="110" rx="8" fill="#fff0e9" stroke="#b54237" stroke-width="1.4"/>
  <text x="472" y="284" font-size="14" font-weight="700" fill="#8f3229">3. 启动与运行峰值</text>
  <text x="472" y="309" font-size="13.5" fill="#4d5652">转换期新旧副本并存</text>
  <text x="472" y="332" font-size="13.5" fill="#4d5652">叠加激活与图工作区</text>
  <text x="472" y="354" font-size="13.5" fill="#8f3229">叠加 HCCL 通信缓冲</text>

  <rect x="680" y="258" width="204" height="110" rx="8" fill="#ddf4ef" stroke="#087f73" stroke-width="1.4"/>
  <text x="692" y="284" font-size="14" font-weight="700" fill="#065f56">4. 可用 KV 缓存池</text>
  <text x="692" y="309" font-size="13.5" fill="#4d5652">总占用可能因池化未降</text>
  <text x="692" y="332" font-size="13.5" fill="#065f56">须报可用块数净增量</text>
  <text x="692" y="354" font-size="13.5" fill="#4d5652">区分预留池与实占块</text>
</svg>
