<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 496" width="900" height="496" role="img" aria-label="量化验收三道顺序闸门（质量漏斗、显存四柱账、Goodput SLO 达标框）与失败回溯图" font-family="var(--font-sans)">
  <title>量化上线三道顺序闸门与失败回溯排障路径</title>
  <desc>关联 calculate_metrics、goodput_config_dict、good_completed、tpots、ttfts、resolve_block_scales、model_dtype、maybe_trans_nz：顶层三闸依次把关产物与质量、显存四笔账与 Goodput 达标吞吐，下方画出未过闸时的单变量排查回溯线。</desc>
  <defs>
    <marker id="qe-arr-t" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto">
      <path d="M 0 1.5 L 8.5 5 L 0 8.5 z" fill="#087f73"/>
    </marker>
    <marker id="qe-arr-r" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto">
      <path d="M 0 1.5 L 8.5 5 L 0 8.5 z" fill="#b54237"/>
    </marker>
    <marker id="qe-arr-p" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto">
      <path d="M 0 1.5 L 8.5 5 L 0 8.5 z" fill="#9a4b86"/>
    </marker>
  </defs>

  <text x="16" y="28" font-size="16" font-weight="700" fill="#17211f">① 三道顺序验收闸门（前闸未过，严禁用后闸的省显存或高吞吐掩盖结论）</text>
  <line x1="14" y1="38" x2="886" y2="38" stroke="#b8bcb5" stroke-width="1.4"/>

  <!-- GATE 1: Accuracy Funnel (x=14..284, y=50..326) -->
  <rect x="14" y="50" width="270" height="276" rx="9" fill="#ddf4ef" fill-opacity="0.45" stroke="#087f73" stroke-width="1.6"/>
  <text x="28" y="76" font-size="15" font-weight="700" fill="#065f56">闸门 1：产物与任务质量</text>

  <!-- 3-step funnel trapezoid/stacked narrowing bars -->
  <rect x="28" y="92" width="242" height="44" rx="6" fill="#ffffff" stroke="#087f73" stroke-width="1.3"/>
  <text x="149" y="111" text-anchor="middle" font-size="13.5" font-weight="700" fill="#17211f">① 产物抽查（非正常舍入）</text>
  <text x="149" y="129" text-anchor="middle" font-size="13.5" fill="#4d5652">scale 轴向 / 零点 / NZ 排布</text>

  <rect x="42" y="146" width="214" height="44" rx="6" fill="#ffffff" stroke="#087f73" stroke-width="1.3"/>
  <text x="149" y="165" text-anchor="middle" font-size="13.5" font-weight="700" fill="#17211f">② 中间张量诊断</text>
  <text x="149" y="183" text-anchor="middle" font-size="13.5" fill="#4d5652">MSE / Rel-L2 / SQNR / 饱和率</text>

  <rect x="56" y="200" width="186" height="54" rx="6" fill="#ddf4ef" stroke="#087f73" stroke-width="1.6"/>
  <text x="149" y="222" text-anchor="middle" font-size="13.5" font-weight="700" fill="#065f56">③ 独立集任务验收</text>
  <text x="149" y="243" text-anchor="middle" font-size="13.5" fill="#065f56">与校准集隔离 · 分语言长文</text>

  <text x="149" y="280" text-anchor="middle" font-size="13.5" fill="#4d5652">PPL 不可替代数学/代码正确率</text>
  <text x="149" y="308" text-anchor="middle" font-size="13.5" font-weight="700" fill="#065f56">工具：AISBench / EvalScope</text>

  <!-- Pass arrow 1->2 -->
  <line x1="286" y1="184" x2="310" y2="184" stroke="#087f73" stroke-width="2" marker-end="url(#qe-arr-t)"/>
  <text x="298" y="174" text-anchor="middle" font-size="13.5" font-weight="700" fill="#065f56">过</text>

  <!-- GATE 2: 4-Account HBM Mini Bar Chart (x=314..584, y=50..326) -->
  <rect x="314" y="50" width="270" height="276" rx="9" fill="#e8edff" fill-opacity="0.45" stroke="#4c65b6" stroke-width="1.6"/>
  <text x="328" y="76" font-size="15" font-weight="700" fill="#3a4f93">闸门 2：显存四笔独立账</text>

  <!-- Mini 4-bar visual chart (baseline y=224) -->
  <line x1="332" y1="224" x2="566" y2="224" stroke="#4c65b6" stroke-width="1.3"/>
  <rect x="342" y="158" width="42" height="66" rx="3" fill="#ffffff" stroke="#4c65b6" stroke-width="1.4"/>
  <rect x="398" y="138" width="42" height="86" rx="3" fill="#e8edff" stroke="#4c65b6" stroke-width="1.5"/>
  <rect x="454" y="102" width="42" height="122" rx="3" fill="#fff0e9" stroke="#b54237" stroke-width="1.6"/>
  <rect x="510" y="132" width="42" height="92" rx="3" fill="#ddf4ef" stroke="#087f73" stroke-width="1.5"/>

  <g font-size="13.5" font-weight="700" text-anchor="middle">
    <text x="363" y="244" fill="#4d5652">磁盘</text>
    <text x="419" y="244" fill="#3a4f93">驻留</text>
    <text x="475" y="244" fill="#8f3229">峰值</text>
    <text x="531" y="244" fill="#065f56">KV池</text>
  </g>
  <text x="475" y="96" text-anchor="middle" font-size="13.5" font-weight="700" fill="#8f3229">双副本</text>

  <text x="328" y="274" font-size="13.5" fill="#4d5652">驻留须计 scale/NZ/未量化层；</text>
  <text x="328" y="295" font-size="13.5" fill="#4d5652">容量收益看可用 KV 块净增</text>
  <text x="328" y="316" font-size="13.5" font-weight="700" fill="#8f3229">防坑：A2 FP8 v0.30 展开 BF16</text>

  <!-- Pass arrow 2->3 -->
  <line x1="586" y1="184" x2="610" y2="184" stroke="#087f73" stroke-width="2" marker-end="url(#qe-arr-t)"/>
  <text x="598" y="174" text-anchor="middle" font-size="13.5" font-weight="700" fill="#065f56">过</text>

  <!-- GATE 3: Goodput SLO Quadrant (x=614..886, y=50..326) -->
  <rect x="614" y="50" width="272" height="276" rx="9" fill="#fff4cf" fill-opacity="0.45" stroke="#c78300" stroke-width="1.6"/>
  <text x="628" y="76" font-size="15" font-weight="700" fill="#936300">闸门 3：真实加速与 Goodput</text>

  <!-- Mini SLO 2D quadrant (x=640..864, y=94..226) -->
  <rect x="640" y="94" width="224" height="130" rx="5" fill="#ffffff" stroke="#c78300" stroke-width="1.2"/>
  <!-- Shaded Goodput pass corner (bottom-left: TTFT<=SLO & TPOT<=SLO) -->
  <rect x="640" y="148" width="132" height="76" fill="#ddf4ef" fill-opacity="0.75"/>
  <line x1="772" y1="94" x2="772" y2="224" stroke="#b54237" stroke-width="1.6" stroke-dasharray="4 3"/>
  <line x1="640" y1="148" x2="864" y2="148" stroke="#b54237" stroke-width="1.6" stroke-dasharray="4 3"/>

  <!-- Sample points -->
  <circle cx="688" cy="188" r="5" fill="#087f73"/><circle cx="726" cy="176" r="5" fill="#087f73"/>
  <circle cx="818" cy="122" r="5" fill="#b54237"/><circle cx="836" cy="182" r="5" fill="#b54237"/>
  <text x="706" y="212" text-anchor="middle" font-size="13.5" font-weight="700" fill="#065f56">✓ Goodput 达标</text>
  <text x="818" y="114" text-anchor="middle" font-size="13.5" font-weight="700" fill="#8f3229">✗ 超时</text>
  <text x="752" y="244" text-anchor="middle" font-size="13.5" fill="#4d5652">全满足 TTFT / TPOT / E2E 阈值才计</text>

  <text x="628" y="274" font-size="13.5" font-weight="700" fill="#936300">Amdahl：100→80 ms (1.25× 非 2×)</text>
  <text x="628" y="295" font-size="13.5" fill="#4d5652">稳态去预热，必报 P95/P99 尾延迟</text>
  <text x="628" y="316" font-size="13.5" fill="#8f3229">单 token 请求 TPOT=0 仅统计约定</text>

  <!-- Failure drop arrows into Zone 2 -->
  <line x1="149" y1="326" x2="149" y2="372" stroke="#b54237" stroke-width="2" marker-end="url(#qe-arr-r)"/>
  <text x="160" y="354" font-size="13.5" font-weight="700" fill="#8f3229">闸门 1 未过</text>

  <path d="M 449 326 L 449 348 L 672 348 L 672 372" fill="none" stroke="#9a4b86" stroke-width="2" marker-end="url(#qe-arr-p)"/>
  <line x1="750" y1="326" x2="750" y2="372" stroke="#9a4b86" stroke-width="2" marker-end="url(#qe-arr-p)"/>
  <text x="560" y="343" text-anchor="middle" font-size="13.5" font-weight="700" fill="#7a3a6a">闸门 2 / 3 未过</text>

  <!-- Zone 2: Failure Routing Cards -->
  <rect x="14" y="376" width="424" height="106" rx="8" fill="#fff0e9" stroke="#b54237" stroke-width="1.4"/>
  <text x="28" y="402" font-size="14.5" font-weight="700" fill="#8f3229">质量不达标 → 查产物 / 敏感层 / 校准覆盖</text>
  <text x="28" y="428" font-size="13.5" fill="#4d5652">1. 锁输入与采样，沿首次分歧层排查 scale/NZ 错读</text>
  <text x="28" y="452" font-size="13.5" fill="#4d5652">2. 敏感层回退原高精度权重（升回 BF16 无法复原小数）</text>
  <text x="28" y="474" font-size="13.5" fill="#8f3229">3. 核对长上下文与未覆盖专家的校准样本</text>

  <rect x="462" y="376" width="424" height="106" rx="8" fill="#f7e7f2" stroke="#9a4b86" stroke-width="1.4"/>
  <text x="476" y="402" font-size="14.5" font-weight="700" fill="#7a3a6a">显存或速度不达标 → 查实际算子与时间线</text>
  <text x="476" y="428" font-size="13.5" fill="#4d5652">1. 核对日志确认命中低精度融合核，未回退反量化 GEMM</text>
  <text x="476" y="452" font-size="13.5" fill="#4d5652">2. 拆分加载转换与稳态前向，定位计算 / 通信 / 排队瓶颈</text>
  <text x="476" y="474" font-size="13.5" fill="#7a3a6a">3. 每次只改单一变量，同负载复测对比</text>
</svg>
