<g font-weight="700">
<text x="16" y="26" font-size="16" fill="#17211f">量化验收四维同条件对照：能生成一句话不等于验收过关</text>
<text x="102" y="162" text-anchor="middle" font-size="14" fill="#065f56">相同输入条件</text>
<text x="326" y="108" text-anchor="middle" font-size="14" fill="#17211f">高精度基线（BF16）</text>
<text x="326" y="260" text-anchor="middle" font-size="14" fill="#936300">待验收量化候选</text>
<text x="512" y="89" font-size="13.5" fill="#3a4f93">① 产物与尺度核查：先排除格式错读</text>
<text x="512" y="169" font-size="13.5" fill="#936300">② 中间张量误差：MSE · Rel-L2 · 饱和率</text>
<text x="512" y="249" font-size="13.5" fill="#7a3a6a">③ 下游任务质量：PPL 与业务专项集</text>
<text x="512" y="329" font-size="13.5" fill="#065f56">④ 系统真实收益：显存四笔账 &amp; Goodput</text>
</g>
<g font-size="12.5" fill="#17211f">
<text x="102" y="188" text-anchor="middle">统一提示词模板</text>
<text x="102" y="210" text-anchor="middle">同一分词器与窗口</text>
<text x="102" y="232" text-anchor="middle">固定采样与停止条件</text>
<text x="326" y="132" text-anchor="middle">逐层参考输出 x</text>
<text x="326" y="284" text-anchor="middle">低位载荷 + scale / 零点</text>
<text x="512" y="113">核对 dtype、分组方向、转置轴与 ND/NZ 排布</text>
<text x="512" y="193">如 x=(1,2,4) 对 x̂=(1.1,1.8,4) → Rel-L2 ≈ 4.88%</text>
<text x="512" y="273">测数学、代码与长上下文；看结果前预先定阈值</text>
<text x="512" y="353">分算文件/驻留/KV 块数；测 TTFT、TPOT 与达标吞吐</text>
</g>
<g font-size="12" fill="#4d5652">
<text x="16" y="47">只改变待评估的量化方案，保持其余条件恒定；四项指标回答不同问题，缺一不可</text>
<text x="102" y="256" text-anchor="middle" fill="#065f56">与校准样本分开</text>
<text x="326" y="154" text-anchor="middle">基准质量与延迟</text>
