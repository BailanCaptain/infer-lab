<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 396" width="880" height="396" role="img" aria-label="量化验收四维同条件对照：高精度基线与量化候选的四道核验标尺" font-family="var(--font-sans)">
<title>量化验收四维同条件对照：产物、数值、任务质量与系统收益</title>
<desc>相同输入与分词条件下，高精度基线与量化候选并行输出，依次核验产物尺度配对、张量误差、下游任务质量与显存/Goodput</desc>
