<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 488" width="900" height="488" role="img" aria-label="v0.30.0 W8A8_DYNAMIC 稠密 Linear Qwen3-8B 与稀疏 MoE Qwen3-30B-A3B EP8 双轨执行流水线图">
  <title>v0.30.0 W8A8_DYNAMIC 双轨执行流水线对比：上轨稠密 Linear（Qwen3-8B）离线权重转置+NZ+weight_scale_fp32，前向经 npu_dynamic_quant 或 PreparedLinearInput 送入 npu_quant_matmul；下轨稀疏 MoE（Qwen3-30B-A3B EP8）本地 16 专家转 NZ，复用 dispatch INT8 激活后按 fusion 分流融合或非融合分组矩阵乘。</title>
  <desc>关联源码符号：prepare_input_for_overlap, PreparedLinearInput, npu_quant_matmul, maybe_trans_nz, weight_scale_fp32, ACL_FORMAT_FRACTAL_NZ, w13_weight_scale_fp32, enable_fused_mc2, fused_w1_scale, scale_from_float_to_int64, apply_gmm1_act_quant, grouped_matmul_swiglu_quant_weight_nz, npu_grouped_matmul, npu_dequant_swiglu_quant</desc>
  <defs>
    <marker id="pipe-arr-blue" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto">
      <path d="M 0 0.5 L 9.5 5 L 0 9.5 z" fill="#1D4ED8"/>
    </marker>
    <marker id="pipe-arr-teal" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto">
      <path d="M 0 0.5 L 9.5 5 L 0 9.5 z" fill="#087f73"/>
    </marker>
    <marker id="pipe-arr-amber" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto">
      <path d="M 0 0.5 L 9.5 5 L 0 9.5 z" fill="#B45309"/>
    </marker>
  </defs>

  <!-- 上下双轨开放虚线分界（零整图底框、零外层轨道套娃框） -->
  <line x1="16" y1="220" x2="884" y2="220" stroke="#CBD5E1" stroke-width="1.5" stroke-dasharray="6 5"/>

  <!-- 上轨：稠密 Linear (Qwen3-8B) -->
  <g id="lane-dense-linear">
    <circle cx="28" cy="28" r="12" fill="#1D4ED8"/>
    <text x="28" y="32.5" text-anchor="middle" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="12.5" font-weight="700" fill="#FFFFFF">1</text>
    <text x="48" y="34" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="16" font-weight="700" fill="#17211f">稠密 Linear 轨道（Qwen3-8B · AscendW8A8DynamicLinearMethod）</text>

    <!-- 1A 权重侧 -->
    <rect x="16" y="52" width="270" height="148" rx="8" fill="var(--color-weight-soft, #fff4cf)" stroke="var(--color-weight, #c78300)" stroke-width="1.5"/>
    <text x="30" y="78" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="15" font-weight="700" fill="#92400E">离线权重后处理</text>
    <text x="30" y="104" font-family="'JetBrains Mono',ui-monospace,monospace" font-size="13.5" fill="#17211f">weight 转置 [in, out]</text>
    <text x="30" y="128" font-family="'JetBrains Mono',ui-monospace,monospace" font-size="13.5" fill="#334155">maybe_trans_nz 转 NZ</text>
    <text x="30" y="152" font-family="'JetBrains Mono',ui-monospace,monospace" font-size="13.5" fill="#334155">建 weight_scale_fp32</text>
    <text x="30" y="178" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="13.5" fill="#78350F">动态乘忽略逐通道零点</text>

    <!-- 1B 激活侧 -->
    <rect x="308" y="52" width="270" height="148" rx="8" fill="var(--color-surface-sunken, #ece9df)" stroke="#17211f" stroke-width="1.5"/>
    <text x="322" y="78" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="15" font-weight="700" fill="#17211f">激活现算与预量化复用</text>
    <text x="322" y="104" font-family="'JetBrains Mono',ui-monospace,monospace" font-size="13.5" font-weight="700" fill="#1D4ED8">常规：npu_dynamic_quant</text>
    <text x="322" y="127" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="13.5" fill="#334155">逐 token 产 INT8 + 缩放</text>
    <line x1="322" y1="139" x2="564" y2="139" stroke="#b8bcb5" stroke-width="1.2" stroke-dasharray="4 3"/>
    <text x="322" y="161" font-family="'JetBrains Mono',ui-monospace,monospace" font-size="13.5" font-weight="700" fill="#087f73">重叠：PreparedLinearInput</text>
    <text x="322" y="184" font-family="'JetBrains Mono',ui-monospace,monospace" font-size="13.5" fill="#5b6763">prepare_input_for_overlap</text>

    <!-- 1C 乘加与还原 -->
    <rect x="600" y="52" width="284" height="148" rx="8" fill="var(--color-token-soft, #ddf4ef)" stroke="var(--color-token, #087f73)" stroke-width="1.5"/>
    <text x="614" y="78" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="15" font-weight="700" fill="#065f56">整数乘加与反量化还原</text>
    <text x="614" y="105" font-family="'JetBrains Mono',ui-monospace,monospace" font-size="14" font-weight="700" fill="#17211f">npu_quant_matmul(</text>
    <text x="626" y="129" font-family="'JetBrains Mono',ui-monospace,monospace" font-size="13.5" fill="#334155">x_q, weight,</text>
    <text x="626" y="152" font-family="'JetBrains Mono',ui-monospace,monospace" font-size="13.5" fill="#334155">weight_scale_fp32)</text>
    <text x="614" y="180" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="14" font-weight="700" fill="#065f56">→ 直接恢复 BF16 输出</text>

    <line x1="286" y1="126" x2="304" y2="126" stroke="#B45309" stroke-width="1.6" marker-end="url(#pipe-arr-amber)"/>
    <line x1="578" y1="126" x2="596" y2="126" stroke="#1D4ED8" stroke-width="1.6" marker-end="url(#pipe-arr-blue)"/>
  </g>

  <!-- 下轨：稀疏 MoE (Qwen3-30B-A3B EP8) -->
  <g id="lane-sparse-moe">
    <circle cx="28" cy="252" r="12" fill="#087f73"/>
    <text x="28" y="256.5" text-anchor="middle" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="12.5" font-weight="700" fill="#FFFFFF">2</text>
    <text x="48" y="258" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="16" font-weight="700" fill="#17211f">稀疏 MoE 轨道（Qwen3-30B-A3B EP8 本地 16 专家）</text>

    <!-- 2A 本地专家权重后处理 -->
    <rect x="16" y="274" width="272" height="196" rx="8" fill="var(--color-weight-soft, #fff4cf)" stroke="var(--color-weight, #c78300)" stroke-width="1.5"/>
    <text x="28" y="300" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="15" font-weight="700" fill="#92400E">本地 16 专家权重后处理</text>
    <text x="28" y="326" font-family="'JetBrains Mono',ui-monospace,monospace" font-size="13.5" fill="#17211f">ACL_FORMAT_FRACTAL_NZ</text>
    <text x="28" y="350" font-family="'JetBrains Mono',ui-monospace,monospace" font-size="13.5" fill="#334155">建 w13_weight_scale_fp32</text>
    <line x1="28" y1="366" x2="274" y2="366" stroke="#c78300" stroke-opacity="0.45" stroke-width="1.2" stroke-dasharray="4 3"/>
    <text x="28" y="390" font-family="'JetBrains Mono',ui-monospace,monospace" font-size="13.5" font-weight="700" fill="#92400E">enable_fused_mc2 == 1</text>
    <text x="28" y="414" font-family="'JetBrains Mono',ui-monospace,monospace" font-size="13.5" fill="#334155">scale_from_float_to_int64</text>
    <text x="28" y="438" font-family="'JetBrains Mono',ui-monospace,monospace" font-size="13.5" fill="#334155">转 fused_w1_scale (INT64)</text>

    <!-- 2B 复用 Dispatch INT8 激活 -->
    <rect x="308" y="274" width="204" height="196" rx="8" fill="var(--color-comm-soft, #f7e7f2)" stroke="var(--color-comm, #9a4b86)" stroke-width="1.5"/>
    <text x="320" y="300" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="15" font-weight="700" fill="#7a3a6a">专家入口激活复用</text>
    <text x="320" y="328" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="14" font-weight="700" fill="#17211f">MC2 (quant_mode=2)</text>
    <text x="320" y="355" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="13.5" fill="#334155">通信就地直接带回：</text>
    <text x="320" y="381" font-family="'JetBrains Mono',ui-monospace,monospace" font-size="13.5" fill="#17211f">• INT8 激活张量</text>
    <text x="320" y="406" font-family="'JetBrains Mono',ui-monospace,monospace" font-size="13.5" fill="#17211f">• dynamic_scale</text>
    <text x="320" y="438" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="13.5" font-weight="700" fill="#065f56">✓ 省入口重复量化</text>

    <!-- 2C 双分支：融合 vs 非融合 -->
    <rect x="534" y="274" width="350" height="92" rx="8" fill="var(--color-token-soft, #ddf4ef)" stroke="var(--color-token, #087f73)" stroke-width="1.5"/>
    <text x="546" y="299" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="14.5" font-weight="700" fill="#065f56">融合分支（apply_gmm1_act_quant）</text>
    <text x="546" y="325" font-family="'JetBrains Mono',ui-monospace,monospace" font-size="13.5" font-weight="700" fill="#17211f">grouped_matmul_swiglu_quant_weight_nz</text>
    <text x="546" y="350" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="13.5" fill="#334155">合并 GMM1 + SwiGLU + 再量化 → GMM2</text>

    <rect x="534" y="378" width="350" height="92" rx="8" fill="var(--color-kv-soft, #e8edff)" stroke="#1D4ED8" stroke-width="1.5"/>
    <text x="546" y="403" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="14.5" font-weight="700" fill="#1e3a8a">非融合分支（MC2 Decode / Prefill）</text>
    <text x="546" y="429" font-family="'JetBrains Mono',ui-monospace,monospace" font-size="13.5" fill="#17211f">npu_grouped_matmul →</text>
    <text x="546" y="454" font-family="'JetBrains Mono',ui-monospace,monospace" font-size="13.5" fill="#334155">npu_dequant_swiglu_quant → GMM2</text>

    <line x1="288" y1="372" x2="304" y2="372" stroke="#B45309" stroke-width="1.6" marker-end="url(#pipe-arr-amber)"/>
    <path d="M 512 350 L 522 350 L 522 320 L 530 320" fill="none" stroke="#087f73" stroke-width="1.6" marker-end="url(#pipe-arr-teal)"/>
    <path d="M 512 394 L 522 394 L 522 424 L 530 424" fill="none" stroke="#1D4ED8" stroke-width="1.6" marker-end="url(#pipe-arr-blue)"/>
  </g>
</svg>
