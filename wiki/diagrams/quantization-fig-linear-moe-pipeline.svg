<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 380" width="900" height="380" role="img" aria-label="v0.30.0 W8A8_DYNAMIC 稠密 Linear Qwen3-8B 与稀疏 MoE Qwen3-30B-A3B EP8 双轨执行流水线图">
  <title>v0.30.0 W8A8_DYNAMIC 双轨执行流水线对比：上轨稠密 Linear（Qwen3-8B）离线权重转置+NZ+weight_scale_fp32，前向经 npu_dynamic_quant 或 PreparedLinearInput 送入 npu_quant_matmul；下轨稀疏 MoE（Qwen3-30B-A3B EP8）本地 16 专家转 NZ，复用 dispatch INT8 激活后按 fusion 分流融合或非融合分组矩阵乘。</title>
  <desc>关联源码符号：prepare_input_for_overlap, PreparedLinearInput, npu_quant_matmul, maybe_trans_nz, weight_scale_fp32, ACL_FORMAT_FRACTAL_NZ, w13_weight_scale_fp32, enable_fused_mc2, fused_w1_scale, scale_from_float_to_int64, apply_gmm1_act_quant, grouped_matmul_swiglu_quant_weight_nz, npu_grouped_matmul, npu_dequant_swiglu_quant</desc>
  <defs>
    <marker id="pipe-arr-blue" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto">
      <path d="M 0 0.5 L 9.5 5 L 0 9.5 z" fill="#1D4ED8"/>
    </marker>
    <marker id="pipe-arr-teal" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto">
      <path d="M 0 0.5 L 9.5 5 L 0 9.5 z" fill="#087f73"/>
    </marker>
    <marker id="pipe-arr-amber" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto">
      <path d="M 0 0.5 L 9.5 5 L 0 9.5 z" fill="#B45309"/>
    </marker>
  </defs>

  <!-- 上下双轨开放虚线分界（对齐 quantization-flow.svg，零整图底框、零外层轨道套娃框） -->
  <line x1="16" y1="180" x2="884" y2="180" stroke="#CBD5E1" stroke-width="1.5" stroke-dasharray="6 5"/>

  <!-- 上轨：稠密 Linear (Qwen3-8B) -->
  <g id="lane-dense-linear">
    <circle cx="27" cy="24" r="11" fill="#1D4ED8"/>
    <text x="27" y="28.5" text-anchor="middle" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="12" font-weight="700" fill="#FFFFFF">1</text>
    <text x="45" y="29" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="14" font-weight="700" fill="#17211f">稠密 Linear 轨道（Qwen3-8B · AscendW8A8DynamicLinearMethod）</text>

    <!-- 1A 权重侧 -->
    <rect x="16" y="46" width="268" height="118" rx="8" fill="var(--color-weight-soft, #fff4cf)" stroke="var(--color-weight, #c78300)" stroke-width="1.5"/>
    <text x="30" y="68" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="13" font-weight="700" fill="#92400E">权重侧（离线 INT8 后处理）</text>
    <text x="30" y="90" font-family="'JetBrains Mono',ui-monospace,monospace" font-size="11.5" fill="#17211f">weight [out,in] → transpose(0,1)</text>
    <text x="30" y="110" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="12" fill="#334155">• 连续化 + maybe_trans_nz 转 NZ</text>
    <text x="30" y="130" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="12" fill="#334155">• 压平并建 weight_scale_fp32</text>
    <text x="30" y="150" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="11.5" fill="#78350F">（动态矩阵乘忽略逐通道 weight_offset）</text>

    <!-- 1B 激活侧 -->
    <rect x="308" y="46" width="268" height="118" rx="8" fill="var(--color-surface-sunken, #ece9df)" stroke="#17211f" stroke-width="1.5"/>
    <text x="322" y="68" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="13" font-weight="700" fill="#17211f">激活侧（现算或预量化复用）</text>
    <text x="322" y="89" font-family="'JetBrains Mono',ui-monospace,monospace" font-size="12" font-weight="700" fill="#1D4ED8">常规：npu_dynamic_quant(x)</text>
    <text x="322" y="108" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="11.5" fill="#334155">按 token 现算 INT8 + pertoken_scale</text>
    <line x1="322" y1="118" x2="562" y2="118" stroke="#b8bcb5" stroke-width="1.2" stroke-dasharray="4 3"/>
    <text x="322" y="136" font-family="'JetBrains Mono',ui-monospace,monospace" font-size="11.5" font-weight="700" fill="#087f73">重叠：复用 PreparedLinearInput</text>
    <text x="322" y="153" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="11.5" fill="#5b6763">prepare_input_for_overlap 提前打包</text>

    <!-- 1C 乘加与还原 -->
    <rect x="600" y="46" width="284" height="118" rx="8" fill="var(--color-token-soft, #ddf4ef)" stroke="var(--color-token, #087f73)" stroke-width="1.5"/>
    <text x="614" y="68" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="13" font-weight="700" fill="#065f56">核函数乘加与反量化还原</text>
    <text x="614" y="90" font-family="'JetBrains Mono',ui-monospace,monospace" font-size="12" font-weight="700" fill="#17211f">npu_quant_matmul(</text>
    <text x="626" y="109" font-family="'JetBrains Mono',ui-monospace,monospace" font-size="11.5" fill="#334155">x_q, weight, weight_scale_fp32,</text>
    <text x="626" y="128" font-family="'JetBrains Mono',ui-monospace,monospace" font-size="11.5" fill="#334155">pertoken_scale)</text>
    <text x="614" y="150" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="12.5" font-weight="700" fill="#065f56">→ 直接恢复 output_dtype (BF16)</text>

    <line x1="284" y1="105" x2="304" y2="105" stroke="#B45309" stroke-width="1.6" marker-end="url(#pipe-arr-amber)"/>
    <line x1="576" y1="105" x2="596" y2="105" stroke="#1D4ED8" stroke-width="1.6" marker-end="url(#pipe-arr-blue)"/>
  </g>

  <!-- 下轨：稀疏 MoE (Qwen3-30B-A3B EP8) -->
  <g id="lane-sparse-moe">
    <circle cx="27" cy="206" r="11" fill="#087f73"/>
    <text x="27" y="210.5" text-anchor="middle" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="12" font-weight="700" fill="#FFFFFF">2</text>
    <text x="45" y="211" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="14" font-weight="700" fill="#17211f">稀疏 MoE 轨道（Qwen3-30B-A3B EP8 本地 16 专家 · AscendW8A8DynamicFusedMoEMethod）</text>

    <!-- 2A 本地专家权重后处理（无内嵌套娃框，改用细虚线分隔特例） -->
    <rect x="16" y="226" width="268" height="142" rx="8" fill="var(--color-weight-soft, #fff4cf)" stroke="var(--color-weight, #c78300)" stroke-width="1.5"/>
    <text x="30" y="247" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="13" font-weight="700" fill="#92400E">本地 16 专家 w13 / w2 后处理</text>
    <text x="30" y="268" font-family="'JetBrains Mono',ui-monospace,monospace" font-size="11.5" fill="#17211f">转置 + ACL_FORMAT_FRACTAL_NZ</text>
    <text x="30" y="288" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="12" fill="#334155">• 建 w13_weight_scale_fp32</text>
    <text x="30" y="307" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="11.5" fill="#5b6763">  （w2 普通分支不额外建 FP32 副本）</text>
    <line x1="30" y1="319" x2="270" y2="319" stroke="#c78300" stroke-opacity="0.45" stroke-width="1.2" stroke-dasharray="4 3"/>
    <text x="30" y="338" font-family="'JetBrains Mono',ui-monospace,monospace" font-size="11.5" font-weight="700" fill="#92400E">enable_fused_mc2 == 1 特例：</text>
    <text x="30" y="356" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="11.5" fill="#334155">转 INT64 fused_w1_scale / w2_scale</text>

    <!-- 2B 复用 Dispatch INT8 激活 -->
    <rect x="308" y="226" width="200" height="142" rx="8" fill="var(--color-comm-soft, #f7e7f2)" stroke="var(--color-comm, #9a4b86)" stroke-width="1.5"/>
    <text x="322" y="247" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="13" font-weight="700" fill="#7a3a6a">专家入口激活复用</text>
    <text x="322" y="270" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="12" font-weight="700" fill="#17211f">MC2 (quant_mode = 2)</text>
    <text x="322" y="290" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="11.5" fill="#334155">直接带回：</text>
    <text x="322" y="311" font-family="'JetBrains Mono',ui-monospace,monospace" font-size="11.5" fill="#17211f">• INT8 hidden_states</text>
    <text x="322" y="331" font-family="'JetBrains Mono',ui-monospace,monospace" font-size="11.5" fill="#17211f">• FP32 dynamic_scale</text>
    <text x="322" y="354" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="12" font-weight="700" fill="#065f56">✓ 省去入口重复动态量化</text>

    <!-- 2C 双分支：融合 vs 非融合 -->
    <rect x="534" y="226" width="350" height="67" rx="8" fill="var(--color-token-soft, #ddf4ef)" stroke="var(--color-token, #087f73)" stroke-width="1.5"/>
    <text x="548" y="246" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="12.5" font-weight="700" fill="#065f56">融合分支（fusion 开启 · apply_gmm1_act_quant）</text>
    <text x="548" y="266" font-family="'JetBrains Mono',ui-monospace,monospace" font-size="11.5" font-weight="700" fill="#17211f">grouped_matmul_swiglu_quant_weight_nz</text>
    <text x="548" y="284" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="11.5" fill="#334155">合并 GMM1 + SwiGLU + 再量化 → GMM2 → BF16</text>

    <rect x="534" y="301" width="350" height="67" rx="8" fill="var(--color-kv-soft, #e8edff)" stroke="#1D4ED8" stroke-width="1.5"/>
    <text x="548" y="321" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="12.5" font-weight="700" fill="#1e3a8a">非融合分支（MC2 Decode / Prefill 分步执行）</text>
    <text x="548" y="341" font-family="'JetBrains Mono',ui-monospace,monospace" font-size="11.5" fill="#17211f">npu_grouped_matmul → npu_dequant_swiglu_quant</text>
    <text x="548" y="359" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="11.5" fill="#334155">Prefill 走 swiglu_quant 或 SwiGLU + 动态量化</text>

    <line x1="284" y1="297" x2="304" y2="297" stroke="#B45309" stroke-width="1.6" marker-end="url(#pipe-arr-amber)"/>
    <path d="M 508 278 L 520 278 L 520 259 L 530 259" fill="none" stroke="#087f73" stroke-width="1.6" marker-end="url(#pipe-arr-teal)"/>
    <path d="M 508 316 L 520 316 L 520 334 L 530 334" fill="none" stroke="#1D4ED8" stroke-width="1.6" marker-end="url(#pipe-arr-blue)"/>
  </g>
</svg>
