<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 350" width="900" height="350" role="img" aria-label="v0.30.0 W8A8_MIX 组合式双方法架构与 is_kv_consumer Prefill/Decode 分流图">
  <title>v0.30.0 W8A8_MIX（w8a8_pdmix.py）组合架构与 PD 角色分派：统一按静态路径加载全套缓冲区并补建 weight_scale_fp32，前向依 kv_transfer_config.is_kv_consumer 分流——Prefill/混部走动态逐 token 量化保精度，Decode/kv_both 走静态省算子开销（仅注册 linear，已移除 moe）。</title>
  <desc>关联源码符号：W8A8_MIX, AscendW8A8PDMixLinearMethod, _static_method, _dynamic_method, is_kv_consumer, weight_scale_fp32, process_weights_after_loading, quant_bias, deq_scale, weight_scale</desc>
  <defs>
    <marker id="pd-arr-ink" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto">
      <path d="M 0 0.5 L 9.5 5 L 0 9.5 z" fill="#17211f"/>
    </marker>
    <marker id="pd-arr-blue" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto">
      <path d="M 0 0.5 L 9.5 5 L 0 9.5 z" fill="#1D4ED8"/>
    </marker>
    <marker id="pd-arr-teal" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto">
      <path d="M 0 0.5 L 9.5 5 L 0 9.5 z" fill="#087f73"/>
    </marker>
  </defs>

  <!-- 顶部开放标题与注册边界提示（无顶栏黑条、无整图底框、无外层列框） -->
  <text x="16" y="24" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="14" font-weight="700" fill="#17211f">AscendW8A8PDMixLinearMethod 组合分派（w8a8_pdmix.py）</text>
  <text x="884" y="24" text-anchor="end" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="12" font-weight="700" fill="#8f3229">v0.30.0 仅注册 (W8A8_MIX, linear) · 已移除 moe（勿写 W8A8_PDMIX）</text>

  <!-- 第 1 站：加载期统一建参（仅真实张量块描边） -->
  <g id="pd-ckpt">
    <circle cx="27" cy="50" r="11" fill="var(--color-weight, #c78300)"/>
    <text x="27" y="54.5" text-anchor="middle" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="12" font-weight="700" fill="#FFFFFF">1</text>
    <text x="45" y="55" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="13.5" font-weight="700" fill="#17211f">加载期统一建参</text>

    <rect x="16" y="70" width="240" height="48" rx="7" fill="var(--color-weight-soft, #fff4cf)" stroke="var(--color-weight, #c78300)" stroke-width="1.4"/>
    <text x="28" y="90" font-family="'JetBrains Mono',ui-monospace,monospace" font-size="12.5" font-weight="700" fill="#17211f">weight (INT8)</text>
    <text x="28" y="109" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="11.5" fill="#475569">转置 [in, out] + maybe_trans_nz</text>

    <rect x="16" y="126" width="240" height="48" rx="7" fill="var(--color-token-soft, #ddf4ef)" stroke="var(--color-token, #087f73)" stroke-width="1.4"/>
    <text x="28" y="146" font-family="'JetBrains Mono',ui-monospace,monospace" font-size="12" font-weight="700" fill="#065f56">input_scale + input_offset</text>
    <text x="28" y="165" font-family="'JetBrains Mono',ui-monospace,monospace" font-size="11.5" fill="#334155">quant_bias + deq_scale</text>

    <rect x="16" y="182" width="240" height="48" rx="7" fill="var(--color-kv-soft, #e8edff)" stroke="#1D4ED8" stroke-width="1.4"/>
    <text x="28" y="202" font-family="'JetBrains Mono',ui-monospace,monospace" font-size="12" font-weight="700" fill="#1e3a8a">weight_scale + weight_offset</text>
    <text x="28" y="221" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="11.5" fill="#1e3a8a">后处理补建 weight_scale_fp32</text>

    <text x="16" y="250" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="11.5" font-style="italic" fill="#5b6763">同一份静态权重包喂饱动/静两套算子</text>
    <text x="16" y="268" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="11.5" font-style="italic" fill="#5b6763">（代价是常驻全套静态参数缓冲区）</text>
  </g>

  <!-- 汇流箭头：静态缓冲区 -> 组合方法 -->
  <path d="M 256 94 L 272 94 L 272 206 L 256 206" fill="none" stroke="#17211f" stroke-width="1.4"/>
  <line x1="256" y1="150" x2="284" y2="150" stroke="#17211f" stroke-width="1.5" marker-end="url(#pd-arr-ink)"/>

  <!-- 第 2 站：组合双实例与 PD 角色门 -->
  <g id="pd-router">
    <circle cx="299" cy="50" r="11" fill="var(--color-control, #66716d)"/>
    <text x="299" y="54.5" text-anchor="middle" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="12" font-weight="700" fill="#FFFFFF">2</text>
    <text x="317" y="55" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="13.5" font-weight="700" fill="#17211f">双实例与角色判定</text>

    <rect x="288" y="70" width="240" height="48" rx="7" fill="var(--color-surface-sunken, #ece9df)" stroke="#17211f" stroke-width="1.4"/>
    <text x="300" y="90" font-family="'JetBrains Mono',ui-monospace,monospace" font-size="12" font-weight="700" fill="#1D4ED8">self._dynamic_method</text>
    <text x="300" y="109" font-family="'JetBrains Mono',ui-monospace,monospace" font-size="11.5" fill="#334155">AscendW8A8DynamicLinearMethod</text>

    <rect x="288" y="126" width="240" height="48" rx="7" fill="var(--color-surface-sunken, #ece9df)" stroke="#17211f" stroke-width="1.4"/>
    <text x="300" y="146" font-family="'JetBrains Mono',ui-monospace,monospace" font-size="12" font-weight="700" fill="#087f73">self._static_method</text>
    <text x="300" y="165" font-family="'JetBrains Mono',ui-monospace,monospace" font-size="11.5" fill="#334155">AscendW8A8LinearMethod</text>

    <rect x="288" y="184" width="240" height="86" rx="8" fill="var(--color-control, #66716d)" stroke="#17211f" stroke-width="1.5"/>
    <text x="408" y="205" text-anchor="middle" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="12.5" font-weight="700" fill="#FFFFFF">前向读取 PD 角色开关</text>
    <text x="408" y="225" text-anchor="middle" font-family="'JetBrains Mono',ui-monospace,monospace" font-size="12" fill="#FFF4CF">kv_transfer_config</text>
    <text x="408" y="243" text-anchor="middle" font-family="'JetBrains Mono',ui-monospace,monospace" font-size="12.5" font-weight="700" fill="#FFFFFF">.is_kv_consumer</text>
    <text x="408" y="261" text-anchor="middle" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="11.5" fill="#ECE9DF">False → 动态 ｜ True → 静态</text>
  </g>

  <!-- 分流连线 -->
  <path d="M 528 214 L 546 214 L 546 118 L 560 118" fill="none" stroke="#1D4ED8" stroke-width="1.6" marker-end="url(#pd-arr-blue)"/>
  <path d="M 528 242 L 546 242 L 546 226 L 560 226" fill="none" stroke="#087f73" stroke-width="1.6" marker-end="url(#pd-arr-teal)"/>

  <!-- 第 3 站：按角色执行算子（无内嵌套娃小框） -->
  <g id="pd-branches">
    <circle cx="575" cy="50" r="11" fill="var(--color-comm, #9a4b86)"/>
    <text x="575" y="54.5" text-anchor="middle" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="12" font-weight="700" fill="#FFFFFF">3</text>
    <text x="593" y="55" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="13.5" font-weight="700" fill="#17211f">按节点角色分流执行</text>

    <rect x="564" y="70" width="320" height="96" rx="8" fill="var(--color-kv-soft, #e8edff)" stroke="#1D4ED8" stroke-width="1.5"/>
    <text x="578" y="92" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="13" font-weight="700" fill="#1e3a8a">Prefill 节点 / 未开 PD 混部 → 动态</text>
    <text x="578" y="114" font-family="'JetBrains Mono',ui-monospace,monospace" font-size="11.5" fill="#17211f">npu_dynamic_quant(x) → pertoken_scale</text>
    <text x="578" y="133" font-family="'JetBrains Mono',ui-monospace,monospace" font-size="11.5" fill="#334155">npu_quant_matmul(..., weight_scale_fp32)</text>
    <text x="578" y="154" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="12" font-weight="700" fill="#1D4ED8">✓ 按当前每个 token 现算，保长上文精度</text>

    <rect x="564" y="178" width="320" height="96" rx="8" fill="var(--color-token-soft, #ddf4ef)" stroke="#087f73" stroke-width="1.5"/>
    <text x="578" y="200" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="13" font-weight="700" fill="#065f56">Decode (is_kv_consumer) / kv_both → 静态</text>
    <text x="578" y="222" font-family="'JetBrains Mono',ui-monospace,monospace" font-size="11.5" fill="#17211f">quantize(x, aclnn_input_scale, offset)</text>
    <text x="578" y="241" font-family="'JetBrains Mono',ui-monospace,monospace" font-size="11.5" fill="#334155">npu_quant_matmul · deq_scale + quant_bias</text>
    <text x="578" y="262" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="12" font-weight="700" fill="#065f56">✓ 复用离线校准参数，省掉每步极值统计</text>
  </g>

  <!-- 底部开放式虚线分隔说明 -->
  <line x1="16" y1="292" x2="884" y2="292" stroke="#CBD5E1" stroke-width="1.5" stroke-dasharray="6 5"/>
  <text x="16" y="316" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="12" fill="#334155">预量化重叠兼容：prepare_input_for_overlap 同样按 layer.is_kv_consumer 委托给对应子方法构造 PreparedLinearInput，</text>
  <text x="16" y="336" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="12" fill="#475569">保证共享专家与通信重叠等路径直接复用预量化激活，不发生二次量化。</text>
</svg>
