  <title>v0.30.0（c09d3e20）量化配置与逐层分派主线：上段由入口识别进入 AscendModelSlimConfig 逐层查表，区分 FLOAT/Embed 回退、Linear/MoE 注册表分派及 W8A8_MIX 的 PD 角色分支；下段 AscendFp8Config 校验分块与动态激活后，在 Ascend 950 转为 MXFP8（kv_b_proj 与非 32 倍数维除外），在 A2/A3 上 v0.30.0 静默展开回 model_dtype（2× 显存）、main 抛错；310P 属 COMPATIBILITY 后端不注册 AscendFp8Config，不支持原生 FP8。</title>
