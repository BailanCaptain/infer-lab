layout: figure
id: quantization-flow
caption: 加载时按层决定精度：读模型目录里的量化描述文件，标成 FLOAT 的层换成不量化实现，其余按「精度名称、层类型」这一对键找到方法类。每次前向由选中的方法执行：激活现算系数压成 INT8，整数乘加，最后乘回两份系数输出 BF16。上排的分支只在加载时走一次，虚线表示它决定下排用哪套算子。
