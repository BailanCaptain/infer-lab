layout: figure
id: quantization-flow
caption: 上排只画接量化配置的 Linear/MoE：命中 FLOAT 跳过条件时选不量化实现，否则读取精度并按「精度名称、层类型」查注册表；缺必要条目或实现会报错。Embedding 缺量化条目时允许回退浮点，不在这条分支内。下排画普通动态 Linear 的 BF16 输入路径：量化为 INT8，整数乘加，再乘回两份系数输出 BF16；预量化与专家融合路径的实际调用次数不同。
