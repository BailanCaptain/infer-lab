<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 440" width="880" height="440" role="img" aria-label="图示本页普通动态 W8A8 Linear 的 BF16 输入路径：权重在离线阶段按输出通道压成 INT8，每个通道留下一个缩放系数；前向把输入激活按行（一行是一个 token）压成 INT8，每行留下一个缩放系数。整数乘加只吃两份 INT8，结果先是整数；缩放系数不进整数乘加，最后乘回来，输出恢复成 BF16。这是逻辑步骤，提前量化和融合可以改变实际算子调用次数。">
  <title>图示本页普通动态 W8A8 Linear 的 BF16 输入路径：权重在离线阶段按输出通道压成 INT8，每个通道留下一个缩放系数；前向把输入激活按行（一行是一个 token）压成 INT8，每行留下一个缩放系数。整数乘加只吃两份 INT8，结果先是整数；缩放系数不进整数乘加，最后乘回来，输出恢复成 BF16。这是逻辑步骤，提前量化和融合可以改变实际算子调用次数。</title>
  <defs><marker id="quantization-intuition-ah-ink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="var(--color-ink, #17211f)"/></marker><marker id="quantization-intuition-ah-control" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="var(--color-control, #66716d)"/></marker></defs>
  <rect x="104" y="46" width="430" height="158" rx="16" fill="none" stroke="var(--color-line-strong, #b8bcb5)" stroke-width="1.5"/>
  <text x="120" y="34" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="15" font-weight="700" fill="var(--color-ink, #17211f)">离线做一次：权重压成 INT8</text>
  <rect x="104" y="240" width="430" height="158" rx="16" fill="none" stroke="var(--color-line-strong, #b8bcb5)" stroke-width="1.5"/>
  <text x="120" y="228" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="15" font-weight="700" fill="var(--color-ink, #17211f)">每次前向：激活当场压成 INT8</text>
  <path d="M208 98 L240 98" fill="none" stroke="var(--color-ink, #17211f)" stroke-width="1.4" marker-end="url(#quantization-intuition-ah-ink)"/>
  <path d="M396 98 L420 98" fill="none" stroke="var(--color-ink, #17211f)" stroke-width="1.4" marker-end="url(#quantization-intuition-ah-ink)"/>
  <path d="M504 118 L532 118 L532 205 L560 205" fill="none" stroke="var(--color-ink, #17211f)" stroke-width="1.4" marker-end="url(#quantization-intuition-ah-ink)"/>
  <path d="M208 286 L240 286" fill="none" stroke="var(--color-ink, #17211f)" stroke-width="1.4" marker-end="url(#quantization-intuition-ah-ink)"/>
  <path d="M396 286 L420 286" fill="none" stroke="var(--color-ink, #17211f)" stroke-width="1.4" marker-end="url(#quantization-intuition-ah-ink)"/>
  <path d="M520 286 L540 286 L540 231 L560 231" fill="none" stroke="var(--color-ink, #17211f)" stroke-width="1.4" marker-end="url(#quantization-intuition-ah-ink)"/>
  <path d="M664 218 L676 218" fill="none" stroke="var(--color-ink, #17211f)" stroke-width="1.4" marker-end="url(#quantization-intuition-ah-ink)"/>
  <path d="M772 218 L790 218" fill="none" stroke="var(--color-ink, #17211f)" stroke-width="1.4" marker-end="url(#quantization-intuition-ah-ink)"/>
  <path d="M504 149 L548 149 L548 168 L700 168 L700 186" fill="none" stroke="var(--color-control, #66716d)" stroke-width="1.4" stroke-dasharray="7 5" marker-end="url(#quantization-intuition-ah-control)"/>
  <path d="M520 316 L548 316 L548 268 L730 268 L730 250" fill="none" stroke="var(--color-control, #66716d)" stroke-width="1.4" stroke-dasharray="7 5" marker-end="url(#quantization-intuition-ah-control)"/>
  <rect x="124" y="62" width="84" height="72" fill="var(--color-surface, #fbfaf6)" stroke="var(--color-weight, #c78300)" stroke-opacity="0.45" stroke-width="1.3"/>
  <path d="M138 62v72M152 62v72M166 62v72M180 62v72M194 62v72M124 74h84M124 86h84M124 98h84M124 110h84M124 122h84" stroke="var(--color-weight, #c78300)" stroke-opacity="0.28" stroke-width="1" fill="none"/>
  <rect x="420" y="62" width="84" height="72" fill="var(--color-weight-soft, #fff4cf)" stroke="var(--color-weight, #c78300)" stroke-width="1.4"/>
  <path d="M434 62v72M448 62v72M462 62v72M476 62v72M490 62v72M420 74h84M420 86h84M420 98h84M420 110h84M420 122h84" stroke="var(--color-weight, #c78300)" stroke-opacity="0.35" stroke-width="1" fill="none"/>
  <rect x="420" y="144" width="84" height="10" fill="var(--color-control-soft, #f1efe8)" stroke="var(--color-control, #66716d)" stroke-width="1.4"/>
  <path d="M434 144v10M448 144v10M462 144v10M476 144v10M490 144v10" stroke="var(--color-control, #66716d)" stroke-opacity="0.35" stroke-width="1" fill="none"/>
  <rect x="124" y="256" width="84" height="60" fill="var(--color-surface, #fbfaf6)" stroke="var(--color-token, #087f73)" stroke-opacity="0.45" stroke-width="1.3"/>
  <path d="M138 256v60M152 256v60M166 256v60M180 256v60M194 256v60M124 271h84M124 286h84M124 301h84" stroke="var(--color-token, #087f73)" stroke-opacity="0.28" stroke-width="1" fill="none"/>
  <rect x="420" y="256" width="84" height="60" fill="var(--color-token-soft, #ddf4ef)" stroke="var(--color-token, #087f73)" stroke-width="1.4"/>
  <path d="M434 256v60M448 256v60M462 256v60M476 256v60M490 256v60M420 271h84M420 286h84M420 301h84" stroke="var(--color-token, #087f73)" stroke-opacity="0.35" stroke-width="1" fill="none"/>
  <rect x="510" y="256" width="10" height="60" fill="var(--color-control-soft, #f1efe8)" stroke="var(--color-control, #66716d)" stroke-width="1.4"/>
  <path d="M510 271h10M510 286h10M510 301h10" stroke="var(--color-control, #66716d)" stroke-opacity="0.35" stroke-width="1" fill="none"/>
  <rect x="790" y="190" width="72" height="48" fill="var(--color-surface, #fbfaf6)" stroke="var(--color-token, #087f73)" stroke-opacity="0.45" stroke-width="1.3"/>
  <path d="M802 190v48M814 190v48M826 190v48M838 190v48M850 190v48M790 202h72M790 214h72M790 226h72" stroke="var(--color-token, #087f73)" stroke-opacity="0.28" stroke-width="1" fill="none"/>
  <rect x="240" y="76" width="156" height="44" rx="8" fill="var(--color-control-soft, #f1efe8)" stroke="var(--color-line-strong, #b8bcb5)" stroke-width="1.4"/>
  <text x="318" y="94" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="14" font-weight="700" fill="var(--color-ink, #17211f)" text-anchor="middle">每列除以自己的系数</text>
  <text x="318" y="113" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="13" font-weight="400" fill="var(--color-ink-muted, #66716d)" text-anchor="middle">舍入后截到 −128…127</text>
  <rect x="240" y="270" width="156" height="44" rx="8" fill="var(--color-control-soft, #f1efe8)" stroke="var(--color-line-strong, #b8bcb5)" stroke-width="1.4"/>
  <text x="318" y="288" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="14" font-weight="700" fill="var(--color-ink, #17211f)" text-anchor="middle">每行除以自己的系数</text>
  <text x="318" y="307" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="13" font-weight="400" fill="var(--color-ink-muted, #66716d)" text-anchor="middle">系数按本次输入现算</text>
  <rect x="560" y="186" width="104" height="64" rx="8" fill="var(--color-control-soft, #f1efe8)" stroke="var(--color-line-strong, #b8bcb5)" stroke-width="1.4"/>
  <text x="612" y="214" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="14" font-weight="700" fill="var(--color-ink, #17211f)" text-anchor="middle">整数乘加</text>
  <text x="612" y="233" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="13" font-weight="400" fill="var(--color-ink-muted, #66716d)" text-anchor="middle">结果先是整数</text>
  <rect x="676" y="186" width="96" height="64" rx="8" fill="var(--color-control-soft, #f1efe8)" stroke="var(--color-line-strong, #b8bcb5)" stroke-width="1.4"/>
  <text x="724" y="223" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="14" font-weight="700" fill="var(--color-ink, #17211f)" text-anchor="middle">乘回两个系数</text>
  <text x="166" y="152" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="13" font-weight="400" fill="var(--color-ink, #17211f)" text-anchor="middle">BF16：每个数 2 字节</text>
  <text x="462" y="172" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="13" font-weight="400" fill="var(--color-ink, #17211f)" text-anchor="middle">INT8：每个数 1 字节</text>
  <text x="462" y="192" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="13" font-weight="400" fill="var(--color-ink-muted, #66716d)" text-anchor="middle" font-style="italic">细条是每个输出通道的系数</text>
  <text x="166" y="340" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="13" font-weight="400" fill="var(--color-ink, #17211f)" text-anchor="middle">BF16：一行是一个 token</text>
  <text x="462" y="340" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="13" font-weight="400" fill="var(--color-ink, #17211f)" text-anchor="middle">INT8：右边细条是每行的系数</text>
  <text x="462" y="360" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="13" font-weight="400" fill="var(--color-ink-muted, #66716d)" text-anchor="middle" font-style="italic">同一份权重，每次配新的激活系数</text>
  <text x="724" y="152" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="13" font-weight="400" fill="var(--color-ink-muted, #66716d)" text-anchor="middle" font-style="italic">缩放系数不进整数乘加</text>
  <text x="818" y="264" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="13" font-weight="700" fill="var(--color-ink, #17211f)" text-anchor="middle">输出 BF16</text>
  <circle cx="244" cy="80" r="11" fill="var(--color-ink, #17211f)"/><text x="244" y="85" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="13" font-weight="700" fill="var(--color-ink-inverse, #ffffff)" text-anchor="middle">1</text>
  <circle cx="244" cy="274" r="11" fill="var(--color-ink, #17211f)"/><text x="244" y="279" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="13" font-weight="700" fill="var(--color-ink-inverse, #ffffff)" text-anchor="middle">2</text>
  <circle cx="564" cy="190" r="11" fill="var(--color-ink, #17211f)"/><text x="564" y="195" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="13" font-weight="700" fill="var(--color-ink-inverse, #ffffff)" text-anchor="middle">3</text>
  <circle cx="680" cy="190" r="11" fill="var(--color-ink, #17211f)"/><text x="680" y="195" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="13" font-weight="700" fill="var(--color-ink-inverse, #ffffff)" text-anchor="middle">4</text>
</svg>
