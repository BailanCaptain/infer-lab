layout: figure
id: quantization-intuition
caption: 图示本页普通动态 W8A8 Linear 的 BF16 输入路径：权重在离线阶段按输出通道压成 INT8，每个通道留下一个缩放系数；前向把输入激活按行（一行是一个 token）压成 INT8，每行留下一个缩放系数。整数乘加只吃两份 INT8，结果先是整数；缩放系数不进整数乘加，最后乘回来，输出恢复成 BF16。这是逻辑步骤，提前量化和融合可以改变实际算子调用次数。
