<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 470" width="900" height="470" role="img" aria-label="SmoothQuant、AWQ、GPTQ方法家族与昇腾v0.30.0量化方案注册范围及FP8硬件分流图" font-family="var(--font-sans)">
  <title>量化方法家族（SmoothQuant / AWQ / GPTQ）与昇腾 v0.30.0 W8A8 / W8A8_PDMIX / FP8_BLOCK 注册图</title>
  <desc>关联源码符号：AscendW8A8PDMixLinearMethod, AscendW8A8LinearMethod, AscendW8A8DynamicLinearMethod, _is_kv_consumer, resolve_block_scales, AscendW8A8MXFP8DynamicLinearMethod, maybe_trans_nz</desc>

  <!-- Zone 1: Algorithm family map -->
  <text x="16" y="28" font-size="16" font-weight="700" fill="#17211f">① 核心 PTQ 量化算法家族：优化对象与核心动作各不相同（均需核对产物与算子）</text>

  <rect x="16" y="44" width="276" height="142" rx="8" fill="#ddf4ef" stroke="#087f73" stroke-width="1.4"/>
  <text x="30" y="70" font-size="14.5" font-weight="700" fill="#065f56">SmoothQuant（面向 W8A8）</text>
  <text x="30" y="96" font-size="13.5" fill="#4d5652">动作：X·W = (X D⁻¹)(D W)</text>
  <text x="30" y="120" font-size="13.5" fill="#4d5652">把激活离群幅度迁给权重</text>
  <text x="30" y="144" font-size="13.5" fill="#4d5652">示例：max|x| 从 20 降至 2</text>
  <text x="30" y="170" font-size="13.5" font-weight="700" fill="#065f56">不是新编码，是量化前等价变换</text>

  <rect x="310" y="44" width="278" height="142" rx="8" fill="#fff4cf" stroke="#c78300" stroke-width="1.4"/>
  <text x="324" y="70" font-size="14.5" font-weight="700" fill="#936300">AWQ（面向低位 Weight-Only）</text>
  <text x="324" y="96" font-size="13.5" fill="#4d5652">动作：参考离线激活寻重要通道</text>
  <text x="324" y="120" font-size="13.5" fill="#4d5652">按通道缩放保护敏感权重</text>
  <text x="324" y="144" font-size="13.5" fill="#4d5652">激活仍保持 16 位（非 A4）</text>
  <text x="324" y="170" font-size="13.5" font-weight="700" fill="#936300">AutoAWQ 已弃用，新制作转 LC</text>

  <rect x="606" y="44" width="278" height="142" rx="8" fill="#e8edff" stroke="#4c65b6" stroke-width="1.4"/>
  <text x="620" y="70" font-size="14.5" font-weight="700" fill="#3a4f93">GPTQ（面向逐层权重重构）</text>
  <text x="620" y="96" font-size="13.5" fill="#4d5652">动作：校准求近似二阶信息</text>
  <text x="620" y="120" font-size="13.5" fill="#4d5652">分块量化并补偿未量化权重</text>
  <text x="620" y="144" font-size="13.5" fill="#4d5652">不重训原模型，可组合 Smooth</text>
  <text x="620" y="170" font-size="13.5" font-weight="700" fill="#3a4f93">算法名 ≠ 文件格式（看 config）</text>

  <line x1="16" y1="204" x2="884" y2="204" stroke="#b8bcb5" stroke-width="1.4" stroke-dasharray="6 5"/>

  <!-- Zone 2: v0.30.0 Ascend registration & FP8 hardware routing -->
  <text x="16" y="232" font-size="16" font-weight="700" fill="#17211f">② v0.30.0 vLLM Ascend 注册范围与硬件分流（同名 W8A8 须核对层类型与芯片）</text>

  <rect x="16" y="248" width="206" height="122" rx="7" fill="#ece9df" stroke="#8a928f" stroke-width="1.3"/>
  <text x="30" y="274" font-size="14" font-weight="700" fill="#17211f">W8A8（静态）</text>
  <text x="30" y="298" font-size="13.5" fill="#4d5652">仅注册 linear 层</text>
  <text x="30" y="320" font-size="13.5" fill="#4d5652">激活使用离线静态系数</text>
  <text x="30" y="344" font-size="13.5" fill="#66716d">需校验校准分布覆盖</text>

  <rect x="236" y="248" width="210" height="122" rx="7" fill="#f7e7f2" stroke="#9a4b86" stroke-width="1.4"/>
  <text x="250" y="274" font-size="14" font-weight="700" fill="#7a3a6a">W8A8_MIX（PDMIX）</text>
  <text x="250" y="298" font-size="13.5" font-weight="700" fill="#7a3a6a">v0.30.0 仅注册 linear</text>
  <text x="250" y="320" font-size="13.5" fill="#4d5652">P 走动态 / D 走静态</text>
  <text x="250" y="344" font-size="13.5" fill="#8f3229">已移除旧版 MoE 注册</text>

  <rect x="460" y="248" width="206" height="122" rx="7" fill="#ddf4ef" stroke="#087f73" stroke-width="1.4"/>
  <text x="474" y="274" font-size="14" font-weight="700" fill="#065f56">W8A8_DYNAMIC</text>
  <text x="474" y="298" font-size="13.5" font-weight="700" fill="#065f56">覆盖 linear + MoE</text>
  <text x="474" y="320" font-size="13.5" fill="#4d5652">激活按 token 实时定量</text>
  <text x="474" y="344" font-size="13.5" fill="#065f56">权重按通道离线静态</text>

  <rect x="680" y="248" width="204" height="122" rx="7" fill="#fff0e9" stroke="#b54237" stroke-width="1.4"/>
  <text x="694" y="274" font-size="14" font-weight="700" fill="#8f3229">FP8_BLOCK 分流</text>
  <text x="694" y="298" font-size="13.5" fill="#065f56">A5：重组为 MXFP8</text>
  <text x="694" y="320" font-size="13.5" fill="#936300">A2/A3 v0.30：反量 BF16</text>
  <text x="694" y="344" font-size="13.5" font-weight="700" fill="#8f3229">main 非 A5 直接报错</text>

  <line x1="16" y1="388" x2="884" y2="388" stroke="#b8bcb5" stroke-width="1.4" stroke-dasharray="6 5"/>

  <!-- Zone 3: 3 Timing stages -->
  <text x="16" y="414" font-size="16" font-weight="700" fill="#17211f">③ 三段转换时机互不混淆（避免把 online 加载转换与动态激活混为一谈）</text>
  <rect x="16" y="426" width="278" height="34" rx="5" fill="#fff4cf" stroke="#c78300" stroke-width="1.2"/>
  <text x="155" y="448" text-anchor="middle" font-size="13.5" fill="#936300">离线制包：ModelSlim / LC 校准导出</text>
  <rect x="311" y="426" width="278" height="34" rx="5" fill="#e8edff" stroke="#4c65b6" stroke-width="1.2"/>
  <text x="450" y="448" text-anchor="middle" font-size="13.5" fill="#3a4f93">加载期：online 转权 + 转置/转 NZ</text>
  <rect x="606" y="426" width="278" height="34" rx="5" fill="#ddf4ef" stroke="#087f73" stroke-width="1.2"/>
  <text x="745" y="448" text-anchor="middle" font-size="13.5" fill="#065f56">前向期：每步激活实时/静态量化</text>
</svg>
