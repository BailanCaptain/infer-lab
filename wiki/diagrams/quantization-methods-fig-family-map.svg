<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 524" width="900" height="524" role="img" aria-label="SmoothQuant、AWQ、GPTQ 几何机理与 v0.30.0 昇腾量化方案注册覆盖矩阵" font-family="var(--font-sans)">
  <title>PTQ 三大算法机理（SmoothQuant / AWQ / GPTQ）与 v0.30.0 昇腾注册矩阵</title>
  <desc>关联源码符号：AscendW8A8PDMixLinearMethod, AscendW8A8LinearMethod, AscendW8A8DynamicLinearMethod, _is_kv_consumer, resolve_block_scales, AscendW8A8MXFP8DynamicLinearMethod, maybe_trans_nz</desc>
  <defs>
    <marker id="qmf-arr-t" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 1.5 L 8.5 5 L 0 8.5 z" fill="#087f73"/>
    </marker>
    <marker id="qmf-arr-a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 1.5 L 8.5 5 L 0 8.5 z" fill="#c78300"/>
    </marker>
    <marker id="qmf-arr-i" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 1.5 L 8.5 5 L 0 8.5 z" fill="#4c65b6"/>
    </marker>
  </defs>

  <!-- Zone 1 Title -->
  <text x="16" y="28" font-size="16" font-weight="700" fill="#17211f">① 三类核心 PTQ 算法机理：迁移峰值 vs 保护通道 vs 补偿误差</text>
  <line x1="14" y1="38" x2="886" y2="38" stroke="#b8bcb5" stroke-width="1.4"/>

  <!-- Column separators -->
  <line x1="300" y1="48" x2="300" y2="256" stroke="#d8d8cf" stroke-width="1.3" stroke-dasharray="5 4"/>
  <line x1="600" y1="48" x2="600" y2="256" stroke="#d8d8cf" stroke-width="1.3" stroke-dasharray="5 4"/>

  <!-- Col 1: SmoothQuant bar migration -->
  <text x="16" y="66" font-size="15" font-weight="700" fill="#065f56">SmoothQuant（面向 W8A8）</text>
  <text x="16" y="88" font-size="13.5" fill="#4d5652">把激活尖峰按通道迁给权重</text>

  <!-- Before bars (baseline y=176) -->
  <line x1="22" y1="176" x2="128" y2="176" stroke="#8a928f" stroke-width="1.2"/>
  <rect x="28" y="104" width="22" height="72" rx="3" fill="#fff0e9" stroke="#b54237" stroke-width="1.5"/>
  <rect x="54" y="166" width="22" height="10" rx="2" fill="#ddf4ef" stroke="#087f73" stroke-width="1.4"/>
  <rect x="82" y="170" width="18" height="6" rx="1" fill="#fff4cf" stroke="#c78300" stroke-width="1.3"/>
  <rect x="104" y="162" width="18" height="14" rx="2" fill="#fff4cf" stroke="#c78300" stroke-width="1.3"/>
  <text x="39" y="100" text-anchor="middle" font-family="var(--font-mono)" font-size="13.5" font-weight="700" fill="#8f3229">20</text>
  <text x="52" y="196" text-anchor="middle" font-family="var(--font-mono)" font-size="13.5" fill="#065f56">x</text>
  <text x="102" y="196" text-anchor="middle" font-family="var(--font-mono)" font-size="13.5" fill="#936300">w</text>

  <!-- Arrow ÷10 / ×10 -->
  <path d="M 134 146 L 164 146" fill="none" stroke="#087f73" stroke-width="2" marker-end="url(#qmf-arr-t)"/>
  <text x="149" y="136" text-anchor="middle" font-family="var(--font-mono)" font-size="13.5" font-weight="700" fill="#065f56">D⁻¹/D</text>

  <!-- After bars (baseline y=176) -->
  <line x1="174" y1="176" x2="286" y2="176" stroke="#8a928f" stroke-width="1.2"/>
  <rect x="180" y="148" width="22" height="28" rx="3" fill="#ddf4ef" stroke="#087f73" stroke-width="1.5"/>
  <rect x="206" y="162" width="22" height="14" rx="2" fill="#ddf4ef" stroke="#087f73" stroke-width="1.4"/>
  <rect x="236" y="154" width="18" height="22" rx="2" fill="#fff4cf" stroke="#c78300" stroke-width="1.5"/>
  <rect x="258" y="154" width="18" height="22" rx="2" fill="#fff4cf" stroke="#c78300" stroke-width="1.5"/>
  <text x="191" y="143" text-anchor="middle" font-family="var(--font-mono)" font-size="13.5" font-weight="700" fill="#065f56">2</text>
  <text x="204" y="196" text-anchor="middle" font-family="var(--font-mono)" font-size="13.5" fill="#065f56">x'</text>
  <text x="256" y="196" text-anchor="middle" font-family="var(--font-mono)" font-size="13.5" fill="#936300">w'</text>

  <text x="16" y="224" font-family="var(--font-mono)" font-size="13.5" font-weight="700" fill="#065f56">x·w = (xD⁻¹)(Dw) = 3</text>
  <text x="16" y="246" font-size="13.5" fill="#4d5652">激活步长缩 10×，点积精确等价</text>

  <!-- Col 2: AWQ salient channel scaling -->
  <text x="316" y="66" font-size="15" font-weight="700" fill="#936300">AWQ（面向 W4A16）</text>
  <text x="316" y="88" font-size="13.5" fill="#4d5652">看激活幅值找关键通道并放大保护</text>

  <!-- Activation magnitude bars -->
  <text x="316" y="114" font-size="13.5" font-weight="600" fill="#065f56">离线激活 |X|</text>
  <rect x="410" y="102" width="24" height="14" rx="2" fill="#ece9df" stroke="#8a928f" stroke-width="1.2"/>
  <rect x="440" y="102" width="24" height="14" rx="2" fill="#ece9df" stroke="#8a928f" stroke-width="1.2"/>
  <rect x="470" y="96" width="24" height="26" rx="3" fill="#ddf4ef" stroke="#087f73" stroke-width="2"/>
  <rect x="500" y="102" width="24" height="14" rx="2" fill="#ece9df" stroke="#8a928f" stroke-width="1.2"/>
  <rect x="530" y="102" width="24" height="14" rx="2" fill="#ece9df" stroke="#8a928f" stroke-width="1.2"/>

  <!-- Protection arrow down to weight row/col -->
  <path d="M 482 125 L 482 148" fill="none" stroke="#c78300" stroke-width="2" marker-end="url(#qmf-arr-a)"/>
  <text x="536" y="142" text-anchor="middle" font-family="var(--font-mono)" font-size="13.5" font-weight="700" fill="#936300">×s 保护</text>

  <!-- Weight grid row highlighting salient channel -->
  <text x="316" y="176" font-size="13.5" font-weight="600" fill="#936300">权重 W (4b)</text>
  <rect x="410" y="156" width="24" height="36" rx="2" fill="#ffffff" stroke="#b8bcb5" stroke-width="1.2"/>
  <rect x="440" y="156" width="24" height="36" rx="2" fill="#ffffff" stroke="#b8bcb5" stroke-width="1.2"/>
  <rect x="470" y="156" width="24" height="36" rx="3" fill="#fff4cf" stroke="#c78300" stroke-width="2.2"/>
  <rect x="500" y="156" width="24" height="36" rx="2" fill="#ffffff" stroke="#b8bcb5" stroke-width="1.2"/>
  <rect x="530" y="156" width="24" height="36" rx="2" fill="#ffffff" stroke="#b8bcb5" stroke-width="1.2"/>

  <text x="316" y="224" font-size="13.5" font-weight="700" fill="#936300">激活保持 16 位（非 A4）</text>
  <text x="316" y="246" font-size="13.5" fill="#4d5652">用缩放护重点，并非硬留 1% FP16</text>

  <!-- Col 3: GPTQ blockwise column compensation -->
  <text x="616" y="66" font-size="15" font-weight="700" fill="#3a4f93">GPTQ（逐块权重补偿）</text>
  <text x="616" y="88" font-size="13.5" fill="#4d5652">量化前块后，按二阶信息修补后块</text>

  <!-- 4 weight columns -->
  <rect x="626" y="118" width="44" height="74" rx="4" fill="#ddf4ef" stroke="#087f73" stroke-width="1.8"/>
  <text x="648" y="160" text-anchor="middle" font-family="var(--font-mono)" font-size="13.5" font-weight="700" fill="#065f56">块 0</text>
  <rect x="688" y="118" width="44" height="74" rx="4" fill="#e8edff" stroke="#4c65b6" stroke-width="1.6"/>
  <text x="710" y="160" text-anchor="middle" font-family="var(--font-mono)" font-size="13.5" font-weight="700" fill="#3a4f93">块 1</text>
  <rect x="750" y="118" width="44" height="74" rx="4" fill="#fff4cf" stroke="#c78300" stroke-width="1.5"/>
  <text x="772" y="160" text-anchor="middle" font-family="var(--font-mono)" font-size="13.5" fill="#936300">块 2</text>
  <rect x="812" y="118" width="44" height="74" rx="4" fill="#fff4cf" stroke="#c78300" stroke-width="1.5"/>
  <text x="834" y="160" text-anchor="middle" font-family="var(--font-mono)" font-size="13.5" fill="#936300">块 3</text>

  <!-- Curved error compensation arcs -->
  <path d="M 656 116 Q 684 94 706 113" fill="none" stroke="#4c65b6" stroke-width="1.8" marker-end="url(#qmf-arr-i)"/>
  <path d="M 660 116 Q 716 86 768 113" fill="none" stroke="#4c65b6" stroke-width="1.5" stroke-dasharray="4 3" marker-end="url(#qmf-arr-i)"/>
  <text x="744" y="207" text-anchor="middle" font-size="13.5" font-weight="700" fill="#3a4f93">已量化误差 ΔW → 补偿未量化块</text>

  <text x="616" y="228" font-size="13.5" font-weight="700" fill="#3a4f93">减小层输出重构误差（不重训）</text>
  <text x="616" y="248" font-size="13.5" fill="#4d5652">可先 SmoothQuant 再 GPTQ</text>

  <!-- Horizontal divider -->
  <line x1="14" y1="268" x2="886" y2="268" stroke="#b8bcb5" stroke-width="1.4" stroke-dasharray="6 4"/>

  <!-- Zone 2: v0.30.0 Ascend Registration & Hardware Routing Matrix -->
  <text x="16" y="296" font-size="16" font-weight="700" fill="#17211f">② v0.30.0 vLLM Ascend 注册表覆盖与硬件分流（同名方案须核对层类型与芯片）</text>

  <!-- Table header -->
  <rect x="16" y="310" width="868" height="32" rx="5" fill="#ece9df" stroke="#b8bcb5" stroke-width="1.2"/>
  <g font-size="14" font-weight="700" fill="#17211f">
    <text x="28" y="331">方案注册名</text>
    <text x="218" y="331">线性层（linear）</text>
    <text x="414" y="331">MoE 专家层（moe）</text>
    <text x="610" y="331">芯片与版本关键边界</text>
  </g>

  <!-- Row 1: W8A8 Static -->
  <rect x="16" y="346" width="868" height="38" rx="5" fill="#ffffff" stroke="#d8d8cf" stroke-width="1.2"/>
  <text x="28" y="370" font-family="var(--font-mono)" font-size="14" font-weight="700" fill="#17211f">W8A8 (静态)</text>
  <text x="218" y="370" font-size="13.5" font-weight="700" fill="#065f56">✓ 离线静态激活</text>
  <text x="414" y="370" font-size="13.5" fill="#8f3229">✗ 仅注册 linear</text>
  <text x="610" y="370" font-size="13.5" fill="#4d5652">须校准覆盖目标输入分布</text>

  <!-- Row 2: W8A8_MIX -->
  <rect x="16" y="388" width="868" height="38" rx="5" fill="#f7e7f2" stroke="#9a4b86" stroke-width="1.2"/>
  <text x="28" y="412" font-family="var(--font-mono)" font-size="14" font-weight="700" fill="#7a3a6a">W8A8_MIX</text>
  <text x="218" y="412" font-size="13.5" font-weight="700" fill="#7a3a6a">✓ P 动态 / D 静态</text>
  <text x="414" y="412" font-size="13.5" font-weight="700" fill="#8f3229">✗ v0.30 已移除注册</text>
  <text x="610" y="412" font-size="13.5" fill="#4d5652">w8a8_pdmix.py 按 _is_kv_consumer 切</text>

  <!-- Row 3: W8A8_DYNAMIC -->
  <rect x="16" y="430" width="868" height="38" rx="5" fill="#ddf4ef" stroke="#087f73" stroke-width="1.3"/>
  <text x="28" y="454" font-family="var(--font-mono)" font-size="14" font-weight="700" fill="#065f56">W8A8_DYNAMIC</text>
  <text x="218" y="454" font-size="13.5" font-weight="700" fill="#065f56">✓ per-token 动态</text>
  <text x="414" y="454" font-size="13.5" font-weight="700" fill="#065f56">✓ 覆盖 MoE 专家</text>
  <text x="610" y="454" font-size="13.5" fill="#065f56">A2/A3 稠密与 MoE 通用主力</text>

  <!-- Row 4: FP8_BLOCK -->
  <rect x="16" y="472" width="868" height="40" rx="5" fill="#fff0e9" stroke="#b54237" stroke-width="1.3"/>
  <text x="28" y="497" font-family="var(--font-mono)" font-size="14" font-weight="700" fill="#8f3229">FP8_BLOCK</text>
  <text x="218" y="497" font-size="13.5" font-weight="700" fill="#065f56">A5 重组 MXFP8</text>
  <text x="414" y="497" font-size="13.5" fill="#936300">A2/A3 v0.30 反量 BF16</text>
  <text x="610" y="497" font-size="13.5" font-weight="700" fill="#8f3229">main 非 A5 启动抛 NotImplementedError</text>
</svg>
