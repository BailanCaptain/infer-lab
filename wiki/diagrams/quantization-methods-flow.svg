<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 430" width="900" height="430" role="img" aria-label="从量化方法到运行还要经过产物和算子契约。PTQ 从已训练模型生成参数，QAT 在训练中模拟误差后导出；加载器读取配套数据，逐层匹配实现并准备布局，才能进入请求前向。">
  <title>从量化方法到运行还要经过产物和算子契约。PTQ 从已训练模型生成参数，QAT 在训练中模拟误差后导出；加载器读取配套数据，逐层匹配实现并准备布局，才能进入请求前向。</title>
  <defs><marker id="quantization-methods-flow-ah-ink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="var(--color-ink, #17211f)"/></marker><marker id="quantization-methods-flow-ah-weight" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="var(--color-weight, #c78300)"/></marker></defs>
  <path d="M195 85 L232 85 L232 55 L270 55" fill="none" stroke="var(--color-ink, #17211f)" stroke-width="1.4" marker-end="url(#quantization-methods-flow-ah-ink)"/>
