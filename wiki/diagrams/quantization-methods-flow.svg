  <path d="M730 135 L730 235 L115 235 L115 300" fill="none" stroke="var(--color-weight, #c78300)" stroke-width="1.4" marker-end="url(#quantization-methods-flow-ah-weight)"/>
  <path d="M195 332 L270 332" fill="none" stroke="var(--color-ink, #17211f)" stroke-width="1.4" marker-end="url(#quantization-methods-flow-ah-ink)"/>
  <path d="M500 332 L595 332" fill="none" stroke="var(--color-ink, #17211f)" stroke-width="1.4" marker-end="url(#quantization-methods-flow-ah-ink)"/>
  <rect x="35" y="65" width="160" height="60" rx="8" fill="var(--color-weight, #c78300)" stroke="var(--color-ink, #17211f)" stroke-width="1.5"/>
  <text x="115" y="100" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="14" font-weight="700" fill="var(--color-ink-inverse, #ffffff)" text-anchor="middle">原始浮点模型</text>
