mode: native-svg
id: quantization-methods-plate-outlier-ruler
caption: >-
  用“巨刺撑大粗木尺压扁全班 vs 平滑压刺 + 分组游标卡尺”秒懂量化方法演进：左侧整张张量共用一把粗刻度木尺（per-tensor）时，只要冒出一根百倍高的离群值巨刺，整把尺的跨度就被迫拉到顶，绝大多数正常小数值全被挤在最底下一格里糊成一团；右侧先用平滑缩放压低激活尖刺（如 SmoothQuant / AWQ 等价转移），再按通道或按小块配独立精密游标卡尺（per-channel / per-group / MXFP 块缩放），让每个数值都能对上清晰刻度。
size: [900, 642]
