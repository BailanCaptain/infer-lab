<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 640" width="900" height="640" role="img" aria-label="MoE EP MC2 dispatch INT8 通信量化与返程 combine BF16 立体拆解剖面引线图">
  <title>MoE EP MC2 通信量化立体拆解：源 NPU 按硬件家族 moe_comm_policy 选入 MC2 后，去程 dispatch 以 quant_mode=2 将隐藏向量就地压成 INT8 并附 4 B FP32 dynamic_scale（通信载荷减半）；专家 NPU 零重复量化直接送入 W8A8 分组矩阵乘；返程 combine 默认 quant_mode=0 回传 BF16。</title>
  <desc>关联源码符号：CAPACITY_AND_EXPERT_DENSITY, FUSED_OR_CAPACITY, ALLGATHER, CAPACITY_AND_WORLD_SIZE, num_experts_per_device, mc2_tokens_capacity, FUSED_MC2, MC2, dispatch_with_quant, get_dst_type, get_scale_type, quant_mode, stage1_kwargs</desc>

  <!-- 紧裁透明底等距拆解剖面主图（零底框、零内层网格笼，大尺寸直浮画布） -->
  <image href="./wiki-illustrations/quantization-mc2-dispatch-cutaway.webp" x="40" y="130" width="820" height="400" preserveAspectRatio="xMidYMid meet"/>

  <!-- 引线与靶点双环圆点（顺时针四站零交叉，精准锚定立体部件空白处不遮字） -->
  <!-- 1 -> SOURCE NPU 的 MC2 DISPATCH 选路入口块左上角（避开 MC2 文字） -->
  <line x1="212" y1="116" x2="216" y2="266" stroke="#4c65b6" stroke-width="1.6"/>
  <circle cx="216" cy="266" r="5.5" fill="#ffffff" stroke="#4c65b6" stroke-width="2"/>
  <circle cx="216" cy="266" r="2.5" fill="#4c65b6"/>

  <!-- 2 -> 上方 DISPATCH · INT8 桥上的 INT8 数据包顶角（避开 INT8 文字） -->
  <line x1="560" y1="116" x2="554" y2="210" stroke="#087f73" stroke-width="1.6"/>
  <circle cx="554" cy="210" r="5.5" fill="#ffffff" stroke="#087f73" stroke-width="2"/>
  <circle cx="554" cy="210" r="2.5" fill="#087f73"/>

  <!-- 3 -> 右侧 EXPERT NPU 的本地 W8 分组矩阵乘块下方金色侧面（避开 W8 文字） -->
  <line x1="665" y1="540" x2="665" y2="366" stroke="#c78300" stroke-width="1.6"/>
  <circle cx="665" cy="366" r="5.5" fill="#ffffff" stroke="#c78300" stroke-width="2"/>
  <circle cx="665" cy="366" r="2.5" fill="#c78300"/>

  <!-- 4 -> 下方 COMBINE · BF16 返程宽体通道 -->
  <line x1="365" y1="540" x2="421" y2="454" stroke="#4c65b6" stroke-width="1.6"/>
  <circle cx="421" cy="454" r="5.5" fill="#ffffff" stroke="#4c65b6" stroke-width="2"/>
  <circle cx="421" cy="454" r="2.5" fill="#4c65b6"/>

  <!-- 顶部开放式无边框矢量编号直标（对齐 18px 正文字阶：标题 15px，说明 13.5–14px） -->
  <g id="mc2-callout-policy">
    <circle cx="28" cy="28" r="12" fill="#4c65b6"/>
    <text x="28" y="32.5" text-anchor="middle" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="12.5" font-weight="700" fill="#ffffff">1</text>
    <text x="48" y="33" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="15" font-weight="700" fill="#17211f">四族通信选路：何时进 MC2</text>
    <text x="48" y="58" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="14" fill="#4d5652">A2 看 num_experts_per_device 与容量选 MC2</text>
    <text x="48" y="82" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="13.5" fill="#4d5652">A3 优先 FUSED_MC2；310P 走 ALLGATHER</text>
    <text x="48" y="105" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="13.5" fill="#66716d">受 mc2_tokens_capacity 等策略阈值控制</text>
  </g>

  <g id="mc2-callout-dispatch">
    <circle cx="480" cy="28" r="12" fill="#087f73"/>
    <text x="480" y="32.5" text-anchor="middle" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="12.5" font-weight="700" fill="#ffffff">2</text>
    <text x="500" y="33" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="15" font-weight="700" fill="#17211f">去程 dispatch (quant_mode=2)：减半</text>
    <text x="500" y="58" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="14" fill="#4d5652">dispatch_with_quant 压 INT8 + 4B 缩放</text>
    <text x="500" y="82" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="13.5" fill="#4d5652">按 get_dst_type / get_scale_type 定格式</text>
    <text x="500" y="105" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="13.5" fill="#66716d">A5 MXFP 路线用 quant_mode=4 发块缩放</text>
  </g>

  <!-- 底部开放式无边框矢量编号直标（y = 546..614） -->
  <g id="mc2-callout-combine">
    <circle cx="28" cy="558" r="12" fill="#4c65b6"/>
    <text x="28" y="562.5" text-anchor="middle" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="12.5" font-weight="700" fill="#ffffff">4</text>
    <text x="48" y="563" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="15" font-weight="700" fill="#17211f">返程 combine (quant_mode=0)：传 BF16</text>
    <text x="48" y="589" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="14" fill="#4d5652">专家输出加权归约，默认回传 BF16 向量</text>
    <text x="48" y="614" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="13.5" fill="#66716d">W8A8MXFP 默认走 4，或显式覆盖配置除外</text>
  </g>

  <g id="mc2-callout-expert">
    <circle cx="480" cy="558" r="12" fill="#c78300"/>
    <text x="480" y="562.5" text-anchor="middle" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="12.5" font-weight="700" fill="#ffffff">3</text>
    <text x="500" y="563" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="15" font-weight="700" fill="#17211f">专家端零重复量化：直入 W8 矩阵乘</text>
    <text x="500" y="589" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="14" fill="#4d5652">stage1_kwargs 直吃收到的 INT8 与缩放</text>
    <text x="500" y="614" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="13.5" fill="#66716d">省掉专家入口动态量化，输出恢复 BF16</text>
  </g>
</svg>
