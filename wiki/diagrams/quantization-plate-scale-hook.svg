<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 570" width="900" height="570" role="img" aria-label="W8A8 量化立体拆解直觉图：对比左侧 BF16 2B 浮点张量、中间 SCALE 缩放标尺、右侧 INT8 1B 整数格、127 CLIP 削顶截断与高精度边界">
  <title>W8A8 量化立体拆解直觉：左侧 BF16 浮点张量（2 B/元素）经共用缩放系数 scale 除以 s 并四舍五入，压入右侧 -128..127 的 INT8 整数格（1 B/元素，存储减半）；超出上限的离群值在 127 CLIP 处被硬截断，矩阵乘累加器、scale 与层间残差仍保高精度。</title>
  <desc>关联源码符号：weight, weight_scale, weight_offset, npu_dynamic_quant, pertoken_scale, npu_quant_matmul, output_dtype</desc>

  <!-- 紧裁透明底等距拆解剖面主图（零底框、零内层网格笼，大尺寸直浮画布） -->
  <image href="./wiki-illustrations/quantization-scale-cutaway.webp" x="45" y="92" width="810" height="387" preserveAspectRatio="xMidYMid meet"/>

  <!-- 引线与靶点双环圆点（全部零交叉，精准锚定立体部件） -->
  <!-- 1 -> 左侧 BF16 浮点宽柱 -->
  <line x1="154" y1="74" x2="196" y2="230" stroke="#B45309" stroke-width="1.6"/>
  <circle cx="196" cy="230" r="5.5" fill="#FFFFFF" stroke="#B45309" stroke-width="2"/>
  <circle cx="196" cy="230" r="2.5" fill="#B45309"/>

  <!-- 2 -> 中央标尺旁黄色 SCALE 吊牌 -->
  <line x1="536" y1="74" x2="556" y2="224" stroke="#1D4ED8" stroke-width="1.6"/>
  <circle cx="556" cy="224" r="5.5" fill="#FFFFFF" stroke="#1D4ED8" stroke-width="2"/>
  <circle cx="556" cy="224" r="2.5" fill="#1D4ED8"/>

  <!-- 3 -> 右上红色 127 CLIP 截断线与虚线削顶 -->
  <line x1="790" y1="74" x2="784" y2="201" stroke="#BE123C" stroke-width="1.6"/>
  <circle cx="784" cy="201" r="5.5" fill="#FFFFFF" stroke="#BE123C" stroke-width="2"/>
  <circle cx="784" cy="201" r="2.5" fill="#BE123C"/>

  <!-- 4 -> 中央变换主箭头（矩阵乘高精度保留边界） -->
  <line x1="436" y1="498" x2="450" y2="297" stroke="#4338CA" stroke-width="1.6"/>
  <circle cx="450" cy="297" r="5.5" fill="#FFFFFF" stroke="#4338CA" stroke-width="2"/>
  <circle cx="450" cy="297" r="2.5" fill="#4338CA"/>

  <!-- 5 -> 右侧 INT8 窄格阶梯柱 -->
  <line x1="660" y1="498" x2="660" y2="365" stroke="#0F766E" stroke-width="1.6"/>
  <circle cx="660" cy="365" r="5.5" fill="#FFFFFF" stroke="#0F766E" stroke-width="2"/>
  <circle cx="660" cy="365" r="2.5" fill="#0F766E"/>

  <!-- 顶部开放式无边框矢量编号直标（y = 8..74） -->
  <g id="callout-bf16">
    <circle cx="28" cy="22" r="11" fill="#B45309"/>
    <text x="28" y="26.5" text-anchor="middle" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="12" font-weight="700" fill="#FFFFFF">1</text>
    <text x="46" y="26" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="13" font-weight="700" fill="#17211f">原始浮点张量（BF16 · 2 B/元素）</text>
    <text x="46" y="46" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="11.5" fill="#475569">连续幅度宽柱，占双倍显存与访存带宽</text>
    <text x="46" y="64" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="11.5" fill="#475569">权重离线量化，激活经 npu_dynamic_quant 现算</text>
  </g>

  <g id="callout-scale">
    <circle cx="322" cy="22" r="11" fill="#1D4ED8"/>
    <text x="322" y="26.5" text-anchor="middle" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="12" font-weight="700" fill="#FFFFFF">2</text>
    <text x="340" y="26" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="13" font-weight="700" fill="#17211f">共用缩放标尺与 scale 系数</text>
    <text x="340" y="46" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="11.5" fill="#475569">整组除以 s 并四舍五入，卡入 -128..127 离散格</text>
    <text x="340" y="64" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="11.5" fill="#475569">仅附少量高精 weight_scale 与 pertoken_scale</text>
  </g>

  <g id="callout-clip">
    <circle cx="622" cy="22" r="11" fill="#BE123C"/>
    <text x="622" y="26.5" text-anchor="middle" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="12" font-weight="700" fill="#FFFFFF">3</text>
    <text x="640" y="26" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="13" font-weight="700" fill="#17211f">离群值削顶截断（127 CLIP）</text>
    <text x="640" y="46" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="11.5" fill="#475569">超出上限的极端大数被硬截到整数格边 127</text>
    <text x="640" y="64" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="11.5" fill="#BE123C">虚线溢出部分丢失，产生不可逆截断误差</text>
  </g>

  <!-- 底部开放式无边框矢量编号直标（y = 498..560） -->
  <g id="callout-boundary">
    <circle cx="28" cy="514" r="11" fill="#4338CA"/>
    <text x="28" y="518.5" text-anchor="middle" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="12" font-weight="700" fill="#FFFFFF">4</text>
    <text x="46" y="518" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="13" font-weight="700" fill="#17211f">W8A8 高精边界：仅矩阵乘两侧压 8 位</text>
    <text x="46" y="538" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="11.5" fill="#475569">npu_quant_matmul 用宽累加器，乘回系数后恢复</text>
    <text x="46" y="556" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="11.5" fill="#475569">output_dtype（BF16）与层间高精度残差隐藏向量</text>
  </g>

  <g id="callout-int8">
    <circle cx="472" cy="514" r="11" fill="#0F766E"/>
    <text x="472" y="518.5" text-anchor="middle" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="12" font-weight="700" fill="#FFFFFF">5</text>
    <text x="490" y="518" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="13" font-weight="700" fill="#17211f">量化整数块（INT8 · 1 B/元素）：存储减半</text>
    <text x="490" y="538" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="11.5" fill="#475569">托盘挂留高精 scale，用时乘回恢复原数值范围</text>
    <text x="490" y="556" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="11.5" fill="#475569">未截断元素微差仅为最多半格（s / 2）舍入误差</text>
  </g>
</svg>
