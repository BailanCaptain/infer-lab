<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 636" width="900" height="636" role="img" aria-label="W8A8 量化立体拆解直觉图：对比左侧 BF16 2B 浮点张量、中间 SCALE 缩放标尺、右侧 INT8 1B 整数格、127 CLIP 削顶截断与高精度边界">
  <title>W8A8 量化立体拆解直觉：左侧 BF16 浮点张量（2 B/元素）经共用缩放系数 scale 除以 s 并四舍五入，压入右侧 -128..127 的 INT8 整数格（1 B/元素，存储减半）；超出上限的离群值在 127 CLIP 处被硬截断，矩阵乘累加器、scale 与层间残差仍保高精度。</title>
  <desc>关联源码符号：weight, weight_scale, weight_offset, npu_dynamic_quant, pertoken_scale, npu_quant_matmul, output_dtype</desc>

  <!-- 紧裁透明底等距拆解剖面主图（零底框、零内层网格笼，大尺寸直浮画布） -->
  <image href="./wiki-illustrations/quantization-scale-cutaway.webp" x="45" y="130" width="810" height="387" preserveAspectRatio="xMidYMid meet"/>

  <!-- 引线与靶点双环圆点（全部零交叉，精准锚定立体部件） -->
  <!-- 1 -> 左侧 BF16 浮点宽柱 -->
  <line x1="154" y1="114" x2="196" y2="268" stroke="#c78300" stroke-width="1.6"/>
  <circle cx="196" cy="268" r="5.5" fill="#ffffff" stroke="#c78300" stroke-width="2"/>
  <circle cx="196" cy="268" r="2.5" fill="#c78300"/>

  <!-- 2 -> 中央标尺旁黄色 SCALE 吊牌 -->
  <line x1="510" y1="114" x2="556" y2="262" stroke="#4c65b6" stroke-width="1.6"/>
  <circle cx="556" cy="262" r="5.5" fill="#ffffff" stroke="#4c65b6" stroke-width="2"/>
  <circle cx="556" cy="262" r="2.5" fill="#4c65b6"/>

  <!-- 3 -> 右上红色 127 CLIP 截断线与虚线削顶 -->
  <line x1="760" y1="94" x2="784" y2="239" stroke="#b54237" stroke-width="1.6"/>
  <circle cx="784" cy="239" r="5.5" fill="#ffffff" stroke="#b54237" stroke-width="2"/>
  <circle cx="784" cy="239" r="2.5" fill="#b54237"/>

  <!-- 4 -> 中央变换主箭头（矩阵乘高精度保留边界） -->
  <line x1="410" y1="538" x2="450" y2="335" stroke="#4c65b6" stroke-width="1.6"/>
  <circle cx="450" cy="335" r="5.5" fill="#ffffff" stroke="#4c65b6" stroke-width="2"/>
  <circle cx="450" cy="335" r="2.5" fill="#4c65b6"/>

  <!-- 5 -> 右侧 INT8 窄格阶梯柱 -->
  <line x1="660" y1="538" x2="660" y2="403" stroke="#087f73" stroke-width="1.6"/>
  <circle cx="660" cy="403" r="5.5" fill="#ffffff" stroke="#087f73" stroke-width="2"/>
  <circle cx="660" cy="403" r="2.5" fill="#087f73"/>

  <!-- 顶部开放式无边框矢量编号直标（对齐 18px 正文字阶：标题 15px，说明 13.5px） -->
  <g id="callout-bf16">
    <circle cx="28" cy="28" r="12" fill="#c78300"/>
    <text x="28" y="32.5" text-anchor="middle" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="12.5" font-weight="700" fill="#ffffff">1</text>
    <text x="48" y="33" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="15" font-weight="700" fill="#17211f">原始浮点 (BF16 · 2B)</text>
    <text x="48" y="58" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="13.5" fill="#4d5652">离线压 weight，占双倍带宽</text>
    <text x="48" y="81" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="13.5" fill="#4d5652">激活走 npu_dynamic_quant</text>
    <text x="48" y="104" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="13.5" fill="#66716d">动态乘忽略 weight_offset</text>
  </g>

  <g id="callout-scale">
    <circle cx="320" cy="28" r="12" fill="#4c65b6"/>
    <text x="320" y="32.5" text-anchor="middle" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="12.5" font-weight="700" fill="#ffffff">2</text>
    <text x="340" y="33" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="15" font-weight="700" fill="#17211f">共用标尺与缩放系数</text>
    <text x="340" y="58" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="13.5" fill="#4d5652">整组除 s 舍入 -128..127</text>
    <text x="340" y="81" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="13.5" fill="#4d5652">权重附高精 weight_scale</text>
    <text x="340" y="104" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="13.5" fill="#4d5652">激活附 pertoken_scale</text>
  </g>

  <g id="callout-clip">
    <circle cx="618" cy="28" r="12" fill="#b54237"/>
    <text x="618" y="32.5" text-anchor="middle" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="12.5" font-weight="700" fill="#ffffff">3</text>
    <text x="638" y="33" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="15" font-weight="700" fill="#17211f">离群值削顶 (127 CLIP)</text>
    <text x="638" y="58" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="13.5" fill="#4d5652">超界大数硬截到格边 127</text>
    <text x="638" y="81" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="13.5" fill="#b54237">虚线溢出丢失，不可逆截断</text>
  </g>

  <!-- 底部开放式无边框矢量编号直标（y = 542..614） -->
  <g id="callout-boundary">
    <circle cx="28" cy="554" r="12" fill="#4c65b6"/>
    <text x="28" y="558.5" text-anchor="middle" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="12.5" font-weight="700" fill="#ffffff">4</text>
    <text x="48" y="559" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="15" font-weight="700" fill="#17211f">高精边界：仅矩阵乘两侧压 8 位</text>
    <text x="48" y="585" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="14" fill="#4d5652">npu_quant_matmul 宽累加后乘回系数</text>
    <text x="48" y="610" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="14" fill="#4d5652">恢复 output_dtype (BF16) 与层间残差</text>
  </g>

  <g id="callout-int8">
    <circle cx="472" cy="554" r="12" fill="#087f73"/>
    <text x="472" y="558.5" text-anchor="middle" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="12.5" font-weight="700" fill="#ffffff">5</text>
    <text x="492" y="559" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="15" font-weight="700" fill="#17211f">量化整数格 (INT8 · 1B)：存储减半</text>
    <text x="492" y="585" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="14" fill="#4d5652">托盘挂高精缩放系数，用时乘回恢复范围</text>
    <text x="492" y="610" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="14" fill="#4d5652">未超界元素至多半格 (s / 2) 舍入误差</text>
  </g>
</svg>
