<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 710" width="900" height="710" role="img" aria-label="v0.30.0 量化字节比例与硬件落点总览：上栏对比权重显存压缩与原生 fp8_block 跨芯片落点，下栏对比 MoE EP MC2 dispatch 在 quant_mode=2 下的单副本通信载荷减半。" font-family="var(--font-sans)">
  <title>v0.30.0（c09d3e20）量化字节比例与硬件落点总览：上栏对比 Qwen3-8B 单层 o_proj（32 MiB 压至 16 MiB + 16 KiB ≈ 50.05%）、Qwen3-30B-A3B EP8 单卡单层 16 专家（144 MiB 压至 72.0 MiB + 320 KiB ≈ 0.43%，48 层 6.75 GiB → 3.375 GiB），以及原生 fp8_block 在 Ascend 950 重组 MXFP8（~51.6%）与在 Atlas A2/A3 静默展开回 BF16（100% 零节省）的反差；下栏对比 MoE EP MC2 dispatch 在 quant_mode=2 下单副本载荷（H=2048：4,096 B → 2,052 B ≈ 50.10%；H=4096：8,192 B → 4,100 B ≈ 50.05%，返程 combine 默认 quant_mode=0 仍传 BF16）。</title>
  <desc>关联源码符号：get_weight, get_perchannel_param, weight_scale, weight_offset, w13_weight, w2_weight, w13_weight_scale_fp32, w2_weight_scale, process_weights_after_loading, resolve_block_scales, _mx_quantize, mxfp8_method, dispatch_with_quant, quant_mode, npu_moe_distribute_dispatch_v2, dynamic_scale, combine_quant_mode, W8A8MXFP</desc>
  <defs>
    <marker id="ah-comm" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse">
      <path d="M 0 1 L 9.5 5 L 0 9 z" fill="#9a4b86"/>
    </marker>
  </defs>

  <!-- 上栏：权重显存压缩比例与原生 FP8 硬件落点 -->
  <g id="panel-weights">
    <circle cx="30" cy="28" r="12" fill="#c78300"/>
    <text x="30" y="33" font-size="12.5" font-weight="700" fill="#ffffff" text-anchor="middle">1</text>
    <text x="50" y="34" font-size="16" font-weight="700" fill="#17211f">权重显存压缩比例与原生 FP8 硬件落点（v0.30.0）</text>

    <!-- 组 1：Qwen3-8B 单层 o_proj -->
    <text x="20" y="64" font-size="14.5" font-weight="700" fill="#17211f">Qwen3-8B 单层 o_proj（4096 × 4096 = 16,777,216 元素）</text>
    <text x="20" y="92" font-size="14" font-weight="600" fill="#66716d">BF16</text>
    <rect x="82" y="73" width="380" height="26" rx="4" fill="#ece9df" stroke="#17211f" stroke-width="1.3"/>
    <text x="272" y="91" font-size="14" font-weight="700" fill="#17211f" text-anchor="middle">32 MiB（100%）</text>
    <text x="478" y="91" font-size="13.5" fill="#66716d">33,554,432 B（2 B / 元素）</text>

    <text x="20" y="126" font-size="14" font-weight="700" fill="#936300">INT8</text>
    <rect x="82" y="107" width="190" height="26" rx="4" fill="#c78300" stroke="#17211f" stroke-width="1.3"/>
    <text x="177" y="125" font-size="14" font-weight="700" fill="#ffffff" text-anchor="middle">16 MiB</text>
    <rect x="274" y="107" width="6" height="26" rx="1.5" fill="#936300"/>
    <rect x="283" y="107" width="179" height="26" rx="4" fill="none" stroke="#b8bcb5" stroke-width="1.2" stroke-dasharray="4 4"/>
    <text x="372" y="125" font-size="13.5" fill="#66716d" text-anchor="middle">省 ~50%</text>
    <text x="478" y="125" font-size="13.5" font-weight="700" fill="#936300">+ 16 KiB scale / offset（共占 50.05%）</text>

    <!-- 组 2：Qwen3-30B-A3B EP8 单卡单层 16 专家 -->
    <text x="20" y="164" font-size="14.5" font-weight="700" fill="#17211f">Qwen3-30B-A3B EP8 单卡单层 16 专家（w13_weight + w2_weight）</text>
    <text x="20" y="192" font-size="14" font-weight="600" fill="#66716d">BF16</text>
    <rect x="82" y="173" width="380" height="26" rx="4" fill="#ece9df" stroke="#17211f" stroke-width="1.3"/>
    <text x="272" y="191" font-size="14" font-weight="700" fill="#17211f" text-anchor="middle">144 MiB / 层（100%）</text>
    <text x="478" y="191" font-size="13.5" fill="#66716d">48 层共 6.75 GiB 路由专家权重</text>

    <text x="20" y="226" font-size="14" font-weight="700" fill="#936300">INT8</text>
    <rect x="82" y="207" width="190" height="26" rx="4" fill="#c78300" stroke="#17211f" stroke-width="1.3"/>
    <text x="177" y="225" font-size="14" font-weight="700" fill="#ffffff" text-anchor="middle">72.0 MiB</text>
    <rect x="274" y="207" width="6" height="26" rx="1.5" fill="#936300"/>
    <rect x="283" y="207" width="179" height="26" rx="4" fill="none" stroke="#b8bcb5" stroke-width="1.2" stroke-dasharray="4 4"/>
    <text x="372" y="225" font-size="13.5" fill="#66716d" text-anchor="middle">省 ~50%</text>
    <text x="478" y="225" font-size="13.5" font-weight="700" fill="#936300">48 层 3.375 GiB + 320 KiB 缩放（占 0.43%）</text>

    <!-- 组 3：红框警示条（原生 fp8_block 跨芯片落点对比） -->
    <rect x="20" y="248" width="860" height="122" rx="8" fill="#fff0e9" stroke="#b54237" stroke-width="1.4"/>
    <text x="36" y="272" font-size="14.5" font-weight="700" fill="#8f3229">原生 fp8_block 跨芯片落点对比（勿默认省一半显存！）</text>

    <text x="36" y="303" font-size="14" font-weight="700" fill="#936300">Ascend 950</text>
    <rect x="140" y="284" width="176" height="26" rx="4" fill="#c78300" stroke="#17211f" stroke-width="1.2"/>
    <text x="228" y="302" font-size="13.5" font-weight="700" fill="#ffffff" text-anchor="middle">重组 MXFP8</text>
    <rect x="318" y="284" width="6" height="26" rx="1.5" fill="#936300"/>
    <rect x="327" y="284" width="153" height="26" rx="4" fill="none" stroke="#b8bcb5" stroke-width="1.2" stroke-dasharray="4 4"/>
    <text x="496" y="302" font-size="13.5" font-weight="700" fill="#936300">~51.6%（1.031 B / 元素，_mx_quantize）</text>

    <text x="36" y="337" font-size="14" font-weight="700" fill="#8f3229">Atlas A2/A3</text>
    <rect x="140" y="318" width="340" height="26" rx="4" fill="#b54237" stroke="#17211f" stroke-width="1.2"/>
    <text x="310" y="336" font-size="13.5" font-weight="700" fill="#ffffff" text-anchor="middle">v0.30.0 静默展开回 BF16（零节省！）</text>
    <text x="496" y="336" font-size="13.5" font-weight="700" fill="#8f3229">100% 占满 · 310P 不注册 AscendFp8Config</text>
    <text x="36" y="360" font-size="13.5" fill="#8f3229">社区 main 在 A2 / A3 已改为加载期直接抛 NotImplementedError，请改选 ModelSlim W8A8</text>
  </g>

  <line x1="20" y1="390" x2="880" y2="390" stroke="#b8bcb5" stroke-width="1.5" stroke-dasharray="6 5"/>

  <!-- 下栏：MoE EP MC2 dispatch 单副本通信载荷减半 -->
  <g id="panel-dispatch">
    <circle cx="30" cy="418" r="12" fill="#9a4b86"/>
    <text x="30" y="423" font-size="12.5" font-weight="700" fill="#ffffff" text-anchor="middle">2</text>
    <text x="50" y="424" font-size="16" font-weight="700" fill="#17211f">MoE EP MC2 dispatch 单副本通信载荷（quant_mode = 2）</text>

    <!-- 三步水平流转 -->
    <rect x="20" y="442" width="256" height="52" rx="7" fill="#ddf4ef" stroke="#087f73" stroke-width="1.4"/>
    <text x="148" y="464" font-size="14.5" font-weight="700" fill="#065f56" text-anchor="middle">源卡隐藏向量 BF16 [1, H]</text>
    <text x="148" y="485" font-size="13.5" font-family="var(--font-mono)" fill="#065f56" text-anchor="middle">dispatch_with_quant</text>
    <line x1="276" y1="468" x2="314" y2="468" stroke="#9a4b86" stroke-width="1.6" marker-end="url(#ah-comm)"/>

    <rect x="320" y="442" width="268" height="52" rx="7" fill="#9a4b86" stroke="#17211f" stroke-width="1.4"/>
    <text x="454" y="464" font-size="14.5" font-weight="700" fill="#ffffff" text-anchor="middle">MC2 就地压成 INT8 + 4B scale</text>
    <text x="454" y="485" font-size="13.5" font-family="var(--font-mono)" fill="#ffffff" text-anchor="middle">npu_moe_distribute_dispatch_v2</text>
    <line x1="588" y1="468" x2="626" y2="468" stroke="#9a4b86" stroke-width="1.6" marker-end="url(#ah-comm)"/>

    <rect x="632" y="442" width="248" height="52" rx="7" fill="#ece9df" stroke="#17211f" stroke-width="1.4"/>
    <text x="756" y="464" font-size="14.5" font-weight="700" fill="#17211f" text-anchor="middle">专家卡直接复用 INT8 激活</text>
    <text x="756" y="485" font-size="13.5" fill="#66716d" text-anchor="middle">省去专家入口重复动态量化</text>

    <!-- H = 2048 与 H = 4096 并排比例条 -->
    <text x="20" y="524" font-size="14.5" font-weight="700" fill="#17211f">H = 2048（Qwen3-30B-A3B）</text>
    <text x="20" y="552" font-size="14" font-weight="600" fill="#66716d">BF16</text>
    <rect x="82" y="533" width="180" height="26" rx="4" fill="#ece9df" stroke="#17211f" stroke-width="1.3"/>
    <text x="172" y="551" font-size="14" font-weight="700" fill="#17211f" text-anchor="middle">4,096 B</text>
    <text x="274" y="551" font-size="13.5" fill="#66716d">2048 × 2 B</text>

    <text x="20" y="586" font-size="14" font-weight="700" fill="#7a3a6a">INT8</text>
    <rect x="82" y="567" width="90" height="26" rx="4" fill="#9a4b86" stroke="#17211f" stroke-width="1.3"/>
    <text x="127" y="585" font-size="13.5" font-weight="700" fill="#ffffff" text-anchor="middle">2,048 B</text>
    <rect x="174" y="567" width="6" height="26" rx="1.5" fill="#087f73"/>
    <rect x="183" y="567" width="79" height="26" rx="4" fill="none" stroke="#b8bcb5" stroke-width="1.2" stroke-dasharray="4 4"/>
    <text x="274" y="585" font-size="13.5" font-weight="700" fill="#7a3a6a">2,052 B（50.10%）</text>

    <text x="454" y="524" font-size="14.5" font-weight="700" fill="#17211f">H = 4096（通用如 GLM）</text>
    <text x="454" y="552" font-size="14" font-weight="600" fill="#66716d">BF16</text>
    <rect x="516" y="533" width="220" height="26" rx="4" fill="#ece9df" stroke="#17211f" stroke-width="1.3"/>
    <text x="626" y="551" font-size="14" font-weight="700" fill="#17211f" text-anchor="middle">8,192 B（100%）</text>
    <text x="748" y="551" font-size="13.5" fill="#66716d">4096 × 2 B</text>

    <text x="454" y="586" font-size="14" font-weight="700" fill="#7a3a6a">INT8</text>
    <rect x="516" y="567" width="110" height="26" rx="4" fill="#9a4b86" stroke="#17211f" stroke-width="1.3"/>
    <text x="571" y="585" font-size="13.5" font-weight="700" fill="#ffffff" text-anchor="middle">4,096 B</text>
    <rect x="628" y="567" width="6" height="26" rx="1.5" fill="#087f73"/>
    <rect x="637" y="567" width="99" height="26" rx="4" fill="none" stroke="#b8bcb5" stroke-width="1.2" stroke-dasharray="4 4"/>
    <text x="748" y="585" font-size="13.5" font-weight="700" fill="#7a3a6a">4,100 B（50.05%）</text>

    <text x="20" y="616" font-size="13.5" fill="#065f56">青色细边：每 token 附带 1 个 FP32 dynamic_scale（+4 B），随数据包一并发往专家卡</text>

    <!-- Combine 返程说明 -->
    <rect x="20" y="632" width="860" height="62" rx="7" fill="#f7e7f2" stroke="#9a4b86" stroke-opacity="0.5" stroke-width="1.3"/>
    <text x="36" y="656" font-size="14" font-weight="700" fill="#7a3a6a">返程 combine 阶段默认 quant_mode = 0（仍回传 BF16）：整数方案仅减半去程 dispatch</text>
    <text x="36" y="680" font-size="13.5" fill="#17211f">仅 W8A8MXFP 默认 combine = 4，或显式配置 combine_quant_mode 时才会压缩返程载荷</text>
  </g>
</svg>
