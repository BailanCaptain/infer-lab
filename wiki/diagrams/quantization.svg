  <title>ModelSlim 量化权重从模型目录走到一个线性层的 apply：先被自动认出来，再逐层查 (量化类型, 层类型) 这一对，最后走 int8 矩阵乘（v0.23 维护分支）</title>
  <rect width="900" height="760" fill="var(--color-surface, #fbfaf6)"/>
  <rect x="20" y="40" width="860" height="190" rx="12" fill="var(--color-weight-soft, #fff4cf)"/>
