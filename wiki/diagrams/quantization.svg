  <text x="240" y="261.7" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="13" font-weight="700" fill="#936300" text-anchor="middle">0.3</text>
  <rect x="317" y="235" width="130" height="44" rx="4" fill="var(--color-weight-soft, #fff4cf)" stroke="var(--color-weight, #c78300)" stroke-opacity="0.4" stroke-width="1.3"/>
  <text x="382" y="261.7" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="13" font-weight="700" fill="#936300" text-anchor="middle">1.0</text>
  <rect x="459" y="235" width="130" height="44" rx="4" fill="var(--color-weight-soft, #fff4cf)" stroke="var(--color-weight, #c78300)" stroke-opacity="0.4" stroke-width="1.3"/>
