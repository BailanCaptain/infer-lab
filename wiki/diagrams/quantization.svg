<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 340" width="900" height="340" role="img" aria-label="四个数按缩放系数 0.1 压成 INT8 再还原（示意）：除以 0.1、舍入成整数，用时乘回 0.1。前三个只差一点舍入误差；13 算出 130，超过上限 127，只能存成 127，还原成 12.7。">
  <title>四个数按缩放系数 0.1 压成 INT8 再还原（示意）：除以 0.1、舍入成整数，用时乘回 0.1。前三个只差一点舍入误差；13 算出 130，超过上限 127，只能存成 127，还原成 12.7。</title>
