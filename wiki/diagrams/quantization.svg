  <text x="38" y="319" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="12.5" font-weight="400" fill="var(--color-ink-muted, #5b6763)">右边三排格子是 v0.23 上真实注册过的实现条数。同一个类型名在 linear 上有、在 moe 上不一定有，缺的那格会在建层时抛 </text>
