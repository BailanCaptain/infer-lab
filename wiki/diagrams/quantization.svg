  <text x="38" y="97" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="12.5" font-weight="400" fill="var(--color-ink-muted, #5b6763)">模型目录里有那个 json，平台层在配置检查里就自己把 quantization 置成 ascend——命令行那个参数不是必需品，只是显式写法。</text>
