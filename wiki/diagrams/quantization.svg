<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 250" width="900" height="250" role="img" aria-label="一颗 NPU 上的权重：换成 W8A8 之后，专家那一大段折半，整体从约 32.6 GiB 降到约 17 GiB">
  <title>一颗 NPU 上的权重：换成 W8A8 之后，专家那一大段折半，整体从约 32.6 GiB 降到约 17 GiB</title>
  <defs></defs>
  <rect x="150" y="72" width="300" height="34" rx="4" fill="var(--color-weight, #c78300)" stroke="var(--color-ink, #17211f)" stroke-width="1.3"/>
  <text x="166" y="94" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="13" font-weight="700" fill="var(--color-ink-inverse, #ffffff)">专家 30 GiB</text>
  <rect x="450" y="72" width="26" height="34" rx="4" fill="var(--color-control, #66716d)" stroke="var(--color-ink, #17211f)" stroke-width="1.3"/>
  <rect x="150" y="66" width="640" height="46" rx="7" fill="none" stroke="var(--color-kv, #4c65b6)" stroke-width="2.2"/>
  <text x="790" y="56" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="13" font-weight="700" fill="var(--color-kv, #4c65b6)" text-anchor="end">一颗 NPU 64 GiB</text>
  <rect x="150" y="152" width="150" height="34" rx="4" fill="var(--color-weight, #c78300)" stroke="var(--color-ink, #17211f)" stroke-width="1.3"/>
  <text x="166" y="174" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="13" font-weight="700" fill="var(--color-ink-inverse, #ffffff)">专家 15 GiB</text>
  <rect x="300" y="152" width="22" height="34" rx="4" fill="var(--color-control, #66716d)" stroke="var(--color-ink, #17211f)" stroke-width="1.3"/>
  <rect x="150" y="146" width="640" height="46" rx="7" fill="none" stroke="var(--color-kv, #4c65b6)" stroke-width="2.2"/>
  <rect x="150" y="218" width="18" height="18" rx="8" fill="var(--color-control, #66716d)" stroke="var(--color-ink, #17211f)" stroke-width="1.5"/>
  <text x="30" y="95" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="15" font-weight="700" fill="var(--color-ink, #17211f)">bf16</text>
  <text x="30" y="175" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="15" font-weight="700" fill="var(--color-ink, #17211f)">W8A8</text>
  <text x="490" y="95" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="14" font-weight="400" fill="var(--color-ink, #17211f)">约 32.6 GiB</text>
  <text x="336" y="175" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="14" font-weight="700" fill="#936300">约 17 GiB</text>
  <text x="178" y="232" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="13" font-weight="400" fill="var(--color-ink, #17211f)">注意力、词表等其余权重</text>
</svg>
