layout: figure
id: quantization
caption: 四个数按缩放系数 0.1 压成 INT8 再还原（示意）：除以 0.1、舍入成整数，用时乘回 0.1。前三个只差一点舍入误差；13 算出 130，超过上限 127，只能存成 127，还原成 12.7。
