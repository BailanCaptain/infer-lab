    symbols: [quant_bias, deq_scale, weight_scale, weight_offset]
  - source: vllm-ascend@2c59ff10:vllm_ascend/quantization/methods/w8a8_static.py#L142-L157
    symbols: [process_weights_after_loading, maybe_trans_nz]
  - source: vllm-ascend@2c59ff10:vllm_ascend/quantization/methods/w8a8_static.py#L108-L140
