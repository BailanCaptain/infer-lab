<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 468" width="900" height="468" role="img" aria-label="从入口到设备核函数的 5 步源码走读流水线、三条问题追查路线与跨版本核验边界">
  <defs>
    <marker id="arr-dark" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,1 L9,5 L0,9 z" fill="#4d5652"/>
    </marker>
  </defs>

  <text x="20" y="28" font-family="sans-serif" font-size="16" font-weight="700" fill="#17211f">5 步源码走读流水线：用三条问题路线穿透入口、配置、分派与同步点</text>

  <rect x="20" y="42" width="860" height="36" rx="8" fill="#f7f5ef" stroke="#d8d8cf" stroke-width="1"/>
  <circle cx="44" cy="60" r="6" fill="#087f73"/>
  <text x="58" y="65" font-family="sans-serif" font-size="13.5" font-weight="700" fill="#065f56">路线一 · 数据流</text>
  <text x="166" y="65" font-family="sans-serif" font-size="13.5" fill="#4d5652">(张量/设备/dtype)</text>

  <circle cx="316" cy="60" r="6" fill="#c78300"/>
  <text x="330" y="65" font-family="sans-serif" font-size="13.5" font-weight="700" fill="#936300">路线二 · 配置流</text>
  <text x="438" y="65" font-family="sans-serif" font-size="13.5" fill="#4d5652">(合并→改写→消费)</text>

  <circle cx="592" cy="60" r="6" fill="#4c65b6"/>
  <text x="606" y="65" font-family="sans-serif" font-size="13.5" font-weight="700" fill="#3a4f93">路线三 · 实现流</text>
  <text x="714" y="65" font-family="sans-serif" font-size="13.5" fill="#4d5652">(调用→注册→分派)</text>

  <rect x="20" y="96" width="154" height="218" rx="9" fill="#fff4cf" stroke="#c78300" stroke-width="1.5"/>
  <rect x="20" y="96" width="154" height="34" rx="9" fill="#c78300"/>
  <rect x="20" y="118" width="154" height="12" fill="#c78300"/>
  <text x="97" y="119" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="700" fill="#ffffff">① 锁版本与入口</text>
  <circle cx="36" cy="147" r="5" fill="#c78300"/>
  <circle cx="52" cy="147" r="5" fill="#4c65b6"/>
  <text x="64" y="152" font-family="sans-serif" font-size="13.5" fill="#936300">启动定位</text>
  <text x="32" y="178" font-family="sans-serif" font-size="13.5" font-weight="700" fill="#17211f">固定双仓 Commit</text>
  <text x="32" y="200" font-family="monospace" font-size="13.5" fill="#4d5652">__init__.py</text>
  <text x="32" y="220" font-family="monospace" font-size="13.5" fill="#4d5652">entry_points</text>
  <line x1="32" y1="236" x2="162" y2="236" stroke="#c78300" stroke-opacity="0.35" stroke-width="1"/>
  <text x="32" y="258" font-family="monospace" font-size="13.5" font-weight="600" fill="#936300">HardwareProfile</text>
  <text x="32" y="280" font-family="sans-serif" font-size="13.5" fill="#4d5652">先查设备能力档案</text>
  <text x="32" y="300" font-family="sans-serif" font-size="13.5" fill="#4d5652">与 NPUPlatform</text>

  <line x1="174" y1="204" x2="193" y2="204" stroke="#4d5652" stroke-width="1.8" marker-end="url(#arr-dark)"/>

  <rect x="197" y="96" width="154" height="218" rx="9" fill="#fff4cf" stroke="#c78300" stroke-width="1.5"/>
  <rect x="197" y="96" width="154" height="34" rx="9" fill="#c78300"/>
  <rect x="197" y="118" width="154" height="12" fill="#c78300"/>
  <text x="274" y="119" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="700" fill="#ffffff">② 配置与补丁</text>
  <circle cx="213" cy="147" r="5" fill="#c78300"/>
  <text x="226" y="152" font-family="sans-serif" font-size="13.5" fill="#936300">路线二主战</text>
  <text x="207" y="178" font-family="sans-serif" font-size="13.5" font-weight="700" fill="#17211f">Pydantic 校验合并</text>
  <text x="207" y="200" font-family="sans-serif" font-size="12" fill="#4d5652">FLASHCOMM1 逻辑 OR</text>
  <text x="207" y="220" font-family="sans-serif" font-size="13" fill="#4d5652">旧版 9 键 JSON&gt;Env</text>
  <line x1="209" y1="236" x2="339" y2="236" stroke="#c78300" stroke-opacity="0.35" stroke-width="1"/>
  <text x="209" y="258" font-family="monospace" font-size="13.5" font-weight="600" fill="#936300">patch/ 条件导入</text>
  <text x="209" y="280" font-family="sans-serif" font-size="13.5" fill="#4d5652">核对芯片与版本</text>
  <text x="209" y="300" font-family="sans-serif" font-size="13.5" fill="#4d5652">是否命中当前环境</text>

  <line x1="351" y1="204" x2="370" y2="204" stroke="#4d5652" stroke-width="1.8" marker-end="url(#arr-dark)"/>

  <rect x="374" y="96" width="154" height="218" rx="9" fill="#ddf4ef" stroke="#087f73" stroke-width="1.5"/>
  <rect x="374" y="96" width="154" height="34" rx="9" fill="#087f73"/>
  <rect x="374" y="118" width="154" height="12" fill="#087f73"/>
  <text x="451" y="119" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="700" fill="#ffffff">③ Runner 拼输入</text>
  <circle cx="390" cy="147" r="5" fill="#087f73"/>
  <text x="403" y="152" font-family="sans-serif" font-size="13.5" fill="#065f56">路线一主战</text>
  <text x="386" y="178" font-family="sans-serif" font-size="13.5" font-weight="700" fill="#17211f">先判 V1 / V2 分支</text>
  <text x="386" y="200" font-family="monospace" font-size="13.5" fill="#4d5652">USE_V2_RUNNER</text>
  <text x="386" y="220" font-family="sans-serif" font-size="13.5" fill="#4d5652">main 已全迁 v2</text>
  <line x1="386" y1="236" x2="516" y2="236" stroke="#087f73" stroke-opacity="0.35" stroke-width="1"/>
  <text x="386" y="258" font-family="sans-serif" font-size="13.5" font-weight="600" fill="#065f56">记边界输入与状态</text>
  <text x="386" y="280" font-family="sans-serif" font-size="13.5" fill="#4d5652">token · pos · 块表</text>
  <text x="386" y="300" font-family="sans-serif" font-size="13.5" fill="#4d5652">设备迁移与 dtype</text>

  <line x1="528" y1="204" x2="547" y2="204" stroke="#4d5652" stroke-width="1.8" marker-end="url(#arr-dark)"/>

  <rect x="551" y="96" width="154" height="218" rx="9" fill="#e8edff" stroke="#4c65b6" stroke-width="1.5"/>
  <rect x="551" y="96" width="154" height="34" rx="9" fill="#4c65b6"/>
  <rect x="551" y="118" width="154" height="12" fill="#4c65b6"/>
  <text x="628" y="119" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="700" fill="#ffffff">④ 6 路扩展分派</text>
  <circle cx="567" cy="147" r="5" fill="#4c65b6"/>
  <text x="580" y="152" font-family="sans-serif" font-size="13.5" fill="#3a4f93">路线三主战</text>
  <text x="563" y="178" font-family="sans-serif" font-size="13.5" font-weight="700" fill="#17211f">看调用写法追下站</text>
  <text x="563" y="200" font-family="sans-serif" font-size="13.5" fill="#4d5652">模型注册 / 派生类</text>
  <text x="563" y="220" font-family="sans-serif" font-size="13.5" fill="#4d5652">层直报 / 平台查表</text>
  <line x1="563" y1="236" x2="693" y2="236" stroke="#4c65b6" stroke-opacity="0.35" stroke-width="1"/>
  <text x="563" y="258" font-family="monospace" font-size="13.5" font-weight="600" fill="#3a4f93">CustomOp OOT</text>
  <text x="563" y="280" font-family="sans-serif" font-size="13.5" fill="#4d5652">查 REGISTERED_</text>
  <text x="563" y="300" font-family="sans-serif" font-size="13.5" fill="#4d5652">ASCEND_OPS 表</text>

  <line x1="705" y1="204" x2="724" y2="204" stroke="#4d5652" stroke-width="1.8" marker-end="url(#arr-dark)"/>

  <rect x="728" y="96" width="152" height="218" rx="9" fill="#f7e7f2" stroke="#9a4b86" stroke-width="1.5"/>
  <rect x="728" y="96" width="152" height="34" rx="9" fill="#9a4b86"/>
  <rect x="728" y="118" width="152" height="12" fill="#9a4b86"/>
  <text x="804" y="119" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="700" fill="#ffffff">⑤ 算子与同步点</text>
  <circle cx="744" cy="147" r="5" fill="#087f73"/>
  <circle cx="760" cy="147" r="5" fill="#4c65b6"/>
  <text x="772" y="152" font-family="sans-serif" font-size="13.5" fill="#7a3a6a">核函数落点</text>
  <text x="740" y="178" font-family="sans-serif" font-size="13.5" font-weight="700" fill="#17211f">设备算子最终落点</text>
  <text x="740" y="200" font-family="sans-serif" font-size="13.5" fill="#4d5652">torch_npu / Triton</text>
  <text x="740" y="220" font-family="sans-serif" font-size="13.5" fill="#4d5652">csrc/ _C_ascend</text>
  <line x1="740" y1="236" x2="868" y2="236" stroke="#9a4b86" stroke-opacity="0.35" stroke-width="1"/>
  <text x="740" y="258" font-family="sans-serif" font-size="13.5" font-weight="700" fill="#8f3229">查同步与异步边界</text>
  <text x="740" y="280" font-family="sans-serif" font-size="13.5" fill="#4d5652">图回放 synchronize</text>
  <text x="740" y="300" font-family="sans-serif" font-size="13.5" fill="#4d5652">报错点 ≠ 出错点</text>

  <rect x="20" y="334" width="424" height="118" rx="9" fill="#f7f5ef" stroke="#4c65b6" stroke-width="1.3"/>
  <text x="36" y="360" font-family="sans-serif" font-size="14" font-weight="700" fill="#3a4f93">跨版本对照：比行为与符号，不比行号</text>
  <text x="36" y="384" font-family="monospace" font-size="13.5" fill="#17211f">git show &lt;commit&gt;:&lt;path&gt;  |  git diff A B -- &lt;path&gt;</text>
  <text x="36" y="408" font-family="sans-serif" font-size="13.5" fill="#4d5652">文件搬迁（如 glm5_next.py → glm5next/）按类名与函数名搜索</text>
  <text x="36" y="432" font-family="sans-serif" font-size="13.5" fill="#4d5652">发布说明只解释动机，是否含修复须在目标提交内实查</text>

  <rect x="456" y="334" width="424" height="118" rx="9" fill="#fff0e9" stroke="#b54237" stroke-width="1.3"/>
  <text x="472" y="360" font-family="sans-serif" font-size="14" font-weight="700" fill="#8f3229">结论格式与证据边界（静态源码 ≠ 实机结果）</text>
  <text x="472" y="384" font-family="sans-serif" font-size="13.5" font-weight="600" fill="#17211f">「提交 + 硬件/配置条件 + 输入 → 分支 → 输出 + 源码范围」</text>
  <text x="472" y="408" font-family="sans-serif" font-size="13.5" fill="#4d5652">多进程日志交错：先找首个异常，通信超时常为连带受害者</text>
  <text x="472" y="432" font-family="sans-serif" font-size="13.5" fill="#4d5652">未上机复现前，不把静态候选原因写成已证实根因</text>
</svg>
