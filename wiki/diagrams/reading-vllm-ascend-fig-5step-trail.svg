<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 474" width="900" height="474" role="img" aria-label="vllm-ascend 5 步代码走读路线图：从入口到核函数与版本符号对齐" font-family="var(--font-sans)">
  <title>vllm-ascend 五步源码走读链：从入口点、配置、Runner、分派到算子与同步点</title>
  <desc>关联源码符号：register, register_model, HardwareProfile, get_current_hardware_profile, register_ascend_customop, REGISTERED_ASCEND_OPS, _patched_use_v2_model_runner, VLLM_USE_V2_MODEL_RUNNER</desc>
  <defs>
    <marker id="rd-arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="#66716d"/>
    </marker>
  </defs>

  <text x="16" y="28" font-size="16" font-weight="700" fill="#17211f">① 五步走读主线：带着「输入 → 输出 → 状态 → 生效条件」穿透两个仓库</text>

  <!-- 5 vertical-compact / 2-row flow -->
  <!-- Step 1 -->
  <rect x="16" y="46" width="268" height="106" rx="7" fill="#fff4cf" stroke="#c78300" stroke-width="1.4"/>
  <text x="30" y="72" font-size="14.5" font-weight="700" fill="#936300">第 1 步 · 钉版本与查入口点</text>
  <text x="30" y="96" font-size="13.5" fill="#4d5652">先用 git show 固定双仓 commit</text>
  <text x="30" y="118" font-size="13.5" fill="#4d5652">查 setup.py / __init__.py 登记</text>
  <text x="30" y="140" font-size="13.5" fill="#936300">核对 VLLM_PLUGINS 过滤条件</text>

  <line x1="286" y1="99" x2="314" y2="99" stroke="#66716d" stroke-width="1.7" marker-end="url(#rd-arr)"/>

  <!-- Step 2 -->
  <rect x="318" y="46" width="264" height="106" rx="7" fill="#ddf4ef" stroke="#087f73" stroke-width="1.4"/>
  <text x="332" y="72" font-size="14.5" font-weight="700" fill="#065f56">第 2 步 · 追配置合并与改写</text>
  <text x="332" y="96" font-size="13.5" fill="#4d5652">JSON → 环境合并 → 平台改写</text>
  <text x="332" y="118" font-size="13.5" fill="#4d5652">v0.30.0 查 derive_and_validate</text>
  <text x="332" y="140" font-size="13.5" fill="#065f56">读到字段 ≠ 消费者实际执行</text>

  <line x1="584" y1="99" x2="612" y2="99" stroke="#66716d" stroke-width="1.7" marker-end="url(#rd-arr)"/>

  <!-- Step 3 -->
  <rect x="616" y="46" width="268" height="106" rx="7" fill="#e8edff" stroke="#4c65b6" stroke-width="1.4"/>
  <text x="630" y="72" font-size="14.5" font-weight="700" fill="#3a4f93">第 3 步 · 查 Runner 与张量态</text>
  <text x="630" y="96" font-size="13.5" fill="#4d5652">确认走 MRV1 还是 worker/v2/</text>
  <text x="630" y="118" font-size="13.5" fill="#4d5652">记清设备、dtype 与采样行索引</text>
  <text x="630" y="140" font-size="13.5" fill="#3a4f93">main 锁定 V2，设 =0 直接报错</text>

  <!-- Connector down from Step 3 to Step 4 -->
  <path d="M 750 154 L 750 174 L 228 174 L 228 192" fill="none" stroke="#66716d" stroke-width="1.6" marker-end="url(#rd-arr)"/>

  <!-- Step 4 -->
  <rect x="16" y="196" width="424" height="114" rx="7" fill="#f7e7f2" stroke="#9a4b86" stroke-width="1.4"/>
  <text x="30" y="222" font-size="14.5" font-weight="700" fill="#7a3a6a">第 4 步 · 按调用写法追 6 类扩展点分派</text>
  <text x="30" y="246" font-size="13.5" fill="#4d5652">• CustomOp：查 REGISTERED_ASCEND_OPS 主表与卡型覆盖</text>
  <text x="30" y="268" font-size="13.5" fill="#4d5652">• Patch：核对 patch/platform/__init__ 导入条件</text>
  <text x="30" y="292" font-size="13.5" fill="#7a3a6a">• 后端直绑：如 GLM 稀疏 MLA 由层自定后端，不查平台总表</text>

  <line x1="442" y1="253" x2="470" y2="253" stroke="#66716d" stroke-width="1.7" marker-end="url(#rd-arr)"/>

  <!-- Step 5 -->
  <rect x="474" y="196" width="410" height="114" rx="7" fill="#fff0e9" stroke="#b54237" stroke-width="1.4"/>
  <text x="488" y="222" font-size="14.5" font-weight="700" fill="#8f3229">第 5 步 · 落到核函数与异步报错同步点</text>
  <text x="488" y="246" font-size="13.5" fill="#4d5652">• 查 ops/、csrc/ 与 HardwareProfile 硬件能力位</text>
  <text x="488" y="268" font-size="13.5" fill="#4d5652">• NPU 异步执行：错误常在流同步点（如图回放前）暴露</text>
  <text x="488" y="292" font-size="13.5" fill="#8f3229">• 栈顶在 vllm-ascend ≠ 根因在此；多卡超时常为连带</text>

  <line x1="16" y1="330" x2="884" y2="330" stroke="#b8bcb5" stroke-width="1.4" stroke-dasharray="6 5"/>

  <!-- Zone 2: Evidence discipline -->
  <text x="16" y="358" font-size="16" font-weight="700" fill="#17211f">② 跨版本对照与证据边界铁律（比行为与符号，不比行号）</text>

  <rect x="16" y="374" width="424" height="86" rx="7" fill="#ece9df" stroke="#b8bcb5" stroke-width="1.3"/>
  <text x="30" y="400" font-size="14" font-weight="700" fill="#17211f">按符号跨版追踪（文件挪位时勿按旧路径死找）</text>
  <text x="30" y="424" font-size="13.5" fill="#4d5652">• 例：glm5_next.py → glm5next/model.py</text>
  <text x="30" y="446" font-size="13.5" fill="#4d5652">• 用 git grep &lt;symbol&gt; &lt;commit&gt; 核输入、分支与状态</text>

  <rect x="460" y="374" width="424" height="86" rx="7" fill="#ddf4ef" stroke="#087f73" stroke-width="1.3"/>
  <text x="474" y="400" font-size="14" font-weight="700" fill="#065f56">严格区分「静态源码推断」与「实机运行证据」</text>
  <text x="474" y="424" font-size="13.5" fill="#4d5652">• 写清：commit + 设备/配置前提 + 分支 + 源码范围</text>
  <text x="474" y="446" font-size="13.5" fill="#065f56">• 未上机复现时，不把候选原因升级成已证实根因</text>
</svg>
