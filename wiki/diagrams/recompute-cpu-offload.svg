<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 320" width="900" height="320" role="img" aria-label="抢占时先保护请求A的状态，原页不再被拷贝读取后才可复用；恢复时回填完成后继续计算，时间长度仅为示意">
  <title>抢占时先保护请求A的状态，原页不再被拷贝读取后才可复用；恢复时回填完成后继续计算，时间长度仅为示意</title>
  <defs><pattern id="recompute-cpu-offload-hatch" width="7" height="7" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="7" height="7" fill="var(--color-surface-sunken, #ece9df)"/><line x1="0" y1="0" x2="0" y2="7" stroke="var(--color-ink-muted, #66716d)" stroke-width="2"/></pattern></defs>
  <text x="148" y="83.5" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="13" font-weight="700" fill="var(--color-ink, #17211f)" text-anchor="end">请求 A</text>
  <path d="M160 93H860" stroke="var(--color-line-strong, #b8bcb5)" stroke-width="1"/>
  <rect x="160" y="65" width="105" height="28" rx="4" fill="var(--color-token, #087f73)" stroke="var(--color-ink, #17211f)" stroke-width="1.3"/>
  <text x="212.5" y="83.5" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="12.5" font-weight="700" fill="var(--color-ink-inverse, #ffffff)" text-anchor="middle">执行</text>
  <rect x="265" y="65" width="490" height="28" rx="4" fill="url(#recompute-cpu-offload-hatch)" stroke="var(--color-ink-muted, #66716d)" stroke-width="1.3"/>
  <text x="510" y="83.5" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="12.5" font-weight="700" fill="var(--color-ink, #17211f)" text-anchor="middle">暂停</text>
  <rect x="755" y="65" width="105" height="28" rx="4" fill="var(--color-token, #087f73)" stroke="var(--color-ink, #17211f)" stroke-width="1.3"/>
  <text x="807.5" y="83.5" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="12.5" font-weight="700" fill="var(--color-ink-inverse, #ffffff)" text-anchor="middle">继续</text>
  <text x="148" y="121.5" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="13" font-weight="700" fill="var(--color-ink, #17211f)" text-anchor="end">状态搬运</text>
  <path d="M160 131H860" stroke="var(--color-line-strong, #b8bcb5)" stroke-width="1"/>
  <rect x="265" y="103" width="140" height="28" rx="4" fill="var(--color-comm, #9a4b86)" stroke="var(--color-ink, #17211f)" stroke-width="1.3"/>
  <text x="335" y="121.5" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="12.5" font-weight="700" fill="var(--color-ink-inverse, #ffffff)" text-anchor="middle">保存</text>
  <rect x="615" y="103" width="140" height="28" rx="4" fill="var(--color-comm, #9a4b86)" stroke="var(--color-ink, #17211f)" stroke-width="1.3"/>
  <text x="685" y="121.5" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="12.5" font-weight="700" fill="var(--color-ink-inverse, #ffffff)" text-anchor="middle">回填</text>
  <text x="148" y="159.5" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="13" font-weight="700" fill="var(--color-ink, #17211f)" text-anchor="end">主机副本</text>
  <rect x="405" y="141" width="350" height="28" rx="4" fill="var(--color-kv, #4c65b6)" stroke="var(--color-ink, #17211f)" stroke-width="1.3"/>
  <text x="580" y="159.5" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="12.5" font-weight="700" fill="var(--color-ink-inverse, #ffffff)" text-anchor="middle">已保存，可恢复</text>
  <path d="M160 181H860" stroke="var(--color-ink, #17211f)" stroke-width="1.3"/>
  <path d="M160 181v5" stroke="var(--color-ink, #17211f)" stroke-width="1.3"/>
  <text x="160" y="201" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="12" font-weight="400" fill="var(--color-ink-muted, #66716d)" text-anchor="middle">0</text>
  <path d="M300 181v5" stroke="var(--color-ink, #17211f)" stroke-width="1.3"/>
  <text x="300" y="201" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="12" font-weight="400" fill="var(--color-ink-muted, #66716d)" text-anchor="middle">2</text>
  <path d="M440 181v5" stroke="var(--color-ink, #17211f)" stroke-width="1.3"/>
  <text x="440" y="201" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="12" font-weight="400" fill="var(--color-ink-muted, #66716d)" text-anchor="middle">4</text>
  <path d="M580 181v5" stroke="var(--color-ink, #17211f)" stroke-width="1.3"/>
  <text x="580" y="201" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="12" font-weight="400" fill="var(--color-ink-muted, #66716d)" text-anchor="middle">6</text>
  <path d="M720 181v5" stroke="var(--color-ink, #17211f)" stroke-width="1.3"/>
  <text x="720" y="201" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="12" font-weight="400" fill="var(--color-ink-muted, #66716d)" text-anchor="middle">8</text>
  <path d="M860 181v5" stroke="var(--color-ink, #17211f)" stroke-width="1.3"/>
  <text x="860" y="201" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="12" font-weight="400" fill="var(--color-ink-muted, #66716d)" text-anchor="middle">10 示意时间</text>
  <path d="M405 61V181" stroke="var(--color-ink, #17211f)" stroke-width="1.2" stroke-dasharray="3 4"/>
  <text x="405" y="55" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="12.5" font-weight="700" fill="var(--color-ink, #17211f)" text-anchor="middle">保存完成</text>
  <path d="M755 61V181" stroke="var(--color-ink, #17211f)" stroke-width="1.2" stroke-dasharray="3 4"/>
  <text x="755" y="55" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="12.5" font-weight="700" fill="var(--color-ink, #17211f)" text-anchor="middle">回填完成</text>
  <text x="30" y="264" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="13.5" font-weight="400" fill="var(--color-ink-muted, #66716d)" font-style="italic">源设备页在保存完成前保持有效；加载目标在回填完成后才可读</text>
  <text x="30" y="294" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="13.5" font-weight="400" fill="var(--color-ink-muted, #66716d)" font-style="italic">主机容量不足或保存不可用时，由调度器选择相应恢复路径</text>
</svg>
