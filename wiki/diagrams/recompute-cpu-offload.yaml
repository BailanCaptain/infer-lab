layout: figure
id: recompute-cpu-offload
caption: 固定旧部署的两条恢复路径（示意：一块 4 个位置，重算路线无可复用缓存）。上面调度器可先把 A 的块号重分给 C，但 worker 必须在清零或写入 C 的数据前，把 A 的 3 块拷到主机；A 排上时分 3 个空块并搬回，完成通知处理后才能继续调度。下面主机存不下整条，3 块还掉，D 发退回标记，代理交给 P 重算问题与已生成内容；旧引擎收尾缺口和 rc2 中止分支见调度器页。
