layout: figure
id: recompute-cpu-offload
caption: 同一次抢占的两条恢复路径（示意：一块 4 个位置）。上面先把 A 的 3 块拷到主机、再把块号让给 C；等池子空出来，A 排上的那一步分 3 个空块、把主机那份搬回，下一步才从第 10 个位置接着算。下面主机存不下整条，3 块直接还掉，A 在 D 上结束，交给 P 把整段重算一遍
