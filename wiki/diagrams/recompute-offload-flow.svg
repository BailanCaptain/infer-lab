<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 580" width="900" height="580" role="img" aria-label="保存与恢复跨越多次调度。按固定旧版展开，编号对应一条请求的七站；保存计划不是拷贝完成。D2H是设备到主机，H2D是主机到设备。worker先保存旧数据，再整理会复用块号的输入；之后等保存报告、恢复分配、搬回报告逐道满足，才能继续调度。失败分支按现场版本退回P或中止。">
  <title>保存与恢复跨越多次调度。按固定旧版展开，编号对应一条请求的七站；保存计划不是拷贝完成。D2H是设备到主机，H2D是主机到设备。worker先保存旧数据，再整理会复用块号的输入；之后等保存报告、恢复分配、搬回报告逐道满足，才能继续调度。失败分支按现场版本退回P或中止。</title>
  <defs><marker id="recompute-offload-flow-ah-ink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="var(--color-ink, #17211f)"/></marker><marker id="recompute-offload-flow-ah-danger" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="var(--color-danger, #b54237)"/></marker></defs>
  <path d="M260 87 L330 87" fill="none" stroke="var(--color-ink, #17211f)" stroke-width="1.4" marker-end="url(#recompute-offload-flow-ah-ink)"/>
  <path d="M570 87 L640 87" fill="none" stroke="var(--color-ink, #17211f)" stroke-width="1.4" marker-end="url(#recompute-offload-flow-ah-ink)"/>
  <path d="M760 119 L760 212" fill="none" stroke="var(--color-ink, #17211f)" stroke-width="1.4" marker-end="url(#recompute-offload-flow-ah-ink)"/>
  <path d="M640 244 L570 244" fill="none" stroke="var(--color-ink, #17211f)" stroke-width="1.4" marker-end="url(#recompute-offload-flow-ah-ink)"/>
  <path d="M330 244 L260 244" fill="none" stroke="var(--color-ink, #17211f)" stroke-width="1.4" marker-end="url(#recompute-offload-flow-ah-ink)"/>
  <path d="M140 276 L140 369" fill="none" stroke="var(--color-ink, #17211f)" stroke-width="1.4" marker-end="url(#recompute-offload-flow-ah-ink)"/>
  <path d="M260 401 L330 401" fill="none" stroke="var(--color-ink, #17211f)" stroke-width="1.4" marker-end="url(#recompute-offload-flow-ah-ink)"/>
  <path d="M570 401 L640 401" fill="none" stroke="var(--color-ink, #17211f)" stroke-width="1.4" marker-end="url(#recompute-offload-flow-ah-ink)"/>
  <path d="M20 87 L7 87 L7 532 L20 532" fill="none" stroke="var(--color-danger, #b54237)" stroke-width="1.4" marker-end="url(#recompute-offload-flow-ah-danger)"/>
  <rect x="20" y="55" width="240" height="64" rx="8" fill="var(--color-control, #66716d)" stroke="var(--color-ink, #17211f)" stroke-width="1.5"/>
  <text x="140" y="83" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="14" font-weight="700" fill="var(--color-ink-inverse, #ffffff)" text-anchor="middle">第2站：询问能否保存</text>
  <text x="140" y="102" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="13" font-weight="400" fill="var(--color-ink-inverse, #ffffff)" text-anchor="middle">update_state_before_preempt</text>
  <rect x="330" y="55" width="240" height="64" rx="8" fill="var(--color-kv, #4c65b6)" stroke="var(--color-ink, #17211f)" stroke-width="1.5"/>
  <text x="450" y="83" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="14" font-weight="700" fill="var(--color-ink-inverse, #ffffff)" text-anchor="middle">接受：登记映射并抢占</text>
  <text x="450" y="102" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="13" font-weight="400" fill="var(--color-ink-inverse, #ffffff)" text-anchor="middle">还块号、清进度、排回等待</text>
  <rect x="640" y="55" width="240" height="64" rx="8" fill="var(--color-comm, #9a4b86)" stroke="var(--color-ink, #17211f)" stroke-width="1.5"/>
  <text x="760" y="83" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="14" font-weight="700" fill="var(--color-ink-inverse, #ffffff)" text-anchor="middle">第3站更新输入前：D2H</text>
  <text x="760" y="102" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="13" font-weight="400" fill="var(--color-ink-inverse, #ffffff)" text-anchor="middle">handle_preemptions 同步存完</text>
  <rect x="640" y="212" width="240" height="64" rx="8" fill="var(--color-control, #66716d)" stroke="var(--color-ink, #17211f)" stroke-width="1.5"/>
  <text x="760" y="240" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="14" font-weight="700" fill="var(--color-ink-inverse, #ffffff)" text-anchor="middle">第6站：保存报告集齐</text>
  <text x="760" y="259" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="13" font-weight="400" fill="var(--color-ink-inverse, #ffffff)" text-anchor="middle">该实例全部worker报完才ready</text>
  <rect x="330" y="212" width="240" height="64" rx="8" fill="var(--color-control, #66716d)" stroke="var(--color-ink, #17211f)" stroke-width="1.5"/>
  <text x="450" y="240" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="14" font-weight="700" fill="var(--color-ink-inverse, #ffffff)" text-anchor="middle">后续第2站：查恢复记录</text>
  <text x="450" y="259" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="13" font-weight="400" fill="var(--color-ink-inverse, #ffffff)" text-anchor="middle">未ready继续等待，不当零命中</text>
  <rect x="20" y="212" width="240" height="64" rx="8" fill="var(--color-kv, #4c65b6)" stroke="var(--color-ink, #17211f)" stroke-width="1.5"/>
  <text x="140" y="240" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="14" font-weight="700" fill="var(--color-ink-inverse, #ffffff)" text-anchor="middle">有可恢复位置且分块成功</text>
  <text x="140" y="259" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="13" font-weight="400" fill="var(--color-ink-inverse, #ffffff)" text-anchor="middle">登记H2D，本步不排新token</text>
  <rect x="20" y="369" width="240" height="64" rx="8" fill="var(--color-comm, #9a4b86)" stroke="var(--color-ink, #17211f)" stroke-width="1.5"/>
  <text x="140" y="397" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="14" font-weight="700" fill="var(--color-ink-inverse, #ffffff)" text-anchor="middle">前向前：同步H2D</text>
  <text x="140" y="416" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="13" font-weight="400" fill="var(--color-ink-inverse, #ffffff)" text-anchor="middle">start_load_kv 等搬回完成</text>
  <rect x="330" y="369" width="240" height="64" rx="8" fill="var(--color-control, #66716d)" stroke="var(--color-ink, #17211f)" stroke-width="1.5"/>
  <text x="450" y="397" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="14" font-weight="700" fill="var(--color-ink-inverse, #ffffff)" text-anchor="middle">第6站：恢复完成报告</text>
  <text x="450" y="416" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="13" font-weight="400" fill="var(--color-ink-inverse, #ffffff)" text-anchor="middle">get_finished 回报已恢复</text>
  <rect x="640" y="369" width="240" height="64" rx="8" fill="var(--color-token, #087f73)" stroke="var(--color-ink, #17211f)" stroke-width="1.5"/>
  <text x="760" y="397" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="14" font-weight="700" fill="var(--color-ink-inverse, #ffffff)" text-anchor="middle">后续第2站：继续调度</text>
  <text x="760" y="416" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="13" font-weight="400" fill="var(--color-ink-inverse, #ffffff)" text-anchor="middle">更新进度，再受预算与队列约束</text>
  <rect x="20" y="504" width="550" height="56" rx="8" fill="var(--color-danger, #b54237)" stroke="var(--color-ink, #17211f)" stroke-width="1.5"/>
  <text x="295" y="528" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="14" font-weight="700" fill="var(--color-ink-inverse, #ffffff)" text-anchor="middle">不接受保存：由调度器走退回P或中止分支</text>
  <text x="295" y="547" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="13" font-weight="400" fill="var(--color-ink-inverse, #ffffff)" text-anchor="middle">旧版与rc2细粒度TP的收尾差异见调度器页</text>
  <text x="20" y="26" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="14" font-weight="700" fill="var(--color-ink, #17211f)">先保存旧内容，再复用块；先收齐报告，再恢复执行</text>
  <text x="330" y="160" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="12" font-weight="400" fill="var(--color-ink, #17211f)">块号已可重分，旧内容尚不能被覆盖</text>
  <text x="640" y="324" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="12" font-weight="400" fill="var(--color-ink, #17211f)">默认不共享前缀的实际搬运路径</text>
</svg>
