<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 416" width="900" height="416" role="img" aria-label="RecomputeScheduler 退回 P 节点的代理续写流与生成上限扣减核算图" font-family="var(--font-sans)">
  <title>一次退回 P 怎样走完：recomputed 空结束帧、代理重拼与 max_tokens 帧数扣减</title>
  <desc>RecomputeScheduler, _finish_recomputed_request, recomputed_reqs, reassign_instances</desc>
  <defs>
    <marker id="rs2-arr-amber" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0 1.5L9 5L0 8.5z" fill="#c78300"/>
    </marker>
    <marker id="rs2-arr-teal" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0 1.5L9 5L0 8.5z" fill="#087f73"/>
    </marker>
    <marker id="rs2-arr-plum" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0 1.5L9 5L0 8.5z" fill="#9a4b86"/>
    </marker>
    <marker id="rs2-arr-blue" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0 1.5L9 5L0 8.5z" fill="#4c65b6"/>
    </marker>
  </defs>

  <circle cx="24" cy="24" r="12" fill="#c78300"/>
  <text x="24" y="28.5" text-anchor="middle" font-size="12.5" font-weight="700" fill="#ffffff">1</text>
  <text x="44" y="30" font-size="16" font-weight="700" fill="#17211f">退回 P 完整回路（示意：原问题 p0–p3，已出 y0, y1，原上限 max_tokens = 10）</text>

  <!-- 4 Actors across top -->
  <rect x="16" y="48" width="144" height="44" rx="6" fill="#ece9df" stroke="#b8bcb5" stroke-width="1.4"/>
  <text x="88" y="75" text-anchor="middle" font-size="14.5" font-weight="700" fill="#17211f">客户端流</text>

  <rect x="220" y="48" width="212" height="44" rx="6" fill="#fff4cf" stroke="#c78300" stroke-width="1.5"/>
  <text x="326" y="75" text-anchor="middle" font-size="14.5" font-weight="700" fill="#936300">负载均衡代理 Proxy</text>

  <rect x="492" y="48" width="168" height="44" rx="6" fill="#fff0e9" stroke="#b54237" stroke-width="1.4"/>
  <text x="576" y="75" text-anchor="middle" font-size="14.5" font-weight="700" fill="#8f3229">原 D1（块池已满）</text>

  <rect x="708" y="48" width="176" height="44" rx="6" fill="#ddf4ef" stroke="#087f73" stroke-width="1.5"/>
  <text x="796" y="75" text-anchor="middle" font-size="14.5" font-weight="700" fill="#065f56">新 P2 → 新 D2</text>

  <!-- Lifelines -->
  <g stroke="#d8d8cf" stroke-width="1.5" stroke-dasharray="5 4">
    <line x1="88" y1="92" x2="88" y2="274"/>
    <line x1="326" y1="92" x2="326" y2="274"/>
    <line x1="576" y1="92" x2="576" y2="274"/>
    <line x1="796" y1="92" x2="796" y2="274"/>
  </g>

  <!-- Step 1: Normal stream y0, y1 -->
  <line x1="576" y1="120" x2="332" y2="120" stroke="#087f73" stroke-width="1.8" marker-end="url(#rs2-arr-teal)"/>
  <text x="454" y="113" text-anchor="middle" font-size="13.5" fill="#065f56">① 已流式吐出 y0、y1（2 帧）</text>
  <line x1="326" y1="120" x2="94" y2="120" stroke="#087f73" stroke-width="1.8" marker-end="url(#rs2-arr-teal)"/>
  <text x="210" y="113" text-anchor="middle" font-size="13.5" fill="#065f56">转发 y0, y1</text>

  <!-- Step 2: D1 emits empty STOP + recomputed frame -->
  <line x1="576" y1="164" x2="332" y2="164" stroke="#c78300" stroke-width="2.2" marker-end="url(#rs2-arr-amber)"/>
  <text x="454" y="155" text-anchor="middle" font-size="13.5" font-weight="700" fill="#936300">② 还块 + 发空结束帧</text>
  <text x="454" y="182" text-anchor="middle" font-size="13.5" font-family="var(--font-mono)" fill="#8f3229">STOP · stop_reason="recomputed"</text>

  <!-- Step 3: Proxy rebuilds prompt & re-dispatches -->
  <line x1="326" y1="216" x2="790" y2="216" stroke="#4c65b6" stroke-width="2" marker-end="url(#rs2-arr-blue)"/>
  <text x="558" y="208" text-anchor="middle" font-size="13.5" font-weight="700" fill="#3a4f93">③ 代理重拼 [p0..p3 + y0, y1]，max_tokens' = 8 → 重投 P2 / D2</text>

  <!-- Step 4: D2 resumes stream to Client -->
  <line x1="796" y1="256" x2="332" y2="256" stroke="#087f73" stroke-width="1.8" marker-end="url(#rs2-arr-teal)"/>
  <line x1="326" y1="256" x2="94" y2="256" stroke="#087f73" stroke-width="1.8" marker-end="url(#rs2-arr-teal)"/>
  <text x="558" y="248" text-anchor="middle" font-size="13.5" font-weight="700" fill="#065f56">④ 新 D2 接续输出 y2, y3…（同一条外部流暂停后继续）</text>

  <!-- Divider -->
  <line x1="16" y1="286" x2="884" y2="286" stroke="#d8d8cf" stroke-width="1.4" stroke-dasharray="6 4"/>

  <!-- Bottom: Frame Counter Visual & Edge-Case Pitfalls -->
  <rect x="16" y="302" width="424" height="100" rx="8" fill="#e8edff" stroke="#4c65b6" stroke-width="1.4"/>
  <text x="30" y="326" font-size="14.5" font-weight="700" fill="#3a4f93">生成上限为何加回 retry_count（10 - 3 + 1 = 8）</text>
  <!-- 3 frame chips -->
  <rect x="30" y="338" width="90" height="26" rx="4" fill="#ddf4ef" stroke="#087f73" stroke-width="1.2"/>
  <text x="75" y="356" text-anchor="middle" font-size="13.5" fill="#065f56">帧 1：y0</text>
  <rect x="128" y="338" width="90" height="26" rx="4" fill="#ddf4ef" stroke="#087f73" stroke-width="1.2"/>
  <text x="173" y="356" text-anchor="middle" font-size="13.5" fill="#065f56">帧 2：y1</text>
  <rect x="226" y="338" width="132" height="26" rx="4" fill="#fff0e9" stroke="#b54237" stroke-width="1.2"/>
  <text x="292" y="356" text-anchor="middle" font-size="13.5" fill="#8f3229">帧 3：空结束帧</text>
  <text x="366" y="356" font-size="13.5" font-weight="700" fill="#3a4f93">计 3 帧</text>
  <text x="30" y="388" font-size="13.5" fill="#4d5652">陷阱：首帧仅角色会多扣；投机一帧多 token 会少扣</text>

  <rect x="456" y="302" width="428" height="100" rx="8" fill="#fff0e9" stroke="#b54237" stroke-width="1.4"/>
  <text x="470" y="326" font-size="14.5" font-weight="700" fill="#8f3229">代理续接的三条常见边界</text>
  <text x="470" y="350" font-size="13.5" fill="#17211f">• 直连 D 无代理：回答被截断却报 finish_reason=stop</text>
  <text x="470" y="372" font-size="13.5" fill="#4d5652">• 示例代理按文本重拼并接 messages[0]（v0.26 改 token 续）</text>
  <text x="470" y="394" font-size="13.5" font-weight="700" fill="#8f3229">• 外层 while retry 无上限；每次均从最初问题重拼</text>
</svg>
