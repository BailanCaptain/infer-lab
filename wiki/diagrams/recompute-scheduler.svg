<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 625" width="900" height="625" role="img" aria-label="D consumer增长分配失败后，先询问连接器能否接管保存。成功走状态保存/恢复；否则释放当前块并报告重计算，示例代理据已确认输出重新组织请求。两条分支成本不同。">
  <title>D consumer增长分配失败后，先询问连接器能否接管保存。成功走状态保存/恢复；否则释放当前块并报告重计算，示例代理据已确认输出重新组织请求。两条分支成本不同。</title>
  <defs><marker id="recompute-scheduler-ah-control" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="var(--color-control, #66716d)"/></marker><marker id="recompute-scheduler-ah-kv" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="var(--color-kv, #4c65b6)"/></marker><marker id="recompute-scheduler-ah-danger" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="var(--color-danger, #b54237)"/></marker><marker id="recompute-scheduler-ah-token" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="var(--color-token, #087f73)"/></marker></defs>
  <g data-hardware="memory">
  <rect x="115" y="415" width="180" height="95" rx="3" fill="var(--color-kv-soft, #e8edff)" stroke="var(--color-kv, #4c65b6)" stroke-width="1.5"/>
  <path d="M120 502h170M120 506h170" fill="none" stroke="var(--color-kv, #4c65b6)" stroke-width="1.5"/>
  <text x="205" y="466.5" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="13" font-weight="700" fill="var(--color-ink, #17211f)" text-anchor="middle">已保存历史</text>
  </g>
  <path d="M450 95 L450 150" fill="none" stroke="var(--color-control, #66716d)" stroke-width="1.4" marker-end="url(#recompute-scheduler-ah-control)"/>
  <path d="M355 205 L205 230 L205 285" fill="none" stroke="var(--color-kv, #4c65b6)" stroke-width="1.4" marker-end="url(#recompute-scheduler-ah-kv)"/>
  <path d="M545 205 L690 230 L690 285" fill="none" stroke="var(--color-danger, #b54237)" stroke-width="1.4" marker-end="url(#recompute-scheduler-ah-danger)"/>
  <path d="M205 345 L205 415" fill="none" stroke="var(--color-kv, #4c65b6)" stroke-width="1.4" marker-end="url(#recompute-scheduler-ah-kv)"/>
  <path d="M690 345 L690 415" fill="none" stroke="var(--color-control, #66716d)" stroke-width="1.4" marker-end="url(#recompute-scheduler-ah-control)"/>
  <path d="M690 475 L690 525" fill="none" stroke="var(--color-token, #087f73)" stroke-width="1.4" marker-end="url(#recompute-scheduler-ah-token)"/>
  <rect x="305" y="40" width="290" height="55" rx="8" fill="var(--color-danger, #b54237)" stroke="var(--color-ink, #17211f)" stroke-width="1.5"/>
  <text x="450" y="72.5" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="14" font-weight="700" fill="var(--color-ink-inverse, #ffffff)" text-anchor="middle">D 端申请新块失败</text>
  <rect x="305" y="150" width="290" height="55" rx="8" fill="var(--color-control, #66716d)" stroke="var(--color-ink, #17211f)" stroke-width="1.5"/>
  <text x="450" y="182.5" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="14" font-weight="700" fill="var(--color-ink-inverse, #ffffff)" text-anchor="middle">连接器接管保存是否成功？</text>
  <rect x="40" y="285" width="335" height="60" rx="8" fill="var(--color-kv, #4c65b6)" stroke="var(--color-ink, #17211f)" stroke-width="1.5"/>
  <text x="207.5" y="320" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="14" font-weight="700" fill="var(--color-ink-inverse, #ffffff)" text-anchor="middle">保存状态并进入抢占协议</text>
  <rect x="525" y="285" width="335" height="60" rx="8" fill="var(--color-danger, #b54237)" stroke="var(--color-ink, #17211f)" stroke-width="1.5"/>
  <text x="692.5" y="320" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="14" font-weight="700" fill="var(--color-ink-inverse, #ffffff)" text-anchor="middle">释放当前块，报告重计算</text>
  <rect x="525" y="415" width="335" height="60" rx="8" fill="var(--color-control, #66716d)" stroke="var(--color-ink, #17211f)" stroke-width="1.5"/>
  <text x="692.5" y="450" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="14" font-weight="700" fill="var(--color-ink-inverse, #ffffff)" text-anchor="middle">代理组织输入与已确认输出</text>
  <rect x="525" y="525" width="335" height="55" rx="8" fill="var(--color-token, #087f73)" stroke="var(--color-ink, #17211f)" stroke-width="1.5"/>
  <text x="692.5" y="557.5" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="14" font-weight="700" fill="var(--color-ink-inverse, #ffffff)" text-anchor="middle">重新接续 P / D 执行</text>
  <text x="225" y="250" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="13.5" font-weight="400" fill="#3a4f93">成功</text>
  <text x="690" y="250" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="13.5" font-weight="400" fill="#8f3229">未成功</text>
  <text x="205" y="550" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="13.5" font-weight="400" fill="var(--color-ink-muted, #66716d)" text-anchor="middle" font-style="italic">重载后继续</text>
  <text x="450" y="610" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="13.5" font-weight="400" fill="var(--color-ink-muted, #66716d)" text-anchor="middle" font-style="italic">接口的保存能力与代理续接语义，需要按实际连接器验证</text>
</svg>
