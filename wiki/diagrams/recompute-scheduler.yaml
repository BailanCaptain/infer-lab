layout: figure
id: recompute-scheduler
caption: D 节点续块失败时，本调度器改动的核心是「被让出的那条怎么处置」：连接器能把它的 KV 存走，就存走、之后搬回接着 decode；存不走，就还掉它的全部块、结束它，由代理把「原问题 + 已生成的内容」重新发给一对 P/D，重算落在 P 上，不占 D 的步子
size: [900, 600]
frames:
  - { at: [12, 50], size: [476, 536], label: D 节点（只做 decode） }
  - { at: [508, 50], size: [380, 236], label: 代理（PD 部署最前面的转发服务） }
  - { at: [508, 316], size: [380, 270], label: P 节点（做 prefill） }
items:
  - { at: [36, 90], size: [428, 58], text: ① 当前请求续块失败, sub: 池子里的空闲块不够放这一步要写的位置, tone: danger }
  - { at: [36, 186], size: [428, 58], text: ② 从 running 里取一条让出块, sub: 默认取最晚排进来的那条, tone: control }
  - { at: [36, 282], size: [428, 58], text: ③ 问连接器：它的 KV 能存走吗？, style: plain }
  - { at: [36, 392], size: [206, 92], text: 能：存到主机内存, sub: 排回队首，稍后搬回来, tone: kv }
  - { at: [258, 392], size: [206, 92], text: 不能：还回全部块, sub: 结束它，标 recomputed, tone: danger }
  - { at: [36, 512], size: [428, 52], text: 通用做法：在 D 本机从头重算, sub: 开了本调度器的 D 节点不走这条, style: faded }
  - { at: [528, 92], size: [340, 72], text: ④ 认出 recomputed 标记, sub: 已生成的接到原问题后，上限扣掉已生成的, tone: comm }
  - { at: [528, 200], size: [340, 58], text: ⑤ 重新挑一对 P、D 发出去, tone: comm }
  - { at: [528, 356], size: [340, 72], text: ⑥ 把「原问题 + 已生成」整段 prefill, sub: 已生成的越长，这一遍越贵, tone: token }
  - { at: [528, 470], size: [340, 72], text: ⑦ KV 交给选中的 D，接着 decode, sub: 通过代理的客户端看到输出接着往下走, tone: kv }
