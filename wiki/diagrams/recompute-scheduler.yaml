    symbols: [allocate_slots, update_state_before_preempt, num_computed_tokens]
  - source: vllm-ascend@2c59ff10:vllm_ascend/core/recompute_scheduler.py#L330-L345
    symbols: [_preempt_request, RecomputeReqInfo]
