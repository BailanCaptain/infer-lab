<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 350" width="900" height="350" role="img" aria-label="版本对照示意：先固定提交和符号，再比较输入、条件与状态；行号仅定位该快照，不代表行为">
  <title>版本对照示意：先固定提交和符号，再比较输入、条件与状态；行号仅定位该快照，不代表行为</title>
  <defs><marker id="ref-diff-ah-control" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="var(--color-control, #66716d)"/></marker><marker id="ref-diff-ah-token" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="var(--color-token, #087f73)"/></marker></defs>
  <rect x="30" y="55" width="350" height="250" rx="16" fill="none" stroke="var(--color-line-strong, #b8bcb5)" stroke-width="1.5"/>
  <text x="46" y="43" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="15" font-weight="700" fill="var(--color-ink, #17211f)">固定提交 A（示意）</text>
  <rect x="520" y="55" width="350" height="250" rx="16" fill="none" stroke="var(--color-line-strong, #b8bcb5)" stroke-width="1.5"/>
  <text x="536" y="43" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="15" font-weight="700" fill="var(--color-ink, #17211f)">固定提交 B（示意）</text>
  <path d="M350 137 L550 137" fill="none" stroke="var(--color-control, #66716d)" stroke-width="1.4" marker-start="url(#ref-diff-ah-control)" marker-end="url(#ref-diff-ah-control)"/>
  <path d="M350 242 L550 242" fill="none" stroke="var(--color-token, #087f73)" stroke-width="1.4" marker-start="url(#ref-diff-ah-token)" marker-end="url(#ref-diff-ah-token)"/>
  <rect x="60" y="110" width="290" height="55" rx="8" fill="var(--color-control, #66716d)" stroke="var(--color-ink, #17211f)" stroke-width="1.5"/>
  <text x="205" y="142.5" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="14" font-weight="700" fill="var(--color-ink-inverse, #ffffff)" text-anchor="middle">职责与符号</text>
  <rect x="550" y="110" width="290" height="55" rx="8" fill="var(--color-control, #66716d)" stroke="var(--color-ink, #17211f)" stroke-width="1.5"/>
