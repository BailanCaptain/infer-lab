<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 760" width="880" height="760" role="img" aria-label="R1 的两步沿同一主干前进，调度来源、图模式与采样器分别判断。图中 decode 回放图以两组对齐后可用为前提；MTP 草拟在这两步都走 eager。">
