<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 540" width="900" height="540" role="img" aria-label="跨进程日志地标、异常反向回传链与三层超时作用域标尺" font-family="var(--font-sans)">
  <title>跨进程日志地标、异常反向回传链与三层超时作用域标尺（MRV1 vs MRV2 栈帧入口）</title>
  <desc>Four process swimlanes with forward IPC channels, reverse red exception bubbling from WorkerProc to API server, three proportional timeout scope bars, and MRV1 vs MRV2 stack landmarks</desc>
  <defs>
    <marker id="rc-arr-teal" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="#087f73"/>
    </marker>
    <marker id="rc-arr-plum" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="#9a4b86"/>
    </marker>
    <marker id="rc-arr-red" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="#b54237"/>
    </marker>
  </defs>

  <text x="16" y="28" font-size="16" font-weight="700" fill="#17211f">① 四类进程泳道与日志前缀：请求正向推进 vs 异常反向冒泡</text>
  <text x="884" y="28" text-anchor="end" font-size="13.5" fill="#66716d">先按前缀定进程，再按最内层帧认站</text>

  <!-- 4 Process Swimlane Nodes -->
  <!-- Lane 1: API server -->
  <rect x="16" y="48" width="186" height="146" rx="7" fill="#ddf4ef" stroke="#087f73" stroke-width="1.4"/>
  <rect x="26" y="58" width="166" height="28" rx="4" fill="#087f73"/>
  <text x="109" y="77" text-anchor="middle" font-size="13.5" font-weight="700" fill="#ffffff">①⑦ API server</text>
  <text x="109" y="108" text-anchor="middle" font-size="13.5" font-family="var(--font-mono)" fill="#065f56">(APIServer pid=N)</text>
  <text x="109" y="132" text-anchor="middle" font-size="13.5" fill="#4d5652">AsyncLLM / detokenizer</text>
  <rect x="26" y="148" width="166" height="34" rx="4" fill="#fff0e9" stroke="#b54237" stroke-width="1.2"/>
  <text x="109" y="170" text-anchor="middle" font-size="13.5" font-weight="700" fill="#8f3229">转报 EngineDeadError</text>

  <!-- Forward arrow 1->2 -->
  <line x1="204" y1="98" x2="246" y2="98" stroke="#087f73" stroke-width="1.8" marker-end="url(#rc-arr-teal)"/>
  <text x="225" y="90" text-anchor="middle" font-size="13.5" font-weight="700" fill="#065f56">ZMQ</text>

  <!-- Lane 2: EngineCore_DP0 -->
  <rect x="250" y="48" width="194" height="146" rx="7" fill="#e8edff" stroke="#4c65b6" stroke-width="1.4"/>
  <rect x="260" y="58" width="174" height="28" rx="4" fill="#4c65b6"/>
  <text x="347" y="77" text-anchor="middle" font-size="13.5" font-weight="700" fill="#ffffff">②⑥ EngineCore_DP0</text>
  <text x="347" y="108" text-anchor="middle" font-size="13.5" font-family="var(--font-mono)" fill="#3a4f93">EngineCore_DP0</text>
  <text x="347" y="132" text-anchor="middle" font-size="13.5" fill="#4d5652">schedule · patch/platform</text>
  <rect x="260" y="148" width="174" height="34" rx="4" fill="#fff0e9" stroke="#b54237" stroke-width="1.2"/>
  <text x="347" y="170" text-anchor="middle" font-size="13.5" font-weight="700" fill="#8f3229">Dumping input → fatal</text>

  <!-- Forward arrow 2->3 -->
  <line x1="446" y1="98" x2="488" y2="98" stroke="#087f73" stroke-width="1.8" marker-end="url(#rc-arr-teal)"/>
  <text x="467" y="90" text-anchor="middle" font-size="13.5" font-weight="700" fill="#065f56">SHM</text>

  <!-- Lane 3: Worker_DP0 -->
  <rect x="492" y="48" width="192" height="146" rx="7" fill="#fff4cf" stroke="#c78300" stroke-width="1.5"/>
  <rect x="502" y="58" width="172" height="28" rx="4" fill="#c78300"/>
  <text x="588" y="77" text-anchor="middle" font-size="13.5" font-weight="700" fill="#ffffff">③④⑤ Worker_DP0</text>
  <text x="588" y="108" text-anchor="middle" font-size="13.5" font-family="var(--font-mono)" fill="#936300">Worker_DP0_TP*_EP*</text>
  <text x="588" y="132" text-anchor="middle" font-size="13.5" fill="#4d5652">execute / sample（0卡回）</text>
  <rect x="502" y="148" width="172" height="34" rx="4" fill="#b54237"/>
  <text x="588" y="170" text-anchor="middle" font-size="13.5" font-weight="700" fill="#ffffff">★ 原始异常起点（首查）</text>

  <!-- Sync arrow 3<->4 -->
  <line x1="686" y1="98" x2="720" y2="98" stroke="#9a4b86" stroke-width="1.8" marker-start="url(#rc-arr-plum)" marker-end="url(#rc-arr-plum)"/>
  <text x="703" y="90" text-anchor="middle" font-size="13.5" font-weight="700" fill="#7a3a6a">EP16</text>

  <!-- Lane 4: Worker_DP1 (Dummy) -->
  <rect x="724" y="48" width="160" height="146" rx="7" fill="#f7e7f2" stroke="#9a4b86" stroke-width="1.4" stroke-dasharray="5 3"/>
  <rect x="734" y="58" width="140" height="28" rx="4" fill="#9a4b86"/>
  <text x="804" y="77" text-anchor="middle" font-size="13.5" font-weight="700" fill="#ffffff">陪跑 Worker_DP1</text>
  <text x="804" y="108" text-anchor="middle" font-size="13.5" font-family="var(--font-mono)" fill="#7a3a6a">Worker_DP1_TP*</text>
  <text x="804" y="132" text-anchor="middle" font-size="13.5" fill="#4d5652">_dummy_run() 陪跑</text>
  <text x="804" y="156" text-anchor="middle" font-size="13.5" font-weight="700" fill="#7a3a6a">见之正常，非错收</text>
  <text x="804" y="176" text-anchor="middle" font-size="13.5" fill="#4d5652">一卡卡住拖垮 16 卡</text>

  <!-- Bold Red Reverse Exception Bubbling Rail -->
  <path d="M 588 196 L 588 218 L 109 218 L 109 198" fill="none" stroke="#b54237" stroke-width="2.2" marker-end="url(#rc-arr-red)"/>
  <path d="M 347 218 L 347 198" fill="none" stroke="#b54237" stroke-width="1.8" marker-end="url(#rc-arr-red)"/>
  <rect x="196" y="204" width="320" height="28" rx="14" fill="#b54237"/>
  <text x="356" y="223" text-anchor="middle" font-size="13.5" font-weight="700" fill="#ffffff">← 异常反向冒泡：别停在前端 EngineDeadError</text>

  <!-- Divider -->
  <line x1="16" y1="248" x2="884" y2="248" stroke="#b8bcb5" stroke-width="1.4" stroke-dasharray="6 4"/>

  <!-- Section 2: 3-Tier Timeout Span Bars -->
  <text x="16" y="276" font-size="16" font-weight="700" fill="#17211f">② 三层超时作用域（起算时点不同，互不等价，切忌盲目调大掩盖掉卡）</text>

  <!-- Bar 1: HCCL_CONNECT_TIMEOUT -->
  <rect x="16" y="294" width="230" height="40" rx="5" fill="#e8edff" stroke="#4c65b6" stroke-width="1.3"/>
  <text x="131" y="319" text-anchor="middle" font-size="12" font-weight="700" font-family="var(--font-mono)" fill="#3a4f93">HCCL_CONNECT_TIMEOUT</text>
  <rect x="256" y="294" width="224" height="40" rx="5" fill="#e8edff" fill-opacity="0.55" stroke="#4c65b6" stroke-width="1.2"/>
  <text x="368" y="319" text-anchor="middle" font-size="13.5" font-weight="700" fill="#3a4f93">仅启动建链期（默认 120s + 20s）</text>
  <text x="492" y="319" font-size="13.5" fill="#4d5652">配方 1200s；非每步 decode 预算</text>

  <!-- Bar 2: VLLM_EXECUTE_MODEL_TIMEOUT_SECONDS -->
  <rect x="16" y="342" width="230" height="40" rx="5" fill="#ddf4ef" stroke="#087f73" stroke-width="1.3"/>
  <text x="131" y="367" text-anchor="middle" font-size="12" font-weight="700" font-family="var(--font-mono)" fill="#065f56">VLLM_EXECUTE_MODEL_TIMEOUT</text>
  <rect x="256" y="342" width="380" height="40" rx="5" fill="#ddf4ef" fill-opacity="0.6" stroke="#087f73" stroke-width="1.3"/>
  <text x="446" y="367" text-anchor="middle" font-size="13.5" font-weight="700" fill="#065f56">单次 Worker RPC（execute / sample 各独立计时）</text>
  <text x="648" y="367" font-size="13.5" fill="#4d5652">上游 300s → Ascend 改 3000s</text>

  <!-- Bar 3: HCCL_EXEC_TIMEOUT -->
  <rect x="16" y="390" width="230" height="40" rx="5" fill="#f7e7f2" stroke="#9a4b86" stroke-width="1.3"/>
  <text x="131" y="415" text-anchor="middle" font-size="12" font-weight="700" font-family="var(--font-mono)" fill="#7a3a6a">HCCL_EXEC_TIMEOUT</text>
  <rect x="256" y="390" width="368" height="40" rx="5" fill="#f7e7f2" fill-opacity="0.6" stroke="#9a4b86" stroke-width="1.3"/>
  <text x="440" y="415" text-anchor="middle" font-size="13.5" font-weight="700" fill="#7a3a6a">集合通信成员等齐（HOST 1836s / AIV 上限 1091s）</text>
  <text x="636" y="415" font-size="13.5" fill="#8f3229">旧 VLLM_RPC_TIMEOUT 已失效</text>

  <!-- Bottom Version Landmark Strip -->
  <rect x="16" y="448" width="426" height="76" rx="7" fill="#fff4cf" stroke="#c78300" stroke-width="1.3"/>
  <text x="30" y="474" font-size="14.5" font-weight="700" fill="#936300">v0.30.0 (c09d3e20) · 第 3–5 站默认栈帧</text>
  <text x="30" y="497" font-size="13.5" font-family="var(--font-mono)" fill="#17211f">worker/model_runner_v1.py</text>
  <text x="30" y="516" font-size="13.5" fill="#4d5652">仅设 VLLM_USE_V2_MODEL_RUNNER=1 才切 V2</text>

  <rect x="458" y="448" width="426" height="76" rx="7" fill="#ddf4ef" stroke="#087f73" stroke-width="1.3"/>
  <text x="472" y="474" font-size="14.5" font-weight="700" fill="#065f56">main (8d6180e2) · 唯一 MRV2 栈帧</text>
  <text x="472" y="497" font-size="13.5" font-family="var(--font-mono)" fill="#17211f">worker/v2/model_runner.py + v2/spec_decode/</text>
  <text x="472" y="516" font-size="13.5" fill="#4d5652">同步定位算子须关 ACL 图 + 设 ASCEND_LAUNCH_BLOCKING=1</text>
</svg>
