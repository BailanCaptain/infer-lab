<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 700" width="880" height="700" role="img" aria-label="按日志定位先找实际抛错的进程，再用最内层 traceback 认站。跨进程转达的异常要沿回传方向追到原始日志；RPC 超时则需要对齐各 worker 的时间线。">
  <title>按日志定位先找实际抛错的进程，再用最内层 traceback 认站。跨进程转达的异常要沿回传方向追到原始日志；RPC 超时则需要对齐各 worker 的时间线。</title>
  <defs><marker id="request-call-chain-log-route-ah-ink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="var(--color-ink, #17211f)"/></marker></defs>
  <path d="M300 80 L154 106 L154 144" fill="none" stroke="var(--color-ink, #17211f)" stroke-width="1.4" marker-end="url(#request-call-chain-log-route-ah-ink)"/>
  <path d="M440 80 L440 144" fill="none" stroke="var(--color-ink, #17211f)" stroke-width="1.4" marker-end="url(#request-call-chain-log-route-ah-ink)"/>
  <path d="M580 80 L726 106 L726 144" fill="none" stroke="var(--color-ink, #17211f)" stroke-width="1.4" marker-end="url(#request-call-chain-log-route-ah-ink)"/>
  <path d="M154 210 L154 256 L290 256 L290 290" fill="none" stroke="var(--color-ink, #17211f)" stroke-width="1.4" marker-end="url(#request-call-chain-log-route-ah-ink)"/>
