  <path d="M726 210 L726 256 L590 256 L590 290" fill="none" stroke="var(--color-ink, #17211f)" stroke-width="1.4" marker-end="url(#request-call-chain-log-route-ah-ink)"/>
  <path d="M290 348 L290 380 L154 380 L154 428" fill="none" stroke="var(--color-ink, #17211f)" stroke-width="1.4" marker-end="url(#request-call-chain-log-route-ah-ink)"/>
  <path d="M440 348 L440 428" fill="none" stroke="var(--color-ink, #17211f)" stroke-width="1.4" marker-end="url(#request-call-chain-log-route-ah-ink)"/>
  <path d="M590 348 L590 380 L726 380 L726 428" fill="none" stroke="var(--color-ink, #17211f)" stroke-width="1.4" marker-end="url(#request-call-chain-log-route-ah-ink)"/>
  <path d="M154 508 L154 558 L290 558 L290 602" fill="none" stroke="var(--color-ink, #17211f)" stroke-width="1.4" marker-end="url(#request-call-chain-log-route-ah-ink)"/>
  <path d="M440 508 L440 602" fill="none" stroke="var(--color-ink, #17211f)" stroke-width="1.4" marker-end="url(#request-call-chain-log-route-ah-ink)"/>
  <path d="M726 508 L726 558 L590 558 L590 602" fill="none" stroke="var(--color-ink, #17211f)" stroke-width="1.4" marker-end="url(#request-call-chain-log-route-ah-ink)"/>
  <path d="M240 51 L8 51 L8 319 L170 319" fill="none" stroke="var(--color-ink, #17211f)" stroke-width="1.4" stroke-dasharray="7 5" marker-end="url(#request-call-chain-log-route-ah-ink)"/>
  <rect x="240" y="22" width="400" height="58" rx="8" fill="var(--color-surface-sunken, #ece9df)" stroke="var(--color-ink, #17211f)" stroke-width="1.5"/>
  <text x="440" y="56" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="14" font-weight="700" fill="var(--color-ink, #17211f)" text-anchor="middle">读报错内容：转达、超时还是本地异常？</text>
  <rect x="24" y="144" width="260" height="66" rx="8" fill="var(--color-accent-soft, #fff0e9)" stroke="var(--color-danger, #b54237)" stroke-opacity="0.4" stroke-width="1.5" stroke-dasharray="5 4"/>
  <text x="154" y="173" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="13" font-weight="400" fill="#8f3229" text-anchor="middle">EngineCore encountered an issue</text>
  <text x="154" y="192" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="13" font-weight="400" fill="#8f3229" text-anchor="middle">去 EngineCore 的原始 traceback</text>
  <rect x="310" y="144" width="260" height="66" rx="8" fill="var(--color-accent-soft, #fff0e9)" stroke="var(--color-danger, #b54237)" stroke-opacity="0.4" stroke-width="1.5" stroke-dasharray="5 4"/>
  <text x="440" y="173" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="13" font-weight="400" fill="#8f3229" text-anchor="middle">Worker failed with error</text>
  <text x="440" y="192" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="13" font-weight="400" fill="#8f3229" text-anchor="middle">去 worker 的原始 traceback</text>
  <rect x="596" y="144" width="260" height="66" rx="8" fill="var(--color-accent-soft, #fff0e9)" stroke="var(--color-danger, #b54237)" stroke-opacity="0.4" stroke-width="1.5" stroke-dasharray="5 4"/>
  <text x="726" y="173" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="13" font-weight="400" fill="#8f3229" text-anchor="middle">RPC call … timed out</text>
  <text x="726" y="192" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="13" font-weight="400" fill="#8f3229" text-anchor="middle">按时间对齐所有 worker 日志</text>
  <rect x="170" y="290" width="540" height="58" rx="8" fill="var(--color-surface-sunken, #ece9df)" stroke="var(--color-ink, #17211f)" stroke-width="1.5"/>
  <text x="440" y="324" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="14" font-weight="700" fill="var(--color-ink, #17211f)" text-anchor="middle">看原始日志前缀，再读最内层 traceback</text>
  <rect x="24" y="428" width="260" height="80" rx="8" fill="var(--color-surface-sunken, #ece9df)" stroke="var(--color-ink, #17211f)" stroke-width="1.5"/>
  <text x="154" y="464" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="14" font-weight="700" fill="var(--color-ink, #17211f)" text-anchor="middle">APIServer</text>
  <text x="154" y="483" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="13" font-weight="400" fill="var(--color-ink, #17211f)" text-anchor="middle">入口 → ①；输出处理 → ⑦</text>
  <rect x="310" y="428" width="260" height="80" rx="8" fill="var(--color-surface-sunken, #ece9df)" stroke="var(--color-ink, #17211f)" stroke-width="1.5"/>
  <text x="440" y="464" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="14" font-weight="700" fill="var(--color-ink, #17211f)" text-anchor="middle">EngineCore_DP0 / DP1</text>
  <text x="440" y="483" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="13" font-weight="400" fill="var(--color-ink, #17211f)" text-anchor="middle">schedule → ②；更新结果 → ⑥</text>
  <rect x="596" y="428" width="260" height="80" rx="8" fill="var(--color-surface-sunken, #ece9df)" stroke="var(--color-ink, #17211f)" stroke-width="1.5"/>
  <text x="726" y="464" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="14" font-weight="700" fill="var(--color-ink, #17211f)" text-anchor="middle">Worker_DP…_TP…_EP…</text>
  <text x="726" y="483" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="13" font-weight="400" fill="var(--color-ink, #17211f)" text-anchor="middle">准备输入 ③ → 前向 ④ → 采样 ⑤</text>
  <rect x="170" y="602" width="540" height="58" rx="8" fill="var(--color-surface-sunken, #ece9df)" stroke="var(--color-ink, #17211f)" stroke-width="1.5"/>
  <text x="440" y="627" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="14" font-weight="700" fill="var(--color-ink, #17211f)" text-anchor="middle">打开该站的源码位置，核对输入与条件</text>
  <text x="440" y="646" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="13" font-weight="400" fill="var(--color-ink, #17211f)" text-anchor="middle">DPCoordinator 的日志另查负载汇总与唤醒</text>
  <text x="22" y="282" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="13" font-weight="400" fill="var(--color-ink, #17211f)">本地异常直接认站</text>
</svg>
