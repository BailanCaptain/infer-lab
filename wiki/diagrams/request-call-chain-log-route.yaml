  - { at: [24, 144], size: [260, 66], text: EngineCore encountered an issue, sub: 去 EngineCore 的原始 traceback, tone: danger, style: faded }
  - { at: [310, 144], size: [260, 66], text: Worker failed with error, sub: 去 worker 的原始 traceback, tone: danger, style: faded }
  - { at: [596, 144], size: [260, 66], text: RPC call … timed out, sub: 按时间对齐所有 worker 日志, tone: danger, style: faded }
  - { at: [170, 290], size: [540, 58], text: 看原始日志前缀，再读最内层 traceback, style: plain }
  - { at: [24, 428], size: [260, 80], text: APIServer, sub: 入口 → ①；输出处理 → ⑦, style: plain }
  - { at: [310, 428], size: [260, 80], text: EngineCore_DP0 / DP1, sub: schedule → ②；更新结果 → ⑥, style: plain }
  - { at: [596, 428], size: [260, 80], text: Worker_DP…_TP…_EP…, sub: 准备输入 ③ → 前向 ④ → 采样 ⑤, style: plain }
  - { at: [170, 602], size: [540, 58], text: 打开该站的源码位置，核对输入与条件, sub: DPCoordinator 的日志另查负载汇总与唤醒, tone: control, style: plain }
