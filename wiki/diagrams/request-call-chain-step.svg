<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 680" width="880" height="680" role="img" aria-label="普通文本生成的一步发出两次 RPC，future 入队后再决定是否等结果。队列未满且还能推进时先开始下一圈，否则等待最老一批并更新请求；结构化输出需要前批 token 时，会延后第二次 RPC。">
  <title>普通文本生成的一步发出两次 RPC，future 入队后再决定是否等结果。队列未满且还能推进时先开始下一圈，否则等待最老一批并更新请求；结构化输出需要前批 token 时，会延后第二次 RPC。</title>
  <defs><marker id="request-call-chain-step-ah-control" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="var(--color-control, #66716d)"/></marker><marker id="request-call-chain-step-ah-token" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="var(--color-token, #087f73)"/></marker></defs>
  <rect x="24" y="64" width="368" height="558" rx="16" fill="none" stroke="var(--color-line-strong, #b8bcb5)" stroke-width="1.5"/>
  <text x="40" y="52" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="15" font-weight="700" fill="var(--color-ink, #17211f)">引擎进程</text>
  <rect x="468" y="64" width="388" height="558" rx="16" fill="none" stroke="var(--color-line-strong, #b8bcb5)" stroke-width="1.5"/>
  <text x="484" y="52" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="15" font-weight="700" fill="var(--color-ink, #17211f)">8 个 worker 进程（同时收到同一份清单）</text>
  <path d="M368 133 L492 133" fill="none" stroke="var(--color-control, #66716d)" stroke-width="1.4" marker-end="url(#request-call-chain-step-ah-control)"/>
  <path d="M368 237 L492 237" fill="none" stroke="var(--color-control, #66716d)" stroke-width="1.4" marker-end="url(#request-call-chain-step-ah-control)"/>
  <path d="M492 270 L440 296 L440 465 L368 465" fill="none" stroke="var(--color-token, #087f73)" stroke-width="1.4" marker-end="url(#request-call-chain-step-ah-token)"/>
  <path d="M208 158 L208 206" fill="none" stroke="var(--color-control, #66716d)" stroke-width="1.4" marker-end="url(#request-call-chain-step-ah-control)"/>
  <path d="M208 268 L208 320" fill="none" stroke="var(--color-control, #66716d)" stroke-width="1.4" marker-end="url(#request-call-chain-step-ah-control)"/>
  <path d="M208 384 L208 440" fill="none" stroke="var(--color-control, #66716d)" stroke-width="1.4" marker-end="url(#request-call-chain-step-ah-control)"/>
  <path d="M208 490 L208 548" fill="none" stroke="var(--color-control, #66716d)" stroke-width="1.4" marker-end="url(#request-call-chain-step-ah-control)"/>
  <path d="M48 352 L10 352 L10 133 L48 133" fill="none" stroke="var(--color-control, #66716d)" stroke-width="1.4" marker-end="url(#request-call-chain-step-ah-control)"/>
  <rect x="48" y="108" width="320" height="50" rx="8" fill="var(--color-surface-sunken, #ece9df)" stroke="var(--color-ink, #17211f)" stroke-width="1.5"/>
  <text x="208" y="138" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="14" font-weight="700" fill="var(--color-ink, #17211f)" text-anchor="middle">调度出这一步的清单</text>
  <rect x="48" y="206" width="320" height="62" rx="8" fill="var(--color-surface-sunken, #ece9df)" stroke="var(--color-ink, #17211f)" stroke-width="1.5"/>
  <text x="208" y="233" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="14" font-weight="700" fill="var(--color-ink, #17211f)" text-anchor="middle">准备允许出现的 token 表</text>
  <text x="208" y="252" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="13" font-weight="400" fill="var(--color-ink, #17211f)" text-anchor="middle">结构化输出用；普通文本请求为空</text>
  <rect x="48" y="320" width="320" height="64" rx="8" fill="var(--color-surface-sunken, #ece9df)" stroke="var(--color-ink, #17211f)" stroke-width="1.5"/>
  <text x="208" y="348" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="14" font-weight="700" fill="var(--color-ink, #17211f)" text-anchor="middle">future 入队：未满且还能推进？</text>
  <text x="208" y="367" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="13" font-weight="400" fill="var(--color-ink, #17211f)" text-anchor="middle">结果将来才到，先保存这一批的占位对象</text>
  <rect x="48" y="440" width="320" height="50" rx="8" fill="var(--color-surface-sunken, #ece9df)" stroke="var(--color-ink, #17211f)" stroke-width="1.5"/>
  <text x="208" y="470" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="14" font-weight="700" fill="var(--color-ink, #17211f)" text-anchor="middle">等队列里最老一批的结果</text>
  <rect x="48" y="548" width="320" height="50" rx="8" fill="var(--color-surface-sunken, #ece9df)" stroke="var(--color-ink, #17211f)" stroke-width="1.5"/>
  <text x="208" y="578" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="14" font-weight="700" fill="var(--color-ink, #17211f)" text-anchor="middle">按新 token 更新请求</text>
  <rect x="492" y="108" width="340" height="58" rx="8" fill="var(--color-token, #087f73)" stroke="var(--color-ink, #17211f)" stroke-width="1.5"/>
  <text x="662" y="133" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="14" font-weight="700" fill="var(--color-ink-inverse, #ffffff)" text-anchor="middle">准备输入、跑完 45 层</text>
  <text x="662" y="152" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="13" font-weight="400" fill="var(--color-ink-inverse, #ffffff)" text-anchor="middle">分数先留在 worker 进程里</text>
  <rect x="492" y="212" width="340" height="58" rx="8" fill="var(--color-token, #087f73)" stroke="var(--color-ink, #17211f)" stroke-width="1.5"/>
  <text x="662" y="237" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="14" font-weight="700" fill="var(--color-ink-inverse, #ffffff)" text-anchor="middle">取出分数、采样、草拟 3 个</text>
  <text x="662" y="256" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="13" font-weight="400" fill="var(--color-ink-inverse, #ffffff)" text-anchor="middle">交回这一步的新 token</text>
  <text x="400" y="120" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="13" font-weight="400" fill="#4d5652">第一次</text>
  <text x="400" y="224" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="13" font-weight="400" fill="#4d5652">第二次</text>
  <text x="492" y="342" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="14" font-weight="400" fill="#065f56">回传新 token，等待 CPU 可读结果</text>
  <text x="226" y="414" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="14" font-weight="400" fill="var(--color-ink, #17211f)">否：等结果</text>
  <text x="48" y="94" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="13" font-weight="400" fill="var(--color-ink, #17211f)">是：返回忙循环，优先调度下一圈</text>
  <text x="24" y="656" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="14" font-weight="400" fill="var(--color-ink, #17211f)">队列里最多两批，所以引擎最多领先 worker 一步</text>
</svg>
