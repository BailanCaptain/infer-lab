  <circle cx="320" cy="108" r="11" fill="var(--color-ink, #17211f)"/><text x="320" y="113" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="13" font-weight="700" fill="var(--color-ink-inverse, #ffffff)" text-anchor="middle">2</text>
  <circle cx="616" cy="100" r="11" fill="var(--color-ink, #17211f)"/><text x="616" y="105" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="13" font-weight="700" fill="var(--color-ink-inverse, #ffffff)" text-anchor="middle">3</text>
  <circle cx="616" cy="176" r="11" fill="var(--color-ink, #17211f)"/><text x="616" y="181" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="13" font-weight="700" fill="var(--color-ink-inverse, #ffffff)" text-anchor="middle">4</text>
  <circle cx="616" cy="252" r="11" fill="var(--color-ink, #17211f)"/><text x="616" y="257" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="13" font-weight="700" fill="var(--color-ink-inverse, #ffffff)" text-anchor="middle">5</text>
  <circle cx="320" cy="268" r="11" fill="var(--color-ink, #17211f)"/><text x="320" y="273" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="13" font-weight="700" fill="var(--color-ink-inverse, #ffffff)" text-anchor="middle">6</text>
  <circle cx="44" cy="268" r="11" fill="var(--color-ink, #17211f)"/><text x="44" y="273" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="13" font-weight="700" fill="var(--color-ink-inverse, #ffffff)" text-anchor="middle">7</text>
