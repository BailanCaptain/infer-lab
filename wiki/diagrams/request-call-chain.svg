<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 574" width="900" height="574" role="img" aria-label="那条请求的第 92 步 decode，七跳调用栈：缩进越深，离硬件越近">
  <title>那条请求的第 92 步 decode，七跳调用栈：缩进越深，离硬件越近</title>
  <rect width="900" height="574" fill="var(--color-surface, #fbfaf6)"/>
  <line x1="20" y1="186" x2="880" y2="186" stroke="var(--color-accent, #e85b32)" stroke-width="2.5" stroke-dasharray="7 5"/>
  <text x="876" y="177" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="13" font-weight="700" fill="var(--color-accent, #e85b32)" text-anchor="end">进程边界</text>
  <rect x="30" y="56" width="520" height="50" rx="11" fill="var(--color-surface, #fbfaf6)" stroke="var(--color-kv, #4c65b6)" stroke-width="1.5"/>
  <text x="46" y="77.5" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="14.5" font-weight="700" fill="var(--color-ink, #17211f)">一、HTTP 进来 / LLM.generate</text>
  <text x="46" y="95.5" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="12.5" font-weight="400" fill="var(--color-ink-muted, #5b6763)">前端进程，只有文字和 token id</text>
  <rect x="68" y="116" width="520" height="50" rx="11" fill="var(--color-surface, #fbfaf6)" stroke="var(--color-control, #5b6763)" stroke-width="1.5"/>
  <text x="84" y="129" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="14.5" font-weight="700" fill="var(--color-ink, #17211f)">二、调度器决定这一步跑它</text>
  <text x="84" y="147" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="12.5" font-weight="400" fill="var(--color-ink-muted, #5b6763)">产出 SchedulerOutput：1 个 token 的名额 + 两个 block id</text>
  <text x="84" y="164" font-family="'JetBrains Mono',ui-monospace,monospace" font-size="12.5" font-weight="400" fill="var(--color-control, #5b6763)">Scheduler.schedule</text>
  <rect x="106" y="200" width="520" height="50" rx="11" fill="var(--color-surface, #fbfaf6)" stroke="var(--color-weight, #b87a00)" stroke-width="1.5"/>
  <text x="122" y="213" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="14.5" font-weight="700" fill="var(--color-ink, #17211f)">三、昇腾侧第一跳</text>
  <text x="122" y="231" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="12.5" font-weight="400" fill="var(--color-ink-muted, #5b6763)">PP 收发：收上一段的中间结果，算完再发给下一段</text>
  <text x="122" y="248" font-family="'JetBrains Mono',ui-monospace,monospace" font-size="12.5" font-weight="400" fill="var(--color-weight, #b87a00)">NPUWorker.execute_model</text>
  <rect x="144" y="260" width="520" height="50" rx="11" fill="var(--color-surface, #fbfaf6)" stroke="var(--color-weight, #b87a00)" stroke-width="1.5"/>
  <text x="160" y="281.5" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="14.5" font-weight="700" fill="var(--color-ink, #17211f)">四、本卡这一步的主循环</text>
  <text x="160" y="299.5" font-family="'JetBrains Mono',ui-monospace,monospace" font-size="12.5" font-weight="400" fill="var(--color-weight, #b87a00)">NPUModelRunner.execute_model</text>
  <rect x="182" y="320" width="520" height="50" rx="11" fill="var(--color-surface, #fbfaf6)" stroke="var(--color-weight, #b87a00)" stroke-width="1.5"/>
  <text x="198" y="333" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="14.5" font-weight="700" fill="var(--color-ink, #17211f)">五、把请求摊成张量</text>
  <text x="198" y="351" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="12.5" font-weight="400" fill="var(--color-ink-muted, #5b6763)">算出第 128 个 token 落进第二块的第 0 格</text>
  <text x="198" y="368" font-family="'JetBrains Mono',ui-monospace,monospace" font-size="12.5" font-weight="400" fill="var(--color-weight, #b87a00)">_prepare_inputs</text>
  <rect x="220" y="380" width="520" height="50" rx="11" fill="var(--color-surface, #fbfaf6)" stroke="var(--color-weight, #b87a00)" stroke-width="1.5"/>
  <text x="236" y="401.5" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="14.5" font-weight="700" fill="var(--color-ink, #17211f)">六、跑 28 层，注意力算子读写 KV</text>
  <text x="236" y="419.5" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="12.5" font-weight="400" fill="var(--color-ink-muted, #5b6763)">按 block_table 逐块读，按 slot_mapping 写</text>
  <rect x="258" y="440" width="520" height="50" rx="11" fill="var(--color-surface, #fbfaf6)" stroke="var(--color-weight, #b87a00)" stroke-width="1.5"/>
  <text x="274" y="461.5" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="14.5" font-weight="700" fill="var(--color-ink, #17211f)">七、采样，产出 1 个 token id</text>
  <text x="274" y="479.5" font-family="'JetBrains Mono',ui-monospace,monospace" font-size="12.5" font-weight="400" fill="var(--color-weight, #b87a00)">sample_tokens</text>
  <path d="M808 56 l-8 0 L800 166 l8 0" fill="none" stroke="var(--color-control, #5b6763)" stroke-width="1.4" opacity="0.75"/>
  <text x="814" y="116" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="12.5" font-weight="600" fill="var(--color-control, #5b6763)">上游</text>
  <path d="M808 200 l-8 0 L800 490 l8 0" fill="none" stroke="var(--color-weight, #b87a00)" stroke-width="1.4" opacity="0.75"/>
  <text x="814" y="350" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="12.5" font-weight="600" fill="var(--color-weight, #b87a00)">昇腾</text>
  <text x="20" y="512" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="12.5" font-weight="400" fill="var(--color-ink-muted, #5b6763)">想改哪一跳就去哪儿：一、二两跳默认是上游代码，只能换掉整个调度器类或用 patch 换掉上游对象；三到五、七在 worker/ 下，直接改；第六跳在 </text>
  <text x="20" y="530.5" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="12.5" font-weight="400" fill="var(--color-ink-muted, #5b6763)">attention/ 与 ops/。</text>
  <text x="20" y="556" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="12.5" font-weight="400" fill="var(--color-ink-muted, #5b6763)">第二跳和第三跳之间那条线是进程边界，也是责任边界：过了它，「算哪些 token」已成定局，剩下全是「怎么算」。</text>
</svg>
