<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 620" width="900" height="620" role="img" aria-label="七站分在三种进程里：第 1、7 站在 API server，第 2、6 站在引擎进程，第 3 到第 5 站在每张卡的 worker 里。实线是按先后顺序传请求和结果的通道，虚线是同一步里几个进程一起参与的通信；node1 没接到这条请求，每一步也要跑一次空批次">
  <title>七站分在三种进程里：第 1、7 站在 API server，第 2、6 站在引擎进程，第 3 到第 5 站在每张卡的 worker 里。实线是按先后顺序传请求和结果的通道，虚线是同一步里几个进程一起参与的通信；node1 没接到这条请求，每一步也要跑一次空批次</title>
  <defs><marker id="request-call-chain-ah-control" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="var(--color-control, #66716d)"/></marker><marker id="request-call-chain-ah-token" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="var(--color-token, #087f73)"/></marker><marker id="request-call-chain-ah-comm" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="var(--color-comm, #9a4b86)"/></marker></defs>
  <rect x="24" y="64" width="232" height="292" rx="16" fill="none" stroke="var(--color-line-strong, #b8bcb5)" stroke-width="1.5"/>
  <text x="40" y="52" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="15" font-weight="700" fill="var(--color-ink, #17211f)">API server（node0，1 个）</text>
  <rect x="300" y="64" width="232" height="292" rx="16" fill="none" stroke="var(--color-line-strong, #b8bcb5)" stroke-width="1.5"/>
  <text x="316" y="52" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="15" font-weight="700" fill="var(--color-ink, #17211f)">引擎进程（node0，DP0）</text>
  <rect x="596" y="64" width="256" height="292" rx="16" fill="none" stroke="var(--color-line-strong, #b8bcb5)" stroke-width="1.5"/>
  <text x="612" y="52" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="15" font-weight="700" fill="var(--color-ink, #17211f)">worker（node0，每卡 1 个，共 8 个）</text>
  <rect x="300" y="434" width="232" height="106" rx="16" fill="none" stroke="var(--color-line-strong, #b8bcb5)" stroke-width="1.5"/>
  <text x="316" y="422" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="15" font-weight="700" fill="var(--color-ink, #17211f)">引擎进程（node1，DP1）</text>
  <rect x="596" y="434" width="256" height="106" rx="16" fill="none" stroke="var(--color-line-strong, #b8bcb5)" stroke-width="1.5"/>
  <text x="612" y="422" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="15" font-weight="700" fill="var(--color-ink, #17211f)">worker（node1，8 个）</text>
  <path d="M236 134 L320 134" fill="none" stroke="var(--color-control, #66716d)" stroke-width="1.4" marker-end="url(#request-call-chain-ah-control)"/>
  <path d="M512 134 L616 124" fill="none" stroke="var(--color-control, #66716d)" stroke-width="1.4" marker-end="url(#request-call-chain-ah-control)"/>
  <path d="M724 148 L724 176" fill="none" stroke="var(--color-token, #087f73)" stroke-width="1.4" marker-end="url(#request-call-chain-ah-token)"/>
  <path d="M724 224 L724 252" fill="none" stroke="var(--color-token, #087f73)" stroke-width="1.4" marker-end="url(#request-call-chain-ah-token)"/>
  <path d="M616 288 L512 294" fill="none" stroke="var(--color-token, #087f73)" stroke-width="1.4" marker-end="url(#request-call-chain-ah-token)"/>
  <path d="M320 294 L236 294" fill="none" stroke="var(--color-token, #087f73)" stroke-width="1.4" marker-end="url(#request-call-chain-ah-token)"/>
  <path d="M332 268 L332 160" fill="none" stroke="var(--color-control, #66716d)" stroke-width="1.4" marker-end="url(#request-call-chain-ah-control)"/>
  <path d="M500 356 L500 466" fill="none" stroke="var(--color-comm, #9a4b86)" stroke-width="2.2" stroke-dasharray="7 5" marker-start="url(#request-call-chain-ah-comm)" marker-end="url(#request-call-chain-ah-comm)"/>
  <path d="M852 200 L876 200 L876 488 L852 488" fill="none" stroke="var(--color-comm, #9a4b86)" stroke-width="2.2" stroke-dasharray="7 5" marker-start="url(#request-call-chain-ah-comm)" marker-end="url(#request-call-chain-ah-comm)"/>
  <rect x="44" y="108" width="192" height="52" rx="8" fill="var(--color-control-soft, #f1efe8)" stroke="var(--color-line-strong, #b8bcb5)" stroke-width="1.4"/>
  <text x="140" y="130" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="14" font-weight="700" fill="var(--color-ink, #17211f)" text-anchor="middle">入口</text>
  <text x="140" y="149" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="13" font-weight="400" fill="var(--color-ink-muted, #66716d)" text-anchor="middle">套模板、分词、选一组引擎</text>
  <rect x="44" y="268" width="192" height="52" rx="8" fill="var(--color-control-soft, #f1efe8)" stroke="var(--color-line-strong, #b8bcb5)" stroke-width="1.4"/>
  <text x="140" y="290" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="14" font-weight="700" fill="var(--color-ink, #17211f)" text-anchor="middle">返回与收尾</text>
  <text x="140" y="309" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="13" font-weight="400" fill="var(--color-ink-muted, #66716d)" text-anchor="middle">还原成文字、流式发回</text>
  <rect x="320" y="108" width="192" height="52" rx="8" fill="var(--color-control-soft, #f1efe8)" stroke="var(--color-line-strong, #b8bcb5)" stroke-width="1.4"/>
  <text x="416" y="130" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="14" font-weight="700" fill="var(--color-ink, #17211f)" text-anchor="middle">调度</text>
  <text x="416" y="149" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="13" font-weight="400" fill="var(--color-ink-muted, #66716d)" text-anchor="middle">这一步算谁、各算几个</text>
  <rect x="320" y="268" width="192" height="52" rx="8" fill="var(--color-control-soft, #f1efe8)" stroke="var(--color-line-strong, #b8bcb5)" stroke-width="1.4"/>
  <text x="416" y="290" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="14" font-weight="700" fill="var(--color-ink, #17211f)" text-anchor="middle">结果更新</text>
  <text x="416" y="309" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="13" font-weight="400" fill="var(--color-ink-muted, #66716d)" text-anchor="middle">追加、回退、判断结束</text>
  <rect x="616" y="100" width="216" height="48" rx="8" fill="var(--color-token-soft, #ddf4ef)" stroke="var(--color-token, #087f73)" stroke-width="1.4"/>
  <text x="724" y="120" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="14" font-weight="700" fill="var(--color-ink, #17211f)" text-anchor="middle">准备输入</text>
  <text x="724" y="139" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="13" font-weight="400" fill="#065f56" text-anchor="middle">清单翻成张量</text>
  <rect x="616" y="176" width="216" height="48" rx="8" fill="var(--color-token-soft, #ddf4ef)" stroke="var(--color-token, #087f73)" stroke-width="1.4"/>
  <text x="724" y="196" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="14" font-weight="700" fill="var(--color-ink, #17211f)" text-anchor="middle">逐层前向</text>
  <text x="724" y="215" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="13" font-weight="400" fill="#065f56" text-anchor="middle">45 层，算出分数</text>
  <rect x="616" y="252" width="216" height="48" rx="8" fill="var(--color-token-soft, #ddf4ef)" stroke="var(--color-token, #087f73)" stroke-width="1.4"/>
  <text x="724" y="272" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="14" font-weight="700" fill="var(--color-ink, #17211f)" text-anchor="middle">采样与草拟</text>
  <text x="724" y="291" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="13" font-weight="400" fill="#065f56" text-anchor="middle">选 1 个，再猜 3 个</text>
  <rect x="320" y="466" width="192" height="44" rx="8" fill="var(--color-surface, #fbfaf6)" stroke="var(--color-ink, #17211f)" stroke-opacity="0.45" stroke-width="1.3" stroke-dasharray="5 4"/>
  <text x="416" y="493" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="13" font-weight="400" fill="var(--color-ink, #17211f)" text-anchor="middle">空转一圈</text>
  <rect x="616" y="466" width="216" height="44" rx="8" fill="var(--color-surface, #fbfaf6)" stroke="var(--color-token, #087f73)" stroke-opacity="0.45" stroke-width="1.3" stroke-dasharray="5 4"/>
  <text x="724" y="493" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="13" font-weight="400" fill="#065f56" text-anchor="middle">跑一次空批次</text>
  <text x="258" y="120" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="13" font-weight="400" fill="#4d5652">网络消息</text>
  <text x="528" y="120" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="13" font-weight="400" fill="#4d5652">共享内存</text>
  <text x="344" y="200" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="13" font-weight="400" fill="#4d5652">下一步</text>
  <text x="490" y="398" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="13" font-weight="400" fill="#7a3a6a" text-anchor="end">两组对齐「还有没有活」</text>
  <text x="588" y="578" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="13" font-weight="400" fill="#7a3a6a" text-anchor="middle">专家分散在 16 张卡上，每步都要跨机器交换</text>
  <text x="24" y="578" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="13" font-weight="400" fill="var(--color-ink, #17211f)">node1 每一步陪跑一次完整前向</text>
