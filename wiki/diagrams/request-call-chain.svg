<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 250" width="900" height="250" role="img" aria-label="一条请求走过的七站：过了调度器旁边那条线，剩下的路全在昇腾的代码里">
  <title>一条请求走过的七站：过了调度器旁边那条线，剩下的路全在昇腾的代码里</title>
  <defs><marker id="request-call-chain-ah-ink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="var(--color-ink, #17211f)"/></marker><marker id="request-call-chain-ah-control" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="var(--color-control, #66716d)"/></marker></defs>
  <path d="M268 56 L268 224" fill="none" stroke="var(--color-ink-muted, #66716d)" stroke-width="1.4" stroke-dasharray="6 5"/>
  <text x="256" y="70" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="13" font-weight="700" fill="var(--color-ink-muted, #66716d)" text-anchor="end">上游 vLLM</text>
  <text x="280" y="70" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="13" font-weight="700" fill="var(--color-ink-muted, #66716d)">昇腾的代码</text>
  <path d="M124 114 L138 114" fill="none" stroke="var(--color-ink, #17211f)" stroke-width="1.4" marker-end="url(#request-call-chain-ah-ink)"/>
  <path d="M242 114 L296 114" fill="none" stroke="var(--color-ink, #17211f)" stroke-width="1.4" marker-end="url(#request-call-chain-ah-ink)"/>
  <path d="M400 114 L414 114" fill="none" stroke="var(--color-ink, #17211f)" stroke-width="1.4" marker-end="url(#request-call-chain-ah-ink)"/>
  <path d="M518 114 L532 114" fill="none" stroke="var(--color-ink, #17211f)" stroke-width="1.4" marker-end="url(#request-call-chain-ah-ink)"/>
  <path d="M636 114 L650 114" fill="none" stroke="var(--color-ink, #17211f)" stroke-width="1.4" marker-end="url(#request-call-chain-ah-ink)"/>
  <path d="M754 114 L768 114" fill="none" stroke="var(--color-ink, #17211f)" stroke-width="1.4" marker-end="url(#request-call-chain-ah-ink)"/>
  <path d="M820 144 L820 196 L190 196 L190 144" fill="none" stroke="var(--color-control, #66716d)" stroke-width="1.4" stroke-dasharray="7 5" marker-end="url(#request-call-chain-ah-control)"/>
  <rect x="20" y="84" width="104" height="60" rx="8" fill="var(--color-surface-sunken, #ece9df)" stroke="var(--color-control, #66716d)" stroke-opacity="0.4" stroke-width="1.5" stroke-dasharray="5 4"/>
  <text x="72" y="110" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="13" font-weight="400" fill="#4d5652" text-anchor="middle">接口</text>
  <text x="72" y="129" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="13" font-weight="400" fill="#4d5652" text-anchor="middle">收下请求</text>
  <rect x="138" y="84" width="104" height="60" rx="8" fill="var(--color-surface-sunken, #ece9df)" stroke="var(--color-control, #66716d)" stroke-opacity="0.4" stroke-width="1.5" stroke-dasharray="5 4"/>
  <text x="190" y="110" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="13" font-weight="400" fill="#4d5652" text-anchor="middle">调度器</text>
  <text x="190" y="129" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="13" font-weight="400" fill="#4d5652" text-anchor="middle">发 token 名额</text>
  <rect x="296" y="84" width="104" height="60" rx="8" fill="var(--color-control, #66716d)" stroke="var(--color-ink, #17211f)" stroke-width="1.5"/>
  <text x="348" y="110" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="14" font-weight="700" fill="var(--color-ink-inverse, #ffffff)" text-anchor="middle">Worker</text>
  <text x="348" y="129" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="13" font-weight="400" fill="var(--color-ink-inverse, #ffffff)" text-anchor="middle">管卡间收发</text>
  <rect x="414" y="84" width="104" height="60" rx="8" fill="var(--color-control, #66716d)" stroke="var(--color-ink, #17211f)" stroke-width="1.5"/>
  <text x="466" y="110" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="14" font-weight="700" fill="var(--color-ink-inverse, #ffffff)" text-anchor="middle">主循环</text>
  <text x="466" y="129" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="13" font-weight="400" fill="var(--color-ink-inverse, #ffffff)" text-anchor="middle">算不算它拍板</text>
  <rect x="532" y="84" width="104" height="60" rx="8" fill="var(--color-control, #66716d)" stroke="var(--color-ink, #17211f)" stroke-width="1.5"/>
  <text x="584" y="110" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="14" font-weight="700" fill="var(--color-ink-inverse, #ffffff)" text-anchor="middle">摆张量</text>
  <text x="584" y="129" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="13" font-weight="400" fill="var(--color-ink-inverse, #ffffff)" text-anchor="middle">定笔记落哪格</text>
  <rect x="650" y="84" width="104" height="60" rx="8" fill="var(--color-kv, #4c65b6)" stroke="var(--color-ink, #17211f)" stroke-width="1.5"/>
  <text x="702" y="110" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="14" font-weight="700" fill="var(--color-ink-inverse, #ffffff)" text-anchor="middle">走 40 层</text>
  <text x="702" y="129" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="13" font-weight="400" fill="var(--color-ink-inverse, #ffffff)" text-anchor="middle">读写 KV 笔记</text>
  <rect x="762" y="84" width="116" height="60" rx="8" fill="var(--color-token, #087f73)" stroke="var(--color-ink, #17211f)" stroke-width="1.5"/>
  <text x="820" y="110" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="14" font-weight="700" fill="var(--color-ink-inverse, #ffffff)" text-anchor="middle">采样</text>
  <text x="820" y="129" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="13" font-weight="400" fill="var(--color-ink-inverse, #ffffff)" text-anchor="middle">挑下一个 token</text>
  <text x="20" y="44" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="14" font-weight="700" fill="var(--color-ink, #17211f)">一步 = 从左到右走一遍，回来接着下一步</text>
  <text x="330" y="220" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="12.5" font-weight="400" fill="var(--color-ink-muted, #66716d)" font-style="italic">挑出的 token 交回上游，下一步从调度器再来</text>
  <circle cx="22" cy="84" r="11" fill="var(--color-ink, #17211f)"/><text x="22" y="89" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="13" font-weight="700" fill="var(--color-ink-inverse, #ffffff)" text-anchor="middle">1</text>
  <circle cx="140" cy="84" r="11" fill="var(--color-ink, #17211f)"/><text x="140" y="89" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="13" font-weight="700" fill="var(--color-ink-inverse, #ffffff)" text-anchor="middle">2</text>
  <circle cx="298" cy="84" r="11" fill="var(--color-ink, #17211f)"/><text x="298" y="89" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="13" font-weight="700" fill="var(--color-ink-inverse, #ffffff)" text-anchor="middle">3</text>
  <circle cx="416" cy="84" r="11" fill="var(--color-ink, #17211f)"/><text x="416" y="89" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="13" font-weight="700" fill="var(--color-ink-inverse, #ffffff)" text-anchor="middle">4</text>
  <circle cx="534" cy="84" r="11" fill="var(--color-ink, #17211f)"/><text x="534" y="89" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="13" font-weight="700" fill="var(--color-ink-inverse, #ffffff)" text-anchor="middle">5</text>
  <circle cx="652" cy="84" r="11" fill="var(--color-ink, #17211f)"/><text x="652" y="89" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="13" font-weight="700" fill="var(--color-ink-inverse, #ffffff)" text-anchor="middle">6</text>
  <circle cx="770" cy="84" r="11" fill="var(--color-ink, #17211f)"/><text x="770" y="89" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="13" font-weight="700" fill="var(--color-ink-inverse, #ffffff)" text-anchor="middle">7</text>
