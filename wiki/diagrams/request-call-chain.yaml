  - { at: [68, 116], size: [520, 50], title: 二、调度器决定这一步跑它, sub: "产出 SchedulerOutput：1 个 token 的名额 + 两个 block id", fn: Scheduler.schedule, tone: upstream }
  - { at: [106, 200], size: [520, 50], title: 三、昇腾侧第一跳, sub: PP 收发：收上一段的中间结果，算完再发给下一段, fn: NPUWorker.execute_model, tone: ascend }
