<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 320" width="880" height="320" role="img" aria-label="示意：单层 Transformer 在 [2, 4] 上的因果掩码注意力融合、当场写 KV cache、残差连接与 MLP 加工流程。">
  <title>示意：单层 Transformer 在 [2, 4] 上的因果掩码注意力融合、当场写 KV cache、残差连接与 MLP 加工流程。</title>
  <defs>
    <marker id="ck-teal" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#0F766E"/>
    </marker>
    <marker id="ck-blue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#1D4ED8"/>
    </marker>
    <marker id="ck-amber" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#B45309"/>
    </marker>
    <marker id="ck-slate" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#475569"/>
    </marker>
  </defs>

  <!-- Outer Backing -->
  <rect x="2" y="2" width="876" height="316" rx="8" fill="#FCFBF7" stroke="#D5CEBE" stroke-width="1.2"/>

  <!-- Top Header Bar -->
  <rect x="10" y="7" width="84" height="20" rx="4" fill="#1D4ED8"/>
  <text x="52" y="21" text-anchor="middle" font-family="var(--font-mono)" font-size="10.5" font-weight="700" fill="#FFFDF9">FIG 1.2</text>
  <text x="104" y="21" font-family="var(--font-sans)" font-size="12" font-weight="700" fill="#182230">第 2 件事单层拆解：因果掩码融合前文 + 当场写 KV cache + 残差与 MLP</text>
  <text x="868" y="21" text-anchor="end" font-family="var(--font-sans)" font-size="10.5" fill="#5E6B7D">孤立词义 [2, 4] → 完整上下文 h [2, 4]</text>
  <line x1="10" y1="31" x2="870" y2="31" stroke="#DFD9CA" stroke-width="1" stroke-dasharray="4 3"/>

  <!-- ==================== STAGE 1: INPUT & QKV PROJECTION ==================== -->
  <rect x="12" y="42" width="166" height="172" rx="6" fill="#FFFDF9" stroke="#94A3B8" stroke-width="1.2"/>
  <text x="95" y="60" text-anchor="middle" font-family="var(--font-sans)" font-size="10.6" font-weight="700" fill="#182230">① 孤立向量拆出 Q / K / V</text>

  <rect x="22" y="69" width="146" height="26" rx="4" fill="#ECFEFF" stroke="#0891B2" stroke-width="1.1"/>
  <text x="95" y="86" text-anchor="middle" font-family="var(--font-sans)" font-size="9.8" font-weight="700" fill="#0E7490">x₀「我」→ q₀, k₀, v₀</text>

  <rect x="22" y="101" width="146" height="26" rx="4" fill="#ECFEFF" stroke="#0891B2" stroke-width="1.1"/>
  <text x="95" y="118" text-anchor="middle" font-family="var(--font-sans)" font-size="9.8" font-weight="700" fill="#0E7490">x₁「喜欢」→ q₁, k₁, v₁</text>

  <rect x="22" y="136" width="146" height="68" rx="4" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="1"/>
  <text x="30" y="153" font-family="var(--font-sans)" font-size="9.4" fill="#334155"><tspan font-weight="700" fill="#0F766E">查询 q：</tspan>我想找什么前文</text>
  <text x="30" y="171" font-family="var(--font-sans)" font-size="9.4" fill="#334155"><tspan font-weight="700" fill="#1D4ED8">键 k：</tspan>供别人检索的标签</text>
  <text x="30" y="189" font-family="var(--font-sans)" font-size="9.4" fill="#334155"><tspan font-weight="700" fill="#1D4ED8">值 v：</tspan>本位置携带的内容</text>

  <line x1="178" y1="112" x2="196" y2="112" stroke="#0F766E" stroke-width="1.6" marker-end="url(#ck-teal)"/>

  <!-- ==================== STAGE 2: CAUSAL MASK & ATTENTION ==================== -->
  <rect x="198" y="42" width="276" height="172" rx="6" fill="#FFFBEB" stroke="#D97706" stroke-width="1.3"/>
  <text x="336" y="60" text-anchor="middle" font-family="var(--font-sans)" font-size="10.6" font-weight="700" fill="#92400E">② Attention：因果掩码（不偷看未来）与加权汇总</text>

  <!-- 2x2 Causal Mask Grid -->
  <text x="292" y="79" text-anchor="middle" font-family="var(--font-sans)" font-size="9.2" font-weight="700" fill="#475569">看 k₀(0我)</text>
  <text x="364" y="79" text-anchor="middle" font-family="var(--font-sans)" font-size="9.2" font-weight="700" fill="#475569">看 k₁(1喜欢)</text>

  <text x="252" y="102" text-anchor="end" font-family="var(--font-sans)" font-size="9.5" font-weight="700" fill="#1E293B">位置0 q₀</text>
  <rect x="258" y="86" width="68" height="24" rx="3" fill="#DCFCE7" stroke="#16A34A" stroke-width="1.1"/>
  <text x="292" y="102" text-anchor="middle" font-family="var(--font-sans)" font-size="9.2" font-weight="700" fill="#166534">✓ q₀·k₀</text>
  <rect x="330" y="86" width="68" height="24" rx="3" fill="#FFE4E6" stroke="#BE123C" stroke-width="1.1" stroke-dasharray="3 2"/>
  <text x="364" y="102" text-anchor="middle" font-family="var(--font-sans)" font-size="9.2" font-weight="700" fill="#BE123C">✗ 禁看未来</text>
  <text x="404" y="102" font-family="var(--font-sans)" font-size="9" fill="#475569">→ 仅取 v₀</text>

  <text x="252" y="132" text-anchor="end" font-family="var(--font-sans)" font-size="9.5" font-weight="700" fill="#92400E">位置1 q₁</text>
  <rect x="258" y="116" width="68" height="24" rx="3" fill="#FEF3C7" stroke="#D97706" stroke-width="1.3"/>
  <text x="292" y="132" text-anchor="middle" font-family="var(--font-sans)" font-size="9.2" font-weight="700" fill="#92400E">✓ q₁·k₀</text>
  <rect x="330" y="116" width="68" height="24" rx="3" fill="#FEF3C7" stroke="#D97706" stroke-width="1.3"/>
  <text x="364" y="132" text-anchor="middle" font-family="var(--font-sans)" font-size="9.2" font-weight="700" fill="#92400E">✓ q₁·k₁</text>
  <text x="404" y="132" font-family="var(--font-sans)" font-size="9" font-weight="700" fill="#92400E">→ 汇总0+1</text>

  <rect x="208" y="148" width="256" height="56" rx="4" fill="#FFFFFF" stroke="#FCD34D" stroke-width="1"/>
  <text x="216" y="166" font-family="var(--font-sans)" font-size="9.6" font-weight="700" fill="#92400E">位置 1「喜欢」怎样知道是谁喜欢？</text>
  <text x="216" y="182" font-family="var(--font-sans)" font-size="9.3" fill="#344054">拿 q₁ 跟 k₀、k₁ 算相关度权重，按权重把 v₀(我) 与</text>
  <text x="216" y="196" font-family="var(--font-sans)" font-size="9.3" fill="#344054">v₁(喜欢) 加权相加，把前文「我」融合进位置 1！</text>

  <!-- Immediate KV Cache Write Vault Below -->
  <line x1="336" y1="214" x2="336" y2="234" stroke="#1D4ED8" stroke-width="2" marker-end="url(#ck-blue)"/>
  <text x="346" y="228" font-family="var(--font-sans)" font-size="9.5" font-weight="700" fill="#1D4ED8">当场写入缓存</text>

  <rect x="198" y="236" width="276" height="72" rx="6" fill="#EFF6FF" stroke="#1D4ED8" stroke-width="1.4"/>
  <text x="210" y="254" font-family="var(--font-sans)" font-size="10.2" font-weight="700" fill="#1D4ED8">本层 KV cache（键值缓存 · 留给后续轮次直接读取）</text>
  <rect x="210" y="262" width="122" height="36" rx="4" fill="#DBEAFE" stroke="#3B82F6" stroke-width="1.1"/>
  <text x="271" y="278" text-anchor="middle" font-family="var(--font-mono)" font-size="9.5" font-weight="700" fill="#1E40AF">位置 0: k₀, v₀</text>
  <text x="271" y="292" text-anchor="middle" font-family="var(--font-sans)" font-size="9" fill="#1E3A8A">「我」的历史键值</text>

  <rect x="340" y="262" width="122" height="36" rx="4" fill="#DBEAFE" stroke="#3B82F6" stroke-width="1.1"/>
  <text x="401" y="278" text-anchor="middle" font-family="var(--font-mono)" font-size="9.5" font-weight="700" fill="#1E40AF">位置 1: k₁, v₁</text>
  <text x="401" y="292" text-anchor="middle" font-family="var(--font-sans)" font-size="9" fill="#1E3A8A">「喜欢」的历史键值</text>

  <!-- ==================== STAGE 3: RESIDUAL + NORM + MLP ==================== -->
  <line x1="474" y1="112" x2="492" y2="112" stroke="#D97706" stroke-width="1.6" marker-end="url(#ck-amber)"/>

  <rect x="494" y="42" width="212" height="196" rx="6" fill="#FFFDF9" stroke="#94A3B8" stroke-width="1.2"/>
  <text x="600" y="60" text-anchor="middle" font-family="var(--font-sans)" font-size="10.6" font-weight="700" fill="#182230">③ 残差相加 · 归一化 · MLP</text>

  <rect x="508" y="72" width="184" height="34" rx="4" fill="#F1F5F9" stroke="#64748B" stroke-width="1.1"/>
  <text x="600" y="87" text-anchor="middle" font-family="var(--font-sans)" font-size="9.8" font-weight="700" fill="#1E293B">+ 残差连接（加回原输入 x）</text>
  <text x="600" y="100" text-anchor="middle" font-family="var(--font-sans)" font-size="9" fill="#475569">防止多层传递冲掉原始信息</text>

  <line x1="600" y1="106" x2="600" y2="118" stroke="#475569" stroke-width="1.3" marker-end="url(#ck-slate)"/>

  <rect x="508" y="120" width="184" height="34" rx="4" fill="#F8FAFC" stroke="#64748B" stroke-width="1.1"/>
  <text x="600" y="135" text-anchor="middle" font-family="var(--font-sans)" font-size="9.8" font-weight="700" fill="#1E293B">RMSNorm 归一化</text>
  <text x="600" y="148" text-anchor="middle" font-family="var(--font-sans)" font-size="9" fill="#475569">把向量数值尺度拉回稳定范围</text>

  <line x1="600" y1="154" x2="600" y2="166" stroke="#475569" stroke-width="1.3" marker-end="url(#ck-slate)"/>

  <rect x="508" y="168" width="184" height="58" rx="4" fill="#FEF3C7" stroke="#D97706" stroke-width="1.2"/>
  <text x="600" y="185" text-anchor="middle" font-family="var(--font-sans)" font-size="10" font-weight="700" fill="#92400E">MLP 前馈网络 + 二次残差</text>
  <text x="600" y="201" text-anchor="middle" font-family="var(--font-sans)" font-size="9.2" fill="#78350F">SiluAndMul 逐位置非线性加工</text>
  <text x="600" y="216" text-anchor="middle" font-family="var(--font-sans)" font-size="9.2" fill="#78350F">再加回主干，不跨位置串信息</text>

  <!-- ==================== STAGE 4: OUTPUT HIDDEN STATES ==================== -->
  <line x1="706" y1="138" x2="724" y2="138" stroke="#0F766E" stroke-width="1.7" marker-end="url(#ck-teal)"/>

  <rect x="726" y="42" width="142" height="266" rx="6" fill="#F0FDF9" stroke="#0F766E" stroke-width="1.4"/>
  <text x="797" y="60" text-anchor="middle" font-family="var(--font-sans)" font-size="10.6" font-weight="700" fill="#0F766E">④ 层输出隐藏向量</text>
  <text x="797" y="75" text-anchor="middle" font-family="var(--font-mono)" font-size="9.8" font-weight="700" fill="#065F46">形状保持 [2, 4]</text>

  <!-- h0 -->
  <rect x="736" y="86" width="122" height="68" rx="5" fill="#FFFFFF" stroke="#94A3B8" stroke-width="1" stroke-dasharray="3 2"/>
  <text x="797" y="105" text-anchor="middle" font-family="var(--font-mono)" font-size="10.5" font-weight="700" fill="#475569">h₀ [1, 4]</text>
  <text x="797" y="122" text-anchor="middle" font-family="var(--font-sans)" font-size="9.2" fill="#64748B">仅看到位置 0「我」</text>
  <text x="797" y="138" text-anchor="middle" font-family="var(--font-sans)" font-size="9.2" fill="#64748B">使命已完（留 k₀,v₀）</text>

  <!-- h1 (Highlighted!) -->
  <rect x="736" y="164" width="122" height="92" rx="5" fill="#CCFBF1" stroke="#0F766E" stroke-width="1.6"/>
  <text x="797" y="184" text-anchor="middle" font-family="var(--font-mono)" font-size="11" font-weight="700" fill="#065F46">末行 h₁ [1, 4]</text>
  <text x="797" y="202" text-anchor="middle" font-family="var(--font-sans)" font-size="9.5" font-weight="700" fill="#0F766E">已同时装进：</text>
  <text x="797" y="218" text-anchor="middle" font-family="var(--font-sans)" font-size="9.6" font-weight="700" fill="#182230">位置0「我」+ 位置1「喜欢」</text>
  <text x="797" y="242" text-anchor="middle" font-family="var(--font-sans)" font-size="9.4" font-weight="700" fill="#B45309">★ 唯一送去第 3 件事打分</text>

  <text x="797" y="282" text-anchor="middle" font-family="var(--font-sans)" font-size="9.2" fill="#5E6B7D">若有多层则依次穿过</text>
  <text x="797" y="296" text-anchor="middle" font-family="var(--font-sans)" font-size="9.2" fill="#5E6B7D">全部层后再取末行</text>
</svg>
