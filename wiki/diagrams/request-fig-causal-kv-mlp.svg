<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 390" width="900" height="390" role="img" aria-label="示意：第 2 件事单层 Transformer 在 [2, 4] 上的内部流转。因果掩码让位置 0「我」只看位置 0、位置 1「喜欢」同时看位置 0 和 1（q₁ 与 k₀, k₁ 算权重汇总 v₀, v₁），当场把 k₀, k₁, v₀, v₁ 写入本层 KV cache，再经残差连接、RMSNorm 与 MLP 输出融合上下文的 h₀, h₁ [2, 4]。">
  <title>示意：第 2 件事单层 Transformer 在 [2, 4] 上的内部流转。因果掩码让位置 0「我」只看位置 0、位置 1「喜欢」同时看位置 0 和 1（q₁ 与 k₀, k₁ 算权重汇总 v₀, v₁），当场把 k₀, k₁, v₀, v₁ 写入本层 KV cache，再经残差连接、RMSNorm 与 MLP 输出融合上下文的 h₀, h₁ [2, 4]。</title>
  <desc>第 2 件事单层前向源码锚点：Attention.forward 结合 attn_metadata 读写 kv_cache，随后经 RMSNorm（hidden_size）与 SiluAndMul（forward_native）完成残差与前馈更新。</desc>
  <defs>
    <marker id="ck-teal" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#087f73"/>
    </marker>
    <marker id="ck-blue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#4c65b6"/>
    </marker>
    <marker id="ck-amber" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#c78300"/>
    </marker>
    <marker id="ck-slate" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#4d5652"/>
    </marker>
  </defs>

  <!-- ==================== STAGE 1: QKV PROJECTION (OPEN CANVAS) ==================== -->
  <circle cx="24" cy="26" r="12" fill="#087f73"/>
  <text x="24" y="30.5" text-anchor="middle" font-family="var(--font-sans)" font-size="12.5" font-weight="700" fill="#ffffff">1</text>
  <text x="42" y="31" font-family="var(--font-sans)" font-size="15.5" font-weight="700" fill="#17211f">拆出 Q / K / V</text>

  <rect x="12" y="52" width="178" height="40" rx="6" fill="#ddf4ef" stroke="#087f73" stroke-width="1.4"/>
  <text x="101" y="77" text-anchor="middle" font-family="var(--font-sans)" font-size="14" font-weight="700" fill="#065f56">x₀「我」→ q₀, k₀, v₀</text>

  <rect x="12" y="100" width="178" height="40" rx="6" fill="#ddf4ef" stroke="#087f73" stroke-width="1.4"/>
  <text x="101" y="125" text-anchor="middle" font-family="var(--font-sans)" font-size="14" font-weight="700" fill="#065f56">x₁「喜欢」→ q₁, k₁, v₁</text>

  <text x="14" y="172" font-family="var(--font-sans)" font-size="13.5" fill="#4d5652"><tspan font-weight="700" fill="#087f73">查询 q：</tspan>找什么前文</text>
  <text x="14" y="198" font-family="var(--font-sans)" font-size="13.5" fill="#4d5652"><tspan font-weight="700" fill="#4c65b6">键 k：</tspan>检索用标签</text>
  <text x="14" y="224" font-family="var(--font-sans)" font-size="13.5" fill="#4d5652"><tspan font-weight="700" fill="#4c65b6">值 v：</tspan>位置的内容</text>

  <line x1="190" y1="96" x2="212" y2="96" stroke="#087f73" stroke-width="1.6" marker-end="url(#ck-teal)"/>

  <!-- ==================== STAGE 2: CAUSAL MASK & KV CACHE ==================== -->
  <circle cx="226" cy="26" r="12" fill="#c78300"/>
  <text x="226" y="30.5" text-anchor="middle" font-family="var(--font-sans)" font-size="12.5" font-weight="700" fill="#ffffff">2</text>
  <text x="244" y="31" font-family="var(--font-sans)" font-size="15.5" font-weight="700" fill="#17211f">因果掩码融合 + 写 KV</text>

  <!-- 2x2 Causal Mask Grid -->
  <text x="329" y="58" text-anchor="middle" font-family="var(--font-sans)" font-size="13.5" font-weight="700" fill="#4d5652">看 k₀</text>
  <text x="423" y="58" text-anchor="middle" font-family="var(--font-sans)" font-size="13.5" font-weight="700" fill="#4d5652">看 k₁</text>

  <text x="278" y="89" text-anchor="end" font-family="var(--font-sans)" font-size="13.5" font-weight="700" fill="#17211f">0 号 q₀</text>
  <rect x="284" y="66" width="90" height="36" rx="4" fill="#cbe9e2" stroke="#087f73" stroke-width="1.3"/>
  <text x="329" y="89" text-anchor="middle" font-family="var(--font-sans)" font-size="13.5" font-weight="700" fill="#065f56">✓ q₀·k₀</text>
  <rect x="378" y="66" width="90" height="36" rx="4" fill="#fae1d8" stroke="#b54237" stroke-width="1.3" stroke-dasharray="4 3"/>
  <text x="423" y="89" text-anchor="middle" font-family="var(--font-sans)" font-size="13.5" font-weight="700" fill="#b54237">✗ 禁看</text>
  <text x="474" y="89" font-family="var(--font-sans)" font-size="13.5" fill="#4d5652">仅 v₀</text>

  <text x="278" y="131" text-anchor="end" font-family="var(--font-sans)" font-size="13.5" font-weight="700" fill="#936300">1 号 q₁</text>
  <rect x="284" y="108" width="90" height="36" rx="4" fill="#faeab8" stroke="#c78300" stroke-width="1.4"/>
  <text x="329" y="131" text-anchor="middle" font-family="var(--font-sans)" font-size="13.5" font-weight="700" fill="#936300">✓ q₁·k₀</text>
  <rect x="378" y="108" width="90" height="36" rx="4" fill="#faeab8" stroke="#c78300" stroke-width="1.4"/>
  <text x="423" y="131" text-anchor="middle" font-family="var(--font-sans)" font-size="13.5" font-weight="700" fill="#936300">✓ q₁·k₁</text>
  <text x="474" y="131" font-family="var(--font-sans)" font-size="13.5" font-weight="700" fill="#936300">融 0+1</text>

  <text x="216" y="172" font-family="var(--font-sans)" font-size="13.5" fill="#4d5652">q₁ 汇总 v₀、v₁，把「我」融入「喜欢」</text>
  <text x="216" y="196" font-family="var(--font-sans)" font-size="13.5" fill="#66716d">掩码禁看后文，旧 K、V 永不改变</text>

  <!-- Immediate KV Cache Write -->
  <line x1="364" y1="208" x2="364" y2="244" stroke="#4c65b6" stroke-width="1.8" marker-end="url(#ck-blue)"/>
  <text x="374" y="232" font-family="var(--font-sans)" font-size="13.5" font-weight="700" fill="#4c65b6">当场写入</text>

  <!-- Unified KV Cache Tensor Block -->
  <rect x="216" y="250" width="296" height="114" rx="8" fill="#e8edff" stroke="#4c65b6" stroke-width="1.5"/>
  <line x1="216" y1="284" x2="512" y2="284" stroke="#8c9fcc" stroke-width="1.2"/>
  <line x1="364" y1="284" x2="364" y2="364" stroke="#8c9fcc" stroke-width="1.2"/>
  <text x="364" y="273" text-anchor="middle" font-family="var(--font-sans)" font-size="14.5" font-weight="700" fill="#4c65b6">本层 KV cache（保留历史）</text>

  <text x="290" y="314" text-anchor="middle" font-family="var(--font-mono)" font-size="14" font-weight="700" fill="#3a4f93">k₀, v₀</text>
  <text x="290" y="342" text-anchor="middle" font-family="var(--font-sans)" font-size="13.5" fill="#4d5652">位置 0「我」</text>

  <text x="438" y="314" text-anchor="middle" font-family="var(--font-mono)" font-size="14" font-weight="700" fill="#3a4f93">k₁, v₁</text>
  <text x="438" y="342" text-anchor="middle" font-family="var(--font-sans)" font-size="13.5" fill="#4d5652">位置 1「喜欢」</text>

  <line x1="512" y1="106" x2="534" y2="106" stroke="#c78300" stroke-width="1.6" marker-end="url(#ck-amber)"/>

  <!-- ==================== STAGE 3: RESIDUAL + NORM + MLP ==================== -->
  <circle cx="548" cy="26" r="12" fill="#66716d"/>
  <text x="548" y="30.5" text-anchor="middle" font-family="var(--font-sans)" font-size="12.5" font-weight="700" fill="#ffffff">3</text>
  <text x="566" y="31" font-family="var(--font-sans)" font-size="15.5" font-weight="700" fill="#17211f">残差 · 归一化 · MLP</text>

  <rect x="536" y="52" width="188" height="58" rx="6" fill="#ece9df" stroke="#17211f" stroke-width="1.4"/>
  <text x="630" y="76" text-anchor="middle" font-family="var(--font-sans)" font-size="14.5" font-weight="700" fill="#17211f">+ 残差连接（加回 x）</text>
  <text x="630" y="98" text-anchor="middle" font-family="var(--font-sans)" font-size="13.5" fill="#4d5652">防多层冲掉原信息</text>

  <line x1="630" y1="110" x2="630" y2="130" stroke="#4d5652" stroke-width="1.6" marker-end="url(#ck-slate)"/>

  <rect x="536" y="132" width="188" height="58" rx="6" fill="#ece9df" stroke="#17211f" stroke-width="1.4"/>
  <text x="630" y="156" text-anchor="middle" font-family="var(--font-sans)" font-size="14.5" font-weight="700" fill="#17211f">RMSNorm 归一化</text>
  <text x="630" y="178" text-anchor="middle" font-family="var(--font-sans)" font-size="13.5" fill="#4d5652">拉回稳定数值尺度</text>

  <line x1="630" y1="190" x2="630" y2="210" stroke="#4d5652" stroke-width="1.6" marker-end="url(#ck-slate)"/>

  <rect x="536" y="212" width="188" height="84" rx="6" fill="#fff4cf" stroke="#c78300" stroke-width="1.5"/>
  <text x="630" y="238" text-anchor="middle" font-family="var(--font-sans)" font-size="14.5" font-weight="700" fill="#936300">MLP 前馈 + 残差</text>
  <text x="630" y="262" text-anchor="middle" font-family="var(--font-sans)" font-size="13.5" fill="#936300">SiluAndMul 非线性</text>
  <text x="630" y="284" text-anchor="middle" font-family="var(--font-sans)" font-size="13.5" fill="#936300">逐位置独立加工</text>

  <line x1="724" y1="158" x2="746" y2="158" stroke="#087f73" stroke-width="1.7" marker-end="url(#ck-teal)"/>

  <!-- ==================== STAGE 4: OUTPUT HIDDEN STATES ==================== -->
  <circle cx="760" cy="26" r="12" fill="#087f73"/>
  <text x="760" y="30.5" text-anchor="middle" font-family="var(--font-sans)" font-size="12.5" font-weight="700" fill="#ffffff">4</text>
  <text x="778" y="31" font-family="var(--font-sans)" font-size="15.5" font-weight="700" fill="#087f73">输出 h [2, 4]</text>

  <!-- h0 -->
  <rect x="748" y="52" width="144" height="92" rx="6" fill="#ffffff" stroke="#8a928f" stroke-width="1.3" stroke-dasharray="5 3"/>
  <text x="820" y="78" text-anchor="middle" font-family="var(--font-mono)" font-size="14.5" font-weight="700" fill="#4d5652">h₀ [1, 4]</text>
  <text x="820" y="104" text-anchor="middle" font-family="var(--font-sans)" font-size="13.5" fill="#66716d">仅见 0「我」</text>
  <text x="820" y="128" text-anchor="middle" font-family="var(--font-sans)" font-size="13.5" fill="#66716d">留 k₀, v₀ 即完</text>

  <!-- h1 (Highlighted) -->
  <rect x="748" y="158" width="144" height="132" rx="6" fill="#ddf4ef" stroke="#087f73" stroke-width="1.8"/>
  <text x="820" y="186" text-anchor="middle" font-family="var(--font-mono)" font-size="14.5" font-weight="700" fill="#065f56">末行 h₁ [1, 4]</text>
  <text x="820" y="214" text-anchor="middle" font-family="var(--font-sans)" font-size="13.5" font-weight="700" fill="#087f73">融合 0 + 1 前文</text>
  <text x="820" y="240" text-anchor="middle" font-family="var(--font-sans)" font-size="14" font-weight="700" fill="#17211f">「我」+「喜欢」</text>
  <text x="820" y="272" text-anchor="middle" font-family="var(--font-sans)" font-size="14" font-weight="700" fill="#c78300">★ 唯一送去打分</text>

  <text x="820" y="322" text-anchor="middle" font-family="var(--font-sans)" font-size="13.5" font-style="italic" fill="#66716d">穿完全部层后</text>
  <text x="820" y="346" text-anchor="middle" font-family="var(--font-sans)" font-size="13.5" font-style="italic" fill="#66716d">只取末行打分</text>
</svg>
