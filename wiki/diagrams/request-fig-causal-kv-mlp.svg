<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 330" width="900" height="330" role="img" aria-label="示意：第 2 件事单层 Transformer 在 [2, 4] 上的内部流转。因果掩码让位置 0「我」只看位置 0、位置 1「喜欢」同时看位置 0 和 1（q₁ 与 k₀, k₁ 算权重汇总 v₀, v₁），当场把 k₀, k₁, v₀, v₁ 写入本层 KV cache，再经残差连接、RMSNorm 与 MLP 输出融合上下文的 h₀, h₁ [2, 4]。">
  <title>示意：第 2 件事单层 Transformer 在 [2, 4] 上的内部流转。因果掩码让位置 0「我」只看位置 0、位置 1「喜欢」同时看位置 0 和 1（q₁ 与 k₀, k₁ 算权重汇总 v₀, v₁），当场把 k₀, k₁, v₀, v₁ 写入本层 KV cache，再经残差连接、RMSNorm 与 MLP 输出融合上下文的 h₀, h₁ [2, 4]。</title>
  <desc>第 2 件事单层前向源码锚点：Attention.forward 结合 attn_metadata 读写 kv_cache，随后经 RMSNorm（hidden_size）与 SiluAndMul（forward_native）完成残差与前馈更新。</desc>
  <defs>
    <marker id="ck-teal" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#087F73"/>
    </marker>
    <marker id="ck-blue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#2563EB"/>
    </marker>
    <marker id="ck-amber" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#C78300"/>
    </marker>
    <marker id="ck-slate" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#475569"/>
    </marker>
  </defs>

  <!-- ==================== STAGE 1: QKV PROJECTION (OPEN CANVAS) ==================== -->
  <circle cx="25" cy="24" r="11" fill="#087F73"/>
  <text x="25" y="28.5" text-anchor="middle" font-family="var(--font-sans)" font-size="12" font-weight="700" fill="#FFFFFF">1</text>
  <text x="43" y="29" font-family="var(--font-sans)" font-size="13.5" font-weight="700" fill="#17211F">拆出 Q / K / V</text>

  <rect x="14" y="48" width="172" height="34" rx="6" fill="#DDF4EF" stroke="#087F73" stroke-width="1.4"/>
  <text x="100" y="70" text-anchor="middle" font-family="var(--font-sans)" font-size="12" font-weight="700" fill="#065F46">x₀「我」→ q₀, k₀, v₀</text>

  <rect x="14" y="90" width="172" height="34" rx="6" fill="#DDF4EF" stroke="#087F73" stroke-width="1.4"/>
  <text x="100" y="112" text-anchor="middle" font-family="var(--font-sans)" font-size="12" font-weight="700" fill="#065F46">x₁「喜欢」→ q₁, k₁, v₁</text>

  <text x="16" y="152" font-family="var(--font-sans)" font-size="12" fill="#334155"><tspan font-weight="700" fill="#087F73">查询 q：</tspan>我想找什么前文</text>
  <text x="16" y="175" font-family="var(--font-sans)" font-size="12" fill="#334155"><tspan font-weight="700" fill="#2563EB">键 k：</tspan>供别人检索的标签</text>
  <text x="16" y="198" font-family="var(--font-sans)" font-size="12" fill="#334155"><tspan font-weight="700" fill="#2563EB">值 v：</tspan>本位置携带的内容</text>

  <line x1="186" y1="88" x2="212" y2="88" stroke="#087F73" stroke-width="1.6" marker-end="url(#ck-teal)"/>

  <!-- ==================== STAGE 2: CAUSAL MASK & KV CACHE ==================== -->
  <circle cx="227" cy="24" r="11" fill="#C78300"/>
  <text x="227" y="28.5" text-anchor="middle" font-family="var(--font-sans)" font-size="12" font-weight="700" fill="#FFFFFF">2</text>
  <text x="245" y="29" font-family="var(--font-sans)" font-size="13.5" font-weight="700" fill="#17211F">因果掩码融合前文 + 写 KV</text>

  <!-- 2x2 Causal Mask Grid -->
  <text x="320" y="54" text-anchor="middle" font-family="var(--font-sans)" font-size="11.5" font-weight="700" fill="#475569">看 k₀(0我)</text>
  <text x="404" y="54" text-anchor="middle" font-family="var(--font-sans)" font-size="11.5" font-weight="700" fill="#475569">看 k₁(1喜欢)</text>

  <text x="274" y="83" text-anchor="end" font-family="var(--font-sans)" font-size="12" font-weight="700" fill="#1E293B">位置0 q₀</text>
  <rect x="280" y="62" width="80" height="32" rx="4" fill="#DCFCE7" stroke="#16A34A" stroke-width="1.3"/>
  <text x="320" y="83" text-anchor="middle" font-family="var(--font-sans)" font-size="12" font-weight="700" fill="#166534">✓ q₀·k₀</text>
  <rect x="364" y="62" width="80" height="32" rx="4" fill="#FFE4E6" stroke="#BE123C" stroke-width="1.3" stroke-dasharray="4 3"/>
  <text x="404" y="83" text-anchor="middle" font-family="var(--font-sans)" font-size="11.5" font-weight="700" fill="#BE123C">✗ 禁看未来</text>
  <text x="450" y="83" font-family="var(--font-sans)" font-size="11.5" fill="#475569">→ 仅 v₀</text>

  <text x="274" y="119" text-anchor="end" font-family="var(--font-sans)" font-size="12" font-weight="700" fill="#92400E">位置1 q₁</text>
  <rect x="280" y="98" width="80" height="32" rx="4" fill="#FEF3C7" stroke="#D97706" stroke-width="1.4"/>
  <text x="320" y="119" text-anchor="middle" font-family="var(--font-sans)" font-size="12" font-weight="700" fill="#92400E">✓ q₁·k₀</text>
  <rect x="364" y="98" width="80" height="32" rx="4" fill="#FEF3C7" stroke="#D97706" stroke-width="1.4"/>
  <text x="404" y="119" text-anchor="middle" font-family="var(--font-sans)" font-size="12" font-weight="700" fill="#92400E">✓ q₁·k₁</text>
  <text x="450" y="119" font-family="var(--font-sans)" font-size="11.5" font-weight="700" fill="#92400E">→ 融 0+1</text>

  <text x="218" y="152" font-family="var(--font-sans)" font-size="12" fill="#334155">拿 q₁ 跟 k₀, k₁ 算权重，把 v₀(我) 融合进位置 1「喜欢」</text>
  <text x="218" y="172" font-family="var(--font-sans)" font-size="11.5" fill="#64748B">每个位置只能看自己与前文，因果掩码保证旧 K、V 永不改变</text>

  <!-- Immediate KV Cache Write -->
  <line x1="358" y1="182" x2="358" y2="216" stroke="#2563EB" stroke-width="1.8" marker-end="url(#ck-blue)"/>
  <text x="368" y="204" font-family="var(--font-sans)" font-size="12" font-weight="700" fill="#1D4ED8">当场写入缓存</text>

  <!-- Unified KV Cache Tensor Block -->
  <rect x="216" y="222" width="284" height="88" rx="8" fill="#EFF6FF" stroke="#2563EB" stroke-width="1.5"/>
  <line x1="216" y1="252" x2="500" y2="252" stroke="#93C5FD" stroke-width="1.2"/>
  <line x1="358" y1="252" x2="358" y2="310" stroke="#93C5FD" stroke-width="1.2"/>
  <text x="358" y="242" text-anchor="middle" font-family="var(--font-sans)" font-size="12.5" font-weight="700" fill="#1D4ED8">本层 KV cache（跨轮保留历史）</text>

  <text x="287" y="274" text-anchor="middle" font-family="var(--font-mono)" font-size="12" font-weight="700" fill="#1E40AF">位置 0: k₀, v₀</text>
  <text x="287" y="295" text-anchor="middle" font-family="var(--font-sans)" font-size="11.5" fill="#334155">「我」的历史键值</text>

  <text x="429" y="274" text-anchor="middle" font-family="var(--font-mono)" font-size="12" font-weight="700" fill="#1E40AF">位置 1: k₁, v₁</text>
  <text x="429" y="295" text-anchor="middle" font-family="var(--font-sans)" font-size="11.5" fill="#334155">「喜欢」的历史键值</text>

  <line x1="504" y1="96" x2="528" y2="96" stroke="#C78300" stroke-width="1.6" marker-end="url(#ck-amber)"/>

  <!-- ==================== STAGE 3: RESIDUAL + NORM + MLP ==================== -->
  <circle cx="543" cy="24" r="11" fill="#66716D"/>
  <text x="543" y="28.5" text-anchor="middle" font-family="var(--font-sans)" font-size="12" font-weight="700" fill="#FFFFFF">3</text>
  <text x="561" y="29" font-family="var(--font-sans)" font-size="13.5" font-weight="700" fill="#17211F">残差 · 归一化 · MLP</text>

  <rect x="532" y="48" width="186" height="46" rx="6" fill="#ECE9DF" stroke="#17211F" stroke-width="1.4"/>
  <text x="625" y="68" text-anchor="middle" font-family="var(--font-sans)" font-size="12.5" font-weight="700" fill="#17211F">+ 残差连接（加回 x）</text>
  <text x="625" y="86" text-anchor="middle" font-family="var(--font-sans)" font-size="11.5" fill="#475569">防止多层冲掉原始信息</text>

  <line x1="625" y1="94" x2="625" y2="112" stroke="#475569" stroke-width="1.5" marker-end="url(#ck-slate)"/>

  <rect x="532" y="114" width="186" height="46" rx="6" fill="#ECE9DF" stroke="#17211F" stroke-width="1.4"/>
  <text x="625" y="134" text-anchor="middle" font-family="var(--font-sans)" font-size="12.5" font-weight="700" fill="#17211F">RMSNorm 归一化</text>
  <text x="625" y="152" text-anchor="middle" font-family="var(--font-sans)" font-size="11.5" fill="#475569">把数值尺度拉回稳定范围</text>

  <line x1="625" y1="160" x2="625" y2="178" stroke="#475569" stroke-width="1.5" marker-end="url(#ck-slate)"/>

  <rect x="532" y="180" width="186" height="68" rx="6" fill="#FFF4CF" stroke="#C78300" stroke-width="1.5"/>
  <text x="625" y="201" text-anchor="middle" font-family="var(--font-sans)" font-size="12.5" font-weight="700" fill="#78350F">MLP 前馈 + 二次残差</text>
  <text x="625" y="220" text-anchor="middle" font-family="var(--font-sans)" font-size="11.5" fill="#92400E">SiluAndMul 逐位置非线性加工</text>
  <text x="625" y="238" text-anchor="middle" font-family="var(--font-sans)" font-size="11.5" fill="#92400E">再加回主干，不跨位置串信息</text>

  <line x1="718" y1="138" x2="744" y2="138" stroke="#087F73" stroke-width="1.7" marker-end="url(#ck-teal)"/>

  <!-- ==================== STAGE 4: OUTPUT HIDDEN STATES ==================== -->
  <circle cx="759" cy="24" r="11" fill="#087F73"/>
  <text x="759" y="28.5" text-anchor="middle" font-family="var(--font-sans)" font-size="12" font-weight="700" fill="#FFFFFF">4</text>
  <text x="777" y="29" font-family="var(--font-sans)" font-size="13.5" font-weight="700" fill="#087F73">输出 h [2, 4]</text>

  <!-- h0 -->
  <rect x="748" y="48" width="140" height="76" rx="6" fill="#FFFFFF" stroke="#94A3B8" stroke-width="1.3" stroke-dasharray="5 3"/>
  <text x="818" y="70" text-anchor="middle" font-family="var(--font-mono)" font-size="13" font-weight="700" fill="#475569">h₀ [1, 4]</text>
  <text x="818" y="91" text-anchor="middle" font-family="var(--font-sans)" font-size="11.5" fill="#64748B">仅看到位置 0「我」</text>
  <text x="818" y="110" text-anchor="middle" font-family="var(--font-sans)" font-size="11.5" fill="#64748B">使命已完（留 k₀,v₀）</text>

  <!-- h1 (Highlighted) -->
  <rect x="748" y="136" width="140" height="112" rx="6" fill="#DDF4EF" stroke="#087F73" stroke-width="1.8"/>
  <text x="818" y="160" text-anchor="middle" font-family="var(--font-mono)" font-size="13" font-weight="700" fill="#065F46">末行 h₁ [1, 4]</text>
  <text x="818" y="182" text-anchor="middle" font-family="var(--font-sans)" font-size="12" font-weight="700" fill="#087F73">已同时融合：</text>
  <text x="818" y="202" text-anchor="middle" font-family="var(--font-sans)" font-size="12" font-weight="700" fill="#17211F">0「我」+ 1「喜欢」</text>
  <text x="818" y="232" text-anchor="middle" font-family="var(--font-sans)" font-size="12" font-weight="700" fill="#B45309">★ 唯一送去打分</text>

  <text x="818" y="274" text-anchor="middle" font-family="var(--font-sans)" font-size="11.5" font-style="italic" fill="#64748B">多层模型依次穿过全部层</text>
  <text x="818" y="294" text-anchor="middle" font-family="var(--font-sans)" font-size="11.5" font-style="italic" fill="#64748B">最后只取末行算词表分数</text>
</svg>
