<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 310" width="900" height="310" role="img" aria-label="示意：为什么不能拿整数词编号 0、2 直接乘权重（0 号归零、2 号被强锁为 1 号两倍），以及真实机制如何先将「我喜欢」切成 [0, 2]，再从 6×4 嵌入表 E 零乘法按行抽出 x₀、x₁ 拼成 [2, 4] 初始张量。">
  <title>示意：为什么不能拿整数词编号 0、2 直接乘权重（0 号归零、2 号被强锁为 1 号两倍），以及真实机制如何先将「我喜欢」切成 [0, 2]，再从 6×4 嵌入表 E 零乘法按行抽出 x₀、x₁ 拼成 [2, 4] 初始张量。</title>
  <desc>第 1 件事分词校验与查表源码锚点：CachedTokenizer 核对 max_token_id 与 vocab_size，_validate_prompt_len 校验 max_model_len，VocabParallelEmbedding 调用 embedding 按行零乘法查出初始张量。</desc>
  <defs>
    <marker id="te-red" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#BE123C"/>
    </marker>
    <marker id="te-teal" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#087F73"/>
    </marker>
  </defs>

  <!-- Open Column Divider (Zero Outer Backing, Zero Panel Cages) -->
  <line x1="390" y1="12" x2="390" y2="298" stroke="#CBD5E1" stroke-width="1.4" stroke-dasharray="6 5"/>

  <!-- ==================== LEFT COLUMN: WRONG INTUITION ==================== -->
  <text x="16" y="26" font-family="var(--font-sans)" font-size="14" font-weight="700" fill="#BE123C">✗ 错误直觉：拿整数词编号直接去乘权重</text>

  <!-- Flaw 1: 0 x w = 0 -->
  <rect x="16" y="50" width="96" height="34" rx="6" fill="#FFE4E6" stroke="#BE123C" stroke-width="1.4"/>
  <text x="64" y="72" text-anchor="middle" font-family="var(--font-sans)" font-size="12.5" font-weight="700" fill="#9F1239">0 号「我」</text>

  <line x1="112" y1="67" x2="170" y2="67" stroke="#BE123C" stroke-width="1.5" marker-end="url(#te-red)"/>
  <text x="141" y="60" text-anchor="middle" font-family="var(--font-mono)" font-size="12" font-weight="700" fill="#BE123C">0 × w</text>

  <rect x="174" y="50" width="198" height="34" rx="6" fill="#FFF1F2" stroke="#BE123C" stroke-width="1.4" stroke-dasharray="4 3"/>
  <text x="273" y="72" text-anchor="middle" font-family="var(--font-mono)" font-size="12" font-weight="700" fill="#BE123C">[ 0.0, 0.0, 0.0, 0.0 ]</text>

  <text x="16" y="108" font-family="var(--font-sans)" font-size="12" font-weight="700" fill="#9F1239">致命后果 1：0 乘任何数都归零，「我」的词义消失</text>

  <line x1="16" y1="126" x2="372" y2="126" stroke="#E5E3DC" stroke-width="1"/>

  <!-- Flaw 2: 2 x w = 2 * (1 x w) -->
  <rect x="16" y="142" width="108" height="34" rx="6" fill="#FFE4E6" stroke="#BE123C" stroke-width="1.4"/>
  <text x="70" y="164" text-anchor="middle" font-family="var(--font-sans)" font-size="12.5" font-weight="700" fill="#9F1239">2 号「喜欢」</text>

  <text x="142" y="164" text-anchor="middle" font-family="var(--font-mono)" font-size="13" font-weight="700" fill="#BE123C">=?=</text>

  <rect x="160" y="142" width="212" height="34" rx="6" fill="#FFF1F2" stroke="#BE123C" stroke-width="1.4"/>
  <text x="266" y="164" text-anchor="middle" font-family="var(--font-sans)" font-size="12" font-weight="700" fill="#9F1239">2 ×（1 号「你」的表示）</text>

  <text x="16" y="198" font-family="var(--font-sans)" font-size="12" font-weight="700" fill="#9F1239">致命后果 2：「喜欢」并非「你」的两倍！</text>
  <text x="16" y="218" font-family="var(--font-sans)" font-size="12" fill="#475569">词编号只是目录「门牌号」，没有大小与倍数关系</text>

  <!-- Bottom Open Accent Note -->
  <rect x="16" y="246" width="4" height="42" rx="2" fill="#BE123C"/>
  <text x="28" y="262" font-family="var(--font-sans)" font-size="12" font-weight="700" fill="#17211F">必须给每个门牌号配一排独立训练的浮点数</text>
  <text x="28" y="283" font-family="var(--font-sans)" font-size="11.5" fill="#64748B">进门校验长度 ≤ max_model_len 且编号 &lt; vocab_size</text>

  <!-- ==================== RIGHT COLUMN: TRUE LOOKUP ==================== -->
  <text x="408" y="26" font-family="var(--font-sans)" font-size="14" font-weight="700" fill="#087F73">✓ 真实查表：切出 [0, 2] → 从 6×4 嵌入表 E 零乘法抽行</text>

  <!-- Sub-stage 1: Prompt & Tokenizer -->
  <text x="462" y="52" text-anchor="middle" font-family="var(--font-sans)" font-size="12.5" font-weight="700" fill="#087F73">① 分词切号</text>
  <rect x="408" y="62" width="108" height="34" rx="6" fill="#FFFFFF" stroke="#087F73" stroke-width="1.5"/>
  <text x="462" y="84" text-anchor="middle" font-family="var(--font-sans)" font-size="13" font-weight="700" fill="#17211F">「我喜欢」</text>

  <line x1="462" y1="96" x2="462" y2="120" stroke="#087F73" stroke-width="1.5" marker-end="url(#te-teal)"/>
  <text x="462" y="135" text-anchor="middle" font-family="var(--font-mono)" font-size="11.5" font-weight="700" fill="#087F73">tokenizer</text>

  <rect x="408" y="144" width="108" height="32" rx="6" fill="#DDF4EF" stroke="#087F73" stroke-width="1.4"/>
  <text x="462" y="165" text-anchor="middle" font-family="var(--font-sans)" font-size="12" font-weight="700" fill="#065F46">位置0: 0「我」</text>

  <rect x="408" y="184" width="108" height="32" rx="6" fill="#DDF4EF" stroke="#087F73" stroke-width="1.4"/>
  <text x="462" y="205" text-anchor="middle" font-family="var(--font-sans)" font-size="12" font-weight="700" fill="#065F46">位置1: 2「喜欢」</text>

  <text x="462" y="238" text-anchor="middle" font-family="var(--font-mono)" font-size="12.5" font-weight="700" fill="#17211F">序列 [0, 2]</text>

  <!-- Sub-stage 2: Unified 6x4 Embedding Table E -->
  <text x="632" y="52" text-anchor="middle" font-family="var(--font-sans)" font-size="12.5" font-weight="700" fill="#17211F">② 嵌入表 E [6×4]</text>
  <rect x="544" y="62" width="176" height="180" rx="6" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.3"/>
  <line x1="606" y1="62" x2="606" y2="242" stroke="#E2E8F0" stroke-width="1"/>
  <line x1="544" y1="122" x2="720" y2="122" stroke="#E2E8F0" stroke-width="1"/>
  <line x1="544" y1="182" x2="720" y2="182" stroke="#E2E8F0" stroke-width="1"/>
  <line x1="544" y1="212" x2="720" y2="212" stroke="#E2E8F0" stroke-width="1"/>

  <!-- Row 0 (Selected) -->
  <rect x="544" y="62" width="176" height="30" rx="4" fill="#DDF4EF" stroke="#087F73" stroke-width="1.6"/>
  <line x1="606" y1="62" x2="606" y2="92" stroke="#087F73" stroke-width="1"/>
  <text x="575" y="82" text-anchor="middle" font-family="var(--font-sans)" font-size="12" font-weight="700" fill="#087F73">0「我」</text>
  <text x="663" y="82" text-anchor="middle" font-family="var(--font-mono)" font-size="12" font-weight="700" fill="#065F46">第 0 行 E[0]</text>

  <!-- Row 1 (Dimmed) -->
  <text x="575" y="112" text-anchor="middle" font-family="var(--font-sans)" font-size="11.5" fill="#94A3B8">1「你」</text>
  <text x="663" y="112" text-anchor="middle" font-family="var(--font-mono)" font-size="11.5" fill="#94A3B8">E[1] 未读</text>

  <!-- Row 2 (Selected) -->
  <rect x="544" y="122" width="176" height="30" rx="4" fill="#DDF4EF" stroke="#087F73" stroke-width="1.6"/>
  <line x1="606" y1="122" x2="606" y2="152" stroke="#087F73" stroke-width="1"/>
  <text x="575" y="142" text-anchor="middle" font-family="var(--font-sans)" font-size="12" font-weight="700" fill="#087F73">2「喜欢」</text>
  <text x="663" y="142" text-anchor="middle" font-family="var(--font-mono)" font-size="12" font-weight="700" fill="#065F46">第 2 行 E[2]</text>

  <!-- Rows 3, 4, 5 (Dimmed) -->
  <text x="575" y="172" text-anchor="middle" font-family="var(--font-sans)" font-size="11.5" fill="#94A3B8">3「猫」</text>
  <text x="663" y="172" text-anchor="middle" font-family="var(--font-mono)" font-size="11.5" fill="#94A3B8">E[3] 未读</text>

  <text x="575" y="202" text-anchor="middle" font-family="var(--font-sans)" font-size="11.5" fill="#94A3B8">4「看」</text>
  <text x="663" y="202" text-anchor="middle" font-family="var(--font-mono)" font-size="11.5" fill="#94A3B8">E[4] 未读</text>

  <text x="575" y="232" text-anchor="middle" font-family="var(--font-sans)" font-size="11.5" fill="#94A3B8">5「。」</text>
  <text x="663" y="232" text-anchor="middle" font-family="var(--font-mono)" font-size="11.5" fill="#94A3B8">E[5] 未读</text>

  <!-- Lookup Arrows -->
  <path d="M 516 160 L 529 160 L 529 77 L 542 77" fill="none" stroke="#087F73" stroke-width="1.5" marker-end="url(#te-teal)"/>
  <path d="M 516 200 L 535 200 L 535 137 L 542 137" fill="none" stroke="#087F73" stroke-width="1.5" marker-end="url(#te-teal)"/>

  <text x="632" y="266" text-anchor="middle" font-family="var(--font-sans)" font-size="12" font-weight="700" fill="#087F73">零乘加运算 · 纯按行号抽行</text>
  <text x="632" y="286" text-anchor="middle" font-family="var(--font-mono)" font-size="11.5" fill="#64748B">VocabParallelEmbedding</text>

  <!-- Sub-stage 3: Unified [2, 4] Output Tensor -->
  <text x="818" y="52" text-anchor="middle" font-family="var(--font-sans)" font-size="12.5" font-weight="700" fill="#087F73">③ 初始张量 [2, 4]</text>

  <rect x="748" y="84" width="140" height="72" rx="6" fill="#DDF4EF" stroke="#087F73" stroke-width="1.6"/>
  <line x1="748" y1="120" x2="888" y2="120" stroke="#087F73" stroke-width="1.2"/>
  <text x="818" y="107" text-anchor="middle" font-family="var(--font-mono)" font-size="12" font-weight="700" fill="#065F46">x₀ = E[0] (我)</text>
  <text x="818" y="143" text-anchor="middle" font-family="var(--font-mono)" font-size="12" font-weight="700" fill="#065F46">x₁ = E[2] (喜欢)</text>

  <path d="M 720 77 L 746 102" fill="none" stroke="#087F73" stroke-width="1.5" marker-end="url(#te-teal)"/>
  <path d="M 720 137 L 746 138" fill="none" stroke="#087F73" stroke-width="1.5" marker-end="url(#te-teal)"/>

  <text x="818" y="186" text-anchor="middle" font-family="var(--font-sans)" font-size="12" fill="#334155">2 行 = 提示词 2 个位置</text>
  <text x="818" y="208" text-anchor="middle" font-family="var(--font-sans)" font-size="12" fill="#334155">4 列 = 教学隐藏维宽度</text>
  <text x="818" y="236" text-anchor="middle" font-family="var(--font-sans)" font-size="12.5" font-weight="700" fill="#087F73">一起并行送进第 1 层 ▶</text>
</svg>
