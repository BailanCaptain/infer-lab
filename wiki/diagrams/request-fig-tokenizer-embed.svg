<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 290" width="880" height="290" role="img" aria-label="示意：为什么不能拿整数词编号直接乘权重，以及分词切号后从 6×4 嵌入表 E 按行零乘法查表的对比图。">
  <title>示意：为什么不能拿整数词编号直接乘权重，以及分词切号后从 6×4 嵌入表 E 按行零乘法查表的对比图。</title>
  <defs>
    <marker id="te-red" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#BE123C"/>
    </marker>
    <marker id="te-teal" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#0F766E"/>
    </marker>
  </defs>

  <!-- Outer Backing -->
  <rect x="2" y="2" width="876" height="286" rx="8" fill="#FCFBF7" stroke="#D5CEBE" stroke-width="1.2"/>

  <!-- Top Header Bar -->
  <rect x="10" y="7" width="84" height="20" rx="4" fill="#0F766E"/>
  <text x="52" y="21" text-anchor="middle" font-family="var(--font-mono)" font-size="10.5" font-weight="700" fill="#FFFDF9">FIG 1.1</text>
  <text x="104" y="21" font-family="var(--font-sans)" font-size="12" font-weight="700" fill="#182230">第 1 件事：为什么不能拿词编号直接相乘？分词切号与嵌入表零乘法查表对比</text>
  <text x="868" y="21" text-anchor="end" font-family="var(--font-sans)" font-size="10.5" fill="#5E6B7D">编号是目录门牌号 · 向量是独立浮点数</text>
  <line x1="10" y1="31" x2="870" y2="31" stroke="#DFD9CA" stroke-width="1" stroke-dasharray="4 3"/>

  <!-- ==================== LEFT PANEL: WRONG INTUITION ==================== -->
  <rect x="12" y="38" width="380" height="240" rx="6" fill="#FFF5F6" stroke="#F43F5E" stroke-width="1.3"/>
  <rect x="12" y="38" width="380" height="28" rx="5" fill="#FFE4E6"/>
  <text x="24" y="56" font-family="var(--font-sans)" font-size="11.2" font-weight="800" fill="#BE123C">✗ 错误直觉：拿整数词编号 0, 2 直接去乘权重</text>

  <!-- Flaw 1: 0 x W = 0 -->
  <rect x="22" y="76" width="360" height="68" rx="5" fill="#FFFFFF" stroke="#FDA4AF" stroke-width="1"/>
  <rect x="32" y="86" width="76" height="24" rx="4" fill="#FFE4E6" stroke="#BE123C" stroke-width="1"/>
  <text x="70" y="102" text-anchor="middle" font-family="var(--font-sans)" font-size="10.5" font-weight="700" fill="#9F1239">0 号「我」</text>
  <line x1="108" y1="98" x2="166" y2="98" stroke="#BE123C" stroke-width="1.5" marker-end="url(#te-red)"/>
  <text x="137" y="92" text-anchor="middle" font-family="var(--font-mono)" font-size="9.5" font-weight="700" fill="#BE123C">0 × w</text>
  <rect x="172" y="86" width="198" height="24" rx="4" fill="#FFF1F2" stroke="#BE123C" stroke-width="1" stroke-dasharray="3 2"/>
  <text x="271" y="102" text-anchor="middle" font-family="var(--font-mono)" font-size="10" font-weight="700" fill="#BE123C">[ 0.0,  0.0,  0.0,  0.0 ]</text>
  <text x="32" y="132" font-family="var(--font-sans)" font-size="10" font-weight="700" fill="#BE123C">致命后果 1：0 乘任何数都归零，「我」的词义当场消失！</text>

  <!-- Flaw 2: 2 x W = 2 * (1 x W) -->
  <rect x="22" y="152" width="360" height="72" rx="5" fill="#FFFFFF" stroke="#FDA4AF" stroke-width="1"/>
  <rect x="32" y="162" width="84" height="24" rx="4" fill="#FFE4E6" stroke="#BE123C" stroke-width="1"/>
  <text x="74" y="178" text-anchor="middle" font-family="var(--font-sans)" font-size="10.2" font-weight="700" fill="#9F1239">2 号「喜欢」</text>
  <text x="128" y="178" text-anchor="middle" font-family="var(--font-mono)" font-size="11" font-weight="700" fill="#BE123C">=?=</text>
  <rect x="144" y="162" width="226" height="24" rx="4" fill="#FFF1F2" stroke="#BE123C" stroke-width="1"/>
  <text x="257" y="178" text-anchor="middle" font-family="var(--font-sans)" font-size="10" font-weight="700" fill="#9F1239">2 ×（1 号「你」的表示）</text>
  <text x="32" y="204" font-family="var(--font-sans)" font-size="9.8" font-weight="700" fill="#BE123C">致命后果 2：「喜欢」并非「你」的两倍！</text>
  <text x="32" y="218" font-family="var(--font-sans)" font-size="9.5" fill="#475569">词编号只是目录里的「门牌号」，没有大小和倍数关系</text>

  <!-- Bottom Note -->
  <rect x="22" y="232" width="360" height="36" rx="5" fill="#FFE4E6" stroke="#FB7185" stroke-width="1"/>
  <text x="202" y="254" text-anchor="middle" font-family="var(--font-sans)" font-size="10" font-weight="700" fill="#9F1239">必须给每个门牌号配一排可独立训练调整的浮点数</text>

  <!-- ==================== RIGHT PANEL: TRUE LOOKUP ==================== -->
  <rect x="404" y="38" width="464" height="240" rx="6" fill="#F0FDF9" stroke="#0F766E" stroke-width="1.4"/>
  <rect x="404" y="38" width="464" height="28" rx="5" fill="#CCFBF1"/>
  <text x="416" y="56" font-family="var(--font-sans)" font-size="11.2" font-weight="800" fill="#0F766E">✓ 真实查表：分词切出 [0, 2] → 从 6×4 嵌入表 E 零乘法按行抽出</text>

  <!-- Step A: Prompt & Tokenizer -->
  <text x="458" y="82" text-anchor="middle" font-family="var(--font-sans)" font-size="10" font-weight="700" fill="#0F766E">① 分词切号</text>
  <rect x="416" y="90" width="84" height="28" rx="5" fill="#FFFFFF" stroke="#0F766E" stroke-width="1.2"/>
  <text x="458" y="108" text-anchor="middle" font-family="var(--font-sans)" font-size="11" font-weight="700" fill="#182230">「我喜欢」</text>

  <line x1="458" y1="118" x2="458" y2="134" stroke="#0F766E" stroke-width="1.4" marker-end="url(#te-teal)"/>
  <text x="458" y="147" text-anchor="middle" font-family="var(--font-mono)" font-size="9.2" font-weight="700" fill="#0F766E">tokenizer</text>

  <rect x="416" y="154" width="84" height="28" rx="5" fill="#CCFBF1" stroke="#0F766E" stroke-width="1.3"/>
  <text x="458" y="172" text-anchor="middle" font-family="var(--font-sans)" font-size="10.2" font-weight="700" fill="#0F766E">位置0: 0「我」</text>

  <rect x="416" y="190" width="84" height="28" rx="5" fill="#CCFBF1" stroke="#0F766E" stroke-width="1.3"/>
  <text x="458" y="208" text-anchor="middle" font-family="var(--font-sans)" font-size="10.2" font-weight="700" fill="#0F766E">位置1: 2「喜欢」</text>

  <text x="458" y="236" text-anchor="middle" font-family="var(--font-mono)" font-size="10" font-weight="700" fill="#182230">序列 [0, 2]</text>

  <!-- Step B: 6x4 Embedding Table E -->
  <text x="608" y="82" text-anchor="middle" font-family="var(--font-sans)" font-size="10" font-weight="700" fill="#182230">② 嵌入表 E [6 行 × 4 列浮点数]</text>

  <!-- Row 0 (Selected!) -->
  <rect x="524" y="90" width="168" height="22" rx="3" fill="#CCFBF1" stroke="#0F766E" stroke-width="1.5"/>
  <line x1="576" y1="90" x2="576" y2="112" stroke="#0F766E" stroke-width="0.9"/>
  <line x1="605" y1="90" x2="605" y2="112" stroke="#0F766E" stroke-width="0.9"/>
  <line x1="634" y1="90" x2="634" y2="112" stroke="#0F766E" stroke-width="0.9"/>
  <line x1="663" y1="90" x2="663" y2="112" stroke="#0F766E" stroke-width="0.9"/>
  <text x="550" y="105" text-anchor="middle" font-family="var(--font-sans)" font-size="9.5" font-weight="700" fill="#0F766E">0「我」</text>
  <text x="634" y="105" text-anchor="middle" font-family="var(--font-mono)" font-size="9.2" font-weight="700" fill="#065F46">第 0 行 E[0]</text>

  <!-- Row 1 (Dimmed) -->
  <rect x="524" y="116" width="168" height="20" rx="3" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="0.9"/>
  <text x="550" y="130" text-anchor="middle" font-family="var(--font-sans)" font-size="9.2" fill="#94A3B8">1「你」</text>
  <text x="634" y="130" text-anchor="middle" font-family="var(--font-mono)" font-size="9" fill="#94A3B8">E[1] (未读)</text>

  <!-- Row 2 (Selected!) -->
  <rect x="524" y="140" width="168" height="22" rx="3" fill="#CCFBF1" stroke="#0F766E" stroke-width="1.5"/>
  <line x1="576" y1="140" x2="576" y2="162" stroke="#0F766E" stroke-width="0.9"/>
  <line x1="605" y1="140" x2="605" y2="162" stroke="#0F766E" stroke-width="0.9"/>
  <line x1="634" y1="140" x2="634" y2="162" stroke="#0F766E" stroke-width="0.9"/>
  <line x1="663" y1="140" x2="663" y2="162" stroke="#0F766E" stroke-width="0.9"/>
  <text x="550" y="155" text-anchor="middle" font-family="var(--font-sans)" font-size="9.5" font-weight="700" fill="#0F766E">2「喜欢」</text>
  <text x="634" y="155" text-anchor="middle" font-family="var(--font-mono)" font-size="9.2" font-weight="700" fill="#065F46">第 2 行 E[2]</text>

  <!-- Rows 3, 4, 5 (Dimmed) -->
  <rect x="524" y="166" width="168" height="20" rx="3" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="0.9"/>
  <text x="550" y="180" text-anchor="middle" font-family="var(--font-sans)" font-size="9.2" fill="#94A3B8">3「猫」</text>
  <text x="634" y="180" text-anchor="middle" font-family="var(--font-mono)" font-size="9" fill="#94A3B8">E[3] (未读)</text>

  <rect x="524" y="190" width="168" height="20" rx="3" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="0.9"/>
  <text x="550" y="204" text-anchor="middle" font-family="var(--font-sans)" font-size="9.2" fill="#94A3B8">4「看」</text>
  <text x="634" y="204" text-anchor="middle" font-family="var(--font-mono)" font-size="9" fill="#94A3B8">E[4] (未读)</text>

  <rect x="524" y="214" width="168" height="20" rx="3" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="0.9"/>
  <text x="550" y="228" text-anchor="middle" font-family="var(--font-sans)" font-size="9.2" fill="#94A3B8">5「。」</text>
  <text x="634" y="228" text-anchor="middle" font-family="var(--font-mono)" font-size="9" fill="#94A3B8">E[5] (未读)</text>

  <!-- Lookup Arrows -->
  <path d="M 500 166 L 512 166 L 512 101 L 522 101" fill="none" stroke="#0F766E" stroke-width="1.5" marker-end="url(#te-teal)"/>
  <path d="M 500 204 L 516 204 L 516 151 L 522 151" fill="none" stroke="#0F766E" stroke-width="1.5" marker-end="url(#te-teal)"/>

  <rect x="524" y="242" width="168" height="26" rx="4" fill="#CCFBF1" stroke="#0F766E" stroke-width="1"/>
  <text x="608" y="259" text-anchor="middle" font-family="var(--font-sans)" font-size="9.8" font-weight="700" fill="#065F46">零乘加运算 · 纯按行号抽行</text>

  <!-- Step C: Stacked [2, 4] Output Tensor -->
  <text x="786" y="82" text-anchor="middle" font-family="var(--font-sans)" font-size="10" font-weight="700" fill="#0F766E">③ 初始输入张量</text>

  <rect x="716" y="96" width="140" height="72" rx="6" fill="#FFFFFF" stroke="#0F766E" stroke-width="1.5"/>
  <rect x="722" y="102" width="128" height="28" rx="4" fill="#CCFBF1" stroke="#0F766E" stroke-width="1.2"/>
  <text x="786" y="120" text-anchor="middle" font-family="var(--font-mono)" font-size="10" font-weight="700" fill="#065F46">x₀ = E[0] (我)</text>

  <rect x="722" y="134" width="128" height="28" rx="4" fill="#CCFBF1" stroke="#0F766E" stroke-width="1.2"/>
  <text x="786" y="152" text-anchor="middle" font-family="var(--font-mono)" font-size="10" font-weight="700" fill="#065F46">x₁ = E[2] (喜欢)</text>

  <path d="M 692 101 L 714 116" fill="none" stroke="#0F766E" stroke-width="1.5" marker-end="url(#te-teal)"/>
  <path d="M 692 151 L 714 148" fill="none" stroke="#0F766E" stroke-width="1.5" marker-end="url(#te-teal)"/>

  <rect x="716" y="180" width="140" height="88" rx="5" fill="#FFFFFF" stroke="#99F6E4" stroke-width="1.1"/>
  <text x="786" y="198" text-anchor="middle" font-family="var(--font-mono)" font-size="10.5" font-weight="700" fill="#0F766E">形状 [2, 4]</text>
  <text x="786" y="216" text-anchor="middle" font-family="var(--font-sans)" font-size="9.5" fill="#344054">2 行 = 提示词 2 个位置</text>
  <text x="786" y="233" text-anchor="middle" font-family="var(--font-sans)" font-size="9.5" fill="#344054">4 列 = 教学隐藏维宽度</text>
  <text x="786" y="253" text-anchor="middle" font-family="var(--font-sans)" font-size="9.6" font-weight="700" fill="#065F46">一起并行送进第 1 层 ▶</text>
</svg>
