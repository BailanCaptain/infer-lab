<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 370" width="900" height="370" role="img" aria-label="示意：为什么不能拿整数词编号 0、2 直接乘权重（0 号归零、2 号被强锁为 1 号两倍），以及真实机制如何先将「我喜欢」切成 [0, 2]，再从 6×4 嵌入表 E 零乘法按行抽出 x₀、x₁ 拼成 [2, 4] 初始张量。">
  <title>示意：为什么不能拿整数词编号 0、2 直接乘权重（0 号归零、2 号被强锁为 1 号两倍），以及真实机制如何先将「我喜欢」切成 [0, 2]，再从 6×4 嵌入表 E 零乘法按行抽出 x₀、x₁ 拼成 [2, 4] 初始张量。</title>
  <desc>第 1 件事分词校验与查表源码锚点：CachedTokenizer 核对 max_token_id 与 vocab_size，_validate_prompt_len 校验 max_model_len，VocabParallelEmbedding 调用 embedding 按行零乘法查出初始张量。</desc>
  <defs>
    <marker id="te-red" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#BE123C"/>
    </marker>
    <marker id="te-teal" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#087F73"/>
    </marker>
  </defs>

  <!-- Open Column Divider (Zero Outer Backing, Zero Panel Cages) -->
  <line x1="390" y1="12" x2="390" y2="358" stroke="#CBD5E1" stroke-width="1.4" stroke-dasharray="6 5"/>

  <!-- ==================== LEFT COLUMN: WRONG INTUITION ==================== -->
  <text x="14" y="30" font-family="var(--font-sans)" font-size="16" font-weight="700" fill="#BE123C">✗ 错误直觉：拿整数编号直接乘权重</text>

  <!-- Flaw 1: 0 x w = 0 -->
  <rect x="14" y="54" width="108" height="40" rx="6" fill="#FFE4E6" stroke="#BE123C" stroke-width="1.4"/>
  <text x="68" y="79" text-anchor="middle" font-family="var(--font-sans)" font-size="14.5" font-weight="700" fill="#9F1239">0 号「我」</text>

  <line x1="122" y1="74" x2="178" y2="74" stroke="#BE123C" stroke-width="1.6" marker-end="url(#te-red)"/>
  <text x="150" y="66" text-anchor="middle" font-family="var(--font-mono)" font-size="13.5" font-weight="700" fill="#BE123C">0 × w</text>

  <rect x="182" y="54" width="194" height="40" rx="6" fill="#FFF1F2" stroke="#BE123C" stroke-width="1.4" stroke-dasharray="4 3"/>
  <text x="279" y="79" text-anchor="middle" font-family="var(--font-mono)" font-size="13.5" font-weight="700" fill="#BE123C">[0.0, 0.0, 0.0, 0.0]</text>

  <text x="14" y="120" font-family="var(--font-sans)" font-size="14" font-weight="700" fill="#9F1239">后果 1：0 乘任何数归零，「我」消失</text>

  <line x1="14" y1="140" x2="376" y2="140" stroke="#E5E3DC" stroke-width="1.1"/>

  <!-- Flaw 2: 2 x w = 2 * (1 x w) -->
  <rect x="14" y="158" width="120" height="40" rx="6" fill="#FFE4E6" stroke="#BE123C" stroke-width="1.4"/>
  <text x="74" y="183" text-anchor="middle" font-family="var(--font-sans)" font-size="14.5" font-weight="700" fill="#9F1239">2 号「喜欢」</text>

  <text x="154" y="183" text-anchor="middle" font-family="var(--font-mono)" font-size="14.5" font-weight="700" fill="#BE123C">=?=</text>

  <rect x="174" y="158" width="202" height="40" rx="6" fill="#FFF1F2" stroke="#BE123C" stroke-width="1.4"/>
  <text x="275" y="183" text-anchor="middle" font-family="var(--font-sans)" font-size="14" font-weight="700" fill="#9F1239">2 × 1 号「你」的表示</text>

  <text x="14" y="224" font-family="var(--font-sans)" font-size="14" font-weight="700" fill="#9F1239">后果 2：「喜欢」并非「你」的两倍！</text>
  <text x="14" y="248" font-family="var(--font-sans)" font-size="13.5" fill="#475569">词编号只是目录门牌号，无倍数关系</text>

  <!-- Bottom Open Accent Note -->
  <rect x="14" y="276" width="4" height="58" rx="2" fill="#BE123C"/>
  <text x="28" y="298" font-family="var(--font-sans)" font-size="14.5" font-weight="700" fill="#17211F">每个编号须配一排独立浮点数</text>
  <text x="28" y="324" font-family="var(--font-sans)" font-size="13.5" fill="#64748B">进门校验 ≤ max_model_len 且 &lt; vocab_size</text>

  <!-- ==================== RIGHT COLUMN: TRUE LOOKUP ==================== -->
  <text x="408" y="30" font-family="var(--font-sans)" font-size="16" font-weight="700" fill="#087F73">✓ 真实查表：切出 [0, 2] → 从 E 零乘法抽行</text>

  <!-- Sub-stage 1: Prompt & Tokenizer -->
  <text x="468" y="60" text-anchor="middle" font-family="var(--font-sans)" font-size="14.5" font-weight="700" fill="#087F73">① 分词切号</text>
  <rect x="408" y="72" width="120" height="40" rx="6" fill="#FFFFFF" stroke="#087F73" stroke-width="1.5"/>
  <text x="468" y="97" text-anchor="middle" font-family="var(--font-sans)" font-size="15" font-weight="700" fill="#17211F">「我喜欢」</text>

  <line x1="468" y1="112" x2="468" y2="140" stroke="#087F73" stroke-width="1.6" marker-end="url(#te-teal)"/>
  <text x="468" y="158" text-anchor="middle" font-family="var(--font-mono)" font-size="13.5" font-weight="700" fill="#087F73">tokenizer</text>

  <rect x="408" y="170" width="120" height="38" rx="6" fill="#DDF4EF" stroke="#087F73" stroke-width="1.4"/>
  <text x="468" y="194" text-anchor="middle" font-family="var(--font-sans)" font-size="14" font-weight="700" fill="#065F46">0 号「我」</text>

  <rect x="408" y="216" width="120" height="38" rx="6" fill="#DDF4EF" stroke="#087F73" stroke-width="1.4"/>
  <text x="468" y="240" text-anchor="middle" font-family="var(--font-sans)" font-size="14" font-weight="700" fill="#065F46">2 号「喜欢」</text>

  <text x="468" y="280" text-anchor="middle" font-family="var(--font-mono)" font-size="14" font-weight="700" fill="#17211F">序列 [0, 2]</text>

  <!-- Sub-stage 2: Unified 6x4 Embedding Table E -->
  <text x="646" y="60" text-anchor="middle" font-family="var(--font-sans)" font-size="14.5" font-weight="700" fill="#17211F">② 嵌入表 E [6×4]</text>
  <rect x="556" y="72" width="180" height="216" rx="6" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.3"/>
  <line x1="634" y1="72" x2="634" y2="288" stroke="#E2E8F0" stroke-width="1"/>
  <line x1="556" y1="144" x2="736" y2="144" stroke="#E2E8F0" stroke-width="1"/>
  <line x1="556" y1="216" x2="736" y2="216" stroke="#E2E8F0" stroke-width="1"/>
  <line x1="556" y1="252" x2="736" y2="252" stroke="#E2E8F0" stroke-width="1"/>

  <!-- Row 0 (Selected) -->
  <rect x="556" y="72" width="180" height="36" rx="4" fill="#DDF4EF" stroke="#087F73" stroke-width="1.6"/>
  <line x1="634" y1="72" x2="634" y2="108" stroke="#087F73" stroke-width="1"/>
  <text x="595" y="95" text-anchor="middle" font-family="var(--font-sans)" font-size="14" font-weight="700" fill="#087F73">0「我」</text>
  <text x="685" y="95" text-anchor="middle" font-family="var(--font-mono)" font-size="14" font-weight="700" fill="#065F46">第 0 行 E[0]</text>

  <!-- Row 1 (Dimmed) -->
  <text x="595" y="131" text-anchor="middle" font-family="var(--font-sans)" font-size="13.5" fill="#94A3B8">1「你」</text>
  <text x="685" y="131" text-anchor="middle" font-family="var(--font-mono)" font-size="13.5" fill="#94A3B8">E[1] 未读</text>

  <!-- Row 2 (Selected) -->
  <rect x="556" y="144" width="180" height="36" rx="4" fill="#DDF4EF" stroke="#087F73" stroke-width="1.6"/>
  <line x1="634" y1="144" x2="634" y2="180" stroke="#087F73" stroke-width="1"/>
  <text x="595" y="167" text-anchor="middle" font-family="var(--font-sans)" font-size="14" font-weight="700" fill="#087F73">2「喜欢」</text>
  <text x="685" y="167" text-anchor="middle" font-family="var(--font-mono)" font-size="14" font-weight="700" fill="#065F46">第 2 行 E[2]</text>

  <!-- Rows 3, 4, 5 (Dimmed) -->
  <text x="595" y="203" text-anchor="middle" font-family="var(--font-sans)" font-size="13.5" fill="#94A3B8">3「猫」</text>
  <text x="685" y="203" text-anchor="middle" font-family="var(--font-mono)" font-size="13.5" fill="#94A3B8">E[3] 未读</text>

  <text x="595" y="239" text-anchor="middle" font-family="var(--font-sans)" font-size="13.5" fill="#94A3B8">4「看」</text>
  <text x="685" y="239" text-anchor="middle" font-family="var(--font-mono)" font-size="13.5" fill="#94A3B8">E[4] 未读</text>

  <text x="595" y="275" text-anchor="middle" font-family="var(--font-sans)" font-size="13.5" fill="#94A3B8">5「。」</text>
  <text x="685" y="275" text-anchor="middle" font-family="var(--font-mono)" font-size="13.5" fill="#94A3B8">E[5] 未读</text>

  <!-- Lookup Arrows -->
  <path d="M 528 189 L 541 189 L 541 90 L 554 90" fill="none" stroke="#087F73" stroke-width="1.6" marker-end="url(#te-teal)"/>
  <path d="M 528 235 L 547 235 L 547 162 L 554 162" fill="none" stroke="#087F73" stroke-width="1.6" marker-end="url(#te-teal)"/>

  <text x="646" y="316" text-anchor="middle" font-family="var(--font-sans)" font-size="14" font-weight="700" fill="#087F73">零乘法 · 按行抽行</text>
  <text x="646" y="340" text-anchor="middle" font-family="var(--font-mono)" font-size="13.5" fill="#64748B">embedding(E)</text>

  <!-- Sub-stage 3: Unified [2, 4] Output Tensor -->
  <text x="827" y="60" text-anchor="middle" font-family="var(--font-sans)" font-size="14.5" font-weight="700" fill="#087F73">③ 张量 [2, 4]</text>

  <rect x="762" y="92" width="130" height="88" rx="6" fill="#DDF4EF" stroke="#087F73" stroke-width="1.6"/>
  <line x1="762" y1="136" x2="892" y2="136" stroke="#087F73" stroke-width="1.2"/>
  <text x="827" y="119" text-anchor="middle" font-family="var(--font-mono)" font-size="14" font-weight="700" fill="#065F46">x₀ = E[0]</text>
  <text x="827" y="163" text-anchor="middle" font-family="var(--font-mono)" font-size="14" font-weight="700" fill="#065F46">x₁ = E[2]</text>

  <path d="M 736 90 L 760 114" fill="none" stroke="#087F73" stroke-width="1.6" marker-end="url(#te-teal)"/>
  <path d="M 736 162 L 760 158" fill="none" stroke="#087F73" stroke-width="1.6" marker-end="url(#te-teal)"/>

  <text x="827" y="212" text-anchor="middle" font-family="var(--font-sans)" font-size="13.5" fill="#334155">2 行：2 个位置</text>
  <text x="827" y="236" text-anchor="middle" font-family="var(--font-sans)" font-size="13.5" fill="#334155">4 列：隐藏维度</text>
  <text x="827" y="268" text-anchor="middle" font-family="var(--font-sans)" font-size="14.5" font-weight="700" fill="#087F73">并行进第 1 层 ▶</text>
</svg>
