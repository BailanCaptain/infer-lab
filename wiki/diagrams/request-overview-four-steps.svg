  <circle cx="244" cy="304" r="11" fill="var(--color-weight, #c78300)"/><text x="244" y="309" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="13" font-weight="700" fill="var(--color-ink-inverse, #ffffff)" text-anchor="middle">2</text>
