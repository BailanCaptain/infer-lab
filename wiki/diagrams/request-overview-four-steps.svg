<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 410" width="880" height="410" role="img" aria-label="示意：提示词「我喜欢」走两轮前向生成「猫。」。第 1 轮（预填充）一次算完 2 个提示词位置并把各层 K、V 写入键值缓存，直接从最后一行 h₁ 打分选出第 1 个输出词 3 号「猫」；第 2 轮（逐词生成）只送入位置 2 的 3 号「猫」，读取缓存并选出第 2 个词 5 号「。」，满 2 词上限停止。词表与向量均为教学设定。">
  <title>示意：提示词「我喜欢」走两轮前向生成「猫。」。第 1 轮（预填充）一次算完 2 个提示词位置并把各层 K、V 写入键值缓存，直接从最后一行 h₁ 打分选出第 1 个输出词 3 号「猫」；第 2 轮（逐词生成）只送入位置 2 的 3 号「猫」，读取缓存并选出第 2 个词 5 号「。」，满 2 词上限停止。词表与向量均为教学设定。</title>
  <defs><marker id="request-overview-four-steps-ah-token" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="var(--color-token, #087f73)"/></marker><marker id="request-overview-four-steps-ah-weight" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="var(--color-weight, #c78300)"/></marker><marker id="request-overview-four-steps-ah-kv" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="var(--color-kv, #4c65b6)"/></marker></defs>
  <rect x="20" y="46" width="840" height="122" rx="16" fill="none" stroke="var(--color-line-strong, #b8bcb5)" stroke-width="1.5"/>
  <text x="36" y="34" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="15" font-weight="700" fill="var(--color-ink, #17211f)">第 1 轮（预填充）：一次算完提示词 2 个位置，最后一行直接选出第 1 个输出词</text>
  <rect x="20" y="276" width="840" height="122" rx="16" fill="none" stroke="var(--color-line-strong, #b8bcb5)" stroke-width="1.5"/>
  <text x="36" y="264" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="15" font-weight="700" fill="var(--color-ink, #17211f)">第 2 轮（逐词生成）</text>
