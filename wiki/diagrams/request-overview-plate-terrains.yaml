mode: native-svg
id: request-overview-plate-terrains
caption: >-
  一次请求的三块硬件地盘立体拆解直觉：左侧 Host CPU 承接分词切号、调度与停止检查；中部 NPU HBM 显存常驻模型权重并逐层存放历史 KV Cache；四通道搬运带把权重与 KV 送进右侧 AI Core 计算阵列，Prefill 易吃满算力，Decode 则因每步仅算 1 个新词却搬运全量权重与历史 KV 而卡在 HBM 带宽。
