<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 310" width="880" height="310" role="img" aria-label="示意：一条请求在「Host CPU 前台与调度员 — NPU HBM 显存高速仓库 — NPU AI Core 矩阵计算车间」三块硬件地盘上的接力分工，以及 Prefill（整段提示词并行乘加、AI Core 算力受限）与 Decode（每步只算 1 个新词却搬运整份权重与历史 KV、HBM 带宽受限）的瓶颈差异。">
  <title>示意：一条请求在「Host CPU 前台与调度员 — NPU HBM 显存高速仓库 — NPU AI Core 矩阵计算车间」三块硬件地盘上的接力分工，以及 Prefill（整段提示词并行乘加、AI Core 算力受限）与 Decode（每步只算 1 个新词却搬运整份权重与历史 KV、HBM 带宽受限）的瓶颈差异。</title>
  <defs>
    <marker id="tt-slate" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#475569"/>
    </marker>
    <marker id="tt-blue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#2563EB"/>
    </marker>
    <marker id="tt-amber" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#D97706"/>
    </marker>
  </defs>

  <!-- ==================== TOP: THREE HARDWARE TERRAINS ==================== -->
  <!-- Host Zone Label -->
  <text x="24" y="19" font-family="var(--font-sans)" font-size="11" font-weight="700" fill="#475569">主机侧（Host 服务器）</text>

  <!-- NPU Device Outer Frame -->
  <rect x="322" y="24" width="542" height="180" rx="14" fill="#F8FAFC" stroke="#94A3B8" stroke-width="1.2" stroke-dasharray="5 4"/>
  <text x="334" y="19" font-family="var(--font-sans)" font-size="11" font-weight="700" fill="#334155">昇腾 NPU 卡上（HBM 显存 ↔ AI Core 高速互联）</text>

  <!-- Terrain 1: Host CPU -->
  <rect x="16" y="28" width="236" height="172" rx="12" fill="#F1F5F9" stroke="#64748B" stroke-width="1.5"/>
  <text x="134" y="49" font-family="var(--font-sans)" font-size="13" font-weight="700" fill="#1E293B" text-anchor="middle">Host CPU · 前台与调度员</text>

  <rect x="28" y="59" width="212" height="34" rx="6" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1"/>
  <text x="134" y="74" font-family="var(--font-sans)" font-size="10.5" font-weight="700" fill="#334155" text-anchor="middle">① 接单切号：模板渲染 · 分词</text>
  <text x="134" y="88" font-family="var(--font-sans)" font-size="9.5" fill="#64748B" text-anchor="middle">输入长度与词表上界校验</text>

  <rect x="28" y="99" width="212" height="34" rx="6" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1"/>
  <text x="134" y="114" font-family="var(--font-sans)" font-size="10.5" font-weight="700" fill="#334155" text-anchor="middle">调度指派：决定本轮算哪些位置</text>
  <text x="134" y="128" font-family="var(--font-sans)" font-size="9.5" fill="#64748B" text-anchor="middle">维护 num_computed_tokens 进度</text>

  <rect x="28" y="139" width="212" height="34" rx="6" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1"/>
  <text x="134" y="154" font-family="var(--font-sans)" font-size="10.5" font-weight="700" fill="#334155" text-anchor="middle">④ 判停发货：check_stop 停止检查</text>
  <text x="134" y="168" font-family="var(--font-sans)" font-size="9.5" fill="#64748B" text-anchor="middle">反分词还原可读文字返回用户</text>

  <text x="134" y="191" font-family="var(--font-sans)" font-size="9.5" fill="#64748B" text-anchor="middle">不跑大矩阵；CPU 慢会让 NPU 空等</text>

  <!-- Host <-> NPU Arrows -->
  <path d="M 252 90 L 330 90" fill="none" stroke="#475569" stroke-width="1.6" marker-end="url(#tt-slate)"/>
  <text x="291" y="73" font-family="var(--font-sans)" font-size="10" font-weight="600" fill="#334155" text-anchor="middle">下发词编号</text>
  <text x="291" y="85" font-family="var(--font-sans)" font-size="9.5" fill="#64748B" text-anchor="middle">与调度指令</text>

  <path d="M 330 156 L 252 156" fill="none" stroke="#475569" stroke-width="1.6" stroke-dasharray="4 3" marker-end="url(#tt-slate)"/>
  <text x="291" y="149" font-family="var(--font-sans)" font-size="10" font-weight="600" fill="#334155" text-anchor="middle">回传新选编号</text>

  <!-- Terrain 2: NPU HBM -->
  <rect x="332" y="32" width="228" height="164" rx="10" fill="#EFF6FF" stroke="#2563EB" stroke-width="1.5"/>
  <text x="446" y="53" font-family="var(--font-sans)" font-size="13" font-weight="700" fill="#1E3A8A" text-anchor="middle">NPU HBM 显存 · 高速仓库</text>

  <rect x="344" y="64" width="204" height="52" rx="6" fill="#FFFFFF" stroke="#93C5FD" stroke-width="1.1"/>
  <text x="446" y="83" font-family="var(--font-sans)" font-size="10.5" font-weight="700" fill="#1E40AF" text-anchor="middle">常驻模型权重（每轮只读）</text>
  <text x="446" y="102" font-family="var(--font-sans)" font-size="10" fill="#475569" text-anchor="middle">嵌入表 E · 各层权重 · W_head</text>

  <rect x="344" y="124" width="204" height="58" rx="6" fill="#DBEAFE" stroke="#2563EB" stroke-width="1.3"/>
  <text x="446" y="143" font-family="var(--font-sans)" font-size="10.5" font-weight="700" fill="#1D4ED8" text-anchor="middle">② 动态增长：KV cache（读写）</text>
  <text x="446" y="160" font-family="var(--font-sans)" font-size="9.5" fill="#1E3A8A" text-anchor="middle">首轮写入 k₀, v₀, k₁, v₁</text>
  <text x="446" y="174" font-family="var(--font-sans)" font-size="9.5" fill="#1E3A8A" text-anchor="middle">次轮读出旧历史并追加 k₂, v₂</text>

  <!-- HBM <-> AI Core Arrows -->
  <path d="M 560 88 L 632 88" fill="none" stroke="#2563EB" stroke-width="2" marker-end="url(#tt-blue)"/>
  <text x="596" y="80" font-family="var(--font-sans)" font-size="10" font-weight="700" fill="#1D4ED8" text-anchor="middle">搬运权重</text>

  <path d="M 632 141 L 560 141" fill="none" stroke="#D97706" stroke-width="1.5" marker-end="url(#tt-amber)"/>
  <text x="596" y="134" font-family="var(--font-sans)" font-size="9.5" font-weight="600" fill="#B45309" text-anchor="middle">写入新 K, V</text>

  <path d="M 560 163 L 632 163" fill="none" stroke="#2563EB" stroke-width="1.8" marker-end="url(#tt-blue)"/>
  <text x="596" y="177" font-family="var(--font-sans)" font-size="9.5" font-weight="700" fill="#1D4ED8" text-anchor="middle">读取历史 KV</text>

  <!-- Terrain 3: NPU AI Core -->
  <rect x="634" y="32" width="220" height="164" rx="10" fill="#FFFBEB" stroke="#D97706" stroke-width="1.5"/>
  <text x="744" y="53" font-family="var(--font-sans)" font-size="13" font-weight="700" fill="#92400E" text-anchor="middle">NPU AI Core · 矩阵计算车间</text>

  <rect x="646" y="64" width="196" height="52" rx="6" fill="#FFFFFF" stroke="#FCD34D" stroke-width="1.1"/>
  <text x="744" y="83" font-family="var(--font-sans)" font-size="10.5" font-weight="700" fill="#B45309" text-anchor="middle">② 逐层矩阵乘与向量归约</text>
  <text x="744" y="102" font-family="var(--font-sans)" font-size="10" fill="#475569" text-anchor="middle">Attention 点积 · Softmax · MLP</text>

  <rect x="646" y="124" width="196" height="58" rx="6" fill="#FEF3C7" stroke="#D97706" stroke-width="1.3"/>
  <text x="744" y="143" font-family="var(--font-sans)" font-size="10.5" font-weight="700" fill="#92400E" text-anchor="middle">③ 末行词表打分与选号</text>
  <text x="744" y="160" font-family="var(--font-sans)" font-size="9.5" fill="#78350F" text-anchor="middle">末行 h × W_head → 词表 logits</text>
  <text x="744" y="174" font-family="var(--font-sans)" font-size="9.5" fill="#78350F" text-anchor="middle">贪心或概率采样选出词编号</text>

  <!-- ==================== BOTTOM: PREFILL VS DECODE BOTTLENECK STRIP ==================== -->
  <!-- Left: Prefill (Compute-bound) -->
  <rect x="16" y="216" width="416" height="84" rx="10" fill="#FFFBEB" stroke="#D97706" stroke-width="1.4"/>
  <rect x="28" y="225" width="162" height="22" rx="11" fill="#D97706"/>
  <text x="109" y="240" font-family="var(--font-sans)" font-size="11" font-weight="700" fill="#FFFFFF" text-anchor="middle">第 1 轮 Prefill · 算力受限</text>
  <text x="336" y="240" font-family="var(--font-sans)" font-size="10" font-weight="700" fill="#B45309" text-anchor="end">AI Core 满载</text>
  <rect x="344" y="230" width="12" height="12" rx="2" fill="#D97706"/>
  <rect x="359" y="230" width="12" height="12" rx="2" fill="#D97706"/>
  <rect x="374" y="230" width="12" height="12" rx="2" fill="#D97706"/>
  <rect x="389" y="230" width="12" height="12" rx="2" fill="#D97706"/>
  <rect x="404" y="230" width="12" height="12" rx="2" fill="#D97706"/>
  <text x="28" y="266" font-family="var(--font-sans)" font-size="11" font-weight="700" fill="#78350F">搬 1 次权重，整段提示词所有位置一起并行乘加</text>
  <text x="28" y="286" font-family="var(--font-sans)" font-size="10.5" fill="#92400E">大矩阵乘密集 → AI Core 车间算力吃满（Compute-bound）</text>

  <!-- Right: Decode (Memory-bandwidth-bound) -->
  <rect x="448" y="216" width="416" height="84" rx="10" fill="#EFF6FF" stroke="#2563EB" stroke-width="1.4"/>
  <rect x="460" y="225" width="170" height="22" rx="11" fill="#2563EB"/>
  <text x="545" y="240" font-family="var(--font-sans)" font-size="11" font-weight="700" fill="#FFFFFF" text-anchor="middle">第 2 轮+ Decode · 带宽受限</text>
  <text x="768" y="240" font-family="var(--font-sans)" font-size="10" font-weight="700" fill="#1D4ED8" text-anchor="end">HBM 带宽吃紧</text>
  <rect x="776" y="230" width="12" height="12" rx="2" fill="#2563EB"/>
  <rect x="791" y="230" width="12" height="12" rx="2" fill="#2563EB"/>
  <rect x="806" y="230" width="12" height="12" rx="2" fill="#2563EB"/>
  <rect x="821" y="230" width="12" height="12" rx="2" fill="#2563EB"/>
  <rect x="836" y="230" width="12" height="12" rx="2" fill="#2563EB"/>
  <text x="460" y="266" font-family="var(--font-sans)" font-size="11" font-weight="700" fill="#1E3A8A">每步只算 1 个新词，却照搬整份层权重 + 全部历史 KV</text>
  <text x="460" y="286" font-family="var(--font-sans)" font-size="10.5" fill="#1D4ED8">车间算得极快却常等仓库送货 → 卡在 HBM 带宽（Memory-bound）</text>
</svg>
