<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 440" width="900" height="440" role="img" aria-label="示意：一条请求在 Host CPU、NPU HBM 显存与 NPU AI Core 三块硬件地盘上的接力分工，以及 Prefill 与 Decode 的瓶颈差异。" font-family="var(--font-sans)">
  <title>示意：一条请求在「Host CPU 前台与调度员 — NPU HBM 显存高速仓库 — NPU AI Core 矩阵计算车间」三块硬件地盘上的接力分工，以及 Prefill（整段提示词并行乘加、AI Core 算力受限）与 Decode（每步只算 1 个新词却搬运整份权重与历史 KV、HBM 带宽受限）的瓶颈差异。</title>
  <desc>关联源码符号：step, schedule, execute_model, num_computed_tokens, kv_cache, attn_metadata, update, decode_next, logits_indices, compute_logits</desc>
  <defs>
    <marker id="tt-slate" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#475569"/>
    </marker>
    <marker id="tt-blue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#2563EB"/>
    </marker>
    <marker id="tt-amber" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#D97706"/>
    </marker>
  </defs>

  <text x="16" y="26" font-size="14.5" font-weight="700" fill="#475569">主机侧（Host 服务器）</text>
  <text x="330" y="26" font-size="14.5" font-weight="700" fill="#1E3A8A">昇腾 NPU 卡上（HBM 显存 ↔ AI Core 片内高速互联）</text>
  <line x1="312" y1="12" x2="312" y2="288" stroke="#94A3B8" stroke-width="1.5" stroke-dasharray="6 4"/>

  <!-- Terrain 1: Host CPU -->
  <rect x="16" y="38" width="256" height="248" rx="10" fill="#F1F5F9" stroke="#64748B" stroke-width="1.5"/>
  <text x="144" y="66" font-size="16" font-weight="700" fill="#1E293B" text-anchor="middle">Host CPU · 前台调度</text>

  <rect x="28" y="80" width="232" height="58" rx="6" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.2"/>
  <text x="144" y="103" font-size="14.5" font-weight="700" fill="#334155" text-anchor="middle">① 模板渲染与分词</text>
  <text x="144" y="126" font-size="13.5" fill="#64748B" text-anchor="middle">长度与词表上界校验</text>

  <rect x="28" y="148" width="232" height="58" rx="6" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.2"/>
  <text x="144" y="171" font-size="14.5" font-weight="700" fill="#334155" text-anchor="middle">schedule 调度本轮位置</text>
  <text x="144" y="194" font-size="13.5" fill="#64748B" text-anchor="middle">维护 num_computed_tokens</text>

  <rect x="28" y="216" width="232" height="58" rx="6" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.2"/>
  <text x="144" y="239" font-size="14.5" font-weight="700" fill="#334155" text-anchor="middle">④ 判停与反分词还原</text>
  <text x="144" y="262" font-size="13.5" fill="#64748B" text-anchor="middle">update / decode_next 返回文本</text>

  <!-- Host <-> NPU Arrows -->
  <path d="M 272 118 L 326 118" fill="none" stroke="#475569" stroke-width="1.8" marker-end="url(#tt-slate)"/>
  <text x="299" y="106" font-size="13.5" font-weight="700" fill="#334155" text-anchor="middle">下发</text>
  <path d="M 326 232 L 272 232" fill="none" stroke="#475569" stroke-width="1.8" stroke-dasharray="4 3" marker-end="url(#tt-slate)"/>
  <text x="299" y="220" font-size="13.5" font-weight="700" fill="#334155" text-anchor="middle">回传</text>

  <!-- Terrain 2: NPU HBM -->
  <rect x="330" y="38" width="252" height="248" rx="10" fill="#EFF6FF" stroke="#2563EB" stroke-width="1.5"/>
  <text x="456" y="66" font-size="16" font-weight="700" fill="#1E3A8A" text-anchor="middle">HBM 显存 · 高速仓库</text>

  <rect x="342" y="84" width="228" height="82" rx="6" fill="#FFFFFF" stroke="#93C5FD" stroke-width="1.2"/>
  <text x="456" y="114" font-size="14.5" font-weight="700" fill="#1E40AF" text-anchor="middle">常驻模型权重（只读）</text>
  <text x="456" y="144" font-size="13.5" fill="#475569" text-anchor="middle">嵌入表 E · 层权重 · W_head</text>

  <rect x="342" y="178" width="228" height="94" rx="6" fill="#DBEAFE" stroke="#2563EB" stroke-width="1.4"/>
  <text x="456" y="206" font-size="14.5" font-weight="700" fill="#1D4ED8" text-anchor="middle">② 动态增长：kv_cache</text>
  <text x="456" y="232" font-size="13.5" fill="#1E3A8A" text-anchor="middle">首轮写入 k₀, v₀, k₁, v₁</text>
  <text x="456" y="256" font-size="13.5" fill="#1E3A8A" text-anchor="middle">次轮读旧历史并追加 k₂, v₂</text>

  <!-- HBM <-> AI Core Arrows -->
  <path d="M 582 124 L 634 124" fill="none" stroke="#2563EB" stroke-width="2" marker-end="url(#tt-blue)"/>
  <text x="608" y="112" font-size="13.5" font-weight="700" fill="#1D4ED8" text-anchor="middle">权重</text>
  <path d="M 634 206 L 582 206" fill="none" stroke="#D97706" stroke-width="1.7" marker-end="url(#tt-amber)"/>
  <text x="608" y="195" font-size="13.5" font-weight="700" fill="#B45309" text-anchor="middle">写 KV</text>
  <path d="M 582 246 L 634 246" fill="none" stroke="#2563EB" stroke-width="1.8" marker-end="url(#tt-blue)"/>
  <text x="608" y="268" font-size="13.5" font-weight="700" fill="#1D4ED8" text-anchor="middle">读 KV</text>

  <!-- Terrain 3: NPU AI Core -->
  <rect x="638" y="38" width="246" height="248" rx="10" fill="#FFFBEB" stroke="#D97706" stroke-width="1.5"/>
  <text x="761" y="66" font-size="16" font-weight="700" fill="#92400E" text-anchor="middle">AI Core · 计算车间</text>

  <rect x="650" y="84" width="222" height="82" rx="6" fill="#FFFFFF" stroke="#FCD34D" stroke-width="1.2"/>
  <text x="761" y="114" font-size="14.5" font-weight="700" fill="#B45309" text-anchor="middle">② 逐层矩阵乘与归约</text>
  <text x="761" y="144" font-size="13.5" fill="#475569" text-anchor="middle">Attention · Softmax · MLP</text>

  <rect x="650" y="178" width="222" height="94" rx="6" fill="#FEF3C7" stroke="#D97706" stroke-width="1.4"/>
  <text x="761" y="206" font-size="14.5" font-weight="700" fill="#92400E" text-anchor="middle">③ 末行词表打分与选号</text>
  <text x="761" y="232" font-size="13.5" fill="#78350F" text-anchor="middle">logits_indices → compute_logits</text>
  <text x="761" y="256" font-size="13.5" fill="#78350F" text-anchor="middle">贪心或概率采样选出词编号</text>

  <!-- Bottom Prefill vs Decode Bottleneck Strip -->
  <rect x="16" y="306" width="424" height="118" rx="10" fill="#FFFBEB" stroke="#D97706" stroke-width="1.4"/>
  <text x="32" y="336" font-size="15" font-weight="700" fill="#92400E">第 1 轮 Prefill · AI Core 算力受限</text>
  <text x="32" y="368" font-size="14" font-weight="700" fill="#78350F">搬 1 次权重，整段提示词并行乘加</text>
  <text x="32" y="398" font-size="13.5" fill="#92400E">大矩阵乘密集 → 计算车间吃满（Compute-bound）</text>

  <rect x="460" y="306" width="424" height="118" rx="10" fill="#EFF6FF" stroke="#2563EB" stroke-width="1.4"/>
  <text x="476" y="336" font-size="15" font-weight="700" fill="#1E3A8A">第 2 轮+ Decode · HBM 带宽受限</text>
  <text x="476" y="368" font-size="14" font-weight="700" fill="#1E40AF">每步只算 1 个新词，照搬整份权重与历史 KV</text>
  <text x="476" y="398" font-size="13.5" fill="#1D4ED8">车间常等仓库送货 → 卡在显存带宽（Memory-bound）</text>
</svg>
