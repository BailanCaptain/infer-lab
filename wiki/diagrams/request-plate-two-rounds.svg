<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 660" width="900" height="660" role="img" aria-label="示意：提示词「我喜欢」经两轮四步生成「猫。」的立体拆解剖面。第 1 轮（Prefill）并行送入 [0, 2] 写下 k₀, v₀, k₁, v₁，直接由末行 h₁ 乘 W_head 选出首词 3 号「猫」；第 2 轮（Decode）只送 3 号 1 个新位置，复用旧 KV 追加 k₂, v₂，选出 5 号「。」满 max_tokens=2 当场停机。">
  <title>示意：提示词「我喜欢」经两轮四步生成「猫。」的立体拆解剖面。第 1 轮（Prefill）并行送入 [0, 2] 写下 k₀, v₀, k₁, v₁，直接由末行 h₁ 乘 W_head 选出首词 3 号「猫」；第 2 轮（Decode）只送 3 号 1 个新位置，复用旧 KV 追加 k₂, v₂，选出 5 号「。」满 max_tokens=2 当场停机。</title>
  <desc>两轮四步自回归生成闭环源码锚点：EngineCore.step 驱动 schedule（维护 num_computed_tokens）与 execute_model，model_runner_v1 按 logits_indices 取末行调用 compute_logits，输出后由 check_stop 核对 max_tokens。</desc>

  <!-- Tight-cropped transparent 3D cutaway floating directly on open canvas -->
  <image href="./wiki-illustrations/request-two-rounds-cutaway.webp" x="70" y="116" width="760" height="436" preserveAspectRatio="xMidYMid meet"/>

  <!-- ==================== CRISP LEADER LINES & RING DOTS ==================== -->
  <!-- 1: Prefill parallel prompt [0, 2] entering upper conveyor -->
  <path d="M 165 90 L 165 205" fill="none" stroke="#087f73" stroke-width="1.8"/>
  <circle cx="165" cy="205" r="5.5" fill="#ffffff" stroke="#087f73" stroke-width="2"/>
  <circle cx="165" cy="205" r="2.5" fill="#087f73"/>

  <!-- 2: Immediate KV cache write (k0, v0, k1, v1) via central chute -->
  <path d="M 446 90 L 446 223" fill="none" stroke="#4c65b6" stroke-width="1.8"/>
  <circle cx="446" cy="223" r="5.5" fill="#ffffff" stroke="#4c65b6" stroke-width="2"/>
  <circle cx="446" cy="223" r="2.5" fill="#4c65b6"/>

  <!-- 3: Prefill end directly produces first output token 3 via LM_HEAD -->
  <path d="M 748 90 L 748 188 L 734 256" fill="none" stroke="#c78300" stroke-width="1.8"/>
  <circle cx="734" cy="256" r="5.5" fill="#ffffff" stroke="#c78300" stroke-width="2"/>
  <circle cx="734" cy="256" r="2.5" fill="#c78300"/>

  <!-- 4: Not stopped (1 < max_tokens=2), token 3 slides down to Round 2 -->
  <path d="M 226 560 L 262 405" fill="none" stroke="#4c65b6" stroke-width="1.8"/>
  <circle cx="262" cy="405" r="5.5" fill="#ffffff" stroke="#4c65b6" stroke-width="2"/>
  <circle cx="262" cy="405" r="2.5" fill="#4c65b6"/>

  <!-- 5: Round 2 Decode feeds only token 3 and reads KV cache -->
  <path d="M 516 560 L 516 514 L 464 462" fill="none" stroke="#4c65b6" stroke-width="1.8"/>
  <circle cx="464" cy="462" r="5.5" fill="#ffffff" stroke="#4c65b6" stroke-width="2"/>
  <circle cx="464" cy="462" r="2.5" fill="#4c65b6"/>

  <!-- 6: Shared W_head produces token 5 and hits max_tokens=2 STOP -->
  <path d="M 771 560 L 771 463" fill="none" stroke="#b54237" stroke-width="1.8"/>
  <circle cx="771" cy="463" r="5.5" fill="#ffffff" stroke="#b54237" stroke-width="2"/>
  <circle cx="771" cy="463" r="2.5" fill="#b54237"/>

  <!-- ==================== TOP OPEN TYPOGRAPHIC ANNOTATIONS ==================== -->
  <!-- Callout 1: Top-Left -->
  <g>
    <circle cx="26" cy="24" r="12" fill="#087f73"/>
    <text x="26" y="28.5" text-anchor="middle" font-family="var(--font-sans)" font-size="12.5" font-weight="700" fill="#ffffff">1</text>
    <text x="45" y="29" font-family="var(--font-sans)" font-size="15" font-weight="700" fill="#17211f">第 1 轮 Prefill：送入 [0, 2]</text>
    <text x="45" y="53" font-family="var(--font-sans)" font-size="13.5" fill="#4d5652">切出 2 个位置，查表 E 零乘法</text>
    <text x="45" y="75" font-family="var(--font-sans)" font-size="13.5" fill="#4d5652">抽出 x₀, x₁ 拼成 [2, 4] 进层</text>
  </g>

  <!-- Callout 2: Top-Center -->
  <g>
    <circle cx="322" cy="24" r="12" fill="#4c65b6"/>
    <text x="322" y="28.5" text-anchor="middle" font-family="var(--font-sans)" font-size="12.5" font-weight="700" fill="#ffffff">2</text>
    <text x="341" y="29" font-family="var(--font-sans)" font-size="15" font-weight="700" fill="#17211f">当场写 KV cache：k₀, v₀, k₁, v₁</text>
    <text x="341" y="53" font-family="var(--font-sans)" font-size="13.5" fill="#4d5652">位置 1 融合位置 0 前文信息</text>
    <text x="341" y="75" font-family="var(--font-sans)" font-size="13.5" fill="#4d5652">两位置 K、V 存入缓存跨轮复用</text>
  </g>

  <!-- Callout 3: Top-Right -->
  <g>
    <circle cx="618" cy="24" r="12" fill="#c78300"/>
    <text x="618" y="28.5" text-anchor="middle" font-family="var(--font-sans)" font-size="12.5" font-weight="700" fill="#ffffff">3</text>
    <text x="637" y="29" font-family="var(--font-sans)" font-size="15" font-weight="700" fill="#17211f">Prefill 末位：h₁ 当场产首词</text>
    <text x="637" y="53" font-family="var(--font-sans)" font-size="13.5" fill="#4d5652">h₁ 乘 W_head 得 +2.1 → 3「猫」</text>
    <text x="637" y="75" font-family="var(--font-sans)" font-size="13.5" font-weight="700" fill="#c78300">无需为拿首词再多跑一轮 Decode</text>
  </g>

  <!-- ==================== BOTTOM OPEN TYPOGRAPHIC ANNOTATIONS ==================== -->
  <!-- Callout 4: Bottom-Left -->
  <g>
    <circle cx="26" cy="580" r="12" fill="#4c65b6"/>
    <text x="26" y="584.5" text-anchor="middle" font-family="var(--font-sans)" font-size="12.5" font-weight="700" fill="#ffffff">4</text>
    <text x="45" y="585" font-family="var(--font-sans)" font-size="15" font-weight="700" fill="#17211f">判停未满：首词滑入第 2 轮</text>
    <text x="45" y="609" font-family="var(--font-sans)" font-size="13.5" fill="#4d5652">check_stop 判 1 &lt; max_tokens(2)</text>
    <text x="45" y="631" font-family="var(--font-sans)" font-size="13.5" fill="#4d5652">还原「猫」，3 号作下轮新输入</text>
  </g>

  <!-- Callout 5: Bottom-Center -->
  <g>
    <circle cx="322" cy="580" r="12" fill="#4c65b6"/>
    <text x="322" y="584.5" text-anchor="middle" font-family="var(--font-sans)" font-size="12.5" font-weight="700" fill="#ffffff">5</text>
    <text x="341" y="585" font-family="var(--font-sans)" font-size="15" font-weight="700" fill="#17211f">第 2 轮 Decode：只送 3 号新词</text>
    <text x="341" y="609" font-family="var(--font-sans)" font-size="13.5" fill="#4d5652">免重算 0、1；直读旧 KV 缓存</text>
    <text x="341" y="631" font-family="var(--font-sans)" font-size="13.5" fill="#4d5652">追加 k₂, v₂，算出单行 h₂ [1, 4]</text>
  </g>

  <!-- Callout 6: Bottom-Right -->
  <g>
    <circle cx="618" cy="580" r="12" fill="#b54237"/>
    <text x="618" y="584.5" text-anchor="middle" font-family="var(--font-sans)" font-size="12.5" font-weight="700" fill="#ffffff">6</text>
    <text x="637" y="585" font-family="var(--font-sans)" font-size="15" font-weight="700" fill="#17211f">同张 W_head 选 5「。」→ 停机</text>
    <text x="637" y="609" font-family="var(--font-sans)" font-size="13.5" fill="#4d5652">最高分 +1.6 满 max_tokens=2 即停</text>
    <text x="637" y="631" font-family="var(--font-sans)" font-size="13.5" fill="#4d5652">末词不进第 3 轮，KV 留 3 个位置</text>
  </g>
</svg>
