<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 520" width="900" height="520" role="img" aria-label="请求跨进程中止生命周期、倒序还块与收尾抢占清缓存边界对照图" font-family="var(--font-sans)">
  <title>请求跨进程中止与收尾时序（ZMQ 双队列 ABORT、调度器倒序还块与异步调度下的 Worker 延迟删行），以及收尾、抢占与重置前缀缓存三者边界对照。</title>
  <desc>上半部分以三进程泳道展示前端断开或命中停止串后经 ZMQ 双队列（aborts_queue 与 input_queue）通知 EngineCore 倒序还块，以及异步调度下 NPU Worker 晚一到两步删批次行的时序；下半部分展示倒序还块队列规则与收尾、抢占、清空前缀缓存三者区别。</desc>
  <defs>
    <marker id="rt-arr-i" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto">
      <path d="M 0 1.5 L 8.5 5 L 0 8.5 z" fill="#4c65b6"/>
    </marker>
    <marker id="rt-arr-a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto">
      <path d="M 0 1.5 L 8.5 5 L 0 8.5 z" fill="#c78300"/>
    </marker>
    <marker id="rt-arr-t" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto">
      <path d="M 0 1.5 L 8.5 5 L 0 8.5 z" fill="#087f73"/>
    </marker>
  </defs>

  <text x="14" y="28" font-size="16" font-weight="700" fill="#17211f">一、跨进程中止与异步收尾时序：ZMQ 双队列抢清 → 倒序还块 → Worker 延步删行</text>

  <!-- Lane 1: API Server -->
  <rect x="14" y="44" width="130" height="72" rx="8" fill="#e8edff" stroke="#4c65b6" stroke-width="1.5"/>
  <text x="79" y="74" text-anchor="middle" font-size="14.5" font-weight="700" fill="#3a4f93">API Server</text>
  <text x="79" y="98" text-anchor="middle" font-size="13.5" fill="#4d5652">前端进程</text>

  <rect x="160" y="44" width="234" height="72" rx="8" fill="#ffffff" stroke="#4c65b6" stroke-width="1.3"/>
  <text x="174" y="72" font-size="14" font-weight="700" fill="#3a4f93">1. 客户端断开 / 命中 stop 串</text>
  <text x="174" y="98" font-size="13.5" fill="#17211f">删前端记录，写入 abort/stop 末果</text>

  <path d="M 394 80 L 420 80" fill="none" stroke="#4c65b6" stroke-width="2" marker-end="url(#rt-arr-i)"/>

  <rect x="426" y="44" width="236" height="72" rx="8" fill="#e8edff" stroke="#4c65b6" stroke-width="1.3"/>
  <text x="440" y="72" font-size="14" font-weight="700" fill="#3a4f93">2. 查 DP 路由表发 ZMQ ABORT</text>
  <text x="440" y="98" font-size="13.5" fill="#17211f">只发给所在 DP 组；引擎已死不发</text>

  <!-- Connector down from Lane 1 box 2 to Lane 2 -->
  <path d="M 544 116 L 544 132 L 278 132 L 278 142" fill="none" stroke="#4c65b6" stroke-width="2" marker-end="url(#rt-arr-i)"/>

  <!-- Lane 2: EngineCore -->
  <rect x="14" y="148" width="130" height="82" rx="8" fill="#fff4cf" stroke="#c78300" stroke-width="1.5"/>
  <text x="79" y="182" text-anchor="middle" font-size="14.5" font-weight="700" fill="#936300">EngineCore</text>
  <text x="79" y="206" text-anchor="middle" font-size="13.5" fill="#4d5652">调度器 &amp; 块池</text>

  <rect x="160" y="148" width="234" height="82" rx="8" fill="#ffffff" stroke="#c78300" stroke-width="1.3"/>
  <text x="174" y="174" font-size="14" font-weight="700" fill="#936300">3. ABORT 同时进双队列</text>
  <text x="174" y="198" font-size="13.5" fill="#17211f">• <tspan font-family="var(--font-mono)" font-weight="700">aborts_queue</tspan>：步尾优先清</text>
  <text x="174" y="220" font-size="13.5" fill="#4d5652">• <tspan font-family="var(--font-mono)">input_queue</tspan>：保序防漏（幂等）</text>

  <path d="M 394 189 L 420 189" fill="none" stroke="#c78300" stroke-width="2" marker-end="url(#rt-arr-a)"/>

  <rect x="426" y="148" width="460" height="82" rx="8" fill="#fff4cf" stroke="#c78300" stroke-width="1.3"/>
  <text x="440" y="174" font-size="14" font-weight="700" fill="#936300">4. _free_request 统一汇合点（引擎判停也直接走此步）</text>
  <text x="440" y="198" font-size="13.5" fill="#17211f">移出 running/waiting → 记入 <tspan font-family="var(--font-mono)" font-weight="700">finished_req_ids</tspan> → 倒序还块 → 删表项</text>
  <text x="440" y="220" font-size="13.5" fill="#4d5652">（有 KV connector 传输或在途写保护时经 <tspan font-family="var(--font-mono)">deferred_frees</tspan> 延后还块）</text>

  <!-- Connector down to Lane 3 -->
  <path d="M 656 230 L 656 244" fill="none" stroke="#087f73" stroke-width="2" marker-end="url(#rt-arr-t)"/>

  <!-- Lane 3: NPU Worker -->
  <rect x="14" y="250" width="130" height="62" rx="8" fill="#ddf4ef" stroke="#087f73" stroke-width="1.5"/>
  <text x="79" y="276" text-anchor="middle" font-size="14.5" font-weight="700" fill="#065f56">NPU Worker</text>
  <text x="79" y="298" text-anchor="middle" font-size="13.5" fill="#4d5652">每卡持久批次表</text>

  <rect x="160" y="250" width="316" height="62" rx="8" fill="#fff0e9" stroke="#b54237" stroke-width="1.3"/>
  <text x="174" y="275" font-size="14" font-weight="700" fill="#8f3229">异步调度多排一步（步 k+1）</text>
  <text x="174" y="298" font-size="13.5" fill="#17211f">判停前已发清单；该步结果回来直接跳过</text>

  <path d="M 476 281 L 502 281" fill="none" stroke="#087f73" stroke-width="2" marker-end="url(#rt-arr-t)"/>

  <rect x="508" y="250" width="378" height="62" rx="8" fill="#ddf4ef" stroke="#087f73" stroke-width="1.3"/>
  <text x="522" y="275" font-size="14" font-weight="700" fill="#065f56">5. 随下一份清单删批次行（步 k+2）</text>
  <text x="522" y="298" font-size="13.5" fill="#17211f">收 <tspan font-family="var(--font-mono)" font-weight="700">finished_req_ids</tspan> → 各卡清块表行与采样状态</text>

  <line x1="14" y1="328" x2="886" y2="328" stroke="#b8bcb5" stroke-width="1.4" stroke-dasharray="6 4"/>

  <text x="14" y="356" font-size="16" font-weight="700" fill="#17211f">二、倒序还块（ref_cnt = 0 才回池）与三类「回收动作」边界对照</text>

  <rect x="14" y="372" width="424" height="134" rx="9" fill="#ffffff" stroke="#087f73" stroke-width="1.4"/>
  <text x="28" y="398" font-size="15" font-weight="700" fill="#065f56">倒序还块：块 5 → 块 2 → 块 9（保护开头复用）</text>
  <text x="28" y="426" font-size="13.5" fill="#17211f">• 块 5、块 2：<tspan font-family="var(--font-mono)" font-weight="700">ref_cnt 1→0</tspan> 排空闲队尾（留指纹、不擦显存）</text>
  <text x="28" y="454" font-size="13.5" fill="#17211f">• 共享块 9：<tspan font-family="var(--font-mono)" font-weight="700">ref_cnt 2→1</tspan> 留在请求 B 手里，不回池</text>
  <text x="28" y="482" font-size="13.5" fill="#4d5652">• 滑窗尾状态组无指纹则插队头优先复用；GLM 关前缀缓存无指纹</text>

  <rect x="462" y="372" width="424" height="134" rx="9" fill="#ffffff" stroke="#9a4b86" stroke-width="1.4"/>
  <text x="476" y="398" font-size="15" font-weight="700" fill="#7a3a6a">别把三个动作混为一谈</text>
  <text x="476" y="426" font-size="13.5" fill="#17211f">• <tspan font-weight="700" fill="#065f56">收尾：</tspan>全还块 + 删请求表项 + 前端结束，不再调度</text>
  <text x="476" y="454" font-size="13.5" fill="#17211f">• <tspan font-weight="700" fill="#936300">抢占：</tspan>全还块但留表项与已生成编号，清进度退回等待队头</text>
  <text x="476" y="482" font-size="13.5" fill="#17211f">• <tspan font-weight="700" fill="#8f3229">清前缀缓存：</tspan>不还块，只抹指纹（除 null 外须全空闲否则失败）</text>
</svg>
