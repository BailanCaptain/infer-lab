<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 704" width="900" height="704" role="img" aria-label="请求 A 停下前后，三种进程里为它存的东西（数是示意；空闲块队列左边是队头、右边是队尾）。① 引擎在判停的同一步把 A 移出 running 队列，倒着还块（块 5 → 块 2 → 块 9），再删请求表项：块 5、块 2 的引用计数降到 0，排回队尾；块 9 是 A 和 B 共用的开头，计数只降到 1，留给 B。还回的块不擦数据。② 前端收到带结束原因的最后一份结果，删掉 A 的记录，输出槽交出最后一份后关闭。③ worker 等下一步的调度清单写明「A 已结束」，才删掉批次表里那一行。这是引擎先判停的顺序；停止字符串和客户端断开由前端先发现，① 和 ② 对调。">
  <title>请求 A 停下前后，三种进程里为它存的东西（数是示意；空闲块队列左边是队头、右边是队尾）。① 引擎在判停的同一步把 A 移出 running 队列，倒着还块（块 5 → 块 2 → 块 9），再删请求表项：块 5、块 2 的引用计数降到 0，排回队尾；块 9 是 A 和 B 共用的开头，计数只降到 1，留给 B。还回的块不擦数据。② 前端收到带结束原因的最后一份结果，删掉 A 的记录，输出槽交出最后一份后关闭。③ worker 等下一步的调度清单写明「A 已结束」，才删掉批次表里那一行。这是引擎先判停的顺序；停止字符串和客户端断开由前端先发现，① 和 ② 对调。</title>
