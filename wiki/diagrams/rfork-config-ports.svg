<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 660" width="900" height="660" role="img" aria-label="RFork 四类端口、双槽固定端口公式与四条独立时间预算轴对照图" font-family="var(--font-sans)">
  <title>RFork 四类端口拓扑、双槽 seed 端口公式与独立时间预算轴：区分 API 端口、Planner 地址、seed 监听/宣告地址与双槽公式 base + 2×global_rank + slot（越界或 EADDRINUSE 退动态端口）以及 TransferEngine RPC/HIXL 独立端口；下方按统一时间轴区分健康检查预算、单次 HTTP 超时、快慢归还重试与 Planner 租约 TTL。</title>
  <desc>关联源码符号：_resolve_seed_server_port, RFORK_SEED_PORT_SLOTS_PER_RANK, start_rfork_server, report_seed_once, initialize, get_rpc_port, DEFAULT_RFORK_REQUEST_TIMEOUT_SEC, DEFAULT_RFORK_HEARTBEAT_INTERVAL_SEC</desc>
  <defs>
    <marker id="cfg-arr-teal" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="#087f73"/>
    </marker>
    <marker id="cfg-arr-ink" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="#4d5652"/>
    </marker>
    <marker id="cfg-arr-plum" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="#9a4b86"/>
    </marker>
    <marker id="cfg-arr-indigo" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="#4c65b6"/>
    </marker>
  </defs>

  <!-- 区域 1：四类端口与双槽固定公式 -->
  <text x="16" y="26" font-size="16" font-weight="700" fill="#17211f">① 四类端口各归谁管（固定 port_base 只管第 3 类，且按主/草双槽分号）</text>

  <!-- 顶部：业务方 与 Planner -->
  <rect x="24" y="42" width="150" height="50" rx="5" fill="#ddf4ef" stroke="#087f73" stroke-width="1.3"/>
  <text x="99" y="64" text-anchor="middle" font-size="14" font-weight="700" fill="#065f56">业务方</text>
  <text x="99" y="83" text-anchor="middle" font-size="13.5" fill="#4d5652">发推理请求</text>

  <rect x="330" y="40" width="240" height="54" rx="6" fill="#ece9df" stroke="#66716d" stroke-width="1.4"/>
  <text x="450" y="63" text-anchor="middle" font-size="14.5" font-weight="700" fill="#17211f">② Planner 独立协调服务</text>
  <text x="450" y="83" text-anchor="middle" font-size="13.5" font-family="var(--font-mono)" fill="#4d5652">rfork_scheduler_url</text>

  <!-- 左侧：实例 A (seed) -->
  <rect x="16" y="128" width="406" height="256" rx="8" fill="#f5f3ec" stroke="#b8bcb5" stroke-width="1.3"/>
  <text x="96" y="152" font-size="14.5" font-weight="700" fill="#17211f">实例 A（已在服务 · 当 seed）</text>

  <rect x="24" y="164" width="104" height="52" rx="5" fill="#ddf4ef" stroke="#087f73" stroke-width="1.3"/>
  <text x="76" y="186" text-anchor="middle" font-size="14" font-weight="700" fill="#065f56">① API 端口</text>
  <text x="76" y="206" text-anchor="middle" font-size="13" fill="#4d5652">--port 指定</text>

  <rect x="136" y="164" width="278" height="108" rx="5" fill="#e8edff" stroke="#4c65b6" stroke-width="1.4"/>
  <text x="275" y="185" text-anchor="middle" font-size="14" font-weight="700" fill="#3a4f93">③ seed 元数据 HTTP 服务</text>
  <text x="275" y="205" text-anchor="middle" font-size="13" fill="#4d5652">监听 bind_host · 报 advertise_host</text>
  <text x="275" y="226" text-anchor="middle" font-size="13" font-weight="700" font-family="var(--font-mono)" fill="#17211f">base + 2 × global_rank + slot</text>
  <text x="275" y="246" text-anchor="middle" font-size="12" fill="#3a4f93">rank=3, base=35000 → 主 35006 / 草 35007</text>
  <text x="275" y="264" text-anchor="middle" font-size="12" fill="#8f3229">base=0 / &gt;65535 / EADDRINUSE 退 OS 随机</text>

  <rect x="24" y="282" width="390" height="92" rx="5" fill="#f7e7f2" stroke="#9a4b86" stroke-width="1.4"/>
  <text x="219" y="303" text-anchor="middle" font-size="13.5" font-weight="700" fill="#7a3a6a">④ 传输引擎数据端点（独立于 advertise_host）</text>
  <text x="219" y="323" text-anchor="middle" font-size="13" fill="#4d5652">RPC：port=0 → <tspan font-family="var(--font-mono)" font-weight="700">get_rpc_port()</tspan></text>
  <text x="219" y="342" text-anchor="middle" font-size="12.5" fill="#4d5652">（端口范围可用 YR_TE_RPC_PORT_MIN / MAX 指定）</text>
  <text x="219" y="362" text-anchor="middle" font-size="12.5" fill="#7a3a6a">HIXL 默认基址 22000 · 地址随 VLLM_HOST_IP / get_ip()</text>

  <!-- 右侧：实例 B (接收端) -->
  <rect x="478" y="128" width="406" height="256" rx="8" fill="#f5f3ec" stroke="#b8bcb5" stroke-width="1.3"/>
  <text x="492" y="152" font-size="14.5" font-weight="700" fill="#17211f">实例 B（新启动 · 来借权重）</text>

  <rect x="492" y="164" width="234" height="108" rx="5" fill="#ece9df" stroke="#66716d" stroke-width="1.3"/>
  <text x="609" y="188" text-anchor="middle" font-size="14" font-weight="700" fill="#17211f">RFork 加载器与会话</text>
  <text x="609" y="210" text-anchor="middle" font-size="13.5" fill="#4d5652">先预登记显存、绑 seed_key</text>
  <text x="609" y="232" text-anchor="middle" font-size="13.5" fill="#4d5652">向 Planner 借/续/还租约</text>
  <text x="609" y="254" text-anchor="middle" font-size="13.5" fill="#3a4f93">向 A 的 ③ 拉清单并过 5 门校验</text>

  <rect x="738" y="164" width="132" height="52" rx="5" fill="#ddf4ef" fill-opacity="0.55" stroke="#087f73" stroke-width="1.2" stroke-dasharray="4 3"/>
  <text x="804" y="186" text-anchor="middle" font-size="14" font-weight="700" fill="#065f56">① API 端口</text>
  <text x="804" y="206" text-anchor="middle" font-size="13.5" fill="#66716d">加载完才开放</text>

  <rect x="492" y="282" width="378" height="92" rx="5" fill="#f7e7f2" stroke="#9a4b86" stroke-width="1.4"/>
  <text x="681" y="308" text-anchor="middle" font-size="14" font-weight="700" fill="#7a3a6a">④ 传输引擎端点 → 写入本地 NPU HBM</text>
  <text x="681" y="332" text-anchor="middle" font-size="13" fill="#4d5652">B 主动向 A 的 ④ 发起 batch_transfer_sync_read</text>
  <text x="681" y="356" text-anchor="middle" font-size="13" fill="#7a3a6a">清单能拿到但读失败 → 重点查两端 ④ 连通性</text>

  <!-- 端口连接箭头 -->
  <line x1="76" y1="92" x2="76" y2="162" stroke="#087f73" stroke-width="1.7" marker-end="url(#cfg-arr-teal)"/>
  <path d="M 288 128 L 288 67 L 328 67" fill="none" stroke="#4d5652" stroke-width="1.6" stroke-dasharray="5 3" marker-end="url(#cfg-arr-ink)"/>
  <path d="M 609 162 L 609 67 L 572 67" fill="none" stroke="#4d5652" stroke-width="1.6" stroke-dasharray="5 3" marker-end="url(#cfg-arr-ink)"/>
  <text x="278" y="114" text-anchor="end" font-size="13.5" fill="#4d5652">登记 / 心跳</text>
  <text x="618" y="114" font-size="13.5" fill="#4d5652">借 / 续 / 还租约</text>

  <!-- ③ 元数据连接（B → A） -->
  <line x1="490" y1="216" x2="416" y2="216" stroke="#4c65b6" stroke-width="1.8" marker-end="url(#cfg-arr-indigo)"/>
  <text x="453" y="206" text-anchor="middle" font-size="13.5" font-weight="700" fill="#3a4f93">HTTP</text>
  <text x="453" y="236" text-anchor="middle" font-size="13.5" fill="#3a4f93">取清单</text>

  <!-- ④ 数据通道（A → B） -->
  <line x1="416" y1="324" x2="490" y2="324" stroke="#9a4b86" stroke-width="2" marker-end="url(#cfg-arr-plum)"/>
  <text x="453" y="314" text-anchor="middle" font-size="13.5" font-weight="700" fill="#7a3a6a">RDMA</text>
  <text x="453" y="344" text-anchor="middle" font-size="13.5" fill="#7a3a6a">读字节</text>

  <!-- 中间分隔线 -->
  <line x1="16" y1="394" x2="884" y2="394" stroke="#b8bcb5" stroke-width="1.4" stroke-dasharray="6 4"/>

  <!-- 区域 2：对齐时间预算轴 -->
  <text x="16" y="416" font-size="16" font-weight="700" fill="#17211f">② 四条独立时钟对照：单次请求超时 ≠ 重试总时长 ≠ Planner 租约 TTL</text>

  <!-- 标尺轴 (x=216 对应 0s，每 10s = 50px，120s = 816，右侧延伸至 878) -->
  <line x1="216" y1="446" x2="876" y2="446" stroke="#b8bcb5" stroke-width="1.3"/>
  <line x1="216" y1="440" x2="216" y2="626" stroke="#d8d8cf" stroke-width="1"/>
  <line x1="366" y1="440" x2="366" y2="626" stroke="#d8d8cf" stroke-width="1" stroke-dasharray="3 3"/>
  <line x1="516" y1="440" x2="516" y2="626" stroke="#c78300" stroke-width="1.2" stroke-dasharray="4 3"/>
  <line x1="666" y1="440" x2="666" y2="626" stroke="#d8d8cf" stroke-width="1" stroke-dasharray="3 3"/>
  <line x1="816" y1="440" x2="816" y2="626" stroke="#d8d8cf" stroke-width="1" stroke-dasharray="3 3"/>

  <text x="216" y="438" text-anchor="middle" font-size="13.5" fill="#66716d">0s</text>
  <text x="366" y="438" text-anchor="middle" font-size="13.5" fill="#66716d">30s</text>
  <text x="516" y="438" text-anchor="middle" font-size="13.5" font-weight="700" fill="#936300">60s (默认 TTL)</text>
  <text x="666" y="438" text-anchor="middle" font-size="13.5" fill="#66716d">90s</text>
  <text x="816" y="438" text-anchor="middle" font-size="13.5" fill="#66716d">120s+</text>

  <!-- 轨道 1：健康检查与单次 HTTP 超时 -->
  <text x="16" y="476" font-size="14" font-weight="700" fill="#3a4f93">客户端单次预算</text>
  <text x="16" y="495" font-size="13.5" fill="#66716d">均非整条加载总上限</text>

  <rect x="216" y="458" width="25" height="24" rx="3" fill="#087f73"/>
  <text x="248" y="475" font-size="13.5" font-weight="700" fill="#065f56">5s：seed 健康检查预算</text>
  <rect x="446" y="458" width="50" height="24" rx="3" fill="#4c65b6"/>
  <text x="504" y="475" font-size="13.5" font-weight="700" fill="#3a4f93">10s：单次 HTTP 连接 / 读取超时</text>

  <!-- 轨道 2：后台归还快慢重试（3×10s + 2×30s = 90s 快速阶段 + 慢试） -->
  <text x="16" y="528" font-size="14" font-weight="700" fill="#7a3a6a">后台还租约重试</text>
  <text x="16" y="547" font-size="13.5" fill="#66716d">卡满 10s 超时示意</text>

  <rect x="216" y="512" width="50" height="28" rx="3" fill="#9a4b86"/>
  <text x="241" y="531" text-anchor="middle" font-size="13.5" font-weight="700" fill="#ffffff">1次</text>
  <rect x="266" y="512" width="150" height="28" rx="3" fill="#f7e7f2" stroke="#9a4b86" stroke-width="1"/>
  <text x="341" y="531" text-anchor="middle" font-size="13.5" fill="#7a3a6a">等 30s</text>
  <rect x="416" y="512" width="50" height="28" rx="3" fill="#9a4b86"/>
  <text x="441" y="531" text-anchor="middle" font-size="13.5" font-weight="700" fill="#ffffff">2次</text>
  <rect x="466" y="512" width="150" height="28" rx="3" fill="#f7e7f2" stroke="#9a4b86" stroke-width="1"/>
  <text x="541" y="531" text-anchor="middle" font-size="13.5" fill="#7a3a6a">等 30s</text>
  <rect x="616" y="512" width="50" height="28" rx="3" fill="#9a4b86"/>
  <text x="641" y="531" text-anchor="middle" font-size="13.5" font-weight="700" fill="#ffffff">3次</text>
  <rect x="670" y="512" width="206" height="28" rx="3" fill="#fff0e9" stroke="#b54237" stroke-width="1.2" stroke-dasharray="4 3"/>
  <text x="773" y="531" text-anchor="middle" font-size="13.5" font-weight="700" fill="#8f3229">第 4 次起：≥60s 慢试持续</text>

  <!-- 轨道 3：Planner 租约 TTL 与可选续租 -->
  <text x="16" y="582" font-size="14" font-weight="700" fill="#936300">Planner 租约 TTL</text>
  <text x="16" y="601" font-size="13.5" fill="#66716d">归服务端管 · 可选续租</text>

  <rect x="216" y="566" width="300" height="28" rx="4" fill="#fff4cf" stroke="#c78300" stroke-width="1.5"/>
  <text x="366" y="585" text-anchor="middle" font-size="13.5" font-weight="700" fill="#936300">默认 60s 租约窗口（借出即起算）</text>

  <!-- 20s / 40s 续租标记 -->
  <circle cx="316" cy="596" r="5" fill="#087f73"/>
  <circle cx="416" cy="596" r="5" fill="#087f73"/>
  <rect x="520" y="566" width="364" height="28" rx="4" fill="#ddf4ef" stroke="#087f73" stroke-width="1.2"/>
  <text x="702" y="585" text-anchor="middle" font-size="13" fill="#065f56">TTL=60s 时每 20s 续租（clamp(TTL/3,0.1,30s)）</text>

  <text x="216" y="620" font-size="13" fill="#4d5652">▲ 无 LEASE_TTL_SEC 则到点收回；心跳每 30s 只保活（60s 无心跳转 draining），<tspan font-weight="700" fill="#8f3229">绝不续租</tspan>。</text>
  <text x="16" y="643" font-size="13" fill="#66716d">GLM 双机推演：每台 8 卡 × 2 套会话 × 2 类端口 = 32 个新端口（base=35000 时 node0 占 35000–35015，node1 占 35016–35031）。</text>
</svg>
