mode: native-svg
id: rfork-config-ports
caption: >-
  RFork 四类端口拓扑与独立时间预算轴：上栏分离业务 API 端口、Planner 协调地址、seed 元数据 HTTP 端口与传输引擎数据端点，其中 seed 固定端口严格按双槽公式 base + 2 × global_rank + slot（主模型槽 0、草稿槽 1，如 base=35000、rank=3 对应 35006 / 35007）分配，base=0、超出 65535 或遇 EADDRINUSE 时自动退回系统随机端口，且 advertise_host 不覆盖 TransferEngine 端点；下栏对齐区分 seed 健康检查预算（5s）、单次 HTTP 超时（10s）、后台归还快慢重试（3 次快试后转 ≥60s 慢试）与 Planner 租约 TTL（默认 60s，支持 LEASE_TTL_SEC 时按 clamp(TTL/3, 0.1, 30s) 周期续租——如 TTL=60s 时每 20s 续一次，心跳不续租）。
size: [900, 660]
