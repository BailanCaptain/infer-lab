<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 390" width="900" height="390" role="img" aria-label="RFork 版本升级隔离策略与静态审计对真机验收边界图" font-family="var(--font-sans)">
  <title>RFork 升级隔离策略与验收边界：左栏对比不换策略名导致新旧代码混用同一 seed 池的风险，以及通过切换 model_deploy_strategy_name 自然分池并等待活跃读者排空；右栏区分本地静态门禁（audit/lint/diagrams）与必须在真实 NPU 现场验收的五类项。</title>
  <desc>关联源码符号：build_compatibility_fingerprint, build_seed_key, mutable_weights_bypass_reason</desc>
  <defs>
    <marker id="mt-arr-red" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="#b54237"/>
    </marker>
    <marker id="mt-arr-teal" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="#087f73"/>
    </marker>
  </defs>

  <text x="16" y="26" font-size="16" font-weight="700" fill="#17211f">升级 RFork 代码时为何必须换策略名，以及本地审计与真机验收的边界</text>

  <!-- 左栏：升级隔离正误对照 -->
  <rect x="16" y="46" width="444" height="148" rx="7" fill="#fff0e9" stroke="#b54237" stroke-width="1.4"/>
  <text x="32" y="72" font-size="14.5" font-weight="700" fill="#8f3229">✗ 误区：只升级代码、不换 model_deploy_strategy_name</text>
  <rect x="32" y="88" width="166" height="44" rx="5" fill="#ffffff" stroke="#b54237" stroke-width="1.2"/>
  <text x="115" y="115" text-anchor="middle" font-size="13.5" font-weight="700" fill="#8f3229">旧版 seed（同策略名）</text>
  <line x1="198" y1="110" x2="254" y2="110" stroke="#b54237" stroke-width="1.6" stroke-dasharray="4 3" marker-end="url(#mt-arr-red)"/>
  <text x="226" y="102" text-anchor="middle" font-size="13.5" fill="#8f3229">同键!</text>
  <rect x="256" y="88" width="188" height="44" rx="5" fill="#ffffff" stroke="#b54237" stroke-width="1.2"/>
  <text x="350" y="115" text-anchor="middle" font-size="13.5" font-weight="700" fill="#17211f">新版 B 误命中旧池</text>
  <text x="32" y="156" font-size="13.5" fill="#4d5652">原因：指纹与结构摘要均不含 RFork Git commit；</text>
  <text x="32" y="178" font-size="13.5" fill="#8f3229">若模型、协议版本与张量结构摘要未变，仍可能混池互借！</text>

  <rect x="16" y="208" width="444" height="164" rx="7" fill="#ddf4ef" fill-opacity="0.65" stroke="#087f73" stroke-width="1.5"/>
  <text x="32" y="234" font-size="14.5" font-weight="700" fill="#065f56">✓ 做法：切换新策略名自然分池 + 排空后再下线旧池</text>
  <rect x="32" y="250" width="174" height="44" rx="5" fill="#ffffff" stroke="#087f73" stroke-width="1.2"/>
  <text x="119" y="277" text-anchor="middle" font-size="13.5" font-weight="700" fill="#065f56">旧池：strategy-v1</text>
  <rect x="234" y="250" width="210" height="44" rx="5" fill="#087f73"/>
  <text x="339" y="277" text-anchor="middle" font-size="13.5" font-weight="700" fill="#ffffff">新池：strategy-v2（隔离）</text>
  <text x="32" y="318" font-size="13.5" fill="#17211f">• 策略名同时进指纹与 seed_key，换名即彻底分池</text>
  <text x="32" y="342" font-size="13.5" fill="#4d5652">• 等正在读旧 seed 的实例排空并确认清理后再切换</text>
  <text x="32" y="362" font-size="13.5" font-weight="700" fill="#8f3229">• 绝不拿清空 Planner 账本替代活跃读者排空！</text>

  <!-- 右栏：静态审计 vs 真机必验 -->
  <rect x="480" y="46" width="404" height="148" rx="7" fill="#e8edff" stroke="#4c65b6" stroke-width="1.4"/>
  <text x="496" y="72" font-size="14.5" font-weight="700" fill="#3a4f93">本地静态审计（能核清的）</text>
  <text x="496" y="100" font-size="13.5" fill="#17211f">• pnpm wiki:audit：上游 8d6180e2 行号与图 pins</text>
  <text x="496" y="124" font-size="13.5" fill="#17211f">• pnpm wiki:lint：锚点、链接、格式与写作标准</text>
  <text x="496" y="148" font-size="13.5" fill="#17211f">• pnpm wiki:diagrams --check：SVG 白名单与规格</text>
  <text x="496" y="176" font-size="13.5" font-weight="700" fill="#3a4f93">局限：静态全绿 ≠ 真机已传通权重</text>

  <rect x="480" y="208" width="404" height="164" rx="7" fill="#fff4cf" stroke="#c78300" stroke-width="1.4"/>
  <text x="496" y="234" font-size="14.5" font-weight="700" fill="#936300">真机现场必验五件事（源码证不了）</text>
  <text x="496" y="262" font-size="13.5" fill="#17211f">1. Ex 注册 / 清理契约与清理失败保活安全门</text>
  <text x="496" y="286" font-size="13.5" fill="#17211f">2. MTP / DSpark 共享与 checkpoint 归属恢复</text>
  <text x="496" y="310" font-size="13.5" fill="#17211f">3. Engram 宿主表加载与回退释放</text>
  <text x="496" y="334" font-size="13.5" fill="#17211f">4. 与默认加载的输出 / logits 一致性比对</text>
  <text x="496" y="358" font-size="13.5" fill="#17211f">5. 并发扩容长尾与被借 seed 在线延迟影响</text>
</svg>
