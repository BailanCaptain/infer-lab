<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 430" width="900" height="430" role="img" aria-label="B 的一个 Worker 按上游 main（8d6180e2）顺序先建会话与算配置指纹，再搭空模型并按需转布局，随后登记本地显存并绑定结构摘要算出 seed_key，最后才带这把钥匙向 Planner 申请租约。建会话时若缺必填配置（model_url、model_deploy_strategy_name、rfork_scheduler_url）或严格参数非法，抛 RForkConfigurationError 直接中止启动、不走回退；若是并行组未初始化、指纹冲突或登记显存失败，则由回退保护接住并改走默认加载（会话未建时回退后不登记成 seed）。向 Planner 问回来有三种结果：借到租约就去核清单读权重；404 是匹配不到；网络错、非 200/404 或响应头缺项/越界是没问成，后两种同打「seed acquisition was unsuccessful」并回退本地加载后登记成 seed。">
  <title>B 的一个 Worker 按上游 main（8d6180e2）顺序先建会话与算配置指纹，再搭空模型并按需转布局，随后登记本地显存并绑定结构摘要算出 seed_key，最后才带这把钥匙向 Planner 申请租约。建会话时若缺必填配置（model_url、model_deploy_strategy_name、rfork_scheduler_url）或严格参数非法，抛 RForkConfigurationError 直接中止启动、不走回退；若是并行组未初始化、指纹冲突或登记显存失败，则由回退保护接住并改走默认加载（会话未建时回退后不登记成 seed）。向 Planner 问回来有三种结果：借到租约就去核清单读权重；404 是匹配不到；网络错、非 200/404 或响应头缺项/越界是没问成，后两种同打「seed acquisition was unsuccessful」并回退本地加载后登记成 seed。</title>
  <defs><marker id="rfork-identity-flow-ah-control" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="var(--color-control, #66716d)"/></marker><marker id="rfork-identity-flow-ah-danger" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="var(--color-danger, #b54237)"/></marker><marker id="rfork-identity-flow-ah-weight" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="var(--color-weight, #c78300)"/></marker></defs>
  <path d="M216 65 L242 65" fill="none" stroke="var(--color-control, #66716d)" stroke-width="1.4" marker-end="url(#rfork-identity-flow-ah-control)"/>
