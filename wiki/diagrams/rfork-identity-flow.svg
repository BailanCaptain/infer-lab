  <path d="M340 236 L340 300" fill="none" stroke="var(--color-danger, #b54237)" stroke-width="1.4" stroke-dasharray="7 5" marker-end="url(#rfork-identity-flow-ah-danger)"/>
  <path d="M575 236 L575 300" fill="none" stroke="var(--color-control, #66716d)" stroke-width="1.4" marker-end="url(#rfork-identity-flow-ah-control)"/>
