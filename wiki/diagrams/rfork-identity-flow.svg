<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 400" width="900" height="400" role="img" aria-label="B 的一个 Worker 先算钥匙，再搭空模型，然后只带这一把钥匙去问 Planner。算钥匙这几步里任何一处报错（没配 Planner 地址、缺模型地址或策略名、并行组没建好），钥匙就没算出来，加载器接住报错后回退。问 Planner 回来有三种结果：借到了，就拿着租约去读权重；Planner 说这把钥匙下没有可用的 seed，是真的匹配不到；地址配了但网络出错、回了别的状态码或者回复缺项，是没问成。三种没借到都改从存储加载、启动不会停下，但日志不同：钥匙没算出来打的是「传输失败、回退」的警告，回退后这张卡不登记成 seed；没问成和匹配不到打的是同一句「没有可用的 seed」，回退后登记成 seed。">
  <title>B 的一个 Worker 先算钥匙，再搭空模型，然后只带这一把钥匙去问 Planner。算钥匙这几步里任何一处报错（没配 Planner 地址、缺模型地址或策略名、并行组没建好），钥匙就没算出来，加载器接住报错后回退。问 Planner 回来有三种结果：借到了，就拿着租约去读权重；Planner 说这把钥匙下没有可用的 seed，是真的匹配不到；地址配了但网络出错、回了别的状态码或者回复缺项，是没问成。三种没借到都改从存储加载、启动不会停下，但日志不同：钥匙没算出来打的是「传输失败、回退」的警告，回退后这张卡不登记成 seed；没问成和匹配不到打的是同一句「没有可用的 seed」，回退后登记成 seed。</title>
  <defs><marker id="rfork-identity-flow-ah-control" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="var(--color-control, #66716d)"/></marker><marker id="rfork-identity-flow-ah-danger" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="var(--color-danger, #b54237)"/></marker><marker id="rfork-identity-flow-ah-weight" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="var(--color-weight, #c78300)"/></marker></defs>
