layout: figure
id: rfork-identity-flow
caption: B 的一个 Worker 按上游 main（8d6180e2）顺序先建会话与算配置指纹，再搭空模型并按需转布局，随后登记本地显存并绑定结构摘要算出 seed_key，最后才带这把钥匙向 Planner 申请租约。建会话时若缺必填配置（model_url、model_deploy_strategy_name、rfork_scheduler_url）或严格参数非法，抛 RForkConfigurationError 直接中止启动、不走回退；若是并行组未初始化、指纹冲突或登记显存失败，则由回退保护接住并改走默认加载（会话未建时回退后不登记成 seed）。向 Planner 问回来有三种结果：借到租约就去核清单读权重；404 是匹配不到；网络错、非 200/404 或响应头缺项/越界是没问成，后两种同打「seed acquisition was unsuccessful」并回退本地加载后登记成 seed。
size: [900, 430]
items:
  # 第一排：8d6180e2 真实先后顺序
  - { at: [20, 36], size: [196, 58], text: 建会话 · 算配置指纹, sub: 验三项必填 · 分片 · 指纹, tone: control, style: plain }
  - { at: [242, 36], size: [172, 58], text: 搭空模型与布局, sub: 先开空位 · 按需后处理, tone: weight, style: faded }
  - { at: [440, 36], size: [202, 58], text: 登记显存 · 算 seed_key, sub: 绑结构摘要 → seed_key, tone: control, style: plain }
  - { at: [668, 36], size: [212, 58], text: 向 Planner 申请租约, sub: 只带这把 seed_key, tone: control }
  # 第二排：五类出口
  - { at: [20, 186], size: [196, 60], text: 缺必填或非法配置, sub: RForkConfigurationError, tone: danger, style: solid }
  - { at: [232, 186], size: [182, 60], text: 会话或登记报错, sub: 并行组未建 · 登记失败, tone: danger, style: plain }
  - { at: [430, 186], size: [140, 60], text: 没问成, sub: 网络 · 非200/404, tone: danger, style: plain }
  - { at: [586, 186], size: [140, 60], text: Planner 说没有, sub: 404：无源或满额, tone: control, style: plain }
  - { at: [742, 186], size: [138, 60], text: 借到：拿租约, sub: 响应四项齐全, tone: control }
  # 第三排：最终后果
  - { at: [20, 322], size: [196, 58], text: 直接中止启动, sub: 不静默回退默认加载, tone: danger, style: faded }
  - { at: [232, 322], size: [494, 58], text: 先清理，再改从存储加载（启动不停）, sub: 会话未建不登 seed；登记失败或未借到回退后可登 seed, tone: control, style: faded }
  - { at: [742, 322], size: [138, 58], text: 按地址读权重, sub: 先取并核清单, tone: weight }
