layout: figure
id: rfork-identity-flow
caption: B 的一个 Worker 先算钥匙，再搭空模型，然后只带这一把钥匙去问 Planner。算钥匙这几步里任何一处报错（没配 Planner 地址、缺模型地址或策略名、并行组没建好），钥匙就没算出来，加载器接住报错后回退。问 Planner 回来有三种结果：借到了，就拿着租约去读权重；Planner 说这把钥匙下没有可用的 seed，是真的匹配不到；地址配了但网络出错、回了别的状态码或者回复缺项，是没问成。三种没借到都改从存储加载、启动不会停下，但日志不同：钥匙没算出来打的是「传输失败、回退」的警告，回退后这张卡不登记成 seed；没问成和匹配不到打的是同一句「没有可用的 seed」，回退后登记成 seed。
size: [900, 400]
