<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 480" width="900" height="480" role="img" aria-label="每张卡、每个模型各有一把钥匙（seed key）。钥匙由三样东西合成：部署指纹说明「两边整套部署一不一样」，分片编号说明「要的是哪一份」，最后一格说明是主模型还是 speculative decoding 用的草稿模型。新实例 B 的每把钥匙只能和 A 上一字不差的那一把配上：B 卡 0 的主模型配 A 卡 0 的主模型，草稿配草稿，四对各配各的。实例 C 加载的是同一个模型没量化的 BF16 版本，量化方式不同，指纹就不同，编号再一样也配不上。图中是两张卡（TP2）的示意实例，F、G 代表两个不同的指纹值。">
  <title>每张卡、每个模型各有一把钥匙（seed key）。钥匙由三样东西合成：部署指纹说明「两边整套部署一不一样」，分片编号说明「要的是哪一份」，最后一格说明是主模型还是 speculative decoding 用的草稿模型。新实例 B 的每把钥匙只能和 A 上一字不差的那一把配上：B 卡 0 的主模型配 A 卡 0 的主模型，草稿配草稿，四对各配各的。实例 C 加载的是同一个模型没量化的 BF16 版本，量化方式不同，指纹就不同，编号再一样也配不上。图中是两张卡（TP2）的示意实例，F、G 代表两个不同的指纹值。</title>
