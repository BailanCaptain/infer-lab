      - { at: [3, 2], text: 草稿 }
  # 实例 B 的四把钥匙，和 A 一一相同
  - at: [598, 200]
    rows: 4
    cols: 3
    cell: [86, 30]
    gap: 6
    tone: control
    style: plain
