layout: figure
id: rfork-identity
caption: 每张卡、每个模型各有一把钥匙（seed key）。钥匙由三样东西合成：部署指纹说明「两边整套部署一不一样」，分片编号说明「要的是哪一份」，最后一格说明是主模型还是 speculative decoding 用的草稿模型。新实例 B 的每把钥匙只能和 A 上一字不差的那一把配上：B 卡 0 的主模型配 A 卡 0 的主模型，草稿配草稿，四对各配各的。实例 C 加载的是同一个模型没量化的 BF16 版本，量化方式不同，指纹就不同，编号再一样也配不上。图中是两张卡（TP2）的示意实例，F、G 代表两个不同的指纹值。
size: [900, 480]
frames:
  - { label: 实例 A · 已在服务（seed）· W8A8 · TP2, at: [20, 180], size: [340, 190] }
  - { label: 实例 B · 正在启动 · W8A8 · TP2, at: [540, 180], size: [340, 190] }
  - { label: 实例 C · 正在启动 · BF16 · TP2, at: [540, 392], size: [340, 70] }
items:
  - { at: [620, 28], size: [200, 44], text: seed key, sub: 再算一次哈希, tone: control }
  - { at: [385, 150], size: [130, 44], text: Planner, sub: 按钥匙逐字查, tone: control, style: plain }
