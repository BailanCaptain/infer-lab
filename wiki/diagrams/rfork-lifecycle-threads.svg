<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 276" width="900" height="276" role="img" aria-label="一个 Worker 传完权重以后，几条线程各干各的（示意数）。启动线程第 3 秒就把模型交出去，接着往下启动。还租约线程第一次收到 503，隔 30 秒再还，第 34 秒确认还上，接着在同一条线程里发布 seed。发布成功后 seed 服务开始应答，心跳线程先等 30 秒才报第一次平安。">
  <title>一个 Worker 传完权重以后，几条线程各干各的（示意数）。启动线程第 3 秒就把模型交出去，接着往下启动。还租约线程第一次收到 503，隔 30 秒再还，第 34 秒确认还上，接着在同一条线程里发布 seed。发布成功后 seed 服务开始应答，心跳线程先等 30 秒才报第一次平安。</title>
  <defs><pattern id="rfork-lifecycle-threads-hatch" width="7" height="7" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="7" height="7" fill="var(--color-control-soft, #f1efe8)"/><line x1="0" y1="0" x2="0" y2="7" stroke="var(--color-ink-muted, #66716d)" stroke-width="2"/></pattern></defs>
  <text x="98" y="60.5" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="13" font-weight="700" fill="var(--color-ink, #17211f)" text-anchor="end">启动线程</text>
  <path d="M110 72H880" stroke="var(--color-line-strong, #b8bcb5)" stroke-width="1"/>
  <rect x="110" y="40" width="33" height="32" rx="4" fill="var(--color-weight-soft, #fff4cf)" stroke="var(--color-weight, #c78300)" stroke-width="1.4"/>
  <rect x="143" y="40" width="737" height="32" rx="4" fill="var(--color-surface, #fbfaf6)" stroke="var(--color-control, #66716d)" stroke-opacity="0.45" stroke-width="1.3" stroke-dasharray="4 3"/>
  <text x="511.5" y="60.5" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="13" font-weight="700" fill="#4d5652" text-anchor="middle">前 3 秒做后处理；之后交出模型，vLLM 接着往下启动</text>
  <text x="98" y="102.5" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="13" font-weight="700" fill="var(--color-ink, #17211f)" text-anchor="end">还租约线程</text>
  <path d="M110 114H880" stroke="var(--color-line-strong, #b8bcb5)" stroke-width="1"/>
  <rect x="110" y="82" width="22" height="32" rx="4" fill="var(--color-comm-soft, #f5e6f0)" stroke="var(--color-comm, #9a4b86)" stroke-width="1.4"/>
  <rect x="132" y="82" width="330" height="32" rx="4" fill="url(#rfork-lifecycle-threads-hatch)" stroke="var(--color-ink-muted, #66716d)" stroke-width="1.3"/>
  <text x="297" y="102.5" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="13" font-weight="700" fill="var(--color-ink, #17211f)" text-anchor="middle">收到 503，等 30 秒再试</text>
  <rect x="462" y="82" width="22" height="32" rx="4" fill="var(--color-comm-soft, #f5e6f0)" stroke="var(--color-comm, #9a4b86)" stroke-width="1.4"/>
  <rect x="484" y="82" width="22" height="32" rx="4" fill="var(--color-surface, #fbfaf6)" stroke="var(--color-comm, #9a4b86)" stroke-opacity="0.45" stroke-width="1.3" stroke-dasharray="4 3"/>
  <text x="98" y="144.5" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="13" font-weight="700" fill="var(--color-ink, #17211f)" text-anchor="end">seed 服务</text>
  <path d="M110 156H880" stroke="var(--color-line-strong, #b8bcb5)" stroke-width="1"/>
  <rect x="506" y="124" width="374" height="32" rx="4" fill="var(--color-surface, #fbfaf6)" stroke="var(--color-comm, #9a4b86)" stroke-opacity="0.45" stroke-width="1.3" stroke-dasharray="4 3"/>
  <text x="693" y="144.5" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="13" font-weight="700" fill="#7a3a6a" text-anchor="middle">服务中</text>
  <text x="98" y="186.5" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="13" font-weight="700" fill="var(--color-ink, #17211f)" text-anchor="end">心跳线程</text>
  <rect x="506" y="166" width="330" height="32" rx="4" fill="url(#rfork-lifecycle-threads-hatch)" stroke="var(--color-ink-muted, #66716d)" stroke-width="1.3"/>
  <text x="671" y="186.5" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="13" font-weight="700" fill="var(--color-ink, #17211f)" text-anchor="middle">先等 30 秒</text>
  <rect x="836" y="166" width="11" height="32" rx="4" fill="var(--color-comm-soft, #f5e6f0)" stroke="var(--color-comm, #9a4b86)" stroke-width="1.4"/>
  <path d="M110 210H880" stroke="var(--color-ink, #17211f)" stroke-width="1.3"/>
  <path d="M110 210v5" stroke="var(--color-ink, #17211f)" stroke-width="1.3"/>
  <text x="110" y="230" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="13" font-weight="400" fill="var(--color-ink-muted, #66716d)" text-anchor="middle">0</text>
  <path d="M220 210v5" stroke="var(--color-ink, #17211f)" stroke-width="1.3"/>
  <text x="220" y="230" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="13" font-weight="400" fill="var(--color-ink-muted, #66716d)" text-anchor="middle">10</text>
  <path d="M330 210v5" stroke="var(--color-ink, #17211f)" stroke-width="1.3"/>
  <text x="330" y="230" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="13" font-weight="400" fill="var(--color-ink-muted, #66716d)" text-anchor="middle">20</text>
  <path d="M440 210v5" stroke="var(--color-ink, #17211f)" stroke-width="1.3"/>
  <text x="440" y="230" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="13" font-weight="400" fill="var(--color-ink-muted, #66716d)" text-anchor="middle">30</text>
  <path d="M550 210v5" stroke="var(--color-ink, #17211f)" stroke-width="1.3"/>
  <text x="550" y="230" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="13" font-weight="400" fill="var(--color-ink-muted, #66716d)" text-anchor="middle">40</text>
  <path d="M660 210v5" stroke="var(--color-ink, #17211f)" stroke-width="1.3"/>
  <text x="660" y="230" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="13" font-weight="400" fill="var(--color-ink-muted, #66716d)" text-anchor="middle">50</text>
  <path d="M770 210v5" stroke="var(--color-ink, #17211f)" stroke-width="1.3"/>
  <text x="770" y="230" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="13" font-weight="400" fill="var(--color-ink-muted, #66716d)" text-anchor="middle">60</text>
  <path d="M880 210v5" stroke="var(--color-ink, #17211f)" stroke-width="1.3"/>
  <text x="880" y="230" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="13" font-weight="400" fill="var(--color-ink-muted, #66716d)" text-anchor="middle">70 秒</text>
  <path d="M143 36V210" stroke="var(--color-ink, #17211f)" stroke-width="1.2" stroke-dasharray="3 4"/>
  <text x="143" y="30" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="13" font-weight="700" fill="var(--color-ink, #17211f)" text-anchor="middle">延期</text>
  <path d="M484 36V210" stroke="var(--color-ink, #17211f)" stroke-width="1.2" stroke-dasharray="3 4"/>
  <text x="484" y="30" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="13" font-weight="700" fill="var(--color-ink, #17211f)" text-anchor="middle">确认还上</text>
  <path d="M836 36V210" stroke="var(--color-ink, #17211f)" stroke-width="1.2" stroke-dasharray="3 4"/>
  <text x="836" y="30" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="13" font-weight="700" fill="var(--color-ink, #17211f)" text-anchor="middle">首次心跳</text>
  <text x="121" y="258" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="13" font-weight="400" fill="#7a3a6a" text-anchor="middle">↑ 第 1 次还</text>
  <text x="480" y="258" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="13" font-weight="400" fill="#7a3a6a" text-anchor="end">第 2 次还 ↑</text>
  <text x="498" y="258" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="13" font-weight="400" fill="#7a3a6a">↑ 起服务、首次登记</text>
</svg>
