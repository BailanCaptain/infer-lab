<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 420" width="900" height="420" role="img" aria-label="B 的一个 Worker 借完权重以后的几种状态。上排是模型这条线：权重传完、交出模型，等整个实例的 Worker 都备好才开始接请求。中排是「当 seed」这条线：借来的租约还上了才发布，还没还上就先记作延期，被拒或次数用完就不当 seed，模型照常推理。左列是失败这条线：读权重中途出错先清理，清干净才回退到从存储读。右下是进程退出时的收尾。">
  <title>B 的一个 Worker 借完权重以后的几种状态。上排是模型这条线：权重传完、交出模型，等整个实例的 Worker 都备好才开始接请求。中排是「当 seed」这条线：借来的租约还上了才发布，还没还上就先记作延期，被拒或次数用完就不当 seed，模型照常推理。左列是失败这条线：读权重中途出错先清理，清干净才回退到从存储读。右下是进程退出时的收尾。</title>
  <defs><marker id="rfork-lifecycle-ah-weight" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="var(--color-weight, #c78300)"/></marker><marker id="rfork-lifecycle-ah-control" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="var(--color-control, #66716d)"/></marker><marker id="rfork-lifecycle-ah-danger" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="var(--color-danger, #b54237)"/></marker><marker id="rfork-lifecycle-ah-comm" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="var(--color-comm, #9a4b86)"/></marker></defs>
  <path d="M200 88 L240 88" fill="none" stroke="var(--color-weight, #c78300)" stroke-width="1.4" marker-end="url(#rfork-lifecycle-ah-weight)"/>
  <path d="M420 88 L460 88" fill="none" stroke="var(--color-weight, #c78300)" stroke-width="1.4" marker-end="url(#rfork-lifecycle-ah-weight)"/>
  <path d="M640 88 L680 88" fill="none" stroke="var(--color-control, #66716d)" stroke-width="1.4" marker-end="url(#rfork-lifecycle-ah-control)"/>
  <path d="M110 116 L110 190" fill="none" stroke="var(--color-danger, #b54237)" stroke-width="1.4" marker-end="url(#rfork-lifecycle-ah-danger)"/>
  <path d="M110 246 L110 320" fill="none" stroke="var(--color-danger, #b54237)" stroke-width="1.4" stroke-dasharray="7 5" marker-end="url(#rfork-lifecycle-ah-danger)"/>
  <path d="M500 116 L500 150 L330 150 L330 190" fill="none" stroke="var(--color-control, #66716d)" stroke-width="1.4" stroke-dasharray="7 5" marker-end="url(#rfork-lifecycle-ah-control)"/>
  <path d="M600 116 L600 190" fill="none" stroke="var(--color-comm, #9a4b86)" stroke-width="2.2" marker-end="url(#rfork-lifecycle-ah-comm)"/>
  <path d="M420 218 L460 218" fill="none" stroke="var(--color-comm, #9a4b86)" stroke-width="2.2" marker-end="url(#rfork-lifecycle-ah-comm)"/>
  <path d="M300 246 L300 320" fill="none" stroke="var(--color-danger, #b54237)" stroke-width="1.4" stroke-dasharray="7 5" marker-end="url(#rfork-lifecycle-ah-danger)"/>
  <path d="M640 218 L680 218" fill="none" stroke="var(--color-comm, #9a4b86)" stroke-width="2.2" marker-end="url(#rfork-lifecycle-ah-comm)"/>
  <path d="M780 246 L780 320" fill="none" stroke="var(--color-control, #66716d)" stroke-width="1.4" stroke-dasharray="7 5" marker-end="url(#rfork-lifecycle-ah-control)"/>
  <rect x="20" y="60" width="180" height="56" rx="8" fill="var(--color-weight-soft, #fff4cf)" stroke="var(--color-weight, #c78300)" stroke-opacity="0.4" stroke-width="1.5" stroke-dasharray="5 4"/>
  <text x="110" y="84" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="13" font-weight="400" fill="#936300" text-anchor="middle">读权重</text>
  <text x="110" y="103" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="13" font-weight="400" fill="#936300" text-anchor="middle">中途失败就要清理</text>
  <rect x="240" y="60" width="180" height="56" rx="8" fill="var(--color-weight, #c78300)" stroke="var(--color-ink, #17211f)" stroke-width="1.5"/>
  <text x="330" y="84" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="14" font-weight="700" fill="var(--color-ink-inverse, #ffffff)" text-anchor="middle">权重传完</text>
  <text x="330" y="103" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="13" font-weight="400" fill="var(--color-ink-inverse, #ffffff)" text-anchor="middle">列出的读取全部返回</text>
  <rect x="460" y="60" width="180" height="56" rx="8" fill="var(--color-weight, #c78300)" stroke="var(--color-ink, #17211f)" stroke-width="1.5"/>
  <text x="550" y="84" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="14" font-weight="700" fill="var(--color-ink-inverse, #ffffff)" text-anchor="middle">交出模型</text>
  <text x="550" y="103" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="13" font-weight="400" fill="var(--color-ink-inverse, #ffffff)" text-anchor="middle">后处理、切推理模式</text>
  <rect x="680" y="60" width="200" height="56" rx="8" fill="var(--color-control, #66716d)" stroke="var(--color-ink, #17211f)" stroke-width="1.5"/>
  <text x="780" y="84" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="14" font-weight="700" fill="var(--color-ink-inverse, #ffffff)" text-anchor="middle">实例接请求</text>
  <text x="780" y="103" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="13" font-weight="400" fill="var(--color-ink-inverse, #ffffff)" text-anchor="middle">所有 Worker 都备好之后</text>
  <rect x="20" y="190" width="180" height="56" rx="8" fill="var(--color-surface-sunken, #ece9df)" stroke="var(--color-ink, #17211f)" stroke-width="1.5"/>
  <text x="110" y="214" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="14" font-weight="700" fill="var(--color-ink, #17211f)" text-anchor="middle">清理</text>
  <text x="110" y="233" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="13" font-weight="400" fill="var(--color-ink, #17211f)" text-anchor="middle">停服务 · 注销显存</text>
  <rect x="240" y="190" width="180" height="56" rx="8" fill="var(--color-surface-sunken, #ece9df)" stroke="var(--color-control, #66716d)" stroke-opacity="0.4" stroke-width="1.5" stroke-dasharray="5 4"/>
  <text x="330" y="214" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="13" font-weight="400" fill="#4d5652" text-anchor="middle">等租约还上</text>
  <text x="330" y="233" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="13" font-weight="400" fill="#4d5652" text-anchor="middle">当 seed 先记作延期</text>
  <rect x="460" y="190" width="180" height="56" rx="8" fill="var(--color-comm, #9a4b86)" stroke="var(--color-ink, #17211f)" stroke-width="1.5"/>
  <text x="550" y="214" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="14" font-weight="700" fill="var(--color-ink-inverse, #ffffff)" text-anchor="middle">发布 seed</text>
  <text x="550" y="233" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="13" font-weight="400" fill="var(--color-ink-inverse, #ffffff)" text-anchor="middle">起服务 · 首次登记</text>
  <rect x="680" y="190" width="200" height="56" rx="8" fill="var(--color-comm-soft, #f7e7f2)" stroke="var(--color-comm, #9a4b86)" stroke-opacity="0.4" stroke-width="1.5" stroke-dasharray="5 4"/>
  <text x="780" y="214" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="13" font-weight="400" fill="#7a3a6a" text-anchor="middle">服务中</text>
  <text x="780" y="233" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="13" font-weight="400" fill="#7a3a6a" text-anchor="middle">定时心跳报平安</text>
  <rect x="20" y="320" width="180" height="56" rx="8" fill="var(--color-surface-sunken, #ece9df)" stroke="var(--color-ink, #17211f)" stroke-width="1.5"/>
  <text x="110" y="344" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="14" font-weight="700" fill="var(--color-ink, #17211f)" text-anchor="middle">回退</text>
  <text x="110" y="363" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="13" font-weight="400" fill="var(--color-ink, #17211f)" text-anchor="middle">从存储重读一遍</text>
  <rect x="240" y="320" width="180" height="56" rx="8" fill="var(--color-surface-sunken, #ece9df)" stroke="var(--color-ink, #17211f)" stroke-width="1.5"/>
  <text x="330" y="344" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="14" font-weight="700" fill="var(--color-ink, #17211f)" text-anchor="middle">不当 seed</text>
  <text x="330" y="363" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="13" font-weight="400" fill="var(--color-ink, #17211f)" text-anchor="middle">模型照常推理</text>
  <rect x="680" y="320" width="200" height="56" rx="8" fill="var(--color-surface-sunken, #ece9df)" stroke="var(--color-ink, #17211f)" stroke-width="1.5"/>
  <text x="780" y="344" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="14" font-weight="700" fill="var(--color-ink, #17211f)" text-anchor="middle">关停收尾</text>
  <text x="780" y="363" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="13" font-weight="400" fill="var(--color-ink, #17211f)" text-anchor="middle">停心跳 · 撤登记 · 关服务</text>
  <text x="118" y="160" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="12" font-weight="400" fill="#8f3229">任一步失败</text>
  <text x="118" y="292" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="12" font-weight="400" fill="#8f3229">清干净才回退</text>
  <text x="340" y="176" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="12" font-weight="400" fill="#4d5652">还没还上</text>
  <text x="608" y="160" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="12" font-weight="400" fill="#7a3a6a">已还上</text>
  <text x="424" y="184" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="11" font-weight="400" fill="#7a3a6a">还上了</text>
  <text x="308" y="292" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="12" font-weight="400" fill="#8f3229">被拒或次数用完</text>
  <text x="788" y="292" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="12" font-weight="400" fill="#4d5652">进程退出</text>
  <text x="460" y="404" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="13.5" font-weight="400" fill="var(--color-ink-muted, #66716d)" text-anchor="middle" font-style="italic">回退加载完的模型同样交出，也照样可以去当 seed</text>
</svg>
