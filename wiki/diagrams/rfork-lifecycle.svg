<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 400" width="900" height="400" role="img" aria-label="模型和租约各走一条路：租约还不上只挡住「当来源」，已经传好的模型照样交出去">
  <title>模型和租约各走一条路：租约还不上只挡住「当来源」，已经传好的模型照样交出去</title>
  <defs><marker id="rfork-lifecycle-ah-weight" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="var(--color-weight, #c78300)"/></marker><marker id="rfork-lifecycle-ah-control" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="var(--color-control, #66716d)"/></marker><marker id="rfork-lifecycle-ah-danger" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="var(--color-danger, #b54237)"/></marker></defs>
  <rect x="30" y="30" width="840" height="120" rx="16" fill="none" stroke="var(--color-line-strong, #b8bcb5)" stroke-width="1.5"/>
  <text x="46" y="18" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="15" font-weight="700" fill="var(--color-ink, #17211f)">模型这条路</text>
  <rect x="30" y="190" width="840" height="180" rx="16" fill="none" stroke="var(--color-line-strong, #b8bcb5)" stroke-width="1.5"/>
  <text x="46" y="178" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="15" font-weight="700" fill="var(--color-ink, #17211f)">归还租约这条路（后台）</text>
  <path d="M260 90 L350 90" fill="none" stroke="var(--color-weight, #c78300)" stroke-width="1.4" marker-end="url(#rfork-lifecycle-ah-weight)"/>
  <path d="M550 90 L640 90" fill="none" stroke="var(--color-weight, #c78300)" stroke-width="1.4" marker-end="url(#rfork-lifecycle-ah-weight)"/>
  <path d="M160 116 L160 224" fill="none" stroke="var(--color-control, #66716d)" stroke-width="1.4" stroke-dasharray="7 5" marker-end="url(#rfork-lifecycle-ah-control)"/>
  <path d="M260 250 L640 250" fill="none" stroke="var(--color-control, #66716d)" stroke-width="1.4" marker-end="url(#rfork-lifecycle-ah-control)"/>
  <path d="M160 276 L160 326 L350 326" fill="none" stroke="var(--color-danger, #b54237)" stroke-width="1.4" marker-end="url(#rfork-lifecycle-ah-danger)"/>
  <path d="M740 224 L740 116" fill="none" stroke="var(--color-control, #66716d)" stroke-width="1.4" stroke-dasharray="7 5" marker-end="url(#rfork-lifecycle-ah-control)"/>
  <rect x="60" y="64" width="200" height="52" rx="8" fill="var(--color-weight, #c78300)" stroke="var(--color-ink, #17211f)" stroke-width="1.5"/>
  <text x="160" y="95" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="14" font-weight="700" fill="var(--color-ink-inverse, #ffffff)" text-anchor="middle">权重传完</text>
  <rect x="350" y="64" width="200" height="52" rx="8" fill="var(--color-weight-soft, #fff4cf)" stroke="var(--color-weight, #c78300)" stroke-opacity="0.4" stroke-width="1.5" stroke-dasharray="5 4"/>
  <text x="450" y="95" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="13" font-weight="400" fill="#936300" text-anchor="middle">就绪</text>
  <rect x="640" y="64" width="200" height="52" rx="8" fill="var(--color-weight, #c78300)" stroke="var(--color-ink, #17211f)" stroke-width="1.5"/>
  <text x="740" y="95" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="14" font-weight="700" fill="var(--color-ink-inverse, #ffffff)" text-anchor="middle">当来源服务</text>
  <rect x="60" y="224" width="200" height="52" rx="8" fill="var(--color-surface-sunken, #ece9df)" stroke="var(--color-ink, #17211f)" stroke-width="1.5"/>
  <text x="160" y="255" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="14" font-weight="700" fill="var(--color-ink, #17211f)" text-anchor="middle">发一次归还</text>
  <rect x="640" y="224" width="200" height="52" rx="8" fill="var(--color-surface-sunken, #ece9df)" stroke="var(--color-ink, #17211f)" stroke-width="1.5"/>
  <text x="740" y="255" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="14" font-weight="700" fill="var(--color-ink, #17211f)" text-anchor="middle">已归还</text>
  <rect x="350" y="300" width="200" height="52" rx="8" fill="var(--color-surface-sunken, #ece9df)" stroke="var(--color-ink, #17211f)" stroke-width="1.5"/>
  <text x="450" y="331" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="14" font-weight="700" fill="var(--color-ink, #17211f)" text-anchor="middle">被拒 / 次数用完</text>
  <text x="752" y="176" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="13.5" font-weight="400" fill="#4d5652">还上了才当来源</text>
</svg>
