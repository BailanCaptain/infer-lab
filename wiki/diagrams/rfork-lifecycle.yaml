  - { at: [240, 190], size: [180, 56], text: 等租约还上, sub: 当 seed 先记作延期, tone: control, style: faded }
  - { at: [460, 190], size: [180, 56], text: 发布 seed, sub: 起服务 · 首次登记, tone: comm }
