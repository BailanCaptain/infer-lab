  - { at: [240, 60], size: [180, 56], text: 权重传完, sub: 列出的读取全部返回, tone: weight }
  - { at: [460, 60], size: [180, 56], text: 交出模型, sub: 后处理、切推理模式, tone: weight }
  - { at: [680, 60], size: [200, 56], text: 实例接请求, sub: 所有 Worker 都备好之后, tone: control }
