mode: native-svg
id: rfork-lifecycle
caption: >-
  RFork 会话八状态可循环状态机与双并行生命线：上栏列出全部八个 RForkLifecycleState（INITIALIZED、REGISTERED、LEASED、TRANSFERRED、READY、SERVING、FINALIZED 与 CLEANUP_REQUIRED），标明正常登记、读取、重登与心跳异常都会经过 CLEANUP_REQUIRED 并可回退清净后重入循环；下栏对照权重传完后的两条并行生命线——启动线程直接交回模型推进实例接请求，后台归还线程按 RELEASED（推进延期发布）、RETRYABLE（3 次 30s 快试后转 ≥60s 慢试，不放弃延期）与 REJECTED（停试并取消延期，模型照常推理）分别落盘。
size: [900, 660]
