layout: figure
id: rfork-lifecycle
caption: B 的一个 Worker 借完权重以后的几种状态。上排是模型这条线：权重传完、交出模型，等整个实例的 Worker 都备好才开始接请求。中排是「当 seed」这条线：借来的租约还上了才发布，还没还上就先记作延期，被拒或次数用完就不当 seed，模型照常推理。左列是失败这条线：读权重中途出错先清理，清干净才回退到从存储读。右下是进程退出时的收尾。
size: [900, 420]

