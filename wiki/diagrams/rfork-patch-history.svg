<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 350" width="900" height="350" role="img" aria-label="早期独立分支的七份历史补丁演进关系：补丁 3 之后分成两路，原来六份补丁走上面一路，补丁 7 建在下面一路上；在补丁 6 上直接打补丁 7 打不上，当年需补一份衔接差异才能重放。目前全章已演进并原子重锚至社区上游 vllm-ascend main（8d6180e2），这七份早期补丁均已退役归档，仅用于追溯历史演进。">
