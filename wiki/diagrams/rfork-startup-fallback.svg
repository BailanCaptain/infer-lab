<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 586" width="900" height="586" role="img" aria-label="回退这一段在加载器里的先后与分支。缺少必填配置或严格参数非法会抛 RForkConfigurationError 直接中止启动，不进入此回退流程；只有未借到来源或可恢复异常（ImportError / OSError / RuntimeError / ValueError）才进入回退。会话建起来了，就先停服务、安排还租约、注销登记（最多两轮），再按拍好的快照撤掉半成品模型留下的全局登记；服务没停下或内存没注销，就报错终止，不分配第二份模型。会话没建起来（如没装传输引擎或并行组未初始化），跳过清理直接普通加载，事后也不发布 seed。普通加载自己失败就抛错；成功后，会话在就尝试把自己发布成 seed，发布失败也照样交回模型。">
  <title>回退这一段在加载器里的先后与分支。缺少必填配置或严格参数非法会抛 RForkConfigurationError 直接中止启动，不进入此回退流程；只有未借到来源或可恢复异常（ImportError / OSError / RuntimeError / ValueError）才进入回退。会话建起来了，就先停服务、安排还租约、注销登记（最多两轮），再按拍好的快照撤掉半成品模型留下的全局登记；服务没停下或内存没注销，就报错终止，不分配第二份模型。会话没建起来（如没装传输引擎或并行组未初始化），跳过清理直接普通加载，事后也不发布 seed。普通加载自己失败就抛错；成功后，会话在就尝试把自己发布成 seed，发布失败也照样交回模型。</title>
  <defs><marker id="rfork-startup-fallback-ah-ink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="var(--color-ink, #17211f)"/></marker><marker id="rfork-startup-fallback-ah-danger" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="var(--color-danger, #b54237)"/></marker></defs>
  <path d="M380 64 L380 82" fill="none" stroke="var(--color-ink, #17211f)" stroke-width="1.4" marker-end="url(#rfork-startup-fallback-ah-ink)"/>
  <path d="M380 126 L380 144" fill="none" stroke="var(--color-ink, #17211f)" stroke-width="1.4" marker-end="url(#rfork-startup-fallback-ah-ink)"/>
  <path d="M380 188 L380 206" fill="none" stroke="var(--color-ink, #17211f)" stroke-width="1.4" marker-end="url(#rfork-startup-fallback-ah-ink)"/>
  <path d="M380 250 L380 268" fill="none" stroke="var(--color-ink, #17211f)" stroke-width="1.4" marker-end="url(#rfork-startup-fallback-ah-ink)"/>
  <path d="M380 312 L380 330" fill="none" stroke="var(--color-ink, #17211f)" stroke-width="1.4" marker-end="url(#rfork-startup-fallback-ah-ink)"/>
  <path d="M380 374 L380 392" fill="none" stroke="var(--color-ink, #17211f)" stroke-width="1.4" marker-end="url(#rfork-startup-fallback-ah-ink)"/>
  <path d="M380 436 L380 454" fill="none" stroke="var(--color-ink, #17211f)" stroke-width="1.4" marker-end="url(#rfork-startup-fallback-ah-ink)"/>
  <path d="M380 498 L380 516" fill="none" stroke="var(--color-ink, #17211f)" stroke-width="1.4" marker-end="url(#rfork-startup-fallback-ah-ink)"/>
  <path d="M220 104 L184 104" fill="none" stroke="var(--color-ink, #17211f)" stroke-width="1.4" marker-end="url(#rfork-startup-fallback-ah-ink)"/>
  <path d="M100 132 L100 414 L220 414" fill="none" stroke="var(--color-ink, #17211f)" stroke-width="1.4" stroke-dasharray="7 5" marker-end="url(#rfork-startup-fallback-ah-ink)"/>
  <path d="M540 290 L620 290" fill="none" stroke="var(--color-danger, #b54237)" stroke-width="1.4" marker-end="url(#rfork-startup-fallback-ah-danger)"/>
  <path d="M540 414 L620 414" fill="none" stroke="var(--color-danger, #b54237)" stroke-width="1.4" marker-end="url(#rfork-startup-fallback-ah-danger)"/>
  <path d="M540 476 L620 476" fill="none" stroke="var(--color-ink, #17211f)" stroke-width="1.4" marker-end="url(#rfork-startup-fallback-ah-ink)"/>
  <rect x="220" y="20" width="320" height="44" rx="8" fill="var(--color-danger-soft, #fbe5e2)" stroke="var(--color-danger, #b54237)" stroke-width="1.4"/>
  <text x="380" y="47" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="14" font-weight="700" fill="var(--color-ink, #17211f)" text-anchor="middle">⑦ 没借到，或可恢复异常</text>
  <rect x="220" y="82" width="320" height="44" rx="8" fill="var(--color-control-soft, #f1efe8)" stroke="var(--color-line-strong, #b8bcb5)" stroke-width="1.4"/>
  <text x="380" y="109" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="14" font-weight="700" fill="var(--color-ink, #17211f)" text-anchor="middle">会话建起来了吗？</text>
  <rect x="220" y="144" width="320" height="44" rx="8" fill="var(--color-surface, #fbfaf6)" stroke="var(--color-danger, #b54237)" stroke-opacity="0.45" stroke-width="1.3" stroke-dasharray="5 4"/>
  <text x="380" y="171" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="13" font-weight="400" fill="#8f3229" text-anchor="middle">停服务 · 安排还租约 · 注销登记</text>
  <rect x="220" y="206" width="320" height="44" rx="8" fill="var(--color-surface, #fbfaf6)" stroke="var(--color-danger, #b54237)" stroke-opacity="0.45" stroke-width="1.3" stroke-dasharray="5 4"/>
  <text x="380" y="233" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="13" font-weight="400" fill="#8f3229" text-anchor="middle">按快照撤掉半成品留下的全局登记</text>
  <rect x="220" y="268" width="320" height="44" rx="8" fill="var(--color-control-soft, #f1efe8)" stroke="var(--color-line-strong, #b8bcb5)" stroke-width="1.4"/>
  <text x="380" y="295" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="14" font-weight="700" fill="var(--color-ink, #17211f)" text-anchor="middle">服务停了、内存注销了吗？</text>
  <rect x="220" y="330" width="320" height="44" rx="8" fill="var(--color-control-soft, #f1efe8)" stroke="var(--color-line-strong, #b8bcb5)" stroke-width="1.4"/>
  <text x="380" y="357" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="14" font-weight="700" fill="var(--color-ink, #17211f)" text-anchor="middle">回收半成品模型，清空 NPU 缓存</text>
  <rect x="220" y="392" width="320" height="44" rx="8" fill="var(--color-weight-soft, #fff4cf)" stroke="var(--color-weight, #c78300)" stroke-width="1.4"/>
  <text x="380" y="419" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="14" font-weight="700" fill="var(--color-ink, #17211f)" text-anchor="middle">普通加载：加载方式改回自动</text>
  <rect x="220" y="454" width="320" height="44" rx="8" fill="var(--color-control-soft, #f1efe8)" stroke="var(--color-line-strong, #b8bcb5)" stroke-width="1.4"/>
  <text x="380" y="481" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="14" font-weight="700" fill="var(--color-ink, #17211f)" text-anchor="middle">会话在吗？</text>
  <rect x="220" y="516" width="320" height="44" rx="8" fill="var(--color-control-soft, #f1efe8)" stroke="var(--color-line-strong, #b8bcb5)" stroke-width="1.4"/>
  <text x="380" y="543" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="14" font-weight="700" fill="var(--color-ink, #17211f)" text-anchor="middle">尝试发布成 seed，再交回模型</text>
  <rect x="16" y="76" width="168" height="56" rx="8" fill="var(--color-control-soft, #f1efe8)" stroke="var(--color-line-strong, #b8bcb5)" stroke-width="1.4"/>
  <text x="100" y="100" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="14" font-weight="700" fill="var(--color-ink, #17211f)" text-anchor="middle">会话没建起来</text>
  <text x="100" y="119" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="13" font-weight="400" fill="var(--color-ink-muted, #66716d)" text-anchor="middle">缺传输库或并行组未建</text>
  <rect x="620" y="268" width="264" height="44" rx="8" fill="var(--color-danger-soft, #fbe5e2)" stroke="var(--color-danger, #b54237)" stroke-width="1.4"/>
  <text x="752" y="295" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="14" font-weight="700" fill="var(--color-ink, #17211f)" text-anchor="middle">报错终止，不分配第二份模型</text>
  <rect x="620" y="392" width="264" height="44" rx="8" fill="var(--color-danger-soft, #fbe5e2)" stroke="var(--color-danger, #b54237)" stroke-width="1.4"/>
  <text x="752" y="419" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="14" font-weight="700" fill="var(--color-ink, #17211f)" text-anchor="middle">抛错：两层失败原因都要看</text>
  <rect x="620" y="454" width="264" height="44" rx="8" fill="var(--color-control-soft, #f1efe8)" stroke="var(--color-line-strong, #b8bcb5)" stroke-width="1.4"/>
  <text x="752" y="481" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="14" font-weight="700" fill="var(--color-ink, #17211f)" text-anchor="middle">只交回模型，不当 seed</text>
  <text x="202" y="95" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="13" font-weight="400" fill="var(--color-ink, #17211f)" text-anchor="middle">否</text>
  <text x="110" y="280" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="13" font-weight="400" fill="var(--color-ink-muted, #66716d)" font-style="italic">跳过清理</text>
  <text x="392" y="140" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="13" font-weight="400" fill="var(--color-ink, #17211f)">是</text>
  <text x="552" y="168" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="13" font-weight="400" fill="var(--color-ink-muted, #66716d)" font-style="italic">最多试两轮；租约交给后台去还</text>
  <text x="552" y="230" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="13" font-weight="400" fill="var(--color-ink-muted, #66716d)" font-style="italic">前向上下文、MoE、RoPE、Dynamo、Engram</text>
  <text x="580" y="281" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="13" font-weight="400" fill="#8f3229" text-anchor="middle">否</text>
  <text x="392" y="326" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="13" font-weight="400" fill="var(--color-ink, #17211f)">是</text>
  <text x="580" y="405" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="13" font-weight="400" fill="#8f3229" text-anchor="middle">失败</text>
  <text x="580" y="467" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="13" font-weight="400" fill="var(--color-ink, #17211f)" text-anchor="middle">否</text>
  <text x="392" y="512" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="13" font-weight="400" fill="var(--color-ink, #17211f)">是</text>
  <text x="552" y="542" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="13" font-weight="400" fill="var(--color-ink-muted, #66716d)" font-style="italic">发布失败，模型也照样交回</text>
</svg>
