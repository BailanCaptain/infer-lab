layout: figure
id: rfork-startup-fallback
caption: 回退这一段在加载器里的先后与分支。会话建起来了，就先停服务、安排还租约、注销登记（最多两轮），再按拍好的快照撤掉半成品模型留下的全局登记；服务没停下或内存没注销，就报错终止，不分配第二份模型。会话根本没建起来（缺配置、没装传输引擎），跳过清理直接普通加载，事后也不发布 seed。普通加载自己失败就抛错；成功后，会话在就尝试把自己发布成 seed，发布失败也照样交回模型。
size: [900, 580]

