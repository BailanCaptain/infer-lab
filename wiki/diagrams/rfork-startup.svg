<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 620" width="900" height="620" role="img" aria-label="工作版晚申请租约：本地准备先完成；未命中或失败需要清理后重新加载">
  <title>工作版晚申请租约：本地准备先完成；未命中或失败需要清理后重新加载</title>
  <rect width="900" height="620" fill="var(--color-surface, #fbfaf6)"/>
  <rect x="20" y="35" width="360" height="240" rx="12" fill="var(--color-kv-soft, #e8edff)"/>
  <rect x="36" y="49" width="128.4" height="26.5" rx="13.3" fill="var(--color-kv, #4c65b6)"/><text x="47" y="67.1" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="13.5" font-weight="700" fill="var(--color-ink-inverse, #ffffff)">还没有借用 seed</text>
  <text x="38" y="92" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="12.5" font-weight="400" fill="var(--color-ink-muted, #5b6763)">初始化和必要的布局转换不占用 source lease</text>
  <rect x="405" y="35" width="475" height="240" rx="12" fill="var(--color-weight-soft, #fff4cf)"/>
  <rect x="421" y="49" width="151.9" height="26.5" rx="13.3" fill="var(--color-weight, #b87a00)"/><text x="432" y="67.1" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="13.5" font-weight="700" fill="var(--color-ink-inverse, #ffffff)">持有 source lease</text>
  <text x="423" y="92" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="12.5" font-weight="400" fill="var(--color-ink-muted, #5b6763)">注册、metadata、读取，然后异步释放</text>
  <rect x="20" y="486" width="860" height="72" rx="10" fill="var(--color-accent-soft, #fff0e9)"/>
  <rect x="20" y="486" width="5" height="72" rx="2.5" fill="var(--color-accent, #e85b32)"/>
  <g transform="translate(43.8 511.8) scale(0.85)" fill="none" stroke="var(--color-accent, #e85b32)" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M4 4h9v9H4z M11 11h9v9h-9z M13 4l7 7"/></g>
  <text x="78" y="519" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="15" font-weight="700" fill="var(--color-ink, #17211f)">未命中 / 失败分支：先确认旧服务和注册内存清理成功，再用默认 loader 重建</text>
  <text x="78" y="539" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="12.5" font-weight="400" fill="var(--color-ink-muted, #5b6763)">清理失败就终止，不能带着 pinned 旧权重再分配第二份模型</text>
  <rect x="45" y="112" width="310" height="58" rx="11" fill="var(--color-surface, #fbfaf6)" stroke="var(--color-kv, #4c65b6)" stroke-width="1.5"/>
  <rect x="57" y="125" width="32" height="32" rx="9" fill="var(--color-kv-soft, #e8edff)"/><g transform="translate(63.4 131.4) scale(0.8)" fill="none" stroke="var(--color-kv, #4c65b6)" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3l9 5-9 5-9-5z M3 13l9 5 9-5"/></g>
  <text x="97" y="137.5" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="14.5" font-weight="700" fill="var(--color-ink, #17211f)">构建本地模型</text>
  <text x="97" y="155.5" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="12.5" font-weight="400" fill="var(--color-ink-muted, #5b6763)">全共享 draft 可在此直接返回</text>
  <rect x="45" y="200" width="310" height="58" rx="11" fill="var(--color-surface, #fbfaf6)" stroke="var(--color-kv, #4c65b6)" stroke-width="1.5"/>
  <rect x="57" y="213" width="32" height="32" rx="9" fill="var(--color-kv-soft, #e8edff)"/><g transform="translate(63.4 219.4) scale(0.8)" fill="none" stroke="var(--color-kv, #4c65b6)" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M12 8a4 4 0 1 0 0 8 4 4 0 0 0 0-8z M12 2v3M12 19v3M2 12h3M19 12h3M5 5l2 2M17 17l2 2M19 5l-2 2M7 17l-2 2"/></g>
  <text x="97" y="225.5" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="14.5" font-weight="700" fill="var(--color-ink, #17211f)">必要的布局转换与同步</text>
  <text x="97" y="243.5" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="12.5" font-weight="400" fill="var(--color-ink-muted, #5b6763)">processed 路径在申请 lease 之前</text>
  <rect x="430" y="112" width="425" height="58" rx="11" fill="var(--color-surface, #fbfaf6)" stroke="var(--color-weight, #b87a00)" stroke-width="1.5"/>
  <rect x="442" y="125" width="32" height="32" rx="9" fill="var(--color-weight-soft, #fff4cf)"/><g transform="translate(448.4 131.4) scale(0.8)" fill="none" stroke="var(--color-weight, #b87a00)" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3l8 5v8l-8 5-8-5V8z M12 3v18"/></g>
  <text x="482" y="137.5" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="14.5" font-weight="700" fill="var(--color-ink, #17211f)">向 Planner 申请匹配来源</text>
  <text x="482" y="155.5" font-family="'JetBrains Mono',ui-monospace,monospace" font-size="12.5" font-weight="400" fill="var(--color-weight, #b87a00)">acquire_seed</text>
  <rect x="430" y="200" width="425" height="58" rx="11" fill="var(--color-surface, #fbfaf6)" stroke="var(--color-weight, #b87a00)" stroke-width="1.5"/>
  <rect x="442" y="213" width="32" height="32" rx="9" fill="var(--color-weight-soft, #fff4cf)"/><g transform="translate(448.4 219.4) scale(0.8)" fill="none" stroke="var(--color-weight, #b87a00)" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M7 7h10v10H7z M10 3v4M14 3v4M10 17v4M14 17v4M3 10h4M3 14h4M17 10h4M17 14h4"/></g>
  <text x="482" y="225.5" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="14.5" font-weight="700" fill="var(--color-ink, #17211f)">注册本地内存，验收并读取</text>
  <text x="482" y="243.5" font-family="'JetBrains Mono',ui-monospace,monospace" font-size="12.5" font-weight="400" fill="var(--color-weight, #b87a00)">transfer_from_seed</text>
  <rect x="430" y="338" width="425" height="70" rx="11" fill="var(--color-surface, #fbfaf6)" stroke="var(--color-kv, #4c65b6)" stroke-width="1.5"/>
  <rect x="442" y="357" width="32" height="32" rx="9" fill="var(--color-kv-soft, #e8edff)"/><g transform="translate(448.4 363.4) scale(0.8)" fill="none" stroke="var(--color-kv, #4c65b6)" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M13 2L4 14h7l-1 8 9-12h-7z"/></g>
  <text x="482" y="369.5" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="14.5" font-weight="700" fill="var(--color-ink, #17211f)">剩余后处理与 eval，返回模型</text>
  <text x="482" y="387.5" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="12.5" font-weight="400" fill="var(--color-ink-muted, #5b6763)">租约未释放时可延期发布 seed</text>
  <path d="M200 170 L200 200" fill="none" stroke="var(--color-kv, #4c65b6)" stroke-width="1.8"/>
  <path d="M200 200 l-5.5 -11 l11 0 z" fill="var(--color-kv, #4c65b6)"/>
  <path d="M355 228 L430 141" fill="none" stroke="var(--color-weight, #b87a00)" stroke-width="1.8"/>
  <path d="M430 141 l-5.5 11 l11 0 z" fill="var(--color-weight, #b87a00)"/>
  <path d="M642 170 L642 200" fill="none" stroke="var(--color-weight, #b87a00)" stroke-width="1.8"/>
  <path d="M642 200 l-5.5 -11 l11 0 z" fill="var(--color-weight, #b87a00)"/>
  <path d="M642 258 L642 338" fill="none" stroke="var(--color-kv, #4c65b6)" stroke-width="1.8"/>
  <path d="M642 338 l-5.5 -11 l11 0 z" fill="var(--color-kv, #4c65b6)"/>
  <path d="M430 229 L390 229 L390 452 L390 486" fill="none" stroke="var(--color-accent, #e85b32)" stroke-width="1.8" stroke-dasharray="6 4"/>
  <path d="M390 486 l-5.5 -11 l11 0 z" fill="var(--color-accent, #e85b32)"/>
  <text x="40" y="348" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="13" font-weight="400" fill="var(--color-ink-muted, #5b6763)">命中主路径向下继续。</text>
  <text x="40" y="382" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="13" font-weight="400" fill="var(--color-ink-muted, #5b6763)">申请或传输失败进入底部回退路径。</text>
  <text x="560" y="455" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="13" font-weight="400" fill="var(--color-ink-muted, #5b6763)">虚线概括失败时的清理分支</text>
  <text x="25" y="594" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="13" font-weight="400" fill="var(--color-ink-muted, #5b6763)">seed 服务单独启动失败会保留有效模型；动态 EPLB 在这张图之前就绕过 RFork。</text>
</svg>
