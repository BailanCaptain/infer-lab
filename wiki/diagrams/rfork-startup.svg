<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 530" width="900" height="530" role="img" aria-label="新实例 B 的一个 Worker 用 RFork 加载模型，按 ①–⑩ 从上往下走。前六步只在本卡准备，不占租约；④ ⑥ 画成虚线浅框，是因为这时搭的还是空模型，没借到就白做。⑥ 和 ⑨ 的后处理二选一：开了量化、权重 NZ 模式为 2 或硬件要求 NZ 的模型在 ⑥ 做；其他模型到 ⑨ 才做适用的后处理，跳过未量化 MoE 的重复处理。⑦ 向 Planner 借到租约以后，⑧ 才从 A 读权重；读完尝试把自己发布成 seed，再交回模型。两处提前离开：② 开了 EPLB 就直接普通加载；⑤ 草稿模型的权重全落在主模型已登记的显存里，就直接复用、交回。⑦ 没借到、⑧ 读失败，或 ③–⑨ 任何一步抛错，都先清理干净，再从存储普通加载，最后同样尝试发布成 seed；清理不干净就报错终止，不再分配第二份模型。">
  <title>新实例 B 的一个 Worker 用 RFork 加载模型，按 ①–⑩ 从上往下走。前六步只在本卡准备，不占租约；④ ⑥ 画成虚线浅框，是因为这时搭的还是空模型，没借到就白做。⑥ 和 ⑨ 的后处理二选一：开了量化、权重 NZ 模式为 2 或硬件要求 NZ 的模型在 ⑥ 做；其他模型到 ⑨ 才做适用的后处理，跳过未量化 MoE 的重复处理。⑦ 向 Planner 借到租约以后，⑧ 才从 A 读权重；读完尝试把自己发布成 seed，再交回模型。两处提前离开：② 开了 EPLB 就直接普通加载；⑤ 草稿模型的权重全落在主模型已登记的显存里，就直接复用、交回。⑦ 没借到、⑧ 读失败，或 ③–⑨ 任何一步抛错，都先清理干净，再从存储普通加载，最后同样尝试发布成 seed；清理不干净就报错终止，不再分配第二份模型。</title>
  <defs><marker id="rfork-startup-ah-ink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="var(--color-ink, #17211f)"/></marker><marker id="rfork-startup-ah-control" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="var(--color-control, #66716d)"/></marker><marker id="rfork-startup-ah-weight" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="var(--color-weight, #c78300)"/></marker><marker id="rfork-startup-ah-danger" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="var(--color-danger, #b54237)"/></marker></defs>
