layout: figure
id: rfork-startup
caption: 新实例 B 的一个 Worker 按上游 main（8d6180e2）顺序走 ①–⑩。①–⑥ 与 ⑦ 的前半段（登记本地显存并绑定结构摘要与 seed_key）都在申请租约之前完成，不占租约有效期；④ ⑥ 与登记显存画成浅虚框，因为未命中或失败会清理重建。⑥ 和 ⑨ 的后处理二选一：开了量化、权重 NZ 模式为 2 或硬件要求 NZ 的模型在 ⑥ 做并等 NPU 同步，第 ⑨ 步只刷新 FlatQuant 标量并切 eval()；其他模型到 ⑨ 才做适用的后处理（跳过未量化 MoE 重复处理）。⑦ 后半段向 Planner 拿到租约后才进入「占着租约」区间，⑧ 取清单、核对并按批读；读完后安排后台归还租约，⑨ 收尾进推理模式，⑩ 尝试发布成 seed 再交回模型。两处提前离开：② 命中可变权重守卫（sleep mode / 在线权重传输 / enable_eplb）直接普通加载；⑤ 草稿模型整份共用主模型显存就直接复用交回。登记失败、没借到、读失败或可恢复异常都先清理干净再回退默认加载（缺必填或非法配置抛 RForkConfigurationError 直接中止，不进入回退）。
size: [900, 590]

