layout: figure
id: rfork-startup
caption: 新实例 B 的一个 Worker 用 RFork 加载模型，按 ①–⑩ 从上往下走。前六步只在本卡准备，不占租约；④ ⑥ 画成虚线浅框，是因为这时搭的还是空模型，没借到就白做。⑥ 和 ⑨ 二选一：要转布局的模型（开了量化、权重 NZ 模式为 2 或硬件要求 NZ）在 ⑥ 做后处理，不转的到 ⑨ 才做。⑦ 向 Planner 借到租约以后，⑧ 才从 A 读权重；读完交回模型，再尝试把自己发布成 seed。两处提前离开：② 开了 EPLB 就直接普通加载；⑤ 草稿模型的权重全落在主模型已登记的显存里，就直接复用、交回。⑦ 没借到、⑧ 读失败，或 ③–⑨ 任何一步抛错，都先清理干净，再从存储普通加载，最后同样尝试发布成 seed；清理不干净就报错终止，不再分配第二份模型。
size: [900, 530]

