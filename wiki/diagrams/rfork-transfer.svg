<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 680" width="900" height="680" role="img" aria-label="RFork 五门清单校验与双上限分批读取图：展示全部五道清单校验（含 NPU 格式、键集相等、整份通过才读首字节）以及 2.5 GiB 拆段地址递进与 1 GiB / 512 段双上限装批" font-family="var(--font-sans)">
  <title>RFork 五门清单校验与双上限分批读取：上栏展示取回 HTTP 清单后、写入第一个字节前的五道全过校验门（含名字集合、严格五元组、dtype 与 NPU 格式、总条数/总字节/稠密布局）；下栏按比例展示 2.5 GiB 大张量拆段地址递进（1 + 1 + 0.5 GiB）与双封批上限（≤ 1 GiB 字节上限与 ≤ 512 段数量上限）。</title>
  <desc>关联源码符号：fetch_seed_transfer_info, validate_weight_manifest, is_non_overlapping_dense_tensor, iter_transfer_chunks, MAX_TRANSFER_CHUNK_BYTES, MAX_TRANSFER_CHUNK_SEGMENTS, batch_transfer_sync_read</desc>
  <defs>
    <marker id="tr-arr-ink" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="#4d5652"/>
    </marker>
    <marker id="tr-arr-teal" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="#087f73"/>
    </marker>
  </defs>

  <!-- 区域 1：五道清单校验门 -->
  <text x="16" y="26" font-size="16" font-weight="700" fill="#17211f">① 五门清单校验：HTTP 拉回清单后，五道门全部通过才允许写入第 1 个字节</text>

  <rect x="16" y="46" width="160" height="114" rx="6" fill="#e8edff" stroke="#4c65b6" stroke-width="1.4"/>
  <circle cx="38" cy="68" r="12" fill="#4c65b6"/>
  <text x="38" y="73" text-anchor="middle" font-size="13.5" font-weight="700" fill="#ffffff">1</text>
  <text x="58" y="73" font-size="14" font-weight="700" fill="#3a4f93">键集完全相等</text>
  <text x="26" y="98" font-size="13.5" fill="#17211f">名称非空、不重复</text>
  <text x="26" y="120" font-size="13.5" fill="#4d5652">扣共享跳过项后</text>
  <text x="26" y="142" font-size="13.5" fill="#3a4f93">两端名字集一致</text>

  <line x1="176" y1="103" x2="194" y2="103" stroke="#4d5652" stroke-width="1.5" marker-end="url(#tr-arr-ink)"/>

  <rect x="196" y="46" width="160" height="114" rx="6" fill="#e8edff" stroke="#4c65b6" stroke-width="1.4"/>
  <circle cx="218" cy="68" r="12" fill="#4c65b6"/>
  <text x="218" y="73" text-anchor="middle" font-size="13.5" font-weight="700" fill="#ffffff">2</text>
  <text x="238" y="73" font-size="14" font-weight="700" fill="#3a4f93">协议与五元组</text>
  <text x="206" y="98" font-size="13.5" fill="#17211f">protocol = 1</text>
  <text x="206" y="120" font-size="13.5" fill="#4d5652">严格 5 元组正整数</text>
  <text x="206" y="142" font-size="13.5" fill="#3a4f93">shape 乘积 = numel</text>

  <line x1="356" y1="103" x2="374" y2="103" stroke="#4d5652" stroke-width="1.5" marker-end="url(#tr-arr-ink)"/>

  <rect x="376" y="46" width="164" height="114" rx="6" fill="#fff4cf" stroke="#c78300" stroke-width="1.5"/>
  <circle cx="394" cy="68" r="11" fill="#c78300"/>
  <text x="394" y="72.5" text-anchor="middle" font-size="13" font-weight="700" fill="#ffffff">3</text>
  <text x="410" y="73" font-size="13" font-weight="700" fill="#936300">dtype 与 NPU 格式</text>
  <text x="386" y="98" font-size="13.5" fill="#17211f">numel / elem_size</text>
  <text x="386" y="120" font-size="13.5" fill="#4d5652">dtype 逐项严格相等</text>
  <text x="386" y="142" font-size="13.5" font-weight="700" fill="#936300">get_npu_format 一致</text>

  <line x1="540" y1="103" x2="558" y2="103" stroke="#4d5652" stroke-width="1.5" marker-end="url(#tr-arr-ink)"/>

  <rect x="560" y="46" width="158" height="114" rx="6" fill="#e8edff" stroke="#4c65b6" stroke-width="1.4"/>
  <circle cx="582" cy="68" r="12" fill="#4c65b6"/>
  <text x="582" y="73" text-anchor="middle" font-size="13.5" font-weight="700" fill="#ffffff">4</text>
  <text x="602" y="73" font-size="14" font-weight="700" fill="#3a4f93">总量与稠密复验</text>
  <text x="570" y="98" font-size="13.5" fill="#17211f">总条数 &amp; 总字节相等</text>
  <text x="570" y="120" font-size="13.5" fill="#4d5652">同 numel 才许 view</text>
  <text x="570" y="142" font-size="13.5" fill="#3a4f93">非重叠稠密存储校验</text>

  <line x1="718" y1="103" x2="736" y2="103" stroke="#087f73" stroke-width="1.7" marker-end="url(#tr-arr-teal)"/>

  <rect x="738" y="46" width="146" height="114" rx="6" fill="#087f73" stroke="#065f56" stroke-width="1.5"/>
  <circle cx="760" cy="68" r="12" fill="#ffffff"/>
  <text x="760" y="73" text-anchor="middle" font-size="13.5" font-weight="700" fill="#065f56">5</text>
  <text x="778" y="73" font-size="14" font-weight="700" fill="#ffffff">全过才放行</text>
  <text x="748" y="98" font-size="13.5" fill="#ddf4ef">生成读取地址列表</text>
  <text x="748" y="120" font-size="13.5" fill="#ddf4ef">启动分批同步直读</text>
  <text x="748" y="142" font-size="13.5" font-weight="700" fill="#ffffff">不边读边核</text>

  <rect x="16" y="176" width="868" height="38" rx="5" fill="#fff0e9" stroke="#b54237" stroke-width="1.3"/>
  <text x="30" y="200" font-size="13.5" font-weight="700" fill="#8f3229">任一门未通过 → 写入字节 = 0，记具体 error，经停服务 &amp;&amp; 注销显存双门清理后退回默认加载（非逐字节内容校验和）。</text>

  <line x1="16" y1="234" x2="884" y2="234" stroke="#b8bcb5" stroke-width="1.4" stroke-dasharray="6 4"/>

  <!-- 区域 2：2.5 GiB 拆段 + 双上限装批 -->
  <text x="16" y="262" font-size="16" font-weight="700" fill="#17211f">② 大张量拆段与双上限分批（写死常量：每批 ≤ 1 GiB 且 ≤ 512 段）</text>

  <!-- A. 2.5 GiB 大张量拆段 -->
  <text x="16" y="302" font-size="14" font-weight="700" fill="#7a3a6a">A. 大张量先拆段</text>
  <text x="16" y="324" font-size="13.5" fill="#4d5652">2.5 GiB 单个权重</text>
  <text x="16" y="346" font-size="13.5" fill="#66716d">源/目标地址同步前移</text>

  <rect x="188" y="284" width="260" height="58" rx="5" fill="#9a4b86" stroke="#7a3a6a" stroke-width="1.3"/>
  <text x="318" y="308" text-anchor="middle" font-size="14" font-weight="700" fill="#ffffff">段 1：1.0 GiB</text>
  <text x="318" y="330" text-anchor="middle" font-size="13.5" font-family="var(--font-mono)" fill="#f7e7f2">a → b（+0 B）</text>

  <rect x="454" y="284" width="260" height="58" rx="5" fill="#9a4b86" fill-opacity="0.82" stroke="#7a3a6a" stroke-width="1.3"/>
  <text x="584" y="308" text-anchor="middle" font-size="14" font-weight="700" fill="#ffffff">段 2：1.0 GiB</text>
  <text x="584" y="330" text-anchor="middle" font-size="13.5" font-family="var(--font-mono)" fill="#f7e7f2">a+1GiB → b+1GiB</text>

  <rect x="720" y="284" width="156" height="58" rx="5" fill="#f7e7f2" stroke="#9a4b86" stroke-width="1.4"/>
  <text x="798" y="308" text-anchor="middle" font-size="14" font-weight="700" fill="#7a3a6a">段 3：0.5 GiB</text>
  <text x="798" y="330" text-anchor="middle" font-size="13.5" font-family="var(--font-mono)" fill="#7a3a6a">a+2GiB → b+2GiB</text>

  <text x="188" y="362" font-size="13.5" fill="#4d5652">1 GiB = 1,073,741,824 B；每段起点按已切字节递进，绝不重复读同一地址。</text>

  <!-- B. 1 GiB 字节上限封批 -->
  <text x="16" y="408" font-size="14" font-weight="700" fill="#936300">B. 字节上限封批</text>
  <text x="16" y="430" font-size="13.5" fill="#4d5652">≤ 1 GiB / 批</text>
  <text x="16" y="452" font-size="13.5" fill="#66716d">顺序装填，超即封批</text>

  <rect x="188" y="388" width="280" height="56" rx="5" fill="#f5f3ec" stroke="#c78300" stroke-width="1.3" stroke-dasharray="4 3"/>
  <rect x="192" y="392" width="164" height="48" rx="4" fill="#c78300"/>
  <text x="274" y="421" text-anchor="middle" font-size="13.5" font-weight="700" fill="#ffffff">W1 · 0.6 GiB</text>
  <rect x="360" y="392" width="84" height="48" rx="4" fill="#fff4cf" stroke="#c78300" stroke-width="1.2"/>
  <text x="402" y="421" text-anchor="middle" font-size="13.5" font-weight="700" fill="#936300">W2 · 0.3</text>
  <text x="328" y="464" text-anchor="middle" font-size="13.5" font-weight="700" fill="#936300">第 1 批：0.9 GiB（再装 W3 超 1 GiB → 封批）</text>

  <rect x="524" y="388" width="280" height="56" rx="5" fill="#f5f3ec" stroke="#c78300" stroke-width="1.3" stroke-dasharray="4 3"/>
  <rect x="528" y="392" width="220" height="48" rx="4" fill="#c78300"/>
  <text x="638" y="421" text-anchor="middle" font-size="13.5" font-weight="700" fill="#ffffff">W3 · 0.8 GiB</text>
  <text x="664" y="464" text-anchor="middle" font-size="13.5" font-weight="700" fill="#936300">第 2 批：0.8 GiB（A 原样留在显存继续当 seed）</text>

  <!-- C. 512 段上限封批 -->
  <text x="16" y="514" font-size="14" font-weight="700" fill="#065f56">C. 段数上限封批</text>
  <text x="16" y="536" font-size="13.5" fill="#4d5652">≤ 512 段 / 批</text>
  <text x="16" y="558" font-size="13.5" fill="#66716d">小张量多时先触顶</text>

  <rect x="188" y="496" width="512" height="50" rx="5" fill="#ddf4ef" stroke="#087f73" stroke-width="1.4"/>
  <text x="444" y="526" text-anchor="middle" font-size="14" font-weight="700" fill="#065f56">第 1 批：512 个 1 MiB 小张量 = 512 MiB（满 512 段即封批）</text>

  <rect x="712" y="496" width="164" height="50" rx="5" fill="#087f73" stroke="#065f56" stroke-width="1.4"/>
  <text x="794" y="526" text-anchor="middle" font-size="14" font-weight="700" fill="#ffffff">第 2 批：88 段</text>

  <text x="188" y="568" font-size="13.5" fill="#4d5652">600 × 1 MiB 合计仅 600 MiB（远小于 1 GiB），因触及 MAX_TRANSFER_CHUNK_SEGMENTS = 512 仍分 2 批。</text>

  <!-- 底部收束条 -->
  <rect x="16" y="592" width="868" height="72" rx="6" fill="#ece9df" stroke="#b8bcb5" stroke-width="1.2"/>
  <text x="26" y="618" font-size="14" font-weight="700" fill="#17211f">两条实战红线：</text>
  <text x="130" y="618" font-size="12.5" fill="#17211f">① 主模型与草稿分属两套会话，永不混装同批（GLM 下限：主 ≥21 批 + 草 ≥1 批 = ≥22 批，非 ⌈21416/1024⌉ = 21）。</text>
  <text x="130" y="644" font-size="12.5" fill="#8f3229">② 第 k 批读失败时前 k−1 批已写入 B 显存：严禁标成就绪，须先过 service_stopped &amp;&amp; memory_reset 双门清理再回退。</text>
</svg>
