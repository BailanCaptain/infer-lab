<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 680" width="900" height="680" role="img" aria-label="B 的第 r 号卡从 A 的第 r 号卡借权重，按编号走四步。1 B 先把放权重的三段空位登记给传输引擎（A 当 seed 时已经登记过自己那份）；2 通过 HTTP 向 A 要清单，拿到的只是描述，没有权重本身；3 把 A 的清单和自己的逐项对照，整份一致才往下走；4 由 B 发起，按批把 A 显存里的字节读进自己的空位，一批累计不超过 1 GiB，所以 W3 另起一批。两个框下面的小方块是读完以后：B 的三段填满，和 A 一模一样；A 的三块原样还在，这是读、不是搬走，A 继续当 seed。任何一步失败，都先注销登记、撤掉半成品模型，再改走默认加载。三块权重的大小是示意数。">
  <title>B 的第 r 号卡从 A 的第 r 号卡借权重，按编号走四步。1 B 先把放权重的三段空位登记给传输引擎（A 当 seed 时已经登记过自己那份）；2 通过 HTTP 向 A 要清单，拿到的只是描述，没有权重本身；3 把 A 的清单和自己的逐项对照，整份一致才往下走；4 由 B 发起，按批把 A 显存里的字节读进自己的空位，一批累计不超过 1 GiB，所以 W3 另起一批。两个框下面的小方块是读完以后：B 的三段填满，和 A 一模一样；A 的三块原样还在，这是读、不是搬走，A 继续当 seed。任何一步失败，都先注销登记、撤掉半成品模型，再改走默认加载。三块权重的大小是示意数。</title>
