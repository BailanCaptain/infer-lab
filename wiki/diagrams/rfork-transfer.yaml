layout: figure
id: rfork-transfer
caption: B 的第 r 号卡从 A 的第 r 号卡借权重，按编号走四步。1 B 先把放权重的三段空位登记给传输引擎（A 当 seed 时已经登记过自己那份）；2 通过 HTTP 向 A 要清单，拿到的只是描述，没有权重本身；3 把 A 的清单和自己的逐项对照，整份一致才往下走；4 由 B 发起，按批把 A 显存里的字节读进自己的空位，一批累计不超过 1 GiB，所以 W3 另起一批。两个框下面的小方块是读完以后：B 的三段填满，和 A 一模一样；A 的三块原样还在，这是读、不是搬走，A 继续当 seed。任何一步失败，都先尝试撤销登记和清理半成品；服务停止且登记内存清理通过才改走默认加载，否则保活旧存储并报错，拒绝分配第二份模型。仅租约尚未归还不阻止回退，可继续后台归还。三块权重的大小是示意数。
size: [900, 680]

frames:
  - { label: 实例 A · 第 r 号卡（seed · 已登记）, at: [30, 270], size: [210, 230] }
  - { label: 实例 B · 第 r 号卡（新启动）, at: [660, 270], size: [210, 230] }

items:
  # 第 2 步：HTTP 两端
  - { at: [40, 36], size: [190, 48], text: A 的 seed 服务, sub: HTTP · 只发描述, tone: control, style: plain }
  - { at: [670, 36], size: [190, 48], text: B 的 seed 客户端, sub: HTTP · 要清单, tone: control, style: plain }
  # A 显存里的三块权重（高度按示意大小）
  - { at: [75, 300], size: [120, 60], text: W1, sub: 0.6 GiB, tone: weight }
  - { at: [75, 366], size: [120, 30], text: W2 · 0.3 GiB, tone: weight }
  - { at: [75, 402], size: [120, 80], text: W3, sub: 0.8 GiB, tone: weight }
  # B 搭好的空位，形状、大小和 A 一样
  - { at: [705, 300], size: [120, 60], text: W1 空位, sub: 已登记 · 0.6 GiB, tone: weight, style: faded }
  - { at: [705, 366], size: [120, 30], text: W2 空位 · 已登记, tone: weight, style: faded }
  - { at: [705, 402], size: [120, 80], text: W3 空位, sub: 已登记 · 0.8 GiB, tone: weight, style: faded }
  # 读完以后：A 的三块原样还在，B 的三段填满
  - { at: [63, 524], size: [44, 30], text: W1, tone: weight }
  - { at: [113, 524], size: [44, 30], text: W2, tone: weight }
  - { at: [163, 524], size: [44, 30], text: W3, tone: weight }
  - { at: [693, 524], size: [44, 30], text: W1, tone: weight }
  - { at: [743, 524], size: [44, 30], text: W2, tone: weight }
  - { at: [793, 524], size: [44, 30], text: W3, tone: weight }
  # 失败撤销
  - { at: [110, 626], size: [200, 40], text: 任何一步失败, tone: danger }
  - { at: [360, 626], size: [210, 40], text: 尝试注销登记并清理, tone: danger, style: faded }
  - { at: [620, 626], size: [230, 40], text: 停服务且注销完成才回退, sub: 停服务或注销失败则报错, tone: control, style: plain }

grids:
