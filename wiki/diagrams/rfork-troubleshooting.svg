<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 710" width="900" height="710" role="img" aria-label="RFork 全阶段排错证据漏斗与 Planner TTL 404/400 判据图：从配置校验、预登记、借租约、取清单、核清单、分批读（含第 7/12 批斜线未知写入）、还租约、发布到清理安全门，并对照 48.2 秒与 75.6 秒 404 诊断分叉" font-family="var(--font-sans)">
  <title>RFork 全阶段排错证据漏斗与 Planner TTL 404/400 判据：按真实执行顺序展开八阶段失败出口、对应汇总日志与最小首取证据，重点标出 batch 7/12 失败时的未知写入区间，并在下栏用 48.2s &lt; 60s 与 75.6s ≥ 60s 比例标尺拆分 404 过期判定与 400 误区。</title>
  <desc>关联源码符号：RForkConfigurationError, register_destination, acquire_seed, fetch_seed_transfer_info, validate_weight_manifest, batch_transfer_sync_read, release_seed_once, prepare_for_fallback, can_schedule_seed</desc>
  <defs>
    <marker id="ts-arr-ink" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="#4d5652"/>
    </marker>
    <marker id="ts-arr-red" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="#b54237"/>
    </marker>
    <pattern id="ts-hatch-red" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <rect x="0" y="0" width="8" height="8" fill="#fff0e9"/>
      <line x1="0" y1="0" x2="0" y2="8" stroke="#b54237" stroke-width="2.4"/>
    </pattern>
  </defs>

  <!-- 区域 1：全阶段排错漏斗与最小首取证据 -->
  <text x="16" y="26" font-size="16" font-weight="700" fill="#17211f">① 全阶段证据漏斗：从最后一行汇总倒查该 rank 的第一条具体异常</text>

  <!-- 阶段 0：配置校验 -->
  <rect x="16" y="42" width="868" height="36" rx="5" fill="#b54237" stroke="#8f3229" stroke-width="1.2"/>
  <text x="30" y="65" font-size="14" font-weight="700" fill="#ffffff">0. 配置解析：缺三项必填或严格项非法 → 抛 RForkConfigurationError 直接中止（不打汇总、不回退）；未知键打 warning</text>

  <!-- 阶段 1–5 横排主链路（左→右） -->
  <rect x="16" y="92" width="154" height="54" rx="5" fill="#e8edff" stroke="#4c65b6" stroke-width="1.3"/>
  <text x="93" y="114" text-anchor="middle" font-size="14" font-weight="700" fill="#3a4f93">1. register</text>
  <text x="93" y="134" text-anchor="middle" font-size="13.5" fill="#4d5652">登记显存 · 绑键</text>

  <line x1="170" y1="119" x2="188" y2="119" stroke="#4d5652" stroke-width="1.5" marker-end="url(#ts-arr-ink)"/>

  <rect x="190" y="92" width="152" height="54" rx="5" fill="#ddf4ef" stroke="#087f73" stroke-width="1.3"/>
  <text x="266" y="114" text-anchor="middle" font-size="14" font-weight="700" fill="#065f56">2. borrow</text>
  <text x="266" y="134" text-anchor="middle" font-size="13.5" fill="#4d5652">向 Planner 借</text>

  <line x1="342" y1="119" x2="360" y2="119" stroke="#4d5652" stroke-width="1.5" marker-end="url(#ts-arr-ink)"/>

  <!-- 3–5 虚线包裹 transfer_from_seed -->
  <rect x="362" y="84" width="522" height="70" rx="7" fill="#f5f3ec" stroke="#b8bcb5" stroke-width="1.2" stroke-dasharray="5 3"/>
  <text x="374" y="100" font-size="13.5" font-weight="700" fill="#66716d">借到来源后三步（transfer_from_seed）</text>

  <rect x="372" y="106" width="152" height="40" rx="5" fill="#ece9df" stroke="#66716d" stroke-width="1.2"/>
  <text x="448" y="131" text-anchor="middle" font-size="14" font-weight="700" fill="#17211f">3. metadata</text>

  <line x1="524" y1="126" x2="544" y2="126" stroke="#4d5652" stroke-width="1.5" marker-end="url(#ts-arr-ink)"/>

  <rect x="546" y="106" width="152" height="40" rx="5" fill="#fff4cf" stroke="#c78300" stroke-width="1.3"/>
  <text x="622" y="131" text-anchor="middle" font-size="14" font-weight="700" fill="#936300">4. manifest</text>

  <line x1="698" y1="126" x2="718" y2="126" stroke="#4d5652" stroke-width="1.5" marker-end="url(#ts-arr-ink)"/>

  <rect x="720" y="106" width="154" height="40" rx="5" fill="#f7e7f2" stroke="#9a4b86" stroke-width="1.4"/>
  <text x="797" y="131" text-anchor="middle" font-size="14" font-weight="700" fill="#7a3a6a">5. batch read</text>

  <!-- 失败向下落到最小首取证据与汇总口 -->
  <line x1="93" y1="146" x2="93" y2="174" stroke="#b54237" stroke-width="1.6" marker-end="url(#ts-arr-red)"/>
  <line x1="266" y1="146" x2="266" y2="174" stroke="#b54237" stroke-width="1.6" marker-end="url(#ts-arr-red)"/>
  <line x1="448" y1="146" x2="448" y2="174" stroke="#b54237" stroke-width="1.6" marker-end="url(#ts-arr-red)"/>
  <line x1="622" y1="146" x2="622" y2="174" stroke="#b54237" stroke-width="1.6" marker-end="url(#ts-arr-red)"/>
  <line x1="797" y1="146" x2="797" y2="174" stroke="#b54237" stroke-width="1.6" marker-end="url(#ts-arr-red)"/>

  <!-- 最小首取证据卡片（5 列对齐） -->
  <rect x="16" y="176" width="154" height="92" rx="5" fill="#fff0e9" stroke="#b54237" stroke-width="1.3"/>
  <text x="93" y="197" text-anchor="middle" font-size="13.5" font-weight="700" fill="#8f3229">登记侧失败</text>
  <text x="24" y="218" font-size="13.5" fill="#4d5652">首取：缺 Ex 接口</text>
  <text x="24" y="238" font-size="13.5" fill="#4d5652">/ 范围未覆盖 / 非NPU</text>
  <text x="24" y="258" font-size="13.5" font-weight="700" fill="#8f3229">→ reg failed.</text>

  <rect x="190" y="176" width="152" height="92" rx="5" fill="#ece9df" stroke="#66716d" stroke-width="1.3"/>
  <text x="266" y="197" text-anchor="middle" font-size="13.5" font-weight="700" fill="#17211f">没借到（不打汇总）</text>
  <text x="198" y="218" font-size="13.5" fill="#4d5652">404 仅 DEBUG；</text>
  <text x="198" y="238" font-size="13.5" fill="#4d5652">先找 acq failed 警</text>
  <text x="198" y="258" font-size="13.5" font-weight="700" fill="#3a4f93">仅 TP0 打 INFO</text>

  <rect x="362" y="176" width="166" height="92" rx="5" fill="#fff0e9" stroke="#b54237" stroke-width="1.3"/>
  <text x="445" y="197" text-anchor="middle" font-size="13.5" font-weight="700" fill="#8f3229">要清单失败</text>
  <text x="370" y="218" font-size="13.5" fill="#4d5652">首取：非200 / 错key</text>
  <text x="370" y="238" font-size="13.5" fill="#4d5652">404 / 协议 ≠ 1</text>
  <text x="370" y="258" font-size="13.5" font-weight="700" fill="#8f3229">查 HTTP 端口连通</text>

  <rect x="540" y="176" width="164" height="92" rx="5" fill="#fff0e9" stroke="#b54237" stroke-width="1.3"/>
  <text x="622" y="197" text-anchor="middle" font-size="13.5" font-weight="700" fill="#8f3229">五门核对不过</text>
  <text x="548" y="218" font-size="13.5" fill="#4d5652">首取：名字差集 /</text>
  <text x="548" y="238" font-size="13.5" fill="#4d5652">dtype / NPU format</text>
  <text x="548" y="258" font-size="13.5" font-weight="700" fill="#065f56">写入字节 = 0</text>

  <rect x="716" y="176" width="168" height="92" rx="5" fill="#fff0e9" stroke="#b54237" stroke-width="1.4"/>
  <text x="800" y="197" text-anchor="middle" font-size="13.5" font-weight="700" fill="#8f3229">第 k 批读失败</text>
  <text x="724" y="218" font-size="13.5" fill="#4d5652">首取：chunk k/N、</text>
  <text x="724" y="238" font-size="13.5" fill="#4d5652">首末权重名、ret 码</text>
  <text x="724" y="258" font-size="13.5" font-weight="700" fill="#7a3a6a">查两端数据面端点</text>

  <!-- 汇总汇聚条：3–5 同打 transfer failed. -->
  <path d="M 445 268 L 445 284 L 800 284 L 800 268" fill="none" stroke="#b54237" stroke-width="1.5"/>
  <line x1="622" y1="268" x2="622" y2="294" stroke="#b54237" stroke-width="1.7" marker-end="url(#ts-arr-red)"/>

  <rect x="362" y="296" width="522" height="36" rx="5" fill="#b54237"/>
  <text x="623" y="319" text-anchor="middle" font-size="14" font-weight="700" fill="#ffffff">三步均汇成一字不差的 transfer failed. → 必往前找该 rank 第一条具体 error</text>

  <!-- 左下清理安全门 + 右下 7/12 批失败剖面 -->
  <rect x="16" y="296" width="326" height="96" rx="6" fill="#fff4cf" stroke="#c78300" stroke-width="1.4"/>
  <text x="26" y="320" font-size="14" font-weight="700" fill="#936300">6–8. 归还 · 发布 · 回退安全门</text>
  <text x="26" y="343" font-size="12.5" fill="#17211f">• 读完还租约被拒：模型照常推理，只不当 seed</text>
  <text x="26" y="365" font-size="12.5" fill="#17211f">• 失败回退须过 service_stopped &amp;&amp; memory_reset</text>
  <text x="26" y="384" font-size="12.5" fill="#8f3229">• 回滚未完时，原始登记报错在更前一行</text>

  <!-- 批 7/12 写入剖面示意图 -->
  <rect x="362" y="340" width="522" height="52" rx="5" fill="#f5f3ec" stroke="#b8bcb5" stroke-width="1.2"/>
  <text x="374" y="357" font-size="12.5" font-weight="700" fill="#17211f">示意：第 7/12 批读失败时 B 显存状态</text>
  <!-- 12 格条：1-6 已写入(amber)、7 斜线未知写入(hatch)、8-12 未读(muted) -->
  <rect x="374" y="365" width="234" height="22" rx="3" fill="#c78300"/>
  <rect x="610" y="365" width="44" height="22" rx="3" fill="url(#ts-hatch-red)" stroke="#b54237" stroke-width="1.2"/>
  <rect x="656" y="365" width="214" height="22" rx="3" fill="#ece9df" stroke="#b8bcb5" stroke-width="1"/>
  <text x="491" y="380" text-anchor="middle" font-size="12" font-weight="700" fill="#ffffff">批 1–6：已写入 B</text>
  <text x="632" y="357" text-anchor="middle" font-size="12.5" font-weight="700" fill="#8f3229">批7未知</text>
  <text x="763" y="380" text-anchor="middle" font-size="12" fill="#66716d">批 8–12：未执行</text>

  <!-- 分隔线 -->
  <line x1="16" y1="408" x2="884" y2="408" stroke="#b8bcb5" stroke-width="1.4" stroke-dasharray="6 4"/>

  <!-- 区域 2：48.2 < 60 vs 75.6 >= 60 Planner TTL 404 诊断分叉 -->
  <text x="16" y="431" font-size="16" font-weight="700" fill="#17211f">② 还租约收到 404 / 400 怎么判：用客户端 held_elapsed 对照 Planner 租约 TTL（60s）</text>

  <!-- 标尺轴 (x=180 为 0s，每 10s = 80px -> 60s = 660, 80s = 820) -->
  <line x1="180" y1="468" x2="866" y2="468" stroke="#b8bcb5" stroke-width="1.3"/>
  <line x1="180" y1="463" x2="180" y2="606" stroke="#d8d8cf" stroke-width="1"/>
  <line x1="420" y1="463" x2="420" y2="606" stroke="#d8d8cf" stroke-width="1" stroke-dasharray="3 3"/>
  <line x1="660" y1="463" x2="660" y2="612" stroke="#b54237" stroke-width="2" stroke-dasharray="5 3"/>
  <line x1="820" y1="463" x2="820" y2="606" stroke="#d8d8cf" stroke-width="1" stroke-dasharray="3 3"/>

  <text x="180" y="460" text-anchor="middle" font-size="13.5" fill="#66716d">0s</text>
  <text x="420" y="460" text-anchor="middle" font-size="13.5" fill="#66716d">30s</text>
  <text x="660" y="460" text-anchor="middle" font-size="14" font-weight="700" fill="#8f3229">60s（示例 Planner 默认 TTL）</text>
  <text x="820" y="460" text-anchor="middle" font-size="13.5" fill="#66716d">80s</text>

  <!-- 情形 1：48.2s < 60s (48.2 * 8 = 385.6px -> x=180..565.6) -->
  <text x="16" y="502" font-size="14" font-weight="700" fill="#065f56">情形一 · 确定未到期</text>
  <text x="16" y="523" font-size="13.5" font-family="var(--font-mono)" fill="#065f56">48.2s &lt; 60s</text>

  <rect x="180" y="482" width="386" height="48" rx="5" fill="#ddf4ef" stroke="#087f73" stroke-width="1.5"/>
  <text x="373" y="502" text-anchor="middle" font-size="13.5" font-weight="700" fill="#065f56">held_elapsed = 48.2s（Planner 租约年龄更短）</text>
  <text x="373" y="522" text-anchor="middle" font-size="12.5" fill="#4d5652">确定排除过期 → 查前次超时重发 / 身份不符 / 重启或副本分裂</text>

  <!-- 情形 2：75.6s >= 60s (75.6 * 8 = 604.8px -> x=180..784.8) -->
  <text x="16" y="568" font-size="14" font-weight="700" fill="#936300">情形二 · 过期成候选</text>
  <text x="16" y="589" font-size="13.5" font-family="var(--font-mono)" fill="#936300">75.6s ≥ 60s</text>

  <rect x="180" y="546" width="605" height="48" rx="5" fill="#fff4cf" stroke="#c78300" stroke-width="1.5"/>
  <text x="482" y="566" text-anchor="middle" font-size="13.5" font-weight="700" fill="#936300">held_elapsed = 75.6s（已越过 60s 线）</text>
  <text x="482" y="586" text-anchor="middle" font-size="13" fill="#4d5652">到期收回只是候选之一 → 须拿 lease= 摘要与 Planner 服务端记录交叉核实</text>

  <!-- 底部 400 vs 404 醒目排误框 -->
  <rect x="16" y="624" width="868" height="72" rx="6" fill="#ece9df" stroke="#b8bcb5" stroke-width="1.2"/>
  <text x="30" y="650" font-size="14" font-weight="700" fill="#8f3229">区分 400 与 404：</text>
  <text x="166" y="650" font-size="13.5" fill="#17211f">示例 Planner 中 400 仅来自请求头解析错误（缺头/非整数/越界），与到期无关；到期或重复还均回 404。</text>
  <text x="30" y="676" font-size="13.5" fill="#4d5652">客户端将 404 记为 RELEASED（不证按时还上），400 记为 REJECTED 取消 seed 发布；现场 Planner 务必核查响应体。</text>
</svg>
