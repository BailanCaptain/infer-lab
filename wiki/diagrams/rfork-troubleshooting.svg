  <path d="M868 82 L886 82 L886 256 L852 256 L852 282" fill="none" stroke="var(--color-danger, #b54237)" stroke-width="1.4" stroke-dasharray="7 5" marker-end="url(#rfork-troubleshooting-ah-danger)"/>
  <path d="M151 340 L151 368 L360 368 L360 396" fill="none" stroke="var(--color-ink, #17211f)" stroke-width="1.4" marker-end="url(#rfork-troubleshooting-ah-ink)"/>
