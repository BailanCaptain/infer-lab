<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 430" width="900" height="430" role="img" aria-label="新实例 B 的一个 Worker 借到来源以后，要依次登记显存、向 A 要清单、核对清单、分批读权重。失败有两种走法。一种是某一步的检查没通过：源码先在出错的地方记一条具体异常（第二排），再汇成一句汇总警告，汇总的原因一栏四种情况一字不差，都只有 transfer failed.，所以要往前找这个 rank 的那条具体异常。另一种是某一步直接抛了异常（比如来源地址不合法、传输引擎的读取调用抛错）：前面没有单独的具体日志，汇总的原因一栏就是那条异常原文。两种最后都尝试清理；服务停止且登记内存清理通过才改走默认加载，否则保活旧存储并报错，拒绝分配第二份模型。仅租约尚未归还不阻止回退，可继续后台归还。建传输后端、建会话、造模型或读完后跑后处理时出错，走的也是第二种。没借到来源不打汇总；读完后还租约失败不回退，模型照常推理，只是不当来源。">
  <title>新实例 B 的一个 Worker 借到来源以后，要依次登记显存、向 A 要清单、核对清单、分批读权重。失败有两种走法。一种是某一步的检查没通过：源码先在出错的地方记一条具体异常（第二排），再汇成一句汇总警告，汇总的原因一栏四种情况一字不差，都只有 transfer failed.，所以要往前找这个 rank 的那条具体异常。另一种是某一步直接抛了异常（比如来源地址不合法、传输引擎的读取调用抛错）：前面没有单独的具体日志，汇总的原因一栏就是那条异常原文。两种最后都尝试清理；服务停止且登记内存清理通过才改走默认加载，否则保活旧存储并报错，拒绝分配第二份模型。仅租约尚未归还不阻止回退，可继续后台归还。建传输后端、建会话、造模型或读完后跑后处理时出错，走的也是第二种。没借到来源不打汇总；读完后还租约失败不回退，模型照常推理，只是不当来源。</title>
  <defs><marker id="rfork-troubleshooting-ah-danger" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="var(--color-danger, #b54237)"/></marker><marker id="rfork-troubleshooting-ah-ink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="var(--color-ink, #17211f)"/></marker></defs>
  <rect x="30" y="46" width="840" height="70" rx="16" fill="none" stroke="var(--color-line-strong, #b8bcb5)" stroke-width="1.5"/>
  <text x="46" y="34" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="15" font-weight="700" fill="var(--color-ink, #17211f)">B 借到来源以后的四步</text>
  <path d="M135 108 L135 148" fill="none" stroke="var(--color-danger, #b54237)" stroke-width="1.4" marker-end="url(#rfork-troubleshooting-ah-danger)"/>
  <path d="M345 108 L345 148" fill="none" stroke="var(--color-danger, #b54237)" stroke-width="1.4" marker-end="url(#rfork-troubleshooting-ah-danger)"/>
  <path d="M555 108 L555 148" fill="none" stroke="var(--color-danger, #b54237)" stroke-width="1.4" marker-end="url(#rfork-troubleshooting-ah-danger)"/>
  <path d="M765 108 L765 148" fill="none" stroke="var(--color-danger, #b54237)" stroke-width="1.4" marker-end="url(#rfork-troubleshooting-ah-danger)"/>
  <path d="M872 82 L886 82 L886 232 L690 232 L690 254" fill="none" stroke="var(--color-danger, #b54237)" stroke-width="1.4" stroke-dasharray="7 5" marker-end="url(#rfork-troubleshooting-ah-danger)"/>
  <path d="M260 314 L400 358" fill="none" stroke="var(--color-ink, #17211f)" stroke-width="1.4" marker-end="url(#rfork-troubleshooting-ah-ink)"/>
  <path d="M690 314 L500 358" fill="none" stroke="var(--color-ink, #17211f)" stroke-width="1.4" marker-end="url(#rfork-troubleshooting-ah-ink)"/>
  <path d="M135 204 L260 254" fill="none" stroke="var(--color-danger, #b54237)" stroke-width="1.4" marker-end="url(#rfork-troubleshooting-ah-danger)"/>
  <path d="M345 204 L260 254" fill="none" stroke="var(--color-danger, #b54237)" stroke-width="1.4" marker-end="url(#rfork-troubleshooting-ah-danger)"/>
  <path d="M555 204 L260 254" fill="none" stroke="var(--color-danger, #b54237)" stroke-width="1.4" marker-end="url(#rfork-troubleshooting-ah-danger)"/>
  <path d="M765 204 L260 254" fill="none" stroke="var(--color-danger, #b54237)" stroke-width="1.4" marker-end="url(#rfork-troubleshooting-ah-danger)"/>
  <rect x="40" y="58" width="190" height="48" rx="8" fill="var(--color-surface-sunken, #ece9df)" stroke="var(--color-ink, #17211f)" stroke-width="1.5"/>
  <text x="135" y="78" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="14" font-weight="700" fill="var(--color-ink, #17211f)" text-anchor="middle">登记显存</text>
  <text x="135" y="97" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="13" font-weight="400" fill="var(--color-ink, #17211f)" text-anchor="middle">把 B 的空位告诉传输引擎</text>
  <rect x="250" y="58" width="190" height="48" rx="8" fill="var(--color-surface-sunken, #ece9df)" stroke="var(--color-ink, #17211f)" stroke-width="1.5"/>
  <text x="345" y="78" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="14" font-weight="700" fill="var(--color-ink, #17211f)" text-anchor="middle">向 A 要清单</text>
  <text x="345" y="97" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="13" font-weight="400" fill="var(--color-ink, #17211f)" text-anchor="middle">HTTP 控制通道</text>
  <rect x="460" y="58" width="190" height="48" rx="8" fill="var(--color-surface-sunken, #ece9df)" stroke="var(--color-ink, #17211f)" stroke-width="1.5"/>
  <text x="555" y="78" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="14" font-weight="700" fill="var(--color-ink, #17211f)" text-anchor="middle">核对清单</text>
  <text x="555" y="97" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="13" font-weight="400" fill="var(--color-ink, #17211f)" text-anchor="middle">名字、形状、类型、大小</text>
  <rect x="670" y="58" width="190" height="48" rx="8" fill="var(--color-surface-sunken, #ece9df)" stroke="var(--color-ink, #17211f)" stroke-width="1.5"/>
  <text x="765" y="78" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="14" font-weight="700" fill="var(--color-ink, #17211f)" text-anchor="middle">分批读权重</text>
  <text x="765" y="97" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="13" font-weight="400" fill="var(--color-ink, #17211f)" text-anchor="middle">每批不超过 1 GiB</text>
  <rect x="40" y="150" width="190" height="52" rx="8" fill="var(--color-accent-soft, #fff0e9)" stroke="var(--color-danger, #b54237)" stroke-opacity="0.4" stroke-width="1.5" stroke-dasharray="5 4"/>
  <text x="135" y="172" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="13" font-weight="400" fill="#8f3229" text-anchor="middle">登记报错</text>
  <text x="135" y="191" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="13" font-weight="400" fill="#8f3229" text-anchor="middle">接口缺失 / 范围没覆盖</text>
  <rect x="250" y="150" width="190" height="52" rx="8" fill="var(--color-accent-soft, #fff0e9)" stroke="var(--color-danger, #b54237)" stroke-opacity="0.4" stroke-width="1.5" stroke-dasharray="5 4"/>
  <text x="345" y="172" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="13" font-weight="400" fill="#8f3229" text-anchor="middle">要清单失败</text>
  <text x="345" y="191" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="13" font-weight="400" fill="#8f3229" text-anchor="middle">状态码不是 200 / 连不上</text>
  <rect x="460" y="150" width="190" height="52" rx="8" fill="var(--color-accent-soft, #fff0e9)" stroke="var(--color-danger, #b54237)" stroke-opacity="0.4" stroke-width="1.5" stroke-dasharray="5 4"/>
  <text x="555" y="172" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="13" font-weight="400" fill="#8f3229" text-anchor="middle">清单对不上</text>
  <text x="555" y="191" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="13" font-weight="400" fill="#8f3229" text-anchor="middle">名字差集 / 类型 / 大小</text>
  <rect x="670" y="150" width="190" height="52" rx="8" fill="var(--color-accent-soft, #fff0e9)" stroke="var(--color-danger, #b54237)" stroke-opacity="0.4" stroke-width="1.5" stroke-dasharray="5 4"/>
  <text x="765" y="172" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="13" font-weight="400" fill="#8f3229" text-anchor="middle">第 k 批读失败</text>
  <text x="765" y="191" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="13" font-weight="400" fill="#8f3229" text-anchor="middle">批次、首末权重名、返回码</text>
  <rect x="40" y="256" width="440" height="56" rx="8" fill="var(--color-danger, #b54237)" stroke="var(--color-ink, #17211f)" stroke-width="1.5"/>
  <text x="260" y="280" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="14" font-weight="700" fill="var(--color-ink-inverse, #ffffff)" text-anchor="middle">汇总：原因只写 transfer failed.</text>
  <text x="260" y="299" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="13" font-weight="400" fill="var(--color-ink-inverse, #ffffff)" text-anchor="middle">四种检查失败一字不差，要往前找一行</text>
  <rect x="520" y="256" width="340" height="56" rx="8" fill="var(--color-danger, #b54237)" stroke="var(--color-ink, #17211f)" stroke-width="1.5"/>
  <text x="690" y="280" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="14" font-weight="700" fill="var(--color-ink-inverse, #ffffff)" text-anchor="middle">汇总：原因就是异常原文</text>
  <text x="690" y="299" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="13" font-weight="400" fill="var(--color-ink-inverse, #ffffff)" text-anchor="middle">前面没有单独的具体日志</text>
  <rect x="300" y="360" width="300" height="46" rx="8" fill="var(--color-surface-sunken, #ece9df)" stroke="var(--color-ink, #17211f)" stroke-width="1.5"/>
  <text x="450" y="379" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="14" font-weight="700" fill="var(--color-ink, #17211f)" text-anchor="middle">停服务且注销完成才回退</text>
  <text x="450" y="398" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="13" font-weight="400" fill="var(--color-ink, #17211f)" text-anchor="middle">停服务或注销失败：保活并报错</text>
  <text x="145" y="134" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="13.5" font-weight="400" fill="var(--color-ink-muted, #66716d)" font-style="italic">检查没通过：先记一条具体异常</text>
  <text x="700" y="222" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="13.5" font-weight="400" fill="#8f3229" font-style="italic">任何一步直接抛异常</text>
</svg>
