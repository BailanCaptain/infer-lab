<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 470" width="900" height="470" role="img" aria-label="按社区上游 main（8d6180e2）顺序，新实例 B 的 Worker 先在借租约之前登记本地显存并绑定结构摘要（register_destination），失败时先记登记侧具体错误，汇总原因写 destination registration failed.；随后向 Planner 申请租约（没借到直接本地加载，不打汇总）；借到来源后再依次走取清单、核清单、分批读权重三步（transfer_from_seed），这三步检查不通过先记具体异常，再汇成一字不差的 transfer failed.，排查时要往前找该 rank 的具体报错。任一步直接抛可恢复异常时，前面没有单独日志，汇总原因就是异常原文（若因缺必填配置抛 RForkConfigurationError，则直接中止启动、不走回退）。可恢复失败都先尝试清理：服务停止且登记内存注销完成才改走默认加载，否则保活旧存储并报错终止。">
  <title>按社区上游 main（8d6180e2）顺序，新实例 B 的 Worker 先在借租约之前登记本地显存并绑定结构摘要（register_destination），失败时先记登记侧具体错误，汇总原因写 destination registration failed.；随后向 Planner 申请租约（没借到直接本地加载，不打汇总）；借到来源后再依次走取清单、核清单、分批读权重三步（transfer_from_seed），这三步检查不通过先记具体异常，再汇成一字不差的 transfer failed.，排查时要往前找该 rank 的具体报错。任一步直接抛可恢复异常时，前面没有单独日志，汇总原因就是异常原文（若因缺必填配置抛 RForkConfigurationError，则直接中止启动、不走回退）。可恢复失败都先尝试清理：服务停止且登记内存注销完成才改走默认加载，否则保活旧存储并报错终止。</title>
  <defs><marker id="rfork-troubleshooting-ah-danger" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="var(--color-danger, #b54237)"/></marker><marker id="rfork-troubleshooting-ah-ink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="var(--color-ink, #17211f)"/></marker></defs>
  <rect x="20" y="44" width="228" height="76" rx="16" fill="none" stroke="var(--color-line-strong, #b8bcb5)" stroke-width="1.5"/>
  <text x="36" y="32" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="15" font-weight="700" fill="var(--color-ink, #17211f)">借租约前 · 登记显存</text>
  <rect x="264" y="44" width="604" height="76" rx="16" fill="none" stroke="var(--color-line-strong, #b8bcb5)" stroke-width="1.5"/>
  <text x="280" y="32" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="15" font-weight="700" fill="var(--color-ink, #17211f)">借到来源后的三步（transfer_from_seed）</text>
