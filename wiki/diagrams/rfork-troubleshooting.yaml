layout: figure
id: rfork-troubleshooting
caption: 新实例 B 的一个 Worker 借到来源以后，要依次登记显存、向 A 要清单、核对清单、分批读权重。失败有两种走法。一种是某一步的检查没通过：源码先在出错的地方记一条具体异常（第二排），再汇成一句汇总警告，汇总的原因一栏四种情况一字不差，都只有 transfer failed.，所以要往前找这个 rank 的那条具体异常。另一种是某一步直接抛了异常（比如来源地址不合法、传输引擎的读取调用抛错）：前面没有单独的具体日志，汇总的原因一栏就是那条异常原文。两种最后都清理、改走默认加载。建传输后端、建会话、造模型或读完后跑后处理时出错，走的也是第二种。没借到来源不打汇总；还租约失败不回退，模型照常推理，只是不当来源。
size: [900, 430]
frames:
  - { label: B 借到来源以后的四步, at: [30, 46], size: [840, 70] }
items:
  - { at: [40, 58], size: [190, 48], text: 登记显存, sub: 把 B 的空位告诉传输引擎, tone: weight, style: plain }
  - { at: [250, 58], size: [190, 48], text: 向 A 要清单, sub: HTTP 控制通道, tone: control, style: plain }
  - { at: [460, 58], size: [190, 48], text: 核对清单, sub: 名字、形状、类型、大小, tone: control, style: plain }
  - { at: [670, 58], size: [190, 48], text: 分批读权重, sub: 每批不超过 1 GiB, tone: comm, style: plain }
  - { at: [40, 150], size: [190, 52], text: 登记报错, sub: 接口缺失 / 范围没覆盖, tone: danger, style: faded }
  - { at: [250, 150], size: [190, 52], text: 要清单失败, sub: 状态码不是 200 / 连不上, tone: danger, style: faded }
  - { at: [460, 150], size: [190, 52], text: 清单对不上, sub: 名字差集 / 类型 / 大小, tone: danger, style: faded }
  - { at: [670, 150], size: [190, 52], text: 第 k 批读失败, sub: 批次、首末权重名、返回码, tone: danger, style: faded }
  - { at: [40, 256], size: [440, 56], text: 汇总：原因只写 transfer failed., sub: 四种检查失败一字不差，要往前找一行, tone: danger, style: solid }
  - { at: [520, 256], size: [340, 56], text: 汇总：原因就是异常原文, sub: 前面没有单独的具体日志, tone: danger, style: solid }
  - { at: [300, 360], size: [300, 46], text: 清理后改走默认加载, sub: 从存储读 checkpoint, tone: ink, style: plain }
