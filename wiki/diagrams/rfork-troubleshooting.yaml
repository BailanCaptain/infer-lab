layout: figure
id: rfork-troubleshooting
caption: 按社区上游 main（8d6180e2）顺序，新实例 B 的 Worker 先在借租约之前登记本地显存并绑定结构摘要（register_destination），失败时先记登记侧具体错误，汇总原因写 destination registration failed.；随后向 Planner 申请租约（没借到直接本地加载，不打汇总）；借到来源后再依次走取清单、核清单、分批读权重三步（transfer_from_seed），这三步检查不通过先记具体异常，再汇成一字不差的 transfer failed.，排查时要往前找该 rank 的具体报错。任一步直接抛可恢复异常时，前面没有单独日志，汇总原因就是异常原文（若因缺必填配置抛 RForkConfigurationError，则直接中止启动、不走回退）。可恢复失败都先尝试清理：服务停止且登记内存注销完成才改走默认加载，否则保活旧存储并报错终止。
size: [900, 470]
frames:
  - { label: 借租约前 · 登记显存, at: [20, 44], size: [228, 76] }
  - { label: 借到来源后的三步（transfer_from_seed）, at: [264, 44], size: [604, 76] }
items:
  # 第一排：登记在借租约前；取清单/核清单/分批读在借到后
  - { at: [30, 58], size: [208, 50], text: 登记显存, sub: 绑结构摘要 · 算 seed_key, tone: weight, style: plain }
  - { at: [274, 58], size: [184, 50], text: 向 A 要清单, sub: HTTP 控制通道, tone: control, style: plain }
  - { at: [474, 58], size: [184, 50], text: 核对清单, sub: 五元组 + NPU 格式, tone: control, style: plain }
  - { at: [674, 58], size: [184, 50], text: 分批读权重, sub: 每批不超过 1 GiB, tone: comm, style: plain }
  # 第二排：检查失败先记具体日志
  - { at: [30, 158], size: [208, 52], text: 登记报错, sub: 接口缺失 / 范围没覆盖, tone: danger, style: faded }
  - { at: [274, 158], size: [184, 52], text: 要清单失败, sub: 非 200 / 协议 / 连不上, tone: danger, style: faded }
  - { at: [474, 158], size: [184, 52], text: 清单对不上, sub: 名字 / 类型 / NPU 格式, tone: danger, style: faded }
  - { at: [674, 158], size: [184, 52], text: 第 k 批读失败, sub: 批次、首末权重名、返回码, tone: danger, style: faded }
  # 第三排：三类汇总
  - { at: [20, 282], size: [262, 58], text: 汇总：登记失败, sub: destination registration failed., tone: danger, style: solid }
  - { at: [298, 282], size: [322, 58], text: 汇总：原因只写 transfer failed., sub: 三种检查失败一字不差，要往前找一行, tone: danger, style: solid }
  - { at: [636, 282], size: [244, 58], text: 汇总：原因就是异常原文, sub: 前面没有单独的具体日志, tone: danger, style: solid }
  # 第四排：清理安全门
  - { at: [280, 396], size: [336, 52], text: 停服务且注销完成才回退, sub: 停服务或注销失败：保活并报错, tone: ink, style: plain }
