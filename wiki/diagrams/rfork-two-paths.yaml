    rows: 3
    cols: 4
    cell: [44, 34]
    gap: 6
    tone: weight
    style: solid
  - at: [634, 170]
    rows: 3
    cols: 4
    cell: [44, 34]
    gap: 6
    tone: weight
    style: empty
    fill: 4
