layout: figure
id: rfork-two-paths
caption: 新实例 B 的权重有两条来路。① B 先建好空模型、开好放权重的空位，再向 Planner 借一个身份相同、正在服务的实例（这里是 A，叫 seed），拿到租约和 A 的位置；② B 按地址把 A 显存里的权重字节直接读进自己的空位，这一步不经过磁盘，Planner 也不经手权重；读完后 B 在后台归还租约，确认收回后可尝试登记为 seed；③ 没借到或中途出错时，先停止本机 seed 服务、清理登记内存，条件满足才从存储默认加载；停服务或内存清理失败则保活旧存储并报错，租约暂未归还本身不阻止回退。A 在本例中由默认路径加载。格子数是示意。
size: [900, 420]
frames:
  - { label: 实例 A · 已在服务（seed）, at: [20, 80], size: [270, 240] }
  - { label: 新实例 B · 正在启动, at: [610, 80], size: [270, 240] }
items:
  - { at: [360, 96], size: [180, 56], text: Planner, sub: 按身份配对 · 发租约, tone: control }
  - { at: [360, 350], size: [180, 52], text: 存储里的 checkpoint, sub: 默认加载路径, style: plain }
grids:
