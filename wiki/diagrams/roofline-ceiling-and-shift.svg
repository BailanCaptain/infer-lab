<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 516" width="900" height="516" role="img" aria-label="对数坐标 Roofline 屋顶图：带宽墙斜坡、算力墙平顶、脊点拐点与 W8A8 移位" font-family="var(--font-sans)">
  <title>对数坐标 Roofline 屋顶图：带宽墙斜坡、算力墙平顶、脊点拐点与 W8A8 移位</title>
  <desc>对数坐标展示 Roofline 上界 P_max(I) = min(π_peak, I × β_HBM)：结合 PerfMetricsProm（avg_tflops_per_gpu 与 avg_gbps_per_gpu）及 AscendW8A8DynamicLinearMethod，标出 Decode M=1 (BF16 I≈1.0) 在带宽墙斜坡、W8A8 右移翻倍至 I≈2.0、拼批 M=16 爬坡至 I≈15.9、Prefill M=512 (I=409.6) 越过脊点登上 Cube 算力平顶，并附昇腾 950PR (270) 与 950DT (121.5) 官方脊点对照。</desc>
  <defs>
    <marker id="rc-arr-plum" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto">
      <path d="M 0 1.5 L 8.5 5 L 0 8.5 z" fill="#9a4b86"/>
    </marker>
  </defs>

  <text x="16" y="28" font-size="16" font-weight="700" fill="#17211f">对数 Roofline 屋顶图：带宽斜坡、算力平顶与脊点拐点（示意标尺）</text>

  <text x="16" y="54" font-size="13.5" font-weight="700" fill="#4d5652">有效算力 P</text>
  <line x1="96" y1="58" x2="96" y2="376" stroke="#8a928f" stroke-width="1.5"/>
  <line x1="96" y1="376" x2="876" y2="376" stroke="#8a928f" stroke-width="1.5"/>

  <line x1="90" y1="74" x2="96" y2="74" stroke="#8a928f" stroke-width="1.4"/>
  <text x="86" y="79" text-anchor="end" font-family="var(--font-mono)" font-size="13.5" fill="#7a3a6a">640T</text>
  <line x1="90" y1="108" x2="96" y2="108" stroke="#8a928f" stroke-width="1.4"/>
  <text x="86" y="113" text-anchor="end" font-family="var(--font-mono)" font-size="13.5" font-weight="700" fill="#936300">320T</text>
  <line x1="90" y1="221" x2="96" y2="221" stroke="#8a928f" stroke-width="1.4"/>
  <text x="86" y="226" text-anchor="end" font-family="var(--font-mono)" font-size="13.5" fill="#4d5652">25.4T</text>
  <line x1="90" y1="345" x2="96" y2="345" stroke="#8a928f" stroke-width="1.4"/>
  <text x="86" y="350" text-anchor="end" font-family="var(--font-mono)" font-size="13.5" fill="#4d5652">1.6T</text>

  <text x="164" y="398" text-anchor="middle" font-family="var(--font-mono)" font-size="13.5" fill="#4d5652">1</text>
  <text x="232" y="398" text-anchor="middle" font-family="var(--font-mono)" font-size="13.5" fill="#4d5652">2</text>
  <text x="436" y="398" text-anchor="middle" font-family="var(--font-mono)" font-size="13.5" fill="#4d5652">16</text>
  <text x="572" y="398" text-anchor="middle" font-family="var(--font-mono)" font-size="13.5" fill="#4d5652">64</text>
  <text x="684" y="398" text-anchor="middle" font-family="var(--font-mono)" font-size="13.5" font-weight="700" fill="#b54237">200</text>
  <text x="754" y="398" text-anchor="middle" font-family="var(--font-mono)" font-size="13.5" fill="#065f56">410</text>
  <text x="844" y="398" text-anchor="middle" font-family="var(--font-mono)" font-size="13.5" fill="#4d5652">1024</text>
  <text x="486" y="426" text-anchor="middle" font-size="14" font-weight="700" fill="#17211f">算术强度 I = FLOPs / Bytes（FLOP/B，对数刻度 · 示意 320 TFLOP/s ÷ 1.6 TB/s）</text>

  <path d="M 684 108 L 752 74 L 876 74" fill="none" stroke="#9a4b86" stroke-width="2" stroke-dasharray="6 4"/>
  <text x="876" y="64" text-anchor="end" font-size="13.5" font-weight="700" fill="#7a3a6a">W8A8 低比特算力顶 (640 TOPS)</text>

  <line x1="96" y1="376" x2="684" y2="108" stroke="#4c65b6" stroke-width="3.2"/>
  <line x1="684" y1="108" x2="876" y2="108" stroke="#c78300" stroke-width="3.2"/>
  <text x="876" y="99" text-anchor="end" font-size="13.5" font-weight="700" fill="#936300">BF16 平顶 π_peak</text>

  <line x1="684" y1="108" x2="684" y2="376" stroke="#b54237" stroke-width="1.6" stroke-dasharray="5 4"/>
  <circle cx="684" cy="108" r="5.5" fill="#b54237"/>
  <g role="group" aria-label="脊点拐点标注">
    <line x1="616" y1="80" x2="677" y2="105" stroke="#b54237" stroke-width="1.4"/>
    <rect x="380" y="56" width="236" height="38" rx="6" fill="#fff0e9" stroke="#b54237" stroke-width="1.4"/>
    <text x="498" y="80" text-anchor="middle" font-size="13.5" font-weight="700" fill="#8f3229">脊点 I_ridge = 200 FLOP/B</text>
  </g>

  <text x="114" y="192" font-size="14.5" font-weight="700" fill="#3a4f93">◀ 带宽墙斜坡（Memory-Bound）</text>
  <text x="114" y="214" font-size="13.5" fill="#4d5652">P = I × β_HBM（搬数慢，Cube 空等）</text>

  <circle cx="164" cy="345" r="6" fill="#b54237"/>
  <text x="176" y="362" font-size="13.5" font-weight="700" fill="#8f3229">① Decode M=1 (BF16, I≈1)</text>

  <path d="M 171 341 L 223 318" fill="none" stroke="#9a4b86" stroke-width="2" marker-end="url(#rc-arr-plum)"/>
  <circle cx="232" cy="314" r="6" fill="#9a4b86"/>
  <text x="244" y="330" font-size="13.5" font-weight="700" fill="#7a3a6a">② W8A8 右移翻倍 (I≈2)</text>

  <circle cx="435" cy="221" r="6" fill="#4c65b6"/>
  <text x="446" y="238" font-size="13.5" font-weight="700" fill="#3a4f93">③ 拼批 M=16 (I≈15.9)</text>

  <circle cx="754" cy="108" r="6.5" fill="#087f73"/>
  <line x1="754" y1="115" x2="754" y2="146" stroke="#087f73" stroke-width="1.5"/>
  <text x="698" y="166" font-size="13.5" font-weight="700" fill="#065f56">④ Prefill M=512 (I=409.6)</text>
  <text x="698" y="188" font-size="13.5" fill="#065f56">算力墙区（Cube 满载）</text>

  <g role="group" aria-label="昇腾 950 官方脊点对照">
    <rect x="16" y="442" width="868" height="62" rx="8" fill="#ece9df" stroke="#b8bcb5" stroke-width="1.4"/>
    <text x="32" y="467" font-size="14" font-weight="700" fill="#17211f">昇腾 950 白皮书 BF16 Cube 脊点对照：</text>
    <text x="32" y="491" font-size="13.5" fill="#4d5652">• 950PR (432T ÷ 1.6TB/s)：I_ridge = 270</text>
    <text x="456" y="491" font-size="13.5" font-weight="700" fill="#065f56">• 950DT (486T ÷ 4.0TB/s)：左移至 121.5！</text>
  </g>
</svg>
