<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 572" width="900" height="572" role="img" aria-label="示意 Roofline 屋顶线与推理压测五项指标排雷图" font-family="var(--font-sans)">
<title>示意 Roofline 屋顶线与推理压测五项指标排雷（100 TFLOP/s · 2 TB/s 示意 + v0.30.0 口径）</title>
<desc>双对数示意 Roofline 画出 100 TFLOP/s 算力平顶、2 TB/s 带宽斜坡与 50 FLOP/B 脊点，将 4 FLOP/B 落在 8 TFLOP/s 斜线上区分等 HBM 忙碌与真算力饱和，并对照 MoE 小批打散、inter_token_latencies_iter vs mean_time_per_output_token 及 _track_iteration_stats computed vs counter_prompt_tokens。</desc>
<defs>
  <marker id="rf-coral" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
    <path d="M1 1.5L8.5 5L1 8.5Z" fill="#b54237"/>
  </marker>
</defs>

<text x="16" y="29" font-size="16" font-weight="700" fill="#17211f">示意 Roofline 屋顶线与推理压测五项指标排雷（100 TFLOP/s · 2 TB/s 示意 + v0.30.0 口径）</text>

<!-- ① Roofline Coordinate Curve + Criteria 1-3 -->
<rect x="14" y="42" width="872" height="256" rx="10" fill="#fbfaf6" stroke="#087f73" stroke-width="1.3"/>
<text x="28" y="65" font-size="14" font-weight="700" fill="#065f56">① 示意 Roofline（双对数刻度）：4 FLOP/B 落在 8 TFLOP/s 带宽斜坡，核心忙碌 ≠ 算力吃满</text>

<rect x="28" y="78" width="524" height="208" rx="7" fill="#ffffff" stroke="#d8d8cf" stroke-width="1.2"/>
<text x="38" y="93" font-size="12" font-weight="700" fill="#66716d">TFLOP/s</text>
<g stroke="#9aa39f" stroke-width="1.3">
  <line x1="96" y1="96" x2="96" y2="238"/>
  <line x1="96" y1="238" x2="540" y2="238"/>
</g>
<g stroke="#d8d8cf" stroke-width="1.1" stroke-dasharray="4 3">
  <line x1="453" y1="110" x2="453" y2="238"/>
  <line x1="96" y1="193" x2="222" y2="193"/>
  <line x1="222" y1="193" x2="222" y2="238"/>
</g>
<line x1="96" y1="238" x2="453" y2="110" stroke="#4c65b6" stroke-width="2.6"/>
<line x1="453" y1="110" x2="538" y2="110" stroke="#c78300" stroke-width="2.8"/>

<circle cx="453" cy="110" r="4.5" fill="#c78300"/>
<circle cx="222" cy="193" r="5.5" fill="#b54237"/>

<g font-size="12" text-anchor="end" fill="#4d5652">
  <text x="88" y="114" font-weight="700" fill="#936300">100</text>
  <text x="88" y="197" font-weight="700" fill="#b54237">8</text>
  <text x="88" y="242">2</text>
</g>
<g font-size="12" text-anchor="middle" fill="#4d5652">
  <text x="96" y="256">1</text>
  <text x="222" y="256" font-weight="700" fill="#b54237">4</text>
  <text x="453" y="256" font-weight="700" fill="#936300">50 (脊点)</text>
</g>
<text x="316" y="278" text-anchor="middle" font-size="12" fill="#66716d">算术强度 I (FLOP/B，双对数示意刻度)</text>

<text x="262" y="142" font-size="12.5" font-weight="700" fill="#32478c">带宽斜坡 2 TB/s</text>
<text x="454" y="98" text-anchor="middle" font-size="12.5" font-weight="700" fill="#936300">算力平顶 100 TFLOP/s</text>
<text x="234" y="197" font-size="12" font-weight="700" fill="#b54237">4 FLOP/B → 8 TFLOP/s</text>
<text x="234" y="218" font-size="12" fill="#8f3229">忙碌 90% 实为卡在等 HBM</text>

<rect x="564" y="78" width="308" height="208" rx="7" fill="#ffffff" stroke="#d8d8cf" stroke-width="1.2"/>
<text x="576" y="101" font-size="13" font-weight="700" fill="#065f56">① 忙碌率高 ≠ 算力吃满</text>
<text x="576" y="122" font-size="12" fill="#17211f">等 HBM 同样计忙碌；开 --enable-mfu-metrics</text>
<text x="576" y="150" font-size="13" font-weight="700" fill="#936300">② 盲堆 Batch 双重天花板</text>
<text x="576" y="171" font-size="12" fill="#17211f">过脊点撞平顶；4:1 GQA 读 KV 恒约 4 FLOP/B</text>
<text x="576" y="199" font-size="13" font-weight="700" fill="#7a3a6a">③ MoE 3.35B 小批左滑陷阱</text>
<text x="576" y="220" font-size="12" fill="#17211f">打散点亮 ~112/128 专家（单专家 ~2.3 行）</text>
<text x="576" y="241" font-size="12" fill="#4d5652">被迫搬 56.87 GiB 大部权重，须靠大 EP 聚批</text>
<text x="576" y="268" font-size="12" font-weight="700" fill="#065f56">诊断铁律：同看实测 TF/s 与 GB/s 定瓶颈</text>

<!-- ④ Speculative Multi-Token Step: ITL vs TPOT -->
<rect x="14" y="310" width="428" height="248" rx="10" fill="#fbfaf6" stroke="#4c65b6" stroke-width="1.3"/>
<text x="28" y="334" font-size="14" font-weight="700" fill="#32478c">④ 投机单步吐多词：ITL 记包间隔，TPOT 按词均摊</text>

<rect x="28" y="350" width="118" height="38" rx="5" fill="#ece9df" stroke="#9aa39f" stroke-width="1.1"/>
<text x="87" y="374" text-anchor="middle" font-size="12" fill="#4d5652">上一步吐 y₀</text>
<line x1="146" y1="369" x2="234" y2="369" stroke="#b54237" stroke-width="1.7" marker-end="url(#rf-coral)"/>
<text x="190" y="361" text-anchor="middle" font-size="12" font-weight="700" fill="#b54237">Δt = 30 ms</text>
<rect x="238" y="350" width="190" height="38" rx="5" fill="#ddf4ef" stroke="#087f73" stroke-width="1.2"/>
<text x="333" y="374" text-anchor="middle" font-size="12" font-weight="700" fill="#065f56">单步验出 3 词：y₁, y₂, y₃</text>

<rect x="28" y="402" width="400" height="62" rx="6" fill="#e8edff" stroke="#4c65b6" stroke-width="1.2"/>
<text x="40" y="424" font-size="12.5" font-weight="700" fill="#32478c">ITL（inter_token_latencies_iter）：记 30 ms</text>
<text x="40" y="447" font-size="12" fill="#17211f">记录两次流式返回包的时间间隔（不除以吐词数）</text>

<rect x="28" y="472" width="400" height="74" rx="6" fill="#ddf4ef" stroke="#087f73" stroke-width="1.2"/>
<text x="40" y="493" font-size="12.5" font-weight="700" fill="#065f56">TPOT（mean_time_per_output_token）：10 ms/词</text>
<text x="40" y="515" font-size="12" fill="#17211f">histogram_request_time_per_output_token 按词均摊</text>
<text x="40" y="537" font-size="12" fill="#4d5652">边界：仅生成单输出词的请求在该直方图记 0</text>

<!-- ⑤ Prefix Cache Hit: Log Throughput vs /metrics Counter -->
<rect x="458" y="310" width="428" height="248" rx="10" fill="#fbfaf6" stroke="#9a4b86" stroke-width="1.3"/>
<text x="472" y="334" font-size="14" font-weight="700" fill="#7a3a6a">⑤ 前缀缓存命中：日志实算吞吐 ≠ /metrics 速率</text>

<rect x="472" y="350" width="248" height="38" rx="5" fill="#e8edff" stroke="#4c65b6" stroke-width="1.2"/>
<text x="596" y="374" text-anchor="middle" font-size="12" font-weight="700" fill="#32478c">前缀缓存命中 800（跳过重算）</text>
<rect x="724" y="350" width="148" height="38" rx="5" fill="#ddf4ef" stroke="#087f73" stroke-width="1.2"/>
<text x="798" y="374" text-anchor="middle" font-size="12" font-weight="700" fill="#065f56">本地实算 200</text>

<rect x="472" y="402" width="400" height="62" rx="6" fill="#ddf4ef" stroke="#087f73" stroke-width="1.2"/>
<text x="484" y="424" font-size="12.5" font-weight="700" fill="#065f56">周期日志输入吞吐（_track_iteration_stats）</text>
<text x="484" y="447" font-size="12" fill="#17211f">仅累加本地实算 computed（200），对齐设备真实负载</text>

<rect x="472" y="472" width="400" height="74" rx="6" fill="#f7e7f2" stroke="#9a4b86" stroke-width="1.2"/>
<text x="484" y="493" font-size="12.5" font-weight="700" fill="#7a3a6a">Prometheus 计数器（counter_prompt_tokens）</text>
<text x="484" y="515" font-size="12" fill="#17211f">vllm:prompt_tokens 累加含缓存总长 total（1000）</text>
<text x="484" y="537" font-size="12" fill="#4d5652">开启前缀缓存后两边口径天然不同，并非统计丢数</text>
</svg>
