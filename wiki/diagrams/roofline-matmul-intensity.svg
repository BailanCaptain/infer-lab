<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 430" width="900" height="430" role="img" aria-label="Qwen3-8B 线性投影算术强度跃迁" font-family="var(--font-sans)">
  <title>Qwen3-8B 线性投影 [M, 4096]×[4096, 4096] 算术强度跃迁</title>
  <desc>对比 Qwen3Attention 单层 qkv_proj 的 PerfStats（num_flops_per_gpu 与 num_read_bytes_per_gpu）：M=1 约 1.00 FLOP/B，W8A8 压半权重翻倍，M=512 达 409.6 FLOP/B。</desc>

  <text x="16" y="30" font-size="16" font-weight="700" fill="#17211f">Qwen3-8B 线性投影 [M, 4096]×[4096, 4096]：行数 M 与位宽怎样推高算术强度</text>
  <line x1="14" y1="44" x2="886" y2="44" stroke="#b8bcb5" stroke-width="1.4"/>
  <path d="M300,54 V414 M600,54 V414" fill="none" stroke="#b8bcb5" stroke-width="1.3" stroke-dasharray="5 4"/>

  <g text-anchor="middle">
    <text x="150" y="74" font-size="15" font-weight="700" fill="#8f3229">① 单请求 Decode (M=1)</text>
    <rect x="24" y="136" width="56" height="16" rx="3" fill="#ddf4ef" stroke="#087f73" stroke-width="1.4"/>
    <rect x="228" y="136" width="52" height="16" rx="3" fill="#fff4cf" stroke="#c78300" stroke-width="1.4"/>
    <g><rect x="108" y="98" width="96" height="92" rx="6" fill="#e8edff" stroke="#4c65b6" stroke-width="1.5"/><text x="156" y="136" font-family="var(--font-mono)" font-size="13.5" font-weight="700" fill="#3a4f93">W (BF16)</text><text x="156" y="162" font-size="13.5" fill="#3a4f93">32.0 MiB</text></g>
    <g><rect x="18" y="308" width="264" height="92" rx="8" fill="#fff0e9" stroke="#b54237" stroke-width="1.5"/><text x="150" y="342" font-family="var(--font-mono)" font-size="15" font-weight="700" fill="#8f3229">I ≈ 1.00 FLOP/B</text><text x="150" y="376" font-size="13.5" font-weight="600" fill="#8f3229">深陷带宽斜坡（Cube 空等）</text></g>

    <text x="450" y="74" font-size="15" font-weight="700" fill="#7a3a6a">② W8A8 压半权重 (M=1→16)</text>
    <rect x="324" y="124" width="56" height="40" rx="4" fill="#ddf4ef" stroke="#087f73" stroke-width="1.4"/>
    <rect x="528" y="124" width="52" height="40" rx="4" fill="#fff4cf" stroke="#c78300" stroke-width="1.4"/>
    <g><rect x="408" y="106" width="96" height="76" rx="6" fill="#f7e7f2" stroke="#9a4b86" stroke-width="1.5"/><text x="456" y="138" font-family="var(--font-mono)" font-size="13.5" font-weight="700" fill="#7a3a6a">W (1B)</text><text x="456" y="162" font-size="13.5" fill="#7a3a6a">16.0 MiB</text></g>
    <g><rect x="318" y="308" width="264" height="92" rx="8" fill="#f7e7f2" stroke="#9a4b86" stroke-width="1.5"/><text x="450" y="342" font-family="var(--font-mono)" font-size="15" font-weight="700" fill="#7a3a6a">M=16 → 31.5 OP/B</text><text x="450" y="376" font-size="13.5" font-weight="600" fill="#7a3a6a">强度翻倍右移，Decode 提速</text></g>

    <text x="750" y="74" font-size="15" font-weight="700" fill="#065f56">③ Prefill 大矩阵 (M=512)</text>
    <g><rect x="624" y="106" width="56" height="80" rx="5" fill="#ddf4ef" stroke="#087f73" stroke-width="1.5"/><text x="652" y="151" font-size="13.5" font-weight="700" fill="#065f56">4 MiB</text></g>
    <g><rect x="708" y="98" width="96" height="92" rx="6" fill="#e8edff" stroke="#4c65b6" stroke-width="1.5"/><text x="756" y="136" font-family="var(--font-mono)" font-size="13.5" font-weight="700" fill="#3a4f93">W (BF16)</text><text x="756" y="162" font-size="13.5" fill="#3a4f93">复用 512×</text></g>
    <g><rect x="828" y="106" width="52" height="80" rx="5" fill="#fff4cf" stroke="#c78300" stroke-width="1.5"/><text x="854" y="151" font-size="13.5" font-weight="700" fill="#936300">4 MiB</text></g>
    <g><rect x="618" y="308" width="264" height="92" rx="8" fill="#ddf4ef" stroke="#087f73" stroke-width="1.5"/><text x="750" y="342" font-family="var(--font-mono)" font-size="15" font-weight="700" fill="#065f56">I = 409.6 FLOP/B</text><text x="750" y="376" font-size="13.5" font-weight="600" fill="#065f56">越过脊点，登上 Cube 算力屋顶</text></g>
  </g>

  <g text-anchor="middle" font-family="var(--font-mono)" font-size="13.5">
    <text x="52" y="124" fill="#065f56">X[1,4K]</text><text x="254" y="124" fill="#936300">Y[1,4K]</text>
    <text x="352" y="114" fill="#065f56">X[M,4K]</text><text x="554" y="114" fill="#936300">Y[M,4K]</text>
    <text x="652" y="98" fill="#065f56">X[512]</text><text x="854" y="98" fill="#936300">Y[512]</text>
    <text x="94" y="149" font-size="14.5" font-weight="700" fill="#4d5652">×</text><text x="216" y="149" font-weight="700" fill="#4d5652">→</text>
    <text x="394" y="149" font-size="14.5" font-weight="700" fill="#4d5652">×</text><text x="516" y="149" font-weight="700" fill="#4d5652">→</text>
    <text x="694" y="149" font-size="14.5" font-weight="700" fill="#4d5652">×</text><text x="816" y="149" font-weight="700" fill="#4d5652">→</text>
  </g>

  <g font-size="14" fill="#17211f">
    <text x="20" y="226">乘加运算：<tspan font-family="var(--font-mono)" font-size="13.5" font-weight="700" fill="#936300">33.6 MFLOPs</tspan></text>
    <text x="20" y="255">HBM 流量：<tspan font-family="var(--font-mono)" font-size="13.5" font-weight="700" fill="#3a4f93">32.02 MiB</tspan></text>
    <text x="20" y="284" font-size="13.5" fill="#66716d">99.95% 带宽耗在搬运权重！</text>
    <text x="320" y="226">权重减半：<tspan font-family="var(--font-mono)" font-size="13.5" font-weight="700" fill="#7a3a6a">32 → 16 MiB</tspan></text>
    <text x="320" y="255">M=1 强度：<tspan font-family="var(--font-mono)" font-size="13.5" font-weight="700" fill="#7a3a6a">≈ 2.00 OP/B</tspan></text>
    <text x="320" y="284" font-size="13.5" fill="#66716d">压位宽 + 拼批协同摊薄读取</text>
    <text x="620" y="226">乘加运算：<tspan font-family="var(--font-mono)" font-size="13.5" font-weight="700" fill="#936300">17.18 GFLOPs</tspan></text>
    <text x="620" y="255">HBM 流量：<tspan font-family="var(--font-mono)" font-size="13.5" font-weight="700" fill="#3a4f93">40.00 MiB</tspan></text>
    <text x="620" y="284" font-size="13.5" fill="#66716d">搬 1 次权重算完 512 行词元！</text>
  </g>
</svg>
