<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 440" width="900" height="440" role="img" aria-label="推理请求时序拆解与性能三角" font-family="var(--font-sans)">
  <title>推理请求时序拆解（TTFT / ITL / TPOT）与性能三角</title>
  <desc>单请求 Waiting、Prefill（time_to_first_tokens_iter）、Decode（inter_token_latencies_iter、mean_time_per_output_token）与 e2e_latency，及 performance_mode（PerformanceMode）批大小 B 权衡。</desc>
  <defs>
    <marker id="rt-a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto"><path d="M0,1.5 L8.5,5 L0,8.5z" fill="#c78300"/></marker>
    <marker id="rt-t" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto"><path d="M0,1.5 L8.5,5 L0,8.5z" fill="#087f73"/></marker>
    <marker id="rt-i" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto"><path d="M0,1.5 L8.5,5 L0,8.5z" fill="#4c65b6"/></marker>
  </defs>

  <text x="16" y="30" font-size="16" font-weight="700" fill="#17211f">① 单请求生命线：首字时延 TTFT、流式间隔 ITL 与每词均值 TPOT</text>
  <g text-anchor="middle" font-size="14" font-weight="700">
    <g><rect x="20" y="48" width="130" height="38" rx="6" fill="#ece9df" stroke="#8a928f" stroke-width="1.4"/><text x="85" y="72" fill="#4d5652">排队 Waiting</text></g>
    <g><rect x="158" y="48" width="198" height="38" rx="6" fill="#fff4cf" stroke="#c78300" stroke-width="1.5"/><text x="257" y="72" fill="#936300">Prefill 预填充（出词 1）</text></g>
    <g><rect x="364" y="48" width="160" height="38" rx="6" fill="#ddf4ef" stroke="#087f73" stroke-width="1.5"/><text x="444" y="72" fill="#065f56">Decode 步 1（词 2）</text></g>
    <g><rect x="532" y="48" width="180" height="38" rx="6" fill="#ddf4ef" stroke="#087f73" stroke-width="1.5"/><text x="622" y="72" fill="#065f56">Decode 步 2（词 3..5）</text></g>
    <g><rect x="720" y="48" width="160" height="38" rx="6" fill="#e8edff" stroke="#4c65b6" stroke-width="1.4"/><text x="800" y="72" fill="#3a4f93">完成并记账</text></g>
  </g>

  <path d="M20,94 L20,106 L352,106" fill="none" stroke="#c78300" stroke-width="1.8" marker-end="url(#rt-a)"/>
  <path d="M364,94 L364,106 L708,106" fill="none" stroke="#087f73" stroke-width="1.8" marker-end="url(#rt-t)"/>
  <path d="M20,162 L712,162" fill="none" stroke="#4c65b6" stroke-width="1.6" stroke-dasharray="5 3" marker-end="url(#rt-i)"/>
  <g text-anchor="middle">
    <text x="188" y="128" font-size="14.5" font-weight="700" fill="#936300">TTFT 首字时延（到达 → 词 1）</text>
    <text x="188" y="150" font-size="13.5" fill="#4d5652">排队等待 + Prefill 前向计算</text>
    <text x="538" y="128" font-size="14.5" font-weight="700" fill="#065f56">ITL 逐包间隔 vs TPOT 每词均摊</text>
    <text x="538" y="150" font-family="var(--font-mono)" font-size="13.5" fill="#4d5652">TPOT = (E2E - TTFT) / (N_out - 1)</text>
    <text x="450" y="186" font-size="13.5" font-weight="600" fill="#3a4f93">端到端延迟 E2E（投机解码单步吐多词时：ITL 记两次返回间隔，TPOT 按总输出词数摊薄）</text>
  </g>

  <line x1="14" y1="204" x2="886" y2="204" stroke="#b8bcb5" stroke-width="1.4" stroke-dasharray="6 4"/>
  <text x="16" y="234" font-size="16" font-weight="700" fill="#17211f">② 推理性能三角：并发批大小 B 如何同时牵引吞吐与延迟</text>

  <path d="M196,302 L124,366 M256,302 L328,366 M208,392 L244,392" fill="none" stroke="#b8bcb5" stroke-width="1.8"/>
  <g text-anchor="middle">
    <g><rect x="136" y="252" width="180" height="50" rx="8" fill="#ddf4ef" stroke="#087f73" stroke-width="1.5"/><text x="226" y="274" font-size="14.5" font-weight="700" fill="#065f56">系统吞吐 tok/s</text><text x="226" y="294" font-family="var(--font-mono)" font-size="13.5" fill="#4d5652">≈ B / T_step(B)</text></g>
    <g><rect x="20" y="366" width="188" height="52" rx="8" fill="#fff4cf" stroke="#c78300" stroke-width="1.5"/><text x="114" y="388" font-size="14.5" font-weight="700" fill="#936300">TTFT 首字响应</text><text x="114" y="408" font-size="13.5" fill="#4d5652">受长文与排队牵制</text></g>
    <g><rect x="244" y="366" width="188" height="52" rx="8" fill="#e8edff" stroke="#4c65b6" stroke-width="1.5"/><text x="338" y="388" font-size="14.5" font-weight="700" fill="#3a4f93">TPOT / ITL 流畅度</text><text x="338" y="408" font-size="13.5" fill="#4d5652">受单步批耗时牵制</text></g>
    <text x="226" y="342" font-size="14" font-weight="700" fill="#b54237">核心旋钮：批大小 B</text>
  </g>

  <line x1="450" y1="220" x2="450" y2="424" stroke="#b8bcb5" stroke-width="1.3" stroke-dasharray="5 4"/>
  <g><rect x="466" y="252" width="420" height="78" rx="8" fill="#ffffff" stroke="#087f73" stroke-width="1.5"/><text x="482" y="280" font-size="14.5" font-weight="700" fill="#065f56">带宽受限区适度加批（小 B → 拐点前）</text><text x="482" y="310" font-size="13.5" fill="#4d5652">同一份权重供 B 路复用：单步微增，吞吐近线性翻倍</text></g>
  <g><rect x="466" y="342" width="420" height="78" rx="8" fill="#fff0e9" stroke="#b54237" stroke-width="1.5"/><text x="482" y="370" font-size="14.5" font-weight="700" fill="#8f3229">越过算力拐点继续堆批（大 B 撞算力墙）</text><text x="482" y="400" font-size="13.5" fill="#8f3229">吞吐触顶不再涨，单步与排队暴涨拉爆 TTFT 和 TPOT</text></g>
</svg>
