<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 560" width="880" height="560" role="img" aria-label="GLM 双机的一次前向里，位置编号怎样走到两类层：KDA 收下就丢弃；稀疏 MLA 构造时三项检查都不满足，主注意力和索引器都不建旋转模块。淡色框是本配置没有走的分支，只用来对照 DeepSeek 式 MLA">
  <title>GLM 双机的一次前向里，位置编号怎样走到两类层：KDA 收下就丢弃；稀疏 MLA 构造时三项检查都不满足，主注意力和索引器都不建旋转模块。淡色框是本配置没有走的分支，只用来对照 DeepSeek 式 MLA</title>
  <defs><marker id="rope-glm-ah-ink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="var(--color-ink, #17211f)"/></marker></defs>
  <path d="M390 72 L390 96 L230 96 L230 120" fill="none" stroke="var(--color-ink, #17211f)" stroke-width="1.4" marker-end="url(#rope-glm-ah-ink)"/>
  <path d="M490 72 L490 96 L650 96 L650 120" fill="none" stroke="var(--color-ink, #17211f)" stroke-width="1.4" marker-end="url(#rope-glm-ah-ink)"/>
  <path d="M230 176 L230 214" fill="none" stroke="var(--color-ink, #17211f)" stroke-width="1.4" marker-end="url(#rope-glm-ah-ink)"/>
  <path d="M552 176 L552 214" fill="none" stroke="var(--color-ink, #17211f)" stroke-width="1.4" marker-end="url(#rope-glm-ah-ink)"/>
  <path d="M747 176 L747 214" fill="none" stroke="var(--color-ink, #17211f)" stroke-width="1.4" stroke-dasharray="7 5" marker-end="url(#rope-glm-ah-ink)"/>
  <path d="M552 280 L552 312" fill="none" stroke="var(--color-ink, #17211f)" stroke-width="1.4" marker-end="url(#rope-glm-ah-ink)"/>
  <path d="M650 368 L650 400" fill="none" stroke="var(--color-ink, #17211f)" stroke-width="1.4" marker-end="url(#rope-glm-ah-ink)"/>
  <path d="M230 270 L230 468 L390 468 L390 488" fill="none" stroke="var(--color-ink, #17211f)" stroke-width="1.4" marker-end="url(#rope-glm-ah-ink)"/>
  <path d="M650 456 L650 468 L490 468 L490 488" fill="none" stroke="var(--color-ink, #17211f)" stroke-width="1.4" marker-end="url(#rope-glm-ah-ink)"/>
  <rect x="250" y="16" width="380" height="56" rx="8" fill="var(--color-control-soft, #f1efe8)" stroke="var(--color-control, #66716d)" stroke-width="1.4"/>
  <text x="440" y="40" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="14" font-weight="700" fill="var(--color-ink, #17211f)" text-anchor="middle">位置编号：已算 token 数 + 本步序号</text>
  <text x="440" y="59" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="13" font-weight="400" fill="var(--color-ink-muted, #66716d)" text-anchor="middle">R1 第一步是 0、1、2、3，传给每一层</text>
  <rect x="40" y="120" width="380" height="56" rx="8" fill="var(--color-token-soft, #ddf4ef)" stroke="var(--color-token, #087f73)" stroke-width="1.4"/>
  <text x="230" y="144" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="14" font-weight="700" fill="var(--color-ink, #17211f)" text-anchor="middle">34 层 KDA</text>
  <text x="230" y="163" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="13" font-weight="400" fill="#065f56" text-anchor="middle">前向收下位置编号，随即丢弃</text>
  <rect x="40" y="214" width="380" height="56" rx="8" fill="var(--color-control-soft, #f1efe8)" stroke="var(--color-line-strong, #b8bcb5)" stroke-width="1.4"/>
  <text x="230" y="238" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="14" font-weight="700" fill="var(--color-ink, #17211f)" text-anchor="middle">不建 RoPE 模块</text>
  <text x="230" y="257" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="13" font-weight="400" fill="var(--color-ink-muted, #66716d)" text-anchor="middle">顺序靠核长 4 的短卷积与逐位置递推</text>
  <rect x="460" y="120" width="380" height="56" rx="8" fill="var(--color-kv-soft, #e8edff)" stroke="var(--color-kv, #4c65b6)" stroke-width="1.4"/>
  <text x="650" y="144" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="14" font-weight="700" fill="var(--color-ink, #17211f)" text-anchor="middle">11 层稀疏 MLA：构造时查三件事</text>
  <text x="650" y="163" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="13" font-weight="400" fill="#3a4f93" text-anchor="middle">RoPE 维数大于 0？不是 NoPE？有 RoPE 参数？</text>
  <rect x="460" y="214" width="185" height="66" rx="8" fill="var(--color-kv-soft, #e8edff)" stroke="var(--color-kv, #4c65b6)" stroke-width="1.4"/>
  <text x="552.5" y="243" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="14" font-weight="700" fill="var(--color-ink, #17211f)" text-anchor="middle">本配置三项都不满足</text>
  <text x="552.5" y="262" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="13" font-weight="400" fill="#3a4f93" text-anchor="middle">维数 0、NoPE 为真</text>
  <rect x="655" y="214" width="185" height="66" rx="8" fill="var(--color-surface, #fbfaf6)" stroke="var(--color-ink, #17211f)" stroke-opacity="0.45" stroke-width="1.3" stroke-dasharray="5 4"/>
  <text x="747.5" y="243" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="13" font-weight="400" fill="var(--color-ink, #17211f)" text-anchor="middle">若维数大于 0</text>
  <text x="747.5" y="262" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="13" font-weight="400" fill="var(--color-ink, #17211f)" text-anchor="middle">只转单独一段 q、k</text>
  <rect x="460" y="312" width="380" height="56" rx="8" fill="var(--color-kv-soft, #e8edff)" stroke="var(--color-kv, #4c65b6)" stroke-width="1.4"/>
  <text x="650" y="336" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="14" font-weight="700" fill="var(--color-ink, #17211f)" text-anchor="middle">主注意力和索引器都不建旋转</text>
  <text x="650" y="355" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="13" font-weight="400" fill="#3a4f93" text-anchor="middle">旋转模块为空，前向不做旋转</text>
  <rect x="460" y="400" width="380" height="56" rx="8" fill="var(--color-control-soft, #f1efe8)" stroke="var(--color-line-strong, #b8bcb5)" stroke-width="1.4"/>
  <text x="650" y="424" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="14" font-weight="700" fill="var(--color-ink, #17211f)" text-anchor="middle">主缓存每 token 只写 512 维潜向量</text>
  <text x="650" y="443" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="13" font-weight="400" fill="var(--color-ink-muted, #66716d)" text-anchor="middle">索引器压池另加 4 个槽位的偏置</text>
  <rect x="250" y="488" width="380" height="56" rx="8" fill="var(--color-control-soft, #f1efe8)" stroke="var(--color-line-strong, #b8bcb5)" stroke-width="1.4"/>
  <text x="440" y="512" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="14" font-weight="700" fill="var(--color-ink, #17211f)" text-anchor="middle">打分里没有显式的位置项</text>
  <text x="440" y="531" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="13" font-weight="400" fill="var(--color-ink-muted, #66716d)" text-anchor="middle">顺序来自 KDA、池内偏置和因果范围</text>
</svg>
