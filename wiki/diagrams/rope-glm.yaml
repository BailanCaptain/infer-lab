layout: figure
id: rope-glm
caption: GLM 双机的一次前向里，位置编号怎样走到两类层：KDA 收下就丢弃；稀疏 MLA 构造时三项检查都不满足，主注意力和索引器都不建旋转模块。淡色框是本配置没有走的分支，只用来对照 DeepSeek 式 MLA
size: [880, 560]
items:
  - { at: [250, 16], size: [380, 56], text: 位置编号：已算 token 数 + 本步序号, sub: R1 第一步是 0、1、2、3，传给每一层, tone: control }
  - { at: [40, 120], size: [380, 56], text: 34 层 KDA, sub: 前向收下位置编号，随即丢弃, tone: token }
  - { at: [40, 214], size: [380, 56], text: 不建 RoPE 模块, sub: 顺序靠核长 4 的短卷积与逐位置递推, style: plain }
  - { at: [460, 120], size: [380, 56], text: 11 层稀疏 MLA：构造时查三件事, sub: RoPE 维数大于 0？不是 NoPE？有 RoPE 参数？, tone: kv }
  - { at: [460, 214], size: [185, 66], text: 本配置三项都不满足, sub: 维数 0、NoPE 为真, tone: kv }
  - { at: [655, 214], size: [185, 66], text: 若维数大于 0, sub: 只转单独一段 q、k, style: faded }
  - { at: [460, 312], size: [380, 56], text: 主注意力和索引器都不建旋转, sub: 旋转模块为空，前向不做旋转, tone: kv }
  - { at: [460, 400], size: [380, 56], text: 主缓存每 token 只写 512 维潜向量, sub: 索引器压池另加 4 个槽位的偏置, style: plain }
  - { at: [250, 488], size: [380, 56], text: 打分里没有显式的位置项, sub: 顺序来自 KDA、池内偏置和因果范围, style: plain }
