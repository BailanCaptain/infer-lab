<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 420" width="900" height="420" role="img" aria-label="固定旋转前的 q/k，取同向单位向量示意；每个位置旋转 20°，两组位置均相差 2，因此旋转后的夹角均为 40°，这不是 GLM 配置">
  <title>固定旋转前的 q/k，取同向单位向量示意；每个位置旋转 20°，两组位置均相差 2，因此旋转后的夹角均为 40°，这不是 GLM 配置</title>
  <desc>单个二维旋转平面，K 从水平轴转 60 度，Q 转 100 度，夹角 40 度；位置整体增加 100，K 转角等效为 260 度，Q 为 300 度，夹角仍为 40 度</desc>
  <defs><marker id="rope-ah-kv" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="var(--color-kv, #4c65b6)"/></marker><marker id="rope-ah-token" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="var(--color-token, #087f73)"/></marker></defs>
  <circle cx="230" cy="230" r="120" fill="none" stroke="var(--color-ink, #17211f)" stroke-width="1.5"/>
  <path d="M90 230 L370 230" fill="none" stroke="var(--color-ink, #17211f)" stroke-width="1.4" stroke-dasharray="7 5"/>
  <path d="M230 230 L290 126" fill="none" stroke="var(--color-kv, #4c65b6)" stroke-width="1.4" marker-end="url(#rope-ah-kv)"/>
  <path d="M230 230 L209 112" fill="none" stroke="var(--color-token, #087f73)" stroke-width="1.4" marker-end="url(#rope-ah-token)"/>
  <text x="302" y="124" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="13.5" font-weight="700" fill="#3a4f93">K</text>
  <text x="196" y="104" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="13.5" font-weight="700" fill="#065f56" text-anchor="end">Q</text>
  <text x="244" y="160" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="13.5" font-weight="400" fill="var(--color-ink, #17211f)" text-anchor="middle">差 2 格</text>
  <circle cx="670" cy="230" r="120" fill="none" stroke="var(--color-ink, #17211f)" stroke-width="1.5"/>
  <path d="M530 230 L810 230" fill="none" stroke="var(--color-ink, #17211f)" stroke-width="1.4" stroke-dasharray="7 5"/>
  <path d="M670 230 L649 348" fill="none" stroke="var(--color-kv, #4c65b6)" stroke-width="1.4" marker-end="url(#rope-ah-kv)"/>
  <path d="M670 230 L730 334" fill="none" stroke="var(--color-token, #087f73)" stroke-width="1.4" marker-end="url(#rope-ah-token)"/>
  <text x="636" y="366" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="13.5" font-weight="700" fill="#3a4f93" text-anchor="end">K</text>
  <text x="742" y="352" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="13.5" font-weight="700" fill="#065f56">Q</text>
  <text x="684" y="308" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="13.5" font-weight="400" fill="var(--color-ink, #17211f)" text-anchor="middle">差 2 格</text>
  <text x="230" y="36" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="13.5" font-weight="700" fill="var(--color-ink, #17211f)" text-anchor="middle">位置 3 的 K · 位置 5 的 Q</text>
  <text x="670" y="36" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="13.5" font-weight="700" fill="var(--color-ink, #17211f)" text-anchor="middle">位置 103 的 K · 位置 105 的 Q</text>
</svg>
