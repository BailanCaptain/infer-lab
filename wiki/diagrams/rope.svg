<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 500" width="900" height="500" role="img" aria-label="只画一个二维配对：Q 与 K 各按自己的位置旋转。点积的位置因子取决于角度差，内容向量仍决定分数。">
  <title>只画一个二维配对：Q 与 K 各按自己的位置旋转。点积的位置因子取决于角度差，内容向量仍决定分数。</title>
  <rect width="900" height="500" fill="var(--color-surface, #fbfaf6)"/>
  <rect x="20" y="24" width="414" height="304" rx="12" fill="var(--color-surface-sunken, #ece9df)"/>
  <rect x="36" y="38" width="160.2" height="26.5" rx="13.3" fill="var(--color-control, #5b6763)"/><text x="47" y="56.1" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="13.5" font-weight="700" fill="var(--color-ink-inverse, #ffffff)">Q 的一对分量 · 位置 p</text>
  <rect x="466" y="24" width="414" height="304" rx="12" fill="var(--color-weight-soft, #fff4cf)"/>
  <rect x="482" y="38" width="160.2" height="26.5" rx="13.3" fill="var(--color-weight, #b87a00)"/><text x="493" y="56.1" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="13.5" font-weight="700" fill="var(--color-ink-inverse, #ffffff)">K 的一对分量 · 位置 q</text>
  <rect x="42" y="385" width="816" height="76" rx="11" fill="var(--color-surface, #fbfaf6)" stroke="var(--color-accent, #e85b32)" stroke-width="1.5"/>
  <text x="58" y="419.5" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="14.5" font-weight="700" fill="var(--color-ink, #17211f)">点积里的位置项只剩 (q − p) × 频率</text>
  <text x="58" y="437.5" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="12.5" font-weight="400" fill="var(--color-ink-muted, #5b6763)">两个内容向量一起平移位置时点积不变；换 token 内容，分数仍会变。</text>
  <path d="M105 260 L370 260" fill="none" stroke="var(--color-ink-faint, #8a928f)" stroke-width="1.8"/>
  <path d="M370 260 l-11 -5.5 l0 11 z" fill="var(--color-ink-faint, #8a928f)"/>
  <path d="M105 260 L105 90" fill="none" stroke="var(--color-ink-faint, #8a928f)" stroke-width="1.8"/>
  <path d="M105 90 l-5.5 11 l11 0 z" fill="var(--color-ink-faint, #8a928f)"/>
  <path d="M105 260 L300 224" fill="none" stroke="var(--color-ink-faint, #8a928f)" stroke-width="1.8" stroke-dasharray="6 4"/>
  <path d="M300 224 l-11 -5.5 l0 11 z" fill="var(--color-ink-faint, #8a928f)"/>
  <path d="M105 260 L232 108" fill="none" stroke="var(--color-control, #5b6763)" stroke-width="1.8"/>
  <path d="M232 108 l-5.5 11 l11 0 z" fill="var(--color-control, #5b6763)"/>
  <path d="M551 260 L816 260" fill="none" stroke="var(--color-ink-faint, #8a928f)" stroke-width="1.8"/>
  <path d="M816 260 l-11 -5.5 l0 11 z" fill="var(--color-ink-faint, #8a928f)"/>
  <path d="M551 260 L551 90" fill="none" stroke="var(--color-ink-faint, #8a928f)" stroke-width="1.8"/>
  <path d="M551 90 l-5.5 11 l11 0 z" fill="var(--color-ink-faint, #8a928f)"/>
  <path d="M551 260 L728 204" fill="none" stroke="var(--color-ink-faint, #8a928f)" stroke-width="1.8" stroke-dasharray="6 4"/>
  <path d="M728 204 l-11 -5.5 l0 11 z" fill="var(--color-ink-faint, #8a928f)"/>
  <path d="M551 260 L587 78" fill="none" stroke="var(--color-weight, #b87a00)" stroke-width="1.8"/>
  <path d="M587 78 l-5.5 11 l11 0 z" fill="var(--color-weight, #b87a00)"/>
  <text x="236" y="102" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="13" font-weight="400" fill="var(--color-ink-muted, #5b6763)">旋转后 Q</text>
  <text x="270" y="215" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="13" font-weight="400" fill="var(--color-ink-muted, #5b6763)">原 Q</text>
  <text x="598" y="98" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="13" font-weight="400" fill="var(--color-ink-muted, #5b6763)">旋转后 K</text>
  <text x="740" y="198" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="13" font-weight="400" fill="var(--color-ink-muted, #5b6763)">原 K</text>
  <text x="158" y="291" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="13" font-weight="400" fill="var(--color-ink-muted, #5b6763)">转角 p × 频率</text>
  <text x="604" y="291" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="13" font-weight="400" fill="var(--color-ink-muted, #5b6763)">转角 q × 频率</text>
  <text x="42" y="354" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="13" font-weight="400" fill="var(--color-ink-muted, #5b6763)">同一对分量使用同一个频率；实线和虚线等长，示意角度不对应具体 token。</text>
</svg>
