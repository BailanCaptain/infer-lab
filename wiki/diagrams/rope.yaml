layout: figure
id: rope
caption: 示意：只画 q、k 中的一对分量，每前进一个位置转 20°；虚线是旋转前的方向，实线是旋转后。两组位置都相差 2，夹角都是 70°，点积相同。每对分量的真实转速见下文；这不是 GLM 的配置，GLM 的 RoPE 维数为 0
size: [900, 390]

texts:
  - { at: [150, 34], text: 旋转前：由内容算出, strong: true, anchor: middle }
  - { at: [460, 34], text: k 在位置 3，q 在位置 5, strong: true, anchor: middle }
  - { at: [770, 34], text: k 在位置 103，q 在位置 105, strong: true, anchor: middle }
  - { at: [295, 180], text: 按位置转, size: 12, anchor: middle }
  - { at: [605, 180], text: 都 +100, size: 12, anchor: middle }
  - { at: [150, 358], text: 夹角 30°，由内容决定, anchor: middle }
  - { at: [460, 358], text: k 转 60°，q 转 100°，夹角 70°, anchor: middle }
  - { at: [770, 358], text: 各多转 2000°，夹角仍是 70°, anchor: middle }

links:
  - { from: [268, 190], to: [322, 190] }
  - { from: [578, 190], to: [632, 190] }

