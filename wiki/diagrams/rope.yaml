layout: figure
id: rope
caption: 固定旋转前的 q/k，取同向单位向量示意；每个位置旋转 20°，两组位置均相差 2，因此旋转后的夹角均为 40°，这不是 GLM 配置
size: [900, 420]

texts:
  - { at: [230, 36], text: 位置 3 的 K · 位置 5 的 Q, strong: true, anchor: middle }
  - { at: [670, 36], text: 位置 103 的 K · 位置 105 的 Q, strong: true, anchor: middle }

sketches:
  - name: rope-dial
    note: 单个二维旋转平面，K 从水平轴转 60 度，Q 转 100 度，夹角 40 度
    at: [40, 60]
    size: [380, 340]
    shapes:
      - { kind: circle, at: [190, 170], r: 120, tone: ink, style: outline }
      - { kind: line, points: [[50, 170], [330, 170]], tone: ink, dashed: true }
      - { kind: line, points: [[190, 170], [250, 66]], tone: kv, arrow: end }
      - { kind: line, points: [[190, 170], [169, 52]], tone: token, arrow: end }
      - { kind: text, at: [262, 64], text: K, strong: true, tone: kv }
      - { kind: text, at: [156, 44], text: Q, strong: true, tone: token, anchor: end }
      - { kind: text, at: [204, 100], text: 差 2 格, anchor: middle }
  - name: rope-dial
    note: 位置整体增加 100，K 转角等效为 260 度，Q 为 300 度，夹角仍为 40 度
    at: [480, 60]
    size: [380, 340]
    shapes:
      - { kind: circle, at: [190, 170], r: 120, tone: ink, style: outline }
      - { kind: line, points: [[50, 170], [330, 170]], tone: ink, dashed: true }
      - { kind: line, points: [[190, 170], [169, 288]], tone: kv, arrow: end }
      - { kind: line, points: [[190, 170], [250, 274]], tone: token, arrow: end }
      - { kind: text, at: [156, 306], text: K, strong: true, tone: kv, anchor: end }
      - { kind: text, at: [262, 292], text: Q, strong: true, tone: token }
      - { kind: text, at: [204, 248], text: 差 2 格, anchor: middle }
