<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 440" width="900" height="440" role="img" aria-label="Logprobs 四模式流水线抓取点与 V1 外置 Beam Search 含提示词长度惩罚对照图" font-family="var(--font-sans)">
  <title>Logprobs 流水线抓取点与 V1 Beam Search 长度惩罚</title>
  <desc>左半区画出从原始 logits 经惩罚温度截断到采样输出的主轴，标出 raw（猫 0.634 / ln=-0.456）与 processed（猫 0.731 / ln=-0.313）两个截然不同的抓点及 logprob_token_ids 定向通道；右半区展示 V1 外置循环每轮下发 max_tokens=1, logprobs=2W 并用含提示词分母 (|x|+|y|)^γ 打分的排序反转对照。</desc>
  <defs>
    <marker id="sabl-arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 1.5 L 8.5 5 L 0 8.5 z" fill="#17211f"/>
    </marker>
    <marker id="sabl-arr-b" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 1.5 L 8.5 5 L 0 8.5 z" fill="#4c65b6"/>
    </marker>
    <marker id="sabl-arr-p" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 1.5 L 8.5 5 L 0 8.5 z" fill="#9a4b86"/>
    </marker>
  </defs>

  <line x1="452" y1="14" x2="452" y2="426" stroke="#d8d8cf" stroke-width="1.5" stroke-dasharray="6 4"/>

  <!-- Left Half: Logprobs 4-mode tap points along pipeline -->
  <circle cx="28" cy="24" r="12" fill="#4c65b6"/>
  <text x="28" y="28.5" text-anchor="middle" font-size="13" font-weight="700" fill="#ffffff">1</text>
  <text x="48" y="30" font-size="16" font-weight="700" fill="#17211f">Logprobs 抓取点：同一词「猫」不同口径值不同</text>

  <!-- Horizontal pipeline spine -->
  <rect x="16" y="62" width="110" height="46" rx="6" fill="#ece9df" stroke="#8a928f" stroke-width="1.3"/>
  <text x="71" y="83" text-anchor="middle" font-size="13.5" font-weight="700" fill="#17211f">lm_head</text>
  <text x="71" y="101" text-anchor="middle" font-size="13" fill="#4d5652">FP32 logits</text>

  <line x1="126" y1="85" x2="174" y2="85" stroke="#17211f" stroke-width="1.8" marker-end="url(#sabl-arr)"/>

  <rect x="178" y="62" width="132" height="46" rx="6" fill="#fff4cf" stroke="#c78300" stroke-width="1.4"/>
  <text x="244" y="83" text-anchor="middle" font-size="13.5" font-weight="700" fill="#936300">罚分 / 温度 /</text>
  <text x="244" y="101" text-anchor="middle" font-size="13" fill="#936300">min_p / top_k,p</text>

  <line x1="310" y1="85" x2="358" y2="85" stroke="#17211f" stroke-width="1.8" marker-end="url(#sabl-arr)"/>

  <rect x="362" y="62" width="76" height="46" rx="6" fill="#ddf4ef" stroke="#087f73" stroke-width="1.4"/>
  <text x="400" y="90" text-anchor="middle" font-size="13.5" font-weight="700" fill="#065f56">抽词</text>

  <!-- Tap 1: RAW (x=150) -->
  <circle cx="150" cy="85" r="5" fill="#4c65b6"/>
  <line x1="150" y1="90" x2="150" y2="146" stroke="#4c65b6" stroke-width="1.8" marker-end="url(#sabl-arr-b)"/>
  <rect x="16" y="150" width="202" height="128" rx="7" fill="#e8edff" stroke="#4c65b6" stroke-width="1.4"/>
  <text x="28" y="174" font-size="14" font-weight="700" fill="#3a4f93">抓点 A：原始分布（默认）</text>
  <text x="28" y="198" font-size="13.5" font-family="var(--font-mono)" fill="#3a4f93">raw_logprobs</text>
  <text x="28" y="218" font-size="13.5" fill="#17211f">猫 p=0.634 → <tspan font-weight="700">-0.456</tspan></text>
  <text x="28" y="242" font-size="13.5" font-family="var(--font-mono)" fill="#4d5652">raw_logits</text>
  <text x="28" y="262" font-size="13" fill="#4d5652">未归一原分（不可取 exp）</text>

  <!-- Tap 2: PROCESSED (x=334) -->
  <circle cx="334" cy="85" r="5" fill="#9a4b86"/>
  <line x1="334" y1="90" x2="334" y2="146" stroke="#9a4b86" stroke-width="1.8" marker-end="url(#sabl-arr-p)"/>
  <rect x="232" y="150" width="206" height="128" rx="7" fill="#f7e7f2" stroke="#9a4b86" stroke-width="1.4"/>
  <text x="244" y="174" font-size="14" font-weight="700" fill="#7a3a6a">抓点 B：截断后分布</text>
  <text x="244" y="198" font-size="13.5" font-family="var(--font-mono)" fill="#7a3a6a">processed_logprobs</text>
  <text x="244" y="218" font-size="13.5" fill="#17211f">猫 p=0.731 → <tspan font-weight="700">-0.313</tspan></text>
  <text x="244" y="242" font-size="13.5" font-family="var(--font-mono)" fill="#4d5652">processed_logits</text>
  <text x="242" y="262" font-size="12" fill="#4d5652">落选词为 -inf（HTTP 夹 -9999）</text>

  <!-- Sparse gather & FlatLogprobs bottom strip -->
  <rect x="16" y="294" width="422" height="128" rx="7" fill="#ece9df" stroke="#b8bcb5" stroke-width="1.3"/>
  <text x="28" y="317" font-size="14" font-weight="700" fill="#17211f">定向采集 vs 前 k 名 &amp; 扁平容器</text>
  <text x="28" y="341" font-size="12.5" fill="#17211f">• <tspan font-family="var(--font-mono)" font-weight="700" fill="#065f56">top_logprobs=k</tspan>：至多返 k+1 项（所选词落榜也附上）</text>
  <text x="28" y="365" font-size="12.5" fill="#17211f">• <tspan font-family="var(--font-mono)" font-weight="700" fill="#3a4f93">logprob_token_ids</tspan>（≤128）：定向 gather，不限制生成</text>
  <text x="28" y="389" font-size="12.5" fill="#4d5652">• <tspan font-family="var(--font-mono)">flat_logprobs=True</tspan>（Python）：4 条连续数组降 GC</text>
  <text x="40" y="409" font-size="12.5" fill="#4d5652">（注：MTP 路径未贯通）</text>

  <!-- Right Half: V1 External Beam Search + Prompt-Inclusive Length Penalty -->
  <circle cx="480" cy="24" r="12" fill="#c78300"/>
  <text x="480" y="28.5" text-anchor="middle" font-size="13" font-weight="700" fill="#ffffff">2</text>
  <text x="500" y="30" font-size="16" font-weight="700" fill="#17211f">V1 外置 Beam Search：循环与含提示词分母</text>

  <!-- Loop diagram -->
  <rect x="468" y="54" width="184" height="58" rx="6" fill="#fff4cf" stroke="#c78300" stroke-width="1.4"/>
  <text x="560" y="79" text-anchor="middle" font-size="13.5" font-weight="700" fill="#936300">入口层发 W 条请求</text>
  <text x="560" y="100" text-anchor="middle" font-size="13" font-family="var(--font-mono)" fill="#4d5652">max_tokens=1, lp=2W</text>

  <line x1="652" y1="83" x2="692" y2="83" stroke="#17211f" stroke-width="1.7" marker-end="url(#sabl-arr)"/>

  <rect x="696" y="54" width="188" height="58" rx="6" fill="#ddf4ef" stroke="#087f73" stroke-width="1.4"/>
  <text x="790" y="79" text-anchor="middle" font-size="13.5" font-weight="700" fill="#065f56">引擎靠 APC 复用前缀</text>
  <text x="790" y="100" text-anchor="middle" font-size="13" fill="#4d5652">返回每束前 2W 续词</text>

  <path d="M 790 112 L 790 138 L 560 138 L 560 116" fill="none" stroke="#17211f" stroke-width="1.6" stroke-dasharray="4 3" marker-end="url(#sabl-arr)"/>
  <text x="675" y="156" text-anchor="middle" font-size="13.5" font-weight="700" fill="#17211f">Host 累加 log p → 按长度惩罚排序 → 剪枝留前 W 条</text>

  <!-- Length penalty comparison: |x|=4, γ=1, A(+2 tok, sum=-2) vs B(+4 tok, sum=-3) -->
  <line x1="468" y1="174" x2="884" y2="174" stroke="#d8d8cf" stroke-width="1.3"/>
  <text x="468" y="198" font-size="14.5" font-weight="700" fill="#17211f">长度惩罚分母陷阱（提示词 |x|=4，γ=1）</text>
  <text x="468" y="220" font-size="13.5" fill="#4d5652">候选 A：新增 2 词、累计 -2；候选 B：新增 4 词、累计 -3</text>

  <!-- Correct formula box: include |x| -->
  <rect x="468" y="232" width="416" height="86" rx="7" fill="#ddf4ef" stroke="#087f73" stroke-width="1.4"/>
  <text x="482" y="256" font-size="14" font-weight="700" fill="#065f56">✓ 源码真实口径：分母 = max(|x| + |y|, 1)^γ</text>
  <text x="482" y="280" font-size="13.5" font-family="var(--font-mono)" fill="#065f56">A: -2 / (4+2) = -0.3333  &gt;  B: -3 / (4+4) = -0.3750</text>
  <text x="482" y="304" font-size="13.5" font-weight="700" fill="#065f56">→ 候选 A 排第一（更接近 0 得分更高）</text>

  <!-- Wrong formula box: omit |x| -->
  <rect x="468" y="330" width="416" height="86" rx="7" fill="#fff0e9" stroke="#b54237" stroke-width="1.4" stroke-dasharray="4 3"/>
  <text x="482" y="354" font-size="14" font-weight="700" fill="#8f3229">✗ 常见误算：只用新增长度 |y| 作分母</text>
  <text x="482" y="378" font-size="13.5" font-family="var(--font-mono)" fill="#8f3229">A: -2 / 2 = -1.000  &lt;  B: -3 / 4 = -0.750</text>
  <text x="482" y="402" font-size="13.5" font-weight="700" fill="#8f3229">→ 排序彻底翻转！切勿漏算提示词长度 |x|</text>
</svg>
