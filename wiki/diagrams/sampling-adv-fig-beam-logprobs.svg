<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 390" width="900" height="390" role="img" aria-label="Logprobs 四种模式抓取点与 V1 外置 Beam Search 架构" font-family="var(--font-sans)">
<title>Logprobs 四模式抓取时机与 V1 Beam Search 外置循环</title>
<desc>raw vs processed logprobs/logits capture points and V1 BeamSearchOfflineMixin outer loop</desc>
<line x1="450" y1="14" x2="450" y2="376" stroke="#d8d8cf" stroke-width="1.5" stroke-dasharray="6 4"/>
<g stroke-width="1.4">
<rect x="16" y="60" width="414" height="90" rx="8" fill="#e8edff" stroke="#4c65b6"/>
<rect x="16" y="168" width="414" height="90" rx="8" fill="#f7e7f2" stroke="#9a4b86"/>
<rect x="16" y="276" width="414" height="96" rx="8" fill="#ece9df" stroke="#b8bcb5"/>
<rect x="470" y="60" width="414" height="72" rx="8" fill="#fff4cf" stroke="#c78300"/>
<rect x="470" y="156" width="414" height="96" rx="8" fill="#ddf4ef" stroke="#087f73"/>
<rect x="470" y="276" width="414" height="96" rx="8" fill="#fff0e9" stroke="#b54237"/>
</g>
<path d="M677 132v22m-4-5l4 5 4-5M677 252v22m-4-5l4 5 4-5" fill="none" stroke="#17211f" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/>
<circle cx="28" cy="26" r="12.5" fill="#4c65b6"/>
<circle cx="482" cy="26" r="12.5" fill="#c78300"/>
<g font-weight="700">
<text x="28" y="30.5" text-anchor="middle" font-size="13" fill="#ffffff">1</text>
<text x="48" y="32" font-size="16" fill="#17211f">Logprobs 四模式：惩罚前 vs 截断后</text>
<text x="30" y="86" font-size="14.5" fill="#3a4f93">惩罚与温度之前抓取（V1 默认口径）</text>
<text x="30" y="194" font-size="14.5" fill="#7a3a6a">惩罚、温度、min_p、Top-k/p 之后抓取</text>
<text x="30" y="302" font-size="14.5" fill="#17211f">定向收集快速通道：logprob_token_ids</text>
<text x="482" y="30.5" text-anchor="middle" font-size="13" fill="#ffffff">2</text>
<text x="502" y="32" font-size="16" fill="#17211f">V1 Beam Search：外置 1-token 循环</text>
<text x="484" y="86" font-size="14.5" fill="#936300">每轮下发 max_tokens=1, logprobs=2×W</text>
<text x="484" y="182" font-size="14.5" fill="#065f56">入口层按长度惩罚排序并剪枝留 W 条</text>
<text x="484" y="302" font-size="14.5" fill="#8f3229">工程代价与依赖前提</text>
</g>
<g fill="#4d5652" font-size="13.5">
<text x="30" y="112">• raw_logprobs（默认）：原始 logits 做 log_softmax</text>
<text x="30" y="136">• raw_logits：直接克隆原始 FP32 logits（不归一）</text>
<text x="30" y="220">• processed_logprobs：过滤后 logits 做 log_softmax</text>
<text x="30" y="244">• processed_logits：返回截断后的打分（丢弃项 -inf）</text>
<text x="30" y="328">• 仅 gather 指定候选 token 集合（如生成式打分）</text>
<text x="30" y="352">• 免除全词表 Top-k 排序，保留采样词 rank 统计</text>
<text x="484" y="114">W = beam_width；复用标准引擎而非专用内核</text>
<text x="484" y="208">• 候选池规模 2W，命中 EOS 移入完成队列</text>
<text x="484" y="232">• score = cum_logprob / (len ^ length_penalty)</text>
<text x="484" y="328">• 每步需靠 APC 前缀缓存复用共同历史 KV 块</text>
<text x="484" y="352">• 不支持嵌入提示（embeds）及水印配置</text>
</g>
</svg>
