<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 470" width="900" height="470" role="img" aria-label="三类重复惩罚 logit 数轴位移与连续批处理 BatchUpdate 行重排示意图" font-family="var(--font-sans)">
  <title>三类重复惩罚数轴位移与 BatchUpdate 行状态同步</title>
  <desc>上半区在 [-3.5, +3.5] 同一数轴上画出五个词在 repetition(α=2) → frequency(β=0.5) → presence(β=0.5) 顺序作用下的真实位移：猫 +3→+1.5→0.0，你 +2 不变胜出，看 +1→+0.5，。0→-1.0，我 -1→-2.0→-3.0；下半区展示四行批次 [A,B,C,D] 经替换/删除/移动/交换重排为 [B,E,D] 的映射关系。</desc>
  <defs>
    <marker id="saps-arr-r" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 1.5 L 8.5 5 L 0 8.5 z" fill="#b54237"/>
    </marker>
    <marker id="saps-arr-a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 1.5 L 8.5 5 L 0 8.5 z" fill="#c78300"/>
    </marker>
    <marker id="saps-arr-t" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 1.5 L 8.5 5 L 0 8.5 z" fill="#087f73"/>
    </marker>
  </defs>

  <!-- Zone 1: Logit number line [-3.5 .. +3.5], zero at x = 440, 1 unit = 76px (range -3.5=174 .. +3.5=706) -->
  <circle cx="26" cy="24" r="12" fill="#c78300"/>
  <text x="26" y="28.5" text-anchor="middle" font-size="13" font-weight="700" fill="#ffffff">1</text>
  <text x="46" y="30" font-size="16" font-weight="700" fill="#17211f">三类重复惩罚顺序（rep → freq → pres）下的真实 Logit 位移（α=2, β=0.5）</text>

  <!-- Vertical grid lines for -3, -2, -1, 0, +1, +2, +3 -->
  <g stroke="#d8d8cf" stroke-width="1" stroke-dasharray="3 3">
    <line x1="212" y1="54" x2="212" y2="274"/>
    <line x1="288" y1="54" x2="288" y2="274"/>
    <line x1="364" y1="54" x2="364" y2="274"/>
    <line x1="516" y1="54" x2="516" y2="274"/>
    <line x1="592" y1="54" x2="592" y2="274"/>
    <line x1="668" y1="54" x2="668" y2="274"/>
  </g>
  <!-- Zero axis -->
  <line x1="440" y1="54" x2="440" y2="274" stroke="#17211f" stroke-width="1.5"/>
  <g font-size="13" font-family="var(--font-mono)" fill="#66716d" text-anchor="middle">
    <text x="212" y="50">-3</text>
    <text x="288" y="50">-2</text>
    <text x="364" y="50">-1</text>
    <text x="440" y="50" font-weight="700" fill="#17211f">0</text>
    <text x="516" y="50">+1</text>
    <text x="592" y="50">+2</text>
    <text x="668" y="50">+3</text>
  </g>

  <!-- Row 1: 猫 (+3 -> +1.5 -> 0.0), y=82 -->
  <text x="16" y="87" font-size="14" font-weight="700" fill="#8f3229">猫（输出 2 次）</text>
  <circle cx="668" cy="82" r="6" fill="#ece9df" stroke="#66716d" stroke-width="1.5"/>
  <line x1="660" y1="82" x2="562" y2="82" stroke="#c78300" stroke-width="2.2" marker-end="url(#saps-arr-a)"/>
  <circle cx="554" cy="82" r="5" fill="#fff4cf" stroke="#c78300" stroke-width="1.5"/>
  <line x1="547" y1="82" x2="448" y2="82" stroke="#b54237" stroke-width="2.2" marker-end="url(#saps-arr-r)"/>
  <circle cx="440" cy="82" r="7" fill="#b54237"/>
  <text x="610" y="72" text-anchor="middle" font-size="13" fill="#936300">÷2 → 1.5</text>
  <text x="498" y="72" text-anchor="middle" font-size="13" fill="#8f3229">-1.5 → 0.0</text>
  <text x="708" y="87" font-size="13.5" fill="#8f3229">+3 → 0.0（退位）</text>

  <!-- Row 2: 你 (+2 -> +2.0 winner), y=126 -->
  <text x="16" y="131" font-size="14" font-weight="700" fill="#065f56">你（从未出现）</text>
  <circle cx="592" cy="126" r="8" fill="#087f73"/>
  <text x="612" y="131" font-size="13.5" font-weight="700" fill="#065f56">保持 +2.0 ✓ 胜出（打破复读）</text>

  <!-- Row 3: 看 (+1 -> +0.5, prompt only), y=170 -->
  <text x="16" y="175" font-size="14" font-weight="700" fill="#936300">看（仅提示词）</text>
  <circle cx="516" cy="170" r="6" fill="#ece9df" stroke="#66716d" stroke-width="1.5"/>
  <line x1="509" y1="170" x2="486" y2="170" stroke="#c78300" stroke-width="2.2" marker-end="url(#saps-arr-a)"/>
  <circle cx="478" cy="170" r="7" fill="#c78300"/>
  <text x="536" y="175" font-size="13.5" fill="#936300">仅 rep ÷2 → +0.5（freq/pres 不计提示词）</text>

  <!-- Row 4: 。(0 -> -1.0), y=214 -->
  <text x="16" y="219" font-size="14" font-weight="700" fill="#4d5652">「。」（输出 1 次）</text>
  <circle cx="440" cy="214" r="6" fill="#ece9df" stroke="#66716d" stroke-width="1.5"/>
  <line x1="433" y1="214" x2="372" y2="214" stroke="#b54237" stroke-width="2.2" marker-end="url(#saps-arr-r)"/>
  <circle cx="364" cy="214" r="7" fill="#4c65b6"/>
  <text x="456" y="219" font-size="13.5" fill="#4d5652">0 × 2 仍为 0，再扣 freq+pres → -1.0</text>

  <!-- Row 5: 我 (-1 -> -2.0 -> -3.0), y=258 -->
  <text x="16" y="263" font-size="14" font-weight="700" fill="#3a4f93">我（输出 1 次）</text>
  <circle cx="364" cy="258" r="6" fill="#ece9df" stroke="#66716d" stroke-width="1.5"/>
  <line x1="357" y1="258" x2="296" y2="258" stroke="#c78300" stroke-width="2.2" marker-end="url(#saps-arr-a)"/>
  <circle cx="288" cy="258" r="5" fill="#fff4cf" stroke="#c78300" stroke-width="1.5"/>
  <line x1="281" y1="258" x2="220" y2="258" stroke="#b54237" stroke-width="2.2" marker-end="url(#saps-arr-r)"/>
  <circle cx="212" cy="258" r="7" fill="#3a4f93"/>
  <text x="326" y="248" text-anchor="middle" font-size="13" fill="#936300">×2（负分乘）</text>
  <text x="250" y="248" text-anchor="middle" font-size="13" fill="#8f3229">-1.0</text>
  <text x="382" y="263" font-size="13.5" fill="#3a4f93">-1 → -3.0（若误除以 2 会反抬高至 -0.5）</text>

  <!-- Divider -->
  <line x1="16" y1="292" x2="884" y2="292" stroke="#b8bcb5" stroke-width="1.4" stroke-dasharray="6 5"/>

  <!-- Zone 2: BatchUpdate row remapping -->
  <circle cx="26" cy="318" r="12" fill="#4c65b6"/>
  <text x="26" y="322.5" text-anchor="middle" font-size="13" font-weight="700" fill="#ffffff">2</text>
  <text x="46" y="324" font-size="16" font-weight="700" fill="#17211f">自定义 LogitsProcessor 为何必须同步 BatchUpdate（删 → 增 → 移 → 换）</text>

  <!-- Step 0: Before [A, B, C, D] -->
  <text x="16" y="362" font-size="14" font-weight="700" fill="#4d5652">上一步批次</text>
  <rect x="16" y="372" width="52" height="44" rx="5" fill="#fff0e9" stroke="#b54237" stroke-width="1.4" stroke-dasharray="4 3"/>
  <text x="42" y="392" text-anchor="middle" font-size="13.5" font-weight="700" fill="#8f3229">0:A</text>
  <text x="42" y="409" text-anchor="middle" font-size="13" fill="#8f3229">结束</text>

  <rect x="74" y="372" width="52" height="44" rx="5" fill="#ddf4ef" stroke="#087f73" stroke-width="1.4"/>
  <text x="100" y="399" text-anchor="middle" font-size="14" font-weight="700" fill="#065f56">1:B</text>

  <rect x="132" y="372" width="52" height="44" rx="5" fill="#fff0e9" stroke="#b54237" stroke-width="1.4" stroke-dasharray="4 3"/>
  <text x="158" y="392" text-anchor="middle" font-size="13.5" font-weight="700" fill="#8f3229">2:C</text>
  <text x="158" y="409" text-anchor="middle" font-size="13" fill="#8f3229">结束</text>

  <rect x="190" y="372" width="52" height="44" rx="5" fill="#e8edff" stroke="#4c65b6" stroke-width="1.4"/>
  <text x="216" y="399" text-anchor="middle" font-size="14" font-weight="700" fill="#3a4f93">3:D</text>

  <!-- Arrow 1 -->
  <line x1="250" y1="394" x2="286" y2="394" stroke="#087f73" stroke-width="1.8" marker-end="url(#saps-arr-t)"/>

  <!-- Step 1: E replaces 0, delete 2, move D 3->2 -->
  <text x="294" y="362" font-size="14" font-weight="700" fill="#936300">① E 顶替行 0 + 删 2 + D 移至 2</text>
  <rect x="294" y="372" width="76" height="44" rx="5" fill="#fff4cf" stroke="#c78300" stroke-width="1.4"/>
  <text x="332" y="399" text-anchor="middle" font-size="14" font-weight="700" fill="#936300">0:E (新)</text>

  <rect x="378" y="372" width="76" height="44" rx="5" fill="#ddf4ef" stroke="#087f73" stroke-width="1.4"/>
  <text x="416" y="399" text-anchor="middle" font-size="14" font-weight="700" fill="#065f56">1:B</text>

  <rect x="462" y="372" width="76" height="44" rx="5" fill="#e8edff" stroke="#4c65b6" stroke-width="1.4"/>
  <text x="500" y="399" text-anchor="middle" font-size="14" font-weight="700" fill="#3a4f93">2:D (移)</text>

  <!-- Arrow 2 -->
  <line x1="546" y1="394" x2="582" y2="394" stroke="#087f73" stroke-width="1.8" marker-end="url(#saps-arr-t)"/>

  <!-- Step 2: Swap 0 and 1 -> [B, E, D] -->
  <text x="590" y="362" font-size="14" font-weight="700" fill="#065f56">② 交换行 0 / 1 → 最终行号</text>
  <rect x="590" y="372" width="88" height="44" rx="5" fill="#ddf4ef" stroke="#087f73" stroke-width="1.6"/>
  <text x="634" y="399" text-anchor="middle" font-size="14" font-weight="700" fill="#065f56">0:B</text>

  <rect x="688" y="372" width="88" height="44" rx="5" fill="#fff4cf" stroke="#c78300" stroke-width="1.6"/>
  <text x="732" y="399" text-anchor="middle" font-size="14" font-weight="700" fill="#936300">1:E</text>

  <rect x="786" y="372" width="88" height="44" rx="5" fill="#e8edff" stroke="#4c65b6" stroke-width="1.6"/>
  <text x="830" y="399" text-anchor="middle" font-size="14" font-weight="700" fill="#3a4f93">2:D</text>

  <text x="10" y="446" font-size="12" fill="#4d5652">即便 BatchUpdate 为 None（成员未变），引擎每步仍调用 update_state 同步增长中的输出 token 引用；显式处理器与投机/Pooling/MRV2 互斥</text>
</svg>
