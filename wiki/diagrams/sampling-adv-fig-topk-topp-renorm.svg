<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 490" width="900" height="490" role="img" aria-label="上游 PyTorch 重归一与昇腾过滤前 Softmax 在 T=1, k=2, p=0.7 下的双轨累积概率截断对比图" font-family="var(--font-sans)">
  <title>Top-k + Top-p 联合截断双轨对比：上游重归一 vs 昇腾沿用过滤前 Softmax</title>
  <desc>上半区用两条共享 [0, 1.0] 标尺与同一条 p=0.70 垂直门槛线的概率条，对比 6 词示意（猫 3、你 2、看 1、「。」0、我 -1、喜欢 -2）在 T=1, k=2, p=0.7 下的数值分叉：上游重归一将「猫」推至 0.731 独自过线（留 1 词），昇腾沿用过滤前 Softmax 令「猫」停在 0.634（须留「猫+你」2 词，累计 0.867）；下半区对照 min_p 相对峰值门槛与 top_k 同分并列保留。</desc>
  <defs>
    <marker id="satp-arr-r" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 1.5 L 8.5 5 L 0 8.5 z" fill="#b54237"/>
    </marker>
  </defs>

  <!-- Zone 1: Dual-track cumulative probability bars aligned on [0, 1.0] -->
  <circle cx="26" cy="24" r="12" fill="#4c65b6"/>
  <text x="26" y="28.5" text-anchor="middle" font-size="13" font-weight="700" fill="#ffffff">1</text>
  <text x="46" y="30" font-size="16" font-weight="700" fill="#17211f">T=1, k=2, p=0.7 联合截断分叉：两条 6 词概率轨共用同一条 0.70 门槛线</text>

  <!-- Shared scale x = 136..736 (width = 600px, 0.1 = 60px, p=0.70 -> x = 136 + 420 = 556) -->
  <g stroke="#d8d8cf" stroke-width="1" stroke-dasharray="3 3">
    <line x1="136" y1="58" x2="136" y2="262"/>
    <line x1="256" y1="58" x2="256" y2="262"/>
    <line x1="376" y1="58" x2="376" y2="262"/>
    <line x1="496" y1="58" x2="496" y2="262"/>
    <line x1="616" y1="58" x2="616" y2="262"/>
    <line x1="736" y1="58" x2="736" y2="262"/>
  </g>
  <g font-size="13" font-family="var(--font-mono)" fill="#66716d" text-anchor="middle">
    <text x="136" y="52">0.0</text>
    <text x="256" y="52">0.2</text>
    <text x="376" y="52">0.4</text>
    <text x="496" y="52">0.6</text>
    <text x="616" y="52">0.8</text>
    <text x="736" y="52">1.0</text>
  </g>

  <!-- Track A: Upstream PyTorch (renormalize after top_k=2) -->
  <text x="16" y="96" font-size="14" font-weight="700" fill="#065f56">上游 PyTorch</text>
  <text x="16" y="116" font-size="13" fill="#4d5652">top_k 后重归一</text>
  <!-- 猫 0.731 -> 438.6px (136..575) -->
  <rect x="136" y="74" width="439" height="44" rx="4" fill="#ddf4ef" stroke="#087f73" stroke-width="1.6"/>
  <text x="348" y="101" text-anchor="middle" font-size="14.5" font-weight="700" fill="#065f56">猫 0.731（独自跨过 0.70 线 ✓）</text>
  <!-- 你 0.269 -> 161.4px (575..736), cut by top_p -->
  <rect x="575" y="74" width="161" height="44" rx="4" fill="#ece9df" stroke="#b8bcb5" stroke-width="1.3" stroke-dasharray="4 3"/>
  <text x="655" y="101" text-anchor="middle" font-size="13.5" fill="#66716d">你 0.269（裁）</text>
  <!-- Result A -->
  <rect x="748" y="74" width="138" height="44" rx="5" fill="#ddf4ef" stroke="#087f73" stroke-width="1.4"/>
  <text x="817" y="94" text-anchor="middle" font-size="13.5" font-weight="700" fill="#065f56">仅留 1 词</text>
  <text x="817" y="112" text-anchor="middle" font-size="13" font-family="var(--font-mono)" fill="#065f56">猫 1.000</text>

  <!-- Track B: Ascend _apply_top_k_top_p_pytorch (pre-filter Softmax, no renorm) -->
  <text x="16" y="192" font-size="14" font-weight="700" fill="#936300">昇腾普通排序</text>
  <text x="16" y="212" font-size="13" fill="#4d5652">过滤前 Softmax</text>
  <!-- 猫 0.634 -> 380.4px (136..516) -->
  <rect x="136" y="170" width="380" height="44" rx="4" fill="#fff4cf" stroke="#c78300" stroke-width="1.6"/>
  <text x="326" y="197" text-anchor="middle" font-size="14.5" font-weight="700" fill="#936300">猫 0.634（未到 0.70 线！）</text>
  <!-- 你 0.233 -> 139.8px (516..656), cum = 0.867 -->
  <rect x="516" y="170" width="140" height="44" rx="4" fill="#e8edff" stroke="#4c65b6" stroke-width="1.6"/>
  <text x="586" y="197" text-anchor="middle" font-size="14" font-weight="700" fill="#3a4f93">你 0.233 ✓</text>
  <!-- 看 0.086 (52px: 656..708) + 。0.032 (19px: 708..727) + 我/喜欢 0.016 (9px: 727..736) masked by top_k=2 -->
  <rect x="656" y="170" width="52" height="44" rx="3" fill="#fff0e9" stroke="#b54237" stroke-width="1.2" stroke-dasharray="3 2"/>
  <text x="682" y="197" text-anchor="middle" font-size="13" fill="#8f3229">看</text>
  <rect x="708" y="170" width="28" height="44" rx="3" fill="#fff0e9" stroke="#b54237" stroke-width="1.2" stroke-dasharray="3 2"/>
  <text x="722" y="197" text-anchor="middle" font-size="13" fill="#8f3229">…</text>
  <!-- Result B -->
  <rect x="748" y="170" width="138" height="44" rx="5" fill="#fff4cf" stroke="#c78300" stroke-width="1.4"/>
  <text x="817" y="190" text-anchor="middle" font-size="13.5" font-weight="700" fill="#936300">保留 2 词</text>
  <text x="817" y="208" text-anchor="middle" font-size="13" font-family="var(--font-mono)" fill="#936300">0.731 / 0.269</text>

  <!-- Exact shared vertical threshold line at p = 0.70 (x = 556) -->
  <line x1="556" y1="58" x2="556" y2="246" stroke="#b54237" stroke-width="2.2" stroke-dasharray="6 4"/>
  <rect x="494" y="242" width="124" height="24" rx="4" fill="#fff0e9" stroke="#b54237" stroke-width="1.3"/>
  <text x="556" y="259" text-anchor="middle" font-size="13.5" font-weight="700" fill="#8f3229">top_p = 0.70 线</text>

  <!-- Annotations below tracks -->
  <text x="136" y="242" font-size="13.5" fill="#4d5652">累计 0.634 + 0.233 = 0.867 ≥ 0.70</text>
  <text x="656" y="236" font-size="13" fill="#8f3229">其余 4 词被 top_k 屏蔽</text>
  <text x="16" y="286" font-size="13.5" fill="#4d5652">适用范围：vllm-ascend v0.26 / v0.30.0 / main 普通排序路径；设 <tspan font-family="var(--font-mono)" font-weight="700" fill="#065f56">VLLM_BATCH_INVARIANT=1</tspan> 回退上游重归一路径</text>

  <!-- Divider -->
  <line x1="16" y1="304" x2="884" y2="304" stroke="#b8bcb5" stroke-width="1.4" stroke-dasharray="6 5"/>

  <!-- Zone 2: min_p dynamic threshold + top_k tie rule -->
  <circle cx="26" cy="330" r="12" fill="#087f73"/>
  <text x="26" y="334.5" text-anchor="middle" font-size="13" font-weight="700" fill="#ffffff">2</text>
  <text x="46" y="336" font-size="16" font-weight="700" fill="#17211f">完整过滤次序 min_p → top_k → top_p：动态峰值门槛与同分并列边界</text>

  <!-- Left: min_p = 0.1 sharp vs flat -->
  <text x="16" y="366" font-size="14" font-weight="700" fill="#065f56">A. min_p = 0.1（剔除 p &lt; min_p · p_max）</text>
  <!-- Sharp: p_max=0.90 -> threshold 0.09 -->
  <text x="16" y="398" font-size="13.5" fill="#17211f">尖峰分布</text>
  <rect x="92" y="378" width="270" height="26" rx="4" fill="#ddf4ef" stroke="#087f73" stroke-width="1.3"/>
  <text x="227" y="396" text-anchor="middle" font-size="13.5" font-weight="700" fill="#065f56">p_max = 0.90</text>
  <line x1="119" y1="374" x2="119" y2="410" stroke="#b54237" stroke-width="2"/>
  <text x="372" y="396" font-size="13.5" font-weight="700" fill="#8f3229">门槛拉高至 0.09</text>
  <!-- Flat: p_max=0.20 -> threshold 0.02 -->
  <text x="16" y="438" font-size="13.5" fill="#17211f">平坦分布</text>
  <rect x="92" y="418" width="60" height="26" rx="4" fill="#e8edff" stroke="#4c65b6" stroke-width="1.3"/>
  <text x="122" y="436" text-anchor="middle" font-size="13" font-weight="700" fill="#3a4f93">0.20</text>
  <rect x="156" y="418" width="54" height="26" rx="4" fill="#e8edff" stroke="#4c65b6" stroke-width="1.2"/>
  <rect x="214" y="418" width="48" height="26" rx="4" fill="#e8edff" stroke="#4c65b6" stroke-width="1.2"/>
  <line x1="98" y1="414" x2="98" y2="450" stroke="#087f73" stroke-width="2"/>
  <text x="274" y="436" font-size="13.5" font-weight="700" fill="#065f56">门槛放宽至 0.02（保多样性）</text>
  <text x="16" y="472" font-size="13" fill="#4d5652">最高词永不被砍（argmax 不变）；非贪心且有效 min_p &gt; 1e-5 与投机互斥</text>

  <!-- Vertical divider -->
  <line x1="482" y1="350" x2="482" y2="476" stroke="#d8d8cf" stroke-width="1.3"/>

  <!-- Right: top_k strict < cutoff tie rule -->
  <text x="502" y="366" font-size="14" font-weight="700" fill="#7a3a6a">B. top_k 严格小于门槛：同分并列一并保留</text>
  <text x="502" y="390" font-size="13.5" fill="#4d5652">示意分数 [5, 4, 4, 1]，k = 2 → 第 2 大门槛值 = 4</text>

  <!-- 4 score bars -->
  <rect x="502" y="402" width="76" height="40" rx="4" fill="#ddf4ef" stroke="#087f73" stroke-width="1.4"/>
  <text x="540" y="427" text-anchor="middle" font-size="14" font-weight="700" fill="#065f56">5 ✓留</text>

  <rect x="588" y="402" width="76" height="40" rx="4" fill="#ddf4ef" stroke="#087f73" stroke-width="1.4"/>
  <text x="626" y="427" text-anchor="middle" font-size="14" font-weight="700" fill="#065f56">4 ✓留</text>

  <rect x="674" y="402" width="76" height="40" rx="4" fill="#f7e7f2" stroke="#9a4b86" stroke-width="1.6"/>
  <text x="712" y="427" text-anchor="middle" font-size="14" font-weight="700" fill="#7a3a6a">4 ✓并列</text>

  <rect x="768" y="402" width="76" height="40" rx="4" fill="#fff0e9" stroke="#b54237" stroke-width="1.3" stroke-dasharray="4 3"/>
  <text x="806" y="427" text-anchor="middle" font-size="14" fill="#8f3229">1 ✗屏蔽</text>

  <!-- Cutoff divider between 4 and 1 -->
  <line x1="759" y1="398" x2="759" y2="448" stroke="#b54237" stroke-width="1.8" stroke-dasharray="4 3"/>
  <text x="502" y="472" font-size="13.5" fill="#4d5652">仅屏蔽 <tspan font-family="var(--font-mono)" font-weight="700">logits &lt; 4</tspan>，故并列两项 4 同时保留（共留 3 项）</text>
</svg>
