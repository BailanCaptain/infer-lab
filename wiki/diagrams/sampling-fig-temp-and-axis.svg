<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 540" width="900" height="540" role="img" aria-label="温度 T=0.5/1/2 概率分布对比与截断后区间抽签及指数噪声法图解" font-family="var(--font-sans)">
  <title>温度 T=0.5、1、2 对同一组 6 词分数的分布重塑，以及 top_k/top_p 截断后的 [0,1] 区间抽签与设备端 p_i/q_i 指数噪声法对照。</title>
  <desc>上半部分用三条对齐的 100% 比例色带对比 T=0.5、T=1、T=2 下固定 6 词（猫3、你2、看1、。0、我-1、喜欢-2）的概率变化，直观展现尾部随 T 增厚；下半部分左侧画出 T=1、top_k=3、top_p=0.8 重归一后的 [0, 0.731) 与 [0.731, 1] 区间轴与 u=0.42、u=0.85 落点，右侧对照加速卡真实执行的逐词指数噪声除法 argmax(p_i / q_i)。</desc>
  <defs>
    <marker id="sm-arr-t" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto">
      <path d="M 0 1.5 L 8.5 5 L 0 8.5 z" fill="#087f73"/>
    </marker>
    <marker id="sm-arr-i" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto">
      <path d="M 0 1.5 L 8.5 5 L 0 8.5 z" fill="#4c65b6"/>
    </marker>
  </defs>

  <text x="14" y="26" font-size="16" font-weight="700" fill="#17211f">一、温度 T 怎样重塑分布：固定 6 词顺序，T 越大尾部越厚</text>

  <!-- Word color legend -->
  <rect x="14" y="38" width="872" height="32" rx="6" fill="#ece9df" stroke="#d8d8cf" stroke-width="1"/>
  <rect x="28" y="47" width="14" height="14" rx="3" fill="#087f73"/>
  <text x="48" y="59" font-size="13.5" font-weight="700" fill="#17211f">猫 (3)</text>
  <rect x="112" y="47" width="14" height="14" rx="3" fill="#4c65b6"/>
  <text x="132" y="59" font-size="13.5" font-weight="700" fill="#17211f">你 (2)</text>
  <rect x="196" y="47" width="14" height="14" rx="3" fill="#c78300"/>
  <text x="216" y="59" font-size="13.5" font-weight="700" fill="#17211f">看 (1)</text>
  <rect x="280" y="47" width="14" height="14" rx="3" fill="#9a4b86"/>
  <text x="300" y="59" font-size="13.5" font-weight="700" fill="#17211f">。(0)</text>
  <rect x="364" y="47" width="14" height="14" rx="3" fill="#b54237"/>
  <text x="384" y="59" font-size="13.5" font-weight="700" fill="#17211f">我 (−1)</text>
  <rect x="458" y="47" width="14" height="14" rx="3" fill="#66716d"/>
  <text x="478" y="59" font-size="13.5" font-weight="700" fill="#17211f">喜欢 (−2)</text>
  <text x="872" y="59" text-anchor="end" font-size="13.5" fill="#4d5652">顺序恒不变 · 比值 = exp(Δz ÷ T)</text>

  <!-- Column labels -->
  <text x="14" y="92" font-size="13.5" font-weight="700" fill="#4d5652">温度档位</text>
  <text x="414" y="92" text-anchor="middle" font-size="13.5" font-weight="700" fill="#4d5652">6 词概率占比条（总宽 100%，按固定顺序排列）</text>
  <text x="884" y="92" text-anchor="end" font-size="13.5" font-weight="700" fill="#4d5652">猫÷你 / 尾3词合计</text>

  <!-- Row 1: T = 0.5 (bar x=114..714, width=600) -->
  <text x="14" y="122" font-size="14.5" font-family="var(--font-mono)" font-weight="700" fill="#065f56">T = 0.5</text>
  <text x="14" y="140" font-size="13" fill="#4d5652">拉大分差</text>
  <rect x="114" y="102" width="518.8" height="44" rx="4" fill="#087f73"/>
  <text x="373" y="129" text-anchor="middle" font-size="14" font-weight="700" fill="#ffffff">猫 86.5%</text>
  <rect x="632.8" y="102" width="70.2" height="44" fill="#4c65b6"/>
  <text x="668" y="129" text-anchor="middle" font-size="13.5" font-weight="700" fill="#ffffff">11.7%</text>
  <rect x="703" y="102" width="9.5" height="44" fill="#c78300"/>
  <rect x="712.5" y="102" width="1.5" height="44" fill="#66716d"/>
  <text x="884" y="120" text-anchor="end" font-size="13.5" font-family="var(--font-mono)" font-weight="700" fill="#065f56">e² ≈ 7.4×</text>
  <text x="884" y="140" text-anchor="end" font-size="13.5" fill="#4d5652">尾 3 词 0.25%</text>

  <!-- Row 2: T = 1.0 -->
  <text x="14" y="178" font-size="14.5" font-family="var(--font-mono)" font-weight="700" fill="#3a4f93">T = 1.0</text>
  <text x="14" y="196" font-size="13" fill="#4d5652">原始分差</text>
  <rect x="114" y="158" width="380.2" height="44" rx="4" fill="#087f73"/>
  <text x="304" y="185" text-anchor="middle" font-size="14" font-weight="700" fill="#ffffff">猫 63.4%</text>
  <rect x="494.2" y="158" width="139.9" height="44" fill="#4c65b6"/>
  <text x="564" y="185" text-anchor="middle" font-size="13.5" font-weight="700" fill="#ffffff">你 23.3%</text>
  <rect x="634.1" y="158" width="51.5" height="44" fill="#c78300"/>
  <text x="660" y="185" text-anchor="middle" font-size="13" font-weight="700" fill="#ffffff">8.6%</text>
  <rect x="685.6" y="158" width="18.9" height="44" fill="#9a4b86"/>
  <rect x="704.5" y="158" width="7" height="44" fill="#b54237"/>
  <rect x="711.5" y="158" width="2.5" height="44" fill="#66716d"/>
  <text x="884" y="176" text-anchor="end" font-size="13.5" font-family="var(--font-mono)" font-weight="700" fill="#3a4f93">e ≈ 2.7×</text>
  <text x="884" y="196" text-anchor="end" font-size="13.5" fill="#4d5652">尾 3 词 4.7%</text>

  <!-- Row 3: T = 2.0 -->
  <text x="14" y="234" font-size="14.5" font-family="var(--font-mono)" font-weight="700" fill="#8f3229">T = 2.0</text>
  <text x="14" y="252" font-size="13" fill="#4d5652">压平增尾</text>
  <rect x="114" y="214" width="248" height="44" rx="4" fill="#087f73"/>
  <text x="238" y="241" text-anchor="middle" font-size="14" font-weight="700" fill="#ffffff">猫 41.4%</text>
  <rect x="362" y="214" width="151" height="44" fill="#4c65b6"/>
  <text x="437" y="241" text-anchor="middle" font-size="13.5" font-weight="700" fill="#ffffff">你 25.1%</text>
  <rect x="513" y="214" width="91" height="44" fill="#c78300"/>
  <text x="558" y="241" text-anchor="middle" font-size="13.5" font-weight="700" fill="#ffffff">看 15.2%</text>
  <rect x="604" y="214" width="55" height="44" fill="#9a4b86"/>
  <text x="631" y="241" text-anchor="middle" font-size="13" font-weight="700" fill="#ffffff">9.2%</text>
  <rect x="659" y="214" width="34" height="44" fill="#b54237"/>
  <rect x="693" y="214" width="21" height="44" fill="#66716d"/>
  <text x="884" y="232" text-anchor="end" font-size="13.5" font-family="var(--font-mono)" font-weight="700" fill="#8f3229">e⁰·⁵ ≈ 1.65×</text>
  <text x="884" y="252" text-anchor="end" font-size="13.5" font-weight="700" fill="#8f3229">尾 3 词 18.2%</text>

  <!-- T=0 / eps / all_greedy guardrail bar -->
  <rect x="14" y="268" width="872" height="32" rx="6" fill="#fff4cf" stroke="#c78300" stroke-width="1.2"/>
  <text x="450" y="289" text-anchor="middle" font-size="13.5" fill="#17211f"><tspan font-weight="700" fill="#936300">工程边界：</tspan><tspan font-family="var(--font-mono)" font-weight="700">T = 0</tspan> 直接 greedy（不做除法）；<tspan font-family="var(--font-mono)" font-weight="700">0 &lt; T &lt; 0.01</tspan> 抬至 <tspan font-family="var(--font-mono)" font-weight="700">0.01</tspan> 防溢出；仅整批全 greedy（<tspan font-family="var(--font-mono)" font-weight="700">all_greedy</tspan>）早退</text>

  <line x1="14" y1="312" x2="886" y2="312" stroke="#b8bcb5" stroke-width="1.3" stroke-dasharray="6 4"/>

  <text x="14" y="338" font-size="16" font-weight="700" fill="#17211f">二、截断后怎样抽签：区间数轴直觉 vs 加速卡指数噪声法（pᵢ ÷ qᵢ）</text>

  <!-- Left panel: [0, 1] sampling axis -->
  <rect x="14" y="352" width="432" height="176" rx="10" fill="#ffffff" stroke="#b8bcb5" stroke-width="1.3"/>
  <text x="28" y="376" font-size="14.5" font-weight="700" fill="#17211f">数学直觉：[0, 1] 区间落点（T=1, top_k=3, top_p=0.8）</text>

  <!-- Drop arrows u=0.42 and u=0.85 -->
  <text x="194" y="400" text-anchor="middle" font-size="13.5" font-family="var(--font-mono)" font-weight="700" fill="#065f56">u = 0.42 → 猫</text>
  <line x1="194" y1="406" x2="194" y2="432" stroke="#087f73" stroke-width="2" marker-end="url(#sm-arr-t)"/>

  <text x="362" y="400" text-anchor="middle" font-size="13.5" font-family="var(--font-mono)" font-weight="700" fill="#3a4f93">u = 0.85 → 你</text>
  <line x1="362" y1="406" x2="362" y2="432" stroke="#4c65b6" stroke-width="2" marker-end="url(#sm-arr-i)"/>

  <!-- Axis bar: x=30..420, width=390; 0.731 * 390 = 285 -->
  <rect x="30" y="436" width="285" height="38" rx="4" fill="#ddf4ef" stroke="#087f73" stroke-width="1.5"/>
  <text x="172" y="460" text-anchor="middle" font-size="14" font-weight="700" fill="#065f56">猫 · 0.731</text>

  <rect x="315" y="436" width="105" height="38" rx="4" fill="#e8edff" stroke="#4c65b6" stroke-width="1.5"/>
  <text x="367" y="460" text-anchor="middle" font-size="14" font-weight="700" fill="#3a4f93">你 · 0.269</text>

  <!-- Axis ticks -->
  <text x="30" y="492" text-anchor="middle" font-size="13" font-family="var(--font-mono)" fill="#4d5652">0</text>
  <text x="315" y="492" text-anchor="middle" font-size="13" font-family="var(--font-mono)" font-weight="700" fill="#17211f">0.731</text>
  <text x="420" y="492" text-anchor="middle" font-size="13" font-family="var(--font-mono)" fill="#4d5652">1.0</text>
  <text x="230" y="516" text-anchor="middle" font-size="13.5" fill="#4d5652">被截掉的 4 词概率 = 0（宽度 0，绝不中签）</text>

  <!-- Right panel: Device-side p_i / q_i -->
  <rect x="462" y="352" width="424" height="176" rx="10" fill="#e8edff" stroke="#4c65b6" stroke-width="1.4"/>
  <text x="476" y="376" font-size="14.5" font-weight="700" fill="#3a4f93">加速卡实做：逐词除以指数噪声 qᵢ ~ Exp(1) 取 argmax</text>

  <rect x="476" y="388" width="396" height="46" rx="6" fill="#ffffff" stroke="#4c65b6" stroke-width="1.1"/>
  <text x="488" y="407" font-size="13.5" font-weight="700" fill="#17211f">第 1 次：</text>
  <text x="548" y="407" font-size="13.5" font-family="var(--font-mono)" fill="#4d5652">猫 0.731÷1.30 = 0.562</text>
  <text x="548" y="426" font-size="13.5" font-family="var(--font-mono)" font-weight="700" fill="#3a4f93">你 0.269÷0.20 = 1.345  ★ 胜出「你」</text>

  <rect x="476" y="442" width="396" height="46" rx="6" fill="#ffffff" stroke="#087f73" stroke-width="1.1"/>
  <text x="488" y="461" font-size="13.5" font-weight="700" fill="#17211f">第 2 次：</text>
  <text x="548" y="461" font-size="13.5" font-family="var(--font-mono)" font-weight="700" fill="#065f56">猫 0.731÷0.50 = 1.462  ★ 胜出「猫」</text>
  <text x="548" y="480" font-size="13.5" font-family="var(--font-mono)" fill="#4d5652">你 0.269÷0.90 = 0.299</text>

  <text x="674" y="514" text-anchor="middle" font-size="13.5" fill="#17211f">数学上与区间法严格等价，避开 <tspan font-family="var(--font-mono)" font-weight="700">multinomial</tspan> 触发 NPU→CPU 同步</text>
</svg>
