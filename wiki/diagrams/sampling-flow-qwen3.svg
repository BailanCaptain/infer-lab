<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 680" width="880" height="680" role="img" aria-label="标准 Qwen3-8B（词表 151,936）在 vLLM V1 中的单步采样流水线：lm_head 产出 [B, 151936] 完整词表分数后，按需施加结构化语法掩码、重复惩罚与温度缩放，再走贪心 argmax 或 Top-k / Top-p 随机抽取，每条请求选出 1 个 next_token_id（无需强制执行 MTP 3 候选验证），由 output_rank 回传 EngineCore 执行 check_stop。">
  <title>标准 Qwen3-8B（词表 151,936）在 vLLM V1 中的单步采样流水线：lm_head 产出 [B, 151936] 完整词表分数后，按需施加结构化语法掩码、重复惩罚与温度缩放，再走贪心 argmax 或 Top-k / Top-p 随机抽取，每条请求选出 1 个 next_token_id（无需强制执行 MTP 3 候选验证），由 output_rank 回传 EngineCore 执行 check_stop。</title>
  <defs><marker id="sampling-flow-qwen3-ah-ink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="var(--color-ink, #17211f)"/></marker><marker id="sampling-flow-qwen3-ah-token" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="var(--color-token, #087f73)"/></marker><marker id="sampling-flow-qwen3-ah-comm" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="var(--color-comm, #9a4b86)"/></marker></defs>
  <path d="M20 566 L860 566" fill="none" stroke="var(--color-ink-muted, #66716d)" stroke-width="1.4" stroke-dasharray="6 5"/>
  <text x="20" y="556" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="13" font-weight="700" fill="var(--color-ink-muted, #66716d)">NPU Worker 进程（设备侧张量采样）</text>
  <text x="20" y="588" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="13" font-weight="700" fill="var(--color-ink-muted, #66716d)">EngineCore 进程（CPU 侧追加与停止判定）</text>
  <path d="M440 78 L440 108" fill="none" stroke="var(--color-ink, #17211f)" stroke-width="1.4" marker-end="url(#sampling-flow-qwen3-ah-ink)"/>
  <path d="M440 160 L440 190" fill="none" stroke="var(--color-ink, #17211f)" stroke-width="1.4" marker-end="url(#sampling-flow-qwen3-ah-ink)"/>
  <path d="M320 246 L320 266 L228 266 L228 286" fill="none" stroke="var(--color-ink, #17211f)" stroke-width="1.4" marker-end="url(#sampling-flow-qwen3-ah-ink)"/>
  <path d="M560 246 L560 266 L652 266 L652 286" fill="none" stroke="var(--color-ink, #17211f)" stroke-width="1.4" marker-end="url(#sampling-flow-qwen3-ah-ink)"/>
  <path d="M228 354 L228 374 L320 374 L320 394" fill="none" stroke="var(--color-token, #087f73)" stroke-width="1.4" marker-end="url(#sampling-flow-qwen3-ah-token)"/>
  <path d="M652 354 L652 374 L560 374 L560 394" fill="none" stroke="var(--color-token, #087f73)" stroke-width="1.4" marker-end="url(#sampling-flow-qwen3-ah-token)"/>
  <path d="M440 450 L440 480" fill="none" stroke="var(--color-comm, #9a4b86)" stroke-width="2.2" marker-end="url(#sampling-flow-qwen3-ah-comm)"/>
  <path d="M440 536 L440 598" fill="none" stroke="var(--color-ink, #17211f)" stroke-width="1.4" marker-end="url(#sampling-flow-qwen3-ah-ink)"/>
  <rect x="180" y="22" width="520" height="56" rx="8" fill="var(--color-weight-soft, #fff4cf)" stroke="var(--color-weight, #c78300)" stroke-width="1.4"/>
  <text x="440" y="46" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="14" font-weight="700" fill="var(--color-ink, #17211f)" text-anchor="middle">lm_head 输出完整词表分数 [B, 151936]</text>
  <text x="440" y="65" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="13" font-weight="400" fill="#936300" text-anchor="middle">TP=1 直接就绪；TP&gt;1 经 All-Gather 拼齐且各卡一致</text>
  <rect x="180" y="108" width="520" height="52" rx="8" fill="var(--color-control-soft, #f1efe8)" stroke="var(--color-line-strong, #b8bcb5)" stroke-width="1.4"/>
  <text x="440" y="130" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="14" font-weight="700" fill="var(--color-ink, #17211f)" text-anchor="middle">可选结构化语法掩码（apply_grammar_bitmask）</text>
  <text x="440" y="149" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="13" font-weight="400" fill="var(--color-ink-muted, #66716d)" text-anchor="middle">指定 JSON / 正则约束时将非法词位置为 −∞</text>
  <rect x="180" y="190" width="520" height="56" rx="8" fill="var(--color-control-soft, #f1efe8)" stroke="var(--color-control, #66716d)" stroke-width="1.4"/>
  <text x="440" y="214" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="14" font-weight="700" fill="var(--color-ink, #17211f)" text-anchor="middle">惩罚项与温度缩放（AscendSampler）</text>
  <text x="440" y="233" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="13" font-weight="400" fill="var(--color-ink-muted, #66716d)" text-anchor="middle">施加重复 / 频率惩罚；随机采样时 logits ÷ temperature</text>
  <rect x="36" y="286" width="384" height="68" rx="8" fill="var(--color-token-soft, #ddf4ef)" stroke="var(--color-token, #087f73)" stroke-width="1.4"/>
  <text x="228" y="316" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="14" font-weight="700" fill="var(--color-ink, #17211f)" text-anchor="middle">贪心采样（temperature = 0）</text>
  <text x="228" y="335" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="13" font-weight="400" fill="#065f56" text-anchor="middle">直接 argmax 取最高分词编号</text>
  <rect x="460" y="286" width="384" height="68" rx="8" fill="var(--color-token-soft, #ddf4ef)" stroke="var(--color-token, #087f73)" stroke-width="1.4"/>
  <text x="652" y="316" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="14" font-weight="700" fill="var(--color-ink, #17211f)" text-anchor="middle">随机采样（Top-k / Top-p 截断）</text>
  <text x="652" y="335" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="13" font-weight="400" fill="#065f56" text-anchor="middle">Softmax 过滤后除以指数噪声取 argmax</text>
  <rect x="180" y="394" width="520" height="56" rx="8" fill="var(--color-token-soft, #ddf4ef)" stroke="var(--color-token, #087f73)" stroke-width="1.4"/>
  <text x="440" y="418" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="14" font-weight="700" fill="var(--color-ink, #17211f)" text-anchor="middle">每条在途请求产出 1 个 next_token_id [B, 1]</text>
  <text x="440" y="437" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="13" font-weight="400" fill="#065f56" text-anchor="middle">TP 多卡随机种子同步故结果一致（开投机时另走候选验证）</text>
  <rect x="180" y="480" width="520" height="56" rx="8" fill="var(--color-comm-soft, #f5e6f0)" stroke="var(--color-comm, #9a4b86)" stroke-width="1.4"/>
  <text x="440" y="504" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="14" font-weight="700" fill="var(--color-ink, #17211f)" text-anchor="middle">仅 output_rank Worker 将采样结果交回引擎</text>
  <text x="440" y="523" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="13" font-weight="400" fill="#7a3a6a" text-anchor="middle">其余 TP 卡不重复回传，节省进程间通信</text>
  <rect x="180" y="598" width="520" height="60" rx="8" fill="var(--color-control-soft, #f1efe8)" stroke="var(--color-control, #66716d)" stroke-width="1.4"/>
  <text x="440" y="624" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="14" font-weight="700" fill="var(--color-ink, #17211f)" text-anchor="middle">追加新 token 并执行 check_stop 停止判定</text>
  <text x="440" y="643" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="13" font-weight="400" fill="var(--color-ink-muted, #66716d)" text-anchor="middle">命中 eos_token_id=151645、stop 词或 max_tokens 即收尾退块</text>
</svg>
