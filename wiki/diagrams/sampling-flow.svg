<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 760" width="880" height="760" role="img" aria-label="一台机器在一步里怎样完成采样（另一台机器同样如此，各管各的请求）。分数先在 8 张卡之间拼完整；相同采样实现、随机流和取数顺序使各卡选择一致，只有 0 号卡交回引擎。停止判断在引擎进程的 CPU 上做。R1 的提示词为 4 个 token（示意）">
  <title>一台机器在一步里怎样完成采样（另一台机器同样如此，各管各的请求）。分数先在 8 张卡之间拼完整；相同采样实现、随机流和取数顺序使各卡选择一致，只有 0 号卡交回引擎。停止判断在引擎进程的 CPU 上做。R1 的提示词为 4 个 token（示意）</title>
  <defs><marker id="sampling-flow-ah-ink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="var(--color-ink, #17211f)"/></marker></defs>
  <path d="M20 636 L860 636" fill="none" stroke="var(--color-ink-muted, #66716d)" stroke-width="1.4" stroke-dasharray="6 5"/>
  <text x="20" y="626" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="13" font-weight="700" fill="var(--color-ink-muted, #66716d)">8 张卡（NPU）</text>
  <text x="20" y="658" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="13" font-weight="700" fill="var(--color-ink-muted, #66716d)">引擎进程（CPU）</text>
  <path d="M440 78 L440 118" fill="none" stroke="var(--color-ink, #17211f)" stroke-width="1.4" marker-end="url(#sampling-flow-ah-ink)"/>
  <path d="M440 176 L440 216" fill="none" stroke="var(--color-ink, #17211f)" stroke-width="1.4" marker-end="url(#sampling-flow-ah-ink)"/>
  <path d="M320 274 L320 296 L220 296 L220 318" fill="none" stroke="var(--color-ink, #17211f)" stroke-width="1.4" marker-end="url(#sampling-flow-ah-ink)"/>
  <path d="M560 274 L560 296 L660 296 L660 318" fill="none" stroke="var(--color-ink, #17211f)" stroke-width="1.4" marker-end="url(#sampling-flow-ah-ink)"/>
  <path d="M220 388 L220 412 L320 412 L320 436" fill="none" stroke="var(--color-ink, #17211f)" stroke-width="1.4" marker-end="url(#sampling-flow-ah-ink)"/>
  <path d="M660 388 L660 412 L560 412 L560 436" fill="none" stroke="var(--color-ink, #17211f)" stroke-width="1.4" marker-end="url(#sampling-flow-ah-ink)"/>
  <path d="M320 498 L320 522 L220 522 L220 546" fill="none" stroke="var(--color-ink, #17211f)" stroke-width="1.4" marker-end="url(#sampling-flow-ah-ink)"/>
  <path d="M560 498 L560 522 L660 522 L660 546" fill="none" stroke="var(--color-ink, #17211f)" stroke-width="1.4" marker-end="url(#sampling-flow-ah-ink)"/>
  <path d="M220 608 L220 656 L320 656 L320 676" fill="none" stroke="var(--color-ink, #17211f)" stroke-width="1.4" marker-end="url(#sampling-flow-ah-ink)"/>
  <rect x="200" y="20" width="480" height="58" rx="8" fill="var(--color-weight, #c78300)" stroke="var(--color-ink, #17211f)" stroke-width="1.5"/>
  <text x="440" y="45" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="14" font-weight="700" fill="var(--color-ink-inverse, #ffffff)" text-anchor="middle">前向结束：每张卡算 19360 个词的分数</text>
  <text x="440" y="64" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="13" font-weight="400" fill="var(--color-ink-inverse, #ffffff)" text-anchor="middle">词表投影按词表切成 8 份</text>
  <rect x="200" y="118" width="480" height="58" rx="8" fill="var(--color-comm, #9a4b86)" stroke="var(--color-ink, #17211f)" stroke-width="1.5"/>
  <text x="440" y="143" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="14" font-weight="700" fill="var(--color-ink-inverse, #ffffff)" text-anchor="middle">TP8 All-Gather：拼出完整的 154880 个分数</text>
  <text x="440" y="162" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="13" font-weight="400" fill="var(--color-ink-inverse, #ffffff)" text-anchor="middle">8 张卡手里的分数完全相同</text>
  <rect x="200" y="216" width="480" height="58" rx="8" fill="var(--color-surface-sunken, #ece9df)" stroke="var(--color-ink, #17211f)" stroke-width="1.5"/>
  <text x="440" y="250" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="14" font-weight="700" fill="var(--color-ink, #17211f)" text-anchor="middle">这条请求这一步带着 MTP 候选吗？</text>
  <rect x="20" y="318" width="400" height="70" rx="8" fill="var(--color-token, #087f73)" stroke="var(--color-ink, #17211f)" stroke-width="1.5"/>
  <text x="220" y="349" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="14" font-weight="700" fill="var(--color-ink-inverse, #ffffff)" text-anchor="middle">没有：普通采样</text>
  <text x="220" y="368" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="13" font-weight="400" fill="var(--color-ink-inverse, #ffffff)" text-anchor="middle">每条请求取 1 行 · R1 第 1 步</text>
  <rect x="460" y="318" width="400" height="70" rx="8" fill="var(--color-token, #087f73)" stroke="var(--color-ink, #17211f)" stroke-width="1.5"/>
  <text x="660" y="349" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="14" font-weight="700" fill="var(--color-ink-inverse, #ffffff)" text-anchor="middle">有：验证候选</text>
  <text x="660" y="368" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="13" font-weight="400" fill="var(--color-ink-inverse, #ffffff)" text-anchor="middle">每条请求取 1 + 3 行 · R1 第 2 步起</text>
  <rect x="200" y="436" width="480" height="62" rx="8" fill="var(--color-control, #66716d)" stroke="var(--color-ink, #17211f)" stroke-width="1.5"/>
  <text x="440" y="463" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="14" font-weight="700" fill="var(--color-ink-inverse, #ffffff)" text-anchor="middle">8 张卡保持相同随机流与取数顺序</text>
  <text x="440" y="482" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="13" font-weight="400" fill="var(--color-ink-inverse, #ffffff)" text-anchor="middle">改分数 → greedy，或 ÷T、截断、指数噪声抽取</text>
  <rect x="20" y="546" width="400" height="62" rx="8" fill="var(--color-token, #087f73)" stroke="var(--color-ink, #17211f)" stroke-width="1.5"/>
  <text x="220" y="573" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="14" font-weight="700" fill="var(--color-ink-inverse, #ffffff)" text-anchor="middle">0 号卡把结果交回引擎</text>
  <text x="220" y="592" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="13" font-weight="400" fill="var(--color-ink-inverse, #ffffff)" text-anchor="middle">其余 7 张卡不回传</text>
  <rect x="460" y="546" width="400" height="62" rx="8" fill="var(--color-token-soft, #ddf4ef)" stroke="var(--color-token, #087f73)" stroke-opacity="0.4" stroke-width="1.5" stroke-dasharray="5 4"/>
  <text x="660" y="573" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="13" font-weight="400" fill="#065f56" text-anchor="middle">每张卡留着结果，接着做 MTP 草拟</text>
  <text x="660" y="592" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="13" font-weight="400" fill="#065f56" text-anchor="middle">草拟每遍都取最高分</text>
  <rect x="200" y="676" width="480" height="62" rx="8" fill="var(--color-control, #66716d)" stroke="var(--color-ink, #17211f)" stroke-width="1.5"/>
  <text x="440" y="703" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="14" font-weight="700" fill="var(--color-ink-inverse, #ffffff)" text-anchor="middle">逐个追加 token，检查停止条件</text>
  <text x="440" y="722" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="13" font-weight="400" fill="var(--color-ink-inverse, #ffffff)" text-anchor="middle">结束 token、停止 token、长度上限</text>
</svg>
