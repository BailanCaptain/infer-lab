caption: 一台机器在一步里怎样完成采样（另一台机器同样如此，各管各的请求）。分数先在 8 张卡之间拼完整；相同采样实现、随机流和取数顺序使各卡选择一致，只有 0 号卡交回引擎。停止判断在引擎进程的 CPU 上做。R1 的提示词为 4 个 token（示意）。
