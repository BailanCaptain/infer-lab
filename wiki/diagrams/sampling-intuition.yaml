layout: figure
id: sampling-intuition
caption: 接在「我 喜欢」后面，词表只有 6 个词（示意），按分数从高到低排。随机那一路：分数先除以 temperature（这里 T = 1，数不变），softmax 换成加起来等于 1 的概率；top-k = 3、top-p = 0.8 截掉尾部，剩下的两个词重新归一，最后按概率抽一个。greedy 那一路不算概率，直接取分数最高的词
size: [880, 470]
