id: sequence-parallel-layer
caption: >-
  Megatron 序列并行（SP）在 TP2 单子层前向中的行/通道切分转换（4 个 token、隐藏宽 H 示意）：① 子层入口 SP 区按 token 行平分（每卡 2 行 × 完整 H 维），本地独立做残差与 RMSNorm；经 All-Gather 拼齐 4 行后进入 ② TP 区，各卡用列切权重、本地头/激活与行切权重算出 4 行的 H 维部分和；再经 Reduce-Scatter 求和并重按行切回 ③ 下一子层 SP 入口（Attention 与 MLP 各走一轮）。
