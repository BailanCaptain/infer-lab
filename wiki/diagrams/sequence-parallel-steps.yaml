      cells: [{ at: [0, 0], text: '1' }, { at: [0, 1], text: '3' }, { at: [1, 0], text: '3' }, { at: [1, 1], text: '1' },
              { at: [2, 0], text: '2' }, { at: [2, 1], text: '2' }, { at: [3, 0], text: '8' }, { at: [3, 1], text: '15' }] }
  # 发之前：卡 1 的部分和
  - { at: [649, 52], rows: 4, cols: 2, cell: [40, 28], tone: token, style: faded, label: 卡 1,
      rowLabels: [token 0, token 1, token 2, token 3],
