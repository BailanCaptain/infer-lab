layout: figure
id: sequence-parallel-steps
caption: 两张卡、4 个 token、隐藏维 H=2，一行是一个 token 的两个数。第 1 步 Reduce-Scatter：token 0、1 的两份部分和在卡 0 相加，token 2、3 的两份在卡 1 相加，之后每张卡只留 2 行；第 2 步每张卡只对自己那两行做 RMSNorm，不通信；第 3 步 All-Gather 把各自算好的两行发给对方，两张卡都拼回完整的 4 行。紫色箭头是经过通信送来的块，灰色虚线是本卡自己的那块，不用发。数值采用 γ=1、ε=0 的数学示意；相同数学结果不保证真实浮点实现逐 bit 相同。
size: [880, 1026]
frames:
  - { label: 发之前：两张卡各有一份行切得到的部分和，一行一个 token, at: [8, 30], size: [864, 170] }
  - { label: 第 1 步 Reduce-Scatter：token 0、1 在卡 0 相加，token 2、3 在卡 1 相加, at: [8, 238], size: [864, 212] }
  - { label: 第 2 步 本卡计算：各自对自己的两行做 RMSNorm，不通信, at: [8, 488], size: [864, 114] }
  - { label: 第 3 步 All-Gather：把算好的两行发给对方，拼回 4 行, at: [8, 640], size: [864, 170] }
  - { label: 发之后：两张卡都有 4 行归一化结果，和只用 TP 时一样, at: [8, 848], size: [864, 170] }
grids:
  # 发之前：卡 0 的部分和
