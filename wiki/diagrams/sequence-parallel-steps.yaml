  # 第 2 步：卡 1 的两行
  - { at: [509, 510], rows: 2, cols: 2, cell: [40, 28], tone: token, style: faded,
      rowLabels: [token 2, token 3],
      cells: [{ at: [0, 0], text: '5' }, { at: [0, 1], text: '5' }, { at: [1, 0], text: '17' }, { at: [1, 1], text: '31' }] }
  # 第 2 步之后：卡 1 两行的 RMSNorm 结果
  - { at: [781, 510], rows: 2, cols: 2, cell: [40, 28], tone: token, style: solid, label: 卡 1,
      cells: [{ at: [0, 0], text: '1' }, { at: [0, 1], text: '1' }, { at: [1, 0], text: '0.68' }, { at: [1, 1], text: '1.24' }] }
  # 第 3 步：卡 0 自己算好的 token 0、1
