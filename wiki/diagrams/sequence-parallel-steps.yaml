  # 第 1 步：卡 1 自己 token 2、3 的部分和
  - { at: [509, 260], rows: 2, cols: 2, cell: [40, 28], tone: token, style: faded, label: 卡 1 自己的,
      rowLabels: [token 2, token 3],
      cells: [{ at: [0, 0], text: '3' }, { at: [0, 1], text: '3' }, { at: [1, 0], text: '9' }, { at: [1, 1], text: '16' }] }
  # 第 1 步：卡 0 发来 token 2、3 的部分和
  - { at: [509, 356], rows: 2, cols: 2, cell: [40, 28], tone: token, style: faded, label: 卡 0 发来的,
