              { at: [2, 0], text: '3' }, { at: [2, 1], text: '3' }, { at: [3, 0], text: '9' }, { at: [3, 1], text: '16' }] }
  # 第 1 步：卡 0 自己 token 0、1 的部分和
  - { at: [77, 260], rows: 2, cols: 2, cell: [40, 28], tone: token, style: faded, label: 卡 0 自己的,
      rowLabels: [token 0, token 1],
      cells: [{ at: [0, 0], text: '1' }, { at: [0, 1], text: '3' }, { at: [1, 0], text: '3' }, { at: [1, 1], text: '1' }] }
  # 第 1 步：卡 1 发来 token 0、1 的部分和
  - { at: [77, 356], rows: 2, cols: 2, cell: [40, 28], tone: token, style: faded, label: 卡 1 发来的,
      rowLabels: [token 0, token 1],
      cells: [{ at: [0, 0], text: '0' }, { at: [0, 1], text: '4' }, { at: [1, 0], text: '4' }, { at: [1, 1], text: '0' }] }
  # 第 1 步之后：卡 0 只留 token 0、1 的和
  - { at: [349, 260], rows: 2, cols: 2, cell: [40, 28], tone: token, style: solid, label: 卡 0,
