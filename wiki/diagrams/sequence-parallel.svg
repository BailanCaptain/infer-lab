<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 420" width="880" height="420" role="img" aria-label="两张卡、4 个 token，一个格子行是一个 token 的隐藏向量。上：只用 TP，行切之后的 All-Reduce 让两张卡都拿到同样的 4 行，残差相加和 RMSNorm 在两张卡上各做一遍。下：TP + SP 把这次 All-Reduce 拆成两半，Reduce-Scatter 之后卡 0 只留前 2 行、卡 1 只留后 2 行，各算各的；到下一对矩阵之前再 All-Gather 拼回 4 行。虚线格是这张卡此刻没有的行。">
  <title>两张卡、4 个 token，一个格子行是一个 token 的隐藏向量。上：只用 TP，行切之后的 All-Reduce 让两张卡都拿到同样的 4 行，残差相加和 RMSNorm 在两张卡上各做一遍。下：TP + SP 把这次 All-Reduce 拆成两半，Reduce-Scatter 之后卡 0 只留前 2 行、卡 1 只留后 2 行，各算各的；到下一对矩阵之前再 All-Gather 拼回 4 行。虚线格是这张卡此刻没有的行。</title>
