layout: figure
id: short-request-first-flow
caption: 调度器每一步先给 running 续上，再用剩余预算接纳等待的请求。短请求优先换掉的只有中间那一块：从三条车道里按固定次序选出一条，看一眼它的队头并记住这条车道；之后截预算、借 KV 块都照上游原样，借到了就从记住的车道取走，借不到这一步就不再接纳新请求。
size: [900, 820]
frames:
  - { label: 短请求优先换掉的只有这一块：等待队列, at: [16, 196], size: [868, 250] }
items:
  - { at: [220, 16], size: [440, 60], text: 调度器一步的开头：先给 running 续上, sub: 还有剩余预算、running 未满上限，才看等待的请求, tone: control }
  - { at: [220, 112], size: [440, 52], text: 挂起队列里有请求吗？, sub: 等远端 KV、等输出格式规则的请求, style: plain }
  - { at: [684, 112], size: [200, 52], text: 有：先看挂起队列, sub: 排在三条车道之前, style: plain }
  - { at: [32, 212], size: [168, 56], text: 被抢占的请求, sub: 退回等待，重新分车道, style: plain }
  - { at: [220, 216], size: [440, 48], text: 恢复车道有人吗？, style: plain }
  - { at: [684, 212], size: [184, 56], text: 有：取恢复车道, sub: 被抢占、算过一部分的, tone: token }
  - { at: [220, 292], size: [440, 48], text: 长车道队头等够门槛，且短车道有人吗？, style: plain }
  - { at: [684, 288], size: [184, 56], text: 是：取长车道队头, sub: 等待门槛默认 0，不触发, tone: token, style: faded }
  - { at: [220, 368], size: [440, 48], text: 短车道有人吗？, style: plain }
  - { at: [684, 364], size: [184, 56], text: 有：取短车道, sub: 提示词 ≤ 门槛（默认 256）, tone: token }
  - { at: [32, 364], size: [168, 56], text: 没有：取长车道, sub: 提示词 > 门槛, tone: token, style: faded }
  - { at: [220, 476], size: [440, 60], text: 看一眼选中车道的队头，记住这条车道, sub: 取走时从记住的车道拿，不会看一条、拿另一条, style: plain }
  - { at: [220, 566], size: [440, 60], text: 上游照常：截到剩余预算，借 KV 块, sub: 这一段算多少由 chunked prefill 定, tone: kv, style: plain }
  - { at: [220, 656], size: [440, 48], text: 这条请求借到块了吗？, style: plain }
  - { at: [16, 740], size: [300, 60], text: 借不到：这一步不再接纳新请求, sub: 它留在车道队头，下一步再试, tone: danger }
  - { at: [584, 740], size: [300, 60], text: 借到了：从记住的车道取走, sub: 扣预算；有余量、running 未满就看下一条, tone: token }
