<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 230" width="900" height="230" role="img" aria-label="先到两条 1024 个 token 的长问题，再到 8 条 37 个 token 的短问题。先到先得时，第 1 步被两条长的占满，短的等到第 2 步；短请求优先时，短的先挑走 296 个名额，第 1 步就吐出第一个 token，长 B 这一步只算到 728 个">
  <title>先到两条 1024 个 token 的长问题，再到 8 条 37 个 token 的短问题。先到先得时，第 1 步被两条长的占满，短的等到第 2 步；短请求优先时，短的先挑走 296 个名额，第 1 步就吐出第一个 token，长 B 这一步只算到 728 个</title>
  <defs></defs>
  <rect x="150" y="76" width="348.2" height="34" rx="4" fill="var(--color-control, #66716d)" stroke="var(--color-ink, #17211f)" stroke-width="1.3"/>
  <text x="166" y="98" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="13" font-weight="700" fill="var(--color-ink-inverse, #ffffff)">长 A 1024</text>
  <rect x="498.2" y="76" width="348.2" height="34" rx="4" fill="var(--color-control, #66716d)" stroke="var(--color-ink, #17211f)" stroke-width="1.3"/>
  <text x="514.2" y="98" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="13" font-weight="700" fill="var(--color-ink-inverse, #ffffff)">长 B 1024</text>
  <rect x="150" y="156" width="100.6" height="34" rx="4" fill="var(--color-token, #087f73)" stroke="var(--color-ink, #17211f)" stroke-width="1.3"/>
  <text x="166" y="178" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="13" font-weight="700" fill="var(--color-ink-inverse, #ffffff)">8 条短 296</text>
  <rect x="250.6" y="156" width="348.2" height="34" rx="4" fill="var(--color-control, #66716d)" stroke="var(--color-ink, #17211f)" stroke-width="1.3"/>
  <text x="266.6" y="178" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="13" font-weight="700" fill="var(--color-ink-inverse, #ffffff)">长 A 1024</text>
  <rect x="598.8" y="156" width="247.5" height="34" rx="4" fill="var(--color-control, #66716d)" stroke="var(--color-ink, #17211f)" stroke-width="1.3"/>
  <text x="614.8" y="178" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="13" font-weight="700" fill="var(--color-ink-inverse, #ffffff)">长 B 728</text>
  <text x="30" y="40" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="14" font-weight="700" fill="var(--color-ink, #17211f)">第 1 步的 2048 个名额给了谁</text>
  <text x="30" y="97" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="13.5" font-weight="700" fill="var(--color-ink, #17211f)">先到先得</text>
  <text x="30" y="177" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="13.5" font-weight="700" fill="var(--color-ink, #17211f)">短请求优先</text>
</svg>
