<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 365" width="900" height="365" role="img" aria-label="抽象准入算例：预算16，阈值2，允许任意分片且无其他资源约束。A/B各8，C/D各2；先选短输入后，B本轮只处理4个位置。不是GLM实际分片配置。">
  <title>抽象准入算例：预算16，阈值2，允许任意分片且无其他资源约束。A/B各8，C/D各2；先选短输入后，B本轮只处理4个位置。不是GLM实际分片配置。</title>
  <defs><pattern id="short-request-first-hatch" width="7" height="7" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="7" height="7" fill="var(--color-surface-sunken, #ece9df)"/><line x1="0" y1="0" x2="0" y2="7" stroke="var(--color-ink-muted, #66716d)" stroke-width="2"/></pattern></defs>
  <rect x="160" y="72" width="328" height="34" rx="4" fill="var(--color-token, #087f73)" stroke="var(--color-ink, #17211f)" stroke-width="1.3"/>
  <text x="176" y="94" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="13" font-weight="700" fill="var(--color-ink-inverse, #ffffff)">A · 8</text>
  <rect x="488" y="72" width="328" height="34" rx="4" fill="url(#short-request-first-hatch)" stroke="var(--color-ink-muted, #66716d)" stroke-width="1.3"/>
  <text x="504" y="94" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="13" font-weight="700" fill="var(--color-ink, #17211f)">B · 8</text>
  <rect x="160" y="172" width="82" height="34" rx="4" fill="var(--color-token, #087f73)" stroke="var(--color-ink, #17211f)" stroke-width="1.3"/>
  <text x="176" y="194" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="13" font-weight="700" fill="var(--color-ink-inverse, #ffffff)">C · 2</text>
  <rect x="242" y="172" width="82" height="34" rx="4" fill="var(--color-token, #087f73)" stroke="var(--color-ink, #17211f)" stroke-width="1.3"/>
  <text x="258" y="194" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="13" font-weight="700" fill="var(--color-ink-inverse, #ffffff)">D · 2</text>
  <rect x="324" y="172" width="328" height="34" rx="4" fill="var(--color-token, #087f73)" stroke="var(--color-ink, #17211f)" stroke-width="1.3"/>
  <text x="340" y="194" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="13" font-weight="700" fill="var(--color-ink-inverse, #ffffff)">A · 8</text>
  <rect x="652" y="172" width="164" height="34" rx="4" fill="url(#short-request-first-hatch)" stroke="var(--color-ink-muted, #66716d)" stroke-width="1.3"/>
  <text x="668" y="194" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="13" font-weight="700" fill="var(--color-ink, #17211f)">B · 4</text>
  <text x="30" y="35" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="13.5" font-weight="700" fill="var(--color-ink, #17211f)">同一轮的 16 个输入位置预算</text>
  <text x="30" y="96" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="13.5" font-weight="400" fill="var(--color-ink, #17211f)">先到先服务</text>
  <text x="30" y="196" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="13.5" font-weight="400" fill="var(--color-ink, #17211f)">短请求优先</text>
  <text x="160" y="140" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="13.5" font-weight="400" fill="var(--color-ink-muted, #66716d)" font-style="italic">后续等待：C 2、D 2</text>
  <text x="160" y="240" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="13.5" font-weight="400" fill="var(--color-ink-muted, #66716d)" font-style="italic">后续等待：B 剩余 4</text>
  <text x="450" y="322" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="13.5" font-weight="400" fill="var(--color-ink-muted, #66716d)" text-anchor="middle" font-style="italic">改变等待顺序；分片和缓存分配仍由调度器完成</text>
</svg>
