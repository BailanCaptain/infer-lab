layout: scene
id: short-request-first
caption: 上游的 schedule() 一行没改；换掉的只有 scheduler.waiting 这一个对象，它从一条队变成三条车道
size: [900, 600]

regions:
  - label: 上游 vLLM 的 schedule()
    note: 扫 waiting 队列那段循环只用 peek / pop 两个方法取请求，队列对象长什么样它不问——这正是不用改它一行的理由。
    at: [20, 24]
    size: [860, 168]
    tone: upstream
  - label: vllm-ascend 换进去的三车道队列
    note: 同一份 RequestQueue 契约，里面藏着三条用 create_request_queue 造出来的普通 FCFS 队列。
    at: [20, 246]
    size: [860, 280]
    tone: ascend

boxes:
  - at: [44, 108]
    size: [252, 68]
    title: 先看一眼队头
    sub: 不出队，先判断收不收
    fn: peek_request
    tone: upstream
    icon: queue
  - at: [316, 108]
    size: [252, 68]
    title: 收下才出队
    sub: 名额 = min(还差多少, 预算)
    fn: pop_request
    tone: upstream
    icon: pick
  - at: [588, 108]
    size: [268, 68]
    title: 队列由策略造出来
    sub: FCFS 时是一条 deque
    fn: create_request_queue
    tone: upstream
    icon: box
  - at: [420, 316]
    size: [436, 76]
    title: 分车道只看一个数
    sub: num_prompt_tokens 大于阈值就是 long
    fn: _classify_queue
    tone: ascend
    icon: split
  - at: [420, 408]
    size: [436, 76]
    title: 等够了才准插队
    sub: long_max_wait_ms 默认 0.0，也就是永不提升
    fn: _select_schedulable_queue
    tone: accent
    icon: clock

arrows:
  - { from: [298, 142], to: [314, 142], tone: upstream }
  - { from: [570, 142], to: [586, 142], tone: upstream }
  - { from: [366, 244], to: [366, 196], tone: ascend }

boundaries:
  - at: 218
    from: 20
    to: 880
    vertical: false
    label: 换掉的只有 scheduler.waiting 这一个引用

strips:
  - at: [52, 312]
    cells: 1
    cell: 34
    h: 34
    gap: 6
    highlight: 0
    tone: accent
    label: immediate · 被抢占的先回来
  - at: [52, 380]
    cells: 8
    cell: 34
    h: 34
    gap: 6
    highlights: [0, 1, 2, 3, 4, 5, 6, 7]
    tone: ascend
