  - at: [52, 448]
    cells: 1
    cell: 34
    h: 34
    gap: 6
    tone: muted
    label: long · 一条 5000 token 的长 prompt

notes:
  - at: [52, 520]
    text: 车道的长短表示排着几条，不表示 token 数。
    size: 12.5
    width: 340
  - at: [20, 552]
    text: 派发顺序 immediate > 等够了的 long > short > long。装上去有两条路：异步调度把 scheduler_cls 指到 ShortRequestFirstAsyncScheduler；同步调度一个字都不设，被 patch 换掉的那个默认 Scheduler 在构造时自己装。
    size: 12.5
    width: 860
    strong: true

