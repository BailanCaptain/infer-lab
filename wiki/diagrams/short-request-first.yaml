layout: figure
id: short-request-first
caption: 先到两条 1024 个 token 的长问题，再到 8 条 37 个 token 的短问题。先到先得时，第 1 步被两条长的占满，短的等到第 2 步；短请求优先时，短的先挑走 296 个名额，第 1 步就吐出第一个 token，长 B 这一步只算到 728 个
size: [900, 230]

texts:
  - { at: [30, 40], text: 第 1 步的 2048 个名额给了谁, size: 14, strong: true }
  - { at: [30, 97], text: 先到先得, size: 13.5, strong: true }
  - { at: [30, 177], text: 短请求优先, size: 13.5, strong: true }

bars:
  - at: [150, 76]
    h: 34
    scale: 0.34
    segments:
      - { value: 1024, tone: control, text: 长 A 1024 }
      - { value: 1024, tone: control, text: 长 B 1024 }
  - at: [150, 156]
    h: 34
    scale: 0.34
    segments:
      - { value: 296, tone: token, text: 8 条短 296 }
      - { value: 1024, tone: control, text: 长 A 1024 }
      - { value: 728, tone: control, text: 长 B 728 }

pins:
  - source: vllm@568afb3a:vllm/v1/core/sched/scheduler.py#L665-L693
    symbols: [peek_request, pop_request]
  - source: vllm-ascend@2ed6cbba:vllm_ascend/core/short_request_first_scheduler.py#L148-L153
    symbols: [_classify_queue, num_prompt_tokens]
  - source: vllm-ascend@2ed6cbba:vllm_ascend/core/short_request_first_scheduler.py#L155-L182
    symbols: [_select_schedulable_queue]
