<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 488" width="900" height="488" role="img" aria-label="Sleep Mode Level 1 与 Level 2 按 6 GiB 示意账的 HBM/CPU 显存释放恢复比例柱与 HCCL 通信锚点生命周期图" font-family="var(--font-sans)">
  <title>Sleep Mode：HBM / CPU 比例显存交接（6 GiB → 1 GiB → 3 GiB → 6 GiB）与 HCCL 通信锚点</title>
  <desc>Proportional stacked HBM and CPU memory bars across Running, Level 1 Sleep, Level 2 Sleep, wake_up(weights), and wake_up(kv_cache), plus HCCL _lifecycle_anchor_group lifespan bracket and NZ/expandable_segments guardrails</desc>
  <defs>
    <marker id="sm-arr-t" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="#087f73"/>
    </marker>
    <marker id="sm-arr-b" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="#4c65b6"/>
    </marker>
    <marker id="sm-arr-p" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="#9a4b86"/>
    </marker>
  </defs>

  <!-- UPPER BAND: Proportional HBM & CPU Stacked Bars (1 GiB = 26px; Baseline y=250, 6 GiB top y=94) -->
  <text x="14" y="26" font-size="16" font-weight="700" fill="#17211f">① HBM 与 CPU 内存去向（按每卡 6 GiB 示意账真实比例绘制：1 GiB = 26 px）</text>

  <!-- Legend -->
  <rect x="14" y="34" width="16" height="14" rx="3" fill="#fff4cf" stroke="#c78300" stroke-width="1.2"/>
  <text x="36" y="46" font-size="13.5" fill="#936300">weights 权重池（2 GiB）</text>
  <rect x="216" y="34" width="16" height="14" rx="3" fill="#e8edff" stroke="#4c65b6" stroke-width="1.2"/>
  <text x="238" y="46" font-size="13.5" fill="#3a4f93">kv_cache 缓存池（3 GiB）</text>
  <rect x="434" y="34" width="16" height="14" rx="3" fill="#ece9df" stroke="#8a928f" stroke-width="1.2"/>
  <text x="456" y="46" font-size="13.5" fill="#4d5652">持久 + 池外常驻（1 GiB）</text>
  <rect x="652" y="34" width="16" height="14" rx="3" fill="#ddf4ef" stroke="#087f73" stroke-width="1.2" stroke-dasharray="3 2"/>
  <text x="674" y="46" font-size="13.5" fill="#065f56">归还训练的 5 GiB 空间</text>

  <!-- Baseline axis -->
  <line x1="14" y1="250" x2="886" y2="250" stroke="#b8bcb5" stroke-width="1.3"/>

  <!-- State 1: Running (6 GiB) x=26, w=134 -->
  <text x="93" y="84" text-anchor="middle" font-size="14" font-weight="700" fill="#17211f">睡前运行中</text>
  <rect x="26" y="94" width="134" height="78" rx="4" fill="#e8edff" stroke="#4c65b6" stroke-width="1.4"/>
  <text x="93" y="138" text-anchor="middle" font-size="13.5" font-weight="700" fill="#3a4f93">KV 池 · 3 GiB</text>
  <rect x="26" y="172" width="134" height="52" rx="4" fill="#fff4cf" stroke="#c78300" stroke-width="1.4"/>
  <text x="93" y="203" text-anchor="middle" font-size="13.5" font-weight="700" fill="#936300">权重 · 2 GiB</text>
  <rect x="26" y="224" width="134" height="26" rx="3" fill="#ece9df" stroke="#8a928f" stroke-width="1.2"/>
  <text x="93" y="242" text-anchor="middle" font-size="13.5" fill="#4d5652">常驻 1 GiB</text>
  <text x="93" y="270" text-anchor="middle" font-size="13.5" font-weight="700" fill="#17211f">HBM 6.0 GiB</text>

  <!-- Arrow 1 -> 2A -->
  <path d="M 164 172 L 194 172" fill="none" stroke="#4c65b6" stroke-width="1.8" marker-end="url(#sm-arr-b)"/>

  <!-- State 2A: Level 1 Sleep x=200, w=146 -->
  <rect x="200" y="58" width="146" height="32" rx="5" fill="#e8edff" stroke="#4c65b6" stroke-width="1.4"/>
  <text x="273" y="79" text-anchor="middle" font-size="13.5" font-weight="700" fill="#3a4f93">CPU +2,048 MiB</text>
  <rect x="200" y="94" width="146" height="130" rx="4" fill="#ddf4ef" stroke="#087f73" stroke-width="1.4" stroke-dasharray="5 4"/>
  <text x="273" y="148" text-anchor="middle" font-size="14" font-weight="700" fill="#065f56">释放 5.0 GiB</text>
  <text x="273" y="170" text-anchor="middle" font-size="13.5" fill="#065f56">让给训练端</text>
  <text x="273" y="194" text-anchor="middle" font-size="13.5" fill="#4d5652">权重锁页备 CPU</text>
  <rect x="200" y="224" width="146" height="26" rx="3" fill="#ece9df" stroke="#8a928f" stroke-width="1.2"/>
  <text x="273" y="242" text-anchor="middle" font-size="13.5" fill="#4d5652">余 1.0 GiB</text>
  <text x="273" y="270" text-anchor="middle" font-size="13.5" font-weight="700" fill="#3a4f93">Level 1 睡后</text>

  <!-- State 2B: Level 2 Sleep x=366, w=146 -->
  <rect x="366" y="58" width="146" height="32" rx="5" fill="#fff4cf" stroke="#c78300" stroke-width="1.4"/>
  <text x="439" y="79" text-anchor="middle" font-size="13.5" font-weight="700" fill="#936300">CPU 仅 +16 MiB</text>
  <rect x="366" y="94" width="146" height="130" rx="4" fill="#ddf4ef" stroke="#087f73" stroke-width="1.4" stroke-dasharray="5 4"/>
  <text x="439" y="148" text-anchor="middle" font-size="14" font-weight="700" fill="#065f56">释放 5.0 GiB</text>
  <text x="439" y="170" text-anchor="middle" font-size="13.5" fill="#936300" font-weight="700">权重直接丢弃</text>
  <text x="439" y="194" text-anchor="middle" font-size="13.5" fill="#4d5652">仅留 buffers</text>
  <rect x="366" y="224" width="146" height="26" rx="3" fill="#ece9df" stroke="#8a928f" stroke-width="1.2"/>
  <text x="439" y="242" text-anchor="middle" font-size="13.5" fill="#4d5652">余 1.0 GiB</text>
  <text x="439" y="270" text-anchor="middle" font-size="13.5" font-weight="700" fill="#936300">Level 2 睡后</text>

  <!-- Arrow 2B -> 3 -->
  <path d="M 516 172 L 546 172" fill="none" stroke="#9a4b86" stroke-width="1.8" marker-end="url(#sm-arr-p)"/>

  <!-- State 3: wake_up(weights) x=552, w=148 -->
  <text x="626" y="84" text-anchor="middle" font-size="13.5" font-weight="700" fill="#7a3a6a">wake(["weights"])</text>
  <rect x="552" y="94" width="148" height="78" rx="4" fill="#ffffff" stroke="#b8bcb5" stroke-width="1.2" stroke-dasharray="4 3"/>
  <text x="626" y="138" text-anchor="middle" font-size="13.5" fill="#66716d">KV 尚未唤醒</text>
  <rect x="552" y="172" width="148" height="52" rx="4" fill="#f7e7f2" stroke="#9a4b86" stroke-width="1.5"/>
  <text x="626" y="194" text-anchor="middle" font-size="13.5" font-weight="700" fill="#7a3a6a">权重空间 2 GiB</text>
  <text x="626" y="214" text-anchor="middle" font-size="13.5" fill="#8f3229" font-weight="700">L2 须外部重载！</text>
  <rect x="552" y="224" width="148" height="26" rx="3" fill="#ece9df" stroke="#8a928f" stroke-width="1.2"/>
  <text x="626" y="242" text-anchor="middle" font-size="13.5" fill="#4d5652">常驻 1 GiB</text>
  <text x="626" y="270" text-anchor="middle" font-size="13.5" font-weight="700" fill="#7a3a6a">HBM 3.0 GiB</text>

  <!-- Arrow 3 -> 4 -->
  <path d="M 704 172 L 734 172" fill="none" stroke="#087f73" stroke-width="1.8" marker-end="url(#sm-arr-t)"/>

  <!-- State 4: wake_up(kv_cache) x=740, w=144 -->
  <text x="812" y="84" text-anchor="middle" font-size="13.5" font-weight="700" fill="#065f56">wake(["kv_cache"])</text>
  <rect x="740" y="94" width="144" height="78" rx="4" fill="#e8edff" stroke="#4c65b6" stroke-width="1.4"/>
  <text x="812" y="128" text-anchor="middle" font-size="13.5" font-weight="700" fill="#3a4f93">空 KV 池 3 GiB</text>
  <text x="812" y="150" text-anchor="middle" font-size="13.5" fill="#4d5652">旧历史已丢弃</text>
  <rect x="740" y="172" width="144" height="52" rx="4" fill="#fff4cf" stroke="#c78300" stroke-width="1.4"/>
  <text x="812" y="203" text-anchor="middle" font-size="13.5" font-weight="700" fill="#936300">就绪权重 2 GiB</text>
  <rect x="740" y="224" width="144" height="26" rx="3" fill="#ece9df" stroke="#8a928f" stroke-width="1.2"/>
  <text x="812" y="242" text-anchor="middle" font-size="13.5" fill="#4d5652">常驻 1 GiB</text>
  <text x="812" y="270" text-anchor="middle" font-size="13.5" font-weight="700" fill="#065f56">HBM 6.0 GiB</text>

  <line x1="14" y1="286" x2="886" y2="286" stroke="#b8bcb5" stroke-width="1.4" stroke-dasharray="6 5"/>

  <!-- LOWER BAND: HCCL Lifecycle Anchor Span & Guardrails -->
  <text x="14" y="314" font-size="16" font-weight="700" fill="#17211f">② v0.30.0 / main 额外清理通信锚点（_lifecycle_anchor_group）存活区间与两条硬前提</text>

  <!-- 4 Pipeline Steps on a track -->
  <rect x="14" y="330" width="194" height="44" rx="6" fill="#ece9df" stroke="#b8bcb5" stroke-width="1.3"/>
  <text x="111" y="357" text-anchor="middle" font-size="13.5" font-weight="700" fill="#17211f">1. 建锚点并拆业务组</text>
  <path d="M 208 352 L 234 352" fill="none" stroke="#087f73" stroke-width="1.7" marker-end="url(#sm-arr-t)"/>

  <rect x="240" y="330" width="194" height="44" rx="6" fill="#f7e7f2" stroke="#9a4b86" stroke-width="1.3"/>
  <text x="337" y="357" text-anchor="middle" font-size="13.5" font-weight="700" fill="#7a3a6a">2. wake weights + 重载</text>
  <path d="M 434 352 L 460 352" fill="none" stroke="#9a4b86" stroke-width="1.7" marker-end="url(#sm-arr-p)"/>

  <rect x="466" y="330" width="204" height="44" rx="6" fill="#ddf4ef" stroke="#087f73" stroke-width="1.4"/>
  <text x="568" y="357" text-anchor="middle" font-size="13.5" font-weight="700" fill="#065f56">3. wake kv_cache + 重建组/图</text>
  <path d="M 670 352 L 696 352" fill="none" stroke="#087f73" stroke-width="1.7" marker-end="url(#sm-arr-t)"/>

  <rect x="702" y="330" width="182" height="44" rx="6" fill="#e8edff" stroke="#4c65b6" stroke-width="1.3"/>
  <text x="793" y="357" text-anchor="middle" font-size="13.5" font-weight="700" fill="#3a4f93">4. 释放锚点 → 放行流量</text>

  <!-- Anchor Lifespan Bracket spanning Step 1 -> Step 3 end -->
  <path d="M 64 380 L 64 396 L 664 396 L 664 380" fill="none" stroke="#087f73" stroke-width="2"/>
  <rect x="150" y="384" width="430" height="24" rx="4" fill="#ddf4ef" stroke="#087f73" stroke-width="1.2"/>
  <text x="365" y="401" text-anchor="middle" font-size="13.5" font-weight="700" fill="#065f56">锚点组全程存活（防销毁最后 HCCL 组），至 kv_cache 恢复后释放</text>

  <!-- Two hard guardrails at bottom -->
  <rect x="14" y="420" width="424" height="54" rx="6" fill="#fff0e9" stroke="#b54237" stroke-width="1.3"/>
  <text x="28" y="443" font-size="13" font-weight="700" fill="#8f3229">✗ 禁 expandable_segments：</text>
  <text x="28" y="463" font-size="13" fill="#8f3229">与睡眠内存池冲突，建池即断言报错</text>

  <rect x="460" y="420" width="424" height="54" rx="6" fill="#fff0e9" stroke="#b54237" stroke-width="1.3"/>
  <text x="474" y="443" font-size="13" font-weight="700" fill="#8f3229">✗ 禁非零 weight_nz_mode：</text>
  <text x="474" y="463" font-size="13" fill="#8f3229">wake_up 明确拒收（须设 0 或开 rl_config）</text>
</svg>
