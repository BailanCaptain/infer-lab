<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 474" width="900" height="474" role="img" aria-label="Sleep Mode Level 1 CPU 卸载与 Level 2 丢弃重载及唤醒顺序与 HCCL 通信锚点图" font-family="var(--font-sans)">
  <title>Sleep Mode：Level 1 vs Level 2 显存去向、分标签唤醒协议与 v0.30.0 HCCL 通信锚点</title>
  <desc>关联源码符号：sleep, wake_up, weight_nz_mode, _lifecycle_anchor_group, _ensure_lifecycle_anchor, release_lifecycle_anchor, RlConfig, sleep_mode_extra_cleanup</desc>
  <defs>
    <marker id="sm-arr-t" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="#087f73"/>
    </marker>
    <marker id="sm-arr-p" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="#9a4b86"/>
    </marker>
  </defs>

  <!-- Zone 1: Level 1 vs Level 2 comparison -->
  <text x="16" y="28" font-size="16" font-weight="700" fill="#17211f">① Level 1 vs Level 2 睡眠对比（两级都丢弃旧 KV cache，都不清空持久与池外显存）</text>

  <rect x="16" y="44" width="424" height="148" rx="7" fill="#e8edff" stroke="#4c65b6" stroke-width="1.4"/>
  <text x="30" y="70" font-size="14.5" font-weight="700" fill="#3a4f93">Level 1 · 保留旧权重（适合同版权重暂停后恢复）</text>
  <text x="30" y="96" font-size="13.5" fill="#4d5652">• weights 池：先拷到 CPU pinned memory，再释放 HBM</text>
  <text x="30" y="118" font-size="13.5" fill="#4d5652">• kv_cache 池：直接释放 HBM（旧内容丢弃）</text>
  <text x="30" y="140" font-size="13.5" fill="#4d5652">• 示意账（6 GiB 池）：释放 5 GiB，CPU 增 2,048 MiB</text>
  <text x="30" y="164" font-size="13.5" font-weight="700" fill="#3a4f93">• 唤醒：wake_up() 将备份拷回 HBM 并重建 KV 空间</text>

  <rect x="460" y="44" width="424" height="148" rx="7" fill="#fff4cf" stroke="#c78300" stroke-width="1.4"/>
  <text x="474" y="70" font-size="14.5" font-weight="700" fill="#936300">Level 2 · 丢弃权重（适合 RL 训练后接收新权重）</text>
  <text x="474" y="96" font-size="13.5" fill="#4d5652">• weights 池：直接释放 HBM，不建全量 CPU 备份</text>
  <text x="474" y="118" font-size="13.5" fill="#4d5652">• 仅另存模型 named_buffers（main 另存省略参数）</text>
  <text x="474" y="140" font-size="13.5" fill="#4d5652">• 示意账（6 GiB 池）：释放 5 GiB，CPU 仅增 16 MiB</text>
  <text x="474" y="164" font-size="13.5" font-weight="700" fill="#936300">• 唤醒：只恢复空间与 buffers，必须外部重载参数</text>

  <line x1="16" y1="210" x2="884" y2="210" stroke="#b8bcb5" stroke-width="1.4" stroke-dasharray="6 5"/>

  <!-- Zone 2: Level 2 staged wakeup sequence -->
  <text x="16" y="238" font-size="16" font-weight="700" fill="#17211f">② Level 2 标准分阶段唤醒协议（期间调用方必须持续挡住新生成流量）</text>

  <rect x="16" y="254" width="194" height="90" rx="7" fill="#ddf4ef" stroke="#087f73" stroke-width="1.4"/>
  <text x="28" y="280" font-size="14" font-weight="700" fill="#065f56">1. 唤醒权重标签</text>
  <text x="28" y="304" font-size="13.5" fill="#4d5652">tags=["weights"]</text>
  <text x="28" y="326" font-size="13.5" fill="#065f56">恢复空间 + buffers</text>

  <line x1="212" y1="299" x2="238" y2="299" stroke="#087f73" stroke-width="1.7" marker-end="url(#sm-arr-t)"/>

  <rect x="242" y="254" width="204" height="90" rx="7" fill="#f7e7f2" stroke="#9a4b86" stroke-width="1.4"/>
  <text x="254" y="280" font-size="14" font-weight="700" fill="#7a3a6a">2. 外部重载 / 更新权重</text>
  <text x="254" y="304" font-size="13.5" fill="#4d5652">IPC / HCCL / RPC 重载</text>
  <text x="254" y="326" font-size="13.5" fill="#7a3a6a">省略则读到垃圾参数</text>

  <line x1="448" y1="299" x2="474" y2="299" stroke="#9a4b86" stroke-width="1.7" marker-end="url(#sm-arr-p)"/>

  <rect x="478" y="254" width="194" height="90" rx="7" fill="#e8edff" stroke="#4c65b6" stroke-width="1.4"/>
  <text x="490" y="280" font-size="14" font-weight="700" fill="#3a4f93">3. 唤醒缓存标签</text>
  <text x="490" y="304" font-size="13.5" fill="#4d5652">tags=["kv_cache"]</text>
  <text x="490" y="326" font-size="13.5" fill="#3a4f93">重建空 KV + 释放锚点</text>

  <line x1="674" y1="299" x2="700" y2="299" stroke="#087f73" stroke-width="1.7" marker-end="url(#sm-arr-t)"/>

  <rect x="704" y="254" width="180" height="90" rx="7" fill="#ece9df" stroke="#b8bcb5" stroke-width="1.4"/>
  <text x="716" y="280" font-size="14" font-weight="700" fill="#17211f">4. 核对并放行流量</text>
  <text x="716" y="304" font-size="13.5" fill="#4d5652">核 is_sleeping=False</text>
  <text x="716" y="326" font-size="13.5" fill="#4d5652">重算请求历史开始生成</text>

  <line x1="16" y1="362" x2="884" y2="362" stroke="#b8bcb5" stroke-width="1.4" stroke-dasharray="6 5"/>

  <!-- Zone 3: Guardrails & Lifecycle Anchor -->
  <text x="16" y="388" font-size="16" font-weight="700" fill="#17211f">③ v0.30.0 / main 关键护栏与 HCCL 通信锚点（sleep_lifecycle_anchor）</text>

  <rect x="16" y="402" width="424" height="62" rx="7" fill="#fff0e9" stroke="#b54237" stroke-width="1.3"/>
  <text x="30" y="426" font-size="14" font-weight="700" fill="#8f3229">两条硬前提：禁 expandable_segments + 关 NZ 布局</text>
  <text x="30" y="450" font-size="13.5" fill="#4d5652">可扩展段建池即断言失败；wake_up 拒非零 weight_nz_mode</text>

  <rect x="460" y="402" width="424" height="62" rx="7" fill="#ddf4ef" stroke="#087f73" stroke-width="1.3"/>
  <text x="474" y="426" font-size="14" font-weight="700" fill="#065f56">额外清理双开关 + _lifecycle_anchor_group 锚点</text>
  <text x="474" y="450" font-size="13.5" fill="#4d5652">拆 HCCL 业务组前建锚点防末组销毁，kv_cache 醒后释放</text>
</svg>
