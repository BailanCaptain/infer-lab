  <path d="M216 344 L216 372 L330 372 L330 400" fill="none" stroke="var(--color-weight, #c78300)" stroke-width="1.4" marker-end="url(#sleep-mode-flow-ah-weight)"/>
  <path d="M644 344 L644 372 L530 372 L530 400" fill="none" stroke="var(--color-weight, #c78300)" stroke-width="1.4" marker-end="url(#sleep-mode-flow-ah-weight)"/>
  <path d="M430 466 L430 536 L216 536 L216 608" fill="none" stroke="var(--color-control, #66716d)" stroke-width="1.4" marker-end="url(#sleep-mode-flow-ah-control)"/>
  <path d="M430 536 L644 536 L644 608" fill="none" stroke="var(--color-control, #66716d)" stroke-width="1.4" marker-end="url(#sleep-mode-flow-ah-control)"/>
