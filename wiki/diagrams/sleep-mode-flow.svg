<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 850" width="860" height="850" role="img" aria-label="vLLM 0fc695fc 与 Ascend db701c1f 的控制路径。sleep 在调度与 Worker 之间切换整台引擎的状态；分标签唤醒期间，调用方仍须阻止新请求进入。">
  <title>vLLM 0fc695fc 与 Ascend db701c1f 的控制路径。sleep 在调度与 Worker 之间切换整台引擎的状态；分标签唤醒期间，调用方仍须阻止新请求进入。</title>
  <defs><marker id="sleep-mode-flow-ah-control" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="var(--color-control, #66716d)"/></marker><marker id="sleep-mode-flow-ah-weight" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="var(--color-weight, #c78300)"/></marker></defs>
  <rect x="16" y="30" width="828" height="138" rx="16" fill="none" stroke="var(--color-line-strong, #b8bcb5)" stroke-width="1.5"/>
  <text x="32" y="18" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="15" font-weight="700" fill="var(--color-ink, #17211f)">主线位置：请求入口 → EngineCore 调度 → Worker 执行</text>
  <rect x="16" y="242" width="828" height="256" rx="16" fill="none" stroke="var(--color-line-strong, #b8bcb5)" stroke-width="1.5"/>
  <text x="32" y="230" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="15" font-weight="700" fill="var(--color-ink, #17211f)">显存分支：每个 NPUWorker 各处理本卡</text>
  <rect x="16" y="570" width="828" height="240" rx="16" fill="none" stroke="var(--color-line-strong, #b8bcb5)" stroke-width="1.5"/>
  <text x="32" y="558" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="15" font-weight="700" fill="var(--color-ink, #17211f)">恢复分支：调用方先确认训练已让出显存</text>
  <path d="M256 98 L320 98" fill="none" stroke="var(--color-control, #66716d)" stroke-width="1.4" marker-end="url(#sleep-mode-flow-ah-control)"/>
  <path d="M538 98 L600 98" fill="none" stroke="var(--color-control, #66716d)" stroke-width="1.4" marker-end="url(#sleep-mode-flow-ah-control)"/>
  <path d="M430 132 L430 208 L216 208 L216 276" fill="none" stroke="var(--color-control, #66716d)" stroke-width="1.4" marker-end="url(#sleep-mode-flow-ah-control)"/>
