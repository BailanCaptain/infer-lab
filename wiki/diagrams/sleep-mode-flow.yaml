layout: figure
id: sleep-mode-flow
caption: vLLM 0fc695fc 与 Ascend db701c1f 的控制路径。sleep 在调度与 Worker 之间切换整台引擎的状态；分标签唤醒期间，调用方仍须阻止新请求进入。
