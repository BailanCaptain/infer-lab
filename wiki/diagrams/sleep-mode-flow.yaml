  - { at: [468, 610], size: [352, 64], text: level 2：先唤醒 weights, sub: 外部重载后，再唤醒 kv_cache, tone: weight }
  - { at: [222, 734], size: [416, 50], text: 权重与缓存均就绪 → 放行下一批请求, tone: token }
