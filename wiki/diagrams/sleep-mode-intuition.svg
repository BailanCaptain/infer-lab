<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 626" width="860" height="626" role="img" aria-label="同一张 NPU 暂停推理后让出显存。level 1 的权重有 CPU 备份，level 2 的权重须从外部重装；两条路都丢弃旧 KV cache。图只画权重和缓存，其他常驻内存见正文。">
  <title>同一张 NPU 暂停推理后让出显存。level 1 的权重有 CPU 备份，level 2 的权重须从外部重装；两条路都丢弃旧 KV cache。图只画权重和缓存，其他常驻内存见正文。</title>
