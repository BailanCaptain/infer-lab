  <text x="645" y="446" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="13" font-weight="400" fill="var(--color-ink, #17211f)" text-anchor="middle">唤醒：先分配权重空间，再重载</text>
