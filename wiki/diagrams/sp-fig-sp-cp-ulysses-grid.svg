<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 448" width="900" height="448" role="img" aria-label="Megatron SP、Context Parallel（CP）与 DeepSpeed Ulysses 三者通信组与布局转换几何对照图" font-family="var(--font-sans)">
  <title>Megatron SP、CP 与 DeepSpeed Ulysses 几何对照：左侧以 4 卡（TP2 × CP2、8 token）演示 SP 沿水平 TP 组（{0,1}、{2,3}）在归一化区按行分片、投影前收齐本组 4 行，而 CP 沿垂直通信组（{0,2}、{1,3}）在 attention 中交换远端 K/V；右侧演示 Ulysses 通过 All-to-All 在「部分位置×全部头」与「全部位置×部分头」之间做矩阵转置式布局切换。</title>
  <desc>关联源码符号：enable_sp, prefill_context_parallel_size, use_sequence_parallel_moe</desc>
  <defs>
    <marker id="spg-teal" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto">
      <path d="M 0 1.5 L 8.5 5 L 0 8.5 z" fill="#087f73"/>
    </marker>
    <marker id="spg-plum" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto">
      <path d="M 0 1.5 L 8.5 5 L 0 8.5 z" fill="#9a4b86"/>
    </marker>
    <marker id="spg-indigo" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto">
      <path d="M 0 1.5 L 8.5 5 L 0 8.5 z" fill="#4c65b6"/>
    </marker>
  </defs>

  <!-- Title -->
  <text x="16" y="26" font-size="16" font-weight="700" fill="#17211f">SP、CP、Ulysses 三者切分维度与通信组正交对照（4 卡 · 8 token 示意）</text>
  <line x1="14" y1="36" x2="886" y2="36" stroke="#b8bcb5" stroke-width="1.4"/>
  <line x1="478" y1="48" x2="478" y2="436" stroke="#b8bcb5" stroke-width="1.4" stroke-dasharray="5 4"/>

  <!-- LEFT PANEL: 2x2 Orthogonal Grid (TP2 x CP2) -->
  <text x="16" y="64" font-size="15" font-weight="700" fill="#065f56">A. Megatron SP + CP 正交组合（TP2 × CP2 = 4 卡）</text>
  <text x="16" y="87" font-size="13.5" fill="#4d5652">水平 TP 组跑 SP（归一化省重复）；垂直 CP 组换远端 K/V</text>

  <!-- Row 0 (CP rank 0: tokens 0..3) -->
  <rect x="16" y="102" width="444" height="114" rx="10" fill="#ddf4ef" fill-opacity="0.32" stroke="#087f73" stroke-width="1.4"/>
  <text x="30" y="124" font-size="14" font-weight="700" fill="#065f56">TP 组 0 {卡 0, 卡 1} · 负责前 4 个位置（t0–t3）</text>

  <rect x="30" y="136" width="166" height="68" rx="7" fill="#ffffff" stroke="#087f73" stroke-width="1.5"/>
  <text x="113" y="159" text-anchor="middle" font-size="14" font-weight="700" fill="#17211f">卡 0（TP0, CP0）</text>
  <text x="113" y="180" text-anchor="middle" font-size="13.5" fill="#065f56">SP 归一：t0, t1</text>
  <text x="113" y="198" text-anchor="middle" font-size="13.5" fill="#66716d">AG 后拿 t0–t3</text>

  <rect x="280" y="136" width="166" height="68" rx="7" fill="#ffffff" stroke="#087f73" stroke-width="1.5"/>
  <text x="363" y="159" text-anchor="middle" font-size="14" font-weight="700" fill="#17211f">卡 1（TP1, CP0）</text>
  <text x="363" y="180" text-anchor="middle" font-size="13.5" fill="#065f56">SP 归一：t2, t3</text>
  <text x="363" y="198" text-anchor="middle" font-size="13.5" fill="#66716d">AG 后拿 t0–t3</text>

  <!-- Horizontal SP RS/AG arrows in Row 0 -->
  <path d="M 196 164 L 274 164" fill="none" stroke="#087f73" stroke-width="2" marker-end="url(#spg-teal)"/>
  <path d="M 280 180 L 202 180" fill="none" stroke="#087f73" stroke-width="2" marker-end="url(#spg-teal)"/>
  <text x="238" y="157" text-anchor="middle" font-size="13.5" font-weight="700" fill="#065f56">SP</text>
  <text x="238" y="198" text-anchor="middle" font-size="13.5" fill="#065f56">RS / AG</text>

  <!-- Vertical CP K/V exchange arrows between Row 0 and Row 1 -->
  <path d="M 102 204 L 102 282" fill="none" stroke="#9a4b86" stroke-width="2.2" marker-end="url(#spg-plum)"/>
  <path d="M 124 288 L 124 210" fill="none" stroke="#9a4b86" stroke-width="2.2" marker-end="url(#spg-plum)"/>
  <text x="113" y="246" text-anchor="middle" font-size="13.5" font-weight="700" fill="#7a3a6a">CP 组 {0,2}</text>
  <text x="113" y="264" text-anchor="middle" font-size="13.5" fill="#7a3a6a">换 K/V</text>

  <path d="M 352 204 L 352 282" fill="none" stroke="#9a4b86" stroke-width="2.2" marker-end="url(#spg-plum)"/>
  <path d="M 374 288 L 374 210" fill="none" stroke="#9a4b86" stroke-width="2.2" marker-end="url(#spg-plum)"/>
  <text x="363" y="246" text-anchor="middle" font-size="13.5" font-weight="700" fill="#7a3a6a">CP 组 {1,3}</text>
  <text x="363" y="264" text-anchor="middle" font-size="13.5" fill="#7a3a6a">换 K/V</text>

  <!-- Row 1 (CP rank 1: tokens 4..7) -->
  <rect x="16" y="274" width="444" height="114" rx="10" fill="#ddf4ef" fill-opacity="0.32" stroke="#087f73" stroke-width="1.4"/>
  <text x="30" y="296" font-size="14" font-weight="700" fill="#065f56">TP 组 1 {卡 2, 卡 3} · 负责后 4 个位置（t4–t7）</text>

  <rect x="30" y="308" width="166" height="68" rx="7" fill="#ffffff" stroke="#087f73" stroke-width="1.5"/>
  <text x="113" y="331" text-anchor="middle" font-size="14" font-weight="700" fill="#17211f">卡 2（TP0, CP1）</text>
  <text x="113" y="352" text-anchor="middle" font-size="13.5" fill="#065f56">SP 归一：t4, t5</text>
  <text x="113" y="370" text-anchor="middle" font-size="13.5" fill="#66716d">AG 后拿 t4–t7</text>

  <rect x="280" y="308" width="166" height="68" rx="7" fill="#ffffff" stroke="#087f73" stroke-width="1.5"/>
  <text x="363" y="331" text-anchor="middle" font-size="14" font-weight="700" fill="#17211f">卡 3（TP1, CP1）</text>
  <text x="363" y="352" text-anchor="middle" font-size="13.5" fill="#065f56">SP 归一：t6, t7</text>
  <text x="363" y="370" text-anchor="middle" font-size="13.5" fill="#66716d">AG 后拿 t4–t7</text>

  <path d="M 196 336 L 274 336" fill="none" stroke="#087f73" stroke-width="2" marker-end="url(#spg-teal)"/>
  <path d="M 280 352 L 202 352" fill="none" stroke="#087f73" stroke-width="2" marker-end="url(#spg-teal)"/>
  <text x="238" y="329" text-anchor="middle" font-size="13.5" font-weight="700" fill="#065f56">SP</text>
  <text x="238" y="370" text-anchor="middle" font-size="13.5" fill="#065f56">RS / AG</text>

  <text x="16" y="416" font-size="13.5" font-weight="700" fill="#17211f">要点：SP 的 All-Gather 只收本 TP 组 4 行，绝不收齐 8 行！</text>
  <text x="16" y="438" font-size="13.5" fill="#4d5652">跨位置 attention 依赖垂直 CP 组交换远端 K/V</text>

  <!-- RIGHT PANEL: DeepSpeed Ulysses All-to-All layout transpose -->
  <text x="496" y="64" font-size="15" font-weight="700" fill="#3a4f93">B. DeepSpeed Ulysses（All-to-All 换维）</text>
  <text x="496" y="87" font-size="13.5" fill="#4d5652">同名 SP，但解决的是长序列分布式 attention</text>

  <!-- Before Ulysses: Seq-split, Full-heads -->
  <rect x="496" y="102" width="388" height="96" rx="9" fill="#e8edff" fill-opacity="0.55" stroke="#4c65b6" stroke-width="1.4"/>
  <text x="510" y="126" font-size="14" font-weight="700" fill="#3a4f93">① 切序列、保全部头：[T/2, 全部头]</text>
  <rect x="510" y="138" width="170" height="46" rx="5" fill="#ffffff" stroke="#4c65b6" stroke-width="1.3"/>
  <text x="595" y="158" text-anchor="middle" font-size="13.5" font-weight="700" fill="#17211f">卡 A：t0–t3</text>
  <text x="595" y="177" text-anchor="middle" font-size="13.5" fill="#3a4f93">全部头 H0..H3</text>

  <rect x="700" y="138" width="170" height="46" rx="5" fill="#ffffff" stroke="#4c65b6" stroke-width="1.3"/>
  <text x="785" y="158" text-anchor="middle" font-size="13.5" font-weight="700" fill="#17211f">卡 B：t4–t7</text>
  <text x="785" y="177" text-anchor="middle" font-size="13.5" fill="#3a4f93">全部头 H0..H3</text>

  <!-- All-to-All Arrow Down -->
  <path d="M 690 198 L 690 242" fill="none" stroke="#9a4b86" stroke-width="2.4" marker-end="url(#spg-plum)"/>
  <text x="702" y="226" font-size="14" font-weight="700" fill="#7a3a6a">All-to-All（位置↔头转置）</text>

  <!-- After Ulysses: Full-seq, Head-split -->
  <rect x="496" y="248" width="388" height="106" rx="9" fill="#fff4cf" fill-opacity="0.7" stroke="#c78300" stroke-width="1.4"/>
  <text x="510" y="272" font-size="14" font-weight="700" fill="#936300">② 保全序列、切部分头：[完整 T, 头/2]</text>
  <rect x="510" y="284" width="170" height="56" rx="5" fill="#ffffff" stroke="#c78300" stroke-width="1.3"/>
  <text x="595" y="305" text-anchor="middle" font-size="13.5" font-weight="700" fill="#17211f">卡 A：头 H0, H1</text>
  <text x="595" y="326" text-anchor="middle" font-size="13.5" fill="#936300">完整 t0–t7 本地算 Attn</text>

  <rect x="700" y="284" width="170" height="56" rx="5" fill="#ffffff" stroke="#c78300" stroke-width="1.3"/>
  <text x="785" y="305" text-anchor="middle" font-size="13.5" font-weight="700" fill="#17211f">卡 B：头 H2, H3</text>
  <text x="785" y="326" text-anchor="middle" font-size="13.5" fill="#936300">完整 t0–t7 本地算 Attn</text>

  <!-- Return note -->
  <rect x="496" y="368" width="388" height="68" rx="8" fill="#ece9df" fill-opacity="0.65" stroke="#b8bcb5" stroke-width="1.3"/>
  <text x="510" y="394" font-size="14" font-weight="700" fill="#17211f">算完本地 Attention 再做一次逆向 All-to-All</text>
  <text x="510" y="420" font-size="13.5" fill="#4d5652">切回 [T/2, 全部头]；与 Megatron SP 通信点完全不同</text>
</svg>
