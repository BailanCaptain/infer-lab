<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 720" width="880" height="720" role="img" aria-label="推理时一个稀疏 MLA 层怎样先挑位置、再读位置。indexer 按条件走 triton 或回退实现，两条路径使用同一套公式；只供单测调用的 PyTorch 参考实现不在推理路径上。">
  <title>推理时一个稀疏 MLA 层怎样先挑位置、再读位置。indexer 按条件走 triton 或回退实现，两条路径使用同一套公式；只供单测调用的 PyTorch 参考实现不在推理路径上。</title>
  <defs><marker id="sparse-attention-path-ah-ink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="var(--color-ink, #17211f)"/></marker></defs>
  <rect x="20" y="50" width="840" height="650" rx="16" fill="none" stroke="var(--color-line-strong, #b8bcb5)" stroke-width="1.5"/>
  <text x="36" y="38" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="15" font-weight="700" fill="var(--color-ink, #17211f)">一个稀疏 MLA 层的前向 · 主线第 4 站，11 层各跑一次</text>
  <path d="M440 132 L440 166" fill="none" stroke="var(--color-ink, #17211f)" stroke-width="1.4" marker-end="url(#sparse-attention-path-ah-ink)"/>
  <path d="M270 222 L270 256" fill="none" stroke="var(--color-ink, #17211f)" stroke-width="1.4" marker-end="url(#sparse-attention-path-ah-ink)"/>
  <path d="M610 222 L610 256" fill="none" stroke="var(--color-ink, #17211f)" stroke-width="1.4" stroke-dasharray="7 5" marker-end="url(#sparse-attention-path-ah-ink)"/>
  <path d="M270 316 L270 356" fill="none" stroke="var(--color-ink, #17211f)" stroke-width="1.4" marker-end="url(#sparse-attention-path-ah-ink)"/>
  <path d="M610 316 L610 356" fill="none" stroke="var(--color-ink, #17211f)" stroke-width="1.4" stroke-dasharray="7 5" marker-end="url(#sparse-attention-path-ah-ink)"/>
  <path d="M440 412 L440 446" fill="none" stroke="var(--color-ink, #17211f)" stroke-width="1.4" marker-end="url(#sparse-attention-path-ah-ink)"/>
  <path d="M680 474 L700 474" fill="none" stroke="var(--color-ink, #17211f)" stroke-width="1.4" stroke-dasharray="7 5"/>
  <path d="M440 502 L440 536" fill="none" stroke="var(--color-ink, #17211f)" stroke-width="1.4" marker-end="url(#sparse-attention-path-ah-ink)"/>
  <path d="M440 592 L440 626" fill="none" stroke="var(--color-ink, #17211f)" stroke-width="1.4" marker-end="url(#sparse-attention-path-ah-ink)"/>
  <rect x="200" y="76" width="480" height="56" rx="8" fill="var(--color-control-soft, #f1efe8)" stroke="var(--color-line-strong, #b8bcb5)" stroke-width="1.4"/>
  <text x="440" y="100" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="14" font-weight="700" fill="var(--color-ink, #17211f)" text-anchor="middle">注意力层前向：先算出 Q 和本位置的潜向量</text>
  <text x="440" y="119" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="13" font-weight="400" fill="var(--color-ink-muted, #66716d)" text-anchor="middle">父类的统一流程</text>
  <rect x="200" y="166" width="480" height="56" rx="8" fill="var(--color-weight-soft, #fff4cf)" stroke="var(--color-weight, #c78300)" stroke-width="1.4"/>
  <text x="440" y="190" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="14" font-weight="700" fill="var(--color-ink, #17211f)" text-anchor="middle">indexer：写状态，每 4 个位置压成一池</text>
  <text x="440" y="209" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="13" font-weight="400" fill="#936300" text-anchor="middle">只给因果范围内的完整池打分</text>
  <rect x="120" y="256" width="300" height="60" rx="8" fill="var(--color-weight-soft, #fff4cf)" stroke="var(--color-weight, #c78300)" stroke-width="1.4"/>
  <text x="270" y="282" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="14" font-weight="700" fill="var(--color-ink, #17211f)" text-anchor="middle">triton 路径</text>
  <text x="270" y="301" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="13" font-weight="400" fill="#936300" text-anchor="middle">NPU 且条件满足：选池、展开、补尾一次做完</text>
  <rect x="460" y="256" width="300" height="60" rx="8" fill="var(--color-surface, #fbfaf6)" stroke="var(--color-ink, #17211f)" stroke-opacity="0.45" stroke-width="1.3" stroke-dasharray="5 4"/>
  <text x="610" y="282" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="13" font-weight="400" fill="var(--color-ink, #17211f)" text-anchor="middle">PyTorch 回退</text>
  <text x="610" y="301" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="13" font-weight="400" fill="var(--color-ink, #17211f)" text-anchor="middle">其余情况，同一套公式</text>
  <rect x="200" y="356" width="480" height="56" rx="8" fill="var(--color-token-soft, #ddf4ef)" stroke="var(--color-token, #087f73)" stroke-width="1.4"/>
  <text x="440" y="380" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="14" font-weight="700" fill="var(--color-ink, #17211f)" text-anchor="middle">位置清单：每个查询一行，宽 2051</text>
  <text x="440" y="399" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="13" font-weight="400" fill="#065f56" text-anchor="middle">最多 512 池展开成 2048 个位置，加 0–3 个尾部；空位填 −1</text>
  <rect x="200" y="446" width="480" height="56" rx="8" fill="var(--color-control-soft, #f1efe8)" stroke="var(--color-line-strong, #b8bcb5)" stroke-width="1.4"/>
  <text x="440" y="470" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="14" font-weight="700" fill="var(--color-ink, #17211f)" text-anchor="middle">稀疏 attention 入口（子类重写）</text>
  <text x="440" y="489" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="13" font-weight="400" fill="var(--color-ink-muted, #66716d)" text-anchor="middle">取出整份打包的潜向量缓存</text>
  <rect x="700" y="440" width="150" height="68" rx="8" fill="var(--color-surface, #fbfaf6)" stroke="var(--color-ink, #17211f)" stroke-opacity="0.45" stroke-width="1.3" stroke-dasharray="5 4"/>
  <text x="775" y="470" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="13" font-weight="400" fill="var(--color-ink, #17211f)" text-anchor="middle">PyTorch 参考实现</text>
  <text x="775" y="489" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="13" font-weight="400" fill="var(--color-ink, #17211f)" text-anchor="middle">只有单测调用</text>
  <rect x="200" y="536" width="480" height="56" rx="8" fill="var(--color-kv-soft, #e8edff)" stroke="var(--color-kv, #4c65b6)" stroke-width="1.4"/>
  <text x="440" y="560" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="14" font-weight="700" fill="var(--color-ink, #17211f)" text-anchor="middle">昇腾稀疏 FlashAttention 内核</text>
  <text x="440" y="579" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="13" font-weight="400" fill="#3a4f93" text-anchor="middle">A2 走基础设备适配器；按清单逐个位置读潜向量</text>
  <rect x="200" y="626" width="480" height="56" rx="8" fill="var(--color-control-soft, #f1efe8)" stroke="var(--color-line-strong, #b8bcb5)" stroke-width="1.4"/>
  <text x="440" y="650" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="14" font-weight="700" fill="var(--color-ink, #17211f)" text-anchor="middle">V 解压 + 输出投影</text>
  <text x="440" y="669" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="13" font-weight="400" fill="var(--color-ink-muted, #66716d)" text-anchor="middle">本卡 8 个头的部分和，随后 TP8 All-Reduce</text>
</svg>
