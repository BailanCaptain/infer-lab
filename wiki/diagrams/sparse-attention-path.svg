<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 420" width="900" height="420" role="img" aria-label="推理时一个稀疏 MLA 层的索引器双路径与昇腾 SFA 内核执行链" font-family="var(--font-sans)">
  <title>推理时一个稀疏 MLA 层先挑位置再读位置的源码执行路径：indexer 按条件走 Triton 或 PyTorch 回退，产出宽 2051 位置清单后交给昇腾稀疏 FlashAttention 内核、V 解压、输出投影与 TP8 All-Reduce。</title>
  <desc>三排水平流展示主干 11 层稀疏 MLA 的推理执行链：第一排为父类计算 Q 与潜向量并送入 indexer 写状态压池；第二排按 _can_use_triton 分流为 NPU Triton 融合算子与等价 PyTorch 回退，汇聚出每查询一行宽 2051 的位置清单；第三排经子类稀疏入口进入昇腾 npu_sparse_flash_attention（旁注单测专用 PyTorch 参考实现不参与推理），最终完成 V 上投影、o_proj 与 TP8 All-Reduce。</desc>
  <defs>
    <marker id="sp-arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto">
      <path d="M 0 1.5 L 8.5 5 L 0 8.5 z" fill="#4d5652"/>
    </marker>
    <marker id="sp-arr-i" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto">
      <path d="M 0 1.5 L 8.5 5 L 0 8.5 z" fill="#4c65b6"/>
    </marker>
    <marker id="sp-arr-p" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto">
      <path d="M 0 1.5 L 8.5 5 L 0 8.5 z" fill="#9a4b86"/>
    </marker>
  </defs>

  <text x="14" y="24" font-size="16" font-weight="700" fill="#17211f">一个稀疏 MLA 层推理执行链（主线第 4 站 · 11 层各跑一次）</text>

  <!-- Tier 1: Q/latent -> indexer -> Triton / PyTorch fallback -->
  <rect x="14" y="42" width="236" height="114" rx="9" fill="#ece9df" stroke="#b8bcb5" stroke-width="1.4"/>
  <text x="28" y="66" font-size="14.5" font-weight="700" fill="#17211f">1. 父类前向备料</text>
  <text x="28" y="92" font-size="13.5" fill="#17211f">算出本位置 Q 与潜向量</text>
  <text x="28" y="114" font-size="13.5" fill="#4d5652">indexer 写状态、每 4 位压池</text>
  <text x="28" y="138" font-size="13" fill="#4d5652">仅因果完整池参与打分</text>

  <path d="M 250 78 L 278 72" fill="none" stroke="#c78300" stroke-width="1.8" marker-end="url(#sp-arr)"/>
  <path d="M 250 120 L 278 126" fill="none" stroke="#b8bcb5" stroke-width="1.6" stroke-dasharray="4 3" marker-end="url(#sp-arr)"/>

  <!-- Triton vs PyTorch fallback -->
  <rect x="282" y="42" width="290" height="52" rx="8" fill="#fff4cf" stroke="#c78300" stroke-width="1.5"/>
  <text x="296" y="64" font-size="14" font-weight="700" fill="#936300">2A. Triton 路径（主力）</text>
  <text x="296" y="84" font-size="13" fill="#17211f">_can_use_triton 满足：选池/展开/补尾一步完</text>

  <rect x="282" y="104" width="290" height="52" rx="8" fill="#ffffff" stroke="#b8bcb5" stroke-width="1.3" stroke-dasharray="4 3"/>
  <text x="296" y="126" font-size="14" font-weight="700" fill="#66716d">2B. PyTorch 回退路径</text>
  <text x="296" y="146" font-size="13" fill="#66716d">其余条件兜底，与 Triton 公式完全一致</text>

  <path d="M 572 68 L 602 90" fill="none" stroke="#c78300" stroke-width="1.8" marker-end="url(#sp-arr)"/>
  <path d="M 572 130 L 602 108" fill="none" stroke="#b8bcb5" stroke-width="1.6" stroke-dasharray="4 3" marker-end="url(#sp-arr)"/>

  <!-- Step 3: Index list [B, 2051] -->
  <rect x="606" y="42" width="280" height="114" rx="9" fill="#ddf4ef" stroke="#087f73" stroke-width="1.5"/>
  <text x="620" y="66" font-size="14.5" font-weight="700" fill="#065f56">3. 位置清单（宽 2,051）</text>
  <text x="620" y="92" font-size="13.5" fill="#17211f">≤512 池 × 4 = <tspan font-family="var(--font-mono)" font-weight="700">2048</tspan> 位置</text>
  <text x="620" y="114" font-size="13.5" fill="#17211f">+ 0–3 个未满池尾部</text>
  <text x="620" y="138" font-size="13" font-family="var(--font-mono)" fill="#065f56">空名额填 −1（不读取）</text>

  <!-- Connector down to Tier 2 -->
  <path d="M 746 156 L 746 178 L 210 178 L 210 194" fill="none" stroke="#4c65b6" stroke-width="1.9" marker-end="url(#sp-arr-i)"/>

  <!-- Tier 2: Subclass sparse entry + SFA kernel + Unit-test ref side note -->
  <rect x="14" y="198" width="256" height="96" rx="9" fill="#ece9df" stroke="#b8bcb5" stroke-width="1.4"/>
  <text x="28" y="224" font-size="14.5" font-weight="700" fill="#17211f">4. 子类稀疏入口</text>
  <text x="28" y="248" font-size="13.5" font-family="var(--font-mono)" fill="#3a4f93">_execute_sparse_flash_</text>
  <text x="28" y="266" font-size="13.5" font-family="var(--font-mono)" fill="#3a4f93">attention_process</text>
  <text x="28" y="286" font-size="13" fill="#4d5652">取出整份打包潜向量缓存</text>

  <line x1="270" y1="246" x2="298" y2="246" stroke="#4c65b6" stroke-width="2" marker-end="url(#sp-arr-i)"/>

  <rect x="304" y="198" width="374" height="96" rx="9" fill="#e8edff" stroke="#4c65b6" stroke-width="1.6"/>
  <text x="318" y="224" font-size="14.5" font-weight="700" fill="#3a4f93">5. 昇腾稀疏 FlashAttention 内核（A2 基础适配器）</text>
  <text x="318" y="248" font-size="13.5" font-family="var(--font-mono)" font-weight="700" fill="#17211f">npu_sparse_flash_attention (PA_BSND)</text>
  <text x="318" y="272" font-size="13.5" fill="#4d5652">按清单 + block_table 逐位置读潜向量（右下因果掩码 3）</text>

  <!-- Side note: PyTorch ref unit-test only -->
  <line x1="678" y1="246" x2="700" y2="246" stroke="#b8bcb5" stroke-width="1.4" stroke-dasharray="4 3"/>
  <rect x="702" y="206" width="184" height="80" rx="8" fill="#ffffff" stroke="#b8bcb5" stroke-width="1.2" stroke-dasharray="4 3"/>
  <text x="794" y="232" text-anchor="middle" font-size="13.5" font-weight="700" fill="#66716d">_sparse_attention_</text>
  <text x="794" y="250" text-anchor="middle" font-size="13.5" font-weight="700" fill="#66716d">pytorch</text>
  <text x="794" y="272" text-anchor="middle" font-size="13" fill="#8f3229">仅单测调用，不进推理</text>

  <!-- Connector down to Tier 3 -->
  <line x1="491" y1="294" x2="491" y2="322" stroke="#4d5652" stroke-width="1.8" marker-end="url(#sp-arr)"/>

  <!-- Tier 3: V up-proj + o_proj + All-Reduce -->
  <rect x="14" y="326" width="530" height="78" rx="9" fill="#fff4cf" stroke="#c78300" stroke-width="1.5"/>
  <text x="28" y="352" font-size="14.5" font-weight="700" fill="#936300">6. V 上投影（_v_up_proj）+ 输出投影（o_proj）</text>
  <text x="28" y="378" font-size="13.5" fill="#17211f">本卡 8 头从 512 维回到 256 维并拼成 2048，算得 4096 维部分和</text>
  <text x="28" y="396" font-size="13" fill="#4d5652">上界每查询单层：33.6 MFLOP · 逻辑读潜缓存 ≈ 2.00 MiB/卡</text>

  <line x1="544" y1="365" x2="574" y2="365" stroke="#9a4b86" stroke-width="2" marker-end="url(#sp-arr-p)"/>

  <rect x="580" y="326" width="306" height="78" rx="9" fill="#f7e7f2" stroke="#9a4b86" stroke-width="1.6"/>
  <text x="733" y="354" text-anchor="middle" font-size="14.5" font-weight="700" fill="#7a3a6a">7. TP8 All-Reduce</text>
  <text x="733" y="378" text-anchor="middle" font-size="13.5" fill="#17211f">8 张卡部分和汇总为完整输出</text>
  <text x="733" y="396" text-anchor="middle" font-size="13" fill="#4d5652">（indexer 与潜缓存每卡各留一份）</text>
</svg>
