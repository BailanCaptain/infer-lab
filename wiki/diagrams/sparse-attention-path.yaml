layout: figure
id: sparse-attention-path
caption: 推理时一个稀疏 MLA 层怎样先挑位置、再读位置。indexer 按条件走 triton 或回退实现，两条路径使用同一套公式；只供单测调用的 PyTorch 参考实现不在推理路径上。
size: [880, 720]
frames:
  - { at: [20, 50], size: [840, 650], label: 一个稀疏 MLA 层的前向 · 主线第 4 站，11 层各跑一次 }
items:
  - { at: [200, 76], size: [480, 56], text: 注意力层前向：先算出 Q 和本位置的潜向量, sub: 父类的统一流程, style: plain }
  - { at: [200, 166], size: [480, 56], text: indexer：写状态，每 4 个位置压成一池, sub: 只给因果范围内的完整池打分, tone: weight }
  - { at: [120, 256], size: [300, 60], text: triton 路径, sub: NPU 且条件满足：选池、展开、补尾一次做完, tone: weight }
  - { at: [460, 256], size: [300, 60], text: PyTorch 回退, sub: 其余情况，同一套公式, style: faded }
  - { at: [200, 356], size: [480, 56], text: 位置清单：每个查询一行，宽 2051, sub: 最多 512 池展开成 2048 个位置，加 0–3 个尾部；空位填 −1, tone: token }
  - { at: [200, 446], size: [480, 56], text: 稀疏 attention 入口（子类重写）, sub: 取出整份打包的潜向量缓存, style: plain }
  - { at: [700, 440], size: [150, 68], text: PyTorch 参考实现, sub: 只有单测调用, style: faded }
  - { at: [200, 536], size: [480, 56], text: 昇腾稀疏 FlashAttention 内核, sub: A2 走基础设备适配器；按清单逐个位置读潜向量, tone: kv }
  - { at: [200, 626], size: [480, 56], text: V 解压 + 输出投影, sub: 本卡 8 个头的部分和，随后 TP8 All-Reduce, style: plain }
