<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 456" width="900" height="456" role="img" aria-label="Speculative Decoding 1+K 验证、状态收场与昇腾约束图" font-family="var(--font-sans)">
  <title>Speculative Decoding 1+K 前缀验证、状态收场与昇腾边界</title>
  <desc>上半区以 K=3 示例展示 1 个已定 token 加 3 个候选一次前向错位验证、遇首个不符即停并写下主模型替代词，以及按位置 KV 原地覆盖与 KDA K+1 份状态的两种收场方式；下半区对比保分布拒绝采样与改变分布的 block/entropy verify，并汇总昇腾 1+K≤16 与 ACLGraph 倍数约束。</desc>
  <defs>
    <marker id="sdf-arr-t" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto">
      <path d="M 0 1.5 L 8.5 5 L 0 8.5 z" fill="#087f73"/>
    </marker>
    <marker id="sdf-arr-b" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto">
      <path d="M 0 1.5 L 8.5 5 L 0 8.5 z" fill="#4c65b6"/>
    </marker>
  </defs>

  <text x="14" y="28" font-size="16" font-weight="700" fill="#17211f">一、单轮 1+K 验证与两种状态收场：先验证，再按剩余有效位置草拟下一轮</text>
  <line x1="12" y1="40" x2="888" y2="40" stroke="#b8bcb5" stroke-width="1.3"/>

  <rect x="12" y="54" width="528" height="174" rx="8" fill="#ffffff" stroke="#087f73" stroke-width="1.4"/>
  <text x="26" y="78" font-size="14.5" font-weight="700" fill="#065f56">A. 主模型一次算 1+3=4 格，错开一格从左到右比（遇拒绝即停）</text>

  <rect x="26" y="92" width="116" height="58" rx="6" fill="#ddf4ef" stroke="#087f73" stroke-width="1.3"/>
  <text x="84" y="114" text-anchor="middle" font-size="13.5" font-weight="700" fill="#065f56">槽 5：猫（已定）</text>
  <text x="84" y="138" text-anchor="middle" font-size="13.5" fill="#17211f">主模型预测「坐」</text>

  <rect x="152" y="92" width="116" height="58" rx="6" fill="#ddf4ef" stroke="#087f73" stroke-width="1.3"/>
  <text x="210" y="114" text-anchor="middle" font-size="13.5" font-weight="700" fill="#065f56">槽 6：坐 ✓留</text>
  <text x="210" y="138" text-anchor="middle" font-size="13.5" fill="#17211f">主模型预测「在」</text>

  <rect x="278" y="92" width="122" height="58" rx="6" fill="#fff4cf" stroke="#c78300" stroke-width="1.4"/>
  <text x="339" y="114" text-anchor="middle" font-size="13.5" font-weight="700" fill="#936300">槽 7：在 ✓留</text>
  <text x="339" y="138" text-anchor="middle" font-size="13.5" fill="#17211f">预测「垫子」≠床</text>

  <rect x="410" y="92" width="118" height="58" rx="6" fill="#fff0e9" stroke="#b54237" stroke-width="1.4" stroke-dasharray="4 3"/>
  <text x="469" y="114" text-anchor="middle" font-size="13.5" font-weight="700" fill="#8f3229">槽 8：床 ✗拒</text>
  <text x="469" y="138" text-anchor="middle" font-size="13.5" fill="#8f3229">后续预测全作废</text>

  <text x="26" y="176" font-size="13.5" fill="#17211f">本轮交回：<tspan font-weight="700" fill="#065f56">「坐、在、垫子」</tspan>（2 接受 + 1 替代 = 3 个；全对则多 1 个 bonus）</text>
  <text x="26" y="202" font-size="13.5" fill="#4d5652">步内严格先后：主模型前向 → 拒绝采样验证 → 草稿从「垫子」往后猜下轮 K 个</text>

  <rect x="556" y="54" width="332" height="174" rx="8" fill="#ffffff" stroke="#4c65b6" stroke-width="1.4"/>
  <text x="570" y="78" font-size="14.5" font-weight="700" fill="#3a4f93">B. 被拒位置的状态怎样收场？</text>
  <rect x="570" y="92" width="304" height="56" rx="6" fill="#e8edff" stroke="#4c65b6" stroke-width="1.2"/>
  <text x="582" y="114" font-size="13.5" font-weight="700" fill="#3a4f93">按位置 KV（MHA / GQA / MLA）</text>
  <text x="582" y="136" font-size="13.5" fill="#17211f">不擦除！进度退回 8，下步原地覆盖槽 8</text>
  <rect x="570" y="158" width="304" height="58" rx="6" fill="#f7e7f2" stroke="#9a4b86" stroke-width="1.2"/>
  <text x="582" y="180" font-size="13.5" font-weight="700" fill="#7a3a6a">递推状态（KDA / Mamba）</text>
  <text x="582" y="202" font-size="13.5" fill="#17211f">预留 1+K 份状态槽，按有效数 a 取第 a−1 份</text>

  <text x="14" y="264" font-size="16" font-weight="700" fill="#17211f">二、采样分布等价性边界与昇腾 NPU 执行硬约束</text>
  <line x1="12" y1="276" x2="888" y2="276" stroke="#b8bcb5" stroke-width="1.3"/>

  <rect x="12" y="290" width="432" height="152" rx="8" fill="#ffffff" stroke="#087f73" stroke-width="1.4"/>
  <text x="26" y="314" font-size="14.5" font-weight="700" fill="#065f56">采样规则：普通拒绝采样保分布，可选变体改分布</text>
  <text x="26" y="340" font-size="13.5" fill="#17211f">• <tspan font-weight="700" fill="#065f56">标准拒绝采样</tspan>：按 <tspan font-family="var(--font-mono)">min(1, p/q)</tspan> 接受，</text>
  <text x="26" y="362" font-size="13.5" fill="#17211f">  被拒从 <tspan font-family="var(--font-mono)">norm(max(0, p−q))</tspan> 补抽 → 严格保分布 p</text>
  <text x="26" y="390" font-size="13.5" fill="#17211f">• <tspan font-weight="700" fill="#8f3229">block / entropy verify（默认关）</tspan>：改变接受门槛，</text>
  <text x="26" y="412" font-size="13.5" fill="#8f3229">  不再满足逐位保分布证明（属判法变化而非浮点误差）</text>
  <text x="26" y="432" font-size="13.5" fill="#66716d">• 指标区分：接受率 A/D ≠ 平均接受长度 1 + A/R</text>

  <rect x="460" y="290" width="428" height="152" rx="8" fill="#fff4cf" stroke="#c78300" stroke-width="1.4"/>
  <text x="474" y="314" font-size="14.5" font-weight="700" fill="#936300">昇腾调度、ACLGraph 与算子四条硬约束</text>
  <text x="474" y="340" font-size="13.5" fill="#17211f">1. <tspan font-weight="700" fill="#8f3229">FIA TND 上限</tspan>：<tspan font-family="var(--font-mono)">decode_threshold = 1+K ≤ 16</tspan></text>
  <text x="474" y="364" font-size="13.5" fill="#17211f">2. <tspan font-weight="700" fill="#936300">录图尺寸凑整</tspan>：须为 1+K 倍数，补齐空跑同倍放大</text>
  <text x="474" y="388" font-size="13.5" fill="#17211f">3. <tspan font-weight="700" fill="#3a4f93">预算截短优先</tspan>：token 预算不足先砍候选，不推迟请求</text>
  <text x="474" y="412" font-size="13.5" fill="#17211f">4. <tspan font-weight="700" fill="#7a3a6a">Runner 演进</tspan>：v0.30.0 MRV1/V2 并存；main 统一 MRV2</text>
  <text x="474" y="432" font-size="13.5" fill="#4d5652">   开启投机后不再走昇腾 PagedAttention 算子路径</text>
</svg>
