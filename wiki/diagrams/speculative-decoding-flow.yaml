layout: figure
id: speculative-decoding-flow
caption: 本站固定 K 的 MTP 与 FULL_DECODE_ONLY 配方中，一个 decode 步在两个进程里怎么走。左边 EngineCore 进程：调度器给每条请求排 1 + K 个位置，预算不够先砍候选，KV 多留 K 格给草稿层（①）；结果回来后按被拒的个数把已算位置退回，存下新候选（⑤），新 token 发回前端（⑥），再排下一步。右边 Worker 进程：准备输入时把这一步的分数行分成 K 个验证行和 1 个 bonus 行（②）；整个批次整齐且满足图条件时回放已录的 FULL 图，否则 eager；主模型前向后用 rejection sampling 逐位决定接受几个（③）；最后草稿层连跑 K 遍，猜出下一步的候选（④），GLM 上这一段固定 eager。站号对应一条请求走过的七站。
size: [900, 640]
texts:
  - { at: [24, 24], text: EngineCore 进程（CPU）, strong: true }
  - { at: [480, 24], text: Worker 进程（每张 NPU 一个）, strong: true }
  - { at: [424, 62], text: 提交, size: 12.5 }
  - { at: [588, 236], text: 是, size: 12.5 }
  - { at: [800, 236], text: 否, size: 12.5 }
  - { at: [30, 160], text: 异步调度开着时：Worker 算这一步，EngineCore 同时排下一步, size: 12.5, note: true, width: 250 }
  - { at: [24, 626], text: 下一步回到 ①, size: 12.5, note: true }
items:
  - { at: [24, 40], size: [380, 72], text: ① 第 2 站 · 每条请求排 1 + K 个位置, sub: 预算不够先砍候选；KV 多留 K 格给草稿层, tone: control }
  - { at: [480, 40], size: [400, 62], text: ② 第 3 站 · 准备输入, sub: 每条请求 K 个验证行 + 1 个 bonus 行, tone: weight }
  - { at: [480, 126], size: [400, 72], text: 这一步整齐吗？, sub: 每条都是 1 + K 个、总数不超过最大图尺寸、另一组也整齐, style: plain }
  - { at: [480, 246], size: [190, 62], text: 回放 FULL 图, sub: 尺寸是 1 + K 的倍数, tone: kv }
  - { at: [690, 246], size: [190, 62], text: 整步 eager, sub: 例如混进了 prefill, tone: control }
  - { at: [480, 332], size: [400, 72], text: ③ 第 4–5 站 · 主模型前向 + rejection sampling, sub: 逐位接受；首个拒绝处补一个 token 后停止, tone: weight }
  - { at: [480, 428], size: [400, 72], text: ④ 第 5 站 · 草稿层连跑 K 遍, sub: 猜下一步的候选；GLM 上固定 eager, tone: weight, style: faded }
  - { at: [24, 428], size: [380, 72], text: ⑤ 第 6 站 · 已算位置退回被拒的个数, sub: 被拒位置的 KV 不擦，下一步原地覆盖；存下新候选, tone: token }
  - { at: [24, 530], size: [380, 62], text: ⑥ 第 7 站 · 新 token 发回前端, sub: 这一步交回 1 到 K + 1 个, tone: token }
