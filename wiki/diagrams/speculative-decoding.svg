<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 396" width="900" height="396" role="img" aria-label="一轮 speculative decoding 的循环（示意，按词切 token）。已确定的「猫」连同草稿猜的 3 个候选「坐 在 床」一起送进主模型（①）；主模型一次算 4 格，每格预测的是它的下一格（②），所以第 1 格的预测和第 1 个候选比、第 2 格和第 2 个比，依次错开一格（③，虚线是候选被拿来比的路线）。前两个对上；第 3 格主模型说「垫子」、候选是「床」，就在位置 8 写下主模型的「垫子」并停在这里，第 4 格读过错的「床」，作废（④）。草稿层接着「垫子」再猜 3 个，下一轮回到 ①。">
  <title>一轮 speculative decoding 的循环（示意，按词切 token）。已确定的「猫」连同草稿猜的 3 个候选「坐 在 床」一起送进主模型（①）；主模型一次算 4 格，每格预测的是它的下一格（②），所以第 1 格的预测和第 1 个候选比、第 2 格和第 2 个比，依次错开一格（③，虚线是候选被拿来比的路线）。前两个对上；第 3 格主模型说「垫子」、候选是「床」，就在位置 8 写下主模型的「垫子」并停在这里，第 4 格读过错的「床」，作废（④）。草稿层接着「垫子」再猜 3 个，下一轮回到 ①。</title>
