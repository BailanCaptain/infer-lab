<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 240" width="900" height="240" role="img" aria-label="每步猜 3 个：4 个位置一次算完，第一个对不上的地方换成模型自己的答案，后面作废">
  <title>每步猜 3 个：4 个位置一次算完，第一个对不上的地方换成模型自己的答案，后面作废</title>
  <defs><marker id="speculative-decoding-ah-ink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="var(--color-ink, #17211f)"/></marker><marker id="speculative-decoding-ah-control" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="var(--color-control, #66716d)"/></marker></defs>
  <path d="M195 80 L195 132" fill="none" stroke="var(--color-ink, #17211f)" stroke-width="1.4" marker-end="url(#speculative-decoding-ah-ink)"/>
  <path d="M375 80 L375 132" fill="none" stroke="var(--color-ink, #17211f)" stroke-width="1.4" marker-end="url(#speculative-decoding-ah-ink)"/>
  <path d="M555 80 L555 132" fill="none" stroke="var(--color-ink, #17211f)" stroke-width="1.4" marker-end="url(#speculative-decoding-ah-ink)"/>
  <path d="M735 80 L735 132" fill="none" stroke="var(--color-control, #66716d)" stroke-width="1.4" stroke-dasharray="7 5" marker-end="url(#speculative-decoding-ah-control)"/>
  <rect x="120" y="36" width="150" height="44" rx="8" fill="var(--color-token, #087f73)" stroke="var(--color-ink, #17211f)" stroke-width="1.5"/>
  <text x="195" y="63" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="14" font-weight="700" fill="var(--color-ink-inverse, #ffffff)" text-anchor="middle">已确定</text>
  <rect x="300" y="36" width="150" height="44" rx="8" fill="var(--color-token-soft, #ddf4ef)" stroke="var(--color-token, #087f73)" stroke-opacity="0.4" stroke-width="1.5" stroke-dasharray="5 4"/>
  <text x="375" y="63" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="13" font-weight="400" fill="#065f56" text-anchor="middle">猜 1</text>
  <rect x="480" y="36" width="150" height="44" rx="8" fill="var(--color-token-soft, #ddf4ef)" stroke="var(--color-token, #087f73)" stroke-opacity="0.4" stroke-width="1.5" stroke-dasharray="5 4"/>
  <text x="555" y="63" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="13" font-weight="400" fill="#065f56" text-anchor="middle">猜 2</text>
  <rect x="660" y="36" width="150" height="44" rx="8" fill="var(--color-token-soft, #ddf4ef)" stroke="var(--color-token, #087f73)" stroke-opacity="0.4" stroke-width="1.5" stroke-dasharray="5 4"/>
  <text x="735" y="63" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="13" font-weight="400" fill="#065f56" text-anchor="middle">猜 3</text>
  <rect x="120" y="132" width="150" height="44" rx="8" fill="var(--color-token, #087f73)" stroke="var(--color-ink, #17211f)" stroke-width="1.5"/>
  <text x="195" y="159" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="14" font-weight="700" fill="var(--color-ink-inverse, #ffffff)" text-anchor="middle">猜 1 对</text>
  <rect x="300" y="132" width="150" height="44" rx="8" fill="var(--color-token, #087f73)" stroke="var(--color-ink, #17211f)" stroke-width="1.5"/>
  <text x="375" y="159" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="14" font-weight="700" fill="var(--color-ink-inverse, #ffffff)" text-anchor="middle">猜 2 对</text>
  <rect x="480" y="132" width="150" height="44" rx="8" fill="var(--color-danger, #b54237)" stroke="var(--color-ink, #17211f)" stroke-width="1.5"/>
  <text x="555" y="159" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="14" font-weight="700" fill="var(--color-ink-inverse, #ffffff)" text-anchor="middle">猜 3 错，换掉</text>
  <rect x="660" y="132" width="150" height="44" rx="8" fill="var(--color-surface-sunken, #ece9df)" stroke="var(--color-control, #66716d)" stroke-opacity="0.4" stroke-width="1.5" stroke-dasharray="5 4"/>
  <path d="M120 192 v8 h510 v-8" fill="none" stroke="var(--color-ink, #17211f)" stroke-width="1.5"/>
  <text x="375" y="222" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="14" font-weight="700" fill="var(--color-ink, #17211f)" text-anchor="middle">这一步出 3 个 token</text>
