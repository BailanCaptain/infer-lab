<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 320" width="900" height="320" role="img" aria-label="Greedy、三个候选的教学例子：输入与后继预测错开一位；前两个候选被接受，第三个用目标预测 z 替代，未接受分支不提交">
  <title>Greedy、三个候选的教学例子：输入与后继预测错开一位；前两个候选被接受，第三个用目标预测 z 替代，未接受分支不提交</title>
  <defs><marker id="speculative-decoding-ah-ink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="var(--color-ink, #17211f)"/></marker></defs>
  <path d="M237 117 L237 190" fill="none" stroke="var(--color-ink, #17211f)" stroke-width="1.4" marker-end="url(#speculative-decoding-ah-ink)"/>
  <path d="M397 117 L397 190" fill="none" stroke="var(--color-ink, #17211f)" stroke-width="1.4" marker-end="url(#speculative-decoding-ah-ink)"/>
  <path d="M557 117 L557 190" fill="none" stroke="var(--color-ink, #17211f)" stroke-width="1.4" marker-end="url(#speculative-decoding-ah-ink)"/>
  <path d="M717 117 L717 190" fill="none" stroke="var(--color-ink, #17211f)" stroke-width="1.4" stroke-dasharray="7 5" marker-end="url(#speculative-decoding-ah-ink)"/>
  <rect x="170" y="190" width="135" height="42" rx="8" fill="var(--color-token, #087f73)" stroke="var(--color-ink, #17211f)" stroke-width="1.5"/>
  <text x="237.5" y="216" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="14" font-weight="700" fill="var(--color-ink-inverse, #ffffff)" text-anchor="middle">d₁ · 接受</text>
  <rect x="330" y="190" width="135" height="42" rx="8" fill="var(--color-token, #087f73)" stroke="var(--color-ink, #17211f)" stroke-width="1.5"/>
  <text x="397.5" y="216" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="14" font-weight="700" fill="var(--color-ink-inverse, #ffffff)" text-anchor="middle">d₂ · 接受</text>
  <rect x="490" y="190" width="135" height="42" rx="8" fill="var(--color-danger, #b54237)" stroke="var(--color-ink, #17211f)" stroke-width="1.5"/>
  <text x="557.5" y="216" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="14" font-weight="700" fill="var(--color-ink-inverse, #ffffff)" text-anchor="middle">z · 替代 d₃</text>
  <rect x="650" y="190" width="135" height="42" rx="8" fill="var(--color-surface-sunken, #ece9df)" stroke="var(--color-control, #66716d)" stroke-opacity="0.4" stroke-width="1.5" stroke-dasharray="5 4"/>
  <text x="717.5" y="216" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="13" font-weight="400" fill="#4d5652" text-anchor="middle">不提交</text>
  <rect x="170" y="75" width="135" height="42" rx="8" fill="var(--color-token, #087f73)" stroke="var(--color-ink, #17211f)" stroke-width="1.5"/>
  <text x="237.5" y="101" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="14" font-weight="700" fill="var(--color-ink-inverse, #ffffff)" text-anchor="middle">已确定 token</text>
  <rect x="330" y="75" width="135" height="42" rx="8" fill="var(--color-token, #087f73)" stroke="var(--color-ink, #17211f)" stroke-width="1.5"/>
  <text x="397.5" y="101" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="14" font-weight="700" fill="var(--color-ink-inverse, #ffffff)" text-anchor="middle">候选 d₁</text>
  <rect x="490" y="75" width="135" height="42" rx="8" fill="var(--color-token, #087f73)" stroke="var(--color-ink, #17211f)" stroke-width="1.5"/>
  <text x="557.5" y="101" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="14" font-weight="700" fill="var(--color-ink-inverse, #ffffff)" text-anchor="middle">候选 d₂</text>
  <rect x="650" y="75" width="135" height="42" rx="8" fill="var(--color-token, #087f73)" stroke="var(--color-ink, #17211f)" stroke-width="1.5"/>
  <text x="717.5" y="101" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="14" font-weight="700" fill="var(--color-ink-inverse, #ffffff)" text-anchor="middle">候选 d₃</text>
