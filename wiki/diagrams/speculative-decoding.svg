<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 620" width="900" height="620" role="img" aria-label="K=3 时的一步：4 个位置一次 forward 算完，第一个对不上的地方截断，被拒位置的 KV 槽下一步被覆盖">
  <title>K=3 时的一步：4 个位置一次 forward 算完，第一个对不上的地方截断，被拒位置的 KV 槽下一步被覆盖</title>
  <rect width="900" height="620" fill="var(--color-surface, #fbfaf6)"/>
  <rect x="20" y="26" width="860" height="170" rx="12" fill="var(--color-surface-sunken, #ece9df)"/>
  <rect x="36" y="40" width="160.8" height="26.5" rx="13.3" fill="var(--color-control, #5b6763)"/><text x="47" y="58.1" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="13.5" font-weight="700" fill="var(--color-ink-inverse, #ffffff)">上游 vLLM 排的这一步</text>
  <text x="38" y="83" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="12.5" font-weight="400" fill="var(--color-ink-muted, #5b6763)">调度器不区分草稿和真 token：这一步给的是 4 个名额，不是 1 个</text>
  <rect x="20" y="216" width="860" height="280" rx="12" fill="var(--color-weight-soft, #fff4cf)"/>
  <rect x="36" y="230" width="185.1" height="26.5" rx="13.3" fill="var(--color-weight, #b87a00)"/><text x="47" y="248.1" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="13.5" font-weight="700" fill="var(--color-ink-inverse, #ffffff)">NPUModelRunner 这一步</text>
  <text x="38" y="273" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="12.5" font-weight="400" fill="var(--color-ink-muted, #5b6763)">验证这一步的草稿、提议下一步的草稿，都在目标模型这一次 forward 之后完成</text>
