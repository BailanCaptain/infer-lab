  <text x="604" y="119" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="14.5" font-weight="700" fill="var(--color-ink, #17211f)">一步排 4 个 token</text>
  <text x="604" y="137" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="12.5" font-weight="400" fill="var(--color-ink-muted, #5b6763)">预算不够时先砍草稿</text>
  <text x="604" y="154" font-family="'JetBrains Mono',ui-monospace,monospace" font-size="12.5" font-weight="400" fill="var(--color-control, #5b6763)">_calc_spec_decode_metadata</text>
  <rect x="552" y="282" width="320" height="60" rx="11" fill="var(--color-surface, #fbfaf6)" stroke="var(--color-weight, #b87a00)" stroke-width="1.5"/>
  <rect x="564" y="296" width="32" height="32" rx="9" fill="var(--color-weight-soft, #fff4cf)"/><g transform="translate(570.4 302.4) scale(0.8)" fill="none" stroke="var(--color-weight, #b87a00)" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M6 3v14M18 7v14M6 7c0 6 12 2 12 8"/></g>
  <text x="604" y="300" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="14.5" font-weight="700" fill="var(--color-ink, #17211f)">第一个对不上就截断</text>
  <text x="604" y="318" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="12.5" font-weight="400" fill="var(--color-ink-muted, #5b6763)">全对才补 bonus token</text>
  <text x="604" y="335" font-family="'JetBrains Mono',ui-monospace,monospace" font-size="12.5" font-weight="400" fill="var(--color-weight, #b87a00)">rejection_greedy_sample_pytorch</text>
  <rect x="552" y="350" width="320" height="60" rx="11" fill="var(--color-surface, #fbfaf6)" stroke="var(--color-kv, #4c65b6)" stroke-width="1.5"/>
  <rect x="564" y="364" width="32" height="32" rx="9" fill="var(--color-kv-soft, #e8edff)"/><g transform="translate(570.4 370.4) scale(0.8)" fill="none" stroke="var(--color-kv, #4c65b6)" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M3 8h18v8H3z M9 8v8M15 8v8"/></g>
  <text x="604" y="368" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="14.5" font-weight="700" fill="var(--color-ink, #17211f)">被拒位置的 KV 不回收</text>
  <text x="604" y="386" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="12.5" font-weight="400" fill="var(--color-ink-muted, #5b6763)">num_computed_tokens 退回去</text>
  <text x="604" y="403" font-family="'JetBrains Mono',ui-monospace,monospace" font-size="12.5" font-weight="400" fill="var(--color-kv, #4c65b6)">compute_slot_mapping</text>
  <rect x="552" y="418" width="320" height="60" rx="11" fill="var(--color-surface, #fbfaf6)" stroke="var(--color-weight, #b87a00)" stroke-width="1.5"/>
  <rect x="564" y="432" width="32" height="32" rx="9" fill="var(--color-weight-soft, #fff4cf)"/><g transform="translate(570.4 438.4) scale(0.8)" fill="none" stroke="var(--color-weight, #b87a00)" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M13 2L4 14h7l-1 8 9-12h-7z"/></g>
  <text x="604" y="436" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="14.5" font-weight="700" fill="var(--color-ink, #17211f)">顺手提议下一步的草稿</text>
  <text x="604" y="454" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="12.5" font-weight="400" fill="var(--color-ink-muted, #5b6763)">同一次调用的最后一段</text>
  <text x="604" y="471" font-family="'JetBrains Mono',ui-monospace,monospace" font-size="12.5" font-weight="400" fill="var(--color-weight, #b87a00)">propose_draft_token_ids</text>
  <path d="M287 372 L287 394" fill="none" stroke="var(--color-kv, #4c65b6)" stroke-width="1.8"/>
  <path d="M287 394 l-5.5 -11 l11 0 z" fill="var(--color-kv, #4c65b6)"/>
  <path d="M56 116 l0 -9 L518 107 l0 9" fill="none" stroke="var(--color-ink-faint, #8a928f)" stroke-width="1.4" opacity="0.75"/>
  <text x="287" y="99" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="12.5" font-weight="600" fill="var(--color-ink-faint, #8a928f)" text-anchor="middle">一次 forward 喂进去的 4 个位置</text>
  <text x="20" y="532" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="12.5" font-weight="400" fill="var(--color-ink-muted, #5b6763)">这一步产出 1 到 4 个 token：第一个对不上的位置写的是目标模型自己的 argmax，所以下界是 1 不是 0；四个位置全命中，才轮到第 4 个位置上的 </text>
  <text x="20" y="550.5" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="12.5" font-weight="400" fill="var(--color-ink-muted, #5b6763)">bonus token。</text>
  <text x="20" y="576" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="12.5" font-weight="600" fill="var(--color-ink, #17211f)">代价是一次 forward 的查询位置从 1 变成 4，而 decode 卡在读权重上，这 4 个位置读的是同一份权重——多出来的 token 就是这么白赚的。</text>
</svg>
