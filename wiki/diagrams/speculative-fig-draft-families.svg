<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 440" width="900" height="440" role="img" aria-label="三类投机草稿方法对比与 GLM 单层 MTP 串行跑 3 遍结构图" font-family="var(--font-sans)">
  <title>三类草稿来源结构对比与 GLM 单层 MTP 串行 3 遍</title>
  <desc>对比三类候选生成方式：一、文本查找（ngram / Suffix）不加载草稿权重与 KV；二、独立小模型区分自回归串行 K 步与并行 PARD 占位一步输出 K；三、复用主模型隐状态的 EAGLE / MTP，以 GLM 单层 MTP 串行跑 3 遍（45 主干层 + 3×1 MTP = 48 层）展示结构与调用次数的区别。</desc>
  <defs>
    <marker id="sdfm-arr-t" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 1.5 L 8.5 5 L 0 8.5 z" fill="#087f73"/>
    </marker>
    <marker id="sdfm-arr-a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 1.5 L 8.5 5 L 0 8.5 z" fill="#c78300"/>
    </marker>
    <marker id="sdfm-arr-b" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 1.5 L 8.5 5 L 0 8.5 z" fill="#4c65b6"/>
    </marker>
  </defs>

  <circle cx="26" cy="24" r="12" fill="#087f73"/>
  <text x="26" y="28.5" text-anchor="middle" font-size="13" font-weight="700" fill="#ffffff">1</text>
  <text x="46" y="30" font-size="16" font-weight="700" fill="#17211f">候选从哪来：三类草稿路径的计算结构与显存账</text>

  <!-- Column 1: Text Lookup (ngram / Suffix) -->
  <rect x="16" y="48" width="276" height="218" rx="8" fill="#ddf4ef" stroke="#087f73" stroke-width="1.4"/>
  <text x="30" y="74" font-size="15" font-weight="700" fill="#065f56">A. 文本重复查找（Host CPU）</text>
  <!-- Mini visual: sequence match window -->
  <rect x="30" y="88" width="248" height="34" rx="5" fill="#ffffff" stroke="#087f73" stroke-width="1.2"/>
  <text x="42" y="110" font-size="13.5" fill="#4d5652">…检查配置</text>
  <rect x="114" y="93" width="60" height="24" rx="3" fill="#fff4cf" stroke="#c78300" stroke-width="1.1"/>
  <text x="144" y="110" text-anchor="middle" font-size="13" font-weight="700" fill="#936300">续文 K</text>
  <text x="180" y="110" font-size="13.5" fill="#065f56">…检查配置</text>
  <!-- Ngram vs Suffix tags -->
  <text x="30" y="146" font-size="13.5" font-weight="700" fill="#17211f">ngram：仅搜当前请求序列</text>
  <text x="30" y="168" font-size="13.5" fill="#4d5652">Suffix：局部树 + 跨请求响应树</text>
  <!-- Resource pills -->
  <rect x="30" y="186" width="116" height="28" rx="4" fill="#ffffff" stroke="#087f73" stroke-width="1"/>
  <text x="88" y="205" text-anchor="middle" font-size="13" font-weight="700" fill="#065f56">无草稿权重/KV</text>
  <rect x="154" y="186" width="124" height="28" rx="4" fill="#fff4cf" stroke="#c78300" stroke-width="1"/>
  <text x="216" y="205" text-anchor="middle" font-size="13" fill="#936300">耗 CPU 查找内存</text>
  <text x="30" y="246" font-size="13.5" fill="#4d5652">匹配不到时退回普通 decode</text>

  <!-- Column 2: Independent Draft Model (AR vs Parallel PARD) -->
  <rect x="312" y="48" width="276" height="218" rx="8" fill="#e8edff" stroke="#4c65b6" stroke-width="1.4"/>
  <text x="326" y="74" font-size="15" font-weight="700" fill="#3a4f93">B. 独立小模型（另占权重/KV）</text>
  <!-- Serial AR chain -->
  <text x="326" y="100" font-size="13.5" font-weight="700" fill="#3a4f93">普通自回归：串行跑 K 步</text>
  <rect x="326" y="108" width="60" height="28" rx="4" fill="#ffffff" stroke="#4c65b6" stroke-width="1.2"/>
  <text x="356" y="127" text-anchor="middle" font-size="13.5" fill="#3a4f93">猜 D1</text>
  <line x1="388" y1="122" x2="406" y2="122" stroke="#4c65b6" stroke-width="1.6" marker-end="url(#sdfm-arr-b)"/>
  <rect x="410" y="108" width="60" height="28" rx="4" fill="#ffffff" stroke="#4c65b6" stroke-width="1.2"/>
  <text x="440" y="127" text-anchor="middle" font-size="13.5" fill="#3a4f93">猜 D2</text>
  <line x1="472" y1="122" x2="490" y2="122" stroke="#4c65b6" stroke-width="1.6" marker-end="url(#sdfm-arr-b)"/>
  <rect x="494" y="108" width="60" height="28" rx="4" fill="#ffffff" stroke="#4c65b6" stroke-width="1.2"/>
  <text x="524" y="127" text-anchor="middle" font-size="13.5" fill="#3a4f93">猜 D3</text>
  <!-- Parallel PARD -->
  <text x="326" y="164" font-size="13.5" font-weight="700" fill="#065f56">并行草稿（PARD）：占位一步出 K</text>
  <rect x="326" y="172" width="248" height="30" rx="4" fill="#ddf4ef" stroke="#087f73" stroke-width="1.2"/>
  <text x="450" y="192" text-anchor="middle" font-size="13.5" fill="#065f56">[mask, mask, mask] → 1 次出 D1..D3</text>
  <text x="326" y="226" font-size="13.5" fill="#4d5652">须专用训练权重，不可硬开开关</text>
  <text x="326" y="248" font-size="13.5" fill="#8f3229">与主模型同卡竞争显存与容量</text>

  <!-- Column 3: Reuse Main Hidden States (EAGLE / MTP) -->
  <rect x="608" y="48" width="276" height="218" rx="8" fill="#fff4cf" stroke="#c78300" stroke-width="1.4"/>
  <text x="622" y="74" font-size="15" font-weight="700" fill="#936300">C. 借主模型隐状态（EAGLE / MTP）</text>
  <!-- Mini visual: Hidden + Token -> lightweight head -->
  <rect x="622" y="90" width="114" height="34" rx="4" fill="#ffffff" stroke="#c78300" stroke-width="1.2"/>
  <text x="679" y="112" text-anchor="middle" font-size="13.5" fill="#936300">主干隐藏向量 h</text>
  <rect x="746" y="90" width="124" height="34" rx="4" fill="#ddf4ef" stroke="#087f73" stroke-width="1.2"/>
  <text x="808" y="112" text-anchor="middle" font-size="13.5" fill="#065f56">已定 token 嵌入</text>
  <line x1="744" y1="126" x2="744" y2="148" stroke="#c78300" stroke-width="1.6" marker-end="url(#sdfm-arr-a)"/>
  <rect x="622" y="152" width="248" height="34" rx="5" fill="#ffffff" stroke="#c78300" stroke-width="1.5"/>
  <text x="746" y="174" text-anchor="middle" font-size="13.5" font-weight="700" fill="#936300">轻量预测层 + 共用 lm_head</text>
  <text x="622" y="212" font-size="13.5" fill="#17211f">GLM 自带第 45 层同检点加载</text>
  <text x="622" y="234" font-size="13.5" fill="#4d5652">注：Gemma4 MTP 用独立检查点</text>
  <text x="622" y="254" font-size="13.5" fill="#8f3229">mlp_speculator 四版 Ascend 未接</text>

  <!-- Bottom Zone: GLM 1-Layer MTP x 3 Serial Loop = 45 + 3x1 = 48 Layers -->
  <line x1="16" y1="286" x2="884" y2="286" stroke="#b8bcb5" stroke-width="1.4" stroke-dasharray="6 5"/>
  <circle cx="26" cy="312" r="12" fill="#c78300"/>
  <text x="26" y="316.5" text-anchor="middle" font-size="13" font-weight="700" fill="#ffffff">2</text>
  <text x="46" y="318" font-size="16" font-weight="700" fill="#17211f">GLM 单层 MTP 连跑 3 遍：只有 1 个预测层，但每步串行调用 K = 3 次（45 + 3 = 48 层）</text>

  <!-- Main backbone 45 layers block -->
  <rect x="16" y="336" width="206" height="58" rx="6" fill="#e8edff" stroke="#4c65b6" stroke-width="1.5"/>
  <text x="119" y="360" text-anchor="middle" font-size="14.5" font-weight="700" fill="#3a4f93">主干 45 层并行验证</text>
  <text x="119" y="382" text-anchor="middle" font-size="13.5" fill="#4d5652">FULL_DECODE_ONLY 图</text>

  <line x1="224" y1="365" x2="254" y2="365" stroke="#c78300" stroke-width="1.8" marker-end="url(#sdfm-arr-a)"/>

  <!-- 3 serial MTP passes -->
  <rect x="258" y="336" width="188" height="58" rx="6" fill="#fff4cf" stroke="#c78300" stroke-width="1.4"/>
  <text x="352" y="360" text-anchor="middle" font-size="14" font-weight="700" fill="#936300">MTP 第 1 遍 → 猜 D1</text>
  <text x="352" y="382" text-anchor="middle" font-size="13" fill="#4d5652">用主干 h + 刚定词（eager）</text>

  <line x1="448" y1="365" x2="474" y2="365" stroke="#c78300" stroke-width="1.8" marker-end="url(#sdfm-arr-a)"/>

  <rect x="478" y="336" width="188" height="58" rx="6" fill="#fff4cf" stroke="#c78300" stroke-width="1.4"/>
  <text x="572" y="360" text-anchor="middle" font-size="14" font-weight="700" fill="#936300">MTP 第 2 遍 → 猜 D2</text>
  <text x="572" y="382" text-anchor="middle" font-size="13" fill="#4d5652">h 换第 1 遍输出，位置 +1</text>

  <line x1="668" y1="365" x2="694" y2="365" stroke="#c78300" stroke-width="1.8" marker-end="url(#sdfm-arr-a)"/>

  <rect x="698" y="336" width="186" height="58" rx="6" fill="#fff4cf" stroke="#c78300" stroke-width="1.4"/>
  <text x="791" y="360" text-anchor="middle" font-size="14" font-weight="700" fill="#936300">MTP 第 3 遍 → 猜 D3</text>
  <text x="791" y="382" text-anchor="middle" font-size="13" fill="#4d5652">每遍各算索引器 + ≥2 通信</text>

  <text x="16" y="422" font-size="13.5" fill="#4d5652">固定镜像中 GLM 草稿强制 eager 且按两个 DP 组较大宽度对齐陪跑；extract_hidden_states（K=1）仅用于采集训练数据，非提速开关</text>
</svg>
