<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 610" width="900" height="610" role="img" aria-label="Speculative Decoding 投机解码 MTP 立体拆解直觉图：展示左侧 MTP DRAFT 草稿层与 D1..D3 候选盘、中央主模型一次并行验证 T0 与 D1..D3 四格、右侧输出盘 2 枚 ACCEPTED 蓝块（D1, D2）加 1 枚 RESAMPLED 陶红重采样块共 3 个新输出 token" font-family="var(--font-sans)">
  <title>Speculative Decoding（MTP 投机解码）立体拆解直觉：左侧轻量 MTP 草稿层连续猜出 K=3 个候选 token（D1, D2, D3）；中央主模型把已确认的 T0 与 3 个候选拼成 1+K=4 个位置一次并行前向验证，借一次权重读取服务 4 行；右侧输出盘只承接本轮新产出——留下 2 枚蓝色 ACCEPTED（D1, D2）并在首个错位处补出 1 枚陶红 RESAMPLED，共写出 3 个新 token（T0 仅留在中央验证器）。</title>
  <desc>关联源码符号：SpeculativeConfig, num_speculative_tokens, method, bonus_token_ids, rejection_sample, get_spec_decode_method, AscendEagleProposer, is_multi_kv_cache_group_mtp</desc>

  <!-- 紧裁透明底等距拆解剖面主图（1200×494 原生比例 2.429 -> 800×329，零外层底框） -->
  <image href="./wiki-illustrations/speculative-mtp-cutaway.webp" x="50" y="136" width="800" height="329" preserveAspectRatio="xMidYMid meet"/>

  <!-- 零交叉垂直引线与双环靶点 -->
  <line x1="136" y1="114" x2="136" y2="226" stroke="#087f73" stroke-width="1.6"/>
  <circle cx="136" cy="226" r="5.5" fill="#ffffff" stroke="#087f73" stroke-width="2"/>
  <circle cx="136" cy="226" r="2.5" fill="#087f73"/>

  <line x1="504" y1="114" x2="504" y2="214" stroke="#c78300" stroke-width="1.6"/>
  <circle cx="504" cy="214" r="5.5" fill="#ffffff" stroke="#c78300" stroke-width="2"/>
  <circle cx="504" cy="214" r="2.5" fill="#c78300"/>

  <line x1="690" y1="114" x2="690" y2="354" stroke="#4c65b6" stroke-width="1.6"/>
  <circle cx="690" cy="354" r="5.5" fill="#ffffff" stroke="#4c65b6" stroke-width="2"/>
  <circle cx="690" cy="354" r="2.5" fill="#4c65b6"/>

  <line x1="290" y1="484" x2="290" y2="388" stroke="#087f73" stroke-width="1.6"/>
  <circle cx="290" cy="388" r="5.5" fill="#ffffff" stroke="#087f73" stroke-width="2"/>
  <circle cx="290" cy="388" r="2.5" fill="#087f73"/>

  <line x1="772" y1="484" x2="772" y2="334" stroke="#b54237" stroke-width="1.6"/>
  <circle cx="772" cy="334" r="5.5" fill="#ffffff" stroke="#b54237" stroke-width="2"/>
  <circle cx="772" cy="334" r="2.5" fill="#b54237"/>

  <g id="callout-mtp">
    <circle cx="24" cy="28" r="12" fill="#087f73"/>
    <text x="24" y="32.5" text-anchor="middle" font-size="13" font-weight="700" fill="#ffffff">1</text>
    <text x="44" y="33" font-size="15" font-weight="700" fill="#17211f">MTP 轻量草稿头 (<tspan font-family="var(--font-mono)">method="mtp"</tspan>)</text>
    <text x="44" y="58" font-size="13.5" fill="#4d5652">复用主模型隐状态便宜猜出后续词</text>
    <text x="44" y="81" font-size="13.5" fill="#4d5652">昇腾经 <tspan font-family="var(--font-mono)" font-weight="700">AscendEagleProposer</tspan> 调度</text>
    <text x="44" y="104" font-size="13.5" fill="#065f56">步内顺序：先验本轮，再猜下轮候选</text>
  </g>

  <g id="callout-verify">
    <circle cx="316" cy="28" r="12" fill="#c78300"/>
    <text x="316" y="32.5" text-anchor="middle" font-size="13" font-weight="700" fill="#ffffff">2</text>
    <text x="336" y="33" font-size="15" font-weight="700" fill="#17211f">主模型单步并行验 1 + K 格</text>
    <text x="336" y="58" font-size="13.5" fill="#4d5652">将已定 T0 与 D1..D3 共 4 格并排送入</text>
    <text x="336" y="81" font-size="13.5" fill="#4d5652">一次权重读取同时服务 1 + K 行</text>
    <text x="336" y="104" font-size="13.5" fill="#936300">T0 仅作输入前缀，每格错一位预测</text>
  </g>

  <g id="callout-accepted">
    <circle cx="608" cy="28" r="12" fill="#4c65b6"/>
    <text x="608" y="32.5" text-anchor="middle" font-size="13" font-weight="700" fill="#ffffff">3</text>
    <text x="628" y="33" font-size="15" font-weight="700" fill="#17211f">接受前缀 ACCEPTED (D1, D2)</text>
    <text x="628" y="58" font-size="13.5" fill="#4d5652">从左往右逐位核验，连对 2 枚即留用</text>
    <text x="628" y="81" font-size="13.5" fill="#4d5652">若 3 枚全对再加 1 枚 <tspan font-family="var(--font-mono)" font-weight="700">bonus</tspan> token</text>
    <text x="628" y="104" font-size="13.5" fill="#3a4f93">写下什么永远由主模型分布严格决定</text>
  </g>

  <g id="callout-drafts">
    <circle cx="28" cy="502" r="12" fill="#087f73"/>
    <text x="28" y="506.5" text-anchor="middle" font-size="13" font-weight="700" fill="#ffffff">4</text>
    <text x="48" y="507" font-size="15" font-weight="700" fill="#17211f">候选草稿盘 (<tspan font-family="var(--font-mono)">num_speculative_tokens = 3</tspan>)</text>
    <text x="48" y="532" font-size="14" fill="#4d5652">由上一轮末尾连续猜出 K = 3 个草稿（D1, D2, D3）</text>
    <text x="48" y="556" font-size="14" fill="#4d5652">候选位同样占用 KV 槽位，被拒位置留待下轮原地覆写</text>
    <text x="48" y="580" font-size="13.5" fill="#065f56">K 越大猜错浪费与草稿串行开销越高，高并发下可能反拖慢</text>
  </g>

  <g id="callout-resampled">
    <circle cx="472" cy="502" r="12" fill="#b54237"/>
    <text x="472" y="506.5" text-anchor="middle" font-size="13" font-weight="700" fill="#ffffff">5</text>
    <text x="492" y="507" font-size="15" font-weight="700" fill="#17211f">首个错位重采样 RESAMPLED（共出 3 新词）</text>
    <text x="492" y="532" font-size="14" fill="#4d5652"><tspan font-family="var(--font-mono)" font-weight="700">rejection_sample</tspan> 在 D3 错位写主模型答案并停下</text>
    <text x="492" y="556" font-size="14" fill="#4d5652">右盘 2 枚 ACCEPTED (D1, D2) + 1 枚 RESAMPLED = 3 新词</text>
    <text x="492" y="580" font-size="13.5" fill="#8f3229">标准逐位拒绝采样且采样参数一致下，分布与主模型等价</text>
  </g>
</svg>
