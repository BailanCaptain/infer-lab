caption: >-
  Speculative Decoding（MTP 投机解码）立体拆解直觉：左侧轻量 MTP 草稿头连续猜出 K=3 个候选 token（D1, D2, D3），送入中央主模型与已确认的 T0 拼成 1+K=4 格一次并行前向验证；右侧从左往右错格核验，留下连续命中的前缀（ACCEPTED），在首个错位处用主模型分布当场重采样（RESAMPLED）并截断后续作废位置。
