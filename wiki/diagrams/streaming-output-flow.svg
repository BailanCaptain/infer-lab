<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 820" width="880" height="820" role="img" aria-label="一步的结果怎样变成 SSE 片段。引擎进程每步追加 token、判结束 token 和长度，有新 token 或已结束才把结果经 ZMQ 发到前端。前端进程里有两类任务：一个后台输出任务替所有请求做反分词、查停止字符串、算文本增量，放进各请求的收集器；每条请求还有一个 HTTP 任务，从收集器取出结果，拼成片段写进连接。停止字符串命中而引擎还没停、或客户端断开时，前端通知引擎终止这条请求；截掉停止字符串后剩下的文字照常算增量、推出去">
  <title>一步的结果怎样变成 SSE 片段。引擎进程每步追加 token、判结束 token 和长度，有新 token 或已结束才把结果经 ZMQ 发到前端。前端进程里有两类任务：一个后台输出任务替所有请求做反分词、查停止字符串、算文本增量，放进各请求的收集器；每条请求还有一个 HTTP 任务，从收集器取出结果，拼成片段写进连接。停止字符串命中而引擎还没停、或客户端断开时，前端通知引擎终止这条请求；截掉停止字符串后剩下的文字照常算增量、推出去</title>
  <defs><marker id="streaming-output-flow-ah-ink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="var(--color-ink, #17211f)"/></marker><marker id="streaming-output-flow-ah-comm" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="var(--color-comm, #9a4b86)"/></marker></defs>
  <rect x="24" y="40" width="832" height="166" rx="16" fill="none" stroke="var(--color-line-strong, #b8bcb5)" stroke-width="1.5"/>
  <text x="40" y="28" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="15" font-weight="700" fill="var(--color-ink, #17211f)">EngineCore · 每步一次</text>
  <rect x="24" y="252" width="832" height="252" rx="16" fill="none" stroke="var(--color-line-strong, #b8bcb5)" stroke-width="1.5"/>
  <text x="40" y="240" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="15" font-weight="700" fill="var(--color-ink, #17211f)">API server · 后台输出任务（所有请求共用）</text>
  <rect x="24" y="548" width="832" height="250" rx="16" fill="none" stroke="var(--color-line-strong, #b8bcb5)" stroke-width="1.5"/>
  <text x="40" y="536" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="15" font-weight="700" fill="var(--color-ink, #17211f)">API server · 这条请求的 HTTP 任务</text>
  <path d="M244 112 L244 136" fill="none" stroke="var(--color-ink, #17211f)" stroke-width="1.4" marker-end="url(#streaming-output-flow-ah-ink)"/>
  <path d="M400 190 L400 272" fill="none" stroke="var(--color-comm, #9a4b86)" stroke-width="2.2" marker-end="url(#streaming-output-flow-ah-comm)"/>
  <path d="M656 350 L656 190" fill="none" stroke="var(--color-comm, #9a4b86)" stroke-width="2.2" marker-end="url(#streaming-output-flow-ah-comm)"/>
  <path d="M244 326 L244 350" fill="none" stroke="var(--color-ink, #17211f)" stroke-width="1.4" marker-end="url(#streaming-output-flow-ah-ink)"/>
  <path d="M444 377 L476 377" fill="none" stroke="var(--color-ink, #17211f)" stroke-width="1.4" marker-end="url(#streaming-output-flow-ah-ink)"/>
  <path d="M244 404 L244 428" fill="none" stroke="var(--color-ink, #17211f)" stroke-width="1.4" marker-end="url(#streaming-output-flow-ah-ink)"/>
  <path d="M444 455 L476 455" fill="none" stroke="var(--color-ink, #17211f)" stroke-width="1.4" marker-end="url(#streaming-output-flow-ah-ink)"/>
  <path d="M656 482 L656 568" fill="none" stroke="var(--color-ink, #17211f)" stroke-width="1.4" marker-end="url(#streaming-output-flow-ah-ink)"/>
  <path d="M656 622 L656 646" fill="none" stroke="var(--color-ink, #17211f)" stroke-width="1.4" marker-end="url(#streaming-output-flow-ah-ink)"/>
  <path d="M476 673 L444 673" fill="none" stroke="var(--color-ink, #17211f)" stroke-width="1.4" marker-end="url(#streaming-output-flow-ah-ink)"/>
  <path d="M244 700 L244 724" fill="none" stroke="var(--color-ink, #17211f)" stroke-width="1.4" marker-end="url(#streaming-output-flow-ah-ink)"/>
  <path d="M244 646 L244 595 L476 595" fill="none" stroke="var(--color-ink, #17211f)" stroke-width="1.4" stroke-dasharray="7 5" marker-end="url(#streaming-output-flow-ah-ink)"/>
  <path d="M560 404 L560 416 L420 416 L420 428" fill="none" stroke="var(--color-ink, #17211f)" stroke-width="1.4" marker-end="url(#streaming-output-flow-ah-ink)"/>
  <path d="M836 751 L868 751 L868 163 L836 163" fill="none" stroke="var(--color-comm, #9a4b86)" stroke-width="2.2" stroke-dasharray="7 5" marker-end="url(#streaming-output-flow-ah-comm)"/>
  <rect x="44" y="58" width="400" height="54" rx="8" fill="var(--color-control, #66716d)" stroke="var(--color-ink, #17211f)" stroke-width="1.5"/>
  <text x="244" y="81" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="14" font-weight="700" fill="var(--color-ink-inverse, #ffffff)" text-anchor="middle">逐个追加本步 token，判结束 token 与长度</text>
  <text x="244" y="100" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="13" font-weight="400" fill="var(--color-ink-inverse, #ffffff)" text-anchor="middle">命中就丢掉本步余下的 token</text>
  <rect x="44" y="136" width="400" height="54" rx="8" fill="var(--color-control, #66716d)" stroke="var(--color-ink, #17211f)" stroke-width="1.5"/>
  <text x="244" y="159" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="14" font-weight="700" fill="var(--color-ink-inverse, #ffffff)" text-anchor="middle">有新 token 或已结束，才发结果</text>
  <text x="244" y="178" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="13" font-weight="400" fill="var(--color-ink-inverse, #ffffff)" text-anchor="middle">prefill 没做完的那几步不发</text>
  <rect x="476" y="136" width="360" height="54" rx="8" fill="var(--color-kv, #4c65b6)" stroke="var(--color-ink, #17211f)" stroke-width="1.5"/>
  <text x="656" y="168" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="14" font-weight="700" fill="var(--color-ink-inverse, #ffffff)" text-anchor="middle">终止请求，归还显存块</text>
  <rect x="44" y="272" width="400" height="54" rx="8" fill="var(--color-control, #66716d)" stroke="var(--color-ink, #17211f)" stroke-width="1.5"/>
  <text x="244" y="295" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="14" font-weight="700" fill="var(--color-ink-inverse, #ffffff)" text-anchor="middle">取出这批结果，分片处理</text>
  <text x="244" y="314" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="13" font-weight="400" fill="var(--color-ink-inverse, #ffffff)" text-anchor="middle">片与片之间让出 CPU</text>
  <rect x="44" y="350" width="400" height="54" rx="8" fill="var(--color-token, #087f73)" stroke="var(--color-ink, #17211f)" stroke-width="1.5"/>
  <text x="244" y="382" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="14" font-weight="700" fill="var(--color-ink-inverse, #ffffff)" text-anchor="middle">增量反分词，查停止字符串</text>
  <rect x="476" y="350" width="360" height="54" rx="8" fill="var(--color-comm, #9a4b86)" stroke="var(--color-ink, #17211f)" stroke-width="1.5"/>
  <text x="656" y="373" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="14" font-weight="700" fill="var(--color-ink-inverse, #ffffff)" text-anchor="middle">命中了，而引擎还没停</text>
  <text x="656" y="392" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="13" font-weight="400" fill="var(--color-ink-inverse, #ffffff)" text-anchor="middle">截掉停止字符串，通知引擎终止</text>
  <rect x="44" y="428" width="400" height="54" rx="8" fill="var(--color-token, #087f73)" stroke="var(--color-ink, #17211f)" stroke-width="1.5"/>
  <text x="244" y="451" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="14" font-weight="700" fill="var(--color-ink-inverse, #ffffff)" text-anchor="middle">算这次的文本增量</text>
  <text x="244" y="470" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="13" font-weight="400" fill="var(--color-ink-inverse, #ffffff)" text-anchor="middle">设了停止字符串就扣住结尾几个字</text>
  <rect x="476" y="428" width="360" height="54" rx="8" fill="var(--color-token-soft, #ddf4ef)" stroke="var(--color-token, #087f73)" stroke-opacity="0.4" stroke-width="1.5" stroke-dasharray="5 4"/>
  <text x="656" y="451" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="13" font-weight="400" fill="#065f56" text-anchor="middle">放进这条请求的收集器</text>
  <text x="656" y="470" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="13" font-weight="400" fill="#065f56" text-anchor="middle">上次的还没被取走，就并在一起</text>
  <rect x="476" y="568" width="360" height="54" rx="8" fill="var(--color-comm-soft, #f7e7f2)" stroke="var(--color-comm, #9a4b86)" stroke-opacity="0.4" stroke-width="1.5" stroke-dasharray="5 4"/>
  <text x="656" y="600" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="13" font-weight="400" fill="#7a3a6a" text-anchor="middle">取出收集器里的结果</text>
  <rect x="476" y="646" width="360" height="54" rx="8" fill="var(--color-comm, #9a4b86)" stroke="var(--color-ink, #17211f)" stroke-width="1.5"/>
  <text x="656" y="669" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="14" font-weight="700" fill="var(--color-ink-inverse, #ffffff)" text-anchor="middle">拼一个片段</text>
  <text x="656" y="688" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="13" font-weight="400" fill="var(--color-ink-inverse, #ffffff)" text-anchor="middle">新增文字，或思考段、工具调用</text>
  <rect x="44" y="646" width="400" height="54" rx="8" fill="var(--color-comm, #9a4b86)" stroke="var(--color-ink, #17211f)" stroke-width="1.5"/>
  <text x="244" y="678" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="14" font-weight="700" fill="var(--color-ink-inverse, #ffffff)" text-anchor="middle">写进连接：一行 data，空一行</text>
  <rect x="44" y="724" width="400" height="54" rx="8" fill="var(--color-comm, #9a4b86)" stroke="var(--color-ink, #17211f)" stroke-width="1.5"/>
  <text x="244" y="756" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="14" font-weight="700" fill="var(--color-ink-inverse, #ffffff)" text-anchor="middle">结束原因片段 →（用量片段）→ [DONE]</text>
  <rect x="476" y="724" width="360" height="54" rx="8" fill="var(--color-surface-sunken, #ece9df)" stroke="var(--color-ink, #17211f)" stroke-width="1.5"/>
  <text x="656" y="747" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="14" font-weight="700" fill="var(--color-ink, #17211f)" text-anchor="middle">客户端断开</text>
  <text x="656" y="766" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="13" font-weight="400" fill="var(--color-ink, #17211f)" text-anchor="middle">同样通知引擎终止这条请求</text>
  <text x="412" y="224" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="13.5" font-weight="400" fill="#7a3a6a">ZMQ · 这一步所有请求的结果</text>
  <text x="668" y="224" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="13.5" font-weight="400" fill="#7a3a6a">终止</text>
  <text x="452" y="370" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="13" font-weight="400" fill="var(--color-ink, #17211f)">是</text>
  <text x="256" y="718" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="13" font-weight="400" fill="var(--color-ink, #17211f)">已结束</text>
  <text x="256" y="588" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="13" font-weight="400" fill="var(--color-ink, #17211f)">没结束：回去等下一段</text>
</svg>
