layout: figure
id: streaming-output-intuition
caption: 示意：一条请求先后生成 3 个 token，第 4 步抽到结束 token。每一步，引擎交回新编号；前端的增量反分词把它接在已有字节后面还原，凑不成完整的字就先攒着；判停之后，把这一步新增的文字包成一个 SSE 片段推给客户端。第 2 步只拿到半个字的字节，推出去的片段是空的；结束 token 不显示成文字，只在最后一个片段里写结束原因，随后发 [DONE] 表示流结束。判停分两处：结束 token 和长度由引擎判，停止字符串由前端在反分词之后判；第 4 步的停是引擎判的，前端据此不还原这个编号。编号与字节沿用 token 页的「推理」「犇」两例
