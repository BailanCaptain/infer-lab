<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 460" width="900" height="460" role="img" aria-label="昇腾 V1 整张 logits 往返 CPU 1:2 数据量比例条与 V2 NPU 原地 Triton 快路径对比" font-family="var(--font-sans)">
  <title>结构化输出施加掩码：昇腾 V1 整张 logits 往返（37.8 + 75.6 MiB）vs V2 / main NPU 原地 Triton 核</title>
  <desc>Proportional 1:2 bar comparison of Ascend V1 whole-logits round-trip (37.8 MiB BF16 NPU-to-CPU + 75.6 MiB FP32 CPU-to-NPU) vs V2/main NPU in-place Triton apply_grammar_bitmask</desc>
  <defs>
    <marker id="sop-arr-r" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="#b54237"/>
    </marker>
    <marker id="sop-arr-t" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="#087f73"/>
    </marker>
    <marker id="sop-arr-b" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="#4c65b6"/>
    </marker>
  </defs>

  <!-- ZONE 1: V1 Slow Path with True 1:2 Proportional Bars -->
  <text x="14" y="26" font-size="16" font-weight="700" fill="#8f3229">① 昇腾 V1 默认路径（v0.23–v0.30.0）：为何只约束 1 条请求也要搬整批 128 行 × 8 卡</text>

  <!-- Left: Full 128-row logits block on NPU -->
  <rect x="14" y="48" width="184" height="176" rx="7" fill="#ece9df" stroke="#b8bcb5" stroke-width="1.4"/>
  <text x="106" y="72" text-anchor="middle" font-size="14" font-weight="700" fill="#17211f">NPU 整张 logits</text>
  <text x="106" y="92" text-anchor="middle" font-size="13.5" font-family="var(--font-mono)" fill="#4d5652">[128, 154880]</text>
  <!-- 1 constrained request slice (4 rows) -->
  <rect x="28" y="104" width="156" height="24" rx="4" fill="#ddf4ef" stroke="#087f73" stroke-width="1.3"/>
  <text x="106" y="121" text-anchor="middle" font-size="13.5" font-weight="700" fill="#065f56">R1（4 行受约束）</text>
  <!-- 31 unconstrained requests slice (124 rows) -->
  <rect x="28" y="132" width="156" height="80" rx="4" fill="#ffffff" stroke="#b8bcb5" stroke-width="1.2" stroke-dasharray="4 3"/>
  <text x="106" y="164" text-anchor="middle" font-size="13.5" fill="#66716d">其余 31 条无约束</text>
  <text x="106" y="186" text-anchor="middle" font-size="13.5" fill="#8f3229" font-weight="700">V1 仍整张一起搬！</text>

  <!-- Middle: True 1:2 Proportional Round-Trip Bars (220px vs 440px) -->
  <text x="220" y="64" font-size="14" font-weight="700" fill="#17211f">单卡每步往返搬运量（按真实 1 : 2 字节比例绘制）</text>

  <!-- Bar A: NPU -> CPU BF16 = 37.8 MiB (220px) -->
  <text x="220" y="92" font-size="13.5" font-weight="700" fill="#3a4f93">去程 NPU → CPU（BF16，2 B/数）</text>
  <rect x="220" y="100" width="220" height="34" rx="5" fill="#e8edff" stroke="#4c65b6" stroke-width="1.5"/>
  <text x="330" y="122" text-anchor="middle" font-size="14" font-weight="700" fill="#3a4f93">37.8 MiB（1×）</text>
  <path d="M 442 117 L 672 117" fill="none" stroke="#4c65b6" stroke-width="1.8" marker-end="url(#sop-arr-b)"/>
  <text x="557" y="109" text-anchor="middle" font-size="13.5" fill="#4d5652">整批拷到主机转 FP32</text>

  <!-- Bar B: CPU -> NPU FP32 = 75.6 MiB (440px = EXACT 2x) -->
  <text x="220" y="162" font-size="13.5" font-weight="700" fill="#8f3229">回程 CPU → NPU（FP32，4 B/数，宽为去程 2 倍）</text>
  <rect x="220" y="170" width="440" height="34" rx="5" fill="#fff0e9" stroke="#b54237" stroke-width="1.5"/>
  <text x="440" y="192" text-anchor="middle" font-size="14" font-weight="700" fill="#8f3229">75.6 MiB（2×）→ 回 NPU 再转回 BF16</text>
  <path d="M 678 187 L 664 187" fill="none" stroke="#b54237" stroke-width="1.8" marker-end="url(#sop-arr-r)"/>

  <!-- Right CPU Box -->
  <rect x="680" y="88" width="204" height="122" rx="7" fill="#fff4cf" stroke="#c78300" stroke-width="1.4"/>
  <text x="782" y="114" text-anchor="middle" font-size="14.5" font-weight="700" fill="#936300">主机 CPU 侧改写</text>
  <text x="782" y="140" text-anchor="middle" font-size="13.5" fill="#4d5652">1. logits 转 FP32</text>
  <text x="782" y="164" text-anchor="middle" font-size="13.5" fill="#4d5652">2. 调 xgrammar 改 −∞</text>
  <text x="782" y="188" text-anchor="middle" font-size="13.5" font-weight="700" fill="#8f3229">3. 8 张卡各自搬一遍</text>

  <!-- Summary pill for Zone 1 -->
  <rect x="14" y="236" width="870" height="34" rx="6" fill="#fff0e9" stroke="#b54237" stroke-width="1.2"/>
  <text x="449" y="258" text-anchor="middle" font-size="14" font-weight="700" fill="#8f3229">V1 满载单步合计：37.8 + 75.6 ≈ 113.4 MiB / 卡 / 步（整机 8 卡同步各自搬运，未计其他开销）</text>

  <line x1="14" y1="286" x2="886" y2="286" stroke="#b8bcb5" stroke-width="1.4" stroke-dasharray="6 5"/>

  <!-- ZONE 2: V2 / main NPU In-Place Triton Kernel -->
  <text x="14" y="314" font-size="16" font-weight="700" fill="#065f56">② 昇腾 V2 / main NPU 原地 Triton 快路径（0 MiB logits 往返）</text>
  <text x="884" y="314" text-anchor="end" font-size="13.5" fill="#4d5652">v0.30.0 需 VLLM_USE_V2_MODEL_RUNNER=1 · main 默认</text>

  <!-- EngineCore compact bitmask -->
  <rect x="14" y="332" width="246" height="114" rx="7" fill="#e8edff" stroke="#4c65b6" stroke-width="1.4"/>
  <text x="137" y="354" text-anchor="middle" font-size="14.5" font-weight="700" fill="#3a4f93">EngineCore CPU 位图</text>
  <text x="137" y="376" text-anchor="middle" font-size="13.5" fill="#4d5652">每 32 词打包 1 个 int32</text>
  <!-- Proportional tiny bar: 75.6 KiB (1 req) ~ 4px, 2.36 MiB (128-row ceiling) ~ 14px -->
  <rect x="24" y="388" width="14" height="20" rx="3" fill="#087f73"/>
  <text x="44" y="403" font-size="13.5" font-weight="700" fill="#065f56">单请求 4 行 ≈ 75.6 KiB</text>
  <text x="137" y="430" text-anchor="middle" font-size="13.5" fill="#3a4f93">满载 128 行上限 2.36 MiB + 索引</text>

  <path d="M 260 389 L 302 389" fill="none" stroke="#087f73" stroke-width="2" marker-end="url(#sop-arr-t)"/>
  <text x="281" y="379" text-anchor="middle" font-size="13.5" font-weight="700" fill="#065f56">单向</text>

  <!-- NPU In-Place Triton Box -->
  <rect x="308" y="332" width="376" height="114" rx="7" fill="#ddf4ef" stroke="#087f73" stroke-width="1.5"/>
  <text x="496" y="358" text-anchor="middle" font-size="14.5" font-weight="700" fill="#065f56">NPU 原地 Triton 核（不离开 HBM）</text>
  <text x="496" y="384" text-anchor="middle" font-size="13.5" font-family="var(--font-mono)" fill="#065f56">_apply_grammar_bitmask_kernel_impl</text>
  <text x="496" y="408" text-anchor="middle" font-size="13.5" fill="#17211f">按 bitmask_ptr 片上展开 → bit=0 原地写 −∞</text>
  <text x="496" y="432" text-anchor="middle" font-size="13.5" fill="#4d5652">logits [128, 154880] 留在 HBM，免 FP32 拷贝</text>

  <path d="M 684 389 L 716 389" fill="none" stroke="#087f73" stroke-width="2" marker-end="url(#sop-arr-t)"/>

  <!-- Output to Sampling -->
  <rect x="722" y="332" width="162" height="114" rx="7" fill="#fff4cf" stroke="#c78300" stroke-width="1.4"/>
  <text x="803" y="366" text-anchor="middle" font-size="14.5" font-weight="700" fill="#936300">直接进采样</text>
  <text x="803" y="392" text-anchor="middle" font-size="13.5" fill="#4d5652">与草稿验证</text>
  <text x="803" y="420" text-anchor="middle" font-size="13.5" font-weight="700" fill="#065f56">0 MiB logits 往返</text>
</svg>
