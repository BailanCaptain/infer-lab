<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 520" width="900" height="520" role="img" aria-label="MTP 4 行文法位图临时推进、-1 截断补全 1、回滚与 Worker 按 req_id 对齐图" font-family="var(--font-sans)">
  <title>MTP 4 行文法位图网格：临时推进与回滚、−1 截断全 1 规则与 Worker 按 req_id 对齐</title>
  <desc>4-row MTP grammar bitmask speculative advance, rollback, -1 truncation all-1s rule, and worker-side req_id row alignment</desc>
  <defs>
    <marker id="som-arr-t" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="#087f73"/>
    </marker>
    <marker id="som-arr-p" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="#9a4b86"/>
    </marker>
    <marker id="som-arr-b" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="#4c65b6"/>
    </marker>
    <marker id="som-arr-r" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="#b54237"/>
    </marker>
  </defs>

  <!-- UPPER LEFT: Normal 4-Row MTP Speculative Advance & Rollback -->
  <text x="14" y="26" font-size="15.5" font-weight="700" fill="#17211f">① 正常 1+3 MTP：逐草稿临时推进填 4 行，再回滚</text>
  <text x="466" y="26" font-size="15.5" font-weight="700" fill="#17211f">② 截断为 [d₁,−1,−1]：行 1 遇 −1 停进，行 2/3 全 1</text>
  <line x1="450" y1="12" x2="450" y2="332" stroke="#d8d8cf" stroke-width="1.3" stroke-dasharray="5 4"/>

  <!-- Left column states S0..S3 -->
  <g stroke-width="1.4">
    <rect x="48" y="46" width="66" height="36" rx="6" fill="#ddf4ef" stroke="#087f73"/>
    <rect x="48" y="108" width="66" height="36" rx="6" fill="#e8edff" stroke="#4c65b6"/>
    <rect x="48" y="170" width="66" height="36" rx="6" fill="#e8edff" stroke="#4c65b6"/>
    <rect x="48" y="232" width="66" height="36" rx="6" fill="#e8edff" stroke="#4c65b6"/>
  </g>
  <g text-anchor="middle" font-weight="700" font-size="14">
    <text x="81" y="69" fill="#065f56">状态 S₀</text>
    <text x="81" y="131" fill="#3a4f93">临时 S₁</text>
    <text x="81" y="193" fill="#3a4f93">临时 S₂</text>
    <text x="81" y="255" fill="#3a4f93">临时 S₃</text>
  </g>
  <!-- Vertical advance arrows between states -->
  <path d="M 81 82 L 81 104" fill="none" stroke="#4c65b6" stroke-width="1.6" marker-end="url(#som-arr-b)"/>
  <path d="M 81 144 L 81 166" fill="none" stroke="#4c65b6" stroke-width="1.6" marker-end="url(#som-arr-b)"/>
  <path d="M 81 206 L 81 228" fill="none" stroke="#4c65b6" stroke-width="1.6" marker-end="url(#som-arr-b)"/>
  <g font-size="13.5" fill="#3a4f93" font-family="var(--font-mono)">
    <text x="88" y="99">+d₁</text>
    <text x="88" y="161">+d₂</text>
    <text x="88" y="223">+d₃</text>
  </g>
  <!-- Rollback curved return arrow on far left -->
  <path d="M 48 250 L 24 250 L 24 64 L 44 64" fill="none" stroke="#b54237" stroke-width="2" marker-end="url(#som-arr-r)"/>
  <rect x="14" y="275" width="420" height="49" rx="6" fill="#fff0e9" stroke="#b54237" stroke-width="1.3"/>
  <text x="26" y="295" font-size="13" font-weight="700" fill="#8f3229">填完 4 行立刻 rollback(3) 退回 S₀</text>
  <text x="26" y="315" font-size="13" font-weight="700" fill="#8f3229">→ 采样后再正式 commit 已接受 token</text>

  <!-- Arrows from states S0..S3 to 4 bitmask rows -->
  <path d="M 114 64 L 146 64" fill="none" stroke="#087f73" stroke-width="1.5" marker-end="url(#som-arr-t)"/>
  <path d="M 114 126 L 146 126" fill="none" stroke="#4c65b6" stroke-width="1.5" marker-end="url(#som-arr-b)"/>
  <path d="M 114 188 L 146 188" fill="none" stroke="#4c65b6" stroke-width="1.5" marker-end="url(#som-arr-b)"/>
  <path d="M 114 250 L 146 250" fill="none" stroke="#4c65b6" stroke-width="1.5" marker-end="url(#som-arr-b)"/>

  <!-- 4-Row Bitmask Grid (Normal) -->
  <!-- Row 0: 0 1 0 0 1 0 1 0 -->
  <text x="154" y="54" font-size="13.5" font-weight="700" fill="#065f56">行 0（已确定位）</text>
  <g stroke-width="1.2" font-family="var(--font-mono)" font-size="13.5" text-anchor="middle">
    <rect x="154" y="60" width="32" height="24" rx="3" fill="#ece9df" stroke="#b8bcb5"/><text x="170" y="77" fill="#66716d">0</text>
    <rect x="188" y="60" width="32" height="24" rx="3" fill="#ddf4ef" stroke="#087f73"/><text x="204" y="77" font-weight="700" fill="#065f56">1</text>
    <rect x="222" y="60" width="32" height="24" rx="3" fill="#ece9df" stroke="#b8bcb5"/><text x="238" y="77" fill="#66716d">0</text>
    <rect x="256" y="60" width="32" height="24" rx="3" fill="#ece9df" stroke="#b8bcb5"/><text x="272" y="77" fill="#66716d">0</text>
    <rect x="290" y="60" width="32" height="24" rx="3" fill="#ddf4ef" stroke="#087f73"/><text x="306" y="77" font-weight="700" fill="#065f56">1</text>
    <rect x="324" y="60" width="32" height="24" rx="3" fill="#ece9df" stroke="#b8bcb5"/><text x="340" y="77" fill="#66716d">0</text>
    <rect x="358" y="60" width="32" height="24" rx="3" fill="#ddf4ef" stroke="#087f73"/><text x="374" y="77" font-weight="700" fill="#065f56">1</text>
    <rect x="392" y="60" width="32" height="24" rx="3" fill="#ece9df" stroke="#b8bcb5"/><text x="408" y="77" fill="#66716d">0</text>
  </g>
  <!-- Row 1: 1 0 0 0 0 1 0 0 -->
  <text x="154" y="116" font-size="13.5" font-weight="700" fill="#3a4f93">行 1（验草稿 d₁ 后）</text>
  <g stroke-width="1.2" font-family="var(--font-mono)" font-size="13.5" text-anchor="middle">
    <rect x="154" y="122" width="32" height="24" rx="3" fill="#ddf4ef" stroke="#087f73"/><text x="170" y="139" font-weight="700" fill="#065f56">1</text>
    <rect x="188" y="122" width="32" height="24" rx="3" fill="#ece9df" stroke="#b8bcb5"/><text x="204" y="139" fill="#66716d">0</text>
    <rect x="222" y="122" width="32" height="24" rx="3" fill="#ece9df" stroke="#b8bcb5"/><text x="238" y="139" fill="#66716d">0</text>
    <rect x="256" y="122" width="32" height="24" rx="3" fill="#ece9df" stroke="#b8bcb5"/><text x="272" y="139" fill="#66716d">0</text>
    <rect x="290" y="122" width="32" height="24" rx="3" fill="#ece9df" stroke="#b8bcb5"/><text x="306" y="139" fill="#66716d">0</text>
    <rect x="324" y="122" width="32" height="24" rx="3" fill="#ddf4ef" stroke="#087f73"/><text x="340" y="139" font-weight="700" fill="#065f56">1</text>
    <rect x="358" y="122" width="32" height="24" rx="3" fill="#ece9df" stroke="#b8bcb5"/><text x="374" y="139" fill="#66716d">0</text>
    <rect x="392" y="122" width="32" height="24" rx="3" fill="#ece9df" stroke="#b8bcb5"/><text x="408" y="139" fill="#66716d">0</text>
  </g>
  <!-- Row 2: 0 0 1 0 0 0 0 1 -->
  <text x="154" y="178" font-size="13.5" font-weight="700" fill="#3a4f93">行 2（验草稿 d₂ 后）</text>
  <g stroke-width="1.2" font-family="var(--font-mono)" font-size="13.5" text-anchor="middle">
    <rect x="154" y="184" width="32" height="24" rx="3" fill="#ece9df" stroke="#b8bcb5"/><text x="170" y="201" fill="#66716d">0</text>
    <rect x="188" y="184" width="32" height="24" rx="3" fill="#ece9df" stroke="#b8bcb5"/><text x="204" y="201" fill="#66716d">0</text>
    <rect x="222" y="184" width="32" height="24" rx="3" fill="#ddf4ef" stroke="#087f73"/><text x="238" y="201" font-weight="700" fill="#065f56">1</text>
    <rect x="256" y="184" width="32" height="24" rx="3" fill="#ece9df" stroke="#b8bcb5"/><text x="272" y="201" fill="#66716d">0</text>
    <rect x="290" y="184" width="32" height="24" rx="3" fill="#ece9df" stroke="#b8bcb5"/><text x="306" y="201" fill="#66716d">0</text>
    <rect x="324" y="184" width="32" height="24" rx="3" fill="#ece9df" stroke="#b8bcb5"/><text x="340" y="201" fill="#66716d">0</text>
    <rect x="358" y="184" width="32" height="24" rx="3" fill="#ece9df" stroke="#b8bcb5"/><text x="374" y="201" fill="#66716d">0</text>
    <rect x="392" y="184" width="32" height="24" rx="3" fill="#ddf4ef" stroke="#087f73"/><text x="408" y="201" font-weight="700" fill="#065f56">1</text>
  </g>
  <!-- Row 3: 1 0 0 0 0 0 0 0 -->
  <text x="154" y="240" font-size="13.5" font-weight="700" fill="#3a4f93">行 3（验草稿 d₃ 后）</text>
  <g stroke-width="1.2" font-family="var(--font-mono)" font-size="13.5" text-anchor="middle">
    <rect x="154" y="246" width="32" height="24" rx="3" fill="#ddf4ef" stroke="#087f73"/><text x="170" y="263" font-weight="700" fill="#065f56">1</text>
    <rect x="188" y="246" width="32" height="24" rx="3" fill="#ece9df" stroke="#b8bcb5"/><text x="204" y="263" fill="#66716d">0</text>
    <rect x="222" y="246" width="32" height="24" rx="3" fill="#ece9df" stroke="#b8bcb5"/><text x="238" y="263" fill="#66716d">0</text>
    <rect x="256" y="246" width="32" height="24" rx="3" fill="#ece9df" stroke="#b8bcb5"/><text x="272" y="263" fill="#66716d">0</text>
    <rect x="290" y="246" width="32" height="24" rx="3" fill="#ece9df" stroke="#b8bcb5"/><text x="306" y="263" fill="#66716d">0</text>
    <rect x="324" y="246" width="32" height="24" rx="3" fill="#ece9df" stroke="#b8bcb5"/><text x="340" y="263" fill="#66716d">0</text>
    <rect x="358" y="246" width="32" height="24" rx="3" fill="#ece9df" stroke="#b8bcb5"/><text x="374" y="263" fill="#66716d">0</text>
    <rect x="392" y="246" width="32" height="24" rx="3" fill="#ece9df" stroke="#b8bcb5"/><text x="408" y="263" fill="#66716d">0</text>
  </g>

  <!-- UPPER RIGHT: -1 Truncation & All-1s Rules (chain([d1, -1, -1], [-1])) -->
  <g stroke-width="1.4">
    <rect x="468" y="46" width="112" height="36" rx="6" fill="#ddf4ef" stroke="#087f73"/>
    <rect x="468" y="102" width="112" height="36" rx="6" fill="#fff0e9" stroke="#b54237"/>
    <rect x="468" y="158" width="112" height="36" rx="6" fill="#fff4cf" stroke="#c78300"/>
    <rect x="468" y="214" width="112" height="36" rx="6" fill="#fff4cf" stroke="#c78300"/>
  </g>
  <g text-anchor="middle" font-size="13.5" font-weight="700">
    <text x="524" y="69" fill="#065f56">读 d₁ → S₁</text>
    <text x="524" y="125" fill="#8f3229">读 d₂ = −1</text>
    <text x="524" y="181" fill="#936300">读 d₃ = −1</text>
    <text x="524" y="237" fill="#936300">尾哨兵 −1</text>
  </g>
  <path d="M 524 82 L 524 98" fill="none" stroke="#4c65b6" stroke-width="1.5" marker-end="url(#som-arr-b)"/>
  <line x1="496" y1="148" x2="552" y2="148" stroke="#b54237" stroke-width="2.2"/>

  <path d="M 580 64 L 606 64" fill="none" stroke="#087f73" stroke-width="1.5" marker-end="url(#som-arr-t)"/>
  <path d="M 580 120 L 606 120" fill="none" stroke="#b54237" stroke-width="1.5" marker-end="url(#som-arr-r)"/>
  <path d="M 580 176 L 606 176" fill="none" stroke="#c78300" stroke-width="1.5"/>
  <path d="M 580 232 L 606 232" fill="none" stroke="#c78300" stroke-width="1.5"/>

  <g stroke-width="1.3">
    <rect x="612" y="46" width="272" height="36" rx="5" fill="#ddf4ef" stroke="#087f73"/>
    <rect x="612" y="102" width="272" height="36" rx="5" fill="#fff0e9" stroke="#b54237"/>
    <rect x="612" y="158" width="272" height="36" rx="5" fill="#fff4cf" stroke="#c78300"/>
    <rect x="612" y="214" width="272" height="36" rx="5" fill="#fff4cf" stroke="#c78300"/>
  </g>
  <g font-size="13.5">
    <text x="624" y="69" fill="#065f56">行 0：按 S₀ 填位图 → 推进 d₁ 至 S₁</text>
    <text x="624" y="125" font-weight="700" fill="#8f3229">行 1：按 S₁ 填位图 → 遇 −1 停推进</text>
    <text x="624" y="181" font-weight="700" fill="#936300">行 2：整行填全 1（不施掩码）</text>
    <text x="624" y="237" font-weight="700" fill="#936300">行 3：整行填全 1（int32 −1 不限）</text>
  </g>

  <!-- All-1s rule summary chips -->
  <rect x="468" y="266" width="416" height="56" rx="6" fill="#ece9df" stroke="#b8bcb5" stroke-width="1.3"/>
  <text x="480" y="290" font-size="13.5" font-weight="700" fill="#17211f">哪些行直接填全 1（apply_bitmask = False）？</text>
  <text x="480" y="312" font-size="13.5" fill="#4d5652">① 首遇 −1 后的其余行　② 文法已到终态　③ 思考段</text>

  <!-- Divider -->
  <line x1="14" y1="344" x2="886" y2="344" stroke="#b8bcb5" stroke-width="1.4" stroke-dasharray="6 5"/>

  <!-- LOWER BAND: Worker-side Request-ID Alignment -->
  <text x="14" y="370" font-size="15.5" font-weight="700" fill="#17211f">③ Worker 按 req_id 重排对齐：紧凑位图映射到整批 logits，无约束请求补全 1</text>

  <!-- EngineCore compact bitmask -->
  <text x="14" y="396" font-size="13.5" font-weight="700" fill="#7a3a6a">EngineCore 发出（仅含受约束请求）</text>
  <rect x="14" y="406" width="236" height="44" rx="6" fill="#ddf4ef" stroke="#087f73" stroke-width="1.4"/>
  <text x="132" y="433" text-anchor="middle" font-size="14" font-weight="700" fill="#065f56">req_A · 4 行位图（0/1）</text>
  <rect x="14" y="458" width="236" height="44" rx="6" fill="#f7e7f2" stroke="#9a4b86" stroke-width="1.4"/>
  <text x="132" y="485" text-anchor="middle" font-size="14" font-weight="700" fill="#7a3a6a">req_C · 4 行位图（0/1）</text>

  <!-- Routing arrows by req_id -->
  <path d="M 250 428 C 320 428, 330 416, 404 416" fill="none" stroke="#087f73" stroke-width="2" marker-end="url(#som-arr-t)"/>
  <path d="M 250 480 C 325 480, 335 488, 404 488" fill="none" stroke="#9a4b86" stroke-width="2" marker-end="url(#som-arr-p)"/>
  <rect x="270" y="436" width="118" height="32" rx="5" fill="#ece9df" stroke="#b8bcb5" stroke-width="1.2"/>
  <text x="329" y="457" text-anchor="middle" font-size="13.5" font-weight="700" fill="#17211f">按 req_id 对齐</text>

  <!-- Worker full logits aligned rows -->
  <text x="410" y="396" font-size="13.5" font-weight="700" fill="#17211f">Worker 本地 logits 行序（进出重排不串行，满载 32×4 = 128 行）</text>
  <rect x="410" y="402" width="474" height="30" rx="5" fill="#ddf4ef" stroke="#087f73" stroke-width="1.3"/>
  <text x="424" y="422" font-size="13.5" font-weight="700" fill="#065f56">行 0–3 · req_A（有 schema）</text>
  <text x="872" y="422" text-anchor="end" font-size="13.5" fill="#065f56">按位改 −∞</text>

  <rect x="410" y="438" width="474" height="30" rx="5" fill="#ece9df" stroke="#b8bcb5" stroke-width="1.3"/>
  <text x="424" y="458" font-size="13.5" font-weight="700" fill="#4d5652">行 4–7 · req_B（无约束）</text>
  <text x="872" y="458" text-anchor="end" font-size="13.5" fill="#66716d">对应位图填全 1，放行全部词表</text>

  <rect x="410" y="474" width="474" height="30" rx="5" fill="#f7e7f2" stroke="#9a4b86" stroke-width="1.3"/>
  <text x="424" y="494" font-size="13.5" font-weight="700" fill="#7a3a6a">行 8–11 · req_C（有 schema）</text>
  <text x="872" y="494" text-anchor="end" font-size="13.5" fill="#7a3a6a">按位改 −∞（余下无约束均全 1）</text>
</svg>
