<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 530" width="880" height="530" role="img" aria-label="结构化输出的代码流程。API server 校验请求、定下后端；处理这条请求的 EngineCore 在 CPU 上编译文法，每步派发前向后趁 NPU 计算填 bitmask，随采样调用发给本机 8 个 worker；worker 把 bitmask 作用到 logits 后采样，结果回到 EngineCore 推进文法。虚线是需要显式开启的 V2 分支。">
  <title>结构化输出的代码流程。API server 校验请求、定下后端；处理这条请求的 EngineCore 在 CPU 上编译文法，每步派发前向后趁 NPU 计算填 bitmask，随采样调用发给本机 8 个 worker；worker 把 bitmask 作用到 logits 后采样，结果回到 EngineCore 推进文法。虚线是需要显式开启的 V2 分支。</title>
  <defs><marker id="structured-output-flow-ah-ink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="var(--color-ink, #17211f)"/></marker><marker id="structured-output-flow-ah-danger" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="var(--color-danger, #b54237)"/></marker><marker id="structured-output-flow-ah-control" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="var(--color-control, #66716d)"/></marker><marker id="structured-output-flow-ah-token" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="var(--color-token, #087f73)"/></marker></defs>
  <rect x="12" y="40" width="180" height="470" rx="16" fill="none" stroke="var(--color-line-strong, #b8bcb5)" stroke-width="1.5"/>
  <text x="28" y="28" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="15" font-weight="700" fill="var(--color-ink, #17211f)">API server（node0）</text>
  <rect x="206" y="40" width="296" height="470" rx="16" fill="none" stroke="var(--color-line-strong, #b8bcb5)" stroke-width="1.5"/>
  <text x="222" y="28" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="15" font-weight="700" fill="var(--color-ink, #17211f)">EngineCore（每台机器一个）</text>
  <rect x="514" y="40" width="354" height="470" rx="16" fill="none" stroke="var(--color-line-strong, #b8bcb5)" stroke-width="1.5"/>
  <text x="530" y="28" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="15" font-weight="700" fill="var(--color-ink, #17211f)">worker × 8（每卡一个）</text>
  <path d="M102 122 L102 160" fill="none" stroke="var(--color-ink, #17211f)" stroke-width="1.4" marker-end="url(#structured-output-flow-ah-ink)"/>
  <path d="M102 212 L102 250" fill="none" stroke="var(--color-danger, #b54237)" stroke-width="1.4" stroke-dasharray="7 5" marker-end="url(#structured-output-flow-ah-danger)"/>
  <path d="M178 186 L199 186 L199 96 L220 96" fill="none" stroke="var(--color-ink, #17211f)" stroke-width="1.4" marker-end="url(#structured-output-flow-ah-ink)"/>
  <path d="M353 122 L353 160" fill="none" stroke="var(--color-control, #66716d)" stroke-width="1.4" marker-end="url(#structured-output-flow-ah-control)"/>
  <path d="M353 212 L353 250" fill="none" stroke="var(--color-control, #66716d)" stroke-width="1.4" marker-end="url(#structured-output-flow-ah-control)"/>
  <path d="M486 186 L530 186" fill="none" stroke="var(--color-token, #087f73)" stroke-width="1.4" marker-end="url(#structured-output-flow-ah-token)"/>
  <path d="M486 276 L530 276" fill="none" stroke="var(--color-control, #66716d)" stroke-width="1.4" marker-end="url(#structured-output-flow-ah-control)"/>
  <path d="M630 212 L630 250" fill="none" stroke="var(--color-token, #087f73)" stroke-width="1.4" marker-end="url(#structured-output-flow-ah-token)"/>
  <path d="M798 212 L798 250" fill="none" stroke="var(--color-token, #087f73)" stroke-width="1.4" stroke-dasharray="7 5" marker-end="url(#structured-output-flow-ah-token)"/>
  <path d="M630 302 L630 400" fill="none" stroke="var(--color-token, #087f73)" stroke-width="1.4" marker-end="url(#structured-output-flow-ah-token)"/>
  <path d="M798 302 L798 400" fill="none" stroke="var(--color-token, #087f73)" stroke-width="1.4" stroke-dasharray="7 5" marker-end="url(#structured-output-flow-ah-token)"/>
  <path d="M530 426 L486 426" fill="none" stroke="var(--color-token, #087f73)" stroke-width="1.4" marker-end="url(#structured-output-flow-ah-token)"/>
  <path d="M220 426 L213 426 L213 186 L220 186" fill="none" stroke="var(--color-control, #66716d)" stroke-width="1.4" stroke-dasharray="7 5" marker-end="url(#structured-output-flow-ah-control)"/>
  <rect x="26" y="70" width="152" height="52" rx="8" fill="var(--color-surface-sunken, #ece9df)" stroke="var(--color-ink, #17211f)" stroke-width="1.5"/>
  <text x="102" y="92" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="14" font-weight="700" fill="var(--color-ink, #17211f)" text-anchor="middle">请求带 JSON schema</text>
  <text x="102" y="111" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="13" font-weight="400" fill="var(--color-ink, #17211f)" text-anchor="middle">或正则、选项、语法</text>
  <rect x="26" y="160" width="152" height="52" rx="8" fill="var(--color-surface-sunken, #ece9df)" stroke="var(--color-ink, #17211f)" stroke-width="1.5"/>
  <text x="102" y="182" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="14" font-weight="700" fill="var(--color-ink, #17211f)" text-anchor="middle">校验、定后端</text>
  <text x="102" y="201" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="13" font-weight="400" fill="var(--color-ink, #17211f)" text-anchor="middle">auto 先试 xgrammar</text>
  <rect x="26" y="250" width="152" height="44" rx="8" fill="var(--color-accent-soft, #fff0e9)" stroke="var(--color-danger, #b54237)" stroke-opacity="0.4" stroke-width="1.5" stroke-dasharray="5 4"/>
  <text x="102" y="277" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="13" font-weight="400" fill="#8f3229" text-anchor="middle">后端不一致 → 报错</text>
  <rect x="220" y="70" width="266" height="52" rx="8" fill="var(--color-control, #66716d)" stroke="var(--color-ink, #17211f)" stroke-width="1.5"/>
  <text x="353" y="92" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="14" font-weight="700" fill="var(--color-ink-inverse, #ffffff)" text-anchor="middle">编译文法（线程池，异步）</text>
  <text x="353" y="111" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="13" font-weight="400" fill="var(--color-ink-inverse, #ffffff)" text-anchor="middle">编好之前请求停在等待队列</text>
  <rect x="220" y="160" width="266" height="52" rx="8" fill="var(--color-control, #66716d)" stroke="var(--color-ink, #17211f)" stroke-width="1.5"/>
  <text x="353" y="182" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="14" font-weight="700" fill="var(--color-ink-inverse, #ffffff)" text-anchor="middle">派发本步前向，不等结果</text>
  <text x="353" y="201" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="13" font-weight="400" fill="var(--color-ink-inverse, #ffffff)" text-anchor="middle">8 个 worker 同时开算</text>
  <rect x="220" y="250" width="266" height="52" rx="8" fill="var(--color-control, #66716d)" stroke="var(--color-ink, #17211f)" stroke-width="1.5"/>
  <text x="353" y="272" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="14" font-weight="700" fill="var(--color-ink-inverse, #ffffff)" text-anchor="middle">CPU 上逐请求填 bitmask</text>
  <text x="353" y="291" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="13" font-weight="400" fill="var(--color-ink-inverse, #ffffff)" text-anchor="middle">草稿位先临时接受，填完回滚</text>
  <rect x="220" y="400" width="266" height="52" rx="8" fill="var(--color-control, #66716d)" stroke="var(--color-ink, #17211f)" stroke-width="1.5"/>
  <text x="353" y="422" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="14" font-weight="700" fill="var(--color-ink-inverse, #ffffff)" text-anchor="middle">接受结果，推进文法</text>
  <text x="353" y="441" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="13" font-weight="400" fill="var(--color-ink-inverse, #ffffff)" text-anchor="middle">下一轮草稿先按文法截断</text>
  <rect x="530" y="160" width="324" height="52" rx="8" fill="var(--color-token, #087f73)" stroke="var(--color-ink, #17211f)" stroke-width="1.5"/>
  <text x="692" y="182" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="14" font-weight="700" fill="var(--color-ink-inverse, #ffffff)" text-anchor="middle">前向 → logits</text>
  <text x="692" y="201" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="13" font-weight="400" fill="var(--color-ink-inverse, #ffffff)" text-anchor="middle">all-gather 后每卡一整张 logits</text>
  <rect x="530" y="250" width="200" height="52" rx="8" fill="var(--color-token, #087f73)" stroke="var(--color-ink, #17211f)" stroke-width="1.5"/>
  <text x="630" y="272" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="14" font-weight="700" fill="var(--color-ink-inverse, #ffffff)" text-anchor="middle">V1（默认）：拷到 CPU</text>
  <text x="630" y="291" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="13" font-weight="400" fill="var(--color-ink-inverse, #ffffff)" text-anchor="middle">改 −∞ 后拷回 NPU</text>
  <rect x="742" y="250" width="112" height="52" rx="8" fill="var(--color-token-soft, #ddf4ef)" stroke="var(--color-token, #087f73)" stroke-opacity="0.4" stroke-width="1.5" stroke-dasharray="5 4"/>
  <text x="798" y="272" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="13" font-weight="400" fill="#065f56" text-anchor="middle">V2：NPU kernel</text>
  <text x="798" y="291" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="13" font-weight="400" fill="#065f56" text-anchor="middle">需显式开启</text>
  <rect x="530" y="400" width="324" height="52" rx="8" fill="var(--color-token, #087f73)" stroke="var(--color-ink, #17211f)" stroke-width="1.5"/>
  <text x="692" y="422" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="14" font-weight="700" fill="var(--color-ink-inverse, #ffffff)" text-anchor="middle">采样、验证草稿</text>
  <text x="692" y="441" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="13" font-weight="400" fill="var(--color-ink-inverse, #ffffff)" text-anchor="middle">MTP 再草拟 3 个；0 号卡回报</text>
  <text x="220" y="482" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="12.5" font-weight="400" fill="var(--color-ink-muted, #66716d)" font-style="italic">异步调度下上一步未确认：推迟填表与采样</text>
  <text x="353" y="350" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="12.5" font-weight="400" fill="var(--color-ink-muted, #66716d)" text-anchor="middle" font-style="italic">等采样结果回来</text>
</svg>
