layout: figure
id: structured-output-flow
caption: 结构化输出的代码流程。API server 校验请求、定下后端；处理这条请求的 EngineCore 在 CPU 上编译文法，每步派发前向后趁 NPU 计算填 bitmask，随采样调用发给本机 8 个 worker；worker 把 bitmask 作用到 logits 后采样，结果回到 EngineCore 推进文法。虚线是需要显式开启的 V2 分支。
size: [880, 530]
frames:
  - { at: [12, 40], size: [180, 470], label: API server（node0） }
  - { at: [206, 40], size: [296, 470], label: EngineCore（每台机器一个） }
  - { at: [514, 40], size: [354, 470], label: worker × 8（每卡一个） }
items:
  - { at: [26, 70], size: [152, 52], text: 请求带 JSON schema, sub: 或正则、选项、语法, tone: ink, style: plain }
  - { at: [26, 160], size: [152, 52], text: 校验、定后端, sub: auto 先试 xgrammar, tone: ink, style: plain }
  - { at: [26, 250], size: [152, 44], text: 后端不一致 → 报错, tone: danger, style: faded }
  - { at: [220, 70], size: [266, 52], text: 编译文法（线程池，异步）, sub: 编好之前请求停在等待队列, tone: control }
  - { at: [220, 160], size: [266, 52], text: 派发本步前向，不等结果, sub: 8 个 worker 同时开算, tone: control }
  - { at: [220, 250], size: [266, 52], text: CPU 上逐请求填 bitmask, sub: 草稿位先临时接受，填完回滚, tone: control }
  - { at: [220, 400], size: [266, 52], text: 接受结果，推进文法, sub: 下一轮草稿先按文法截断, tone: control }
  - { at: [530, 160], size: [324, 52], text: 前向 → logits, sub: all-gather 后每卡一整张 logits, tone: token }
  - { at: [530, 250], size: [200, 52], text: V1（默认）：拷到 CPU, sub: 改 −∞ 后拷回 NPU, tone: token }
  - { at: [742, 250], size: [112, 52], text: V2：NPU kernel, sub: 需显式开启, tone: token, style: faded }
  - { at: [530, 400], size: [324, 52], text: 采样、验证草稿, sub: MTP 再草拟 3 个；0 号卡回报, tone: token }
