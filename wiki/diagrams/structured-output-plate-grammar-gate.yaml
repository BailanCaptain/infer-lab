    symbols: [StructuredOutputManager]
  - source: 'vllm@ced6857a:vllm/v1/structured_output/__init__.py#L310-L345'
    symbols: [grammar_bitmask]
  - source: 'vllm-ascend@c09d3e20:vllm_ascend/worker/model_runner_v1.py#L2803-L2810'
