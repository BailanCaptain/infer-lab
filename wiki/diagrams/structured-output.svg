  <rect x="796" y="322" width="20" height="26" rx="3" fill="var(--color-accent-soft, #fff0e9)" stroke="var(--color-accent, #e85b32)" stroke-width="1.1"/>
  <text x="52" y="366" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="12.5" font-weight="400" fill="var(--color-ink-muted, #5b6763)">一个 int32 管 32 个 token：亮着的 4 个允许，其余 28 个的 logit 会被写成 -inf</text>
  <rect x="52" y="548" width="390" height="80" rx="11" fill="var(--color-surface, #fbfaf6)" stroke="var(--color-weight, #b87a00)" stroke-width="1.5"/>
  <rect x="64" y="572" width="32" height="32" rx="9" fill="var(--color-weight-soft, #fff4cf)"/><g transform="translate(70.4 578.4) scale(0.8)" fill="none" stroke="var(--color-weight, #b87a00)" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M4 5h16v14H4z M4 9h16M8 5v4"/></g>
  <text x="104" y="576" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="14.5" font-weight="700" fill="var(--color-ink, #17211f)">默认这条：搬回 CPU 再贴</text>
  <text x="104" y="594" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="12.5" font-weight="400" fill="var(--color-ink-muted, #5b6763)">logits 一来一回约 890 KiB，每一步都做</text>
  <text x="104" y="611" font-family="'JetBrains Mono',ui-monospace,monospace" font-size="12.5" font-weight="400" fill="var(--color-weight, #b87a00)">apply_grammar_bitmask</text>
  <rect x="458" y="548" width="390" height="80" rx="11" fill="var(--color-surface, #fbfaf6)" stroke="var(--color-weight, #b87a00)" stroke-width="1.5"/>
  <rect x="470" y="572" width="32" height="32" rx="9" fill="var(--color-weight-soft, #fff4cf)"/><g transform="translate(476.4 578.4) scale(0.8)" fill="none" stroke="var(--color-weight, #b87a00)" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M13 2L4 14h7l-1 8 9-12h-7z"/></g>
  <text x="510" y="576" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="14.5" font-weight="700" fill="var(--color-ink, #17211f)">另一条：NPU 上原地写</text>
  <text x="510" y="594" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="12.5" font-weight="400" fill="var(--color-ink-muted, #5b6763)">要 VLLM_USE_V2_MODEL_RUNNER 才走得到</text>
  <text x="510" y="611" font-family="'JetBrains Mono',ui-monospace,monospace" font-size="12.5" font-weight="400" fill="var(--color-weight, #b87a00)">_apply_grammar_bitmask_kernel</text>
  <path d="M434 372 L434 484" fill="none" stroke="var(--color-accent, #e85b32)" stroke-width="1.8"/>
  <path d="M434 484 l-5.5 -11 l11 0 z" fill="var(--color-accent, #e85b32)"/>
  <text x="20" y="668" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="12.5" font-weight="600" fill="var(--color-ink, #17211f)">每一步都重来一遍：算一行位图、过一次边界、贴一次 logits。文法编译只有第一次，位图和这趟往返是每一步的。</text>
