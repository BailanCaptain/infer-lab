<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 700" width="900" height="700" role="img" aria-label="文法状态机只活在 EngineCore 进程里；跨过进程边界的是一张按位压缩的成品位图，Worker 只负责把它贴到 logits 上">
  <title>文法状态机只活在 EngineCore 进程里；跨过进程边界的是一张按位压缩的成品位图，Worker 只负责把它贴到 logits 上</title>
  <rect width="900" height="700" fill="var(--color-surface, #fbfaf6)"/>
  <rect x="20" y="26" width="860" height="386" rx="12" fill="var(--color-surface-sunken, #ece9df)"/>
  <rect x="36" y="40" width="235.3" height="26.5" rx="13.3" fill="var(--color-control, #5b6763)"/><text x="47" y="58.1" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="13.5" font-weight="700" fill="var(--color-ink-inverse, #ffffff)">EngineCore 进程 · 状态机在这里</text>
  <text x="38" y="83" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="12.5" font-weight="400" fill="var(--color-ink-muted, #5b6763)">编译、填位图、推进与回滚全在 CPU 上。这一侧不碰 logits。</text>
  <rect x="20" y="452" width="860" height="190" rx="12" fill="var(--color-weight-soft, #fff4cf)"/>
  <rect x="36" y="466" width="242.3" height="26.5" rx="13.3" fill="var(--color-weight, #b87a00)"/><text x="47" y="484.1" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="13.5" font-weight="700" fill="var(--color-ink-inverse, #ffffff)">Worker 进程 · 只负责把位图贴上去</text>
  <text x="38" y="509" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="12.5" font-weight="400" fill="var(--color-ink-muted, #5b6763)">两条路都写 -inf，区别只在写在哪个设备上。默认走的是左边那条。</text>
  <rect x="52" y="128" width="796" height="52" rx="10" fill="var(--color-surface-sunken, #ece9df)"/>
  <rect x="52" y="128" width="5" height="52" rx="2.5" fill="var(--color-control, #5b6763)"/>
  <g transform="translate(75.8 143.8) scale(0.85)" fill="none" stroke="var(--color-control, #5b6763)" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3a9 9 0 1 0 0 18 9 9 0 0 0 0-18z M12 7v5l3 2"/></g>
  <text x="110" y="151" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="15" font-weight="700" fill="var(--color-ink, #17211f)">① 请求进来，先把 schema 编成状态机</text>
  <text x="110" y="171" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="12.5" font-weight="400" fill="var(--color-ink-muted, #5b6763)">编译完成前状态是 WAITING_FOR_STRUCTURED_OUTPUT_GRAMMAR，排在 skipped_waiting 上</text>
  <rect x="721" y="141.5" width="108" height="21.5" rx="10.8" fill="var(--color-surface, #fbfaf6)" stroke="var(--color-control, #5b6763)" stroke-width="1"/><text x="775" y="159" font-family="'JetBrains Mono',ui-monospace,monospace" font-size="12.5" font-weight="400" fill="var(--color-control, #5b6763)" text-anchor="middle">grammar_init</text>
  <rect x="52" y="186" width="796" height="52" rx="10" fill="var(--color-surface-sunken, #ece9df)"/>
  <rect x="52" y="186" width="5" height="52" rx="2.5" fill="var(--color-control, #5b6763)"/>
  <g transform="translate(75.8 201.8) scale(0.85)" fill="none" stroke="var(--color-control, #5b6763)" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M5 3h14v18H5z M8 7h8M8 11h2M12 11h2M8 15h2M12 15h2"/></g>
  <text x="110" y="209" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="15" font-weight="700" fill="var(--color-ink, #17211f)">② 每一圈：把上一步确认的 token 喂进状态机</text>
  <text x="110" y="229" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="12.5" font-weight="400" fill="var(--color-ink-muted, #5b6763)">推进完再 rollback 回去，状态机吃的不是这一步的采样结果</text>
  <rect x="668.5" y="199.5" width="160.5" height="21.5" rx="10.8" fill="var(--color-surface, #fbfaf6)" stroke="var(--color-control, #5b6763)" stroke-width="1"/><text x="748.8" y="217" font-family="'JetBrains Mono',ui-monospace,monospace" font-size="12.5" font-weight="400" fill="var(--color-control, #5b6763)" text-anchor="middle">get_grammar_bitmask</text>
  <rect x="52" y="244" width="796" height="52" rx="10" fill="var(--color-surface-sunken, #ece9df)"/>
  <rect x="52" y="244" width="5" height="52" rx="2.5" fill="var(--color-control, #5b6763)"/>
  <g transform="translate(75.8 259.8) scale(0.85)" fill="none" stroke="var(--color-control, #5b6763)" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M3 3h7v7H3zM14 3h7v7h-7zM3 14h7v7H3zM14 14h7v7h-7z"/></g>
  <text x="110" y="267" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="15" font-weight="700" fill="var(--color-ink, #17211f)">③ 位图一次分配到位，之后只填不扩</text>
  <text x="110" y="287" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="12.5" font-weight="400" fill="var(--color-ink-muted, #5b6763)">行数 = max_num_seqs × (1 + 草稿数)，每个待采样位置占一行</text>
  <rect x="646" y="257.5" width="183" height="21.5" rx="10.8" fill="var(--color-surface, #fbfaf6)" stroke="var(--color-control, #5b6763)" stroke-width="1"/><text x="737.5" y="275" font-family="'JetBrains Mono',ui-monospace,monospace" font-size="12.5" font-weight="400" fill="var(--color-control, #5b6763)" text-anchor="middle">allocate_token_bitmask</text>
  <line x1="20" y1="432" x2="880" y2="432" stroke="var(--color-accent, #e85b32)" stroke-width="2.5" stroke-dasharray="7 5"/>
  <text x="876" y="423" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="13" font-weight="700" fill="var(--color-accent, #e85b32)" text-anchor="end">位图每行 = 4748 个 int32 = 18.5 KiB（151936 / 32）</text>
  <rect x="52" y="322" width="20" height="26" rx="3" fill="var(--color-accent-soft, #fff0e9)" stroke="var(--color-accent, #e85b32)" stroke-width="1.1"/>
