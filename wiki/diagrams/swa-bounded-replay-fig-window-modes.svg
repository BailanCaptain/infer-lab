<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 524" width="900" height="524" role="img" aria-label="SWA 有界回放多层依赖锥、128/134/140 标尺对照、L=1000 切分与 off/mask/compact 网格对比图" font-family="var(--font-sans)">
  <title>SWA 有界回放的多层依赖锥误差传播（L2 位置 9 得 6 而非 4）、128/134/140 比例标尺、L=1000 命中回退 128 区间，以及 off/mask/compact 行掩码网格对照。</title>
  <desc>左上区画出 2 层依赖锥：位置 5、6 缺失使第 1 层位置 7、8 均值由 2、4 变为 6、6，进而导致第 2 层位置 9 同读 7..9 却从 4 变成 6；右上区用对齐比例标尺区分模型窗口 128、含 6 步回退的窗口环 134 与推荐保留长度 140；中区画出 L=1000 命中的三段区间（0-639 复用、640-767 回放 128、768-999 新后缀 232）；底区用缩略行网格直观对比 off、mask 与 compact（含早期分块 1 个占位行）。</desc>
  <defs>
    <marker id="swaf-arr-r" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 1.5 L 8.5 5 L 0 8.5 z" fill="#b54237"/>
    </marker>
    <marker id="swaf-arr-t" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 1.5 L 8.5 5 L 0 8.5 z" fill="#087f73"/>
    </marker>
  </defs>

  <text x="14" y="24" font-size="16" font-weight="700" fill="#17211f">一、为什么“凑齐末尾窗口”仍是近似？两层依赖锥与 128 / 134 / 140 比例标尺</text>

  <!-- Top Left: 2-layer dependency cone visual -->
  <rect x="14" y="38" width="444" height="202" rx="9" fill="#ffffff" stroke="#b54237" stroke-width="1.4"/>
  <text x="28" y="61" font-size="14.5" font-weight="700" fill="#8f3229">A. 窗口 W=3 从位置 7 回放的 2 层误差传播锥</text>

  <!-- Layer 2 (top of cone): pos 9 -->
  <rect x="278" y="72" width="166" height="36" rx="6" fill="#fff0e9" stroke="#b54237" stroke-width="1.5"/>
  <text x="361" y="95" text-anchor="middle" font-size="13.5" font-weight="700" fill="#8f3229">L2(9)：完整 4 → 回放 6 !</text>

  <!-- Arrows from L1(7,8,9) up to L2(9) -->
  <path d="M 244 128 L 328 110" fill="none" stroke="#b54237" stroke-width="1.6" marker-end="url(#swaf-arr-r)"/>
  <path d="M 326 128 L 356 110" fill="none" stroke="#b54237" stroke-width="1.6" marker-end="url(#swaf-arr-r)"/>
  <path d="M 408 128 L 386 110" fill="none" stroke="#087f73" stroke-width="1.6" marker-end="url(#swaf-arr-t)"/>

  <!-- Layer 1 row: L1(7), L1(8), L1(9) -->
  <rect x="206" y="130" width="76" height="34" rx="5" fill="#fff0e9" stroke="#b54237" stroke-width="1.4"/>
  <text x="244" y="152" text-anchor="middle" font-size="13" font-family="var(--font-mono)" font-weight="700" fill="#8f3229">L1(7):2→6</text>

  <rect x="288" y="130" width="76" height="34" rx="5" fill="#fff0e9" stroke="#b54237" stroke-width="1.4"/>
  <text x="326" y="152" text-anchor="middle" font-size="13" font-family="var(--font-mono)" font-weight="700" fill="#8f3229">L1(8):4→6</text>

  <rect x="370" y="130" width="74" height="34" rx="5" fill="#ddf4ef" stroke="#087f73" stroke-width="1.4"/>
  <text x="407" y="152" text-anchor="middle" font-size="13" font-family="var(--font-mono)" font-weight="700" fill="#065f56">L1(9):6=6</text>

  <!-- Input row: pos 5(0), 6(0) missing vs 7(6), 8(6), 9(6) replayed -->
  <rect x="28" y="190" width="76" height="34" rx="5" fill="#ece9df" stroke="#b54237" stroke-width="1.3" stroke-dasharray="4 3"/>
  <text x="66" y="212" text-anchor="middle" font-size="13" font-family="var(--font-mono)" fill="#8f3229">5: 0 (缺)</text>

  <rect x="112" y="190" width="76" height="34" rx="5" fill="#ece9df" stroke="#b54237" stroke-width="1.3" stroke-dasharray="4 3"/>
  <text x="150" y="212" text-anchor="middle" font-size="13" font-family="var(--font-mono)" fill="#8f3229">6: 0 (缺)</text>

  <rect x="206" y="190" width="76" height="34" rx="5" fill="#ddf4ef" stroke="#087f73" stroke-width="1.3"/>
  <text x="244" y="212" text-anchor="middle" font-size="13" font-family="var(--font-mono)" font-weight="700" fill="#065f56">7: 6</text>

  <rect x="288" y="190" width="76" height="34" rx="5" fill="#ddf4ef" stroke="#087f73" stroke-width="1.3"/>
  <text x="326" y="212" text-anchor="middle" font-size="13" font-family="var(--font-mono)" font-weight="700" fill="#065f56">8: 6</text>

  <rect x="370" y="190" width="74" height="34" rx="5" fill="#ddf4ef" stroke="#087f73" stroke-width="1.3"/>
  <text x="407" y="212" text-anchor="middle" font-size="13" font-family="var(--font-mono)" font-weight="700" fill="#065f56">9: 6</text>

  <!-- Dashed missing dependency arrows from 5,6 to L1(7,8) -->
  <path d="M 86 190 L 218 166" fill="none" stroke="#b54237" stroke-width="1.3" stroke-dasharray="3 3"/>
  <path d="M 164 190 L 238 166" fill="none" stroke="#b54237" stroke-width="1.3" stroke-dasharray="3 3"/>
  <path d="M 168 190 L 306 166" fill="none" stroke="#b54237" stroke-width="1.3" stroke-dasharray="3 3"/>
  <text x="108" y="114" text-anchor="middle" font-size="13" fill="#8f3229">缺 5、6 污染 L1(7,8)</text>
  <text x="108" y="134" text-anchor="middle" font-size="13" fill="#4d5652">→ 向上传进 L2(9)</text>

  <!-- Top Right: Aligned proportional ruler for 128 / 134 / 140 -->
  <rect x="472" y="38" width="414" height="202" rx="9" fill="#ffffff" stroke="#4c65b6" stroke-width="1.4"/>
  <text x="486" y="61" font-size="14.5" font-weight="700" fill="#3a4f93">B. 128、134、140 是三把不同的尺子</text>

  <!-- 128 bar (exact scale: 2.25 px/tok -> 128 = 288px, +6 = 13.5px, +6 = 13.5px; 140 = 315px) -->
  <text x="486" y="88" font-size="13.5" font-weight="700" fill="#3a4f93">128 · 模型 SWA 窗口 &amp; block KV 对齐粒度</text>
  <rect x="486" y="96" width="288" height="24" rx="4" fill="#4c65b6"/>
  <text x="630" y="113" text-anchor="middle" font-size="13" font-family="var(--font-mono)" font-weight="700" fill="#ffffff">128 token</text>

  <!-- 134 bar: 288px (128) + 13.5px (+6) = 301.5px -->
  <text x="486" y="142" font-size="13.5" font-weight="700" fill="#936300">134 · 窗口环 = 128 + 6（5 投机步 + 1 回退）</text>
  <rect x="486" y="150" width="288" height="24" rx="4" fill="#e8edff" stroke="#4c65b6" stroke-width="1.2"/>
  <text x="630" y="167" text-anchor="middle" font-size="13" font-family="var(--font-mono)" fill="#3a4f93">128</text>
  <rect x="774" y="150" width="13.5" height="24" rx="2" fill="#c78300"/>
  <text x="795" y="167" font-size="13" font-family="var(--font-mono)" font-weight="700" fill="#936300">+6 → 134</text>

  <!-- 140 bar: 288px (128) + 13.5px (+6) + 13.5px (+6) = 315px -->
  <text x="486" y="196" font-size="13.5" font-weight="700" fill="#7a3a6a">140 · decoder 截断推荐保留长度（≥134）</text>
  <rect x="486" y="204" width="288" height="24" rx="4" fill="#e8edff" stroke="#4c65b6" stroke-width="1.1"/>
  <text x="630" y="221" text-anchor="middle" font-size="13" font-family="var(--font-mono)" fill="#3a4f93">128 窗口</text>
  <rect x="774" y="204" width="13.5" height="24" rx="2" fill="#fff4cf" stroke="#c78300" stroke-width="1.1"/>
  <rect x="787.5" y="204" width="13.5" height="24" rx="2" fill="#9a4b86"/>
  <text x="808" y="221" font-size="13" font-family="var(--font-mono)" font-weight="700" fill="#7a3a6a">+6 → 140</text>

  <line x1="14" y1="254" x2="886" y2="254" stroke="#b8bcb5" stroke-width="1.3" stroke-dasharray="6 4"/>

  <text x="14" y="280" font-size="16" font-weight="700" fill="#17211f">二、L = 1000 命中回退切分与 off / mask / compact 行掩码网格对照</text>

  <!-- Proportional L=1000 bar (width=872: 640 -> 558px, 128 -> 112px, 232 -> 202px) -->
  <rect x="14" y="294" width="554" height="40" rx="5" fill="#ddf4ef" stroke="#087f73" stroke-width="1.5"/>
  <text x="291" y="319" text-anchor="middle" font-size="14" font-weight="700" fill="#065f56">0–639（640 位）：直接复用已命中 block KV</text>

  <rect x="572" y="294" width="112" height="40" rx="5" fill="#fff4cf" stroke="#c78300" stroke-width="1.5"/>
  <text x="628" y="319" text-anchor="middle" font-size="13.5" font-weight="700" fill="#936300">回放 128</text>

  <rect x="688" y="294" width="198" height="40" rx="5" fill="#e8edff" stroke="#4c65b6" stroke-width="1.5"/>
  <text x="787" y="319" text-anchor="middle" font-size="13.5" font-weight="700" fill="#3a4f93">768–999：新后缀 232</text>

  <!-- 3 Mode Cards with mini visual row grids -->
  <!-- Card 1: off -->
  <rect x="14" y="348" width="280" height="164" rx="9" fill="#ffffff" stroke="#087f73" stroke-width="1.4"/>
  <text x="28" y="372" font-size="14.5" font-weight="700" fill="#065f56">1. off（完整基线）</text>
  <!-- 6 green rows -->
  <rect x="28" y="384" width="38" height="22" rx="3" fill="#087f73"/>
  <rect x="70" y="384" width="38" height="22" rx="3" fill="#087f73"/>
  <rect x="112" y="384" width="38" height="22" rx="3" fill="#087f73"/>
  <rect x="154" y="384" width="38" height="22" rx="3" fill="#087f73"/>
  <rect x="196" y="384" width="38" height="22" rx="3" fill="#087f73"/>
  <rect x="238" y="384" width="38" height="22" rx="3" fill="#087f73"/>
  <text x="28" y="432" font-size="13.5" fill="#17211f">不做截断，全部输入行过满窗</text>
  <text x="28" y="456" font-size="13.5" fill="#4d5652">作为精度对照基准，评估截断</text>
  <text x="28" y="478" font-size="13.5" fill="#4d5652">近似对任务质量的实际影响</text>

  <!-- Card 2: mask -->
  <rect x="310" y="348" width="280" height="164" rx="9" fill="#ffffff" stroke="#c78300" stroke-width="1.4"/>
  <text x="324" y="372" font-size="14.5" font-weight="700" fill="#936300">2. mask（同可见域对照）</text>
  <!-- 3 dimmed masked rows + 3 active rows -->
  <rect x="324" y="384" width="38" height="22" rx="3" fill="#ece9df" stroke="#b8bcb5" stroke-width="1"/>
  <rect x="366" y="384" width="38" height="22" rx="3" fill="#ece9df" stroke="#b8bcb5" stroke-width="1"/>
  <rect x="408" y="384" width="38" height="22" rx="3" fill="#ece9df" stroke="#b8bcb5" stroke-width="1"/>
  <rect x="450" y="384" width="38" height="22" rx="3" fill="#c78300"/>
  <rect x="492" y="384" width="38" height="22" rx="3" fill="#c78300"/>
  <rect x="534" y="384" width="38" height="22" rx="3" fill="#c78300"/>
  <text x="324" y="432" font-size="13.5" fill="#17211f">保留全部行，仅用掩码限制可见域</text>
  <text x="324" y="456" font-size="13.5" fill="#4d5652">把「窗口截断误差」与「紧凑</text>
  <text x="324" y="478" font-size="13.5" fill="#4d5652">行搬运 bug」彻底拆开排查</text>

  <!-- Card 3: compact -->
  <rect x="606" y="348" width="280" height="164" rx="9" fill="#fff0e9" stroke="#b54237" stroke-width="1.4"/>
  <text x="620" y="372" font-size="14.5" font-weight="700" fill="#8f3229">3. compact（真正减行执行）</text>
  <!-- 1 dashed placeholder + 3 compacted rows -->
  <rect x="620" y="384" width="58" height="22" rx="3" fill="#ffffff" stroke="#b54237" stroke-width="1.2" stroke-dasharray="3 2"/>
  <text x="649" y="400" text-anchor="middle" font-size="13" fill="#8f3229">1占位</text>
  <rect x="688" y="384" width="56" height="22" rx="3" fill="#b54237"/>
  <rect x="748" y="384" width="56" height="22" rx="3" fill="#b54237"/>
  <rect x="808" y="384" width="56" height="22" rx="3" fill="#b54237"/>
  <text x="620" y="432" font-size="13.5" fill="#17211f">移除多余行；早期块留 1 占位行</text>
  <text x="620" y="456" font-size="13.5" font-weight="700" fill="#8f3229">验证原则：mask == compact</text>
  <text x="620" y="478" font-size="13.5" fill="#4d5652">两者一致仍不代表等于 off 精确</text>
</svg>
