<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 456" width="900" height="456" role="img" aria-label="SWA 有界回放多层近似机制、128/134/140 口径与验证模式对比图" font-family="var(--font-sans)">
  <title>SWA 有界回放多层误差传播、三类长度口径与 off/mask/compact 对照</title>
  <desc>上半区左栏演示窗口 W=3 从位置 7 回放时边界缺失如何跨层传到第 2 层位置 9；右栏辨析 128/134/140 三种不同口径；下半区给出 L=1000 命中后退回放 128 位置的区间切分，以及 off、mask、compact 的两层排查结论。</desc>
  <defs>
    <marker id="swaf-arr-r" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto">
      <path d="M 0 1.5 L 8.5 5 L 0 8.5 z" fill="#b54237"/>
    </marker>
    <marker id="swaf-arr-t" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto">
      <path d="M 0 1.5 L 8.5 5 L 0 8.5 z" fill="#087f73"/>
    </marker>
  </defs>

  <text x="14" y="28" font-size="16" font-weight="700" fill="#17211f">一、为什么“末尾凑齐一个窗口”仍是近似：多层边界传播与 128 / 134 / 140 辨析</text>
  <line x1="12" y1="40" x2="888" y2="40" stroke="#b8bcb5" stroke-width="1.3"/>

  <rect x="12" y="54" width="444" height="176" rx="8" fill="#ffffff" stroke="#b54237" stroke-width="1.4"/>
  <text x="26" y="78" font-size="14.5" font-weight="700" fill="#8f3229">A. 窗口 W=3 从位置 7 回放（输入 5..9 = 0,0,6,6,6）</text>
  <rect x="26" y="92" width="416" height="58" rx="6" fill="#ddf4ef" stroke="#087f73" stroke-width="1.2"/>
  <text x="38" y="114" font-size="13.5" font-weight="700" fill="#065f56">完整计算：L1(7)=2, L1(8)=4, L1(9)=6</text>
  <text x="38" y="138" font-size="13.5" fill="#17211f">→ L2 位置 9 读 [7,8,9] 得 (2+4+6)÷3 = <tspan font-weight="700" fill="#065f56">4</tspan></text>
  <rect x="26" y="160" width="416" height="58" rx="6" fill="#fff0e9" stroke="#b54237" stroke-width="1.2"/>
  <text x="38" y="182" font-size="13.5" font-weight="700" fill="#8f3229">从 7 回放：缺 5、6 → L1(7)=6, L1(8)=6, L1(9)=6</text>
  <text x="38" y="206" font-size="13.5" fill="#17211f">→ L2 位置 9 仍读 [7,8,9] 却得 (6+6+6)÷3 = <tspan font-weight="700" fill="#8f3229">6</tspan></text>

  <rect x="472" y="54" width="416" height="176" rx="8" fill="#ffffff" stroke="#4c65b6" stroke-width="1.4"/>
  <text x="486" y="78" font-size="14.5" font-weight="700" fill="#3a4f93">B. 128、134、140 是三笔不同口径（勿混为一谈）</text>
  <rect x="486" y="92" width="388" height="36" rx="5" fill="#e8edff" stroke="#4c65b6" stroke-width="1.2"/>
  <text x="498" y="115" font-size="13.5" fill="#17211f"><tspan font-weight="700" fill="#3a4f93">128</tspan>：模型 SWA 窗口长度与 block KV 对齐粒度</text>
  <rect x="486" y="136" width="388" height="36" rx="5" fill="#fff4cf" stroke="#c78300" stroke-width="1.2"/>
  <text x="498" y="159" font-size="13.5" fill="#17211f"><tspan font-weight="700" fill="#936300">134</tspan>：窗口环 = 128 + 6（默认 5 步投机 + 1 回退）</text>
  <rect x="486" y="180" width="388" height="36" rx="5" fill="#f7e7f2" stroke="#9a4b86" stroke-width="1.2"/>
  <text x="498" y="203" font-size="13.5" fill="#17211f"><tspan font-weight="700" fill="#7a3a6a">140</tspan>：decoder 截断推荐保留长度（≥ 窗口 + 回退）</text>

  <text x="14" y="264" font-size="16" font-weight="700" fill="#17211f">二、L = 1000 命中回退切分与 off / mask / compact 两层排障逻辑</text>
  <line x1="12" y1="276" x2="888" y2="276" stroke="#b8bcb5" stroke-width="1.3"/>

  <rect x="12" y="290" width="460" height="44" rx="6" fill="#ddf4ef" stroke="#087f73" stroke-width="1.4"/>
  <text x="242" y="317" text-anchor="middle" font-size="14" font-weight="700" fill="#065f56">0–639（640 位置）：直接复用已命中 block KV</text>

  <rect x="478" y="290" width="174" height="44" rx="6" fill="#fff4cf" stroke="#c78300" stroke-width="1.4"/>
  <text x="565" y="317" text-anchor="middle" font-size="14" font-weight="700" fill="#936300">640–767：回放 128</text>

  <rect x="658" y="290" width="230" height="44" rx="6" fill="#e8edff" stroke="#4c65b6" stroke-width="1.4"/>
  <text x="773" y="317" text-anchor="middle" font-size="14" font-weight="700" fill="#3a4f93">768–999：未命中新后缀 232</text>

  <rect x="12" y="348" width="280" height="94" rx="8" fill="#ffffff" stroke="#087f73" stroke-width="1.4"/>
  <text x="26" y="372" font-size="14.5" font-weight="700" fill="#065f56">1. off（完整基线）</text>
  <text x="26" y="396" font-size="13.5" fill="#17211f">不做后半截断，全量计算</text>
  <text x="26" y="420" font-size="13.5" fill="#4d5652">用于评估截断近似的质量损失</text>

  <rect x="310" y="348" width="280" height="94" rx="8" fill="#ffffff" stroke="#c78300" stroke-width="1.4"/>
  <text x="324" y="372" font-size="14.5" font-weight="700" fill="#936300">2. mask（同可见域对照）</text>
  <text x="324" y="396" font-size="13.5" fill="#17211f">保留全部行，仅掩码限制可见范围</text>
  <text x="324" y="420" font-size="13.5" fill="#4d5652">把“截断语义”和“紧凑搬运”分开</text>

  <rect x="608" y="348" width="280" height="94" rx="8" fill="#fff0e9" stroke="#b54237" stroke-width="1.4"/>
  <text x="622" y="372" font-size="14.5" font-weight="700" fill="#8f3229">3. compact（真正减行）</text>
  <text x="622" y="396" font-size="13.5" fill="#17211f">移除多余行（早期块留 1 占位行）</text>
  <text x="622" y="420" font-size="13.5" font-weight="700" fill="#8f3229">mask == compact ≠ off 精确</text>
</svg>
