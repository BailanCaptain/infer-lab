layout: figure
id: swa-replay-intuition
caption: 窗口长 3 的两层均值示意，实际 attention 不按简单均值计算。第一层位置 9 都等于 6；第二层虽然都读取位置 7/8/9，完整路径读到 2/4/6，回放路径读到 6/6/6，因而得到 4 和 6。
