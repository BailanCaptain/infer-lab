<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 450" width="900" height="450" role="img" aria-label="SWA 有界回放：全局 block KV 保留与缺失逐层近期窗口的近似恢复" font-family="var(--font-sans)">
<title>SWA 有界回放状态：全局 block KV 命中保留 vs 逐层近期滑窗状态恢复</title>
<desc>上半展示追问到来时全局分页 block KV 仍在但各层 SWA 滑窗已回收；下半展示仅取回末尾位置 7、8、9 的输入重跑窗口，重建近似 SWA 状态并衔接新追问。</desc>
<defs>
  <marker id="sr-teal" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
    <path d="M1 1.5L8.5 5L1 8.5Z" fill="#087f73"/>
  </marker>
  <marker id="sr-indigo" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
    <path d="M1 1.5L8.5 5L1 8.5Z" fill="#4c65b6"/>
  </marker>
  <marker id="sr-amber" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
    <path d="M1 1.5L8.5 5L1 8.5Z" fill="#c78300"/>
  </marker>
</defs>

<!-- Top Panel: Follow-up Arrives (Global Block KV Hit, Per-Layer SWA Evicted) -->
<rect x="14" y="12" width="872" height="196" rx="10" fill="#fbfaf6" stroke="#d8d8cf" stroke-width="1.3"/>
<circle cx="36" cy="36" r="11" fill="#b54237"/>
<text x="36" y="40.5" text-anchor="middle" font-size="12.5" font-weight="700" fill="#ffffff">1</text>
<text x="54" y="41" font-size="16" font-weight="700" fill="#17211f">追问到达：全局分页 block KV 命中仍在，但各层近期 SWA 滑窗已回收</text>
<line x1="28" y1="56" x2="872" y2="56" stroke="#d8d8cf" stroke-width="1.2"/>

<!-- Global Block KV Card -->
<rect x="28" y="68" width="416" height="126" rx="8" fill="#e8edff" stroke="#4c65b6" stroke-width="1.3"/>
<text x="236" y="90" text-anchor="middle" font-size="13.5" font-weight="700" fill="#3a4f93">✓ 已保存的全局分页 block KV（位置 0..9 全部命中）</text>
<g stroke="#4c65b6" stroke-width="1.2" fill="#ffffff">
  <rect x="44" y="104" width="118" height="44" rx="5"/>
  <rect x="176" y="104" width="118" height="44" rx="5"/>
  <rect x="308" y="104" width="118" height="44" rx="5"/>
</g>
<g font-size="12.5" font-weight="700" text-anchor="middle" fill="#3a4f93">
  <text x="103" y="124">Block 0</text>
  <text x="235" y="124">Block 1</text>
  <text x="367" y="124">Block 2</text>
</g>
<g font-size="12" text-anchor="middle" fill="#4d5652">
  <text x="103" y="141">位置 0 · 1 · 2 · 3</text>
  <text x="235" y="141">位置 4 · 5 · 6 · 7</text>
  <text x="367" y="141">位置 8 · 9</text>
</g>
<text x="236" y="176" text-anchor="middle" font-size="12.5" fill="#3a4f93">长文档远距历史原样保留，无需从位置 0 重头预填充</text>

<!-- Missing Per-Layer SWA Window Card -->
<rect x="466" y="68" width="406" height="126" rx="8" fill="#fff0e9" stroke="#b54237" stroke-width="1.3"/>
<text x="669" y="90" text-anchor="middle" font-size="13.5" font-weight="700" fill="#8f3229">✗ 逐层近期 SWA 滑窗状态（W=3）已过期回收</text>
<text x="518" y="123" text-anchor="middle" font-size="12.5" font-weight="700" fill="#8f3229">SWA 层 1</text>
<text x="518" y="155" text-anchor="middle" font-size="12.5" font-weight="700" fill="#8f3229">SWA 层 2</text>
<g fill="#ffffff" stroke="#b54237" stroke-width="1.2" stroke-dasharray="4 3">
  <rect x="564" y="104" width="72" height="26" rx="4"/>
  <rect x="646" y="104" width="72" height="26" rx="4"/>
  <rect x="728" y="104" width="72" height="26" rx="4"/>
  <rect x="564" y="136" width="72" height="26" rx="4"/>
  <rect x="646" y="136" width="72" height="26" rx="4"/>
  <rect x="728" y="136" width="72" height="26" rx="4"/>
</g>
<g font-size="12" text-anchor="middle" fill="#b54237">
  <text x="600" y="121">空槽</text><text x="682" y="121">空槽</text><text x="764" y="121">空槽</text>
  <text x="600" y="153">空槽</text><text x="682" y="153">空槽</text><text x="764" y="153">空槽</text>
</g>
<text x="669" y="180" text-anchor="middle" font-size="12.5" font-weight="700" fill="#b54237">缺少末尾滑窗，新追问位置 10.. 不能直接续算</text>
<!-- Bottom Panel: Bounded Replay Recovery -->
<rect x="14" y="222" width="872" height="216" rx="10" fill="#fbfaf6" stroke="#d8d8cf" stroke-width="1.3"/>
<circle cx="36" cy="246" r="11" fill="#087f73"/>
<text x="36" y="250.5" text-anchor="middle" font-size="12.5" font-weight="700" fill="#ffffff">2</text>
<text x="54" y="251" font-size="16" font-weight="700" fill="#17211f">有界回放恢复：仅取回末尾位置 7 · 8 · 9 重算滑窗，重建近似 SWA 状态</text>
<line x1="28" y1="266" x2="872" y2="266" stroke="#d8d8cf" stroke-width="1.2"/>

<!-- Step 1: Fetch Bounded Tail Tokens -->
<rect x="28" y="278" width="232" height="146" rx="8" fill="#ddf4ef" stroke="#087f73" stroke-width="1.3"/>
<text x="144" y="301" text-anchor="middle" font-size="13" font-weight="700" fill="#065f56">① 取回末尾 W=3 位置原输入</text>
<g fill="#ffffff" stroke="#087f73" stroke-width="1.2">
  <rect x="42" y="316" width="62" height="36" rx="5"/>
  <rect x="113" y="316" width="62" height="36" rx="5"/>
  <rect x="184" y="316" width="62" height="36" rx="5"/>
</g>
<g font-size="12.5" font-weight="700" text-anchor="middle" fill="#065f56">
  <text x="73" y="338.5">位置 7</text>
  <text x="144" y="338.5">位置 8</text>
  <text x="215" y="338.5">位置 9</text>
</g>
<text x="144" y="380" text-anchor="middle" font-size="12.5" fill="#065f56">跳过早先位置 0..6</text>
<text x="144" y="404" text-anchor="middle" font-size="12" fill="#4d5652">回放开销有界，不随历史涨</text>

<!-- Step 2: Bounded Forward Recompute -->
<rect x="282" y="278" width="260" height="146" rx="8" fill="#fff4cf" stroke="#c78300" stroke-width="1.3"/>
<text x="412" y="301" text-anchor="middle" font-size="13" font-weight="700" fill="#936300">② 逐层有界重算（只补滑窗）</text>
<text x="412" y="329" text-anchor="middle" font-size="12.5" font-weight="700" fill="#3a4f93">继续只读上方已有全局 block KV</text>
<text x="412" y="353" text-anchor="middle" font-size="12" fill="#4d5652">保留旧 block KV 不做覆写</text>
<text x="412" y="380" text-anchor="middle" font-size="12.5" fill="#936300">位置 7、8 少看边界外 5、6</text>
<text x="412" y="404" text-anchor="middle" font-size="12" font-weight="700" fill="#936300">跨层传播形成受控近似窗口</text>

<!-- Step 3: Rebuilt Approximate SWA Window -->
<rect x="564" y="278" width="308" height="146" rx="8" fill="#ffffff" stroke="#087f73" stroke-width="1.3"/>
<text x="718" y="301" text-anchor="middle" font-size="13" font-weight="700" fill="#065f56">③ 近似 SWA 窗口就绪 → 接续新追问</text>
<text x="606" y="333" text-anchor="middle" font-size="12" font-weight="700" fill="#065f56">SWA 层 1</text>
<text x="606" y="365" text-anchor="middle" font-size="12" font-weight="700" fill="#065f56">SWA 层 2</text>
<g fill="#ddf4ef" stroke="#087f73" stroke-width="1.2">
  <rect x="646" y="314" width="64" height="26" rx="4"/>
  <rect x="718" y="314" width="64" height="26" rx="4"/>
  <rect x="790" y="314" width="64" height="26" rx="4"/>
  <rect x="646" y="346" width="64" height="26" rx="4"/>
  <rect x="718" y="346" width="64" height="26" rx="4"/>
  <rect x="790" y="346" width="64" height="26" rx="4"/>
</g>
<g font-size="12" font-weight="700" text-anchor="middle" fill="#065f56">
  <text x="678" y="331">7 (近似)</text><text x="750" y="331">8 (近似)</text><text x="822" y="331">9 (近似)</text>
  <text x="678" y="363">7 (近似)</text><text x="750" y="363">8 (近似)</text><text x="822" y="363">9 (近似)</text>
</g>
<text x="718" y="402" text-anchor="middle" font-size="12.5" font-weight="700" fill="#065f56">紧接送入新追问后缀（位置 10, 11..）继续生成</text>

<g fill="none" stroke="#087f73" stroke-width="1.7" marker-end="url(#sr-teal)">
  <line x1="260" y1="350" x2="280" y2="350"/>
  <line x1="542" y1="350" x2="562" y2="350"/>
</g>
</svg>
