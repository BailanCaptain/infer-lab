<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 376" width="820" height="376" role="img" aria-label="保存对象示意。格内 7/8/9 是历史位置，不是 token ID；回放会取回这些位置的 token 输入。全局历史命中后仍可读取，缺少的是各层近期窗口。重新计算得到近似窗口，随后处理新输入或继续生成。">
