  <path d="M770 135 L770 210 L515 210 L515 290" fill="none" stroke="var(--color-weight, #c78300)" stroke-width="1.4" stroke-dasharray="7 5" marker-end="url(#tensor-layout-flow-ah-weight)"/>
  <path d="M185 320 L220 320" fill="none" stroke="var(--color-ink, #17211f)" stroke-width="1.4" marker-end="url(#tensor-layout-flow-ah-ink)"/>
