  <text x="25" y="257" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="13" font-weight="700" fill="var(--color-ink-muted, #66716d)">每次前向时</text>
  <path d="M185 90 L220 90" fill="none" stroke="var(--color-ink, #17211f)" stroke-width="1.4" marker-end="url(#tensor-layout-flow-ah-ink)"/>
