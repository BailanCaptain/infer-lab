  <path d="M615 320 L670 320" fill="none" stroke="var(--color-ink, #17211f)" stroke-width="1.4" marker-end="url(#tensor-layout-flow-ah-ink)"/>
  <rect x="25" y="60" width="160" height="60" rx="8" fill="var(--color-weight, #c78300)" stroke="var(--color-ink, #17211f)" stroke-width="1.5"/>
