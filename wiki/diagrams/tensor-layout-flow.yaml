caption: 固定源码中动态 W8A8 方法的准备与使用。普通线性层按策略决定是否转 NZ，W8A8 专家分支直接转 NZ；前向复用加载后的权重。本图采用 BF16 输入和输出，只适用于选中该方法的层；GLM 的旧新量化配方对部分 MLA 投影采用不同精度，不能把这条路径套到全部线性层。
