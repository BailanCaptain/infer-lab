layout: figure
id: tensor-layout-intuition
caption: 同一矩阵的分块重排（2×2 小块为教学示意）。左侧是逻辑行列，右侧每行是连续存下的一个小块；块间先向下再向右，块内逐行。5 的逻辑坐标不变，存储位置从第 5 项变成第 3 项。
size: [900, 360]
grids:
  - at: [85, 68]
    rows: 4
    cols: 4
    cell: [48, 48]
    gap: 0
    tone: weight
    cells:
      - {at: [0, 0], text: "1"}
      - {at: [0, 1], text: "2"}
      - {at: [0, 2], text: "3"}
      - {at: [0, 3], text: "4"}
      - {at: [1, 0], text: "5"}
      - {at: [1, 1], text: "6"}
      - {at: [1, 2], text: "7"}
      - {at: [1, 3], text: "8"}
      - {at: [2, 0], text: "9"}
      - {at: [2, 1], text: "10"}
      - {at: [2, 2], text: "11"}
      - {at: [2, 3], text: "12"}
      - {at: [3, 0], text: "13"}
      - {at: [3, 1], text: "14"}
      - {at: [3, 2], text: "15"}
      - {at: [3, 3], text: "16"}
  - at: [575, 68]
    rows: 4
    cols: 4
    cell: [48, 48]
    gap: 0
    tone: weight
    cells:
      - {at: [0, 0], text: "1"}
      - {at: [0, 1], text: "2"}
      - {at: [0, 2], text: "5"}
      - {at: [0, 3], text: "6"}
      - {at: [1, 0], text: "9"}
      - {at: [1, 1], text: "10"}
      - {at: [1, 2], text: "13"}
      - {at: [1, 3], text: "14"}
      - {at: [2, 0], text: "3"}
      - {at: [2, 1], text: "4"}
      - {at: [2, 2], text: "7"}
      - {at: [2, 3], text: "8"}
      - {at: [3, 0], text: "11"}
      - {at: [3, 1], text: "12"}
      - {at: [3, 2], text: "15"}
      - {at: [3, 3], text: "16"}
texts:
  - {at: [85, 40], text: 逻辑矩阵：ND 逐行存, strong: true}
  - {at: [575, 40], text: NZ：每行画一个连续块, strong: true}
  - {at: [352, 90], text: 块间：大 N, strong: true}
  - {at: [352, 122], text: 左上 → 左下 →}
  - {at: [352, 154], text: 右上 → 右下}
  - {at: [352, 206], text: 块内：小 z, strong: true}
  - {at: [352, 238], text: 每块内部逐行存}
  - {at: [450, 313], text: "数值 5 的存储位置：第 5 项 → 第 3 项", anchor: middle}
