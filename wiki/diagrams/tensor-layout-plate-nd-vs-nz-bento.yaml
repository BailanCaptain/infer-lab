    symbols: [_should_trans_nz, maybe_trans_nz, ACL_FORMAT_FRACTAL_NZ]
  - source: 'vllm-ascend@c09d3e20:vllm_ascend/ascend_config.py#L615-L657'
    symbols: [weight_nz_mode]
