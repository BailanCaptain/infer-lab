<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 770" width="900" height="770" role="img" aria-label="标准 Qwen3-8B 在 TP=2 下单个 Decoder 层的前向与通信边界：自注意力块按列切头（每卡 16Q + 4KV）、本地完成逐头 Q/K Norm + RoPE + 注意力后经 RowParallelLinear o_proj 做第 1 次 All-Reduce；SwiGLU 前馈块按列合并切分 gate_up、本地完成 SiluAndMul 激活后经 RowParallelLinear down_proj 做第 2 次 All-Reduce。全层结构规整对称，每层固定恰好 2 次 All-Reduce（36 层共 72 次）。">
