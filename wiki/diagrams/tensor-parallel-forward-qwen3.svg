<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 744" width="900" height="744" role="img" aria-label="Qwen3-8B 在 TP=2 下单层真实几何切分图：上半展示 GQA 32Q+8KV 分成每卡 4 组 4Q+1KV 头部网格与 o_proj 行切部分和归约；下半展示 SwiGLU gate/up 成对列切 6144、本地 SiluAndMul 激活、down_proj 行切部分和与第二次 All-Reduce" font-family="var(--font-sans)">
  <title>Qwen3-8B 在 TP=2 下单个 Decoder 层的几何切分与通信边界：自注意力把 32Q + 8KV 按头列切为每卡 4 组（16Q + 4KV），本地完成 q/k_norm + RoPE + FlashAttn 后经 o_proj 上下半行切输出部分和 P₀、P₁ 并做第 1 次 All-Reduce；SwiGLU 成对列切 gate/up（各 6,144 维）、本地 SiluAndMul 零通信后经 down_proj 上下半行切输出部分和 P₀′、P₁′ 并做第 2 次 All-Reduce。</title>
