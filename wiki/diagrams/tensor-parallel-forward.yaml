layout: figure
id: tensor-parallel-forward
caption: 一个 decoder 层的通信边界：attention 后先归约，再按层型选择稠密 MLP 或 MoE。MoE 两栏互斥，共享分支与外层入口的归约位置互补，每条路径只计一次 TP All-Reduce。按默认关闭共享专家多 stream 重叠的顺序画；embedding 和 lm_head 在层外另计。
