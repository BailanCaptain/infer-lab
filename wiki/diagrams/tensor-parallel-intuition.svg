<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 360" width="880" height="360" role="img" aria-label="N 张卡合算一对矩阵：每卡用同一份 X 乘第一个矩阵的列片，得到数值完整的几列；逐元素激活后，直接乘第二个矩阵的对应行片，产生完整形状的部分和。最后只做一次 All-Reduce，每卡得到完整 Y。卡 1 与卡 N−1 之间省略其余卡。">
  <title>N 张卡合算一对矩阵：每卡用同一份 X 乘第一个矩阵的列片，得到数值完整的几列；逐元素激活后，直接乘第二个矩阵的对应行片，产生完整形状的部分和。最后只做一次 All-Reduce，每卡得到完整 Y。卡 1 与卡 N−1 之间省略其余卡。</title>
  <defs><marker id="tensor-parallel-intuition-ah-ink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="var(--color-ink, #17211f)"/></marker><marker id="tensor-parallel-intuition-ah-comm" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="var(--color-comm, #9a4b86)"/></marker></defs>
  <rect x="130" y="55" width="389" height="259" rx="16" fill="none" stroke="var(--color-line-strong, #b8bcb5)" stroke-width="1.5"/>
