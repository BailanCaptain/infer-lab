layout: figure
id: tensor-parallel-intuition
caption: N 张卡合算一对矩阵：每卡用同一份 X 乘第一个矩阵的列片，得到数值完整的几列；逐元素激活后，直接乘第二个矩阵的对应行片，产生完整形状的部分和。最后只做一次 All-Reduce，每卡得到完整 Y。卡 1 与卡 N−1 之间省略其余卡。
