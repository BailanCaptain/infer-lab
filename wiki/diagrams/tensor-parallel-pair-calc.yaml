layout: figure
id: tensor-parallel-pair-calc
caption: 一对矩阵 φ(x·W₁)·W₂ 在两张卡上怎么算（数为示意，φ 取 ReLU：负数变 0）。W₁ 按列切，每卡算出 2 个真值；激活逐个数计算，本卡就能做；W₂ 按行切，每卡拿的正好是自己那 2 个数对应的行，算出形状完整的部分和（浅色）；最后一次 All-Reduce 相加，两张卡都得到单卡结果 [10, 4]。
size: [880, 330]
