layout: figure
id: tensor-parallel-two-splits
caption: 同一个 x·W₁ 交给两张卡（数为示意）。上：按列切，每张卡算出 4 个数里的 2 个，都已是真值，按卡号拼起来即可。下：按行切，每张卡只配 x 里对应的那个数，算出 4 个数，形状齐全，但每个数只加了一半（浅色是部分和），必须对应位置相加。虚线格是这张卡没有或用不到的数。两种切法最后都得到 [5, 1, 3, −2]。
size: [880, 520]
grids:
  # ---- 按列切
  - at: [60, 85]
    rows: 1
    cols: 2
    cell: [34, 30]
    tone: token
    style: solid
    rowLabels: ['卡 0']
    colLabels: ['x₁', 'x₂']
    cells:
      - { at: [0, 0], text: '1' }
      - { at: [0, 1], text: '2' }
  - at: [154, 70]
    rows: 2
    cols: 2
    cell: [34, 30]
    tone: weight
    style: solid
    label: 第 1、2 列
    cells:
      - { at: [0, 0], text: '1' }
      - { at: [0, 1], text: '3' }
      - { at: [1, 0], text: '2' }
      - { at: [1, 1], text: '−1' }
  - at: [340, 85]
    rows: 1
    cols: 4
    cell: [34, 30]
    tone: token
    style: solid
    cells:
      - { at: [0, 0], text: '5' }
      - { at: [0, 1], text: '1' }
      - { at: [0, 2], style: ghost }
      - { at: [0, 3], style: ghost }
  - at: [60, 195]
    rows: 1
    cols: 2
    cell: [34, 30]
    tone: token
    style: solid
    rowLabels: ['卡 1']
    cells:
      - { at: [0, 0], text: '1' }
      - { at: [0, 1], text: '2' }
  - at: [154, 180]
    rows: 2
    cols: 2
    cell: [34, 30]
    tone: weight
    style: solid
    label: 第 3、4 列
    cells:
      - { at: [0, 0], text: '−1' }
      - { at: [0, 1], text: '2' }
      - { at: [1, 0], text: '2' }
      - { at: [1, 1], text: '−2' }
  - at: [340, 195]
    rows: 1
    cols: 4
    cell: [34, 30]
    tone: token
    style: solid
    label: 数值完整，形状不全
    cells:
      - { at: [0, 0], style: ghost }
      - { at: [0, 1], style: ghost }
      - { at: [0, 2], text: '3' }
      - { at: [0, 3], text: '−2' }
  - at: [680, 141]
    rows: 1
    cols: 4
    cell: [34, 30]
    tone: token
    style: solid
    label: 每张卡都有完整的一行
    cells:
      - { at: [0, 0], text: '5' }
      - { at: [0, 1], text: '1' }
      - { at: [0, 2], text: '3' }
      - { at: [0, 3], text: '−2' }
  # ---- 按行切
  - at: [60, 368]
    rows: 1
    cols: 2
    cell: [34, 30]
    tone: token
    style: solid
    rowLabels: ['卡 0']
    colLabels: ['x₁', 'x₂']
    cells:
      - { at: [0, 0], text: '1' }
      - { at: [0, 1], text: '2', style: ghost }
  - at: [154, 368]
    rows: 1
    cols: 4
    cell: [34, 30]
    tone: weight
    style: solid
    label: 第 1 行
    cells:
      - { at: [0, 0], text: '1' }
      - { at: [0, 1], text: '3' }
      - { at: [0, 2], text: '−1' }
      - { at: [0, 3], text: '2' }
  - at: [340, 368]
    rows: 1
    cols: 4
    cell: [34, 30]
    tone: token
    style: faded
    cells:
      - { at: [0, 0], text: '1' }
      - { at: [0, 1], text: '3' }
      - { at: [0, 2], text: '−1' }
      - { at: [0, 3], text: '2' }
  - at: [60, 448]
    rows: 1
    cols: 2
    cell: [34, 30]
    tone: token
    style: solid
    rowLabels: ['卡 1']
    cells:
      - { at: [0, 0], text: '1', style: ghost }
      - { at: [0, 1], text: '2' }
  - at: [154, 448]
    rows: 1
    cols: 4
    cell: [34, 30]
    tone: weight
    style: solid
    label: 第 2 行
    cells:
      - { at: [0, 0], text: '2' }
      - { at: [0, 1], text: '−1' }
      - { at: [0, 2], text: '2' }
      - { at: [0, 3], text: '−2' }
  - at: [340, 448]
    rows: 1
    cols: 4
    cell: [34, 30]
    tone: token
    style: faded
    label: 形状完整，数值只是部分和
    cells:
      - { at: [0, 0], text: '4' }
      - { at: [0, 1], text: '−2' }
      - { at: [0, 2], text: '4' }
      - { at: [0, 3], text: '−4' }
  - at: [680, 418]
    rows: 1
    cols: 4
    cell: [34, 30]
    tone: token
    style: solid
    label: 每张卡都有完整的一行
    cells:
      - { at: [0, 0], text: '5' }
      - { at: [0, 1], text: '1' }
      - { at: [0, 2], text: '3' }
      - { at: [0, 3], text: '−2' }
