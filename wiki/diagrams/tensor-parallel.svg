<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 330" width="900" height="330" role="img" aria-label="TP=2 时一层注意力的走法：先列切，两颗各算各的头；再行切，各出半份结果；最后 all-reduce 把两份加成同一份完整结果">
