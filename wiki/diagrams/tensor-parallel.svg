<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 1110" width="900" height="1110" role="img" aria-label="R1 的一个稠密 MLP：gate、up 各沿输出维切八份，本地门控后直接接 down。P₀…P₇ 各是一张完整形状的 [4,4096] 张量，浅色表示数值仍为部分和；All-Reduce 把八张张量对应位置相加。矩阵格线仅示意，非逐元素比例。">
