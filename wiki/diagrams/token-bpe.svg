<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 510" width="900" height="510" role="img" aria-label="字节级 BPE 切出「推理」（字节是真实的 UTF-8 编码；合并表和编号是示意）：先把两个字拆成 6 个字节，再每次在当前能并的相邻两块里，挑合并表中最靠上的一条来并，块数从 6 减到 1；最后这一块到词表里查出编号。">
