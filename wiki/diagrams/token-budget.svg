<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 484" width="880" height="484" role="img" aria-label="调度器每一步的选择（默认 fcfs 策略示意）：先给 running 里的请求续上各自差的位置，余量再给 waiting 的新请求；每排一条请求，都要同时拿到 token 预算和能存下它历史的 KV 块。priority 策略缺块时改按优先级与到达时间挑受抢占者。">
  <title>调度器每一步的选择（默认 fcfs 策略示意）：先给 running 里的请求续上各自差的位置，余量再给 waiting 的新请求；每排一条请求，都要同时拿到 token 预算和能存下它历史的 KV 块。priority 策略缺块时改按优先级与到达时间挑受抢占者。</title>
  <defs><marker id="token-budget-ah-ink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="var(--color-ink, #17211f)"/></marker><pattern id="token-budget-hatch" width="7" height="7" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="7" height="7" fill="var(--color-control-soft, #f1efe8)"/><line x1="0" y1="0" x2="0" y2="7" stroke="var(--color-ink-muted, #66716d)" stroke-width="2"/></pattern></defs>
  <path d="M274 84 L340 96" fill="none" stroke="var(--color-ink, #17211f)" stroke-width="1.4" marker-end="url(#token-budget-ah-ink)"/>
  <path d="M274 150 L340 96" fill="none" stroke="var(--color-ink, #17211f)" stroke-width="1.4" marker-end="url(#token-budget-ah-ink)"/>
  <path d="M274 260 L340 96" fill="none" stroke="var(--color-ink, #17211f)" stroke-width="1.4" marker-end="url(#token-budget-ah-ink)"/>
  <rect x="340" y="76" width="25" height="40" rx="4" fill="var(--color-token-soft, #ddf4ef)" stroke="var(--color-token, #087f73)" stroke-width="1.4"/>
  <rect x="365" y="76" width="25" height="40" rx="4" fill="var(--color-token-soft, #ddf4ef)" stroke="var(--color-token, #087f73)" stroke-width="1.4"/>
  <rect x="390" y="76" width="450" height="40" rx="4" fill="var(--color-token-soft, #ddf4ef)" stroke="var(--color-token, #087f73)" stroke-width="1.4"/>
  <text x="406" y="101" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="13" font-weight="700" fill="var(--color-ink, #17211f)">C 的前一段</text>
  <rect x="340" y="70" width="500" height="52" rx="7" fill="none" stroke="var(--color-control, #66716d)" stroke-width="2.2"/>
  <text x="840" y="60" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="13" font-weight="700" fill="var(--color-control, #66716d)" text-anchor="end">本步 token 预算</text>
  <rect x="340" y="150" width="225" height="32" rx="4" fill="url(#token-budget-hatch)" stroke="var(--color-ink-muted, #66716d)" stroke-width="1.3"/>
  <text x="356" y="171" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="13" font-weight="700" fill="var(--color-ink, #17211f)">C 余下的，留到下一步</text>
  <rect x="340" y="262" width="40" height="40" fill="var(--color-kv-soft, #e8edff)"/>
  <text x="360" y="286.7" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="13" font-weight="700" fill="var(--color-ink, #17211f)" text-anchor="middle">A</text>
  <rect x="380" y="262" width="40" height="40" fill="var(--color-kv-soft, #e8edff)"/>
  <text x="400" y="286.7" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="13" font-weight="700" fill="var(--color-ink, #17211f)" text-anchor="middle">B</text>
  <rect x="420" y="262" width="40" height="40" fill="var(--color-kv-soft, #e8edff)"/>
  <text x="440" y="286.7" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="13" font-weight="700" fill="var(--color-ink, #17211f)" text-anchor="middle">C</text>
  <rect x="460" y="262" width="40" height="40" fill="var(--color-kv-soft, #e8edff)"/>
  <text x="480" y="286.7" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="13" font-weight="700" fill="var(--color-ink, #17211f)" text-anchor="middle">C</text>
  <rect x="500" y="262" width="40" height="40" fill="var(--color-kv-soft, #e8edff)"/>
  <text x="520" y="286.7" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="13" font-weight="700" fill="var(--color-ink, #17211f)" text-anchor="middle">C</text>
  <rect x="540" y="262" width="40" height="40" fill="var(--color-kv-soft, #e8edff)"/>
  <text x="560" y="286.7" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="13" font-weight="700" fill="var(--color-ink, #17211f)" text-anchor="middle">C</text>
  <rect x="580" y="262" width="40" height="40" fill="var(--color-surface, #fbfaf6)"/>
  <rect x="620" y="262" width="40" height="40" fill="var(--color-surface, #fbfaf6)"/>
  <rect x="660" y="262" width="40" height="40" fill="var(--color-surface, #fbfaf6)"/>
  <rect x="700" y="262" width="40" height="40" fill="var(--color-surface, #fbfaf6)"/>
  <rect x="740" y="262" width="40" height="40" fill="var(--color-surface, #fbfaf6)"/>
  <rect x="780" y="262" width="40" height="40" fill="var(--color-surface, #fbfaf6)"/>
  <path d="M380 262v40M420 262v40M460 262v40M500 262v40M540 262v40M580 262v40M620 262v40M660 262v40M700 262v40M740 262v40M780 262v40" stroke="var(--color-kv, #4c65b6)" stroke-opacity="0.3" stroke-width="1" fill="none"/>
  <rect x="340" y="262" width="480" height="40" fill="none" stroke="var(--color-kv, #4c65b6)" stroke-width="1.4"/>
  <rect x="24" y="56" width="250" height="56" rx="8" fill="var(--color-token-soft, #ddf4ef)" stroke="var(--color-token, #087f73)" stroke-width="1.4"/>
  <text x="149" y="80" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="14" font-weight="700" fill="var(--color-ink, #17211f)" text-anchor="middle">A：差 1 个位置</text>
  <text x="149" y="99" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="13" font-weight="400" fill="#065f56" text-anchor="middle">上一步刚生成 1 个 token</text>
  <rect x="24" y="122" width="250" height="56" rx="8" fill="var(--color-token-soft, #ddf4ef)" stroke="var(--color-token, #087f73)" stroke-width="1.4"/>
  <text x="149" y="146" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="14" font-weight="700" fill="var(--color-ink, #17211f)" text-anchor="middle">B：差 1 个位置</text>
  <text x="149" y="165" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="13" font-weight="400" fill="#065f56" text-anchor="middle">上一步刚生成 1 个 token</text>
  <rect x="24" y="232" width="250" height="56" rx="8" fill="var(--color-token-soft, #ddf4ef)" stroke="var(--color-token, #087f73)" stroke-width="1.4"/>
  <text x="149" y="256" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="14" font-weight="700" fill="var(--color-ink, #17211f)" text-anchor="middle">C：整段提示词都没算</text>
  <text x="149" y="275" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="13" font-weight="400" fill="#065f56" text-anchor="middle">差很多个位置</text>
  <rect x="24" y="298" width="250" height="56" rx="8" fill="var(--color-surface, #fbfaf6)" stroke="var(--color-token, #087f73)" stroke-opacity="0.45" stroke-width="1.3" stroke-dasharray="5 4"/>
  <text x="149" y="322" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="13" font-weight="400" fill="#065f56" text-anchor="middle">D：整段提示词都没算</text>
  <text x="149" y="341" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="13" font-weight="400" fill="#065f56" text-anchor="middle">预算已用完，这一步排不上</text>
  <rect x="24" y="402" width="400" height="60" rx="8" fill="var(--color-danger-soft, #fbe5e2)" stroke="var(--color-danger, #b54237)" stroke-width="1.4"/>
  <text x="224" y="428" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="14" font-weight="700" fill="var(--color-ink, #17211f)" text-anchor="middle">running 的请求借不到块</text>
  <text x="224" y="447" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="13" font-weight="400" fill="#8f3229" text-anchor="middle">抢占 running 队尾一条，它的块全还回</text>
  <rect x="456" y="402" width="400" height="60" rx="8" fill="var(--color-control-soft, #f1efe8)" stroke="var(--color-control, #66716d)" stroke-width="1.4"/>
  <text x="656" y="428" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="14" font-weight="700" fill="var(--color-ink, #17211f)" text-anchor="middle">waiting 的请求借不到块</text>
  <text x="656" y="447" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="13" font-weight="400" fill="var(--color-ink-muted, #66716d)" text-anchor="middle">不抢占别人，这一步停止接纳</text>
  <text x="24" y="40" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="13.5" font-weight="700" fill="var(--color-ink, #17211f)">running：已经在跑的请求</text>
  <text x="24" y="216" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="13.5" font-weight="700" fill="var(--color-ink, #17211f)">waiting：刚到、还没排上的请求</text>
  <text x="340" y="40" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="13.5" font-weight="700" fill="var(--color-ink, #17211f)">① 先续 running，再把余量给 waiting</text>
  <text x="340" y="136" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="13" font-weight="400" fill="var(--color-ink, #17211f)">A、B 各 1 个</text>
  <text x="340" y="246" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="13.5" font-weight="700" fill="var(--color-ink, #17211f)">② 本步要写的位置，都要先借到空闲 KV 块</text>
  <text x="340" y="326" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="13.5" font-weight="400" fill="var(--color-ink-muted, #66716d)" font-style="italic">够才整套借出，不借一半</text>
  <text x="24" y="388" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="13.5" font-weight="700" fill="var(--color-ink, #17211f)">块不够时</text>
</svg>
