<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 436" width="900" height="436" role="img" aria-label="同一条规则，两种形状：token 预算条上，prefill 是一小截，decode 细到画不出来">
  <title>同一条规则，两种形状：token 预算条上，prefill 是一小截，decode 细到画不出来</title>
  <rect width="900" height="436" fill="var(--color-surface, #fbfaf6)"/>
  <rect x="20" y="56" width="860" height="76" rx="10" fill="var(--color-kv-soft, #e8edff)"/>
  <rect x="20" y="56" width="5" height="76" rx="2.5" fill="var(--color-kv, #4c65b6)"/>
  <g transform="translate(43.8 83.8) scale(0.85)" fill="none" stroke="var(--color-kv, #4c65b6)" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M4 12h6m0 0l-4-4m4 4l-4 4M14 5h6v6h-6zM14 13h6v6h-6z"/></g>
  <text x="78" y="91" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="15" font-weight="700" fill="var(--color-ink, #17211f)">第 1 步 · 那条请求的 prompt</text>
  <text x="78" y="111" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="12.5" font-weight="400" fill="var(--color-ink-muted, #5b6763)">num_computed_tokens：0 → 37</text>
  <rect x="20" y="146" width="860" height="76" rx="10" fill="var(--color-weight-soft, #fff4cf)"/>
  <rect x="20" y="146" width="5" height="76" rx="2.5" fill="var(--color-weight, #b87a00)"/>
  <g transform="translate(43.8 173.8) scale(0.85)" fill="none" stroke="var(--color-weight, #b87a00)" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M4 12h6m0 0l-4-4m4 4l-4 4M14 5h6v6h-6zM14 13h6v6h-6z"/></g>
  <text x="78" y="181" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="15" font-weight="700" fill="var(--color-ink, #17211f)">第 2 步 · 同一段代码</text>
  <text x="78" y="201" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="12.5" font-weight="400" fill="var(--color-ink-muted, #5b6763)">num_computed_tokens：37 → 38</text>
  <rect x="20" y="236" width="860" height="76" rx="10" fill="var(--color-canvas, #f5f2ea)"/>
  <rect x="20" y="236" width="5" height="76" rx="2.5" fill="var(--color-ink-faint, #8a928f)"/>
  <g transform="translate(43.8 263.8) scale(0.85)" fill="none" stroke="var(--color-ink-faint, #8a928f)" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M4 12h6m0 0l-4-4m4 4l-4 4M14 5h6v6h-6zM14 13h6v6h-6z"/></g>
  <text x="78" y="271" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="15" font-weight="700" fill="var(--color-ink, #17211f)">换一条 4096 token 的问题</text>
  <text x="78" y="291" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="12.5" font-weight="400" fill="var(--color-ink-muted, #5b6763)">预算不够，被切成两步</text>
  <rect x="386" y="80" width="460" height="22" rx="3" fill="var(--color-canvas, #f5f2ea)" stroke="var(--color-ink-faint, #8a928f)" stroke-width="1.1"/>
  <rect x="386" y="80" width="8.3" height="22" rx="3" fill="var(--color-kv, #4c65b6)" stroke="var(--color-kv, #4c65b6)" stroke-width="1.1"/>
  <rect x="386" y="170" width="460" height="22" rx="3" fill="var(--color-canvas, #f5f2ea)" stroke="var(--color-ink-faint, #8a928f)" stroke-width="1.1"/>
  <rect x="386" y="170" width="1.5" height="22" fill="var(--color-weight, #b87a00)" opacity="1"/>
  <rect x="386" y="260" width="460" height="22" rx="3" fill="var(--color-ink-faint, #8a928f)" stroke="var(--color-ink-faint, #8a928f)" stroke-width="1.1"/>
  <text x="386" y="118" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="12.5" font-weight="400" fill="var(--color-ink-muted, #5b6763)">37 / 2048 —— 就是左边这一小截</text>
  <text x="386" y="208" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="12.5" font-weight="400" fill="var(--color-ink-muted, #5b6763)">1 / 2048 —— 那条竖线已经是画得出来的最细了</text>
  <text x="386" y="298" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="12.5" font-weight="400" fill="var(--color-ink-muted, #5b6763)">2048 / 2048 全满，剩下的 2048 个 token 留到下一步算</text>
  <text x="20" y="348" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="13" font-weight="600" fill="var(--color-ink, #17211f)">预算条的长度是 max_num_batched_tokens，默认 2048。它不是「一次最多几条请求」，是「一次最多算几个 token」。</text>
  <text x="20" y="374" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="12.5" font-weight="400" fill="var(--color-ink-muted, #5b6763)">看懂这张图就知道两件事：一，一条请求根本填不满预算条，批处理是为了把它填满；二，prefill 和 decode 在代码里不是两个分支，只是同一个减法得</text>
  <text x="20" y="392.5" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="12.5" font-weight="400" fill="var(--color-ink-muted, #5b6763)">到的两个数。</text>
  <text x="20" y="408" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="12.5" font-weight="400" fill="var(--color-ink-muted, #5b6763)">那条请求的 37 个 token 之所以一步算完，只是因为 37 &lt; 2048。prompt 再长一点就会被切开，走的还是这段代码。</text>
</svg>
