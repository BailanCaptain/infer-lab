<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 250" width="900" height="250" role="img" aria-label="一步有 2048 个名额。那条请求第 1 步还差 37 个，就拿 37 个；第 2 步只差 1 个，就拿 1 个。两步用的是同一条规则">
  <title>一步有 2048 个名额。那条请求第 1 步还差 37 个，就拿 37 个；第 2 步只差 1 个，就拿 1 个。两步用的是同一条规则</title>
  <defs></defs>
  <rect x="110" y="74" width="13.9" height="26" rx="4" fill="var(--color-token, #087f73)" stroke="var(--color-ink, #17211f)" stroke-width="1.3"/>
  <rect x="110" y="68" width="768" height="38" rx="7" fill="none" stroke="var(--color-control, #66716d)" stroke-width="2.2"/>
  <text x="878" y="58" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="13" font-weight="700" fill="var(--color-control, #66716d)" text-anchor="end">2048 个名额</text>
  <rect x="110" y="162" width="0.4" height="26" rx="4" fill="var(--color-token, #087f73)" stroke="var(--color-ink, #17211f)" stroke-width="1.3"/>
  <rect x="110" y="156" width="768" height="38" rx="7" fill="none" stroke="var(--color-control, #66716d)" stroke-width="2.2"/>
  <text x="878" y="146" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="13" font-weight="700" fill="var(--color-control, #66716d)" text-anchor="end">2048 个名额</text>
  <text x="30" y="40" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="14" font-weight="700" fill="var(--color-ink, #17211f)">每一步：还差几个 token，就给几个名额</text>
  <text x="30" y="92" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="13.5" font-weight="700" fill="var(--color-ink, #17211f)">第 1 步</text>
  <text x="110" y="130" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="13" font-weight="400" fill="#065f56">还差 37 个 → 拿 37 个名额</text>
  <text x="30" y="180" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="13.5" font-weight="700" fill="var(--color-ink, #17211f)">第 2 步</text>
  <text x="110" y="218" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="13" font-weight="400" fill="#065f56">还差 1 个 → 拿 1 个名额</text>
  <text x="878" y="130" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="13" font-weight="400" fill="var(--color-ink-muted, #66716d)" text-anchor="end" font-style="italic">剩下 2011 个空着</text>
  <text x="878" y="218" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="13" font-weight="400" fill="var(--color-ink-muted, #66716d)" text-anchor="end" font-style="italic">剩下 2047 个空着</text>
</svg>
