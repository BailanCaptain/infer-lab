layout: figure
id: token-budget
caption: 一步有 2048 个名额。那条请求第 1 步还差 37 个，就拿 37 个；第 2 步只差 1 个，就拿 1 个。两步用的是同一条规则
size: [900, 250]

texts:
  - { at: [30, 40], text: 每一步：还差几个 token，就给几个名额, size: 14, strong: true }
  - { at: [30, 92], text: 第 1 步, size: 13.5, strong: true }
  - { at: [110, 130], text: 还差 37 个 → 拿 37 个名额, size: 13, tone: token }
  - { at: [30, 180], text: 第 2 步, size: 13.5, strong: true }
  - { at: [110, 218], text: 还差 1 个 → 拿 1 个名额, size: 13, tone: token }
  - { at: [878, 130], text: 剩下 2011 个空着, size: 13, note: true, anchor: end }
  - { at: [878, 218], text: 剩下 2047 个空着, size: 13, note: true, anchor: end }

bars:
  - at: [110, 74]
    scale: 0.375
    frame: { value: 2048, label: 2048 个名额, tone: control }
    segments: [{ value: 37, tone: token }]
  - at: [110, 162]
    scale: 0.375
    frame: { value: 2048, label: 2048 个名额, tone: control }
    segments: [{ value: 1, tone: token }]

pins:
  - source: vllm@0fc695fc:vllm/config/scheduler.py#L42-L49
    symbols: [DEFAULT_MAX_NUM_BATCHED_TOKENS, max_num_batched_tokens]
  - source: vllm@0fc695fc:vllm/v1/core/sched/scheduler.py#L358-L362
    symbols: [token_budget]
  - source: vllm@0fc695fc:vllm/v1/core/sched/scheduler.py#L403-L411
    symbols: [num_new_tokens, long_prefill_token_threshold]
