<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 660" width="840" height="660" role="img" aria-label="A1 在主机端套模板、分词、登记输出并选组；成功请求进入 A2 调度，A3 才准备设备输入。省略完整调用链，失败分支不会进入模型计算。">
  <title>A1 在主机端套模板、分词、登记输出并选组；成功请求进入 A2 调度，A3 才准备设备输入。省略完整调用链，失败分支不会进入模型计算。</title>
  <defs><marker id="token-entry-flow-ah-ink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="var(--color-ink, #17211f)"/></marker></defs>
  <path d="M520 66 L580 66" fill="none" stroke="var(--color-ink, #17211f)" stroke-width="1.4" marker-end="url(#token-entry-flow-ah-ink)"/>
