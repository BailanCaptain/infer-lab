<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 440" width="900" height="440" role="img" aria-label="Qwen3-8B 主机侧三站文本进出闭环图" font-family="var(--font-sans)">
<title>Qwen3-8B 在 vLLM v0.30.0 主机侧的三站文本进出闭环：ChatML 模板渲染并直接输出编号、InputProcessor 长度与 151936 词表双界校验、IncrementalDetokenizer 增量攒字节与停词过滤。</title>
<desc>resolve_chat_template 直出编号；InputProcessor 校验长度与词表上下界；IncrementalDetokenizer 增量拼字并跳过停止符。</desc>
<circle cx="26" cy="26" r="12" fill="#087f73"/>
<text x="26" y="30.5" text-anchor="middle" font-size="12.5" font-weight="700" fill="#ffffff">1</text>
<text x="46" y="32" font-size="16" font-weight="700" fill="#17211f">入口模板渲染与一步分词（Host CPU · vllm/renderers/hf.py）</text>
<rect x="14" y="46" width="244" height="84" rx="7" fill="#fbfaf6" stroke="#b8bcb5" stroke-width="1.4"/>
<text x="26" y="70" font-size="14.5" font-weight="700" fill="#17211f">messages + 顶层参数</text>
<text x="26" y="94" font-size="13.5" font-family="var(--font-mono)" fill="#4d5652">add_generation_prompt=True</text>
<text x="26" y="116" font-size="13.5" font-family="var(--font-mono)" fill="#66716d">continue_final_message=False</text>
<text x="272" y="93" text-anchor="middle" font-size="15" font-weight="700" fill="#66716d">→</text>
<rect x="286" y="46" width="290" height="84" rx="7" fill="#e8edff" stroke="#4c65b6" stroke-width="1.4"/>
<text x="298" y="70" font-size="14.5" font-weight="700" fill="#3a4f93">resolve_chat_template 四级解析</text>
<text x="298" y="94" font-size="13.5" font-family="var(--font-mono)" font-weight="700" fill="#17211f">safe_apply_chat_template</text>
<text x="298" y="116" font-size="13.5" font-family="var(--font-mono)" fill="#4d5652">tokenize=True, return_dict=False</text>
<text x="590" y="93" text-anchor="middle" font-size="15" font-weight="700" fill="#66716d">→</text>
<rect x="604" y="46" width="282" height="84" rx="7" fill="#ddf4ef" stroke="#087f73" stroke-width="1.4"/>
<text x="616" y="70" font-size="14.5" font-weight="700" fill="#065f56">Qwen3-8B 扁平编号序列</text>
<text x="616" y="94" font-size="13.5" font-family="var(--font-mono)" fill="#17211f">&lt;|im_start|&gt;...&lt;|im_end|&gt;</text>
<text x="616" y="116" font-size="13.5" fill="#4d5652">BOS=151643 · 免二次重编码补标记</text>
<line x1="14" y1="146" x2="886" y2="146" stroke="#b8bcb5" stroke-width="1.5" stroke-dasharray="6 4"/>
<circle cx="26" cy="172" r="12" fill="#c78300"/>
<text x="26" y="176.5" text-anchor="middle" font-size="12.5" font-weight="700" fill="#ffffff">2</text>
<text x="46" y="178" font-size="16" font-weight="700" fill="#17211f">长度预算与词表双界门禁（InputProcessor._validate_model_input）</text>
<rect x="14" y="192" width="420" height="84" rx="7" fill="#fff4cf" stroke="#c78300" stroke-width="1.4"/>
<text x="26" y="216" font-size="14.5" font-weight="700" fill="#936300">A. 长度与截断校验（_validate_prompt_len）</text>
<text x="26" y="240" font-size="13.5" font-family="var(--font-mono)" font-weight="700" fill="#17211f">0 &lt; prompt_len &lt; max_model_len（留输出位）</text>
<text x="26" y="262" font-size="13.5" fill="#4d5652">未开截断超长即拒；开启后按 left / right 切片</text>
<text x="450" y="239" text-anchor="middle" font-size="15" font-weight="700" fill="#66716d">→</text>
<rect x="466" y="192" width="420" height="84" rx="7" fill="#e8edff" stroke="#4c65b6" stroke-width="1.4"/>
<text x="478" y="216" font-size="14.5" font-weight="700" fill="#3a4f93">B. 词表上下界校验（Qwen3 vocab_size=151936）</text>
<text x="478" y="240" font-size="13.5" font-family="var(--font-mono)" font-weight="700" fill="#17211f">0 &lt;= id &lt;= max(max_token_id, 151935)</text>
<text x="478" y="262" font-size="13.5" fill="#4d5652">拦截负数与超界编号 → 经 EngineCore 送 NPU</text>
<line x1="14" y1="292" x2="886" y2="292" stroke="#b8bcb5" stroke-width="1.5" stroke-dasharray="6 4"/>
<circle cx="26" cy="318" r="12" fill="#9a4b86"/>
<text x="26" y="322.5" text-anchor="middle" font-size="12.5" font-weight="700" fill="#ffffff">3</text>
<text x="46" y="324" font-size="16" font-weight="700" fill="#17211f">出口增量反分词与停词扣留（IncrementalDetokenizer.update）</text>
<rect x="14" y="338" width="420" height="86" rx="7" fill="#ddf4ef" stroke="#087f73" stroke-width="1.4"/>
<text x="26" y="362" font-size="14.5" font-weight="700" fill="#065f56">FastIncrementalDetokenizer.decode_next</text>
<text x="26" y="386" font-size="13.5" fill="#17211f">NPU 回传新编号 → 按 UTF-8 字节流增量拼字</text>
<text x="26" y="408" font-size="13.5" fill="#4d5652">多字节生僻字攒齐再吐出，防半字乱码</text>
<text x="450" y="386" text-anchor="middle" font-size="15" font-weight="700" fill="#66716d">→</text>
<rect x="466" y="338" width="420" height="86" rx="7" fill="#f7e7f2" stroke="#9a4b86" stroke-width="1.4"/>
<text x="478" y="362" font-size="14.5" font-weight="700" fill="#7a3a6a">EOS=151645（&lt;|im_end|&gt;）与 stop 判停</text>
<text x="478" y="386" font-size="13.5" font-family="var(--font-mono)" fill="#17211f">include_stop_str_in_output=False</text>
<text x="478" y="408" font-size="13.5" font-weight="700" fill="#b54237">内部 token_ids 照记末位，可见文本跳过停止符</text>
</svg>
