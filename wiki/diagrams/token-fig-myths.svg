<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 460" width="900" height="460" role="img" aria-label="分词与聊天模板四大高频误区排雷开放对比图" font-family="var(--font-sans)">
<title>分词与模板四大高频误区排雷对照：词表行数与上下文上限、整段模板计数与二次补 BOS、特殊标记区间与普通用户文本、流式文本增量与内部输出编号。</title>
<desc>四大误区对比：vocab_size 与 max_model_len 区别；整段模板计数与关 add_special_tokens；特殊标记区间与普通文本；流式文本与内部 token_ids。</desc>
<line x1="14" y1="228" x2="886" y2="228" stroke="#b8bcb5" stroke-width="1.5" stroke-dasharray="6 4"/>
<line x1="450" y1="14" x2="450" y2="446" stroke="#b8bcb5" stroke-width="1.5" stroke-dasharray="6 4"/>
<circle cx="26" cy="28" r="12" fill="#4c65b6"/>
<text x="26" y="32.5" text-anchor="middle" font-size="12.5" font-weight="700" fill="#ffffff">1</text>
<text x="44" y="34" font-size="16" font-weight="700" fill="#17211f">词表行数 ≠ 认识词数 ≠ 输入上限</text>
<rect x="14" y="50" width="420" height="74" rx="7" fill="#fff0e9" stroke="#b54237" stroke-width="1.3"/>
<text x="26" y="76" font-size="14.5" font-weight="700" fill="#8f3229">✗ 误区：vocab_size=151936 就是可输 15 万词</text>
<text x="26" y="103" font-size="13.5" fill="#4d5652">把可选座位号空间当成序列长度，或当成完整日常词语</text>
<rect x="14" y="136" width="420" height="78" rx="7" fill="#ddf4ef" stroke="#087f73" stroke-width="1.3"/>
<text x="26" y="162" font-size="14.5" font-weight="700" fill="#065f56">✓ 真相：决定首尾矩阵行数，长度由 max_model_len 管</text>
<text x="26" y="188" font-size="13.5" fill="#4d5652">含 256 单字节、子词、控制符与预留行（如 GLM 末 24 行）</text>
<circle cx="478" cy="28" r="12" fill="#c78300"/>
<text x="478" y="32.5" text-anchor="middle" font-size="12.5" font-weight="700" fill="#ffffff">2</text>
<text x="496" y="34" font-size="16" font-weight="700" fill="#17211f">裸问题字数 ≠ 模板后真实 prompt_len</text>
<rect x="466" y="50" width="420" height="74" rx="7" fill="#fff0e9" stroke="#b54237" stroke-width="1.3"/>
<text x="478" y="76" font-size="14.5" font-weight="700" fill="#8f3229">✗ 误区：只数最新聊天气泡，或渲染后再默认重编码</text>
<text x="478" y="103" font-size="13.5" fill="#4d5652">漏算历史轮次与边界标记，二次编码还会多塞重复 BOS</text>
<rect x="466" y="136" width="420" height="78" rx="7" fill="#ddf4ef" stroke="#087f73" stroke-width="1.3"/>
<text x="478" y="162" font-size="14.5" font-weight="700" fill="#065f56">✓ 真相：整段对话套完模板计数，一步直出编号</text>
<text x="478" y="188" font-size="13.5" fill="#4d5652">先渲染再分词须显式设 <tspan font-family="var(--font-mono)" font-weight="700">add_special_tokens=False</tspan></text>
<circle cx="26" cy="258" r="12" fill="#9a4b86"/>
<text x="26" y="262.5" text-anchor="middle" font-size="12.5" font-weight="700" fill="#ffffff">3</text>
<text x="44" y="264" font-size="16" font-weight="700" fill="#17211f">控制标记区间 ≠ 用户字面文本</text>
<rect x="14" y="282" width="420" height="74" rx="7" fill="#fff0e9" stroke="#b54237" stroke-width="1.3"/>
<text x="26" y="308" font-size="14.5" font-weight="700" fill="#8f3229">✗ 误区：两段看起来一样的 prompt 编号必定相同</text>
<text x="26" y="335" font-size="13.5" fill="#4d5652">丢掉标记区间对整串裸文本重分词，正文会被误切为边界</text>
<rect x="14" y="368" width="420" height="78" rx="7" fill="#ddf4ef" stroke="#087f73" stroke-width="1.3"/>
<text x="26" y="394" font-size="14.5" font-weight="700" fill="#065f56">✓ 真相：区分显式 special 区间与普通内容切分</text>
<text x="26" y="420" font-size="13.5" fill="#4d5652">且新增词元未必都是 <tspan font-family="var(--font-mono)" font-weight="700">special=true</tspan>（影响自动跳过）</text>
<circle cx="478" cy="258" r="12" fill="#087f73"/>
<text x="478" y="262.5" text-anchor="middle" font-size="12.5" font-weight="700" fill="#ffffff">4</text>
<text x="496" y="264" font-size="16" font-weight="700" fill="#17211f">流式收到 K 段文字 ≠ 生成 K 个 token</text>
<rect x="466" y="282" width="420" height="74" rx="7" fill="#fff0e9" stroke="#b54237" stroke-width="1.3"/>
<text x="478" y="308" font-size="14.5" font-weight="700" fill="#8f3229">✗ 误区：数 SSE 片段数或可见字符反推输出编号数</text>
<text x="478" y="335" font-size="13.5" fill="#4d5652">忽略半字 UTF-8 缓冲、停止串扣留与末尾停止符跳过</text>
<rect x="466" y="368" width="420" height="78" rx="7" fill="#ddf4ef" stroke="#087f73" stroke-width="1.3"/>
<text x="478" y="394" font-size="14.5" font-weight="700" fill="#065f56">✓ 真相：精确计量一律读取内部生成的 token_ids</text>
<text x="478" y="420" font-size="13.5" fill="#4d5652"><tspan font-family="var(--font-mono)" font-weight="700">skipped_stop_token_id</tspan> 不转文字但仍追加进序列</text>
</svg>
