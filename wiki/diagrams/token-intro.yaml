layout: figure
id: token-intro
caption: 一句话变成 token（切法和编号都是示意）：分词器把句子切成 4 块，每块到词表里查出自己的编号；4 个 token 按先后排在位置 0–3。编号回答「是词表里的哪一项」，位置回答「排第几」，两者互不相干。
