<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 300" width="840" height="300" role="img" aria-label="一句用户文本先按模板组织，再经配套分词器成为编号序列；符号只表示流向，未指定实际切分或 token 数。">
  <title>一句用户文本先按模板组织，再经配套分词器成为编号序列；符号只表示流向，未指定实际切分或 token 数。</title>
  <defs><marker id="token-split-ah-ink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="var(--color-ink, #17211f)"/></marker></defs>
  <path d="M270 67 L320 67" fill="none" stroke="var(--color-ink, #17211f)" stroke-width="1.4" marker-end="url(#token-split-ah-ink)"/>
  <path d="M565 99 L565 150" fill="none" stroke="var(--color-ink, #17211f)" stroke-width="1.4" marker-end="url(#token-split-ah-ink)"/>
  <path d="M320 182 L270 182" fill="none" stroke="var(--color-ink, #17211f)" stroke-width="1.4" marker-end="url(#token-split-ah-ink)"/>
  <rect x="25" y="35" width="245" height="64" rx="8" fill="var(--color-surface-sunken, #ece9df)" stroke="var(--color-ink, #17211f)" stroke-width="1.5"/>
  <text x="147.5" y="63" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="14" font-weight="700" fill="var(--color-ink, #17211f)" text-anchor="middle">用户说：推理引擎怎么工作</text>
  <text x="147.5" y="82" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="13" font-weight="400" fill="var(--color-ink, #17211f)" text-anchor="middle">角色 + 正文</text>
  <rect x="320" y="35" width="490" height="64" rx="8" fill="var(--color-control, #66716d)" stroke="var(--color-ink, #17211f)" stroke-width="1.5"/>
  <text x="565" y="63" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="14" font-weight="700" fill="var(--color-ink-inverse, #ffffff)" text-anchor="middle">对话模板组织消息</text>
  <text x="565" y="82" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="13" font-weight="400" fill="var(--color-ink-inverse, #ffffff)" text-anchor="middle">角色与边界标记 + 正文 + 回答起始格式</text>
  <rect x="320" y="150" width="490" height="64" rx="8" fill="var(--color-token, #087f73)" stroke="var(--color-ink, #17211f)" stroke-width="1.5"/>
  <text x="565" y="178" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="14" font-weight="700" fill="var(--color-ink-inverse, #ffffff)" text-anchor="middle">配套分词器 · 切分并查词表</text>
  <text x="565" y="197" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="13" font-weight="400" fill="var(--color-ink-inverse, #ffffff)" text-anchor="middle">每个单元得到一个整数编号</text>
  <rect x="25" y="150" width="245" height="64" rx="8" fill="var(--color-surface-sunken, #ece9df)" stroke="var(--color-ink, #17211f)" stroke-width="1.5"/>
  <text x="147.5" y="178" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="14" font-weight="700" fill="var(--color-ink, #17211f)" text-anchor="middle">p₀　p₁　…　pₙ₋₁</text>
  <text x="147.5" y="197" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="13" font-weight="400" fill="var(--color-ink, #17211f)" text-anchor="middle">最终编号序列 · 共 n 个位置</text>
  <text x="420" y="264" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="13.5" font-weight="400" fill="var(--color-ink-muted, #66716d)" text-anchor="middle" font-style="italic">在主机上完成；后续嵌入查表才把编号变成用于计算的向量</text>
</svg>
