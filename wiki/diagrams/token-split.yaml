  - { at: [55, 150], size: [66, 54], text: "[gMASK]", sub: "154822", tone: control, style: solid }
  - { at: [127, 150], size: [62, 54], text: "<sop>", sub: "154824", tone: control, style: solid }
  - { at: [195, 150], size: [84, 54], text: "<|system|>", sub: "154826", tone: control, style: solid }
  - { at: [285, 150], size: [92, 54], text: 推理强度说明, sub: 几个 token, tone: control, style: faded }
  - { at: [383, 150], size: [68, 54], text: "<|user|>", sub: "154827", tone: control, style: solid }
  - { at: [457, 150], size: [46, 54], text: 推理, sub: a, tone: token, style: solid }
  - { at: [509, 150], size: [46, 54], text: 引擎, sub: b, tone: token, style: solid }
  - { at: [561, 150], size: [46, 54], text: 怎么, sub: c, tone: token, style: solid }
  - { at: [613, 150], size: [46, 54], text: 工作, sub: d, tone: token, style: solid }
  - { at: [665, 150], size: [106, 54], text: "<|assistant|>", sub: "154828", tone: control, style: solid }
  - { at: [777, 150], size: [66, 54], text: "<think>", sub: "154841", tone: control, style: solid }
  - { at: [300, 275], size: [60, 52], text: p₀, sub: 位置 0, tone: token, style: solid }
  - { at: [366, 275], size: [60, 52], text: p₁, sub: 位置 1, tone: token, style: solid }
  - { at: [432, 275], size: [60, 52], text: p₂, sub: 位置 2, tone: token, style: solid }
  - { at: [498, 275], size: [60, 52], text: p₃, sub: 位置 3, tone: token, style: solid }
