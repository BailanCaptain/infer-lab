layout: figure
id: token-split
caption: GLM 模型仓库自带的 chat template 处理一条消息：前后插入特殊标记，正文切成块，每块查词表得到一个编号。特殊标记的编号取自模型仓库的 tokenizer 文件；正文的切法和 a–d 是示意。主线 R1 把整条输入约定为 4 个编号，是教学简化。
size: [900, 350]
items:
