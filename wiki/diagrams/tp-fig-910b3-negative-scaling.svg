<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 624" width="860" height="624" role="img" aria-label="Qwen3-8B 在 Ascend 910B3 上 TP=1 到 TP=8 的负扩展双曲线实测与候选机制对照图" font-family="var(--font-sans)">
  <title>Ascend 910B3 上 Qwen3-8B（u=0.85）TP=1→2→4→8 负扩展实测与候选机制对照。</title>
  <desc>左侧展示 TP=1→2→4→8 下 KV 容量从 264k 增至 2.87M tokens，而 c=16 吞吐单调下降、c=1 TPOT 单调劣化及整池拷贝条件假设曲线；右侧对照独立 TP4 微基准通信税与每卡 KV 池反增两项候选机制，底部注明 FULL 图假设边界与 TTFT 口径差异。</desc>

  <text x="14" y="26" font-size="16" font-weight="700" fill="#17211f">Qwen3-8B 在 Ascend 910B3（u=0.85）负 TP 扩展：容量涨 10.9×，吞吐与延迟单调劣化</text>
  <line x1="14" y1="38" x2="846" y2="38" stroke="#b8bcb5" stroke-width="1.3"/>
  <line x1="442" y1="46" x2="442" y2="516" stroke="#b8bcb5" stroke-width="1.3" stroke-dasharray="6 4"/>

  <text x="14" y="60" font-size="14.5" font-weight="700" fill="#17211f">A. 实测对照：KV 容量暴涨 vs c=16 吞吐劣化</text>
  <rect x="16" y="70" width="14" height="11" rx="2" fill="#e8edff" stroke="#4c65b6" stroke-width="1.3"/>
  <text x="36" y="80" font-size="13" fill="#3a4f93">KV 总容量 (tokens)</text>
  <line x1="176" y1="75" x2="200" y2="75" stroke="#b54237" stroke-width="2.4"/>
  <circle cx="188" cy="75" r="3.8" fill="#b54237"/>
  <text x="208" y="80" font-size="13" font-weight="700" fill="#8f3229">c=16 吞吐 (tok/s)</text>

  <g stroke="#ece9df" stroke-width="1">
    <line x1="34" y1="112" x2="420" y2="112"/>
    <line x1="34" y1="158" x2="420" y2="158"/>
    <line x1="34" y1="204" x2="420" y2="204"/>
  </g>
  <line x1="34" y1="248" x2="420" y2="248" stroke="#b8bcb5" stroke-width="1.4"/>

  <g fill="#e8edff" stroke="#4c65b6" stroke-width="1.4">
    <rect x="56" y="240" width="52" height="8" rx="2"/>
    <rect x="152" y="230" width="52" height="18" rx="2"/>
    <rect x="248" y="210" width="52" height="38" rx="2"/>
    <rect x="344" y="172" width="52" height="76" rx="2"/>
  </g>
  <g text-anchor="middle" font-size="13" font-weight="700" fill="#3a4f93">
    <text x="82" y="232">264k</text>
    <text x="178" y="222">634k</text>
    <text x="274" y="202">1.38M</text>
    <text x="370" y="215">2.87M</text>
  </g>

  <polyline points="82,108 178,137 274,141 370,150" fill="none" stroke="#b54237" stroke-width="2.6"/>
  <g fill="#b54237" stroke="#ffffff" stroke-width="1.5">
    <circle cx="82" cy="108" r="4.5"/>
    <circle cx="178" cy="137" r="4.5"/>
    <circle cx="274" cy="141" r="4.5"/>
    <circle cx="370" cy="150" r="4.5"/>
  </g>
  <g text-anchor="middle" font-size="13" font-weight="700" fill="#8f3229">
    <text x="82" y="98">195.28</text>
    <text x="178" y="126">171.13</text>
    <text x="274" y="130">167.30</text>
    <text x="370" y="139">160.38</text>
  </g>

  <g text-anchor="middle" font-size="13" font-family="var(--font-mono)" fill="#17211f">
    <text x="82" y="266">TP=1</text>
    <text x="178" y="266">TP=2</text>
    <text x="274" y="266">TP=4</text>
    <text x="370" y="266">TP=8</text>
  </g>

  <text x="14" y="296" font-size="14.5" font-weight="700" fill="#17211f">B. 实测 c=1 TPOT vs 条件推断整池复制 (ms)</text>
  <line x1="16" y1="312" x2="40" y2="312" stroke="#9a4b86" stroke-width="2.4"/>
  <circle cx="28" cy="312" r="3.8" fill="#9a4b86"/>
  <text x="46" y="317" font-size="13" font-weight="700" fill="#7a3a6a">实测 TPOT</text>
  <line x1="138" y1="312" x2="164" y2="312" stroke="#4c65b6" stroke-width="2.2" stroke-dasharray="5 3"/>
  <circle cx="151" cy="312" r="3.5" fill="#4c65b6"/>
  <text x="170" y="317" font-size="13" fill="#3a4f93">条件推断整池复制*</text>

  <g stroke="#ece9df" stroke-width="1">
    <line x1="34" y1="361" x2="420" y2="361"/>
    <line x1="34" y1="411" x2="420" y2="411"/>
    <line x1="34" y1="461" x2="420" y2="461"/>
  </g>
  <line x1="34" y1="486" x2="420" y2="486" stroke="#b8bcb5" stroke-width="1.4"/>

  <polyline points="82,402 178,381 274,372 370,362" fill="none" stroke="#9a4b86" stroke-width="2.6"/>
  <g fill="#9a4b86" stroke="#ffffff" stroke-width="1.5">
    <circle cx="82" cy="402" r="4.5"/>
    <circle cx="178" cy="381" r="4.5"/>
    <circle cx="274" cy="372" r="4.5"/>
    <circle cx="370" cy="362" r="4.5"/>
  </g>
  <g text-anchor="middle" font-size="13" font-weight="700" fill="#7a3a6a">
    <text x="82" y="390">78.54</text>
    <text x="178" y="369">87.12</text>
    <text x="274" y="360">90.57</text>
    <text x="370" y="350">94.42</text>
  </g>

  <polyline points="82,457 178,428 274,413 370,406" fill="none" stroke="#4c65b6" stroke-width="2.2" stroke-dasharray="6 4"/>
  <g fill="#4c65b6" stroke="#ffffff" stroke-width="1.3">
    <circle cx="82" cy="457" r="4"/>
    <circle cx="178" cy="428" r="4"/>
    <circle cx="274" cy="413" r="4"/>
    <circle cx="370" cy="406" r="4"/>
  </g>
  <g text-anchor="middle" font-size="13" fill="#3a4f93">
    <text x="82" y="476">56.77*</text>
    <text x="178" y="447">68.09*</text>
    <text x="274" y="432">74.09*</text>
    <text x="370" y="425">77.09*</text>
  </g>

  <g text-anchor="middle" font-size="13" font-family="var(--font-mono)" fill="#17211f">
    <text x="82" y="506">TP=1</text>
    <text x="178" y="506">TP=2</text>
    <text x="274" y="506">TP=4</text>
    <text x="370" y="506">TP=8</text>
  </g>

  <text x="456" y="60" font-size="14.5" font-weight="700" fill="#17211f">C. 候选劣化机制与独立微基准对照</text>

  <rect x="456" y="72" width="390" height="226" rx="8" fill="#ffffff" stroke="#9a4b86" stroke-width="1.5"/>
  <text x="470" y="96" font-size="14.5" font-weight="700" fill="#7a3a6a">候选 1：独立 TP4 微基准归约税 &gt; 计算节省</text>
  <text x="470" y="117" font-size="13" fill="#66716d">独立微基准（M=2048, K=4096→1024, 16 MiB 输出）</text>

  <rect x="470" y="128" width="164" height="24" rx="4" fill="#fff4cf" stroke="#c78300" stroke-width="1.3"/>
  <text x="478" y="145" font-size="13" font-weight="700" fill="#936300">MatMulV3 TP1</text>
  <text x="642" y="145" font-size="13" font-weight="700" fill="#936300">256.6 µs</text>

  <rect x="470" y="158" width="45" height="24" rx="4" fill="#ddf4ef" stroke="#087f73" stroke-width="1.3"/>
  <rect x="515" y="158" width="119" height="24" rx="4" fill="#f7f5ef" stroke="#087f73" stroke-width="1.2" stroke-dasharray="4 3"/>
  <text x="574" y="175" text-anchor="middle" font-size="13" font-weight="700" fill="#065f56">仅省 ~186 µs</text>
  <text x="642" y="175" font-size="13" font-weight="700" fill="#065f56">TP4 70.6 µs</text>

  <rect x="470" y="188" width="358" height="26" rx="4" fill="#f7e7f2" stroke="#9a4b86" stroke-width="1.4"/>
  <text x="480" y="206" font-size="13" font-weight="700" fill="#7a3a6a">hcom_allReduce_: 525.1 µs（微基准重叠 0 µs）</text>

  <g font-size="13" fill="#17211f">
    <text x="470" y="236">• HCCS 边样本 17.6~17.9 GB/s（transit 25.17 MB）</text>
    <text x="470" y="258">• 多卡 TP 源码 72 归约位置（线上重叠待实测）</text>
    <text x="470" y="280" fill="#66716d">• c=1 仅 8 KiB/次，不可将 525 µs 直接 ×72</text>
  </g>

  <rect x="456" y="310" width="390" height="204" rx="8" fill="#ffffff" stroke="#4c65b6" stroke-width="1.5"/>
  <text x="470" y="334" font-size="14.5" font-weight="700" fill="#3a4f93">候选 2：固定 u=0.85 本地 KV 池反增（外推）</text>
  <text x="470" y="355" font-size="13" fill="#66716d">权重从 15.29 → 1.94 GiB，腾出显存自动填入 KV 池：</text>

  <g font-size="13" font-family="var(--font-mono)" fill="#17211f">
    <text x="470" y="381">TP=1</text>
    <text x="470" y="405">TP=2</text>
    <text x="470" y="429">TP=4</text>
    <text x="470" y="453">TP=8</text>
  </g>
  <g fill="#e8edff" stroke="#4c65b6" stroke-width="1.3">
    <rect x="516" y="368" width="99" height="16" rx="3"/>
    <rect x="516" y="392" width="118" height="16" rx="3"/>
    <rect x="516" y="416" width="129" height="16" rx="3"/>
    <rect x="516" y="440" width="134" height="16" rx="3"/>
  </g>
  <g font-size="13" font-family="var(--font-mono)" fill="#3a4f93">
    <text x="658" y="381">36.28 GiB · 56.77* ms</text>
    <text x="658" y="405">43.52 GiB · 68.09* ms</text>
    <text x="658" y="429">47.35 GiB · 74.09* ms</text>
    <text x="658" y="453">49.27 GiB · 77.09* ms</text>
  </g>

  <text x="470" y="480" font-size="13" font-weight="700" fill="#8f3229">* 标星属强条件假设（非已抓 FULL kernel 实测）：</text>
  <text x="470" y="500" font-size="13" fill="#8f3229">若 FULL 图重放同速整池连续化（待线上时间线验证）</text>

  <rect x="14" y="528" width="832" height="82" rx="8" fill="#f7f5ef" stroke="#b8bcb5" stroke-width="1.3"/>
  <text x="26" y="551" font-size="13.5" font-weight="700" fill="#17211f">计量口径与证据边界（跨机比较必读）</text>
  <text x="26" y="573" font-size="13" fill="#17211f">• TTFT 口径不同不可直比：单卡 TP=1 输入 24~40 tokens（chat 中位数），八卡 TP=2/4/8 平均 262 tokens（completions 均值）。</text>
  <text x="26" y="595" font-size="13" fill="#66716d">• 稳态 128 步 TPOT 与 c=16 吞吐可对照；TP=2→4→8 同脚本同输入严格单调劣化，c≤16 未测出高并发正收益交叉点。</text>
</svg>
