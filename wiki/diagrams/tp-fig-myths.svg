<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 498" width="900" height="498" role="img" aria-label="张量并行五组常见误解与源码真相排障对照板" font-family="var(--font-sans)">
  <title>张量并行五组常见认知误区与源码真相排障对照板。</title>
  <desc>五排开放式对照：1. 逐层阻塞归约须留机内 HCCS 且载荷只看激活形状；2. 非线性激活决定先列切后行切；3. GQA 副本保底与 MLA 潜向量逐卡复制；4. FRACTAL_NZ 转换与运行时 FP32 副本峰值；5. W8A8 下 BF16 归约与图模式仍执行集合通信。</desc>
  <defs>
    <marker id="tpm-arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto">
      <path d="M 0 1.5 L 8.5 5 L 0 8.5 z" fill="#087f73"/>
    </marker>
  </defs>

  <text x="14" y="30" font-size="16" font-weight="700" fill="#8f3229">✗ 常见错误直觉（高频踩坑点）</text>
  <text x="392" y="30" font-size="16" font-weight="700" fill="#065f56">✓ 源码与数学真相（算账与排障判据）</text>
  <line x1="12" y1="42" x2="888" y2="42" stroke="#b8bcb5" stroke-width="1.4"/>
  <line x1="378" y1="12" x2="378" y2="486" stroke="#b8bcb5" stroke-width="1.3" stroke-dasharray="5 4"/>

  <g fill="#fff0e9" stroke="#b54237" stroke-width="1.4">
    <rect x="12" y="54" width="352" height="76" rx="9"/>
    <rect x="12" y="142" width="352" height="76" rx="9"/>
    <rect x="12" y="230" width="352" height="76" rx="9"/>
    <rect x="12" y="318" width="352" height="76" rx="9"/>
    <rect x="12" y="406" width="352" height="76" rx="9"/>
  </g>
  <g fill="#ffffff" stroke="#087f73" stroke-width="1.5">
    <rect x="392" y="54" width="496" height="76" rx="9"/>
    <rect x="392" y="142" width="496" height="76" rx="9"/>
    <rect x="392" y="230" width="496" height="76" rx="9"/>
    <rect x="392" y="318" width="496" height="76" rx="9"/>
    <rect x="392" y="406" width="496" height="76" rx="9"/>
  </g>
  <g fill="none" stroke="#087f73" stroke-width="2" marker-end="url(#tpm-arr)">
    <path d="M 364 92 L 386 92"/>
    <path d="M 364 180 L 386 180"/>
    <path d="M 364 268 L 386 268"/>
    <path d="M 364 356 L 386 356"/>
    <path d="M 364 444 L 386 444"/>
  </g>

  <g font-size="15" font-weight="700" fill="#8f3229">
    <text x="26" y="81">1. 跨 RoCE 扩 TP 线性加速 / 通信跟权重走</text>
    <text x="26" y="169">2. 先行切再激活，或拿部分和乘 TP 凑数</text>
    <text x="26" y="257">3. 所有权重与 KV 缓存都按 1/TP 缩小</text>
    <text x="26" y="345">4. 静态权重除以 TP 就是最终显存峰值</text>
    <text x="26" y="433">5. W8A8 归约只传 1B；开图就没有通信</text>
  </g>
  <g font-size="13.5" fill="#8f3229">
    <text x="26" y="110">以为卡越多越快，且参数越多单次归约越重</text>
    <text x="26" y="198">看到行切输出宽度完整，就直接往下层传</text>
    <text x="26" y="286">忽略 EP 专家、GQA 头数地板与 MLA 潜向量</text>
    <text x="26" y="374">漏算格式转换与首次前向新分配的常驻缓冲</text>
    <text x="26" y="462">混淆存储精度与归约精度，把录图当省掉同步</text>
  </g>

  <g font-size="15" font-weight="700" fill="#065f56">
    <text x="408" y="81">每层 2 次阻塞归约留机内 HCCS；载荷只看 T×H</text>
    <text x="408" y="169">非线性不可拆加，须先列切→本地激活→再行切</text>
    <text x="408" y="257">TP &gt; kv_heads 按副本复制；MLA 潜向量逐卡存整份</text>
    <text x="408" y="345">加载后转 <tspan font-family="var(--font-mono)" font-size="14" fill="#936300">FRACTAL_NZ</tspan> 与运行时副本推高峰值</text>
    <text x="408" y="433">hidden 归约与 logits 仍传 BF16 (2B)；录图照常归约</text>
  </g>
  <g font-size="13.5" fill="#66716d">
    <text x="408" y="110">跨机 RoCE 拉长逐层等待；R1 归约 32 KiB，场景 M 达 47.25 MiB</text>
    <text x="408" y="198">φ(P₀+P₁) ≠ φ(P₀)+φ(P₁)；末尾须经 <tspan font-family="var(--font-mono)" font-weight="700" fill="#7a3a6a">All-Reduce</tspan> 对应相加</text>
    <text x="408" y="286">由 <tspan font-family="var(--font-mono)" font-weight="700" fill="#7a3a6a">num_kv_head_replicas</tspan> 保底 1 头；MLA 未开 DCP 不切缓存</text>
    <text x="408" y="374"><tspan font-family="var(--font-mono)" font-weight="700" fill="#3a4f93">process_weights_after_loading</tspan> 转 NZ；GLM 索引器另增 54 MiB</text>
    <text x="408" y="462"><tspan font-family="var(--font-mono)" font-weight="700" fill="#065f56">graph mode</tspan> 省算子逐次下发开销，集合通信仍在图内执行</text>
  </g>
</svg>
