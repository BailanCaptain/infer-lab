<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 564" width="900" height="564" role="img" aria-label="分布式通信超时三分支对照图：区分某 Rank 根本没到（首错崩溃）、某 Rank 迟到（负载或 GC 拖慢）与全员已到但交换本身慢（链路带宽）" font-family="var(--font-sans)">
  <title>分布式集合通信超时三分支：根本没到 vs 有人迟到 vs 交换本身慢</title>
  <desc>Three multi-rank collective communication failure patterns: Rank crashed before barrier (secondary EI0002 Notify wait execute timeout, distinct from link-establish EI0006), straggler rank late due to workload/GC skew, and all ranks arrived simultaneously with slow fabric/link exchange</desc>
  <defs>
    <marker id="ts-ff-arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="#4d5652"/>
    </marker>
    <marker id="ts-ff-red" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="#b54237"/>
    </marker>
  </defs>

  <text x="16" y="26" font-size="16" font-weight="700" fill="#17211f">集合通信慢或报 EI0002：三种截然不同的多卡时间线，先分型再查网络</text>
  <text x="884" y="26" text-anchor="end" font-size="13.5" fill="#66716d">相对阶段示意（非实测时长）</text>

  <!-- Shared vertical barrier guide lines for timelines (x=112..620) -->
  <g stroke="#d8d8cf" stroke-width="1" stroke-dasharray="4 4">
    <line x1="112" y1="44" x2="112" y2="484"/>
    <line x1="258" y1="44" x2="258" y2="484"/>
    <line x1="608" y1="44" x2="608" y2="484"/>
  </g>

  <!-- ================= CASE A: Rank Never Arrived (First Fault Crash) ================= -->
  <text x="16" y="54" font-size="15" font-weight="700" fill="#8f3229">分支 A · 某 Rank 根本没到（首错崩溃 → 其余卡苦等刷屏 EI0002）</text>

  <!-- Ranks 0..2 bars -->
  <text x="16" y="84" font-size="13.5" font-weight="700" fill="#17211f">Rank 0–2</text>
  <rect x="112" y="66" width="146" height="26" rx="5" fill="#fff4cf" stroke="#c78300" stroke-width="1.3"/>
  <text x="185" y="84" text-anchor="middle" font-size="13.5" fill="#936300">前向计算完成</text>
  <rect x="262" y="66" width="346" height="26" rx="5" fill="#f7e7f2" stroke="#9a4b86" stroke-width="1.3" stroke-dasharray="5 3"/>
  <text x="435" y="84" text-anchor="middle" font-size="13.5" fill="#7a3a6a">卡死在 Notify wait → 刷屏 EI0002（次生）</text>

  <!-- Rank 3 bar -->
  <text x="16" y="120" font-size="13.5" font-weight="700" fill="#8f3229">Rank 3 ★</text>
  <rect x="112" y="102" width="110" height="26" rx="5" fill="#fff4cf" stroke="#c78300" stroke-width="1.3"/>
  <text x="167" y="120" text-anchor="middle" font-size="13.5" fill="#936300">算子 / 录图</text>
  <rect x="226" y="102" width="212" height="26" rx="5" fill="#fff0e9" stroke="#b54237" stroke-width="1.7"/>
  <text x="332" y="120" text-anchor="middle" font-size="13.5" font-weight="700" fill="#8f3229">★ 首错：OOM / EZ9999 退出</text>
  <line x1="438" y1="115" x2="474" y2="115" stroke="#b54237" stroke-width="1.6" marker-end="url(#ts-ff-red)"/>
  <text x="480" y="120" font-size="13.5" font-weight="700" fill="#8f3229">从未入屏障</text>

  <!-- Right Triage Box A -->
  <rect x="624" y="64" width="260" height="68" rx="7" fill="#fff0e9" stroke="#b54237" stroke-width="1.4"/>
  <text x="636" y="88" font-size="14" font-weight="700" fill="#8f3229">动作：捞最早主错，勿罪 Rank 0</text>
  <text x="636" y="110" font-size="13.5" fill="#17211f">按时间戳合并全组 worker + plog</text>
  <text x="636" y="127" font-size="13.5" fill="#66716d">只排纯次生 EI0002，留最早主错</text>

  <line x1="16" y1="150" x2="884" y2="150" stroke="#d8d8cf" stroke-width="1.2" stroke-dasharray="6 4"/>

  <!-- ================= CASE B: Rank Late (Straggler / Load / GC Skew) ================= -->
  <text x="16" y="178" font-size="15" font-weight="700" fill="#936300">分支 B · 某 Rank 迟到（无报错，但负载不均 / MoE 热点 / Host 或 GC 拖慢）</text>

  <!-- Ranks 0..2 bars -->
  <text x="16" y="210" font-size="13.5" font-weight="700" fill="#17211f">Rank 0–2</text>
  <rect x="112" y="192" width="146" height="26" rx="5" fill="#fff4cf" stroke="#c78300" stroke-width="1.3"/>
  <text x="185" y="210" text-anchor="middle" font-size="13.5" fill="#936300">早已算完</text>
  <rect x="262" y="192" width="260" height="26" rx="5" fill="#f7e7f2" stroke="#9a4b86" stroke-width="1.3" stroke-dasharray="5 3"/>
  <text x="392" y="210" text-anchor="middle" font-size="13.5" fill="#7a3a6a">被算进通信耗时的「空等迟到者」</text>
  <rect x="526" y="192" width="82" height="26" rx="5" fill="#ddf4ef" stroke="#087f73" stroke-width="1.4"/>
  <text x="567" y="210" text-anchor="middle" font-size="13.5" font-weight="700" fill="#065f56">短交换</text>

  <!-- Rank 3 bar -->
  <text x="16" y="246" font-size="13.5" font-weight="700" fill="#936300">Rank 3 ⏳</text>
  <rect x="112" y="228" width="410" height="26" rx="5" fill="#fff4cf" stroke="#c78300" stroke-width="1.7"/>
  <text x="317" y="246" text-anchor="middle" font-size="13.5" font-weight="700" fill="#936300">前序计算拉长（DP 偏斜 / 专家热点 / GC 暂停）</text>
  <rect x="526" y="228" width="82" height="26" rx="5" fill="#ddf4ef" stroke="#087f73" stroke-width="1.4"/>
  <text x="567" y="246" text-anchor="middle" font-size="13.5" font-weight="700" fill="#065f56">短交换</text>
  <!-- Barrier arrival marker at x=524 -->
  <line x1="524" y1="188" x2="524" y2="260" stroke="#087f73" stroke-width="1.5" stroke-dasharray="3 2"/>

  <!-- Right Triage Box B -->
  <rect x="624" y="190" width="260" height="68" rx="7" fill="#fff4cf" stroke="#c78300" stroke-width="1.4"/>
  <text x="636" y="214" font-size="14" font-weight="700" fill="#936300">动作：比各卡设备到达时刻</text>
  <text x="636" y="236" font-size="13.5" fill="#17211f">控制迟到卡负载看等待是否下降</text>
  <text x="636" y="253" font-size="13.5" fill="#66716d">查 DP 路由 / EPLB / CPU 绑核</text>

  <line x1="16" y1="276" x2="884" y2="276" stroke="#d8d8cf" stroke-width="1.2" stroke-dasharray="6 4"/>

  <!-- ================= CASE C: All Arrived, Exchange Itself Slow ================= -->
  <text x="16" y="304" font-size="15" font-weight="700" fill="#3a4f93">分支 C · 全员同时到齐，但交换本身很慢（真实链路 / 拓扑 / 带宽瓶颈）</text>

  <!-- Ranks 0..2 bars -->
  <text x="16" y="336" font-size="13.5" font-weight="700" fill="#17211f">Rank 0–2</text>
  <rect x="112" y="318" width="146" height="26" rx="5" fill="#fff4cf" stroke="#c78300" stroke-width="1.3"/>
  <text x="185" y="336" text-anchor="middle" font-size="13.5" fill="#936300">同步抵达</text>
  <rect x="262" y="318" width="346" height="26" rx="5" fill="#e8edff" stroke="#4c65b6" stroke-width="1.6"/>
  <text x="435" y="336" text-anchor="middle" font-size="13.5" font-weight="700" fill="#3a4f93">全员同时在跑 HCCL 集合交换，吞吐未达预期</text>

  <!-- Rank 3 bar -->
  <text x="16" y="372" font-size="13.5" font-weight="700" fill="#17211f">Rank 3</text>
  <rect x="112" y="354" width="146" height="26" rx="5" fill="#fff4cf" stroke="#c78300" stroke-width="1.3"/>
  <text x="185" y="372" text-anchor="middle" font-size="13.5" fill="#936300">同步抵达</text>
  <rect x="262" y="354" width="346" height="26" rx="5" fill="#e8edff" stroke="#4c65b6" stroke-width="1.6"/>
  <text x="435" y="372" text-anchor="middle" font-size="13.5" font-weight="700" fill="#3a4f93">全员同时在跑 HCCL 集合交换，吞吐未达预期</text>

  <!-- Right Triage Box C -->
  <rect x="624" y="316" width="260" height="68" rx="7" fill="#e8edff" stroke="#4c65b6" stroke-width="1.4"/>
  <text x="636" y="340" font-size="14" font-weight="700" fill="#3a4f93">动作：全组前序干净再查网</text>
  <text x="636" y="362" font-size="13.5" fill="#17211f">hccn_tool + 匹配规模 hccl_test</text>
  <text x="636" y="379" font-size="13.5" fill="#66716d">核对数据量、拓扑与真实负载竞争</text>

  <!-- Bottom 3-step convergence bar -->
  <line x1="16" y1="408" x2="884" y2="408" stroke="#b8bcb5" stroke-width="1.3"/>
  <text x="16" y="434" font-size="15" font-weight="700" fill="#17211f">现场三步收敛顺序（避免一见通信慢就换网线或只盯 Rank 0）</text>

  <rect x="16" y="448" width="274" height="102" rx="8" fill="#ddf4ef" stroke="#087f73" stroke-width="1.4"/>
  <text x="30" y="474" font-size="14.5" font-weight="700" fill="#065f56">① 排分支 A（先清假超时）</text>
  <text x="30" y="499" font-size="13.5" fill="#17211f">合并全组日志与 CANN plog</text>
  <text x="30" y="521" font-size="13.5" fill="#17211f">按时间戳反查最早报错 Rank</text>
  <text x="30" y="542" font-size="12" fill="#66716d">RPC&lt;1836s→3000s(v0.26.0rc 300s)</text>

  <line x1="290" y1="499" x2="312" y2="499" stroke="#4d5652" stroke-width="1.6" marker-end="url(#ts-ff-arr)"/>

  <rect x="314" y="448" width="274" height="102" rx="8" fill="#fff4cf" stroke="#c78300" stroke-width="1.4"/>
  <text x="328" y="474" font-size="14.5" font-weight="700" fill="#936300">② 排分支 B（区分谁迟到）</text>
  <text x="328" y="499" font-size="13.5" fill="#17211f">读设备侧到达与完成时间线</text>
  <text x="328" y="521" font-size="13.5" fill="#17211f">CPU 同提交 ≠ 设备同进度</text>
  <text x="328" y="542" font-size="13.5" fill="#66716d">控迟到卡工作量验证等待降幅</text>

  <line x1="588" y1="499" x2="610" y2="499" stroke="#4d5652" stroke-width="1.6" marker-end="url(#ts-ff-arr)"/>

  <rect x="612" y="448" width="272" height="102" rx="8" fill="#e8edff" stroke="#4c65b6" stroke-width="1.4"/>
  <text x="626" y="474" font-size="14.5" font-weight="700" fill="#3a4f93">③ 落分支 C（查链路与竞争）</text>
  <text x="626" y="499" font-size="13.5" fill="#17211f">确认全组前序均干净且同到齐</text>
  <text x="626" y="521" font-size="13.5" fill="#17211f">用匹配拓扑/规模的通信测试</text>
  <text x="626" y="542" font-size="13.5" fill="#66716d">并核对真实推理下的带宽竞争</text>
</svg>
