<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 408" width="900" height="408" role="img" aria-label="多卡交错日志首错 Rank 与次生 EI0006 超时分流示意图" font-family="var(--font-sans)">
  <title>多卡交错日志：如何从 EI0006 刷屏中锁定首错 Rank</title>
  <desc>init_snapshot, requested_memory, gpu_memory_utilization, capture_model, non_kv_memory, available_kv_cache_memory_bytes, VLLM_EXECUTE_MODEL_TIMEOUT_SECONDS, exitcode, finished_procs</desc>
  <defs>
    <marker id="ts-ff-arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto">
      <path d="M 0 1.5 L 8.5 5 L 0 8.5 z" fill="#087f73"/>
    </marker>
    <marker id="ts-ff-red" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto">
      <path d="M 0 1.5 L 8.5 5 L 0 8.5 z" fill="#b54237"/>
    </marker>
  </defs>

  <text x="14" y="28" font-size="16" font-weight="700" fill="#17211f">多卡交错日志时间轴示意：主故障先发 vs 次生集合通信超时</text>
  <text x="886" y="28" text-anchor="end" font-size="13.5" fill="#66716d">相对阶段 t₀ → t₃（教学示意，非实测时长）</text>
  <line x1="12" y1="40" x2="888" y2="40" stroke="#b8bcb5" stroke-width="1.3"/>

  <!-- Vertical phase grid -->
  <g stroke="#d8d8cf" stroke-width="1" stroke-dasharray="4 4">
    <line x1="150" y1="50" x2="150" y2="278"/>
    <line x1="390" y1="50" x2="390" y2="278"/>
    <line x1="640" y1="50" x2="640" y2="278"/>
    <line x1="874" y1="50" x2="874" y2="278"/>
  </g>
  <g font-family="var(--font-mono)" font-size="13.5" fill="#66716d" text-anchor="middle">
    <text x="150" y="64">t₀ 启动/进入本层</text>
    <text x="390" y="64">t₁ 首错爆发点</text>
    <text x="640" y="64">t₂ 屏障苦等期</text>
    <text x="850" y="64">t₃ 刷屏超时</text>
  </g>

  <!-- Swimlanes -->
  <g fill="#fbfaf6" stroke="#d8d8cf" stroke-width="1">
    <rect x="12" y="76" width="876" height="44" rx="8"/>
    <rect x="12" y="128" width="876" height="44" rx="8"/>
    <rect x="12" y="180" width="876" height="44" rx="8"/>
  </g>
  <rect x="12" y="232" width="876" height="48" rx="8" fill="#fff0e9" stroke="#b54237" stroke-width="1.4"/>

  <g font-size="14.5" font-weight="700" fill="#17211f">
    <text x="26" y="103">Rank 0</text>
    <text x="26" y="155">Rank 1</text>
    <text x="26" y="207">Rank 2</text>
    <text x="26" y="261" fill="#8f3229">Rank 3 ★首错</text>
  </g>

  <!-- Compute blocks for Ranks 0..2 -->
  <g fill="#fff4cf" stroke="#c78300" stroke-width="1.3">
    <rect x="150" y="84" width="180" height="28" rx="6"/>
    <rect x="150" y="136" width="188" height="28" rx="6"/>
    <rect x="150" y="188" width="176" height="28" rx="6"/>
  </g>
  <g font-size="13.5" font-weight="600" fill="#936300">
    <text x="164" y="103">前向计算完成</text>
    <text x="164" y="155">前向计算完成</text>
    <text x="164" y="207">前向计算完成</text>
  </g>

  <!-- Waiting cascade blocks for Ranks 0..2 -->
  <g fill="#f7e7f2" stroke="#9a4b86" stroke-width="1.3" stroke-dasharray="5 3">
    <rect x="336" y="84" width="538" height="28" rx="6"/>
    <rect x="344" y="136" width="530" height="28" rx="6"/>
    <rect x="332" y="188" width="542" height="28" rx="6"/>
  </g>
  <g font-size="13.5" fill="#7a3a6a">
    <text x="352" y="103">卡在 AllReduce Notify wait … 最终刷屏报 EI0006（次生症状）</text>
    <text x="360" y="155">卡在 AllReduce Notify wait … 最终刷屏报 EI0006（次生症状）</text>
    <text x="348" y="207">卡在 AllReduce Notify wait … 最终刷屏报 EI0006（次生症状）</text>
  </g>

  <!-- Rank 3 primary fault -->
  <rect x="150" y="241" width="140" height="30" rx="6" fill="#fff4cf" stroke="#c78300" stroke-width="1.3"/>
  <text x="164" y="261" font-size="13.5" font-weight="600" fill="#936300">前向/录图阶段</text>

  <rect x="298" y="241" width="268" height="30" rx="6" fill="#ffffff" stroke="#b54237" stroke-width="1.8"/>
  <text x="312" y="261" font-size="14" font-weight="700" fill="#8f3229">★ 首错：NPU OOM / EZ9999 退出</text>

  <path d="M 566 256 L 614 256" fill="none" stroke="#b54237" stroke-width="1.8" marker-end="url(#ts-ff-red)"/>
  <text x="622" y="261" font-size="13.5" font-weight="600" fill="#8f3229">从未进入 AllReduce，导致全组死等</text>

  <!-- Bottom 3-step decision bar -->
  <line x1="12" y1="296" x2="888" y2="296" stroke="#d8d8cf" stroke-width="1.2"/>

  <rect x="12" y="310" width="276" height="86" rx="10" fill="#ddf4ef" stroke="#087f73" stroke-width="1.4"/>
  <text x="26" y="335" font-size="14.5" font-weight="700" fill="#065f56">① 主故障优先于次生超时</text>
  <text x="26" y="359" font-size="13.5" fill="#17211f">先捞 OOM / EZ9999 / ValueError</text>
  <text x="26" y="381" font-size="13.5" fill="#66716d">把 EI0006 与死进程归为连带症状</text>

  <path d="M 288 353 L 310 353" fill="none" stroke="#087f73" stroke-width="2" marker-end="url(#ts-ff-arrow)"/>

  <rect x="316" y="310" width="276" height="86" rx="10" fill="#e8edff" stroke="#4c65b6" stroke-width="1.4"/>
  <text x="330" y="335" font-size="14.5" font-weight="700" fill="#3a4f93">② 按时间戳反查全组首错</text>
  <text x="330" y="359" font-size="13.5" fill="#17211f">合并各卡 worker 日志与 CANN plog</text>
  <text x="330" y="381" font-size="13.5" fill="#66716d">不以文件最后一行定罪，防误判 Rank 0</text>

  <path d="M 592 353 L 614 353" fill="none" stroke="#087f73" stroke-width="2" marker-end="url(#ts-ff-arrow)"/>

  <rect x="620" y="310" width="268" height="86" rx="10" fill="#ece9df" stroke="#b8bcb5" stroke-width="1.4"/>
  <text x="634" y="335" font-size="14.5" font-weight="700" fill="#17211f">③ 全组皆无主错再查链路</text>
  <text x="634" y="359" font-size="13.5" fill="#17211f">确认每张卡同期前序均干净后</text>
  <text x="634" y="381" font-size="13.5" fill="#66716d">再转 hccn_tool / hccl_test 查网</text>
</svg>
