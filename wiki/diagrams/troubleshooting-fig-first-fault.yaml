mode: native-svg
id: troubleshooting-fig-first-fault
caption: >-
  分布式集合通信超时与变慢三分支对照图：区分（A）某 Rank 在前序算子或录图崩溃根本没到屏障，导致其余卡卡在 Notify wait 刷屏次生 EI0006；（B）无报错但某 Rank 因 DP 偏斜、MoE 专家热点或 Host/GC 迟到，使早到卡的等待被计入通信耗时；（C）全员同时抵达屏障而集合交换本身慢，此时才进入 hccn_tool / hccl_test 链路排查。
