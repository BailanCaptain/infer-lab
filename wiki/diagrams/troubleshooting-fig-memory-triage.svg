<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 490" width="900" height="490" role="img" aria-label="推理内存与显存排障分流树：先区分退出码 137 宿主机/容器 OOM 与设备 NPU HBM，再沿 init_snapshot、权重试跑、KV 后图捕获与运行期抢占四阶段对应最小首取证据" font-family="var(--font-sans)">
  <title>内存与容量分流树：宿主机退出码 137 vs 设备 HBM 四阶段定位</title>
  <desc>Memory triage decision tree separating host/container exit 137 (SIGKILL) from four NPU HBM stages: init_snapshot, weights/profile_run, post-KV capture_model (1-u margin), and runtime KV preemption</desc>
  <defs>
    <marker id="mt-arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="#4d5652"/>
    </marker>
    <marker id="mt-blue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="#4c65b6"/>
    </marker>
  </defs>

  <text x="16" y="26" font-size="16" font-weight="700" fill="#17211f">内存与容量排障分流：先切「宿主机/容器」与「设备 HBM」，再按时点取最小证据</text>
  <text x="884" y="26" text-anchor="end" font-size="13.5" fill="#66716d">切忌见退出码 137 就直接砍 KV 缓存</text>

  <!-- Top Fork: Process Exit 137 vs Device HBM -->
  <rect x="16" y="44" width="376" height="110" rx="8" fill="#fff0e9" stroke="#b54237" stroke-width="1.6"/>
  <text x="28" y="70" font-size="14.5" font-weight="700" fill="#8f3229">出口 0：进程突退（退出码 137 / −9 / SIGKILL）</text>
  <text x="28" y="96" font-size="12.5" fill="#17211f">137 本身不证明 NPU HBM 不足！先查主机与容器层：</text>
  <text x="28" y="120" font-family="var(--font-mono)" font-size="12.5" font-weight="700" fill="#8f3229">dmesg -T · cgroup memory.events · OOMKilled</text>
  <text x="28" y="143" font-size="12.5" fill="#4d5652">区分主动终止 vs 主机 DRAM OOM，确认非主机限制再进右支</text>

  <line x1="392" y1="99" x2="424" y2="99" stroke="#4c65b6" stroke-width="1.8" marker-end="url(#mt-blue)"/>

  <rect x="428" y="44" width="456" height="110" rx="8" fill="#e8edff" stroke="#4c65b6" stroke-width="1.6"/>
  <text x="444" y="70" font-size="15" font-weight="700" fill="#3a4f93">主干：确认落在设备 NPU HBM 侧（按生命周期四时点拆解）</text>
  <text x="444" y="96" font-size="13.5" fill="#17211f">启动日志出现 <tspan font-family="var(--font-mono)">init_snapshot</tspan> / <tspan font-family="var(--font-mono)">NPU out of memory</tspan>，或运行期</text>
  <text x="444" y="120" font-size="13.5" fill="#17211f"><tspan font-family="var(--font-mono)">kv_cache_usage_perc</tspan> 长期逼近 1.0 → 沿下方四阶段定位最后正常点</text>
  <text x="444" y="143" font-size="13.5" fill="#3a4f93">同一条显存轴上，四个时点消耗的预算来源与修法完全不同</text>

  <!-- Vertical drop to timeline -->
  <line x1="656" y1="154" x2="656" y2="176" stroke="#4c65b6" stroke-width="1.6" marker-end="url(#mt-blue)"/>

  <!-- Chronological 4-Stage Bar (y = 180 .. 226) -->
  <rect x="16" y="180" width="202" height="44" rx="6" fill="#fff0e9" stroke="#b54237" stroke-width="1.5"/>
  <text x="117" y="207" text-anchor="middle" font-size="14" font-weight="700" fill="#8f3229">① init_snapshot 预检</text>

  <line x1="218" y1="202" x2="236" y2="202" stroke="#4d5652" stroke-width="1.6" marker-end="url(#mt-arr)"/>

  <rect x="238" y="180" width="202" height="44" rx="6" fill="#fff4cf" stroke="#c78300" stroke-width="1.5"/>
  <text x="339" y="207" text-anchor="middle" font-size="14" font-weight="700" fill="#936300">② 权重 / profile_run</text>

  <line x1="440" y1="202" x2="458" y2="202" stroke="#4d5652" stroke-width="1.6" marker-end="url(#mt-arr)"/>

  <rect x="460" y="180" width="202" height="44" rx="6" fill="#f7e7f2" stroke="#9a4b86" stroke-width="1.5"/>
  <text x="561" y="207" text-anchor="middle" font-size="14" font-weight="700" fill="#7a3a6a">③ KV 后图捕获 (1−u)</text>

  <line x1="662" y1="202" x2="680" y2="202" stroke="#4d5652" stroke-width="1.6" marker-end="url(#mt-arr)"/>

  <rect x="682" y="180" width="202" height="44" rx="6" fill="#ddf4ef" stroke="#087f73" stroke-width="1.5"/>
  <text x="783" y="207" text-anchor="middle" font-size="14" font-weight="700" fill="#065f56">④ 运行期抢占 / 复用</text>

  <!-- Vertical connectors down to exit cards -->
  <g stroke="#8a928f" stroke-width="1.4" marker-end="url(#mt-arr)">
    <line x1="117" y1="224" x2="117" y2="246"/>
    <line x1="339" y1="224" x2="339" y2="246"/>
    <line x1="561" y1="224" x2="561" y2="246"/>
    <line x1="783" y1="224" x2="783" y2="246"/>
  </g>

  <!-- 4 Exit Cards with Minimal First-Take Evidence (y = 250 .. 476) -->
  <!-- Card 1 -->
  <rect x="16" y="250" width="202" height="226" rx="8" fill="#ffffff" stroke="#b54237" stroke-width="1.4"/>
  <text x="28" y="276" font-size="14.5" font-weight="700" fill="#8f3229">启动前即拒跑</text>
  <text x="28" y="300" font-size="13.5" fill="#17211f">初始空闲显存低于</text>
  <text x="28" y="321" font-family="var(--font-mono)" font-size="13.5" fill="#8f3229">u × total_memory</text>
  <text x="28" y="342" font-size="13.5" fill="#4d5652">直接抛 ValueError</text>
  <rect x="26" y="356" width="182" height="58" rx="6" fill="#fff0e9"/>
  <text x="34" y="378" font-size="13.5" font-weight="700" fill="#8f3229">最小首取证据</text>
  <text x="34" y="401" font-family="var(--font-mono)" font-size="13.5" fill="#17211f">npu-smi info</text>
  <text x="28" y="438" font-size="13.5" font-weight="700" fill="#17211f">动作：清同卡残留进程</text>
  <text x="28" y="460" font-size="13.5" fill="#4d5652">或核对并发混布占用</text>

  <!-- Card 2 -->
  <rect x="238" y="250" width="202" height="226" rx="8" fill="#ffffff" stroke="#c78300" stroke-width="1.4"/>
  <text x="250" y="276" font-size="14.5" font-weight="700" fill="#936300">权重 / 批预算峰值超限</text>
  <text x="250" y="300" font-size="13.5" fill="#17211f">加载权重或 profile_run</text>
  <text x="250" y="321" font-size="13.5" fill="#17211f">按批预算试跑激活超限</text>
  <text x="250" y="342" font-size="13.5" fill="#4d5652">非必为单条满长装不下</text>
  <rect x="248" y="356" width="182" height="58" rx="6" fill="#fff4cf"/>
  <text x="256" y="378" font-size="13.5" font-weight="700" fill="#936300">最小首取证据</text>
  <text x="256" y="401" font-size="13.5" fill="#17211f">加载日志 + 批预算上限</text>
  <text x="250" y="438" font-size="13.5" font-weight="700" fill="#17211f">先收紧批预算 / 并发</text>
  <text x="250" y="460" font-size="13.5" fill="#4d5652">仍超限再扩 TP 或量化</text>

  <!-- Card 3 -->
  <rect x="460" y="250" width="202" height="226" rx="8" fill="#ffffff" stroke="#9a4b86" stroke-width="1.4"/>
  <text x="472" y="276" font-size="14.5" font-weight="700" fill="#7a3a6a">图捕获吃空 1−u</text>
  <text x="472" y="300" font-size="13.5" fill="#17211f">权重与 KV 已分配完</text>
  <text x="472" y="321" font-family="var(--font-mono)" font-size="13.5" fill="#7a3a6a">capture_model()</text>
  <text x="472" y="342" font-size="13.5" fill="#4d5652">吃空预算外 1−u 余量</text>
  <rect x="470" y="356" width="182" height="58" rx="6" fill="#f7e7f2"/>
  <text x="478" y="378" font-size="13.5" font-weight="700" fill="#7a3a6a">最小首取证据</text>
  <text x="478" y="401" font-size="13.5" fill="#17211f">日志建议 --kv-cache</text>
  <text x="472" y="438" font-size="13.5" font-weight="700" fill="#17211f">动作：下调 u（如 0.9）</text>
  <text x="472" y="460" font-size="13.5" fill="#4d5652">或改传显式 KV 字节数</text>

  <!-- Card 4 -->
  <rect x="682" y="250" width="202" height="226" rx="8" fill="#ffffff" stroke="#087f73" stroke-width="1.4"/>
  <text x="694" y="276" font-size="14.5" font-weight="700" fill="#065f56">运行期抢占 vs 泄漏</text>
  <text x="694" y="300" font-family="var(--font-mono)" font-size="13.5" fill="#065f56">kv_usage &gt; 0.95</text>
  <text x="694" y="321" font-family="var(--font-mono)" font-size="13.5" fill="#065f56">num_preemptions ↑</text>
  <text x="694" y="342" font-size="13.5" fill="#4d5652">块还完显存不降=池复用</text>
  <rect x="692" y="356" width="182" height="58" rx="6" fill="#ddf4ef"/>
  <text x="700" y="378" font-size="13.5" font-weight="700" fill="#065f56">最小首取证据</text>
  <text x="700" y="401" font-size="13.5" fill="#17211f">/metrics + 结束空闲块</text>
  <text x="694" y="438" font-size="13.5" font-weight="700" fill="#17211f">动作：收紧并发/扩 KV</text>
  <text x="694" y="460" font-size="13.5" fill="#4d5652">稳态未释块才追泄漏</text>
</svg>
