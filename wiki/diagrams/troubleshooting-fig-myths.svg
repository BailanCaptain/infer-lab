<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 584" width="900" height="584" role="img" aria-label="四卡推理排障时间轴与五项证据门禁图" font-family="var(--font-sans)">
<title>推理排障四卡时间轴（12 ms 首错 vs 40 ms EI0006）与 v0.30.0 五项证据分诊</title>
<desc>展示 Rank 3 在 12 ms 首发设备算子错误、Rank 0/1/2 在 40 ms 报 EI0006 通信超时的四卡时间轴，并对照 VLLM_EXECUTE_MODEL_TIMEOUT_SECONDS、abort_requests_async、finished_procs exitcode=-9（shell 137）SIGKILL 分诊（核对 cgroup memory.events / dmesg）vs init_snapshot/requested_memory 及 model_config 生效核验。</desc>
<defs>
  <marker id="ts-coral" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
    <path d="M1 1.5L8.5 5L1 8.5Z" fill="#b54237"/>
  </marker>
</defs>

<text x="16" y="29" font-size="16" font-weight="700" fill="#17211f">推理排障四卡时间轴与五项证据分诊（12 ms 首错 vs 40 ms 超时示意 + v0.30.0 源码边界）</text>

<!-- ① 4-Rank Fault Propagation Timeline -->
<rect x="14" y="42" width="872" height="256" rx="10" fill="#fbfaf6" stroke="#087f73" stroke-width="1.3"/>
<text x="28" y="65" font-size="14" font-weight="700" fill="#065f56">① 四卡日志时间轴（示意）：Rank 3 在 12 ms 首发算子错，牵连 Rank 0/1/2 在 40 ms 刷屏 EI0006</text>

<g font-size="12" font-weight="700" text-anchor="middle">
  <text x="98" y="88" fill="#66716d">0 ms</text>
  <text x="240" y="88" fill="#b54237">12 ms (首错)</text>
  <text x="468" y="88" fill="#7a3a6a">40 ms (超时)</text>
</g>
<g stroke-width="1.2" stroke-dasharray="4 3">
  <line x1="98" y1="93" x2="98" y2="252" stroke="#d8d8cf"/>
  <line x1="240" y1="93" x2="240" y2="252" stroke="#b54237"/>
  <line x1="468" y1="93" x2="468" y2="252" stroke="#9a4b86"/>
</g>

<g font-size="12.5" font-weight="700" fill="#17211f">
  <text x="28" y="120">Rank 0</text>
  <text x="28" y="158">Rank 1</text>
  <text x="28" y="196">Rank 2</text>
  <text x="28" y="237" fill="#b54237">Rank 3</text>
</g>

<g fill="#ddf4ef" stroke="#087f73" stroke-width="1.1">
  <rect x="98" y="100" width="138" height="30" rx="4"/>
  <rect x="98" y="138" width="138" height="30" rx="4"/>
  <rect x="98" y="176" width="138" height="30" rx="4"/>
  <rect x="98" y="216" width="138" height="32" rx="4"/>
</g>
<g font-size="12" text-anchor="middle" fill="#065f56">
  <text x="167" y="120">正常算子</text>
  <text x="167" y="158">正常算子</text>
  <text x="167" y="196">正常算子</text>
  <text x="167" y="237">正常算子</text>
</g>

<g fill="#ece9df" stroke="#9aa39f" stroke-width="1.1" stroke-dasharray="4 3">
  <rect x="240" y="100" width="224" height="30" rx="4"/>
  <rect x="240" y="138" width="224" height="30" rx="4"/>
  <rect x="240" y="176" width="224" height="30" rx="4"/>
</g>
<g font-size="12" text-anchor="middle" fill="#4d5652">
  <text x="352" y="120">卡在 All-Reduce 等待</text>
  <text x="352" y="158">卡在 All-Reduce 等待</text>
  <text x="352" y="196">卡在 All-Reduce 等待</text>
</g>

<g fill="#f7e7f2" stroke="#9a4b86" stroke-width="1.2">
  <rect x="468" y="100" width="132" height="30" rx="4"/>
  <rect x="468" y="138" width="132" height="30" rx="4"/>
  <rect x="468" y="176" width="132" height="30" rx="4"/>
</g>
<g font-size="12" font-weight="700" text-anchor="middle" fill="#7a3a6a">
  <text x="534" y="120">40ms 报 EI0006</text>
  <text x="534" y="158">40ms 报 EI0006</text>
  <text x="534" y="196">40ms 报 EI0006</text>
</g>

<rect x="240" y="216" width="360" height="32" rx="5" fill="#fff0e9" stroke="#b54237" stroke-width="1.5"/>
<text x="420" y="237" text-anchor="middle" font-size="12.5" font-weight="700" fill="#b54237">★ 12 ms 首发设备算子错（未进通信）</text>
<line x1="252" y1="216" x2="252" y2="207" stroke="#b54237" stroke-width="1.6" marker-end="url(#ts-coral)"/>
<text x="28" y="276" font-size="12" font-weight="700" fill="#065f56">首取证据：跨卡合并 plog 按时间戳反查 12 ms 首错 Rank 3，勿盯末尾 EI0006！</text>

<rect x="614" y="80" width="258" height="204" rx="7" fill="#ffffff" stroke="#087f73" stroke-width="1.2"/>
<text x="626" y="103" font-size="13" font-weight="700" fill="#065f56">首错 Rank 分流判据</text>
<text x="626" y="126" font-size="12" fill="#b54237">✗ 误盯 Rank 0 或盲加通信超时</text>
<text x="626" y="149" font-size="12" fill="#17211f">✓ 查首错卡 12 ms 算子/越界栈</text>
<text x="626" y="172" font-size="12" fill="#4d5652">· 全卡同刻超时才查链路/交换机</text>
<text x="626" y="195" font-size="12" fill="#4d5652">· 执行侧超时门槛见：</text>
<text x="626" y="216" font-size="12" font-weight="700" fill="#32478c">VLLM_EXECUTE_MODEL_</text>
<text x="626" y="236" font-size="12" font-weight="700" fill="#32478c">TIMEOUT_SECONDS</text>
<text x="626" y="259" font-size="12" fill="#4d5652">及 abort_requests_async 清理</text>

<!-- ② Exitcode -9 (shell 137) vs NPU HBM OOM -->
<rect x="14" y="310" width="428" height="260" rx="10" fill="#fbfaf6" stroke="#b54237" stroke-width="1.3"/>
<text x="28" y="334" font-size="14" font-weight="700" fill="#8f3229">② 进程强退分诊：SIGKILL (-9 / 137) ≠ NPU OOM</text>
<rect x="28" y="346" width="400" height="108" rx="6" fill="#fff0e9" stroke="#b54237" stroke-width="1.2"/>
<text x="40" y="367" font-size="12.5" font-weight="700" fill="#b54237">分支 A：finished_procs 记 exitcode = -9（shell 折 137）</text>
<text x="40" y="389" font-size="12" fill="#17211f">POSIX 子进程收 SIGKILL：外部 kill / 探针驱逐或主机 OOM</text>
<text x="40" y="411" font-size="12" fill="#17211f">须查 cgroup memory.events (oom_kill) / OOMKilled 与 dmesg</text>
<text x="40" y="433" font-size="12" font-weight="700" fill="#8f3229">切勿把 -9 直接等同于 OOM，更勿盲砍 NPU KV 显存比例</text>

<rect x="28" y="464" width="400" height="94" rx="6" fill="#e8edff" stroke="#4c65b6" stroke-width="1.2"/>
<text x="40" y="486" font-size="12.5" font-weight="700" fill="#32478c">分支 B：NPU HBM 设备显存不足</text>
<text x="40" y="509" font-size="12" fill="#17211f">显式抛 Python RuntimeError / ValueError 或启动预算拦截：</text>
<text x="40" y="532" font-size="12" font-weight="700" fill="#065f56">对比 init_snapshot 空闲值与 requested_memory 账单</text>

<!-- ③ Three Evidence Guardrails -->
<rect x="458" y="310" width="428" height="260" rx="10" fill="#fbfaf6" stroke="#c78300" stroke-width="1.3"/>
<text x="472" y="334" font-size="14" font-weight="700" fill="#936300">③ 排障闭环三道证据门禁（拒绝凭表象结案）</text>
<rect x="472" y="348" width="400" height="64" rx="6" fill="#fff4cf" stroke="#c78300" stroke-width="1.2"/>
<text x="484" y="370" font-size="12.5" font-weight="700" fill="#936300">门禁 1：关特性跑通 ≠ 修好（如 --enforce-eager）</text>
<text x="484" y="393" font-size="12" fill="#17211f">仅为二分隔离；须单项加回对照并验收原配置吞吐与输出</text>

<rect x="472" y="420" width="400" height="66" rx="6" fill="#f7e7f2" stroke="#9a4b86" stroke-width="1.2"/>
<text x="484" y="442" font-size="12.5" font-weight="700" fill="#7a3a6a">门禁 2：配置未报错 ≠ 已生效（model_config 校验后）</text>
<text x="484" y="465" font-size="12" fill="#17211f">部分硬件档位自动降级关特性；须核最终生效值与包路径</text>

<rect x="472" y="494" width="400" height="64" rx="6" fill="#ddf4ef" stroke="#087f73" stroke-width="1.2"/>
<text x="484" y="516" font-size="12.5" font-weight="700" fill="#065f56">门禁 3：无日志 ≠ 未执行 ｜ 乱码 ≠ 必为量化坏</text>
<text x="484" y="539" font-size="12" fill="#17211f">先核日志采集覆盖面；乱码先查 token ID、采样与解码链</text>
</svg>
