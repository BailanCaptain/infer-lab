layout: figure
id: ucm-encoder-chunks
caption: 编码结果分块的示意。左边是同一份图像编码得到的 5 行、每行 2 个数；按每块 2 行存成中间 3 块，末块补零。查询必须三块全在才算这一项命中；读取完成后只向模型交付前 5 行。补齐占用仍随底层张量分配保留，不会因为交付了一个较短视图就消失。图只表示逻辑张量，后端的文件对齐另计。
