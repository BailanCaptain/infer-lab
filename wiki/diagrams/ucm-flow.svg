<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 620" width="900" height="620" role="img" aria-label="一条请求经过 UCM 的先后。上半在调度器里：先数本机显存命中了几个位置，再问 UCM 还能多供几个；UCM 答不上来就下一步再问，要求异步加载就先挂起。下半在每张卡的 worker 里：前向开始前发起加载，每层 attention 前等这一层到齐，算完这一层交出去存，整趟前向结束前等保存完成。查找、淘汰、持久化都在右边的外部包里，vllm-ascend 只负责把这些调用转过去。">
  <title>一条请求经过 UCM 的先后。上半在调度器里：先数本机显存命中了几个位置，再问 UCM 还能多供几个；UCM 答不上来就下一步再问，要求异步加载就先挂起。下半在每张卡的 worker 里：前向开始前发起加载，每层 attention 前等这一层到齐，算完这一层交出去存，整趟前向结束前等保存完成。查找、淘汰、持久化都在右边的外部包里，vllm-ascend 只负责把这些调用转过去。</title>
  <defs><marker id="ucm-flow-ah-ink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="var(--color-ink, #17211f)"/></marker><marker id="ucm-flow-ah-control" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="var(--color-control, #66716d)"/></marker><marker id="ucm-flow-ah-kv" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="var(--color-kv, #4c65b6)"/></marker></defs>
  <rect x="20" y="40" width="600" height="270" rx="16" fill="none" stroke="var(--color-line-strong, #b8bcb5)" stroke-width="1.5"/>
  <text x="36" y="28" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="15" font-weight="700" fill="var(--color-ink, #17211f)">排队时 · 调度器</text>
  <rect x="20" y="342" width="600" height="258" rx="16" fill="none" stroke="var(--color-line-strong, #b8bcb5)" stroke-width="1.5"/>
  <text x="36" y="330" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="15" font-weight="700" fill="var(--color-ink, #17211f)">执行时 · 每张卡的 worker</text>
  <rect x="650" y="40" width="230" height="560" rx="16" fill="none" stroke="var(--color-line-strong, #b8bcb5)" stroke-width="1.5"/>
  <text x="666" y="28" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="15" font-weight="700" fill="var(--color-ink, #17211f)">UCM 外部包</text>
  <g data-hardware="memory">
  <rect x="670" y="200" width="190" height="60" rx="3" fill="var(--color-kv-soft, #e8edff)" stroke="var(--color-kv, #4c65b6)" stroke-width="1.5"/>
  <path d="M675 252h180M675 256h180" fill="none" stroke="var(--color-kv, #4c65b6)" stroke-width="1.5"/>
  <text x="765" y="234" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="13" font-weight="700" fill="var(--color-ink, #17211f)" text-anchor="middle">本机内存（快取）</text>
  </g>
  <g data-hardware="memory">
  <rect x="670" y="400" width="190" height="60" rx="3" fill="var(--color-kv-soft, #e8edff)" stroke="var(--color-kv, #4c65b6)" stroke-width="1.5"/>
  <path d="M675 452h180M675 456h180" fill="none" stroke="var(--color-kv, #4c65b6)" stroke-width="1.5"/>
  <text x="765" y="434" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="13" font-weight="700" fill="var(--color-ink, #17211f)" text-anchor="middle">共享存储 / SSD</text>
  </g>
  <path d="M170 128 L170 158" fill="none" stroke="var(--color-ink, #17211f)" stroke-width="1.4" marker-end="url(#ucm-flow-ah-ink)"/>
  <path d="M300 188 L338 188" fill="none" stroke="var(--color-control, #66716d)" stroke-width="1.4" marker-end="url(#ucm-flow-ah-control)"/>
  <path d="M170 216 L170 238" fill="none" stroke="var(--color-ink, #17211f)" stroke-width="1.4" marker-end="url(#ucm-flow-ah-ink)"/>
  <path d="M300 268 L338 268" fill="none" stroke="var(--color-control, #66716d)" stroke-width="1.4" marker-end="url(#ucm-flow-ah-control)"/>
  <path d="M252 296 L252 360" fill="none" stroke="var(--color-ink, #17211f)" stroke-width="1.4" marker-end="url(#ucm-flow-ah-ink)"/>
  <path d="M170 418 L170 444" fill="none" stroke="var(--color-ink, #17211f)" stroke-width="1.4" marker-end="url(#ucm-flow-ah-ink)"/>
  <path d="M300 474 L338 474" fill="none" stroke="var(--color-ink, #17211f)" stroke-width="1.4" marker-end="url(#ucm-flow-ah-ink)"/>
  <path d="M170 502 L170 528" fill="none" stroke="var(--color-ink, #17211f)" stroke-width="1.4" marker-end="url(#ucm-flow-ah-ink)"/>
  <path d="M300 176 L320 176 L320 110 L668 110" fill="none" stroke="var(--color-control, #66716d)" stroke-width="1.4" marker-end="url(#ucm-flow-ah-control)"/>
  <path d="M668 216 L628 216 L628 390 L302 390" fill="none" stroke="var(--color-kv, #4c65b6)" stroke-width="1.4" marker-end="url(#ucm-flow-ah-kv)"/>
  <path d="M602 460 L644 460 L644 244 L668 244" fill="none" stroke="var(--color-kv, #4c65b6)" stroke-width="1.4" marker-end="url(#ucm-flow-ah-kv)"/>
  <path d="M765 262 L765 398" fill="none" stroke="var(--color-kv, #4c65b6)" stroke-width="1.4" marker-start="url(#ucm-flow-ah-kv)" marker-end="url(#ucm-flow-ah-kv)"/>
  <rect x="40" y="72" width="260" height="56" rx="8" fill="var(--color-kv, #4c65b6)" stroke="var(--color-ink, #17211f)" stroke-width="1.5"/>
  <text x="170" y="96" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="14" font-weight="700" fill="var(--color-ink-inverse, #ffffff)" text-anchor="middle">数本地命中</text>
  <text x="170" y="115" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="13" font-weight="400" fill="var(--color-ink-inverse, #ffffff)" text-anchor="middle">prefix caching 查本机显存</text>
  <rect x="40" y="160" width="260" height="56" rx="8" fill="var(--color-control, #66716d)" stroke="var(--color-ink, #17211f)" stroke-width="1.5"/>
  <text x="170" y="184" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="14" font-weight="700" fill="var(--color-ink-inverse, #ffffff)" text-anchor="middle">问 UCM 还能再供几个</text>
  <text x="170" y="203" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="13" font-weight="400" fill="var(--color-ink-inverse, #ffffff)" text-anchor="middle">只问还没开始算的请求</text>
  <rect x="340" y="160" width="260" height="56" rx="8" fill="var(--color-surface-sunken, #ece9df)" stroke="var(--color-control, #66716d)" stroke-opacity="0.4" stroke-width="1.5" stroke-dasharray="5 4"/>
  <text x="470" y="184" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="13" font-weight="400" fill="#4d5652" text-anchor="middle">UCM 答「还没定」</text>
  <text x="470" y="203" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="13" font-weight="400" fill="#4d5652" text-anchor="middle">这一步跳过，下一步再问</text>
  <rect x="40" y="240" width="260" height="56" rx="8" fill="var(--color-kv, #4c65b6)" stroke="var(--color-ink, #17211f)" stroke-width="1.5"/>
  <text x="170" y="264" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="14" font-weight="700" fill="var(--color-ink-inverse, #ffffff)" text-anchor="middle">借块，回告块号</text>
  <text x="170" y="283" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="13" font-weight="400" fill="var(--color-ink-inverse, #ffffff)" text-anchor="middle">已算 = 本地 + UCM 供的</text>
  <rect x="340" y="240" width="260" height="56" rx="8" fill="var(--color-surface-sunken, #ece9df)" stroke="var(--color-control, #66716d)" stroke-opacity="0.4" stroke-width="1.5" stroke-dasharray="5 4"/>
  <text x="470" y="264" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="13" font-weight="400" fill="#4d5652" text-anchor="middle">UCM 要异步加载</text>
  <text x="470" y="283" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="13" font-weight="400" fill="#4d5652" text-anchor="middle">请求先挂起，数据到齐再排</text>
  <rect x="40" y="362" width="260" height="56" rx="8" fill="var(--color-kv, #4c65b6)" stroke="var(--color-ink, #17211f)" stroke-width="1.5"/>
  <text x="170" y="395" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="14" font-weight="700" fill="var(--color-ink-inverse, #ffffff)" text-anchor="middle">前向开始前：发起加载</text>
  <rect x="40" y="446" width="260" height="56" rx="8" fill="var(--color-kv, #4c65b6)" stroke="var(--color-ink, #17211f)" stroke-width="1.5"/>
  <text x="170" y="470" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="14" font-weight="700" fill="var(--color-ink-inverse, #ffffff)" text-anchor="middle">每层 attention 前</text>
  <text x="170" y="489" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="13" font-weight="400" fill="var(--color-ink-inverse, #ffffff)" text-anchor="middle">等这一层到齐</text>
  <rect x="340" y="446" width="260" height="56" rx="8" fill="var(--color-kv, #4c65b6)" stroke="var(--color-ink, #17211f)" stroke-width="1.5"/>
  <text x="470" y="470" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="14" font-weight="700" fill="var(--color-ink-inverse, #ffffff)" text-anchor="middle">这一层算完</text>
  <text x="470" y="489" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="13" font-weight="400" fill="var(--color-ink-inverse, #ffffff)" text-anchor="middle">交出去存，接着算下一层</text>
  <rect x="40" y="530" width="260" height="56" rx="8" fill="var(--color-control, #66716d)" stroke="var(--color-ink, #17211f)" stroke-width="1.5"/>
  <text x="170" y="554" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="14" font-weight="700" fill="var(--color-ink-inverse, #ffffff)" text-anchor="middle">前向结束前：等保存完</text>
  <text x="170" y="573" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="13" font-weight="400" fill="var(--color-ink-inverse, #ffffff)" text-anchor="middle">之后这些块才能被覆盖</text>
  <text x="494" y="102" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="13.5" font-weight="400" fill="#4d5652" text-anchor="middle">问与答</text>
  <text x="484" y="382" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="13.5" font-weight="400" fill="#3a4f93" text-anchor="middle">搬进显存</text>
  <text x="765" y="120" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="13.5" font-weight="400" fill="var(--color-ink, #17211f)" text-anchor="middle">查找、淘汰、持久化</text>
  <text x="777" y="332" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="13.5" font-weight="400" fill="var(--color-ink-muted, #66716d)" font-style="italic">两段搬运</text>
</svg>
