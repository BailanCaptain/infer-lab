layout: figure
id: ucm-flow
caption: 主线调度与模型执行中的 UCM。上半保留 vLLM 接口的未定与异步分支，当前普通 UCM 默认同步调度。下半示意普通逐层加载；普通整块则在前向入口等加载、在收尾提交保存。收尾返回不代表普通路径的全部保存完成，请求结束或抢占时还要保护源块。混合 HLA 路径另有收尾等待，见正文。
size: [900, 746]
frames:
  - { label: 排队时 · 调度器, at: [20, 40], size: [600, 270] }
  - { label: 模型执行 · 每张卡的 worker, at: [20, 342], size: [600, 374] }
  - { label: UCM 外部包, at: [650, 40], size: [230, 676] }
items:
  - { at: [40, 72], size: [260, 56], text: 数本地命中, sub: prefix caching 查本机显存, tone: kv }
  - { at: [40, 160], size: [260, 56], text: 问 UCM 还能再供几个, sub: 只问还没开始算的请求, tone: control }
  - { at: [340, 160], size: [260, 56], text: 接口允许暂不回答, sub: 这一步跳过，下一步再问, tone: control, style: faded }
  - { at: [40, 240], size: [260, 56], text: 借块，生成搬运映射, sub: 已算 = 本地 + 外部可供, tone: kv }
  - { at: [340, 240], size: [260, 56], text: 请求级异步分支, sub: 普通整块需显式开启, tone: control, style: faded }
  - { at: [40, 362], size: [260, 56], text: 前向开始前：发起加载, tone: kv }
  - { at: [40, 446], size: [260, 56], text: 每层 attention 前, sub: 等这一层到齐, tone: kv }
  - { at: [340, 446], size: [260, 56], text: 这一层算完, sub: 交出去存，接着算下一层, tone: kv }
  - { at: [40, 530], size: [260, 56], text: 前向收尾：轮询保存, sub: 普通路径允许任务继续在途, tone: control }
  - { at: [40, 630], size: [260, 56], text: 请求结束或将被抢占, sub: 等相关保存任务结束, tone: control }
  - { at: [340, 630], size: [260, 56], text: 源块结束搬运占用, sub: 成功保存还须检查任务结果, tone: kv }
