layout: figure
id: ucm-intuition
caption: vLLM 只认一个接口 UCMConnector，背后是三层存储。① 请求 A 在实例 1 上算完开头三段，经 connector 交给 UCM，先存到这台机器的内存，再落到多台机器共同挂载的存储。② 请求 B 落在实例 2，开头与 A 相同，开始算之前先经 connector 问有没有这段开头。③ 有，就从共享存储经实例 2 的本机内存搬回显存。④ B 只算自己不同的尾巴。实例数、段数都是示意。
