<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 560" width="900" height="560" role="img" aria-label="两种 PD 部署的交接点不同：左侧通过共享存储交接，右侧通过 Mooncake 直传；UCM 在右侧只画 Prefill 的前缀缓存职责。">
  <title>两种 PD 部署的交接点不同：左侧通过共享存储交接，右侧通过 Mooncake 直传；UCM 在右侧只画 Prefill 的前缀缓存职责。</title>
  <rect width="900" height="560" fill="var(--color-surface, #fbfaf6)"/>
