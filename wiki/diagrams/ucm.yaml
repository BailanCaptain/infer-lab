layout: figure
id: ucm
caption: PD 分离时 UCM 的两种站法。左边集中式：P、D 都挂 UCM，P 在计算过程中把这条请求的状态存进共享存储，D 开始前从同一个后端取回，共享存储就是交接点。右边 P2P：这一次的状态由 Mooncake 从 P 直接传给 D，UCM 只挂在 P 上，让以后开头相同的请求少算一段；D 只挂 Mooncake。
size: [900, 390]
