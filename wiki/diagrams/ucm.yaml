layout: figure
id: ucm
caption: PD 分离时 UCM 的两种站法。左边集中式：P、D 都挂 UCM，共享存储是交接点；P 已写成可见的前缀才能被 D 找到，代理先后发送请求不保证写完，D 还需计算未命中和保留的尾部。右边 P2P：本次状态由 Mooncake 直传，UCM 在 P 上服务前缀复用；D 只挂 Mooncake。
size: [900, 390]
