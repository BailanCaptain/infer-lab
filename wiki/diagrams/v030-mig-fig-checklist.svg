<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 445" width="900" height="445" role="img" aria-label="从 v0.26 与 rc2 升级到 v0.30.0 及 main 的六项核心迁移对照" font-family="var(--font-sans)">
<title>v0.26 / rc2 升级 v0.30.0 正式版与 main 的六项核心变化</title>
<desc>Env vars migration, W8A8_MIX, gpu_memory_utilization, HardwareProfile, FP8_BLOCK, and MRV2</desc>
<g stroke-width="1.4">
<rect x="16" y="60" width="276" height="54" rx="6" fill="#fff0e9" stroke="#b54237"/>
