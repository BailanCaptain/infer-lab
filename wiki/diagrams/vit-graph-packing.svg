<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 610" width="860" height="610" role="img" aria-label="单路径视觉编码的容量示意。已录128、256、512三档，每个子批最多两项；先按输出位置数分组，再选能容纳该组的最小档。输出复制后恢复原输入顺序，排序不改变图片与文字的对应关系。数值不是GLM实测。">
  <title>单路径视觉编码的容量示意。已录128、256、512三档，每个子批最多两项；先按输出位置数分组，再选能容纳该组的最小档。输出复制后恢复原输入顺序，排序不改变图片与文字的对应关系。数值不是GLM实测。</title>
  <defs><marker id="vit-graph-packing-ah-ink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="var(--color-ink, #17211f)"/></marker></defs>
  <path d="M155 115 L155 138 L300 138 L300 160" fill="none" stroke="var(--color-ink, #17211f)" stroke-width="1.4" marker-end="url(#vit-graph-packing-ah-ink)"/>
  <path d="M430 115 L430 160" fill="none" stroke="var(--color-ink, #17211f)" stroke-width="1.4" marker-end="url(#vit-graph-packing-ah-ink)"/>
  <path d="M705 115 L705 138 L560 138 L560 160" fill="none" stroke="var(--color-ink, #17211f)" stroke-width="1.4" marker-end="url(#vit-graph-packing-ah-ink)"/>
  <path d="M300 225 L300 250 L230 250 L230 280" fill="none" stroke="var(--color-ink, #17211f)" stroke-width="1.4" marker-end="url(#vit-graph-packing-ah-ink)"/>
  <path d="M560 225 L560 250 L630 250 L630 280" fill="none" stroke="var(--color-ink, #17211f)" stroke-width="1.4" marker-end="url(#vit-graph-packing-ah-ink)"/>
  <path d="M230 365 L230 392 L300 392 L300 415" fill="none" stroke="var(--color-ink, #17211f)" stroke-width="1.4" marker-end="url(#vit-graph-packing-ah-ink)"/>
  <path d="M630 365 L630 392 L560 392 L560 415" fill="none" stroke="var(--color-ink, #17211f)" stroke-width="1.4" marker-end="url(#vit-graph-packing-ah-ink)"/>
  <rect x="30" y="50" width="250" height="65" rx="8" fill="var(--color-token-soft, #ddf4ef)" stroke="var(--color-token, #087f73)" stroke-width="1.4"/>
  <text x="155" y="78.5" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="14" font-weight="700" fill="var(--color-ink, #17211f)" text-anchor="middle">图片 A</text>
  <text x="155" y="97.5" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="13" font-weight="400" fill="#065f56" text-anchor="middle">输出192个位置</text>
  <rect x="305" y="50" width="250" height="65" rx="8" fill="var(--color-token-soft, #ddf4ef)" stroke="var(--color-token, #087f73)" stroke-width="1.4"/>
  <text x="430" y="78.5" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="14" font-weight="700" fill="var(--color-ink, #17211f)" text-anchor="middle">图片 B</text>
  <text x="430" y="97.5" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="13" font-weight="400" fill="#065f56" text-anchor="middle">输出96个位置</text>
  <rect x="580" y="50" width="250" height="65" rx="8" fill="var(--color-token-soft, #ddf4ef)" stroke="var(--color-token, #087f73)" stroke-width="1.4"/>
  <text x="705" y="78.5" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="14" font-weight="700" fill="var(--color-ink, #17211f)" text-anchor="middle">图片 C</text>
  <text x="705" y="97.5" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="13" font-weight="400" fill="#065f56" text-anchor="middle">输出160个位置</text>
  <rect x="180" y="160" width="500" height="65" rx="8" fill="var(--color-control-soft, #f1efe8)" stroke="var(--color-control, #66716d)" stroke-width="1.4"/>
  <text x="430" y="188.5" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="14" font-weight="700" fill="var(--color-ink, #17211f)" text-anchor="middle">从小到大：B → C → A</text>
  <text x="430" y="207.5" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="13" font-weight="400" fill="var(--color-ink-muted, #66716d)" text-anchor="middle">同时检查总token容量与每批最多两项</text>
  <rect x="60" y="280" width="340" height="85" rx="8" fill="var(--color-weight-soft, #fff4cf)" stroke="var(--color-weight, #c78300)" stroke-width="1.4"/>
  <text x="230" y="318.5" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="14" font-weight="700" fill="var(--color-ink, #17211f)" text-anchor="middle">子批 B + C → 256档</text>
  <text x="230" y="337.5" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="13" font-weight="400" fill="#936300" text-anchor="middle">96 + 160 = 256个有效位置</text>
  <rect x="460" y="280" width="340" height="85" rx="8" fill="var(--color-weight-soft, #fff4cf)" stroke="var(--color-weight, #c78300)" stroke-width="1.4"/>
  <text x="630" y="318.5" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="14" font-weight="700" fill="var(--color-ink, #17211f)" text-anchor="middle">子批 A → 256档</text>
  <text x="630" y="337.5" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="13" font-weight="400" fill="#936300" text-anchor="middle">192个有效位置，余量64</text>
  <rect x="180" y="415" width="500" height="65" rx="8" fill="var(--color-kv-soft, #e8edff)" stroke="var(--color-kv, #4c65b6)" stroke-width="1.4"/>
  <text x="430" y="443.5" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="14" font-weight="700" fill="var(--color-ink, #17211f)" text-anchor="middle">拆出有效结果并复制，再恢复A → B → C</text>
  <text x="430" y="462.5" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="13" font-weight="400" fill="#3a4f93" text-anchor="middle">交到语言模型对应的媒体位置</text>
  <text x="30" y="28" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="16" font-weight="700" fill="var(--color-ink, #17211f)">原输入顺序：A → B → C</text>
  <text x="30" y="562" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="13.5" font-weight="400" fill="var(--color-ink-muted, #66716d)" font-style="italic">单项超过512档 → eager直接执行；帧元数据容量另查</text>
</svg>
