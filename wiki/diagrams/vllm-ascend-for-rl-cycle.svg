<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 460" width="860" height="460" role="img" aria-label="一轮 RL 的数据流：推理端交出回答和生成记录，训练端根据评分改权重；暂停推理、装好新权重后，下一轮才使用新版模型。评分可以来自规则或外部环境。">
  <title>一轮 RL 的数据流：推理端交出回答和生成记录，训练端根据评分改权重；暂停推理、装好新权重后，下一轮才使用新版模型。评分可以来自规则或外部环境。</title>
  <defs><marker id="vllm-ascend-for-rl-cycle-ah-token" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="var(--color-token, #087f73)"/></marker><marker id="vllm-ascend-for-rl-cycle-ah-weight" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="var(--color-weight, #c78300)"/></marker><marker id="vllm-ascend-for-rl-cycle-ah-comm" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="var(--color-comm, #9a4b86)"/></marker><marker id="vllm-ascend-for-rl-cycle-ah-control" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="var(--color-control, #66716d)"/></marker></defs>
  <rect x="20" y="36" width="820" height="160" rx="16" fill="none" stroke="var(--color-line-strong, #b8bcb5)" stroke-width="1.5"/>
  <text x="36" y="24" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="15" font-weight="700" fill="var(--color-ink, #17211f)">生成阶段</text>
  <rect x="20" y="248" width="820" height="176" rx="16" fill="none" stroke="var(--color-line-strong, #b8bcb5)" stroke-width="1.5"/>
  <text x="36" y="236" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="15" font-weight="700" fill="var(--color-ink, #17211f)">更新阶段</text>
  <path d="M240 116 L332 116" fill="none" stroke="var(--color-token, #087f73)" stroke-width="1.4" marker-end="url(#vllm-ascend-for-rl-cycle-ah-token)"/>
  <path d="M526 116 L618 116" fill="none" stroke="var(--color-token, #087f73)" stroke-width="1.4" marker-end="url(#vllm-ascend-for-rl-cycle-ah-token)"/>
  <path d="M715 142 L715 294" fill="none" stroke="var(--color-token, #087f73)" stroke-width="1.4" marker-end="url(#vllm-ascend-for-rl-cycle-ah-token)"/>
  <path d="M618 320 L526 320" fill="none" stroke="var(--color-weight, #c78300)" stroke-width="1.4" marker-end="url(#vllm-ascend-for-rl-cycle-ah-weight)"/>
  <path d="M332 320 L240 320" fill="none" stroke="var(--color-comm, #9a4b86)" stroke-width="2.2" marker-end="url(#vllm-ascend-for-rl-cycle-ah-comm)"/>
  <path d="M143 294 L143 222 L429 222 L429 142" fill="none" stroke="var(--color-control, #66716d)" stroke-width="1.4" marker-end="url(#vllm-ascend-for-rl-cycle-ah-control)"/>
  <rect x="48" y="92" width="190" height="48" fill="var(--color-token, #087f73)"/>
  <text x="143" y="120.7" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="13" font-weight="700" fill="var(--color-ink-inverse, #ffffff)" text-anchor="middle">问题 / token ID</text>
  <rect x="48" y="92" width="190" height="48" fill="none" stroke="var(--color-ink, #17211f)" stroke-width="1.3"/>
  <rect x="334" y="92" width="190" height="48" fill="var(--color-weight, #c78300)"/>
  <text x="429" y="120.7" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="13" font-weight="700" fill="var(--color-ink-inverse, #ffffff)" text-anchor="middle">推理端：当前权重</text>
  <rect x="334" y="92" width="190" height="48" fill="none" stroke="var(--color-ink, #17211f)" stroke-width="1.3"/>
  <rect x="620" y="92" width="190" height="48" fill="var(--color-token, #087f73)"/>
  <text x="715" y="120.7" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="13" font-weight="700" fill="var(--color-ink-inverse, #ffffff)" text-anchor="middle">回答 + 生成记录</text>
  <rect x="620" y="92" width="190" height="48" fill="none" stroke="var(--color-ink, #17211f)" stroke-width="1.3"/>
  <rect x="620" y="296" width="190" height="48" fill="var(--color-token, #087f73)"/>
  <text x="715" y="324.7" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="13" font-weight="700" fill="var(--color-ink-inverse, #ffffff)" text-anchor="middle">评分 → 训练端更新</text>
  <rect x="620" y="296" width="190" height="48" fill="none" stroke="var(--color-ink, #17211f)" stroke-width="1.3"/>
  <rect x="334" y="296" width="190" height="48" fill="var(--color-weight, #c78300)"/>
  <text x="429" y="324.7" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="13" font-weight="700" fill="var(--color-ink-inverse, #ffffff)" text-anchor="middle">训练端：新权重</text>
  <rect x="334" y="296" width="190" height="48" fill="none" stroke="var(--color-ink, #17211f)" stroke-width="1.3"/>
  <rect x="48" y="296" width="190" height="48" fill="var(--color-kv, #4c65b6)"/>
  <text x="143" y="324.7" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="13" font-weight="700" fill="var(--color-ink-inverse, #ffffff)" text-anchor="middle">推理端：接收并装载</text>
  <rect x="48" y="296" width="190" height="48" fill="none" stroke="var(--color-ink, #17211f)" stroke-width="1.3"/>
  <text x="337" y="170" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="13" font-weight="400" fill="var(--color-ink, #17211f)">rollout：用模型生成训练样本</text>
  <text x="160" y="213" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="13" font-weight="400" fill="var(--color-ink, #17211f)">恢复生成，进入下一轮</text>
  <text x="48" y="381" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="13.5" font-weight="700" fill="var(--color-ink, #17211f)">装载期间暂停生成：请求不能读到更新了一半的权重</text>
</svg>
