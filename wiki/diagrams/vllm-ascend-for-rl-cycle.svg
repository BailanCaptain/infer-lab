<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 446" width="900" height="446" role="img" aria-label="vLLM-Ascend 在线强化学习 Rollout 生成与权重同步单轮闭环图" font-family="var(--font-sans)">
  <title>在线 RL 单轮闭环：推理端批量生成样本与训练信号，训练端反传算出新权重，在暂停边界内安全换装</title>
  <desc>Two-band closed loop diagram showing upper Rollout phase (Prompt token IDs -> vLLM-Ascend W_t -> Sample token IDs + logprobs + R3 routed experts) and lower Update phase (Reward/Environment -> Trainer W_{t+1} -> Pause/Sleep boundary -> Weight transfer &amp; load -> Resume W_{t+1}).</desc>
  <defs>
    <marker id="rlc-arr-t" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="#087f73"/>
    </marker>
    <marker id="rlc-arr-a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="#c78300"/>
    </marker>
    <marker id="rlc-arr-p" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="#9a4b86"/>
    </marker>
    <marker id="rlc-arr-r" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="#b54237"/>
    </marker>
  </defs>

  <!-- Upper Band: Rollout Phase -->
  <rect x="16" y="16" width="868" height="172" rx="8" fill="#f5f1e8" stroke="#d5cfc0" stroke-width="1.3"/>
  <text x="32" y="42" font-size="15" font-weight="700" fill="#17211f">① 生成阶段（Rollout）：vLLM-Ascend 用当前权重 W_t 批量产出可计算样本</text>

  <!-- Box 1: Prompt batch -->
  <rect x="32" y="62" width="212" height="92" rx="7" fill="#ddf4ef" stroke="#087f73" stroke-width="1.5"/>
  <text x="138" y="88" text-anchor="middle" font-size="14" font-weight="700" fill="#065f56">题目批 / Prompt 输入</text>
  <text x="138" y="112" text-anchor="middle" font-size="12.5" fill="#17211f">文本或直接传 token_ids</text>
  <text x="138" y="136" text-anchor="middle" font-size="12.5" fill="#4d5652">GRPO 同题采样一组回答</text>

  <path d="M 244 108 L 304 108" fill="none" stroke="#087f73" stroke-width="2" marker-end="url(#rlc-arr-t)"/>

  <!-- Box 2: vLLM-Ascend Inference Engine -->
  <rect x="310" y="56" width="268" height="104" rx="7" fill="#fff4cf" stroke="#c78300" stroke-width="1.6"/>
  <text x="444" y="82" text-anchor="middle" font-size="14" font-weight="700" fill="#936300">vLLM-Ascend 推理引擎</text>
  <rect x="334" y="94" width="220" height="28" rx="4" fill="#f6dca0" stroke="#c78300" stroke-width="1.2"/>
  <text x="444" y="113" text-anchor="middle" font-size="13" font-weight="700" fill="#7a5100">固定使用同一版权重 W_t</text>
  <text x="444" y="144" text-anchor="middle" font-size="12.5" fill="#4d5652">沿用调度 → 前向 → 采样主线</text>

  <path d="M 578 108 L 638 108" fill="none" stroke="#087f73" stroke-width="2" marker-end="url(#rlc-arr-t)"/>

  <!-- Box 3: Rollout Samples + Signals -->
  <rect x="644" y="62" width="224" height="92" rx="7" fill="#ddf4ef" stroke="#087f73" stroke-width="1.5"/>
  <text x="756" y="88" text-anchor="middle" font-size="14" font-weight="700" fill="#065f56">样本 + 训练所需信号</text>
  <text x="756" y="112" text-anchor="middle" font-size="12.5" fill="#17211f">生成 token ID + logprobs</text>
  <text x="756" y="136" text-anchor="middle" font-size="12.5" fill="#4d5652">按需附 R3 专家路由数组</text>

  <!-- Vertical Transition Arrow (Right Side: Rollout -> Reward/Trainer) -->
  <path d="M 756 154 L 756 254" fill="none" stroke="#087f73" stroke-width="2.2" marker-end="url(#rlc-arr-t)"/>
  <rect x="676" y="196" width="160" height="24" rx="4" fill="#fbfaf6" stroke="#087f73" stroke-width="1.1"/>
  <text x="756" y="213" text-anchor="middle" font-size="12.5" font-weight="700" fill="#065f56">交回训练框架打分</text>

  <!-- Lower Band: Update & Handover Phase -->
  <rect x="16" y="232" width="868" height="198" rx="8" fill="#f5f1e8" stroke="#d5cfc0" stroke-width="1.3"/>
  <text x="32" y="256" font-size="15" font-weight="700" fill="#17211f">② 更新与交接阶段：暂停生成，同步装载新权重 W_{t+1} 后再放行下一轮</text>

  <!-- Box 4 (Right): Reward & Gradient Step -->
  <rect x="644" y="264" width="224" height="92" rx="7" fill="#e8edff" stroke="#4c65b6" stroke-width="1.5"/>
  <text x="756" y="290" text-anchor="middle" font-size="14" font-weight="700" fill="#3a4f93">奖励评分与优势估计</text>
  <text x="756" y="314" text-anchor="middle" font-size="12.5" fill="#17211f">规则判题 / 环境工具反馈</text>
  <text x="756" y="338" text-anchor="middle" font-size="12.5" fill="#4d5652">PPO / GRPO 反传计算梯度</text>

  <path d="M 644 310 L 584 310" fill="none" stroke="#c78300" stroke-width="2" marker-end="url(#rlc-arr-a)"/>

  <!-- Box 5 (Middle): Trainer New Weights -->
  <rect x="310" y="264" width="268" height="92" rx="7" fill="#fff4cf" stroke="#c78300" stroke-width="1.6"/>
  <text x="444" y="290" text-anchor="middle" font-size="14" font-weight="700" fill="#936300">训练端产出新权重 W_{t+1}</text>
  <text x="444" y="314" text-anchor="middle" font-size="12.5" fill="#17211f">同卡走 npu_ipc 共享句柄</text>
  <text x="444" y="338" text-anchor="middle" font-size="12.5" fill="#4d5652">跨卡走 hccl / sparse_hccl</text>

  <path d="M 310 310 L 250 310" fill="none" stroke="#9a4b86" stroke-width="2" marker-end="url(#rlc-arr-p)"/>

  <!-- Box 6 (Left): Safe Handover Gate -->
  <rect x="32" y="264" width="212" height="92" rx="7" fill="#f7e7f2" stroke="#9a4b86" stroke-width="1.6"/>
  <text x="138" y="290" text-anchor="middle" font-size="14" font-weight="700" fill="#7a3a6a">推理端暂停并换装</text>
  <text x="138" y="314" text-anchor="middle" font-size="12.5" fill="#17211f">pause(wait/abort) 或 sleep</text>
  <text x="138" y="338" text-anchor="middle" font-size="12.5" fill="#4d5652">start → update → finish</text>

  <!-- Upward Return Arrow from Handover Gate to Inference Engine -->
  <path d="M 138 264 L 138 208 L 444 208 L 444 166" fill="none" stroke="#b54237" stroke-width="2" marker-end="url(#rlc-arr-r)"/>
  <rect x="206" y="196" width="196" height="24" rx="4" fill="#fff0e9" stroke="#b54237" stroke-width="1.1"/>
  <text x="304" y="213" text-anchor="middle" font-size="12.5" font-weight="700" fill="#8f3229">全部装载完才 resume 下一轮</text>

  <!-- Bottom Safety Strip -->
  <rect x="32" y="372" width="836" height="42" rx="6" fill="#fff0e9" stroke="#b54237" stroke-width="1.3"/>
  <text x="450" y="398" text-anchor="middle" font-size="13" font-weight="700" fill="#8f3229">版本隔离红线：换权重期间必须挡住生成流量，禁止让同一条请求前半段读 W_t、后半段读 W_{t+1} 或半成品层</text>
</svg>
