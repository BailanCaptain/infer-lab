  <text x="648" y="512.7" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="13" font-weight="700" fill="var(--color-ink-inverse, #ffffff)" text-anchor="middle">未打包 IPC：重建句柄、装载权重</text>
  <rect x="480" y="478" width="336" height="60" fill="none" stroke="var(--color-ink, #17211f)" stroke-width="1.3"/>
  <rect x="210" y="590" width="460" height="48" fill="var(--color-control, #66716d)"/>
  <text x="440" y="618.7" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="13" font-weight="700" fill="var(--color-ink-inverse, #ffffff)" text-anchor="middle">finish_weight_update：后处理完成，退出更新态</text>
  <rect x="210" y="590" width="460" height="48" fill="none" stroke="var(--color-ink, #17211f)" stroke-width="1.3"/>
  <rect x="64" y="742" width="752" height="40" fill="var(--color-token, #087f73)"/>
  <text x="440" y="766.7" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="13" font-weight="700" fill="var(--color-ink-inverse, #ffffff)" text-anchor="middle">/resume → 第 2 站调度 → 第 4 站新权重前向 → 第 5、7 站生成并返回</text>
  <rect x="64" y="742" width="752" height="40" fill="none" stroke="var(--color-ink, #17211f)" stroke-width="1.3"/>
  <text x="40" y="676" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="13" font-weight="400" fill="var(--color-ink, #17211f)">同卡 level 2 sleep：更新前唤醒 weights，更新后唤醒 kv_cache，再恢复生成</text>
</svg>
