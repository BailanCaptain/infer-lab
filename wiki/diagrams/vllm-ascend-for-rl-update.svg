  <rect x="632" y="217" width="184" height="48" fill="none" stroke="var(--color-ink, #17211f)" stroke-width="1.3"/>
  <rect x="210" y="362" width="460" height="48" fill="var(--color-weight, #c78300)"/>
  <text x="440" y="390.7" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="13" font-weight="700" fill="var(--color-ink-inverse, #ffffff)" text-anchor="middle">update_weights：调用后端，按需分多组更新</text>
  <rect x="210" y="362" width="460" height="48" fill="none" stroke="var(--color-ink, #17211f)" stroke-width="1.3"/>
  <rect x="64" y="478" width="330" height="60" fill="var(--color-comm, #9a4b86)"/>
  <text x="229" y="512.7" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="13" font-weight="700" fill="var(--color-ink-inverse, #ffffff)" text-anchor="middle">HCCL：广播权重、逐层装载</text>
