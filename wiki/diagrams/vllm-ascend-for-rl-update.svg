<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 830" width="880" height="830" role="img" aria-label="main 的权重更新控制流；IPC 分支限未打包路径。主线第 2 站的调度先暂停，第 4 站的模型才可换权重；第 5、7 站产生并返回下一轮训练数据。使用 IPC trainer 时由发送方法包办 start/update/finish，外层不再重复；出错不能直接恢复生成。">
  <title>main 的权重更新控制流；IPC 分支限未打包路径。主线第 2 站的调度先暂停，第 4 站的模型才可换权重；第 5、7 站产生并返回下一轮训练数据。使用 IPC trainer 时由发送方法包办 start/update/finish，外层不再重复；出错不能直接恢复生成。</title>
  <defs><marker id="vllm-ascend-for-rl-update-ah-control" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="var(--color-control, #66716d)"/></marker><marker id="vllm-ascend-for-rl-update-ah-comm" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="var(--color-comm, #9a4b86)"/></marker></defs>
