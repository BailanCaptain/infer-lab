  <text x="319" y="94.7" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="13" font-weight="700" fill="var(--color-ink-inverse, #ffffff)" text-anchor="middle">init_weight_transfer_engine：先完成传输握手</text>
  <rect x="64" y="70" width="510" height="40" fill="none" stroke="var(--color-ink, #17211f)" stroke-width="1.3"/>
  <rect x="64" y="146" width="510" height="40" fill="var(--color-control, #66716d)"/>
