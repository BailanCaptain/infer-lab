layout: figure
id: vllm-ascend-for-rl-update
caption: main 的权重更新控制流。主线第 2 站的调度先暂停，第 4 站的模型才可换权重；第 5、7 站产生并返回下一轮训练数据。错误分支停止更新，不能直接恢复生成。
