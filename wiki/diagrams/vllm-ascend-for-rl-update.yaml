  - { label: 数据面：Worker 与权重传输后端, at: [20, 316], size: [840, 346] }
  - { label: 回到推理主线, at: [20, 704], size: [840, 100] }
grids:
  - { at: [64, 70], rows: 1, cols: 1, cell: [510, 40], tone: control, style: solid, cells: [{ at: [0, 0], text: init_weight_transfer_engine：先完成传输握手 }] }
  - { at: [64, 146], rows: 1, cols: 1, cell: [510, 40], tone: control, style: solid, cells: [{ at: [0, 0], text: /pause?mode=wait：等第 2 站排空在途请求 }] }
  - { at: [64, 222], rows: 1, cols: 1, cell: [510, 40], tone: control, style: solid, cells: [{ at: [0, 0], text: start_weight_update：检查已配置、未更新、NZ 关闭 }] }
  - { at: [632, 217], rows: 1, cols: 1, cell: [184, 48], tone: control, style: faded, cells: [{ at: [0, 0], text: 检查失败 → 报错 }] }
  - { at: [210, 362], rows: 1, cols: 1, cell: [460, 48], tone: weight, style: solid, cells: [{ at: [0, 0], text: update_weights：调用后端，按需分多组更新 }] }
  - { at: [64, 478], rows: 1, cols: 1, cell: [330, 60], tone: comm, style: solid, cells: [{ at: [0, 0], text: HCCL：广播权重、逐层装载 }] }
  - { at: [480, 478], rows: 1, cols: 1, cell: [336, 60], tone: comm, style: solid, cells: [{ at: [0, 0], text: NPU IPC：重建句柄、装载权重 }] }
  - { at: [210, 590], rows: 1, cols: 1, cell: [460, 48], tone: control, style: solid, cells: [{ at: [0, 0], text: finish_weight_update：后处理完成，退出更新态 }] }
