<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 454" width="900" height="454" role="img" aria-label="vLLM 与 vllm-ascend 两仓五大扩展点与 HardwareProfile 演进图" font-family="var(--font-sans)">
  <title>vLLM 与 vllm-ascend 两仓解耦架构与五大扩展点全景</title>
  <desc>Two-repo decoupled plugin architecture: upstream vLLM + 5 vllm-ascend extension points + HardwareProfile A2/A3/310P/A5 and v0.30.0 to main evolution</desc>

  <text x="16" y="28" font-size="16" font-weight="700" fill="#17211f">两仓解耦全景：vLLM 上游框架 + vllm-ascend 五大扩展点</text>
  <text x="16" y="48" font-size="13.5" fill="#66716d">独立发包而非 fork：装包写 entry_points 清单，启动按接口接入，无接口处用 patch 补齐</text>

  <!-- Top Band: Upstream vLLM -->
  <rect x="16" y="64" width="868" height="72" rx="8" fill="#ece9df" stroke="#b8bcb5" stroke-width="1.4"/>
  <text x="32" y="90" font-size="15" font-weight="700" fill="#17211f">上游 vLLM 仓库（框架主干：API Server · Scheduler · KV 块号分配 · Executor 骨架）</text>
  <text x="32" y="116" font-size="13.5" fill="#4d5652">留出标准插槽：entry_points 发现 · Platform 契约 · ModelRegistry · CustomOp · additional_config 不透明容器</text>

  <!-- Connector arrows -->
  <path d="M98 136v24m-4-5l4 5 4-5M274 136v24m-4-5l4 5 4-5M450 136v24m-4-5l4 5 4-5M626 136v24m-4-5l4 5 4-5M802 136v24m-4-5l4 5 4-5" fill="none" stroke="#66716d" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- 5 Extension Point Cards -->
  <rect x="16" y="162" width="164" height="140" rx="8" fill="#ddf4ef" stroke="#087f73" stroke-width="1.4"/>
  <text x="28" y="186" font-size="14.5" font-weight="700" fill="#065f56">① Platform</text>
  <text x="28" y="210" font-size="13.5" fill="#4d5652">NPUPlatform</text>
  <text x="28" y="232" font-size="13.5" fill="#4d5652">校验改写配置</text>
  <text x="28" y="254" font-size="13.5" fill="#4d5652">选 Worker 类</text>
  <text x="28" y="276" font-size="13.5" fill="#4d5652">选后端与通信器</text>

  <rect x="192" y="162" width="164" height="140" rx="8" fill="#fff0e9" stroke="#b54237" stroke-width="1.4"/>
  <text x="204" y="186" font-size="14.5" font-weight="700" fill="#8f3229">② Patch 补丁</text>
  <text x="204" y="210" font-size="13.5" fill="#4d5652">无接口处改绑定</text>
  <text x="204" y="232" font-size="13.5" fill="#4d5652">platform 全局</text>
  <text x="204" y="254" font-size="13.5" fill="#4d5652">worker 执行侧</text>
  <text x="204" y="276" font-size="13.5" fill="#8f3229" font-weight="600">可改调度与 KV</text>

  <rect x="368" y="162" width="164" height="140" rx="8" fill="#fff4cf" stroke="#c78300" stroke-width="1.4"/>
  <text x="380" y="186" font-size="14.5" font-weight="700" fill="#936300">③ 模型注册</text>
  <text x="380" y="210" font-size="13.5" fill="#4d5652">ascend_model</text>
  <text x="380" y="232" font-size="13.5" fill="#4d5652">架构名 → 类</text>
  <text x="380" y="254" font-size="13.5" fill="#4d5652">如 glm5next/</text>
  <text x="380" y="276" font-size="13.5" fill="#4d5652">只建映射不装权</text>

  <rect x="544" y="162" width="164" height="140" rx="8" fill="#e8edff" stroke="#4c65b6" stroke-width="1.4"/>
  <text x="556" y="186" font-size="14.5" font-weight="700" fill="#3a4f93">④ 算子与后端</text>
  <text x="556" y="210" font-size="13.5" fill="#4d5652">CustomOp 登记</text>
  <text x="556" y="232" font-size="13.5" fill="#4d5652">MLA / KDA 后端</text>
  <text x="556" y="254" font-size="13.5" fill="#4d5652">MoE / 量化 / 图</text>
  <text x="556" y="276" font-size="13.5" fill="#4d5652">HCCL / MC2 通信</text>

  <rect x="720" y="162" width="164" height="140" rx="8" fill="#f7e7f2" stroke="#9a4b86" stroke-width="1.4"/>
  <text x="732" y="186" font-size="14.5" font-weight="700" fill="#7a3a6a">⑤ 配置体系</text>
  <text x="732" y="210" font-size="13.5" fill="#4d5652">AscendConfig</text>
  <text x="732" y="232" font-size="13.5" fill="#4d5652">三路输入汇流</text>
  <text x="732" y="254" font-size="13.5" fill="#4d5652">每进程一份缓存</text>
  <text x="732" y="276" font-size="13.5" fill="#4d5652">v0.30 严格校验</text>

  <!-- Bottom two cards -->
  <rect x="16" y="320" width="424" height="120" rx="8" fill="#ddf4ef" stroke="#087f73" stroke-width="1.3"/>
  <text x="32" y="346" font-size="14.5" font-weight="700" fill="#065f56">v0.30.0 硬件抽象：HardwareProfile 四家族</text>
  <text x="32" y="372" font-size="13.5" fill="#4d5652">• A2 / A3 / A5：默认 NPUWorker，按能力表门控</text>
  <text x="32" y="398" font-size="13.5" fill="#4d5652">• _310P：独立 NPUWorker310 与兼容算子分支</text>
  <text x="32" y="424" font-size="13.5" fill="#4d5652">• 收敛散落芯片判断，统一查 HardwareCapability</text>

  <rect x="460" y="320" width="424" height="120" rx="8" fill="#fff4cf" stroke="#c78300" stroke-width="1.3"/>
  <text x="476" y="346" font-size="14.5" font-weight="700" fill="#936300">v0.30.0 主基线 → main（8d6180e2）演进</text>
  <text x="476" y="372" font-size="13.5" fill="#4d5652">• 入口点：两版均 3 组 6 入口（增指标采集组）</text>
  <text x="476" y="398" font-size="13.5" fill="#4d5652">• v0.30.0：65 补丁（32/19/14），MRV1 默认</text>
  <text x="476" y="424" font-size="13.5" fill="#4d5652">• main：59 补丁（29/30），退役 MRV1 全走 V2</text>
</svg>
