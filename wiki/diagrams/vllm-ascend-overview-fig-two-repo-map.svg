<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 520" width="900" height="520" role="img" aria-label="vLLM 与 vllm-ascend 两仓解耦插槽、状态归属边界与 HardwareProfile 路由图" font-family="var(--font-sans)">
  <title>vLLM 与 vllm-ascend 两仓插槽咬合、状态归属与 HardwareProfile 四家族路由</title>
  <desc>Top shows 5 upstream vLLM slots snapping into 5 vllm-ascend extension points; middle shows state ownership split; bottom shows HardwareProfile A2/A3/310P/A5 routing and v0.30.0 to main convergence.</desc>
  <defs>
    <marker id="ov-arr-g" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto"><path d="M0 1.5L8.5 5L0 8.5z" fill="#66716d"/></marker>
    <marker id="ov-arr-r" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto"><path d="M0 1.5L8.5 5L0 8.5z" fill="#b54237"/></marker>
  </defs>

  <text x="16" y="26" font-size="16" font-weight="700" fill="#17211f">两仓解耦插槽全景：上游 vLLM 留出 4 个正式口 + 1 处无口补丁位</text>
  <text x="16" y="48" font-size="13.5" fill="#66716d">独立安装发包而非 fork；装包写 entry_points（v0.30.0 / main 均 3 组 6 入口），按需接入</text>

  <!-- Upstream vLLM Top Bar with 5 explicit slot tabs -->
  <rect x="16" y="62" width="868" height="72" rx="8" fill="#ece9df" stroke="#66716d" stroke-width="1.4"/>
  <text x="32" y="88" font-size="15" font-weight="700" fill="#17211f">上游 vLLM 仓库（API Server · Scheduler · BlockPool · Executor 骨架）</text>
  <!-- 5 Slot Pills along bottom edge of Upstream -->
  <rect x="24" y="100" width="152" height="26" rx="5" fill="#ffffff" stroke="#087f73" stroke-width="1.2"/>
  <text x="100" y="118" text-anchor="middle" font-size="13.5" font-weight="700" fill="#065f56">Platform 契约</text>

  <rect x="196" y="100" width="152" height="26" rx="5" fill="#fff0e9" stroke="#b54237" stroke-width="1.2" stroke-dasharray="4 2"/>
  <text x="272" y="118" text-anchor="middle" font-size="13.5" font-weight="700" fill="#8f3229">无正式口（内部）</text>

  <rect x="368" y="100" width="152" height="26" rx="5" fill="#ffffff" stroke="#c78300" stroke-width="1.2"/>
  <text x="444" y="118" text-anchor="middle" font-size="13.5" font-weight="700" fill="#936300">ModelRegistry</text>

  <rect x="540" y="100" width="152" height="26" rx="5" fill="#ffffff" stroke="#4c65b6" stroke-width="1.2"/>
  <text x="616" y="118" text-anchor="middle" font-size="13.5" font-weight="700" fill="#3a4f93">CustomOp / 后端</text>

  <rect x="712" y="100" width="164" height="26" rx="5" fill="#ffffff" stroke="#9a4b86" stroke-width="1.2"/>
  <text x="794" y="118" text-anchor="middle" font-size="13.5" font-weight="700" fill="#7a3a6a">additional_config</text>

  <!-- 5 Vertical Plug-in Connectors -->
  <line x1="100" y1="126" x2="100" y2="158" stroke="#66716d" stroke-width="1.8" marker-end="url(#ov-arr-g)"/>
  <line x1="272" y1="126" x2="272" y2="158" stroke="#b54237" stroke-width="1.8" stroke-dasharray="4 3" marker-end="url(#ov-arr-r)"/>
  <line x1="444" y1="126" x2="444" y2="158" stroke="#66716d" stroke-width="1.8" marker-end="url(#ov-arr-g)"/>
  <line x1="616" y1="126" x2="616" y2="158" stroke="#66716d" stroke-width="1.8" marker-end="url(#ov-arr-g)"/>
  <line x1="794" y1="126" x2="794" y2="158" stroke="#66716d" stroke-width="1.8" marker-end="url(#ov-arr-g)"/>

  <!-- 5 Ascend Extension Cards -->
  <rect x="16" y="164" width="164" height="122" rx="8" fill="#ddf4ef" stroke="#087f73" stroke-width="1.4"/>
  <text x="28" y="189" font-size="14.5" font-weight="700" fill="#065f56">① NPUPlatform</text>
  <text x="28" y="215" font-size="13.5" fill="#4d5652">查卡型与改配置</text>
  <text x="28" y="239" font-size="13.5" fill="#4d5652">选 Worker 与后端</text>
  <text x="28" y="267" font-size="13.5" font-weight="700" fill="#065f56">默认 block=128</text>

  <rect x="192" y="164" width="164" height="122" rx="8" fill="#fff0e9" stroke="#b54237" stroke-width="1.4"/>
  <text x="204" y="189" font-size="14.5" font-weight="700" fill="#8f3229">② Patch 补丁</text>
  <text x="204" y="215" font-size="13.5" fill="#4d5652">platform / worker</text>
  <text x="204" y="239" font-size="13.5" fill="#4d5652">逐进程内存改绑定</text>
  <text x="204" y="267" font-size="13.5" font-weight="700" fill="#8f3229">可插手调度与 KV</text>

  <rect x="368" y="164" width="164" height="122" rx="8" fill="#fff4cf" stroke="#c78300" stroke-width="1.4"/>
  <text x="380" y="189" font-size="14.5" font-weight="700" fill="#936300">③ 模型注册</text>
  <text x="380" y="215" font-size="13.5" fill="#4d5652">Qwen3 复用上游</text>
  <text x="380" y="239" font-size="13.5" fill="#4d5652">29 项昇腾定制类</text>
  <text x="380" y="267" font-size="13.5" font-weight="700" fill="#936300">仅建映射不装权</text>

  <rect x="544" y="164" width="164" height="122" rx="8" fill="#e8edff" stroke="#4c65b6" stroke-width="1.4"/>
  <text x="556" y="189" font-size="14.5" font-weight="700" fill="#3a4f93">④ 算子与通信</text>
  <text x="556" y="215" font-size="13.5" fill="#4d5652">GQA / MLA / KDA</text>
  <text x="556" y="239" font-size="13.5" fill="#4d5652">MoE · W8A8 · 图</text>
  <text x="556" y="267" font-size="13.5" font-weight="700" fill="#3a4f93">HCCL / MC2 通信</text>

  <rect x="720" y="164" width="164" height="122" rx="8" fill="#f7e7f2" stroke="#9a4b86" stroke-width="1.4"/>
  <text x="732" y="189" font-size="14.5" font-weight="700" fill="#7a3a6a">⑤ AscendConfig</text>
  <text x="732" y="215" font-size="13.5" fill="#4d5652">CLI / JSON / env</text>
  <text x="732" y="239" font-size="13.5" fill="#4d5652">每进程独立单例</text>
  <text x="732" y="267" font-size="13.5" font-weight="700" fill="#7a3a6a">v0.30 Pydantic 严检</text>

  <!-- Middle State-Ownership Split Bar -->
  <rect x="16" y="302" width="424" height="58" rx="7" fill="#ece9df" stroke="#b8bcb5" stroke-width="1.3"/>
  <text x="30" y="326" font-size="14" font-weight="700" fill="#17211f">状态归上游（排不上队查这里）</text>
  <text x="30" y="349" font-size="13.5" fill="#4d5652">等待/运行队列 · token 预算 · KV 整数块号</text>

  <rect x="460" y="302" width="424" height="58" rx="7" fill="#e8edff" stroke="#4c65b6" stroke-width="1.3"/>
  <text x="474" y="326" font-size="14" font-weight="700" fill="#3a4f93">状态归执行侧（读错历史查这里）</text>
  <text x="474" y="349" font-size="13.5" fill="#4d5652">HBM 权重/KV 张量 · block table · 注意力元数据</text>

  <!-- Divider -->
  <line x1="16" y1="376" x2="884" y2="376" stroke="#b8bcb5" stroke-width="1.4" stroke-dasharray="6 4"/>

  <!-- Bottom Left: HardwareProfile 4-Family Router -->
  <text x="16" y="402" font-size="15" font-weight="700" fill="#065f56">v0.30.0 HardwareProfile 四家族能力路由</text>
  <rect x="16" y="416" width="98" height="86" rx="6" fill="#ddf4ef" stroke="#087f73" stroke-width="1.3"/>
  <text x="65" y="446" text-anchor="middle" font-size="14.5" font-weight="700" fill="#065f56">A2</text>
  <text x="65" y="472" text-anchor="middle" font-size="13.5" fill="#4d5652">NPUWorker</text>
  <text x="65" y="492" text-anchor="middle" font-size="13.5" fill="#4d5652">ATB 扩展</text>

  <rect x="122" y="416" width="98" height="86" rx="6" fill="#ddf4ef" stroke="#087f73" stroke-width="1.3"/>
  <text x="171" y="446" text-anchor="middle" font-size="14.5" font-weight="700" fill="#065f56">A3</text>
  <text x="171" y="472" text-anchor="middle" font-size="13.5" fill="#4d5652">NPUWorker</text>
  <text x="171" y="492" text-anchor="middle" font-size="13.5" fill="#4d5652">双裸片拓扑</text>

  <rect x="228" y="416" width="104" height="86" rx="6" fill="#fff0e9" stroke="#b54237" stroke-width="1.3"/>
  <text x="280" y="446" text-anchor="middle" font-size="14.5" font-weight="700" fill="#8f3229">_310P</text>
  <text x="280" y="472" text-anchor="middle" font-size="13.5" fill="#8f3229">Worker310</text>
  <text x="280" y="492" text-anchor="middle" font-size="13.5" fill="#4d5652">FORCE_NZ</text>

  <rect x="340" y="416" width="98" height="86" rx="6" fill="#e8edff" stroke="#4c65b6" stroke-width="1.3"/>
  <text x="389" y="446" text-anchor="middle" font-size="14.5" font-weight="700" fill="#3a4f93">A5 (950)</text>
  <text x="389" y="472" text-anchor="middle" font-size="13.5" fill="#4d5652">NPUWorker</text>
  <text x="389" y="492" text-anchor="middle" font-size="13.5" fill="#4d5652">免 ATB 预热</text>

  <!-- Bottom Right: v0.30.0 -> main Patch & Runner Bar -->
  <text x="460" y="402" font-size="15" font-weight="700" fill="#936300">演进收敛：补丁分布与 MRV1 → MRV2</text>

  <text x="460" y="442" font-size="13.5" font-weight="700" fill="#065f56">v0.30.0</text>
  <rect x="536" y="424" width="154" height="26" rx="4" fill="#ddf4ef" stroke="#087f73" stroke-width="1.2"/>
  <text x="613" y="442" text-anchor="middle" font-size="13.5" fill="#065f56">platform 32</text>
  <rect x="692" y="424" width="96" height="26" rx="4" fill="#fff4cf" stroke="#c78300" stroke-width="1.2"/>
  <text x="740" y="442" text-anchor="middle" font-size="13.5" fill="#936300">w 19</text>
  <rect x="790" y="424" width="94" height="26" rx="4" fill="#f7e7f2" stroke="#9a4b86" stroke-width="1.2"/>
  <text x="837" y="442" text-anchor="middle" font-size="13.5" fill="#7a3a6a">v2 14</text>

  <text x="460" y="486" font-size="13.5" font-weight="700" fill="#7a3a6a">main</text>
  <rect x="536" y="468" width="140" height="26" rx="4" fill="#ddf4ef" stroke="#087f73" stroke-width="1.2"/>
  <text x="606" y="486" text-anchor="middle" font-size="13.5" fill="#065f56">platform 29</text>
  <rect x="678" y="468" width="154" height="26" rx="4" fill="#e8edff" stroke="#4c65b6" stroke-width="1.3"/>
  <text x="755" y="486" text-anchor="middle" font-size="13.5" font-weight="700" fill="#3a4f93">worker 30 (全 MRV2)</text>
  <text x="840" y="486" font-size="13.5" fill="#66716d">59</text>
</svg>
