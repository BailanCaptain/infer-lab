<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 476" width="900" height="476" role="img" aria-label="vllm_ascend v0.30.0 到 main 子系统目录架构图" font-family="var(--font-sans)">
  <title>vllm_ascend 子系统目录地图：v0.30.0（36 项）到 main（39 项）职责分层</title>
  <desc>关联源码符号：HardwareProfile, get_current_hardware_profile, ScoreEncoderCacheConfig, NPUModelRunner, Glm5NextForCausalLM</desc>

  <text x="16" y="28" font-size="16" font-weight="700" fill="#17211f">vllm_ascend/ 子系统目录架构（v0.30.0 顶层 36 项 → main 39 项）</text>
  <text x="884" y="28" text-anchor="end" font-size="13.5" fill="#66716d">按职责找入口，不按字母表盲读</text>

  <!-- Row 1: Boot & Execution Core -->
  <rect x="16" y="44" width="424" height="122" rx="7" fill="#fff4cf" stroke="#c78300" stroke-width="1.4"/>
  <text x="30" y="70" font-size="14.5" font-weight="700" fill="#936300">① 启动注册、配置与硬件能力档案</text>
  <text x="30" y="94" font-size="13.5" fill="#4d5652">• __init__.py / platform.py：插件发现与 NPUPlatform</text>
  <text x="30" y="116" font-size="13.5" fill="#4d5652">• ascend_config.py / envs.py：Pydantic 校验与单例</text>
  <text x="30" y="138" font-size="13.5" fill="#936300" font-weight="600">• device/hardware_profile.py：统一 A2/A3/A5/310P</text>
  <text x="30" y="158" font-size="13.5" fill="#4d5652">• _310p/、device_allocator/、patch/（按条件导入）</text>

  <rect x="460" y="44" width="424" height="122" rx="7" fill="#ddf4ef" stroke="#087f73" stroke-width="1.4"/>
  <text x="474" y="70" font-size="14.5" font-weight="700" fill="#065f56">② Worker、Runner 与调度/缓存中枢</text>
  <text x="474" y="94" font-size="13.5" fill="#4d5652">• worker/worker.py：接 Executor 任务与 PP 中间张量</text>
  <text x="474" y="116" font-size="13.5" fill="#4d5652">• v0.30.0：model_runner_v1.py 与 worker/v2/ 并存</text>
  <text x="474" y="138" font-size="13.5" fill="#065f56" font-weight="600">• main：删除 MRV1，由 mrv2_utils.py 收敛至 v2/</text>
  <text x="474" y="158" font-size="13.5" fill="#4d5652">• core/：调度变体与 KV 规格（非整个 EngineCore）</text>

  <!-- Row 2: Model / Ops / Serving -->
  <rect x="16" y="184" width="424" height="124" rx="7" fill="#e8edff" stroke="#4c65b6" stroke-width="1.4"/>
  <text x="30" y="210" font-size="14.5" font-weight="700" fill="#3a4f93">③ 模型、量化、注意力后端与算子实现</text>
  <text x="30" y="234" font-size="13.5" fill="#4d5652">• models/glm5next/：目录化拆分（旧镜像为单文件）</text>
  <text x="30" y="256" font-size="13.5" fill="#4d5652">• quantization/methods/w8a8/ 与 model_loader/</text>
  <text x="30" y="278" font-size="13.5" fill="#4d5652">• attention/ 与 ops/fused_moe/router/：算子分派</text>
  <text x="30" y="300" font-size="13.5" fill="#3a4f93">• spec_decode/（草拟）与 sample/（采样/拒绝验证）</text>

  <rect x="460" y="184" width="424" height="124" rx="7" fill="#f7e7f2" stroke="#9a4b86" stroke-width="1.4"/>
  <text x="474" y="210" font-size="14.5" font-weight="700" fill="#7a3a6a">④ 通信、图编译、多模态缓存与可观测性</text>
  <text x="474" y="234" font-size="13.5" fill="#4d5652">• distributed/：通信组、并行层、KV 与权重连接器</text>
  <text x="474" y="256" font-size="13.5" fill="#4d5652">• compilation/ 与 xlite/：ACL Graph 捕获与复用</text>
  <text x="474" y="278" font-size="13.5" fill="#7a3a6a" font-weight="600">• v0.30.0：ec_manager/、observability/ 等</text>
  <text x="474" y="300" font-size="13.5" fill="#4d5652">• main 新增：runtime_guard/、hisparse/、kv_trace/</text>

  <line x1="16" y1="326" x2="884" y2="326" stroke="#b8bcb5" stroke-width="1.4" stroke-dasharray="6 5"/>

  <!-- Row 3: csrc & Upstream split -->
  <text x="16" y="354" font-size="16" font-weight="700" fill="#17211f">⑤ 仓库根目录 csrc/ 与上游 vLLM 仓库的职责边界</text>

  <rect x="16" y="370" width="424" height="92" rx="7" fill="#ece9df" stroke="#b8bcb5" stroke-width="1.4"/>
  <text x="30" y="396" font-size="14.5" font-weight="700" fill="#17211f">根目录 csrc/（C++ / AscendC 自定义扩展）</text>
  <text x="30" y="420" font-size="13.5" fill="#4d5652">• 通过 torch.ops._C_ascend 暴露给 Python 算子层</text>
  <text x="30" y="444" font-size="13.5" fill="#4d5652">• main 删除旧 score CPP，新增 csrc/engram_hixl/</text>

  <rect x="460" y="370" width="424" height="92" rx="7" fill="#fff0e9" stroke="#b54237" stroke-width="1.4"/>
  <text x="474" y="396" font-size="14.5" font-weight="700" fill="#8f3229">查完整请求链必须同时打开 vllm/ 上游仓库</text>
  <text x="474" y="420" font-size="13.5" fill="#4d5652">• v1/engine/（EngineCore）、v1/core/（调度/KV 池）</text>
  <text x="474" y="444" font-size="13.5" fill="#8f3229">• 目录名 ≠ 调用先后，须沿配置与对象构造追踪</text>
</svg>
