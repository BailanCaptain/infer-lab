  <text x="204" y="356" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="13" font-weight="600" fill="var(--color-ink, #17211f)" text-anchor="end">_310p/</text>
  <text x="310.6" y="356" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="12" font-weight="400" fill="var(--color-ink-muted, #5b6763)">6838 行 · 49 个文件 · 只在 310P 上跑时</text>
  <text x="204" y="394" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="13" font-weight="600" fill="var(--color-ink, #17211f)" text-anchor="end">其余 16 个目录加根文件</text>
  <text x="642" y="394" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="12" font-weight="400" fill="var(--color-ink-muted, #5b6763)">33012 行 · 119 个文件 · 按需</text>
  <text x="20" y="440" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="12.5" font-weight="400" fill="var(--color-ink-muted, #5b6763)">文件多不等于重要：ops/ 文件最多但读请求路径时它是被动的一层；worker/ 文件只有它的三分之一，却是主干。</text>
  <text x="20" y="462" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="12.5" font-weight="400" fill="var(--color-ink-muted, #5b6763)">两个例外要记住：core/ 不是核心推理逻辑，是接上游调度与 KV 管理的接缝；model_executor/ 只有 3 个文件 263 行，比名字小得多。</text>
</svg>
