<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 536" width="900" height="536" role="img" aria-label="EngineCoreProc 双队列解耦、同步 step 与异步批次队列 step_with_batch_queue 时间轴对比图">
  <title>EngineCoreProc：双队列解耦与同步/异步批次队列时间轴对比</title>
  <desc>关联源码符号：run_busy_loop, _process_input_queue, step, step_with_batch_queue, batch_queue, output_queue, DyntraLBDPEngineCoreProc, BalanceDPEngineCoreProc</desc>
  <defs>
    <marker id="arr-t" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M1,1.5 L8.5,5 L1,8.5 z" fill="#087f73"/>
    </marker>
    <marker id="arr-i" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M1,1.5 L8.5,5 L1,8.5 z" fill="#4c65b6"/>
    </marker>
    <marker id="arr-a" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M1,1.5 L8.5,5 L1,8.5 z" fill="#c78300"/>
    </marker>
    <marker id="arr-e" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M1,1.5 L8.5,5 L1,8.5 z" fill="#b54237"/>
    </marker>
    <pattern id="hatch-bubble" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <line x1="0" y1="0" x2="0" y2="8" stroke="#b54237" stroke-width="1.6" stroke-opacity="0.38"/>
    </pattern>
  </defs>

  <!-- ZONE 1: Dual-Queue Decoupling & Idle Gates (y=8..148) -->
  <rect x="8" y="8" width="884" height="140" rx="10" fill="#f8f6f0" stroke="#d8d8cf" stroke-width="1.2"/>
  <rect x="20" y="18" width="268" height="24" rx="12" fill="#e8edff" stroke="#4c65b6" stroke-width="1"/>
  <text x="154" y="34" text-anchor="middle" font-family="var(--font-sans)" font-size="13.5" font-weight="700" fill="#3a4f93">1. 后台双队列解耦与忙循环等活闸门</text>
  <text x="302" y="34" font-family="var(--font-sans)" font-size="13.5" fill="#4d5652">独立进程隔离 HTTP/分词与 NPU 推进，取消幂等且不打断在算批次</text>

  <!-- API Server Node -->
  <rect x="20" y="52" width="150" height="84" rx="7" fill="#ece9df" stroke="#b8bcb5" stroke-width="1.3"/>
  <text x="95" y="76" text-anchor="middle" font-family="var(--font-sans)" font-size="14" font-weight="700" fill="#17211f">API Server</text>
  <text x="95" y="99" text-anchor="middle" font-family="var(--font-sans)" font-size="13.5" fill="#4d5652">分词 / 发请求</text>
  <text x="95" y="121" text-anchor="middle" font-family="var(--font-sans)" font-size="13.5" fill="#065f56">收 ID 还原流式</text>

  <!-- Forward & Return Queue Tracks -->
  <line x1="170" y1="74" x2="212" y2="74" stroke="#c78300" stroke-width="1.7" marker-end="url(#arr-a)"/>
  <line x1="212" y1="118" x2="174" y2="118" stroke="#087f73" stroke-width="1.7" marker-end="url(#arr-t)"/>

  <!-- Queue Boxes (stacked) -->
  <rect x="216" y="52" width="218" height="44" rx="6" fill="#fff4cf" stroke="#c78300" stroke-width="1.3"/>
  <text x="325" y="71" text-anchor="middle" font-family="var(--font-mono)" font-size="13.5" font-weight="700" fill="#936300">input_queue + cancel_queue</text>
  <text x="325" y="89" text-anchor="middle" font-family="var(--font-sans)" font-size="13.5" fill="#4d5652">取消双写：更新前清空、不中断在算</text>

  <rect x="216" y="102" width="218" height="34" rx="6" fill="#ddf4ef" stroke="#087f73" stroke-width="1.2"/>
  <text x="325" y="124" text-anchor="middle" font-family="var(--font-mono)" font-size="13.5" font-weight="700" fill="#065f56">output_queue（后台发回 ID）</text>

  <!-- Arrow into run_busy_loop -->
  <line x1="434" y1="74" x2="466" y2="74" stroke="#4c65b6" stroke-width="1.7" marker-end="url(#arr-i)"/>
  <line x1="466" y1="118" x2="438" y2="118" stroke="#087f73" stroke-width="1.7" marker-end="url(#arr-t)"/>

  <!-- run_busy_loop 3-way Gate -->
  <rect x="470" y="52" width="410" height="84" rx="7" fill="#ffffff" stroke="#4c65b6" stroke-width="1.3"/>
  <text x="484" y="73" font-family="var(--font-mono)" font-size="13.5" font-weight="700" fill="#3a4f93">run_busy_loop() 三态等待闸门：</text>
  <rect x="484" y="82" width="122" height="44" rx="5" fill="#ece9df" stroke="#b8bcb5" stroke-width="1"/>
  <text x="545" y="101" text-anchor="middle" font-family="var(--font-sans)" font-size="13.5" font-weight="700" fill="#17211f">全空闲</text>
  <text x="545" y="119" text-anchor="middle" font-family="var(--font-sans)" font-size="13.5" fill="#4d5652">阻塞让 CPU</text>

  <rect x="614" y="82" width="132" height="44" rx="5" fill="#fff4cf" stroke="#c78300" stroke-width="1"/>
  <text x="680" y="101" text-anchor="middle" font-family="var(--font-sans)" font-size="13.5" font-weight="700" fill="#936300">等远端 KV/释放</text>
  <text x="680" y="119" text-anchor="middle" font-family="var(--font-sans)" font-size="13.5" fill="#4d5652">休眠 1 ms</text>

  <rect x="754" y="82" width="114" height="44" rx="5" fill="#ddf4ef" stroke="#087f73" stroke-width="1"/>
  <text x="811" y="101" text-anchor="middle" font-family="var(--font-sans)" font-size="13.5" font-weight="700" fill="#065f56">有活 / EP 弹性</text>
  <text x="811" y="119" text-anchor="middle" font-family="var(--font-sans)" font-size="13.5" fill="#065f56">立即走步函数</text>

  <!-- ZONE 2: Real Dual-Track Time-Axis Pipeline (y=160..448) -->
  <rect x="8" y="160" width="884" height="288" rx="10" fill="#f8f6f0" stroke="#d8d8cf" stroke-width="1.2"/>
  <rect x="20" y="170" width="318" height="24" rx="12" fill="#ddf4ef" stroke="#087f73" stroke-width="1"/>
  <text x="179" y="186" text-anchor="middle" font-family="var(--font-sans)" font-size="13.5" font-weight="700" fill="#065f56">2. 同时间轴对比：同步 step() vs 异步批次队列</text>
  <text x="880" y="186" text-anchor="end" font-family="var(--font-sans)" font-size="13.5" fill="#4d5652">时间推进 t →（示意重叠关系，非实测时长）</text>

  <!-- TRACK A: Sync step() (batch_queue_size = 1) -->
  <text x="20" y="214" font-family="var(--font-sans)" font-size="14" font-weight="700" fill="#8f3229">A. 同步 step()（batch_queue_size = 1）</text>
  <text x="880" y="214" text-anchor="end" font-family="var(--font-sans)" font-size="13.5" fill="#8f3229">必须等第 k 步更新完才排 k+1 → 跨步出现 NPU 空档</text>

  <!-- Track A Lane Labels -->
  <text x="20" y="246" font-family="var(--font-mono)" font-size="13.5" font-weight="700" fill="#3a4f93">CPU 引擎</text>
  <text x="20" y="290" font-family="var(--font-mono)" font-size="13.5" font-weight="700" fill="#065f56">NPU 卡上</text>
  <line x1="118" y1="224" x2="118" y2="302" stroke="#d8d8cf" stroke-width="1.2"/>

  <!-- Track A CPU Blocks (y=224..258) -->
  <rect x="126" y="224" width="84" height="34" rx="5" fill="#e8edff" stroke="#4c65b6" stroke-width="1.2"/>
  <text x="168" y="246" text-anchor="middle" font-family="var(--font-mono)" font-size="13.5" font-weight="700" fill="#3a4f93">Sched k</text>

  <rect x="216" y="224" width="134" height="34" rx="5" fill="#ffffff" stroke="#4c65b6" stroke-width="1.2" stroke-dasharray="4 3"/>
  <text x="283" y="246" text-anchor="middle" font-family="var(--font-sans)" font-size="13.5" fill="#3a4f93">结构化 bitmask</text>

  <rect x="404" y="224" width="126" height="34" rx="5" fill="#fff4cf" stroke="#c78300" stroke-width="1.2"/>
  <text x="467" y="246" text-anchor="middle" font-family="var(--font-sans)" font-size="13.5" font-weight="700" fill="#936300">清取消+Update k</text>

  <rect x="536" y="224" width="96" height="34" rx="5" fill="#e8edff" stroke="#4c65b6" stroke-width="1.2"/>
  <text x="584" y="246" text-anchor="middle" font-family="var(--font-mono)" font-size="13.5" font-weight="700" fill="#3a4f93">Sched k+1</text>

  <rect x="638" y="224" width="132" height="34" rx="5" fill="#ffffff" stroke="#4c65b6" stroke-width="1.2" stroke-dasharray="4 3"/>
  <text x="704" y="246" text-anchor="middle" font-family="var(--font-sans)" font-size="13.5" fill="#3a4f93">结构化 bitmask</text>

  <rect x="826" y="224" width="54" height="34" rx="5" fill="#fff4cf" stroke="#c78300" stroke-width="1.2"/>
  <text x="853" y="246" text-anchor="middle" font-family="var(--font-mono)" font-size="13.5" font-weight="700" fill="#936300">Upd</text>

  <!-- Track A NPU Blocks (y=268..302) -->
  <rect x="212" y="268" width="190" height="34" rx="5" fill="#ddf4ef" stroke="#087f73" stroke-width="1.4"/>
  <text x="307" y="290" text-anchor="middle" font-family="var(--font-sans)" font-size="13.5" font-weight="700" fill="#065f56">NPU 执行第 k 步</text>

  <rect x="406" y="268" width="224" height="34" rx="5" fill="url(#hatch-bubble)" stroke="#b54237" stroke-width="1.4" stroke-dasharray="4 3"/>
  <text x="518" y="290" text-anchor="middle" font-family="var(--font-sans)" font-size="13.5" font-weight="700" fill="#8f3229">NPU 空档（等 Update + Sched）</text>

  <rect x="634" y="268" width="190" height="34" rx="5" fill="#ddf4ef" stroke="#087f73" stroke-width="1.4"/>
  <text x="729" y="290" text-anchor="middle" font-family="var(--font-sans)" font-size="13.5" font-weight="700" fill="#065f56">NPU 执行第 k+1 步</text>

  <!-- Divider between Track A and Track B -->
  <line x1="20" y1="316" x2="880" y2="316" stroke="#d8d8cf" stroke-width="1.2" stroke-dasharray="6 4"/>

  <!-- TRACK B: Async step_with_batch_queue() (batch_queue_size = 2) -->
  <text x="20" y="340" font-family="var(--font-sans)" font-size="14" font-weight="700" fill="#065f56">B. 批次队列 step_with_batch_queue()（batch_queue_size = 2，异步调度）</text>
  <text x="880" y="340" text-anchor="end" font-family="var(--font-sans)" font-size="13.5" fill="#065f56">V1 PP=1 领先 1 步；V2 并发 pp_size+1</text>

  <!-- Track B Lane Labels -->
  <text x="20" y="372" font-family="var(--font-mono)" font-size="13.5" font-weight="700" fill="#3a4f93">CPU 引擎</text>
  <text x="20" y="422" font-family="var(--font-mono)" font-size="13.5" font-weight="700" fill="#065f56">NPU 卡上</text>
  <line x1="118" y1="350" x2="118" y2="434" stroke="#d8d8cf" stroke-width="1.2"/>

  <!-- Track B CPU Blocks (y=350..384) — 100% causal! -->
  <rect x="126" y="350" width="84" height="34" rx="5" fill="#e8edff" stroke="#4c65b6" stroke-width="1.2"/>
  <text x="168" y="372" text-anchor="middle" font-family="var(--font-mono)" font-size="13.5" font-weight="700" fill="#3a4f93">Sched k</text>

  <rect x="216" y="350" width="144" height="34" rx="5" fill="#f7e7f2" stroke="#9a4b86" stroke-width="1.4"/>
  <text x="288" y="372" text-anchor="middle" font-family="var(--font-sans)" font-size="13.5" font-weight="700" fill="#7a3a6a">Sched k+1（记占位）</text>

  <rect x="406" y="350" width="86" height="34" rx="5" fill="#fff4cf" stroke="#c78300" stroke-width="1.2"/>
  <text x="449" y="372" text-anchor="middle" font-family="var(--font-mono)" font-size="13.5" font-weight="700" fill="#936300">Update k</text>

  <rect x="496" y="350" width="100" height="34" rx="5" fill="#f7e7f2" stroke="#9a4b86" stroke-width="1.4"/>
  <text x="546" y="372" text-anchor="middle" font-family="var(--font-sans)" font-size="13.5" font-weight="700" fill="#7a3a6a">Sched k+2</text>

  <rect x="600" y="350" width="88" height="34" rx="5" fill="#fff4cf" stroke="#c78300" stroke-width="1.2"/>
  <text x="644" y="372" text-anchor="middle" font-family="var(--font-mono)" font-size="13.5" font-weight="700" fill="#936300">Upd k+1</text>

  <rect x="692" y="350" width="98" height="34" rx="5" fill="#f7e7f2" stroke="#9a4b86" stroke-width="1.4"/>
  <text x="741" y="372" text-anchor="middle" font-family="var(--font-sans)" font-size="13.5" font-weight="700" fill="#7a3a6a">Sched k+3</text>

  <rect x="794" y="350" width="86" height="34" rx="5" fill="#fff4cf" stroke="#c78300" stroke-width="1.2"/>
  <text x="837" y="372" text-anchor="middle" font-family="var(--font-mono)" font-size="13.5" font-weight="700" fill="#936300">Upd k+2</text>

  <!-- Track B NPU Blocks (y=400..434) — BACK-TO-BACK ZERO BUBBLE! -->
  <rect x="212" y="400" width="190" height="34" rx="5" fill="#ddf4ef" stroke="#087f73" stroke-width="1.5"/>
  <text x="307" y="422" text-anchor="middle" font-family="var(--font-sans)" font-size="13.5" font-weight="700" fill="#065f56">NPU 执行第 k 步</text>

  <rect x="406" y="400" width="190" height="34" rx="5" fill="#ddf4ef" stroke="#087f73" stroke-width="1.5"/>
  <text x="501" y="422" text-anchor="middle" font-family="var(--font-sans)" font-size="13.5" font-weight="700" fill="#065f56">NPU 紧接执行第 k+1 步</text>

  <rect x="600" y="400" width="190" height="34" rx="5" fill="#ddf4ef" stroke="#087f73" stroke-width="1.5"/>
  <text x="695" y="422" text-anchor="middle" font-family="var(--font-sans)" font-size="13.5" font-weight="700" fill="#065f56">NPU 紧接执行第 k+2 步</text>

  <rect x="794" y="400" width="86" height="34" rx="5" fill="#ddf4ef" fill-opacity="0.55" stroke="#087f73" stroke-width="1.2" stroke-dasharray="4 3"/>
  <text x="837" y="422" text-anchor="middle" font-family="var(--font-mono)" font-size="13.5" font-weight="700" fill="#065f56">k+3 →</text>

  <!-- Causal submission & completion links between CPU and NPU in Track B -->
  <line x1="210" y1="384" x2="216" y2="397" stroke="#4c65b6" stroke-width="1.4" marker-end="url(#arr-i)"/>
  <line x1="360" y1="384" x2="404" y2="398" stroke="#9a4b86" stroke-width="1.4" stroke-dasharray="3 2" marker-end="url(#arr-i)"/>
  <line x1="402" y1="400" x2="412" y2="387" stroke="#c78300" stroke-width="1.4" marker-end="url(#arr-a)"/>
  <line x1="596" y1="384" x2="602" y2="397" stroke="#9a4b86" stroke-width="1.4" stroke-dasharray="3 2" marker-end="url(#arr-i)"/>
  <line x1="596" y1="400" x2="606" y2="387" stroke="#c78300" stroke-width="1.4" marker-end="url(#arr-a)"/>

  <!-- ZONE 3: Bottom Architectural Strip (y=460..526) -->
  <rect x="8" y="460" width="284" height="66" rx="8" fill="#f7e7f2" stroke="#9a4b86" stroke-width="1.3"/>
  <text x="22" y="485" font-family="var(--font-sans)" font-size="14" font-weight="700" fill="#7a3a6a">DP + EP 空闲组陪跑</text>
  <text x="22" y="509" font-family="var(--font-sans)" font-size="13.5" fill="#4d5652">本组无请求而他组在算 → 跑空批次</text>

  <rect x="308" y="460" width="284" height="66" rx="8" fill="#ece9df" stroke="#b8bcb5" stroke-width="1.3"/>
  <text x="322" y="485" font-family="var(--font-sans)" font-size="14" font-weight="700" fill="#17211f">常规部署直接跑上游循环</text>
  <text x="322" y="509" font-family="var(--font-sans)" font-size="13.5" fill="#4d5652">未开 DyntraLB / Balance 不换类</text>

  <rect x="608" y="460" width="284" height="66" rx="8" fill="#fff4cf" stroke="#c78300" stroke-width="1.3"/>
  <text x="622" y="485" font-family="var(--font-sans)" font-size="14" font-weight="700" fill="#936300">v0.30.0 → main 补丁收口</text>
