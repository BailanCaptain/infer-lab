<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 472" width="900" height="472" role="img" aria-label="EngineCoreProc 双队列架构与 step 和 step_with_batch_queue 并发对比图" font-family="var(--font-sans)">
  <title>EngineCoreProc：输入输出队列解耦、忙循环休眠条件与批次队列重叠</title>
  <desc>关联源码符号：EngineCoreProc, run_busy_loop, _process_input_queue, step, step_with_batch_queue, batch_queue, output_queue, DyntraLBDPEngineCoreProc, BalanceDPEngineCoreProc</desc>
  <defs>
    <marker id="ec-arr-t" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="#087f73"/>
    </marker>
    <marker id="ec-arr-i" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="#4c65b6"/>
    </marker>
    <marker id="ec-arr-a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="#c78300"/>
    </marker>
  </defs>

  <!-- Zone 1: Queue decoupling -->
  <text x="16" y="28" font-size="16" font-weight="700" fill="#17211f">① EngineCoreProc 队列解耦：后台线程收发，主线程只跑 run_busy_loop()</text>
  <text x="884" y="28" text-anchor="end" font-size="13.5" fill="#66716d">独立进程隔离 CPU 杂活与 NPU 推进</text>

  <rect x="16" y="44" width="184" height="104" rx="7" fill="#ece9df" stroke="#b8bcb5" stroke-width="1.4"/>
  <text x="28" y="70" font-size="14.5" font-weight="700" fill="#17211f">前端 API Server</text>
  <text x="28" y="94" font-size="13.5" fill="#4d5652">HTTP / 分词 / 流式推送</text>
  <text x="28" y="116" font-size="13.5" fill="#4d5652">发请求 token ID 与取消</text>
  <text x="28" y="138" font-size="13.5" fill="#66716d">收新 token ID 还原文本</text>

  <line x1="202" y1="76" x2="236" y2="76" stroke="#c78300" stroke-width="1.8" marker-end="url(#ec-arr-a)"/>
  <line x1="236" y1="120" x2="202" y2="120" stroke="#087f73" stroke-width="1.8" marker-end="url(#ec-arr-t)"/>

  <rect x="240" y="44" width="212" height="104" rx="7" fill="#fff4cf" stroke="#c78300" stroke-width="1.4"/>
  <text x="252" y="70" font-size="14.5" font-weight="700" fill="#936300">输入与双路取消队列</text>
  <text x="252" y="94" font-size="13.5" fill="#4d5652">input_queue：新请求+取消</text>
  <text x="252" y="116" font-size="13.5" fill="#4d5652">独立取消队列：更新前先清空</text>
  <text x="252" y="138" font-size="13.5" fill="#936300">中止幂等，不打断卡上在算批</text>

  <line x1="454" y1="96" x2="486" y2="96" stroke="#4c65b6" stroke-width="1.8" marker-end="url(#ec-arr-i)"/>

  <rect x="490" y="44" width="394" height="104" rx="7" fill="#e8edff" stroke="#4c65b6" stroke-width="1.4"/>
  <text x="504" y="70" font-size="14.5" font-weight="700" fill="#3a4f93">主线程忙循环：收队列 → 判有活 → 跑一步</text>
  <text x="504" y="94" font-size="13.5" fill="#4d5652">• 全空闲（无请求/在途批/DP陪跑）：阻塞让 CPU</text>
  <text x="504" y="116" font-size="13.5" fill="#4d5652">• 仍有请求但未算（等远端 KV/释放）：休眠 1 ms</text>
  <text x="504" y="138" font-size="13.5" fill="#3a4f93">• 步末新 token ID 入 output_queue，后台回传</text>

  <line x1="16" y1="168" x2="884" y2="168" stroke="#b8bcb5" stroke-width="1.4" stroke-dasharray="6 5"/>

  <!-- Zone 2: Sync vs Batch Queue -->
  <text x="16" y="196" font-size="16" font-weight="700" fill="#17211f">② 两种步函数分支：由 batch_queue_size = max_concurrent_batches 决定</text>

  <rect x="16" y="212" width="420" height="132" rx="7" fill="#fff0e9" stroke="#b54237" stroke-width="1.4"/>
  <text x="30" y="238" font-size="14.5" font-weight="700" fill="#8f3229">同步分支 step()（队列长度 = 1）</text>
  <text x="30" y="262" font-size="13.5" fill="#4d5652">1. schedule() 排第 k 步 → 非阻塞提交 Worker 前向</text>
  <text x="30" y="284" font-size="13.5" fill="#4d5652">2. 趁 NPU 算前向，CPU 并行准备结构化输出 bitmask</text>
  <text x="30" y="306" font-size="13.5" fill="#4d5652">3. 阻塞等本步结果 → 清取消 → update_from_output()</text>
  <text x="30" y="328" font-size="13.5" font-weight="700" fill="#8f3229">代价：必须等第 k 步更新完，才能排第 k+1 步</text>

  <rect x="464" y="212" width="420" height="132" rx="7" fill="#ddf4ef" stroke="#087f73" stroke-width="1.4"/>
  <text x="478" y="238" font-size="14.5" font-weight="700" fill="#065f56">批次队列 step_with_batch_queue()（队列长度 &gt; 1）</text>
  <text x="478" y="262" font-size="13.5" fill="#4d5652">1. 排第 k 步并入队；队列未满且无推迟采样 → 提前返回</text>
  <text x="478" y="284" font-size="13.5" fill="#4d5652">2. 下一圈紧接排第 k+1 步（未返回 token 先记占位）</text>
  <text x="478" y="306" font-size="13.5" fill="#4d5652">3. 队列满时取出最老第 k 步取结果、清取消、再更新</text>
  <text x="478" y="328" font-size="13.5" font-weight="700" fill="#065f56">V1 PP=1 并发 2 批（领先 1 步）；V2 并发 pp_size + 1</text>

  <line x1="16" y1="364" x2="884" y2="364" stroke="#b8bcb5" stroke-width="1.4" stroke-dasharray="6 5"/>

  <!-- Zone 3: Boundaries -->
  <text x="16" y="390" font-size="16" font-weight="700" fill="#17211f">③ 多卡 DP 陪跑、v0.30.0 节流与昇腾补丁入口</text>

  <rect x="16" y="404" width="276" height="58" rx="7" fill="#f7e7f2" stroke="#9a4b86" stroke-width="1.3"/>
  <text x="30" y="428" font-size="14" font-weight="700" fill="#7a3a6a">DP+EP 空闲组陪跑</text>
  <text x="30" y="450" font-size="13.5" fill="#4d5652">本组无请求而他组在跑 → 跑空批次</text>

  <rect x="312" y="404" width="276" height="58" rx="7" fill="#ece9df" stroke="#b8bcb5" stroke-width="1.3"/>
  <text x="326" y="428" font-size="14" font-weight="700" fill="#17211f">常规默认走上游循环</text>
  <text x="326" y="450" font-size="13.5" fill="#4d5652">未开 DyntraLB/Balance 不换类</text>

  <rect x="608" y="404" width="276" height="58" rx="7" fill="#fff4cf" stroke="#c78300" stroke-width="1.3"/>
  <text x="622" y="428" font-size="14" font-weight="700" fill="#936300">v0.30.0 → main 补丁收口</text>
  <text x="622" y="450" font-size="13.5" fill="#4d5652">main 已删 profiling_chunk 补丁</text>
</svg>
