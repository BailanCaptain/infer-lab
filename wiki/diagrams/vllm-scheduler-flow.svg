<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 760" width="880" height="760" role="img" aria-label="调度器一步里先扫 running、再扫 waiting，各走「还差几个 → 截断 → 借块 → 记账」四关；第②关按队列选一条支路。阈值仅在正数时生效；waiting 关闭分块且阈值截后仍超预算就停止接纳，编码器或状态对齐使安排量为0时也停止。running 为0则跳过本条。图按默认 fcfs：借不到块时抢占队尾再试，priority 改按优先级与到达时间选。抢到自己就结束 running 扫描，发生抢占后本步不再接纳 waiting；排完才统一前移已算数。">
  <title>调度器一步里先扫 running、再扫 waiting，各走「还差几个 → 截断 → 借块 → 记账」四关；第②关按队列选一条支路。阈值仅在正数时生效；waiting 关闭分块且阈值截后仍超预算就停止接纳，编码器或状态对齐使安排量为0时也停止。running 为0则跳过本条。图按默认 fcfs：借不到块时抢占队尾再试，priority 改按优先级与到达时间选。抢到自己就结束 running 扫描，发生抢占后本步不再接纳 waiting；排完才统一前移已算数。</title>
  <defs><marker id="vllm-scheduler-flow-ah-ink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="var(--color-ink, #17211f)"/></marker></defs>
  <path d="M440 72 L440 112" fill="none" stroke="var(--color-ink, #17211f)" stroke-width="1.4" marker-end="url(#vllm-scheduler-flow-ah-ink)"/>
  <path d="M440 172 L440 192 L221 192 L221 212" fill="none" stroke="var(--color-ink, #17211f)" stroke-width="1.4" marker-end="url(#vllm-scheduler-flow-ah-ink)"/>
  <path d="M440 172 L440 192 L659 192 L659 212" fill="none" stroke="var(--color-ink, #17211f)" stroke-width="1.4" marker-end="url(#vllm-scheduler-flow-ah-ink)"/>
  <path d="M221 288 L221 322 L440 322 L440 372" fill="none" stroke="var(--color-ink, #17211f)" stroke-width="1.4" marker-end="url(#vllm-scheduler-flow-ah-ink)"/>
  <path d="M659 288 L659 322 L440 322 L440 372" fill="none" stroke="var(--color-ink, #17211f)" stroke-width="1.4" marker-end="url(#vllm-scheduler-flow-ah-ink)"/>
  <path d="M440 432 L440 472" fill="none" stroke="var(--color-ink, #17211f)" stroke-width="1.4" marker-end="url(#vllm-scheduler-flow-ah-ink)"/>
  <path d="M440 532 L440 572" fill="none" stroke="var(--color-ink, #17211f)" stroke-width="1.4" marker-end="url(#vllm-scheduler-flow-ah-ink)"/>
  <path d="M440 628 L440 672" fill="none" stroke="var(--color-ink, #17211f)" stroke-width="1.4" marker-end="url(#vllm-scheduler-flow-ah-ink)"/>
  <path d="M250 620 L8 620 L8 142 L250 142" fill="none" stroke="var(--color-ink, #17211f)" stroke-width="1.4" marker-end="url(#vllm-scheduler-flow-ah-ink)"/>
  <path d="M121 432 L121 702 L250 702" fill="none" stroke="var(--color-ink, #17211f)" stroke-width="1.4" marker-end="url(#vllm-scheduler-flow-ah-ink)"/>
  <path d="M250 402 L226 402" fill="none" stroke="var(--color-ink, #17211f)" stroke-width="1.4" marker-end="url(#vllm-scheduler-flow-ah-ink)"/>
  <path d="M630 402 L654 402" fill="none" stroke="var(--color-ink, #17211f)" stroke-width="1.4" marker-end="url(#vllm-scheduler-flow-ah-ink)"/>
  <path d="M810 288 L810 342 L759 342 L759 372" fill="none" stroke="var(--color-ink, #17211f)" stroke-width="1.4" marker-end="url(#vllm-scheduler-flow-ah-ink)"/>
  <path d="M121 372 L121 352 L300 352 L300 372" fill="none" stroke="var(--color-ink, #17211f)" stroke-width="1.4" stroke-dasharray="7 5" marker-end="url(#vllm-scheduler-flow-ah-ink)"/>
  <path d="M759 432 L759 702 L630 702" fill="none" stroke="var(--color-ink, #17211f)" stroke-width="1.4" marker-end="url(#vllm-scheduler-flow-ah-ink)"/>
  <rect x="250" y="16" width="380" height="56" rx="8" fill="var(--color-surface-sunken, #ece9df)" stroke="var(--color-ink, #17211f)" stroke-width="1.5"/>
  <text x="440" y="40" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="14" font-weight="700" fill="var(--color-ink, #17211f)" text-anchor="middle">每一步开头：预算重置为上限</text>
  <text x="440" y="59" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="13" font-weight="400" fill="var(--color-ink, #17211f)" text-anchor="middle">先扫 running，再扫 waiting</text>
  <rect x="250" y="112" width="380" height="60" rx="8" fill="var(--color-token, #087f73)" stroke="var(--color-ink, #17211f)" stroke-width="1.5"/>
  <text x="440" y="138" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="14" font-weight="700" fill="var(--color-ink-inverse, #ffffff)" text-anchor="middle">① 还差几个位置 = 应算 − 已算</text>
  <text x="440" y="157" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="13" font-weight="400" fill="var(--color-ink-inverse, #ffffff)" text-anchor="middle">waiting 也含抢占恢复请求的已生成部分</text>
  <rect x="16" y="212" width="410" height="76" rx="8" fill="var(--color-token, #087f73)" stroke="var(--color-ink, #17211f)" stroke-width="1.5"/>
  <text x="221" y="246" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="14" font-weight="700" fill="var(--color-ink-inverse, #ffffff)" text-anchor="middle">② running：阈值 → 预算 → 长度</text>
  <text x="221" y="265" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="13" font-weight="400" fill="var(--color-ink-inverse, #ffffff)" text-anchor="middle">安排量为 0：跳过本条，继续扫描</text>
  <rect x="454" y="212" width="410" height="76" rx="8" fill="var(--color-token, #087f73)" stroke="var(--color-ink, #17211f)" stroke-width="1.5"/>
  <text x="659" y="246" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="14" font-weight="700" fill="var(--color-ink-inverse, #ffffff)" text-anchor="middle">② waiting：阈值 → 禁分块检查 → 预算</text>
  <text x="659" y="265" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="13" font-weight="400" fill="var(--color-ink-inverse, #ffffff)" text-anchor="middle">超预算又禁分块，或安排量变成 0：停止接纳</text>
  <rect x="250" y="372" width="380" height="60" rx="8" fill="var(--color-kv, #4c65b6)" stroke="var(--color-ink, #17211f)" stroke-width="1.5"/>
  <text x="440" y="398" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="14" font-weight="700" fill="var(--color-ink-inverse, #ffffff)" text-anchor="middle">③ 借块：已算 + 本步 + 候选预留</text>
  <text x="440" y="417" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="13" font-weight="400" fill="var(--color-ink-inverse, #ffffff)" text-anchor="middle">各缓存组块数加总，够才一次借出</text>
  <rect x="16" y="372" width="210" height="60" rx="8" fill="var(--color-danger, #b54237)" stroke="var(--color-ink, #17211f)" stroke-width="1.5"/>
  <text x="121" y="398" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="14" font-weight="700" fill="var(--color-ink-inverse, #ffffff)" text-anchor="middle">running 借不到块</text>
  <text x="121" y="417" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="13" font-weight="400" fill="var(--color-ink-inverse, #ffffff)" text-anchor="middle">抢占队尾一条：还块、清零</text>
  <rect x="654" y="372" width="210" height="60" rx="8" fill="var(--color-control, #66716d)" stroke="var(--color-ink, #17211f)" stroke-width="1.5"/>
  <text x="759" y="398" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="14" font-weight="700" fill="var(--color-ink-inverse, #ffffff)" text-anchor="middle">停止接纳 waiting</text>
  <text x="759" y="417" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="13" font-weight="400" fill="var(--color-ink-inverse, #ffffff)" text-anchor="middle">直接交出本步结果</text>
  <rect x="250" y="472" width="380" height="60" rx="8" fill="var(--color-token, #087f73)" stroke="var(--color-ink, #17211f)" stroke-width="1.5"/>
  <text x="440" y="498" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="14" font-weight="700" fill="var(--color-ink-inverse, #ffffff)" text-anchor="middle">④ 记账：扣掉本步预算</text>
  <text x="440" y="517" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="13" font-weight="400" fill="var(--color-ink-inverse, #ffffff)" text-anchor="middle">记下这条本步安排几个 token</text>
  <rect x="250" y="572" width="380" height="56" rx="8" fill="var(--color-surface-sunken, #ece9df)" stroke="var(--color-ink, #17211f)" stroke-width="1.5"/>
  <text x="440" y="596" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="14" font-weight="700" fill="var(--color-ink, #17211f)" text-anchor="middle">还有要扫的请求，且预算有余？</text>
  <text x="440" y="615" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="13" font-weight="400" fill="var(--color-ink, #17211f)" text-anchor="middle">扫 waiting 还要：本步没抢占过、未满员</text>
  <rect x="250" y="672" width="380" height="60" rx="8" fill="var(--color-surface-sunken, #ece9df)" stroke="var(--color-ink, #17211f)" stroke-width="1.5"/>
  <text x="440" y="698" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="14" font-weight="700" fill="var(--color-ink, #17211f)" text-anchor="middle">排完：已算数统一前移，交出结果</text>
  <text x="440" y="717" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="13" font-weight="400" fill="var(--color-ink, #17211f)" text-anchor="middle">每条几个 token、新借的块号、候选 token</text>
  <text x="60" y="612" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="14" font-weight="400" fill="var(--color-ink, #17211f)">是</text>
  <text x="452" y="656" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="14" font-weight="400" fill="var(--color-ink, #17211f)">否</text>
  <text x="452" y="458" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="14" font-weight="400" fill="var(--color-ink, #17211f)">够</text>
  <text x="685" y="310" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="13" font-weight="400" fill="var(--color-ink, #17211f)">waiting 无法继续</text>
  <text x="172" y="346" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="13" font-weight="400" fill="var(--color-ink, #17211f)">再试</text>
  <text x="130" y="512" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="13" font-weight="400" fill="var(--color-ink, #17211f)">抢到自己</text>
  <text x="640" y="364" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="13" font-weight="400" fill="var(--color-ink, #17211f)">waiting 借不到</text>
</svg>
