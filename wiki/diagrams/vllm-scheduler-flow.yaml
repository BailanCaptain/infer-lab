layout: figure
id: vllm-scheduler-flow
caption: 调度器一步里先扫 running、再扫 waiting，各走「还差几个 → 截断 → 借块 → 记账」四关；第②关按队列选一条支路。阈值仅在正数时生效；waiting 关闭分块且阈值截后仍超预算就停止接纳，编码器或状态对齐使安排量为0时也停止。running 为0则跳过本条。图按默认 fcfs：借不到块时抢占队尾再试，priority 改按优先级与到达时间选。抢到自己就结束 running 扫描，发生抢占后本步不再接纳 waiting；排完才统一前移已算数。
size: [880, 760]
items:
  - { at: [250, 16], size: [380, 56], text: 每一步开头：预算重置为上限, sub: 先扫 running，再扫 waiting, style: plain }
  - { at: [250, 112], size: [380, 60], text: ① 还差几个位置 = 应算 − 已算, sub: waiting 也含抢占恢复请求的已生成部分, tone: token }
  - { at: [16, 212], size: [410, 76], text: ② running：阈值 → 预算 → 长度, sub: 安排量为 0：跳过本条，继续扫描, tone: token }
  - { at: [454, 212], size: [410, 76], text: ② waiting：阈值 → 禁分块检查 → 预算, sub: 超预算又禁分块，或安排量变成 0：停止接纳, tone: token }
  - { at: [250, 372], size: [380, 60], text: ③ 借块：已算 + 本步 + 候选预留, sub: 各缓存组块数加总，够才一次借出, tone: kv }
  - { at: [16, 372], size: [210, 60], text: running 借不到块, sub: 抢占队尾一条：还块、清零, tone: danger }
  - { at: [654, 372], size: [210, 60], text: 停止接纳 waiting, sub: 直接交出本步结果, tone: control }
  - { at: [250, 472], size: [380, 60], text: ④ 记账：扣掉本步预算, sub: 记下这条本步安排几个 token, tone: token }
  - { at: [250, 572], size: [380, 56], text: 还有要扫的请求，且预算有余？, sub: 扫 waiting 还要：本步没抢占过、未满员, style: plain }
  - { at: [250, 672], size: [380, 60], text: 排完：已算数统一前移，交出结果, sub: 每条几个 token、新借的块号、候选 token, style: plain }
