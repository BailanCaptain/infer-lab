mode: native-svg
id: vllm-v1-plate-cutaway
caption: >-
  vLLM V1 三角色立体拆解直觉：左侧 API Server（AsyncLLM）负责文本分词与流式反分词，经 ZMQ IPC 轻消息管道与中央 EngineCore（Scheduler）交接请求与新 token；EngineCore 维护 WAITING / RUNNING 队列并按步排出轻量差量计划，右侧 NPU Worker（NPUModelRunner）直接操作常驻 HBM 的模型权重与 KV cache 完成前向和采样。
size: [900, 600]
