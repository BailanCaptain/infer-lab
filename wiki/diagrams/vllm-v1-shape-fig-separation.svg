<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 454" width="900" height="454" role="img" aria-label="vLLM V1 三角色边界、两道跨进程消息契约与 MRV1/MRV2 正交演进" font-family="var(--font-sans)">
  <title>vLLM V1 三角色边界与两道跨进程消息契约</title>
  <desc>Frontend AsyncLLM, EngineCore Scheduler/Executor, Worker NPUModelRunner boundaries and v0.30.0 vs main MRV2 evolution</desc>

  <text x="16" y="26" font-size="16" font-weight="700" fill="#17211f">vLLM V1 三角色职责边界与两道跨进程契约（重权重留卡，轻账本过线）</text>
  <text x="16" y="49" font-size="13.5" fill="#66716d">把网络 I/O、CPU 调度与 NPU 算力拆成三段流水交叠；进程边界不等于仓库边界</text>

  <!-- Three Role Columns -->
  <rect x="16" y="64" width="248" height="236" rx="8" fill="#ddf4ef" stroke="#087f73" stroke-width="1.4"/>
  <text x="32" y="90" font-size="15" font-weight="700" fill="#065f56">① 前端（AsyncLLM）</text>
  <text x="32" y="114" font-size="13.5" fill="#4d5652">• 接 HTTP、套聊天模板</text>
  <text x="32" y="138" font-size="13.5" fill="#4d5652">• 分词与增量反分词</text>
  <text x="32" y="162" font-size="13.5" fill="#4d5652">• 匹配跨 token 停止串</text>
  <text x="32" y="186" font-size="13.5" fill="#4d5652">• 维护输出队列与 SSE 流</text>
  <line x1="32" y1="204" x2="248" y2="204" stroke="#087f73" stroke-width="1"/>
  <text x="32" y="226" font-size="13.5" font-weight="700" fill="#065f56">瓶颈：海量连接与收发</text>
  <text x="32" y="250" font-size="13.5" fill="#4d5652">asyncio 事件循环驱动</text>
  <text x="32" y="274" font-size="13.5" fill="#4d5652">不存权重，也不存 KV 块</text>

  <rect x="326" y="64" width="248" height="236" rx="8" fill="#fff4cf" stroke="#c78300" stroke-width="1.4"/>
  <text x="342" y="90" font-size="15" font-weight="700" fill="#936300">② EngineCore 进程</text>
  <text x="342" y="114" font-size="13.5" fill="#4d5652">• Scheduler 排步与预算</text>
  <text x="342" y="138" font-size="13.5" fill="#4d5652">• 只记块号整数与进度</text>
  <text x="342" y="162" font-size="13.5" fill="#4d5652">• Executor 传话不排调度</text>
  <text x="342" y="186" font-size="13.5" fill="#4d5652">• 忙循环 + 双收发线程</text>
  <line x1="342" y1="204" x2="558" y2="204" stroke="#c78300" stroke-width="1"/>
  <text x="342" y="226" font-size="13.5" font-weight="700" fill="#936300">瓶颈：下一步不能卡顿</text>
  <text x="342" y="250" font-size="13.5" fill="#4d5652">含 Ascend 全局补丁注入</text>
  <text x="342" y="274" font-size="13.5" fill="#4d5652">异步调度交叠相邻两步</text>

  <rect x="636" y="64" width="248" height="236" rx="8" fill="#e8edff" stroke="#4c65b6" stroke-width="1.4"/>
  <text x="652" y="90" font-size="15" font-weight="700" fill="#3a4f93">③ Worker（每卡一个）</text>
  <text x="652" y="114" font-size="13.5" fill="#4d5652">• 守本卡权重与 KV 张量</text>
  <text x="652" y="138" font-size="13.5" fill="#4d5652">• 缓存请求资料与 block table</text>
  <text x="652" y="162" font-size="13.5" fill="#4d5652">• execute_model 前向</text>
  <text x="652" y="186" font-size="13.5" fill="#4d5652">• sample_tokens 采样</text>
  <line x1="652" y1="204" x2="868" y2="204" stroke="#4c65b6" stroke-width="1"/>
  <text x="652" y="226" font-size="13.5" font-weight="700" fill="#3a4f93">瓶颈：等待 NPU 算力与通信</text>
  <text x="652" y="250" font-size="13.5" fill="#4d5652">NPUWorker + ModelRunner</text>
  <text x="652" y="274" font-size="13.5" fill="#4d5652">常规仅 TP0 回传本步结果</text>

  <!-- Boundary 1 arrows -->
  <path d="M266 132h56m-6-5l6 5-6 5" fill="none" stroke="#087f73" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="295" y="122" text-anchor="middle" font-size="13.5" font-weight="600" fill="#065f56">请求</text>
  <path d="M322 214h-56m6-5l-6 5 6 5" fill="none" stroke="#9a4b86" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="295" y="204" text-anchor="middle" font-size="13.5" font-weight="600" fill="#7a3a6a">新词</text>
  <text x="295" y="242" text-anchor="middle" font-size="13.5" fill="#66716d">边界一</text>
  <text x="295" y="262" text-anchor="middle" font-size="13.5" fill="#66716d">不传文字</text>

  <!-- Boundary 2 arrows -->
  <path d="M576 132h56m-6-5l6 5-6 5" fill="none" stroke="#c78300" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="605" y="122" text-anchor="middle" font-size="13.5" font-weight="600" fill="#936300">计划</text>
  <path d="M632 214h-56m6-5l-6 5 6 5" fill="none" stroke="#4c65b6" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="605" y="204" text-anchor="middle" font-size="13.5" font-weight="600" fill="#3a4f93">结果</text>
  <text x="605" y="242" text-anchor="middle" font-size="13.5" fill="#66716d">边界二</text>
  <text x="605" y="262" text-anchor="middle" font-size="13.5" fill="#66716d">只发差量</text>

  <!-- Bottom strip: Delta sync & MRV1 vs MRV2 -->
  <rect x="16" y="318" width="424" height="122" rx="8" fill="#ece9df" stroke="#b8bcb5" stroke-width="1.3"/>
  <text x="32" y="344" font-size="14.5" font-weight="700" fill="#17211f">第二道边界的差量同步（SchedulerOutput）</text>
  <text x="32" y="370" font-size="13.5" fill="#4d5652">• 首步 new_reqs：发送完整 prompt 与采样参数</text>
  <text x="32" y="396" font-size="13.5" fill="#4d5652">• 后续 cached_reqs：只发新增块号与步进计数</text>
  <text x="32" y="422" font-size="13.5" fill="#4d5652">• 结束 finished_req_ids：随下步通知 Worker 释放</text>

  <rect x="460" y="318" width="424" height="122" rx="8" fill="#f7e7f2" stroke="#9a4b86" stroke-width="1.3"/>
  <text x="476" y="344" font-size="14.5" font-weight="700" fill="#7a3a6a">V1 引擎循环不变，执行侧演进 MRV1 → MRV2</text>
  <text x="476" y="370" font-size="13.5" fill="#4d5652">• v0.30.0 主基线：默认 MRV1，设环境变量切 V2</text>
  <text x="476" y="396" font-size="13.5" fill="#4d5652">• main（8d6180e2）：移除 MRV1，全量走 V2</text>
  <text x="476" y="422" font-size="13.5" fill="#4d5652">• 两代 Runner 共用 V1 step / batch_queue 循环</text>
</svg>
