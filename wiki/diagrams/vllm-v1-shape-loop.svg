<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 700" width="900" height="700" role="img" aria-label="标准 vLLM V1 请求主循环（未开 PP / PCP、无 KV connector），展示 API Server、EngineCore 与 Worker 每转一圈的协作，圈里的编号是主线七站。无请求时循环停在输入队列上等待（仅在 MoE 开启跨 DP 组 EP 且本组空闲、他组在跑时，才触发空批次陪跑）；有请求时由 Scheduler 排定本步计划，经 Executor 驱动 Worker 先做前向、再做采样（开启投机时含草稿步），更新进度后把新 token 流式送回前端。">
  <title>标准 vLLM V1 请求主循环（未开 PP / PCP、无 KV connector），展示 API Server、EngineCore 与 Worker 每转一圈的协作，圈里的编号是主线七站。无请求时循环停在输入队列上等待（仅在 MoE 开启跨 DP 组 EP 且本组空闲、他组在跑时，才触发空批次陪跑）；有请求时由 Scheduler 排定本步计划，经 Executor 驱动 Worker 先做前向、再做采样（开启投机时含草稿步），更新进度后把新 token 流式送回前端。</title>
  <defs><marker id="vllm-v1-shape-loop-ah-ink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="var(--color-ink, #17211f)"/></marker><marker id="vllm-v1-shape-loop-ah-token" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="var(--color-token, #087f73)"/></marker></defs>
  <path d="M450 86 L450 116" fill="none" stroke="var(--color-ink, #17211f)" stroke-width="1.4" marker-end="url(#vllm-v1-shape-loop-ah-ink)"/>
  <path d="M450 166 L450 196" fill="none" stroke="var(--color-ink, #17211f)" stroke-width="1.4" marker-end="url(#vllm-v1-shape-loop-ah-ink)"/>
  <path d="M660 218 L700 218" fill="none" stroke="var(--color-ink, #17211f)" stroke-width="1.4" marker-end="url(#vllm-v1-shape-loop-ah-ink)"/>
  <path d="M790 190 L790 141 L660 141" fill="none" stroke="var(--color-ink, #17211f)" stroke-width="1.4" marker-end="url(#vllm-v1-shape-loop-ah-ink)"/>
  <path d="M450 240 L450 280" fill="none" stroke="var(--color-ink, #17211f)" stroke-width="1.4" marker-end="url(#vllm-v1-shape-loop-ah-ink)"/>
  <path d="M450 330 L450 364" fill="none" stroke="var(--color-ink, #17211f)" stroke-width="1.4" marker-end="url(#vllm-v1-shape-loop-ah-ink)"/>
  <path d="M450 420 L450 454" fill="none" stroke="var(--color-ink, #17211f)" stroke-width="1.4" marker-end="url(#vllm-v1-shape-loop-ah-ink)"/>
  <path d="M450 510 L450 544" fill="none" stroke="var(--color-ink, #17211f)" stroke-width="1.4" marker-end="url(#vllm-v1-shape-loop-ah-ink)"/>
  <path d="M660 569 L700 569" fill="none" stroke="var(--color-token, #087f73)" stroke-width="1.4" marker-end="url(#vllm-v1-shape-loop-ah-token)"/>
  <path d="M450 594 L450 628" fill="none" stroke="var(--color-ink, #17211f)" stroke-width="1.4" marker-end="url(#vllm-v1-shape-loop-ah-ink)"/>
  <path d="M240 653 L16 653 L16 218 L240 218" fill="none" stroke="var(--color-ink, #17211f)" stroke-width="1.4" marker-end="url(#vllm-v1-shape-loop-ah-ink)"/>
  <rect x="240" y="36" width="420" height="50" rx="8" fill="var(--color-token-soft, #ddf4ef)" stroke="var(--color-token, #087f73)" stroke-width="1.4"/>
  <text x="450" y="57" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="14" font-weight="700" fill="var(--color-ink, #17211f)" text-anchor="middle">① 前端 API Server：分词，包成请求消息</text>
  <text x="450" y="76" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="13" font-weight="400" fill="#065f56" text-anchor="middle">经 ZMQ 进程间消息送进 EngineCore 输入队列</text>
  <rect x="240" y="116" width="420" height="50" rx="8" fill="var(--color-control-soft, #f1efe8)" stroke="var(--color-line-strong, #b8bcb5)" stroke-width="1.4"/>
  <text x="450" y="146" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="14" font-weight="700" fill="var(--color-ink, #17211f)" text-anchor="middle">EngineCore 收下请求，放进等待队列</text>
  <rect x="240" y="196" width="420" height="44" rx="8" fill="var(--color-control-soft, #f1efe8)" stroke="var(--color-line-strong, #b8bcb5)" stroke-width="1.4"/>
  <text x="450" y="223" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="14" font-weight="700" fill="var(--color-ink, #17211f)" text-anchor="middle">有请求要算吗？</text>
  <rect x="700" y="190" width="180" height="56" rx="8" fill="var(--color-control-soft, #f1efe8)" stroke="var(--color-line-strong, #b8bcb5)" stroke-width="1.4"/>
  <text x="790" y="214" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="14" font-weight="700" fill="var(--color-ink, #17211f)" text-anchor="middle">停下，等新请求</text>
  <text x="790" y="233" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="13" font-weight="400" fill="var(--color-ink-muted, #66716d)" text-anchor="middle">跨组 EP 时按需跑空批次</text>
  <rect x="240" y="280" width="420" height="50" rx="8" fill="var(--color-control-soft, #f1efe8)" stroke="var(--color-control, #66716d)" stroke-width="1.4"/>
  <text x="450" y="301" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="14" font-weight="700" fill="var(--color-ink, #17211f)" text-anchor="middle">② Scheduler 排出这一步的计划</text>
  <text x="450" y="320" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="13" font-weight="400" fill="var(--color-ink-muted, #66716d)" text-anchor="middle">哪些请求、各算几个 token、新借哪些块号</text>
  <rect x="240" y="364" width="420" height="56" rx="8" fill="var(--color-weight-soft, #fff4cf)" stroke="var(--color-weight, #c78300)" stroke-width="1.4"/>
  <text x="450" y="388" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="14" font-weight="700" fill="var(--color-ink, #17211f)" text-anchor="middle">Executor 发出第一次调用：前向</text>
  <text x="450" y="407" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="13" font-weight="400" fill="#936300" text-anchor="middle">每个 Worker：③ 准备输入 → ④ 逐层前向；logits 暂留设备</text>
  <rect x="240" y="454" width="420" height="56" rx="8" fill="var(--color-weight-soft, #fff4cf)" stroke="var(--color-weight, #c78300)" stroke-width="1.4"/>
  <text x="450" y="478" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="14" font-weight="700" fill="var(--color-ink, #17211f)" text-anchor="middle">Executor 发出第二次调用：采样</text>
  <text x="450" y="497" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="13" font-weight="400" fill="#936300" text-anchor="middle">⑤ 采样新 token（开投机时含草稿）；仅 output_rank 回传</text>
  <rect x="240" y="544" width="420" height="50" rx="8" fill="var(--color-control-soft, #f1efe8)" stroke="var(--color-control, #66716d)" stroke-width="1.4"/>
  <text x="450" y="565" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="14" font-weight="700" fill="var(--color-ink, #17211f)" text-anchor="middle">⑥ Scheduler 按结果更新进度</text>
  <text x="450" y="584" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="13" font-weight="400" fill="var(--color-ink-muted, #66716d)" text-anchor="middle">追加新 token、判断停止条件</text>
  <rect x="700" y="544" width="180" height="50" rx="8" fill="var(--color-token-soft, #ddf4ef)" stroke="var(--color-token, #087f73)" stroke-width="1.4"/>
  <text x="790" y="574" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="14" font-weight="700" fill="var(--color-ink, #17211f)" text-anchor="middle">⑦ 前端：反分词、流式返回</text>
  <rect x="240" y="628" width="420" height="50" rx="8" fill="var(--color-kv-soft, #e8edff)" stroke="var(--color-kv, #4c65b6)" stroke-width="1.4"/>
  <text x="450" y="649" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="14" font-weight="700" fill="var(--color-ink, #17211f)" text-anchor="middle">结束的请求：块号还回池子</text>
  <text x="450" y="668" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="13" font-weight="400" fill="#3a4f93" text-anchor="middle">请求编号随下一份计划通知 Worker 清理状态</text>
  <text x="450" y="18" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="13.5" font-weight="700" fill="var(--color-ink, #17211f)" text-anchor="middle">EngineCore 主循环 · 每转一圈（API Server ↔ EngineCore ↔ Worker）</text>
  <text x="462" y="264" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="13.5" font-weight="400" fill="var(--color-ink, #17211f)">是</text>
  <text x="668" y="210" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="13.5" font-weight="400" fill="var(--color-ink, #17211f)">否</text>
  <text x="24" y="440" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="13.5" font-weight="400" fill="var(--color-ink, #17211f)">下一圈</text>
</svg>
