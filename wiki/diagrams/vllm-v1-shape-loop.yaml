layout: figure
id: vllm-v1-shape-loop
caption: 标准 vLLM V1 请求主循环（未开 PP / PCP、无 KV connector），展示 API Server、EngineCore 与 Worker 每转一圈的协作，圈里的编号是主线七站。无请求时循环停在输入队列上等待（仅在 MoE 开启跨 DP 组 EP 且本组空闲、他组在跑时，才触发空批次陪跑）；有请求时由 Scheduler 排定本步计划，经 Executor 驱动 Worker 先做前向、再做采样（开启投机时含草稿步），更新进度后把新 token 流式送回前端。
size: [900, 700]
items:
  - { at: [240, 36], size: [420, 50], text: ① 前端 API Server：分词，包成请求消息, sub: 经 ZMQ 进程间消息送进 EngineCore 输入队列, tone: token }
  - { at: [240, 116], size: [420, 50], text: EngineCore 收下请求，放进等待队列, style: plain }
  - { at: [240, 196], size: [420, 44], text: 有请求要算吗？, style: plain }
  - { at: [700, 190], size: [180, 56], text: 停下，等新请求, sub: 跨组 EP 时按需跑空批次, style: plain }
  - { at: [240, 280], size: [420, 50], text: ② Scheduler 排出这一步的计划, sub: 哪些请求、各算几个 token、新借哪些块号, tone: control }
  - { at: [240, 364], size: [420, 56], text: Executor 发出第一次调用：前向, sub: 每个 Worker：③ 准备输入 → ④ 逐层前向；logits 暂留设备, tone: weight }
  - { at: [240, 454], size: [420, 56], text: Executor 发出第二次调用：采样, sub: ⑤ 采样新 token（开投机时含草稿）；仅 output_rank 回传, tone: weight }
  - { at: [240, 544], size: [420, 50], text: ⑥ Scheduler 按结果更新进度, sub: 追加新 token、判断停止条件, tone: control }
  - { at: [700, 544], size: [180, 50], text: ⑦ 前端：反分词、流式返回, tone: token }
  - { at: [240, 628], size: [420, 50], text: 结束的请求：块号还回池子, sub: 请求编号随下一份计划通知 Worker 清理状态, tone: kv }
