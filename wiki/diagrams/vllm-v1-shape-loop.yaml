layout: figure
id: vllm-v1-shape-loop
caption: 图示本部署正常生成路径（未开流水线并行 PP 或 prefill 上下文并行 PCP，无 KV connector），展示 EngineCore 的主循环每转一圈做的事，圈里的编号是主线七站。没有请求要算时循环停在输入队列上等；DP 部署里本组没有请求、另一组还在跑时，改让本组的 Worker 跑一个空批次陪着通信。有请求时排一份计划，经 Executor 让每个 Worker 先做前向、再做采样，拿回结果更新进度，新 token 编号送回前端。
size: [900, 700]
items:
  - { at: [240, 36], size: [420, 50], text: ① 前端：分词，包成请求消息, sub: 经进程间消息送进所选 DP 组的 EngineCore, tone: token }
  - { at: [240, 116], size: [420, 50], text: EngineCore 收下请求，放进等待队列, style: plain }
  - { at: [240, 196], size: [420, 44], text: 有请求要算吗？, style: plain }
  - { at: [700, 190], size: [180, 56], text: 停下，等新请求, sub: 另一组在跑时改跑空批次, style: plain }
  - { at: [240, 280], size: [420, 50], text: ② Scheduler 排出这一步的计划, sub: 哪些请求、各算几个 token、新借哪些块号, tone: control }
  - { at: [240, 364], size: [420, 56], text: Executor 发出第一次调用：前向, sub: 每个 Worker：③ 准备输入 → ④ 逐层前向；logits 先留在 Worker, tone: weight }
  - { at: [240, 454], size: [420, 56], text: Executor 发出第二次调用：采样, sub: 每个 Worker：⑤ 采样与草拟；只有 0 号 Worker 回话, tone: weight }
  - { at: [240, 544], size: [420, 50], text: ⑥ Scheduler 按结果更新进度, sub: 追加新 token、判断停止, tone: control }
  - { at: [700, 544], size: [180, 50], text: ⑦ 前端：反分词、流式返回, tone: token }
  - { at: [240, 628], size: [420, 50], text: 结束的请求：块号还回池子, sub: 请求编号随下一份计划通知 Worker 清掉缓存, tone: kv }
