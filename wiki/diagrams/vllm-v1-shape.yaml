  - { at: [592, 122], size: [258, 58], title: 收回 token 再变成字, sub: 一个一个往外吐, fn: OutputProcessor, icon: queue, tone: neutral }
  - { at: [60, 296], size: [258, 58], title: 排进队列, sub: waiting 与 running 两条队, fn: EngineCore.add_request, icon: queue, tone: upstream }
