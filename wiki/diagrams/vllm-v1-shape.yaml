layout: figure
id: vllm-v1-shape
caption: vLLM V1 的三类角色和它们之间的循环。请求从前端进来，EngineCore 里的 Scheduler 每一步排一份计划，Executor 把同一份计划交给每个 Worker；Worker 把计划变成张量、算完前向再采样，结果交回 EngineCore 更新进度，新 token 编号再回到前端变成文字。更新完进度就排下一步，直到请求结束。
size: [900, 530]
frames:
  - { at: [20, 100], size: [250, 420], label: 前端 · 管文字 }
  - { at: [300, 100], size: [300, 420], label: EngineCore · 管进度 }
  - { at: [630, 100], size: [250, 420], label: Worker · 管张量（每卡一个） }
items:
  - { at: [45, 10], size: [200, 38], text: 用户 / 客户端, style: plain }
  - { at: [45, 134], size: [200, 60], text: 接请求、分词, sub: 文字 → token 编号, tone: token }
  - { at: [45, 404], size: [200, 60], text: 反分词、流式返回, sub: token 编号 → 文字, tone: token }
  - { at: [320, 134], size: [260, 60], text: Scheduler 排这一步, sub: 谁算、各算几个、用哪些块号, tone: control }
  - { at: [380, 270], size: [200, 56], text: Executor, sub: 同一份计划发给每个 Worker, style: plain }
  - { at: [320, 404], size: [260, 60], text: 按结果更新进度, sub: 追加新 token、判断是否结束, tone: control }
  - { at: [650, 134], size: [210, 60], text: 把计划变成张量, sub: token、位置、写进缓存哪一格, style: plain }
  - { at: [650, 270], size: [210, 56], text: 模型前向, sub: 权重和 KV cache 都在卡上, tone: weight }
  - { at: [650, 404], size: [210, 60], text: 采样, sub: 每个请求得到新 token, tone: weight }
