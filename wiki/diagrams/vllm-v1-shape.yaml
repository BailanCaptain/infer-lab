  - { at: [592, 296], size: [258, 58], title: 分 KV block, sub: 第 92 步才要第二块, fn: KVCacheManager, icon: grid, tone: upstream }
  - { at: [60, 470], size: [258, 58], title: 把请求摊成张量, sub: block_table 与 slot_mapping, fn: _prepare_inputs, icon: calc, tone: ascend }
