layout: scene
id: vllm-v1-shape
caption: 那条请求要穿过两道进程边界，下去一次、上来一次（vLLM v0.23.0）
size: [900, 578]

regions:
  - label: 前端进程
    note: 收 HTTP · 分词 · 反分词。这里只有文字和 token id，没有一个张量。
    at: [20, 44]
    size: [860, 150]
    tone: neutral
  - label: EngineCore 进程
    note: 排队 · 调度 · 分 KV block。这里只有整数，没有一个 NPU 算子。
    at: [20, 218]
    size: [860, 150]
    tone: upstream
  - label: Worker 进程
    note: 建张量 · 跑 28 层 · 采样。到这里才第一次碰硬件。
    at: [20, 392]
    size: [860, 150]
    tone: ascend

boundaries:
  - { at: 206, from: 20, to: 880, vertical: false, label: "进程边界 ① · ZMQ：下去的是 EngineCoreRequest，上来的是 EngineCoreOutputs" }
  - { at: 380, from: 20, to: 880, vertical: false, label: "进程边界 ② · 下去的是 SchedulerOutput，上来的是 ModelRunnerOutput" }

boxes:
  - { at: [60, 122], size: [258, 58], title: 把问题切成 token, sub: 得到 37 个 token id, fn: InputProcessor, icon: text, tone: neutral }
