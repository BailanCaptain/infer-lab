<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 560" width="900" height="560" font-family="var(--font-sans)" role="img" aria-label="NPUWorker 依赖链与耗时">
<title>NPUWorker 冷启动六步依赖链与耗时去向</title>
<desc>左栏展示六步前置产物依赖；右栏对应五大耗时。</desc>
<defs>
<marker id="dc-i" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 1.5L8.5 5L0 8.5z" fill="#66716d"/></marker>
<marker id="dc-h" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 1.5L8.5 5L0 8.5z" fill="#c78300"/></marker>
</defs>
<line x1="466" y1="14" x2="466" y2="544" stroke="#b8bcb5" stroke-width="1.4" stroke-dasharray="6 4"/>
