<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 584" width="900" height="584" role="img" aria-label="NPUWorker 六步刚性产物依赖链与三条冷启动耗时比例甘特对照" font-family="var(--font-sans)">
  <title>NPUWorker 六步刚性依赖链与冷启动耗时重叠比例甘特图</title>
  <desc>Left shows the 6-step hard artifact dependency chain; right shows proportional Gantt timelines comparing serial cold start, early warmup overlap, and RFork hot start plus tuning levers.</desc>
  <defs>
    <marker id="dc-arr-g" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 1.5L8.5 5L0 8.5z" fill="#66716d"/></marker>
  </defs>

  <line x1="428" y1="12" x2="428" y2="572" stroke="#b8bcb5" stroke-width="1.4" stroke-dasharray="6 4"/>

  <!-- Left Title -->
  <text x="16" y="28" font-size="16" font-weight="700" fill="#17211f">左：六步刚性产物链（缺前一项即报错）</text>

  <!-- 6 Dependency Cards (x=16..412, w=396) -->
  <rect x="16" y="48" width="396" height="70" rx="8" fill="#ece9df" stroke="#66716d" stroke-width="1.4"/>
  <circle cx="38" cy="72" r="12" fill="#66716d"/>
  <text x="38" y="77" text-anchor="middle" font-size="13.5" font-weight="700" fill="#ffffff">1</text>
  <text x="58" y="77" font-size="14.5" font-weight="700" fill="#17211f">__init__：换补丁、注算子、验卡型</text>
  <text x="58" y="104" font-size="13.5" fill="#4d5652">交付：worker 补丁 + CustomOp + AscendConfig</text>

  <line x1="214" y1="118" x2="214" y2="134" stroke="#66716d" stroke-width="1.7" marker-end="url(#dc-arr-g)"/>

  <rect x="16" y="138" width="396" height="70" rx="8" fill="#f7e7f2" stroke="#9a4b86" stroke-width="1.4"/>
  <circle cx="38" cy="162" r="12" fill="#9a4b86"/>
  <text x="38" y="167" text-anchor="middle" font-size="13.5" font-weight="700" fill="#ffffff">2</text>
  <text x="58" y="167" font-size="14.5" font-weight="700" fill="#7a3a6a">init_device：绑卡、快照、HCCL 建组</text>
  <text x="58" y="194" font-size="13.5" fill="#4d5652">交付：self.device + 启动快照 + NPUModelRunner</text>

  <line x1="214" y1="208" x2="214" y2="224" stroke="#66716d" stroke-width="1.7" marker-end="url(#dc-arr-g)"/>

  <rect x="16" y="228" width="396" height="70" rx="8" fill="#fff4cf" stroke="#c78300" stroke-width="1.4"/>
  <circle cx="38" cy="252" r="12" fill="#c78300"/>
  <text x="38" y="257" text-anchor="middle" font-size="13.5" font-weight="700" fill="#ffffff">3</text>
  <text x="58" y="257" font-size="14.5" font-weight="700" fill="#936300">load_model：分片读盘与 ND→NZ 后处理</text>
  <text x="58" y="284" font-size="13.5" fill="#4d5652">交付：驻留分形权重 + 实测 model_memory_usage</text>

  <line x1="214" y1="298" x2="214" y2="314" stroke="#66716d" stroke-width="1.7" marker-end="url(#dc-arr-g)"/>

  <rect x="16" y="318" width="396" height="70" rx="8" fill="#e8edff" stroke="#4c65b6" stroke-width="1.4"/>
  <circle cx="38" cy="342" r="12" fill="#4c65b6"/>
  <text x="38" y="347" text-anchor="middle" font-size="13.5" font-weight="700" fill="#ffffff">4</text>
  <text x="58" y="347" font-size="14.5" font-weight="700" fill="#3a4f93">determine_available_memory：试跑对齐</text>
  <text x="58" y="374" font-size="13.5" fill="#4d5652">交付：扣峰值后 EngineCore 取全局 min_num_blocks</text>

  <line x1="214" y1="388" x2="214" y2="404" stroke="#66716d" stroke-width="1.7" marker-end="url(#dc-arr-g)"/>

  <rect x="16" y="408" width="396" height="70" rx="8" fill="#ffffff" stroke="#4c65b6" stroke-width="1.4"/>
  <circle cx="38" cy="432" r="12" fill="#4c65b6"/>
  <text x="38" y="437" text-anchor="middle" font-size="13.5" font-weight="700" fill="#ffffff">5</text>
  <text x="58" y="437" font-size="14.5" font-weight="700" fill="#3a4f93">initialize_from_config：切物理 KV 池</text>
  <text x="58" y="464" font-size="13.5" fill="#4d5652">交付：整池 KV 张量（清零元数据置睡眠池外）</text>

  <line x1="214" y1="478" x2="214" y2="494" stroke="#66716d" stroke-width="1.7" marker-end="url(#dc-arr-g)"/>

  <rect x="16" y="498" width="396" height="70" rx="8" fill="#ddf4ef" stroke="#087f73" stroke-width="1.4"/>
  <circle cx="38" cy="522" r="12" fill="#087f73"/>
  <text x="38" y="527" text-anchor="middle" font-size="13.5" font-weight="700" fill="#ffffff">6</text>
  <text x="58" y="527" font-size="14.5" font-weight="700" fill="#065f56">compile_or_warm_up_model：预热与录图</text>
  <text x="58" y="554" font-size="13.5" fill="#4d5652">交付：7 类预热 + 1−u 余量录图 + ATB 收尾 + 绑核</text>

  <!-- Right Title -->
  <text x="446" y="28" font-size="16" font-weight="700" fill="#17211f">右：冷启动墙钟时间轴对比（示意比例）</text>

  <!-- Gantt Track A: Default Serial -->
  <text x="446" y="62" font-size="14" font-weight="700" fill="#17211f">A. 默认串行冷启动（全量前置重活）</text>
  <rect x="446" y="72" width="24" height="34" rx="4" fill="#ece9df" stroke="#66716d" stroke-width="1.2"/>
  <text x="458" y="94" text-anchor="middle" font-size="13.5" fill="#4d5652">①</text>
  <rect x="472" y="72" width="124" height="34" rx="4" fill="#fff4cf" stroke="#c78300" stroke-width="1.3"/>
  <text x="534" y="94" text-anchor="middle" font-size="13.5" font-weight="700" fill="#936300">③a 读盘分片</text>
  <rect x="598" y="72" width="68" height="34" rx="4" fill="#fff0e9" stroke="#b54237" stroke-width="1.3"/>
  <text x="632" y="94" text-anchor="middle" font-size="13.5" font-weight="700" fill="#8f3229">③b NZ</text>
  <rect x="668" y="72" width="64" height="34" rx="4" fill="#e8edff" stroke="#4c65b6" stroke-width="1.3"/>
  <text x="700" y="94" text-anchor="middle" font-size="13.5" font-weight="700" fill="#3a4f93">④试跑</text>
  <rect x="734" y="72" width="56" height="34" rx="4" fill="#f7e7f2" stroke="#9a4b86" stroke-width="1.3"/>
  <text x="762" y="94" text-anchor="middle" font-size="13.5" font-weight="700" fill="#7a3a6a">⑥预热</text>
  <rect x="792" y="72" width="92" height="34" rx="4" fill="#ddf4ef" stroke="#087f73" stroke-width="1.3"/>
  <text x="838" y="94" text-anchor="middle" font-size="13.5" font-weight="700" fill="#065f56">⑥b 录图</text>

  <!-- Gantt Track B: Early Warmup Overlap -->
  <text x="446" y="138" font-size="14" font-weight="700" fill="#065f56">B. 开 early_nz + early_kernel（读盘期并行重叠）</text>
  <rect x="446" y="148" width="24" height="32" rx="4" fill="#ece9df" stroke="#66716d" stroke-width="1.2"/>
  <rect x="472" y="148" width="124" height="32" rx="4" fill="#fff4cf" stroke="#c78300" stroke-width="1.3"/>
  <text x="534" y="169" text-anchor="middle" font-size="13.5" font-weight="700" fill="#936300">③a 读盘（主线）</text>
  <rect x="598" y="148" width="64" height="32" rx="4" fill="#e8edff" stroke="#4c65b6" stroke-width="1.3"/>
  <text x="630" y="169" text-anchor="middle" font-size="13.5" font-weight="700" fill="#3a4f93">④试跑</text>
  <rect x="664" y="148" width="28" height="32" rx="4" fill="#f7e7f2" stroke="#9a4b86" stroke-width="1.2"/>
  <rect x="694" y="148" width="84" height="32" rx="4" fill="#ddf4ef" stroke="#087f73" stroke-width="1.3"/>
  <text x="736" y="169" text-anchor="middle" font-size="13.5" font-weight="700" fill="#065f56">⑥b 录图</text>
  <!-- Parallel sub-bar underneath disk load -->
  <rect x="478" y="184" width="118" height="28" rx="4" fill="#ddf4ef" stroke="#087f73" stroke-width="1.2" stroke-dasharray="4 3"/>
  <text x="537" y="203" text-anchor="middle" font-size="13.5" fill="#065f56">后台：NZ + Triton</text>
  <!-- Saved window callout -->
  <rect x="782" y="148" width="102" height="32" rx="4" fill="#f8f6f0" stroke="#087f73" stroke-width="1.2" stroke-dasharray="4 3"/>
  <text x="833" y="169" text-anchor="middle" font-size="13.5" font-weight="700" fill="#065f56">省下串行等待</text>

  <!-- Gantt Track C: RFork + Fewer Capture Sizes -->
  <text x="446" y="242" font-size="14" font-weight="700" fill="#3a4f93">C. RFork 借用显存权重 + 收敛 capture_sizes</text>
  <rect x="446" y="252" width="24" height="32" rx="4" fill="#ece9df" stroke="#66716d" stroke-width="1.2"/>
  <rect x="472" y="252" width="38" height="32" rx="4" fill="#fff4cf" stroke="#c78300" stroke-width="1.3"/>
  <text x="491" y="273" text-anchor="middle" font-size="13.5" font-weight="700" fill="#936300">借</text>
  <rect x="512" y="252" width="60" height="32" rx="4" fill="#e8edff" stroke="#4c65b6" stroke-width="1.3"/>
  <text x="542" y="273" text-anchor="middle" font-size="13.5" font-weight="700" fill="#3a4f93">④试跑</text>
  <rect x="574" y="252" width="52" height="32" rx="4" fill="#ddf4ef" stroke="#087f73" stroke-width="1.3"/>
  <text x="600" y="273" text-anchor="middle" font-size="13.5" font-weight="700" fill="#065f56">精简图</text>
  <rect x="630" y="252" width="254" height="32" rx="4" fill="#f8f6f0" stroke="#4c65b6" stroke-width="1.2" stroke-dasharray="4 3"/>
  <text x="757" y="273" text-anchor="middle" font-size="13.5" font-weight="700" fill="#3a4f93">省去整包权重读盘与多余图档</text>

  <!-- Bottom Right: 4 Compact Knob Cards -->
  <line x1="446" y1="306" x2="884" y2="306" stroke="#b8bcb5" stroke-width="1.3" stroke-dasharray="5 4"/>
  <text x="446" y="332" font-size="15" font-weight="700" fill="#17211f">冷启动调优旋钮与不跳过底线</text>

  <rect x="446" y="346" width="212" height="104" rx="7" fill="#fff4cf" stroke="#c78300" stroke-width="1.3"/>
  <text x="458" y="370" font-size="14" font-weight="700" fill="#936300">③ 读盘与 NZ 转换</text>
  <text x="458" y="396" font-size="13.5" fill="#4d5652">prefetch 预读页缓存</text>
  <text x="458" y="418" font-size="13.5" fill="#4d5652">首次 NZ 约 15–19 s</text>
  <text x="458" y="440" font-size="13.5" fill="#936300" font-weight="600">weight_nz_mode 控范围</text>

  <rect x="672" y="346" width="212" height="104" rx="7" fill="#e8edff" stroke="#4c65b6" stroke-width="1.3"/>
  <text x="684" y="370" font-size="14" font-weight="700" fill="#3a4f93">④ 试跑不可省略</text>
  <text x="684" y="396" font-size="13.5" fill="#4d5652">兼做首次图外编译</text>
  <text x="684" y="418" font-size="13.5" fill="#4d5652">手传 kv-cache-memory</text>
  <text x="684" y="440" font-size="13.5" fill="#3a4f93" font-weight="600">仍照跑 profile_run()</text>

  <rect x="446" y="464" width="212" height="104" rx="7" fill="#f7e7f2" stroke="#9a4b86" stroke-width="1.3"/>
  <text x="458" y="488" font-size="14" font-weight="700" fill="#7a3a6a">⑥a 7 类预热门禁</text>
  <text x="458" y="514" font-size="13.5" fill="#4d5652">4 项 Triton 须 HAS_TRITON</text>
  <text x="458" y="536" font-size="13.5" fill="#4d5652">ATB 仅 A2/A3 录图后跑</text>
  <text x="458" y="558" font-size="13.5" fill="#7a3a6a" font-weight="600">310P / 950 按档跳过</text>

  <rect x="672" y="464" width="212" height="104" rx="7" fill="#ddf4ef" stroke="#087f73" stroke-width="1.3"/>
  <text x="684" y="488" font-size="14" font-weight="700" fill="#065f56">⑥b ACLGraph 捕获</text>
  <text x="684" y="514" font-size="13.5" fill="#4d5652">吃 1−u 余量，不在④扣</text>
  <text x="684" y="536" font-size="13.5" fill="#4d5652">缩减 capture_sizes 提速</text>
  <text x="684" y="558" font-size="13.5" fill="#065f56" font-weight="600">排障临时 --enforce-eager</text>
</svg>
