<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 640" width="900" height="640" role="img" aria-label="六步分两段调用。执行器建 Worker 进程时，依次构造 Worker、选卡建组、装权重；EngineCore 初始化 KV cache 时，先向各 Worker 要状态规格和可用显存，自己取最小块数，再让每个 Worker 建缓存池、预热并录图。三处分支：sleep mode 开着时，权重和 KV 各进一个专用内存池；主模型关掉录图时，预热完直接收尾。">
  <title>六步分两段调用。执行器建 Worker 进程时，依次构造 Worker、选卡建组、装权重；EngineCore 初始化 KV cache 时，先向各 Worker 要状态规格和可用显存，自己取最小块数，再让每个 Worker 建缓存池、预热并录图。三处分支：sleep mode 开着时，权重和 KV 各进一个专用内存池；主模型关掉录图时，预热完直接收尾。</title>
  <defs><marker id="worker-lifecycle-flow-ah-control" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="var(--color-control, #66716d)"/></marker><marker id="worker-lifecycle-flow-ah-comm" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="var(--color-comm, #9a4b86)"/></marker><marker id="worker-lifecycle-flow-ah-weight" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="var(--color-weight, #c78300)"/></marker><marker id="worker-lifecycle-flow-ah-kv" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="var(--color-kv, #4c65b6)"/></marker></defs>
