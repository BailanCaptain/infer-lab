layout: figure
id: worker-lifecycle-flow
caption: 六步分两段调用。执行器建 Worker 进程时，依次构造 Worker、选卡建组、装权重；EngineCore 初始化 KV cache 时，先向各 Worker 要状态规格和可用显存，自己取最小块数，再让每个 Worker 建缓存池、预热并录图。三处分支：sleep mode 开着时，权重和 KV 各进一个专用内存池；主模型关掉录图时，预热完直接收尾。
size: [900, 640]
items:
  - { at: [24, 60], size: [270, 52], text: 构造 Worker, sub: 补丁 → 算子 → 昇腾配置 → 基类, tone: control }
  - { at: [24, 140], size: [270, 52], text: 选卡、建组, sub: 快照 → HCCL 建组 → 建 ModelRunner, tone: comm }
  - { at: [24, 220], size: [270, 52], text: 装权重, sub: 选加载器，截出本卡分片, tone: weight }
  - { at: [24, 300], size: [270, 52], text: sleep mode 开着时, sub: 权重进专用内存池, tone: weight, style: faded }
  - { at: [330, 60], size: [280, 52], text: 报状态规格, sub: 每层要存什么、每页多大, tone: kv, style: faded }
  - { at: [330, 140], size: [280, 52], text: 量可用显存, sub: 都试跑；显式值跳过预算扣减, tone: kv }
  - { at: [330, 220], size: [280, 52], text: EngineCore 定块数, sub: 各卡折成块数，取最小, tone: kv, style: faded }
  - { at: [330, 300], size: [280, 52], text: 建缓存池, sub: KV 传输准备 → 分配 KV 张量, tone: kv }
  - { at: [330, 380], size: [280, 52], text: 按尺寸预热, sub: 每个预热尺寸跑一次假前向, tone: control }
  - { at: [330, 460], size: [280, 52], text: 主模型关掉了录图？, sub: 看执行方式开关, tone: control, style: plain }
  - { at: [330, 560], size: [280, 52], text: 收尾, sub: 建议值日志 → ATB 预热 → 绑核 → 重置种子, tone: control }
  - { at: [650, 300], size: [226, 52], text: sleep mode 开着时, sub: KV 进专用内存池, tone: kv, style: faded }
  - { at: [650, 460], size: [226, 52], text: 录 decode 图, sub: 按捕获尺寸逐个录, tone: control }
