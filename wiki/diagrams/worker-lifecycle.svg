<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 300" width="900" height="300" role="img" aria-label="Worker 从被建出来到能接请求的六步；走到第四步，KV Cache 的预算才第一次存在">
  <title>Worker 从被建出来到能接请求的六步；走到第四步，KV Cache 的预算才第一次存在</title>
