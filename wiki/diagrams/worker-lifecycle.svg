  <circle cx="168" cy="110" r="11" fill="var(--color-ink, #17211f)"/><text x="168" y="115" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="13" font-weight="700" fill="var(--color-ink-inverse, #ffffff)" text-anchor="middle">2</text>
  <circle cx="316" cy="110" r="11" fill="var(--color-ink, #17211f)"/><text x="316" y="115" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="13" font-weight="700" fill="var(--color-ink-inverse, #ffffff)" text-anchor="middle">3</text>
