  <path d="M740 141 L760 141" fill="none" stroke="var(--color-ink, #17211f)" stroke-width="1.4" marker-end="url(#worker-lifecycle-ah-ink)"/>
  <rect x="20" y="110" width="128" height="62" rx="8" fill="var(--color-control, #66716d)" stroke="var(--color-ink, #17211f)" stroke-width="1.5"/>
  <text x="84" y="137" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="14" font-weight="700" fill="var(--color-ink-inverse, #ffffff)" text-anchor="middle">换补丁</text>
  <text x="84" y="156" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="13" font-weight="400" fill="var(--color-ink-inverse, #ffffff)" text-anchor="middle">改好上游行为</text>
  <rect x="168" y="110" width="128" height="62" rx="8" fill="var(--color-control, #66716d)" stroke="var(--color-ink, #17211f)" stroke-width="1.5"/>
