  <circle cx="612" cy="110" r="11" fill="var(--color-ink, #17211f)"/><text x="612" y="115" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="13" font-weight="700" fill="var(--color-ink-inverse, #ffffff)" text-anchor="middle">5</text>
  <circle cx="760" cy="110" r="11" fill="var(--color-ink, #17211f)"/><text x="760" y="115" font-family="'Inter Variable','Noto Sans SC',system-ui,sans-serif" font-size="13" font-weight="700" fill="var(--color-ink-inverse, #ffffff)" text-anchor="middle">6</text>
