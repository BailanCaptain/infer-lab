layout: figure
id: worker-lifecycle
caption: 每张卡一个 Worker，各自按同一顺序准备：换补丁、选卡并建通信组、装本卡那份权重、试跑量出预算。各卡把预算报给 EngineCore，它按最紧的那张卡定块数，把各卡对应的缓存配置发回；每张卡再建缓存池，最后预热并录 decode 图，之后才接请求。
size: [900, 630]
