id: worker-lifecycle
caption: >-
  NPUWorker 六步冷启动双驱动时序与跨卡栅栏：WorkerProc 本地顺次驱动 ① 构造换补丁验卡型、② 绑卡拍快照与 HCCL 建组（栅栏 1）、③ 分片读盘与 ND→NZ 后处理（可选后台线程重叠首次 NZ 与 Triton 预热并在返回前 join）；EngineCore 广播驱动 ④ 多卡预算汇总取全局 min_num_blocks 并收缩富余卡（栅栏 2）、⑤ 切出物理 KV 池（清零元数据置睡眠池外）、⑥ 7 类预热后用 1−u 余量捕获 ACLGraph 并以 ATB 预热收尾；底部标注 NPUWorker310 五处硬件定制差异。
