layout: scene
id: worker-lifecycle
caption: NPUWorker 从建对象到能接请求的六步；第四步之前显存预算还不存在
size: [900, 502]

regions:
  - label: 一张卡上的启动过程
    note: 顺序是固定的。每一步的产物都是下一步的前提，所以它们不能换位置。
    at: [20, 40]
    size: [860, 358]
    tone: ascend

spines:
  - { y: 250, from: 44, to: 858, tone: ascend }

stops:
  - { x: 112, side: above, title: 打 patch, detail: 换上游行为、注册算子, fn: __init__, icon: patch, tone: ascend }
  - { x: 246, side: below, title: 选卡、造 runner, detail: runner 要 self.device, fn: init_device, icon: chip, tone: ascend }
  - { x: 380, side: above, title: 装权重, detail: sleep mode 决定进哪个池, fn: load_model, icon: box, tone: ascend }
  - { x: 520, side: below, title: 算出显存预算, detail: 必须真跑一遍假批, fn: determine_available_memory, icon: calc, tone: accent }
  - { x: 664, side: above, title: 真正分配 KV 张量, detail: 这一刻起才有 block, fn: initialize_from_config, icon: grid, tone: ascend }
  - { x: 796, side: below, title: 捕获图, detail: enforce_eager 跳过捕图, fn: compile_or_warm_up_model, icon: graph, tone: ascend }

notes:
  - { at: [20, 424], text: "第四步是整条链的枢纽：KV Cache 有多大 = 拿到的显存 − 假批跑完之后非 KV 占用。预算是减出来的，不是配出来的——配了 kv_cache_memory_bytes 也仍然要跑假批，注释说那是为了编译模型。", size: 12.5, width: 860 }
  - { at: [20, 466], text: "排查启动期报错时倒着用：挂在第一步 → patch 或算子注册；第二步 → 设备可见性；第四步且提示可用显存反而变大 → 那条断言被触发；第六步 → 先开 enforce_eager 把图那段跳过来确认范围。", size: 12.5, width: 860 }

pins:
  - source: vllm-ascend@2c59ff10:vllm_ascend/worker/worker.py#L105-L110
    symbols: [adapt_patch]
  - source: vllm-ascend@2c59ff10:vllm_ascend/worker/worker.py#L89-L92
    symbols: [NPUWorker]
